<style>
:root{
  --bg:#F5F1E6;--card:#FFFEFA;--line:#DDD6C0;
  --ink:#25302C;--sub:#5F6B63;--pri:#2F5D50;
  --key:#8A5517;--red:#A8402B;--gold:#B8782E;--green:#35693F;
  --opt:#fff;--okbg:#E0EFE0;--badbg:#F8E4DD;--tipbg:#FBF1D9;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b17;--card:#272420;--line:#3d3830;
    --ink:#ece6d8;--sub:#a79f8c;--pri:#2F5D50;
    --key:#B8782E;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;
    --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b17;--card:#272420;--line:#3d3830;
  --ink:#ece6d8;--sub:#a79f8c;--pri:#2F5D50;
  --key:#B8782E;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;
  --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;font-size:15px;line-height:1.7;
  padding:24px 16px 80px;overflow-x:hidden;
}
h1,h2,h3{font-family:"Noto Serif TC",serif;}
.wrap{max-width:720px;margin:0 auto;}
header{text-align:center;margin-bottom:16px;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--red);border:1px solid var(--red);
  border-radius:999px;padding:3px 12px;margin-bottom:10px;
}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:21px;letter-spacing:.04em;color:var(--pri);}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:4px;font-family:"Noto Sans TC",sans-serif;}
.version-tag{font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:.05em;font-family:"Noto Serif TC",serif;}

.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;
}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--sub);
  cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;
}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.statbar{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0 18px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;color:var(--sub);
}
.statbar b{color:var(--ink);font-size:16px;}
.statbar .ok{color:var(--green);}
.statbar .ng{color:var(--red);}

.controls-top{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.btn{
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:9px 16px;cursor:pointer;transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:var(--bg);}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{opacity:.85;}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:#fff;}

.qcard{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.qcard.answered.correct{border-left:5px solid var(--green);}
.qcard.answered.wrong{border-left:5px solid var(--red);}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qbadge{font-size:12px;font-weight:700;color:#fff;background:var(--pri);padding:3px 10px;border-radius:8px;font-family:"Noto Serif TC",serif;}
.qyear{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:"Noto Serif TC",serif;}
.qtext{font-size:15px;line-height:1.8;margin-bottom:12px;font-weight:500;color:var(--ink);}
.opt-list{display:flex;flex-direction:column;gap:7px;}
.opt{
  display:block;width:100%;text-align:left;
  border:1.5px solid var(--line);background:var(--opt);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;
  cursor:pointer;word-break:break-word;transition:border-color .15s,background .15s;
}
.opt b{color:var(--key);margin-right:4px;}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.opt.correct-answer{border-color:var(--green);background:var(--okbg);}
.opt.wrong-selected{border-color:var(--red);background:var(--badbg);}
.note-box{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.7;border-left:4px solid var(--gold);background:var(--tipbg);color:var(--sub);}
.note-box b{color:var(--gold);}
.explain-box{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);}
.explain-title{font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;color:var(--pri);margin-bottom:8px;letter-spacing:.05em;}
.explain-item{display:flex;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;line-height:1.7;background:var(--card);border:1.5px solid var(--line);margin-bottom:6px;color:var(--ink);}
.explain-item:last-child{margin-bottom:0;}
.explain-item.right{border-color:var(--green);background:var(--okbg);}
.explain-letter{font-family:"Noto Serif TC",serif;font-weight:900;flex-shrink:0;color:var(--red);}
.explain-item.right .explain-letter{color:var(--green);}
.error-tag-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.error-tag{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;
}
.error-tag.active-a{background:var(--red);border-color:var(--red);color:#fff;}
.error-tag.active-b{background:var(--gold);border-color:var(--gold);color:#fff;}
.error-tag.active-c{background:var(--pri);border-color:var(--pri);color:#fff;}
.error-tag.active-d{background:var(--green);border-color:var(--green);color:#fff;}

footer{margin-top:30px;text-align:center;font-size:11px;color:var(--sub);letter-spacing:.1em;line-height:2;}
footer .reset{text-decoration:underline;cursor:pointer;color:var(--sub);background:none;border:none;font-size:11px;letter-spacing:.1em;font-family:inherit;}

/* 主題切換按鈕 */
.theme-toggle{

  width:36px;height:36px;border-radius:50%;

  color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:all .2s ease;
}
.theme-toggle:hover{background:var(--ink);color:var(--bg);}


/* ===== 進度條面板 ===== */
.prog-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
.pbar{position:relative;display:flex;height:12px;background:var(--line);border-radius:6px;margin:6px 0 26px;}
.pbar .s{display:block;height:100%;}
.pbar .s:first-child{border-radius:6px 0 0 6px;}
.s.sure{background:var(--green);}
.s.gok{background:var(--gold);}
.s.ng{background:var(--red);}
.pbar .ln{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px);}
.pbar .ln::after{content:attr(data-v) "%";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.64rem;font-weight:700;color:var(--ink);margin-top:3px;white-space:nowrap;}
.pbar .ln.goal{background:var(--gold);}
.pbar .ln.goal::after{color:var(--key);}
.ptxt{color:var(--ink);font-size:.8rem;line-height:1.7;}
.ptxt b{font-weight:900;}
.pgoal{margin-top:2px;color:var(--sub);font-size:.78rem;}
.pleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:.7rem;color:var(--sub);}
.pleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
.pcat{margin-top:6px;font-size:.75rem;color:var(--ink);}
.ptools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.bxm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;align-items:center;justify-content:center;padding:16px;}
.bxm.on{display:flex;}
.bxb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;max-width:540px;}
.bxt{font-weight:700;font-size:.9rem;margin-bottom:8px;color:var(--ink);}
.bxb textarea{width:100%;font-family:inherit;font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);background:var(--opt);resize:vertical;}
.bxmsg{font-size:.78rem;color:var(--green);min-height:1.2em;margin-top:6px;}
.bxa{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.btn.rep{border-color:var(--gold);color:var(--gold);}
.btn.rep:hover{background:var(--gold);color:#fff;}
</style>

<script>
const ITEMS = [
{id:"Q113_01", cat:"A1", year:"113年#01",
 q:"下列何種估價原則，強調估價師應注重估價標的在價格日期之現況，以免受過去情況所影響，而應依價格日期評估時之相關因素加以評估？",
 opts:["預測原則","變動原則","收益分配原則","外部性原則"],
 explains:[
   "預測原則指估價應考量未來發展趨勢，與本題強調「依價格日期現況評估」不符。",
   "變動原則強調不動產價格隨時間、環境、供需等因素不斷變動，因此估價必須「依價格日期之現況」評估，不能沿用過去或推算未來，本選項正確。",
   "收益分配原則指各生產要素（土地、資本、勞動、管理）各得其應有報酬，與本題無關。",
   "外部性原則指不動產受外部環境（如道路、公園、鄰近設施）之正負面影響，與本題無關。"
 ], correct:1, note:"變動原則 = 估價必須依「價格日期」之現況，不能沿用過去或推算未來。"},

{id:"Q113_02", cat:"A3", year:"113年#02",
 q:"高壓電塔架設使周邊房屋價格較低，此種現象係依據哪項估價原則解釋？",
 opts:["適合原則","外部性原則","貢獻原則","競爭原則"],
 explains:[
   "適合原則指不動產之規格、用途應與其所在區域相適合，才能達到最高效益，與高壓電塔影響房價無關。",
   "外部性原則指不動產之外部環境（包含正面或負面影響）會影響其價格。高壓電塔屬外部負面因素（電磁波疑慮、景觀影響），造成周邊房價下跌，本選項正確。",
   "貢獻原則指各增減項目對整體價值之貢獻程度（如裝潢增加多少房價），與本題外部環境影響概念不同。",
   "競爭原則指同類不動產因競爭而使超額利潤趨於消失，與本題無關。"
 ], correct:1, note:"外部性原則 = 外部環境（正面或負面）影響不動產價格。高壓電塔→負外部性→房價下跌。"},

{id:"Q113_03", cat:"A1", year:"113年#03",
 q:"下列何者不屬於不動產估價之範疇？",
 opts:["已完成開發之濕地","地上權房屋","山上果園中的果樹","採摘下來的果實"],
 explains:[
   "濕地雖為自然地形，若已完成開發並具土地利用價值，仍屬不動產範疇，可估價。",
   "地上權房屋為建立在他人土地上之建物，屬不動產之一種，可估其地上權及建物價值。",
   "果樹屬農作改良物（竹木類），固著於土地上，屬土地改良物，屬不動產估價範疇。",
   "採摘下來的果實已脫離土地，屬動產，非不動產估價之範疇，本選項正確（即不屬於）。"
 ], correct:3, note:"陷阱：固著在土地上的農作改良物（果樹）是不動產；採摘下來的果實是動產，不估價。"},

{id:"Q113_04", cat:"A1", year:"113年#04",
 q:"某住宅申請綠建築標章，使得房屋售價較同類型未申請者高，此現象最符合下列哪項估價原則？",
 opts:["最高最有效使用原則","貢獻原則","供需原則","外部性原則"],
 explains:[
   "最高最有效使用原則指估計不動產在法律許可、財務可行、技術合理下的最高效益用途，與個別建物申請標章後增值的概念不同。",
   "貢獻原則指某項要素（如綠建築標章）對整體不動產價值之「貢獻程度」。綠建築標章使房價提高，該標章即為「貢獻因素」，本選項正確。",
   "供需原則指價格由供給與需求之均衡決定，雖綠建築需求增加會影響供需，但本題核心在說明某項因素使價格提高，更符合貢獻原則。",
   "外部性原則指外部環境（鄰近設施）之影響，而非建物本身申請標章的改善。"
 ], correct:1, note:"貢獻原則 = 某要素對整體價值的貢獻量。綠標章→使房價提高多少→貢獻原則。"},

{id:"Q113_05", cat:"F1", year:"113年#05",
 q:"有關租金估計之敘述，下列何者錯誤？",
 opts:["新訂租約之估計方法與續訂租約之估計方法不同","名目租金係指承租人實際支付之金額","續訂租約屬於限定租金","積算法係評估正常租金之方法之一"],
 explains:[
   "技術規則§132（新訂）與§133（續訂）確實有不同的估計方式，此敘述正確。",
   "技術規則並無「名目租金」之定義；依教材，名目租金指契約約定之租金，與承租人實際支付之金額未必相同（§130之實質租金須加計押金或保證金、權利金及其他相關運用收益）。本選項敘述有誤，即本題正解。",
   "續訂租約以現有租賃關係為前提，屬於限定條件下之租金估計，稱限定租金，此敘述正確。",
   "積算法（§132二：以勘估標的價格乘以租金收益率估計淨收益，再加計必要費用）確屬評估正常租金之方法，此敘述正確。"
 ], correct:1, note:"陷阱：名目租金≠實際支付金額。名目租金（教材用語）=契約約定的金額；§130實質租金＝每期支付之租金，加計押金或保證金、權利金及其他相關運用收益之總數。"},

{id:"Q113_06", cat:"A4", year:"113年#06",
 q:"有關估價方法之運用，下列何者錯誤？",
 opts:["原則上應兼採二種以上估價方法","各種方法試算結果差異顯著者，應重新檢討","投資不動產之清算價格估算，折現現金流量分析法可賦予較大之權重","各方法試算結果之權重，依資料可信度及各方法之適合性決定"],
 explains:[
   "技術規則明定估價原則上應兼採二種以上方法，此敘述正確。",
   "各方法試算結果差異顯著時，確應重新檢討估價資料及計算過程，此敘述正確。",
   "§15Ⅱ規定：以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，DCF之收益價格應賦予相對較大之權重；但證券化標的進行清算時，不在此限。本選項說清算價格估算可賦予DCF較大權重，與但書不符，屬錯誤敘述，即本題正解。",
   "各方法試算結果之綜合判斷，依資料可信度及方法適合性決定權重，此敘述正確。"
 ], correct:2, note:"§15Ⅱ：證券化受益證券（以契約約定租金為信託利益分配基礎）DCF權重較大，但標的進行清算時不在此限。考試陷阱：清算不適用較大權重。"},

{id:"Q113_07", cat:"B", year:"113年#07",
 q:"有關比較法之敘述，下列何者錯誤？",
 opts:["比較標的經各項調整後稱為比較價格","比較法係以比較標的之價格為基礎，經調整推算勘估標的之比較價格","價格日期調整係以比較標的交易日期調整至勘估標的價格日期","區域因素調整係以比較標的所在位置地價水準為基準，調整至勘估標的所在位置"],
 explains:[
   "§21明定：比較標的價格經情況調整、價格日期調整、區域因素調整及個別因素調整後為「試算價格」；§27採三件以上比較標的，考量資料可信度及價格形成因素相近程度，決定「比較價格」。本選項說「調整後稱比較價格」有誤（應為試算價格），即本題正解。",
   "比較法定義正確：以比較標的價格為基礎，經各項調整推算勘估標的之比較價格。",
   "價格日期調整定義正確：將比較標的之交易日期調整至勘估標的之價格日期。",
   "區域因素調整定義正確：以比較標的所在位置地價水準為基準調整至勘估標的所在位置。"
 ], correct:0, note:"陷阱：調整後是「試算價格」（非比較價格）；採三件以上比較標的，考量可信度與相近程度後決定「比較價格」（§27）。"},

{id:"Q113_08", cat:"B", year:"113年#08",
 q:"某估價師蒐集3筆比較標的，試算價格分別為每坪79萬元、77萬元及95萬元，下列何者正確？",
 opts:["三者試算價格差距達20%以上，三者皆排除","三者試算價格差距未達20%，三者皆不排除","標的一（79萬）與標的三（95萬）應排除","標的二（77萬）與標的三（95萬）應排除"],
 explains:[
   "§26：先就偏高或偏低者重新檢討，檢討後試算價格間差距仍達20%以上者應排除，非全部排除。",
   "差距＝(95-77)÷平均值86≈20.9%，達20%以上（§26Ⅱ），不可全部保留。",
   "79萬為三者中間值，應保留；95萬為偏高值（正確應排除），但79萬並非偏低值，不應排除。本選項有誤。",
   "差距＝(95-77)÷[(95+77)÷2]＝18÷86≈20.9%，達20%以上；依§26須先就偏高（95萬）或偏低（77萬）者重新檢討，檢討後差距仍達20%以上者應排除；依本題官方答案，排除77萬與95萬，保留79萬，本選項正確。"
 ], correct:3, note:"§26Ⅱ：差距＝(最高−最低)÷高低價格平均值，達20%以上，先重新檢討，檢討後仍達才排除。95與77：18÷86≈20.9%，依官方答案排除77與95、留79。分母是平均值，不是最小值。"},

{id:"Q113_09", cat:"C1", year:"113年#09",
 q:"下列何者不屬於營造或施工費之內含項目？",
 opts:["直接人工費","間接材料費","開發商合理利潤","資本利息"],
 explains:[
   "直接人工費（施工人員薪資）屬於施工費之直接成本，應計入。",
   "間接材料費（臨時設施、消耗品等）屬於施工費之間接成本，應計入。",
   "§53營造或施工費八項為直接材料費、直接人工費、間接材料費、間接人工費、管理費、稅捐、資本利息、營造或施工利潤，不含「開發商合理利潤」；開發商利潤在土地開發分析法中另以利潤率計入，故本選項正確（即不屬於）。",
   "資本利息屬§53營造或施工費八項之一，應計入。"
 ], correct:2, note:"陷阱：開發商合理利潤在V公式中是「利潤率R」，不算在「營造或施工費」裡面。"},

{id:"Q113_10", cat:"C1", year:"113年#10",
 q:"有關成本法與營造或施工費之敘述，下列何者錯誤？",
 opts:["房屋愈舊，施工單價愈低","可採直接法或間接法求取，功能性退化屬折舊之計算","採淨計法時，以各分部工程之材料及人工數量乘以相對應之單價後加總","採單位面積比較法時，以勘估標的之單位面積乘以適當之標準單價推算"],
 explains:[
   "房屋愈舊，不代表重建成本愈低。「施工費」是現在新建的成本，與被估建物的屋齡無關；屋齡越舊影響的是「折舊額」，不影響「施工單價」。本選項有誤，即本題正解。",
   "§54營造或施工費可採直接法（調查材料、勞力數量，以價格日期單價計算）或間接法（在同一供需圈內選擇比較標的或標準建物，比較並調整，如§56工程造價比較法、單位面積比較法）；功能性退化屬折舊成因之一，此敘述正確。",
   "淨計法定義正確：各分部工程的材料、人工數量乘以單價後加總。",
   "單位面積比較法定義正確：以勘估標的每坪（或每平方公尺）乘以標準單價推算總施工費。"
 ], correct:0, note:"陷阱：施工費是「現在重建」的成本，不會因為原建物屋齡而改變。屋齡影響折舊，不影響施工費單價。"},

{id:"Q113_11", cat:"A3", year:"113年#11",
 q:"中央銀行調升存款準備率，可能影響不動產的價值，此屬於影響不動產價格的何種因素？",
 opts:["一般因素","情況因素","區域因素","個別因素"],
 explains:[
   "一般因素指影響全國不動產市場之廣泛性因素，包含政策面（如央行貨幣政策）、經濟面、社會面、行政面等。調升存款準備率屬貨幣政策，影響全國資金成本與購屋貸款，屬一般因素，本選項正確。",
   "情況因素指比較標的之交易情況（如急售、親屬交易等），非廣泛市場因素。",
   "區域因素指影響特定地區不動產價格之因素（如交通、公共設施），非全國性政策。",
   "個別因素指勘估標的本身之條件（如面積、形狀、地質），非政策因素。"
 ], correct:0, note:"央行政策→影響全國→一般因素。口訣：一般=全國性（政策、總體經濟）；區域=地區性；個別=標的本身條件。"},

{id:"Q113_12", cat:"D1", year:"113年#12",
 q:"有關有效總收入與總收入之關係，下列何者正確？",
 opts:["有效總收入大於等於總收入","有效總收入與總收入意義實質相同","總收入減除總費用後即為有效總收入","總收入大於等於有效總收入"],
 explains:[
   "有效總收入是總收入扣除空置損失等收入損失後，必然≤總收入，不可能大於總收入。",
   "兩者意義不同：§36總收入指價格日期當時按法定用途出租或營運，在正常情況下所獲得之租金或收入；有效總收入＝總收入－閒置及其他原因所造成之收入損失。",
   "總收入減除總費用是「淨收益」，非有效總收入；有效總收入=總收入-空置損失等（未扣費用）。",
   "總收入≥有效總收入（總收入扣除閒置及其他原因所造成之收入損失後），本選項正確。"
 ], correct:3, note:"總收入→扣空置損失→有效總收入→扣總費用→淨收益。一定是：總收入≥有效總收入≥淨收益。"},

{id:"Q113_13", cat:"D2", year:"113年#13",
 q:"考量貸款人之觀點，利用銀行貸款成數與鑑估金額決定收益資本化率的方法，係指下列何者？",
 opts:["市場萃取法","有效總收入乘數法","債務保障比率法","風險溢酬法"],
 explains:[
   "市場萃取法是從市場交易案例中，以淨收益除以成交價格反推資本化率，未涉及銀行貸款成數。",
   "有效總收入乘數法是以有效總收入乘以某乘數推算價格，與本題概念不同。",
   "債務保障比率法（Debt Coverage Ratio法）從貸款人觀點出發：以DCR（淨收益/年償債額）、貸款常數、貸款成數等推算資本化率，本選項正確。",
   "風險溢酬法是以無風險利率加上適當風險溢酬（流動性、管理、資本回收等）推算資本化率，未考慮貸款成數。"
 ], correct:2, note:"債務保障比率法DCR = 淨收益/年償債額。從「銀行貸款成數」角度決定資本化率的方法記這個。"},

{id:"Q113_14", cat:"D1", year:"113年#14",
 q:"有關收益法的公式，下列何者錯誤？",
 opts:["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率","直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率","地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"],
 explains:[
   "錯誤，為本題答案。§45：淨收益**未扣除**折舊提存費者，建物收益價格＝建物**折舊前**淨收益／（建物收益資本化率＋建物價格日期當時價值未來每年折舊提存率），分母要加折舊提存率；選項寫成分母只有收益資本化率，那是「已扣除折舊提存費」的算法。",
   "正確。§29、§30：收益價格＝勘估標的未來平均一年期間之客觀淨收益÷收益資本化率。",
   "正確。§44：地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率。",
   "正確。§46：淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率。"
 ], correct:0, note:"§45 口訣：已扣折舊提存費→分母只有 r；未扣（折舊前淨收益）→分母 r＋d。選項 A 把兩者對調，所以錯。（本站舊版把題目改寫成別的敘述，已還原為考選部原題。）"},

{id:"Q113_15", cat:"G1", year:"113年#15",
 q:"有關特殊宗地估價敘述，下列何者錯誤？",
 opts:["農場或牧場之估價，以比較法估價為原則","公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之","高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素","鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"],
 explains:[
   "正確。§93：農場或牧場之估價，以比較法估價為原則；無買賣實例者，得以附近土地價格為基礎，考慮其位置、形狀、地形、土壤特性及利用狀況等差異，比較推估之。",
   "錯誤，為本題答案。§97：公共設施用地及公共設施保留地之估價，以**比較法**估價為原則；無買賣實例者，得比較其與毗鄰土地使用分區及使用強度差異，及土地價值減損情況，並斟酌毗鄰土地平均價格為基礎推算之。條文沒有「考慮政府徵收土地之可能價格」。",
   "正確。§91：高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素。",
   "正確。§94：鹽田之估價，以比較法估價為原則；無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之。"
 ], correct:1, note:"§93 農場牧場、§94 鹽田、§95 池沼墓地、§97 公共設施用地／保留地，都是比較法為原則；無買賣實例時才用附近（毗鄰）土地價格推算。§97 沒有「徵收可能價格」。（本站舊版把選項改寫，已還原為考選部原題。）"},

{id:"Q113_16", cat:"H1", year:"113年#16",
 q:"有關權利估價之敘述，下列何者正確？",
 opts:["市地重劃前後宗地估價，不屬於權利估價範疇","永佃權估價，不需考慮佃租金額","地上權估價，應考量地上權用途、存續期間等因素","容積移轉之估價，係以捐贈公共設施土地之市價決定移入容積之價值"],
 explains:[
   "市地重劃估價見§122-1；歷年官方答案對「權利估價範圍是否含市地重劃」說法不一，本題正解為C，不以此選項為準。",
   "永佃權包含在土地使用期間內繳付佃租之義務，永佃權估價必須考量佃租金額（佃租越高，永佃權價值越低），本選項有誤。",
   "§116地上權估價應考量用途、權利存續期間、支付地租之有無、權利讓與之限制及設定之空間位置等因素，本選項正確。",
   "§123 容積移轉估價只列應考慮容積送出基地、接受基地及其他影響價格之因素與相關法令，並無「以捐贈公共設施土地市價決定」之規定，本選項有誤。"
 ], correct:2, note:"§116 地上權估價：考慮用途、權利存續期間、支付地租之有無、權利讓與之限制、空間位置（「有無及高低」是§118-1農育權用語）。§118 永佃權要考慮佃租支付情形。"},

{id:"Q113_17", cat:"A2", year:"113年#17",
 q:"下列何者之估價結果，係屬特殊價格之評估？",
 opts:["公園預定地變更為住宅用地後之評估","土地租賃權與租賃地合併後之評估","大甲鎮瀾宮廟產之估價","農地未來可能變更為建地之評估"],
 explains:[
   "公園預定地變更後之評估，仍是以正常市場交易為前提，屬正常價格評估，非特殊價格。",
   "土地租賃權與租賃地合併，屬限定市場（僅特定人有購買意願）之估價，屬限定價格，非特殊價格。",
   "大甲鎮瀾宮廟產具有宗教、文化、社會意義，在非市場流通、文化保存目的下，屬於「特殊價格」（不以市場交易為目的、難以在公開市場交易），本選項正確。",
   "農地未來可能變更為建地之評估，考量未來地目變更之預期效益，屬正常價格（含未來變更預期）或特定價格，非特殊價格定義。"
 ], correct:2, note:"特殊價格=不以市場交易為目的之估價（宗教場所、文化資產、美術館等）。鎮瀾宮→宗教不動產→特殊價格。"},

{id:"Q113_18", cat:"A3", year:"113年#18",
 q:"下列何者屬於影響不動產價格之「個別因素」，而非「區域因素」？",
 opts:["台北市信義計畫區房價普遍高於中和地區","某宗地距大安森林公園約50公尺","信義計畫區生活機能完善、交通便捷","中正紀念堂周邊地價條件優越"],
 explains:[
   "信義計畫區vs中和是兩個不同區域的比較，反映的是「區域」差異，屬區域因素。",
   "某宗地距大安森林公園約50公尺，是「該宗地本身」的個別條件（位置特性），屬個別因素，本選項正確。",

const CAT_NAMES = {
  "A1":"A1 估價原則",
  "A2":"A2 價格種類",
  "A3":"A3 影響因素",
  "A4":"A4 作業程序",
  "B":"B 比較法",
  "C1":"C1 成本法",
  "C2":"C2 折舊計算",
  "D1":"D1 收益法",
  "D2":"D2 資本化率",
  "F1":"F1 租金估計",
  "G1":"G1 特殊估價",
  "H1":"H1 權利估價"
};

const STORAGE_KEY_ANS = "val_prac_113_v1_answers";
const STORAGE_KEY_ERR = "val_prac_113_v1_errortags";

let answers = {};
let errorTags = {};
let activeCats = new Set(Object.keys(CAT_NAMES));
let filterMode = "all";

/* 初始讀取：優先 window.storage（由 bxv-use.js 補上），回退到 localStorage */
(function(){
  var ak="bxv-st:"+STORAGE_KEY_ANS, ek="bxv-st:"+STORAGE_KEY_ERR;
  try{ var v=localStorage.getItem(ak)||localStorage.getItem(STORAGE_KEY_ANS); if(v) answers=JSON.parse(v); }catch(e){}
  try{ var v2=localStorage.getItem(ek)||localStorage.getItem(STORAGE_KEY_ERR); if(v2) errorTags=JSON.parse(v2); }catch(e){}
})();

function saveAnswers(){
  var v=JSON.stringify(answers);
  try{localStorage.setItem("bxv-st:"+STORAGE_KEY_ANS,v);}catch(e){}
  if(typeof window.storage!=='undefined') window.storage.set(STORAGE_KEY_ANS,v).catch(function(){});
}
function saveErrors(){
  var v=JSON.stringify(errorTags);
  try{localStorage.setItem("bxv-st:"+STORAGE_KEY_ERR,v);}catch(e){}
  if(typeof window.storage!=='undefined') window.storage.set(STORAGE_KEY_ERR,v).catch(function(){});
}

function buildChips(){
  const wrap = document.getElementById("chips");
  wrap.innerHTML = "";
  // All chip
  const all = document.createElement("button");
  all.className = "chip" + (activeCats.size === Object.keys(CAT_NAMES).length ? " active" : "");
  all.textContent = "全部";
  all.onclick = () => { activeCats = new Set(Object.keys(CAT_NAMES)); buildChips(); renderList(); };
  wrap.appendChild(all);

  Object.entries(CAT_NAMES).forEach(([k,v])=>{
    const btn = document.createElement("button");
    btn.className = "chip" + (activeCats.has(k) ? " active" : "");
    const cnt = ITEMS.filter(x=>x.cat===k).length;
    btn.textContent = `${v} (${cnt})`;
    btn.onclick = () => {
      if(activeCats.has(k)) activeCats.delete(k); else activeCats.add(k);
      buildChips(); renderList();
    };
    wrap.appendChild(btn);
  });
}

function updateStats(){
  const visible = ITEMS.filter(x=>activeCats.has(x.cat));
  const ans = visible.filter(x=>answers[x.id]!==undefined);
  const ok = ans.filter(x=>answers[x.id]===x.correct);
  {const _e=document.getElementById("answeredCount"); if(_e) _e.textContent = ans.length;}
  {const _e=document.getElementById("okCount"); if(_e) _e.textContent = ok.length;}
  {const _e=document.getElementById("ngCount"); if(_e) _e.textContent = ans.length - ok.length;}
  {const _e=document.getElementById("accRate"); if(_e) _e.textContent = ans.length ? Math.round(ok.length/ans.length*100)+"%" : "—";}
}

function getCatBadgeClass(cat){
  const map = {A1:"a1",A2:"a2",A3:"a3",A4:"a4",B:"b",C1:"c1",C2:"c2",D1:"d1",D2:"d2",F1:"f1",G1:"g1",H1:"h1"};
  return map[cat]||"a1";
}

function renderList(){
  updateStats();updateStatbar();
  let items = ITEMS.filter(x=>activeCats.has(x.cat));
  if(filterMode==="unanswered") items = items.filter(x=>answers[x.id]===undefined);
  if(filterMode==="wrong") items = items.filter(x=>answers[x.id]!==undefined && answers[x.id]!==x.correct);

  const list = document.getElementById("qlist");
  list.innerHTML = "";
  if(!items.length){
    list.innerHTML = "<p style='text-align:center;color:var(--muted);padding:30px;font-family:\"Noto Serif TC\",serif;'>沒有符合條件的題目</p>";
    return;
  }

  items.forEach((item, idx)=>{
    const answered = answers[item.id] !== undefined;
    const isCorrect = answered && answers[item.id] === item.correct;

    const card = document.createElement("div");
    card.className = "qcard" + (answered ? (isCorrect ? " answered correct" : " answered wrong") : "");
    card.id = "card-"+item.id;

    const qhead = document.createElement("div");
    qhead.className = "qhead";

    const badge = document.createElement("span");
    badge.className = "qbadge " + getCatBadgeClass(item.cat);
    badge.textContent = CAT_NAMES[item.cat] || item.cat;

    const yearTag = document.createElement("span");
    yearTag.className = "qyear";
    yearTag.textContent = item.year;

    qhead.appendChild(badge);
    qhead.appendChild(yearTag);
    card.appendChild(qhead);

    const qtext = document.createElement("div");
    qtext.className = "qtext";
    qtext.textContent = (idx+1) + ". " + item.q;
    card.appendChild(qtext);

    const optList = document.createElement("div");
    optList.className = "opt-list";
    const letters = ["A","B","C","D"];

    item.opts.forEach((opt, oi)=>{
      const optEl = document.createElement("button");
      optEl.className = "opt";
      if(answered){
        if(oi === item.correct) optEl.classList.add("correct-answer");
        else if(oi === answers[item.id]) optEl.classList.add("wrong-selected");
      }

      const letterEl = document.createElement("b");
      letterEl.textContent = letters[oi] + ".";
      optEl.appendChild(letterEl);

      const txt = document.createElement("span");
      txt.textContent = opt;
      optEl.appendChild(txt);

      if(!answered){
        optEl.onclick = ()=>{
          const _correct = (oi === item.correct);
          answers[item.id] = oi;
          saveAnswers();
          if(typeof BXREP!=='undefined') BXREP.rec(item, oi, _correct);
          renderList();
        };
      }
      optList.appendChild(optEl);
    });
    card.appendChild(optList);

    if(item.note){
      const nb = document.createElement("div");
      nb.className = "note-box";
      nb.innerHTML = "<b>考試重點：</b>" + item.note;
      card.appendChild(nb);
    }

    if(answered){
      const eb = document.createElement("div");
      eb.className = "explain-box";
      const et = document.createElement("div");
      et.className = "explain-title";
      et.textContent = "▎逐選項解析";
      eb.appendChild(et);
      letters.forEach((l, li)=>{
        if(li >= item.explains.length) return;
        const ei = document.createElement("div");
        ei.className = "explain-item" + (li === item.correct ? " right" : "");
        const el = document.createElement("span");
        el.className = "explain-letter";
        el.textContent = l;
        const etxt = document.createElement("span");
        etxt.textContent = item.explains[li];
        ei.appendChild(el);
        ei.appendChild(etxt);
        eb.appendChild(ei);
      });
      card.appendChild(eb);

      // Error tags (only if wrong)
      if(!isCorrect){
        const etr = document.createElement("div");
        etr.className = "error-tag-row";
        const tags = [{key:"a",label:"A 法條混淆"},{key:"b",label:"B 粗心"},{key:"c",label:"C 不熟"},{key:"d",label:"D 猜的"}];
        tags.forEach(({key,label})=>{
          const t = document.createElement("button");
          t.className = "error-tag" + (errorTags[item.id]===key ? " active-"+key : "");
          t.textContent = label;
          t.onclick = ()=>{
            errorTags[item.id] = errorTags[item.id]===key ? undefined : key;
            if(!errorTags[item.id]) delete errorTags[item.id];
            saveErrors();
            if(typeof BXREP!=='undefined') BXREP.tag(item, (errorTags[item.id]||'').toUpperCase());
            renderList();
          };
          etr.appendChild(t);
        });
        card.appendChild(etr);
      }
    }

    list.appendChild(card);
  });
}

function updateStatbar(){
  const total = ITEMS.length;
  let sure=0,gok=0,ng=0;
  ITEMS.forEach(it=>{
    const a=answers[it.id];
    if(a===undefined) return;
    const correct=(a===it.correct);
    if(correct){ if((errorTags[it.id]||'')==='D') gok++; else sure++; }
    else ng++;
  });
  const done=sure+gok+ng, ok=sure+gok;
  const T=total||1;
  document.getElementById('pbS').style.width=(sure/T*100)+'%';
  document.getElementById('pbG').style.width=(gok/T*100)+'%';
  document.getElementById('pbN').style.width=(ng/T*100)+'%';
  const acc=done?Math.round(ok/done*100):null;
  const need=p=>Math.max(0,Math.ceil(total*p/100)-ok);
  document.getElementById('ptxt').innerHTML=
    '累積 <b>'+done+'</b>/<b>'+total+'</b> 題・目前正確率 <b>'+(acc!=null?acc+'%':'—')+'</b>'+
    (done?'（答對 '+ok+'，其中猜對 '+gok+'；答錯 '+ng+'）':'')+
    '<div class="pgoal">及格線 60%：'+(need(60)?'還差 <b>'+need(60)+'</b> 題答對':'已達')+
    '　目標 70%：'+(need(70)?'還差 <b>'+need(70)+'</b> 題答對':'已達')+'</div>';
  let catA=0,catB=0,catC=0,catD=0,catN=0;
  ITEMS.forEach(it=>{
    const a=answers[it.id]; if(a===undefined) return;
    const k=errorTags[it.id]||'';
    if(k==='D') catD++;
    else if(a!==it.correct){ if(k==='A')catA++; else if(k==='B')catB++; else if(k==='C')catC++; else catN++; }
  });
  document.getElementById('pcat').textContent=
    (ng||catD)?'原因　A 混淆 '+catA+'・B 粗心 '+catB+'・C 不熟 '+catC+'・D 猜的 '+catD+(catN?'・未分類 '+catN:''):'';
}

function modal(title,content,okLabel,onOk){
  document.getElementById('bxmt').textContent=title;
  document.getElementById('bxta').value=content;
  document.getElementById('bxmsg').textContent='';
  const okBtn=document.getElementById('bxok');
  if(okLabel){okBtn.style.display='';okBtn.textContent=okLabel;okBtn._cb=onOk;}
  else okBtn.style.display='none';
  document.getElementById('bxm').classList.add('on');
}
document.getElementById('bxcl').addEventListener('click',()=>document.getElementById('bxm').classList.remove('on'));
document.getElementById('bxok').addEventListener('click',function(){if(this._cb)this._cb();});

document.getElementById('bImp').addEventListener('click',()=>{
  modal('匯入練習紀錄','','確認匯入',()=>{
    const txt=document.getElementById('bxta').value.trim();
    const m=txt.match(/BXDATA1:([A-Za-z0-9+/=]+)/);
    if(!m){document.getElementById('bxmsg').textContent='❌ 找不到有效的 BXDATA1 資料';return;}
    try{
      const obj=JSON.parse(atob(m[1]));
      const chData=obj.chapters&&(obj.chapters['113']||obj.chapters['113 真題']);
      if(!chData){document.getElementById('bxmsg').textContent='❌ 此回報不含 113 章節資料';return;}
      let cnt=0;
      Object.entries(chData).forEach(([id,r])=>{
        const it=ITEMS.find(q=>q.id===id); if(!it)return;
        answers[id]=r.sel; if(r.et)errorTags[id]=r.et.toUpperCase(); cnt++;
      });
      saveAnswers();saveErrors();updateStatbar();renderList();
      document.getElementById('bxmsg').textContent='✅ 匯入完成，共 '+cnt+' 題';
      document.getElementById('bxm').classList.remove('on');
    }catch(e){document.getElementById('bxmsg').textContent='❌ 解析失敗：'+e.message;}
  });
});

document.getElementById("filterAll").onclick = ()=>{ filterMode="all"; renderList(); };
document.getElementById("filterUnanswered").onclick = ()=>{ filterMode="unanswered"; renderList(); };
document.getElementById("filterWrong").onclick = ()=>{ filterMode="wrong"; renderList(); };
document.getElementById("resetAllBtn").onclick = ()=>{
  if(confirm("確定清除所有作答紀錄？")){
    answers={}; errorTags={};
    if(typeof BXREP!=='undefined') BXREP.drop('113');
    saveAnswers(); saveErrors(); renderList();
  }
};
document.getElementById("resetMastery").onclick = ()=>{
  if(confirm("確定清除所有作答與標記紀錄？")){
    answers={}; errorTags={};
    if(typeof BXREP!=='undefined') BXREP.drop('113');
    saveAnswers(); saveErrors(); renderList();
  }
};

// Theme toggle
const tt = document.getElementById("themeToggle");
const getTheme = ()=>{ try{return localStorage.getItem("bx-theme")||"light";}catch(e){return "light";} };
const applyTheme = t=>{ document.documentElement.setAttribute("data-theme",t); tt.textContent=t==="dark"?"☀️":"🌙"; try{localStorage.setItem("bx-theme",t);}catch(e){} };
tt.onclick = ()=>applyTheme(getTheme()==="dark"?"light":"dark");
applyTheme(getTheme());

buildChips();
renderList();

/* 把既有113作答補進 bxv-q2 */
if(typeof BXREP!=='undefined'){
  try{
    BXREP.sync('113', ITEMS,
      Object.fromEntries(Object.entries(answers).map(([id,oi])=>[id,{selected:oi,ok:oi===ITEMS.find(q=>q.id===id)?.correct?1:0,et:errorTags[id]||''}])),
      k=>k);
  }catch(e){}
}
</script>
</body>
