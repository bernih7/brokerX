p>"], "ck": [{"x": "§3④⑤：先定性為共用部分，再因規約成為約定專用部分", "h": false}, {"x": "§15Ⅰ：依使用執照所載用途及規約使用，不得擅自變更（約定專用≠可改用途）", "h": true}, {"x": "§58Ⅱ：法定空地、法定停車空間、法定防空避難設備都不得讓售特定人", "h": false}, {"x": "§16Ⅱ 明列防空避難設備；但書只放寬原核准用途與公共收費停車", "h": true}, {"x": "§23Ⅱ①②載明於規約生效，§24Ⅰ 拘束繼受人", "h": false}, {"x": "§49Ⅰ③④：4 萬–20 萬罰鍰＋限期改善＋連續處罰（不是 3–15 萬）", "h": true}, {"x": "§49Ⅱ：有供營業使用事實而致死、致重傷另有刑責", "h": false}, {"x": "管委會：制止→報請主管機關→要求回復原狀（§15Ⅱ、§16Ⅴ、§9Ⅳ）", "h": false}, {"x": "§22Ⅰ②：罰鍰後仍不改善→促請改善三個月→區權會決議→訴請法院遷離、出讓、拍賣", "h": true}], "mn": "專用只是「專停」不是「專放」；制止→報請→罰到底→三個月→遷離出讓拍賣〔自編〕"}, {"id": "es-fw12", "no": "範文12", "t": "101年申論二｜仲介公會決議收費下限是否適法（公平交易法評析）", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "公平交易法", "q": "仲介公會經理監事會議決議，要求會員收取仲介費用之標準，不得低於公會所訂之下限。試依公平交易法之相關規定，評析該公會之前述會議決議是否適法。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公平交易法<span class=\"art\">第14條第1項</span>、第4項，聯合行為指具競爭關係之同一產銷階段事業以合意共同決定價格等相互約束事業活動，而足以影響市場功能之行為；同業公會藉理、監事會議決議約束事業活動者，亦屬之；依<span class=\"art\">第15條第1項</span>，事業不得為聯合行為。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第14條第1項</span>、第4項<span class=\"lawn\">（聯合行為之定義與禁止）</span></span><span class=\"evli\"><span class=\"art\">第15條第1項</span><span class=\"lawn\">（聯合行為之例外許可）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）是否屬聯合行為</p><p>依<span class=\"art\">第14條第1項</span>，聯合行為指具競爭關係之同一產銷階段事業，以契約、協議或其他方式之合意，共同決定商品或服務之價格、數量、技術、產品、設備、交易對象、交易地區或其他相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能者。依第4項，同業公會藉章程或會員大會、理、監事會議決議或其他方法所為約束事業活動之行為，亦為本法之聯合行為。本題仲介公會以理監事會議決議，要求會員收費不得低於下限，等於約束彼此競爭之仲介業共同決定服務價格，且足以影響仲介服務供需之市場功能。</p><p class=\"evx\"><span class=\"evt\">例</span><span>原本可以收2%吸引客戶的業者，被迫至少收4%。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>剝奪會員自由定價，消費者失去比價空間。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）有無例外許可</p><p>依<span class=\"art\">第15條第1項</span>，事業不得為聯合行為；但有益於整體經濟與公共利益，並經主管機關許可之法定情形者，不在此限。本題決議目的只是防止會員削價競爭，非屬降低成本、改良品質、專業分工、促進輸出等法定許可事由，也未事先申請許可。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持收費下限只保護業者，不增進公共利益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>仲介公會以理監事會議決議訂定收費下限，屬公平交易法<span class=\"art\">第14條第4項</span>之聯合行為；既不符<span class=\"art\">第15條</span>之例外許可事由，也未經許可，該決議違法，公平會得依<span class=\"art\">第40條第1項</span>限期令停止、改正其行為或採取必要更正措施，並處新臺幣十萬元以上五千萬元以下罰鍰，以維護市場自由競爭。</p>"], "ck": [{"x": "§14Ⅰ：具競爭關係之同一產銷階段事業，以合意共同決定價格或相互約束事業活動，足以影響市場功能", "h": false}, {"x": "§14Ⅳ：同業公會藉章程、會員大會或理、監事會議決議約束事業活動，亦為本法之聯合行為", "h": true}, {"x": "會員仲介業彼此為競爭者，「收費不得低於下限」＝共同決定服務價格、相互約束定價自由", "h": false}, {"x": "§15Ⅰ：原則禁止；例外須八款事由＋有益整體經濟與公共利益＋經申請主管機關許可", "h": true}, {"x": "本決議僅為防止低價競爭，不符八款任一事由，且未申請許可，故不符例外", "h": true}, {"x": "結論：違法之聯合行為；公會與參與決議之會員事業均可能被限期令停止、改正或處罰鍰", "h": false}], "mn": "聯合行為：原則禁、許可例外；公會決議也算"}, {"id": "es-fw26", "no": "範文26", "t": "110年申論二｜公平法事業定義及預售屋抽籤選戶禮賓活動有無違法", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "公平交易法", "q": "請依據公平交易法規定，論述下列問題：（一）第2條所稱事業有那些？（二）有建設公司委託地產公司代銷預售屋，在各樓層平面圖、各戶室內外面積、預售屋買賣契約書、房屋售價等相關商品資訊都尚未規劃完成前，就先辦理預售屋限量抽籤選戶禮賓活動，產生人潮擁擠爭相搶購的排隊現象，且當天禮賓活動營造出消費者中籤機不可失、不買可惜的氣氛，抽籤辦法規定只有1分鐘的選戶時間，超過時間就讓給下一組客人。請就公平交易法論述建設公司及地產公司有無違法？並說明依據的規定及理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>公平交易法所稱事業採廣義解釋，凡從事商品或服務交易者均可能受規範；<span class=\"art\">第25條</span>則是概括條款，填補列舉不公平競爭態樣未涵蓋之欺罔或顯失公平行為。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第2條</span><span class=\"lawn\">（事業之定義）</span></span><span class=\"evli\"><span class=\"art\">第25條</span><span class=\"lawn\">（欺罔或顯失公平之概括規定）</span></span><span class=\"evli\"><span class=\"art\">第42條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）<span class=\"art\">第2條</span>所稱事業</p><p><span class=\"evli\">①公司；</span><span class=\"evli\">②獨資或合夥之工商行號；</span><span class=\"evli\">③其他提供商品或服務從事交易之人或團體。事業所組成之同業公會或其他依法設立、促進成員利益之團體，視為本法所稱事業。本題建設公司銷售預售屋、地產公司提供代銷服務，均屬事業。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以「從事交易」為判斷，不限組織型態。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）建設公司及地產公司有無違法</p><p>依<span class=\"art\">第25條</span>，除本法另有規定者外，事業亦不得為其他足以影響交易秩序之欺罔或顯失公平之行為。平面圖、室內外面積、契約書、售價是預售屋最重要的交易資訊；本題在這些資訊尚未完成前，即辦理限量抽籤選戶，以人潮排隊、營造「不買可惜」氣氛、限定1分鐘選戶等手法製造急迫感，使具普通知識經驗之消費者無法合理比較判斷即倉促決定。</p><p class=\"evx\"><span class=\"evt\">例</span><span>消費者連房價都不知道就被要求在1分鐘內選定戶別。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>已逾越正常促銷範圍，屬顯失公平而足以影響交易秩序。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）效果</p><p>依<span class=\"art\">第42條</span>，公平會得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣五萬元以上二千五百萬元以下罰鍰；屆期仍不停止、改正者，得按次處新臺幣十萬元以上五千萬元以下罰鍰。</p></div>", "<span class=\"blk-l\">四、結論</span><p>建設公司與地產代銷公司均屬<span class=\"art\">第2條</span>之事業；兩者在重要交易資訊未完成前辦理限量抽籤、限時選戶，剝奪消費者充分資訊與考慮時間，違反<span class=\"art\">第25條</span>，公平會得依<span class=\"art\">第42條</span>限期令停止、改正並處罰鍰。</p>"], "ck": [{"x": "§2Ⅰ 三類：公司／獨資或合夥之工商行號／其他提供商品或服務從事交易之人或團體", "h": true}, {"x": "§2Ⅱ：事業所組成之同業公會或其他依法設立、促進成員利益之團體，視為事業", "h": false}, {"x": "建設公司與地產代銷公司均屬 §2 所稱之事業（先定性再論違法）", "h": false}, {"x": "§25：除本法另有規定外，事業不得為其他足以影響交易秩序之欺罔或顯失公平之行為", "h": false}, {"x": "重要交易資訊尚未規劃完成＋僅 1 分鐘選戶＝欠缺資訊與時間壓力，無法合理判斷", "h": false}, {"x": "只寫「違反 §25」不給滿分，必須寫出理由（資訊未備、搶購氣氛、時間壓力）", "h": true}, {"x": "效果：公平會得限期令停止、改正或處以罰鍰；消費者得請求損害賠償", "h": false}], "mn": "事業三類＋公會視為；資訊未備＋1 分鐘 → §25"}, {"id": "es-mk6", "no": "模六", "t": "模擬試題｜斡旋金未告知要約書、預售屋先付定金才給審閱", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "公平交易法", "q": "仲介業者甲向買方乙收取斡旋金，未告知乙得選擇內政部版要約書；另預售屋銷售人員要求購屋人須先付定金才可攜回契約書審閱。請分析公平交易法責任；若乙因未締約請求返還斡旋金遭拒，是否同屬公平法問題？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公平交易法<span class=\"art\">第25條</span>，事業不得為其他足以影響交易秩序之欺罔或顯失公平之行為。斡旋金與要約書之告知義務，是公平會管制重點。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第25條</span><span class=\"lawn\">（欺罔或顯失公平之概括規定）</span></span><span class=\"evli\"><span class=\"art\">第42條</span></span><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條</span><span class=\"lawn\">（應由經紀人簽章之文件）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）未告知要約書</p><p>依公平交易法<span class=\"art\">第25條</span>，收取斡旋金前，應以書面告知買方得選擇支付斡旋金或採用內政部版要約書，並書面明定斡旋金之目的與權利義務。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲故意未告知乙而構成欺罔，足以影響交易秩序，違反<span class=\"art\">第25條</span>，不是<span class=\"art\">第21條</span>至<span class=\"art\">第23條</span>。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>此告知義務為公平會管制重點。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）先付定金始得審閱</p><p>依公平交易法<span class=\"art\">第25條</span>，要求購屋人須先給付定金才提供契約書攜回審閱，屬顯失公平行為。</p><p class=\"evx\"><span class=\"evt\">例</span><span>本題銷售之事業（建商或代銷業者）以先付定金為審閱條件，違反<span class=\"art\">第25條</span>，不是<span class=\"art\">第20條</span>，也不是<span class=\"art\">第21條</span>之不實廣告。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以付費為審閱條件。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）返還糾紛</p><p>因未締約而拒絕返還斡旋金，屬一般契約爭議，不構成<span class=\"art\">第25條</span>，不屬公平法範圍。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙應循民事程序請求。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>不涉欺罔或顯失公平。另要約書、定金收據屬管理條例<span class=\"art\">第22條</span>應由經紀人簽章之文件；要約書（委託銷售定型化契約附件）不得約定「在契約成立前，受託人得向消費者收取斡旋金、訂金或其他任何名目之費用」，與<span class=\"art\">第25條</span>告知義務係兩個層面。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>未告知要約書、要求先付定金才給契約書，均違反公平交易法<span class=\"art\">第25條</span>，主管機關得依<span class=\"art\">第42條</span>限期令停止、改正，並處5萬元以上2,500萬元以下罰鍰，屆期未改正按次處10萬元以上5,000萬元以下罰鍰；斡旋金返還遭拒屬民事爭議，非公平法問題。</p>"], "ck": [{"x": "公平§25：欺罔或顯失公平＋足以影響交易秩序", "h": false}, {"x": "收斡旋金前應書面告知得選內政部版要約書；未告知 → 欺罔 → §25", "h": false}, {"x": "預售屋先付定金才給契約書攜回審閱 → 顯失公平 → §25", "h": false}, {"x": "依據是 §25，不是 §21、§23", "h": true}, {"x": "§42：限期令停止、改正＋5 萬–2,500 萬元罰鍰；屆期未改正按次 10 萬–5,000 萬元", "h": false}, {"x": "未締約拒絕返還斡旋金＝一般契約爭議，不構成 §25", "h": true}, {"x": "返還糾紛走民事程序，不主張刑事責任", "h": true}], "mn": "不告知、先收錢 → §25；要不回錢 → 民事"}, {"id": "es-g1", "no": "G1", "t": "聯合行為的許可與期限", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "事業可以有聯合行為嗎？什麼情形可以申請許可？許可有期限嗎？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>聯合行為指具競爭關係之同一產銷階段事業，以契約、協議或其他方式之合意，共同決定商品或服務之價格、數量、交易對象等相互約束事業活動，而足以影響市場功能之行為；同業公會藉章程或決議約束事業活動者，亦為聯合行為。依<span class=\"art\">第15條第1項</span>，事業不得為聯合行為；但有法定情形之一，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第14條</span><span class=\"lawn\">（聯合行為之定義與禁止）</span></span><span class=\"evli\"><span class=\"art\">第15條</span><span class=\"lawn\">（聯合行為之例外許可）</span></span><span class=\"evli\"><span class=\"art\">第16條</span><span class=\"lawn\">（許可之條件與期限）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原則禁止</p><p>依<span class=\"art\">第15條第1項</span>本文，事業不得為聯合行為。依<span class=\"art\">第14條</span>，其他方式之合意指契約、協議以外之意思聯絡，不問有無法律拘束力，事實上可導致共同行為者即屬之；合意並得依市場狀況、成本及利潤考量、經濟合理性等因素推定。</p><p class=\"evx\"><span class=\"evt\">例</span><span>同區數家仲介業者開會共同決定一律收取相同服務報酬比率。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第14條第1項</span>以「足以影響生產、商品交易或服務供需之市場功能」為要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）例外許可</p><p>依<span class=\"art\">第15條第1項</span>但書，須有下列情形之一，而有益於整體經濟與公共利益，經申請主管機關許可：<span class=\"evli\">①統一商品或服務之規格或型式；</span><span class=\"evli\">②共同研究開發；</span><span class=\"evli\">③分別作專業發展；</span><span class=\"evli\">④專就國外市場之競爭予以約定；</span><span class=\"evli\">⑤就國外商品或服務之輸入採取共同行為；</span><span class=\"evli\">⑥因經濟不景氣，為有計畫適應需求而限制產銷數量、設備或價格；</span><span class=\"evli\">⑦增進中小企業之經營效率或競爭能力；</span><span class=\"evli\">⑧其他為促進產業發展、技術創新或經營效率所必要之共同行為。依<span class=\"art\">第15條第2項</span>，主管機關應於三個月內為決定，必要時得延長一次。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>中小企業為增進經營效率而共同行為，仍須先經許可。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>須個案審查是否有益整體經濟與公共利益。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）許可期限</p><p>依<span class=\"art\">第16條</span>，主管機關許可時得附加條件或負擔；許可應附期限，其期限不得逾五年；事業有正當理由，得於期限屆滿前三個月至六個月期間內，以書面申請延展，每次延展不得逾五年。</p><p class=\"evx\"><span class=\"evt\">例</span><span>獲五年許可者，應於屆滿前三至六個月間書面申請延展。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第16條第2項</span>明定許可應附期限，延展亦每次不得逾五年。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>事業原則不得為聯合行為；例外於符合<span class=\"art\">第15條第1項</span>八款情形之一、有益於整體經濟與公共利益，並經主管機關許可者，始得為之，主管機關應於三個月內決定。許可有期限，不得逾五年；有正當理由得於屆滿前三至六個月書面申請延展，每次不得逾五年，並非只能延展一次。</p>"], "ck": [{"x": "§14Ⅰ：具競爭關係之「同一產銷階段」事業，以合意相互約束事業活動，足以影響市場功能", "h": false}, {"x": "§14Ⅳ：同業公會藉章程、會員大會或理監事會議決議約束事業活動者，亦為聯合行為", "h": false}, {"x": "§15Ⅰ：採原則禁止、例外許可；未經許可即為違法", "h": false}, {"x": "§15Ⅰ 八款許可事由：統一規格、共同研發、專業發展、輸出、輸入、不景氣、中小企業、其他必要共同行為", "h": false}, {"x": "八款之外還須同時「有益於整體經濟與公共利益」且「經申請許可」，三者缺一不可", "h": false}, {"x": "§15Ⅱ：主管機關應於三個月內為決定，必要時得延長一次", "h": false}, {"x": "§16Ⅱ：許可應附期限且不得逾五年，不可寫成 3 年（舊制）", "h": true}, {"x": "延展於屆滿前 3 至 6 個月以書面申請，每次不得逾五年，條文未限制只能延展一次", "h": true}], "mn": "三個月決定、五年許可；屆滿前三到六個月書面續命"}, {"id": "es-g2", "no": "G2", "t": "結合管制", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "事業結合在什麼情形下應先向公平交易委員會申報？申報後多久才能結合？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公平交易法<span class=\"art\">第10條第1項</span>，結合指事業與他事業合併、取得他事業有表決權股份或出資額達三分之一以上、受讓或承租他事業全部或主要部分之營業或財產等情形；依<span class=\"art\">第11條第1項</span>，達該項門檻之一者，應先向主管機關提出申報。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第11條</span><span class=\"lawn\">（結合之申報）</span></span><span class=\"evli\"><span class=\"art\">第39條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）申報門檻</p><p>依<span class=\"art\">第11條第1項</span>，事業結合時有下列情形之一者，應先向主管機關提出申報：<span class=\"evli\">①事業因結合而使其市場占有率達三分之一；</span><span class=\"evli\">②參與結合之一事業，其市場占有率達四分之一；</span><span class=\"evli\">③參與結合之事業，其上一會計年度銷售金額，超過主管機關所公告之金額。銷售金額應將具控制與從屬關係之事業一併計入；對事業具有控制性持股之人或團體，視為結合規定之事業。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>甲仲介公司市占率已達四分之一，欲合併乙公司，即使乙規模小，仍應先申報。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>三款門檻符合任一即須申報，並非須同時具備。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）等待期間</p><p>依<span class=\"art\">第11條第7項</span>、第8項，事業自主管機關受理其提出完整申報資料之日起算三十工作日內，不得為結合；主管機關認為必要時，得縮短或延長並以書面通知，延長之期間不得逾六十工作日。</p><p class=\"evx\"><span class=\"evt\">例</span><span>完整資料受理後第二十個工作日即完成合併，屬於等待期間內結合。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>給予主管機關審查時間，以工作日而非日曆日計算。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）逕行結合</p><p>依<span class=\"art\">第11條第9項</span>，主管機關屆期未為延長通知或決定者，事業得逕行結合；但經申報之事業同意再延長期間，或申報事項有虛偽不實者，不得逕行結合。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免審查無限期拖延，又不讓不實申報者受益。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）違反效果</p><p>依<span class=\"art\">第39條</span>，違反<span class=\"art\">第11條第1項</span>、第7項規定而為結合者，主管機關得禁止其結合、限期令其分設事業、處分全部或部分股份、轉讓部分營業等，並得處新臺幣二十萬元以上五千萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保事前審查制度之實效。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>事業結合有結合後市占率達三分之一、參與結合之一事業市占率達四分之一，或上一會計年度銷售金額超過公告金額三種情形之一者，應先申報。自主管機關受理完整申報資料之日起三十工作日內不得結合；主管機關得縮短或延長，延長不得逾六十工作日；屆期未通知延長或未決定者，事業得逕行結合。</p>"], "ck": [{"x": "公平§11Ⅰ：三款門檻符合「之一」即應先申報（結合後市占 1/3、單一事業市占 1/4、銷售額逾公告金額）", "h": false}, {"x": "三款是「或」的選擇關係，寫成「且」即錯", "h": true}, {"x": "公平§11Ⅱ：第三款銷售金額須併計控制與從屬關係事業", "h": false}, {"x": "公平§11Ⅶ：自受理完整申報資料之日起 30 工作日內不得為結合，得縮短或延長並書面通知", "h": false}, {"x": "期間單位是「工作日」，不可寫成日曆日；起算點是受理「完整」申報資料之日", "h": true}, {"x": "公平§11Ⅷ：延長期間不得逾 60 工作日", "h": true}, {"x": "公平§11Ⅸ：屆期未延長通知或未作成決定者得逕行結合；但同意再延長或申報不實者不得逕行結合", "h": false}], "mn": "三取一才申報；三十工作日不得動，延長最多六十；屆期沒消息可自己結合"}, {"id": "es-g3", "no": "G3", "t": "獨占的認定", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "何謂獨占？公平交易法如何認定市場占有率？什麼情形不列入獨占認定？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>獨占指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者。公平交易法<span class=\"art\">第8條</span>以市場占有率作為不列入獨占認定之門檻，同條第3項另許主管機關依法令、技術限制等情事認定獨占。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第7條</span><span class=\"lawn\">（獨占事業之定義）</span></span><span class=\"evli\"><span class=\"art\">第8條</span>（不列入獨占認定範圍之市占率門檻）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）獨占之意義</p><p>依<span class=\"art\">第7條第1項</span>，獨占指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者；依同條第2項，二以上事業實際上不為價格之競爭，而其全體之對外關係具有前項情形者，視為獨占。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某地區兩家業者長期不為價格競爭，全體對外具壓倒性地位，視為獨占。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>形式上多家、實質上無競爭，效果與一家獨占相同。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）市占率基準</p><p>依<span class=\"art\">第8條第1項</span>，事業無下列情形者，不列入獨占事業認定範圍：<span class=\"evli\">①一事業於相關市場之占有率達二分之一；</span><span class=\"evli\">②二事業全體達三分之二；</span><span class=\"evli\">③三事業全體達四分之三。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>甲一家市占率達二分之一，即進入認定範圍。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以客觀數字篩選，此為門檻而非達到即構成獨占。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不列入之情形</p><p>依<span class=\"art\">第8條第2項</span>，有前項情形之一，其個別事業於相關市場占有率未達十分之一，或上一會計年度事業總銷售金額未達主管機關所公告之金額者，不列入認定範圍。</p><p class=\"evx\"><span class=\"evt\">例</span><span>三事業全體市占率達四分之三，其中丙市占率未達十分之一，丙不列入。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>規模過小之事業無排除競爭能力。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）仍得認定</p><p>依<span class=\"art\">第8條第3項</span>，事業之設立或其商品、服務進入相關市場受法令、技術之限制，或有其他足以影響市場供需可排除競爭能力之情事者，雖有前二項不列入之情形，主管機關仍得認定其為獨占事業。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>市占率基準不是唯一標準。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>獨占指事業在相關市場無競爭或具壓倒性地位而可排除競爭（<span class=\"art\">第7條</span>）；市占率基準為一事業二分之一、二事業三分之二、三事業四分之三（<span class=\"art\">第8條第1項</span>）；個別事業未達十分之一或銷售金額未達公告金額者不列入（<span class=\"art\">第8條第2項</span>）；但市場進入受法令、技術限制等情事者，主管機關仍得認定為獨占。</p>"], "ck": [{"x": "§7Ⅰ：相關市場無競爭狀態，或具壓倒性地位可排除競爭之能力", "h": false}, {"x": "§7Ⅱ：二以上事業不為價格競爭、全體對外具前項情形者，視為獨占", "h": false}, {"x": "§8Ⅰ：一事業 1/2、二事業全體 2/3、三事業全體 3/4", "h": false}, {"x": "§7 是定義、§8 才是市占率基準，條號不可混用", "h": true}, {"x": "§8Ⅰ 是「不列入認定範圍」之反面規定，達基準不等於當然獨占", "h": true}, {"x": "§8Ⅱ：個別市占未達 1/10，或上一會計年度總銷售金額未達公告金額者不列入", "h": false}, {"x": "§8Ⅲ：受法令、技術限制等情事，主管機關仍得認定為獨占", "h": true}], "mn": "一二、二三、三四；個別一成以下不計，法令技術限制仍可翻回"}, {"id": "es-g4", "no": "G4", "t": "違反公平交易法的民事救濟", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "受害人可向違法事業主張哪些權利？損害賠償請求權多久不行使就消滅？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>公平交易法除行政處分外，另賦予受害人民事救濟，得直接向法院請求除去、防止侵害及損害賠償。對故意侵害設懲罰性賠償（<span class=\"art\">第31條</span>），並設時效規定（<span class=\"art\">第32條</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第29條</span><span class=\"lawn\">（侵害排除與防止請求權）</span></span><span class=\"evli\"><span class=\"art\">第30條</span><span class=\"lawn\">（損害賠償責任）</span></span><span class=\"evli\"><span class=\"art\">第31條</span><span class=\"lawn\">（懲罰性賠償金）</span></span><span class=\"evli\"><span class=\"art\">第32條</span><span class=\"lawn\">（請求權時效）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）除去與防止請求權</p><p>依<span class=\"art\">第29條</span>，事業違反本法之規定，致侵害他人權益者，被害人得請求除去之；有侵害之虞者，並得請求防止之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>同業散布不實情事損害信譽，被害人得請求除去侵害並防止再為。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使侵害狀態及早停止。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）損害賠償請求權</p><p>依<span class=\"art\">第30條</span>，事業違反本法之規定，致侵害他人權益者，應負損害賠償責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>因競爭者不實廣告致客源流失，得請求賠償所受損害。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>填補被害人損害。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）懲罰性賠償與利益計算</p><p>依<span class=\"art\">第31條第1項</span>，如為事業之故意行為，法院得依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之三倍；依同條第2項，侵害人因侵害行為受有利益者，被害人得請求專依該項利益計算損害額。</p><p class=\"evx\"><span class=\"evt\">例</span><span>已證明損害100萬元，故意侵害者最多酌定300萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>加重故意違法之代價以收嚇阻之效。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）時效</p><p>依<span class=\"art\">第32條</span>，本章所定之請求權，自請求權人知有行為及賠償義務人時起，二年間不行使而消滅；自為行為時起，逾十年者亦同。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>法律安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>受害人得請求除去侵害、防止侵害及損害賠償；事業故意者，法院得酌定損害額以上之賠償，但不得超過已證明損害額之三倍，並得專依侵害人所受利益計算。損害賠償請求權自知有行為及賠償義務人時起二年間不行使而消滅，自行為時起逾十年亦同。</p>"], "ck": [{"x": "§29：違反本法致侵害他人權益者，被害人得請求除去；有侵害之虞者得請求防止", "h": false}, {"x": "§30：事業違反本法致侵害他人權益者，應負損害賠償責任", "h": false}, {"x": "§31Ⅰ：故意行為得酌定損害額以上之賠償，但不得超過已證明損害額之三倍", "h": true}, {"x": "§31Ⅱ：侵害人因侵害行為受有利益者，被害人得專依該項利益計算損害額", "h": false}, {"x": "三倍是「已證明損害額」之上限，不可寫成四倍（99 年舊制）", "h": false}, {"x": "§32：自知有行為及賠償義務人時起 2 年；自為行為時起逾 10 年亦同", "h": true}, {"x": "時效條號為現行 §32，舊題稱 §33，答題務必寫現行條號", "h": true}], "mn": "除去、防止、賠償，故意最高三倍；二年知、十年行為"}, {"id": "es-g5", "no": "G5", "t": "廣告薦證者與連帶賠償（案例）", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "某建商請知名藝人甲代言「步行 3 分鐘到捷運站」，實際步行逾 20 分鐘；廣告由廣告代理業乙設計、媒體丙刊登；另有素人丁受建商報酬在社群貼文推薦。各人在公平交易法上的責任為何？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>公平交易法<span class=\"art\">第21條</span>禁止對影響交易決定之事項為虛偽不實或引人錯誤之表示。除廣告主外，廣告代理業、媒體業、薦證者在「明知或可得而知」時，也與廣告主負連帶責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第21條</span>（虛偽不實或引人錯誤之表示）</span><span class=\"evli\"><span class=\"art\">第30條</span>（損害賠償責任）</span><span class=\"evli\"><span class=\"art\">第42條</span>（限期停止</span><span class=\"evli\">改正及罰鍰）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）建商（廣告主）</p><p>宣稱「步行3分鐘到捷運站」，實際逾20分鐘，屬對商品內容足以影響交易決定之事項為虛偽不實表示，違反<span class=\"art\">第21條</span>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>交通便利性屬<span class=\"art\">第21條第2項</span>「其他具有招徠效果之相關事項」。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）廣告代理業乙</p><p>明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙只要查地圖即可發現距離不符。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）廣告媒體業丙</p><p>明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，亦與廣告主負連帶損害賠償責任。</p></div><div class=\"evp\"><p class=\"evh\">（四）薦證者甲、丁</p><p>薦證者指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構。甲為知名公眾人物，明知或可得而知其薦證有引人錯誤之虞而仍為薦證者，與廣告主負連帶損害賠償責任。丁若非屬知名公眾人物、專業人士或機構，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>丁收5,000元貼文，最多連帶賠償5萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第21條第5項</span>但書明定非屬知名公眾人物、專業人士或機構者，僅於受廣告主報酬十倍之範圍內負連帶損害賠償責任。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）關鍵要件</p><p>須「明知或可得而知」，並非刊登或推薦就一律負責。</p></div>", "<span class=\"blk-l\">四、結論</span><p>建商違反<span class=\"art\">第21條</span>；乙、丙、甲於明知或可得而知時，與建商負連帶賠償責任；丁亦須明知或可得而知始負責，且以所受報酬十倍為限。</p>"], "ck": [{"x": "§21Ⅰ、Ⅱ：對足以影響交易決定之事項（含其他具招徠效果之相關事項）不得為虛偽不實或引人錯誤之表示", "h": false}, {"x": "「步行 3 分鐘」實際逾 20 分鐘，建商為廣告主，違反 §21Ⅰ；服務依 §21Ⅳ 準用", "h": false}, {"x": "§21Ⅴ：代理業「製作或設計」、媒體業「傳播或刊載」，均以明知或可得而知為要件", "h": true}, {"x": "乙、丙不是一刊登、一設計就負責，主觀要件不成立即不負連帶責任", "h": false}, {"x": "§21Ⅵ：薦證者＝廣告主以外，於廣告中反映其意見、信賴、發現或親身體驗結果之人或機構", "h": true}, {"x": "§21Ⅴ但書：非屬知名公眾人物、專業人士或機構者，責任以受廣告主報酬十倍為限", "h": true}, {"x": "甲是知名公眾人物，不受十倍上限；丁受十倍上限但同須明知或可得而知，非完全免責", "h": false}], "mn": "代理、媒體、薦證者，明知可知就連帶；非知名者十倍為限", "hp": 10, "hpl": "高"}, {"id": "es-g6", "no": "G6", "t": "限制競爭與其他不公平競爭行為（§20、§22–§25）", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "請比較公平交易法 §20（限制競爭）、§21（不實表示）、§22（仿冒）、§23（贈品贈獎）、§24（損害信譽）、§25（欺罔顯失公平）的要件，並各舉不動產經紀業的情形。", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>公平交易法除聯合行為與結合外，另規範限制競爭與其他不公平競爭行為。各條要件不同，答題須先以事實對到正確條號，依行為類型適用條文。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第20條</span><span class=\"lawn\">（限制競爭之禁止）</span></span><span class=\"evli\"><span class=\"art\">第21條</span><span class=\"lawn\">（虛偽不實或引人錯誤之表示）</span></span><span class=\"evli\"><span class=\"art\">第22條</span><span class=\"lawn\">（仿冒混淆之禁止）</span></span><span class=\"evli\"><span class=\"art\">第23條</span><span class=\"lawn\">（不當提供贈品贈獎）</span></span><span class=\"evli\"><span class=\"art\">第24條</span><span class=\"lawn\">（損害他人營業信譽）</span></span><span class=\"evli\"><span class=\"art\">第25條</span><span class=\"lawn\">（欺罔或顯失公平之概括規定）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）限制競爭</p><p>依<span class=\"art\">第20條</span>，有五款行為之一而有限制競爭之虞者，事業不得為之：以損害特定事業為目的促使他事業斷絕交易、無正當理由差別待遇、以低價利誘等阻礙競爭者、以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭、以不正當限制交易相對人之事業活動為交易條件。</p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介業者以損害特定同業為目的，促使建商對該同業斷絕代銷委託，而有限制競爭之虞。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>要件核心是有限制競爭之虞。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）不實表示</p><p>依<span class=\"art\">第21條</span>，對與商品相關而足以影響交易決定之事項，不得為虛偽不實或引人錯誤之表示，於服務準用之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>無客觀數據宣稱第一品牌。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保障交易決定之正確。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）仿冒</p><p>依<span class=\"art\">第22條</span>，不得以著名之他人姓名、商號或公司名稱、標章或其他表徵，於同一或類似之服務為相同或近似之使用，致與他人營業或服務混淆；依法註冊取得商標權者不適用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀業使用與著名仲介品牌近似之商號致混淆。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護著名表徵。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）贈品贈獎</p><p>依<span class=\"art\">第23條</span>，不得以不當提供贈品、贈獎之方法爭取交易機會。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀業以高價抽獎招攬委託銷售，其「不當」與否依<span class=\"art\">第23條第2項</span>授權之辦法判斷（辦法條文庫未收，未核實）。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>競爭應回歸服務本身。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）損害信譽</p><p>依<span class=\"art\">第24條</span>，不得為競爭之目的，陳述或散布足以損害他人營業信譽之不實情事。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲在布告欄張貼乙吞沒斡旋金的不實內容，乙可依<span class=\"art\">第29條</span>請求除去侵害，有侵害之虞者並得請求防止之，並得依<span class=\"art\">第30條</span>請求損害賠償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護同業商譽。</span></p></div><div class=\"evp\"><p class=\"evh\">（六）概括條款</p><p>依<span class=\"art\">第25條</span>，除本法另有規定外，不得為其他足以影響交易秩序之欺罔或顯失公平之行為。</p><p class=\"evx\"><span class=\"evt\">例</span><span>收取斡旋金未告知可選擇要約書；預售屋須先付定金始得攜回契約審閱。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>補充前述各條之不足。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>斷絕交易、差別待遇等有限制競爭之虞者適用<span class=\"art\">第20條</span>；不實表示適用<span class=\"art\">第21條</span>；以著名表徵致混淆適用<span class=\"art\">第22條</span>；不當贈品贈獎適用<span class=\"art\">第23條</span>；散布不實損害信譽適用<span class=\"art\">第24條</span>；其餘足以影響交易秩序之欺罔或顯失公平行為適用<span class=\"art\">第25條</span>。共同決定收費則屬<span class=\"art\">第14條</span>之聯合行為，非<span class=\"art\">第20條</span>。</p>"], "ck": [{"x": "§20：五款行為＋「而有限制競爭之虞」，缺要件即不該當", "h": true}, {"x": "同業共同決定收費、協議拒絕聯賣屬聯合行為，不可誤歸 §20", "h": true}, {"x": "§21：對足以影響交易決定之事項為虛偽不實或引人錯誤之表示；服務準用", "h": false}, {"x": "§22：以著名他人表徵於同一或類似商品／服務相同近似使用致混淆；註冊商標不適用", "h": false}, {"x": "§23：不得以不當提供贈品、贈獎之方法爭取交易之機會", "h": false}, {"x": "§24：為競爭之目的，陳述或散布足以損害他人營業信譽之不實情事", "h": false}, {"x": "§25：除本法另有規定外，其他足以影響交易秩序之欺罔或顯失公平行為（概括）", "h": false}, {"x": "事實對條號：斷絕／差別→§20；不實→§21；混淆→§22；贈品→§23；損譽→§24；其餘→§25（切勿新舊條號互換）", "h": true}], "mn": "二十限制二二仿，二三贈品二四譽，二五概括"}, {"id": "es-g7", "no": "G7", "t": "斡旋金、要約書與預售屋契約審閱（§25 案例）", "lv": "預測", "k": "pred", "tier": 3, "g": "公平交易法", "q": "仲介業者甲向買方乙收取斡旋金，未告知乙得選擇內政部版要約書；另預售屋銷售人員要求購屋人須先付定金才可攜回契約書審閱。請分析公平交易法責任；若乙因未締約請求返還斡旋金遭拒，是否同屬公平法問題？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依公平交易法<span class=\"art\">第25條</span>，事業不得為其他足以影響交易秩序之欺罔或顯失公平之行為。斡旋金與要約書之告知、預售屋契約審閱，是公平會對不動產交易行為之管制重點；但單純契約糾紛不屬公平法範圍，應循民事程序解決。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第25條</span><span class=\"lawn\">（欺罔或顯失公平之概括規定）</span></span><span class=\"evli\"><span class=\"art\">第42條</span></span><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條</span><span class=\"lawn\">（應由經紀人簽章之文件）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲未告知要約書</p><p>仲介向買方收取斡旋金前，應以書面告知買方得選擇支付斡旋金或採用內政部版要約書及其替代關係，並以書面明定交付斡旋金之目的與權利義務。甲故意未告知而構成欺罔，且足以影響交易秩序，違反公平交易法<span class=\"art\">第25條</span>，而非<span class=\"art\">第21條</span>、<span class=\"art\">第22條</span>或<span class=\"art\">第23條</span>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙誤以為支付斡旋金是唯一出價方式。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>隱匿替代選擇，使買方無從比較。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）預售屋先付定金始可審閱</p><p>要求購屋人須先給付定金或一定費用才提供契約書攜回審閱，屬<span class=\"art\">第25條</span>之顯失公平行為，不是<span class=\"art\">第20條</span>，也不是<span class=\"art\">第21條</span>之不實廣告。</p><p class=\"evx\"><span class=\"evt\">例</span><span>購屋人未付定金即無法帶回契約檢視條款。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以金錢綁住購屋人，剝奪其締約前審閱機會。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）行政責任</p><p>依<span class=\"art\">第42條</span>，違反<span class=\"art\">第25條</span>者，主管機關得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣五萬元以上二千五百萬元以下罰鍰；屆期仍不改正者，得按次處新臺幣十萬元以上五千萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保交易秩序。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）拒還斡旋金</p><p>收取斡旋金後因未締約而拒絕返還，屬一般契約爭議，不構成<span class=\"art\">第25條</span>，也不屬公平法適用範圍，應走民事程序。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙出價未成交，甲拒還斡旋金。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>公平法管交易秩序，不管個別債務履行。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）簽章文件</p><p>依不動產經紀業管理條例<span class=\"art\">第22條</span>，要約書、定金收據、廣告稿屬經紀業應指派經紀人簽章之文件。</p></div>", "<span class=\"blk-l\">四、結論</span><p>甲收取斡旋金未告知乙得選擇內政部版要約書，及預售屋要求先付定金始提供契約審閱，均屬足以影響交易秩序之欺罔或顯失公平行為，違反公平交易法<span class=\"art\">第25條</span>，得依<span class=\"art\">第42條</span>限期改正並處罰鍰。乙因未締約請求返還斡旋金遭拒，則屬民事爭議，非公平法問題。</p>"], "ck": [{"x": "§25：除本法另有規定外，事業不得為其他足以影響交易秩序之欺罔或顯失公平之行為", "h": false}, {"x": "收斡旋金前未以書面告知得選擇內政部版要約書及其替代關係＝欺罔", "h": false}, {"x": "§22Ⅰ：承購要約書、定金收據、廣告稿等六類文件應由經紀業指派經紀人簽章（第 1、2 款代銷不適用）", "h": false}, {"x": "須先付定金才給契約書攜回審閱＝顯失公平（非欺罔類型）", "h": false}, {"x": "兩種行為都引 §25；誤引 §21、§23（或 §20）即失分", "h": true}, {"x": "違反 §25 僅生行政責任（限期停止、改正、罰鍰），作答不可主張刑事責任", "h": true}, {"x": "斡旋金返還糾紛屬個別契約爭議，不具足以影響交易秩序之性質", "h": true}, {"x": "返還糾紛非公平法問題，應走民事程序", "h": false}], "mn": "斡旋先告知要約，審閱不收費；返還吵架走民事"}, {"id": "es-fw02", "no": "範文02★", "t": "108年申論一｜消保法企業經營者定義、商品服務安全性責任、回收義務及懲罰性賠償金", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "消費者保護法", "q": "消費者保護法所規範之「企業經營者」之定義為何？而企業經營者從事不動產交易應負該法第 7 條所規定之商品及服務責任，請詳述該條所規定之商品或服務責任之構成要件及損害賠償為何？若消費者依商品或服務責任提出訴訟時，得請求該法第 51 條懲罰性賠償金，請詳述該規定為何？另詳述依該法第 10 條，於何情形下，企業經營者有回收義務？（25 分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>依消保法<span class=\"art\">第2條第2款</span>，企業經營者指以設計、生產、製造、輸入、經銷商品或提供服務為營業者；其應負<span class=\"art\">第7條</span>商品服務責任、<span class=\"art\">第10條</span>回收義務，並受<span class=\"art\">第51條</span>懲罰性賠償金之規範。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第2條第2款</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第7條</span><span class=\"lawn\">（商品服務安全性責任）</span></span><span class=\"evli\"><span class=\"art\">第7條之1</span></span><span class=\"evli\"><span class=\"art\">第10條</span><span class=\"lawn\">（回收義務）</span></span><span class=\"evli\"><span class=\"art\">第10條之1</span></span><span class=\"evli\"><span class=\"art\">第51條</span><span class=\"lawn\">（懲罰性賠償金）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）企業經營者</p><p>依<span class=\"art\">第2條第2款</span>，指以設計、生產、製造、輸入、經銷商品或提供服務為營業者。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商銷售房屋、仲介提供仲介服務，都是企業經營者。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）商品服務責任</p><p>1.依<span class=\"art\">第7條第1項</span>，從事設計、生產、製造商品或提供服務之企業經營者，於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性。2.依第2項，有危害消費者生命、身體、健康、財產之可能者，應於明顯處為警告標示及緊急處理危險之方法。3.依第3項，違反前二項致生損害於消費者或第三人時，應負連帶賠償責任；但企業經營者能證明其無過失者，法院得減輕其賠償責任。4.依<span class=\"art\">第10條之1</span>，此責任不得預先約定限制或免除。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商交付之房屋因鋼筋外露致住戶受傷，消費者不必證明建商有過失。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>採無過失責任，減輕消費者舉證負擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）懲罰性賠償金</p><p>依<span class=\"art\">第51條</span>，依本法所提之訴訟，因企業經營者之故意所致之損害，得請求損害額五倍以下；重大過失三倍以下；過失一倍以下之懲罰性賠償金。</p></div><div class=\"evp\"><p class=\"evh\">（四）回收義務</p><p>依<span class=\"art\">第10條第1項</span>，企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，應即回收該批商品或停止其服務；但企業經營者所為必要之處理，足以除去其危害者，不在此限。依同條第2項，商品或服務有危害消費者生命、身體、健康或財產之虞，而未於明顯處為警告標示，並附載危險之緊急處理方法者，準用前項規定。</p></div>", "<span class=\"blk-l\">四、結論</span><p>企業經營者指以設計、生產、製造、輸入、經銷商品或提供服務為營業者；應確保商品或服務符合可合理期待之安全性並為警告標示，違反致損害負連帶賠償責任，能證明無過失者法院得減輕；消費者並得請求懲罰性賠償金（故意五倍、重大過失三倍、過失一倍以下）；有危害安全與健康之虞時應即回收或停止服務。</p>"], "ck": [{"x": "§2②：企業經營者＝以設計、生產、製造、輸入、經銷商品或提供服務為營業者", "h": false}, {"x": "§7 用的是「安全與健康」、§10Ⅰ是「危害安全與健康之虞應即回收」——不要沿用舊條文的「事先標示於容器包裝」「主管機関限期回收」", "h": true}, {"x": "§7Ⅰ：應確保符合當時科技或專業水準可合理期待之安全性", "h": false}, {"x": "§7Ⅱ：有危害可能者，應於明顯處為警告標示及緊急處理危險之方法", "h": true}, {"x": "§7Ⅲ：違反致生損害負連帶賠償責任；證明無過失僅「得減輕」，不是免責", "h": true}, {"x": "§7之1：主張符合安全性者自負舉證責任；§10之1：責任不得預先約定限制或免除", "h": false}, {"x": "§51：故意 5 倍、重大過失 3 倍、過失 1 倍，順序不可顛倒，且都是「以下」", "h": true}, {"x": "§10Ⅰ：有事實足認有危害安全與健康之虞應即回收或停止服務；但必要處理足以除去危害者除外", "h": true}, {"x": "§10Ⅰ 用字是「安全與健康」，§10Ⅱ 才是「生命、身體、健康或財產」，依條文用字作答", "h": false}], "mn": "故五、重三、過一；無過失只「得減輕」，不得預先免除", "hp": 1021, "hpl": "中"}, {"id": "es-fw07", "no": "範文07", "t": "99年申論一｜消保法消費爭議調解委員會調解方案及異議規定", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "消費者保護法", "q": "對於消費爭議調解委員會提出調解方案及調解方案之異議，消費者保護法有何規定？試說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依消保法<span class=\"art\">第45條之2第1項</span>，消費爭議之調解，當事人雖未能合意但已甚接近時，由調解委員提出方案，降低訟累。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第45條之2</span><span class=\"lawn\">（一般消費爭議之職權方案）</span></span><span class=\"evli\"><span class=\"art\">第45條之3</span><span class=\"lawn\">（一般方案之異議期間與效果）</span></span><span class=\"evli\"><span class=\"art\">第45條之4</span><span class=\"lawn\">（小額消費爭議之職權方案）</span></span><span class=\"evli\"><span class=\"art\">第45條之5</span><span class=\"lawn\">（小額方案之異議期間與效果）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）一般消費爭議之職權方案</p><p>依<span class=\"art\">第45條之2</span>，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。此方案應經參與調解委員過半數之同意。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方要求退款20萬元、建商只肯退15萬元，委員提出退18萬元之方案。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第45條之2第1項</span>以「當事人不能合意但已甚接近」為要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）一般消費爭議之異議</p><p>依<span class=\"art\">第45條之3</span>，當事人對於前條方案，得於送達後十日之不變期間內，提出異議；未於期間內提出異議者，視為已依該方案成立調解；提出異議者，視為調解不成立。</p></div><div class=\"evp\"><p class=\"evh\">（三）小額消費爭議之特別規定</p><p>依<span class=\"art\">第45條之4</span>，當事人之一方無正當理由，不於調解期日到場者，調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人；此方案應經全體調解委員過半數之同意。依<span class=\"art\">第45條之5</span>，當事人得於送達後十日之不變期間內提出異議；未提出者，視為已依該方案成立調解；於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，亦視為依該方案成立調解。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第45條之4第1項</span>以當事人之一方無正當理由不於調解期日到場為要件，且其送達不適用公示送達（同條第3項）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>一般消費爭議之職權方案須經參與調解委員過半數同意，小額消費爭議一造不到場時須經全體調解委員過半數同意；當事人得於送達後十日不變期間內異議，未異議者視為依方案成立調解；一般爭議異議者視為不成立，小額爭議異議後另定期日仍無故不到場者，亦視為成立。</p>"], "ck": [{"x": "§45之2Ⅰ：不能合意但已甚接近，於不違反兩造主要意思範圍內依職權提出方案並送達", "h": false}, {"x": "§45之2Ⅱ：一般爭議須經「參與調解委員」過半數同意", "h": true}, {"x": "§45之4Ⅰ、Ⅱ：小額爭議一造無正當理由不到場，須經「全體調解委員」過半數同意", "h": true}, {"x": "§45之4Ⅲ、Ⅳ：送達不適用公示送達；小額額度由行政院定之", "h": false}, {"x": "§45之3Ⅰ：送達後 10 日之不變期間內得提出異議", "h": false}, {"x": "§45之3Ⅱ：異議→視為調解不成立；未異議→視為已依該方案成立調解", "h": true}, {"x": "§45之3Ⅲ：異議應由消費爭議調解委員會通知他方當事人", "h": false}, {"x": "§45之5Ⅱ：小額爭議異議後經另定期日無正當理由不到場，仍視為依方案成立調解", "h": false}], "mn": "一般看參與過半、小額看全體過半；送達十日不變期間，不異議就成立"}, {"id": "es-fw24", "no": "範文24", "t": "109年申論一｜消保法規範不動產廣告主要規範內容", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "消費者保護法", "q": "試根據消費者保護法，說明不動產廣告的主要規範內容為何。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>依消保法施行細則<span class=\"art\">第23條</span>，廣告指利用電視、廣播、報紙、傳單、海報、招牌、電腦或其他方法，可使多數人知悉其宣傳內容之傳播；不動產廣告即受消保法<span class=\"art\">第22條</span>至<span class=\"art\">第23條</span>規範。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第22條</span><span class=\"lawn\">（廣告真實義務）</span></span><span class=\"evli\"><span class=\"art\">第22條之1</span><span class=\"lawn\">（與信用有關交易之揭露）</span></span><span class=\"evli\"><span class=\"art\">第23條</span><span class=\"lawn\">（媒體經營者之連帶責任）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）廣告真實義務</p><p>依<span class=\"art\">第22條</span>，企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容；企業經營者之商品或服務廣告內容，於契約成立後，應確實履行。</p><p class=\"evx\"><span class=\"evt\">例</span><span>廣告寫「附贈車位」，契約未寫，建商仍須履行。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>廣告內容等同契約最低標準，避免先誇大招攬、事後不認帳。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）信用交易之總費用年百分率</p><p>依<span class=\"art\">第22條之1</span>，企業經營者對消費者從事與信用有關之交易時，應於廣告上明示應付所有總費用之年百分率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商自行提供購屋貸款或分期融資，並於廣告強調「每月只付1萬元」者，屬與信用有關之交易，須於廣告明示應付所有總費用之年百分率。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免消費者只看到分期表面金額，低估實際負擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）媒體經營者連帶責任</p><p>依<span class=\"art\">第23條</span>，刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>報社明知建案根本沒有捷運站卻仍刊登「近捷運」廣告。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>媒體經營者明知或可得而知廣告內容與事實不符者，始與企業經營者負連帶責任，且此責任不得預先約定限制或拋棄。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>消保法規範不動產廣告，核心在企業經營者應確保廣告真實、所負義務不得低於廣告內容、契約成立後確實履行；與信用有關之交易應於廣告明示總費用年百分率；媒體經營者明知或可得而知廣告不實仍刊登者，與企業經營者負連帶責任。經紀業刊登廣告應嚴格遵守。</p>"], "ck": [{"x": "§22Ⅰ：應確保廣告內容之真實，對消費者所負義務不得低於廣告之內容", "h": false}, {"x": "§22Ⅱ：商品或服務廣告內容於契約成立後應確實履行", "h": true}, {"x": "§22-1Ⅰ：與信用有關之交易應於廣告上明示應付所有總費用之年百分率", "h": false}, {"x": "年百分率之總費用範圍及計算方式，由各目的事業主管機關定之（§22-1Ⅱ）", "h": false}, {"x": "§23Ⅰ：媒體經營者「明知或可得而知」不符事實，始與企業經營者負連帶責任", "h": true}, {"x": "§23Ⅱ：該損害賠償責任不得預先約定限制或拋棄", "h": false}, {"x": "三層都要寫：真實義務（含契約成立後履行）、信用交易揭露義務、媒體連帶責任", "h": false}], "mn": "真實不得低於廣告、簽約後要履行；信用交易報年百分率；媒體明知或可得而知即連帶", "hp": 8, "hpl": "高"}, {"id": "es-fw29", "no": "範文29", "t": "112年申論一｜建商泳池廣告不實，乙如何主張權利", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "消費者保護法", "q": "建商甲在銷售建案時，於廣告文宣文字說明該建案公共設施中含有泳池等設備，並使用某飯店之無邊際泳池圖片，乙受廣告吸引購買該建案其中一戶，但完工交屋時，乙發現只有一個景觀水池，並無廣告中之泳池。請問乙如何主張其權利？請就公平交易法相關規定說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>公平交易法對不實廣告除課行政責任外，並賦予受害者排除侵害、損害賠償及懲罰性賠償之民事救濟，</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第21條第1項</span>、第2項<span class=\"lawn\">（虛偽不實或引人錯誤之表示）</span></span><span class=\"evli\"><span class=\"art\">第29條</span><span class=\"lawn\">（侵害排除與防止請求權）</span></span><span class=\"evli\"><span class=\"art\">第30條</span><span class=\"lawn\">（損害賠償責任）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項</span><span class=\"lawn\">（懲罰性賠償金）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）廣告是否不實</p><p>依<span class=\"art\">第21條第1項</span>、第2項，事業不得在商品或廣告上，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵；所稱事項包括商品之內容。甲以他飯店無邊際泳池圖片代表自身建案公設，交屋時只有景觀水池，屬對商品內容之虛偽不實表示，足以影響乙的購屋決定。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>公設項目是購屋重要考量。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得主張之權利</p><p><span class=\"evli\">①依<span class=\"art\">第29條</span>，事業違反本法規定，致侵害他人權益者，被害人得請求除去之；有侵害之虞者，並得請求防止之。</span><span class=\"evli\">②依<span class=\"art\">第30條</span>，事業違反本法規定，致侵害他人權益者，應負損害賠償責任。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>乙可請求因公設不符而貶損之房屋價值。③依<span class=\"art\">第31條第1項</span>，法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之三倍。甲使用他人泳池圖片代表自身公設，若證明出於故意，乙得請求最高三倍之賠償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>故意不實廣告須以加重賠償嚇阻。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲以他飯店泳池圖片宣傳實際上沒有泳池之建案，違反公平交易法<span class=\"art\">第21條</span>；乙得依<span class=\"art\">第29條</span>請求除去侵害、依<span class=\"art\">第30條</span>請求損害賠償，並於證明甲為故意時，依<span class=\"art\">第31條</span>請求法院酌定不超過已證明損害額三倍之賠償。</p>"], "ck": [{"x": "§21Ⅰ、Ⅱ：對足以影響交易決定之事項為虛偽不實或引人錯誤之表示；該事項包括「商品之內容」", "h": true}, {"x": "以他飯店無邊際泳池圖片表示自身建案公共設施，實際僅景觀水池＝商品內容不實", "h": false}, {"x": "§29：被害人得請求除去侵害；有侵害之虞者，並得請求防止", "h": true}, {"x": "§30：事業違反本法致侵害他人權益者，應負損害賠償責任", "h": false}, {"x": "§31Ⅰ：事業故意者，法院得酌定損害額以上之賠償，但不得超過已證明損害額之 3 倍", "h": true}, {"x": "§31 須以乙之請求與甲之故意為前提，並由法院酌定，不是當然請求 3 倍", "h": false}, {"x": "三項救濟要寫齊：除去與防止（§29）、損害賠償（§30）、故意加重（§31），只寫賠償會失分", "h": false}], "mn": "先認 §21（商品內容），再打三張牌：除去防止（§29）、賠償（§30）、故意三倍（§31）", "hp": 9, "hpl": "高"}, {"id": "es-fw32", "no": "範文32", "t": "114年申論一｜消保法申訴流程、得否逕行申請調解及調解書效力", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "消費者保護法", "q": "消費者向建商購買預售屋，因銀行核貸之借款金額不足，希望解除買賣契約及返還定金，致與建商發生消費爭議。試依消費者保護法規定說明：消費者就消費爭議如何提起申訴？得否不經申訴，逕行申請調解？消費爭議事件調解成立作成之調解書，經法院核定後，有何效力？（25 分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>消保法就消費爭議設「申訴→調解→訴訟」循序處理機制，依<span class=\"art\">第43條</span>、<span class=\"art\">第44條</span>，須先申訴，未獲妥適處理始得申請調解。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第43條</span><span class=\"lawn\">（消費爭議之申訴）</span></span><span class=\"evli\"><span class=\"art\">第44條</span><span class=\"lawn\">（申訴未獲妥適處理→申請調解）</span></span><span class=\"evli\"><span class=\"art\">第46條</span><span class=\"lawn\">（調解書之效力）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）如何申訴</p><p>依<span class=\"art\">第43條第1項</span>，消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。依第2項，企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。依第3項，未獲妥適處理時，得向直轄市、縣（市）政府消費者保護官申訴。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方先向建商客服申訴解約退定金，建商15日內未妥善處理，可再向縣市消保官申訴。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>先讓企業自行處理，再由行政機關介入。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得否逕行申請調解</p><p>依<span class=\"art\">第44條</span>，消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。故須先申訴且未獲妥適處理，不得跳過申訴逕行申請調解。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>讓企業經營者有先處理之機會，避免調解資源被不必要的案件占用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）調解書之效力</p><p>依<span class=\"art\">第46條</span>，調解成立者應作成調解書；調解書之作成及效力，準用鄉鎮市調解條例<span class=\"art\">第25條</span>至<span class=\"art\">第29條</span>，即經法院核定後，與民事確定判決有同一之效力。</p><p class=\"evx\"><span class=\"evt\">例</span><span>調解書約定建商退還定金，建商不履行，買方可持核定之調解書聲請強制執行。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使調解結果具有最終拘束力與執行力。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>消費者應先向建商、消保團體或消費者服務中心申訴，建商應於15日內妥適處理，未獲妥適處理得向消保官申訴；不得跳過申訴逕行申請調解；調解成立之調解書經法院核定後，與民事確定判決有同一之效力，得據以強制執行。</p>"], "ck": [{"x": "§43Ⅰ：得向企業經營者、消費者保護團體、消費者服務中心或其分中心申訴（三管道）", "h": true}, {"x": "§43Ⅱ：企業經營者應於申訴之日起 15 日內妥適處理", "h": false}, {"x": "§43Ⅲ：未獲妥適處理，得向直轄市、縣（市）政府消費者保護官申訴（第二次申訴）", "h": false}, {"x": "§44：申訴未能獲得妥適處理，始得向直轄市或縣（市）消費爭議調解委員會申請調解", "h": false}, {"x": "不得跳過申訴逕行申請調解——申訴是申請調解的前提要件", "h": true}, {"x": "§46：調解成立應作成調解書；作成及效力準用鄉鎮市調解條例第 25 條至第 29 條", "h": false}, {"x": "調解書經法院核定後，與民事確定判決有同一之效力（既判力＋執行力）", "h": false}, {"x": "得逕以調解書為執行名義聲請強制執行，無須另行提起訴訟", "h": false}], "mn": "先申訴（三管道、15 日）→ 未妥處才調解 → 核定調解書＝確定判決"}, {"id": "es-mk2", "no": "模二", "t": "模擬試題｜應記載／不得記載事項之內容、違反效力與顯失公平認定", "lv": "補習班模擬卷", "k": "mock", "tier": 3, "g": "消費者保護法", "q": "甲向乙建商購買預售屋，簽約後發現部分契約條款疑似違反中央主管機關公告之定型化契約規範。試問：依消費者保護法規定，定型化契約應記載或不得記載事項，其內容得包括哪些？如契約違反中央主管機關公告之不得記載事項，其效力如何？又條款如何認定顯失公平？試說明之。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>定型化契約條款，指企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款。中央主管機關得選擇特定行業，擬訂其應記載或不得記載事項，報請行政院核定後公告，以促進定型化契約之公平化。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第2條第7款</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第12條</span><span class=\"lawn\">（定型化契約條款之無效）</span></span><span class=\"evli\"><span class=\"art\">第16條</span><span class=\"lawn\">（契約一部無效之效力）</span></span><span class=\"evli\"><span class=\"art\">第17條</span><span class=\"lawn\">（應記載及不得記載事項）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應記載與不得記載事項之內容</p><p>依<span class=\"art\">第17條第2項</span>，應記載事項得包括：<span class=\"evli\">①契約之重要權利義務事項；</span><span class=\"evli\">②違反契約之法律效果；</span><span class=\"evli\">③預付型交易之履約擔保；</span><span class=\"evli\">④契約之解除權、終止權及其法律效果；</span><span class=\"evli\">⑤其他與契約履行有關之事項。依<span class=\"art\">第17條第3項</span>，不得記載事項得包括：</span><span class=\"evli\">①企業經營者保留契約內容或期限之變更權或解釋權；</span><span class=\"evli\">②限制或免除企業經營者之義務或責任；</span><span class=\"evli\">③限制或剝奪消費者行使權利，加重消費者之義務或責任；</span><span class=\"evli\">④其他對消費者顯失公平事項。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋買賣已有內政部公告之應記載及不得記載事項。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第17條第1項</span>明定其目的為預防消費糾紛，保護消費者權益，促進定型化契約之公平化。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）違反之效力</p><p>依<span class=\"art\">第17條第4項</span>，違反公告之定型化契約，其條款無效，不待甲主張；契約效力依<span class=\"art\">第16條</span>，除去該部分契約亦可成立者，其他部分仍有效，但對當事人之一方顯失公平者，該契約全部無效。依<span class=\"art\">第17條第5項</span>，應記載事項雖未記載，仍構成契約之內容。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙保留解釋權之條款無效；漏載應記載事項，仍拘束乙。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第17條第5項</span>明定應記載事項雖未記載，仍構成契約之內容。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）顯失公平之認定</p><p>依<span class=\"art\">第12條第1項</span>，條款違反誠信原則，對消費者顯失公平者，無效；是否顯失公平，應斟酌契約之性質、締約目的、全部條款內容、交易習慣及其他情事判斷之（施行細則<span class=\"art\">第13條</span>）；依同條第2項，有下列情形之一者推定顯失公平：<span class=\"evli\">①違反平等互惠原則；</span><span class=\"evli\">②條款與其所排除不予適用之任意規定之立法意旨顯相矛盾；</span><span class=\"evli\">③契約之主要權利或義務，因受條款之限制，致契約之目的難以達成。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>條款單方免除乙之責任，可推定違反平等互惠原則。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>減輕消費者舉證負擔，但推定可舉反證推翻。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>應記載事項之內容得包括<span class=\"art\">第17條第2項</span>所列五款，不得記載事項得包括同條第3項所列四款。違反不得記載事項者，條款無效，契約其餘部分之效力依<span class=\"art\">第16條</span>；應記載事項雖未記載，仍構成契約內容。另企業經營者經主管機關令限期改正屆期不改正者，依<span class=\"art\">第56條之1</span>處罰鍰。條款是否顯失公平依<span class=\"art\">第12條</span>判斷：違反誠信原則、對消費者顯失公平者無效，有三款情形之一者推定顯失公平。</p>"], "ck": [{"x": "§17Ⅰ：中央主管機關擬訂 → 報請行政院核定 → 公告", "h": false}, {"x": "§17Ⅱ 應記載五款、§17Ⅲ 不得記載四款", "h": false}, {"x": "§17Ⅳ 違反不得記載事項 → 該條款無效，不待消費者主張", "h": true}, {"x": "§17Ⅴ 應記載事項雖未記載 → 仍構成契約之內容（方向相反，勿對調）", "h": true}, {"x": "§16：除去無效部分契約亦可成立者其餘有效；但對一方顯失公平者全部無效", "h": false}, {"x": "§56-1：先令限期改正，屆期不改 3–30 萬；再次不改 5–50 萬並按次處罰", "h": true}, {"x": "§12Ⅰ：違反誠信原則且對消費者顯失公平者無效", "h": false}, {"x": "§12Ⅱ 三款：平等互惠／任意規定立法意旨顯相矛盾／契約目的難以達成", "h": false}, {"x": "§12Ⅱ 是「推定」不是「視為」，得舉反證推翻", "h": true}], "mn": "擬訂報核才公告；不得記載條款無效、應記載漏寫仍算數；顯失公平三款推定，推定可翻、視為不可"}, {"id": "es-h1", "no": "H1", "t": "通訊交易與訪問交易的解除權", "lv": "預測", "k": "pred", "tier": 3, "g": "消費者保護法", "q": "消費者以網路購物，收到商品後想退貨，法律怎麼規定？企業經營者何時應退款？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依消費者保護法<span class=\"art\">第2條第10款</span>，通訊交易指消費者於未能檢視商品或服務下，以網際網路等方法與企業經營者訂立之契約；依同條第11款，訪問交易指企業經營者未經邀約而與消費者在其住居所等場所訂立之契約。兩者之消費者依<span class=\"art\">第19條</span>享有七日解除權，<span class=\"art\">第19條之2</span>並明定企業經營者取回商品與返還價款之期限。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第19條</span><span class=\"lawn\">（通訊交易／訪問交易之七日解除權）</span></span><span class=\"evli\"><span class=\"art\">第19條之2</span><span class=\"lawn\">（解除後之返還期限）</span></span><span class=\"evli\"><span class=\"art\">第20條</span><span class=\"lawn\">（未經訂購而寄送商品）</span></span><span class=\"evli\"><span class=\"art\">第21條</span><span class=\"lawn\">（分期付款契約應載事項）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）七日解除權</p><p>依<span class=\"art\">第19條第1項</span>，通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價；但通訊交易有行政院所定合理例外情事者，不在此限。依同條第3項，企業經營者未提供解除契約相關資訊者，七日期間自提供之次日起算，但自原七日期間起算已逾四個月者，解除權消滅；依同條第4項，於期間內已交運商品或發出書面者，契約視為解除；違反本條之約定無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>網購收貨後第五天寄回商品，契約即視為解除。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第2條第10款</span>，通訊交易係消費者於未能檢視商品或服務下所訂立之契約。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）退款期限</p><p>依<span class=\"art\">第19條之2</span>，以書面通知解除者，企業經營者應於收到通知之次日起十五日內取回商品；並應於取回商品、收到退回商品或解除服務契約通知之次日起十五日內，返還消費者已支付之對價。</p><p class=\"evx\"><span class=\"evt\">例</span><span>企業經營者收到退回商品後，十五日內應退款。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免拖延退款。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）未經要約寄送商品</p><p>依<span class=\"art\">第20條</span>，未經消費者要約而郵寄或投遞之商品，消費者不負保管義務；寄送後逾一個月未經消費者表示承諾，而仍不取回者，視為拋棄。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>消費者不應被強迫交易。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）分期付款</p><p>依<span class=\"art\">第21條</span>，分期付款買賣契約應以書面載明頭期款、總價款與現金交易價格之差額、利率；未載利率者，按現金交易價格週年利率百分之五計算。</p></div>", "<span class=\"blk-l\">四、結論</span><p>網路購物係消費者於未能檢視商品下以網際網路與企業經營者訂立之契約，依<span class=\"art\">第2條第10款</span>屬通訊交易，消費者得於收受商品後七日內，以退回商品或書面通知解除契約，無須說明理由及負擔費用；未受告知解除資訊者，自提供之次日起算，但最遲逾四個月消滅。企業經營者應於取回商品、收到退回商品或解除通知之次日起十五日內退款。</p>"], "ck": [{"x": "§19Ⅰ：收受商品或接受服務後七日內，以退回商品或書面通知解除，無須說明理由及負擔任何費用或對價", "h": true}, {"x": "§19Ⅲ：未提供解約資訊者，七日自提供之次日起算；自原七日期間起算逾四個月解除權消滅", "h": false}, {"x": "§19Ⅳ、Ⅴ：期間內已交運商品或發出書面即視為解除；違反本條之約定無效", "h": false}, {"x": "§19-2Ⅰ：企業經營者應於收到書面解約通知之次日起十五日內至原交付處所或約定處所取回商品", "h": false}, {"x": "§19-2Ⅱ：取回商品、收到退回商品或收到解除服務契約通知之次日起十五日內返還已支付之對價", "h": true}, {"x": "7 日（解除）與 15 日（取回、退款）不可互換；猶豫期依據是 §19，不是定型化契約的條號 14", "h": true}, {"x": "§20：未經要約寄送之商品不負保管義務，寄送後逾一個月未承諾且未取回視為拋棄", "h": false}, {"x": "§21：分期付款契約未載利率者按現金交易價格週年利率百分之五計算", "h": false}], "mn": "七解十五還；沒訂購的東西擺一個月就當人家拋棄"}, {"id": "es-h2", "no": "H2", "t": "定型化契約的審閱與顯失公平", "lv": "預測", "k": "pred", "tier": 3, "g": "消費者保護法", "q": "企業經營者與消費者訂定型化契約，應給予多久的審閱期間？哪些條款推定顯失公平？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依消保法<span class=\"art\">第2條第7款</span>、第9款，定型化契約係以企業經營者為與多數消費者訂立同類契約之用所提出預先擬定之契約條款，作為契約內容之全部或一部而訂立之契約。消費者保護法以審閱期間與顯失公平條款無效之機制，保障締約公平。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第11條之1</span><span class=\"lawn\">（契約審閱期）</span></span><span class=\"evli\"><span class=\"art\">第12條</span><span class=\"lawn\">（定型化契約條款之無效）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）審閱期間</p><p>依<span class=\"art\">第11條之1第1項</span>，企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容；三十日是母法上限，非固定審閱期，實際期間依<span class=\"art\">第11條之1第4項</span>，由中央主管機關就特定行業公告，例如預售屋買賣、成屋買賣5日，不動產委託銷售、住宅租賃3日。依同條第2項，以定型化契約條款使消費者拋棄審閱權利者，無效；依第3項，違反審閱期規定者，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商當場要求簽約並約定放棄審閱期，該約定無效。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使消費者有充分時間了解條款。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）顯失公平無效</p><p>依<span class=\"art\">第12條第1項</span>，定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>條款單方免除企業經營者責任。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免企業經營者利用優勢地位。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）推定顯失公平</p><p>依<span class=\"art\">第12條第2項</span>，條款有下列情形之一者，推定其顯失公平：<span class=\"evli\">①違反平等互惠原則者；</span><span class=\"evli\">②條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者；</span><span class=\"evli\">③契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>減輕消費者之舉證負擔。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>企業經營者應於訂約前給予三十日以內之合理審閱期間，實際依各行業公告；違反者條款不構成契約內容，但消費者得主張仍構成。違反平等互惠原則、與所排除任意規定之立法意旨顯相矛盾、主要權利義務受限致契約目的難以達成三種情形，推定顯失公平，條款無效。</p>"], "ck": [{"x": "§11之1Ⅰ：訂約前應有三十日「以內」之合理期間供消費者審閱全部條款", "h": true}, {"x": "30 日是上限，不是固定審閱期；實際日數依各行業公告（委託銷售契約 3 日〔官方題口徑，公告逐字待查〕）", "h": false}, {"x": "§11之1Ⅱ：以契約條款使消費者拋棄審閱權者，無效", "h": false}, {"x": "§11之1Ⅲ：違反審閱期規定者，其條款不構成契約內容；但消費者得主張仍構成契約內容", "h": false}, {"x": "§12Ⅰ：違反誠信原則、對消費者顯失公平之條款無效", "h": false}, {"x": "§12Ⅱ 三款：違反平等互惠、與所排除任意規定立法意旨顯相矛盾、主要權利義務受限致契約目的難達成", "h": false}, {"x": "§12Ⅱ 是「推定」顯失公平（舉證責任轉換），漏寫「推定」二字會失分", "h": true}], "mn": "三十日以內是天花板；拋棄無效、沒給不算條款；三款推定：互惠、矛盾、目的落空", "hp": 1023, "hpl": "中"}, {"id": "es-h3", "no": "H3", "t": "消保團體訴訟與懲罰性賠償金", "lv": "預測", "k": "pred", "tier": 3, "g": "消費者保護法", "q": "消費者保護團體可以怎麼代消費者打官司？企業經營者的懲罰性賠償金如何計算？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>消費者保護團體訴訟，使分散之小額損害得以集中救濟；懲罰性賠償金則依企業經營者之過錯程度分級計算。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第49條</span><span class=\"lawn\">（消保團體訴訟之資格）</span></span><span class=\"evli\"><span class=\"art\">第50條</span><span class=\"lawn\">（消保團體受讓請求權之訴訟）</span></span><span class=\"evli\"><span class=\"art\">第51條</span><span class=\"lawn\">（懲罰性賠償金）</span></span><span class=\"evli\"><span class=\"art\">第52條</span><span class=\"lawn\">（裁判費之減免）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）團體資格</p><p>依<span class=\"art\">第49條</span>，消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良者，得以自己之名義，提起<span class=\"art\">第50條</span>消費者損害賠償訴訟或不作為訴訟；並應委任律師代理訴訟。</p><p class=\"evx\"><span class=\"evt\">例</span><span>剛設立一年之團體，不得提起。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保團體具備訴訟能力。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）受讓請求權起訴</p><p>依<span class=\"art\">第50條</span>，對於同一之原因事件致眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義提起訴訟；消費者得於言詞辯論終結前終止讓與，致人數不足二十人者，不影響其實施訴訟之權能；時效利益依讓與之消費者單獨個別計算；賠償扣除必要費用後交付消費者，且不得向消費者請求報酬。</p><p class=\"evx\"><span class=\"evt\">例</span><span>同一建案三十戶受害，團體受讓後起訴，其中十五戶終止讓與，訴訟仍得進行。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>集中處理小額損害。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）裁判費減免</p><p>依<span class=\"art\">第52條</span>，以自己名義提起<span class=\"art\">第50條</span>訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>降低訴訟成本。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）懲罰性賠償金</p><p>依<span class=\"art\">第51條</span>，依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；重大過失三倍以下；過失一倍以下。</p><p class=\"evx\"><span class=\"evt\">例</span><span>損害額10萬元，企業經營者故意者，最多請求50萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依過錯程度加重責任。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>消費者保護團體須許可設立二年以上、置專門人員並經行政院評定優良，受讓二十人以上損害賠償請求權後以自己名義起訴，標的價額超過六十萬元部分免繳裁判費。懲罰性賠償金依故意、重大過失、過失，分別為損害額五倍、三倍、一倍以下。</p>"], "ck": [{"x": "§49Ⅰ：許可設立 2 年以上、置有消費者保護專門人員、經行政院評定優良（不是 3 年）", "h": true}, {"x": "§49Ⅱ：消保團體提起訴訟應委任律師代理", "h": false}, {"x": "§50Ⅰ：同一原因事件，受讓 20 人以上消費者損害賠償請求權，以自己名義起訴", "h": true}, {"x": "§50Ⅱ：事後終止讓與致不足 20 人，不影響實施訴訟之權能", "h": false}, {"x": "§50Ⅴ、Ⅵ：扣除訴訟及律師必要費用後交付消費者，不得向消費者請求報酬", "h": false}, {"x": "§52：標的價額超過新臺幣 60 萬元者，「超過部分」免繳裁判費（非全免）", "h": false}, {" function stat(id){

  var last=S[0]||null;
  return {n:(L.n||0), sp:S.length, v:L.v||0, last:last, read:!!R, t:Math.max(L.t||0,last?last.t:0)};
}
function order(){
  var arr=CARDS.map(function(c,i){var s=stat(c.id);return {c:c,s:s,i:i}}).filter(function(x){return fpass(x.c,x.s)});
  function kindRank(c){return c.k==='off'?0:(c.k==='pred'?1:2)}
  var fresh=arr.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read});
  var seen=arr.filter(function(x){return x.s.n||x.s.sp||x.s.read});
  function hpR(c){return c.hp==null?9999:c.hp}
  fresh.sort(function(a,b){return hpR(a.c)-hpR(b.c)||kindRank(a.c)-kindRank(b.c)||a.c.tier-b.c.tier||a.i-b.i});
  function vr(v){return v===3?0:(v===2?1:(v===0?2:3))}
  function pct(x){return x.s.last?x.s.last.sc/Math.max(1,x.s.last.mx):-1}
  seen.sort(function(a,b){return vr(a.s.v)-vr(b.s.v)||hpR(a.c)-hpR(b.c)||pct(a)-pct(b)||a.s.t-b.s.t});
  return fresh.concat(seen);
}

  return o.join('');
}

  $('sum').textContent='衝刺過 '+done+'／'+CARDS.length+' 題・共 '+tot+' 次';
  var list=showAll?Q:Q.slice(0,8);
  $('qlist').innerHTML=list.map(function(x){return '<button type="button" class="qi" data-id="'+x.c.id+'"><span class="n">'+esc(x.c.no)+'</span><span class="t">'+esc(x.c.t)+'</span><span class="go">開始 ▸</span><span class="r">'+reason(x)+'</span></button>'}).join('');
  [].forEach.call($('qlist').querySelectorAll('.qi'),function(b){b.onclick=function(){start(b.getAttribute('data-id'))}});
  $('moreBtn').textContent=showAll?'只看前 8 題':'顯示全部 '+Q.length+' 題';
}
$('moreBtn').onclick=function(){showAll=!showAll;home()};
var pick='order';
function randPick(ex){var a=fpool().filter(function(c){return c.id!==ex});if(!a.length)a=CARDS.filter(function(c){return c.id!==ex});return a[Math.floor(Math.random()*a.length)]}
$('startBtn').onclick=function(){pick='order';var o=order();if(!o.length){alert0();return}start(o[0].c.id)};
function alert0(){var f=$('flt');if(f){f.scrollIntoView({block:'start'});f.style.outline='2px solid var(--bad)';setTimeout(function(){f.style.outline=''},1200)}}
$('randBtn').onclick=function(){pick='rand';start(randPick('').id)};

/* ---- 作答 ---- */
var cur=null, st=0, stLeft=0, elapsed=0, iv=null, peek=false;
var SWU='經紀法規_申論5分鐘_推理版.html';
function swGo(id){var u=SWU+(id?'#q='+encodeURIComponent(id):'');$('swTop').href=u;var w=$('swq');if(w)w.innerHTML=id?'<span>同一題換個練法</span><a href="'+u+'">這題改用推理版 ▸</a>':''}
var CARDU='經紀法規_申論卡.html';

/* ---- 存檔後：再練一次／看完整解說／回看本題（11-03） ---- */
function doneExtra(revPages){
  var id=cur.id,b=$('body');
  b.insertAdjacentHTML('beforeend','<div class="dnb"><button type="button" class="btn" id="againBtn">🔁 再練一次</button><a class="btn" href="'+CARDU+'?v=0#'+encodeURIComponent(id)+'" target="_blank" rel="noopener">📖 看完整解說（另開）</a></div>'
    +'<div class="rv"><div class="rvh">回看本題（不計時）</div><div class="rvnav"><button type="button" class="btn" id="rvP">◀ 上一頁</button><select id="rvS" aria-label="跳到哪一頁"></select><button type="button" class="btn" id="rvN">下一頁 ▶</button></div><div id="rvB"></div></div>');
  $('againBtn').onclick=function(){$('nextBtn').onclick=next;$('quitBtn').textContent='放棄這題';start(id)};
  var P=revPages(),i=0;
  $('rvS').innerHTML=P.map(function(p,k){return '<option value="'+k+'">'+(k+1)+'／'+P.length+'　'+esc(p[0])+'</option>'}).join('');
  function go(k){i=Math.max(0,Math.min(P.length-1,k));$('rvS').value=String(i);$('rvB').innerHTML=P[i][1];$('rvP').disabled=i===0;$('rvN').disabled=i===P.length-1}
  $('rvP').onclick=function(){go(i-1)};$('rvN').onclick=function(){go(i+1)};$('rvS').onchange=function(){go(+this.value)};
  go(0);
}
function sprintPages(){
  var rc='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">口訣：<b>'+esc(cur.mn)+'</b></div>':'');
  var ck='<div class="ck">'+cur.ck.map(function(c,i){var g=!!cur.got[i];return '<label class="'+(g?'on':'miss')+'"><span class="mk">'+(g?'✓':'✗')+'</span>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>';
  return [[STG[0].n,'<div class="rvq">'+esc(cur.q)+'</div>'],[STG[1].n,rc],[STG[2].n,evHTML([0,1,2],[],[])],[STG[3].n,evHTML([3],[],[])],[STG[4].n+'（✓ 有勾／✗ 漏掉）',ck],['考場版全文',evHTML([0,1,2,3],[],[])]];
}
function start(id){
  swGo(id);
  setPause(false);
  cur=CARDS.filter(function(c){return c.id===id})[0]; if(!cur)return;
  st=0; stLeft=STG[0].s; elapsed=0; peek=false; cur.got={}; cur.rate=0;
  $('home').hidden=true; $('run').hidden=false; $('act').hidden=false;
  var s=stat(id);
  $('meta').innerHTML='<span>'+esc(cur.no)+'</span><span>'+esc(cur.g)+'</span>'+(cur.lv?'<span>'+esc(cur.lv)+'</span>':'')+'<span>第 '+(s.sp+1)+' 次衝刺'+(s.last?'・上次 '+s.last.sc+'／'+s.last.mx:'')+'</span>';
  $('ttl').textContent=cur.t;
  $('qbox').innerHTML='<div class="qt">'+esc(cur.q)+'</div><span class="nq">本題 '+cur.nq+' 問</span><button type="button" class="qx" id="qx">展開題目</button>';$('qbox').className='qbox';
  $('qx').onclick=function(){var q=$('qbox'),o=q.classList.contains('clamp');q.classList.toggle('clamp',!o);q.classList.toggle('open',o);this.textContent=o?'收起題目':'展開題目'};
  $('mchip').className='modechip '+mode; $('mchip').textContent=mode==='h'?'⚡ 衝刺':'🪑 停留';
  render(); tick(true);
  if(iv)clearInterval(iv); iv=setInterval(function(){tick(false)},1000);
  scrollTo(0,0);
}
function evHTML(show,focus,dim){
  return '<div class="ev">'+cur.b.map(function(h,i){
    if(show.indexOf(i)<0)return '';
    return '<div class="blk b'+(i+1)+(focus.indexOf(i)>=0?' focus':'')+(dim.indexOf(i)>=0?' dim':'')+'">'+h+'</div>'}).join('')+'</div>';
}
function render(){
  var b=$('body'), h='';
  if(st===0){h='<div class="cover">讀完題目，數清楚問幾問。<br>答案在後面，現在先不看。</div>'}
  else if(st===1){h='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">提示口訣（想不出來再看）：<b>'+esc(cur.mn)+'</b></div>':'')}
  else if(st===2){h=evHTML([0,1,2],[2],[])}
  else if(st===3){h=evHTML([0,1,2,3],[3],[0,1,2])}
  else if(st===4){
    var hide=(mode==='h'||!peek);
    h=(hide?'<div class="cover">答案已蓋住。憑記憶勾出你剛剛有想到、考試會寫到的關鍵。'+(mode==='s'?'<br><button type="button" class="btn" id="peekBtn" style="margin-top:8px">偷看一下答案</button>':'')+'</div>':evHTML([0,1,2,3],[],[]))
      +'<div class="ck" id="ck">'+cur.ck.map(function(c,i){return '<label data-i="'+i+'"'+(cur.got[i]?' class="on"':'')+'><input type="checkbox"'+(cur.got[i]?' checked':'')+'>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>'
      +'<div class="score"><span class="big" id="sc"></span><small id="scs"></small></div>'
      +'<div class="rate" id="rate">'+[1,2,3].map(function(v){return '<button type="button" data-v="'+v+'"'+(cur.rate===v?' class="on"':'')+'>'+RL[v]+'</button>'}).join('')+'</div>'
      +'<div class="hist" id="hist"></div>';
  }
  b.innerHTML=h;
  if(st===4){
    var pb=$('peekBtn'); if(pb)pb.onclick=function(){peek=true;render()};
    [].forEach.call(b.querySelectorAll('.ck label'),function(l){var i=+l.getAttribute('data-i'),cb=l.querySelector('input');
      cb.onchange=function(){cur.got[i]=cb.checked;l.classList.toggle('on',cb.checked);score()}});
    [].forEach.call(b.querySelectorAll('#rate button'),function(x){x.onclick=function(){cur.rate=+x.getAttribute('data-v');
      [].forEach.call(b.querySelectorAll('#rate button'),function(y){y.classList.toggle('on',y===x)});paintAct()}});
    score(); hist();
  }
  var qb=$('qbox'); if(!qb.classList.contains('open'))qb.classList.toggle('clamp',st>=2&&st<=4);
  paintStage(); paintAct();
}
function score(){
  var sc=0,mx=cur.ck.length,hm=0,hx=0;cur.ck.forEach(function(c,i){if(cur.got[i])sc++;if(c.h){hx++;if(cur.got[i])hm++}});
  cur.sc=sc;cur.mx=mx;cur.hm=hm;cur.hx=hx;
  $('sc').textContent=sc+'／'+mx;
  $('scs').textContent='關鍵字樣'+(hx?'・必寫 '+hm+'／'+hx:'');
}
function hist(){
  var S=ld(SP)[cur.id]||[];
  $('hist').innerHTML=S.length?'過去衝刺：'+S.slice(0,5).map(function(r){var d=new Date(r.t*1000);return (d.getMonth()+1)+'/'+d.getDate()+' '+r.sc+'／'+r.mx+(r.m==='h'?'⚡':'🪑')}).join('　'):'這題第一次衝刺。';
}
function paintStage(){
  $('stg').innerHTML=STG[st].n+'<small>'+STG[st].d+'</small>';
  [].forEach.call($('segs').children,function(seg,i){seg.classList.toggle('done',i<st);seg.classList.remove('over')});
}
function paintAct(){
  var nb=$('nextBtn');
  if(st<4){nb.textContent=st===3?'去檢核 →':'下一段 →';nb.disabled=false;
    $('hint').textContent=mode==='h'?'時間到會自動往下；讀過的段落會蓋住。':'時間到只會變紅，看完再按下一段。'}
  else{nb.textContent='存檔';nb.disabled=!cur.rate;$('hint').textContent=cur.rate?'':'勾完關鍵後，選一個自評才能存檔。'}

  if(window.barWake)barWake();
}
function tick(first){if(first)segFix();
  if(!first){ if(paused||document.visibilityState!=='visible')return; elapsed++; stLeft--; }
  var clk=$('clk'),seg=$('segs').children[st].querySelector('b');
  clk.textContent=mmss(stLeft); clk.classList.toggle('red',stLeft<=0);
  seg.style.width=Math.min(100,(STG[st].s-stLeft)/STG[st].s*100)+'%';
  $('segs').children[st].classList.toggle('over',stLeft<0);
  var t=$('tot'); t.textContent='總 '+mmss(elapsed).replace('+','')+'／5:00'; t.classList.toggle('red',elapsed>TOTAL);
  if(stLeft<=0&&mode==='h'&&st<4&&!first){next()}
}
function toConc(){var b=document.querySelector('#body .blk.b4');if(!b)return;var bar=document.querySelector('.bar');var y=b.getBoundingClientRect().top+scrollY-(bar?bar.offsetHeight:0)-8;setTimeout(function(){scrollTo({top:y,behavior:'smooth'})},60)}
function toBody(){var b=$('body');if(!b||st<1||st>4)return;var bar=document.querySelector('.bar');var y=Math.max(0,b.getBoundingClientRect().top+scrollY-(bar?bar.offsetHeight:0)-8);scrollTo({top:y,behavior:'smooth'})}
function segFix(){[].forEach.call($('segs').children,function(g,i){if(i===st)return;var b=g.querySelector('b');if(b)b.style.width=i<st?'100%':'0%';if(i>st)g.classList.remove('over')})}
function next(){
  if(paused)return;
  if(st>4)return;
  if(st<4){st++;stLeft=STG[st].s;render();tick(true);toBody();if(st===3)toConc();return}
  save();
}
function save(){
  if(!cur.rate)return;
  var now=Math.floor(Date.now()/1000);
  var S=ld(SP); S[cur.id]=[{t:now,sc:cur.sc,mx:cur.mx,hm:cur.hm,hx:cur.hx,m:mode,sec:elapsed,v:cur.rate}].concat(S[cur.id]||[]).slice(0,30); sv(SP,S);
  var L=ld(LOG), r=L[cur.id]=L[cur.id]||{n:0,s:[],tot:0};
  r.n=(r.n||0)+1; r.tot=(r.tot||0)+elapsed; r.s=[elapsed].concat(r.s||[]).slice(0,5); r.v=cur.rate; r.t=now; sv(LOG,L);
  clearInterval(iv); iv=null;
  var nx=pick==='rand'?{c:randPick(cur.id)}:order().filter(function(x){return x.c.id!==cur.id})[0];
  $('body').innerHTML='<div class="done-box"><b>已存檔</b>：'+cur.sc+'／'+cur.mx+'・'+RL[cur.rate]+'・用時 '+mmss(elapsed).replace('+','')+'<br><span style="color:var(--sub);font-size:.88rem">指揮中心這張申論卡的輪數、自評會一起更新。</span>'
    +(nx?'<div style="margin-top:10px;font-size:.9rem">'+(pick==='rand'?'🎲 隨機':'')+'下一題：'+esc(nx.c.no)+'｜'+esc(nx.c.t)+'</div>':'')+'</div>';
  doneExtra(sprintPages);
  $('stg').innerHTML='完成<small>這題的紀錄已同步</small>';
  [].forEach.call($('segs').children,function(seg){seg.classList.add('done')});
  st=5; $('hint').textContent=''; $('quitBtn').textContent='回清單';
  var nb=$('nextBtn'); nb.disabled=!nx; nb.textContent='下一題 ▸';
  nb.onclick=function(){nb.onclick=next;$('quitBtn').textContent='放棄這題';start(nx.c.id)};
}
$('nextBtn').onclick=next;
$('quitBtn').onclick=function(){setPause(false);$('quitBtn').textContent='放棄這題';$('nextBtn').onclick=next;clearInterval(iv);iv=null;cur=null;$('run').hidden=true;$('act').hidden=true;$('home').hidden=false;swGo('');home();scrollTo(0,0)};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!$('home').hidden)home()});
(function(){var m=/^#q=(.+)$/.exec(location.hash||''),id=m?decodeURIComponent(m[1]):'';
  if(id&&CARDS.some(function(c){return c.id===id})){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}start(id)}else home()})();

var paused=false;
function setPause(v){paused=v;document.body.classList.toggle('paused',v);var b=$('pauseBtn');b.textContent=v?'▶':'⏸';b.setAttribute('aria-label',v?'繼續':'暫停');if(!v){if(cur&&st>=1&&st<=4)toBody();else scrollTo(0,0)}}
$('pauseBtn').onclick=function(){setPause(!paused)};
$('resumeBtn').onclick=function(){setPause(false)};
</script>
<script id="th-js">/* 深淺色切換：有存過看 bx-theme，沒存過跟系統；按了才寫入（全站共用鍵） */

function dark(){var a=H.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function paint(){b.textContent=dark()?'☀️ 淺色':'🌙 深色'}

<script id="sprint-keys">
/* 鍵盤：練習中 →／空白鍵＝下一段（推理版未翻開先翻開）；回看本題 ←／→ 翻頁；空白鍵＝下一題 */
document.addEventListener('keydown',function(e){
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
 var t=e.target,tag=(t&&t.tagName)||'';if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)||(t&&t.isContentEditable))return;
 var k=e.key;if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!==' '&&k!=='Spacebar')return;
 var run=document.getElementById('run');if(!run||run.hidden)return;
 if(document.body.classList.contains('paused'))return;
 var rvP=document.getElementById('rvP'),rvN=document.getElementById('rvN'),nb=document.getElementById('nextBtn');
 function hit(b){if(b&&!b.disabled&&b.offsetParent!==null){e.preventDefault();b.click();return true}return false}
 if(rvP&&rvP.offsetParent!==null){            /* 存檔後：回看本題 */
  if(k==='ArrowLeft')return void hit(rvP);
  if(k==='ArrowRight')return void hit(rvN);
  return void hit(nb);                       /* 空白鍵＝下一題 */
 }
 if(k==='ArrowLeft')return;
 if(hit(document.getElementById('flip')))return;
 hit(nb);
});
</script>
<script id="sprint-bardim">
/* 底部操作列整列淡出：閱讀階段每段 4 秒後變淡；碰到就恢復 */
(function(){var a=document.getElementById('act'),t=null;if(!a)return;
 function reading(){return typeof st==='number'&&st<4}
 window.barWake=function(){a.classList.remove('dim');clearTimeout(t);if(reading())t=setTimeout(function(){if(reading())a.classList.add('dim')},4000)};
 a.addEventListener('pointerdown',function(){if(a.classList.contains('dim'))barWake()},true);
 setInterval(function(){if(!reading()&&a.classList.contains('dim'))a.classList.remove('dim')},500);
})();
</script>
