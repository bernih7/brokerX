以上→廢止證書或證明", "h": true}, {"x": "廢證的門檻是停執「累計 5 年」，不是申誡或停執「累計 3 次」", "h": true}, {"x": "廢止的是經紀人員之證書或證明，對象不是經紀業（經紀業是廢止許可）", "h": true}, {"x": "§33Ⅰ：利害關係人、各級主管機關或同業公會列舉事實、提出證據，報請地方主管機關交付懲戒", "h": false}, {"x": "§33Ⅱ、Ⅲ：地方主管機關設獎懲委員會處理；委員會組織由中央主管機關定之", "h": false}], "mn": "三振換停、滿五出局；發動三方，地方獎懲委員會審"}, {"id": "es-a7", "no": "A7", "t": "保密義務與業者連帶賠償責任", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "經紀營業員乙受僱於 A 經紀業，於執行仲介業務時因過失將委託人甲之出售底價洩漏予買方，致甲以低於底價之金額成交而受有損害。請問：（一）甲得向何人請求損害賠償？其請求權基礎為何？（二）乙應受何種處分？（三）若A 經紀業無力賠償，甲尚有何種受償途徑？其要件與範圍為何？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>保密義務，指經紀人員對因業務知悉或持有之他人秘密，不得無故洩漏。連帶賠償責任，指經紀業與經紀人員就人員執行業務之故意或過失所生損害，對受害人共同負責。依<span class=\"art\">第26條第4項</span>，受害人並得於該經紀業繳存營業保證金及提供擔保總額內，請求全國聯合會代為賠償。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第25條</span><span class=\"lawn\">（保密義務）</span></span><span class=\"evli\"><span class=\"art\">第26條第2項</span>至第4項<span class=\"lawn\">（業者與人員之連帶賠償責任）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第1款</span><span class=\"lawn\">（經紀人員之懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲之請求對象與請求權基礎</p><p>依<span class=\"art\">第26條第2項</span>，經紀業因經紀人員執行仲介或代銷業務之故意或過失致交易當事人受損害者，該經紀業應與經紀人員負連帶賠償責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙受僱於A經紀業，執行仲介業務時因過失洩漏底價，致甲以低於底價成交而受損，甲得向乙及A經紀業請求連帶賠償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>經紀業應就所屬人員執行業務負責，條文並無經紀業證明已盡監督即免責之規定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙之處分</p><p>依<span class=\"art\">第25條</span>，經紀人員對於因業務知悉或持有之他人秘密，不得無故洩漏；依<span class=\"art\">第31條第1項第1款</span>，違反<span class=\"art\">第25條</span>者，應予申誡。</p><p class=\"evx\"><span class=\"evt\">例</span><span>委託人之出售底價屬乙因業務知悉之秘密，乙洩漏予買方即違反<span class=\"art\">第25條</span>。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護委託人之交易地位，人員另受懲戒。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）向全國聯合會請求代為賠償</p><p>依<span class=\"art\">第26條第3項</span>，受害人向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會請求代為賠償時，視為已向基金管理委員會申請調處，基金管理委員會應即進行調處。依同條第4項，要件為受害人取得對經紀業或經紀人員之執行名義、經仲裁成立或基金管理委員會之決議支付；範圍為該經紀業繳存營業保證金及提供擔保總額內；經代為賠償後，應通知經紀業限期補繳。</p><p class=\"evx\"><span class=\"evt\">例</span><span>A無力賠償，甲取得對A之執行名義後向全國聯合會請求。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第26條第4項</span>以取得執行名義、經仲裁成立或基金管理委員會之決議支付為要件，並以營業保證金及提供擔保總額為範圍。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得依<span class=\"art\">第26條第2項</span>向乙及A經紀業請求連帶損害賠償。（二）乙違反<span class=\"art\">第25條</span>保密義務，依<span class=\"art\">第31條第1項第1款</span>應予申誡。（三）A經紀業無力賠償時，甲得向同業公會全國聯合會請求代為賠償，請求時視為已向基金管理委員會申請調處；要件為取得對經紀業或經紀人員之執行名義、經仲裁成立或基金管理委員會之決議支付，範圍以該經紀業繳存營業保證金及提供擔保總額為限。</p>"], "ck": [{"x": "§25：經紀人員對因業務知悉或持有之他人秘密，不得無故洩漏", "h": false}, {"x": "§26Ⅱ：經紀人員執行業務之故意或過失致交易當事人受損害，經紀業與其負連帶賠償責任", "h": false}, {"x": "條文未設免責規定，A 不得以「已盡監督義務」主張免責", "h": true}, {"x": "§31Ⅰ①：違反 §16、§22Ⅰ、§23、§25 者應予申誡；乙落在本款", "h": false}, {"x": "§31Ⅱ：申誡三次另予 6 個月以上 3 年以下停止執行業務；停業累計達 5 年以上廢止證書或證明", "h": false}, {"x": "§26Ⅲ、Ⅳ：代為賠償之受理者為同業公會全國聯合會，不是主管機關", "h": true}, {"x": "要件：取得執行名義、經仲裁成立或基金管理委員會決議支付，三者擇一", "h": true}, {"x": "範圍以該經紀業繳存營業保證金及提供擔保之總額為限，代為賠償後通知限期補繳", "h": false}], "mn": "兼簽解密＝申誡（§16 兼任、§22Ⅰ 簽章、§23 說明、§25 保密）"}, {"id": "es-a8", "no": "A8", "t": "主管機關的檢查權與規避查核的後果", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "主管機關得對經紀業進行哪些查核？業者規避、妨礙或拒絕查核有何責任？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>查核權，是主管機關為確保經紀業遵守申報登錄與業務規範，所具有之要求查詢、取閱文件、提出說明及檢查業務之行政權限。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第24條之1第6項</span><span class=\"lawn\">（申報登錄資訊之查核權）</span></span><span class=\"evli\">第7項，<span class=\"art\">第27條</span>（主管機關檢查權），<span class=\"art\">第29條第1項第3款</span>、第4款、第2項、第3項（罰則）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）申報登錄資訊之查核</p><p>依<span class=\"art\">第24條之1第6項</span>，直轄市、縣（市）主管機關為查核申報登錄資訊，得向交易當事人或不動產經紀業要求查詢、取閱有關文件或提出說明；中央主管機關為查核疑有不實之申報登錄價格資訊，得向相關機關或金融機構查詢、取閱價格資訊有關文件。受查核者不得規避、妨礙或拒絕。依同條第7項，查核不得逾確保申報登錄資訊正確性目的之必要範圍。</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣市要求代銷業者提出成交文件。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保登錄資訊正確並兼顧比例原則。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）業務檢查</p><p>依<span class=\"art\">第27條</span>，主管機關檢查經紀業之業務，經紀業不得拒絕。</p><p class=\"evx\"><span class=\"evt\">例</span><span>派員檢查仲介公司業務。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>落實行政監督。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）規避、妨礙或拒絕查核登錄資訊之責任</p><p>依<span class=\"art\">第29條第1項第3款</span>，經紀業違反<span class=\"art\">第24條之1第6項</span>規定，規避、妨礙或拒絕查核者，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰；依同條第2項，並應令其限期改正，屆期未改正者，按次處罰。金融機構、交易當事人規避者，依同條第3項亦同。</p><p class=\"evx\"><span class=\"evt\">例</span><span>業者拒不提出成交文件，直接處罰鍰。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>查核登錄資訊攸關市場透明，違者直接處罰。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）拒絕業務檢查之責任</p><p>依<span class=\"art\">第29條第1項第4款</span>，違反<span class=\"art\">第27條</span>規定者，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣三萬元以上十五萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">例</span><span>業者拒絕檢查，經令限期改正仍不配合，始處罰鍰。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>先命改正，給予業者配合機會。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>主管機關得依<span class=\"art\">第24條之1第6項</span>向交易當事人或經紀業要求查詢、取閱文件或提出說明，中央主管機關並得向相關機關或金融機構查詢價格資訊文件，但不得逾必要範圍；並得依<span class=\"art\">第27條</span>檢查經紀業之業務。經紀業規避、妨礙或拒絕登錄資訊查核者，依<span class=\"art\">第29條第1項第3款</span>直接處三萬元以上十五萬元以下罰鍰並令限期改正；拒絕業務檢查者，依同項第4款先令限期改正，屆期未改正才處三萬元以上十五萬元以下罰鍰。</p>"], "ck": [{"x": "§24之1Ⅵ：得向交易當事人或經紀業查詢、取閱文件、要求說明；受查核者不得規避、妨礙或拒絕", "h": false}, {"x": "§27：主管機關檢查經紀業之業務，經紀業不得拒絕", "h": false}, {"x": "§24之1Ⅶ：查核不得逾確保申報登錄資訊正確性目的之必要範圍（比例界線，加分句）", "h": false}, {"x": "§29Ⅰ③：規避、妨礙或拒絕 §24之1Ⅵ 查核，直接處 3 萬元以上 15 萬元以下罰鍰", "h": true}, {"x": "§29Ⅰ④：違反 §27 等，應先令限期改正，屆期未改正才處 3–15 萬", "h": true}, {"x": "罰鍰是 3–15 萬，不是 6–30 萬（6–30 萬是 §29Ⅰ① 的額度）", "h": true}, {"x": "答題要分「直接處罰」與「先限期改正」兩條線，不可合併成一句", "h": false}], "mn": "查申報走③直接罰；拒檢查走④先改正；額度都是 3–15 萬"}, {"id": "es-a9", "no": "A9", "t": "同業公會與全國聯合會：入會義務、保證基金與代為賠償", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "經紀業依法必須加入同業公會，營業保證金亦由同業公會全國聯合會統一保管。請說明：（一）經紀業加入同業公會的義務與未加入的法律效果，以及所在地尚未設立同業公會時應如何處理；（二）營業保證金由誰保管、如何運用、不足時如何處理及其法律效果；（三）交易當事人受損害時，向全國聯合會請求代為賠償的要件、程序與限額。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>同業公會為經紀業依法強制加入之職業團體，入會為營業資格要件；全國聯合會則擔任營業保證基金之統一保管人、保證金不足之通知人及代為賠償之對口。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第7條第1項</span>、第2項<span class=\"lawn\">（開業三要件與開始營業期限）</span></span><span class=\"evli\">第6項，<span class=\"art\">第8條第1項</span>至第4項，<span class=\"art\">第10條</span>，<span class=\"art\">第26條第1項</span>至第4項，<span class=\"art\">第29條第1項第7款</span>（未補足營業保證金之停止營業處分）</span><span class=\"evli\">施行細則<span class=\"art\">第12條</span></span><span class=\"evli\"><span class=\"art\">第13條之3</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）入會義務與未入會之效果</p><p>依<span class=\"art\">第7條第1項</span>，經紀業經主管機關之許可，辦妥公司登記或商業登記，並加入登記所在地之同業公會後方得營業。依施行細則<span class=\"art\">第12條</span>，所在地同業公會尚未設立者，應加入鄰近直轄市或縣（市）同業公會，所在地公會設立後應即加入之。依<span class=\"art\">第10條</span>及施行細則<span class=\"art\">第13條之3</span>，公會應於三十日內將入會、停權、退會情形報請層轉備查。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某縣尚無公會，應先加入鄰近縣市公會。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使經紀業均受公會自律。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）營業保證金之保管、運用與不足</p><p>依<span class=\"art\">第8條第1項</span>，營業保證金由全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存，並組成管理委員會負責保管；基金之孳息部分，得運用於健全不動產經紀制度。依同條第2項，經紀業委員不得超過五分之二；依同條第3項，非有<span class=\"art\">第26條第4項</span>之情形不得動支。依同條第4項，保證金低於規定額度時，全國聯合會應通知經紀業於一個月內補足。依<span class=\"art\">第29條第1項第7款</span>，未補足者主管機關應予停止營業處分，其期間至補足營業保證金為止；停止營業期間達一年者，應廢止其許可。</p><p class=\"evx\"><span class=\"evt\">例</span><span>代為賠償後未補足即遭停業。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持基金足額。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）請求代為賠償</p><p>依<span class=\"art\">第26條第1項</span>、第2項，經紀業負賠償或連帶賠償責任。依同條第3項，受害人向全國聯合會請求代為賠償時，視為已向基金管理委員會申請調處；依同條第4項，須取得執行名義、經仲裁成立或基金管理委員會之決議支付後，於該經紀業繳存營業保證金及提供擔保總額內請求，代為賠償後通知經紀業限期補繳。</p><p class=\"evx\"><span class=\"evt\">例</span><span>受害人取得執行名義後向全國聯合會請求。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第26條第4項</span>，須取得執行名義、經仲裁成立或基金管理委員會之決議支付後，始得請求代為賠償。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）入會是營業資格要件，未入會不得營業；所在地未設公會者加入鄰近公會，設立後應即加入，公會並應於三十日內層轉備查。（二）營業保證金由全國聯合會設專戶並組管理委員會保管，不足時由全國聯合會通知一個月內補足，未補足停止營業至補足為止，停業達一年廢止許可。（三）受害人請求代為賠償視為已申請調處，須先取得執行名義、仲裁成立或管理委員會決議支付，並以該經紀業繳存保證金及擔保總額為限。</p>"], "ck": [{"x": "§7Ⅰ：加入登記所在地同業公會後「方得營業」，6 個月內開始營業", "h": false}, {"x": "細則§12：所在地公會未設立加入鄰近，設立後應即加入", "h": false}, {"x": "§10、細則§13之3：公會於 30 日內層轉備查，停權退會亦同", "h": false}, {"x": "§8Ⅰ：全國聯合會設營業保證基金專戶＋管理委員會保管，孳息用於健全制度", "h": false}, {"x": "§8Ⅱ：經紀業擔任之委員不得超過委員總數五分之二", "h": true}, {"x": "§8Ⅳ：由全國聯合會（非主管機關）通知一個月內補足", "h": true}, {"x": "§29Ⅰ⑦：停業至補足為止，停業達一年應廢止許可", "h": false}, {"x": "§26Ⅲ：向聯合會請求代為賠償即視為已申請調處（不是視為起訴）", "h": true}, {"x": "§26Ⅳ：須先有執行名義／仲裁成立／管委會決議支付，且以該業繳存及擔保總額為限", "h": true}], "mn": "入會才能開門、聯合會管錢又催錢、代賠要先有名義且有上限〔自編〕"}, {"id": "es-fw03", "no": "範文03★", "t": "108年申論二｜不動產說明書簽章解說流程、解說義務人與對象及賠償責任", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "不動產說明書", "q": "不動產之買賣，如委由經紀業仲介者，不動產經紀業者應提出不動產經紀業管理條例第 22 條第 1 項所規定之各類文件，其中包括不動產說明書，而該條例第 22 條第 3 項對經紀業者所製作之不動產說明書內容有何限制規定？另不動產說明書應有那些相關人等之簽章以及簽章之時間點？在執行業務過程中，不動產說明書應如何解說？何者為義務人且其解說的對象為何人？當買賣雙方當事人簽訂買賣契約書時，說明書應如何處置，該不動產說明書則視為買賣契約書之一部分？若就不動產說明書之製作及執行過程，有經紀人員因未盡其義務，致交易當事人受損害者，則受損害者可請求何人負賠償責任？（25 分）", "nq": 5, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產說明書是經紀業依法提供交易相對人的交易資訊揭露文件，使其締約前了解標的現況、權利與交易條件。條例就內容、簽章、解說、交付與賠償均設有規定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條第1項第5款</span>、第3項<span class=\"lawn\">（應由經紀人簽章之文件）</span></span><span class=\"evli\"><span class=\"art\">第23條</span><span class=\"lawn\">（不動產說明書之解說義務）</span></span><span class=\"evli\"><span class=\"art\">第24條</span><span class=\"lawn\">（說明書之交付與簽章）</span></span><span class=\"evli\"><span class=\"art\">第26條第1項</span>、第2項、第4項<span class=\"lawn\">（賠償責任與代為賠償）</span></span><span class=\"evli\">不動產說明書應記載及不得記載事項</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）內容限制</p><p>依<span class=\"art\">第22條第3項</span>，說明書內容應依中央主管機關公告之應記載及不得記載事項製作。</p><p class=\"evx\"><span class=\"evt\">例</span><span>不得記載「本說明書內容僅供參考」。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第22條第3項</span>授權中央主管機關訂定應記載及不得記載事項。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）簽章人與時點</p><p><span class=\"evli\">①經紀人依<span class=\"art\">第22條第1項第5款</span>簽章；</span><span class=\"evli\">②委託人於提供解說前簽章，確認內容與其提供之資料相符（<span class=\"art\">第23條第2項</span>）；</span><span class=\"evli\">③相對人於簽訂租賃或買賣契約書時簽章（<span class=\"art\">第24條第1項</span>）。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>先由委託人確認、再解說、最後由相對人確認已受解說。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）解說義務人與對象</p><p>依<span class=\"art\">第23條第1項</span>，經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說。</p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介賣屋時，由經紀人或經紀營業員向買方解說。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）簽約時之處置</p><p>依<span class=\"art\">第24條</span>，雙方當事人簽訂契約書時，經紀人應將說明書交付相對人，由相對人簽章；說明書視為契約之一部分。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第24條第2項</span>明定說明書視為租賃或買賣契約書之一部分。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）賠償責任</p><p>依<span class=\"art\">第26條第2項</span>，經紀人員因故意或過失致交易當事人受損害，該經紀業應與經紀人員負連帶賠償責任；依第4項，受害人取得執行名義等後，得請求全國聯合會於該經紀業繳存之營業保證金及提供擔保總額內代為賠償。</p></div>", "<span class=\"blk-l\">四、結論</span><p>說明書依公告之應記載及不得記載事項製作；由經紀人製作完成時、委託人解說前、相對人簽約時依序簽章；經紀人員向相對人解說；簽約時交付相對人並視為契約一部分；受損害者得向經紀業與經紀人員請求連帶賠償，並得請求全國聯合會代為賠償。</p>"], "ck": [{"x": "§22Ⅲ：說明書應記載及不得記載事項由中央主管機關定之，經紀業不得任意增減", "h": false}, {"x": "只寫「由中央主管機關定之」不夠：要列土地7／成屋4／預售屋4大項、不得記載6項與罰則（6–30 萬＋申誡）", "h": true}, {"x": "簽章三人三時點：經紀人（製作完成時）→委託人（解說前）→相對人（簽約時）", "h": true}, {"x": "時點不可寫成「締約後」，也不可漏掉相對人在簽約時簽章", "h": false}, {"x": "§23Ⅰ：解說義務人＝經紀人員（含經紀營業員）；對象＝與委託人交易之相對人", "h": false}, {"x": "§24Ⅰ、Ⅱ：簽約時交付相對人並由其簽章，說明書視為契約書之一部分", "h": false}, {"x": "§26Ⅱ：經紀業與經紀人員負連帶賠償責任（不可只寫經紀人員）", "h": false}, {"x": "§26Ⅳ：於營業保證金及擔保總額內，得請求全國聯合會代為賠償", "h": true}], "mn": "製作經紀人簽→委託人先簽→向相對人解說→締約時交付並簽→視為契約之一部分", "hp": 3, "hpl": "高"}, {"id": "es-fw19", "no": "範文19", "t": "105年申論二｜不動產說明書土地（素地）使用管制內容應記載事項", "lv": "★ 參考", "k": "off", "tier": 2, "g": "不動產說明書", "q": "依不動產說明書應記載及不得記載事項，試述土地（素地）「使用管制內容」之應記載事項為何？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>依不動產經紀業管理條例<span class=\"art\">第22條第3項</span>，不動產說明書應記載及不得記載事項由中央主管機關定之，其土地（素地）部分列有使用管制內容之應記載事項。</p>", "<span class=\"blk-l\">二、法條</span><p>不動產說明書應記載及不得記載事項，壹、應記載事項，一、土地（素地），（五）使用管制內容</p>", "<span class=\"blk-l\">三、涵攝</span><p>依該點，使用管制內容應記載：</p><div class=\"evp\"><p class=\"evh\">（一）使用分區或編定</p><p>都市土地以主管機關核發之都市計畫土地使用分區證明為準；非都市土地以土地登記謄本記載為準；未記載者，應敘明其管制情形。</p><p class=\"evx\"><span class=\"evt\">例</span><span>都市土地以分區證明確認是住宅區或商業區。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）法定建蔽率</p></div><div class=\"evp\"><p class=\"evh\">（三）法定容積率</p><p class=\"evx\"><span class=\"evt\">理由</span><span>建蔽率、容積率直接決定可建築面積與土地價值。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）開發方式限制</p><p>如都市計畫說明書有附帶規定以徵收、區段徵收、市地重劃或其他方式開發，或屬都市計畫法規定之禁限建地區者，應一併敘明。</p><p class=\"evx\"><span class=\"evt\">例</span><span>附帶條件須市地重劃才能開發之土地，應在說明書中寫明。</span></p></div><div class=\"evp\"><p><b>（五）</b>是否屬不得興建農舍或已提供興建農舍之農業用地，若是，應敘明其使用管制情形（非屬農業用地者免記載）。</p></div><div class=\"evp\"><p class=\"evh\">（六）若屬土地開發者，應敘明是否位屬</p><p><span class=\"evli\">①山坡地範圍；</span><span class=\"evli\">②依水土保持法公告禁止開發之特定水土保持區；</span><span class=\"evli\">③依水利法劃設公告之河川區域；</span><span class=\"evli\">④依水利法劃設公告之排水設施範圍；</span><span class=\"evli\">⑤國家公園區內之特別景觀區、生態保護區、史蹟保存區；</span><span class=\"evli\">⑥飲用水水源水質保護區或飲用水取水口一定距離內之地區；</span><span class=\"evli\">⑦自來水法規定之水質水量保護區；</span><span class=\"evli\">⑧政府公告之土壤或地下水污染場址；若是，應敘明其限制重點。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>這些區域開發受嚴格限制，影響買方投資判斷。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>土地說明書使用管制內容應記載使用分區或編定、法定建蔽率、法定容積率、開發方式限制、農業用地興建農舍情形，以及土地開發者之八項特殊管制區域，構成買方判斷土地可利用程度之關鍵資訊，經紀業應逐項查證並記載。</p>"], "ck": [{"x": "壹、一、（五）：使用分區（都市計畫）或使用編定（非都市土地）", "h": false}, {"x": "應記載法定建蔽率、容積率", "h": false}, {"x": "應記載開發方式限制（如須整體開發、須辦都市設計審議）", "h": true}, {"x": "應記載是否屬不得興建農舍之農業用地", "h": true}, {"x": "八項特殊管制：山坡地、水土保持特定區、河川區域、排水設施範圍、國家公園特別景觀區、飲用水水源保護區、自來水水質水量保護區、土壤或地下水污染場址", "h": true}, {"x": "屬特殊管制區域者，不是打勾就好，要敘明管制內容及對開發利用之影響", "h": false}, {"x": "五類全寫，且限「土地（素地）」項目，不可與成屋說明書項目混用", "h": false}], "mn": "分區、兩率、方式、農舍，再加八管制：山水河排、國飲自污", "hp": 11, "hpl": "高"}, {"id": "es-mk9", "no": "模九", "t": "模擬試題｜115.1.13 不動產說明書修正", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "不動產說明書", "q": "內政部於115年1月13日以台內地字第1140267470號令修正「不動產說明書應記載及不得記載事項」，並自115年4月1日生效。試說明：（一）不動產說明書應記載及不得記載事項之法源依據與法律性質為何？（二）本次修正之內容為何？成屋與預售屋有何不同？（三）經紀業未依修正後之規定製作說明書，可能發生何種法律效果？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產說明書係使交易相對人於締約前了解標的物現況與交易條件之揭露文件；其應記載及不得記載事項由中央主管機關公告，性質為行政命令，非法律。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條第1項第5款</span>、第3項<span class=\"lawn\">（應由經紀人簽章之文件）</span></span><span class=\"evli\"><span class=\"art\">第24條第2項</span>（說明書視為契約書之一部分）</span><span class=\"evli\"><span class=\"art\">第26條第2項</span><span class=\"lawn\">（賠償責任與代為賠償）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第1款</span><span class=\"lawn\">（經紀人員之懲戒）</span></span><span class=\"evli\">不動產說明書應記載及不得記載事項第2點</span><span class=\"evli\">第3點</span><span class=\"evli\">內政部115年1月13日令</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）法源與性質</p><p>依<span class=\"art\">第22條第3項</span>，「第一項第五款之不動產說明書應記載及不得記載事項，由中央主管機關定之」，由內政部以令公告，性質為行政命令。</p><p class=\"evx\"><span class=\"evt\">例</span><span>本次115年1月13日令即依此授權修正。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>說明書屬<span class=\"art\">第22條第1項第5款</span>應由經紀人簽章之文件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）修正內容及差異</p><p>僅修正三處，口訣「光・能・氯」：<span class=\"evli\">①太陽光電（成屋＋預售屋）：有無設置，有者敘明位置；</span><span class=\"evli\">②建築能效（僅成屋）：有無取得建築能效標示，有者敘明等級、核發日期及證書效期；</span><span class=\"evli\">③氯離子報告名稱（僅預售屋）：改為「建築物混凝土氯離子含量檢測報告」及「施工中建築物出具無放射性污染證明」。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋水災淹水救助紀錄為104年版既有，非115年新增。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>配合再生能源發展條例、近零碳建築政策及混凝土規範之修正。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）法律效果</p><p><span class=\"evli\">①行政：<span class=\"art\">第29條第1項第1款</span>處罰的是違反<span class=\"art\">第22條第1項</span>（說明書未經經紀人簽章），經紀業處6萬元以上30萬元以下罰鍰，經紀人員依<span class=\"art\">第31條第1項第1款</span>申誡；內容未依公告記載，<span class=\"art\">第29條</span>未單獨列為處罰事由。</span><span class=\"evli\">②民事：說明書視為契約書之一部分（<span class=\"art\">第24條第2項</span>），漏載即屬契約違反；依<span class=\"art\">第26條第2項</span>，經紀業與經紀人員負連帶賠償責任。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>成屋說明書漏載建築能效標示，致當事人受損。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>罰則以條文所列事由為限，內容瑕疵回到契約責任。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）依<span class=\"art\">第22條第3項</span>授權公告，為行政命令。（二）修正太陽光電（兩者）、建築能效（成屋）、氯離子報告名稱（預售屋）。（三）內容未依公告記載，因經紀人員之故意或過失致交易當事人受損害者→經紀業與經紀人員負連帶賠償責任；未經經紀人簽章→經紀業罰鍰、經紀人員申誡。</p>"], "ck": [{"x": "§22Ⅲ 授權中央主管機關訂定 → 性質為行政命令，非法律", "h": true}, {"x": "光：太陽光電成屋、預售屋皆有，並敘明設置位置", "h": false}, {"x": "能：建築能效僅成屋，預售屋沒有", "h": true}, {"x": "氯：僅預售屋用字調整；「新拌」「輻射」是修正前舊字，現行為「放射性污染」", "h": false}, {"x": "水災淹水救助紀錄是預售屋既有項目，不是 115 年新增", "h": true}, {"x": "§29Ⅰ①／§31Ⅰ① 處罰的是違反 §22Ⅰ（未經經紀人簽章）：業 6 萬–30 萬元、人申誡", "h": false}, {"x": "§24Ⅱ 視為契約書之一部分＋§26Ⅱ 經紀業與經紀人員連帶賠償", "h": false}, {"x": "第三問要寫法律效果：內容瑕疵的民事責任＋未簽章的行政罰，不能只答修正內容", "h": false}], "mn": "光・能・氯：光兩邊、能成屋、氯預售；水災是舊的"}, {"id": "es-c1", "no": "C1", "t": "預售屋說明書的特別揭露事項", "lv": "預測", "k": "pred", "tier": 3, "g": "不動產說明書", "q": "預售屋說明書的應記載事項，和成屋比，有哪些特別需要揭露的事項？115年修正後，成屋與預售屋說明書各新增或修正了什麼？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產說明書是讓交易相對人締約前了解標的現況與交易條件之揭露文件，其應記載及不得記載事項由內政部依條例<span class=\"art\">第22條第3項</span>公告。預售屋標的是將來完成之建物，揭露重點與成屋不同。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條第3項</span><span class=\"lawn\">（授權中央主管機關公告）</span></span><span class=\"evli\">不動產說明書應記載及不得記載事項，應記載事項第2點（成屋）</span><span class=\"evli\">第3點（預售屋）</span><span class=\"evli\">115.1.13內政部令修正第2點</span><span class=\"evli\">第3點，115.4.1生效</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）預售屋特別揭露事項</p><p>成屋看「現況」，預售屋看「承諾與品質」。預售屋特有：建照日期字號、主要建材廠牌規格、工程進度（開工與取得使用執照期限、通知交屋期限、保固期限及範圍）、規約草約、建物瑕疵擔保（交屋時有無檢附氯離子檢測報告及無放射性污染證明）、履約保證機制方式及受託或提供擔保者，以及基地毗鄰在建案、最近5年內周邊300公尺水災淹水救助紀錄。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方簽約時看不到房子，只能靠工程進度與履約保證判斷建商能否如期交屋。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>預售屋風險在未來，揭露須著重承諾面。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）115年修正三處</p><p><span class=\"evli\">①太陽光電發電設備：成屋與預售屋都新增，有則敘明設置位置。</span><span class=\"evli\">②建築能效：僅成屋新增，有無取得建築能效標示，有則敘明等級、核發日期及證書效期。</span><span class=\"evli\">③預售屋瑕疵擔保之報告用字調整為「建築物混凝土氯離子含量檢測報告」「無放射性污染證明」。水災淹水救助紀錄不是115年新增，104年版即有。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>預售屋說明書特有工程進度、建材、規約草約、瑕疵擔保文件、履約保證機制及毗鄰在建案、水災紀錄。115年修正僅三處：太陽光電（成屋與預售屋）、建築能效（僅成屋）、預售屋氯離子報告用字。經紀業應依新版公告製作說明書。</p>"], "ck": [{"x": "§22Ⅲ：不動產說明書應記載及不得記載事項由中央主管機關（內政部）定之", "h": false}, {"x": "第3點：預售屋特有工程進度（開工與取照、通知交屋、保固）、建照字號、建材廠牌規格、規約草約、瑕疵擔保檢附文件", "h": false}, {"x": "第3點（三）7：履約保證機制方式及受託或提供擔保者，屬「重要交易條件」且僅預售屋有", "h": true}, {"x": "最近 5 年內基地周邊 300 公尺水災淹水救助紀錄：預售屋專有，成屋沒有，且 104 年版即有", "h": true}, {"x": "太陽光電發電設備：成屋第2點（一）5(18) 與預售屋第3點（一）9(2) 均為 115 年新增", "h": false}, {"x": "建築能效情形：僅成屋第2點（一）6 新增，預售屋沒有這一目", "h": true}, {"x": "預售屋氯離子是「用字調整」（氯離子含量檢測報告＋無放射性污染證明），不是新增項目", "h": false}, {"x": "115 年只修三處；水災紀錄不是新增，且「5 年」與「300 公尺」兩個數字不可互換", "h": true}], "mn": "光・能・氯：光電兩邊都要、能效只有成屋、氯離子只改用字；水災＝預售屋老項目", "hp": 12, "hpl": "高"}, {"id": "es-c2", "no": "C2", "t": "說明書的法律效力與錯誤記載的責任", "lv": "預測", "k": "pred", "tier": 3, "g": "不動產說明書", "q": "甲買屋後發現說明書記載的屋況與事實不符，說明書在契約上有什麼效力？甲可向誰主張什麼？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產說明書於雙方簽訂契約時，由經紀人交付相對人並經其簽章，視為契約之一部分。說明書記載與事實不符，買方即可依契約主張權利，並可向經紀業與經紀人員求償。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第24條</span><span class=\"lawn\">（說明書之交付與簽章）</span></span><span class=\"evli\"><span class=\"art\">第26條</span><span class=\"lawn\">（賠償責任與代為賠償）</span></span><span class=\"evli\">消費者保護法<span class=\"art\">第22條</span><span class=\"lawn\">（廣告真實義務）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）說明書之契約效力</p><p>依管理條例<span class=\"art\">第24條</span>，雙方當事人簽訂契約書時，經紀人應將說明書交付相對人，由相對人在說明書上簽章；說明書視為契約之一部分。故說明書所載屋況與事實不符，即屬契約內容未履行（買賣標的瑕疵問題另依民法）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>說明書記載「無漏水」，交屋後發現長期漏水。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>不動產說明書不得記載「本說明書內容僅供參考」。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）向出賣人主張</p><p>甲得以說明書為契約內容，向出賣人（委託人）請求履行或損害賠償。</p></div><div class=\"evp\"><p class=\"evh\">（三）向經紀業與經紀人員主張</p><p>依<span class=\"art\">第26條</span>，經紀人員執行仲介或代銷業務，因故意或過失致交易當事人受損害者，該經紀業應與經紀人員負連帶賠償責任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介明知屋況卻未查證照抄屋主說法，致甲受損。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第26條第2項</span>明定經紀業應與經紀人員負連帶賠償責任，受害人並得依同條第4項請求全國聯合會代為賠償。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）與消保法之連結</p><p>依消保法<span class=\"art\">第22條</span>，企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>消保法<span class=\"art\">第22條</span>規範廣告內容，若說明書之記載同時見於廣告，企業經營者對消費者所負之義務不得低於廣告之內容。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>說明書經相對人簽章後視為契約之一部分，記載不符時，甲得向出賣人請求履行或損害賠償；就經紀人員執行業務之故意或過失所生損害，並得向經紀業與經紀人員請求連帶賠償。</p>"], "ck": [{"x": "§24Ⅰ：簽約時經紀人應將說明書交付交易相對人，並由相對人簽章", "h": false}, {"x": "§24Ⅱ：不動產說明書視為租賃或買賣契約書之一部分", "h": false}, {"x": "說明書是「視為契約一部分」，不是獨立於契約外的另一份文件", "h": true}, {"x": "記載與事實不符＝契約內容不符，構成債務不履行", "h": false}, {"x": "§26Ⅱ：經紀人員執行業務之故意或過失致交易當事人受損害，經紀業與經紀人員負連帶賠償責任", "h": false}, {"x": "賠償對象是經紀業與經紀人員「連帶」，不能只寫營業員", "h": true}, {"x": "消保法 §22：對消費者所負義務不得低於廣告內容，契約成立後應確實履行", "h": false}], "mn": "說明書＝契約；錯了找賣方（契約責任）＋業與員（連帶賠償）", "hp": 4, "hpl": "高"}, {"id": "es-fw21", "no": "範文21", "t": "106年申論二｜定型化契約定義及應記載不得記載事項範疇", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "定型化契約", "q": "何謂定型化契約？中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂定型化契約應記載或不得記載事項。其內容得包括那些項目？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依消費者保護法<span class=\"art\">第2條第9款</span>，定型化契約指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約。依<span class=\"art\">第17條第1項</span>，中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂其應記載或不得記載事項。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第2條第9款</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第17條第1項</span>、第2項、第3項（應記載及不得記載事項）<span class=\"lawn\">（應記載及不得記載事項）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）定型化契約之定義</p><p>依<span class=\"art\">第2條第9款</span>，指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商提供給所有買受人的同一份預售屋買賣契約。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>契約內容由一方預先決定，另一方難以議價。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）應記載事項得包括之項目</p><p>依<span class=\"art\">第17條第2項</span>，依契約之性質及目的，應記載事項得包括：<span class=\"evli\">①契約之重要權利義務事項；</span><span class=\"evli\">②違反契約之法律效果；</span><span class=\"evli\">③預付型交易之履約擔保；</span><span class=\"evli\">④契約之解除權、終止權及其法律效果；</span><span class=\"evli\">⑤其他與契約履行有關之事項。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋契約應寫明履約擔保方式與違約金。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>把消費者最需要知道的權利義務明文化。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不得記載事項得包括之項目</p><p>依<span class=\"art\">第17條第3項</span>，<span class=\"evli\">①企業經營者保留契約內容或期限之變更權或解釋權；</span><span class=\"evli\">②限制或免除企業經營者之義務或責任；</span><span class=\"evli\">③限制或剝奪消費者行使權利，加重消費者之義務或責任；</span><span class=\"evli\">④其他對消費者顯失公平事項。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>「本公司保留最終解釋權」即屬不得記載。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>排除企業經營者片面變更、免責及顯失公平之條款。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>定型化契約指以企業經營者提出之定型化契約條款為內容訂立之契約。中央主管機關得選擇特定行業擬訂應記載或不得記載事項：前者含重要權利義務、違約效果、預付型交易之履約擔保、解除終止權等；後者排除保留變更解釋權、免責、加重消費者義務及其他顯失公平事項，共同矯正締約地位不對等。</p>"], "ck": [{"x": "§2⑨：定型化契約＝以企業經營者提出之定型化契約條款作為契約內容之「全部或一部」而訂立之契約", "h": true}, {"x": "§2⑦：定型化契約條款為預先擬定且不限於書面（字幕、張貼、牌示、網際網路亦屬之）", "h": false}, {"x": "§17Ⅰ：中央主管機關選擇特定行業擬訂，報請行政院核定後公告", "h": false}, {"x": "§17Ⅱ 應記載五款：重要權利義務、違約之法律效果、預付型交易履約擔保、解除終止權及其效果、其他與契約履行有關事項", "h": true}, {"x": "§17Ⅲ 不得記載四款：保留變更權或解釋權、限制或免除業者義務責任、限制或剝奪消費者權利加重其義務責任、其他顯失公平事項", "h": true}, {"x": "「保留解釋權」「拋棄審閱權」屬不得記載；「履約擔保」「違約金」屬應記載，兩組不可對調", "h": false}, {"x": "§17Ⅳ、Ⅴ：違反公告者該條款無效；公告之應記載事項未記載仍構成契約內容", "h": false}], "mn": "應記載：權義、違約、擔保、解終、其他（五）；不得記載：變更解釋、免責、剝奪、顯失公平（四）", "hp": 1022, "hpl": "中"}, {"id": "es-d1", "no": "D1", "t": "委託銷售契約的空白欄位效力", "lv": "預測", "k": "pred", "tier": 3, "g": "定型化契約", "q": "不動產委託銷售定型化契約中，下列欄位若未記載，各有什麼效力？（一）委託銷售價格；（二）委託銷售期間；（三）服務報酬數額；（四）買方違約沒收定金時受託人分得的比例。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>定型化契約應記載事項，是中央主管機關為預防消費糾紛、保護消費者權益、促進定型化契約之公平化，選擇特定行業擬訂並公告之事項。不動產委託銷售契約之重要欄位應記載而未記載時，其效果因欄位性質不同而異，自契約無效、委託人得隨時終止，到受託人不得收取報酬，依消保法<span class=\"art\">第17條第6項</span>，中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第17條</span><span class=\"lawn\">（應記載及不得記載事項）</span></span><span class=\"evli\">不動產委託銷售定型化契約應記載及不得記載事項</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）委託銷售價格未記載</p><p>依公告，委託銷售價格未記載金額者，契約無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>委託書價格欄空白，該委託銷售契約無效。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>價格是委託銷售之核心內容，未記載即無從確定受託人應銷售之條件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）委託銷售期間未記載</p><p>依公告，未記載委託銷售期間者，委託人得隨時以書面終止。</p><p class=\"evx\"><span class=\"evt\">例</span><span>契約未寫委託期間，委託人得隨時以書面終止委託。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免委託人被無期限綁約。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）服務報酬數額未記載</p><p>依公告，服務報酬數額空白者，受託人不得向委託人收取服務報酬。</p><p class=\"evx\"><span class=\"evt\">例</span><span>報酬欄空白而成交，受託人仍不得向委託人收取服務報酬。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>報酬數額應由受託人事先載明，未載明之不利益由受託人承擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）沒收定金分得比例未記載</p><p>依公告，買方違約沒收定金時受託人分得之百分比未記載者，受託人不得請求該部分費用，也不得再收報酬。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方違約遭沒收定金，契約未載比例，受託人不得請求分配。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>分配比例未約定，受託人不得事後主張。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）上位依據</p><p>依消保法<span class=\"art\">第17條第1項</span>，中央主管機關得選擇特定行業，擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之；依同條第2項，應記載事項得包括契約之重要權利義務事項及違反契約之法律效果。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以公告平衡雙方契約地位。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）委託銷售價格未記載金額，契約無效。（二）委託銷售期間未記載，委託人得隨時以書面終止。（三）服務報酬數額未記載，受託人不得向委託人收取服務報酬。（四）沒收定金時受託人分得比例未記載，受託人不得請求該部分費用，也不得再收報酬。價格空白效果最重，其餘欄位空白之不利益均歸受託人承擔。</p>"], "ck": [{"x": "消保法 §17Ⅴ：中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容", "h": false}, {"x": "消保法 §17Ⅳ：違反公告之定型化契約，其條款無效", "h": false}, {"x": "委託銷售價格未記載金額 → 契約無效（四欄中效果最重）", "h": false}, {"x": "委託銷售期間未記載 → 委託人得「隨時以書面」終止，不是契約無效", "h": true}, {"x": "服務報酬數額空白 → 受託人不得收取，不可寫成「可收 6%」", "h": true}, {"x": "沒收定金百分比未記載 → 不得請求該部分費用，也不得再收報酬", "h": false}, {"x": "四欄空白的效果不同：一個契約無效、一個給終止權、兩個不得收費，不可一概寫「無效」", "h": true}], "mn": "價格空白＝契約死；期間空白＝隨時走（書面）；報酬、沒收定金空白＝收不到錢", "hp": 1024, "hpl": "中"}, {"id": "es-d2", "no": "D2", "t": "預售屋買賣契約的履約擔保", "lv": "預測", "k": "pred", "tier": 3, "g": "定型化契約", "q": "預售屋買賣定型化契約要求賣方提供履約擔保，有哪些方式？其中「不動產開發信託」如何運作？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依消費者保護法<span class=\"art\">第17條第2項第3款</span>，定型化契約應記載事項得包括預付型交易之履約擔保；預售屋買賣定型化契約應記載事項據此要求賣方提供履約擔保。預售屋買賣定型化契約應記載事項第七點之一要求賣方就五種方式擇一提供履約擔保，保障預售屋買方交屋安全。</p>", "<span class=\"blk-l\">二、法條</span><p>預售屋買賣定型化契約應記載及不得記載事項第七點之一（履約擔保機制）</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）履約擔保之方式</p><p>依應記載事項第七點之一，賣方應就不動產開發信託、價金返還之保證、價金信託、同業連帶擔保、公會辦理連帶保證協定五種方式擇一處理。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方簽約時，應確認契約勾選其中一種履約擔保方式。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>預售屋交易時房屋尚未完成，買方先付價款，須有擔保機制避免建商倒閉或挪用資金。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）不動產開發信託之運作</p><p>建商或起造人將建案土地及興建資金信託予金融機構或經政府許可之信託業者管理，興建資金依工程進度專款專用；「簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商將建案土地與興建資金交付信託業者，依工程進度撥付工程款，買方簽約時取得信託證明文件。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>土地與資金同時脫離建商控制，避免挪作他用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）與其他方式之區別</p><p>價金信託只信託買方所付價金，其受益人為賣方而非買方；價金返還之保證費用由賣方負擔，賣方未完工或交屋時由金融機構返還價金；同業連帶擔保與公會辦理連帶保證協定，則是由他家建商完成本建案後交屋。</p><p class=\"evx\"><span class=\"evt\">例</span><span>選擇價金信託者，信託標的僅為買方所付價金。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>各方式擔保標的與效果不同，「退錢」與「續建交屋」不可混淆。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>預售屋買賣定型化契約之履約擔保方式有不動產開發信託、價金返還之保證、價金信託、同業連帶擔保、公會辦理連帶保證協定五種，賣方擇一處理。不動產開發信託，是建商或起造人將建案土地及興建資金信託予金融機構或經許可之信託業者管理，興建資金依工程進度專款專用，簽約時賣方應提供信託證明文件或影本；其與價金信託之差別在於同時信託土地與資金，而非只信託價金。</p>"], "ck": [{"x": "履約擔保之依據為預售屋買賣定型化契約應記載事項（要點整理，113-8），非法律條文", "h": false}, {"x": "五種方式要寫齊：不動產開發信託、價金返還之保證、價金信託、同業連帶擔保、公會辦理連帶保證協定", "h": false}, {"x": "開發信託＝建案土地及興建資金信託予金融機構或經政府許可之信託業者", "h": false}, {"x": "興建資金依工程進度專款專用，建商不得挪用", "h": false}, {"x": "簽約時賣方應提供信託證明文件或影本給買方", "h": true}, {"x": "價金信託只信託價金，開發信託含土地與興建資金（最常考的辨別點）", "h": true}], "mn": "開・價・返・同；開發信託＝土地＋資金，依進度撥款"}, {"id": "es-d3", "no": "D3", "t": "違反不得記載事項的契約效力", "lv": "預測", "k": "pred", "tier": 3, "g": "定型化契約", "q": "某預售屋買賣契約中載有「屋簷、雨遮面積計入買賣價格」之條款，而該條款屬主管機關公告之不得記載事項。請問：（一）該條款之效力如何？（二）該買賣契約其餘部分之效力又如何？請說明判斷標準。", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不得記載事項，是中央主管機關公告不得訂入定型化契約之條款。違反公告之條款無效，但契約其餘部分是否有效，應依契約一部無效之規定判斷。依<span class=\"art\">第16條</span>，除去無效部分契約亦可成立者，其他部分仍為有效；但對當事人之一方顯失公平者，該契約全部無效。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">消費者保護法<span class=\"art\">第17條第1項</span>、第3項<span class=\"lawn\">（應記載及不得記載事項）</span></span><span class=\"evli\">第4項，<span class=\"art\">第16條</span>，<span class=\"art\">第12條</span>（定型化契約條款顯失公平者無效）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）違反不得記載事項之條款效力</p><p>依消保法<span class=\"art\">第17條第1項</span>，中央主管機關得選擇特定行業，擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之；依同條第4項，違反第1項公告之定型化契約，其定型化契約條款無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋買賣契約載有屋簷、雨遮面積計入買賣價格之條款，屬公告之不得記載事項，該條款無效。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>不得記載事項之內容得包括加重消費者之義務或責任等對消費者顯失公平事項，故直接否定其效力。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）契約其餘部分之效力</p><p>依<span class=\"art\">第17條第4項</span>後段，該定型化契約之效力，依前條規定定之；依<span class=\"art\">第16條</span>，定型化契約條款全部或一部無效者，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效；但對當事人之一方顯失公平者，該契約全部無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>除去雨遮計價條款後，買賣標的與價金仍可確定，契約其他部分仍為有效。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第17條第4項</span>後段明定契約效力依<span class=\"art\">第16條</span>定之。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）判斷標準</p><p>先問除去無效條款後契約能否成立；能成立者其餘部分有效，但除去後對當事人之一方顯失公平者，契約全部無效。另依<span class=\"art\">第12條第1項</span>，定型化契約條款違反誠信原則，對消費者顯失公平者，無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>除去條款後雙方權利義務仍屬平衡，即維持契約。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以顯失公平作為全部無效之界線。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）屋簷、雨遮面積計入買賣價格之條款屬公告之不得記載事項，依消保法<span class=\"art\">第17條第4項</span>，該條款無效。（二）契約其餘部分依<span class=\"art\">第16條</span>判斷：除去該條款後契約亦可成立者，其他部分仍為有效；但對當事人之一方顯失公平者，該契約全部無效。判斷標準為除去無效條款後契約能否成立，以及是否對當事人之一方顯失公平；不得一看到違反不得記載事項就認定整份契約無效。</p>"], "ck": [{"x": "§17Ⅰ③：不得記載事項由中央主管機關擬訂、報行政院核定後公告", "h": false}, {"x": "§17Ⅳ 前段：違反第一項公告之定型化契約，其定型化契約條款無效", "h": false}, {"x": "§12Ⅰ：條款違反誠信原則對消費者顯失公平者無效（公告以外的備位依據）", "h": false}, {"x": "§17Ⅳ 後段：該定型化契約之效力，依前條（§16）規定定之", "h": true}, {"x": "§16 本文：除去該部分契約亦可成立者，其他部分仍為有效", "h": true}, {"x": "§16 但書：除去後對當事人之一方顯失公平者，該契約全部無效", "h": true}, {"x": "兩段都要寫：原則其餘有效（103-22）＋但書全部無效，只寫一半會失分", "h": false}], "mn": "條款倒、契約不一定倒；除去後顯失公平，契約才全部倒", "hp": 1025, "hpl": "中"}, {"id": "es-fw05", "no": "範文05★", "t": "112年申論二｜住戶資源回收堆置違規，管理委員會如何強制其遷離", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "社區住戶甲以資源回收為業，經常將資源回收物堆放於樓梯間及梯廳，經管理委員會多次要求移置，仍未處理。嗣後，管理委員會再報請環保局罰鍰在案，依舊拒不處理。請問如何將此惡鄰居趕出社區？請依公寓大廈管理條例相關規定說明之。（25 分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公寓大廈管理條例<span class=\"art\">第22條第1項</span>，住戶有該項各款情形之一，經促請改善三個月內仍未改善者，得依區分所有權人會議之決議訴請法院強制其遷離；住戶為區分所有權人者，依同條第2項得訴請命其出讓，判決確定後三個月內不出讓者，得聲請法院拍賣。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第16條第2項</span><span class=\"lawn\">（禁止堆置雜物、營業使用與廣告物）</span></span><span class=\"evli\"><span class=\"art\">第22條第1項</span>、第2項、第3項<span class=\"lawn\">（強制遷離與強制出讓／拍賣）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲之行為構成強制遷離要件</p><p>依<span class=\"art\">第16條第2項</span>，住戶不得於樓梯間、共同走廊等處堆置雜物。甲於樓梯間及梯廳堆置回收物，經管委會多次要求、環保局裁罰仍拒不處理，屬<span class=\"art\">第22條第1項第3款</span>「其他違反法令或規約情節重大者」；管委會並得依<span class=\"art\">第16條第5項</span>報請主管機關依<span class=\"art\">第49條第1項第4款</span>處罰鍰，甲受罰後仍不改善或續犯者，另該當同項第2款。</p><p class=\"evx\"><span class=\"evt\">例</span><span>回收物堵塞逃生動線，影響全體住戶安全。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>已逾一般違規程度，危及公共安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）強制遷離程序</p><p>依<span class=\"art\">第22條第1項</span>，由管理委員會促請甲改善，於3個月內仍未改善者，得依區分所有權人會議之決議，訴請法院強制其遷離。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>先給改善期間，並以區權會決議取得正當性。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲為區分所有權人時</p><p>依<span class=\"art\">第22條第2項</span>，管委會得依區權會決議，訴請法院命甲出讓其區分所有權及其基地所有權應有部分；判決確定後3個月內不自行出讓並完成移轉登記手續者，得聲請法院拍賣。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲是屋主，判決後仍不賣屋，管委會即可聲請拍賣。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）受償順序</p><p>依<span class=\"art\">第22條第3項</span>，拍賣所得除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。</p></div>", "<span class=\"blk-l\">四、結論</span><p>甲於樓梯間堆置雜物，經多次要求及裁罰仍不改善，屬情節重大。管委會應先促請改善，3個月內未改善，得依區權會決議訴請法院強制遷離；甲為區分所有權人者，得訴請命其出讓，判決確定後3個月內不出讓，得聲請拍賣，以維護其他住戶之共同生活品質。</p>"], "ck": [{"x": "§16Ⅱ：樓梯間、共同走廊等處所不得堆置雜物；§16Ⅴ：管委會應制止，不遵從得報請主管機關處理", "h": false}, {"x": "§22Ⅰ②：違反本條例經依 §49Ⅰ 第一款至第四款處罰鍰後仍不改善或續犯；③其他違反法令或規約情節重大", "h": false}, {"x": "§22Ⅰ：促請改善 → 3 個月仍未改善 → 依區分所有權人會議決議 → 訴請法院強制遷離", "h": true}, {"x": "四個步驟要寫齊，並點明甲落在 §22Ⅰ② （備位③）", "h": false}, {"x": "§22Ⅱ：住戶為區分所有權人時，得依區權會決議訴請法院命其出讓區分所有權及基地所有權應有部分", "h": false}, {"x": "§22Ⅱ後段：判決確定後 3 個月內不自行出讓並完成移轉登記者，得聲請法院拍賣", "h": true}, {"x": "§22Ⅲ：拍賣所得就積欠應分擔之費用，受償順序與第一順位抵押權同", "h": true}, {"x": "只寫遷離會失分，甲為區分所有權人時要再寫出讓、拍賣與受償順序", "h": false}], "mn": "百分之一、三個月、三個月（積欠1%／促請改善3個月／判決確定3個月）", "hp": 1027, "hpl": "中"}, {"id": "es-fw08", "no": "範文08", "t": "99年申論二｜公寓大廈重建同意與不同意重建之處理", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "公寓大廈管理條例對於公寓大廈之重建同意與不同意重建之處理有何規定？試說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>重建涉及全體區分所有權人的重大財產處分，原則應經全體同意；但若遇重大事變致危害公共安全，堅持全體同意將使危險建物無法處理，故條例設有例外與不同意者之處理程序。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第13條</span><span class=\"lawn\">（重建之原則與例外）</span></span><span class=\"evli\"><span class=\"art\">第14條</span><span class=\"lawn\">（不同意重建者之處理）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原則</p><p>依<span class=\"art\">第13條</span>，公寓大廈之重建，應經全體區分所有權人及基地所有權人、地上權人或典權人之同意。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>重建等同處分全體財產。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）例外</p><p>但有下列情形之一者，不在此限（不須全體同意）：<span class=\"evli\">①配合都市更新計畫而實施重建者；</span><span class=\"evli\">②嚴重毀損、傾頹或朽壞，有危害公共安全之虞者；</span><span class=\"evli\">③因地震、水災、風災、火災或其他重大事變，肇致危害公共安全者。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>地震後經公告為危險建築，區權會決議即可重建。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>公共安全優先，避免少數人阻擋。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不同意重建者之處理</p><p>依<span class=\"art\">第14條</span>，有<span class=\"art\">第13條第2款</span>或第3款情形之一，經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某住戶反對重建又不賣，管委會可訴請法院命其出讓。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）受讓人之地位</p><p>前項之受讓人視為同意重建。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免重建因個別異議反覆遲延。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>重建原則應經全體同意；配合都更、嚴重毀損或重大事變危害公共安全者，得依區權會決議重建。第2、3款情形經決議重建後，不同意又不出讓者，管理負責人或管委會得訴請法院命其出讓，受讓人視為同意重建，在財產權與公共安全間取得平衡。</p>"], "ck": [{"x": "§13 本文：重建應經全體區分所有權人及基地所有權人、地上權人或典權人同意", "h": true}, {"x": "§13 但書三款：配合都更／嚴重毀損傾頹朽壞有危害公共安全之虞／重大事變肇致危害公共安全", "h": false}, {"x": "例外的前提是「危害公共安全（之虞）」，只寫「房子老舊」不該當", "h": true}, {"x": "§14Ⅰ：限 §13 第 2、3 款情形經區權會決議重建，不同意又不出讓或同意後不履行→管理負責人或管委會訴請法院命出讓", "h": false}, {"x": "訴請出讓的適用範圍不含 §13 第 1 款（配合都市更新計畫）", "h": false}, {"x": "§14Ⅱ：前項之受讓人視為同意重建", "h": true}, {"x": "寫作主軸：原則全體同意 → 例外依區權會決議 → 異議者訴請出讓 → 受讓人視為同意", "h": false}], "mn": "原則全體、例外公安；不讓就訴請出讓，受讓人視為同意"}, {"id": "es-fw13", "no": "範文13", "t": "102年申論一｜約定共用部分定義、規約定義及對繼受人效力", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "某不動產仲介公司被委託出售一棟五層公寓大廈之某層樓，該大廈地下室劃設四個停車位。何謂「約定共用部分」？何謂「規約」？系爭樓層承購戶於辦竣所有權移轉登記後，始發現並無分配之停車位使用權，遂主張該規約對其不生效力，其主張有無理由？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第3條第6款</span>，約定共用部分指公寓大廈專有部分經約定供共同使用者；依<span class=\"art\">第3條第12款</span>，規約指區分所有權人為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第3條第5款</span>、第6款、第12款<span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第23條第2項</span><span class=\"lawn\">（規約之訂定與效力）</span></span><span class=\"evli\"><span class=\"art\">第24條</span><span class=\"lawn\">（繼受人之規約拘束）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）約定共用部分</p><p>依<span class=\"art\">第3條第6款</span>，指公寓大廈專有部分經約定供共同使用者。本題地下室停車位若原屬共用部分而約定供特定人使用，則為第5款之約定專用部分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某戶把自己專有的地下室空間提供全體住戶當自行車室，才是約定共用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）規約</p><p>依<span class=\"art\">第3條第12款</span>，指公寓大廈區分所有權人為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項。</p></div><div class=\"evp\"><p class=\"evh\">（三）承購戶主張有無理由</p><p>1.依<span class=\"art\">第23條第2項</span>，約定專用部分、約定共用部分之範圍及使用主體，非經載明於規約者，不生效力。故應先確認停車位分配是否已載明於規約。2.若已載明，依<span class=\"art\">第24條</span>，區分所有權之繼受人應於繼受前向管理負責人或管理委員會請求閱覽或影印<span class=\"art\">第35條</span>所定文件（含規約），並應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項；承購戶不得以事後始發現為由主張不生效力。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方簽約前未查閱規約，交屋後才知沒有車位，仍受拘束。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>繼受人有查閱義務，維持規約安定。3.若未載明於規約，該分配本身不生效力，承購戶之主張有理由。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>約定共用部分指專有部分經約定供共同使用者；規約指經區權會決議之共同遵守事項。停車位分配已載明於規約者，承購戶負繼受前查閱義務，主張不生效力無理由；未載明者，該分配不生效力，主張始有理由。</p>"], "ck": [{"x": "§3⑥：約定共用部分＝專有部分經約定供共同使用；§3⑤：約定專用部分＝共用部分經約定供特定區分所有權人使用", "h": true}, {"x": "地下室停車位若原屬共用而供特定人使用，是約定專用，不是約定共用", "h": false}, {"x": "§3⑫：規約＝區分所有權人為增進共同利益、確保良好生活環境，經區權會決議之共同遵守事項", "h": false}, {"x": "§23Ⅱ①：約定專用、約定共用部分之範圍及使用主體，非經載明於規約者不生效力", "h": false}, {"x": "§24Ⅰ：繼受人應於繼受前請求閱覽或影印法定文件，並於繼受後遵守規約所定一切權利義務", "h": true}, {"x": "已載明→怠於查閱之不利益自負，不得以事後始發現對抗；未載明→欠缺生效要件", "h": false}, {"x": "必須分「已合法載明（無理由）／未合法載明（有理由）」兩種情況作答", "h": true}], "mn": "專用←共用；共用←專有。載明了怪你沒查，沒載明本來就不生效", "hp": 13, "hpl": "高"}, {"id": "es-fw20", "no": "範文20", "t": "106年申論一｜約定專用部分定義及起造人成立後能否由區權會決議變更", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "公寓大廈管理", "q": "何謂約定專用部分？公寓大廈之起造人於申請建造執照時成立之約定專用部分，區分所有權人會議之決議是否可以予以變更？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>約定專用部分，指公寓大廈共用部分經約定供特定區分所有權人使用者（<span class=\"art\">第3條第5款</span>）；依<span class=\"art\">第56條第1項</span>成立者，其變更應經使用該約定專用部分之區分所有權人同意（<span class=\"art\">第33條第3款</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第3條第5款</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第33條第3款</span><span class=\"lawn\">（約定專用部分之變更）</span></span><span class=\"evli\"><span class=\"art\">第56條第1項</span><span class=\"lawn\">（起造人之規約草約與預售屋）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）約定專用部分之定義</p><p>依<span class=\"art\">第3條第5款</span>，指公寓大廈共用部分經約定供特定區分所有權人使用者。</p><p class=\"evx\"><span class=\"evt\">例</span><span>一樓住戶約定專用其前院空地。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>共用部分可透過約定分配給特定人使用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）起造人成立之約定專用部分能否以區權會決議變更</p><p>依<span class=\"art\">第33條第3款</span>，依<span class=\"art\">第56條第1項</span>規定成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限。本題起造人於申請建造執照時成立之約定專用部分，即屬<span class=\"art\">第56條第1項</span>成立者，區分所有權人會議不得逕以多數決變更其範圍或使用主體，須經該使用人同意。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商規劃頂樓平台由頂樓住戶約定專用，其他住戶不能開會表決收回。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第33條</span>序文規定，未經使用人同意之區權會決議不生效力。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）例外</p><p>該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不必經使用人同意。</p><p class=\"evx\"><span class=\"evt\">例</span><span>約定專用妨礙逃生通道。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>約定專用部分指共用部分經約定供特定區分所有權人使用者。起造人申請建造執照時成立之約定專用部分，區權會不得逕以決議變更，原則須經使用人同意；僅於顯已違反公共利益並經法院判決確定時，始得不經同意變更。</p>"], "ck": [{"x": "§3⑤：約定專用部分＝共用部分經約定供特定區分所有權人使用", "h": false}, {"x": "定義的起點是「共用部分」，寫成「專有部分」即錯（那是約定共用部分）", "h": true}, {"x": "§33 柱句：區權會決議未依各款辦理者，不生效力（是生效要件，不是得撤銷）", "h": false}, {"x": "§33③：依 §56Ⅰ 成立之約定專用部分變更，應經使用該部分之區分所有權人同意", "h": false}, {"x": "區權會不得以多數決逕行變更，這是本題核心結論", "h": true}, {"x": "§33③ 但書：顯已違反公共利益＋經管委會或管理負責人訴請法院判決確定，始為例外", "h": true}, {"x": "例外二要件須同時具備，只寫「違反公共利益」而漏「法院判決確定」不完整", "h": false}], "mn": "專用←共用、共用←專有；變更要使用人點頭，除非顯違公益經法院判決確定", "hp": 14, "hpl": "高"}, {"id": "es-fw22", "no": "範文22", "t": "107年申論一｜強制遷離與強制拍賣程序（一般版）", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "住戶有何種情形時，管理委員會促請其改善卻未改善者，管理委員會得訴請法院強制其遷離？如該住戶為區分所有權人時，管理委員會如何聲請法院強制拍賣其區分所有權？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公寓大廈管理條例<span class=\"art\">第22條</span>，住戶有第1項各款情形之一，經促請改善三個月仍未改善者，得依區分所有權人會議決議訴請法院強制遷離；住戶為區分所有權人者，並得依第2項訴請命其出讓、聲請拍賣。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第22條第1項</span>、第2項、第3項<span class=\"lawn\">（強制遷離與強制出讓／拍賣）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得訴請強制遷離之情形</p><p>依<span class=\"art\">第22條第1項</span>，住戶有下列情形之一者，由管理負責人或管理委員會促請其改善，於3個月內仍未改善者，得依區分所有權人會議之決議，訴請法院強制其遷離：<span class=\"evli\">①積欠依本條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者；</span><span class=\"evli\">②違反本條例規定經依<span class=\"art\">第49條第1項第1款</span>至第4款規定處以罰鍰後，仍不改善或續犯者；</span><span class=\"evli\">③其他違反法令或規約情節重大者。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>住戶積欠管理費經強制執行後，再度積欠金額達其區分所有權總價百分之一。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>三款情形均須先經促請改善，於三個月內仍未改善，並經區分所有權人會議決議，始得訴請法院。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）住戶為區分所有權人時之強制拍賣</p><p>依<span class=\"art\">第22條第2項</span>，管理負責人或管理委員會得依區權會之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分；於判決確定後3個月內不自行出讓並完成移轉登記手續者，得聲請法院拍賣。</p><p class=\"evx\"><span class=\"evt\">例</span><span>屋主判決確定後仍不賣，管委會可聲請拍賣。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>遷離後仍保有產權者，須以出讓、拍賣徹底解決。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）受償順序</p><p>依<span class=\"art\">第22條第3項</span>，拍賣所得除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。</p></div>", "<span class=\"blk-l\">四、結論</span><p>住戶積欠費用經強制執行後再欠達總價1%、經罰鍰仍不改善或續犯、或其他情節重大者，經促請改善3個月未改善，得依區權會決議訴請強制遷離；住戶為區分所有權人者，得訴請命其出讓，判決確定後3個月內未出讓，得聲請拍賣，積欠費用與第一順位抵押權同順位受償。</p>"], "ck": [{"x": "§22Ⅰ：促請改善→3 個月仍未改善→依區權會決議→訴請法院強制遷離", "h": true}, {"x": "§22Ⅰ①：欠費須「經強制執行後再度」積欠達區分所有權總價 1%（不是千分之一）", "h": true}, {"x": "§22Ⅰ②③：罰鍰後仍不改善或續犯／其他違反法令或規約情節重大", "h": false}, {"x": "三種情形要寫齊，少寫一種就少一塊分數", "h": false}, {"x": "§22Ⅱ：先訴請法院命出讓區分所有權「及其基地所有權應有部分」", "h": false}, {"x": "§22Ⅱ：判決確定後 3 個月不自行出讓並完成移轉登記，才得聲請法院拍賣", "h": false}, {"x": "§22Ⅲ：拍賣所得就積欠應分擔費用之受償順序與第一順位抵押權同", "h": false}, {"x": "承租人只能被訴請遷離，出讓與拍賣僅對區分所有權人；兩個 3 個月（促請改善／判決確定後）不可混", "h": true}], "mn": "百分之一、三個月（促請改善）、三個月（判決確定後）", "hp": 1026, "hpl": "中"}, {"id": "es-fw28", "no": "範文28", "t": "111年申論二｜區權會臨時會議召開情形及召集人", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "區分所有權人會議於何種情形時，應召開臨時會議？召集人為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>區分所有權人會議原則每年召開定期會議，但遇重大突發事故或迫切共同事務，等到下次定期會議恐緩不濟急，故條例另設臨時會議，並規定召集人產生方式。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第25條第1項</span>至第4項<span class=\"lawn\">（區權會之召集：定期與臨時會議）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應召開臨時會議之情形</p><p>依<span class=\"art\">第25條第1項</span>、第2項，區分所有權人會議除每年至少召開定期會議一次外，有下列情形之一者，應召開臨時會議：<span class=\"evli\">①發生重大事故有及時處理之必要，經管理負責人或管理委員會請求者；</span><span class=\"evli\">②經區分所有權人五分之一以上及其區分所有權比例合計五分之一以上，以書面載明召集之目的及理由請求召集者。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>颱風造成外牆剝落需立即修繕，管委會請求召開臨時會。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>一由管理階層主動、一由住戶連署，兼顧效率與自主參與。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）召集人</p><p>依<span class=\"art\">第25條第3項</span>，除<span class=\"art\">第28條</span>規定外，由具區分所有權人身分之管理負責人、管理委員會主任委員或管理委員為召集人；管理負責人、管理委員會主任委員或管理委員喪失區分所有權人資格日起，視同解任。無管理負責人或管理委員會，或無區分所有權人擔任管理負責人、主任委員或管理委員時，由區分所有權人互推一人為召集人。依第4項，召集人無法依前項規定互推產生時，各區分所有權人得申請直轄市、縣（市）主管機關指定臨時召集人；區分所有權人不申請指定時，主管機關得視實際需要指定區分所有權人一人為臨時召集人，或依規約輪流擔任，其任期至互推召集人為止。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保會議總有人能召集。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>臨時會議於重大事故經管理負責人或管委會請求，或經區分所有權人及比例各五分之一以上書面請求時召開。召集人原則由具區分所有權人身分之管理負責人、主委或管委擔任，無人時互推；無法互推者，得申請主管機關指定臨時召集人，或依規約輪流擔任。</p>"], "ck": [{"x": "§25Ⅰ：區權會由全體區分所有權人組成，每年至少召開定期會議 1 次", "h": false}, {"x": "§25Ⅱ①：發生重大事故有及時處理之必要，經管理負責人或管理委員會請求", "h": false}, {"x": "§25Ⅱ②：區分所有權人 1/5 以上「及」其區分所有權比例合計 1/5 以上（兩者都要）", "h": true}, {"x": "連署須「以書面載明召集之目的及理由」，口頭或未載明理由不生請求效力", "h": true}, {"x": "§25Ⅲ 前段：召集人須具區分所有權人身分之管理負責人、主委或管理委員（不是管委會全體）", "h": true}, {"x": "§25Ⅲ 後段：無上述人員時由區分所有權人互推一人，任期 1 至 2 年、連選得連任一次", "h": false}, {"x": "§25Ⅳ：無法互推時申請主管機關指定臨時召集人，任期至互推召集人為止", "h": true}, {"x": "召集人三層遞補（管理階層→互推→主管機關指定）要寫全", "h": false}], "mn": "臨時會兩把鑰匙：重大事故管委請求／五分之一雙門檻書面連署；召集人三層：階層、互推、指定"}, {"id": "es-fw31", "no": "範文31", "t": "113年申論二｜區權會決議出席比例同意方式及未獲決議重新召集處理", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "公寓大廈管理", "q": "區分所有權人會議之決議，其出席人數、區分所有權比例及同意方式應依該條例規定如何辦理？另未獲致決議者，得如何處理？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第3條第7款</span>，區分所有權人會議指區分所有權人為共同事務及涉及權利義務之有關事項，召集全體區分所有權人所舉行之會議；其決議門檻依<span class=\"art\">第31條</span>，未獲決議者依<span class=\"art\">第32條</span>重新召集。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第31條</span><span class=\"lawn\">（區權會決議門檻）</span></span><span class=\"evli\"><span class=\"art\">第32條</span><span class=\"lawn\">（未獲決議之重新召集）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）一般決議門檻</p><p>依<span class=\"art\">第31條</span>，區分所有權人會議之決議，除規約另有規定外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席，以出席人數四分之三以上及其區分所有權比例占出席人數區分所有權四分之三以上之同意行之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>全體90戶，至少60戶出席，出席者中至少45戶同意（比例亦同）。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>重大事項須有高度共識。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）未獲決議之重新召集</p><p>依<span class=\"art\">第32條第1項</span>，區分所有權人會議依前條規定未獲致決議、出席區分所有權人之人數或其區分所有權比例合計未達前條定額者，召集人得就同一議案重新召集會議；其開議除規約另有規定出席人數外，應有區分所有權人三人並五分之一以上及其區分所有權比例合計五分之一以上出席，以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免門檻過高導致事務永遠無法決定。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）送達與異議</p><p>依<span class=\"art\">第32條第2項</span>，前項決議之會議紀錄依<span class=\"art\">第34條第1項</span>規定送達各區分所有權人後，各區分所有權人得於7日內以書面表示反對意見；書面反對意見未超過全體區分所有權人及其區分所有權比例合計半數時，該決議視為成立。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以異議機制補強低門檻決議之正當性。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>一般決議須區分所有權人及比例各三分之二以上出席、出席者及其比例各四分之三以上同意；未獲決議者，召集人得重新召集，三人並五分之一以上出席、過半數同意作成決議，會議紀錄送達後7日內書面反對未超過全體半數者，視為成立。</p>"], "ck": [{"x": "§31：出席 2/3（人數＋區分所有權比例）、同意 3/4（出席人數＋其比例），除規約另有規定外", "h": true}, {"x": "人數與區分所有權比例是兩個標準，必須同時達到，不能只算人頭", "h": false}, {"x": "§32Ⅰ：召集人得就「同一議案」重新召集；出席為區分所有權人 3 人「並」1/5 以上，比例合計 1/5 以上", "h": true}, {"x": "§32Ⅰ：重新召集之同意門檻降為出席人數及其比例均過半數", "h": false}, {"x": "7 日是會議紀錄送達後提出書面反對的期間，不是重新召集的期限（重召條文未定期限）", "h": true}, {"x": "§32Ⅱ：書面反對未超過全體區分所有權人及其比例合計半數 → 決議視為成立", "h": true}, {"x": "§32Ⅲ：會議主席應於決議成立後 10 日內以書面送達全體區分所有權人並公告", "h": false}, {"x": "第二問要寫「降門檻＋送達異議」雙軌，只寫降門檻會失分", "h": false}], "mn": "二三出席、三四同意；重召三人一五、過半；送達七日反對、成立十日公告"}, {"id": "es-mk4", "no": "模四", "t": "模擬試題｜區分所有權人屢違規約：管委會處理與強制出讓", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "公寓大廈管理", "q": "A公寓大廈住戶甲為區分所有權人，屢次違反規約，經主管機關處罰鍰後仍不改善，情節重大。試說明：（一）管理委員會得如何處理？其程序為何？（二）若甲經判決命出讓其區分所有權及其基地所有權應有部分，其後未出讓，應如何處理？拍賣所得之受償順序為何？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>強制遷離，指住戶重大違規經促請改善而未改善，由管理委員會依區權會決議訴請法院強制其遷離；命出讓，指對區分所有權人進一步訴請法院命其出讓區分所有權及其基地所有權應有部分。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第22條</span><span class=\"lawn\">（強制遷離與強制出讓／拍賣）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）處理與程序</p><p>依<span class=\"art\">第22條</span>，住戶受罰鍰處分後仍不改善或情節重大者，管理委員會得促請其改善，3個月內未改善者，得依區分所有權人會議決議，訴請法院強制其遷離；如係區分所有權人，並得訴請法院命其出讓區分所有權及其基地所有權應有部分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>管委會先書面促請甲改善，逾3個月未改善，經區權會決議，訴請法院強制甲遷離並命其出讓。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>甲屢次違反規約，屬<span class=\"art\">第22條第1項第3款</span>情節重大；受依<span class=\"art\">第49條第1項第1款</span>至第4款罰鍰後仍不改善者，並該當第2款。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）未出讓之處理與受償順序</p><p>依<span class=\"art\">第22條</span>，判決確定後3個月內未自行出讓並完成移轉登記者，管理委員會得聲請法院拍賣，拍賣所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲逾期未出讓，管委會聲請拍賣。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>拍賣係實現命出讓判決之手段。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）促請改善（3個月）→區權會決議→訴請遷離、命出讓。（二）判決確定後3個月未出讓，管委會得聲請拍賣；拍賣所得就積欠應分擔費用部分，受償順序與第一順位抵押權同。</p>"], "ck": [{"x": "公寓§22：住戶受罰鍰後仍不改善或其他情節重大 → 管委會得依本條處理", "h": false}, {"x": "先促請改善，3 個月內仍未改善，才進入訴訟程序", "h": false}, {"x": "訴請法院強制遷離須依區分所有權人會議決議，不能由管委會逕行提告", "h": true}, {"x": "甲為區分所有權人 → 並得訴請法院命其出讓區分所有權及其基地所有權應有部分", "h": false}, {"x": "兩段 3 個月：第一段自促請改善起算，第二段自判決確定起算", "h": true}, {"x": "判決確定後 3 個月內未自行出讓並完成移轉登記 → 管委會得聲請法院拍賣", "h": false}, {"x": "拍賣所得就積欠應分擔費用部分，受償順序與第一順位抵押權同，不是依登記先後", "h": true}], "mn": "促請→3 月→區權會→告遷離（＋命出讓）→判決確定 3 月→拍賣→積欠費用比照一順位"}, {"id": "es-mk5", "no": "模五", "t": "模擬試題｜漏水修繕：專有、共用與樓地板管線的責任與費用", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "公寓大廈管理", "q": "甲住 3 樓、乙住 4 樓。甲家浴室漏水，抓漏發現是 3、4 樓樓地板內管線自然損壞；同棟頂樓平台防水層年久失修也在漏水。兩處的修繕責任與費用各由誰承擔？若樓板漏水是乙裝修不當造成，結論有何不同？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>修繕分兩問：誰負責修、誰出錢。專有部分自修自付；共用部分由管委會負責，費用由公共基金或按應有部分比例分擔；樓地板內管線另有特別規定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第10條第1項</span>、第2項<span class=\"lawn\">（專有部分與共用部分之修繕）</span></span><span class=\"evli\"><span class=\"art\">第11條</span><span class=\"lawn\">（共用部分重大修繕、改良）</span></span><span class=\"evli\"><span class=\"art\">第12條</span><span class=\"lawn\">（共同壁、樓地板及其管線之費用）</span></span><span class=\"evli\"><span class=\"art\">第36條第2款</span><span class=\"lawn\">（管理委員會之職務）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）頂樓平台防水層</p><p>依<span class=\"art\">第10條第2項</span>，共用部分由管理負責人或管委會修繕，費用由公共基金支付或由區分所有權人按應有部分比例分擔（專有部分依同條第1項自修自付）；重大修繕依<span class=\"art\">第11條</span>須經區權會決議，管委會僅負一般修繕（<span class=\"art\">第36條第2款</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>防水層年久失修，修繕義務在管委會，非頂樓住戶單獨負責。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>防水層屬共用部分。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）樓地板內管線</p><p>依<span class=\"art\">第12條</span>，樓地板或其內之管線，其維修費用由樓地板上下方之區分所有權人共同負擔。</p><p class=\"evx\"><span class=\"evt\">例</span><span>3、4樓間管線自然損壞，由3、4樓區分所有權人共同負擔；修繕依<span class=\"art\">第10條第1項</span>由其自行為之（樓地板屬專有部分之範圍）。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>本條為特別規定，只規定費用，主體是區分所有權人，不是住戶。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙裝修不當</p><p>依<span class=\"art\">第12條</span>但書，樓地板或其內管線之修繕費係因可歸責於區分所有權人之事由所致者，由該區分所有權人負擔（共用部分則依<span class=\"art\">第10條第2項</span>但書，可歸責於區分所有權人或住戶者由其負擔）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>樓板漏水係乙裝修不當所致，改由乙負擔。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>可歸責只改變誰出錢；樓板管線之修繕仍由3、4樓區分所有權人依<span class=\"art\">第10條第1項</span>為之。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>防水層由管委會修繕，費用由公共基金或按比例分擔，重大修繕須經區權會決議；樓板管線由3、4樓區分所有權人自行修繕、共同負擔費用；乙可歸責時改由乙負擔。</p>"], "ck": [{"x": "§10Ⅰ：專有部分由區分所有權人或使用人自修自付", "h": false}, {"x": "§12：樓地板及其內管線維修費用由上下方區分所有權人共同負擔", "h": false}, {"x": "§12 負擔主體是「區分所有權人」，不是「住戶」", "h": true}, {"x": "§10Ⅱ：共用部分由管委會修繕，費用由公共基金或按應有部分比例分擔", "h": false}, {"x": "頂樓平台防水層屬共用部分 → 管委會負責，不是頂樓住戶負責", "h": true}, {"x": "§11、§36②：重大修繕須區權會決議；管委會職務只有一般修繕與一般改良", "h": false}, {"x": "§12 但書、§10Ⅱ 但書：可歸責者負擔修繕費", "h": false}, {"x": "可歸責只改「誰出錢」，共用部分仍由管委會修繕，不是由區分所有權人自己為之", "h": true}], "mn": "專有自己來，共用管委會；樓板上下分，誰弄壞誰付；大修找區權會"}, {"id": "es-e1", "no": "E1", "t": "管理委員的任期、連任與會議通知", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "管理委員會的委員任期多久？哪些職位連任有限制？區分所有權人會議召開前，通知有什麼規定？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>管理委員會是執行區分所有權人會議決議事項的管理組織，由管理委員互推一人為主任委員，主任委員對外代表管理委員會。條例<span class=\"art\">第29條第3項</span>、<span class=\"art\">第30條</span>、<span class=\"art\">第34條</span>就委員任期、連任次數、開會通知及會議紀錄設有規定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第29條第3項</span><span class=\"lawn\">（管理委員之任期）</span></span><span class=\"evli\"><span class=\"art\">第30條</span><span class=\"lawn\">（區權會之通知與臨時動議限制）</span></span><span class=\"evli\"><span class=\"art\">第34條</span><span class=\"lawn\">（會議紀錄之送達）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）任期</p><p>依<span class=\"art\">第29條第3項</span>，管理委員、主任委員及管理負責人之任期，依區分所有權人會議或規約之規定，任期一至二年；區分所有權人會議或規約未規定者，任期一年。</p><p class=\"evx\"><span class=\"evt\">例</span><span>規約定任期二年，委員任期即為二年；規約未規定，則為一年。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>任期過長易生把持，過短則管理難以延續。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）連任限制</p><p>依同項，主任委員、管理負責人、負責財務管理及監察業務之管理委員，連選得連任一次；其餘管理委員，連選得連任。</p><p class=\"evx\"><span class=\"evt\">例</span><span>主任委員連選連任一次後，不得再連任；一般管理委員則無此次數限制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>主委、財務、監察職位掌握代表、金錢與監督權限，限制連任以避免權力集中。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）開會通知</p><p>依<span class=\"art\">第30條第1項</span>，區分所有權人會議，應由召集人於開會前十日以書面載明開會內容，通知各區分所有權人；但有急迫情事須召開臨時會者，得以公告為之，公告期間不得少於二日。依同條第2項，管理委員之選任事項，應在開會通知中載明並公告之，不得以臨時動議提出。</p><p class=\"evx\"><span class=\"evt\">例</span><span>開會當天以臨時動議改選管理委員，即不合法。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使區分所有權人事先知悉議題，確保治理透明。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）會後紀錄</p><p>依<span class=\"art\">第34條</span>，區分所有權人會議應作成會議紀錄，由主席簽名，於會後十五日內送達各區分所有權人並公告之。</p></div>", "<span class=\"blk-l\">四、結論</span><p>委員任期依區分所有權人會議或規約定為一至二年，未規定者為一年。主任委員、管理負責人及負責財務管理、監察業務之管理委員，連選得連任一次；其餘管理委員連選得連任。會議應於開會前十日以書面通知，急迫臨時會得以公告為之，公告期間不得少於二日；管理委員選任事項須載明於通知並公告，不得以臨時動議提出；會議紀錄於會後十五日內送達並公告。</p>"], "ck": [{"x": "§29Ⅲ：任期依區權會或規約規定為 1 至 2 年；未規定者任期 1 年", "h": false}, {"x": "§29Ⅳ：任期屆滿未再選任或拒絕移交者，自任期屆滿日起視同解任", "h": false}, {"x": "§29Ⅲ 後段：主任委員、管理負責人、負責財務管理及監察業務之管理委員，連選得連任一次", "h": true}, {"x": "其餘管理委員連選得連任，不可把連任一次的限制套到所有委員，也不是無限連任", "h": true}, {"x": "§30Ⅰ：開會前 10 日以書面載明開會內容通知；急迫臨時會得公告，公告期間不得少於 2 日", "h": false}, {"x": "§30Ⅱ：管理委員選任事項須載明於開會通知並公告，不得以臨時動議提出", "h": false}, {"x": "§34：會議紀錄由主席簽名，於會後 15 日內送達各區分所有權人並公告", "h": false}], "mn": "主財監只連一次；通知 10 日、公告 2 日、紀錄 15 日"}, {"id": "es-e2", "no": "E2", "t": "起造人召集第一次區分所有權人會議", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "新成立的公寓大廈，起造人在什麼情形下應召集區分所有權人會議？沒有成立管理委員會前，由誰負責管理？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>新成立之公寓大廈尚無管理組織，條例課起造人召集第一次區分所有權人會議之義務，並由起造人在管理組織成立前擔任管理負責人。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第28條第1項</span>至第3項<span class=\"lawn\">（起造人召集第一次區權會）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）召集時點</p><p>依<span class=\"art\">第28條第1項</span>，公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上時，起造人應於三個月內召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備。</p><p class=\"evx\"><span class=\"evt\">例</span><span>已登記之區分所有權人人數達半數，且其區分所有權比例合計也達半數，起造人即應於三個月內召集。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>人數與比例兩者均達半數，會議才足以代表多數住戶。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）起造人為數人與重新召集</p><p>依同條第2項，起造人為數人時，應互推一人為之；出席區分所有權人之人數或其區分所有權比例合計未達法定定額而未能成立管理委員會時，起造人應就同一議案重新召集會議一次。</p><p class=\"evx\"><span class=\"evt\">例</span><span>第一次會議出席不足而未能成立管理委員會，起造人須就同一議案再召集一次。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>給予成立管理組織之再一次機會。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）成立前之管理</p><p>依同條第3項，起造人於召集區分所有權人召開區分所有權人會議成立管理委員會或推選管理負責人前，為公寓大廈之管理負責人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>交屋初期尚未開會，社區事務由起造人以管理負責人身分處理。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免管理組織成立前無人負責。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>登記之區分所有權人人數達半數以上，且其區分所有權比例合計達半數以上時，起造人應於三個月內召集區分所有權人會議，成立管理委員會或推選管理負責人並報備；起造人為數人時互推一人，因出席不足未能成立者應就同一議案重新召集一次。管理委員會成立或推選管理負責人前，由起造人擔任管理負責人。</p>"], "ck": [{"x": "§28Ⅰ：登記之區分所有權人達半數以上「及」其區分所有權比例合計半數以上", "h": true}, {"x": "人數與比例是兩個都要達半數以上，只寫其一即失分", "h": true}, {"x": "§28Ⅰ：門檻達成後起造人應於「三個月內」召集，並向直轄市、縣（市）主管機關報備", "h": true}, {"x": "§28Ⅱ：起造人為數人應互推一人；出席未達 §31 定額未能成立管委會，應就同一議案重新召集一次", "h": false}, {"x": "會議的目的是「成立管理委員會或推選管理負責人」，兩者擇一，不可只寫管委會", "h": false}, {"x": "§28Ⅲ：管理委員會成立或管理負責人推選前，起造人為公寓大廈之管理負責人", "h": false}], "mn": "兩個半數到齊 → 三個月召集；管委會沒生出來之前，起造人就是管理負責人"}, {"id": "es-e3", "no": "E3", "t": "區分所有權人會議的表決權計算", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "甲一人持有某公寓大廈全部區分所有權之 30%（區分所有權比例合計 30%）。請問：（一）甲於區分所有權人會議之區分所有權比例表決權應如何計算？（二）區分所有權人委託他人代理出席，法律上有何限制？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>表決權是區分所有權人在區分所有權人會議參與決議之權利。條例以每一專有部分一表決權為原則，並對單一區分所有權人及受託代理人設五分之一之計算上限，超過部分不予計算（<span class=\"art\">第27條第2項</span>、第3項）。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第27條第1項</span>至第3項<span class=\"lawn\">（區權會之表決權計算）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲之表決權計算</p><p>依<span class=\"art\">第27條第1項</span>，各專有部分之區分所有權人有一表決權；數人共有一專有部分者，該表決權應推由一人行使。依同條第2項，任一區分所有權人之區分所有權占全部區分所有權五分之一以上者，或其所有之專有部分個數超過全部專有部分個數總合之五分之一以上者，其超過部分不予計算。本題甲之區分所有權比例合計30%，已逾五分之一，超過部分不予計算，故以區分所有權比例計算時，甲之表決權只計至20%。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第27條第2項</span>明定超過五分之一部分不予計算。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）代理出席之限制</p><p>依同條第3項，區分所有權人因故無法出席時，得以書面委託配偶、有行為能力之直系血親、其他區分所有權人或承租人代理出席。受託人於受託之區分所有權占全部區分所有權五分之一以上者，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，其超過部分不予計算。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某人集中受託之區分所有權合計達全部30%，超過五分之一部分同樣不予計算。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第27條第3項</span>對受託人亦設五分之一之計算上限。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲持有30%，已超過五分之一，超過部分不予計算，其區分所有權比例表決權只計至20%。（二）委託代理須以書面為之，受託人限於配偶、有行為能力之直系血親、其他區分所有權人或承租人；受託之區分所有權占全部五分之一以上，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，超過部分亦不予計算。</p>"], "ck": [{"x": "§27Ⅰ：各專有部分之區分所有權人有一表決權；數人共有推由一人行使", "h": false}, {"x": "§27Ⅱ：區分所有權達全部五分之一以上，或專有部分個數超過總數五分之一以上，超過部分不予計算", "h": true}, {"x": "甲 30% 已達 1/5 門檻，超過的 10% 不計，表決權只算 20%", "h": false}, {"x": "上限是五分之一（20%），不是 1/3 也不是 1/2", "h": true}, {"x": "§27Ⅲ 前段：須以書面委託，受託人限配偶、有行為能力之直系血親、其他區分所有權人或承租人", "h": false}, {"x": "§27Ⅲ 後段：受託人受託之區分所有權達 1/5 以上或代理人數超過 1/5，超過部分不予計算", "h": true}, {"x": "§27Ⅱ 的限制同時拘束「出席人數」與「表決權」兩項計算", "h": false}], "mn": "一部一權、共有推一；本人五分之一，代理人也五分之一，超過都不計"}, {"id": "es-e4", "no": "E4", "t": "欠繳管理費的兩階段處理", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "住戶積欠管理費，管理委員會可以怎麼處理？什麼情形可以訴請強制遷離？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>住戶積欠管理費等應分擔費用時，條例設兩階段處理：先由管理委員會催告並訴請法院命其給付；經強制執行後仍再度積欠達一定金額，才可進入強制遷離、強制出讓與拍賣。後者依<span class=\"art\">第22條第1項第1款</span>，須經強制執行後再度積欠達區分所有權總價百分之一，並經促請改善三個月仍未改善。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第21條</span><span class=\"lawn\">（積欠費用之訴請給付）</span></span><span class=\"evli\"><span class=\"art\">第22條第1項第1款</span>、第2項、第3項<span class=\"lawn\">（強制遷離與強制出讓／拍賣）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）第一階段（訴請給付）</p><p>依<span class=\"art\">第21條</span>，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用已逾二期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息。</p><p class=\"evx\"><span class=\"evt\">例</span><span>住戶連續三期未繳管理費，經催告仍不給付，管委會即得起訴請求欠款及遲延利息。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>先以催告與給付訴訟處理，侵害最小。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）第二階段（強制遷離）</p><p>依<span class=\"art\">第22條第1項第1款</span>，住戶積欠依本條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者，由管理負責人或管理委員會促請其改善，於三個月內仍未改善者，得依區分所有權人會議之決議，訴請法院強制其遷離。</p><p class=\"evx\"><span class=\"evt\">例</span><span>住戶欠費經強制執行後又再欠，金額達其區分所有權總價1%，促請改善三個月仍未改善，管委會即得依區權會決議起訴。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>遷離屬重大干預，須以前階段無效為前提。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）強制出讓與拍賣</p><p>依同條第2項，住戶如為區分所有權人時，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院命其出讓區分所有權及其基地所有權應有部分；判決確定後三個月內不自行出讓並完成移轉登記手續者，得聲請法院拍賣之。依第3項，拍賣所得於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保欠費能實際受償。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>管理委員會應先定相當期間催告，仍不給付者訴請法院命其給付欠款及遲延利息。須經強制執行後再度積欠達區分所有權總價百分之一，且經促請改善三個月仍未改善，始得依區分所有權人會議決議訴請強制遷離；住戶為區分所有權人者，並得訴請命其出讓，判決確定後三個月不出讓者得聲請拍賣。</p>"], "ck": [{"x": "§21：積欠已逾二期或達相當金額，經定相當期間催告仍不給付", "h": false}, {"x": "§21：得訴請法院命給付應繳金額「及遲延利息」", "h": false}, {"x": "兩階段不可跳：先 §21 訴請給付並強制執行，才可能有 §22 的「再度積欠」前提", "h": true}, {"x": "§22Ⅰ①：須「經強制執行後再度」積欠達區分所有權總價 1%", "h": true}, {"x": "1% 是區分所有權總價的百分之一，不是 10%、不是千分之一", "h": true}, {"x": "§22Ⅰ：促請改善→3 個月仍未改善→區分所有權人會議決議→訴請遷離", "h": false}, {"x": "§22Ⅱ：區分所有權人得訴請命出讓，判決確定後 3 個月不出讓得聲請拍賣", "h": false}], "mn": "先催告訴請給付；再百分之一、三個月，才走遷離與拍賣", "hp": 1028, "hpl": "中"}, {"id": "es-e5", "no": "E5", "t": "規約草約與承購戶的受拘束", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "起造人在申請建造執照時，應檢附什麼文件？該文件對承購戶有什麼效力？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第56條第1項</span>、第2項，規約草約由起造人於申請建造執照時檢附，經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第56條第1項</span>、第2項<span class=\"lawn\">（起造人之規約草約與預售屋）</span></span><span class=\"evli\"><span class=\"art\">第24條第1項</span><span class=\"lawn\">（繼受人之規約拘束）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）起造人應檢附之文件</p><p>依<span class=\"art\">第56條第1項</span>，公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約；於設計變更時亦同。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商申請建照時，一併送出各戶車位、頂樓平台使用分配圖與規約草約。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使專有、共用及約定使用範圍在銷售前即明確。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）草約之效力</p><p>依<span class=\"art\">第56條第2項</span>，規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。</p><p class=\"evx\"><span class=\"evt\">例</span><span>承購戶簽約時簽署同意規約草約，入住後即受其中停車位分配之拘束。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>區權會成立前也需有共同規則可依循。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）繼受人之義務</p><p>依<span class=\"art\">第24條第1項</span>，區分所有權之繼受人，應於繼受前向管理負責人或管理委員會請求閱覽或影印<span class=\"art\">第35條</span>所定文件，並應於繼受後遵守原區分所有權人依本條例或規約所定之一切權利義務事項。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保持規約對後手之拘束力，維持社區秩序安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>起造人申請建造執照時，應檢附專有、共用、約定專用、約定共用部分標示之詳細圖說及規約草約；草約經承受人簽署同意後，在區權會訂定規約前視為規約，承購戶即受其拘束，繼受人亦應遵守。</p>"], "ck": [{"x": "§56Ⅰ：建照申請時應檢附專有、共用、約定專用、約定共用標示之詳細圖說及規約草約，設計變更亦同", "h": false}, {"x": "起造人檢附的是「規約草約」，不是「規約」", "h": true}, {"x": "§56Ⅳ：共用部分圖說應包括設置管理維護使用空間之詳細位置圖說", "h": false}, {"x": "§56Ⅱ：草約經承受人簽署同意後，於區權會訂定規約前視為規約", "h": true}, {"x": "生效要件是「承受人簽署同意」，不是「經區權會決議」", "h": true}, {"x": "§24Ⅰ：繼受人繼受前得請求閱覽或影印文件，繼受後應遵守原區權人之權利義務", "h": false}, {"x": "草約的效力期間有終點：到區權會訂定規約前為止", "h": false}], "mn": "建照附四圖說＋草約；草約一簽就當規約，用到區權會訂出規約為止", "hp": 15, "hpl": "高"}, {"id": "es-e6", "no": "E6", "t": "防墜設施與廣告物的處理", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "住戶得否在外牆開口部或陽臺設置防墜設施？住戶違規設置廣告物，管理委員會如何處理？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>外牆與共用部分之使用須兼顧住戶安全與整體管理。條例對防墜設施採「許可例外」，對違規設置廣告物等行為則採制止、報請處理、回復原狀之程序。</p>", "<span class=\"blk-l\">二、法條</span><p>公寓大廈管理條例<span class=\"art\">第8條第1項</span>至第3項<span class=\"lawn\">（防墜設施與外牆違規設置）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）防墜設施</p><p>依<span class=\"art\">第8條第2項</span>，公寓大廈有十二歲以下兒童或六十五歲以上老人之住戶，外牆開口部或陽臺得設置不妨礙逃生且不突出外牆面之防墜設施。防墜設施設置後，設置理由消失且不符第1項限制者，區分所有權人應予改善或回復原狀。</p><p class=\"evx\"><span class=\"evt\">例</span><span>家中有十二歲以下兒童，得在陽臺加裝不突出外牆面、不妨礙逃生之防墜設施；兒童長大後設置理由消失，且不符規約或區權會決議之限制者，應改善或回復原狀。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧兒童、老人之安全與外牆整體管理。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）違規設置廣告物之限制</p><p>依<span class=\"art\">第8條第1項</span>，外牆面、樓頂平臺等處設置廣告物，除應依法令規定辦理外，規約另有規定或區分所有權人會議已有決議，經向主管機關完成報備有案者，應受該規約或決議之限制。</p></div><div class=\"evp\"><p class=\"evh\">（三）管理委員會之處理</p><p>依<span class=\"art\">第8條第3項</span>，住戶違反第1項規定，管理負責人或管理委員會應予制止，經制止而不遵從者，「應報請主管機關依第四十九條第一項規定處理」，該住戶並應於一個月內回復原狀。屆期未回復原狀者，得由管理負責人或管理委員會回復原狀，其費用由該住戶負擔。</p><p class=\"evx\"><span class=\"evt\">例</span><span>住戶在外牆違規懸掛廣告看板，經制止不拆除，管委會報請主管機關處理；一個月內仍未回復原狀，管委會得代為拆除並向該住戶請求費用。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>住戶家中有十二歲以下兒童或六十五歲以上老人者，得於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施；設置理由消失且不符<span class=\"art\">第8條第1項</span>限制者，區分所有權人應改善或回復原狀。住戶違規設置廣告物，管理委員會應予制止；經制止而不遵從者，應報請主管機關處理，住戶並應於一個月內回復原狀，屆期未回復者由管理委員會回復原狀，費用由該住戶負擔。</p>"], "ck": [{"x": "§8Ⅱ：有 12 歲以下兒童「或」65 歲以上老人之住戶，得於外牆開口部或陽臺設置防墜設施", "h": true}, {"x": "§8Ⅱ：防墜設施須不妨礙逃生且不突出外牆面，兩項限制並存", "h": false}, {"x": "§8Ⅱ後段：設置理由消失「且」不符 §8Ⅰ 限制者，區分所有權人應予改善或回復原狀", "h": false}, {"x": "§8Ⅰ：外牆面設置廣告物受法令及已完成報備之規約或區權會決議之限制", "h": false}, {"x": "§8Ⅲ：制止 → 經制止不遵從 → 報請主管機關依 §49Ⅰ 處理，這一步不可漏", "h": true}, {"x": "§8Ⅲ：住戶應於 1 個月內回復原狀，屆期管委會得代為回復，費用由住戶負擔", "h": true}, {"x": "管委會不得逕行拆除，須先制止並報請主管機關，期滿才代為回復原狀", "h": false}], "mn": "防墜＝兒童或老人、不擋逃生不出牆；廣告物＝制止、報請、1 個月回復"}, {"id": "es-e7", "no": "E7", "t": "共用部分修繕與費用負擔（漏水案例）", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "甲住 3 樓、乙住 4 樓。甲家浴室漏水，抓漏發現是 3、4 樓樓地板內管線自然損壞；同棟頂樓平台防水層年久失修也在漏水。兩處的修繕責任與費用各由誰承擔？若樓板漏水是乙裝修不當造成，結論有何不同？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>修繕問題須分兩問：「誰負責修」與「誰出錢」。專有部分由區分所有權人自修自付；共用部分由管理負責人或管理委員會修繕，費用由公共基金或區分所有權人按應有部分比例分擔；專有部分之共同壁、樓地板或其內管線另有特別規定（<span class=\"art\">第12條</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第10條第1項</span>、第2項<span class=\"lawn\">（專有部分與共用部分之修繕）</span></span><span class=\"evli\"><span class=\"art\">第11條</span><span class=\"lawn\">（共用部分重大修繕、改良）</span></span><span class=\"evli\"><span class=\"art\">第12條</span><span class=\"lawn\">（共同壁、樓地板及其管線之費用）</span></span><span class=\"evli\"><span class=\"art\">第36條第1款</span>、第2款<span class=\"lawn\">（管理委員會之職務）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）頂樓平台防水層</p><p>依<span class=\"art\">第10條第2項</span>，共用部分之修繕、管理、維護，由管理負責人或管理委員會為之；其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔。年久失修的屋頂防水層，修繕義務在管委會，不是頂樓住戶單獨負責。惟依<span class=\"art\">第11條第1項</span>，共用部分之拆除、重大修繕或改良，應依區分所有權人會議之決議為之；依<span class=\"art\">第36條第2款</span>，管理委員會之職務包括共有及共用部分之清潔、維護、修繕及一般改良；重大修繕依<span class=\"art\">第11條第1項</span>應依區分所有權人會議之決議為之，管理委員會依<span class=\"art\">第36條第1款</span>執行該決議。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>共用部分由全體共有，費用應由全體分擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）三、四樓間樓地板內管線</p><p>依<span class=\"art\">第12條</span>，專有部分之共同壁及樓地板或其內之管線，其維修費用由該共同壁雙方或樓地板上下方之區分所有權人共同負擔。本題管線自然損壞，費用由3樓甲與4樓乙之區分所有權人共同負擔。須注意負擔主體是「區分所有權人」，不是「住戶」。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>樓地板同時為上下兩戶所用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙裝修不當所致</p><p>依<span class=\"art\">第12條</span>但書，修繕費係因可歸責於區分所有權人之事由所致者，由該區分所有權人負擔；故費用改由乙負擔。（<span class=\"art\">第10條第2項</span>但書係共用部分之規定，本題樓地板管線適用<span class=\"art\">第12條</span>但書即可。）理由在於由造成損害者承擔費用。</p></div>", "<span class=\"blk-l\">四、結論</span><p>頂樓平台防水層屬共用部分，由管理委員會修繕，費用由公共基金支付或由區分所有權人按應有部分比例分擔，若屬重大修繕須先經區分所有權人會議決議。樓地板內管線自然損壞，費用由3、4樓區分所有權人共同負擔。若樓板漏水係乙裝修不當所致，費用改由可歸責之乙負擔，但修繕責任之歸屬不因此改變。</p>"], "ck": [{"x": "§10Ⅰ：專有部分、約定專用部分由區分所有權人或使用人修繕、管理、維護並負擔費用", "h": false}, {"x": "§12：共同壁及樓地板或其內管線之維修費用，由雙方或上下方之區分所有權人共同負擔", "h": false}, {"x": "§12 的負擔主體是「區分所有權人」，不是「住戶」，兩者不可混用", "h": true}, {"x": "§10Ⅱ：共用部分由管理負責人或管委會為之，費用由公共基金或按應有部分比例分擔", "h": false}, {"x": "頂樓平台防水層由管理負責人或管委會負責修，不是頂樓住戶單獨負責", "h": true}, {"x": "§11：拆除、重大修繕或改良應依區權會決議；§36②為日常性清潔維護修繕及一般改良；重大修繕依§11Ⅰ須區權會決議", "h": false}, {"x": "§12 但書／§10Ⅱ 但書：可歸責於區分所有權人或住戶者，由該人負擔修繕費", "h": false}, {"x": "可歸責只改變費用負擔，不改變修繕義務人（共用部分仍由管委會為之）", "h": true}], "mn": "專有自己修，共用管委會，可歸責者買單；重大修繕要開會"}, {"id": "es-e8", "no": "E8", "t": "公共基金、起造人召集與點交", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "某建案取得使用執照後，起造人須提列公共基金並辦理點交。請說明公共基金的來源與撥付時點、起造人召集區分所有權人會議的規定，以及共用部分如何點交；規約草約應於何時檢附？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第18條</span>，公寓大廈應設置公共基金，並應設專戶儲存，由管理負責人或管理委員會負責管理；起造人依<span class=\"art\">第18條第1項第1款</span>提列基金、依<span class=\"art\">第28條</span>召集區分所有權人會議、依<span class=\"art\">第57條</span>點交共用部分。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第18條</span><span class=\"lawn\">（公共基金之來源與管理）</span></span><span class=\"evli\"><span class=\"art\">第28條</span><span class=\"lawn\">（起造人召集第一次區權會）</span></span><span class=\"evli\"><span class=\"art\">第56條</span><span class=\"lawn\">（起造人之規約草約與預售屋）</span></span><span class=\"evli\"><span class=\"art\">第57條</span><span class=\"lawn\">（起造人之檢測與點交）</span></span><span class=\"evli\">公寓大廈管理條例施行細則<span class=\"art\">第5條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公共基金之來源</p><p>依<span class=\"art\">第18條第1項</span>，來源為起造人就領得使用執照一年內之管理維護事項，按工程造價一定比例或金額提列；區分所有權人依區分所有權人會議決議繳納；本基金之孳息；其他收入。依施行細則<span class=\"art\">第5條</span>，按工程造價累進提列：一千萬元以下千分之二十，逾一千萬元至一億元部分千分之十五，逾一億元至十億元部分千分之五，逾十億元部分千分之三。</p><p class=\"evx\"><span class=\"evt\">例</span><span>工程造價2億元，提列205萬元。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）撥付時點</p><p>依<span class=\"art\">第18條第2項</span>，起造人於使用執照申請時，應提出繳交公庫代收之證明；於成立管理委員會或推選管理負責人，並完成依<span class=\"art\">第57條</span>點交後報備，由公庫代為撥付，不是召開區權會時撥付。</p></div><div class=\"evp\"><p class=\"evh\">（三）召集會議</p><p>依<span class=\"art\">第28條</span>，區分所有權人達半數以上及其區分所有權比例合計半數以上時，起造人應於三個月內召集區分所有權人會議，成立管理委員會或推選管理負責人並報備；成立前起造人為管理負責人。</p></div><div class=\"evp\"><p class=\"evh\">（四）點交</p><p>依<span class=\"art\">第57條</span>，起造人應於管理委員會成立或管理負責人推選或指定後七日內，會同主管機關、管理委員會或管理負責人現場檢測水電、機械、消防設施及各類管線，確認功能正常後移交；歸責起造人之瑕疵，主管機關命其修復後再辦移交。</p></div><div class=\"evp\"><p class=\"evh\">（五）規約草約</p><p>依<span class=\"art\">第56條第1項</span>，起造人於申請建造執照時，應檢附詳細圖說及規約草約；草約經承受人簽署同意後，於訂定規約前視為規約。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第56條第2項</span>，規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>公共基金來源為起造人提列、區分所有權人繳納、孳息及其他收入，於成立管理組織、完成點交並報備後由公庫撥付。起造人應於人數及比例均達半數後三個月內召集會議；管理組織成立後七日內會同檢測再點交。規約草約應於申請建造執照時檢附。</p>"], "ck": [{"x": "§18Ⅰ 四來源：起造人就領得使用執照一年內之管理維護事項提列、區權會決議繳納、基金孳息、其他收入", "h": false}, {"x": "§18Ⅱ：使用執照申請時提出公庫代收證明；成立管委會＋依 §57 點交＋報備後由公庫代為撥付（不是召開區權會時）", "h": true}, {"x": "施行細則 §5 分段累進 20‰／15‰／5‰／3‰（2 億元＝205 萬元），不可全額乘最高比例", "h": true}, {"x": "§28：半數人數＋半數比例 → 三個月內召集、報備；成立前起造人為管理負責人", "h": false}, {"x": "§57Ⅰ：管委會成立或管理負責人推選、指定後七日內，會同政府主管機關現場檢測後移交", "h": true}, {"x": "§57Ⅱ：不能通過檢測且可歸責起造人者，命其修復改善並於一個月內再移交", "h": false}, {"x": "§56Ⅰ：規約草約於申請「建造執照」時檢附，設計變更時亦同", "h": true}, {"x": "§56Ⅱ：草約經承受人簽署同意，於區權會訂定規約前視為規約", "h": false}], "mn": "建照附草約，三月召集，七日點交後撥款"}, {"id": "es-e9", "no": "E9", "t": "管理委員會的職務範圍", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "請說明管理委員會的職務範圍，並判斷下列事項是否屬管委會職務：(一) 共用部分重大修繕；(二) 約定專用部分的點收保管；(三) 管理服務人的委任與監督。", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>管理委員會是執行區分所有權人會議決議與日常管理事務之組織，其職務由條文列舉；須經會議決議之事項（如<span class=\"art\">第11條第1項</span>之重大修繕），應依區分所有權人會議之決議為之。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第36條</span><span class=\"lawn\">（管理委員會之職務）</span></span><span class=\"evli\"><span class=\"art\">第11條第1項</span><span class=\"lawn\">（共用部分重大修繕、改良）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）職務範圍</p><p><span class=\"art\">第36條</span>列舉13款，核心為：區分所有權人會議決議事項之執行；共有及共用部分之清潔、維護、修繕及一般改良；安全與環境維護；興革建議；住戶違規情事之制止及相關資料之提供；收益、公共基金及其他經費之收支、保管及運用；文件保管；管理服務人之委任、僱傭及監督；會計報告公告；共用部分、約定共用部分及其附屬設施設備之點收及保管；公共安全檢查與消防安全設備檢修之申報；其他依本條例或規約所定事項。</p></div><div class=\"evp\"><p class=\"evh\">（二）共用部分重大修繕</p><p>依<span class=\"art\">第11條第1項</span>，共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之。<span class=\"art\">第36條第2款</span>之修繕及一般改良指日常性者；重大修繕管委會不得逕行為之，僅能依<span class=\"art\">第36條第1款</span>執行決議。</p><p class=\"evx\"><span class=\"evt\">例</span><span>更換整棟電梯屬重大修繕，須先有區權會決議。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>重大支出應由全體區分所有權人決定。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）約定專用部分之點收保管</p><p>依<span class=\"art\">第36條第11款</span>，點收保管範圍是共用部分、約定共用部分及其附屬設施設備，不含約定專用部分。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>約定專用部分由特定區分所有權人使用。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）管理服務人之委任與監督</p><p>依<span class=\"art\">第36條第9款</span>，管理服務人之委任、僱傭及監督，屬管理委員會職務。</p><p class=\"evx\"><span class=\"evt\">例</span><span>管委會委任保全公司並監督其執行。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>日常管理有賴專業人員執行。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>管理委員會職務以<span class=\"art\">第36條</span>列舉者為限。（一）共用部分重大修繕須經區分所有權人會議決議，非管委會得逕行之職務，管委會僅負責執行決議；（二）約定專用部分之點收保管不屬管委會職務；（三）管理服務人之委任與監督屬管委會職務。</p>"], "ck": [{"x": "§36：管理委員會之職務計十三款列舉，管委會為執行機關", "h": false}, {"x": "§36②：管委會僅負責共有及共用部分之清潔、維護、修繕及「一般」改良", "h": false}, {"x": "§11Ⅰ：共用部分之拆除、重大修繕或改良，應依區分所有權人會議之決議為之", "h": true}, {"x": "§36⑪：點收保管範圍為共用部分、約定共用部分及其附屬設施設備", "h": false}, {"x": "約定專用部分不在點收保管之列（約定「共用」才在，一字之差）", "h": true}, {"x": "§36⑨：管理服務人之委任、僱傭及監督屬管委會職務", "h": false}, {"x": "答案組合：(一)否、(二)否、(三)是，三問都要寫出依據條款", "h": false}, {"x": "§11Ⅱ：重大修繕費用由公共基金支付或由區權人按應有部分比例分擔（加分句）", "h": false}], "mn": "管委會管一般、重大交區權會；點收共用與約定共用，不含約定專用；管理服務人自己聘自己管"}, {"id": "es-e10", "no": "E10", "t": "住戶使用限制與危險營業保險（案例）", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "甲在公寓大廈一樓經營使用瓦斯的餐廳；乙在共同走廊堆放雜物並加裝鐵門；丙將住宅專有部分擅自改作營業用途。管委會可如何處理？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>區分所有權人使用專有部分仍受共同利益之限制；不同違規態樣有不同條文與處理程序，危險營業另有投保公共意外責任保險之義務，</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第5條</span><span class=\"lawn\">（專有部分利用之一般限制）</span></span><span class=\"evli\"><span class=\"art\">第6條</span><span class=\"lawn\">（住戶維修與進入他人專有部分）</span></span><span class=\"evli\"><span class=\"art\">第15條</span><span class=\"lawn\">（依使用執照用途使用）</span></span><span class=\"evli\"><span class=\"art\">第16條第2項</span>、第5項<span class=\"lawn\">（禁止堆置雜物、營業使用與廣告物）</span></span><span class=\"evli\"><span class=\"art\">第17條</span><span class=\"lawn\">（危險營業之公共意外責任保險）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲經營使用瓦斯之餐廳</p><p>依<span class=\"art\">第17條第1項</span>，住戶於公寓大廈內依法經營餐飲、瓦斯、電焊或其他危險營業者，應依中央主管機關所定保險金額投保公共意外責任保險；因此增加其他住戶投保火災保險之保險費者，並應就其差額負補償責任。依第2項，經催告於七日內仍未辦理者，管理負責人或管理委員會應代為投保，其保險費、差額補償費及其他費用由該住戶負擔。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>危險營業增加全體住戶風險。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙在共同走廊堆放雜物並加裝鐵門</p><p>依<span class=\"art\">第16條第2項</span>，住戶不得於樓梯間、共同走廊等處所堆置雜物、設置柵欄、門扇或營業使用。依第5項，管理負責人或管理委員會應予制止或按規約處理，經制止而不遵從者，得報請直轄市、縣（市）主管機關處理。</p></div><div class=\"evp\"><p class=\"evh\">（三）丙將住宅改作營業用途</p><p>依<span class=\"art\">第15條第1項</span>，住戶應依使用執照所載用途及規約使用專有部分、約定專用部分，不得擅自變更。依第2項，管理負責人或管理委員會應予制止，經制止而不遵從者，報請主管機關處理，並要求其回復原狀。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持建築物原核定用途。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）一般原則</p><p>依<span class=\"art\">第5條</span>，區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為；依<span class=\"art\">第6條</span>，住戶維護修繕時不得妨害其他住戶之安寧、安全及衛生。</p></div>", "<span class=\"blk-l\">四、結論</span><p>對甲，管委會應催告其投保公共意外責任保險，七日內仍未辦理者由管委會代為投保，費用由甲負擔，甲並應補償其他住戶火災保險費之差額。對乙，管委會應予制止或按規約處理，經制止而不遵從者，得報請主管機關處理。對丙，管委會應予制止，經制止而不遵從者，報請主管機關處理並要求回復原狀。</p>"], "ck": [{"x": "§17Ⅰ：餐飲、瓦斯、電焊等危險營業或存放爆炸性、易燃性物品者應投保公共意外責任保險", "h": false}, {"x": "§17Ⅰ：其他住戶火災保險費增加之差額由該住戶補償（與責任險是兩件事）", "h": true}, {"x": "§17Ⅱ：經催告 7 日內仍未辦理，管委會「應」代為投保，費用由該住戶負擔", "h": true}, {"x": "§16Ⅱ：共同走廊、樓梯間、防火巷弄等處不得堆置雜物、設置柵欄門扇或營業使用", "h": false}, {"x": "§16Ⅴ：應予制止或按規約處理，經制止不遵從者得報請主管機關處理", "h": false}, {"x": "程序是先「制止」再「報請」，不能跳過制止，也不能自行拆除", "h": false}, {"x": "§15Ⅰ：應依使用執照所載用途及規約使用，不得擅自變更", "h": false}, {"x": "§15Ⅱ：報請主管機關處理「並要求其回復原狀」（§16 無回復原狀）", "h": true}], "mn": "危險營業先保險（催告七日代投保）；違規先制止再報請，丙還要回復原狀"}, {"id": "es-e11", "no": "E11", "t": "停車空間與防空避難設備：產權型態、約定專用的界線與堆放雜物的處理", "lv": "預測", "k": "pred", "tier": 3, "g": "公寓大廈管理", "q": "甲購入某公寓大廈地下一樓平面停車位一個，該地下室依使用執照登載為「法定防空避難設備兼停車空間」，並經規約約定由購買車位之區分所有權人專用。甲長期在其車位格線內堆放備用輪胎、紙箱與露營裝備，另停放一輛腳踏車；規約明定車位僅供停放汽車、不得堆置雜物。管理委員會多次勸導無效。請依公寓大廈管理條例說明：（一）該停車空間的法律性質為何？甲取得的「約定專用」權利範圍到哪裡？起造人可否將法定停車空間單獨讓售予區分所有權人以外之人？（二）甲在車位堆放雜物是否違法？涉及哪些條文與法律效果？（三）管理委員會與主管機關依序可採取哪些措施？甲若仍拒不改善，還有什麼手段？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>共用部分指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者，法定防空避難設備與法定停車空間即屬之；約定專用部分指共用部分經約定供特定區分所有權人使用者。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公寓大廈管理條例<span class=\"art\">第3條第4款</span>、第5款<span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第4條第2項</span></span><span class=\"evli\"><span class=\"art\">第9條第2項</span></span><span class=\"evli\"><span class=\"art\">第15條</span><span class=\"lawn\">（依使用執照用途使用）</span></span><span class=\"evli\"><span class=\"art\">第16條第2項</span>、第5項<span class=\"lawn\">（禁止堆置雜物、營業使用與廣告物）</span></span><span class=\"evli\"><span class=\"art\">第22條</span><span class=\"lawn\">（強制遷離與強制出讓／拍賣）</span></span><span class=\"evli\"><span class=\"art\">第23條第2項</span><span class=\"lawn\">（規約之訂定與效力）</span></span><span class=\"evli\"><span class=\"art\">第49條</span><span class=\"lawn\">（罰鍰與連續處罰）</span></span><span class=\"evli\"><span class=\"art\">第58條第1項</span>、第2項（領得建造執照始得銷售<span class=\"lawn\">（領得建造執照始得銷售、共用部分不得讓售）</span></span><span class=\"evli\">共用部分不得讓售）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）性質與權利範圍</p><p>該空間不具使用上之獨立性，屬共用部分（<span class=\"art\">第3條第4款</span>），經規約約定由購買者專用，為約定專用部分（<span class=\"art\">第3條第5款</span>）。約定專用給予的是專用使用權，不是所有權：依<span class=\"art\">第9條第2項</span>，住戶對共用部分之使用應依其設置目的及通常使用方法為之；依<span class=\"art\">第15條第1項</span>，不得擅自變更。故甲僅取得在該格位停放車輛之權利。起造人依<span class=\"art\">第58條第2項</span>，不得將法定停車空間讓售於特定人或為區分所有權人以外之特定人設定專用使用權；依<span class=\"art\">第4條第2項</span>，車位權利亦不得脫離專有部分單獨處分。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第16條第2項</span>但書，防空避難設備僅得為原核准範圍之使用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）堆放雜物違法</p><p>依<span class=\"art\">第16條第2項</span>，住戶不得於防空避難設備堆置雜物；但書僅許兼作停車空間者供公共收費停車，未允許堆置雜物。甲並違反規約之使用約定（<span class=\"art\">第23條第2項</span>），另構成<span class=\"art\">第15條第1項</span>擅自變更。依<span class=\"art\">第49條第1項第3款</span>、第4款，處新臺幣四萬元以上二十萬元以下罰鍰，並得令限期改善，屆期不改善得連續處罰。</p></div><div class=\"evp\"><p class=\"evh\">（三）處理順序</p><p>管委會依<span class=\"art\">第16條第5項</span>、<span class=\"art\">第15條第2項</span>應予制止，經制止不遵從者報請主管機關處理並要求回復原狀；主管機關罰鍰。甲經罰鍰後仍不改善，該當<span class=\"art\">第22條第1項第2款</span>，經促請改善三個月未改善，得依區權會決議訴請強制遷離；甲為區分所有權人者，並得訴請命其出讓，判決確定後三個月內不自行出讓者得聲請拍賣。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）該空間為共用部分，經規約約定為約定專用部分，甲僅有依使用執照用途停車之專用使用權；起造人不得讓售予區分所有權人以外之特定人。（二）甲違反<span class=\"art\">第16條第2項</span>及<span class=\"art\">第15條第1項</span>，依<span class=\"art\">第49條第1項</span>處罰鍰。（三）先制止、報請主管機關罰鍰；仍不改善者，得訴請強制遷離、命其出讓或拍賣。</
