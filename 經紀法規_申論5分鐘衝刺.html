<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>/*bxdef*/(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><script src="bx-vp.js"></script>
<title>經紀法規｜申論 5 分鐘衝刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;
--b1:#2F6B8C;--b1s:#E3EFF6;--b2:#7A5BA6;--b2s:#EEE8F6;--b3:#2F7A55;--b3s:#E1F1E8;--b4:#B8782E;--b4s:#F8EBD3;--hl:#FFE9A8}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 1.45rem/1.3 "Noto Serif TC",serif;margin:6px 0 2px;text-wrap:balance}
.lead{color:var(--sub);font-size:.92rem;margin:0 0 14px}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:.88rem}.top a{white-space:nowrap}.top>span{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}
/* 模式選擇 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:1.02rem}
.mode small{display:block;color:var(--sub);line-height:1.55;margin-top:2px}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;padding:0;list-style:none;font-size:.82rem;color:var(--sub)}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow li b{color:var(--ink);font-weight:700;margin-right:4px}
/* 佇列 */
.sec-h{font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--sub);font-weight:400}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;color:var(--ink)}
.qi .n{font-size:.78rem;color:var(--sub);min-width:4.2em}
.qi .t{min-width:0;font-size:.93rem;line-height:1.5}
.qi .r{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.chip.new{background:var(--acc-soft);color:var(--acc);font-weight:700}
.chip.hard{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.mid{background:var(--b1s);color:var(--b1);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qi .go{font-size:.8rem;color:var(--pri);font-weight:700}
.more{margin-top:8px}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar .row{display:flex;align-items:center;gap:10px}
.stg{font-weight:700;font-size:.98rem;flex:1;min-width:0}
.stg small{display:block;font-weight:400;color:var(--sub);font-size:.8rem;line-height:1.4}
.clk{font:700 1.6rem/1 "Noto Sans TC",monospace;font-variant-numeric:tabular-nums;color:var(--pri)}
.clk.red{color:var(--bad)}
.tot{font-size:.78rem;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.tot.red{color:var(--bad);font-weight:700}
.segs{display:grid;grid-template-columns:30fr 30fr 150fr 60fr 30fr;gap:3px;margin-top:8px}
.segs i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--pri)}
.segs i.over b{background:var(--bad)}
.segs i.done b{width:100%!important}
.modechip{font-size:.74rem;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.modechip.h{background:var(--bad-soft);color:var(--bad)}
.modechip.s{background:var(--pri-soft);color:var(--pri)}
/* 題卡 */
.card{margin-top:14px}
.meta{font-size:.8rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ttl{font-weight:700;font-size:1.05rem;line-height:1.5;margin:4px 0 8px;text-wrap:balance}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}
.qbox.clamp .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qbox .qx{display:none;margin-left:8px;font-size:.8rem;color:var(--pri);background:none;border:0;padding:0;font-weight:700}.qbox.clamp .qx,.qbox.open .qx{display:inline}
.qbox .nq{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:0 10px}
.recall{margin-top:12px;background:var(--acc-soft);border-radius:12px;padding:12px 14px}
.recall b{display:block;margin-bottom:2px}
.recall ol{margin:4px 0 0;padding-left:1.4em}
.mn{margin-top:10px;font-size:.88rem;color:var(--sub)}
.mn b{color:var(--ink)}
.ev{margin-top:12px}
.blk{border-radius:10px;padding:12px 15px;margin:8px 0;background:var(--cs);transition:opacity .25s}
.blk.b1{--c:var(--b1);--cs:var(--b1s)}.blk.b2{--c:var(--b2);--cs:var(--b2s)}.blk.b3{--c:var(--b3);--cs:var(--b3s)}.blk.b4{--c:var(--b4);--cs:var(--b4s)}
.blk-l{display:inline-block;font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}
.blk p{margin:4px 0 0;line-height:1.85}
.blk .art{color:var(--sub);font-weight:400}
.blk .evp{margin-top:12px}.blk .evh{font-weight:700;margin-top:0}
.blk .evx{display:flex;gap:8px;align-items:baseline}
.blk .lawn{color:var(--ink);font-weight:500;margin-left:2px}
.blk .evli{display:block;padding-left:1.15em;text-indent:-1.15em;margin-top:3px}
.blk .evt{flex:none;font-size:.74em;line-height:1.6;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--sub);font-weight:600}
.blk.dim{opacity:.38}
.blk.focus{outline:2px solid var(--c);outline-offset:-2px}
.cover{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:.92rem}
/* 檢核 */
.ck{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6;cursor:pointer}
.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pri)}
.ck label.on{border-color:var(--ok);background:var(--ok-soft)}
.must{flex:none;font-size:.72rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 7px;margin-top:3px}
.score{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:900 1.8rem/1 "Noto Serif TC",serif;color:var(--pri)}
.score small{color:var(--sub)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:700}
.rate button.on[data-v="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rate button.on[data-v="2"]{border-color:var(--b1);background:var(--b1s);color:var(--b1)}
.rate button.on[data-v="3"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hist{margin-top:10px;font-size:.84rem;color:var(--sub)}
/* 底部操作列 */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.act .hint{font-size:.78rem;color:var(--sub);opacity:.6;flex:1;min-width:0;transition:opacity .8s}
.done-box{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:480px){.modes{grid-template-columns:1fr}.clk{font-size:1.4rem}}
.pz{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;line-height:1;padding:0}
body.paused .pz{background:var(--pri);border-color:var(--pri);color:var(--on)}
.pzbox{display:none;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub)}
.pzbox b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:4px}
body.paused .pzbox{display:block}
body.paused #body,body.paused .qbox,body.paused .ttl,body.paused .meta{display:none}
body.paused .clk{opacity:.5}
body.paused #nextBtn{opacity:.45;pointer-events:none}
.thb{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.howto{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.howto>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:.9rem;color:var(--sub);display:flex;justify-content:space-between;gap:8px}.howto>summary::-webkit-details-marker{display:none}.howto>summary::after{content:"點開 ▾";font-size:.8rem}.howto[open]>summary::after{content:"收起 ▴"}.howto>summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}.howto .hb{padding:0 14px 12px}.howto .hb>*:first-child{margin-top:0}.modes .mode small{display:none}.howto[open]~.modes .mode small{display:block}
.swq{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 2px 0;font-size:.86rem;color:var(--sub)}.swq a{font-weight:600;white-space:nowrap}
.dnb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dnb .btn{text-decoration:none;display:inline-flex;align-items:center}.rv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.rvh{font-weight:700;margin-bottom:8px}.rvnav{display:flex;gap:8px;align-items:center}.rvnav select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 8px;font:inherit;font-size:.88rem}.rvnav .btn{white-space:nowrap;padding:7px 12px}.rvnav .btn:disabled{opacity:.4}#rvB{margin-top:12px}.rvq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}.ck label.miss{opacity:.75}.ck label .mk{font-weight:700;min-width:1.2em}.ck label.on .mk{color:var(--ok)}.kw.miss{opacity:.6}@media(max-width:480px){.rvnav .btn{padding:7px 10px}}
/*flt*/.flt{margin:8px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:grid;gap:6px}
.flt .fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flt .fl{font-size:.76rem;font-weight:700;color:var(--sub);min-width:2.6em}
.flt button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:2px 11px;font-size:.84rem;line-height:1.6}
.flt button.on{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.flt .fs{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub)}
.flt .fs a{cursor:pointer}
</style><style id="sprint-bardim-css">.act{transition:opacity .8s}.act.dim{opacity:.22}.act.dim:hover,.act.dim:focus-within{opacity:1}.act .hint{font-size:.78rem;color:var(--sub);flex:1;min-width:0}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="經紀法規_備考指揮中心.html">← 指揮中心</a><span style="color:var(--sub)"><span id="sum"></span>　<button type="button" id="thBtn" class="thb" aria-label="切換深淺色"></button>　<a id="swTop" href="經紀法規_申論5分鐘_推理版.html">切到推理版 ▸</a></span></div>

  <!-- 開始畫面 -->
  <section id="home">
    <h1>申論 5 分鐘衝刺</h1>
    <p class="lead">一題約 5 分鐘：讀題 → 先自己想 → 讀考場版 → 對結論 → 關鍵字檢核。紀錄與指揮中心申論卡同步（輪數、自評、分數）。</p>
    <div class="flt" id="flt"></div>
    <details class="howto" id="howto"><summary>流程、時間怎麼分、兩種模式說明</summary><div class="hb"><ul class="flow"><li><b>0:30</b>讀題</li><li><b>0:30</b>先自己想</li><li><b>2:30</b>意義・法條・涵攝</li><li><b>1:00</b>結論</li><li><b>0:30</b>關鍵檢核</li></ul></div></details>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-m="h"><b>⚡ 衝刺</b><small>每段時間到就變紅並自動進下一段；讀過的段落會被蓋住，不能回頭看。</small></button>
      <button type="button" class="mode" data-m="s"><b>🪑 停留</b><small>時間到一樣變紅，但可以繼續看，自己按「下一段」。</small></button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" id="startBtn">開始下一題</button><button type="button" class="btn" id="randBtn">🎲 隨機出題</button></div>
    <div class="sec-h"><span>接下來的順序</span><small id="qcount"></small></div>
    <div class="qlist" id="qlist"></div>
    <button type="button" class="btn more" id="moreBtn">顯示全部</button>
  </section>

  <!-- 作答畫面 -->
  <section id="run" hidden>
    <div class="bar">
      <div class="row">
        <div class="stg" id="stg"></div>
        <span class="modechip" id="mchip"></span><button type="button" class="pz" id="pauseBtn" aria-label="暫停">⏸</button>
        <div><div class="clk" id="clk">0:30</div><div class="tot" id="tot">總 0:00／5:00</div></div>
      </div>
      <div class="segs" id="segs"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    </div>
    <div class="card">
      <div class="meta" id="meta"></div>
      <div class="ttl" id="ttl"></div>
      <div class="qbox" id="qbox"></div><div class="swq" id="swq"></div>
      <div class="pzbox" id="pzbox"><b>已暫停</b>計時停止，題目與答案先蓋住。<br><button type="button" class="btn pri" id="resumeBtn" style="margin-top:12px">▶ 繼續</button></div>
    <div id="body"></div>
    </div>
  </section>
</div>

<script>
var CARDS=[{"id": "es-fw01", "no": "範文01★", "t": "103年申論二｜何謂不動產經紀業廣告、廣告不實案件查核權責分工原則", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "按內政部為方便直轄市、縣（市）主管機關處理不動產經紀業受託居間或代理銷售（租賃）不動產廣告案件，維護消費者權益，並促進不動產交易安全，經訂頒「不動產經紀業廣告處理原則」，據以實施。試問何謂不動產經紀業廣告？又對於不動產廣告不實案件之查核，其權責分工原則為何？（25 分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依不動產經紀業廣告處理原則第二點，廣告指經紀業利用電視、廣播、報紙、傳單、海報、招牌、樣品屋、網際網路或其他方法，使不特定多數人知悉其宣傳內容之傳播；不實廣告案件之查核權責，依同原則第三點分工。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業廣告處理原則第二點（廣告定義）</span><span class=\"evli\">第三點（查核分工）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）經紀業廣告之定義</p><p>依處理原則第二點，廣告指經紀業利用電視、廣播、報紙、傳單、海報、招牌、模型、樣品屋、網際網路或其他方法，使不特定多數人知悉其宣傳內容之傳播。</p><p class=\"evx\"><span class=\"evt\">例</span><span>在租屋網刊登物件、發傳單、設樣品屋都屬廣告；只交給特定一位客戶的報價單則不是。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>判斷標準是「使不特定多數人知悉」，不以媒介種類為限。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）查核分工</p><p>依第三點，<span class=\"evli\">①經紀業所為不實廣告案件，由主管機關依不動產經紀業管理條例處理；</span><span class=\"evli\">②非屬管理條例範疇者（如服務品質、企業形象、行銷策略之虛偽不實），由公平會依公平交易法處理；</span><span class=\"evli\">③加盟經營未標明加盟店者，由主管機關依管理條例處理；</span><span class=\"evli\">④建商委託經紀業銷售，建商與經紀業俱為廣告主者，由公平會依公平交易法處理；</span><span class=\"evli\">⑤無法劃分者，由內政部與公平會協調處理。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介廣告坪數不實由縣市政府處理；仲介品牌形象廣告誇大由公平會處理。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>第三點（二）將服務品質、企業形象、行銷策略等虛偽不實表示劃歸公平會，其餘經紀業不實廣告由主管機關依管理條例處理。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀業廣告指以任何媒介使不特定多數人知悉其宣傳內容之傳播。不實案件依廣告主體與內容性質，分由主管機關依管理條例或公平會依公平交易法處理，無法劃分時由兩機關協調，以避免互推、保障消費者。</p>"], "ck": [{"x": "第二點：使不特定多數人知悉其宣傳內容之傳播（媒介不限，含模型、樣品屋、網際網路）", "h": false}, {"x": "廣告的判準是「不特定多數人」，不是媒介種類", "h": false}, {"x": "第三點（一）：經紀業所為不實廣告 → 主管機關依管理條例", "h": false}, {"x": "第三點（二）：服務品質、企業形象、行銷策略等 → 公平會依公平法", "h": false}, {"x": "第三點（三）：加盟經營未標明加盟店字樣 → 主管機關（不是公平會）", "h": true}, {"x": "第三點（四）：建商與經紀業「俱為」廣告主 → 公平會", "h": true}, {"x": "第三點（五）：無法劃分 → 內政部與公平會協調處理", "h": true}, {"x": "五款要寫全，只寫定義不寫分工會大量失分", "h": true}], "mn": "經紀自身、加盟未標明 → 主管機關；形象策略、共同具名 → 公平會；劃不開 → 協調", "hp": 5, "hpl": "高"}, {"id": "es-fw04", "no": "範文04★", "t": "109年申論二｜經營仲介業務者同時接受雙方委託之辦理方式", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "經營仲介業務者，欲同時接受雙方之委託應如何辦理？試說明之。（25 分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>雙方代理指經紀業在同一買賣或租賃案件中，同時接受雙方當事人委託。因有違民法禁止雙方代理原則之虞，不動產經紀業管理條例特別明定合法辦理方式，兼顧交易效率與當事人保護。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第24條之2</span><span class=\"lawn\">（雙方代理）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第3款</span><span class=\"lawn\">（經紀業之罰則）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）前提要件</p><p>須經雙方書面同意。依<span class=\"art\">第24條之2</span>，經營仲介業務者經買賣或租賃雙方當事人之書面同意，得同時接受雙方之委託。</p><p class=\"evx\"><span class=\"evt\">例</span><span>賣方簽委託書後，買方也要委託同一仲介，須雙方都簽書面同意書，口頭同意不算。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第24條之2</span>以雙方「書面同意」為要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）取得同意後之六項義務</p><p><span class=\"evli\">①公平提供雙方類似不動產之交易價格；</span><span class=\"evli\">②公平提供雙方契約內容規範之說明；</span><span class=\"evli\">③提供買受人或承租人不動產必要之資訊；</span><span class=\"evli\">④告知買受人或承租人依仲介專業應查知之瑕疵；</span><span class=\"evli\">⑤協助買受人或承租人進行必要之檢查；</span><span class=\"evli\">⑥其他中央主管機關為保護當事人所為之規定。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介不能只提供賣方有利的成交行情，須同樣讓買方知悉；屋況漏水依專業應查知者，須主動告知買方。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>同時服務雙方仍不得降低對任一方之專業服務水準，尤其對買方負積極保護義務。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）違反之效果</p><p>違反<span class=\"art\">第24條之2</span>者，依<span class=\"art\">第29條第1項第3款</span>由主管機關處新臺幣3萬元以上15萬元以下罰鍰；依同條第2項並應令其限期改正，屆期未改正者，按次處罰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以罰鍰確保程序與義務落實。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>仲介業欲同時接受雙方委託，須先取得雙方書面同意，並落實公平提供價格、契約說明、必要資訊、瑕疵告知、協助檢查等六項義務；違反者處3萬元以上15萬元以下罰鍰。雙方代理須公平誠實，方能避免利益衝突、維護交易安全。</p>"], "ck": [{"x": "§24-2 前段：須經買賣或租賃雙方當事人書面同意，始得同時接受雙方委託", "h": true}, {"x": "未經雙方書面同意即同時受託＝違法之雙方代理（前提要件不可漏寫）", "h": false}, {"x": "§24-2 六款：交易價格、契約內容說明、必要資訊、應查知瑕疵、必要檢查、其他中央主管機關規定", "h": true}, {"x": "第三至五款只對買受人或承租人，不得因雙方代理而降低對任一方之服務水準", "h": false}, {"x": "§29：違反 §24-2 處新臺幣 3 萬元以上 15 萬元以下罰鍰", "h": true}, {"x": "答題順序：書面同意（前提）→ 六項義務 → 罰鍰 3–15 萬", "h": false}], "mn": "價・契・資・瑕・檢・他：先同意、再六項，違反罰 3–15 萬", "hp": 1030, "hpl": "中"}, {"id": "es-fw06", "no": "範文06★", "t": "114年申論二｜雙方代理超收服務費與經紀營業員另收報酬之違規案例", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "甲不動產仲介公司經買賣雙方書面同意，同時接受雙方委託媒合土地買賣契約。契約締結後，甲收取買賣雙方之仲介服務費總額超過不動產實際成交價金百分之六；該公司經紀營業員乙並收取仲介服務費以外之其他報酬。試依不動產經紀業管理條例規定說明：甲與乙違反何種業務規範？會受到何種處罰？超收之報酬應如何處理？（25 分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依管理條例<span class=\"art\">第19條第1項</span>，經紀業或經紀人員不得收取差價或其他報酬，經營仲介業務者並應依實際成交價金或租金按中央主管機關規定之報酬標準計收。本題雙方代理本身合法，但報酬收取違法，兩者須分開判斷。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第19條第1項</span>、第2項<span class=\"lawn\">（禁收差價與其他報酬）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第2款</span><span class=\"lawn\">（經紀人員之懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲公司違反報酬標準</p><p>依<span class=\"art\">第19條第1項</span>，經紀業經營仲介業務者，應依實際成交價金或租金按中央主管機關規定之報酬標準計收。甲雖已依<span class=\"art\">第24條之2</span>取得雙方書面同意，但向雙方收取服務費總額超過成交價6%，已逾報酬標準。</p><p class=\"evx\"><span class=\"evt\">例</span><span>成交1,000萬元，雙方合計收取超過60萬元即屬超收。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>雙方代理合法與否，不影響報酬上限之適用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙收取其他報酬</p><p>依<span class=\"art\">第19條第1項</span>，經紀業或經紀人員不得收取差價或其他報酬。乙另收仲介服務費以外之報酬，與甲超收屬兩個獨立違規，應分別論處。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第19條第1項</span>之禁止主體明列「經紀人員」，經紀人員不得收取差價或其他報酬。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）處罰與返還</p><p><span class=\"evli\">①依<span class=\"art\">第19條第2項</span>，已收取之超額報酬或其他報酬，應於加計利息後加倍返還支付人；</span><span class=\"evli\">②甲依<span class=\"art\">第29條第1項第1款</span>，處新臺幣6萬元以上30萬元以下罰鍰；</span><span class=\"evli\">③乙依<span class=\"art\">第31條第1項第2款</span>，應予6個月以上3年以下停止執行業務。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>乙多收10萬元，須加計利息後加倍返還支付人。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第19條第2項</span>明定已收取之差價或其他報酬，應於加計利息後加倍返還支付人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲超收服務費，處6萬元以上30萬元以下罰鍰；乙另收其他報酬，應予6個月以上3年以下停止執行業務；甲、乙所收超額或其他報酬，均應加計利息加倍返還支付人。同意雙方代理不等於收費合法，須分層檢視。</p>"], "ck": [{"x": "§24-2：經雙方書面同意得同時接受雙方委託（雙方代理這一層合法）", "h": false}, {"x": "§19Ⅰ：經紀業或經紀人員不得收差價或其他報酬，仲介業務應按報酬標準計收", "h": false}, {"x": "甲總額逾成交價 6%＝超收；乙另收服務費以外報酬＝兩個獨立違規", "h": true}, {"x": "雙方代理合法與報酬合法是兩層判斷，不能以前者豁免後者", "h": true}, {"x": "§29Ⅰ①：經紀業違反 §19Ⅰ 處 6 萬元以上 30 萬元以下罰鍰", "h": true}, {"x": "§31Ⅰ②：經紀人員違反 §19Ⅰ 予 6 個月以上 3 年以下停止執行業務", "h": true}, {"x": "甲＝罰鍰、乙＝停止執行業務（不是申誡）", "h": false}, {"x": "§19Ⅱ：已收取者加計利息後加倍返還支付人", "h": true}], "mn": "吃價差三件事：吐（加倍返還）→ 罰（公司 6–30 萬）→ 停（人員停執 6 月–3 年）", "hp": 1031, "hpl": "中"}, {"id": "es-fw09", "no": "範文09", "t": "100年申論一｜經紀業退還營業保證金之原因、期限、範圍與應檢附文件", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "試說明經紀業得請求退還繳存營業保證金之原因、期限、範圍，以及申請時應檢附之證明文件。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>營業保證金是經紀業依法繳存，用以保障交易當事人因經紀業違規受損時求償之用。營業保證金由經紀業於辦妥公司登記或商業登記後依規定繳存（<span class=\"art\">第7條第3項</span>）；經紀業申請解散者，得自核准註銷營業之日滿一年後二年內請求退還（<span class=\"art\">第9條第2項</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第8條第1項</span><span class=\"lawn\">（營業保證金之保管與補足）</span></span><span class=\"evli\"><span class=\"art\">第9條</span><span class=\"lawn\">（營業保證金之獨立性與退還）</span></span><span class=\"evli\">施行細則<span class=\"art\">第13條之1</span></span><span class=\"evli\"><span class=\"art\">第13條之2</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）退還原因</p><p><span class=\"evli\">①公司組織申請解散；</span><span class=\"evli\">②商號組織申請歇業；</span><span class=\"evli\">③營業項目經變更登記後，已無不動產仲介經紀業及不動產代銷經紀業，而組織仍存續。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>A公司改為只做室內設計，仍存續但已無仲介、代銷項目，得申請退還。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>三者皆以確定不再經營仲介或代銷業務為前提。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）退還期限</p><p>應自核准註銷營業之日滿1年後2年內請求退還。</p><p class=\"evx\"><span class=\"evt\">例</span><span>114年1月1日核准註銷，須等到115年1月1日後，並於117年1月1日前申請。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第9條第2項</span>明定滿一年後二年內始得請求。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）退還範圍</p><p>限原繳存之營業保證金，不包括孳息。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第8條第1項</span>，基金之孳息部分，得運用於健全不動產經紀制度。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）應檢附文件</p><p>直轄市或縣（市）主管機關核發之核准註銷營業證明文件及其他經中央主管機關規定之文件。營業保證金由全國聯合會統一設置專戶儲存（<span class=\"art\">第8條第1項</span>），主管機關核准註銷後，應通知所屬同業公會轉知全國聯合會。</p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀業因解散、歇業或變更營業項目而不再經營仲介代銷者，得於核准註銷營業滿1年後2年內，檢附直轄市或縣（市）主管機關核發之核准註銷營業證明文件及其他經中央主管機關規定之文件，申請退還原繳存之營業保證金（不含孳息）。保證金制度兼顧消費者求償保障與業者退場彈性。</p>"], "ck": [{"x": "§9Ⅱ：自核准註銷營業之日滿一年後二年內請求退還，但不包括孳息", "h": true}, {"x": "細則§13之1 三原因：公司解散、商號歇業、變更登記後已無仲介代銷而組織仍存續", "h": false}, {"x": "第③種原因（變更營業項目、組織仍存續）最容易漏寫，一定要列", "h": true}, {"x": "期限是「滿 1 年後、2 年內」，不是「1 年內」也不是「2 年後」", "h": true}, {"x": "退還範圍只有本金，孳息不退", "h": true}, {"x": "細則§13之2Ⅰ：核准註銷營業證明文件＋其他經中央主管機關規定之文件", "h": false}, {"x": "細則§13之2Ⅱ：申請核准註銷營業須附解散、歇業或營業項目變更登記證明文件", "h": false}, {"x": "核准註銷後由主管機關通知同業公會轉知全國聯合會（全國聯合會統一設置專戶儲存並組成管理委員會負責保管（§8Ⅰ）；條文未賦予審核權）", "h": false}], "mn": "散、歇、變三原因；滿一等二（滿1年後2年內）；領本金不領息", "hp": 16, "hpl": "高"}, {"id": "es-fw11", "no": "範文11", "t": "101年申論一｜經紀人員雙重執業是否符合不動產經紀業管理之意旨", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "某經紀人員甲為增加業績以提高收入，分別於A、B兩家經紀業營業處所任職，此種情形是否符合不動產經紀業管理之意旨？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>專任義務，指依不動產經紀業管理條例<span class=\"art\">第16條</span>，經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務；但經所屬經紀業同意為他經紀業執行業務者，不在此限。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第16條</span><span class=\"lawn\">（經紀人員專任義務）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第1款</span><span class=\"lawn\">（經紀人員之懲戒）</span></span><span class=\"evli\"><span class=\"art\">第33條第1項</span><span class=\"lawn\">（懲戒程序）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><p>依<span class=\"art\">第16條</span>，經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務；但經所屬經紀業同意為他經紀業執行業務者，不在此限。本題甲同時在A、B兩家任職，關鍵在於是否取得原所屬A經紀業之同意。</p><div class=\"evp\"><p class=\"evh\">（一）已取得A同意</p><p>甲為B執行業務，屬<span class=\"art\">第16條</span>但書之例外，合法。</p><p class=\"evx\"><span class=\"evt\">例</span><span>A公司書面同意甲協助B公司銷售特定建案，甲即可同時為B執行業務。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第16條</span>但書明定經所屬經紀業同意為他經紀業執行業務者，不在此限。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）未經A同意</p><p>違反<span class=\"art\">第16條</span>專任義務，依<span class=\"art\">第31條第1項第1款</span>應予申誡。交付懲戒程序依<span class=\"art\">第33條第1項</span>，由利害關係人、各級主管機關或同業公會列舉事實、提出證據，報請直轄市或縣（市）主管機關交付懲戒。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲私下替B帶看成交，未告知A，即屬違反。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>申誡屬懲戒體系中較輕之處分，與收取差價應予停止執行業務不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲同時在A、B任職並非當然違法，適法與否繫於是否取得原所屬A經紀業之同意：已同意者合法；未同意者違反專任義務，應予申誡。制度採「原則專任、例外經同意得兼任」，兼顧專業責任與執業自由。</p>"], "ck": [{"x": "§16：經紀人員應專任一經紀業，不得為自己或他經紀業執行仲介、代銷業務", "h": false}, {"x": "§16 但書：經所屬經紀業同意為他經紀業執行業務者，不在此限", "h": false}, {"x": "同意須由原專任所屬之 A 經紀業給予，不是 B 經紀業", "h": true}, {"x": "不能直接答「違法」，要先分「有無取得 A 同意」兩種情形", "h": true}, {"x": "§31Ⅰ①：違反專任義務者交付懲戒，應予申誡", "h": false}, {"x": "處分是申誡，不是停止執行業務（兼業不等於收差價）", "h": true}, {"x": "制度設計為原則專任、例外經同意得兼任，兼顧執業自由與業者管理", "h": false}], "mn": "兼簽解密＝申誡"}, {"id": "es-fw14", "no": "範文14", "t": "102年申論二｜何謂不動產經紀業、委託契約簽章立法目的及違反處理", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "何謂「不動產經紀業」？不動產仲介業受委託出售不動產者，其依法應指派經紀人於該出售委託契約書上簽章，其立法目的為何？倘若不動產仲介業違反前述之情事者，主管機關應如何處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依不動產經紀業管理條例<span class=\"art\">第4條第4款</span>，經紀業指依本條例規定經營仲介或代銷業務之公司或商號。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條第4款</span><span class=\"lawn\">（經紀業之定義）</span></span><span class=\"evli\"><span class=\"art\">第22條第1項第1款</span><span class=\"lawn\">（應由經紀人簽章之文件）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\"><span class=\"art\">第29條第2項</span><span class=\"lawn\">（併令限期改正）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）經紀業之定義</p><p>依<span class=\"art\">第4條第4款</span>，不動產經紀業指依本條例規定經營仲介或代銷業務之公司或商號。</p><p class=\"evx\"><span class=\"evt\">例</span><span>未經許可之個人替人賣屋收佣，不是本條例所稱經紀業。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>經營經紀業者應經主管機關許可並辦理公司或商業登記（<span class=\"art\">第5條第1項</span>），非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業並處罰鍰（<span class=\"art\">第32條第1項</span>）。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）委託契約書簽章之立法目的</p><p>依<span class=\"art\">第22條第1項第1款</span>，不動產出租、出售委託契約書應由經紀業指派經紀人簽章。經紀人須經國家考試及格並領有證書，由其簽章可確保契約內容經專業把關，避免由不具資格之人草率簽訂，致委託人權益受損。</p><p class=\"evx\"><span class=\"evt\">例</span><span>屋主委託出售時，委託書上須有經紀人簽章，營業員簽章不足以替代。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保障委託人締約前之資訊對稱與契約品質，並使責任可追溯。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）違反之處理</p><p>未指派經紀人簽章者，依<span class=\"art\">第29條第1項第1款</span>，由直轄市、縣（市）主管機關處新臺幣6萬元以上30萬元以下罰鍰；並依<span class=\"art\">第29條第2項</span>令其限期改正，屆期未改正者按次處罰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>罰鍰加上限期改正，督促業者落實法定簽章程序。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>不動產經紀業指依法經營仲介或代銷業務之公司或商號；委託契約書應由經紀人簽章，目的在確保契約經專業把關、保障委託人；違反者處6萬元以上30萬元以下罰鍰，並令限期改正，屆期未改正按次處罰。</p>"], "ck": [{"x": "§4④：經紀業＝依本條例經營仲介或代銷業務之「公司或商號」", "h": true}, {"x": "§4⑤⑥：仲介＝買賣互易租賃之居間或代理；代銷＝受起造人或建築業委託企劃並代理銷售", "h": false}, {"x": "§22Ⅰ①：出租、出售委託契約書應由經紀業指派經紀人簽章", "h": false}, {"x": "立法目的要寫出「經紀人考試及格領證→專業把關→保障委託人權益」三段", "h": true}, {"x": "§29Ⅰ①：由直轄市、縣（市）主管機關處 6 萬元以上 30 萬元以下罰鍰", "h": true}, {"x": "§29Ⅱ：處罰鍰者並應令限期改正，屆期未改正按次處罰", "h": false}, {"x": "處理方式要寫滿三層：罰鍰＋限期改正＋按次處罰", "h": false}], "mn": "定義看組織（公司或商號）、簽章看專業（經紀人）、罰則看 §29Ⅰ①（6–30 萬＋限期改正）", "hp": 1, "hpl": "高"}, {"id": "es-fw15", "no": "範文15", "t": "103年申論一｜經營經紀業開業要件、開始營業期限及僱用未具資格罰則", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "某甲因生涯規劃，擬投資從事不動產經紀業之經營；茲試問該某甲向主管機關申請不動產經紀業開業時，應符合那些要件？又應於多久期限內開始營業？另經紀業如僱用未具備經紀人員資格者，從事仲介或代銷業務時，會受到何種處罰？請依不動產經紀業管理條例及相關子法之規定，分別詳述之。（25 分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依管理條例<span class=\"art\">第5條第1項</span>及<span class=\"art\">第7條第1項</span>，經營經紀業須經主管機關許可、辦妥公司或商業登記並加入同業公會後方得營業，並應於六個月內開始營業。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第5條</span><span class=\"lawn\">（經營經紀業之許可）</span></span><span class=\"evli\"><span class=\"art\">第7條第1項</span>、第3項<span class=\"lawn\">（入會後方得營業）</span></span><span class=\"evli\"><span class=\"art\">第17條</span><span class=\"lawn\">（不得僱用未具資格者）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）開業要件</p><p>依<span class=\"art\">第5條</span>及<span class=\"art\">第7條</span>，甲應<span class=\"evli\">①向主管機關申請許可；</span><span class=\"evli\">②經許可後辦妥公司登記或商業登記；</span><span class=\"evli\">③加入登記所在地之同業公會；</span><span class=\"evli\">④辦妥登記後依中央主管機關規定繳存營業保證金（<span class=\"art\">第7條第3項</span>）。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>甲取得許可後，須完成公司登記、加入公會並繳存保證金，才能掛牌營業。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>分別確保組織合法、受同業自律、具備賠償能力。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）開始營業期限</p><p>依<span class=\"art\">第7條第1項</span>，應於6個月內開始營業；逾期未開始營業者，由主管機關廢止其許可。但有正當理由者，得申請展延一次，期限以3個月為限。</p><p class=\"evx\"><span class=\"evt\">例</span><span>逾<span class=\"art\">第7條第1項</span>所定六個月期限仍未開始營業，又未以正當理由申請展延者，許可即遭廢止。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免許可閒置、徒具形式。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）僱用無資格者之處罰</p><p>依<span class=\"art\">第17條</span>，經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務；違反者依<span class=\"art\">第29條第1項第1款</span>，由直轄市、縣（市）主管機關處新臺幣6萬元以上30萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">例</span><span>僱用未取得營業員證明之業務員帶看成交，即屬違反。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>專業人力是交易安全之基礎。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲須取得許可、辦妥公司或商業登記、加入同業公會並繳存營業保證金，且應於6個月內開始營業（得展延一次3個月），逾期廢止許可；僱用未具資格者從事業務，處6萬元以上30萬元以下罰鍰，以從源頭確保交易安全。</p>"], "ck": [{"x": "§5Ⅰ：先向主管機關申請許可，再依法辦理公司或商業登記（順序不可顛倒）", "h": false}, {"x": "§7Ⅰ：加入登記所在地之同業公會後方得營業；§7Ⅲ：辦妥登記後繳存營業保證金", "h": true}, {"x": "四要件＝許可、登記、入會、繳存營業保證金，缺一不可且有先後順序", "h": false}, {"x": "§7Ⅰ：應於 6 個月內開始營業，逾期由主管機關廢止其許可", "h": true}, {"x": "§7Ⅰ但書：有正當理由得申請展延「一次」，期限以 3 個月為限", "h": true}, {"x": "§17：經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務", "h": false}, {"x": "§29Ⅰ①：§17 列於第 1 款，處 6 萬元以上 30 萬元以下罰鍰", "h": true}, {"x": "罰鍰機關是直轄市、縣（市）主管機關；§29Ⅱ 並應令限期改正、屆期按次處罰", "h": false}], "mn": "許・登・會・營（四要件）；6 個月開業、展延一次 3 個月；僱用無資格 6–30 萬", "hp": 17, "hpl": "高"}, {"id": "es-fw16", "no": "範文16", "t": "104年申論一｜經紀人甲網路刊登仲介廣告適法性分析", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "不動產經紀人甲任職於A不動產經紀公司，受好友請託仲介銷售房屋，甲於網路上房屋交易網站刊登銷售該屋之廣告。試問甲的仲介行為，應如何進行方為適法？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>管理條例就經紀業刊登廣告設有前提要件與內容真實義務，依<span class=\"art\">第21條</span>，經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售，其內容應與事實相符並註明經紀業名稱。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第21條第1項</span>、第2項<span class=\"lawn\">（先簽委託契約書）</span></span><span class=\"evli\"><span class=\"art\">第22條第1項第4款</span><span class=\"lawn\">（不動產廣告稿應由經紀人簽章）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）先簽委託契約書</p><p>依<span class=\"art\">第21條第1項</span>，經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售。本題甲若只以個人名義口頭答應好友，未由A公司與好友簽訂委託契約書，即於網路刊登廣告，已違反此前提。</p><p class=\"evx\"><span class=\"evt\">例</span><span>好友只用通訊軟體說「幫我賣」，尚不足以刊登。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第21條第1項</span>以簽訂委託契約書為刊登廣告及銷售之前提。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）內容相符並註明經紀業名稱</p><p>依<span class=\"art\">第21條第2項</span>，廣告及銷售內容應與事實相符，並註明經紀業名稱。甲若只刊登個人電話、未註明A公司，即屬違反。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>使消費者辨識交易對象，便於日後追究責任。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）廣告稿簽章</p><p>依<span class=\"art\">第22條第1項第4款</span>，不動產廣告稿應由經紀業指派經紀人簽章。</p></div><div class=\"evp\"><p class=\"evh\">（四）適法作法</p><p><span class=\"evli\">①由A公司與好友簽訂委託契約書；</span><span class=\"evli\">②廣告內容與事實相符；</span><span class=\"evli\">③註明A公司名稱；</span><span class=\"evli\">④廣告稿由指派之經紀人簽章。違反者，A公司依<span class=\"art\">第29條第1項第1款</span>處新臺幣6萬元以上30萬元以下罰鍰。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲欲合法仲介，應先由A公司與好友簽訂委託契約書，網路廣告內容須與事實相符並註明A公司名稱，廣告稿由經紀人簽章；否則A公司將受6萬元以上30萬元以下罰鍰。廣告合法才能保障消費者知情權。</p>"], "ck": [{"x": "§21Ⅰ：經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "h": false}, {"x": "簽約主體與受罰主體都是 A 經紀公司，不是經紀人甲個人", "h": true}, {"x": "甲不得以個人名義逕行刊登，須先由 A 公司與好友簽委託契約書", "h": false}, {"x": "§21Ⅱ：廣告及銷售內容應與事實相符，並註明經紀業名稱", "h": true}, {"x": "廣告稿應由經紀業指派之經紀人簽章（只留個人電話、無人簽章均不合法）", "h": true}, {"x": "§21Ⅲ：廣告及銷售內容與事實不符者，應負損害賠償責任", "h": false}, {"x": "適法四步：先簽委託契約書 → 內容與事實相符 → 註明 A 公司名稱 → 廣告稿經紀人簽章；否則罰 6–30 萬", "h": false}], "mn": "先簽約、說實話、具名字、蓋章；漏了罰的是 A 公司 6–30 萬", "hp": 6, "hpl": "高"}, {"id": "es-fw17", "no": "範文17", "t": "104年申論二｜代銷公司與廣告公司虛偽不實廣告責任", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "甲不動產代銷公司委託乙廣告公司製作廣告，要求乙廣告公司在廣告上載明「開車到市中心只要五分鐘」等交通便利宣傳文字。依公平交易法之規定，甲、乙各有何責任？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依公平交易法<span class=\"art\">第21條第1項</span>，事業不得對與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示；依同條第5項，廣告代理業明知或可得而知仍製作或設計有引人錯誤之廣告者，與廣告主負連帶損害賠償責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">公平交易法<span class=\"art\">第21條第1項</span>、第2項、第5項<span class=\"lawn\">（虛偽不實或引人錯誤之表示）</span></span><span class=\"evli\"><span class=\"art\">第42條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）是否構成不實廣告</p><p>依<span class=\"art\">第21條第1項</span>、第2項，事業不得在商品或廣告上，對與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示。「開車到市中心只要五分鐘」若與建案實際區位、交通狀況顯不相符，即屬對商品區位條件之不實表示。</p><p class=\"evx\"><span class=\"evt\">例</span><span>實際車程需二十分鐘以上，卻宣稱五分鐘。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>交通便利性足以影響購屋決定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲代銷公司（廣告主）之責任</p><p>甲對其委託製作之廣告內容負確保真實之義務。違反<span class=\"art\">第21條</span>者，依<span class=\"art\">第42條</span>，公平會得限期令停止、改正或採取必要更正措施，並處新臺幣5萬元以上2,500萬元以下罰鍰；甲並應依<span class=\"art\">第30條</span>，對信賴廣告而受損害之消費者負損害賠償責任。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>廣告主是廣告內容之決定者與受益者。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙廣告公司（廣告代理業）之責任</p><p>依<span class=\"art\">第21條第5項</span>，廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，應與廣告主負連帶損害賠償責任。本題乙依甲要求製作，若明知或可得而知與實際交通狀況不符，仍應與甲連帶賠償。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙實地勘查即可發現車程不符。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>不得以「依客戶指示製作」卸責。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲為廣告主，應負限期改正、罰鍰之公法責任及損害賠償之私法責任；乙若明知或可得而知廣告不實仍予製作，應與甲對消費者負連帶賠償責任。廣告製作鏈各方均負查證義務，才能落實真實廣告與消費者保護。</p>"], "ck": [{"x": "§21Ⅰ、Ⅱ：事業不得就足以影響交易決定之事項（含內容、用途及其他招徠效果事項）為虛偽不實或引人錯誤之表示", "h": false}, {"x": "「開車到市中心只要五分鐘」與實際地理位置、交通狀況顯不相符＝虛偽不實", "h": false}, {"x": "甲（廣告主）：限期停止、改正或採取必要更正措施＋罰鍰 5 萬–2500 萬＋損害賠償", "h": true}, {"x": "本題是公平法，罰鍰不可寫成管理條例的 6–30 萬", "h": true}, {"x": "§21⑤：廣告代理業明知或可得而知仍製作引人錯誤廣告 → 與廣告主負連帶損害賠償責任", "h": false}, {"x": "乙的責任以「明知或可得而知」為前提，漏寫此要件等於沒答到核心", "h": true}, {"x": "「僅依客戶指示製作」不能免責；製作鏈各參與者均有查證義務", "h": true}], "mn": "明知才連帶，非名人十倍", "hp": 7, "hpl": "高"}, {"id": "es-fw18", "no": "範文18", "t": "105年申論一｜何謂不動產、經紀人員及應簽章文件", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "何謂「不動產」？何謂「經紀人員」？不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，那些文件應由經紀業指派經紀人簽章？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依管理條例<span class=\"art\">第4條第1款</span>，不動產指土地、土地定著物或房屋及其可移轉之權利；依同條第7款，經紀人員指經紀人或經紀營業員。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\"><span class=\"art\">第22條第1項</span>、第2項<span class=\"lawn\">（應由經紀人簽章之六類文件）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）不動產</p><p>依<span class=\"art\">第4條</span>，指土地、土地定著物或房屋及其可移轉之權利；房屋指成屋、預售屋及其可移轉之權利。</p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋買賣契約之權利轉讓，也在不動產範圍內。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使預售屋交易同受本條例規範。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）經紀人員</p><p>依<span class=\"art\">第4條</span>，指經紀人或經紀營業員；經紀人之職務為執行仲介或代銷業務，經紀營業員之職務為協助經紀人執行仲介或代銷業務。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>區分執行與協助之層級，對應不同資格與責任。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）應由經紀人簽章之文件</p><p>依<span class=\"art\">第22條第1項</span>，不動產之買賣、互易、租賃或代理銷售委由經紀業仲介或代銷者，下列文件應由經紀業指派經紀人簽章：<span class=\"evli\">①不動產出租、出售委託契約書；</span><span class=\"evli\">②不動產承租、承購要約書；</span><span class=\"evli\">③定金收據；</span><span class=\"evli\">④不動產廣告稿；</span><span class=\"evli\">⑤不動產說明書；</span><span class=\"evli\">⑥不動產租賃、買賣契約書。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介收取定金開立收據，須有經紀人簽章。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）代銷之例外</p><p>依<span class=\"art\">第22條第2項</span>，前項第1款及第2款之規定，於經營代銷業務者不適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代銷之委託關係存在於起造人或建築業與經紀業之間，不與一般消費者簽委託書或要約書。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>不動產指土地、土地定著物或房屋及其可移轉之權利，房屋含成屋與預售屋；經紀人員包括經紀人與經紀營業員。仲介或代銷時，委託契約書、要約書、定金收據、廣告稿、說明書、租賃買賣契約書六類文件應由經紀人簽章，其中委託契約書與要約書於代銷不適用。</p>"], "ck": [{"x": "§4①：不動產＝土地、土地定著物或房屋及其可移轉之權利；房屋含成屋、預售屋", "h": false}, {"x": "§4⑦：經紀人員＝經紀人（執行）＋經紀營業員（協助執行）", "h": true}, {"x": "§22Ⅰ：六類文件應由經紀業指派經紀人簽章", "h": false}, {"x": "六類一字不漏：委託契約書・要約書・定金收據・廣告稿・不動產說明書・租賃買賣契約書", "h": true}, {"x": "§22Ⅱ：不適用的是第①②款，不是第③④款", "h": true}, {"x": "代銷例外的理由：委託關係在起造人或建築業與經紀業之間，不與消費者訂委託書或要約書", "h": false}, {"x": "不動產定義務必寫出「及其可移轉之權利」，只寫土地房屋不完整", "h": false}], "mn": "委・要・定・廣・說・契；代銷砍前兩個（委、要）", "hp": 2, "hpl": "高"}, {"id": "es-fw23", "no": "範文23", "t": "107年申論二｜差價定義、違反處理及經紀業與經紀人員處罰規定", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "依不動產經紀業管理條例規定，經紀業或經紀人員不得收取差價或其他報酬。何謂差價？如違反規定時，已收取之差價或其他報酬應如何處理？依法該經紀業及經紀人員有何處罰規定？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依管理條例<span class=\"art\">第4條第9款</span>，差價係指實際買賣交易價格與委託銷售價格之差額；依<span class=\"art\">第19條第1項</span>，經紀業或經紀人員不得收取差價或其他報酬。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條第9款</span><span class=\"lawn\">（差價之定義）</span></span><span class=\"evli\"><span class=\"art\">第19條第1項</span>、第2項<span class=\"lawn\">（禁收差價與其他報酬）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第2款</span>、第2項<span class=\"lawn\">（經紀人員之懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）差價之定義</p><p>依<span class=\"art\">第4條第9款</span>，差價指實際買賣交易價格與委託銷售價格之差額。</p><p class=\"evx\"><span class=\"evt\">例</span><span>屋主委託以1,000萬元出售，仲介以1,100萬元賣出，私吞100萬元，即為差價。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>差價取自委託人應得之價金，損害委託人權益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）已收取之差價如何處理</p><p>依<span class=\"art\">第19條第1項</span>，經紀業或經紀人員不得收取差價或其他報酬；經營仲介業務者並應依實際成交價金或租金按中央主管機關規定之報酬標準計收。依<span class=\"art\">第19條第2項</span>，違反者，其已收取之差價或其他報酬，應於加計利息後加倍返還支付人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>收取100萬元差價，須加計利息後返還200萬元以上。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第19條第2項</span>明定加計利息後加倍返還支付人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）經紀業之處罰</p><p>依<span class=\"art\">第29條第1項第1款</span>，違反<span class=\"art\">第19條第1項</span>者，由直轄市、縣（市）主管機關處新臺幣6萬元以上30萬元以下罰鍰。</p></div><div class=\"evp\"><p class=\"evh\">（四）經紀人員之懲戒</p><p>依<span class=\"art\">第31條第1項第2款</span>，應予6個月以上3年以下停止執行業務；依同條第2項，停止執行業務處分累計達5年以上者，廢止其經紀人員證書或證明。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第31條第1項第1款</span>之違規僅應予申誡，第2款違反<span class=\"art\">第19條第1項</span>者則應予六個月以上三年以下停止執行業務。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>差價指實際買賣交易價格與委託銷售價格之差額；違法收取者應加計利息加倍返還支付人，經紀業處6萬元以上30萬元以下罰鍰，經紀人員應予6個月以上3年以下停止執行業務。「加倍返還＋雙重處罰」嚇阻收取差價，維護誠信交易。</p>"], "ck": [{"x": "§4⑨：差價＝實際買賣交易價格與委託銷售價格之差額", "h": false}, {"x": "差價不是與「市價」之差額，寫成市價就失分", "h": true}, {"x": "§19Ⅱ：已收取者應加計利息後加倍返還支付人", "h": false}, {"x": "「加計利息」與「加倍」兩個要件都要寫，返還對象是支付人", "h": true}, {"x": "§29Ⅰ①：經紀業由直轄市、縣（市）主管機關處 6 萬元以上 30 萬元以下罰鍰", "h": false}, {"x": "§31Ⅰ②：經紀人員予 6 個月以上 3 年以下停止執行業務處分（不是申誡）", "h": true}, {"x": "§31Ⅱ：停止執行業務累計達 5 年以上，廢止經紀人員證書或證明", "h": true}, {"x": "三層結構：加倍返還（民事）＋業者罰鍰＋人員懲戒，同時並行", "h": false}], "mn": "吃價差：吐（加計利息加倍返還）、罰（6–30 萬）、停（6 月–3 年，累計 5 年廢證）", "hp": 1029, "hpl": "中"}, {"id": "es-fw25", "no": "範文25", "t": "110年申論一｜110年新制代銷／仲介申報實價登錄之申報人、時機與罰責", "lv": "★★★ 必考", "k": "off", "tier": 0, "g": "經紀業管理條例", "q": "請依不動產經紀業管理條例，110年7月1日施行新制，詳述：（一）起造人或建築業委託代銷預售屋者，實價登錄由誰申報？申報時機為何？預售屋買賣案件未依限申報或申報不實，有何罰責？（二）經營仲介業務者應實價登錄之案件及申報時機為何？未依限申報或申報不實，有何罰責？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>實價登錄使不動產交易資訊透明，健全市場秩序。110年7月1日施行之新制，就代銷與仲介之申報義務人、期限與罰則均有修正。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第24條之1第1項</span>、第2項<span class=\"lawn\">（成交案件申報登錄與報備）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第2款</span>、第3款、第5款、第6款<span class=\"lawn\">（經紀業之罰則）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）代銷預售屋</p><p>1.申報人：受起造人或建築業委託代銷預售屋者，由代銷經紀業申報。2.申報時機：<span class=\"evli\">①簽訂、變更或終止委託代銷契約之日起30日內，將委託代銷契約相關書件報請所在地主管機關備查；</span><span class=\"evli\">②簽訂買賣契約書之日起30日內，申報登錄成交案件實際資訊。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>3月1日簽買賣契約，須於3月31日前申報。3.罰責：未依限申報或價格、交易面積資訊不實，依<span class=\"art\">第29條第1項第2款</span>按戶（棟）處新臺幣3萬元以上15萬元以下罰鍰，並令限期改正，屆期未改正按次處罰，經處罰二次仍未改正者，按次處30萬元以上100萬元以下罰鍰；未依限報備查，依第3款處3萬元以上15萬元以下罰鍰；價格及面積以外資訊不實，依第6款經限期改正屆期未改正，處6千元以上3萬元以下罰鍰。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）仲介</p><p>1.應申報案件：依<span class=\"art\">第24條之1第1項</span>，為居間或代理成交之租賃案件；仲介買賣已改依平均地權條例申報。2.時機：簽訂租賃契約書之日起30日內。3.罰責：未依限申報或租金、面積資訊不實，依<span class=\"art\">第29條第1項第5款</span>處1萬元以上5萬元以下罰鍰；其他資訊不實，依第6款處6千元以上3萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第29條第1項第2款</span>與第5款分別規定代銷與仲介之罰鍰級距。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>代銷預售屋由代銷經紀業申報，委託代銷契約30日內報備查、買賣契約30日內申報登錄，違規按戶處3萬元以上15萬元以下；仲介僅租賃案件於簽約30日內申報，違規處1萬元以上5萬元以下。兩者罰鍰級距不同，是最易混淆之考點。</p>"], "ck": [{"x": "代銷之申報義務人是受託的代銷經紀業，不是起造人或建築業", "h": false}, {"x": "§24-1Ⅱ：委託代銷契約簽訂、變更、終止起 30 日內報備查＋買賣契約簽訂起 30 日內申報登錄", "h": false}, {"x": "§29Ⅰ②：按戶（棟）處 3 萬–15 萬罰鍰，經處罰二次仍未改正者按次處 30 萬–100 萬", "h": true}, {"x": "§29Ⅰ⑥：價格、面積以外資訊不實＝先限期改正，不改才處 6 千–3 萬", "h": true}, {"x": "§24-1Ⅰ：仲介僅「租賃案件」須申報，買賣案件已改依平均地權條例", "h": true}, {"x": "§29Ⅰ⑤：仲介未依限申報或租金、面積不實處 1 萬–5 萬罰鍰", "h": true}, {"x": "代銷 3–15 萬、仲介 1–5 萬級距不同，兩者不可互換", "h": false}], "mn": "代銷兩個 30 日（備查、登錄），罰按戶棟 3–15；仲介只租賃 30 日，罰 1–5"}, {"id": "es-fw27", "no": "範文27", "t": "111年申論一｜何謂加盟經營者、標明義務及違反處罰", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "何謂加盟經營者？經紀業係加盟經營者，應於何處標明加盟經營字樣？經紀業違反規定者，應如何處罰之？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第4條第8款</span>，加盟經營者指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督；依<span class=\"art\">第18條</span>，其為加盟經營者，應併標明之。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條第8款</span><span class=\"lawn\">（加盟經營者）</span></span><span class=\"evli\"><span class=\"art\">第18條</span><span class=\"lawn\">（證照揭示與加盟併標明）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第4款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\">施行細則<span class=\"art\">第22條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）加盟經營者之定義</p><p>依<span class=\"art\">第4條第8款</span>，指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某店使用知名品牌招牌與營運系統，但由當地業者自行經營、負擔盈虧。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>品牌與實際經營者分離，須讓消費者知情。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）標明之處所</p><p>依<span class=\"art\">第18條</span>，經紀業應將證照、許可文件連同經紀人證書揭示於營業處所明顯之處；其為加盟經營者，應併標明之。依施行細則<span class=\"art\">第22條</span>，加盟店或加盟經營字樣應標明於廣告、市招及名片等明顯處。</p><p class=\"evx\"><span class=\"evt\">例</span><span>店面招牌、DM、業務名片上都要寫「加盟店」。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>消費者接觸經紀業之管道多元，各處都要能辨識。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）違反之處罰</p><p>違反<span class=\"art\">第18條</span>者，依<span class=\"art\">第29條第1項第4款</span>，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣3萬元以上15萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>屬資訊揭露義務，先給改正機會。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>加盟經營者指以契約使用他方之服務、營運方式、商標或服務標章並受其規範監督之經紀業；應於營業處所、廣告、市招及名片等明顯處標明加盟店或加盟經營字樣；違反者先令限期改正，屆期未改正處3萬元以上15萬元以下罰鍰，以保障消費者知情權。</p>"], "ck": [{"x": "§4⑧：以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督", "h": true}, {"x": "定義要寫滿兩個要件，漏「受其規範或監督」就不完整", "h": false}, {"x": "§18：證照、許可文件連同經紀人證書揭示於營業處所明顯之處，加盟者應併標明", "h": false}, {"x": "細則§22：應於廣告、市招及名片等明顯處標明加盟店或加盟經營字樣", "h": true}, {"x": "§29Ⅰ④：違反 §18 者，主管機關應令限期改正；屆期未改正才罰", "h": false}, {"x": "額度是 3–15 萬且以「限期改正未果」為前提，不是 6–30 萬的直接開罰", "h": true}], "mn": "契約＋監督才算加盟；店內（§18）、店外廣告市招名片（細則§22）都要標；未標＝先改正，不改 3–15 萬"}, {"id": "es-fw30", "no": "範文30", "t": "113年申論一｜經紀業應揭示文件、代銷不適用項目及違反處罰", "lv": "★★ 高機率", "k": "off", "tier": 1, "g": "經紀業管理條例", "q": "不動產經紀業應於營業處所明顯之處，揭示那些文件？那一文件代銷經紀業不適用之？違反此一規定者，應如何處罰之？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>管理條例要求經紀業將特定文件揭示於營業處所明顯之處，使消費者一進門即能查悉業者是否合法、人員是否具資格及收費標準，提升交易前資訊透明。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第18條</span><span class=\"lawn\">（證照及經紀人證書之揭示、加盟標明）</span></span><span class=\"evli\"><span class=\"art\">第20條</span><span class=\"lawn\">（報酬標準之揭示）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第4款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\">施行細則<span class=\"art\">第21條</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應揭示之文件</p><p>依施行細則<span class=\"art\">第21條</span>，經紀業應於營業處所明顯之處揭示：<span class=\"evli\">①經紀業許可文件；</span><span class=\"evli\">②同業公會會員證書；</span><span class=\"evli\">③不動產經紀人證書；</span><span class=\"evli\">④報酬標準及收取方式。前三項得以影本為之；加盟經營者依<span class=\"art\">第18條</span>應併標明之（施行細則<span class=\"art\">第22條</span>另規定於廣告、市招及名片標明加盟店或加盟經營字樣）。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>店內牆上掛許可影本、公會會員證書、經紀人證書及仲介費收費標準。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>讓消費者自行確認業者合法與人員資格。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）代銷不適用之項目</p><p>依施行細則<span class=\"art\">第21條第3項</span>，「報酬標準及收取方式」於代銷經紀業不適用；條例<span class=\"art\">第20條</span>亦僅規定經營仲介業務者應揭示報酬標準。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代銷報酬由起造人或建築業依委託代銷契約支付，不向一般消費者收取。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）違反之處罰</p><p>違反<span class=\"art\">第18條</span>或<span class=\"art\">第20條</span>者，依<span class=\"art\">第29條第1項第4款</span>，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣3萬元以上15萬元以下罰鍰。</p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介店未揭示收費標準，經通知限期改正仍未改，才處罰鍰。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第29條第1項第4款</span>明定先令限期改正，屆期未改正始處罰鍰。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀業應揭示許可文件、同業公會會員證書、經紀人證書及報酬標準與收取方式，前三項得以影本為之；報酬標準於代銷經紀業不適用；違反者先限期改正，屆期未改正處3萬元以上15萬元以下罰鍰，須與直接處6萬元以上30萬元以下之條文區辨。</p>"], "ck": [{"x": "施行細則 §21：揭示四項＝許可文件、同業公會會員證書、經紀人證書、報酬標準及收取方式", "h": true}, {"x": "§18：證照、許可文件連同經紀人證書揭示於明顯處；加盟經營者應併標明", "h": false}, {"x": "前三項得以影本為之（不是全部都要正本，也不是全部都可影本）", "h": false}, {"x": "§20 僅規範「經營仲介業務者」應揭示報酬標準及收取方式", "h": false}, {"x": "代銷不適用的是第④項報酬標準及收取方式，不是前三項", "h": true}, {"x": "§29Ⅰ④：違反 §12、§18、§20、§27 → 令限期改正，屆期未改正處 3–15 萬", "h": false}, {"x": "是「先限期改正、屆期未改正才罰 3–15 萬」，不是直接罰，更不是 6–30 萬", "h": true}, {"x": "§29Ⅰ① 對照組：§7Ⅵ、§11、§17、§19Ⅰ、§21Ⅰ、Ⅱ、§22Ⅰ 直接處 6–30 萬", "h": false}], "mn": "冊照價查（§12 冊、§18 照、§20 價、§27 查）：先改正，屆期不改 3–15 萬"}, {"id": "es-mk1", "no": "模一", "t": "模擬試題｜非經紀業經營仲介業務之認定與處罰、簽章六類文件", "lv": "補習班模擬卷", "k": "mock", "tier": 3, "g": "經紀業管理條例", "q": "甲未經主管機關許可經營不動產經紀業，亦未具不動產經紀人員資格。甲受友人乙之託，將乙所有之數間套房刊登於 591 租屋網站，並於廣告中留下自己的聯絡方式。嗣有承租人詢問時，甲除安排看屋外，並負責介紹房屋設備、周邊環境、交通狀況及聯繫租賃條件，且類似租屋廣告已有多筆紀錄。經主管機關查獲後，甲主張其僅係協助友人出租房屋，並未成立公司或商號，亦未向出租人或承租人收取仲介費或服務報酬，不應認定為經營仲介業務。試依不動產經紀業管理條例規定，說明甲之行為是否違反該條例？主管機關得如何處罰？另外，請說明哪些文件應由經紀業指派經紀人簽章？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>仲介業務，指從事不動產買賣、互易、租賃之居間或代理業務；經紀業，指依本條例規定經營仲介或代銷業務之公司或商號。是否成立仲介業務，不以收取報酬為要件，也不以設立公司或商號為前提，而依<span class=\"art\">第4條第5款</span>，以有無從事不動產買賣、互易、租賃之居間或代理業務判斷。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條第4款</span><span class=\"lawn\">（名詞定義）</span></span><span class=\"evli\">第5款，<span class=\"art\">第5條第1項</span>，<span class=\"art\">第32條第1項</span><span class=\"lawn\">（經營經紀業須經許可）</span></span><span class=\"evli\">第2項（非經紀業經營仲介或代銷業務之處罰），<span class=\"art\">第22條第1項</span>、第2項</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲是否經營仲介業務</p><p>依<span class=\"art\">第4條第5款</span>，仲介業務指從事不動產買賣、互易、租賃之居間或代理業務。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲刊登591廣告並留聯絡方式、安排看屋、介紹屋況與周邊環境、聯繫租賃條件，屬居間行為；類似廣告已有多筆紀錄，具反覆繼續性，非偶發協助親友。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>仲介業務之認定看行為本身，甲主張未收報酬、未設公司或商號，均不影響認定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲違反許可制</p><p>依<span class=\"art\">第5條第1項</span>，經營經紀業者，應向主管機關申請許可後，依法辦理公司或商業登記。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲未經許可即反覆居間，屬非經紀業而經營仲介業務；甲亦非經紀人員。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>仲介業務須先納入許可管理。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）主管機關之處罰</p><p>依<span class=\"art\">第32條第1項</span>，非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處公司負責人、商號負責人或行為人新臺幣十萬元以上三十萬元以下罰鍰；依同條第2項，禁止營業處分後仍繼續營業者，處刑罰。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲為行為人；禁止後仍繼續帶看，始另科刑罰。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>先行政罰，再對續營者科刑。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）應由經紀人簽章之文件</p><p>依<span class=\"art\">第22條第1項</span>，不動產之買賣、互易、租賃或代理銷售，委由經紀業仲介或代銷者，下列文件應由經紀業指派經紀人簽章：<span class=\"evli\">①不動產出租、出售委託契約書</span><span class=\"evli\">②不動產承租、承購要約書</span><span class=\"evli\">③定金收據</span><span class=\"evli\">④不動產廣告稿</span><span class=\"evli\">⑤不動產說明書</span><span class=\"evli\">⑥不動產租賃、買賣契約書；依同條第2項，第1款及第2款於經營代銷業務者不適用之。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>租屋廣告稿應由經紀人簽章。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>由具資格者對重要文件負責。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲反覆居間出租套房，屬經營仲介業務，未經許可即違反本條例，未收報酬或未設公司不影響認定。主管機關應禁止其營業，並處甲新臺幣十萬元以上三十萬元以下罰鍰；禁止營業後仍繼續營業者，處一年以下有期徒刑、拘役或科或併科新臺幣十萬元以上三十萬元以下罰金（<span class=\"art\">第32條第2項</span>）。應由經紀人簽章之文件為<span class=\"art\">第22條第1項</span>所列六類，其中第1款、第2款於代銷業務不適用。</p>"], "ck": [{"x": "§4⑤：仲介業務＝不動產買賣、互易、租賃之居間或代理業務", "h": false}, {"x": "甲刊登廣告、帶看、介紹屋況、聯繫租賃條件＝居間；多筆紀錄＝反覆繼續性", "h": false}, {"x": "「未收報酬」「未設公司」均非免責事由，不影響仲介業務之成立", "h": true}, {"x": "甲未經許可經營仲介業務，違反 §5Ⅰ；且非經紀人員，不得執行業務", "h": false}, {"x": "§32Ⅰ：禁止營業＋處行為人 10 萬～30 萬元罰鍰", "h": false}, {"x": "§32Ⅱ 刑責以「經禁止營業處分後仍繼續營業」為前提，非一犯即罰", "h": true}, {"x": "簽章條號為 §22Ⅰ（六類），不是 §26（§26 為賠償責任與代為賠償）", "h": true}, {"x": "代銷不適用 §22Ⅰ①②（委託契約書、要約書），其餘四類仍須經紀人簽章", "h": false}], "mn": "居間不看錢、經營看反覆；先禁止再罰錢，不停才坐牢；簽章六類在 §22，代銷少前兩款"}, {"id": "es-mk3", "no": "模三", "t": "模擬試題｜雙方代理未得書面同意、超收服務報酬與收取差價", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "經紀業管理條例", "q": "甲經紀業受賣方乙委託銷售房屋，委託銷售價格為 1,200 萬元。甲所屬經紀人丙另接受買方丁之委託，未取得雙方當事人書面同意，即同時代理；嗣以 1,260 萬元成交，丙向乙僅交付 1,200 萬元，其餘 60 萬元自行留存。試依不動產經紀業管理條例說明：（一）丙之行為違反哪些規定？（二）甲、丙各應受何種處理？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>差價，指實際買賣交易價格與委託銷售價格之差額；雙方代理，指經紀業同時接受買賣雙方當事人之委託。經紀業或經紀人員不得收取差價或其他報酬。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第19條</span><span class=\"lawn\">（差價加倍返還）</span></span><span class=\"evli\"><span class=\"art\">第24條之2</span><span class=\"lawn\">（雙方代理）</span></span><span class=\"evli\"><span class=\"art\">第26條</span><span class=\"lawn\">（連帶賠償）</span></span><span class=\"evli\"><span class=\"art\">第29條</span><span class=\"lawn\">（經紀業罰鍰）</span></span><span class=\"evli\"><span class=\"art\">第31條</span><span class=\"lawn\">（經紀人員懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙違反之規定</p><p>①依<span class=\"art\">第24條之2</span>，經營仲介業務者經雙方當事人之書面同意，始得同時接受雙方委託。</p><p class=\"evx\"><span class=\"evt\">例</span><span>丙未取得乙、丁書面同意即同時代理，違反<span class=\"art\">第24條之2</span>。②依<span class=\"art\">第19條</span>，經紀業或經紀人員不得收取差價。例：成交價1,260萬元與委託價1,200萬元之差額60萬元由丙留存，屬收取差價。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第24條之2</span>以雙方書面同意為前提；<span class=\"art\">第19條第1項</span>規定經紀業或經紀人員不得收取差價。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲、丙之處理</p><p>①依<span class=\"art\">第19條</span>，已收取之差價應加計利息後加倍返還支付人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>60萬元應加計利息加倍返還。<span class=\"evli\">②甲：違反<span class=\"art\">第19條第1項</span>，依<span class=\"art\">第29條第1項第1款</span>處6萬元以上30萬元以下罰鍰；違反<span class=\"art\">第24條之2</span>，依同項第3款處3萬元以上15萬元以下罰鍰；依<span class=\"art\">第26條第2項</span>，甲與丙負連帶賠償責任；受害人取得執行名義、經仲裁成立或基金管理委員會之決議支付後，並得於甲繳存營業保證金及提供擔保總額內，請求全國聯合會代為賠償（<span class=\"art\">第26條第4項</span>）。</span><span class=\"evli\">③丙：依<span class=\"art\">第31條第1項第2款</span>，應予6個月以上3年以下停止執行業務；累計達5年以上者，廢止其證書；<span class=\"art\">第31條</span>懲戒事由不包括違反<span class=\"art\">第24條之2</span>，雙方代理部分由甲受罰。</span></span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>經紀業因經紀人員執行業務之故意或過失致當事人受損害，應與該人員負連帶賠償責任。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>丙違反<span class=\"art\">第24條之2</span>及<span class=\"art\">第19條</span>；差價須加計利息加倍返還。甲處罰鍰並與丙負連帶賠償責任；丙受6個月以上3年以下停止執行業務。</p>"], "ck": [{"x": "§24-2：經買賣雙方書面同意，才得同時接受雙方委託", "h": false}, {"x": "丙未經雙方書面同意即雙方代理＝獨立違規，不能只寫收差價", "h": true}, {"x": "1,260 萬－1,200 萬＝60 萬元自留＝收取差價，違反 §19Ⅰ", "h": false}, {"x": "§19：已收取之差價加計利息後加倍返還支付人", "h": false}, {"x": "§29Ⅰ①：違反 §19Ⅰ 罰 6 萬–30 萬元；§29Ⅰ③：違反 §24-2 罰 3 萬–15 萬元（級距不可背錯）", "h": true}, {"x": "經紀業甲也要處理：罰鍰＋依 §26 與丙負連帶賠償責任", "h": true}, {"x": "§31Ⅰ②：經紀人員違反 §19Ⅰ 予 6 個月以上 3 年以下停止執行業務；累計達 5 年以上廢止證書", "h": false}], "mn": "一案兩違規：沒同意（§24-2）＋吃差價（§19）；錢加倍吐，業罰鍰兼連帶，人停業"}, {"id": "es-mk7", "no": "模七", "t": "模擬試題｜不動產說明書簽章解說流程", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "經紀業管理條例", "q": "甲不動產經紀業受屋主乙委託銷售房屋。說明書由甲所僱用之經紀營業員丙製作，未經甲指派之經紀人簽章；丙亦未先請乙在說明書上簽章，即持該說明書向買方丁解說。丁買受後，發現說明書漏未記載之重大瑕疵而受有損害。試依不動產經紀業管理條例說明：（一）不動產說明書應由那些人簽章？其先後順序為何？（二）解說義務人與解說對象各為何？（三）簽訂買賣契約書時，說明書應如何處置？有何法律效果？（四）丁得向何人請求損害賠償？甲、丙各應受何種處罰？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產說明書，係經紀業向交易相對人揭露標的物現況、權利狀態及交易條件之法定文件，經紀人員應依<span class=\"art\">第23條第1項</span>以之向與委託人交易之相對人解說；其應記載及不得記載事項，由中央主管機關依<span class=\"art\">第22條第3項</span>公告。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第22條第1項第5款</span><span class=\"lawn\">（經紀人簽章）</span></span><span class=\"evli\"><span class=\"art\">第23條</span><span class=\"lawn\">（不動產說明書之解說義務）</span></span><span class=\"evli\"><span class=\"art\">第24條</span><span class=\"lawn\">（說明書之交付與簽章）</span></span><span class=\"evli\"><span class=\"art\">第26條第2項</span>、第4項<span class=\"lawn\">（連帶賠償）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業罰鍰）</span></span><span class=\"evli\"><span class=\"art\">第31條第1項第1款</span>、第2項<span class=\"lawn\">（經紀人員之懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）簽章人與順序</p><p>依<span class=\"art\">第22條第1項第5款</span>、<span class=\"art\">第23條第2項</span>、<span class=\"art\">第24條第1項</span>，依序為<span class=\"evli\">①經紀人（製作完成時）</span><span class=\"evli\">②委託人（解說前）</span><span class=\"evli\">③相對人（簽約時）。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>丙為營業員，說明書未經經紀人簽章，違反<span class=\"art\">第22條第1項</span>；未請乙簽章即解說，違反<span class=\"art\">第23條第2項</span>。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>營業員不得代替經紀人簽章。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）解說義務人與對象</p><p>依<span class=\"art\">第23條第1項</span>，「經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說」；經紀人員依<span class=\"art\">第4條第7款</span>包含經紀人與經紀營業員。</p><p class=\"evx\"><span class=\"evt\">例</span><span>丙本身即負解說義務，對象為買方丁，不是乙。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>解說主體與<span class=\"art\">第22條</span>之簽章主體不同，不可互換。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）締約時之處置與效果</p><p>依<span class=\"art\">第24條</span>，經紀人應將說明書交付丁並由丁簽章；說明書「視為租賃或買賣契約書之一部分」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>說明書已記載之內容與事實不符，即屬契約內容之違反；漏載之重大瑕疵則依<span class=\"art\">第26條第2項</span>請求賠償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>丁得本於契約關係主張權利，不以另有約定為必要。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）賠償與處罰</p><p>依<span class=\"art\">第26條第2項</span>，經紀業因經紀人員執行業務之故意或過失致交易當事人受損害者，與經紀人員負連帶賠償責任；依同條第4項，取得執行名義等後，得於保證金及擔保總額內請求全國聯合會代為賠償。甲依<span class=\"art\">第29條第1項第1款</span>處6萬元以上30萬元以下罰鍰；丙依<span class=\"art\">第31條第1項第1款</span>予以申誡，累計3次另予6個月以上3年以下停止執行業務。</p><p class=\"evx\"><span class=\"evt\">例</span><span>丁得向甲、丙請求連帶賠償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>損害係因丙執行業務之過失所致。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>簽章順序為經紀人→委託人→相對人；解說義務人為經紀人員，對象為相對人；說明書視為契約書之一部分。丁得向甲、丙請求連帶賠償並請求全國聯合會代為賠償；甲處罰鍰，丙予申誡。</p>"], "ck": [{"x": "§22Ⅰ⑤：說明書應由經紀業指派經紀人簽章，營業員不得代簽", "h": false}, {"x": "委託人簽章時點是「提供解說前」（§23Ⅱ），不是簽約時", "h": true}, {"x": "順序：經紀人（製作完成）→ 委託人（解說前）→ 相對人（締約時，§24Ⅰ）", "h": false}, {"x": "§23Ⅰ：解說義務人是經紀人員（含營業員），不限經紀人；對象是交易相對人丁", "h": true}, {"x": "§24Ⅰ Ⅱ：締約時交付相對人並由其簽章，說明書視為契約書之一部分", "h": false}, {"x": "§26Ⅱ：經紀業與經紀人員負連帶賠償責任", "h": false}, {"x": "§26Ⅳ：取得執行名義等後，得於保證金及擔保總額內請求全國聯合會代為賠償", "h": true}, {"x": "§29Ⅰ①：甲違反 §22Ⅰ 處 6 萬元以上 30 萬元以下罰鍰（不是 3–15 萬）", "h": false}, {"x": "丙依 §31Ⅰ① 予以申誡，人員不是罰鍰", "h": false}], "mn": "人→委→相（製作、解說前、締約時）；賠找甲丙連帶，再找全聯會代賠；業罰錢、人申誡"}, {"id": "es-mk8", "no": "模八", "t": "模擬試題｜公平交易法廣告查核分工原則（加盟店代銷）", "lv": "本站模擬卷", "k": "mock", "tier": 3, "g": "經紀業管理條例", "q": "甲建設公司興建預售屋，委託乙不動產經紀業代銷。乙為某品牌之加盟店，於網路及傳單廣告中：（一）宣稱基地「步行3分鐘可達捷運站」，經實測須15分鐘；（二）未於廣告標明加盟店字樣。試問：（一）何謂不動產經紀業廣告？（二）不動產廣告不實案件之查核權責分工原則為何？（三）本題（一）（二）兩種情形，應分別由何機關依何種法律處理？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依不動產經紀業廣告處理原則第二點，廣告指經紀業利用傳單、網際網路或其他方法，「使不特定多數人知悉其宣傳內容之傳播」，媒介不限。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業廣告處理原則第二點<span class=\"lawn\">（廣告之定義）</span></span><span class=\"evli\">第三點<span class=\"lawn\">（不實廣告查核分工）</span></span><span class=\"evli\">第六點</span><span class=\"evli\">第七點</span><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第18條</span><span class=\"lawn\">（證照及經紀人證書之揭示、加盟標明）</span></span><span class=\"evli\"><span class=\"art\">第21條第2項</span><span class=\"lawn\">（廣告與銷售之規範）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span>、第4款<span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\">公平交易法<span class=\"art\">第21條</span><span class=\"lawn\">（虛偽不實或引人錯誤之表示）</span></span><span class=\"evli\"><span class=\"art\">第29條</span>（除去及防止侵害請求權）</span><span class=\"evli\"><span class=\"art\">第30條</span>（損害賠償責任）</span><span class=\"evli\"><span class=\"art\">第31條</span>（故意行為之加重賠償）</span><span class=\"evli\"><span class=\"art\">第42條</span>（限期停止</span><span class=\"evli\">改正及罰鍰）</span><span class=\"evli\">不動產經紀業管理條例施行細則<span class=\"art\">第22條</span>（加盟經營者之標明）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）廣告之定義</p><p>依廣告處理原則第二點，以任何方法使不特定多數人知悉其宣傳內容即為廣告，已明文列入網際網路、模型、樣品屋。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙之網路與傳單宣傳，均屬經紀業廣告。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>重點在使不特定多數人知悉。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）分工原則</p><p>依廣告處理原則第三點：<span class=\"evli\">①經紀業廣告案件→主管機關依管理條例；</span><span class=\"evli\">②非屬管理條例範疇者（如服務品質、企業形象、行銷策略之虛偽不實）→公平會依公平法；</span><span class=\"evli\">③加盟經營未於廣告標明加盟店字樣→主管機關依管理條例；</span><span class=\"evli\">④建商委託經紀業銷售，俱為廣告主→公平會依公平法；</span><span class=\"evli\">⑤無法劃分→內政部與公平會協調。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>本題未標明加盟屬第<span class=\"evli\">③款；交通時間誇大視廣告主屬第</span><span class=\"evli\">④款或第</span><span class=\"evli\">①款。</span></span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>執業規範回歸地政主管機關，市場競爭秩序由公平會審查。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）本題歸屬</p><p><span class=\"evli\">①交通時間誇大：屬第六、七點之不實廣告認定標準；甲、乙俱為廣告主時屬第</span><span class=\"evli\">④款，由公平會依公平交易法<span class=\"art\">第21條</span>處理（僅乙具名刊登時屬第</span><span class=\"evli\">①款，由主管機關依管理條例<span class=\"art\">第21條第2項</span>、<span class=\"art\">第29條第1項第1款</span>處6萬元以上30萬元以下罰鍰）；受害人得依<span class=\"art\">第29條</span>請求除去侵害、<span class=\"art\">第30條</span>請求損害賠償，故意者法院得依<span class=\"art\">第31條第1項</span>酌定不超過損害額3倍之賠償。</span><span class=\"evli\">②未標明加盟：依管理條例<span class=\"art\">第18條</span>，「其為加盟經營者，應併標明之」，屬第</span><span class=\"evli\">③款，由主管機關依<span class=\"art\">第29條第1項第4款</span>令限期改正，屆期未改正處3萬元以上15萬元以下罰鍰。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>「步行3分鐘可達捷運站」實須15分鐘，屬不實表示。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第29條第1項第4款</span>為先限期改正，非逕行處罰。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）廣告以使不特定多數人知悉為要件。（二）分工依第三點分五種情形。（三）交通時間誇大：俱為廣告主由公平會依公平交易法<span class=\"art\">第21條</span>處理，僅乙具名由主管機關依管理條例處理；未標明加盟由主管機關依管理條例<span class=\"art\">第18條</span>、<span class=\"art\">第29條第1項第4款</span>處理。</p>"], "ck": [{"x": "第二點：廣告＝使不特定多數人知悉其宣傳內容之傳播，媒介不限", "h": true}, {"x": "分工要寫滿第三點五款，不能只寫「廣告不實找公平會」", "h": true}, {"x": "第三點（三）加盟未標明 → 主管機關；（四）建商與經紀業俱為廣告主 → 公平會", "h": false}, {"x": "步行 3 分鐘實測 15 分鐘：甲乙俱為廣告主 → 第（四）款 → 公平會；僅乙具名 → 第（一）款 → 主管機關", "h": false}, {"x": "公平§21：對足以影響交易決定之事項為虛偽不實或引人錯誤之表示", "h": false}, {"x": "公平§31Ⅰ：故意者法院得酌定不超過已證明損害額 3 倍之賠償", "h": false}, {"x": "未標明加盟 → 管理條例 §18，不是公平法", "h": false}, {"x": "§29Ⅰ④：先令限期改正，屆期未改正才處 3 萬元以上 15 萬元以下罰鍰", "h": true}, {"x": "一則廣告兩個管轄：不實內容歸公平會，加盟標示歸主管機關", "h": false}], "mn": "內容不實、共同具名 → 公平會；加盟沒標 → 主管機關先改正再罰"}, {"id": "es-a1", "no": "A1", "t": "經紀人員的分類、資格與證書", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "何謂經紀人員？經紀營業員與經紀人在資格取得、訓練時數與有效期間上有何不同？期滿後各應如何繼續執業？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>經紀人員，指經紀人或經紀營業員。經紀人之職務為執行仲介或代銷業務；經紀營業員之職務為協助經紀人執行仲介或代銷業務。經紀營業員證明與經紀人證書有效期限均為四年，期滿須完成訓練始得重新登錄或換證（<span class=\"art\">第13條第3項</span>、<span class=\"art\">第15條第1項</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第4條第7款</span><span class=\"lawn\">（經紀人員之定義與職務）</span></span><span class=\"evli\"><span class=\"art\">第13條</span><span class=\"lawn\">（經紀營業員之資格與登錄）</span></span><span class=\"evli\"><span class=\"art\">第14條</span><span class=\"lawn\">（經紀人之資格）</span></span><span class=\"evli\"><span class=\"art\">第15條</span><span class=\"lawn\">（經紀人證書之效期與換證）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）經紀人員之意義</p><p>依<span class=\"art\">第4條第7款</span>，經紀人員指經紀人或經紀營業員，經紀人執行仲介或代銷業務，經紀營業員協助經紀人執行。</p><p class=\"evx\"><span class=\"evt\">例</span><span>協助經紀人帶看者屬經紀營業員。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>區分執行與協助之職務。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）資格取得</p><p>依<span class=\"art\">第13條第2項</span>，經中央主管機關或其認可之機構、團體舉辦經紀營業員訓練合格或不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有經紀營業員證明者，得充任經紀營業員。依<span class=\"art\">第14條第1項</span>，經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書（經驗依同條第2項以所得扣繳資料證明認定）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>剛考取經紀人考試、尚無營業員經驗者，尚不得請領經紀人證書。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>經紀人須兼具考試能力與實務經驗。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）訓練時數與有效期間</p><p>依<span class=\"art\">第13條第3項</span>，經紀營業員訓練不得少於三十個小時，證明有效期限為四年；依<span class=\"art\">第15條第1項</span>，經紀人證書有效期限為四年。</p><p class=\"evx\"><span class=\"evt\">例</span><span>兩者效期同為四年。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>定期檢驗執業資格。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）期滿繼續執業</p><p>依<span class=\"art\">第13條第3項</span>，經紀營業員期滿時應檢附完成訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄；依<span class=\"art\">第15條第1項</span>，經紀人期滿時應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練三十個小時以上之證明文件，向直轄市或縣（市）政府辦理換證。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀人證書期滿只有二十小時訓練者，不足換證。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>持續訓練使專業知識隨法規更新。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀人員指經紀人或經紀營業員。營業員以訓練合格（不少於三十小時）或考試及格並登錄取得資格，效期四年，期滿檢附二十小時以上訓練證明重新登錄；經紀人須考試及格並具一年以上營業員經驗始得領證，效期四年，期滿檢附四年內三十小時以上專業訓練證明換證。營業員是登錄制，經紀人是證書制。</p>"], "ck": [{"x": "§4⑦：經紀人員包含經紀人（執行業務）與經紀營業員（協助執行）", "h": false}, {"x": "§13Ⅱ、Ⅲ：營業員訓練不得少於 30 小時，登錄領證，證明有效期限 4 年", "h": false}, {"x": "§14Ⅰ：經紀人考試及格後，須具備 1 年以上營業員經驗始得請領證書", "h": false}, {"x": "兩者效期同為 4 年，寫成 3 年或 5 年即失分", "h": true}, {"x": "§13Ⅲ：營業員期滿檢附 20 小時以上訓練證明，向中央主管機關指定之機構、團體重新登錄", "h": true}, {"x": "§15Ⅰ：經紀人期滿檢附 4 年內 30 小時以上專業訓練證明，向直轄市或縣（市）政府換證", "h": true}, {"x": "營業員＝登錄＋訓練；經紀人＝考試＋經驗＋證書。續辦時數 20（登錄）／30（換證）不可互換", "h": false}], "mn": "人 30、員 20：經紀人換證 30 小時，營業員重新登錄 20 小時"}, {"id": "es-a2", "no": "A2", "t": "營業保證金的繳存、補足與法律效果", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "經紀業開業須繳存營業保證金，請說明繳存時點、保管方式，以及保證金不足時的處理與法律效果。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>營業保證金是經紀業為擔保因業務所生賠償責任，依規定繳存、由同業公會全國聯合會統一保管之款項，具有獨立性。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第7條第3項</span><span class=\"lawn\">（營業保證金之繳存）</span></span><span class=\"evli\"><span class=\"art\">第8條第1項</span>、第4項<span class=\"lawn\">（營業保證金之保管與補足）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第7款</span><span class=\"lawn\">（未補足之法律效果）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）繳存時點</p><p>依<span class=\"art\">第7條第3項</span>，經紀業於辦妥公司登記或商業登記後，應依中央主管機關規定繳存營業保證金；應繳存之營業保證金超過一定金額者，得就超過部分以金融機構提供保證函擔保之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>公司設立登記完成後，即須繳存保證金。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第7條第3項</span>以辦妥登記為繳存時點。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）保管方式</p><p>依<span class=\"art\">第8條第1項</span>，由全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存，並組成管理委員會負責保管。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第26條第4項</span>，受害人得於保證金及擔保總額內請求全國聯合會代為賠償。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不足時之處理</p><p>依<span class=\"art\">第8條第4項</span>，經紀業繳存之營業保證金低於規定額度時，全國聯合會應通知經紀業者於一個月內補足。</p><p class=\"evx\"><span class=\"evt\">例</span><span>因代為賠償使保證金減少，經紀業須於1個月內補回。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）未補足之效果</p><p>依<span class=\"art\">第29條第1項第7款</span>，直轄市、縣（市）主管機關應予停止營業處分，其期間至補足營業保證金為止；但停止營業期間達一年者，應廢止其許可。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>無足額保證金即不得繼續營業。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀業辦妥登記後繳存營業保證金，由全國聯合會設專戶保管；不足額時應於1個月內補足，未補足者停止營業至補足為止，停業達1年者廢止許可。用語是「廢止」，不是「撤銷」。</p>"], "ck": [{"x": "§7Ⅲ：辦妥公司登記或商業登記後繳存；超過一定金額得以金融機構保證函擔保", "h": false}, {"x": "§8Ⅰ：全國聯合會於指定金融機構設營業保證基金專戶，組成管理委員會保管，孳息用於健全經紀制度", "h": false}, {"x": "§8Ⅳ：低於額度者，全國聯合會通知於「一個月內」補足", "h": true}, {"x": "§29Ⅰ⑦：應予停止營業處分，期間至補足為止；達一年者應廢止許可", "h": true}, {"x": "停止營業不是固定期間，是「至補足營業保證金為止」", "h": true}, {"x": "用詞寫「廢止其許可」，不可寫成「撤銷」", "h": true}, {"x": "此款不開罰鍰，法律效果是停業＋廢止許可", "h": false}], "mn": "登記後繳、聯合會管、不足一月補、不補就停、停滿一年廢", "hp": 18, "hpl": "高"}, {"id": "es-a3", "no": "A3", "t": "經紀人員的專任義務與不得僱用無資格者", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "經紀人甲已受僱於 A 經紀業並登錄於 A 公司，卻同時受僱於 B 經紀業，為 B 公司執行仲介業務；另 A 公司僱用未取得經紀人員資格、亦未經登錄之丙，由丙對外推銷房屋。請問：（一）甲違反何規定？應受何種處分？（二）A 公司違反何規定？應如何處罰？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>專任義務，指經紀人員原則上只能專任於一家經紀業，不得為自己或他經紀業執行仲介或代銷業務；經紀業亦不得僱用不具經紀人員資格者從事仲介或代銷業務。經紀人員違反<span class=\"art\">第16條</span>者，依<span class=\"art\">第31條</span>予以懲戒；經紀業違反<span class=\"art\">第17條</span>者，依<span class=\"art\">第29條</span>處以罰鍰。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第16條</span><span class=\"lawn\">（經紀人員專任義務）</span></span><span class=\"evli\"><span class=\"art\">第17條</span><span class=\"lawn\">（不得僱用未具資格者）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span><span class=\"evli\">第2項，<span class=\"art\">第31條第1項第1款</span>、第2項<span class=\"lawn\">（經紀人員之懲戒）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲違反專任義務</p><p>依<span class=\"art\">第16條</span>，經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務；但經所屬經紀業同意為他經紀業執行業務者，不在此限。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲已受僱並登錄於A公司，又為B公司執行仲介業務，若未經A公司同意，即違反<span class=\"art\">第16條</span>。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第16條</span>但書以「經所屬經紀業同意」作為兼任他經紀業業務之例外要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲應受之處分</p><p>依<span class=\"art\">第31條第1項第1款</span>，經紀人員違反<span class=\"art\">第16條</span>者，應予申誡；依同條第2項，受申誡處分三次者，應另予六個月以上三年以下之停止執行業務處分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲本次受申誡，若累計達三次，即升級為停止執行業務。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>懲戒採階梯化，對象是人員而非業者。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）A公司違反不得僱用規定</p><p>依<span class=\"art\">第17條</span>，經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務。</p><p class=\"evx\"><span class=\"evt\">例</span><span>依<span class=\"art\">第13條第2項</span>，經紀營業員須經訓練合格或考試及格，並登錄及領有不動產經紀營業員證明，始得充任；A公司僱用未取得資格、亦未經登錄之丙對外推銷房屋，即違反<span class=\"art\">第17條</span>。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第1條</span>，本條例以建立不動產交易秩序、保障交易者權益為目的，故仲介業務須由具資格之人員執行。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）A公司之處罰</p><p>依<span class=\"art\">第29條第1項第1款</span>，經紀業違反<span class=\"art\">第17條</span>者，由直轄市、縣（市）主管機關處新臺幣六萬元以上三十萬元以下罰鍰；依同條第2項，並應令其限期改正，屆期未改正者，按次處罰。</p><p class=\"evx\"><span class=\"evt\">例</span><span>A公司受罰鍰後仍續用丙，得按次處罰。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>罰鍰對象為業者，以督促其改正僱用狀態。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲未經A公司同意為B公司執行業務，違反<span class=\"art\">第16條</span>專任義務，依<span class=\"art\">第31條第1項第1款</span>應予申誡，申誡累計三次另予六個月以上三年以下停止執行業務。（二）A公司僱用無資格之丙從事仲介，違反<span class=\"art\">第17條</span>，依<span class=\"art\">第29條第1項第1款</span>處新臺幣六萬元以上三十萬元以下罰鍰，並令限期改正，屆期未改正者按次處罰。人員受懲戒、業者受罰鍰，處分對象不同。</p>"], "ck": [{"x": "§16：經紀人員應專任一經紀業，例外須經「所屬經紀業」同意", "h": false}, {"x": "同意要由原登錄之 A 公司給；漏掉「經所屬經紀業同意」例外是常見失分", "h": true}, {"x": "§31Ⅰ①：違反 §16 應予申誡", "h": false}, {"x": "§31Ⅱ：申誡三次者另予 6 個月以上 3 年以下停止執行業務", "h": false}, {"x": "甲受的是申誡（懲戒），不是罰鍰", "h": true}, {"x": "§17：經紀業不得僱用未具經紀人員資格者從事仲介或代銷業務", "h": false}, {"x": "§29Ⅰ①：違反 §17 處 6 萬元以上 30 萬元以下罰鍰（不是 3–15 萬）", "h": true}, {"x": "處分對象不同：人員走懲戒、業者走罰鍰，兩套不可混寫", "h": false}], "mn": "人員兼業＝申誡（三次升停業）；業者僱無照＝六到三十萬"}, {"id": "es-a4", "no": "A4", "t": "營業處所的經紀人設置", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "經紀業營業處所應置經紀人的規定為何？營業員人數多時如何處理？非常態營業處所有何特別規定？違反者如何處罰？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">第4條第10款</span>，營業處所指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所；依<span class=\"art\">第11條</span>，營業處所應置經紀人，並依營業員人數增設。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第11條第1項</span>、第2項<span class=\"lawn\">（營業處所應置經紀人）</span></span><span class=\"evli\"><span class=\"art\">第29條第1項第1款</span><span class=\"lawn\">（經紀業之罰則）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）一般營業處所</p><p>依<span class=\"art\">第11條第1項</span>本文，經紀業設立之營業處所至少應置經紀人一人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>仲介公司每開一家分店，店內都要有一位經紀人。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>每個據點都要有具國家考試資格者負責。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）營業員人數多時</p><p>依<span class=\"art\">第11條第2項</span>，營業處所經紀營業員數每逾二十名時，應增設經紀人一人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某店有21名營業員，就要有2位經紀人；20名則1位即可。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>「每逾」二十名才增設，要超過才算。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）非常態營業處所</p><p>依<span class=\"art\">第11條第1項</span>但書，非常態營業處所，其所銷售總金額達新臺幣六億元以上，該處所至少應置專業經紀人一人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>預售屋接待中心銷售總金額達6億元，須有專業經紀人駐點。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>大型銷售現場交易金額龐大，須有專業把關。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）違反之處罰</p><p>違反<span class=\"art\">第11條</span>者，依<span class=\"art\">第29條第1項第1款</span>，由直轄市、縣（市）主管機關處新臺幣六萬元以上三十萬元以下罰鍰；依同條第2項並應令其限期改正，屆期未改正者，按次處罰。</p></div>", "<span class=\"blk-l\">四、結論</span><p>每一營業處所至少置經紀人一人，營業員每逾二十名增設一人；非常態營業處所銷售總金額達六億元以上者，至少置專業經紀人一人；違反者處六萬元以上三十萬元以下罰鍰。</p>"], "ck": [{"x": "§11Ⅰ 本文：經紀業設立之營業處所至少應置經紀人 1 人（以每一處所計）", "h": false}, {"x": "§11Ⅱ：營業處所經紀營業員數每逾 20 名時，應增設經紀人 1 人", "h": true}, {"x": "「每逾 20 名」不是「每 20 名」——20 名不必增設，21 名才要", "h": true}, {"x": "§11Ⅰ 但書：非常態營業處所所銷售總金額達 6 億元以上，至少置專業經紀人 1 人", "h": true}, {"x": "門檻是 6 億元（非 6 千萬元），且須為「專業經紀人」", "h": false}, {"x": "§29Ⅰ①：違反 §11 由直轄市、縣（市）主管機關處 6 萬–30 萬元罰鍰", "h": false}, {"x": "罰則要加寫 §29Ⅱ 的限期改正與屆期未改正按次處罰", "h": false}], "mn": "一處一人、逾二十加一、六億配專業、違反六到三十萬", "hp": 19, "hpl": "高"}, {"id": "es-a5", "no": "A5", "t": "不得申請經營經紀業的事由與限制期間", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "下列三人於今日申請經營不動產經紀業，應否准許？請分別說明理由及其法律依據：（一）甲曾因詐欺罪受有期徒刑 1 年 2 月之宣告確定（未受緩刑宣告），刑之執行完畢已滿 2 年；（二）乙前曾經營經紀業，經主管機關廢止其許可已滿 3 年；（三）丙之經紀人員證書經廢止已滿 4 年。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>消極資格是法律明文列舉不得申請經營經紀業之事由，依<span class=\"art\">第6條第1項</span>，有各款情形之一者，不得申請經營經紀業，其經許可者，撤銷或廢止其許可。</p>", "<span class=\"blk-l\">二、法條</span><p>不動產經紀業管理條例<span class=\"art\">第6條第1項第3款</span>、第5款、第7款（不得申請經營經紀業之事由）<span class=\"lawn\">（刑事消極資格）</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲</p><p>依<span class=\"art\">第6條第1項第3款</span>，犯詐欺、背信、侵占罪等，經受有期徒刑一年以上刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿三年者，不得申請；但受緩刑宣告者，不在此限。甲受1年2月有期徒刑宣告確定、未受緩刑，執行完畢僅滿2年，未滿3年，不得准許。</p></div><div class=\"evp\"><p class=\"evh\">（二）乙</p><p>依第5款，曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起未滿五年者，不得申請；但依<span class=\"art\">第7條第1項</span>逾期未開始營業或<span class=\"art\">第30條</span>自行停止業務者，不在此限。乙被廢止許可僅滿3年，如非屬但書情形，不得准許。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙若只是取得許可後逾期未開業被廢止，則不受5年限制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>區分違規被廢止與單純未營業。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙</p><p>依第7款，廢止經紀人員證書或證明處分未滿五年者，不得申請。丙證書經廢止僅滿4年，不得准許。</p></div>", "<span class=\"blk-l\">四、結論</span><p>甲執行完畢未滿3年、乙被廢止許可未滿5年（非但書情形）、丙證書廢止未滿5年，三人均不得准許。三個年限分別為3年、5年、5年。</p>"], "ck": [{"x": "§6Ⅰ③：詐欺、背信、侵占等罪受「一年以上」有期徒刑宣告確定，執行完畢或赦免後未滿 3 年；受緩刑宣告者除外", "h": true}, {"x": "甲執行完畢僅滿 2 年，未滿 3 年 → 不應准許", "h": false}, {"x": "§6Ⅰ⑤：經撤銷或廢止許可，自撤銷或廢止之日起未滿 5 年不得申請", "h": true}, {"x": "§6Ⅰ⑤但書：§7Ⅰ 逾期未開始營業、§30 自行停止業務者不受 5 年限制", "h": false}, {"x": "「撤銷」與「廢止」要照條文並列書寫，不可互相代用", "h": true}, {"x": "§6Ⅰ⑦：廢止經紀人員證書或證明處分未滿 5 年，或 §31 停業處分尚未執行完畢者不得申請", "h": true}, {"x": "三人年限分別為 3 年、5 年、5 年，均尚未屆滿，三人皆不應准許", "h": false}], "mn": "刑與感訓 3，撤廢許可與證書 5", "hp": 20, "hpl": "高"}, {"id": "es-a6", "no": "A6", "t": "經紀人員的懲戒體系：申誡、停止執行業務與廢止證書", "lv": "預測", "k": "pred", "tier": 3, "g": "經紀業管理條例", "q": "說明經紀人員受懲戒的種類與升級規則，以及懲戒案件的處理機關。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>懲戒，是對違反本條例業務規範之經紀人員所為之處分，依情節輕重分為申誡、停止執行業務、廢止證書或證明三級。依<span class=\"art\">第31條第2項</span>，申誡三次另予停止執行業務，停止執行業務累計達五年以上者廢止證書或證明。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">不動產經紀業管理條例<span class=\"art\">第31條第1項</span><span class=\"lawn\">（經紀人員之懲戒）</span></span><span class=\"evli\">第2項，<span class=\"art\">第33條第1項</span>至第3項<span class=\"lawn\">（懲戒程序）</span></span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）申誡</p><p>依<span class=\"art\">第31條第1項第1款</span>，經紀人員違反<span class=\"art\">第16條</span>（專任）、<span class=\"art\">第22條第1項</span>（簽章）、<span class=\"art\">第23條</span>（解說）或<span class=\"art\">第25條</span>（保密）規定者，應予申誡。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀人員無故洩漏委託人之秘密，應予申誡。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第31條第1項第1款</span>就此四條違反明定應予申誡。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）停止執行業務</p><p>依<span class=\"art\">第31條第1項第2款</span>，違反<span class=\"art\">第19條第1項</span>（收差價）規定者，應予六個月以上三年以下之停止執行業務處分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀人員收取差價，直接停止執行業務，不經申誡。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第31條第1項第2款</span>就違反<span class=\"art\">第19條第1項</span>明定停止執行業務。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）升級規則</p><p>依<span class=\"art\">第31條第2項</span>，經紀人員受申誡處分三次者，應另予六個月以上三年以下之停止執行業務處分；受停止執行業務處分累計達五年以上者，廢止其經紀人員證書或證明。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某經紀人員三度違反專任義務受申誡，即另受停止執行業務；其停止執行業務累計達五年，即廢止證書。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>屢犯者應逐級加重，以收嚇阻之效。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）處理機關與程序</p><p>依<span class=\"art\">第33條第1項</span>，經紀人員有<span class=\"art\">第31條第1項</span>各款情事之一時，利害關係人、各級主管機關或其同業公會得列舉事實，提出證據，報請直轄市或縣（市）主管機關交付懲戒；依同條第2項，直轄市或縣（市）主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之；同條第3項，其組織由中央主管機關定之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>委託人得列舉事實、提出證據，報請縣市主管機關交付懲戒。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>獎懲委員會受理懲戒事項，應通知被移送之經紀人員於二十日內提出答辯或到場陳述（<span class=\"art\">第34條</span>）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>懲戒種類為申誡、停止執行業務（六個月以上三年以下）、廢止證書或證明三級。違反<span class=\"art\">第16條</span>、<span class=\"art\">第22條第1項</span>、<span class=\"art\">第23條</span>、<span class=\"art\">第25條</span>者申誡；違反<span class=\"art\">第19條第1項</span>收差價者直接停止執行業務。升級規則：申誡三次另予停止執行業務，停止執行業務累計達五年以上者廢止證書或證明。懲戒案件由利害關係人、各級主管機關或同業公會報請直轄市或縣（市）主管機關交付懲戒，由其設置之獎懲委員會處理；廢止證書之對象是經紀人員，不是經紀業。</p>"], "ck": [{"x": "§31Ⅰ①：違反 §16、§22Ⅰ、§23、§25 → 應予申誡", "h": false}, {"x": "§31Ⅰ②：違反 §19Ⅰ → 應予 6 個月以上 3 年以下停止執行業務", "h": false}, {"x": "懲戒三級＝申誡、停止執行業務、廢止證書；收差價直接跳停執，不先申誡", "h": false}, {"x": "§31Ⅱ：申誡三次→另予停執；停執累計達 5 年
