甲未經主管機關許可經營不動產經紀業，亦未具不動產經紀人員資格。甲受友人乙之託，將乙所有之數間套房刊登於 591 租屋網站，並於廣告中留下自己的聯絡方式。嗣有承租人詢問時，甲除安排看屋外，並負責介紹房屋設備、周邊環境、交通狀況及聯繫租賃條件，且類似租屋廣告已有多筆紀錄。經主管機關查獲後，甲主張其僅係協助友人出租房屋，並未成立公司或商號，亦未向出租人或承租人收取仲介費或服務報酬，不應認定為經營仲介業務。試依不動產經紀業管理條例規定，說明甲之行為是否違反該條例？主管機關得如何處罰？另外，請說明哪些文件應由經紀業指派經紀人簽章？", "parts": [["一、定義", "經紀業管理條例所稱『仲介業務』，指從事不動產買賣、互易、租賃之居間或代理業務；『經紀業』指依本條例經營仲介或代銷業務之公司或商號。經營經紀業須經主管機關許可、辦理登記並加入公會後始得營業。成立仲介業務不以『收取報酬』為要件，亦不以『設立公司或商號』為前提；判斷重點在是否有居間或代理的行為與反覆性。"], ["二、法條", "① 條例第4條：定義（仲介業務＝居間或代理）。② 條例第5條：經營經紀業須經許可。③ 未經許可經營經紀業務之罰則：由主管機關禁止其營業，並處行為人 10 萬元以上 30 萬元以下罰鍰；經勸導仍繼續營業者，得按次處罰；情節重大者另有刑責（1年以下有期徒刑、拘役或科或併科罰金）。④ 條例第26條：應由經紀人簽章之文件。"], ["三、涵攝", "甲於租屋網刊登多筆廣告、留下聯絡方式，並實際安排看屋、介紹屋況與周邊環境、聯繫租賃條件，已屬居間（報告訂約機會、媒介）或代理行為；且『類似廣告已有多筆紀錄』顯示具反覆、繼續性，非偶發之協助親友。甲主張『未收取報酬』『未成立公司』均不影響認定——仲介業務之成立不以收取報酬為要件，且未經許可而為經紀業務，正是本條所欲禁止者。甲亦非經紀人員，不得執行仲介業務。故甲之行為違反條例關於未經許可不得經營經紀業之規定。"], ["四、結論", "甲違反條例；主管機關應禁止其營業，並處甲 10 萬元以上 30 萬元以下罰鍰；若繼續營業或情節重大，另有刑事責任。　應由經紀業指派經紀人簽章之文件：①不動產委託契約書（含租賃／買賣）；②要約書（代銷不適用）；③定金收據；④不動產廣告稿；⑤不動產說明書；⑥不動產買賣／租賃契約書。※ 委託契約書及要約書於『代銷』不適用。"]], "warn": "罰則區間與刑責措辭，建議對照現行條例第29條／第32條等原文再背；簽章文件請以你教材的條號與順序為準。"}, {"t": "申論題二（25分）", "q": "甲向乙建商購買預售屋，簽約後發現部分契約條款疑似違反中央主管機關公告之定型化契約規範。試問：依消費者保護法規定，定型化契約應記載或不得記載事項，其內容得包括哪些？如契約違反中央主管機關公告之不得記載事項，其效力如何？又條款如何認定顯失公平？試說明之。", "parts": [["一、定義", "定型化契約條款：企業經營者為與不特定多數消費者訂立同類契約之用，單方預先擬定之契約條款。中央主管機關得選擇特定行業，公告其定型化契約應記載或不得記載之事項（消保法第17條），以事前規範控管。"], ["二、法條", "① 消保法第17條Ⅰ～Ⅲ：應記載事項包括契約重要權利義務事項、違反契約之法律效果、預付型交易之履約擔保、契約之解除權／終止權及其法律效果、其他與契約履行有關事項。不得記載事項包括：企業經營者保留契約內容或期限之變更權或解釋權、限制或免除企業經營者之義務或責任、限制或剝奪消費者行使權利或加重其義務或責任、其他對消費者顯失公平事項。② 第17條Ⅳ：違反不得記載事項者，該條款無效。③ 第17條Ⅴ：未記載應記載事項者，仍構成契約內容。④ 第12條：違反誠信原則對消費者顯失公平者無效。"], ["三、涵攝", "本案甲、乙間為預售屋買賣，主管機關已公告預售屋買賣定型化契約應記載及不得記載事項。乙建商若在契約中記載了不得記載事項（例如保留解釋權、免除己方責任），該條款依第17條Ⅳ為『無效』，不待甲主張。若契約漏載應記載事項，依第17條Ⅴ，該事項仍構成契約內容，對乙有拘束力。至於是否『顯失公平』，依第12條，須違反誠信原則且對消費者顯失公平；法律推定顯失公平的情形有三：① 違反平等互惠原則者；② 條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者；③ 契約之主要權利義務，因條款之限制，致契約之目的難以達成者。"], ["四、結論", "定型化契約應記載／不得記載事項涵蓋如上列；違反不得記載事項之條款『無效』；漏記應記載事項者『仍構成契約內容』；條款顯失公平者依第12條『無效』，並依三款推定情形判斷。甲得主張相關條款無效，並依契約本來適用之法令主張權利。"]], "warn": "違反公告之行政
