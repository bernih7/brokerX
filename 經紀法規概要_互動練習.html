const CHAPTER_TITLES = {"A1": "A1 總則：名詞定義與主管機關", "A2": "A2 經紀業設立、保證金與營業處所", "A3": "A3 經紀人員：資格、證書與義務", "A4": "A4 業務及責任（核心高頻）", "A5": "A5 獎懲：行政罰與刑罰", "C1": "C1 說明書：土地應記載事項", "C2": "C2 說明書：成屋應記載事項", "C3": "C3 說明書：預售屋應記載事項", "C4": "C4 說明書：不得記載事項", "D2": "D2 預售屋買賣定型化契約", "D3": "D3 委託銷售定型化契約", "E1": "E1 公寓大廈：總則與定義", "E2": "E2 公寓大廈：住戶權利義務", "E3": "E3 公寓大廈：管理組織與決議", "E4": "E4 公寓大廈：規約", "E5": "E5 公寓大廈：罰則", "F2": "F2 規約範本之法律性質", "G1": "G1 公平交易法重要條文", "G2": "G2 廣告查核分工原則", "H1": "H1 定型化契約規範", "H2": "H2 特種交易", "H3": "H3 損害賠償與罰則"};

let selectedChapters = new Set(Object.keys(CHAPTER_TITLES));
let mode = 'sequential';
let pool = [];
let current = 0;
let userAnswers = {};
let errorTags = {};
let masteryData = {};

async function loadMastery() {
  try {
    const r = await window.storage.get('jingji_mastery');
    if (r && r.value) masteryData = JSON.parse(r.value);
  } catch(e) { masteryData = {}; }
  try {
    const r2 = await window.storage.get('jingji_error_tags');
    if (r2 && r2.value) errorTags = JSON.parse(r2.value);
  } catch(e) { errorTags = {}; }
  renderSetup();
}

async function saveMastery() {
  try { await window.storage.set('jingji_mastery', JSON.stringify(masteryData)); } catch(e) {}
}
async function saveErrorTags() {
  try { await window.storage.set('jingji_error_tags', JSON.stringify(errorTags)); } catch(e) {}
}

function chapterCounts() {
  const counts = {};
  ALL_QUESTIONS.forEach(q => { counts[q.chapter] = (counts[q.chapter]||0) + 1; });
  return counts;
}

function renderSetup() {
  const counts = chapterCounts();
  const total = ALL_QUESTIONS.length;
  let attempted = 0, correct = 0;
  Object.values(masteryData).forEach(m => { attempted += m.attempts||0; correct += m.correct||0; });
  document.getElementById('overallStats').innerHTML = `
    <div class="stat-chip">總題數 <b>${total}</b></div>
    <div class="stat-chip">已作答 <b>${Object.keys(masteryData).length}</b></div>
    <div class="stat-chip">累計正確率 <b>${attempted ? Math.round(correct/attempted*100) : 0}%</b></div>
    <div class="stat-chip">錯題本 <b>${Object.keys(errorTags).length}</b></div>
  `;

  const chipDiv = document.getElementById('chapterChips');
  chipDiv.innerHTML = '';
  Object.keys(CHAPTER_TITLES).forEach(code => {
    const chip = document.createElement('div');
    chip.className = 'chap-chip' + (selectedChapters.has(code) ? ' active' : '');
    chip.dataset.code = code;
    chip.innerHTML = `${CHAPTER_TITLES[code]} <span class="cnt">(${counts[code]||0})</span>`;
    chip.onclick = () => {
      if (selectedChapters.has(code)) selectedChapters.delete(code);
      else selectedChapters.add(code);
      renderSetup();
    };
    chipDiv.appendChild(chip);
  });
}

document.getElementById('selectAllBtn').onclick = () => {
  selectedChapters = new Set(Object.keys(CHAPTER_TITLES));
  renderSetup();
};
document.getElementById('selectNoneBtn').onclick = () => {
  selectedChapters = new Set();
  renderSetup();
};
document.getElementById('selectWrongOnlyBtn').onclick = () => {
  const wrongIds = new Set(Object.keys(errorTags).map(Number));
  pool = ALL_QUESTIONS.filter(q => wrongIds.has(q.id));
  if (pool.length === 0) { alert('目前錯題本是空的，先去練習累積錯題吧！'); return; }
  startQuiz(pool);
};

document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    mode = chip.dataset.mode;
  };
});

document.getElementById('startBtn').onclick = () => {
  let filtered = ALL_QUESTIONS.filter(q => selectedChapters.has(q.chapter));
  if (filtered.length === 0) { alert('請至少選擇一個章節'); return; }
  if (mode === 'random') {
    filtered = [...filtered].sort(() => Math.random() - 0.5);
  }
  startQuiz(filtered);
};

function startQuiz(questionList) {
  pool = questionList;
  current = 0;
  userAnswers = {};
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = pool[current];
  document.getElementById('progressFill').style.width = `${((current)/pool.length)*100}%`;
  document.getElementById('qPosition').textContent = `第 ${current+1} / ${pool.length} 題`;
  document.getElementById('qChapterLabel').textContent = `${q.year}年第${q.qnum}題・${CHAPTER_TITLES[q.chapter]||q.chapter}`;
  document.getElementById('qStem').textContent = q.stem;

  const optsDiv = document.getElementById('optsContainer');
  optsDiv.innerHTML = '';
  const labels = ['A','B','C','D'];
  const prevAnswer = userAnswers[q.id];

  q.options.forEach((opt, idx) => {
    const label = labels[idx];
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="label">${label}.</span><span>${opt}</span>`;
    if (prevAnswer) {
      div.classList.add('disabled');
      if (q.special) {
        if (label === prevAnswer) div.classList.add('selected');
      } else {
        if (label === q.answer) div.classList.add('correct');
        else if (label === prevAnswer) div.classList.add('wrong');
      }
    } else {
      div.onclick = () => selectAnswer(q, label);
    }
    optsDiv.appendChild(div);
  });

  const fb = document.getElementById('feedback');
  const tagRow = document.getElementById('errorTagRow');
  fb.className = 'feedback';
  tagRow.className = 'error-tag-row';

  if (prevAnswer) {
    if (q.special) {
      fb.textContent = `本題官方公告為特殊給分題：${q.special}`;
      fb.classList.add('show-special');
    } else if (prevAnswer === q.answer) {
      fb.textContent = '✓ 答對了！';
      fb.classList.add('show-correct');
    } else {
      fb.textContent = `✗ 答錯了，正確答案是 ${q.answer}`;
      fb.classList.add('show-wrong');
      tagRow.classList.add('show');
      updateTagButtons(q.id);
    }
  }

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === pool.length - 1 ? '完成練習' : '下一題';
}

function updateTagButtons(qid) {
  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.classList.toggle('tagged', errorTags[qid] === btn.dataset.tag);
  });
}

async function selectAnswer(q, label) {
  userAnswers[q.id] = label;
  if (!masteryData[q.id]) masteryData[q.id] = {attempts:0, correct:0};
  masteryData[q.id].attempts++;
  const isCorrect = q.special ? true : (label === q.answer);
  if (isCorrect) {
    masteryData[q.id].correct++;
    delete errorTags[q.id];
  }
  await saveMastery();
  await saveErrorTags();
  renderQuestion();
}

document.getElementById('errorTagRow').addEventListener('click', async (e) => {
  const btn = e.target.closest('.tag-btn');
  if (!btn) return;
  const q = pool[current];
  errorTags[q.id] = btn.dataset.tag;
  await saveErrorTags();
  updateTagButtons(q.id);
});

document.getElementById('prevBtn').onclick = () => {
  if (current > 0) { current--; renderQuestion(); }
};
document.getElementById('nextBtn').onclick = () => {
  if (current < pool.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  let correctCount = 0;
  pool.forEach(q => {
    const a = userAnswers[q.id];
    if (a && (q.special || a === q.answer)) correctCount++;
  });
  const pct = Math.round(correctCount/pool.length*100);
  document.getElementById('bigScore').textContent = `${correctCount} / ${pool.length}`;
  document.getElementById('scoreDetail').textContent = `本次正確率 ${pct}%`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  pool.forEach(q => {
    const a = userAnswers[q.id];
    if (a && !q.special && a !== q.answer) {
      const div = document.createElement('div');
      div.className = 'review-item';
      const tag = errorTags[q.id];
      const tagHtml = tag ? `<span class="tag-badge tag-${tag}">${tag}型</span>` : '';
      div.innerHTML = `<div class="rmeta">${q.year}年第${q.qnum}題・${CHAPTER_TITLES[q.chapter]||q.chapter}${tagHtml}</div>
        <div>${q.stem}</div>
        <div style="margin-top:4px;color:#A8402B;">你的答案：${a}　正確答案：${q.answer}</div>`;
      reviewList.appendChild(div);
    }
  });
}

document.getElementById('restartBtn').onclick = () => {
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('setupArea').style.display = 'block';
  document.getElementById('reviewPanel').style.display = 'none';
  renderSetup();
};
document.getElementById('reviewWrongBtn').onclick = () => {
  const panel = document.getElementById('reviewPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
};

loadMastery();
</script>
</body>
</html>
