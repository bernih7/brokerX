, "answer": "A", "special": null}, {"id": 229, "year": 104, "qnum": 29, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，下列何者非公寓大廈起造人之法定義務？", "options": ["按工程造價一定比例提列公共基金", "公寓大廈建築物所有權登記達法定比例後，於三個月內召開管理委員會第一次會議", "依使用執照所記載用途及建物測繪後，辦理建物所有權第一次登記", "將公寓大廈共用設施設備、圖說、手冊等資料，會同主管機關檢測，確認其功能正常無誤後，移交給管理委員會"], "answer": "B", "special": null}, {"id": 230, "year": 104, "qnum": 30, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，公寓大廈管理委員會應向下列何者負責，並向其報告會務？", "options": ["直轄市、縣（市）主管機關", "區分所有權人會議", "管理委員會主任委員", "管理負責人"], "answer": "B", "special": null}, {"id": 231, "year": 104, "qnum": 31, "chapter": "H1", "stem": "依消費者保護法之規定，企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所訂立之契約，下列何者屬之？", "options": ["訪問交易", "特種買賣", "定型化契約", "個別磋商契約"], "answer": "A", "special": null}, {"id": 232, "year": 104, "qnum": 32, "chapter": "H3", "stem": "依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質所出具之保證書，應載明下列那一事項？", "options": ["商品價格", "使用方法", "警告標示", "交易日期"], "answer": "D", "special": null}, {"id": 233, "year": 104, "qnum": 33, "chapter": "H1", "stem": "依消費者保護法之規定，下列有關定型化契約條款之敘述，何者錯誤？", "options": ["定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效", "定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效", "定型化契約條款如有疑義時，應本平等互惠之原則解釋", "定型化契約條款未經記載於定型化契約中而依正常情形顯非消費者所得預見者，該條款不構成契約之內容"], "answer": "C", "special": null}, {"id": 234, "year": 104, "qnum": 34, "chapter": "H3", "stem": "依消費者保護法之規定，下列有關消費者保護團體之敘述，何者錯誤？", "options": ["消費者保護團體以社團法人或財團法人為限", "消費者保護團體之任務包含接受消費者申訴，調解消費爭議", "消費者保護團體為商品或服務之調查、檢驗時，得請求政府予以必要之協助", "消費者保護團體對於企業經營者提供之商品，認為有損害消費者健康之虞者，得命其回收"], "answer": "D", "special": null}, {"id": 235, "year": 104, "qnum": 35, "chapter": "G1", "stem": "依公平交易法之規定，事業不得為聯合行為，但經主管機關許可者，不在此限。主管機關之許可應附期限，最長不得超過多久？", "options": ["3年", "4年", "5年", "6年"], "answer": "C", "special": null}, {"id": 236, "year": 104, "qnum": 36, "chapter": "G2", "stem": "依公平交易法之規定，非屬知名公眾人物之廣告薦證者，在明知或可得而知其薦證有引人錯誤之虞時，於受廣告主報酬最高幾倍之範圍內與廣告主負連帶損害賠償責任？", "options": ["5倍", "10倍", "15倍", "20倍"], "answer": "B", "special": null}, {"id": 237, "year": 104, "qnum": 37, "chapter": "G1", "stem": "下列何者屬於公平交易法之「不公平競爭」？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "事業限制其交易相對人就供給之商品轉售價格之行為", "事業在商品或廣告上為虛偽不實或引人錯誤之表示或表徵"], "answer": "D", "special": null}, {"id": 238, "year": 104, "qnum": 38, "chapter": "G1", "stem": "依公平交易法之規定，反托拉斯基金設置目的為何？", "options": ["強化聯合行為查處，促進市場競爭秩序之健全發展", "維護交易秩序與消費者利益，避免獨占事業壟斷市場，促進經濟之安定與繁榮", "保障消費者權益，專供損害賠償之用", "檢舉不公平競爭行為獎金之支出"], "answer": "A", "special": null}, {"id": 239, "year": 104, "qnum": 39, "chapter": "G1", "stem": "依公平交易法之規定，對公平交易委員會依本法所為之處分或決定不服者，應依下列何種方式處理？", "options": ["依法申請調處", "直接適用行政訴訟程序", "依法提起司法訴訟", "申請仲裁"], "answer": "B", "special": null}, {"id": 240, "year": 104, "qnum": 40, "chapter": "C2", "stem": "依內政部公布之「不動產說明書應記載及不得記載事項」之規範，成屋買賣時，其不動產說明書應記載都市計畫地形圖或相關電子地圖圖面標示周邊半徑多少公尺範圍內的重要環境設施（如學校、醫院、變電所、公墓）？", "options": ["200公尺", "300公尺", "400公尺", "500公尺"], "answer": "B", "special": null}, {"id": 241, "year": 105, "qnum": 1, "chapter": "G1", "stem": "關於不動產經紀業為廣告行為之規範，下列敘述何者錯誤？", "options": ["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "委託契約內容與事實不符者，經紀業應依事實修正廣告內容", "經紀業如為加盟店或加盟經營者，得逕以加盟店名稱替代直營店之法定經紀業名稱，以資消費者便於辨識", "廣告對不動產之外在環境、視野或景觀之表示與事實不符者，得認定為不實廣告"], "answer": "C", "special": null}, {"id": 242, "year": 105, "qnum": 2, "chapter": "A5", "stem": "關於不動產經紀業違法行為之行政處罰，下列何種行為之法定最低罰鍰金額為最嚴重？", "options": ["經紀業未將經紀人到職與異動向主管機關報請備查", "於雙方當事人簽訂租賃或買賣契約書時，經紀人未將不動產說明書交付與委託人交易之相對人", "經紀業未於營業處所設置符合法定最低人數之經紀人", "非經紀業（無經營執照）而經營仲介或代銷業務"], "answer": "D", "special": null}, {"id": 243, "year": 105, "qnum": 3, "chapter": "C2", "stem": "依新修正之「不動產說明書應記載及不得記載事項」規定，下列何者並非成屋契約之應記載事項？", "options": ["是否已辦理建物所有權第一次登記", "各期價金之履約保證機制方式，及其受託或提供擔保者", "建物型態與現況格局", "本建物（專有部分）於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形，若有，應敘明"], "answer": "B", "special": null}, {"id": 244, "year": 105, "qnum": 4, "chapter": "A4", "stem": "依不動產經紀業管理條例規定，關於不動產經紀業者之行為規範，下列敘述何者錯誤？", "options": ["經營仲介業務者依民法禁止雙方代理原則，不得同時接受雙方之委託進行不動產買賣", "經營代銷業務者，對於起造人或建築業委託代銷之案件，應於委託代銷契約屆滿或終止30日內，向主管機關申報登錄成交案件實際資訊", "經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "經紀業不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金按中央主管機關規定之報酬標準計收"], "answer": "A", "special": null}, {"id": 245, "year": 105, "qnum": 5, "chapter": "A5", "stem": "關於經紀人員違反不動產經紀業管理條例之情形中，下列何者並非予以申誡處分？", "options": ["委由經紀業仲介不動產買賣時，經紀業未指派經紀人於法定文件上簽章者", "經紀人員對於因業務知悉或持有之他人秘密，無故洩漏者", "經紀人員收取差價或其他報酬", "經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說"], "answer": "C", "special": null}, {"id": 246, "year": 105, "qnum": 6, "chapter": "A4", "stem": "依不動產經紀業管理條例第 19 條規定，經紀業或經紀人員不得收取差價或其他報酬，違反規定者之處理，下列敘述何者正確？", "options": ["其已收取之差價或其他報酬，應返還支付人", "其已收取之差價或其他報酬，應加倍返還支付人", "其已收取之差價或其他報酬，應於加計利息後返還支付人", "其已收取之差價或其他報酬，應於加計利息後加倍返還支付人"], "answer": "D", "special": null}, {"id": 247, "year": 105, "qnum": 7, "chapter": "A2", "stem": "經紀業應負賠償責任時，受害人於取得對經紀業之執行名義、經仲裁成立或營業保證基金管理委員會之決議支付後，得於該經紀業繳存營業保證金及提供擔保總額內，向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會為如何之請求？", "options": ["預為賠償", "代為賠償", "連帶賠償", "不真正連帶賠償"], "answer": "B", "special": null}, {"id": 248, "year": 105, "qnum": 8, "chapter": "C3", "stem": "根據不動產說明書應記載及不得記載事項，關於預售屋的其他重要事項，應敘明最近多少時間內基地周邊半徑多少公尺範圍內有無申請水災淹水救助紀錄？", "options": ["最近3年內基地周邊半徑3百公尺範圍內", "最近3年內基地周邊半徑5百公尺範圍內", "最近5年內基地周邊半徑3百公尺範圍內", "最近5年內基地周邊半徑5百公尺範圍內"], "answer": "C", "special": null}, {"id": 249, "year": 105, "qnum": 9, "chapter": "A5", "stem": "不動產經紀人資格的敘述，下列何者正確？", "options": ["經不動產經紀人考試及格者，應具備1年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "經紀人證書有效期限為3年，期滿時，經紀人應檢附其於3年內在中央主管機關認可之機構、團體完成專業訓練30個小時以上之證明文件，向直轄市或縣（市）政府辦理換證", "經紀人辦理換發證書時，應於證書有效期限屆滿前3個月內，檢附相關文件，向原核發機關申請之", "經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務，違反者，處新臺幣3萬元以上15萬元以下罰鍰"], "answer": "A", "special": null}, {"id": 250, "year": 105, "qnum": 10, "chapter": "A3", "stem": "關於不動產經紀業及經紀人員的敘述，下列何者正確？", "options": ["經營國外不動產仲介業務者，以依法辦理登記之公司或商號為限", "外國人依中華民國法律不得參加不動產經紀人考試或參加營業員訓練", "經紀業取得主管機關許可，依法辦理公司或商業登記，即可開始營業", "經紀業應於經紀人到職之日起15日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同"], "answer": "D", "special": null}, {"id": 251, "year": 105, "qnum": 11, "chapter": "G1", "stem": "不動產經紀業者進行房屋聯賣時，如業者間共同約束實施聯賣之不動產物件開發方擁有一定的專賣期間，致使已尋得交易相對人之其他不動產經紀業者受限於專賣權之規定而無法成交，對此共同約束行為之監督管理機關為：", "options": ["內政部營建署", "法務部檢察司", "經濟部商業司", "公平交易委員會"], "answer": "D", "special": null}, {"id": 252, "year": 105, "qnum": 12, "chapter": "D3", "stem": "某不動產仲介業者甲，為同業競爭之目的，於某社區布告欄張貼散布乙業者有吞沒客戶斡旋金糾紛、浮報買賣物件開價之不實陳述，致乙業者業績慘跌，營業信譽受損，試問乙得向法院請求之權利，不包含下列何者？", "options": ["請求除去不法侵害行為", "請求損害賠償", "有侵害之虞時，得請求防止之", "請求精神慰撫金"], "answer": "D", "special": null}, {"id": 253, "year": 105, "qnum": 13, "chapter": "G1", "stem": "事業違反公平交易法之規定致侵害他人權益者，被害人損害賠償請求權消滅時效的敘述，下列何者正確？", "options": ["自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾5年者亦同", "自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾10年者亦同", "自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾5年者亦同", "自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾10年者亦同"], "answer": "D", "special": null}, {"id": 254, "year": 105, "qnum": 14, "chapter": "G1", "stem": "依公平交易法規定，主管機關為強化聯合行為查處，促進市場競爭秩序之健全發展，得設立何種基金？", "options": ["反托拉斯基金", "管理維護基金", "市場安定基金", "市場重建基金"], "answer": "A", "special": null}, {"id": 255, "year": 105, "qnum": 15, "chapter": "G1", "stem": "事業不得為聯合行為。但因經濟不景氣，致同一行業之事業難以繼續維持或生產過剩，為有計畫適應需求而限制價格之共同行為，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。主管機關為許可時，應附多少時間之期限？", "options": ["不得逾1年", "不得逾2年", "不得逾3年", "不得逾5年"], "answer": "D", "special": null}, {"id": 256, "year": 105, "qnum": 16, "chapter": "G1", "stem": "有關公平交易法對獨占規範之敘述，下列何者錯誤？", "options": ["獨占係指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者", "二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有在相關市場處於無競爭狀態之情形者，視為獨占", "二事業全體於相關市場之占有率若未達二分之一者，不列入獨占事業認定範圍", "獨占之事業，不得對商品價格或服務報酬，為不當之決定"], "answer": "C", "special": null}, {"id": 257, "year": 105, "qnum": 17, "chapter": "G2", "stem": "甲建商為銷售新屋建案，委請廣告代理業者乙為整體廣告行銷，由乙請來知名歌星丙代言房屋銷售。乙基於甲的指示，請求丙於廣告案中大力推薦該建案房屋地點近臺北市，開車只要 15 分鐘，每天可在天然溫泉泡湯，然事實上，甲、乙、丙均明知該建案房屋距離臺北市有相當距離，搭高鐵要 30 分鐘，且無天然溫泉。試問甲、乙、丙針對虛偽不實廣告行為，應負何種責任？", "options": ["甲、乙、丙均各自單獨負損害賠償責任", "甲、乙應各自單獨負損害賠償責任，丙僅廣告薦證而無責任", "甲應負損害賠償責任，乙、丙應與廣告主甲負連帶損害賠償責任", "甲應負損害賠償責任，乙應與廣告主甲負連帶損害賠償責任，丙僅廣告薦證而無責任"], "answer": "C", "special": null}, {"id": 258, "year": 105, "qnum": 18, "chapter": "G1", "stem": "下列何種情形，係屬於公平交易法所稱之結合？", "options": ["無正當理由，對他事業給予差別待遇之行為", "直接或間接控制他事業之業務經營或人事任免", "具競爭關係之同一產銷階段事業，以契約共同決定商品或服務之價格", "以不正當方法，使他事業不為價格之競爭"], "answer": "B", "special": null}, {"id": 259, "year": 105, "qnum": 19, "chapter": "G1", "stem": "公平交易法所規範不動產經紀業者涉及違法聯合行為之態樣，下列何者不屬之？", "options": ["共同決定服務報酬收費標準，或協議限制服務報酬之調整", "協議拒絕其他不動產經紀業者參與聯賣", "共同約束收取斡旋金之票期，致使斡旋金票期趨於一致", "廣告宣稱「連續20年仲介服務第一品牌」，惟無銷售數字或意見調查等客觀數據為基礎，顯有虛偽不實或引人錯誤者"], "answer": "D", "special": null}, {"id": 260, "year": 105, "qnum": 20, "chapter": "A4", "stem": "關於不動產經紀業者之行為，下列何者係法律所允許？", "options": ["於受託房屋之廣告虛增房屋總坪數", "未檢附具公信力之銷售數字、客戶調查等客觀數據，即於廣告上宣稱每年委託成交案量為全國第一", "為招攬客戶，推出委託成交之抽獎活動，頭獎為價值15000元之平板電腦一台（名額3名）", "與另一業者共同協議拒絕競爭對手參與聯賣"], "answer": "C", "special": null}, {"id": 261, "year": 105, "qnum": 21, "chapter": "H1", "stem": "甲向乙建設公司購買預售屋，雙方以書面訂立買賣定型化契約，關於本契約可能產生法律爭議之敘述，下列何者錯誤？", "options": ["若契約條款約定買方需繳回契約書，則該條款無效", "若買賣雙方經個別磋商後約定契約審閱期間為20日，但契約定型化條款仍記載「買方享有5日之契約審閱期間」者，該條款牴觸個別磋商條款之部分為無效", "若賣方乙公司於訂約時，突然口頭告知要求甲應同意：「如買方逾期繳交各期預售屋價金時，即視為違約，已繳交之價金不予退還」，甲未置可否仍簽下書面契約。由於契約訂立不限於書面要式，雖然乙之口頭內容未經記載於定型化契約中，但該口頭告知仍構成契約之條款而有效", "若契約條款約定本案預售屋廣告僅供參考，則該條款無效"], "answer": "C", "special": null}, {"id": 262, "year": 105, "qnum": 22, "chapter": "H3", "stem": "關於消費爭議調解委員會的敘述，下列何者正確？", "options": ["直轄市、縣（市）政府應設消費爭議調解委員會，置委員5至11名", "調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序應公開", "關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人", "當事人對於經參與調解委員過半數同意提出解決事件之方案，得於送達後20日之不變期間內，提出異議"], "answer": "C", "special": null}, {"id": 263, "year": 105, "qnum": 23, "chapter": "H3", "stem": "依消費者保護法規定，企業經營者與消費者分期付款買賣契約的敘述，下列何者正確？", "options": ["分期付款買賣契約，應以書面載明頭期款、各期價款與其他附加費用", "分期付款買賣契約，未載明利率者，其利率按現金交易價格週年利率百分之六計算之", "分期付款買賣契約，未載明相關應付款項者，消費者不負現金交易價格加計法定利息以外價款之給付義務", "分期付款買賣契約，於消費者要求時，企業經營者應以書面載明消費者應付總價款與現金交易價格之差額"], "answer": "A", "special": null}, {"id": 264, "year": 105, "qnum": 24, "chapter": "G1", "stem": "未經消費者要約而對之郵寄或投遞之商品，寄送人未經消費者通知取回，在寄送後逾多少時間未經消費者表示承諾，而仍不取回其商品者，視為拋棄其寄投之商品：", "options": ["逾1個月", "逾2個月", "逾3個月", "逾6個月"], "answer": "A", "special": null}, {"id": 265, "year": 105, "qnum": 25, "chapter": "H1", "stem": "關於定型化契約審閱期的敘述，下列何者正確？", "options": ["定型化契約條款審閱期如有疑義時，應探求企業經營者之真意，不得拘泥於所用之文字", "企業經營者與消費者訂立定型化契約前，應有10日以內之合理期間，供消費者審閱全部條款內容", "企業經營者以定型化契約條款使消費者拋棄審閱權利者，雖非無效，但消費者得撤銷其意思表示", "違反審閱期規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容"], "answer": "D", "special": null}, {"id": 266, "year": 105, "qnum": 26, "chapter": "H3", "stem": "依消費者保護法規定，下列敘述何者正確？", "options": ["企業經營者於商品或服務具有危害消費者生命、身體、健康、財產之可能者，未於明顯處為警告標示及緊急處理危險之方法者應負賠償責任。但企業經營者能證明其無過失者，法院得減輕或免除其賠償責任", "商品或服務因其後有較佳之商品或服務，得被推定不符合當時科技或專業水準可合理期待之安全性", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，視為從事設計、生產、製造商品或提供服務之企業經營者", "企業經營者對消費者或第三人之損害賠償責任，得預先約定限制但不得約定免除"], "answer": "C", "special": null}, {"id": 267, "year": 105, "qnum": 27, "chapter": "H3", "stem": "針對臺灣社會發生食品安全問題（如黑心油），消費者得依消費者保護法第 50 條所定消費者保護團體訴訟（以下簡稱「消保團體訴訟」）尋求救濟。下列敘述何者正確？", "options": ["多數受害之消費者得申請組成消保團體之組織，以便立即以團體自己名義，逕向法院提起消費者團體損害訴訟", "消保團體於受讓20人以上消費者損害賠償請求權，得以自己名義提起訴訟。消費者於言詞辯論終結前，不得終止讓與該損害賠償請求權", "消保團體依法提出消保團體訴訟者，應委任律師代理訴訟", "消保團體就消費者團體損害賠償訴訟，於扣除訴訟、支付予律師之必要費用以及得向消費者請求之報酬後，將訴訟結果所得之賠償交付該讓與請求權之消費者"], "answer": "C", "special": null}, {"id": 268, "year": 105, "qnum": 28, "chapter": "H3", "stem": "企業經營者於下列違反消費者保護法之情形，何者所適用罰則所定之法定罰鍰額度為最高？", "options": ["地方政府針對企業經營者提供之商品或服務，經調查認為確有損害消費者身體健康者，命其為限期回收或其他必要處置，而企業經營者拒不遵從者", "企業經營者未依商品標示法等法令為商品或服務之標示", "企業經營者對消費者保證商品或服務之品質時，未主動出具書面保證書", "企業經營者使用定型化契約時，拒絕、規避或阻撓主管機關之派員查核"], "answer": "A", "special": null}, {"id": 269, "year": 105, "qnum": 29, "chapter": "G1", "stem": "依消費者保護法規定，定型化契約條款於下列何種情形，可認為並非違反平等互惠原則？", "options": ["當事人間之給付與對待給付顯不相當者", "當事人一方之企業經營者，就系爭商品或服務之市場占有率規模超過50%者", "消費者負擔非其所能控制之危險者", "消費者違約時，應負擔顯不相當之賠償責任者"], "answer": "B", "special": null}, {"id": 270, "year": 105, "qnum": 30, "chapter": "H3", "stem": "甲於乙商店購得丙手機公司所生產之新型手機，甲交予其子丁使用，詎料丁於使用時竟發生手機電池燃燒，致丁受傷送醫。依消費者保護法規定，關於本案中企業經營者責任之敘述，下列何者錯誤？", "options": ["丙公司係生產問題手機之企業經營者，應確保該手機符合當時科技或專業水準可合理期待之安全性，如有違反，應負損害賠償責任", "該問題手機雖係甲所購買，但如丁因使用而身體受損害，丙公司仍應對丁負損害賠償責任", "若丙公司能證明其於生產手機時無過失者，法院應免除其賠償責任", "經銷手機之乙商店，就使用問題手機所生損害，與丙公司連帶負損害賠償責任。但乙商店得主張對損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害，以免除其與丙公司之連帶責任"], "answer": "C", "special": null}, {"id": 271, "year": 105, "qnum": 31, "chapter": "E3", "stem": "關於公寓大廈住戶行為規範之敘述，下列何者錯誤？", "options": ["住戶不得於大樓之公共密閉處所吸菸，以免影響其他住戶健康", "針對開放空間，在直轄市、縣（市）政府核准範圍內，住戶縱依規約或區分所有權人會議決議許可得使用該空間，亦不得為營業目的使用", "住戶於公寓大廈內依法經營餐飲業者，應依中央主管機關所定保險金額投保公共意外責任保險", "住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定"], "answer": "B", "special": null}, {"id": 272, "year": 105, "qnum": 32, "chapter": "E3", "stem": "依公寓大廈管理條例規定，區分所有權人召開定期會議之頻率為：", "options": ["每半年至少應召開定期會議1次", "每季至少應召開定期會議1次", "每年至少應召開定期會議1次", "每兩年至少應召開定期會議1次"], "answer": "C", "special": null}, {"id": 273, "year": 105, "qnum": 33, "chapter": "E1", "stem": "公寓大廈內連通數個專有部分之樓梯間，依公寓大廈管理條例相關規定屬於何種型態？", "options": ["分別所有部分", "共同公共部分", "共用部分", "獨立部分"], "answer": "C", "special": null}, {"id": 274, "year": 105, "qnum": 34, "chapter": "E1", "stem": "關於公寓大廈起造人行為規範之敘述，下列何者錯誤？", "options": ["起造人非經領得建造執照，不得辦理銷售", "起造人應就領得使用執照1年內之管理維護事項，提列一定比例金額作為公共基金，並於使用執照申請時，繳交各地方主管機關公庫代收之證明", "起造人應移交公寓大廈共用部分及設施予管理委員會或管理負責人", "起造人得將法定停車空間讓售於特定人，以增加公共基金收入來源"], "answer": "D", "special": null}, {"id": 275, "year": 105, "qnum": 35, "chapter": "E3", "stem": "依公寓大廈管理條例規定，公寓大廈住戶對於非屬專有部分之利用情形，下列敘述何者正確？", "options": ["住戶得經管理委員會主委同意，於外牆面設置廣告看板", "有12歲以下兒童之住戶，如未依規約或未經區分所有權人會議決議之同意，不得擅自於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施", "有12歲以下兒童之住戶，得於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施，無庸經規約或區分所有權人會議決議同意，但設置理由消失者，住戶應予改善或回復原狀", "住戶得經頂樓住戶之許可，於樓頂平台加蓋廟宇神壇"], "answer": "C", "special": null}, {"id": 276, "year": 105, "qnum": 36, "chapter": "E3", "stem": "關於公寓大廈營運與管理維護的敘述，下列何者正確？", "options": ["住戶共同事務應興革事項之決議，為管理委員會的職務之一", "受僱於公寓大廈管理維護公司之管理服務人員，不得同時受聘於2家以上之管理維護公司", "利害關係人請求閱覽或影印規約，管理委員於必要時得拒絕之，並應召集區分所有權人會議臨時會議", "公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，不得被選任、推選為管理委員、主任委員或管理負責人"], "answer": "B", "special": null}, {"id": 277, "year": 105, "qnum": 37, "chapter": "E3", "stem": "區分所有權人違反公寓大廈管理條例第 22 條，管理委員會得依區分所有權人會議之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分；於判決確定後 3 個月內不自行完成者，經管理委員會聲請法院拍賣之所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序的敘述，下列何者正確？", "options": ["優先於普通抵押權", "與第一順位抵押權同", "與普通抵押權同", "與一般債權同"], "answer": "B", "special": null}, {"id": 278, "year": 105, "qnum": 38, "chapter": "E5", "stem": "關於公寓大廈公共基金的敘述，下列何者正確？", "options": ["公共基金其來源之一為起造人就公寓大廈領得使用執照2年內之管理維護事項，應按工程造價一定比例或金額提列", "區分所有權人對於公共基金之權利不應隨區分所有權之移轉而移轉；得因個人事由為讓與、扣押、抵銷或設定負擔", "區分所有權人積欠應繳納之公共基金已逾六期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息", "區分所有權人未繳納公共基金時，主管機關依公寓大廈管理條例處新臺幣4萬元以上20萬元以下罰鍰，並得令其限期改善或履行義務"], "answer": "D", "special": null}, {"id": 279, "year": 105, "qnum": 39, "chapter": "H3", "stem": "依公寓大廈管理條例規定，直轄市、縣（市）政府得聘請資深之專家、學者及建築師、律師，並指定公寓大廈及建築管理主管人員，組設何種委員會處理公寓大廈爭議事件？", "options": ["公寓大廈爭議事件調解委員會", "公寓大廈爭議事件調處委員會", "公寓大廈爭議事件調查委員會", "公寓大廈爭議事件審議委員會"], "answer": "B", "special": null}, {"id": 280, "year": 105, "qnum": 40, "chapter": "E3", "stem": "公寓大廈外牆面設置廣告物，除應依法令規定辦理外，下列敘述何者正確？", "options": ["該公寓大廈規約另有規定，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，即應受該管理委員會會議決議之限制", "該公寓大廈規約另有規定，經向直轄市、縣（市）主管機關完成報備有案者，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，即應受該管理委員會會議決議之限制"], "answer": "C", "special": null}, {"id": 281, "year": 106, "qnum": 1, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，經紀人員違反下列何者應予停止執行業務處分？", "options": ["收取差價或其他報酬", "未自己執行仲介或代銷業務，且未經所屬經紀業同意者", "未於不動產出租、出售委託契約書上簽章", "在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說"], "answer": "A", "special": null}, {"id": 282, "year": 106, "qnum": 2, "chapter": "A4", "stem": "下列有關不動產經紀人員經紀業之敘述，何者錯誤？", "options": ["經紀業因業務需要，必要時得以在其公司工作多年，表現良好，但未具備經紀人資格者，從事仲介或代銷業務", "經營仲介業務者，應揭示報酬標準及收取方式，於營業處所明顯之處", "經紀業刊登廣告與銷售內容時，應與事實相符，並註明經紀業名稱", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說"], "answer": "A", "special": null}, {"id": 283, "year": 106, "qnum": 3, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，關於不動產經紀人員之資格，下列敘述何者錯誤？", "options": ["經不動產經紀人考試及格者，應具備1年以上經紀營業員經驗，始得向直轄市或縣市政府請領經紀人證書", "經紀人證書有效期限為4年。期滿時，應檢附4年內完成專業訓練30個小時以上之證明文件辦理換證", "曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起未滿5年者，不得充任經紀人員", "經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務。但經所屬經紀業同意為他經紀業執行業務者，不在此限"], "answer": "C", "special": null}, {"id": 284, "year": 106, "qnum": 4, "chapter": "C4", "stem": "下列何者非為不動產說明書不得記載事項？", "options": ["不得約定拋棄說明書審閱期間", "不得記載本說明書內容僅供參考", "不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞", "不得記載房價有上漲空間或預測房價上漲之情形"], "answer": "A", "special": null}, {"id": 285, "year": 106, "qnum": 5, "chapter": "A2", "stem": "依不動產經紀業管理條例規定，下列關於條例用辭定義之敘述何者正確？", "options": ["成屋：指領有建造執照，或於實施建築管理前建造完成之建築物", "預售屋：指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "經紀業：指依不動產經紀業管理條例規定從事買賣、互易、租賃之居間或代理業務者", "營業處所：指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所"], "answer": "D", "special": null}, {"id": 286, "year": 106, "qnum": 6, "chapter": "A4", "stem": "不動產買賣交易實價資訊之登錄，應於不動產簽訂買賣契約辦竣所有權移轉登記後，何時向主管機關申報登錄成交案件實際資訊？", "options": ["30日內", "20日內", "10日內", "即時"], "answer": "A", "special": null}, {"id": 287, "year": 106, "qnum": 7, "chapter": "A1", "stem": "依不動產經紀業管理條例規定，經紀業應於經紀人到職之日起幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？", "options": ["5日", "10日", "15日", "20日"], "answer": "C", "special": null}, {"id": 288, "year": 106, "qnum": 8, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，經營仲介業務者未揭示報酬標準及收取方式於營業處所明顯之處者，應如何懲處？", "options": ["經主管機關限期改正而未改正者，處新臺幣3萬元以上15萬元以下罰鍰", "逕處新臺幣3萬元以上15萬元以下罰鍰", "經主管機關限期改正而未改正者，處新臺幣6萬元以上30萬元以下罰鍰", "逕處新臺幣6萬元以上30萬元以下罰鍰"], "answer": "A", "special": null}, {"id": 289, "year": 106, "qnum": 9, "chapter": "A1", "stem": "不動產經紀業管理條例所稱主管機關，下列敘述何者錯誤？", "options": ["內政部營建署", "內政部", "直轄市政府地政處", "縣（市）政府"], "answer": "A", "special": null}, {"id": 290, "year": 106, "qnum": 10, "chapter": "A2", "stem": "下列有關不動產經紀業營業保證金之敘述，何者錯誤？", "options": ["營業保證金獨立於經紀業及經紀人員之外", "除不動產經紀業管理條例另有規定外，得因經紀業或經紀人員之債權、債務關係而為讓與、扣押、抵銷或設定負擔", "營業保證金應隨經紀業之合併、變更組織而移轉", "經紀業申請解散者，得請求退還原繳存之營業保證金"], "answer": "B", "special": null}, {"id": 291, "year": 106, "qnum": 11, "chapter": "A4", "stem": "依不動產經紀業管理條例規定，經紀業或經紀人員不得收取差價或其他報酬。若有違反，則應如何處置？", "options": ["返還支付人已收取之差價或其他報酬", "加計利息後返還支付人已收取之差價或其他報酬", "加計利息後加倍返還支付人已收取之差價或其他報酬", "加計利息後加倍返還支付人已收取之差價或其他報酬，並負損害賠償責任"], "answer": "C", "special": null}, {"id": 292, "year": 106, "qnum": 12, "chapter": "A4", "stem": "不動產經紀人員執行仲介或代銷業務時，因過失致交易當事人受損害者，不動產經紀業者其賠償責任，下列敘述何者正確？", "options": ["由不動產經紀人員單獨負賠償責任", "由不動產經紀業單獨負賠償責任", "由不動產經紀業與經紀人員負連帶賠償責任", "不動產經紀業以有可歸責事由為限，始負連帶賠償責任"], "answer": "C", "special": null}, {"id": 293, "year": 106, "qnum": 13, "chapter": "G1", "stem": "依公平交易法規定，事業有與他事業經常共同經營或受他事業委託經營之情形者，稱為下列何者？", "options": ["聯合", "結合", "獨占", "寡占"], "answer": "B", "special": null}, {"id": 294, "year": 106, "qnum": 14, "chapter": "G1", "stem": "不動產經紀業者，共同約束開發物件必須與委託人簽訂專任委託契約，致使不動產經紀業者及委託人選擇委託契約型態之自由受到限制，可能違反公平交易法之何種行為？", "options": ["第20條之妨害公平競爭行為", "第15條之聯合行為", "第11條之結合行為", "第9條之獨占行為"], "answer": "B", "special": null}, {"id": 295, "year": 106, "qnum": 15, "chapter": "G1", "stem": "關於結合行為之申報，下列敘述何者錯誤？", "options": ["事業自主管機關受理其提出完整申報資料之日起算30工作日內，不得結合", "關於不得為結合之期間，主管機關認為必要時，得書面通知事業另行延長期間。該延長期間不得逾60工作日", "如主管機關屆期未為延長通知或決定者，原則上事業得逕行結合", "關於不得為結合之期間，主管機關認為必要時，得書面通知事業另行縮短期間，該縮短期間不得短於15工作日"], "answer": "D", "special": null}, {"id": 296, "year": 106, "qnum": 16, "chapter": "G1", "stem": "甲向乙汽車公司購買限量跑車一台，在交車前夕，甲接獲汽車公司通知必須加購「跑車保險」，但甲向乙公司表示，可自行安排保險事宜無須加保，但遭乙公司拒絕，試問，乙汽車公司最有可能違反公平交易法中何種規定？", "options": ["聯合行為", "不正當限制交易相對人與其交易行為", "差別待遇", "不實廣告"], "answer": "B", "special": null}, {"id": 297, "year": 106, "qnum": 17, "chapter": "G1", "stem": "下列有關獨占之敘述，何者錯誤？", "options": ["一事業在相關市場中達到三分之二的市場占有率", "一事業在相關市場中具有壓倒性的地位，並且可以排除他事業的競爭", "二事業實際上無價格競爭之情勢，但具有排除第三事業進入市場的實力", "因技術困難或政府法令等情形，使得其他事業進入但具市場產生障礙，此種情形，主管機關得以認定其為獨占事業"], "answer": "A", "special": null}, {"id": 298, "year": 106, "qnum": 18, "chapter": "G1", "stem": "依公平交易法第20條之規定，妨害公平競爭之行為不包括下列何者？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "以脅迫、利誘或其他不正當之方法，使競爭者之交易相對人與自己交易之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為"], "answer": "C", "special": null}, {"id": 299, "year": 106, "qnum": 19, "chapter": "G1", "stem": "甲建設公司請乙廣告公司針對新推出之建案，宣傳其公共設施包含三溫暖及健身房，並請知名女星丙推薦該建案。然該建案依使用執照登載所示，廣告中宣傳該公共設施位置之使用用途為「梯間、水箱及機械室」且未辦理變更使用執照。使該建案於日後交屋時，消費者並未能獲得或合法享有廣告所示之公共設施空間使用。根據公平交易法，下列敘述何者錯誤？", "options": ["主管機關得限期令甲停止或改正其行為，並得處新臺幣2,500萬元以下罰鍰", "甲應負損害賠償責任", "乙於明知該宣傳內容虛偽不實時，須負連帶損害賠償責任", "丙如非明知或非可得而知該宣傳內容虛偽不實時，僅需就報酬十倍內負損害賠償責任"], "answer": "D", "special": null}, {"id": 300, "year": 106, "qnum": 20, "chapter": "G1", "stem": "不動產開發業者或不動產經紀業者銷售預售屋時，要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱，可能違反公平交易法之何種行為？", "options": ["第20條之妨害公平競爭行為", "第25條之欺罔或顯失公平行為", "第21條之虛偽不實廣告行為", "第15條之聯合行為"], "answer": "B", "special": null}, {"id": 301, "year": 106, "qnum": 21, "chapter": "G1", "stem": "下列何者非托拉斯基金之用途？", "options": ["辦理競爭法之教育及宣傳", "補助本法與涉及檢舉獎金訴訟案件相關費用之支出", "推動國際競爭法執法機關之合作", "補助消費者因聯合行為而受之損害"], "answer": "D", "special": null}, {"id": 302, "year": 106, "qnum": 22, "chapter": "G1", "stem": "依公平交易法規定，下列關於期間之敘述何者錯誤？", "options": ["主管機關對於違反獨占、聯合行為之裁處權，因5年期間經過而消滅", "損害賠償請求權，自請求權人知有行為及賠償義務人時起，2年間不行使而消滅", "損害賠償請求權，自行為時起，逾10年不行使而消滅", "聯合行為許可應附期限，其期限不得逾3年。以書面申請延展，其延展期限每次不得逾3年"], "answer": "D", "special": null}, {"id": 303, "year": 106, "qnum": 23, "chapter": "H3", "stem": "依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？", "options": ["7日", "10日", "15日", "20日"], "answer": "B", "special": null}, {"id": 304, "year": 106, "qnum": 24, "chapter": "H3", "stem": "依消費者保護法規定，關於企業經營者責任之敘述，下列何者錯誤？", "options": ["企業經營者所提供之服務，若具有危害消費者健康之可能者，應為警告標示。違反且致生損害於消費者時應負連帶賠償責任", "從事經銷之企業經營者，對商品或服務所生之損害防免已盡相當之注意，無須負連帶賠償責任", "企業經營者之商品雖致生損害於消費者，若能證明其無過失者，則無須負連帶賠償責任", "企業經營者對商品符合可合理期待之安全性，負舉證責任"], "answer": "C", "special": null}, {"id": 305, "year": 106, "qnum": 25, "chapter": "H2", "stem": "輸入之商品或服務，須以何種方式為之？", "options": ["應附中文標示", "得附中文標示", "無須附中文標示", "應附中文及外文標示"], "answer": "A", "special": null}, {"id": 306, "year": 106, "qnum": 26, "chapter": "H1", "stem": "下列何者不是消費者保護法第12條所規定推定定型化契約條款顯失公平之情形？", "options": ["契約之主要權利或義務，因受該條款之限制，致契約之目的難以達成者", "條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者", "違反平等互惠原則者", "違反誠信原則者"], "answer": "D", "special": null}, {"id": 307, "year": 106, "qnum": 27, "chapter": "H3", "stem": "下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？", "options": ["預售屋買賣定型化契約應記載及不得記載事項", "成屋買賣定型化契約應記載及不得記載事項", "不動產委託銷售定型化契約應記載及不得記載事項", "停車位租賃定型化契約應記載及不得記載事項"], "answer": "D", "special": null}, {"id": 308, "year": 106, "qnum": 28, "chapter": "H3", "stem": "依消費者保護法規定，企業經營者對於消費者之申訴，應於受訴之日起幾日內妥適處理？", "options": ["7日", "10日", "15日", "20日"], "answer": "C", "special": null}, {"id": 309, "year": 106, "qnum": 29, "chapter": "H3", "stem": "依消費者保護法規定，企業經營者對消費者保證商品或服務品質所出具之書面保證書，應載明事項不包括下列何者？", "options": ["商品或服務之名稱", "保證之內容", "製造日期", "製造商之名稱、地址"], "answer": "C", "special": null}, {"id": 310, "year": 106, "qnum": 30, "chapter": "H1", "stem": "依消費者保護法規定，關於定型化契約之審閱期間，下列敘述何者錯誤？", "options": ["應有30日以內之合理審閱期間", "企業經營者以定型化契約條款使消費者拋棄合理審閱期權利者，無效", "違反合理審閱期規定者，該條款無效", "中央主管機關得選擇特定行業，參酌定型化契約條款之重要性等事項，公告定型化契約之審閱期間"], "answer": "C", "special": null}, {"id": 311, "year": 106, "qnum": 31, "chapter": "H2", "stem": "依消費者保護法規定，關於特種交易之敘述何者正確？", "options": ["通訊交易係指企業經營者未與消費者在公共場所或其他場所等所定之契約", "訪問交易之消費者，除有合理例外情事者，得於收受商品後7日內，以退回商品或書面通知方式解除契約，無須說明理由", "通訊交易違反消費者解約權所為之約定，其約定無效", "企業經營者應於收到消費者退回商品通知之次日起7日內，返還消費者已支付之對價"], "answer": "C", "special": null}, {"id": 312, "year": 106, "qnum": 32, "chapter": "H1", "stem": "定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分？", "options": ["效力未定", "無效", "構成契約之內容", "不得撤銷"], "answer": "B", "special": null}, {"id": 313, "year": 106, "qnum": 33, "chapter": "E1", "stem": "公寓大廈共用部分不得獨立使用供作專有部分，其為下列何者不得作為約定專用部分？", "options": ["公寓大廈本身所占之地面", "社區內各巷道、防火巷弄", "非連通數個專有部分之樓梯或走廊", "公寓大廈之主要梁柱之構造"], "answer": "C", "special": null}, {"id": 314, "year": 106, "qnum": 34, "chapter": "E5", "stem": "在規約未特別約定之情形下，一層一戶之住戶在樓梯間與走廊置放鞋櫃，並將安全門上鎖防止他人出入該樓層。下列敘述，何者正確？", "options": ["住戶不得於樓梯間與共同走廊間堆置雜物。若有違反，管理委員會有權制止並移除鞋櫃與剪斷鎖頭", "主管機關得處該住戶新臺幣4萬元以上20萬元以下罰鍰，並限期改善", "管理委員會促請該住戶改善，若於3個月內仍未改善，管理委員會得依區分所有權人會議決議，強制其遷離", "若該住戶拒絕依照區分所有權人會議決議遷離並完成移轉登記手續者，管理委員會得聲請法院拍賣之"], "answer": "B", "special": null}, {"id": 315, "year": 106, "qnum": 35, "chapter": "E2", "stem": "下列有關公寓大廈管理之敘述，何者錯誤？", "options": ["住戶雖有繳管理費用，但仍不得任意棄置垃圾、惡臭物質", "住戶不得於私設通路、防火間隔、防火巷弄等處所堆置雜物", "住戶於開放空間及退縮空地，經管理委員會核准後，在核准範圍內得自行設置廣告物", "住戶飼養動物時，應遵守規定，不得妨害公共衛生、公共安寧以及公共安全"], "answer": "C", "special": null}, {"id": 316, "year": 106, "qnum": 36, "chapter": "E1", "stem": "專有部分之樓地板維修時，原則上維護費用應由誰負擔？", "options": ["樓地板上下方區分所有權人，共同負擔", "全體區分所有權人，共同負擔", "由樓地板上方之區分所有權人負擔", "由公寓大廈公共基金負擔"], "answer": "A", "special": null}, {"id": 317, "year": 106, "qnum": 37, "chapter": "E1", "stem": "公寓大廈住戶積欠應繳納之公共基金或應分擔之費用，下列何者情形管理委員會得請求法院命其給付？", "options": ["已逾二期，經定相當期間催告仍不給付者，得向法院起訴請求", "雖金額尚未相當，仍可向法院起訴請求", "只要一逾期未繳，即可向法院起訴請求", "視住戶態度決定催討與否或由管理委員會自行吸收"], "answer": "A", "special": null}, {"id": 318, "year": 106, "qnum": 38, "chapter": "E3", "stem": "依公寓大廈管理條例規定，召開區分所有權人會議之通知，應由召集人於開會幾日前以書面載明開會內容，通知各區分所有權人？", "options": ["7日", "10日", "15日", "20日"], "answer": "B", "special": null}, {"id": 319, "year": 106, "qnum": 39, "chapter": "E3", "stem": "依公寓大廈管理條例規定，關於供區分所有權人使用部分之敘述，下列何者錯誤？", "options": ["區分所有權人除法律另有限制外，對其專有部分得自由使用、收益、處分", "獨立建築物所有權之牆壁，以牆之外緣為界。故該牆所屬區分所有權人得於區分所有人權會議決議同意後，於外牆設置廣告物", "專有部分之共同壁修繕費用，若修繕費係因可歸責於區分所有權人之事由所致，全數由該區分所有權人負擔", "公寓大廈通往室外之通路不得為約定專用部分"], "answer": "B", "special": null}, {"id": 320, "year": 106, "qnum": 40, "chapter": "E3", "stem": "依公寓大廈管理條例規定，關於召開區分所有權人會議，下列敘述何者錯誤？", "options": ["每年至少應召開定期會議一次", "發生重大事故有及時處理之必要，經管理委員會請求者，得召開臨時會議", "須經區分所有權人三分之一以上及其區分所有權比例合計三分之一以上，以書面載明召集之目的及理由請求召集者，始得召開臨時會議", "區分所有權人會議可由具區分所有權人身分之管理委員為召集人"], "answer": "C", "special": null}, {"id": 321, "year": 107, "qnum": 1, "chapter": "A5", "stem": "關於不動產經紀業刊登廣告及銷售，依不動產經紀業管理條例之規定，何者正確？", "options": ["經紀業與買受人簽訂委託契約書後，方得刊登廣告及銷售", "廣告及銷售內容與事實不符者，應負損失補償責任", "廣告及銷售內容，應註明經紀業名稱。如有違反，處新臺幣三萬元以上十五萬元以下罰鍰", "不動產廣告稿應由經紀業指派經紀人簽章。如有違反，處新臺幣六萬元以上三十萬元以下罰鍰"], "answer": "D", "special": null}, {"id": 322, "year": 107, "qnum": 2, "chapter": "A4", "stem": "何種情況之受害人，得向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會請求代為賠償？", "options": ["不可歸責於經紀業之事由不能履行委託契約，致委託人受損害者", "經營仲介業務者並未揭示報酬標準及收取方式於營業處所明顯之處，致受託人受損害者", "經紀業因經紀人員執行仲介或代銷業務之故意或過失致交易當事人受損害者", "非經紀業而經營仲介或代銷業務，致當事人受損害者"], "answer": "C", "special": null}, {"id": 323, "year": 107, "qnum": 3, "chapter": "A1", "stem": "甲於 A 市經營不動產經紀業，數年後欲遷出所在地 A 市到 B 縣，應於遷出後多久時間內，以書面向遷入之 B 縣主管機關申請遷入備查，並向原所屬之同業公會報備，及加入 B 縣同業公會，該遷入之同業公會並應轉知其全國聯合會？", "options": ["三十日", "四十五日", "二個月", "三個月"], "answer": "A", "special": null}, {"id": 324, "year": 107, "qnum": 4, "chapter": "A5", "stem": "依不動產經紀業管理條例之規定，何者為應予停止營業處分之情形？", "options": ["經紀業未於經紀人到職之日起十五日內，造具名冊報請所在地主管機關層報中央主管機關備查", "經紀業繳存之營業保證金低於規定之額度時，經中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會通知經紀業者於一個月內補足而未補足", "經紀業僱用未具備經紀人員資格者從事仲介或代銷業務", "經營仲介業務者，對於買賣或租賃委託案件，未依規定於簽訂買賣契約書並辦竣所有權移轉登記或簽訂租賃契約書後三十日內，向主管機關申報登錄成交案件實際資訊"], "answer": "B", "special": null}, {"id": 325, "year": 107, "qnum": 5, "chapter": "D3", "stem": "依不動產委託銷售定型化契約應記載及不得記載事項之規定，買賣雙方價金與條件一致時，委託人應與受託人所仲介成交之買方另行簽訂「不動產買賣契約書」，並約定由委託人及買方共同或協商指定地政士辦理所有權移轉登記及相關手續；如未約明者，由何人指定之？", "options": ["委託人", "受託人", "買方", "直轄市、縣（市）主管機關"], "answer": "A", "special": null}, {"id": 326, "year": 107, "qnum": 6, "chapter": "C2", "stem": "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。依不動產說明書應記載及不得記載事項「壹、應記載事項二、成屋」部分，有關應記載或說明之「其他重要事項」，下列敘述何者錯誤？", "options": ["周邊環境，詳如都市計畫地形圖或相關電子地圖並於圖面標示周邊半徑三百公尺範圍內之重要環境設施", "是否已辦理地籍圖重測", "是否為直轄市或縣（市）政府列管之山坡地住宅社區", "本建物共有部分於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形"], "answer": "D", "special": null}, {"id": 327, "year": 107, "qnum": 7, "chapter": "A4", "stem": "依不動產經紀業管理條例之規定，關於不動產經紀人證書之敘述，何者正確？", "options": ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "中華民國之國民，經不動產經紀人考試及格，並依不動產經紀業管理條例領有不動產經紀人證書者，得充不動產經紀人", "經紀人證書有效期限為四年，期滿時，經紀人應檢附其於三年內在中央主管機關認可之機構、團體完成專業訓練三十個小時以上之證明文件，向直轄市或縣（市）政府辦理換證", "經紀業應將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處。其為加盟經營者，得免揭示"], "answer": "B", "special": null}, {"id": 328, "year": 107, "qnum": 8, "chapter": "G1", "stem": "不動產經紀業者共同約束專任委託契約之期間，致使不動產經紀業者縱未積極努力撮合，委託人卻因受限於契約而無法另行委託其他不動產經紀業者，該行為將違反公平交易法所規範之那一種行為？", "options": ["以著名之他人姓名、商號或公司名稱、標章或其他表示他人營業、服務之表徵，於同一或類似之服務為相同或近似之使用，致與他人營業或服務之設施或活動混淆", "結合", "聯合行為", "為其他足以影響交易秩序之欺罔或顯失公平之行為"], "answer": "C", "special": null}, {"id": 329, "year": 107, "qnum": 9, "chapter": "G1", "stem": "甲為不動產經紀業者，受乙不動產開發業者委託從事銷售行為，甲外包請丙廣告公司設計廣告，經消費者丁舉報該廣告之內容，有虛偽不實或引人錯誤之情形，經公平交易委員會認定為違反規定。依公平交易法之規定，下列敘述情形，何者錯誤？", "options": ["主管機關對於甲，得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣二十萬元以上五千萬元以下罰鍰", "若甲與乙共同具名製作不實房屋銷售廣告，且收取建案底價或總銷售金額一定成數之銷售服務費用，與乙共同獲有利益，可認為甲乙俱為廣告主", "丙在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任", "甲違反公平交易法之規定，致侵害丁之權益，應負損害賠償責任"], "answer": "A", "special": null}, {"id": 330, "year": 107, "qnum": 10, "chapter": "G1", "stem": "公平交易委員會發現某甲事業可能有違法之聯合行為情事，依職權欲對甲事業調查處理。關於調查之事項，下列何者錯誤？", "options": ["派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "甲事業若承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得中止調查", "執行調查之人員依法執行公務時，未出示有關執行職務之證明文件者，受調查者得拒絕之", "調查所得可為證據之物，主管機關得扣留之；其扣留範圍及期間，不以供調查、檢驗、鑑定或其他為保全證據之目的所必要者為限"], "answer": "D", "special": null}, {"id": 331, "year": 107, "qnum": 11, "chapter": "G1", "stem": "甲為一位知名影星，曾拍攝二個不動產廣告，且知悉該等廣告有不實的情形。在成名之前，甲接拍廣告主乙的不動產廣告，廣告中反映甲對不動產商品的信賴，結果當時消費者丙即曾經檢舉廣告不實。十二年之後，甲已成為知名公眾人物，接了第二個廣告主丁的不動產廣告，反映甲對該廣告商品的親身體驗。此時，消費者戊檢舉廣告不實。依公平交易法之規定，下列敘述，何者正確？", "options": ["甲必須是「明知」其所從事之薦證有引人錯誤之虞，而仍為薦證，才需要負責", "第一個廣告，甲仍非知名公眾人物，僅於受乙報酬五倍之範圍內，與乙負連帶損害賠償責任", "第二個廣告，甲為知名人士，須與丁負連帶損害賠償責任", "丙和戊的請求權尚未超過法定期限，故其請求權尚未消滅"], "answer": "C", "special": null}, {"id": 332, "year": 107, "qnum": 12, "chapter": "H3", "stem": "消費者保護法關於企業經營者對於廣告內容之規定，下列何者正確？", "options": ["製作廣告之媒體經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容", "企業經營者對消費者從事與分期付款買賣有關之交易時，應於廣告上明示應付所有總費用之年百分率", "刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任", "企業經營者得預先約定限縮信賴該廣告之賠償責任範圍"], "answer": "C", "special": null}, {"id": 333, "year": 107, "qnum": 13, "chapter": "H3", "stem": "消費者保護團體得依消費者保護法之規定，提起消費者損害賠償訴訟或不作為訴訟，下列何者錯誤？", "options": ["消費者保護團體依規定提起訴訟者，得以自己之名義提起，視個案情形決定是否委任律師代理訴訟", "消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體以自己名義提起訴訟者，應具備之條件有：許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良", "消費者保護團體以自己之名義提起消費者損害賠償訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費"], "answer": "A", "special": null}, {"id": 334, "year": 107, "qnum": 14, "chapter": "H3", "stem": "當有事實證明該流通進入市場之商品或服務，具有危害消費者安全與健康之虞時，為避免消費者權益遭受損害，企業經營者應回收或停止該有危險之商品或服務，以防免發生或擴大損害。依消費者保護法之規定，下列何者錯誤？", "options": ["中央主管機關認為有必要時，得命有損害消費者生命、身體、健康或財產的企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施", "直轄市或縣（市）政府對於企業經營者提供之商品或服務，經調查認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬", "企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，於明顯處為警告標示，得免除回收該批商品或停止其服務之責任", "直轄市或縣（市）政府於企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置"], "answer": "C", "special": null}, {"id": 335, "year": 107, "qnum": 15, "chapter": "E1", "stem": "依公寓大廈管理條例規定，有關公寓大廈外牆開口部或陽台設置防墜設施的條件，下列何者錯誤？", "options": ["有十二歲以下兒童之住戶", "有六十五歲以上老人之住戶", "防墜設施須不妨礙逃生且不突出外牆面", "應經管理委員會之同意"], "answer": "D", "special": null}, {"id": 336, "year": 107, "qnum": 16, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，非封閉式之公寓大廈集居社區其地面層為各自獨立之數幢建築物，且區內屬住宅與辦公、商場混合使用，其辦公、商場之出入口各自獨立之公寓大廈，各該幢內之辦公、商場部分，得就該幢或結合他幢內之辦公、商場部分，經其區分所有權人過多少比例之書面同意，及全體區分所有權人會議決議或規約明定法定事項後，以該辦公、商場部分召開區分所有權人會議，成立管理委員會，並向直轄市、縣（市）主管機關報備？", "options": ["二分之一", "三分之二", "五分之三", "四分之三"], "answer": "A", "special": null}, {"id": 337, "year": 107, "qnum": 17, "chapter": "E1", "stem": "依公寓大廈管理條例之規定，公寓大廈之起造人或區分所有權人應依使用執照所記載之用途及法定之測繪規定，辦理建物所有權第一次登記。下列敘述何者錯誤？", "options": ["獨立建築物所有權之牆壁，以牆之外緣為界", "建築物共用之牆壁，以牆壁之中心為界", "附屬建物以其外緣為界辦理登記", "無隔牆設置者，以建築執照竣工平面圖區分範圍為界，其面積應包括四周牆壁之厚度"], "answer": "D", "special": null}, {"id": 338, "year": 107, "qnum": 18, "chapter": "E1", "stem": "公寓大廈共用部分原則上不得獨立使用供做專有部分，依公寓大廈管理條例之規定，下列何者屬得為約定專用部分：", "options": ["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄", "無固定使用方法，非屬區分所有權人生活利用上不可或缺之共用部分", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "公寓大廈本身所占之地面"], "answer": "B", "special": null}, {"id": 339, "year": 107, "qnum": 19, "chapter": "E1", "stem": "依公寓大廈管理條例之規定，共用部分指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者。關於共用部分，下列敘述何者錯誤？", "options": ["專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔", "管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕", "各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會之決定為之"], "answer": "D", "special": null}, {"id": 340, "year": 107, "qnum": 20, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，應經下列何種程序，始得供營業使用？", "options": ["經向直轄市、縣市主管機關申請許可之許可函", "依規約或區分所有權人會議決議", "依管理負責人或管理委員會之決定", "依開放空間及退縮空地鄰近之區分所有權人之同意"], "answer": "B", "special": null}, {"id": 341, "year": 107, "qnum": 21, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，因地震、水災、風災、火災或其他重大事變，肇致危害公共安全，而需要辦理公寓大廈之重建者，下列敘述何者錯誤？", "options": ["公寓大廈依此事由所為之重建，不須經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之", "管理負責人或管理委員會依公寓大廈管理條例之規定，訴請法院命不同意決議又不出讓區分所有權之區分所有權人出讓其區分所有權及其基地所有權應有部分後，對於該受讓人仍應徵詢其意見，不當然視為同意重建"], "answer": "D", "special": null}, {"id": 342, "year": 107, "qnum": 22, "chapter": "A3", "stem": "依不動產經紀業管理條例之規定，下列何種情形不得申請經營經紀業？", "options": ["受破產之宣告尚未復權者", "受感訓處分之裁定確定，執行完畢後已滿三年者", "犯詐欺、背信、侵占罪，經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者", "受廢止經紀人員證書或證明處分已滿五年者"], "answer": "A", "special": null}, {"id": 343, "year": 107, "qnum": 23, "chapter": "A4", "stem": "下列有關經紀業及經紀人員業務及責任之敘述，何者正確？", "options": ["不動產說明書應由經紀業指派經紀人員簽章", "經營仲介業務者，應依實際成交價金按中華民國不動產仲介經紀業同業公會全國聯合會規定之報酬標準計收", "不動產廣告及銷售內容，應與事實相符，並註明經紀業及經紀人員名稱", "經營仲介業務者經買賣雙方當事人之書面同意，得同時接受雙方之委託，並提供買受人關於不動產必要之資訊"], "answer": "D", "special": null}, {"id": 344, "year": 107, "qnum": 24, "chapter": "A3", "stem": "下列有關不動產經紀人辦理換發證書之規定敘述，何者正確？", "options": ["換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年", "應於證書有效期限屆滿前三個月內申請", "應完成專業訓練至少二十個小時", "應向執業所在地之直轄市或縣（市）政府申請"], "answer": "A", "special": null}, {"id": 345, "year": 107, "qnum": 25, "chapter": "A3", "stem": "首次請領不動產經紀人證書時，不須檢附下列何種文件？", "options": ["身分證明文件影本", "完成專業訓練三十個小時以上之證明文件", "不動產經紀人考試及格證書及其影本", "一年以上經紀營業員經驗證明文件及其影本"], "answer": "B", "special": null}, {"id": 346, "year": 108, "qnum": 1, "chapter": "A2", "stem": "關於不動產經紀業營業保證金之敘述，以下何者錯誤？", "options": ["營業保證金除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押或設定負擔", "不動產經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金。但不包括營業保證金之孳息", "應繳之營業保證金及繳存或提供擔保之辦法，由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會定之", "經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉"], "answer": "C", "special": null}, {"id": 347, "year": 108, "qnum": 2, "chapter": "A2", "stem": "依不動產經紀業管理條例規定，經紀業應依中央主管機關規定繳存營業保證金。下列關於營業保證金之說明，何者錯誤？", "options": ["獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因其債務債權關係而為扣押", "得因經紀業或經紀人員之債務債權關係而抵銷", "經紀業合併時，所繳存營業保證金之權利，應隨之移轉", "經紀業申請解散時，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"], "answer": "B", "special": null}, {"id": 348, "year": 108, "qnum": 3, "chapter": "D3", "stem": "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列何者不屬不動產經紀業管理條例規定經紀業應指派經紀人簽章之文件？", "options": ["不動產承租、承購委託契約書", "不動產承租、承購要約書", "定金收據", "不動產廣告稿"], "answer": "A", "special": null}, {"id": 349, "year": 108, "qnum": 4, "chapter": "A4", "stem": "不動產經紀業管理條例關於經紀業經營仲介與代銷業務之規範，下列敘述何者正確？", "options": ["受起造人或建築業之委託，負責企劃並代理銷售不動產之業務為仲介業務；從事不動產買賣、互易、租賃之居間或代理業務為代銷業務", "經營仲介業務者，應將報酬標準及收取方式於營業處所明顯處揭示；經營代銷業務者，則不須揭示之", "經營仲介業務者，應僱用具備經紀人員資格者從事業務；經營代銷業務者，則無此限制", "經營仲介業務者，有向主管機關申報登錄成交案件實際資訊之義務；經營代銷業務者，則無此義務"], "answer": "B", "special": null}, {"id": 350, "year": 108, "qnum": 5, "chapter": "A5", "stem": "有下列何種情形者，不得申請經營經紀業，其經許可者，撤銷或廢止其許可？", "options": ["犯詐欺、背信、侵占罪經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者", "曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起已滿五年者", "受停止營業處分，已執行完畢者", "受廢止經紀人員證書或證明處分未滿五年者"], "answer": "D", "special": null}, {"id": 351, "year": 108, "qnum": 6, "chapter": "A5", "stem": "甲通過不動產經紀人考試並領有不動產經紀人證書，從事不動產仲介業務多年，同時擔任乙仲介公司董事長。執業期間因車禍腦部受創而受法院監護宣告，成為無行為能力人。下列敘述何者正確？", "options": ["甲得繼續充任不動產經紀人，其資格不受影響", "主管機關應予甲申誡處分", "主管機關應廢止乙公司之營業許可", "由主管機關命乙公司限期改善；逾期未改善者，廢止其許可，並通知公司或商業登記主管機關廢止其登記"], "answer": "D", "special": null}, {"id": 352, "year": 108, "qnum": 7, "chapter": "A4", "stem": "甲公司接受乙建築公司之委託，簽訂委託契約書後，負責企劃並代理銷售乙公司新推出之公寓大廈預售屋。下列敘述何者正確？", "options": ["雙方應簽訂委託銷售契約書，並由乙公司指派經紀人於契約書簽章", "甲公司於簽訂委託銷售契約書前，即得刊登廣告並開始銷售", "甲公司應將報酬標準及收取方式揭示於營業處所明顯之處", "乙公司之不動產廣告及銷售內容，應與事實相符，並註明甲公司名稱"], "answer": "D", "special": null}, {"id": 353, "year": 108, "qnum": 8, "chapter": "G1", "stem": "公平交易法規定，法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", "options": ["二倍", "三倍", "四倍", "五倍"], "answer": "B", "special": null}, {"id": 354, "year": 108, "qnum": 9, "chapter": "G1", "stem": "不動產經紀業者以下何種行為不涉及違法聯合行為？", "options": ["共同決定服務報酬收費標準，或協議限制服務報酬之調整", "協議拒絕其他不動產經紀業者參與聯賣", "共同約束開發物件必須與委託人簽訂一般委託契約", "共同約束專任委託契約之期間"], "answer": "C", "special": null}, {"id": 355, "year": 108, "qnum": 10, "chapter": "C4", "stem": "下列何者非屬內政部所頒不動產說明書不得記載事項之內容？", "options": ["附屬建物除陽台外，其餘項目不得計入買賣價格", "不得記載本說明書內容僅供參考", "不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞", "預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"], "answer": "A", "special": null}, {"id": 356, "year": 108, "qnum": 11, "chapter": "E3", "stem": "安心社區擬於近日召開區分所有權人定期會議，討論社區管理事宜，同時選任新的管理委員。社區規約對於定期會議之召集程序及管理委員之選任事項，未定有特別規定。請問：管理委員會主任委員召集會議時，下列何項程序有違公寓大廈管理條例之規定？", "options": ["於開會前十日通知各區分所有權人", "以書面通知載明開會內容", "逕以公告代替書面通知，公告期間多於二日", "有關管理委員之選任事項，在開會通知中載明並公告之"], "answer": "C", "special": null}, {"id": 357, "year": 108, "qnum": 12, "chapter": "G1", "stem": "甲房屋仲介公司擬與乙房屋仲介公司合併，下列何種情形不須先向公平交易委員會提出申報？", "options": ["甲公司已持有乙公司達百分之五十以上之有表決權股份", "兩家公司合併後之市場占有率達三分之一", "乙公司之市場占有率已達四分之一", "甲公司上一會計年度銷售金額，超過公平交易委員會所公告之金額"], "answer": "A", "special": null}, {"id": 358, "year": 108, "qnum": 13, "chapter": "G1", "stem": "某直轄市內有競爭關係之甲、乙、丙、丁不動產仲介業者相互協議，就仲介成交之房屋買賣或租賃案件一律收取固定之服務報酬。試問：甲、乙、丙、丁之協議行為，可能構成公平交易法所規定之何種行為？", "options": ["獨占", "結合", "聯合", "杯葛"], "answer": "C", "special": null}, {"id": 359, "year": 108, "qnum": 14, "chapter": "H1", "stem": "定型化契約中之條款可以分為定型化契約條款及個別磋商條款兩種，兩者如果發生不一致情形時，以下何者正確？", "options": ["個別磋商條款具有高於所有定型化契約條款之效力", "由於個別磋商條款，係經過契約當事人個別磋商而合意約定的契約條款，相較於僅由企業經營者所預先擬定的定型化契約條款，更能顯示當事人真意所在，自應優先考量", "如定型化契約條款與個別磋商條款發生牴觸時，定型化契約條款全部無效，其未牴觸部分亦無效", "定型化契約條款牴觸個別磋商條款之約定者，定型化契約無效"], "answer": "B", "special": null}, {"id": 360, "year": 108, "qnum": 15, "chapter": "H3", "stem": "關於消費者保護法所稱分期付款買賣，以下何者正確？", "options": ["指買賣契約約定消費者支付頭期款，餘款分期支付之交易型態", "預售屋分期付款買賣，價金分期給付，是消費者保護法有關分期付款買賣", "分期付款買賣契約書未記載利率者，其利率按現金交易價格週年利率百分之六計算之", "分期付款買賣契約書應記載各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "answer": "D", "special": null}, {"id": 361, "year": 108, "qnum": 16, "chapter": "H3", "stem": "消費者與企業經營者因商品或服務發生消費爭議，消費者向企業經營者申訴時，企業經營者對於消費者的申訴，以下何者正確？", "options": ["從企業經營者接獲消費者申訴的當日開始起算十日內予以妥適處理", "從企業經營者接獲消費者申訴的當日開始起算十五日內予以妥適處理", "從消費者為申訴的那一天開始起算十五日內予以妥適處理", "從消費者為申訴的那一天開始起算十日內予以妥適處理"], "answer": "B", "special": null}, {"id": 362, "year": 108, "qnum": 17, "chapter": "H3", "stem": "甲、乙、丙三公司分別為從事 A 商品之設計、製造及銷售之企業經營者。假設消費者丁購買丙公司銷售之 A 商品，造成丁的兒子受到傷害，依消費者保護法規定，甲公司應負何種責任？", "options": ["不須負任何責任", "與乙、丙公司比例分擔損害賠償責任", "與乙、丙公司負連帶賠償責任。但能證明其無過失者，法院得減輕其賠償責任", "與乙、丙公司負連帶賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限"], "answer": "C", "special": null}, {"id": 363, "year": 108, "qnum": 18, "chapter": "H3", "stem": "依消費者保護法規定，消費者與企業經營者間因商品或服務所生之爭議，得選擇申訴、調解及訴訟途徑，尋求救濟。下列有關申請調解之敘述，何者正確？", "options": ["調解屬於司法解決途徑", "申訴與調解並無先後之分，未提起申訴仍得申請調解", "調解須向直轄市、縣（市）政府消費者保護官申請", "調解成立者，調解書經法院核定後，與民事確定判決有同一之效力"], "answer": "D", "special": null}, {"id": 364, "year": 108, "qnum": 19, "chapter": "H3", "stem": "消費者因使用商品或接受服務，造成權利受損，依消費者保護法規定得提起團體訴訟，向企業經營者求償。有關團體訴訟之敘述，下列何者正確？", "options": ["至少有五十人將損害賠償請求權讓與經主管機關核定之優良消費者保護團體", "消費者保護團體係以自己名義提起訴訟", "損害賠償僅限於財產上之損害，不包括非財產上之損害", "消費者團體就此項訴訟，得向消費者請求報酬"], "answer": "B", "special": null}, {"id": 365, "year": 108, "qnum": 20, "chapter": "A2", "stem": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["營業處所經紀營業員數每逾10名時，應增設經紀人1人", "經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人", "經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同", "非中華民國國民，不得充任中華民國不動產經紀人"], "answer": "B", "special": null}, {"id": 366, "year": 108, "qnum": 21, "chapter": "E2", "stem": "公寓大廈專有部分之共同壁及樓地板或其內之管線，其維修費用，以下敘述何者正確？", "options": ["修繕費係因非可歸責於區分所有權人之事由所致者，由該區分所有權人負擔", "由該共同壁雙方或樓地板上下方之區分所有權人共同負擔", "由公共基金負擔", "由管理委員會負擔"], "answer": "B", "special": null}, {"id": 367, "year": 108, "qnum": 22, "chapter": "E1", "stem": "下列何者，得為公寓大廈約定專用部分？", "options": ["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳", "社區內各巷道、防火巷弄", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "樓頂平臺"], "answer": "D", "special": null}, {"id": 368, "year": 108, "qnum": 23, "chapter": "E3", "stem": "以下有關公寓大廈區分所有權人會議及管理委員會兩者間關係之說明，何者錯誤？", "options": ["管理委員會有執行區分所有權人會議決議事項之義務", "管理委員會會議決議之內容不得違反區分所有權人會議決議", "管理委員會不得為訴訟之原告或被告，如起訴或被訴時，應通知區分所有權人擔當訴訟", "管理委員會應向區分所有權人會議負責，並向其報告會務"], "answer": "C", "special": null}, {"id": 369, "year": 108, "qnum": 24, "chapter": "E3", "stem": "向上大樓已成立管理委員會，並將公共基金存放銀行專戶。住戶希望閒置的公共基金能獲取較銀行存款更高的投資報酬，擬交付信託。試問：依公寓大廈管理條例規定，應如何處理？", "options": ["經管理委員會決議後，由負責財務管理之管理委員交付信託", "經區分所有權人會議決議後，由管理委員會交付信託", "由管理委員會主任委員直接交付信託", "由負責財務管理之管理委員直接交付信託"], "answer": "B", "special": null}, {"id": 370, "year": 108, "qnum": 25, "chapter": "F2", "stem": "下列有關公寓大廈規約之敘述，何者正確？", "options": ["由管理委員會訂定", "內政部訂頒之「公寓大廈規約範本」具強制效力，公寓大廈訂定規約不得違反該範本之內容", "就住戶違反義務之處理方式，非經載明於規約，不生效力", "規約訂定後，應向主管機關報備，始生效力"], "answer": "C", "special": null}, {"id": 371, "year": 109, "qnum": 1, "chapter": "A4", "stem": "關於不動產經紀業管理條例立法目的之敘述，下列何者正確？", "options": ["加強公寓大廈之管理維護", "發展租賃住宅服務業", "保障國民消費生活安全", "促進不動產交易市場健全發展"], "answer": "D", "special": null}, {"id": 372, "year": 109, "qnum": 2, "chapter": "A1", "stem": "不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？", "options": ["都市發展、城鄉發展", "產業發展", "地政", "財政"], "answer": "C", "special": null}, {"id": 373, "year": 109, "qnum": 3, "chapter": "A5", "stem": "除依法辦理停業登記者外，經紀業開始營業後自行停止營業達多久以上者，直轄市或縣（市）主管機關得廢止其許可？", "options": ["連續三個月以上者", "合計三個月以上者", "連續六個月以上者", "合計六個月以上者"], "answer": "C", "special": null}, {"id": 374, "year": 109, "qnum": 4, "chapter": "G1", "stem": "根據公平交易法，二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有此等規定之情形者，視為下列何者？", "options": ["寡占", "獨占", "結合", "聯合"], "answer": "B", "special": null}, {"id": 375, "year": 109, "qnum": 5, "chapter": "G1", "stem": "公平交易法第二十條規定，有下列各款行為之一，而有限制競爭之虞者，事業不得為之。其事項「不」包括下列何者？", "options": ["無正當理由，對他事業給予差別待遇之行為", "為加強貿易效能，而就國外商品或服務之輸入採取共同行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "answer": "B", "special": null}, {"id": 376, "year": 109, "qnum": 6, "chapter": "G2", "stem": "關於不實廣告之敘述，下列何者正確？", "options": ["廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，應自負損害賠償責任，與廣告主無涉", "廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，應與廣告代理業負連帶損害賠償責任", "廣告薦證者，指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構", "廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受有報酬二十倍之範圍內，與廣告代理業負連帶損害賠償責任"], "answer": "C", "special": null}, {"id": 377, "year": 109, "qnum": 7, "chapter": "G1", "stem": "事業違反公平交易法，致侵害他人權益者，如為事業之故意行為，法院得酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", "options": ["一倍", "三倍", "五倍", "十倍"], "answer": "B", "special": null}, {"id": 378, "year": 109, "qnum": 8, "chapter": "H3", "stem": "依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額幾倍以下之懲罰性賠償金？", "options": ["一倍", "三倍", "五倍", "十倍"], "answer": "C", "special": null}, {"id": 379, "year": 109, "qnum": 9, "chapter": "H2", "stem": "根據消費者保護法，通訊交易或訪問交易之消費者，得於收受商品或接受服務後幾日內，以退回商品或書面通知方式解除契約？", "options": ["五日", "七日", "十日", "十五日"], "answer": "B", "special": null}, {"id": 380, "year": 109, "qnum": 10, "chapter": "H3", "stem": "關於企業經營者與消費者分期付款買賣契約之敘述，下列何者正確？", "options": ["企業經營者應於契約書載明各期價款與其他附加費用合計之總價款與現金交易價格之差額", "企業經營者未於契約書記載總價款者，消費者不負現金交易價格加計週年利率百分之五以外價款之給付義務", "企業經營者未於契約書記載利率者，其利率按總價款週年利率百分之六計算之", "企業經營者未於契約書記載利率者，消費者不負現金交易價格以外價款之給付義務"], "answer": "A", "special": null}, {"id": 381, "year": 109, "qnum": 11, "chapter": "H3", "stem": "企業經營者違反消費者保護法之定型化契約應記載或不得記載事項者，經主管機關令其限期改正而屆期不改正者，第一次處多少罰鍰？", "options": ["新臺幣一萬元以上十萬元以下", "新臺幣二萬元以上二十萬元以下", "新臺幣三萬元以上三十萬元以下", "新臺幣十萬元以上一百萬元以下"], "answer": "C", "special": null}, {"id": 382, "year": 109, "qnum": 12, "chapter": "E3", "stem": "關於公寓大廈之公共基金，下列敘述何者正確？", "options": ["起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列", "區分所有權人依管理委員會議決議繳納", "區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉", "區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付"], "answer": "C", "special": null}, {"id": 383, "year": 109, "qnum": 13, "chapter": "E1", "stem": "公寓大廈應成立管理委員會或推選管理負責人。下列何種管理委員，不受連選得連任一次之限制？", "options": ["主任委員", "監察委員", "財務委員", "消防委員"], "answer": "D", "special": null}, {"id": 384, "year": 109, "qnum": 14, "chapter": "A4", "stem": "不動產經紀業應依不動產經紀業管理條例之規定，於營業處所明顯之處，揭示一定之文件。請問下列選項何者並非應於營業處所明顯之處揭示的文件？", "options": ["經紀業許可文件", "不動產說明書", "不動產經紀人證書", "報酬標準及收取方式"], "answer": "B", "special": null}, {"id": 385, "year": 109, "qnum": 15, "chapter": "A5", "stem": "近來針對不動產經紀業的廣告行為，發生許多爭議。依不動產經紀業管理條例之規定，下列敘述何者正確？", "options": ["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "廣告及銷售內容，應與事實相符，並應註明廣告業名稱", "廣告及銷售內容與事實不符者，經紀業應負行政之損失補償責任", "主管機關僅能就經紀業違反得刊登廣告及銷售時間之規定，處罰經紀業新臺幣六萬元以上三十萬元以下罰鍰"], "answer": "A", "special": null}, {"id": 386, "year": 109, "qnum": 16, "chapter": "D3", "stem": "關於不動產經紀業管理條例之用辭定義，下列敘述何者正確？", "options": ["預售屋指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "差價係指買方支付斡旋金之交易價格與賣方委託銷售價格之差額", "經紀人員包含經紀人或經紀營業員。經紀人指依本條例規定經營仲介或代銷業務之公司或商號；經紀營業員之職務為協助經紀人執行仲介或代銷業務", "加盟經營者係指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督"], "answer": "D", "special": null}, {"id": 387, "year": 109, "qnum": 17, "chapter": "G1", "stem": "不動產經紀業者從事不動產買賣之仲介業務時，在向買方收取斡旋金前，未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係等資訊，將違反下列那一項規定？", "options": ["構成欺罔行為，且足以影響交易秩序者，將違反公平交易法第二十五條規定", "不當爭取交易之機會，將違反公平交易法第二十三條規定", "為虛偽不實或引人錯誤之表示或表徵，將違反公平交易法第二十一條規定", "致與他人營業或服務之設施或活動混淆者，將違反公平交易法第二十二條規定"], "answer": "A", "special": null}, {"id": 388, "year": 109, "qnum": 18, "chapter": "G1", "stem": "依公平交易法之規定，事業不得為限制競爭之行為，下列敘述何者錯誤？", "options": ["事業不得限制消費者，就供給之商品轉售與第三人或第三人再轉售時之價格", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "無正當理由，對他事業給予差別待遇之行為"], "answer": "A", "special": null}, {"id": 389, "year": 109, "qnum": 19, "chapter": "H3", "stem": "消費者保護法針對企業經營者在定型化契約中所用之條款，有非常多的規定。下列敘述何者正確？", "options": ["企業經營者應給與消費者定型化契約書。但依其契約之性質致給與顯有困難者，不在此限", "企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式，公告其內容後，該條款立即成為契約之內容", "定型化契約書經消費者簽名或蓋章者，企業經營者應給與消費者該定型化契約書副本", "定型化契約條款如有疑義時，應為有利於雙方當事人之解釋"], "answer": "A", "special": null}, {"id": 390, "year": 109, "qnum": 20, "chapter": "H3", "stem": "甲於網路上看到乙不動產開發商委託丙廣告媒體經營者刊登不動產買賣廣告後，向乙購買了一戶房屋。於交屋後發現有廣告不實的爭議。下列敘述何者錯誤？", "options": ["乙應確保廣告內容之真實，其對甲所負之義務不得低於廣告之內容。乙之商品或服務廣告內容，於契約成立後，應確實履行", "甲可以向消費者保護團體提出廣告爭議之申訴、調解，或是直接向直轄市或縣（市）消費爭議調解委員會申請調解", "丙明知或可得而知廣告內容與事實不符者，就甲因信賴該廣告所受之損害與企業經營者負連帶責任", "甲與乙因商品或服務發生廣告之消費爭議時，甲得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴"], "answer": "B", "special": null}, {"id": 391, "year": 109, "qnum": 21, "chapter": "H3", "stem": "甲為 A 屋的所有權人，委託乙仲介公司幫忙賣房子。關於甲乙適用消費者保護法的情形，下列敘述何者錯誤？", "options": ["甲和乙所發生之法律關係，屬於消費關係", "乙提出乙定型化契約條款作為契約內容而訂立之委託銷售契約屬於定型化契約", "甲和乙訂定買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態，屬於分期付款之契約", "甲和乙如果適用乙所提出的定型化契約，仍然可以由契約當事人個別磋商而合意擬定個別磋商條款"], "answer": "C", "special": null}, {"id": 392, "year": 109, "qnum": 22, "chapter": "H3", "stem": "為維護消費者之權益，保障消費者之健康與安全，消費者保護法於第二章第一節規定「健康與安全保障」專節。下列敘述何者錯誤？", "options": ["從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任", "企業經營者對消費者或第三人之損害賠償責任，不得預先約定限制或免除", "輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，需負第三人責任", "企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，應即回收該批商品或停止其服務"], "answer": "C", "special": null}, {"id": 393, "year": 109, "qnum": 23, "chapter": "E3", "stem": "約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理條例之規定，下列敘述何者錯誤？", "options": ["於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之", "公寓大廈本身所占之地面不得為約定專用部分", "規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約者，不生效力", "成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限"], "answer": "A", "special": null}, {"id": 394, "year": 109, "qnum": 24, "chapter": "E3", "stem": "某公寓大廈社區將原本為甲所有之專有部分，經約定後供共同使用。請問該約定共用部分，於公寓大廈管理條例之規定中，下列敘述何者錯誤？", "options": ["公寓大廈之起造人於申請建造執照時，應檢附資料包含約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同", "約定共用部分之修繕、管理、維護，由專有部分區分所有權人甲負擔之", "約定共用部分，若涉及公共環境清潔衛生之維持、公共消防滅火器材之維護、公共通道溝渠及相關設施之修繕，其費用政府得視情況予以補助", "專有部分經依區分所有權人會議約定為約定共用部分者，應經甲之同意，否則不生效力"], "answer": "B", "special": null}, {"id": 395, "year": 109, "qnum": 25, "chapter": "E3", "stem": "公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者，為共用部分。公寓大廈管理條例對於共用部分權利義務關係之規定，下列敘述何者錯誤？", "options": ["管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕", "共用部分之修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔。其費用若區分所有權人會議或規約另有規定者，從其規定", "各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定", "共用部分及其相關設施之拆除，應由管理負責人或管理委員會決定為之"], "answer": "D", "special": null}, {"id": 396, "year": 110, "qnum": 1, "chapter": "E3", "stem": "依據公寓大廈管理條例有關起造人之規定，下列敘述何者錯誤？", "options": ["公寓大廈建築物之起造人有召集第1次區分所有權人會議之義務", "公寓大廈建築物起造人要領得建造執照，始可辦理公寓大廈銷售", "公寓大廈建築物起造人負有移交共用部分等之義務及移交期限", "公寓大廈建築物之起造人於申請使用執照時，應檢附規約草約"], "answer": "D", "special": null}, {"id": 397, "year": 110, "qnum": 2, "chapter": "E5", "stem": "住戶違反公寓大廈管理條例第 9 條第 2 項關於公寓大廈變更使用限制規定，以下敘述何者錯誤？", "options": ["直轄市、縣（市）主管機關得令住戶限期改善；屆期不改善者，得連續處罰之", "住戶經制止而不遵從者，由直轄市、縣（市）主管機關處4萬元以上20萬元以下罰鍰", "管理委員會應予制止，並得按其性質請求各該主管機關為必要之處置。如有損害並得請求損害賠償", "由管理委員會促請住戶改善，住戶於3個月內仍未改善者，由管理委員會決議訴請法院強制其遷離"], "answer": "D", "special": null}, {"id": 398, "year": 110, "qnum": 3, "chapter": "E3", "stem": "依據公寓大廈管理條例規定，下列敘述何者正確？", "options": ["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物", "未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造", "住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用", "依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"], "answer": "B", "special": null}, {"id": 399, "year": 110, "qnum": 4, "chapter": "E3", "stem": "有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？", "options": ["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意", "約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限", "專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意", "共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"], "answer": "C", "special": null}, {"id": 400, "year": 110, "qnum": 5, "chapter": "E3", "stem": "下列何者不是公寓大廈管理委員會之職務？", "options": ["管理服務人之委任、僱傭及監督", "共用部分、約定專用部分及其附屬設施設備之點收及保管", "公寓大廈發生重大事故有及時處理之必要，請求召開區分所有權人臨時會議", "住戶違規情事之制止及相關資料之提供"], "answer": "B", "special": null}, {"id": 401, "year": 110, "qnum": 6, "chapter": "E3", "stem": "公寓大廈之區分所有權人因違反規約情節重大者，管理委員會如何要求區分所有權人出讓其區分所有權及其基地所有權應有部分？", "options": ["依管理委員會議之決議訴請法院命其強制出讓", "依區分所有權人會議之決議訴請法院命其強制出讓", "依管理委員會議之決議報請直轄市、縣（市）政府強制執行", "依區分所有權人會議之決議報請直轄市、縣（市）政府強制執行"], "answer": "B", "special": null}, {"id": 402, "year": 110, "qnum": 7, "chapter": "E3", "stem": "公寓大廈公共基金之來源及運用、管理方式，下列何者正確？", "options": ["起造人就公寓大廈領得建造執照一年內之管理維護事項，應按工程造價一定比例或金額提列為公共基金", "區分所有權人依管理委員會決議繳納公共基金", "公共基金經區分所有權人會議決議交付信託者，由管理委員會主任委員交付信託", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理"], "answer": "D", "special": null}, {"id": 403, "year": 110, "qnum": 8, "chapter": "A4", "stem": "依不動產經紀業管理條例規定，對經營仲介業務者申報登錄資訊之敘述，下列何者錯誤？", "options": ["經營仲介業務者對於仲介成交買賣案件之申報登錄案件，應於簽訂買賣契約書並辦竣所有權移轉登記後三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "經營仲介業務者對於經手所成交之租賃案件，應於簽訂租賃契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得向經營仲介業者要求查詢、取閱有關文件或提出說明", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得委任所屬機關辦理"], "answer": "A", "special": null}, {"id": 404, "year": 110, "qnum": 9, "chapter": "A3", "stem": "依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？", "options": ["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員", "領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員", "取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年", "不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"], "answer": "D", "special": null}, {"id": 405, "year": 110, "qnum": 10, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，經營代銷業務的公司甲，若有申報登錄價格、交易面積資訊不實之情形，直轄市、縣（市）主管機關得為何種處分？", "options": ["令公司甲限期改正並處新臺幣一萬元以上五萬元以下罰鍰", "令公司甲限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰", "按公司甲申報之戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰", "按違規情形，停止公司甲之營業處分或併科新臺幣三萬元以上十五萬元以下罰鍰"], "answer": "C", "special": null}, {"id": 406, "year": 110, "qnum": 11, "chapter": "A3", "stem": "有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？", "options": ["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書", "不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之", "不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年", "不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"], "answer": "B", "special": null}, {"id": 407, "year": 110, "qnum": 12, "chapter": "A4", "stem": "甲要委託 A 房仲介公司不動產經紀營業員乙銷售自己的一戶房子。依不動產經紀業管理條例，下列敘述何者正確？", "options": ["甲與乙一定要先口頭定約定委託銷售之事宜", "甲與A房仲介公司必須簽訂委託銷售契約書", "乙刊登廣告及銷售內容，應與事實大致相符", "乙刊登銷售房子廣告要註明營業員乙的名稱"], "answer": "B", "special": null}, {"id": 408, "year": 110, "qnum": 13, "chapter": "G1", "stem": "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者，應由何機關依法處理？", "options": ["由直轄市、縣（市）政府依公平交易法處理", "由行政院依消費者保護法處理", "由行政院公平交易委員會依公平交易法處理", "由內政部依不動產經紀業管理條例處理"], "answer": "D", "special": null}, {"id": 409, "year": 110, "qnum": 14, "chapter": "H3", "stem": "消費爭議調解委員會於不違反消費爭議兩造當事人之主要意思範圍內，依職權所提出解決事件之方案，當事人得於該方案送達後幾日內，提出異議，就視為調解不成立？", "options": ["10日", "15日", "20日", "30日"], "answer": "A", "special": null}, {"id": 410, "year": 110, "qnum": 15, "chapter": "H3", "stem": "依消費者保護法規定，下列有關消費者保護團體提起團體訴訟之敘述，何者錯誤？", "options": ["消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請內政部評定優良者，得以自己之名義提起訴訟", "消費者保護團體依規定提起訴訟者，應委任律師代理訴訟", "消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體得以自己之名義，提起第50條消費者損害賠償訴訟或第53條不作為訴訟"], "answer": "A", "special": null}, {"id": 411, "year": 110, "qnum": 16, "chapter": "H1", "stem": "依消費者保護法規定，下列有關通訊交易或訪問交易之消費者解除契約之敘述，何者正確？", "options": ["消費者得於收受商品或接受服務後十日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用", "訪問交易有合理例外情事者，不適用消費者保護法之猶豫期間及解約權規定", "消費者依規定以書面通知解除契約者，除當事人另有個別磋商外，企業經營者應於收到通知之次日起十五日內，至原交付處所或約定處所取回商品", "企業經營者應於取回商品、收到消費者退回商品或解除服務契約通知之日起十五日內，返還消費者已支付之對價"], "answer": "C", "special": null}, {"id": 412, "year": 110, "qnum": 17, "chapter": "H1", "stem": "定型化契約中之定型化契約條款於下列何種情形下，其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容？", "options": ["定型化契約條款違反誠信原則，對消費者顯失公平", "定型化契約條款牴觸個別磋商條款之約定", "企業經營者與消費者訂立定型化契約前，未依法提供合理期間，供消費者審閱全部條款內容", "企業經營者以定型化契約條款使消費者拋棄契約審閱權利"], "answer": "C", "special": null}, {"id": 413, "year": 110, "qnum": 18, "chapter": "H3", "stem": "依消費者保護法規定，各類企業經營者對消費者應負之損害賠償責任，下列敘述何者錯誤？", "options": ["輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負製造者責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任"], "answer": "A", "special": null}, {"id": 414, "year": 110, "qnum": 19, "chapter": "H3", "stem": "依消費者保護法規定，關於小額消費爭議之調解，當事人之一方無正當理由，不於調解期日到場之處理方式為何？", "options": ["調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意"], "answer": "D", "special": null}, {"id": 415, "year": 110, "qnum": 20, "chapter": "G1", "stem": "下列何者屬於公平交易法之適用範圍？", "options": ["依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之正當行為", "不動產仲介業與不動產買方有關斡旋金返還之糾紛處理", "不動產開發業者銷售預售屋時要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱之情形", "不動產經紀業加盟店未於廣告中標明加盟店或加盟經營字樣之處理"], "answer": "C", "special": null}, {"id": 416, "year": 110, "qnum": 21, "chapter": "G1", "stem": "下列有關公平交易法對於事業聯合行為規定之敘述，何者錯誤？", "options": ["主管機關對事業聯合行為原則上是採限制原則", "主管機關對事業聯合行為有益於整體經濟與公共利益時得例外許可", "主管機關對事業聯合行為之許可事項得附加條件", "主管機關對事業聯合行為許可事項及其有關之條件、負擔、期限，應主動公開"], "answer": "A", "special": null}, {"id": 417, "year": 110, "qnum": 22, "chapter": "G1", "stem": "不動產經紀業者倘與具競爭關係之事業，以契約、協議共同決定服務之價格、交易對象、交易地區等相互約束事業活動之行為，而足以影響服務供需之市場功能者，將構成公平交易法之何種行為？", "options": ["不公平競爭", "聯合行為", "欺罔或顯失公平", "違法結合"], "answer": "B", "special": null}, {"id": 418, "year": 110, "qnum": 23, "chapter": "A4", "stem": "經營代銷業務者，依不動產經紀業管理條例之規定，應指派不動產經紀人簽章之文件，下列何者錯誤？", "options": ["不動產廣告稿", "不動產出租、出售委託契約書", "不動產租賃、買賣契約書", "不動產說明書"], "answer": "B", "special": null}, {"id": 419, "year": 110, "qnum": 24, "chapter": "G1", "stem": "有關公平交易法第 22 條對於事業仿冒行為要件之規定，下列敘述何者錯誤？", "options": ["所使用之名稱或表徵必須達到著名之程度", "相同或近似之名稱或表徵必須使用於同一或類似的服務", "公司名稱或營業服務表徵限於依法取得註冊商標權者", "必須產生與他人提供之服務設施或活動混淆的結果"], "answer": "C", "special": null}, {"id": 420, "year": 110, "qnum": 25, "chapter": "G2", "stem": "依公平交易法規定，廣告相關業者與廣告主之間對於不實廣告應負之損害賠償責任，下列何者錯誤？", "options": ["專業人士或機構之廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任", "非屬知名公眾人物之廣告薦證者不知情其所從事之薦證有引人錯誤之虞，仍為薦證者，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任", "廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與廣告主負連帶損害賠償責任", "廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任"], "answer": "B", "special": null}, {"id": 421, "year": 111, "qnum": 1, "chapter": "A2", "stem": "依不動產經紀業管理條例規定，不動產經紀業得請求退還原繳存之營業保證金之情形，不包含那一項？", "options": ["公司組織申請解散者", "商號組織申請歇業者", "營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者", "退出所在地或鄰近直轄市或縣（市）仲介經紀業同業公會"], "answer": "D", "special": null}, {"id": 422, "year": 111, "qnum": 2, "chapter": "A3", "stem": "不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？", "options": ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "經紀人證書有效期限為三年", "經紀營業員訓練不得少於三十個小時", "未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"], "answer": "C", "special": null}, {"id": 423, "year": 111, "qnum": 3, "chapter": "A4", "stem": "依不動產經紀業管理條例之規定，經營仲介業務者應揭示於營業處所明顯之處的文件，不包含那一項？", "options": ["不動產經紀人員之經歷與獲獎資料", "不動產經紀人證書", "報酬標準及收取方式", "仲介相關證照及許可文件"], "answer": "A", "special": null}, {"id": 424, "year": 111, "qnum": 4, "chapter": "A4", "stem": "依不動產經紀業管理條例之規定，雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由何人在不動產說明書上簽章？", "options": ["不動產經紀人", "相對人", "地政士", "公司代表人"], "answer": "B", "special": null}, {"id": 425, "year": 111, "qnum": 5, "chapter": "A5", "stem": "依不動產經紀業管理條例關於獎懲之規定，下列敘述何者錯誤？", "options": ["非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處公司負責人、商號負責人或行為人罰鍰", "經紀業開始營業後自行停止營業連續六個月以上者，直轄市或縣（市）主管機關得廢止其許可", "中央主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之", "依本條例所處罰鍰，經通知繳納而逾期不繳納者，移送法院強制執行"], "answer": "C", "special": null}, {"id": 426, "year": 111, "qnum": 6, "chapter": "G1", "stem": "依公平交易法之規定，下列定義何者錯誤？", "options": ["競爭指一以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為", "相關市場指事業就一定之商品或服務，從事競爭之區域或範圍", "交易相對人指與事業進行或成立交易之供給者或需求者", "事業所組成之同業公會視為本法所稱事業"], "answer": "A", "special": null}, {"id": 427, "year": 111, "qnum": 7, "chapter": "G1", "stem": "公平交易法關於結合之規定，下列敘述何者錯誤？", "options": ["直接或間接控制他事業之業務經營或人事任免屬於結合之一種", "事業因結合而使其市場占有率達四分之一應先向主管機關提出申報", "對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合", "主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見"], "answer": "B", "special": null}, {"id": 428, "year": 111, "qnum": 8, "chapter": "G2", "stem": "甲建商為廣告主，委託乙廣告代理業製作廣告，請來丙明星擔任廣告薦證者，在丁廣告媒體業之電子媒體刊登引人錯誤之廣告，下列敘述何者錯誤？", "options": ["乙廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與甲建商負連帶損害賠償責任", "甲建商不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵", "丙明星明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與乙廣告代理業負連帶損害賠償責任", "丁廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與甲建商負連帶損害賠償責任"], "answer": "C", "special": null}, {"id": 429, "year": 111, "qnum": 9, "chapter": "G1", "stem": "主管機關收到對於涉有違反公平交易法規定之檢舉，而發動調查得進行之程序敘述，何者錯誤？", "options": ["通知當事人及關係人到場陳述意見", "通知當事人及關係人提出帳冊、文件及其他必要之資料或證物", "派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償"], "answer": "D", "special": null}, {"id": 430, "year": 111, "qnum": 10, "chapter": "G1", "stem": "當事人對主管機關依公平交易法所為之處分或決定不服者，應如何處理？", "options": ["直接適用行政訴訟程序", "依訴願法提起訴願", "對主管機關提出民事訴訟", "直接適用國家賠償程序"], "answer": "A", "special": null}, {"id": 431, "year": 111, "qnum": 11, "chapter": "H1", "stem": "企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約，依消費者保護法之規定，屬於下列何者之定義？", "options": ["通訊交易", "定型化契約", "訪問交易", "個別磋商契約"], "answer": "C", "special": null}, {"id": 432, "year": 111, "qnum": 12, "chapter": "H3", "stem": "甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費者保護法之規定，乙可以如何主張權利？", "options": ["要求甲建商回收該批商品或停止其服務", "主張甲建商應負損害賠償責任", "主張除去其危害", "主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"], "answer": "D", "special": null}, {"id": 433, "year": 111, "qnum": 13, "chapter": "H1", "stem": "中央主管機關得擬訂特定行業定型化契約應記載或不得記載事項。下列應記載或不得記載事項之敘述何者錯誤？", "options": ["中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容", "違反中央主管機關公告之定型化契約應記載或不得記載事項之定型化契約，其定型化契約條款無效", "企業經營者使用定型化契約者，主管機關得隨時派員查核", "不得記載事項得包括預付型交易之履約擔保"], "answer": "D", "special": null}, {"id": 434, "year": 111, "qnum": 14, "chapter": "H3", "stem": "企業經營者與消費者簽訂定型化之分期付款買賣契約，依消費者保護法規定，該契約書應載明之事項不包含下列那一項？", "options": ["頭期款", "企業經營者保留契約內容或期限之變更權或解釋權", "各期價款與其他附加費用合計之總價款與現金交易價格之差額", "利率"], "answer": "B", "special": null}, {"id": 435, "year": 111, "qnum": 15, "chapter": "H3", "stem": "企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？", "options": ["七日", "十日", "十五日", "三十日"], "answer": "C", "special": null}, {"id": 436, "year": 111, "qnum": 16, "chapter": "H3", "stem": "企業經營者在提供契約條款供他人參考時，下列那一種表示內容不會屬於定型化契約條款之一部分？", "options": ["以書面傳真提供給單一個別客戶之優惠條款內容", "以電視字幕放映提供之廣告字幕", "以書面產品型錄提供之內容", "以網際網路提供之廣告資訊"], "answer": "A", "special": null}, {"id": 437, "year": 111, "qnum": 17, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，下列之定義何者正確？", "options": ["約定專用部分：指公寓大廈專有部分經約定供共同使用者", "管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司", "專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權", "公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"], "answer": "D", "special": null}, {"id": 438, "year": 111, "qnum": 18, "chapter": "E1", "stem": "公寓大廈共用部分不得獨立使用供做專有部分。依公寓大廈管理條例之規定，其為特定情形者，並不得為約定專用部分。下列情形非屬前述之特定情形？", "options": ["公寓大廈本身所占之地面", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之專用部分", "連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄"], "answer": "C", "special": null}, {"id": 439, "year": 111, "qnum": 19, "chapter": "E1", "stem": "依公寓大廈管理條例之規定，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用，至少逾多少期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息？", "options": ["一期", "二期", "三期", "六期"], "answer": "B", "special": null}, {"id": 440, "year": 111, "qnum": 20, "chapter": "E4", "stem": "規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列敘述何者非屬之？", "options": ["違反義務之處理方式", "禁止住戶飼養動物之特別約定", "財務運作之監督規定", "他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"], "answer": "D", "special": null}, {"id": 441, "year": 111, "qnum": 21, "chapter": "H1", "stem": "下列有關定型化契約條款敘述中那幾項是正確的？①企業經營者在定型化契約中所用之定型化契約條款如有疑義時，條款內容應本公平之解釋，不應偏向企業經營者或消費者 ②企業經營者在與消費者訂立定型化契約前，須至少提供三十日以內之合理審閱期間，供消費者審閱全部條款內容 ③企業經營者以定型化契約條款訂定之使消費者拋棄合理審閱期間之條款為有效條款④定型化契約中之主要權利或義務條款，因受條款之限制，致契約之目的難以達成者顯失公平，故為無效。", "options": ["②③", "①③", "②④", "①②④"], "answer": "C", "special": null}, {"id": 442, "year": 111, "qnum": 22, "chapter": "H3", "stem": "依消費者保護法第 17 條之規定，定型化契約應記載事項，依契約之性質及目的，其內容不包括下列那一項？", "options": ["預付型交易之履約擔保", "企業經營者之義務或責任之免除", "契約之終止權", "違反契約之法律效果"], "answer": "B", "special": null}, {"id": 443, "year": 111, "qnum": 23, "chapter": "G1", "stem": "如果有一交易違反公平交易法，下列有關於行使損害賠償之敘述何者正確？", "options": ["自此一交易日起二年不行使請求權，請求權時效消滅", "被害人不論何時得知損害，自得知之日起逾二年不行使請求權，請求權時效消滅", "自此一交易日起逾十年，請求權時效消滅", "被害人自此一交易日起，其請求權之行使沒有時效限制"], "answer": "C", "special": null}, {"id": 444, "year": 111, "qnum": 24, "chapter": "A5", "stem": "對經紀人違反不動產經紀業管理條例規定之懲戒，下列何者正確？", "options": ["經紀人員違反規定收取差價或其他報酬，應予申誡", "經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說，應予申誡", "經紀人員無故洩漏對於因業務知悉或持有之他人秘密，應予六個月以上三年以下之停止執行業務處分", "經紀人員受申誡處分三次者，應廢止其經紀人員證書或證明"], "answer": "B", "special": null}, {"id": 445, "year": 111, "qnum": 25, "chapter": "A5", "stem": "經紀業尚未與委託人簽訂委託契約書便刊登廣告及銷售時，依規定由直轄市、縣（市）主管機關處多少罰鍰？", "options": ["新臺幣六千元以上三萬元以下罰鍰", "新臺幣一萬元以上五萬元以下罰鍰", "新臺幣三萬元以上十五萬元以下罰鍰", "新臺幣六萬元以上三十萬元以下罰鍰"], "answer": "D", "special": null}, {"id": 446, "year": 112, "qnum": 1, "chapter": "A5", "stem": "有關不動產經紀業營業保證金之敘述，下列何者錯誤？", "options": ["營業保證金由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存", "經紀業未依規定繳存營業保證金者，應予停止營業處分，其停止營業期間達一年者，應撤銷其許可", "營業保證金獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押、抵銷或設定負擔", "經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"], "answer": "B", "special": null}, {"id": 447, "year": 112, "qnum": 2, "chapter": "A3", "stem": "有關外國人任職不動產經紀業之規定，下列何者正確？", "options": ["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試", "經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可", "經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"], "answer": "C", "special": null}, {"id": 448, "year": 112, "qnum": 3, "chapter": "A4", "stem": "經營代銷業務者，下列何種文件不適用經紀業指派經紀人簽章規定？", "options": ["不動產說明書", "不動產廣告稿", "不動產租賃、買賣契約書", "不動產出租、出售委託契約書"], "answer": "D", "special": null}, {"id": 449, "year": 112, "qnum": 4, "chapter": "C4", "stem": "有關不動產說明書之敘述，下列何者正確？", "options": ["不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，不動產說明書應由經紀業指派經紀營業員簽章", "經紀人員應以不動產說明書向與委託人交易之相對人解說。提供解說前，應經委託人交易之相對人簽章", "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人", "不動產說明書應記載及不得記載事項，由所在地主管機關定之"], "answer": "C", "special": null}, {"id": 450, "year": 112, "qnum": 5, "chapter": "A4", "stem": "根據不動產經紀業管理條例第 24 條之 1 之現行規定，下列何者正確？", "options": ["中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，維持以區段化、去識別化方式，提供查詢", "中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，應依同條第三項規定，除涉及個人資料外，重新提供查詢", "經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂買賣契約之日起三十日內，將委託代銷契約及買賣契約相關書件報請所在地直轄市、縣（市）主管機關備查", "經營仲介業務者，對於居間或代理成交之租賃案件，應於租賃物交付後，承租人占有中之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊"], "answer": "B", "special": null}, {"id": 451, "year": 112, "qnum": 6, "chapter": "A2", "stem": "不動產經紀業管理條例之「用辭定義」，下列何者正確？", "options": ["不動產︰指土地、土地定著物或房屋及其可移轉之權利", "成屋︰指領有建造執照之建築物", "經紀人員︰經紀營業員之職務為執行仲介或代銷業務", "營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"], "answer": "A", "special": null}, {"id": 452, "year": 112, "qnum": 7, "chapter": "A1", "stem": "依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？", "options": ["報請所在地主管機關核定", "報請所在地主管機關備查", "報請所在地主管機關層轉中央主管機關核定", "報請所在地主管機關層轉中央主管機關備查"], "answer": "D", "special": null}, {"id": 453, "year": 112, "qnum": 8, "chapter": "E1", "stem": "有關公寓大廈周圍上下、外牆面設置防墜設施之規定，下列何者錯誤？", "options": ["須公寓大廈有十二歲以下兒童或六十歲以上老人之住戶", "須於外牆開口部或陽臺設置", "防墜設施須不妨礙逃生且不突出外牆面", "防墜設施設置後，設置理由消失且不符公寓大廈管理條例之限制者，區分所有權人應予改善或回復原狀"], "answer": "A", "special": null}, {"id": 454, "year": 112, "qnum": 9, "chapter": "E3", "stem": "依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？", "options": ["住戶大會決議事項之執行", "住戶違規情事之制止及相關資料之提供", "共有及共用部分之清潔、維護、重大修繕及改良", "住戶共同事務應興革事項之決定與管理"], "answer": "B", "special": null}, {"id": 455, "year": 112, "qnum": 10, "chapter": "E3", "stem": "有關公寓大廈公共基金之設置，下列何者錯誤？", "options": ["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列", "起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理", "公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"], "answer": "B", "special": null}, {"id": 456, "year": 112, "qnum": 11, "chapter": "E1", "stem": "依公寓大廈管理條例規定，有關起造人責任之敘述，下列何者錯誤？", "options": ["就公寓大廈領得使用執照一年內之管理維護事項，起造人應按工程造價一定比例或金額提列公共基金", "公寓大廈之起造人，非經領得建造執照，不得辦理銷售", "公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約", "起造人應將公寓大廈共用部分、約定共用部分與其附屬設施設備等，確認其功能正常無誤後，移交管理委員會或管理負責人"], "answer": "C", "special": null}, {"id": 457, "year": 112, "qnum": 12, "chapter": "E2", "stem": "關於公寓大廈住戶之權利義務，下列何者正確？", "options": ["區分所有權人除法律另有限制外，對其共有部分，得自由使用、收益、處分，並排除他人干涉", "區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉，但設定負擔則可分別為之", "於住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用他住戶專有部分或約定專用部分時，應經管理負責人或管理委員會之同意後方得為之"], "answer": "B", "special": null}, {"id": 458, "year": 112, "qnum": 13, "chapter": "E1", "stem": "關於公寓大廈管理維護公司之執業，下列何者正確？", "options": ["應經直轄市、縣（市）政府許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經直轄市、縣（市）政府許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業"], "answer": "D", "special": null}, {"id": 459, "year": 112, "qnum": 14, "chapter": "G1", "stem": "採加盟經營方式之不動產經紀業者如以不正當限制加盟店服務報酬標準，作為成立或持續加盟經營關係之條件，而有限制競爭之虞者，屬於下列何種違反公平交易法之情事？", "options": ["以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能，構成公平交易法之聯合行為", "以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為", "以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "answer": "A", "special": null}, {"id": 460, "year": 112, "qnum": 15, "chapter": "G1", "stem": "下列何者應以公平交易法之規定處理？", "options": ["不動產經紀業加盟店，未於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣者", "不動產經紀業者對於涉及事業服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者", "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者", "不動產經紀業者未依成屋買賣定型化契約書應記載及不得記載事項製作契約書者"], "answer": "B", "special": null}, {"id": 461, "year": 112, "qnum": 16, "chapter": "G1", "stem": "下列何者屬於限制競爭之行為，事業不得為之？", "options": ["以著名之他人姓名、商號或公司名稱於同一或類似之商品，為相同或近似之使用，致與他人商品混淆", "事業為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事", "事業以不當提供贈品、贈獎之方法，爭取交易之機會", "無正當理由，對他事業給予差別待遇之行為"], "answer": "D", "special": null}, {"id": 462, "year": 112, "qnum": 17, "chapter": "G1", "stem": "關於聯合行為，下列何者正確？", "options": ["事業不得為聯合行為。但為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式，有益於個別經濟與股東利益，經申請主管機關許可者，不在此限", "許可應附期限，其期限不得逾三年", "事業對於主管機關就其聯合行為之許可及其有關之條件、負擔、期限，應主動公開", "聯合行為經許可後，因經濟情況變更者，主管機關得廢止該許可"], "answer": "D", "special": null}, {"id": 463, "year": 112, "qnum": 18, "chapter": "G1", "stem": "主管機關對於事業涉有違反公平交易法規定之行為進行調查時，下列何者正確？", "options": ["事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得終止調查", "主管機關作成中止調查之決定係基於事業提供不完整或不真實之資訊，應恢復調查", "裁處權時效自終止調查之日起，停止進行", "主管機關恢復調查者，裁處權時效自恢復調查之翌日起，重新起算"], "answer": "B", "special": null}, {"id": 464, "year": 112, "qnum": 19, "chapter": "G1", "stem": "關於事業以不當提供贈品、贈獎之方法，爭取交易之機會，下列何者正確？", "options": ["構成獨占地位之濫用", "構成事業之結合", "構成限制轉售價格", "構成不公平競爭"], "answer": "D", "special": null}, {"id": 465, "year": 112, "qnum": 20, "chapter": "H2", "stem": "有關消費資訊之規範，依消費者保護法規定，下列何者錯誤？", "options": ["企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容", "企業經營者之商品或服務廣告內容，於契約成立後，應確實履行", "媒體經營者刊登或報導廣告之內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任", "輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略"], "answer": "C", "special": null}, {"id": 466, "year": 112, "qnum": 21, "chapter": "H1", "stem": "依消費者保護法規定，有關定型化契約應記載或不得記載事項之規定，下列何者正確？", "options": ["應公告後報請行政院備查", "中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂之", "違反公告之定型化契約，其定型化契約條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容", "中央主管機關公告應記載之事項，雖未記載於定型化契約，經消費者主張，仍構成契約之內容"], "answer": "B", "special": null}, {"id": 467, "year": 112, "qnum": 22, "chapter": "H3", "stem": "消費者保護團體依消費者保護法提起消費者損害賠償訴訟之要件，下列何者正確？", "options": ["消費者保護團體許可設立三年以上", "消費者保護團體申請行政院評定優良者", "得委任律師代理訴訟", "消費者保護團體不得向消費者請求報酬，但得請求預付或償還必要費用"], "answer": "B", "special": null}, {"id": 468, "year": 112, "qnum": 23, "chapter": "H3", "stem": "依消費者保護法之規定，關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，下列何者錯誤？", "options": ["調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，此方案應經參與調解委員過半數之同意", "該解決方案之送達，不適用公示送達規定", "當事人對該解決方案，得於送達後十日之不變期間內，提出異議；未於異議期間內提出異議者，視為已依該解決方案成立調解", "當事人於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，視為依該解決方案成立調解"], "answer": "A", "special": null}, {"id": 469, "year": 112, "qnum": 24, "chapter": "H3", "stem": "關於輸入商品或服務之企業經營者，下列何者錯誤？", "options": ["視為該商品之設計、生產、製造者或服務之提供者", "於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性", "消費者保護團體主張企業經營者不符合當時科技或專業水準可合理期待之安全性者，就其事實應負舉證責任", "企業經營者違反相關規定，致生損害於消費者或第三人時，應負連帶賠償責任"], "answer": "C", "special": null}, {"id": 470, "year": 112, "qnum": 25, "chapter": "H3", "stem": "關於消費者保護團體，下列何者正確？", "options": ["消費者保護團體以社團法人、財團法人或行政法人為限", "消費者保護團體之任務為監督消費者保護主管機關及指揮消費者保護官行使職權", "消費者保護團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會", "消費者保護團體為商品或服務之調查、檢驗時，請求政府予以協助時，政府不應允許"], "answer": "C", "special": null}, {"id": 471, "year": 113, "qnum": 1, "chapter": "A4", "stem": "不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何者與不動產經紀業管理條例之規定不符？", "options": ["不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "經紀人員於提供解說後，應將不動產說明書交由委託人簽章", "雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"], "answer": "C", "special": null}, {"id": 472, "year": 113, "qnum": 2, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，中華民國國民經不動產經紀人考試及格並領有不動產經紀人證書者，得充不動產經紀人。下列有關不動產經紀人證書之敘述，何者正確？", "options": ["經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向考試院考選部請領不動產經紀人證書", "不動產經紀人證書有效期限為四年，期滿時，經紀人應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體辦理換證", "不動產經紀人受申誡處分三次者，應廢止其經紀人證書", "不動產經紀人受監護宣告成為無行為能力人，應廢止其經紀人證書"], "answer": "D", "special": null}, {"id": 473, "year": 113, "qnum": 3, "chapter": "A5", "stem": "經紀人員違反業務規範時，應負之法律責任，下列敘述何者錯誤？", "options": ["未經所屬經紀業同意為他經紀業執行業務，而為自己或他經紀業執行仲介或代銷業務者，應予以六個月以上三年以下之停止執行業務之懲戒處分", "在執行業務過程中，未向與委託人交易之相對人解說不動產說明書之內容者，應予申誡", "對於因業務知悉或持有之他人秘密，無故洩漏者，應予申誡", "執行業務因故意或過失不法侵害交易當事人致其受有損害者，應與經紀業負連帶賠償責任"], "answer": "A", "special": null}, {"id": 474, "year": 113, "qnum": 4, "chapter": "E3", "stem": "有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？", "options": ["專有部分之修繕，由各該區分所有權人為之，並負擔其費用", "共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之", "共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定", "共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"], "answer": "C", "special": null}, {"id": 475, "year": 113, "qnum": 5, "chapter": "E3", "stem": "按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？", "options": ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定", "共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用", "共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定", "共用部分之拆除，應依區分所有權人會議之決議為之"], "answer": "C", "special": null}, {"id": 476, "year": 113, "qnum": 6, "chapter": "E3", "stem": "某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第 30 條及第 31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？", "options": ["因未經全體區分所有權人之同意，該公寓社區不得進行重建", "管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分", "管理負責人或管理委員會得訴請法院將甲強制遷離", "管理負責人或管理委員會得請求主管機關為必要之處置"], "answer": "B", "special": null}, {"id": 477, "year": 113, "qnum": 7, "chapter": "E3", "stem": "依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"], "answer": "A", "special": null}, {"id": 478, "year": 113, "qnum": 8, "chapter": "D2", "stem": "內政部公告之「預售屋買賣定型化契約應記載及不得記載事項」及「不動產說明書應記載或不得記載事項（預售屋部分）」，均要求預售屋之買賣須具備履約擔保制度。試問：由建商或起造人將建案土地及興建資金信託予某金融機構或經政府許可之信託業者執行履約管理。興建資金應依工程進度專款專用。簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。此係屬何種履約擔保？", "options": ["不動產開發信託", "價金返還保證", "價金信託", "同業連帶擔保"], "answer": "A", "special": null}, {"id": 479, "year": 113, "qnum": 9, "chapter": "H3", "stem": "甲建商於預售屋銷售廣告單中表示：  「現場簽約，贈送德國進口高級廚衛設備」  。首次購屋者乙於建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？", "options": ["廣告係要約引誘，對甲並不具拘束力", "廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力", "廣告內容即為契約內容，於契約成立後，甲應確實履行", "甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"], "answer": "C", "special": null}, {"id": 480, "year": 113, "qnum": 10, "chapter": "G1", "stem": "下列關於公平交易法之敘述，何者錯誤？", "options": ["維護消費者利益為本法立法目的之一", "依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定", "事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，不在此限", "本法規定事項，涉及其他部會之職掌者，由主管機關商同各該部會辦理之"], "answer": "B", "special": null}, {"id": 481, "year": 113, "qnum": 11, "chapter": "G1", "stem": "不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法第 25 條「其他足以影響交易秩序之欺罔或顯失公平之行為」？", "options": ["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」", "向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還", "要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱", "締結預售屋買賣契約後，要求繳回契約書"], "answer": "B", "special": null}, {"id": 482, "year": 113, "qnum": 12, "chapter": "G1", "stem": "不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，應由公平交易委員會依公平交易法相關規定辦理？", "options": ["散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格", "違規潛銷預售屋（未領得建造執照即廣告銷售）", "利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛偽交易，營造不動產交易活絡之表象", "對服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者"], "answer": "D", "special": null}, {"id": 483, "year": 113, "qnum": 13, "chapter": "G1", "stem": "事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？", "options": ["停止營業", "限期令分設事業", "處分全部或部分股份", "轉讓部分營業"], "answer": "A", "special": null}, {"id": 484, "year": 113, "qnum": 14, "chapter": "G1", "stem": "公平交易法原則禁止事業為聯合行為，但有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。不動產經紀業者相互間之何種聯合行為應予以禁止，不在得申請公平交易委員會許可之列？", "options": ["共同劃分經營區域、共同劃分交易對象", "為降低成本、改良品質或增進效率，而統一服務之規格或型式", "為促進事業合理經營，而分別作專業發展", "為促進產業發展、技術創新或經營效率所必要之共同行為"], "answer": "A", "special": null}, {"id": 485, "year": 113, "qnum": 15, "chapter": "A4", "stem": "有關不動產經紀業廣告，下列敘述何者正確？", "options": ["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章", "主打買地送屋，實際卻沒有房屋處分權", "廣告及相關銷售文宣註明不動產經紀業名稱", "廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"], "answer": "C", "special": null}, {"id": 486, "year": 113, "qnum": 16, "chapter": "G1", "stem": "下列何者不違反公平交易法第 21 條廣告不實？", "options": ["不動產代銷業者於售屋網站公告35米泳池，而該泳池設置處於竣工圖為景觀水池", "不動產代銷業者於售屋廣告，標示近捷運站", "不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明", "不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"], "answer": "B", "special": null}, {"id": 487, "year": 113, "qnum": 17, "chapter": "G1", "stem": "甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10 萬元斡旋，可保留優先購買之權利，於是甲支付 10 萬元，並簽訂「不動產購買意願書」 ，下列何者錯誤？", "options": ["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用", "斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用", "如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務", "仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25條之規定"], "answer": "A", "special": null}, {"id": 488, "year": 113, "qnum": 18, "chapter": "A5", "stem": "不動產經紀業違反不動產經紀業管理條例相關規定時，下列何種情形，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正，始處一定金額之罰鍰？", "options": ["設立之營業處所未置經紀人", "僱用未具備經紀人員資格者從事仲介或代銷業務", "收取差價或其他報酬", "未將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處"], "answer": "D", "special": null}, {"id": 489, "year": 113, "qnum": 19, "chapter": "A4", "stem": "不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載「已確實攜回本契約書審閱 5 日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須 5 日以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？", "options": ["有效", "無效", "效力未定", "部分有效，部分無效"], "answer": "B", "special": null}, {"id": 490, "year": 113, "qnum": 20, "chapter": "D2", "stem": "預售屋買賣定型化契約應記載及不得記載事項規定，接通自來水、電力之管線費及其相關費用（例如安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等）應由誰負擔？", "options": ["賣方", "買方", "買賣雙方平均分配", "買賣雙方議定"], "answer": "A", "special": null}, {"id": 491, "year": 113, "qnum": 21, "chapter": "H1", "stem": "下列何者不是定型化契約條款推定顯失公平之情形？", "options": ["違反平等互惠原則者", "條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者", "契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者", "定型化契約中之定型化契約條款牴觸個別磋商條款之約定者"], "answer": "D", "special": null}, {"id": 492, "year": 113, "qnum": 22, "chapter": "E1", "stem": "1 樓露台屬於全體住戶共有，為了有效利用露台空間，住戶間常會將露台給該特定住戶使用，此露台稱為？", "options": ["專有部分", "共用部分", "約定專用部分", "約定共用部分"], "answer": "C", "special": null}, {"id": 493, "year": 113, "qnum": 23, "chapter": "E4", "stem": "大樓規約約定 1 樓露台屬於 1 樓甲使用，嗣後 3 樓所有權人乙將其房地產權出售並過戶給丙，請問該規約對丙繼受人有無效力？", "options": ["依公寓大廈管理條例第24條規定，區分所有權之繼受人丙，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項", "丙未在規約簽章，對其不生效力", "丙不知有該規約約定，對其不生效力", "該規約僅能拘束原區分所有權人乙"], "answer": "A", "special": null}, {"id": 494, "year": 113, "qnum": 24, "chapter": "E2", "stem": "3 樓住戶因浴室漏水，經抓漏後發現是 3、4 樓樓地板內之管線自然損壞導致漏水，請問修繕費用由誰負擔？", "options": ["3樓", "4樓", "3、4樓之住戶共同負擔", "3、4樓之區分所有權人共同負擔"], "answer": "D", "special": null}, {"id": 495, "year": 113, "qnum": 25, "chapter": "E2", "stem": "依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？", "options": ["原則可以，但社區管委會有權禁止住戶飼養動物", "原則可以，但規約另有禁止飼養之規定時，則依規約約定", "原則禁止，但社區管委會有權開放住戶飼養動物", "原則禁止，但規約有權開放住戶飼養動物"], "answer": "B", "special": null}, {"id": 496, "year": 114, "qnum": 1, "chapter": "E3", "stem": "公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？", "options": ["依區分所有權人會議決議", "公寓大廈管理委員會", "頂樓住戶", "頂樓住戶和管理委員會共同負責"], "answer": "B", "special": null}, {"id": 497, "year": 114, "qnum": 2, "chapter": "E3", "stem": "舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？", "options": ["管理委員選任之事項", "公共區域禁止吸煙之事項", "公共設施緊急維修之事項", "調整收取社區管理費之事項"], "answer": "A", "special": null}, {"id": 498, "year": 114, "qnum": 3, "chapter": "E3", "stem": "依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？", "options": ["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定", "管理委員會會議得決議各管理委員任期為1年或2年", "主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次", "管理委員會的各管理委員之任期屆滿，連選得連任"], "answer": "C", "special": null}, {"id": 499, "year": 114, "qnum": 4, "chapter": "E3", "stem": "甲在公寓大廈 1 樓開店營業，向管理委員會表示想要於該大樓 1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？", "options": ["管理委員會開會同意", "管理委員會會議及區分所有權人會議決議同意", "2樓區分所有權人同意", "區分所有權人會議決議同意及1樓、2樓區分所有權人同意"], "answer": "D", "special": null}, {"id": 500, "year": 114, "qnum": 5, "chapter": "H3", "stem": "依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。該保證書應載明之事項中，不包括那一項？", "options": ["商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號", "保證期間及其起算方法", "由經銷商售出者，經銷商之名稱、地址", "各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "answer": "D", "special": null}, {"id": 501, "year": 114, "qnum": 6, "chapter": "H2", "stem": "訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？", "options": ["消費者行使解除權，唯有直接退回商品給企業經營者之方式", "經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約", "消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款", "消費者行使解除權的7天猶豫期，可以以特約排除猶豫期間"], "answer": "C", "special": null}, {"id": 502, "year": 114, "qnum": 7, "chapter": "G1", "stem": "甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？", "options": ["公平交易法", "平均地權條例", "消費者保護法", "不動產經紀業管理條例"], "answer": "B", "special": null}, {"id": 503, "year": 114, "qnum": 8, "chapter": "G1", "stem": "公平交易法有關事業間聯合行為之敘述，下列何者錯誤？", "options": ["行為主體須為二以上彼此具競爭關係之同一產銷階段事業", "事業間具有以契約
