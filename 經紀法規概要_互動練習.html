<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規概要｜題庫互動練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F8F3E9;
  --paper-dark: #EFE7D6;
  --ink: #2A2722;
  --vermillion: #A8402B;
  --gold: #BC8A2E;
  --green: #4C6B43;
  --line: #D9CFB8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  line-height: 1.7;
}
.app { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }
h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: 1.5rem;
  text-align: center;
  margin: 12px 0 4px;
  letter-spacing: .05em;
}
.subtitle {
  text-align: center;
  font-size: .8rem;
  color: #6b6354;
  margin-bottom: 18px;
}
.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(42,39,34,.05);
}
.stats-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 14px;
}
.stat-chip {
  background: var(--paper-dark);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: .78rem;
  font-weight: 600;
}
.stat-chip b { color: var(--vermillion); }
.section-label {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  font-size: .95rem;
  margin-bottom: 8px;
  color: var(--ink);
  border-left: 4px solid var(--vermillion);
  padding-left: 8px;
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.chap-chip {
  border: 1px solid var(--line);
  background: var(--paper-dark);
  border-radius: 16px;
  padding: 5px 10px;
  font-size: .72rem;
  cursor: pointer;
  font-weight: 600;
  user-select: none;
  white-space: nowrap;
}
.chap-chip.active { background: var(--vermillion); color: #fff; border-color: var(--vermillion); }
.chap-chip .cnt { opacity: .65; font-weight: 400; }
.btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
button {
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: .88rem;
  cursor: pointer;
  transition: transform .1s;
}
button:active { transform: scale(.97); }
.btn-primary { background: var(--vermillion); color: #fff; flex: 1; min-width: 140px; }
.btn-secondary { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); }
.btn-mini { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: .76rem; }

#quizArea { display: none; }
.progress-bar-wrap {
  background: var(--paper-dark);
  border-radius: 6px;
  height: 8px;
  overflow: hidden;
  margin-bottom: 10px;
}
.progress-bar-fill { background: var(--gold); height: 100%; transition: width .25s; }
.q-meta {
  display: flex;
  justify-content: space-between;
  font-size: .76rem;
  color: #807660;
  margin-bottom: 10px;
  font-weight: 600;
}
.q-stem {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 16px;
  white-space: pre-wrap;
}
.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 9px;
  cursor: pointer;
  font-size: .92rem;
  background: #fff;
}
.opt:hover { border-color: var(--gold); }
.opt .label {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  color: var(--vermillion);
  flex-shrink: 0;
}
.opt.selected { border-color: var(--gold); background: #FBF3E0; }
.opt.correct { border-color: var(--green); background: #EAF1E6; }
.opt.wrong { border-color: var(--vermillion); background: #FBEAE6; }
.opt.disabled { cursor: default; }
.feedback {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: .85rem;
  font-weight: 600;
}
.feedback.show-correct { display: block; background: #EAF1E6; color: var(--green); }
.feedback.show-wrong { display: block; background: #FBEAE6; color: var(--vermillion); }
.feedback.show-special { display: block; background: #FCF1DB; color: var(--gold); }
.error-tag-row { display: none; gap: 6px; margin-top: 10px; }
.error-tag-row.show { display: flex; }
.tag-btn {
  flex: 1;
  font-size: .72rem;
  padding: 7px 4px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--paper-dark);
  cursor: pointer;
  font-weight: 700;
}
.tag-btn.tagged { background: var(--vermillion); color: #fff; }
.nav-row { display: flex; gap: 8px; margin-top: 16px; }
#resultArea { display: none; text-align: center; }
#resultArea .big-score {
  font-family: 'Noto Serif TC', serif;
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--vermillion);
  margin: 10px 0;
}
.review-item {
  text-align: left;
  border-top: 1px solid var(--line);
  padding: 10px 0;
  font-size: .82rem;
}
.review-item .rmeta { color: #807660; font-weight: 600; margin-bottom: 4px; }
.tag-badge {
  display: inline-block;
  font-size: .68rem;
  padding: 1px 7px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 700;
  color: #fff;
}
.tag-A { background: #A8402B; }
.tag-B { background: #BC8A2E; }
.tag-C { background: #4C6B43; }
.footer-note {
  text-align: center;
  font-size: .7rem;
  color: #9a917a;
  margin-top: 24px;
}
</style>
</head>
<body>
<div class="app">
  <h1>經紀法規概要｜題庫互動練習</h1>
  <div class="subtitle">99–114年16年完整題庫・520題・依A-H八篇分類</div>

  <div id="setupArea">
    <div class="panel">
      <div class="stats-row" id="overallStats"></div>
      <div class="section-label">選擇章節（可複選，預設全選）</div>
      <div class="chip-grid" id="chapterChips"></div>
      <div class="btn-row">
        <button class="btn-mini" id="selectAllBtn">全選</button>
        <button class="btn-mini" id="selectNoneBtn">全不選</button>
        <button class="btn-mini" id="selectWrongOnlyBtn">只練錯題本</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-label">出題模式</div>
      <div class="chip-grid">
        <div class="chap-chip mode-chip active" data-mode="sequential">依年度順序</div>
        <div class="chap-chip mode-chip" data-mode="random">隨機亂序</div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="startBtn">開始練習</button>
      </div>
    </div>
  </div>

  <div id="quizArea">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="panel">
      <div class="q-meta">
        <span id="qPosition"></span>
        <span id="qChapterLabel"></span>
      </div>
      <div class="q-stem" id="qStem"></div>
      <div id="optsContainer"></div>
      <div class="feedback" id="feedback"></div>
      <div class="error-tag-row" id="errorTagRow">
        <div class="tag-btn" data-tag="A">A型・法條混淆</div>
        <div class="tag-btn" data-tag="B">B型・粗心</div>
        <div class="tag-btn" data-tag="C">C型・真的不熟</div>
      </div>
      <div class="nav-row">
        <button class="btn-secondary" id="prevBtn">上一題</button>
        <button class="btn-primary" id="nextBtn">下一題</button>
      </div>
    </div>
  </div>

  <div id="resultArea">
    <div class="panel">
      <div class="big-score" id="bigScore"></div>
      <div id="scoreDetail" style="font-size:.85rem;color:#6b6354;"></div>
      <div class="btn-row">
        <button class="btn-primary" id="restartBtn">重新設定範圍</button>
        <button class="btn-secondary" id="reviewWrongBtn">只看錯題</button>
      </div>
    </div>
    <div class="panel" id="reviewPanel" style="display:none;">
      <div class="section-label">本次錯題回顧</div>
      <div id="reviewList"></div>
    </div>
  </div>

  <div class="footer-note">BrokerX 備考 Project・資料來源：考選部99–114年官方歷屆試題與標準答案</div>
</div>

<script>

為及賠償義務人時起，多久期間不行使而消滅？", "options": ["半年", "一年", "一年半", "二年"], "answer": "D", "special": null}, {"id": 101, "year": 101, "qnum": 21, "chapter": "G1", "stem": "依公平交易法所處停止營業之期間，每次以多久期間為限？", "options": ["一個月", "三個月", "六個月", "十二個月"], "answer": "C", "special": null}, {"id": 102, "year": 101, "qnum": 22, "chapter": "H1", "stem": "下列敘述何者為錯誤？", "options": ["直轄市或縣（市）主管機關得選擇特定行業，公告規定其定型化契約應記載或不得記載之事項，違反該公告之定型化契約，其定型化契約條款無效", "定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效", "定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效", "定型化契約中之定型化契約條款，全部或一部無效或不構成契約內容之一部者，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效"], "answer": "A", "special": null}, {"id": 103, "year": 101, "qnum": 23, "chapter": "D2", "stem": "有關預售屋買賣定型化契約應記載事項，下列何者為錯誤？", "options": ["賣方應確保廣告內容之真實，預售屋之廣告宣傳品及其所記載之建材設備表、房屋及停車位平面圖與位置示意圖，為契約之一部分", "附屬建物，除陽臺外，其餘項目不得計入買賣價格", "房屋所有權之移轉，應於使用執照核發後三個月內備妥文件申辦有關稅費及權利移轉登記", "賣方應於領得使用執照六個月內，通知買方進行交屋"], "answer": "C", "special": null}, {"id": 104, "year": 101, "qnum": 24, "chapter": "D3", "stem": "有關不動產委託銷售定型化契約之應記載事項，下列敘述何者錯誤？", "options": ["委託銷售價格未記載金額者，不動產委託銷售定型化契約無效", "未記載委託銷售期間者，委託人得隨時以書面終止", "受託人受託處理仲介事務應以善良管理人之注意為之", "受託人於簽約前，應據實提供該公司（或商號）近一個月之成交行情，供委託人訂定售價之參考；如有隱匿不實，應負賠償責任"], "answer": "D", "special": null}, {"id": 105, "year": 101, "qnum": 25, "chapter": "C2", "stem": "有關不動產說明書「成屋」之應記載事項，下列何者非屬「建築改良物瑕疵情形」？", "options": ["是否為凶宅", "是否有滲漏水情形及其位置", "是否有損鄰狀況", "是否有檢測海砂含氯量及輻射鋼筋"], "answer": "A", "special": null}, {"id": 106, "year": 101, "qnum": 26, "chapter": "C1", "stem": "有關不動產說明書「土地」之應記載事項，其應納稅額不包含下列何種稅目？", "options": ["土地增值稅", "地價稅", "契稅", "印花稅"], "answer": "C", "special": null}, {"id": 107, "year": 101, "qnum": 27, "chapter": "A4", "stem": "下列敘述何者為錯誤？", "options": ["經紀業應將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處；其為加盟經營者，應併標明之", "經營仲介業務者應揭示報酬標準及收取方式於營業處所明顯之處", "經紀業或經紀人員不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金按中央主管機關規定之報酬標準計收", "違反收取差價或其他報酬禁止規定者，其已收取之差價或其他報酬，應全額加計利息後返還支付人"], "answer": "D", "special": null}, {"id": 108, "year": 101, "qnum": 28, "chapter": "A2", "stem": "下列有關營業保證金之敘述，何者為錯誤？", "options": ["由各直轄市或縣（市）政府統一 害消費者生命、身體、健康或財產之虞者，應即進行調查", "於調查有必要時，得就地抽樣商品，加以檢驗，對於可為證據之食品，得自行扣押之", "直轄市或縣（市）主管機關辦理檢驗，得委託設有與檢驗項目有關之檢驗設備之消費者保護團體辦理之", "對消費者已發生重大損害而情況危急時，除命其限期回收或銷燬外，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品或為其他必要之處置"], "answer": "B", "special": null}, {"id": 151, "year": 102, "qnum": 31, "chapter": "H3", "stem": "企業經營者以網際網路使消費者未能檢視商品而與企業經營者所為之買賣，如消費者對所收受之商品不願買受時，得於收受商品後幾日內，退回商品？", "options": ["七日", "十日", "十五日", "二十日"], "answer": "A", "special": null}, {"id": 152, "year": 102, "qnum": 32, "chapter": "G1", "stem": "當有益於整體經濟與公共利益時，行政院公平交易委員會得許可事業之聯合行為，該許可之期限不得逾幾年？", "options": ["十年", "五年", "三年", "二年"], "answer": "C", "special": null}, {"id": 153, "year": 102, "qnum": 33, "chapter": "G2", "stem": "廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，應負何種責任？", "options": ["由廣告主負損害賠償責任", "與廣告主負連帶損害賠償責任", "與廣告媒體業負連帶損害賠償責任", "與廣告薦證者負連帶損害賠償責任"], "answer": "B", "special": null}, {"id": 154, "year": 102, "qnum": 34, "chapter": "G1", "stem": "依公平交易法規定裁處停止營業之期間，每次以幾個月為限？", "options": ["六個月", "五個月", "三個月", "二個月"], "answer": "A", "special": null}, {"id": 155, "year": 102, "qnum": 35, "chapter": "G1", "stem": "事業因結合而使其市場占有率達多少比例時，應先向行政院公平交易委員會提出申報？", "options": ["二分之一", "三分之一", "四分之一", "五分之一"], "answer": "B", "special": null}, {"id": 156, "year": 102, "qnum": 36, "chapter": "G1", "stem": "關於多層次傳銷參加人解除多層次傳銷契約之敘述，以下何者正確？", "options": ["多層次傳銷參加人得自訂約日起十五日內以書面通知多層次傳銷事業解除契約", "多層次傳銷事業應於契約解除生效後六十日內，接受參加人退貨之申請，取回商品或由參加人自行送回商品", "多層次傳銷事業依規定返還參加人所為之給付時，得扣除已因該進貨而對參加人給付之獎金或報酬", "前述之退貨如係該事業取回者，多層次傳銷事業亦不得扣除取回該商品所需運費"], "answer": "C", "special": null}, {"id": 157, "year": 102, "qnum": 37, "chapter": "G1", "stem": "關於公平交易法所規定損害賠償請求權之敘述，以下何者正確？", "options": ["自行為時起，二年間不行使而消滅", "自行為時起，五年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，二年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，五年間不行使而消滅"], "answer": "C", "special": null}, {"id": 158, "year": 102, "qnum": 38, "chapter": "G1", "stem": "關於公平交易法對於「事業」規定之敘述，以下何者正確？", "options": ["公平交易法所稱事業不包含同業公會", "事業即使有正當理由，仍不得對其他事業給予差別待遇", "事業對於其交易相對人，就其供給之商品轉售與第三人時，得約定限制其價格", "事業與他事業經常共同經營或受他事業委託經營者，即屬結合"], "answer": "D", "special": null}, {"id": 159, "year": 102, "qnum": 39, "chapter": "H3", "stem": "依「預售屋買賣定型化契約應記載及不得記載事項」規定，契約審閱期間至少幾日？", "options": ["二日", "三日", "四日", "五日"], "answer": "D", "special": null}, {"id": 160, "year": 102, "qnum": 40, "chapter": "C4", "stem": "下列何者非不動產說明書不得記載事項之內容？", "options": ["附屬建物除陽台外，其餘項目不得計入買賣價格", "不得為其他違反法律強制或禁止規定之約定", "不得使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞", "預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"], "answer": "A", "special": null}, {"id": 161, "year": 103, "qnum": 1, "chapter": "H1", "stem": "甲向乙建設公司購買預售屋，並簽訂定型化契約，該契約中有以下條款。試問那一條款符合法律規範？", "options": ["甲的契約審閱期間為四日", "陽台面積應予計價", "甲須繳回原買賣契約書", "約定請求百分之二十五年利率之利息"], "answer": "B", "special": null}, {"id": 162, "year": 103, "qnum": 2, "chapter": "A4", "stem": "甲經紀營業員任職於乙經紀業，於執行業務過程中，甲有無以不動產說明書向與委託人交易之相對人丙解說的義務？甲有無在不動產說明書上簽章的義務？", "options": ["有解說義務，亦有簽章義務", "有解說義務，但無簽章義務", "無解說義務，但有簽章義務", "無解說義務，亦無簽章義務"], "answer": "B", "special": null}, {"id": 163, "year": 103, "qnum": 3, "chapter": "A4", "stem": "甲經紀營業員任職於乙經紀業，但乙經紀業同意甲為丙經紀業執行業務，是否符合法律規定？", "options": ["符合法律規定，因為乙已同意", "不符合法律規定，因為甲有專任義務", "不符合法律規定，因為會有利益衝突", "不符合法律規定，因為此為雙方代理"], "answer": "A", "special": null}, {"id": 164, "year": 103, "qnum": 4, "chapter": "A5", "stem": "有關經紀人員違反不動產經紀業管理條例相關規定者，下列之懲罰何者正確？", "options": ["經紀人員收取差價者，應予六個月以上三年以下之停止執行業務處分", "經紀人員其已收取之差價或其他報酬，應於加計利息後返還支付人", "經紀人員受停止執行業務處分累計達三年以上者，廢止其經紀人員證書或證明", "中央主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之"], "answer": "A", "special": null}, {"id": 165, "year": 103, "qnum": 5, "chapter": "D3", "stem": "依不動產委託銷售定型化契約應記載及不得記載事項規定，服務報酬數額空白未記載者，則服務報酬如何收取？", "options": ["該不動產委託銷售定型化契約無效", "受託人不得向委託人收取服務報酬", "受託人可向委託人收取差價", "受託人最高可收取中央主管機關規定實際成交價百分之六的服務報酬"], "answer": "B", "special": null}, {"id": 166, "year": 103, "qnum": 6, "chapter": "A4", "stem": "依不動產經紀業管理條例規定，受感訓處分之裁定確定者，可否充任不動產經紀人員？下列敍述何者正確？", "options": ["永遠不得充任", "執行完畢後，即得充任", "執行完畢後滿一年者，始得充任", "尚未執行完畢者，不得充任"], "answer": "D", "special": null}, {"id": 167, "year": 103, "qnum": 7, "chapter": "A4", "stem": "依不動產經紀業管理條例規定，下列有關不動產說明書之相關敍述，何者錯誤？", "options": ["不動產說明書應由經紀業指派經紀人簽章", "不動產說明書於提供解說前，應經委託人簽章", "以不動產說明書向委託人交易之相對人解說前，應由相對人在不動產說明書上簽章", "經買賣雙方簽章之不動產說明書視為買賣契約書之一部分"], "answer": "C", "special": null}, {"id": 168, "year": 103, "qnum": 8, "chapter": "A5", "stem": "依不動產經紀業管理條例規定，經紀業開始營業後自行停止營業至少連續多久時間以上，且未依法辦理停業登記者，直轄市或縣（市）主管機關得廢止其許可？", "options": ["三個月", "五個月", "六個月", "一年"], "answer": "C", "special": null}, {"id": 169, "year": 103, "qnum": 9, "chapter": "A2", "stem": "依不動產經紀業管理條例有關經營經紀業之規定，下列敍述何者錯誤？", "options": ["應向主管機關申請許可後，依法辦理公司或商業登記", "經紀業分設營業處所，應向直轄市或縣（市）政府申請許可", "其經營國外不動產仲介業務者，應以公司型態組織依法辦理登記", "需加入登記所在地之同業公會後方得營業"], "answer": "B", "special": null}, {"id": 170, "year": 103, "qnum": 10, "chapter": "A4", "stem": "甲將其 A 屋出賣給乙，上開案件委由丙地政士與丁仲介業處理。請問應由誰向主管機關申報登錄實價？", "options": ["甲", "乙", "丙", "丁"], "answer": "C", "special": null}, {"id": 171, "year": 103, "qnum": 11, "chapter": "D3", "stem": "A 屋所有權人甲與不動產經紀人乙簽訂一般委託銷售定型化契約，關於該契約中的記載，以下敘述何者正確？", "options": ["得約定本定型化契約及其附件之審閱期間僅有三日", "委託銷售之金額未記載者，本不動產委託銷售契約不當然無效", "未記載委託銷售期間者，甲仍不得隨時以書面終止", "如未記載乙服務報酬數額為實際成交價的百分比，乙仍得向甲收取最低額度的服務報酬"], "answer": "A", "special": null}, {"id": 172, "year": 103, "qnum": 12, "chapter": "D2", "stem": "依公寓大廈管理條例及預售屋買賣定型化契約應記載及不得記載事項規定，經規約草約訂定者，下列何者得為約定專用部分？", "options": ["共有部分之屋頂突出物", "公寓大廈本身所占之地面", "非屬避難之屋頂平臺", "連通數個專有部分之走廊"], "answer": "C", "special": null}, {"id": 173, "year": 103, "qnum": 13, "chapter": "E1", "stem": "甲、乙、丙、丁為 A 公寓大廈的區分所有權人，並為基地的共有人，乙將其基地應有部分與專有部分賣給戊，丁得否主張先買權？", "options": ["得依民法規定主張先買權", "得依土地法規定主張先買權", "得依公寓大廈管理條例規定主張先買權", "不得就基地應有部分主張先買權"], "answer": "D", "special": null}, {"id": 174, "year": 103, "qnum": 14, "chapter": "E3", "stem": "依公寓大廈管理條例規定，因重大瓦斯氣爆引發火災肇致該公寓大廈有危害公共安全之虞，擬進行重建時，下列敍述何者錯誤？", "options": ["應經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "需經區分所有權人會議決議", "當區分所有權人不同意法定會議之決議又不出讓區分所有權，管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之"], "answer": "A", "special": null}, {"id": 175, "year": 103, "qnum": 15, "chapter": "E1", "stem": "甲公寓大廈管理委員會欲對積欠管理費的住戶乙行使權利，問甲得否成為訴訟上的原告？", "options": ["得，因為甲有當事人能力", "得，因為甲有權利能力", "不得，因為甲無權利能力", "不得，因為甲並非法人"], "answer": "A", "special": null}, {"id": 176, "year": 103, "qnum": 16, "chapter": "E3", "stem": "依公寓大廈管理條例規定，區分所有權人因故無法出席區分所有權人會議時，得以書面委託代理人出席。下列何者不是公寓大廈管理條例所規定的代理人？", "options": ["承租人", "有行為能力之直系血親", "其他區分所有權人", "管理服務人"], "answer": "D", "special": null}, {"id": 177, "year": 103, "qnum": 17, "chapter": "E1", "stem": "A 公寓大廈規約約定住戶不得養貓，新搬進的住戶甲不願遵守，有無理由？", "options": ["有理由，因為依相關法規規定，住戶可以在公寓大廈中養寵物", "有理由，因為甲未參與之前規約的討論", "有理由，因為甲在買受前，無從知悉該規約的內容", "無理由，因為甲應繼受合法規約所定事項"], "answer": "D", "special": null}, {"id": 178, "year": 103, "qnum": 18, "chapter": "E1", "stem": "下列關於公寓大廈、區分所有建物的敘述，何者正確？", "options": ["公寓大廈之建築業者甲，不得將共用部分，包含法定空地、法定停車空間及法定防空避難設備，讓售於特定人乙", "公寓大廈有13歲兒童之住戶丙，外牆開口部或陽臺得設置不妨礙逃生且不突出外牆面之防墜設施", "規約之內容顯失公平者，不同意規約的區分所有人丁應於規約成立後六個月內訴請法院撤銷之", "公寓大廈起造人戊，非經領得使用執照，不得辦理銷售"], "answer": "A", "special": null}, {"id": 179, "year": 103, "qnum": 19, "chapter": "E3", "stem": "Ａ封閉式公寓大廈為區分所有建物。下列敘述，何者正確？", "options": ["Ａ公寓大廈專有部分的無權占有人甲，並非住戶，故並無積欠該大廈應負擔費用的問題", "Ａ公寓大廈每年至少應召開住戶大會一次", "針對Ａ公寓大廈區分所有人乙積欠管理費，現行法有法定優先受償權的規定", "Ａ公寓大廈於一定要件下，得以該辦公、商場部分召開區分所有權人會議"], "answer": "C", "special": null}, {"id": 180, "year": 103, "qnum": 20, "chapter": "E3", "stem": "依公寓大廈管理條例規定，有關公寓大廈之公共基金，下列敍述何者正確？", "options": ["區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉；不得因個人事由為讓與、扣押、抵銷或設定負擔", "公共基金應設專戶儲存，其運用應依管理委員會會議之決議為之", "起造人應按建築物銷售總金額一定比例或金額提列公共基金", "起造人於該公寓大廈建造執照申請時，應提出繳交各直轄市、縣（市）主管機關公庫代收公共基金之證明"], "answer": "A", "special": null}, {"id": 181, "year": 103, "qnum": 21, "chapter": "E3", "stem": "依公寓大廈管理條例第三十二條有關區分所有權人會議未獲致決議，重新開議之規定，下列敘述何者正確？", "options": ["其開議除規約另有規定出席人數外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席", "應以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議", "決議之會議紀錄各區分所有權人得於十日內以書面表示反對意見", "書面反對意見未超過出席區分所有權人及其區分所有權比例合計半數時，該決議視為成立"], "answer": "B", "special": null}, {"id": 182, "year": 103, "qnum": 22, "chapter": "D2", "stem": "甲向乙建設公司購買預售屋，並簽訂定型化契約，該契約中有「屋簷面積計入買賣價格」之定型化契約條款。請問該預售屋買賣定型化契約效力為何？", "options": ["無效，因為違反預售屋買賣定型化契約應記載及不得記載事項", "無效，因為顯失公平", "有效，因為甲已同意該契約所有條款", "有效，因為以一部無效為原則"], "answer": "D", "special": null}, {"id": 183, "year": 103, "qnum": 23, "chapter": "H3", "stem": "依消費者保護法規定，消費爭議調解辦法由何機關定之？", "options": ["消費者爭議調解委員會", "消費者保護委員會", "消費者服務中心", "各直轄市或縣（市）政府"], "answer": "B", "special": null}, {"id": 184, "year": 103, "qnum": 24, "chapter": "H1", "stem": "依消費者保護法規定，下列有關企業經營者之敘述何者正確？", "options": ["企業經營者對消費者或第三人之損害賠償責任，經與消費者個別磋商，得預先約定限制或免除", "輸入商品或服務之企業經營者，視為從事經銷之企業經營者", "從事經銷之企業經營者，就商品所生之損害，與商品製造者連帶負賠償責任。但對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者，若企業經營者能證明其無過失者，法院得免除其賠償責任"], "answer": "C", "special": null}, {"id": 185, "year": 103, "qnum": 25, "chapter": "H3", "stem": "甲消費者保護團體依消費者保護法第四十九條規定提起訴訟。下列敘述何者正確？", "options": ["應經消費者保護基金會的同意，始得提起該訴訟", "如已置有消費者保護專門人員，則可不委任律師代理訴訟", "如委任律師代理訴訟，該律師不得請求預付必要費用", "固然甲並非被害人，但甲仍得為該訴訟的原告"], "answer": "D", "special": null}, {"id": 186, "year": 103, "qnum": 26, "chapter": "H3", "stem": "因同一消費關係而被害之甲、乙、丙，依民事訴訟法之規定，選定甲與乙起訴請求損害賠償。以下敘述何者正確？", "options": ["此為法定訴訟擔當", "甲與乙稱為選定人", "甲與乙稱為選定當事人", "該訴訟繫屬中，同一消費關係之其他被害人丁與戊在法院判決前，均得併案請求賠償"], "answer": "C", "special": null}, {"id": 187, "year": 103, "qnum": 27, "chapter": "H3", "stem": "消費者甲向企業經營者乙提起消費訴訟，下列敘述何者正確？", "options": ["法院為甲敗訴之判決時，得依職權宣告為減少擔保之假執行。果爾，乙得在判決確定前，聲請法院強制執行甲的財產", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假處分", "法院為乙敗訴之判決時，得依職權宣告為減少擔保之假扣押", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假執行。果爾，甲得在判決確定前，聲請法院強制執行乙的財產"], "answer": "D", "special": null}, {"id": 188, "year": 103, "qnum": 28, "chapter": "H3", "stem": "甲慈善事業的慈善經營方式是：以一般價格購買商品後，將其便宜賣給貧困者。貧困者乙向甲便宜購買商品，如因而受有身體上的損害，請問乙主張甲就此應負商品責任，有無理由？", "options": ["有理由，因為甲應負不完全給付的商品責任", "有理由，因為甲反覆為此行為並以此為業", "無理由，因為甲的行為並非以營利為目的", "無理由，因為人身損害並非商品責任所規範"], "answer": "B", "special": null}, {"id": 189, "year": 103, "qnum": 29, "chapter": "H3", "stem": "設若消費者保護基金會對於同一之原因事件，致使眾多消費者受害時，受讓甲、乙、丙等 20 位消費者損害賠償請求權後，以自己名義，提起消費訴訟。以下敘述何者正確？", "options": ["如甲僅有非財產上損害賠償請求權，因該權利具一身專屬性，故不得讓與給消費者保護基金會", "該訴訟繫屬中，如乙終止讓與損害賠償請求權，消費者保護基金會仍具當事人適格", "在該訴訟判決前，丙均得終止讓與損害賠償請求權，並通知法院", "消費者保護基金會應將該訴訟結果所得賠償，交付甲、乙、丙等20位消費者，不得扣除訴訟費用"], "answer": "B", "special": null}, {"id": 190, "year": 103, "qnum": 30, "chapter": "H3", "stem": "依消費者保護法規定，下列有關調解之敘述何者正確？", "options": ["消費爭議調解委員會，由委員互推主席", "依消費者保護法第四十五條之二，有關一般消費爭議經委員會依職權調解提出之解決方案，應經全體調解委員過半數之同意", "當事人對委員會依職權調解之方案，得於送達後十五日之不變期間內，提出異議", "調解成立者應作成調解書。調解書之作成及效力，準用鄉鎮市調解條例第二十二條至第二十六條之規定"], "answer": "D", "special": null}, {"id": 191, "year": 103, "qnum": 31, "chapter": "H3", "stem": "依消費者保護法規定，下列有關分期付款買賣契約書之敘述何者錯誤？", "options": ["分期付款買賣契約應以書面為之", "分期付款買賣之附加費用，應明確記載併入各期價款計算之利息數額", "契約書未記載利率者，其利率按現金交易價格週年利率百分之五計算之", "契約書未載明頭期款、各期價款與其他附加費用合計之總價款與現金交易之差額者，消費者不負現金交易價格以外價款之給付義務"], "answer": "B", "special": null}, {"id": 192, "year": 103, "qnum": 32, "chapter": "H3", "stem": "依消費者保護法規定，下列有關消費者保護委員會之敘述何者錯誤？", "options": ["以行政院副院長為主任委員", "消費者保護委員會應置消費者保護官若干名", "消費者保護委員會組織規程由內政部定之", "其設立目的為研擬及審議消費者保護基本政策與監督其實施"], "answer": "C", "special": null}, {"id": 193, "year": 103, "qnum": 33, "chapter": "H3", "stem": "有關消費者保護法第五十四條消費者集體訴訟之相關規定，下列敍述何者錯誤？", "options": ["集體訴訟之公告曉示後，其他被害人得於一定之期間內表明併案請求賠償。前述之期間，至少應有七日", "併案請求賠償之書狀，應以繕本送達於兩造", "集體訴訟之公告應黏貼於法院牌示處", "公告應登載新聞紙，其費用由國庫墊付"], "answer": "A", "special": null}, {"id": 194, "year": 103, "qnum": 34, "chapter": "G1", "stem": "依公平交易法規定，事業持有或取得他事業之股份或出資額，達到他事業有表決權股份或資本總額三分之一以上者，稱為下列何者？", "options": ["結合", "獨占", "聯合行為", "寡占行為"], "answer": "A", "special": null}, {"id": 195, "year": 103, "qnum": 35, "chapter": "G1", "stem": "依公平交易法規定，多層次傳銷參加人終止契約後，多層次傳銷事業應以何種價格買回參加人所持有之商品？", "options": ["商品之進貨價金", "商品進貨價金並可扣除商品減損之價額", "原購價格百分之九十", "原購價格百分之九十並可扣除終止契約違約金"], "answer": "C", "special": null}, {"id": 196, "year": 103, "qnum": 36, "chapter": "G1", "stem": "甲因違反公平交易法而被處罰鍰，請問目前應移送何處強制執行？", "options": ["普通法院", "行政法院", "法務部行政執行署", "財政部國有財產署"], "answer": "C", "special": null}, {"id": 197, "year": 103, "qnum": 37, "chapter": "H3", "stem": "甲為廣告主，非公眾人物乙與明星丙為該廣告中薦證之人，乙丙分別接受 2000 元與 20 萬元報酬。若有消費者丁因該廣告不實而受有 30 萬元損害，關於乙丙的責任，以下敘述何者不正確？", "options": ["即便丙不知情，丁依個案情形，仍可能得依法對丙請求30萬元損害賠償", "即便乙不知情，丁依個案情形，仍可能得依法對乙請求3萬元損害賠償", "如乙依法賠償丁，乙得向甲行使求償權", "如丙依法賠償丁，丙得向甲行使法定承受權"], "answer": "B", "special": null}, {"id": 198, "year": 103, "qnum": 38, "chapter": "G1", "stem": "依公平交易法規定，事業結合時，有下列何種情形，應先向中央主管機關提出申報？", "options": ["事業因結合而使其市場占有率達百分之四十者", "參與結合之一事業，其市場占有率達百分之二十者", "同一事業所持有有表決權股份或出資額達百分之五十以上之事業間結合者", "事業將其全部或主要部分之營業、財產或可獨立營運之全部或一部營業，讓與其獨自新設之他事業者"], "answer": "A", "special": null}, {"id": 199, "year": 103, "qnum": 39, "chapter": "G1", "stem": "甲不動產仲介業向購屋人乙收取斡旋金時，如故意未同時告知乙得選擇採用內政部版要約書，下列敘述何者不正確？", "options": ["依個案情形，甲可能受刑法制裁", "依個案情形，此可能屬於足以影響交易秩序之欺罔或顯失公平的行為", "依個案情形，甲可能違反公平交易法", "依個案情形，乙可能得向甲請求懲罰性賠償"], "answer": "A", "special": null}, {"id": 200, "year": 103, "qnum": 40, "chapter": "G1", "stem": "關於甲不動產經紀業（加盟業主）以限制加盟店收取服務報酬為條件，而與加盟店交易之行為，下列敘述何者不正確？", "options": ["為保護消費者，甲不應容許其加盟店自由決定服務報酬", "甲的行為有限制競爭之虞", "甲的行為有妨礙公平競爭之虞", "甲的行為有違反公平交易法規定之虞"], "answer": "A", "special": null}, {"id": 201, "year": 104, "qnum": 1, "chapter": "C4", "stem": "區分所有建物之型態為五樓有電梯之住宅，依內政部公布之「不動產說明書應記載及不得記載事項」之規範，將其歸類為下列何者？", "options": ["公寓", "大廈", "華廈", "住宅大樓"], "answer": "C", "special": null}, {"id": 202, "year": 104, "qnum": 2, "chapter": "A3", "stem": "依不動產經紀業管理條例規定，領有經紀營業員證明者，於其證明有效期限屆滿時，應檢附完成訓練至少多少小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄？", "options": ["20小時", "30小時", "40小時", "60小時"], "answer": "A", "special": null}, {"id": 203, "year": 104, "qnum": 3, "chapter": "A4", "stem": "不動產經紀人員執行業務，下列敘述何者錯誤？", "options": ["不動產說明書應經經紀人簽章", "以不動產說明書，向與委託人交易之相對人解說", "不動產說明書於提供解說後，應經委託人簽章", "不動產說明書視為買賣契約書之一部分"], "answer": "C", "special": null}, {"id": 204, "year": 104, "qnum": 4, "chapter": "A5", "stem": "依不動產經紀業管理條例之規定，非不動產經紀業而經營不動產仲介或代銷業務者，應予處罰，下列敘述何者正確？", "options": ["主管機關將通知限期改正", "處分公司負責人新臺幣四十萬元以上之罰鍰", "處分公司負責人一年以上有期徒刑", "主管機關應禁止其營業"], "answer": "D", "special": null}, {"id": 205, "year": 104, "qnum": 5, "chapter": "G1", "stem": "甲與乙兩事業結合時，依公平交易法規定，下列那種情況無須向中央主管機關申請許可？", "options": ["甲與乙兩事業因結合而使其市場占有率達1/3", "甲與乙之一事業，其市場占有率達1/4", "甲與乙兩事業之上一會計年度銷售金額，皆未達主管機關所公告之金額", "甲與乙兩事業之上一會計年度銷售金額，超過主管機關所公告之金額"], "answer": "C", "special": null}, {"id": 206, "year": 104, "qnum": 6, "chapter": "G1", "stem": "不動產經紀業者以協議之方式，與有競爭關係之其他不動產經紀業者，共同決定服務報酬之行為，係屬於公平交易法所規定之何種行為？", "options": ["結合行為", "聯合行為", "獨占行為", "加盟行為"], "answer": "B", "special": null}, {"id": 207, "year": 104, "qnum": 7, "chapter": "G1", "stem": "依公平交易法之規定，中央主管機關許可之事業聯合行為，下列何者非屬法定得申請之情形？", "options": ["為促進事業合理經營，而分別作專業發展者", "為確保或促進輸出，而專就國外市場之競爭予以約定者", "為保障事業合理利潤，由同業公會協調決定商品價格者", "為加強貿易效能，而就國外商品之輸入採取共同行為者"], "answer": "C", "special": null}, {"id": 208, "year": 104, "qnum": 8, "chapter": "G1", "stem": "依公平交易法之規定，關於事業結合的敘述，下列何者正確？", "options": ["事業結合行為原則上禁止，例外採取申報主義", "主管機關對於受理事業結合申報案件所為延長受理期間之決定，不得附加條件", "事業自主管機關受理其提出完整申報資料之日起算30日內，不得為結合行為", "事業申報後，經中央主管機關禁止其結合而結合，處新臺幣五萬元以上五千萬元以下罰鍰"], "answer": "C", "special": null}, {"id": 209, "year": 104, "qnum": 9, "chapter": "G2", "stem": "依公平交易法第 21 條之規定，下列敘述何者錯誤？", "options": ["事業不得在商品上對於商品之製造方法為虛偽不實表示", "事業對在商品廣告上對於商品之用途為引人錯誤之表示時，此商品不得運送", "事業不得以其他使公眾得知之方法，對於商品之使用方法為虛偽不實之表示", "廣告媒體業知曉其刊載之廣告有引人錯誤之虞，仍予刊載，損害賠償責任在廣告主，其無須負連帶損害賠償責任"], "answer": "D", "special": null}, {"id": 210, "year": 104, "qnum": 10, "chapter": "G1", "stem": "依公平交易法規定，違反獨占或聯合行為之規定，經主管機關限期命其停止、改正其行為或採取必要更正措施，屆期未停止、改正其行為或未採取必要更正措施，或停止後再為相同違反行為時，處行為人幾年以下有期徒刑？", "options": ["1年", "2年", "3年", "5年"], "answer": "C", "special": null}, {"id": 211, "year": 104, "qnum": 11, "chapter": "H3", "stem": "依消費者保護法規定，直轄市或縣（市）政府對於建商興建預售屋商品出售予消費者所為之行政監督的敘述，下列何者錯誤？", "options": ["直轄市或縣（市）政府認為建商提供之預售屋有損害消費者生命、身體、健康或財產之虞者，應即進行調查。於調查完成後，不得公開其經過及結果", "直轄市或縣（市）政府於調查時，對於可為證據之物，得聲請檢察官扣押之", "直轄市或縣（市）政府對於建商提供之商品或服務，經調查認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬", "直轄市或縣（市）政府於建商提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，除命其限期改善、回收或銷燬之處置外，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置"], "answer": "A", "special": null}, {"id": 212, "year": 104, "qnum": 12, "chapter": "H3", "stem": "發生消費爭議時，不動產經紀業經營者對於消費者之申訴，依消費者保護法之規定，應於申訴之日起幾日內妥適處理之？", "options": ["5日", "10日", "15日", "20日"], "answer": "C", "special": null}, {"id": 213, "year": 104, "qnum": 13, "chapter": "H3", "stem": "建商銷售房屋因同一原因事件，致使眾多購屋者受害時，依消費者保護法規定，消費者保護團體得受讓多少人以上之購屋者的損害賠償請求權後，以自己名義提起訴訟？", "options": ["10人", "20人", "30人",
