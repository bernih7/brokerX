<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LandLaw E quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--paper:#F8F3E9;--ink:#2A2722;--stamp:#A8402B;--gold:#BC8A2E;--green:#4C7A52;--blue:#3A5A7A;--line:#D8CDB8;--expbg:#EDF3F8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.25rem;text-align:center;margin:10px 0 2px;}
.sub{text-align:center;font-size:.75rem;color:#6b6354;margin-bottom:12px;}
.badge{background:var(--gold);color:#fff;font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
.filter-bar{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.filter-label{font-weight:700;font-size:.8rem;margin-bottom:8px;}
.ch-pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{font-size:.74rem;padding:5px 12px;border:1.5px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;color:var(--ink);}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.filter-actions{display:flex;gap:8px;margin-top:10px;}
.btn-sm{font-size:.78rem;padding:6px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.btn-sm.red{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.progress-panel{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;font-size:.78rem;color:#6b6354;}
.prog-wrap{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--gold);transition:width .3s;}
.prog-text{white-space:nowrap;font-weight:700;color:var(--ink);}
.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.9rem;color:var(--blue);padding:10px 0 6px;border-bottom:2px solid var(--blue);margin-bottom:10px;margin-top:16px;}
.qcard{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
.qcard.answered-ok{border-left:4px solid var(--green);}
.qcard.answered-ng{border-left:4px solid var(--stamp);}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:#8a7f72;margin-bottom:8px;}
.qtag{background:var(--blue);color:#fff;font-size:.64rem;padding:2px 7px;border-radius:8px;}
.qtext{font-family:"Noto Serif TC",serif;font-size:.96rem;line-height:1.75;margin-bottom:12px;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;width:100%;font-size:.88rem;line-height:1.5;color:var(--ink);}
.opt:disabled{cursor:default;}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:.76rem;}
.opt.ok{border-color:var(--green);background:#eef6ef;}
.opt.ok .ltr{background:var(--green);color:#fff;border-color:var(--green);}
.opt.ng{border-color:var(--stamp);background:#fbeeec;}
.opt.ng .ltr{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.opt.show-correct{border-color:var(--green);background:#eef6ef;}
.opt.show-correct .ltr{background:var(--green);color:#fff;border-color:var(--green);}
.expbox{display:none;margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--blue);}
.expbox.show{display:block;}
.exph{background:var(--blue);color:#fff;font-size:.73rem;font-weight:700;padding:6px 12px;}
.expb{background:var(--expbg);padding:10px 12px;}
.ei{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-bottom:1px solid #d0dae6;font-size:.81rem;line-height:1.6;}
.ei:last-child{border-bottom:none;}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;}
.el.ok{background:var(--green);color:#fff;}.el.no{background:#b0b8c4;color:#fff;}.el.ng{background:var(--stamp);color:#fff;}
.verdict{font-family:"Noto Serif TC",serif;font-weight:900;font-size:.82rem;padding:3px 12px;border-radius:6px;margin-bottom:7px;display:inline-block;transform:rotate(-2deg);}
.verdict.ok{border:2px solid var(--green);color:var(--green);}.verdict.ng{border:2px solid var(--stamp);color:var(--stamp);}</style>
</head>
<body>
<div class="app">
<h1>土地法 E篇 考題解析 <span class="badge">可自由瀏覽</span></h1>
<div class="sub">E1 地價稅 ／ E2 土地增值稅｜共 83 題</div>
<div class="filter-bar">
  <div class="filter-label">顯示章節</div>
  <div class="ch-pills" id="pills"></div>
  <div class="filter-actions">
    <button class="btn-sm" onclick="selAll()">全選</button>
    <button class="btn-sm" onclick="selNone()">清空</button>
    <button class="btn-sm red" onclick="resetAll()">重置作答</button>
  </div>
</div>
<div class="progress-panel">
  <div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  <div class="prog-text"><span id="pd">0</span>/<span id="pt">0</span> 已答・正確率 <span id="pr">-</span></div>
</div>
<div id="list"></div>
</div>
<script>const CARDS=[{"ch": "E1 地價稅", "year": "99", "num": 29, "q": "依土地稅法之規定，地價稅或田賦之納稅義務人，下列何者錯誤？", "opts": ["設有典權土地，為出典人", "承領土地，為承領人", "承墾土地，為耕作權人", "土地所有權人"], "ans": 0, "exps": ["✓ 本題問「何者錯誤」。土地稅法第3條：設有典權土地，地價稅納稅義務人為「典權人」（非出典人）。典權人取得使用收益權，故由其負擔地價稅，本選項說出典人是錯誤的，為本題答案。", "❌ 本選項描述正確，承領土地的納稅義務人是承領人，非錯誤。", "❌ 本選項描述正確，承墾土地的納稅義務人是耕作權人，非錯誤。", "❌ 本選項描述正確，一般土地以所有權人為納稅義務人，這是最基本原則，非錯誤。"]}, {"ch": "E1 地價稅", "year": "100", "num": 2, "q": "下列何種用地不得申請適用優惠稅率課徵地價稅？", "opts": ["私立動物園用地", "農會辦公廳用地", "國民住宅用地", "勞工宿舍用地"], "ans": 1, "exps": ["❌ 私立動物園用地屬供事業直接使用之土地，可適用千分之十的優惠稅率。", "✓ 農會辦公廳是農會的行政辦公場所，不屬於土地稅法規定可申請優惠稅率（如自用住宅、勞工宿舍、工業用地、私立動物園等）的法定類型，故不得申請優惠稅率課徵地價稅。", "❌ 國民住宅用地可適用千分之二的優惠稅率，屬於得申請優惠稅率的類型。", "❌ 企業或公營事業興建之勞工宿舍用地可適用千分之二優惠稅率，屬於得申請優惠稅率的類型。"]}, {"ch": "E1 地價稅", "year": "100", "num": 3, "q": "依土地稅法規定，下列何者非為地價稅或田賦之納稅義務人？", "opts": ["土地所有權人", "設有抵押權土地，為抵押權人", "設有典權土地，為典權人", "承領土地，為承領人"], "ans": 1, "exps": ["❌ 土地所有權人是地價稅最基本的納稅義務人，屬於法定納稅義務人。", "✓ 抵押權人不在土地稅法第3條規定的納稅義務人清單內。抵押權是擔保物權，抵押權人不使用收益土地，故不負擔地價稅；地價稅仍由土地所有權人（設定抵押權的債務人）繳納。本選項「抵押權人」是虛構的納稅義務人類型，為本題正確答案。", "❌ 設有典權土地，典權人是法定納稅義務人（因典權人使用收益土地），屬之。", "❌ 承領土地的納稅義務人是承領人，屬法定納稅義務人。"]}, {"ch": "E1 地價稅", "year": "100", "num": 24, "q": "有關都市計畫公共設施保留地之使用及稅賦，下列何者有誤？", "opts": ["不得為妨礙其指定目的之使用", "未取得前，得申請為臨時建築使用", "一般非住宅使用依基本稅率課徵地價稅", "未作任何使用並與使用中之土地隔離者，免徵地價稅"], "ans": 2, "exps": ["❌ 本選項描述正確，公設保留地不得為妨礙指定目的之使用，符合都市計畫法規定，非有誤。", "❌ 本選項描述正確，公設保留地未取得前得申請臨時建築使用，非有誤。", "✓ 本項有誤：公設保留地保留期間仍為建築使用者，統按6‰計徵（土稅法§19），不適用累進。⚠️現行法：重點筆記B2/E1載「一般非住宅使用依基本稅率」，與官方答案不一致，此題可疑。", "❌ 本選項描述正確，與使用中土地隔離且未作使用的公設保留地免徵地價稅，非有誤。"]}, {"ch": "E1 地價稅", "year": "101", "num": 23, "q": "土地稅法規定了各項名詞的定義，下列敘述何者錯誤？", "opts": ["都市土地，指依法發布都市計畫範圍內之土地；非都市土地，指都市土地以外之土地", "自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住 宅用地", "工業用地，指依法核定之工業區土地及政府核准工業或工廠使用之土地", "公告現值，指直轄市及縣（市）政府依平均地權條例公告之公告地價"], "ans": 3, "exps": ["❌ 此敘述正確：都市土地指依法發布都市計畫範圍內之土地，其餘為非都市土地。", "❌ 此敘述正確：自用住宅用地指所有權人或其配偶、直系親屬辦竣戶籍，且無出租或營業（土稅法§9）。", "❌ 此敘述正確：工業用地指依法核定之工業區土地及政府核准工業或工廠使用之土地。", "✓ （本題問錯誤者）公告現值是依平均地權條例公告之「土地現值」，不是公告地價；公告地價係課地價稅依據。"]}, {"ch": "E1 地價稅", "year": "101", "num": 24, "q": "依土地稅法規定，以土地為信託財產，信託利益之受益人為委託人者，其地價稅之計算，該土地應與誰在同一直轄市或縣（市）轄區內所有之土地合併計算地價總額？", "opts": ["委託人", "受託人", "受益人", "由受託人與受益人推派一人"], "ans": 0, "exps": ["✓ 信託利益之受益人為委託人者，該土地應與委託人在同一直轄市或縣（市）之土地合併計算地價總額（土稅法§3-1）。此舉防止藉信託分散土地規避累進稅率。", "❌ 信託存續中受託人雖為納稅義務人，但合併計算的對象是委託人，不是受託人。", "❌ 法條明定與「委託人」之土地合併，不是與受益人合併。", "❌ 法條沒有「由受託人與受益人推派一人」的合併計算規定。"]}, {"ch": "E1 地價稅", "year": "101", "num": 26, "q": "依土地稅法地價稅稅率之規定，下列敘述何者錯誤？", "opts": ["公有土地供公共使用者，稅率千分之十", "基本稅率為百分之一", "自用住宅用地稅率為千分之二", "地價總額超過累進起點地價未逹五倍者，就其超過部分課徵千分之十五"], "ans": 0, "exps": ["✓ 本項有誤：公有土地供公共使用者是免徵地價稅（土稅法§6），不是課10‰。", "❌ 基本稅率為千分之十，等於1%，本項敘述正確。", "❌ 本選項描述正確，自用住宅用地優惠稅率為2‰，非錯誤。", "❌ 本選項描述正確，符合地價稅累進稅率第二級規定，非錯誤。"]}, {"ch": "E1 地價稅", "year": "102", "num": 16, "q": "依土地稅法規定，企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅適用何項稅率計徵？", "opts": ["千分之二", "千分之十", "千分之六", "千分之十五"], "ans": 0, "exps": ["✓ 土地稅法第18條：國民住宅、企業或公營事業興建之勞工宿舍用地，自動工興建或取得土地所有權之日起，按「千分之二」優惠稅率計徵地價稅。2‰與自用住宅用地稅率相同，是對勞工居住權益的保障性規定。", "❌ 10‰是基本稅率，不是勞工宿舍用地的優惠稅率。", "❌ 6‰不是法定的勞工宿舍優惠稅率。", "❌ 15‰是累進稅率第二級，不是優惠稅率。"]}, {"ch": "E1 地價稅", "year": "102", "num": 18, "q": "都市計畫公共設施保留地，在保留期間未作任何使用並與使用中之土地隔離者，其地價稅之課徵如何處理？", "opts": ["按千分之二", "按千分之六", "免徵地價稅", "減半徵收地價稅"], "ans": 2, "exps": ["❌ 2‰是自用住宅等的優惠稅率，不適用於未作使用且隔離的公設保留地。", "❌ 6‰是公設保留地「仍為建築使用」的稅率，本題未作使用且隔離，應免徵。", "✓ 公設保留地未作任何使用並與使用中土地隔離者，免徵地價稅（土稅法§19）。仍為建築使用者（自用住宅除外）才統按6‰計徵。", "❌ 減半徵收不是公設保留地未作使用情形的處理方式，正確是免徵（全免，不是減半）。"]}, {"ch": "E1 地價稅", "year": "102", "num": 23, "q": "某甲所有土地之申報地價總額，超過當地累進起點地價五倍至十倍者，就其超過部分課徵之地價稅稅率為何？", "opts": ["千分之三十五", "千分之四十五", "千分之二十五", "千分之十五"], "ans": 2, "exps": ["❌ 35‰是超過10倍至15倍的稅率，不是5倍至10倍的稅率。", "❌ 45‰是超過15倍至20倍的稅率。", "✓ 地價稅累進稅率第三級：超過累進起點地價5倍至10倍者，就超過部分課徵「25‰」。這是最常見的數字陷阱——很多人誤以為應該是20‰（按等差5‰遞增），但實際上第一級到第二級是+5‰（10→15），第二級到第三級卻是+10‰（15→25），之後每級距固定+10‰（25→35→45→55）。", "❌ 15‰是超過起點未達5倍的稅率（第二級），不是5至10倍的稅率。"]}, {"ch": "E1 地價稅", "year": "102", "num": 26, "q": "土地稅法第9條所稱自用住宅用地，下列何者正確？", "opts": ["土地所有權人於該地辦竣戶籍登記，且無出租或供營業用之住宅用地", "土地所有權人之兄弟於該地辦竣戶籍登記，且無出租或供營業用之住宅用地", "土地所有權人之旁系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地", "土地所有權人配偶之姊妹於該地辦竣戶籍登記，且無出租或供營業用之住宅用地"], "ans": 0, "exps": ["✓ 自用住宅用地指所有權人或其配偶、直系親屬辦竣戶籍，且無出租或供營業用之住宅用地（土稅法§9）。", "❌ 兄弟為旁系血親，不是直系親屬，不符§9規定。", "❌ 旁系親屬不在§9範圍；限於所有權人、配偶及直系親屬。", "❌ 配偶之姊妹是姻親兼旁系，不是直系親屬，不符§9規定。"]}, {"ch": "E1 地價稅", "year": "102", "num": 40, "q": "土地稅法所稱公共設施尚未完竣前之「公共設施」，係指下列何者？", "opts": ["道路、自來水、排水系統、電信", "自來水、排水系統、電力、焚化設施", "電力、電信、排水系統、焚化設施", "道路、自來水、排水系統、電力"], "ans": 3, "exps": ["❌ 電信不在法定四項公共設施清單內，正確是電力，非電信。", "❌ 焚化設施不在法定四項清單內，且缺少道路。", "❌ 電信和焚化設施都不在法定清單內，且缺少道路和自來水。", "✓ 土地稅法施行細則所稱「公共設施尚未完竣前」的公共設施，係指「道路、自來水、排水系統、電力」四項基礎建設。這四項是判斷田賦或地價稅課徵與否的重要基準（公共設施未完竣前仍課徵田賦）。"]}, {"ch": "E1 地價稅", "year": "103", "num": 12, "q": "某甲擁有A、B兩筆住宅區土地，A地當年度課徵地價稅之申報地價為5,000元/m2，面積100m2，B地當年度課徵地價稅之申報地價為2,000元/m2，面積200m2，某甲將B地信託與某乙，某乙名下無任何土地，某甲享有全部信託利益，信託10年，目前尚有3年信託期滿，若A、B兩筆土地均在同一縣市，該縣市當年度累進起點地價為100萬元，若某甲當年度未申請A、B兩地為自用住宅用地，則某甲當年度應繳地價稅為：", "opts": ["5,000元", "9,000元", "4,000元", "3,000元"], "ans": 0, "exps": ["✓ B地信託後，信託存續中以受託人乙為地價稅納稅義務人（土稅法§3-1）。受益人為委託人故合併計算90萬，仍未達100萬起點，甲只繳A地50萬×10‰＝5,000元。", "❌ 9,000元是把A、B兩地稅額都算給甲；B地稅額應由受託人乙繳納。", "❌ 4,000元是B地（40萬×10‰）的稅額，應由受託人乙繳納，不是甲。", "❌ 3,000元與A、B兩地任何一筆的稅額計算都不相符。"]}, {"ch": "E1 地價稅", "year": "103", "num": 13, "q": "依據土地稅法及相關法律之規定，下列有關地價稅稅率之敘述何者正確？", "opts": ["工業用地按目的事業主管機關核定規劃使用者，地價稅稅率為千分之十且不累進", "經主管機關依法指定之私有古蹟及歷史建築所定著之土地，免徵地價稅", "企業或公營事業興建之勞工宿舍用地，自動工興建或取得土地所有權之日起，其用地免徵地價稅", "都市計畫公共設施保留地，在保留期間仍為建築使用，除自用住宅用地外，地價稅稅率為千分之十且不累進"], "ans": 0, "exps": ["✓ 土地稅法第18條：工業用地、礦業用地、私立公園動物園體育場等供事業直接使用之用地，按「千分之十（10‰）」計徵地價稅，且「不適用累進稅率」（固定稅率，不論面積大小都是10‰）。本選項正確描述了工業用地稅制的兩個關鍵：稅率10‰、不累進。", "❌ 私有古蹟、歷史建築定著土地免徵地價稅，內容正確。⚠️現行法：依文化資產保存法亦免徵，與官方答案並列，此題可疑。", "❌ 勞工宿舍用地是按「千分之二（2‰）優惠稅率」計徵，不是「免徵」，本選項描述錯誤。", "❌ 公設保留地保留期間仍為建築使用者，除自用住宅外統按6‰計徵，不是10‰。"]}, {"ch": "E1 地價稅", "year": "103", "num": 14, "q": "小張在某縣市僅擁有一筆住宅區之土地，面積為400平方公尺，當年度課徵地價稅的申報地價為2,000元/m2，土地上未有建物，小張想申請適用自用住宅優惠稅率，該縣市當年度累進起點地價為100萬元，小張當年度在該縣市應繳地價稅為：", "opts": ["1,600元", "8,000元", "3,200元", "4,000元"], "ans": 1, "exps": ["❌ 1,600元是80萬×2‰，須符合自用住宅要件才能適用，本題土地上無建物不符。", "✓ 土地上沒有建物，不符自用住宅用地要件，不能適用2‰優惠稅率。80萬元未超過累進起點100萬元，按基本稅率10‰計算為8,000元。", "❌ 3,200元不對應基本稅率10‰或優惠稅率2‰的任何計算結果。", "❌ 4,000元也不對應任何法定稅率的計算結果。"]}, {"ch": "E1 地價稅", "year": "103", "num": 22, "q": "老王有兩筆公共設施保留地，A地100m2及B地150m2，分別位於桃園縣及苗栗縣，A地為自用住宅使用，且地上有合法建物為老王所有，供全家居住，B地則未作任何使用並與鄰地隔離，若老王名下只有這兩筆公共設施保留地，A地當年度公告地價為40,000元/m2，B地當年度公告地價為20,000元/m2，若老王未申報地價，請問對老王當年度最低應繳之地價稅總額為：", "opts": ["免繳地價稅", "6,400元", "8,000元", "3,200元"], "ans": 1, "exps": ["❌ A地有自用住宅使用，不屬免徵情形，仍須課稅，不可能全部免繳。", "✓ A地為公設保留地供自用住宅，適用2‰優惠稅率。未申報地價以公告地價80%計：400萬×80%＝320萬，×2‰＝6,400元；B地未使用且隔離，免徵。", "❌ 8,000元是以公告地價400萬直接×2‰，漏算未申報時的80%。", "❌ 3,200元與A、B兩地任何正確計算都不相符。"]}, {"ch": "E1 地價稅", "year": "103", "num": 24, "q": "下列有關都市土地徵收田賦之敘述，何者正確？", "opts": ["公共設施完竣仍作農業用地使用者", "依法限制建築或不能建築，仍作農業用地使用者", "依都市計畫編為農業區及保護區之所有土地使用者", "依都市計畫編為公共設施保留地之所有土地使用者"], "ans": 1, "exps": ["❌ 公共設施已完竣的都市土地，即使仍作農業使用，原則上應改課地價稅（非田賦），因為公共設施完竣代表該地已具備建築發展條件。", "✓ 土地稅法第22條：都市土地合於下列規定者徵收田賦：依法限制建築，仍作農業用地使用者；依法不能建築使用，仍作農業用地使用者；公共設施尚未完竣前，仍作農業用地使用者；依都市計畫編為公共設施保留地，仍作農業用地使用者。本選項「依法限制建築或不能建築」是徵收田賦（而非地價稅）的法定情形之一。", "❌ 都市計畫農業區、保護區「使用」不是徵收田賦的完整要件，需「仍作農業用地使用」且符合其他條件（限制建築等），單純劃定為農業區保護區不等於課田賦。", "❌ 公設保留地若仍作農業使用才課田賦，「所有土地使用者」的描述過於籠統，不夠精確（且公設保留地若有其他使用如臨時建築，則不適用田賦）。"]}, {"ch": "E1 地價稅", "year": "103", "num": 27, "q": "按千分之十計徵地價稅之供事業直接使用之土地，不包括下列那一項？", "opts": ["工業用地", "農業用地", "礦業用地", "動物園"], "ans": 1, "exps": ["❌ 工業用地是按10‰計徵的供事業直接使用土地之一，屬之。", "✓ 土地稅法第18條「供事業直接使用，按10‰計徵」的清單包括：工業用地、礦業用地、私立公園、動物園、體育場等，但「不包括農業用地」。農業用地另有專屬的田賦或農地地價稅優惠規定，不適用10‰供事業使用的條款。", "❌ 礦業用地是按10‰計徵的供事業直接使用土地之一，屬之。", "❌ 私立動物園是按10‰計徵的供事業直接使用土地之一，屬之。"]}, {"ch": "E1 地價稅", "year": "103", "num": 33, "q": "下列關於地價稅累進課徵之規定，何者正確？", "opts": ["超過累進起點地價未達五倍者，就其超過部分課徵千分之十五", "超過累進起點地價五倍至十倍者，就其超過部分課徵千分之二十", "超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之二十五", "超過累進起點地價十五倍以上者，就其超過部分課徵千分之三十"], "ans": 0, "exps": ["✓ 地價稅累進稅率第二級：超過起點未達5倍，課徵15‰。本選項正確描述了第二級稅率。", "❌ 5至10倍的稅率是25‰（不是20‰），這是最常見的混淆陷阱，因為直覺上會以為每級遞增5‰，但實際上第二到第三級是遞增10‰。", "❌ 25‰是5至10倍的稅率，10至15倍應為35‰，本選項數字錯位。", "❌ 30‰不是任何級距的法定稅率，且「十五倍以上」應再分15-20倍（45‰）和20倍以上（55‰）兩級，本選項描述籠統且數字錯誤。"]}, {"ch": "E1 地價稅", "year": "104", "num": 31, "q": "工業用地之土地所有權人申請按千分之十計徵地價稅，應於何時提出申請，逾期申請者，自申請之次年期開始適用？", "opts": ["每年八月三十一日", "每年九月三十日", "每年（期）地價稅開徵四十日前", "每年（期）地價稅開徵六十日前"], "ans": 2, "exps": ["❌ 法定申請期限是開徵40日前，8月31日不是。", "❌ 法定申請期限是開徵40日前，9月30日不是。", "✓ 工業用地申請按10‰計徵地價稅，應於「每年（期）地價稅開徵四十日前」提出申請，逾期申請者自次年期才開始適用。40日是本題的固定數字考點。", "❌ 法定申請期限是開徵40日前，不是60日前。"]}, {"ch": "E1 地價稅", "year": "105", "num": 3, "q": "有關地價稅之特別稅率，下列何項用地不適用千分之二之特別稅率？", "opts": ["公有供公共使用土地", "國民住宅用地", "自用住宅用地", "公共設施保留地供自用住宅使用者"], "ans": 0, "exps": ["✓ 公有土地供公共使用者免徵地價稅（土稅法§6），不是按2‰課徵。故不適用2‰特別稅率，為本題答案。", "❌ 國民住宅用地適用2‰特別稅率，屬於適用範圍。", "❌ 自用住宅用地是2‰特別稅率最典型的適用對象，屬於適用範圍。", "❌ 公設保留地若同時符合自用住宅要件，仍可適用2‰特別稅率（除外規定），屬於適用範圍。"]}, {"ch": "E1 地價稅", "year": "105", "num": 7, "q": "地價稅採累進稅率，關於累進起點地價之規定，下列何者正確？", "opts": ["以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後5公畝之平均地價為準", "以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後7公頃之平均地價為準", "以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後7公畝之平均地價為準", "以各該直轄市或縣（市）土地扣除工業用地、礦業用地、農業用地及免稅土地後5公頃之平均地價為準"], "ans": 2, "exps": ["❌ 5公畝不是法定數字，正確是7公畝。", "❌ 公頃（100倍於公畝）的單位錯誤，正確單位是公畝，不是公頃。", "✓ 累進起點地價以扣除工業、礦業、農業用地及免稅土地後「7公畝」之平均地價為準（土稅法§16）。注意單位是公畝，不是公頃。", "❌ 5公頃既數字錯誤又單位錯誤，雙重不符。"]}, {"ch": "E1 地價稅", "year": "106", "num": 18, "q": "甲之土地於106年10月1日贈與並移轉登記予乙，請問106年期地價稅之納稅義務人為何？", "opts": ["甲", "乙", "甲乙協議", "甲乙依持有月數分別負擔"], "ans": 0, "exps": ["✓ 地價稅以每年8月31日的土地所有權人為納稅義務人。10月1日才移轉登記給乙，106年期仍由甲繳納，乙自107年期起負擔。", "❌ 乙是10月1日後才取得所有權，已過該年度地價稅的納稅義務基準日，故106年期地價稅不由乙負擔。", "❌ 地價稅的納稅義務人是依法定基準日認定，不是由雙方協議決定。", "❌ 地價稅不是按持有月數比例分擔（這是田賦或部分稅捐才有的按月比例計算方式），地價稅是以基準日認定整年度的納稅義務人，非比例分擔。"]}, {"ch": "E1 地價稅", "year": "106", "num": 34, "q": "下列敘述之地價稅稅率，何者錯誤？", "opts": ["自用住宅用地之地價稅稅率是2‰", "依都市計畫法規定設置供公眾使用之停車場用地之地價稅稅率是10‰", "公有非公用土地之地價稅稅率是10‰", "都市計畫公共設施保留地，在保留期間仍為建築使用者，地價稅稅率是10‰"], "ans": 3, "exps": ["❌ 本選項描述正確，2‰是自用住宅用地的法定優惠稅率，非錯誤。", "❌ 本選項描述正確，停車場用地按10‰計徵，符合法定規定，非錯誤。", "❌ 本選項描述正確，公有非公用土地按基本稅率10‰課徵（區別於公有「供公共使用」土地是免徵），非錯誤。", "✓ 本項有誤：公設保留地保留期間仍為建築使用者，統按6‰計徵（土稅法§19），不是10‰。"]}, {"ch": "E1 地價稅", "year": "107", "num": 19, "q": "下列土地關係人，何者非屬土地稅法第3條所定之地價稅納稅義務人？", "opts": ["承領土地，為承領人", "承墾土地，為耕作權人", "權屬不明土地，為主管稅捐稽徵機關指定之土地使用人", "設有典權土地，為典權人"], "ans": 2, "exps": ["❌ 本選項描述正確，承領人是法定納稅義務人，非錯誤。", "❌ 本選項描述正確，耕作權人是法定納稅義務人，非錯誤。", "✓ 本選項為錯誤敘述：土地稅法第3條規定的「納稅義務人」是所有權人、典權人、承領人、耕作權人、受託人這幾種固定身分；「土地使用人」是在權屬不明等特殊情形下被「指定代繳」的人，屬於土地稅法第4條的「代繳義務人」，不是第3條規定的「納稅義務人」。本選項混淆了「納稅義務人」與「代繳義務人」兩個不同概念，為本題答案。", "❌ 本選項描述正確，典權人是法定納稅義務人，非錯誤。"]}, {"ch": "E1 地價稅", "year": "107", "num": 20, "q": "土地為信託財產者，於信託關係存續中，以何人為地價稅或田賦之納稅義務人？", "opts": ["委託人", "受託人", "受益人", "信託監察人"], "ans": 1, "exps": ["❌ 一般情形委託人不是地價稅納稅義務人（除非是「受益人為委託人」的特殊情形，此時是合併計算地價總額的對象，但納稅義務人本身仍是受託人）。", "✓ 土地稅法第3條之1：土地為信託財產者，於信託關係存續中，以「受託人」為地價稅或田賦之納稅義務人。受託人是信託財產的名義持有人，負責土地的管理使用，故由其負擔地價稅。", "❌ 受益人享有信託利益，但不是地價稅的法定納稅義務人，除非受益人同時為委託人時才有合併計算地價總額的特殊處理（但仍非「納稅義務人」本身）。", "❌ 信託監察人是監督信託執行的角色，不是地價稅納稅義務人。"]}, {"ch": "E1 地價稅", "year": "107", "num": 22, "q": "自用住宅用地得適用優惠稅率課徵地價稅，下列有關自用住宅用地要件之敘述，何者錯誤？", "opts": ["須土地所有權人或其配偶、直系親屬於該地有居住事實並辦竣戶籍登記", "須為無出租或供營業使用之住宅用地", "土地面積，都市土地未超過三公畝部分，非都市土地未超過七公畝部分", "土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限"], "ans": 0, "exps": ["✓ 本選項為錯誤敘述：自用住宅用地的要件是「辦竣戶籍登記」，法條並未要求「有居住事實」這個額外條件（雖然實務上通常同時存在，但法條文字僅要求戶籍登記要件，未明文要求「居住事實」作為審查標準，本選項加了「有居住事實」這個非法條明文要求的條件，使描述變得不準確，為本題錯誤答案）。", "❌ 本選項描述正確，無出租無營業是法定要件之一，非錯誤。", "❌ 本選項描述正確，3公畝/7公畝是法定面積上限，非錯誤。", "❌ 本選項描述正確，建物所有權須屬本人配偶或直系親屬，符合法定要件，非錯誤。"]}, {"ch": "E1 地價稅", "year": "108", "num": 7, "q": "下列有關平均地權條例及土地稅法中有關累進課地價稅之敘述，何者正確？", "opts": ["超過累進起點地價未達五倍者，就其超過部分課徵千分之三十", "超過累進起點地價五倍至十倍者，就其超過部分課徵千分之三十五", "超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之四十", "超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"], "ans": 3, "exps": ["❌ 未達5倍應課徵15‰，不是30‰，數字錯誤。", "❌ 5至10倍應課徵25‰，不是35‰，數字錯位。", "❌ 10至15倍應課徵35‰，不是40‰，數字錯誤。", "✓ 地價稅累進稅率第五級：超過15倍至20倍，課徵45‰。本選項正確對應到此級距的稅率，這六級稅率分別是：10‰（基本）、15‰、25‰、35‰、45‰、55‰，依序遞增5‰、10‰、10‰、10‰、10‰。"]}, {"ch": "E1 地價稅", "year": "108", "num": 11, "q": "依土地稅法規定，關於地價稅之納稅義務人，下列何項敘述錯誤？", "opts": ["信託土地，於信託關係存續中，為受託人", "設有典權土地，為出典人", "承領土地，為承領人", "承墾土地，為耕作權人"], "ans": 1, "exps": ["❌ 本選項描述正確，受託人是信託土地的法定納稅義務人，非錯誤。", "✓ 本選項為錯誤敘述：設有典權土地的納稅義務人是「典權人」（非出典人），這是E1最常考的固定陷阱，與99-29考點相同。", "❌ 本選項描述正確，承領人是法定納稅義務人，非錯誤。", "❌ 本選項描述正確，耕作權人是法定納稅義務人，非錯誤。"]}, {"ch": "E1 地價稅", "year": "109", "num": 4, "q": "依土地稅法規定，有關地價稅優惠稅率與減免，下列敘述何者錯誤？", "opts": ["依都市計畫法劃設並經目的事業主管機關核准供公眾停車使用之停車場用地，按千分之十計徵地價稅", "經目的事業主管機關核准設立之私立公園、體育場所使用範圍內之土地，免徵地價稅", "公有土地按基本稅率徵收地價稅。但公有土地供公共使用者，免徵地價稅", "都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第17條之規定外，統按千分之六計徵地價稅"], "ans": 1, "exps": ["❌ 本選項描述正確，停車場用地按10‰計徵，非錯誤。", "✓ 本選項為錯誤敘述：私立公園、體育場所等供事業直接使用之土地，是按「千分之十（10‰）」計徵（屬土地稅法第18條清單），不是「免徵」。本選項把10‰課徵誤植為免徵，為本題答案。", "❌ 本選項描述正確：公有非公用土地按基本稅率課徵，公有供公共使用土地免徵，這是正確的對比描述，非錯誤。", "❌ 公設保留地保留期間仍為建築使用者，除自用住宅外統按6‰計徵，本項正確。"]}, {"ch": "E1 地價稅", "year": "110", "num": 7, "q": "依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？", "opts": ["3個月", "6個月", "1年", "3年"], "ans": 1, "exps": ["❌ 延期繳納最長可至6個月，3個月短於法定上限。", "✓ 平均地權條例規定：應納地價稅額因公告地價調整致納稅義務人繳納困難者，得申請延期繳納，延期繳納期間最長不得逾「6個月」。半年是法定上限，是E1的固定數字考點。", "❌ 延期上限為6個月，1年超過法定期間。", "❌ 3年遠超過6個月的法定上限。"]}, {"ch": "E1 地價稅", "year": "112", "num": 1, "q": "都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，其地價稅之計徵，下列何者正確？", "opts": ["免徵", "按千分之六稅率計徵", "按千分之十稅率計徵", "按千分之二稅率計徵"], "ans": 0, "exps": ["✓ 同102-18，都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，免徵地價稅，這是土地稅法第19條的明文規定，是E1高頻考點之一。", "❌ 6‰是保留期間「仍為建築使用」者的稅率，未作使用且隔離者免徵。", "❌ 10‰是一般基本稅率；仍為建築使用者是6‰，未作使用且隔離者免徵。", "❌ 2‰是自用住宅用地的優惠稅率，不適用於未作任何使用的公設保留地。"]}, {"ch": "E1 地價稅", "year": "112", "num": 5, "q": "依土地稅法規定，地價稅之稅率，下列何者錯誤？", "opts": ["地價稅之基本稅率為千分之十", "土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按千分之十稅率徵收", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價五倍者，就其超過部分課徵千分之十五", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"], "ans": 2, "exps": ["❌ 本選項描述正確，10‰是基本稅率，非錯誤。", "❌ 本選項描述正確，未超過起點按基本稅率10‰課徵，非錯誤。", "✓ 本選項為錯誤敘述：超過起點「五倍者」課徵的稅率是「千分之二十五（25‰，第三級）」，不是「千分之十五（15‰）」——15‰是「未達5倍」的稅率，恰好滿5倍時應適用更高一級的25‰。注意臨界點的歸屬：「未達5倍」屬第二級（15‰），「滿5倍至10倍」屬第三級（25‰）。本選項把「超過5倍者」錯誤地歸入第二級稅率，為本題答案。", "❌ 本選項描述正確，15至20倍課徵45‰，非錯誤。"]}, {"ch": "E1 地價稅", "year": "112", "num": 24, "q": "依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列何項非屬所規範者？", "opts": ["土地進行訴訟者", "權屬不明者", "納稅義務人行蹤不明者", "土地所有權人申請由占有人代繳者"], "ans": 0, "exps": ["✓ 土稅法§4：指定土地使用人代繳的事由為權屬不明、納稅義務人行蹤不明、無人管理，或所有權人申請由占有人代繳。「土地在訴訟中」不在其內，故為答案。", "❌ 本選項是土地稅法第4條規定的指定代繳事由之一，屬之。", "❌ 本選項是法定指定代繳事由之一，屬之。", "❌ 本選項是法定指定代繳事由之一，屬之。"]}, {"ch": "E1 地價稅", "year": "114", "num": 4, "q": "依土地稅法之規定，一般地價稅的基本稅率為多少？", "opts": ["百分之十", "百分之五", "千分之十", "千分之十五"], "ans": 2, "exps": ["❌ 百分之十（10%）並非地價稅基本稅率的正確表示方式，地價稅率慣用「千分之」表示，百分之十相當於100‰，數值錯誤。", "❌ 百分之五（5%＝50‰）數值過高，不是基本稅率。", "✓ 土地稅法第16條：地價稅基本稅率為「千分之十（10‰）」，這是最基礎的數字，也是E1反覆出現的核心考點，未超過累進起點地價者，均按此基本稅率課徵。", "❌ 千分之十五是累進稅率第二級（超過起點未達5倍），不是基本稅率。"]}, {"ch": "E1 地價稅", "year": "114", "num": 24, "q": "依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？", "opts": ["都市土地面積未超過五公畝部分", "非都市土地面積未超過十公畝部分", "國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之 地價稅", "土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次 為限"], "ans": 2, "exps": ["❌ 自用住宅都市土地優惠面積為3公畝，不是5公畝（土稅法§17）。", "❌ 非都市土地優惠面積為7公畝，不是10公畝。", "✓ 國民住宅及企業、公營事業興建之勞工宿舍，自動工或取得土地之日起其用地地價稅按2‰（土稅法§18）。", "❌ 自用住宅稅率之適用是「以一處為限」，不是「一次為限」。"]}, {"ch": "E1 地價稅", "year": "114", "num": 25, "q": "政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？", "opts": ["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第 20 條 之規定外，統按千分之十計徵地價稅", "公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅", "依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅", "公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"], "ans": 1, "exps": ["❌ 保留期間仍建築使用者，除自用住宅2‰外統按6‰，不是10‰（土稅法§19）。", "✓ 公設保留地未作任何使用並與使用中土地隔離者，免徵地價稅（土稅法§6）。", "❌ 公設保留地未徵收前之移轉是「免徵」土增稅，不是減半。", "❌ 因繼承或配偶、直系血親間贈與而移轉，是「免徵」遺產稅或贈與稅，不是減半。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 20, "q": "受託人就受託土地，於信託關係存續中有償移轉所有權時，以何者為納稅義務人，課徵土地增值稅？", "opts": ["免徵", "受託人", "委託人", "監察人"], "ans": 1, "exps": ["❌ 信託土地在受託人有償移轉時，不是免徵，而是要正常課徵土地增值稅，只是納稅義務人特定為受託人。", "✓ 土地稅法第5條之2：受託人就受託土地，於信託關係存續中有償移轉所有權時，以受託人為納稅義務人，課徵土地增值稅。信託財產名義上屬受託人所有，受託人是法律上的處分主體，故由其負擔納稅義務（但實質上稅款來源仍由信託財產支付）。", "❌ 委託人雖是信託財產的實質規劃者，但有償移轉時的法定納稅義務人是受託人，不是委託人。", "❌ 信託監察人是監督信託執行的角色，不是納稅義務人。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 22, "q": "依規定每年何時公告土地現值表？", "opts": ["1月1日", "2月1日", "7月1日", "8月1日"], "ans": 0, "exps": ["✓ 土地稅法第46條：直轄市或縣市政府應於每年「1月1日」公告土地現值，作為該年度土地移轉或設定典權時申報土地移轉現值的依據。1月1日是固定的公告日期，是E2最基本的數字考點。", "❌ 公告土地現值於每年1月1日公告，2月1日不是公告日。", "❌ 公告土地現值於每年1月1日公告，7月1日不是公告日。", "❌ 公告土地現值於每年1月1日公告；8月31日是地價稅基準日，勿混淆。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 24, "q": "依相關法條之規定，下列何者定需課土地增值稅？", "opts": ["兄弟相互贈與土地", "區段徵收之土地，以現金補償其地價者", "作農業使用之農業用地，移轉與自然人時", "依都市計畫法指定之公共設施保留地尚未被徵收前之移轉"], "ans": 0, "exps": ["✓ 兄弟間贈與是無償移轉，由受贈人納土增稅。無不課徵或免徵規定，故「定」需課。", "❌ 區段徵收以現金補償地價者，免徵土地增值稅（土稅法§39）。", "❌ 農地作農業使用移轉與自然人，經申請可不課徵土增稅（土稅法§39-2）。", "❌ 公設保留地在未被徵收前之移轉，免徵土增稅（土稅法§39）。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 30, "q": "依土地稅法之規定，土地所有權人因重購土地退還土地增值稅者，其重購之土地，自完成移轉登記之日起，幾年內再行移轉時，除就該次移轉之漲價總數額課徵土地增值稅外，並應追繳原退還稅款？", "opts": ["2年", "3年", "4年", "5年"], "ans": 3, "exps": ["❌ 追繳期間為5年，2年過短。", "❌ 追繳期間為5年，3年過短。", "❌ 追繳期間為5年，4年過短。", "✓ 土地稅法第35條：因重購退稅取得的土地，自完成移轉登記之日起「5年內」再行移轉或改作其他用途者，除課徵該次移轉的土地增值稅外，並應追繳原退還稅款。5年是防止短期套利規避稅負的監管期間。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 32, "q": "依土地稅法之規定，土地增值稅納稅義務人於收到土地增值稅繳納通知書後，應於幾日內向公庫繳納？", "opts": ["10日", "15日", "20日", "30日"], "ans": 3, "exps": ["❌ 繳納期限為30日，10日過短。", "❌ 繳納期限為30日，15日過短。", "❌ 20日是核定應納稅額的延長期限（自用住宅案件），不是繳納期限。", "✓ 土地稅法第49條：納稅義務人接到土地增值稅繳納通知書後，應於「30日」內向公庫繳納。30日是E2標準的繳納期限，與許多其他稅法的繳納期限一致。"]}, {"ch": "E2 土地增值稅", "year": "99", "num": 35, "q": "土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值多少比率之罰鍰？", "opts": ["免罰", "百分之一", "百分之二", "百分之五"], "ans": 2, "exps": ["❌ 此行為有罰鍰，不是免罰。", "❌ 罰鍰比率為再行出售移轉現值的2%，不是1%。", "✓ 土地買賣未辦竣權利移轉登記再行出售者，處再行出售移轉現值2%罰鍰。此針對連續轉售（轉約）規避稅負而設。", "❌ 罰鍰比率為再行出售移轉現值的2%，不是5%。"]}, {"ch": "E2 土地增值稅", "year": "100", "num": 4, "q": "土地所有權人出售其自用住宅用地適用自用住宅用地稅率繳納土地增值稅後，再出售其自用住宅用地時，應已持有該土地最少幾年以上，才能再適用此優惠稅率？", "opts": ["一年", "五年", "六年", "十年"], "ans": 2, "exps": ["❌ 法定年限為連續滿6年，1年過短。", "❌ 法定為設籍並持有連續滿6年，不是5年。", "✓ 一生一屋：出售時須設有戶籍並持有該自用住宅連續滿6年（土稅法§34）。另須無該自用住宅以外之房屋，且出售前5年內無營業或出租。", "❌ 法定年限為6年，10年過長。"]}, {"ch": "E2 土地增值稅", "year": "100", "num": 5, "q": "依土地稅法規定，關於土地增值稅之納稅義務人，何者為正確？", "opts": ["土地設定典權時之典權人", "受託人就受託土地於信託關係存續中，有償移轉時之委託人", "土地贈與時之贈與人", "土地交換時之原所有權人"], "ans": 3, "exps": ["❌ 設定典權時的土地增值稅納稅義務人是「出典人」（預繳），不是典權人。", "❌ 此情形的納稅義務人是「受託人」本人，不是委託人，同99-20考點。", "❌ 贈與（無償移轉）的納稅義務人是「取得所有權人（受贈人）」，不是贈與人，這是常見的反直覺考點。", "✓ 土地稅法第5條：土地交換時，以原所有權人為納稅義務人（交換雙方互為原所有權人各自負擔自己交出土地部分的稅額）。本選項是唯一正確描述納稅義務人的選項。"]}, {"ch": "E2 土地增值稅", "year": "100", "num": 6, "q": "受贈土地之財團法人若未按捐贈目的使用土地，除追補應納稅額外，並處應納土地增值稅額多少倍之罰鍰?", "opts": ["一倍", "二倍", "三倍", "五倍"], "ans": 1, "exps": ["❌ 罰鍰為應納土地增值稅額的2倍，不是1倍。", "✓ 私人捐贈財團法人供社福事業之土地，經核准不課徵土增稅；未按捐贈目的使用者，追補稅額並處應納稅額2倍罰鍰。", "❌ 罰鍰為應納土地增值稅額的2倍，不是3倍。", "❌ 罰鍰為應納土地增值稅額的2倍，不是5倍。"]}, {"ch": "E2 土地增值稅", "year": "100", "num": 7, "q": "作農業使用之農業用地，移轉與自然人時，得申請不課徵土地增值稅。主管稽徵機關核准不課徵土地增值稅之農業用地後，應於核准後多久時間內，將有關資料送直轄市、縣（市）農業主管機關？", "opts": ["一個月", "二個月", "三個月", "六個月"], "ans": 0, "exps": ["✓ 土地稅法第39條之2：農業用地移轉與自然人申請不課徵土地增值稅，主管稽徵機關核准後，應於核准後「1個月內」將有關資料送直轄市縣市農業主管機關。1個月是固定的行政作業期限。", "❌ 法定期限為核准後1個月內，2個月過長。", "❌ 法定期限為核准後1個月內，3個月過長。", "❌ 法定期限為核准後1個月內，6個月過長。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 25, "q": "父親贈與一幢透天建築物給兒子，在正常情況下依土地稅法與契稅條例之規定，下列有關應納稅負之敘述，何者最正確？", "opts": ["父親應繳納土地增值稅與契稅", "父親應繳納土地增值稅，兒子應繳納契稅", "兒子應繳納土地增值稅，父親應繳納契稅", "兒子應繳納土地增值稅與契稅"], "ans": 3, "exps": ["❌ 父親（贈與人）不負擔土地增值稅（贈與時納稅義務人是受贈人），父親更不會繳契稅（契稅與土地增值稅是不同稅目，契稅針對房屋部分）。", "❌ 土地增值稅納稅義務人應是兒子（受贈人），不是父親，此選項把納稅義務人說反了。", "❌ 契稅納稅義務人在贈與情形是「受贈人」（兒子），不是贈與人（父親），此選項把契稅納稅義務人也說反了。", "✓ 贈與一幢透天建築物（含土地與房屋）：土地部分課土地增值稅，無償移轉（贈與）的納稅義務人是「取得所有權人」（兒子）；房屋部分課契稅，贈與契稅的納稅義務人是「受贈人」（兒子）。兩稅目的納稅義務人都是兒子，本選項完全正確。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 27, "q": "關於土地增值稅之規定，下列何者只規定在平均地權條例中？", "opts": ["公告土地現值應調整至一般正常交易價格", "公告土地現值，不得低於一般正常交易價值之一定比例。是項一定比例，應逐年接近一般正常交易價格", "全國平均之公告土地現值調整達一般正常交易價格百分之九十以上時，第33條第1項之稅率應檢討修正", "因修正稅率造成直轄市政府及縣（市）政府稅收之實質損失，於財政收支劃分法修正擴大中央統籌分配稅款規模之規定施行前，由中央政府補足之"], "ans": 1, "exps": ["❌ 此規定在土地稅法和平均地權條例都有提及，不是「只規定在平均地權條例」。", "✓ 此項漸進調整機制（公告現值逐年接近市價的比例規定），是平均地權條例（而非土地稅法）的特有規定，土地稅法本身沒有這個「逐年調整比例」的條文，故本選項「只規定在平均地權條例中」是正確的。", "❌ 此為土地稅法本身的稅率檢討條款，不是只在平均地權條例。", "❌ 此為修正稅率後的財政補償配套，並非本題所問「只規定在平均地權條例」者；答案為B。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 28, "q": "依土地稅法規定，下列敘述何者最正確？", "opts": ["設有典權土地，以出典人為地價稅納稅義務人", "設有典權土地，以典權人為土地增值稅納稅義務人", "配偶相互贈與之土地，免徵土地增值稅", "經重劃之土地，於重劃後第一次移轉時，其土地增值稅減徵百分之四十"], "ans": 3, "exps": ["❌ 設有典權土地的地價稅納稅義務人是「典權人」，不是出典人，本選項描述錯誤。", "❌ 設定典權時的土地增值稅納稅義務人是「出典人」（預繳），不是典權人，本選項把地價稅和土增稅的典權相關規定混淆顛倒了。", "❌ 配偶相互贈與之土地是「不課徵」（得申請），不是「免徵」，兩個用語在土地稅法上是不同的法律效果（不課徵將來再移轉仍要回溯課稅；免徵則永久不課），此選項用語錯誤。", "✓ 平均地權條例第42條：經市地重劃之土地，於重劃後第一次移轉時，土地增值稅減徵40%。40%是固定的減徵比例，與區段徵收抵價地第一次移轉減徵40%的規定相同。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 29, "q": "主管稽徵機關應於申報土地移轉現值收件之日起七日內，核定應納土地增值稅額，但申請按自用住宅用地稅率課徵之案件，其期間得延長為多少日？", "opts": ["十日", "二十日", "二十一日", "三十日"], "ans": 1, "exps": ["❌ 10日不是延長後的期限。", "✓ 土地稅法第49條：主管稽徵機關應於收件之日起7日內核定應納土地增值稅額；但申請按自用住宅用地稅率課徵之案件，因須審查戶籍、面積等較複雜的要件，期間得延長為「20日」。從7日延長到20日，差距是13天，這個20日是固定考點。", "❌ 21日不是法定延長期限。", "❌ 30日是繳納稅款的期限，不是核定延長的期限，兩者容易混淆。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 39, "q": "依土地稅法規定，法院判決移轉登記者，其申報移轉現值之審核標準，以那一天當期之公告土地現值為準？", "opts": ["契約訂約日", "受理申報機關收件日", "法院判決確定日", "法院起訴日"], "ans": 3, "exps": ["❌ 契約訂約日是一般買賣（30日內申報）的審核標準，不是法院判決移轉的標準。", "❌ 收件日是逾30日才申報情形的審核標準，不是法院判決移轉的標準。", "❌ 法院判決移轉登記以申報人向法院「起訴日」為準，不是判決確定日。", "✓ 法院判決移轉登記者，申報移轉現值以申報人向法院起訴日當期之公告土地現值為準。"]}, {"ch": "E2 土地增值稅", "year": "101", "num": 40, "q": "有關長期持有土地之土地增值稅減徵，依平均地權條例第40條之規定，下列敘述何者最正確？", "opts": ["持有土地年限超過二十年以上者，就其土地增值稅超過第一項最低稅率部分減徵百分之二十", "持有土地年限超過三十年以上者，就其土地增值稅超過第一項最低稅率部分減徵百分之四十", "持有土地年限超過四十年以上者，就其土地增值稅超過第一項最低稅率部分減徵百分之六十", "持有土地年限超過五十年以上者，就其土地增值稅超過第一項最低稅率部分減徵百分之八十"], "ans": 0, "exps": ["✓ 平均地權條例第40條（與土地稅法第33條第5項相呼應）：長期持有減徵規定，超過20年減徵20%、超過30年減徵30%、超過40年減徵40%。本選項正確對應20年減徵20%的級距。", "❌ 超過30年應減徵30%，不是40%，數字錯位。", "❌ 超過40年應減徵40%，不是60%，數字過高。", "❌ 法律沒有「超過50年」這個級距，最高級距是「超過40年減徵40%」，沒有更高的級距，本選項為虛構規定。"]}, {"ch": "E2 土地增值稅", "year": "102", "num": 12, "q": "依土地稅法所稱公告土地現值，係指直轄市及縣（市）政府依下列何法律規定公告之土地現值？", "opts": ["土地法", "平均地權條例", "不動產估價技術規則", "土地稅法"], "ans": 1, "exps": ["❌ 土地法有登記、地價等規定，但公告土地現值並非依該法公告。", "✓ 土稅法所稱公告土地現值，指直轄市、縣（市）政府依平均地權條例公告之土地現值，為課土增稅之依據。", "❌ 不動產估價技術規則是估價作業準則，不是公告土地現值的法源。", "❌ 土稅法是引用該公告現值課稅，公告依據是平均地權條例，非土稅法本身。"]}, {"ch": "E2 土地增值稅", "year": "102", "num": 19, "q": "下列敘述何者錯誤？", "opts": ["甲將一筆建地信託於乙，不課徵土地增值稅", "受託人乙依信託契約將受託之建地移轉給歸屬人丙，不課徵土地增值稅", "受託人乙將受託之建地移轉還給委託人甲，不課徵土地增值稅", "受託人乙將受託之建地移轉給新受託人丁，不課徵土地增值稅"], "ans": 1, "exps": ["❌ 本選項描述正確：信託行為成立時，委託人移轉給受託人不課徵土增稅，非錯誤。", "✓ 本選項為錯誤敘述：受託人依信託本旨移轉財產給「委託人以外之歸屬權利人」（本題的丙），是應該「課徵」土地增值稅的情形，不是「不課徵」。信託土地增值稅的不課徵情形限於：成立時委託人→受託人、受託人變更、消滅時受託人→委託人、消滅時委託人→受益人（受益人為委託人本人時）；移轉給「委託人以外的歸屬人」則應正常課稅，本選項描述錯誤。", "❌ 本選項描述正確：信託關係消滅，受託人歸還委託人，不課徵土增稅，非錯誤。", "❌ 本選項描述正確：信託存續中受託人變更（原受託人→新受託人），不課徵土增稅，非錯誤。"]}, {"ch": "E2 土地增值稅", "year": "102", "num": 25, "q": "依土地稅法規定，下列何者不屬於免徵土地增值稅之情形？", "opts": ["區段徵收之土地，以現金補償其地價者", "被徵收之土地", "因繼承而移轉之土地", "已規定地價之土地，設定典權時"], "ans": 3, "exps": ["❌ 區段徵收以現金補償地價者，免徵土增稅（土稅法§39），屬免徵。", "❌ 被徵收之土地免徵土增稅（土稅法§39），屬免徵。", "❌ 因繼承而移轉之土地免徵土增稅（土稅法§28），屬免徵。", "✓ （本題問不屬免徵者）已規定地價之土地設定典權時，出典人應預繳土增稅（土稅法§29），回贖時無息退還。"]}, {"ch": "E2 土地增值稅", "year": "102", "num": 34, "q": "甲夫將其名下土地贈與乙妻，乙妻又將該土地賣給丙友人，則下列敘述何者正確？", "opts": ["甲乙間，乙丙間之移轉，免徵土地增值稅", "甲乙間，乙丙間之移轉，不課徵土地增值稅", "甲乙間之移轉，不課徵土地增值稅，乙丙間之移轉，應課徵土地增值稅", "乙丙間之移轉，以移轉時之移轉現值為原地價"], "ans": 2, "exps": ["❌ 甲乙間（夫妻贈與）是「不課徵」（非「免徵」），乙丙間（出售給友人）應正常課徵土地增值稅，本選項兩處都錯。", "❌ 甲乙間是不課徵沒錯，但乙丙間（賣給第三人丙）應正常課稅，不是不課徵，本選項後半段錯誤。", "✓ 配偶相互贈與（甲乙間）得申請不課徵土地增值稅；但乙再移轉給第三人丙（乙丙間）時，已經不是配偶間移轉，應正常課徵土地增值稅，計算漲價總數額時以「第一次贈與前之原地價」為原地價（追溯計算，不因配偶贈與而重新設定原地價）。", "❌ 乙丙間移轉計算漲價總數額時，「原地價」應以「甲乙贈與前的原地價」為準（追溯原始基期），不是用「移轉時的移轉現值」作為原地價（這會讓配偶贈與成為規避漲價總數額的工具，違反立法目的）。"]}, {"ch": "E2 土地增值稅", "year": "103", "num": 9, "q": "下列關於地價稅及土地增值稅納稅義務人之敘述，何者為是？", "opts": ["設有典權土地，地價稅之納稅義務人為出典人", "贈與土地，土地增值稅之納稅義務人為贈與人", "土地為分別共有者，地價稅之納稅義務人為管理人", "土地買賣約定由買方負擔者，土地增值稅之納稅義務人為原所有權人"], "ans": 3, "exps": ["❌ 地價稅的典權土地納稅義務人是「典權人」，不是出典人，此為E1的固定陷阱。", "❌ 贈與（無償移轉）的納稅義務人是「取得所有權人（受贈人）」，不是贈與人。", "❌ 分別共有土地的地價稅納稅義務人是「各共有人」（按應有部分），得推定一人繳納，不是「管理人」這個概念。", "✓ 即使雙方私下約定由買方（取得人）負擔土地增值稅，這只是私法上的契約約定（債權效力），法定的納稅義務人「仍是原所有權人」（賣方）。稅捐機關向法定納稅義務人（賣方）課稅，賣方再依約定向買方求償（民事問題）。"]}, {"ch": "E2 土地增值稅", "year": "103", "num": 10, "q": "土地所有權人出售其自用住宅用地，經使用過一生一次的土地增值稅優惠稅率後，如再出售其自用住宅用地，仍要適用優惠稅率，應符合之條件何者正確？", "opts": ["出售都市土地面積未超過300平方公尺", "出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋", "出售前一年內，無供營業使用或出租", "土地所有權人於土地出售前，在該地設有戶籍，且持有該自用住宅連續滿五年"], "ans": 1, "exps": ["❌ 「一生一屋」的面積限制是「都市土地未超過1.5公畝（即150平方公尺）」，不是300平方公尺，數字錯誤（300平方公尺接近一般用地的3公畝＝300平方公尺，與一生一屋的1.5公畝混淆）。", "✓ 「一生一屋」優惠的核心要件之一：出售時申請人與配偶及未成年子女名下「無該自用住宅以外之房屋」（即僅有這一戶自住房屋）。這是「一生一屋」與「一生一次」最大的差異——一生一屋強調「僅此一屋」的身分狀態。", "❌ 「一生一屋」要求的是出售前「5年內」無供營業使用或出租（比一生一次的1年更長），本選項說1年是錯誤的（這是一生一次的要件，非一生一屋）。", "❌ 「一生一屋」要求持有並設籍滿「6年」（不是5年），本選項數字錯誤。"]}, {"ch": "E2 土地增值稅", "year": "103", "num": 26, "q": "土地為信託財產者，下列各款信託關係人間移轉所有權，不課徵土地增值稅之敘述，何者正確？", "opts": ["因信託行為成立，委託人與受託人間", "信託關係存續中委託人變更時，原受託人與新受託人間", "因遺囑成立之信託，於信託關係消滅時，受託人與委託人", "信託契約明定信託財產之受益人為委託人者，信託關係消滅時，委託人與受益人間"], "ans": 0, "exps": ["✓ 信託成立時，委託人移轉信託財產給受託人，雖然名義上有所有權移轉，但實質上是信託財產的形式性轉移（受託人僅是名義持有人，不享有實質利益），故此移轉「不課徵」土地增值稅。本選項是同類四個信託土增稅不課徵情形中最基本的一項。", "❌ 不課徵者是「受託人變更」時原受託人與新受託人間，委託人變更不在此列。", "❌ 遺囑信託於信託關係消滅時，不課徵者為受託人與「受益人」間，本項寫成委託人。", "❌ 受益人為委託人者，信託消滅時不課徵者為受託人與委託人間，本項對象有誤。"]}, {"ch": "E2 土地增值稅", "year": "104", "num": 20, "q": "依都市更新條例規定，都市更新地區內，對於不願參加權利變換而領取現金補償者，有關稅捐之減免，下列何者正確？", "opts": ["減徵土地增值稅百分之四十", "減徵土地增值稅及契稅百分之三十", "免徵土地增值稅", "免徵地價稅及房屋稅"], "ans": 0, "exps": ["✓ 都更地區內不願參加權利變換而領取現金補償者，減徵土地增值稅40%（都更條例§46，依官方答案）。", "❌ 減徵幅度不是30%，且本題所指稅目以土增稅為主，不是土增稅及契稅各30%。", "❌ 領現金補償者是「減徵」，並非免徵土增稅。", "❌ 地價稅、房屋稅的減免是針對更新期間無法使用等情形，與領現金補償無關。"]}, {"ch": "E2 土地增值稅", "year": "104", "num": 32, "q": "依都市計畫法指定之公共設施保留地，尚未被徵收前之移轉，其土地增值稅之課徵，下列何者正確？", "opts": ["減徵百分之四十", "準用被徵收之土地予以免徵之", "減半徵收之", "以該土地之原地價計算漲價總數額課徵之"], "ans": 1, "exps": ["❌ 40%減徵是重劃後第一次移轉或區段徵收抵價地第一次移轉的優惠，不是公設保留地尚未被徵收前移轉的優惠方式。", "✓ 土地稅法第39條第2項：依都市計畫法指定之公共設施保留地，尚未被徵收前之移轉，準用「被徵收之土地」免徵土地增值稅的規定，予以免徵。公設保留地雖然還沒被徵收，但既然遲早會被徵收，法律提前給予免稅優惠，鼓勵土地流通並減輕地主負擔。", "❌ 減半徵收不是公設保留地尚未被徵收前移轉的處理方式，正確是「免徵」（全免，比減半更優惠）。", "❌ 既然是免徵，就不需要計算漲價總數額課稅，本選項與「免徵」的法律效果矛盾。"]}, {"ch": "E2 土地增值稅", "year": "104", "num": 33, "q": "依土地稅法規定，作農業使用之農業用地，移轉與自然人時，下列有關土地增值稅之課徵，何者正確？", "opts": ["不課徵土地增值稅", "得申請不課徵土地增值稅", "免徵土地增值稅", "得申請免徵土地增值稅"], "ans": 1, "exps": ["❌ 本選項缺少「得申請」這個程序要件——農業用地移轉與自然人不是自動不課徵，而是「得申請」不課徵，須經主管稽徵機關核准。", "✓ 土地稅法第39條之2：作農業使用之農業用地，移轉與自然人時，「得申請」不課徵土地增值稅（需要主動申請，經核准後才不課徵，不是自動發生）。「得申請」是這類優惠規定共通的關鍵字。", "❌ 農業用地移轉是「不課徵」，不是「免徵」，兩者法律效果不同（不課徵在將來移轉時要追溯計算）。", "❌ 應是「得申請不課徵」，不是「得申請免徵」，用語上的細微差異是重要陷阱。"]}, {"ch": "E2 土地增值稅", "year": "104", "num": 35, "q": "土地所有權移轉或設定典權時，倘雙方當事人共同申報之移轉現值，經審核超過當期公告土地現值者，應以下列何者為準，依規定徵收土地增值稅？", "opts": ["按當期公告土地現值", "按前次移轉現值", "按雙方當事人自行申報之移轉現值", "按稅捐機關查證之移轉現值"], "ans": 2, "exps": ["❌ 若雙方申報移轉現值超過當期公告現值，不是按公告現值課稅（這樣會少課），而是按更高的申報現值課稅。", "❌ 前次移轉現值是計算原地價用的，不是本次申報審核的依據。", "✓ 土地稅法第30條第2項：申報移轉現值經審核「超過」當期公告土地現值者，以雙方自行申報的移轉現值為準徵稅（從高課稅原則，避免雙方故意低報規避稅負，但若高報則依其高報金額課稅，不會幫納稅人打折）。", "❌ 稅捐機關沒有另外「查證」一個移轉現值的程序，是直接以雙方自行申報的數字為準。"]}, {"ch": "E2 土地增值稅", "year": "105", "num": 11, "q": "有關土地增值稅之優惠規定，下列何者正確？", "opts": ["土地所有權人出售其自用住宅用地，得享一生一次之百分之五土地增值稅優惠稅率", "土地所有權人於土地重劃後第一次移轉，得享土地增值稅減半徵收之優惠稅率", "因繼承而移轉之土地，得免徵土地增值稅", "政府出售公有土地，得享土地增值稅減半之優惠稅率"], "ans": 2, "exps": ["❌ 自用住宅優惠稅率是「10%」，不是5%，數字錯誤。", "❌ 重劃後第一次移轉是「減徵40%」，不是「減半徵收（50%）」，兩者比例不同。", "✓ 土地稅法第28條：因繼承而移轉之土地，免徵土地增值稅。繼承是法定財產移轉（非自願性質），免徵是對繼承人的基本保障，這是E2最基礎的免徵情形之一。", "❌ 政府出售公有土地是「免徵」（依官方答案以「各級政府出售或依法贈與之公有土地」免徵土增稅），不是「減半」。"]}, {"ch": "E2 土地增值稅", "year": "105", "num": 39, "q": "甲有A地一筆，並將A地出賣給乙，約定由乙負擔以應辦理所有權移轉登記日當期之公告土地現值計算之土地增值稅；但甲遲延辦理A地所有權移轉登記，致乙多繳稅額。下列敘述何者正確？", "opts": ["依目前最高法院見解，由乙負擔土地增值稅的約定係屬無效", "依目前行政法院見解，由乙負擔土地增值稅的約定係屬違憲", "依目前最高法院見解，乙得向甲請求給付遲延的損害賠償", "依目前最高法院見解，乙不得向甲請求賠償"], "ans": 2, "exps": ["❌ 私法上約定由買方負擔稅捐是有效的契約安排，不會因此被認定無效，本選項描述錯誤。", "❌ 此約定純屬私法契約自由範疇，不涉及違憲問題，本選項描述錯誤。", "✓ 依最高法院實務見解，雙方約定由買方（乙）負擔以「移轉登記日」當期公告現值計算的土地增值稅，若因賣方（甲）遲延辦理移轉登記，導致登記日延後而公告現值上漲，使乙多繳了稅額，乙得依民法給付遲延的規定，向甲請求賠償因遲延所生的損害（多繳的稅額差距）。這是契約法上常考的「遲延損害賠償」概念與土地稅法案例結合的考題。", "❌ 與官方答案C相反，乙是可以請求賠償的，本選項描述錯誤。"]}, {"ch": "E2 土地增值稅", "year": "106", "num": 10, "q": "下列何者不符合申請自用住宅用地之土地增值稅稅率規定？", "opts": ["出售前1年內，未營業使用或出租", "都市土地面積未超過3公畝部分或非都市土地面積未超過7公畝部分", "土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率者，以一處為限", "土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記"], "ans": 2, "exps": ["❌ 本選項描述正確，1年內無出租無營業使用是法定要件之一，非「不符合」。", "❌ 本選項描述正確，3公畝/7公畝是法定面積上限，非「不符合」。", "✓ 本項不符規定：土增稅自用住宅優惠是「一生一次」，「以一處為限」是地價稅自用住宅用地的要件。", "❌ 本選項描述正確，戶籍登記是法定要件之一，非「不符合」。"]}, {"ch": "E2 土地增值稅", "year": "106", "num": 12, "q": "下列何者是土地增值稅的課稅基礎？", "opts": ["累進起點地價", "公告土地現值", "土地漲價總數額", "申報地價"], "ans": 2, "exps": ["❌ 累進起點地價是地價稅的概念，不是土地增值稅的課稅基礎。", "❌ 公告土地現值是計算土地增值稅的「參考依據之一」（用於申報核定），但「課稅基礎」本身是漲價總數額，不是公告現值本身。", "✓ 土地稅法明文規定，土地增值稅的課稅基礎（稅基）是「土地漲價總數額」，即土地移轉時申報現值減去原地價（經物價指數調整）及相關可扣除費用後的餘額，這是E2最核心的基本概念。", "❌ 申報地價是地價稅的概念，不是土地增值稅的課稅基礎。"]}, {"ch": "E2 土地增值稅", "year": "106", "num": 20, "q": "甲出售市價2,000萬元之房屋連同基地，出售時土地公告現值總額為1,000萬元，房屋課稅現值為300萬元，繳納土地增值稅100萬元。如果甲符合自用住宅用地之規定，請問甲至少應買多少錢之房屋土地才能申請退還土地增值稅100萬元？", "opts": ["不問市價，只要新購土地之公告土地現值大於 900 萬元", "不問市價，只要新購土地之公告土地現值大於 1,000 萬元", "新購之房屋現值大於 300 萬元，房屋連同基地之市價大於 2,000 萬元", "新購房屋連同基地之市價大於 2,000 萬元"], "ans": 1, "exps": ["❌ 新購地價大於900萬僅表示「有餘額」可退部分稅款，要退全部100萬須更高。", "✓ 退稅須新購地價超過「原售地價扣除土增稅後餘額」（900萬）；要全額退100萬須不少於1,000萬（土稅法§35）。", "❌ 比較的是土地地價（公告現值），不是房屋現值，也不看市價。", "❌ 市價不是判斷標準；土稅法§35比較的是新舊土地地價。"]}, {"ch": "E2 土地增值稅", "year": "106", "num": 21, "q": "土地稅法規定農業用地移轉與自然人時，得申請不課徵土地增值稅。此處所稱農業用地，下列規定何者錯誤？", "opts": ["農業發展條例第3條第11款所稱之耕地", "依區域計畫法劃定為各種使用分區內所編定之林業用地、養殖用地、水利用地、生態保護用地、國土保安用地及供農路使用之土地，或上開分區內暫未依法編定用地別之土地", "依區域計畫法劃定為農業區、山坡地保育區、森林區以外之分區內所編定之農牧用地", "依都市計畫法劃定為農業區、保護區內之土地"], "ans": 2, "exps": ["❌ 此為法定農業用地範圍之一，屬之。", "❌ 此為法定農業用地範圍之一，屬之。", "✓ 本選項為錯誤敘述：依土地稅法施行細則對「農業用地」的定義，農牧用地必須是位於「農業區、山坡地保育區、森林區」等特定使用分區內所編定，本選項說的是「以外之分區」所編定的農牧用地，這與法定範圍相反，故本選項描述錯誤，為本題答案。", "❌ 此為法定農業用地範圍之一，屬之。"]}, {"ch": "E2 土地增值稅", "year": "106", "num": 33, "q": "土地所有權人曾使用自用住宅用地優惠稅率後，再出售其自用住宅用地，符合下列何項規定，為不受一次優惠稅率限制條件之一：", "opts": ["出售都市土地面積未超過 3 公畝部分或非都市土地面積未超過 7 公畝部分", "出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋", "出售前持有該土地 5 年以上", "土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿 5 年"], "ans": 1, "exps": ["❌ 3公畝／7公畝是「一生一次」10%的面積；一生一屋是1.5公畝／3.5公畝。", "✓ 一生一屋要件之一：出售時所有權人與配偶及未成年子女無該自用住宅以外之房屋（土稅法§34）。", "❌ 「持有5年」不是要件；一生一屋須設戶籍且持有連續滿6年。", "❌ 戶籍及持有須連續滿6年，不是5年。"]}, {"ch": "E2 土地增值稅", "year": "107", "num": 21, "q": "配偶相互贈與之土地，得申請不課徵土地增值稅。但於再移轉第三人時，以該土地第一次贈與前之原規定地價或前次移轉現值為原地價，計算下列何種數值或數額，課徵土地增值稅？", "opts": ["公告現值", "申報移轉現值", "現值數額", "漲價總數額"], "ans": 3, "exps": ["❌ 公告現值不是計算漲價總數額的最終結果，而是計算過程中的參考價格之一，本題問的是計算「何種數值」課稅，答案應是整個課稅基礎的名稱。", "❌ 申報移轉現值是計算漲價總數額的其中一個輸入值（被減數），不是課稅的最終標的。", "❌ 「現值數額」不是法定用語，為虛構選項。", "✓ 同106-12，土地增值稅的課稅基礎是「漲價總數額」。本題情境是配偶贈與不課徵後再移轉第三人，計算漲價總數額時要以「第一次贈與前」的原地價為原地價（不能用配偶贈與時的現值重設基期），最終仍是計算並課徵「漲價總數額」對應的稅額。"]}, {"ch": "E2 土地增值稅", "year": "108", "num": 6, "q": "下列有關土地所有權移轉或設定典權，申報移轉現值之審核標準，係以何時之當期公告土地現值為準？", "opts": ["申報人逾訂定契約之日起三十日始申報者，以訂約日", "遺贈之土地，以遺贈人死亡後六個月", "依法院判決移轉登記者，以申報人向法院起訴日", "經法院拍賣之土地，以強制執行日"], "ans": 2, "exps": ["❌ 逾30日才申報者，以受理申報機關收件日為準；以訂約日為準僅限30日內申報。", "❌ 遺贈之土地審核標準是以「遺贈人死亡日」為準，不是「死亡後六個月」，本選項時點描述錯誤。", "✓ 依法院判決移轉登記者，以申報人向法院起訴日當期公告土地現值為準（土稅法§30）。", "❌ 經法院拍賣之土地審核標準是以「拍定日」為準，不是「強制執行日」，這是常見的混淆陷阱。"]}, {"ch": "E2 土地增值稅", "year": "108", "num": 22, "q": "土地所有權辦理買賣移轉登記時，申報土地移轉現值之審核標準，下列何項敘述錯誤？", "opts": ["申報人於訂定契約之日起三十日內申報者，以訂約日當期之公告土地現值為準", "申報人逾訂定契約之日起三十日始申報者，以受理申報機關收件日當期之公告土地現值為準", "遺贈之土地，以遺贈人死亡日當期之公告土地現值為準", "依法院判決移轉登記者，以判決確定日當期之公告土地現值為準"], "ans": 3, "exps": ["❌ 本選項描述正確，30日內申報以訂約日為準，符合規定，非錯誤。", "❌ 本選項描述正確，逾期申報以收件日為準，符合規定，非錯誤。", "❌ 本選項描述正確，遺贈以死亡日為準，符合規定，非錯誤。", "✓ 本項為錯誤敘述：法院判決移轉登記，應以申報人向法院「起訴日」為準，不是判決確定日。"]}, {"ch": "E2 土地增值稅", "year": "109", "num": 10, "q": "依平均地權條例之規定，土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起幾日內，檢同契約及有關文件，共同申請土地所有權移轉或設定典權登記，並共同申報其土地移轉現值？", "opts": ["10日", "20日", "30日", "40日"], "ans": 2, "exps": ["❌ 申報期限為30日，10日過短。", "❌ 申報期限為30日，20日是自用住宅案件核定的延長期限。", "✓ 平均地權條例第47條：土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起「30日」內，共同申請所有權移轉或設定典權登記，並共同申報土地移轉現值。30日是申報的基本期限，無論一般買賣或實價登錄都採此期限。", "❌ 申報期限為30日，40日是工業用地申請優惠稅率的期限。"]}, {"ch": "E2 土地增值稅", "year": "110", "num": 8, "q": "平均地權條例第35條之1規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰鍰。下列何者不是規範中的情形？", "opts": ["未辦理用地變更者", "未按捐贈目的使用土地者", "違反各該事業設立宗旨者", "土地收益未全部用於各該事業者"], "ans": 0, "exps": ["✓ 本選項依官方答案，「未辦理用地變更」不在平均地權條例第35條之1規定的三種應追補稅額並處2倍罰鍰的情形內。法定三種情形是：未按捐贈目的使用、違反設立宗旨、土地收益未全部用於該事業，這三項都與「使用情形」有關，而「用地變更」屬於都市計畫或地政程序的範疇，不在此罰則規範內。", "❌ 此為法定三種情形之一，屬之。", "❌ 此為法定三種情形之一，屬之。", "❌ 此為法定三種情形之一，屬之。"]}, {"ch": "E2 土地增值稅", "year": "110", "num": 19, "q": "依土地稅法規定，土地所有權人第一次出售其自用住宅用地，其適用自用住宅用地特別稅率之要件，下列敘述何者正確？①都市土地面積未超過三公畝部分和非都市土地面積未超過七公畝部分②其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之③需土地於出售前5年內，不曾供營業使用或出租者④土地所有權人與其配偶及未成年直系親屬需於該地辦竣戶籍登記", "opts": ["②", "①②", "①②④", "③④"], "ans": 0, "exps": ["✓ 只有②正確：一生一次的土增稅優惠，就該部分漲價總數額統按10%徵收。①寫「和」，法條為都市3公畝「或」非都市7公畝；③應為1年內；④法條為配偶、直系親屬，不限未成年。", "❌ ①以「和」連接都市與非都市面積，與法條「或」不符，故①②組合不正確。", "❌ ①表述不符法條，且④「未成年直系親屬」與法條「配偶、直系親屬」不同。", "❌ ③「5年」是一生一屋的期間，一生一次為出售前1年內；④亦不符法條。"]}, {"ch": "E2 土地增值稅", "year": "111", "num": 22, "q": "依平均地權條例規定，土地所有權移轉或設定典權時，有關申報移轉現值之審核標準，下列敘述何者正確？", "opts": ["遺贈之土地，以遺贈人簽立遺囑當期之公告土地現值為準", "申報人逾訂定契約之日起三十日始申報者，以訂約日當期之公告土地現值為準", "依法院判決移轉登記者，以法院終局判決日當期之公告土地現值為準", "經法院拍賣之土地，以拍定日當期之公告土地現值為準"], "ans": 3, "exps": ["❌ 遺贈之土地審核標準是以「遺贈人死亡日」為準，不是「簽立遺囑當期」（簽立遺囑後到死亡可能間隔很久，地價會變動，故應以死亡日這個確定法律效果發生的時點為準）。", "❌ 逾30日才申報者，應以「收件日」當期公告現值為準，不是「訂約日」（訂約日是30日內申報才適用的標準）。", "❌ 法院判決移轉登記以申報人向法院「起訴日」為準，沒有「終局判決日」的標準。", "✓ 平均地權條例及土地稅法明文：經法院拍賣之土地，申報移轉現值之審核標準，以「拍定日」當期之公告土地現值為準。拍定日是法院拍賣程序中得標確定的時點，這是E2關於審核標準系列考點中最沒有爭議、各年度題目答案一致的選項。"]}, {"ch": "E2 土地增值稅", "year": "112", "num": 2, "q": "關於土地所有權人出售自用住宅用地時，土地增值稅適用「一生一次」之優惠稅率，下列何者正確？", "opts": ["土地增值稅之優惠稅率為千分之二", "僅限於都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分", "土地於出售前一年內，曾供營業使用或出租", "出售前應持有該土地三年以上"], "ans": 1, "exps": ["❌ 「一生一次」的優惠稅率是「百分之十（10%）」，不是「千分之二（2‰）」，2‰是地價稅自用住宅優惠稅率，本選項混淆了地價稅與土地增值稅兩種不同稅目的優惠稅率。", "✓ 土地稅法第34條：自用住宅用地優惠稅率「一生一次」適用範圍，限於都市土地面積未超過3公畝部分，或非都市土地面積未超過7公畝部分（超過部分仍按一般累進稅率課稅）。3公畝/7公畝是固定面積上限，與地價稅自用住宅優惠的面積限制相同。", "❌ 「一生一次」的要件是出售前1年內「無」供營業使用或出租，本選項說「曾」供營業使用或出租，恰好與要件相反。", "❌ 「一生一次」並無持有年限的要求（這是「一生一屋」才有的6年持有要件），本選項對「一生一次」增加了不存在的持有期限要求，描述錯誤。"]}, {"ch": "E2 土地增值稅", "year": "112", "num": 4, "q": "土地所有權經法院判決移轉登記者，土地增值稅申報移轉現值之審核標準，下列何者正確？", "opts": ["以法院判決日當期之公告土地現值為準", "以申報人向法院起訴日當期之公告土地現值為準", "以法院判決送達日當期之公告土地現值為準", "以申報人向主管稽徵機關申報日當期之公告土地現值為準"], "ans": 1, "exps": ["❌ 法院判決移轉登記以起訴日為準，不是判決日。", "✓ 法院判決移轉登記者，以申報人向法院起訴日當期之公告土地現值為準（土稅法§30）。101、108、112年皆以此為答案。", "❌ 「判決送達日」不是法定的審核標準時點。", "❌ 申報日是逾30日才申報的一般情形之審核標準（受理申報機關收件日），不是法院判決移轉登記的特殊標準。"]}, {"ch": "E2 土地增值稅", "year": "113", "num": 22, "q": "依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？", "opts": ["經需用土地人開闢完成或依計畫核定供公共設施使用", "依法完成使用地編定", "依法完成徵收公告", "經需用土地人證明"], "ans": 2, "exps": ["❌ 本選項描述正確，這是非都市土地供公共設施使用免徵土增稅的要件之一，非錯誤。", "❌ 本選項描述正確，這是法定要件之一，非錯誤。", "✓ 本選項為錯誤敘述：本題問的是「尚未被徵收前之移轉」要適用免稅的要件，若已「依法完成徵收公告」，土地已進入徵收程序甚至已徵收，就不再是「尚未被徵收前」的情形（甚至直接適用被徵收土地免稅的規定，不需此特別要件）。本選項把「徵收公告」這個與本題前提矛盾的條件放入要件清單，邏輯上不通，為本題錯誤答案。", "❌ 本選項描述正確，需用土地人出具證明是法定程序要件之一，非錯誤。"]}, {"ch": "E2 土地增值稅", "year": "114", "num": 6, "q": "土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？", "opts": ["15日", "30日", "45日", "60日"], "ans": 1, "exps": ["❌ 申報期限為30日，15日過短。", "✓ 同109-10，平均地權條例第47條規定，雙方應於訂定契約之日起「30日」內申報土地移轉現值。30日是E2最基本的固定期限數字，反覆出現於多個年度的考題。", "❌ 申報期限為30日，45日過長。", "❌ 申報期限為30日，60日過長。"]}, {"ch": "E2 土地增值稅", "year": "114", "num": 17, "q": "依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？", "opts": ["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰", "土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰", "逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰", "應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起2個月內繳納之"], "ans": 2, "exps": ["❌ 規避繳納實物是另一款罰則，本題所問是逃稅或減輕稅賦者，罰則倍數不同。", "❌ 此情形的罰鍰是「百分之二」（同99-35），不是百分之三，數字錯誤。", "✓ 土地稅法第54條：納稅義務人藉變更、隱匿地目等則或於適用特別稅率減免原因事實消滅時未申報，因而逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額「三倍以下」之罰鍰。3倍以下是本題的固定罰鍰倍數，與99-35的「轉售移轉現值2%罰鍰」屬不同情形的不同罰則，不可混淆。", "❌ 追補稅額、實物及罰鍰的繳納期限數字與法條不符，官方判定此項錯誤。"]}];
const CHS=[...new Set(CARDS.map(c=>c.ch))];
let sel=Object.fromEntries(CHS.map(c=>[c,1]));
let ans={};
const g=id=>document.getElementById(id);
function renderPills(){
  const p=g('pills');p.innerHTML='';
  CHS.forEach(ch=>{
    const b=document.createElement('button');
    b.className='pill'+(sel[ch]?' on':'');
    b.textContent=ch;
    b.onclick=()=>{sel[ch]=sel[ch]?0:1;renderPills();renderList();};
    p.appendChild(b);
  });
}
function selAll(){Object.keys(sel).forEach(k=>sel[k]=1);renderPills();renderList();}
function selNone(){Object.keys(sel).forEach(k=>sel[k]=0);renderPills();renderList();}
function resetAll(){if(!confirm('確定要清除所有作答記錄？'))return;ans={};renderList();updateProg();}
function renderList(){
  const list=g('list');list.innerHTML='';
  const vis=CARDS.filter(c=>sel[c.ch]);
  let lastCh='';
  vis.forEach(card=>{
    const idx=CARDS.indexOf(card);
    if(card.ch!==lastCh){
      const h=document.createElement('div');h.className='ch-header';h.textContent=card.ch;list.appendChild(h);lastCh=card.ch;
    }
    list.appendChild(makeCard(card,idx));
  });
  updateProg();
}
function makeCard(card,idx){
  const a=ans[idx];
  const div=document.createElement('div');
  div.className='qcard'+(a?(a.ok?' answered-ok':' answered-ng'):'');
  div.id='c'+idx;
  div.innerHTML='<div class="qmeta"><span>【'+card.year+'年第'+card.num+'題】</span><span class="qtag">'+card.ch+'</span></div><div class="qtext">'+card.q+'</div>';
  const opts=document.createElement('div');opts.className='opts';
  ['A','B','C','D'].forEach((l,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="ltr">'+l+'</span><span>'+card.opts[i]+'</span>';
    if(a){b.disabled=true;if(i===card.ans)b.classList.add('show-correct');if(i===a.chosen&&!a.ok)b.classList.add('ng');}
    else b.onclick=(i=>()=>pick(idx,i))(i);
    opts.appendChild(b);
  });
  div.appendChild(opts);
  const eb=document.createElement('div');eb.className='expbox'+(a?' show':'');eb.id='e'+idx;
  eb.innerHTML='<div class="exph">&#128218; 逐選項解析</div><div class="expb" id="eb'+idx+'">'+(a?buildExp(card,a.chosen,a.ok):'')+'</div>';
  div.appendChild(eb);
  return div;
}
function buildExp(card,chosen,ok){
  let h='<div style="margin-bottom:7px;"><span class="verdict '+(ok?'ok':'ng')+'">'+(ok?'答對了':'答錯了')+'</span></div>';
  ['A','B','C','D'].forEach((l,i)=>{
    const ec=i===card.ans?'ok':(i===chosen&&!ok?'ng':'no');
    h+='<div class="ei"><span class="el '+ec+'">'+l+'</span><span>'+(card.exps[i]||'')+'</span></div>';
  });
  return h;
}
function pick(idx,chosen){
  const card=CARDS[idx];const ok=(chosen===card.ans);
  ans[idx]={chosen,ok};
  const div=g('c'+idx);
  div.className='qcard'+(ok?' answered-ok':' answered-ng');
  div.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;b.onclick=null;
    if(i===card.ans)b.classList.add('show-correct');
    if(i===chosen&&!ok)b.classList.add('ng');
  });
  g('eb'+idx).innerHTML=buildExp(card,chosen,ok);
  g('e'+idx).classList.add('show');
  updateProg();
}
function updateProg(){
  const vis=CARDS.filter(c=>sel[c.ch]);
  const tot=vis.length,done=vis.filter(c=>ans[CARDS.indexOf(c)]!==undefined).length;
  const cor=vis.filter(c=>{const a=ans[CARDS.indexOf(c)];return a&&a.ok;}).length;
  g('pd').textContent=done;g('pt').textContent=tot;
  g('pr').textContent=done?Math.round(cor/done*100)+'%':'-';
  g('pf').style.width=tot?done/tot*100+'%':'0%';
}
renderPills();renderList();</script>
