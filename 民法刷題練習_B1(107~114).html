<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>民法 B+C篇 107–114年 後期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;--green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;--chip-bg:#EDE7D8;--chip-text:#5C5248}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border)}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<script>
const QS=[{"year": 107, "num": 2, "ans": "D", "stem": "A公司董事長甲於5月1日上午告訴其助理乙致函於丙，表示願以一億元購買其工廠。乙於5月2日上午發信，信於5月4日到達丙處。經查，甲於5月2日晚上心肌梗塞死亡，丙於5月6日函覆A公司為承諾，試問：", "opts": ["甲死亡，要約失效，丙之承諾無效，契約不成立", "甲死亡，但甲之繼承人繼承要約，丙之承諾有效，契約成立", "本件要約係對話要約，丙應立時承諾，故契約不成立", "丙之承諾有效，契約成立，契約拘束A公司"], "exp": ["✗A. 依§95Ⅱ（現§95），要約發出後表意人死亡，其意思表示原則上不失效力（若其情形，可推知意思表示人若知其情事，即不欲為意思表示者，不在此限），本案無此排除情形，要約仍有效。", "✗B. 繼承人繼承要約的說法有誤，正確理由是要約本身仍有效力（§95），並非透過繼承機制維持效力。", "✗C. 本件要約係以「信件」（書信）為之，屬「非對話要約」，非對話要約有拘束力至相當期間屆滿，並非需立時承諾，選項錯誤。", "✓D. 甲以信件向丙為要約（非對話意思表示），依§95，表意人（甲）死亡不影響意思表示效力；丙於合理期間內承諾，契約成立；甲死亡後A公司（甲所代表之法人）繼續受契約拘束，正確。"]}, {"year": 107, "num": 11, "ans": "D", "stem": "16歲之甲於騎車上學時，與正在送貨之某公司送貨員乙（30歲）擦撞，並導致路人丙受傷。若甲與乙均為違規駕駛，下列敘述何者正確？", "opts": ["丙僅得請求財產上之損害賠償，不得主張非財產上損害賠償", "甲為有識別能力人，故丙僅得向甲單獨請求損害賠償", "丙得向某公司請求損害賠償，但某公司若舉證其選任監督乙已盡相當注意，則得免責", "丙得向甲、乙及某公司請求連帶損害賠償"], "exp": ["✗A. 身體傷害除財產損害外，亦得請求「非財產上損害賠償」（慰撫金，§195），選項說「不得主張」非財產損害，錯誤。", "✗B. 甲乙共同侵權（§185），丙得向甲或乙或某公司請求，並非「僅得向甲單獨請求」，且乙亦有責任，選項過度限縮。", "✗C. 依§188Ⅰ，僱用人責任：受僱人（乙）因執行職務加損害於第三人，僱用人（某公司）與受僱人「連帶」負賠償責任；但某公司得舉證選任及監督已盡相當注意「免責」——此描述方向正確，但本選項說「某公司舉證即可免責」，依§188Ⅰ但書，確實如此，選項C看似正確，但官方以D為最正確答案。", "✓D. 甲乙共同侵權（§185）連帶負責；某公司為乙之僱用人，與乙連帶（§188）；丙得向甲、乙、某公司全部請求連帶損害賠償，正確。"]}, {"year": 107, "num": 14, "ans": "D", "stem": "下列有關贈與之敘述，何者正確？", "opts": ["贈與係單獨行為", "贈與以物之交付為要件，於物之交付後，贈與行為才為生效", "經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與", "贈與得附有負擔"], "exp": ["✗A. 贈與為雙方契約（須受贈人承諾），非單獨行為，選項錯誤。", "✗B. 贈與係諾成契約，意思合致即成立生效，不以物之交付為成立要件，選項錯誤。", "✗C. §408但書，「經公證」之贈與，贈與人「不得撤銷」（書面公證的贈與有更強的拘束力），本選項說「得隨時撤銷」正好相反，錯誤。", "✓D. 依§412，贈與得附有「負擔」（受贈人須履行一定作為），贈與人於受贈人不履行負擔時得撤銷贈與，正確。"]}, {"year": 107, "num": 16, "ans": "C", "stem": "關於人格權保護，下列敘述，何者錯誤？", "opts": ["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之", "名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲", "債務人因債務不履行，致債權人之人格法益受侵害者，準用侵權行為之規定", "侵害他人名譽者，被害人雖非財產上之損害，亦得請求賠償相當之金額"], "exp": ["✓A. §18，人格權受侵害得請求除去；有侵害之虞得請求防止，正確。", "✗B（本題答案）. 依大法官解釋（釋字第656號），強制命被告登報道歉若涉及「強迫當事人表達違背自己意思之言論」，已被認定可能違憲（違反不表意自由）；現行司法實務已確立此方式有合憲性疑慮，本選項說「仍屬合憲」與現行見解不符，為錯誤選項，即應選答案。", "✓C. §227-1，債務不履行致債權人人格法益受損，準用侵權行為規定，正確。", "✓D. §195，侵害名譽等人格法益，得請求非財產上損害賠償（慰撫金），正確。"]}, {"year": 107, "num": 17, "ans": "A", "stem": "關於僱傭契約，下列敘述，何者錯誤？", "opts": ["僱傭契約之專屬性較低，故僱用人得將其勞務請求權讓與第三人，無需受僱人同意", "受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償", "定期之僱傭契約，若當事人之一方遇有重大事由，仍得於契約期限前終止之", "僱傭契約之受僱人若遭受第三人之不法侵害，致不能服勞務，不得請求已免除之報酬"], "exp": ["✗A（本題答案）. 僱傭契約具有「人身專屬性」（受僱人的勞務與其人身密不可分），受僱人不得將勞務義務轉由他人履行，僱用人亦不得任意將「勞務請求權」讓與第三人（需受僱人同意，因此改變了受僱人服務的對象），本選項說「可讓與無需受僱人同意」，與人身專屬性原則相反，錯誤，為應選答案。", "✓B. §483-1，受僱人服勞務因不可歸責自己事由受損害，得向僱用人請求賠償，正確。", "✓C. 定期僱傭，遇有重大事由，仍得提前終止（§489），正確。", "✓D. §487，受僱人因第三人不法侵害無法服勞務，已免除之報酬不得另行請求（獲有免除而無庸服勞務），但就第三人侵權部分得另向第三人請求，正確。"]}, {"year": 108, "num": 9, "ans": "B", "stem": "依我國民法之規定，下列關於租賃契約之敘述何者正確？", "opts": ["甲將自己所有之A屋租予乙後，又將A屋租予丙並交付占有予丙，乙得知後可向丙主張交付A屋", "甲將自己所有之A屋租予乙，並交付占有予乙後，A屋竟遭丙無權占有。此時，乙可對丙主張返還A屋", "甲將自己所有之A屋租予乙，後因甲積欠稅款，A屋遭法院查封拍賣，丁拍定得標，A屋之租賃關係對丁不再存在", "甲將自己所有之A屋租予乙，並交付占有予乙後，甲又將A屋賣予丙，丙得以所有權人身分，請求乙交還A屋"], "exp": ["✗A. 一屋二租，丙已取得交付占有，乙的債權（請求交付）僅對甲有效，對丙（已取得占有之人）不能主張，乙「不能向丙」主張交付，選項錯誤。", "✓B. 承租人（乙）取得租賃物之占有後，對於無權占有之丙，得依占有保護（§960以下）或準物上請求權（類推§767），請求丙返還，正確。", "✗C. 買賣不破租賃（§425）亦適用於法拍（拍賣）情形，丁拍定後仍受原租賃契約拘束（前提：租賃合法且已交付），並非「租賃關係對丁不再存在」，選項錯誤。", "✗D. 買賣不破租賃（§425），丙取得所有權後仍受原租賃契約拘束，不得請求乙交還，選項錯誤。"]}, {"year": 108, "num": 15, "ans": "A", "stem": "甲、乙締結買賣甲所有之A屋的契約，乙並先為部分價金之給付。其後，乙未依約定期限給付剩餘價金。就甲以乙履行遲延而解除A屋買賣契約之情形，下列敘述，何者正確？", "opts": ["經甲定期間催告乙履行，甲得於經相當期限後，不須再為催告，即得解除契約", "甲不得解除契約，但得請求損害賠償", "甲不得解除契約，甲僅得請求乙加付遲延利息", "乙未依約定期限給付剩餘價金，即屬絕對的定期行為，甲得不經催告，即得解除契約"], "exp": ["✓A. §254，給付遲延時，債權人得定相當期間催告履行，於期間屆滿後，債務人仍未履行者，得解除契約，且不須再為催告，正確。", "✗B. 甲在催告後確實得解除契約（§254、§256），選項說「不得解除」錯誤。", "✗C. 遲延時得請求加付遲延利息（§233）固然正確，但甲亦有解除權，本選項說「僅得請求遲延利息」過度限縮，錯誤。", "✗D. 「絕對定期行為」（§255）是指以特定時期作為契約必要條件，逾期給付即失其利益，本案並未約定「非於特定時期給付不能達契約目的」，不符合§255，選項錯誤。"]}, {"year": 108, "num": 17, "ans": "B", "stem": "就甲、乙、丙三人對丁負有平均分擔之300萬元連帶債務的情形，下列敘述，何者正確？", "opts": ["甲對丁為債務之承認而中斷時效時，其效力亦及於乙、丙之債務", "丁請求甲支付全額獲勝訴判決後，仍未能自甲受償時，得再請求乙支付全額", "甲清償全額後，如乙有保證人戊，甲得直接向戊請求100萬元", "甲清償全額後，得向乙、丙各請求150萬元"], "exp": ["✗A. §276，時效中斷效力相對性——中斷事由原則上僅對「發生事由之人」有效，不及於其他連帶債務人；但「承認」的中斷只對承認之人（甲）有效，不及於乙丙，選項說「效力及於乙丙」，依§276意旨，應為不及，選項錯誤。", "✓B. 連帶債務（§272），丁對甲有勝訴判決但未獲清償，仍可再向乙請求全額（連帶責任即各負全部責任），正確。", "✗C. 甲清償後代位丁成為債權人，可向乙丙各求償100萬元（各自分擔1/3）；甲並非保證人之債權人，不得直接向乙之保證人戊請求，選項錯誤。", "✗D. 各人分擔額為1/3=100萬，甲得向乙丙各求償100萬元，並非各150萬元，計算錯誤。"]}, {"year": 108, "num": 21, "ans": "A", "stem": "甲將其所有之A土地上之B建物讓與乙時，在房屋得使用期限內，乙與甲間有何法律關係？", "opts": ["推定有租賃關係", "視為有租賃關係", "推定有普通地上權關係", "視為有普通地上權關係"], "exp": ["✓A. §425-1，土地及其上之房屋同屬一人，而僅將房屋讓與他人（未讓與土地），在房屋使用期限內，「推定」（非「視為」）土地與房屋間有租賃關係，正確。★關鍵區分：一般買賣分離→推定租賃（§425-1）；抵押拍賣分離→視為地上權（§877-1），務必分清。", "✗B. 應為「推定」而非「視為」，兩者重要差別：「推定」可被反証推翻；「視為」法律擬制，不可推翻，本選項說「視為」錯誤。", "✗C. 地上權適用於抵押拍賣場合（§877-1），一般買賣分離適用租賃（§425-1），選項適用規定錯誤。", "✗D. 同C，且「視為」二字亦不正確。"]}, {"year": 109, "num": 3, "ans": "C", "stem": "甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？", "opts": ["於甲與乙簽訂汽車買賣契約時起，由乙承受", "自該車辦理過戶登記於乙時，由乙承受", "自該車交付於乙時起，由乙承受", "於乙支付價金完畢時，由乙承受"], "exp": ["✗A. 買賣契約成立時，危險尚未移轉（交付前仍在甲），成立時由甲承受。", "✗B. 動產危險移轉以「交付」為準（§373），並非以登記（過戶）為準；不動產所有權移轉以登記，但危險移轉仍以「交付」為準，選項錯誤。", "✓C. §373，買賣標的物之利益及危險，自「交付」時起由買受人（乙）承受，無特別約定時以交付為準，正確。", "✗D. 價金支付非危險移轉的依據，依法以交付為準，選項錯誤。"]}, {"year": 109, "num": 4, "ans": "C", "stem": "下列有關契約成立之敘述，何者錯誤？", "opts": ["契約得以要約與承諾之意思表示合致而成立", "契約得以要約交錯之方式而成立", "契約得以承諾交錯之方式而成立", "契約得以要約與意思實現方式而成立"], "exp": ["✓A. 要約＋承諾＝契約成立，最基本方式（§154-158），正確。", "✓B. §162，要約交錯（雙方各自獨立發出的要約內容相同）契約成立，正確。", "✗C（本題答案）. 「承諾交錯」並非民法規定的契約成立方式，法律規定的是「要約交錯」（§162），並無「承諾交錯」此一制度，選項描述不存在的法律制度，錯誤，為應選答案。", "✓D. §161，意思實現（當事人有可認識其接受要約之事實者，視為承諾，契約成立），正確。"]}, {"year": 109, "num": 5, "ans": "B", "stem": "下列關於利息之敘述，何者正確？", "opts": ["應付利息之債務，其利率未經約定亦無法律可據者，原則上以週年利率為百分之六計算", "約定利率逾週年百分之十二者，經一年後，債務人得隨時清償原本。但須於一個月前預告債權人", "約定利率，超過週年百分之二十者，其超過部分之約定，無效", "利率不得超過債務發生時週年利率百分之十六"], "exp": ["✗A. §203，法定利率為週年利率5%（並非6%，修法後已調整），選項數字有誤。", "✓B. §204，約定利率逾週年12%者，債務人得於一年後隨時清償原本，但須提前一個月預告，正確。", "✗C. §205，約定利率超過週年20%者，超過部分債權人無請求權（而非約定「無效」），細微差別：約定未必無效，但超過部分不具請求力，選項說「無效」表述不精確。", "✗D. 民法並無明文「利率不得超過16%」的硬性上限規定，此數字無法律依據。"]}, {"year": 109, "num": 6, "ans": "C", "stem": "下列有關定金之敘述，何者正確？", "opts": ["訂約當事人之一方，由他方受有定金時，其契約視為成立", "定金為諾成契約，於當事人約定時即成立", "契約因可歸責於付定金當事人之事由，致不能履行時，定金不得請求返還", "契約因不可歸責於雙方當事人之事由，致不能履行時，定金應返還之"], "exp": ["✗A. §248，契約因「定金之授受」而推定成立（推定，可反証），並非「視為成立」（視為不可反証），且定金授受是推定契約成立的根據，並非定金本身使契約成立，選項「視為成立」表述不精確。", "✗B. 定金為「要物契約」，須交付定金才成立，並非諾成（雙方約定即成立），選項錯誤。", "✓C. §249第2款，契約因可歸責於付定金人之事由而不能履行者，「定金不得請求返還」（沒收定金），正確。", "✗D. §249第4款，契約因不可歸責雙方之事由致不能履行，定金「應返還之」，D描述本身正確；但官方答案為C，且C是更典型的定金效力考點，以C為正解。"]}, {"year": 109, "num": 7, "ans": "D", "stem": "甲借給乙100萬元，借期屆至，甲請求乙返還100萬元借款，乙因此開立100萬元之本票交由甲受領。下列敘述，何者正確？", "opts": ["甲所受領乙開立的100萬元本票，是債之內容更改", "甲所受領乙開立的100萬元本票，是抵銷", "甲所受領乙開立的100萬元本票，是提存", "甲所受領乙開立的100萬元本票，是代物清償"], "exp": ["✗A. 債之更改（更新）是以新債務代替舊債務，使舊債務消滅（§320）；本案若以本票代替現金清償，若雙方明示以本票「取代」舊借款債務，可能構成更改，但一般以本票交付多認定為代物清償，非更改。", "✗B. 抵銷是雙方互負同種類債務相互消滅（§334），此處乙並未對甲有另一債權，無從抵銷。", "✗C. 提存是債務人將給付物提交國家機關（提存所），因債權人拒絕受領或其他原因（§326），本案甲已受領，並非提存。", "✓D. 代物清償（§319）：清償人提出與原定給付不同之給付（以本票代替金錢），經債權人受領，使債務消滅，正確。"]}, {"year": 109, "num": 8, "ans": "C", "stem": "下列關於房屋租賃之敘述，何者正確？", "opts": ["出租人將租賃之房屋交付承租人後，非經承租人同意，不得將其所有權讓與第三人", "出租人出賣租賃之房屋時，承租人有依同樣條件優先承買之權利", "除有反對之約定外，承租人依法得將其一部分轉租於他人", "房屋租賃期限逾一年者，非以書面訂立，不生效力"], "exp": ["✗A. 出租人可自由讓與所有權（§425買賣不破租賃保護承租人），不需承租人同意，本選項說「需承租人同意」錯誤。", "✗B. 依§426-2，「基地租賃」出租人出賣時，承租人有優先購買權；一般「房屋租賃」民法並無明文優先購買權（部分特別法有，但民法無），選項描述不正確。", "✓C. §443Ⅱ，「轉租一部」：承租人除有反對之約定，得將租賃物之一部轉租（「全部」轉租則須得出租人同意），正確。", "✗D. §422，不動產租賃逾一年未以書面訂立者，「視為不定期限」，並非「不生效力」，選項錯誤（此為常考陷阱）。"]}, {"year": 109, "num": 9, "ans": "D", "stem": "甲將其名下之房屋出售並交付乙占有，惟尚未辦理所有權登記之前，甲又出售該屋於善意之丙且辦理所有權登記完畢。則乙對丙之主張，下列何者正確？", "opts": ["乙得依據其與甲所訂立之買賣契約而請求丙塗銷房屋所有權登記", "乙得向丙主張不當得利而請求丙塗銷房屋所有權登記", "乙得主張善意取得而取得該屋所有權", "乙僅得請求甲依債務不履行之規定負損害賠償責任"], "exp": ["✗A. 乙之買賣契約是「債權」，對抗力有限，丙已完成登記，取得不動產所有權，乙無法以債權對抗丙的物權，不得請求塗銷。", "✗B. 丙有合法買賣契約依據，完成登記取得所有權，並非「無法律上原因」受有利益，不構成不當得利，乙無法依此主張。", "✗C. 不動產物權以「登記」為依據，並無動產「善意取得」制度（§801善意取得僅限動產），乙未辦理登記，不能主張善意取得不動產所有權。", "✓D. 甲一屋二賣，先賣給乙（僅交付未登記），後賣給丙並完成登記，丙取得所有權，乙無法取回房屋；乙僅得依債務不履行（甲未履行移轉登記義務）向甲請求損害賠償，正確。"]}, {"year": 109, "num": 12, "ans": "B", "stem": "甲將自己所有的違章建築A屋賣給乙，有關於買賣違章建築之法律關係。下列敘述，依實務見解，何者錯誤？", "opts": ["土地與土地上之違章建築同屬於一人所有，嗣將違章建築與土地分別讓與相異之人，仍有民法第425條之1推定租賃關係規定之適用", "違章建築之買賣為脫法行為而無效", "違章建築為融通物，得為一般交易之客體", "違章建築買賣，出賣人負有移轉占有予買受人之義務，而非移轉登記之義務"], "exp": ["✓A. 實務見解承認違章建築分離讓與時，類推適用§425-1推定租賃，正確。", "✗B（本題答案）. 依實務判決，違章建築之買賣並非當然無效或脫法行為——違章建築雖不能辦理登記，但本身仍是融通物（可以交易），其買賣契約有效，出賣人負有「移轉占有」之義務（不能辦理所有權移轉登記，改以占有移轉）。本選項說「脫法行為無效」與實務見解不符，錯誤，為應選答案。", "✓C. 違章建築為融通物（可在市場上交易），正確。", "✓D. 違章建築無法辦理登記，出賣人僅能以「交付占有」代替「移轉登記」，正確。"]}, {"year": 110, "num": 1, "ans": "B", "stem": "甲與乙訂立買賣契約，契約條款記載「…價金新臺幣陸拾捌萬元整（NT$860,000）。前揭捌拾陸萬元價金應於訂約後10日內支付。」若嗣後雙方就價金金額爭訟時，法院應如何決定價金？", "opts": ["應認為價金為最後書寫之文字：捌拾陸萬元", "應先探求當事人真意，再依文字或號碼決定", "應認為價金為最早書寫之文字：陸拾捌萬元", "應認為價金為阿拉伯數字：NT$860,000"], "exp": ["✗A. 「最後書寫之文字」並非法定原則，無法律依據。", "✓B. §98，解釋意思表示，應探求當事人真意；契約解釋首要原則是探求當事人共同意思，若能確定，依真意，無法確定才按文字或號碼判斷（本題有衝突，探求真意優先），正確。", "✗C. 「最早書寫」並非法定優先原則，且本題真意未必是陸拾捌萬。", "✗D. 文字與號碼不符時，一般原則是以文字為準（因文字較難誤記），但首要仍是探求真意；B的「先探求真意」才是最正確的第一步，D直接以號碼為準跳過探求真意步驟，不正確。"]}, {"year": 110, "num": 11, "ans": "D", "stem": "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？", "opts": ["同時履行抗辯", "撤銷訴權", "追索權抗辯", "先訴抗辯"], "exp": ["✗A. 同時履行抗辯（§264）：雙務契約一方未提出履行，他方得拒絕己方給付，與保證無關。", "✗B. 撤銷訴權（§244）：債權人撤銷債務人詐害行為之權利，與保證抗辯無關。", "✗C. 追索權見於票據法（票據不獲付款後向前手追索），與民法保證無關。", "✓D. §745「先訴抗辯」（或稱「先訴利益」）：保證人於債權人未先就主債務人財產強制執行無效果前，得拒絕清償，此即先訴抗辯，正確。"]}, {"year": 110, "num": 12, "ans": "C", "stem": "關於連帶債務的敘述，下列何者正確？", "opts": ["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務", "連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，並自免責時起之利息", "連帶債務中，債務人有絕對效力事由發生時，其效力及於其他連帶債務人", "連帶債務人中一人所生之事由，原則上對其他債務人不生效力"], "exp": ["✗A. §280，連帶債務人間，因某一人「應單獨負責之事由」（如個人過失）所生損害，「應由該人負擔」，而非平均分擔，本選項說「仍應平均分擔」錯誤。", "✗B. §281，清償等使他債務人免責者，清償人得向他人求償「各自分擔之部分及自免責時起之利息」——描述方向正確，但須仔細確認：利息自「免責之日」起算，B的細節有誤差或不完整，官方以C為正解。", "✓C. §276，連帶債務中具有「絕對效力」事由（如清償、混同、債務免除等特定事由）者，效力及於其他連帶債務人，正確。", "✗D. C已說明有絕對效力事由會影響其他人，而D說「原則上不生效力」雖符合相對效力原則（多數事由不影響他人），但C比D更精確且具體，官方以C為最正確答案。"]}, {"year": 110, "num": 20, "ans": "D", "stem": "分別財產制有關夫妻債務的敘述，下列何者正確？", "opts": ["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還", "夫妻各自對其債務負清償責任，並各自以其財產清償，但連帶債務時，一方仍得以他方財產清償", "夫妻各自對其債務負清償責任，並各自以其財產清償"], "exp": ["✗A. §1020-1，夫妻於行為時明知有損他方剩餘財產分配請求權，他方得「聲請法院撤銷」——本選項描述撤銷要件，前半段「受益人知情」為要件之一，但「以受益人受益時亦知」此表述對於法條要件的描述精確性有疑問，官方以D為正解。", "✗B. §1023，夫妻財產各自管理，一方清償他方債務後，得「請求償還」，選項說「不得請求」錯誤。", "✗C. 分別財產制下，各自的財產各自使用，連帶債務時亦不能直接動用他方財產，選項有誤。", "✓D. §1023，分別財產制下，夫妻各自對其債務負清償責任，並各自以其財產清償，正確。"]}, {"year": 110, "num": 21, "ans": "A", "stem": "關於共同財產所負之債務，而以共同財產清償者，下列何者正確？", "opts": ["不生補償請求權", "不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "有補償請求權，但於婚姻關係存續中，不得請求", "有補償請求權，於婚姻關係消滅後，得請求"], "exp": ["✓A. 共同財產制中，以「共同財產」清償「共同財產所負之債務」（即共同債務），屬正常使用共同財產，不生夫妻間補償請求權（共同財產本就用於清償共同債務），正確。", "✗B. B的補充說明過於複雜，且官方以A為最簡潔正確答案。", "✗C. 並非有補償請求權，而是不生補償請求權，C前提錯誤。", "✗D. 同C，不生補償請求權，D的前提錯誤。"]}, {"year": 111, "num": 4, "ans": "B", "stem": "下列敘述，何者錯誤？", "opts": ["使用借貸契約必須是無償的契約", "借用人得主張買賣不破使用借貸之抗辯", "借用物為動物時，飼養費原則上應由借用人承擔", "借用人對於借用物原則上並無轉租收益之權限"], "exp": ["✓A. 使用借貸（§464）本質為無償（若有償則為租賃），正確。", "✗B（本題答案）. 「買賣不破使用借貸」並無民法明文規定（§425買賣不破租賃適用於租賃，不及於使用借貸），使用借貸為無償，無類推適用§425之保護，故借用人不能主張買賣不破使用借貸，本選項說「得主張」錯誤，為應選答案。", "✓C. 使用借貸，借用物之管理費用（如飼養費）由借用人負擔（§469），正確。", "✓D. 使用借貸原則上借用人得自行使用，但不得擅自轉租（因屬無償借用，更不應從中謀利），正確。"]}, {"year": 111, "num": 6, "ans": "D", "stem": "下列何種情形，債務人之原有債務不會發生消滅之效果？", "opts": ["債權人受領債務人以代物清償方式清償原有之債務", "債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務", "債權與其債務發生混同之情形", "債務人以間接給付之方式清償原有之債務"], "exp": ["✗A. 代物清償（§319）：以他種給付代替原定給付，債權人受領後，原債務消滅，會消滅。", "✗B. 抵銷（§334以下）：互負債務，行使抵銷後，在抵銷範圍內雙方債務消滅，會消滅。", "✗C. 混同（§344）：債權與其債務歸屬同一人時，債之關係消滅，會消滅。", "✓D. 「間接給付」：指不直接向債權人給付，而是透過第三人（如匯款、轉帳）間接清償；此方式仍構成有效清償，原債務消滅——但本題選項D說「不會消滅」……依官方答案D為正解，可能題目設計上「間接給付」不被視為「清償」（如僅為擔保目的的轉讓），需以官方答案D為準。★備考：以官方答案D為準，若題目問「不消滅」，選D（間接給付）。"]}, {"year": 111, "num": 7, "ans": "D", "stem": "在無因管理之規定中，若管理人管理事務時，利於本人，且不違反本人明示或可得推知之意思者，管理人不得向本人主張下列那種請求權？", "opts": ["管理人管理本人事務之有益費用支出償還請求權", "清償管理人因管理事務所負債務之請求權", "管理人因管理事務所受損害之損害賠償請求權", "管理人因管理事務所受利益之利益返還請求權"], "exp": ["✓A. §176Ⅰ，管理人得請求「有益費用」償還，管理人有此請求權，正確（此選項是有的）。", "✓B. §176Ⅰ，管理人得請求本人清償因管理所負之債務，有此請求權。", "✓C. §176Ⅰ，管理人因管理事務所受損害，得請求本人賠償，有此請求權。", "✓D（應選）. 管理人因管理事務所受之「利益」（如管理過程中獲得的利益），依無因管理規定，管理人應將所得利益移轉給本人，管理人「不得」向本人主張「返還利益」請求權（反而是管理人須將利益交給本人），正確，為應選答案。"]}, {"year": 111, "num": 12, "ans": "D", "stem": "下列何者非法律明文規定屬於連帶債務之性質？", "opts": ["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務", "數人共同不法侵害他人權利所生之損害賠償債務", "共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務", "共有人對於他共有人因分割而應補償之債務"], "exp": ["✓A. §681，合夥人對合夥不足清償部分連帶負責，法律明文，確屬連帶債務。", "✓B. §185，共同侵權行為人連帶負責，法律明文，確屬連帶債務。", "✓C. §1153，繼承人對遺產債務於繼承範圍內連帶負責，法律明文，確屬連帶債務。", "✓D（應選）. §824Ⅲ，分割共有物，共有人對他共有人因分割應補償之金額，法律規定為「按應有部分比例分擔」（分割補償），而非連帶債務；此選項為「非法律明文規定連帶」者，正確為應選答案。"]}, {"year": 111, "num": 20, "ans": "C", "stem": "特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？", "opts": ["解除買賣契約", "請求減少買賣價金", "請求另行交付無瑕疵之物", "故意不告知瑕疵時，請求損害賠償"], "exp": ["✓A. §359，物之瑕疵擔保，買受人得解除契約（物之瑕疵達「重大不符合」程度），正確（可主張）。", "✓B. §359，買受人得請求減少價金，正確（可主張）。", "✗C（應選）. 另行交付無瑕疵之物（請求替換）僅適用於「種類物」（§364）；特定物買賣無從以他物替代（特定物=買的就是這一件），故買受人「不得」請求另行交付他物，為本題「非得主張」之答案。", "✓D. §360，出賣人故意不告知瑕疵者，買受人得請求損害賠償，正確（可主張）。"]}, {"year": 111, "num": 21, "ans": "D", "stem": "關於租賃法律關係之敘述，下列何者正確？", "opts": ["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效", "定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金", "不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權", "不動產之承租人就租賃物，除法律另有規定外，不得主張留置權"], "exp": ["✗A. §422，逾一年不動產租賃未以書面，「視為不定期限」非無效，選項說「否則無效」錯誤（此為最常考陷阱）。", "✗B. 定期租賃原則上無法任意要求增減租金，除非有特別情事（情事變更，§442等），法院增減並非當然，選項過於概括。", "✗C. 出租人對租金債權享有「法定留置權」（§445），留置的是「承租人置於租賃物內之物」，但本選項說「法定質權」，質權與留置權為不同擔保物權，描述錯誤。", "✓D. §445，出租人有留置權（不是承租人），承租人就租賃物本身並無留置權，正確。"]}, {"year": 111, "num": 22, "ans": "A", "stem": "二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？", "opts": ["抵銷", "抵充", "免除", "混同"], "exp": ["✓A. §334，雙方互負同種類債務（如均為金錢債務）且均屆清償期，得主張「抵銷」，在抵銷數額內同時消滅，正確。", "✗B. 抵充（§321以下）：同一債務人對同一債權人有數個債務，清償時指定以何者抵充（清償抵充），與本題雙方互負不同，概念不符。", "✗C. 免除（§343）：債權人向債務人表示免除其債務，單方意思表示，與本題互相抵銷不同。", "✗D. 混同（§344）：同一人同時為債權人及債務人，債權因混同而消滅，與本題兩人各有債務不同。"]}, {"year": 112, "num": 5, "ans": "C", "stem": "甲向乙推銷一只古董錶，甲出價新臺幣10萬元問乙要不要買，乙答覆說：「如果8萬元我就買」，請問乙的答覆性質上為何？", "opts": ["要約之引誘", "承諾", "要約", "意思實現"], "exp": ["✗A. 要約引誘是邀請他人提出要約（如廣告、型錄），本題乙明確表示「8萬元就買」，已有具體條件，並非單純邀請，不是要約引誘。", "✗B. 乙的答覆並非對甲「10萬元要約」的承諾（條件不同，未全部接受），並非承諾。", "✓C. 依§160Ⅱ，「將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約」；乙將10萬變更為8萬，此為「反要約」（新要約），正確。", "✗D. 意思實現（§161）：受要約人有可認識接受要約之事實（如逕行履行），本題乙用言語表達，並非意思實現。"]}, {"year": 112, "num": 6, "ans": "C", "stem": "甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？", "opts": ["債權不得作為買賣之標的所以無效", "該買賣標的權利自始不存在，屬於標的不能而無效", "該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保", "甲可依侵權行為法向乙請求損害賠償"], "exp": ["✗A. 債權可以作為買賣標的（§348Ⅱ，債權之出賣），選項說「債權不得為買賣標的」錯誤。", "✗B. 買賣已消滅之債權雖屬「標的不存在」，但債權買賣契約本身（債權行為）並非因此「當然無效」，此類情形更適合用「權利瑕疵擔保」解決，選項以「標的不能無效」一刀切，過於絕對。", "✓C. 買賣不存在之債權，買賣契約（債權行為）本身仍有效（諾成契約，雙方合意即成立）；但乙出賣的債權實際不存在，乙應負「權利瑕疵擔保責任」（§349），甲得主張解除或請求損害賠償，正確。", "✗D. 本案更精確的救濟是「權利瑕疵擔保」（契約法路徑），侵權行為（§184）須另有故意過失侵害，乙是否有侵權行為尚待判斷，非最精確主張方式。"]}, {"year": 112, "num": 8, "ans": "A", "stem": "下列何種契約性質上屬於要物契約？", "opts": ["消費借貸契約", "房屋租賃契約", "贈與契約", "合會契約"], "exp": ["✓A. 消費借貸（§474），須「物之交付」才成立，屬要物契約，正確。", "✗B. 房屋租賃為諾成契約，雙方合意即成立，不以交付為成立要件。", "✗C. 贈與為諾成契約（合意即成立，但交付前可撤銷），並非要物契約。", "✗D. 合會（§709-3以下）為諾成性質，依法成立後各方依約履行，不以物之交付為成立要件。★要物契約記法：使用借貸（§464）、消費借貸（§474）均為要物契約；定金（§248）亦是要物性質。"]}, {"year": 112, "num": 9, "ans": "A", "stem": "依民法之規定，有關租賃契約之效力，下列何者錯誤？", "opts": ["租賃物有修繕之必要時，原則上承租人可直接自行修繕後再請求出租人給付修繕費用", "如租賃物是房屋時，倘出租人無反對之約定，承租人可以將房屋一部轉租", "租賃物因承租人失火而造成損害，承租人僅就重大過失負責", "出租人有保持租賃物合於約定使用收益狀態之義務"], "exp": ["✗A（本題答案）. §430，承租人修繕應「先催告出租人修繕」，出租人在相當期間內不為修繕，承租人才得自行修繕並請求費用；選項說「原則上可直接自行修繕」，省略了「先催告」此必要前置步驟，描述錯誤，為應選答案。", "✓B. §443Ⅱ，房屋一部轉租，在無反對約定下得為之，正確。", "✓C. §434，承租人失火責任以「重大過失」為限（特別規定，較一般輕過失標準寬鬆），正確。", "✓D. §423，出租人有保持合於使用收益狀態之義務，正確。"]}, {"year": 112, "num": 13, "ans": "D", "stem": "抵押權人僅就土地設定抵押權，因債權已屆清償期而未清償而實行抵押權，下列何者錯誤？", "opts": ["於設定抵押權時，該土地上已存在房屋，實行抵押權之範圍僅限於土地本身，不得就房屋併付拍賣", "於設定抵押權時，土地上並無房屋，於實行抵押權時土地所有人已就土地上建有房屋，此時抵押權人得聲請法院就土地與房屋一併拍賣", "於設定抵押權時，土地上並無房屋，於實行抵押權時土地所有人已就土地上建有房屋，此時就房屋拍賣所得，抵押權人並無優先受償之權", "抵押土地面積廣闊，分割後，其中一筆土地設定抵押權，對其餘各土地仍有效力"], "exp": ["✓A. §877，設定抵押時土地上已有房屋，拍賣時僅拍賣土地（抵押標的），不可併拍房屋（房屋所有人另有所有權），正確。", "✓B. §877，設定抵押時無房屋，嗣後建有房屋，抵押權人「得聲請就房屋一併拍賣」以確保土地使用，正確。", "✓C. 就房屋一併拍賣，抵押權人「就房屋拍得價金並無優先受償之權」（抵押權只在土地上），房屋拍賣款優先歸房屋所有人，正確。", "✗D（本題答案）. §862，「抵押權效力及於抵押物之分割部分及因抵押物滅失得受之賠償金」，但分割後「各部分均維持抵押權效力」（不動分割主義），並非「其中一筆設定抵押，對其餘各土地有效力」——抵押設定在「特定筆土地」上，分割後在「各分割部分」維持，不擴及原本未設定之其餘土地，本選項描述超出抵押效力範圍，錯誤，為應選答案。"]}, {"year": 112, "num": 16, "ans": "C", "stem": "甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣10萬元。關於婚姻居間契約，下列何者正確？", "opts": ["甲乙間的契約，無效", "乙得對甲請求給付報酬", "乙對甲無報酬請求權", "婚姻居間契約不得約定報酬"], "exp": ["✗A. 婚姻居間契約本身不違反強行規定或公序良俗（媒人介紹結婚是正常社會行為），契約有效，選項說無效錯誤。", "✗B. 依§573，婚姻居間契約，「報酬請求權不因契約而發生」（婚姻居間報酬依習慣，不能以契約強制請求），乙得不請求報酬（習慣上），但若甲自願給付則乙可受領，選項說「乙得請求」稍有誤。", "✓C. §573，婚姻居間契約，「居間人不得請求報酬」（法律明定婚姻居間不發生報酬請求權），正確。", "✗D. §573前段，婚姻居間契約「雖得約定報酬」（契約自由，約定不違法），但居間人就此項報酬「不得請求」（有約定亦不得強制請求），本選項說「不得約定報酬」錯誤（可以約定，只是不能強制請求）。"]}, {"year": 112, "num": 19, "ans": "C", "stem": "甲在其所有A地上興建B屋，但B屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙訂立A地與B屋的買賣契約，下列何者錯誤？", "opts": ["B屋雖為違章建築亦為融通物，得為交易之客體", "甲應將A地所有權辦妥移轉登記給乙", "甲無法將B屋所有權辦理移轉登記給乙，所以甲乙間關於B屋的買賣契約無效", "依實務見解，甲就B屋應以移轉B屋之事實上處分權給乙代替"], "exp": ["✓A. 違章建築屬融通物，可以交易，正確。", "✓B. A地（已登記不動產）應辦理所有權移轉登記，正確。", "✗C（本題答案）. 違章建築雖無法辦理所有權登記，但買賣契約（債權行為）本身並不因此無效；依實務見解，出賣人以「移轉事實上處分權」代替所有權移轉登記，契約有效，選項說「買賣契約無效」錯誤，為應選答案。", "✓D. 依實務，違章建築買賣以「移轉事實上處分權（占有）」履行，正確。"]}, {"year": 113, "num": 3, "ans": "B", "stem": "甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？", "opts": ["丙善意取得名畫之所有權", "丙得請求乙損害賠償", "乙與丙之買賣契約有效", "甲對丙得主張名畫所有物返還請求權"], "exp": ["✗A. 善意取得（§801、§948）之前提：善意第三人「以動產之占有」取得動產所有權；但本案乙係「以代理人名義」出賣，而非以自己占有人身分出賣——無權代理的法律效果是效力未定/甲不承認後無效，而非善意取得問題（兩個制度適用前提不同），丙不能以善意取得主張取得所有權（因為乙以代理人名義，而非以自己名義處分）。", "✓B. 甲不承認無權代理，乙丙買賣契約對甲確定不生效力，乙為無代理權人，依§110，對善意丙應負損害賠償責任，正確。", "✗C. 甲不承認，契約確定不生效力，選項說「有效」錯誤。", "✗D. 依A選項分析，乙以代理名義出賣但甲不承認，名畫所有權未有效移轉；但丙已取得物之交付（占有），此時甲對丙的所有物返還請求是否成立，需視乙有無處分權等問題，本案乙以代理名義出賣，未能形成有效移轉，甲得向丙請求返還；但官方以B為最正確答案，丙可能依不當得利返還，甲向丙請求可能可行但非最精確。"]}, {"year": 113, "num": 4, "ans": "B", "stem": "甲對乙有新臺幣100萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償100萬元，經甲受領，下列敘述，何者正確？", "opts": ["甲與丙之債權讓與無效", "乙之債務因清償而消滅", "應經丙承認，乙對甲之清償始生效力", "甲對乙之債權已讓與丙，甲受領乙的清償為不當得利"], "exp": ["✗A. 債權讓與（§294以下）無須乙同意，通知乙只是讓渡對乙的對抗要件，未通知不影響讓與效力，選項說「無效」錯誤。", "✓B. 依§297，債權讓與未通知債務人（乙）前，乙對原債權人（甲）之清償「有效」，乙之債務因此消滅（保護善意債務人），正確。", "✗C. 甲乙間未通知前，乙對甲的清償即生效力，無須丙的承認，選項錯誤。", "✗D. 依§297，乙對甲清償在未通知前有效，甲受領並非無法律上原因，不構成不當得利，選項錯誤。"]}, {"year": 113, "num": 5, "ans": "B", "stem": "甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙100萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還100萬元？", "opts": ["可以，依據不當得利", "不可，100萬元為不法原因之給付", "可以，依據侵權行為損害賠償", "不可，附負擔之贈與不得請求返還"], "exp": ["✗A. 甲以100萬元換取乙協助取得違法建造許可，屬「不法原因之給付」（§180第4款），贈與動機違法，甲不得依不當得利請求返還。", "✓B. §180第4款，不法原因之給付（自己明知為不法目的而給付），不得請求返還；甲明知目的違法仍給付，法律不保護其返還請求，正確。", "✗C. 侵權行為是加害人侵害他人，本案甲是主動為不法目的給付，並非受害人，侵權主張無根據。", "✗D. 本題的不可返還理由是「不法原因給付」（§180），而非「附負擔贈與不得請求返還」，法律根據不同。"]}, {"year": 113, "num": 8, "ans": "D", "stem": "甲將其所有之A屋出租於乙，乙未經甲之同意，將A屋全部轉租於丙。下列敘述，何者正確？", "opts": ["乙與丙訂立之租賃契約無效", "甲與乙訂立之租賃契約無效", "乙得終止乙與丙之租賃契約", "甲得終止甲與乙之租賃契約"], "exp": ["✗A. 乙丙間之轉租契約（乙以出租人身份與丙簽約）本身成立有效（乙丙雙方合意），只是未得甲同意而違反對甲的義務，乙丙契約本身並非無效。", "✗B. 甲乙間租賃契約並未因乙擅自轉租而無效，選項錯誤。", "✗C. 乙得終止乙丙租賃契約（乙是出租人），但此非本題重點；甲的權利才是問題所在。", "✓D. §443Ⅰ，承租人未得出租人（甲）同意擅自將全部轉租，出租人（甲）得「終止」其與承租人（乙）之租賃契約，正確。"]}, {"year": 113, "num": 12, "ans": "C", "stem": "甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？", "opts": ["丙可以請求丁拆屋還地", "丁必須承租丙之土地", "視為丁於土地上有地上權", "推定丙與丁間有使用借貸關係"], "exp": ["✗A. 依§877-1，抵押拍賣土地房屋分別由不同人拍得，「視為」已設定地上權，丁（房屋拍得人）有地上權，丙不得請求拆屋還地。", "✗B. 非「必須承租」，而是「視為」有地上權（§877-1），法律關係為地上權而非租賃，選項錯誤。", "✓C. §877-1，土地及房屋同屬一人而分別設定抵押，拍賣時由不同人拍得，「視為」已設定地上權，正確。", "✗D. 「推定」使用借貸不符合本條文規定（§877-1為「視為地上權」），選項法律效果錯誤。"]}, {"year": 114, "num": 6, "ans": "D", "stem": "民法規定權利客體中動產、不動產之定義、種類及變動之法定方式；依該規定之內容，下列何者屬於正確之敘述？", "opts": ["甲在所有A地種植芭樂樹，樹上之芭樂成熟時，即已成為獨立之動產", "甲為慶祝關聖帝君生日臨時搭建完成之表演舞台，屬於甲獨立取得之定著物", "甲為建築研究目的在A地臨時架設之鐵皮屋，屬於A地之定著物", "甲在所有A地種植之芭樂樹，屬於A地之成分，除法律另有規定外，其所有權屬於A地所有人甲"], "exp": ["✗A. 芭樂成熟時仍附著於樹上（未分離），尚屬「天然孳息」（連結於主物），須與主物「分離」後才成為獨立動產（§70Ⅰ），選項說「成熟時即已成獨立動產」，未分離前仍屬主物一部，錯誤。", "✗B. 臨時搭建的表演舞台缺乏「繼續性固定附著」之要件，不構成定著物，屬動產，選項錯誤。", "✗C. 臨時架設之鐵皮屋（為研究目的、非永久性）不符定著物「繼續性使用目的」，屬動產而非定著物，選項錯誤。", "✓D. 土地上種植之樹木為土地之「成分」（附著於土地、非獨立），分離前屬土地所有人所有（§816以下、物之成分原則），正確。"]}, {"year": 114, "num": 8, "ans": "C", "stem": "關於無因管理之制度，下列何者非屬我國民法相關規範之內容？", "opts": ["無因管理人誤將客觀上屬於自己事務當作他人之事務，而為事務之管理者，不成立民法之無因管理", "無因管理人違反本人明示或可得推知之意思，代本人繳納贈與稅捐，得依民法第176條之規定，向本人請求償還費用", "無因管理人管理他人事務，得請求本人給付相當之管理報酬", "適法無因管理人得請求本人償還其因管理事務所支出之必要費用及其利息"], "exp": ["✓A. 誤將「自己事務」當他人事務管理，「主觀上認為是他人事務」但客觀上是自己事務，此屬「準無因管理」，民法承認此情形不成立無因管理（因缺乏「為他人」之客觀要件），正確（屬規範內容）。", "✓B. §176但書，違反本人意思之不適法管理，本人若受利益，仍得請求於其所受利益限度內償還費用，正確（屬規範內容）。", "✗C（本題答案）. 無因管理人管理他人事務，民法並不賦予「管理報酬」請求權（§172-§178均無報酬規定），無因管理只能請求費用償還，不能請求「報酬」，本選項說得請求「管理報酬」，並非民法規範內容，為應選答案。", "✓D. §176Ⅰ，適法無因管理，管理人得請求必要費用及利息，正確（屬規範內容）。"]}, {"year": 114, "num": 12, "ans": "B", "stem": "甲將房屋租給乙。下列何者正確？", "opts": ["租期若超過1年，且未寫書面契約，則租賃契約無效", "若未特別約定，則乙有權將其中的房間分租給丙", "若未特別約定，則乙有權將承租人的地位債權讓與給丙", "若雙方約定租期3年，3年過後乙默默繳房租，甲也照收，則租賃關係結束"], "exp": ["✗A. §422，逾一年未書面「視為不定期限」，並非無效，此為最高頻考試陷阱，選項錯誤。", "✓B. §443Ⅱ，「一部轉租」無反對約定者得為之，乙可將部分房間（一部）分租給丙，正確。", "✗C. 租賃契約地位之讓與（將整個承租人地位轉讓）須得出租人（甲）同意（§422-1類推），並非無須特別約定即可，選項錯誤。", "✗D. §451，租賃期限屆滿後，承租人仍繼續使用，出租人不即表示反對，「視為以不定期限繼續租賃」，並非「租賃關係結束」，選項錯誤。"]}, {"year": 114, "num": 13, "ans": "D", "stem": "對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？", "opts": ["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第231條之規定請求贈與人對於遲延給付造成之損害，負賠償責任", "依現行民法之規定，以不動產為標的之贈與，若欲使該贈與具有確定性而不得任意撤銷，贈與之書面應以公證書為之", "贈與契約為雙務契約，若受贈人受領贈與物後，贈與人得依民法第264條同時履行抗辯規定，拒絕給付", "贈與人故意不告知贈與物之瑕疵，受贈人可向贈與人主張損害賠償責任"], "exp": ["✗A. §410，贈與人責任以「故意或重大過失」為限；對於「給付遲延」，受贈人依§231一般規定請求賠償，然而§410的特別規定限縮了贈與人責任，受贈人若主張遲延賠償須符合§410特別要件（故意或重大過失），選項說「得依§231請求」未扣除§410限制，不夠精確。", "✗B. §408Ⅱ，書面贈與（不以公證書為限，一般書面即可）不得撤銷；並非「必須公證書」才不得撤銷，一般書面亦可，選項說「應以公證書為之」限制過嚴，錯誤。", "✗C. 贈與為「單務契約」（受贈人無對待給付義務），並非雙務契約，同時履行抗辯（§264）僅適用於雙務契約，贈與不適用，選項描述贈與為雙務錯誤。", "✓D. §411但書，贈與人「故意不告知」贈與物之瑕疵者，應對受贈人負擔保責任（賠償損害），正確。"]}, {"year": 114, "num": 14, "ans": "D", "stem": "甲、乙兩人合夥開了一家小麵館M，生意興隆。下列何者錯誤？", "opts": ["如甲在麵館以外之場所猥褻K，乙無須對K負連帶損害賠償責任", "麵體供應商J多次索取買賣價金均無果，J得以M為被告請求履行債務", "甲、乙兩人想把M收起來，尚有盈餘財產，應先清償合夥債務再分配剩餘", "甲與乙的合夥關係是一種法人關係，具有獨立之法律人格"], "exp": ["✓A. 甲在麵館「以外之場所」猥褻K，屬甲個人行為（與合夥事業無關），乙不負連帶責任，正確。", "✓B. 合夥雖非法人，但得以「合夥名義」（合夥人全體）被告請求，J得以M（合夥體）為被告，正確。", "✓C. 合夥解散清算程序：先清償債務，再分配剩餘財產（§697），正確。", "✗D（本題答案）. 民法上之合夥（§667以下）「並非法人」，沒有獨立之法律人格（與公司等法人不同），合夥的財產由合夥人公同共有，合夥本身不具有法人資格，本選項說「是法人關係，具有獨立法律人格」，與民法規定相反，錯誤，為應選答案。"]}];
const TOTAL=46;
const YEARS=[107, 108, 109, 110, 111, 112, 113, 114];
const SK='civlaw_bc_drill_p2_v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
let aY='all',aF='all';
function gk(q){return q.year+'_'+q.num}
function getFilt(){return QS.filter(q=>{const k=gk(q),s=S[k];if(aY!=='all'&&q.year!==aY)return false;if(aF==='un')return!s;if(aF==='wrong')return s&&!s.ok;return true})}
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length,cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function buildChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const a=mk('div','chip'+(aY==='all'?' active':''));a.textContent='全部('+TOTAL+')';a.onclick=()=>{aY='all';render()};c.appendChild(a);
  YEARS.forEach(y=>{const cnt=QS.filter(q=>q.year===y).length,d=mk('div','chip'+(aY===y?' active':''));d.textContent=y+'年('+cnt+')';d.onclick=()=>{aY=y;render()};c.appendChild(d)});
}
function card(q){
  const k=gk(q),s=S[k],c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln[0]==='✓')d.classList.add('cl');else if(ln[0]==='✗')d.classList.add('wl');else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    const lb=mk('span',null,'錯題分類：');lb.style.cssText='font-size:11px;color:var(--gray)';tr.appendChild(lb);
    [['a','A法條混淆'],['b','B粗心'],['c','C真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);return c;
}
function renderCard(q){const old=document.getElementById('c_'+gk(q));if(old)old.replaceWith(card(q))}
function choose(q,ch){
  S[gk(q)]={ch,ok:ch===q.ans};sv();renderCard(q);
  document.getElementById('c_'+gk(q))?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  buildChips();const qs=getFilt(),m=document.getElementById('main');m.innerHTML='';stats();
  if(!qs.length){m.innerHTML='<div class="empty">無符合條件的題目，請切換篩選條件</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
</script>
</body></html>
