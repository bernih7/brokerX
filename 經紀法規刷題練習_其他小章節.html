<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>經紀法規刷題練習｜其他小章節綜合題(C1-H2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8F3E9; --ink:#2A2722; --vermillion:#A8402B; --gold:#BC8A2E;
  --green:#3F6B4C; --line:#DDD2BB;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",sans-serif; line-height:1.6; padding-bottom:60px;
}
header{
  padding:20px 16px 14px; border-bottom:3px double var(--vermillion);
  background:linear-gradient(180deg,#FBF8F0,var(--paper));
  position:sticky; top:0; z-index:20;
}
h1{
  font-family:"Noto Serif TC",serif; font-weight:900; font-size:1.35rem;
  margin:0 0 4px; color:var(--vermillion); letter-spacing:.02em;
}
.sub{font-size:.78rem; color:#7a6f5c;}
.stats{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:.78rem; }
.stat{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; color:#5a5142; }
.stat b{color:var(--vermillion);}
.controls{ max-width:920px; margin:14px auto 0; padding:0 16px; }
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.fbtn{
  border:1.5px solid var(--gold); background:#fff; color:#7a5c1e;
  padding:7px 14px; border-radius:20px; font-size:.82rem; cursor:pointer;
  font-family:"Noto Sans TC",sans-serif; transition:.15s;
}
.fbtn.active{ background:var(--gold); color:#fff; }
.fbtn.danger{ border-color:var(--vermillion); color:var(--vermillion); }
.fbtn.danger.active{ background:var(--vermillion); color:#fff; }
.chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.chip{
  border:1px solid var(--line); background:#fff; color:#6b6252;
  padding:4px 11px; border-radius:14px; font-size:.75rem; cursor:pointer;
}
.chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
main{ max-width:920px; margin:0 auto; padding:14px 16px 40px; }
.qcard{
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:16px 18px 14px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.qmeta{ font-size:.72rem; color:#9a8f78; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
.badge{ display:inline-block; font-size:.68rem; padding:1px 7px; border-radius:8px; border:1px solid var(--line); color:#7a6f5c; }
.badge.wrong{ border-color:var(--vermillion); color:var(--vermillion); background:#FBEDEA;}
.stem{ font-size:1rem; font-weight:500; margin:4px 0 10px; }
.opt{
  display:block; width:100%; text-align:left; padding:9px 12px;
  margin-bottom:7px; border:1.5px solid var(--line); border-radius:8px;
  background:#FEFCF7; cursor:pointer; font-size:.9rem; color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
}
.opt:hover{ border-color:var(--gold); }
.opt.correct{ border-color:var(--green); background:#EAF3EC; font-weight:700; }
.opt.chosen-wrong{ border-color:var(--vermillion); background:#FBEDEA; font-weight:700; }
.opt.disabled{ cursor:default; }
.explain-box{
  margin-top:10px; padding:12px 14px; background:#FBF8F0;
  border-left:3px solid var(--gold); border-radius:6px; font-size:.85rem; display:none;
}
.explain-box.show{ display:block; }
.explain-line{ margin-bottom:6px; }
.explain-line b{ color:var(--vermillion); }
.explain-line.ok b{ color:var(--green); }
.ref{ margin-top:8px; font-size:.75rem; color:#8a7f68; }
.errtag-row{ margin-top:10px; display:none; gap:6px; }
.errtag-row.show{ display:flex; }
.etag{
  font-size:.72rem; padding:3px 9px; border-radius:12px; border:1px solid var(--line);
  background:#fff; cursor:pointer; color:#6b6252;
}
.etag.on-A{ background:#A8402B; color:#fff; border-color:#A8402B; }
.etag.on-B{ background:#BC8A2E; color:#fff; border-color:#BC8A2E; }
.etag.on-C{ background:#3F6B4C; color:#fff; border-color:#3F6B4C; }
footer{ text-align:center; font-size:.7rem; color:#a49a86; padding:20px 10px 10px; }
.empty{ text-align:center; color:#9a8f78; padding:40px 0; font-size:.9rem; }
</style>
</head>

<div class="controls">

    <button class="fbtn danger" id="resetBtn">清除作答紀錄</button>

</div>

<script>
const QUESTIONS = [{"chapter": "C1", "year": 101, "qnum": 26, "stem": "有關不動產說明書「土地」之應記載事項，其應納稅額不包含下列何種稅目？", "options": ["土地增值稅", "地價稅", "契稅", "印花稅"], "answer": "C", "explains": {"A": "土地增值稅為土地移轉時之應納稅額，屬土地應記載稅目，非本題答案。", "B": "地價稅為土地保有期間之應納稅額，屬土地應記載稅目，非本題答案。", "C": "正確答案。「契稅」係「建物」（房屋）產權移轉時之應納稅目，土地移轉係課徵「土地增值稅」而非契稅，兩稅目分屬不同課稅標的（土地課土增稅、建物課契稅），此為土地與建物稅目混淆之★陷阱。", "D": "印花稅為契約書用印之應納稅額，屬土地應記載稅目，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項（土地部分）", "id": 1}, {"chapter": "C2", "year": 101, "qnum": 25, "stem": "有關不動產說明書「成屋」之應記載事項，下列何者非屬「建築改良物瑕疵情形」？", "options": ["是否為凶宅", "是否有滲漏水情形及其位置", "是否有損鄰狀況", "是否有檢測海砂含氯量及輻射鋼筋"], "answer": "A", "explains": {"A": "正確答案。「是否為凶宅」（非自然死亡情形）在不動產說明書架構中係「獨立列項」之應記載事項（與「其他重要事項」有關），而非歸類於「建築改良物瑕疵情形」項下（瑕疵情形聚焦於建物物理性缺陷，如漏水損鄰海砂輻射鋼筋等，凶宅屬心理瑕疵，分類性質不同），此為分類項目之陷阱。", "B": "滲漏水情形及其位置屬建築改良物瑕疵情形，非本題答案。", "C": "損鄰狀況屬建築改良物瑕疵情形，非本題答案。", "D": "海砂含氯量及輻射鋼筋檢測屬建築改良物瑕疵情形，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項（成屋部分）", "id": 2}, {"chapter": "C2", "year": 104, "qnum": 40, "stem": "依內政部公布之「不動產說明書應記載及不得記載事項」之規範，成屋買賣時，其不動產說明書應記載都市計畫地形圖或相關電子地圖圖面標示周邊半徑多少公尺範圍內的重要環境設施（如學校、醫院、變電所、公墓）？", "options": ["200公尺", "300公尺", "400公尺", "500公尺"], "answer": "B", "explains": {"A": "數字錯誤，非200公尺。", "B": "正確。成屋不動產說明書應標示周邊半徑「300公尺」範圍內之重要環境設施，此數字與預售屋水災淹水救助紀錄之半徑範圍相同（皆為300公尺），為本科高頻重複出現之數字。", "C": "數字錯誤，非400公尺。", "D": "數字錯誤，非500公尺。"}, "ref": "不動產說明書應記載及不得記載事項（成屋部分）", "id": 3}, {"chapter": "C2", "year": 105, "qnum": 3, "stem": "依新修正之「不動產說明書應記載及不得記載事項」規定，下列何者並非成屋契約之應記載事項？", "options": ["是否已辦理建物所有權第一次登記", "各期價金之履約保證機制方式，及其受託或提供擔保者", "建物型態與現況格局", "本建物（專有部分）於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形，若有，應敘明"], "answer": "B", "explains": {"A": "是否已辦理建物所有權第一次登記，屬成屋應記載事項，非本題答案。", "B": "正確答案。「各期價金之履約保證機制方式」係涉及分期給付價金之「預售屋」買賣（履約擔保機制係為保障預售屋分期付款過程中款項安全）之應記載事項，成屋買賣通常為一次性交易或依一般約定給付，非以「各期價金」履約保證機制為應記載事項，此為成屋與預售屋應記載事項混淆之陷阱。", "C": "建物型態與現況格局，屬成屋應記載事項，非本題答案。", "D": "專有部分產權持有期間是否曾發生非自然死亡情形，屬成屋應記載事項，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項（成屋部分）", "id": 4}, {"chapter": "C2", "year": 107, "qnum": 6, "stem": "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。依不動產說明書應記載及不得記載事項「壹、應記載事項二、成屋」部分，有關應記載或說明之「其他重要事項」，下列敘述何者錯誤？", "options": ["周邊環境，詳如都市計畫地形圖或相關電子地圖並於圖面標示周邊半徑三百公尺範圍內之重要環境設施", "是否已辦理地籍圖重測", "是否為直轄市或縣（市）政府列管之山坡地住宅社區", "本建物共有部分於產權持有期間是否曾發生兇殺、自殺、一氧化碳中毒或其他非自然死亡之情形"], "answer": "D", "explains": {"A": "周邊環境標示半徑300公尺重要環境設施，屬應記載事項，敘述正確，非本題答案。", "B": "是否已辦理地籍圖重測，屬應記載事項，敘述正確，非本題答案。", "C": "是否為列管山坡地住宅社區，屬應記載事項，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。非自然死亡情形之記載範圍應為本建物「專有部分」（而非「共有部分」）於產權持有期間曾發生之情形，因非自然死亡事件通常發生於專屬個人使用之專有空間內，共有部分非此類事件之記載對象，此為專有／共有部分混淆之★陷阱。"}, "ref": "不動產說明書應記載及不得記載事項（成屋部分）", "id": 5}, {"chapter": "C3", "year": 105, "qnum": 8, "stem": "根據不動產說明書應記載及不得記載事項，關於預售屋的其他重要事項，應敘明最近多少時間內基地周邊半徑多少公尺範圍內有無申請水災淹水救助紀錄？", "options": ["最近3年內基地周邊半徑3百公尺範圍內", "最近3年內基地周邊半徑5百公尺範圍內", "最近5年內基地周邊半徑3百公尺範圍內", "最近5年內基地周邊半徑5百公尺範圍內"], "answer": "C", "explains": {"A": "時間與距離皆錯誤。", "B": "時間錯誤，非3年。", "C": "正確。應敘明最近「5年內」基地周邊半徑「300公尺」範圍內有無申請水災淹水救助紀錄，此為115年最新修正（115.1.13修正、115.4.1生效）之新增重點之一，務必牢記「5年、300公尺」之組合數字。", "D": "距離錯誤，非500公尺。"}, "ref": "不動產說明書應記載及不得記載事項（預售屋部分，115年最新修正）", "id": 6}, {"chapter": "C4", "year": 101, "qnum": 30, "stem": "下列有關不動產說明書之敘述，何者為錯誤？", "options": ["不動產說明書應記載及不得記載事項，由經紀人定之", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "租賃或買賣雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章", "不動產說明書於提供解說前，應經委託人簽章"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。不動產說明書應記載及不得記載事項，應由「內政部」（中央主管機關）定之並公告，而非由「經紀人」個別自行決定，訂定機關主體錯誤，此為★陷阱。", "B": "經紀人員應以說明書向相對人解說，敘述正確，非本題答案。", "C": "締約時經紀人應交付說明書予相對人並由相對人簽章，敘述正確，非本題答案。", "D": "說明書於提供解說前應經委託人簽章，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第23條", "id": 7}, {"chapter": "C4", "year": 102, "qnum": 40, "stem": "下列何者非不動產說明書不得記載事項之內容？", "options": ["附屬建物除陽台外，其餘項目不得計入買賣價格", "不得為其他違反法律強制或禁止規定之約定", "不得使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞", "預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"], "answer": "A", "explains": {"A": "正確答案。「附屬建物除陽台外，其餘項目不得計入買賣價格」並非不動產說明書不得記載事項之法定內容（此為虛構之限制規定，附屬建物是否計入買賣價格屬雙方交易條件約定範疇，法規並無此種一律排除之強制規定），此為虛構條款內容之陷阱，此題型重複出現於106年、108年。", "B": "不得為其他違反法律強制或禁止規定之約定，屬不得記載事項之兜底概括規定，非本題答案。", "C": "不得使用未經明確定義之面積名詞，屬不得記載事項之內容，非本題答案。", "D": "預售屋不得記載未經領有建照之夾層設計或空間面積，屬不得記載事項之內容，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項", "id": 8}, {"chapter": "C4", "year": 104, "qnum": 1, "stem": "區分所有建物之型態為五樓有電梯之住宅，依內政部公布之「不動產說明書應記載及不得記載事項」之規範，將其歸類為下列何者？", "options": ["公寓", "大廈", "華廈", "住宅大樓"], "answer": "C", "explains": {"A": "公寓通常係指「無電梯」之5樓以下建物，本題有電梯，不符公寓歸類要件。", "B": "「大廈」非本規範標準歸類用語（一般指7樓以上有電梯之集合住宅，惟本規範精確分類用語有所不同）。", "C": "正確。依不動產說明書應記載及不得記載事項規範，5樓「有電梯」之區分所有建物歸類為「華廈」（一般認知：公寓＝無電梯5樓以下；華廈＝有電梯5-6樓；住宅大樓＝7樓以上有電梯），此為建物型態分類之核心考點。", "D": "住宅大樓通常係指「7樓以上」有電梯之建物，本題為5樓，樓層數不符住宅大樓歸類要件。"}, "ref": "不動產說明書應記載及不得記載事項", "id": 9}, {"chapter": "C4", "year": 106, "qnum": 4, "stem": "下列何者非為不動產說明書不得記載事項？", "options": ["不得約定拋棄說明書審閱期間", "不得記載本說明書內容僅供參考", "不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞", "不得記載房價有上漲空間或預測房價上漲之情形"], "answer": "A", "explains": {"A": "正確答案。「不得約定拋棄說明書審閱期間」並非不動產說明書不得記載事項之法定明文內容（此為虛構之限制規定，與此類型重複出現之陷阱題型102年、108年相同），非法規實際規範之內容。", "B": "不得記載本說明書內容僅供參考，屬不得記載事項之內容，非本題答案。", "C": "不得使用實際所有權面積以外之類似名詞，屬不得記載事項之內容，非本題答案。", "D": "不得記載房價上漲空間或預測，屬不得記載事項之內容，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項", "id": 10}, {"chapter": "C4", "year": 108, "qnum": 10, "stem": "下列何者非屬內政部所頒不動產說明書不得記載事項之內容？", "options": ["附屬建物除陽台外，其餘項目不得計入買賣價格", "不得記載本說明書內容僅供參考", "不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞", "預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"], "answer": "A", "explains": {"A": "正確答案。「附屬建物除陽台外，其餘項目不得計入買賣價格」非不得記載事項之法定內容，此為虛構條款之陷阱，與102年-40題、106年-4題相同類型，反覆重複命題，務必牢記本題答案模式。", "B": "不得記載本說明書內容僅供參考，屬不得記載事項之內容，非本題答案。", "C": "不得使用實際所有權面積以外之類似名詞，屬不得記載事項之內容，非本題答案。", "D": "預售屋不得記載未經領有建照之夾層設計或空間面積，屬不得記載事項之內容，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項", "id": 11}, {"chapter": "C4", "year": 112, "qnum": 4, "stem": "有關不動產說明書之敘述，下列何者正確？", "options": ["不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，不動產說明書應由經紀業指派經紀營業員簽章", "經紀人員應以不動產說明書向與委託人交易之相對人解說。提供解說前，應經委託人交易之相對人簽章", "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人", "不動產說明書應記載及不得記載事項，由所在地主管機關定之"], "answer": "C", "explains": {"A": "應由經紀業指派「經紀人」（而非「經紀營業員」）簽章，主體錯誤（簽章權限僅限經紀人，經紀營業員不具此權限）。", "B": "提供解說前，應經「委託人」（而非「委託人交易之相對人」）先行簽章，主體錯誤（正確流程：委託人先簽章確認→經紀人向相對人解說→締約時交付相對人並由相對人簽章）。", "C": "正確。雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，此為說明書解說流程最後一步之核心規定。", "D": "應由「內政部」（中央主管機關，而非「所在地主管機關」即地方政府）定之，機關層級錯誤。"}, "ref": "不動產經紀業管理條例第22條、第24條", "id": 12}, {"chapter": "C4", "year": 114, "qnum": 11, "stem": "有關不動產說明書應記載及不得記載事項之擬定與公告，下列敘述何者正確？", "options": ["由內政部擬定相關規範，並向行政院報請核定公告", "由消費者保護處擬定相關規範，並向行政院報請核定公告", "由法務部擬定相關規範，並向司法院報請核定公告", "由仲介業全聯會擬定相關規範，並向司法院報請核定公告"], "answer": "A", "explains": {"A": "正確。不動產說明書應記載及不得記載事項，由「內政部」擬定相關規範，並向「行政院」報請核定公告，機關層級及程序皆正確。", "B": "消費者保護處非本規範之擬定機關，此為虛構機關之陷阱。", "C": "法務部及司法院皆非本規範之擬定或核定機關，此為虛構機關之陷阱。", "D": "仲介業全聯會為民間公會組織，非法定擬定機關（雖可能提供意見諮詢，但非正式擬定核定主體），此為虛構機關之陷阱。"}, "ref": "消費者保護法第17條、不動產說明書應記載及不得記載事項", "id": 13}, {"chapter": "D2", "year": 101, "qnum": 23, "stem": "有關預售屋買賣定型化契約應記載事項，下列何者為錯誤？", "options": ["賣方應確保廣告內容之真實，預售屋之廣告宣傳品及其所記載之建材設備表、房屋及停車位平面圖與位置示意圖，為契約之一部分", "附屬建物，除陽臺外，其餘項目不得計入買賣價格", "房屋所有權之移轉，應於使用執照核發後三個月內備妥文件申辦有關稅費及權利移轉登記", "賣方應於領得使用執照六個月內，通知買方進行交屋"], "answer": "C", "explains": {"A": "賣方應確保廣告真實，廣告宣傳品及建材設備表等為契約之一部分，敘述正確，非本題答案。", "B": "附屬建物除陽台外其餘項目不得計入買賣價格，此為預售屋契約應記載事項之一（與C4章節不得記載事項虛構陷阱不同，此處係預售屋契約應記載事項之明確規定），敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。房屋所有權移轉應於使用執照核發後之申辦期限，法定期限與本選項所述「三個月內」有所出入（依預售屋買賣定型化契約規範，通常涉及不同期限組合，本選項數字經核對非官方標準答案所認定之正確期限），建議對照官方詳解確認精確期限數字。", "D": "賣方應於領得使用執照6個月內通知買方交屋，敘述正確，非本題答案。"}, "ref": "預售屋買賣定型化契約應記載及不得記載事項；⚠️本題C選項之精確期限數字建議對照官方詳解確認", "id": 14}, {"chapter": "D2", "year": 103, "qnum": 12, "stem": "依公寓大廈管理條例及預售屋買賣定型化契約應記載及不得記載事項規定，經規約草約訂定者，下列何者得為約定專用部分？", "options": ["共有部分之屋頂突出物", "公寓大廈本身所占之地面", "非屬避難之屋頂平臺", "連通數個專有部分之走廊"], "answer": "C", "explains": {"A": "共有部分之屋頂突出物（如水箱機械室等）性質特殊，通常仍屬不得約定專用之範疇，非本題答案。", "B": "公寓大廈本身所占之地面，屬法定不得約定專用之項目，非本題答案。", "C": "正確。「非屬避難之屋頂平臺」（即非供逃生避難使用之屋頂平台部分），經規約草約訂定者，得為約定專用部分（與「屬避難用途」之屋頂平台須保留供全體防災逃生使用不同，此為屋頂平台細分規定之核心考點）。", "D": "連通數個專有部分之走廊，屬法定不得約定專用之項目，非本題答案。"}, "ref": "公寓大廈管理條例第7條、預售屋買賣定型化契約應記載及不得記載事項", "id": 15}, {"chapter": "D2", "year": 103, "qnum": 22, "stem": "甲向乙建設公司購買預售屋，並簽訂定型化契約，該契約中有「屋簷面積計入買賣價格」之定型化契約條款。請問該預售屋買賣定型化契約效力為何？", "options": ["無效，因為違反預售屋買賣定型化契約應記載及不得記載事項", "無效，因為顯失公平", "有效，因為甲已同意該契約所有條款", "有效，因為以一部無效為原則"], "answer": "D", "explains": {"A": "雖該特定「屋簷計價」條款因違反不得記載事項而無效，惟「整份契約」並非當然無效，本選項效力範圍過大，錯誤。", "B": "該條款無效之理由係違反法定不得記載事項規定，非泛稱「顯失公平」之一般性理由，且整份契約非因此全部無效。", "C": "甲同意契約條款不能使違反法定強制規定之無效條款轉為有效（強制規定不得以當事人合意排除），此理由不成立。", "D": "正確。依消保法第16條「一部無效原則」，該「屋簷計價」條款雖因違反不得記載事項而無效，但除去該部分後契約仍可成立者，契約之其他部分仍為有效（除非對當事人一方顯失公平，始使契約全部無效），此為定型化契約部分無效之標準處理原則。"}, "ref": "消費者保護法第16條、預售屋買賣定型化契約應記載及不得記載事項", "id": 16}, {"chapter": "D2", "year": 113, "qnum": 8, "stem": "內政部公告之「預售屋買賣定型化契約應記載及不得記載事項」及「不動產說明書應記載或不得記載事項（預售屋部分）」，均要求預售屋之買賣須具備履約擔保制度。試問：由建商或起造人將建案土地及興建資金信託予某金融機構或經政府許可之信託業者執行履約管理。興建資金應依工程進度專款專用。簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。此係屬何種履約擔保？", "options": ["不動產開發信託", "價金返還保證", "價金信託", "同業連帶擔保"], "answer": "A", "explains": {"A": "正確。將建案「土地及興建資金」信託予金融機構或信託業者執行履約管理，資金依工程進度專款專用，此為「不動產開發信託」之定義，是預售屋五種法定履約擔保機制之一，強調土地與資金皆納入信託管理，保障程度較高。", "B": "「價金返還保證」係指由金融機構就消費者已繳價金提供返還保證（若建商違約無法完工得請求返還已繳價金），與本題「土地及興建資金信託」之機制不同。", "C": "「價金信託」僅將「價金」（消費者繳款）信託專款專用，不含「土地」信託，與本題涵蓋「建案土地及興建資金」之完整信託機制範圍不同。", "D": "「同業連帶擔保」係由公會或同業共同擔保之機制，與本題信託機制性質不同。"}, "ref": "預售屋買賣定型化契約應記載及不得記載事項", "id": 17}, {"chapter": "D2", "year": 113, "qnum": 20, "stem": "預售屋買賣定型化契約應記載及不得記載事項規定，接通自來水、電力之管線費及其相關費用（例如安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等）應由誰負擔？", "options": ["賣方", "買方", "買賣雙方平均分配", "買賣雙方議定"], "answer": "A", "explains": {"A": "正確。接通自來水、電力之管線費及相關費用（安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等），依規定應由「賣方」（建商）負擔，此為保障消費者不受額外隱藏成本負擔之強制性應記載事項。", "B": "應由賣方負擔，非買方負擔，主體錯誤。", "C": "法定應由賣方單獨負擔，非雙方平均分配。", "D": "此為法定強制性應記載事項，非任由買賣雙方自由議定之事項。"}, "ref": "預售屋買賣定型化契約應記載及不得記載事項", "id": 18}, {"chapter": "D3", "year": 101, "qnum": 24, "stem": "有關不動產委託銷售定型化契約之應記載事項，下列敘述何者錯誤？", "options": ["委託銷售價格未記載金額者，不動產委託銷售定型化契約無效", "未記載委託銷售期間者，委託人得隨時以書面終止", "受託人受託處理仲介事務應以善良管理人之注意為之", "受託人於簽約前，應據實提供該公司（或商號）近一個月之成交行情，供委託人訂定售價之參考；如有隱匿不實，應負賠償責任"], "answer": "D", "explains": {"A": "委託銷售價格未記載金額者，該契約無效，敘述正確（委託銷售價格為契約必要之點），非本題答案。", "B": "未記載委託銷售期間者，委託人得隨時以書面終止，敘述正確，非本題答案。", "C": "受託人受託處理仲介事務應以善良管理人之注意為之，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。受託人應於簽約前提供之成交行情資料，法定期間應為近「三個月」（而非「一個月」）之成交行情，數字錯誤，此為期間數字之陷阱。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 19}, {"chapter": "D3", "year": 101, "qnum": 33, "stem": "不動產委託銷售定型化契約之應記載事項，有關契約及其附件之審閱期間，下列敘述何者為正確？", "options": ["不得少於五日", "不得少於三日", "不得少於七日", "不得超過十日"], "answer": "B", "explains": {"A": "數字錯誤，5日為成屋/預售屋買賣契約審閱期，非委託銷售契約。", "B": "正確。委託銷售契約及其附件之審閱期間「不得少於3日」，此與買賣契約（5日）不同，須區辨兩者天數差異（成屋/預售屋買賣5日 vs 委託銷售3日）。", "C": "數字錯誤，非7日。", "D": "用語及數字皆錯誤，非上限規定，且非10日。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 20}, {"chapter": "D3", "year": 102, "qnum": 13, "stem": "根據不動產委託銷售定型化契約應記載及不得記載事項之規定：「買方支付定金後，如買方違約不買，致定金由委託人沒收者，委託人應支付該沒收定金之百分之     予受託人，以作為該次委託銷售服務之支出費用，且不得再收取服務報酬。」試問若前項沒收定金百分比於契約未記載者，應如何處理？", "options": ["受託人不得向委託人請求服務報酬或費用", "受託人得向委託人請求支付該沒收定金之百分之二十予受託人，以作為該次委託銷售服務之支出費用，且不得再收取服務報酬", "受託人得向委託人請求支付該沒收定金之百分之五十予受託人，以作為該次委託銷售服務之支出費用，且不得再收取服務報酬", "受託人得向委託人請求支付該沒收定金之百分之百予受託人，以作為該次委託銷售服務之支出費用，且不得再收取服務報酬"], "answer": "A", "explains": {"A": "正確。沒收定金百分比未記載於契約者，受託人「不得」向委託人請求服務報酬或費用，此為保護委託人不因契約空白而受不利益之默認規則（未記載視為受託人放棄此項請求權），與其他契約應記載事項「未記載即不生效力」或「按最低額計算」之處理方式不同，須留意本題之特殊默認效果。", "B": "未記載者受託人不得請求任何費用，非可依特定百分比請求，此為虛構替代比例之陷阱。", "C": "同上，未記載者不得請求，非依特定百分比計算。", "D": "同上，未記載者不得請求，非依百分之百計算。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 21}, {"chapter": "D3", "year": 103, "qnum": 5, "stem": "依不動產委託銷售定型化契約應記載及不得記載事項規定，服務報酬數額空白未記載者，則服務報酬如何收取？", "options": ["該不動產委託銷售定型化契約無效", "受託人不得向委託人收取服務報酬", "受託人可向委託人收取差價", "受託人最高可收取中央主管機關規定實際成交價百分之六的服務報酬"], "answer": "B", "explains": {"A": "服務報酬數額未記載，不致使整份契約無效（僅生報酬請求權之限制效果），此與「委託銷售價格」未記載金額致契約無效之情形不同，須區辨（101年-24題A選項）。", "B": "正確。服務報酬數額空白未記載者，受託人「不得」向委託人收取服務報酬，此為保護委託人權益之默認規則（未記載視為受託人放棄報酬請求權）。", "C": "經紀業或經紀人員「不得」收取差價，此為法定強制禁止規定（不動產經紀業管理條例第19條），非本題未記載服務報酬時之替代收費方式。", "D": "未記載者不得收取任何報酬，非可依中央主管機關報酬標準上限收取，此為虛構替代規則之陷阱。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 22}, {"chapter": "D3", "year": 103, "qnum": 11, "stem": "A 屋所有權人甲與不動產經紀人乙簽訂一般委託銷售定型化契約，關於該契約中的記載，以下敘述何者正確？", "options": ["得約定本定型化契約及其附件之審閱期間僅有三日", "委託銷售之金額未記載者，本不動產委託銷售契約不當然無效", "未記載委託銷售期間者，甲仍不得隨時以書面終止", "如未記載乙服務報酬數額為實際成交價的百分比，乙仍得向甲收取最低額度的服務報酬"], "answer": "A", "explains": {"A": "正確。委託銷售契約審閱期間「不得少於3日」，故約定「僅有三日」（即以法定最低下限3日為約定審閱期）係符合法規最低要求之合法約定，敘述正確。", "B": "委託銷售金額（即委託銷售價格）未記載者，該契約「無效」（並非「不當然無效」），此為契約必要之點欠缺之效果，敘述錯誤。", "C": "未記載委託銷售期間者，甲（委託人）「得」隨時以書面終止（此為保護委託人不受無限期拘束之規定），本選項稱不得終止，方向相反。", "D": "未記載服務報酬數額或百分比者，乙（受託人）「不得」向甲收取服務報酬（非「仍得收取最低額度」），此為保護委託人不受不明報酬計算方式侵害之默認規則，本選項與法定規則不符。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 23}, {"chapter": "D3", "year": 105, "qnum": 12, "stem": "某不動產仲介業者甲，為同業競爭之目的，於某社區布告欄張貼散布乙業者有吞沒客戶斡旋金糾紛、浮報買賣物件開價之不實陳述，致乙業者業績慘跌，營業信譽受損，試問乙得向法院請求之權利，不包含下列何者？", "options": ["請求除去不法侵害行為", "請求損害賠償", "有侵害之虞時，得請求防止之", "請求精神慰撫金"], "answer": "D", "explains": {"A": "得請求除去不法侵害行為，屬法定救濟途徑之一，非本題答案。", "B": "得請求損害賠償，屬法定救濟途徑之一，非本題答案。", "C": "有侵害之虞時得請求防止之，屬法定救濟途徑之一，非本題答案。", "D": "正確答案。「精神慰撫金」（非財產上損害之慰撫金）原則上係保障「自然人」人格權受侵害之特有救濟（民法第195條），乙為「不動產仲介『業者』」（企業經營主體，通常為公司法人），法人性質上不具備「精神」痛苦之感受能力，其「營業信譽」受損所生之損害，性質上屬財產上損害（商譽減損），非精神慰撫金之適格請求範疇，此為法人與自然人人格權保護差異之陷阱。"}, "ref": "公平交易法第24條、民法第184條、第195條", "id": 24}, {"chapter": "D3", "year": 107, "qnum": 5, "stem": "依不動產委託銷售定型化契約應記載及不得記載事項之規定，買賣雙方價金與條件一致時，委託人應與受託人所仲介成交之買方另行簽訂「不動產買賣契約書」，並約定由委託人及買方共同或協商指定地政士辦理所有權移轉登記及相關手續；如未約明者，由何人指定之？", "options": ["委託人", "受託人", "買方", "直轄市、縣（市）主管機關"], "answer": "A", "explains": {"A": "正確。若契約未約明地政士由何人指定，依規定應由「委託人」（屋主）指定，此為賣方地位優先指定地政士之默認規則。", "B": "受託人（仲介業）非未約明時之默認指定主體。", "C": "買方非未約明時之默認指定主體。", "D": "直轄市、縣（市）主管機關非契約當事人，非指定地政士之主體，此為虛構主體之陷阱。"}, "ref": "不動產委託銷售定型化契約應記載及不得記載事項", "id": 25}, {"chapter": "D3", "year": 108, "qnum": 3, "stem": "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列何者不屬不動產經紀業管理條例規定經紀業應指派經紀人簽章之文件？", "options": ["不動產承租、承購委託契約書", "不動產承租、承購要約書", "定金收據", "不動產廣告稿"], "answer": "A", "explains": {"A": "正確答案。法定六類應由經紀業指派經紀人簽章之文件為：①不動產出租、出售委託契約書（賣方委託）②承租、承購要約書（買方要約）③定金收據④廣告稿⑤不動產說明書⑥租賃買賣契約書。本選項「不動產承租、承購委託契約書」非法定文件類型之一（買方承租承購之意向表達係以「要約書」形式呈現，而非另立「委託契約書」，此為六類法定文件精確用語之陷阱：委託契約書專指賣方出租/出售之委託，買方端則為要約書）。", "B": "承租、承購要約書為六類法定文件之一，非本題答案。", "C": "定金收據為六類法定文件之一，非本題答案。", "D": "不動產廣告稿為六類法定文件之一，非本題答案。"}, "ref": "不動產經紀業管理條例第22條第1項", "id": 26}, {"chapter": "D3", "year": 109, "qnum": 16, "stem": "關於不動產經紀業管理條例之用辭定義，下列敘述何者正確？", "options": ["預售屋指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "差價係指買方支付斡旋金之交易價格與賣方委託銷售價格之差額", "經紀人員包含經紀人或經紀營業員。經紀人指依本條例規定經營仲介或代銷業務之公司或商號；經紀營業員之職務為協助經紀人執行仲介或代銷業務", "加盟經營者係指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督"], "answer": "D", "explains": {"A": "預售屋應為領有「建造執照」（而非「使用執照」）尚未建造完成之建築物，執照類型錯誤，此為與成屋定義互換之陷阱。", "B": "差價係指「實際買賣交易價格」（而非「買方支付斡旋金之交易價格」）與「委託銷售價格」之差額，用語不精確，此為法定用語混淆之陷阱。", "C": "「經紀人指依本條例規定經營仲介或代銷業務之公司或商號」此描述應為「經紀業」之定義（經紀人係指個人取得證書從事仲介或代銷業務之自然人，非公司或商號），主體混淆。", "D": "正確。加盟經營者之法定定義：經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督，定義完整正確。"}, "ref": "不動產經紀業管理條例第4條", "id": 27}, {"chapter": "E2", "year": 100, "qnum": 1, "stem": "公寓大廈規約不得約定下列何種事項？", "options": ["主任委員職務之執行權限", "住戶違反義務之處理方式", "停車場使用管理辦法", "專有部分之出售限制"], "answer": "D", "explains": {"A": "主任委員職務之執行權限得由規約約定，非本題答案。", "B": "住戶違反義務之處理方式得由規約約定（且屬法定應載明始生效力之事項），非本題答案。", "C": "停車場使用管理辦法得由規約約定，非本題答案。", "D": "正確答案。「專有部分之出售限制」涉及區分所有權人對其專有部分之「處分權」（所有權核心權能之一），規約「不得」限制此項基本財產權，此為規約自治範圍之界線：規約得規範共同事務及使用限制，但不得侵害區分所有權人對其專有部分之處分自由，屬強制規定不容規約排除。"}, "ref": "公寓大廈管理條例第23條", "id": 28}, {"chapter": "E2", "year": 106, "qnum": 35, "stem": "下列有關公寓大廈管理之敘述，何者錯誤？", "options": ["住戶雖有繳管理費用，但仍不得任意棄置垃圾、惡臭物質", "住戶不得於私設通路、防火間隔、防火巷弄等處所堆置雜物", "住戶於開放空間及退縮空地，經管理委員會核准後，在核准範圍內得自行設置廣告物", "住戶飼養動物時，應遵守規定，不得妨害公共衛生、公共安寧以及公共安全"], "answer": "C", "explains": {"A": "繳管理費不代表得任意棄置垃圾惡臭物質，敘述正確，非本題答案。", "B": "不得於私設通路防火間隔防火巷弄堆置雜物，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。開放空間及退縮空地供營業使用（含設置廣告物等相關行為），應依「規約或區分所有權人會議決議」（而非僅「經管理委員會核准」）辦理，且須在主管機關核准範圍內，本選項將決議主體降格為管理委員會，層級不足，此為★陷阱。", "D": "飼養動物不得妨害公共衛生安寧安全，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第16條", "id": 29}, {"chapter": "E2", "year": 108, "qnum": 21, "stem": "公寓大廈專有部分之共同壁及樓地板或其內之管線，其維修費用，以下敘述何者正確？", "options": ["修繕費係因非可歸責於區分所有權人之事由所致者，由該區分所有權人負擔", "由該共同壁雙方或樓地板上下方之區分所有權人共同負擔", "由公共基金負擔", "由管理委員會負擔"], "answer": "B", "explains": {"A": "非可歸責特定人事由所致者，不應由單一區分所有權人單獨負擔，此為分擔原則錯誤之陷阱。", "B": "正確。專有部分之共同壁及樓地板或其內管線維修費用，非因可歸責特定人事由所致者，由該共同壁雙方或樓地板上下方之區分所有權人「共同」負擔，此為共同壁及樓地板維修費用分擔之核心規定。", "C": "公共基金非本情形之費用來源（此屬專有部分範疇之費用，非共用部分公共基金支付範圍）。", "D": "管理委員會非費用負擔主體（管委會僅負責共用部分之修繕執行，非本情形之費用負擔主體）。"}, "ref": "公寓大廈管理條例第12條", "id": 30}, {"chapter": "E2", "year": 112, "qnum": 12, "stem": "關於公寓大廈住戶之權利義務，下列何者正確？", "options": ["區分所有權人除法律另有限制外，對其共有部分，得自由使用、收益、處分，並排除他人干涉", "區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉，但設定負擔則可分別為之", "於住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用他住戶專有部分或約定專用部分時，應經管理負責人或管理委員會之同意後方得為之"], "answer": "B", "explains": {"A": "應為對其「專有部分」（而非「共有部分」）得自由使用收益處分並排除他人干涉，主體錯誤（共有部分是全體共有，個別區分所有權人不得片面排除他人干涉，僅按應有部分比例使用收益）。", "B": "正確。區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為，此為專有部分利用限制之核心規定。", "C": "專有部分不得與共用部分應有部分及基地權利應有部分分離而為「移轉或設定負擔」（兩者皆不得分離，非僅移轉受限、設定負擔可分別為之），本選項增加不當例外，屬★陷阱。", "D": "「住戶」因維護修繕而須進入使用「他住戶」專有部分或約定專用部分時，應經「該他住戶」同意（此為住戶相互間之情形，非經管理負責人或管理委員會同意，管理負責人或管委會同意係適用於「其因維護修繕共用部分」而須進入專有部分之情形），主體及情境混淆。"}, "ref": "公寓大廈管理條例第4條、第6條、第9條", "id": 31}, {"chapter": "E2", "year": 113, "qnum": 24, "stem": "3 樓住戶因浴室漏水，經抓漏後發現是 3、4 樓樓地板內之管線自然損壞導致漏水，請問修繕費用由誰負擔？", "options": ["3樓", "4樓", "3、4樓之住戶共同負擔", "3、4樓之區分所有權人共同負擔"], "answer": "D", "explains": {"A": "單獨由3樓負擔不符「樓地板上下方共同負擔」之規定。", "B": "單獨由4樓負擔不符「樓地板上下方共同負擔」之規定。", "C": "分擔主體應為「區分所有權人」（而非「住戶」），法定用語錯誤，因涉及財產所有權相關之修繕費用分擔義務，主體應為所有權人身分。", "D": "正確。樓地板內管線自然損壞（非因可歸責特定人事由所致），其修繕費用由樓地板「上下方之區分所有權人」（本題即3樓與4樓區分所有權人）共同負擔，此為樓地板維修費用分擔之核心規定。"}, "ref": "公寓大廈管理條例第12條", "id": 32}, {"chapter": "E2", "year": 113, "qnum": 25, "stem": "依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？", "options": ["原則可以，但社區管委會有權禁止住戶飼養動物", "原則可以，但規約另有禁止飼養之規定時，則依規約約定", "原則禁止，但社區管委會有權開放住戶飼養動物", "原則禁止，但規約有權開放住戶飼養動物"], "answer": "B", "explains": {"A": "管理委員會本身無權逕行禁止飼養動物（此須經「規約」載明始生效力，而非管委會單方決定），主體層級不足。", "B": "正確。住戶飼養動物原則上「可以」，但不得妨礙公共衛生、公共安寧及公共安全；若「規約另有禁止飼養之規定」，則依規約約定（此禁養約定須「載明於規約」始生效力），此為飼養動物規範之核心原則。", "C": "原則上並非「禁止」飼養（是「可以」飼養但受限制），本選項性質描述方向相反。", "D": "原則上並非「禁止」飼養，本選項性質描述方向相反。"}, "ref": "公寓大廈管理條例第16條", "id": 33}, {"chapter": "E4", "year": 100, "qnum": 5, "stem": "依公寓大廈管理條例規定，規約除應載明專有部分及共用部分範圍外，非經載明於規約者，不生效力。下列何者非屬於此規定之事項？", "options": ["禁止住戶飼養動物之特別約定", "違反義務之處理方式", "禁止從事宗教活動之特別約定", "財務運作之監督規定"], "answer": "C", "explains": {"A": "禁止住戶飼養動物之特別約定，屬法定須載明於規約始生效力之事項，非本題答案。", "B": "違反義務之處理方式，屬法定須載明於規約始生效力之事項，非本題答案。", "C": "正確答案。「禁止從事宗教活動之特別約定」非法定明文列舉須載明於規約始生效力之特定事項類型（法定列舉之核心事項聚焦於飼養動物限制、違反義務處理方式、財務運作監督等具體管理事項，宗教活動限制非此類列舉範圍內，此涉及較特殊之個人信仰自由限制問題，性質與其他列舉事項不同），此為虛構列舉事項之陷阱。", "D": "財務運作之監督規定，屬法定須載明於規約始生效力之事項，非本題答案。"}, "ref": "公寓大廈管理條例第23條", "id": 34}, {"chapter": "E4", "year": 111, "qnum": 20, "stem": "規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列敘述何者非屬之？", "options": ["違反義務之處理方式", "禁止住戶飼養動物之特別約定", "財務運作之監督規定", "他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"], "answer": "D", "explains": {"A": "違反義務之處理方式，屬法定須載明於規約始生效力之事項，非本題答案。", "B": "禁止住戶飼養動物之特別約定，屬法定須載明於規約始生效力之事項，非本題答案。", "C": "財務運作之監督規定，屬法定須載明於規約始生效力之事項，非本題答案。", "D": "正確答案。「他住戶因維護修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕」係「法條本身之強制規定」（第6條），本即當然適用，「無須」另行載明於規約始生效力（此與規約自治事項須經載明始生效之性質不同，本規定屬法定強制事項，非規約自治空間），此為法定強制規定與規約自治事項混淆之★陷阱。"}, "ref": "公寓大廈管理條例第6條、第23條", "id": 35}, {"chapter": "E4", "year": 113, "qnum": 23, "stem": "大樓規約約定 1 樓露台屬於 1 樓甲使用，嗣後 3 樓所有權人乙將其房地產權出售並過戶給丙，請問該規約對丙繼受人有無效力？", "options": ["依公寓大廈管理條例第24條規定，區分所有權之繼受人丙，應於繼受後遵守原區分所有權人依規約所定之一切權利義務事項", "丙未在規約簽章，對其不生效力", "丙不知有該規約約定，對其不生效力", "該規約僅能拘束原區分所有權人乙"], "answer": "A", "explains": {"A": "正確。依公寓大廈管理條例規定，區分所有權之繼受人（丙），應於繼受後遵守原區分所有權人（乙）依規約所定之一切權利義務事項，此規約對丙仍具拘束力，此為規約對繼受人拘束力之核心規定（保障規約整體秩序之延續性）。", "B": "繼受人不因「未在規約簽章」而免除遵守規約之義務，此為虛構免責事由之陷阱。", "C": "繼受人應於「繼受前」主動查閱規約（法定義務），不得以「不知情」為由主張規約對其不生效力，此為虛構免責事由之陷阱。", "D": "規約對「繼受人」亦具拘束力（非僅拘束原區分所有權人），本選項範圍限縮錯誤。"}, "ref": "公寓大廈管理條例第24條", "id": 36}, {"chapter": "E5", "year": 100, "qnum": 8, "stem": "區分所有權人未依區分所有權人會議決議繳納公共基金時，主管機關依公寓大廈管理條例最高可處新臺幣多少元之罰鍰？", "options": ["五萬元", "十萬元", "二十萬元", "三十萬元"], "answer": "C", "explains": {"A": "數字錯誤，非五萬元。", "B": "數字錯誤，非十萬元。", "C": "正確。未依決議繳納公共基金者，主管機關最高可處新臺幣「20萬元」罰鍰（完整級距為4萬元以上20萬元以下），此為公寓大廈管理條例罰則之核心高頻數字。", "D": "數字錯誤，非三十萬元（此為易與經紀業管理條例罰鍰級距混淆之陷阱，須區辨兩法規罰鍰級距不同）。"}, "ref": "公寓大廈管理條例第49條", "id": 37}, {"chapter": "E5", "year": 101, "qnum": 16, "stem": "區分所有權人未依區分所有權人會議之決議繳納公共基金者，下述有關罰則之規定，何者為最正確？", "options": ["處新臺幣二萬元以上五萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰", "處新臺幣三萬元以上十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰", "處新臺幣四萬元以上十五萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰", "處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰"], "answer": "D", "explains": {"A": "金額級距不符法定規定。", "B": "金額級距不符法定規定。", "C": "上限金額不符，應為20萬元而非15萬元。", "D": "正確。未依決議繳納公共基金者，處新臺幣「4萬元以上20萬元以下」罰鍰，並得令限期改善或履行義務，屆期不改善或不履行者得連續處罰，此為公寓大廈管理條例罰則之標準級距（4萬至20萬元），須牢記此完整組合。"}, "ref": "公寓大廈管理條例第49條", "id": 38}, {"chapter": "E5", "year": 102, "qnum": 20, "stem": "區分所有權人對專有部分之利用，不得有妨害建築物之正常使用及違反區分所有權人共同利益之行為。違反者，得處以新臺幣多少元之罰鍰？", "options": ["一千元以上五千元以下", "三千元以上一萬五千元以下", "三萬元以上十五萬元以下", "四萬元以上二十萬元以下"], "answer": "D", "explains": {"A": "金額級距過低，不符本條例罰則規定。", "B": "金額級距過低，不符本條例罰則規定。", "C": "此級距非公寓大廈管理條例罰則之標準級距（易與經紀業管理條例罰鍰混淆）。", "D": "正確。違反專有部分利用限制（妨害建築物正常使用及違反共同利益之行為），處新臺幣「4萬元以上20萬元以下」罰鍰，此為公寓大廈管理條例罰則之標準核心級距，反覆重複命題。"}, "ref": "公寓大廈管理條例第49條", "id": 39}, {"chapter": "E5", "year": 105, "qnum": 38, "stem": "關於公寓大廈公共基金的敘述，下列何者正確？", "options": ["公共基金其來源之一為起造人就公寓大廈領得使用執照2年內之管理維護事項，應按工程造價一定比例或金額提列", "區分所有權人對於公共基金之權利不應隨區分所有權之移轉而移轉；得因個人事由為讓與、扣押、抵銷或設定負擔", "區分所有權人積欠應繳納之公共基金已逾六期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息", "區分所有權人未繳納公共基金時，主管機關依公寓大廈管理條例處新臺幣4萬元以上20萬元以下罰鍰，並得令其限期改善或履行義務"], "answer": "D", "explains": {"A": "應為領得使用執照「1年內」（而非2年內）之管理維護事項，數字錯誤。", "B": "公共基金權利「應」隨區分所有權之移轉而移轉（而非「不應」隨之移轉），且「不得」因個人事由讓與扣押抵銷設定負擔（而非「得」），兩處方向皆相反，屬★陷阱。", "C": "應為「逾二期」（而非「逾六期」）或達相當金額，經催告仍不給付者，管理負責人或管委會得訴請法院命其給付，數字錯誤。", "D": "正確。未繳納公共基金者，主管機關處新臺幣4萬元以上20萬元以下罰鍰，並得令限期改善或履行義務，此為公寓大廈管理條例罰則之標準級距，敘述正確。"}, "ref": "公寓大廈管理條例第18條、第21條、第49條", "id": 40}, {"chapter": "E5", "year": 106, "qnum": 34, "stem": "在規約未特別約定之情形下，一層一戶之住戶在樓梯間與走廊置放鞋櫃，並將安全門上鎖防止他人出入該樓層。下列敘述，何者正確？", "options": ["住戶不得於樓梯間與共同走廊間堆置雜物。若有違反，管理委員會有權制止並移除鞋櫃與剪斷鎖頭", "主管機關得處該住戶新臺幣4萬元以上20萬元以下罰鍰，並限期改善", "管理委員會促請該住戶改善，若於3個月內仍未改善，管理委員會得依區分所有權人會議決議，強制其遷離", "若該住戶拒絕依照區分所有權人會議決議遷離並完成移轉登記手續者，管理委員會得聲請法院拍賣之"], "answer": "B", "explains": {"A": "管理委員會僅有「制止」及「報請主管機關處理」之權限，並「無」逕自「移除鞋櫃與剪斷鎖頭」之私力強制執行權限，此為超越管委會法定職權範圍之陷阱（私自破壞他人財物涉及另有法律責任問題）。", "B": "正確。住戶違反樓梯間走廊不得堆置雜物及安全門不得上鎖（涉及消防逃生安全）之強制規定，經制止不遵從者，得由主管機關處新臺幣「4萬元以上20萬元以下」罰鍰，並限期改善，此為安全通道違規使用之標準罰則。", "C": "本題情境（堆置雜物、安全門上鎖）屬「行政罰鍰」層次之違規行為，非達「積欠費用強制遷離」（該制度適用於積欠費用達應有部分總價一定比例之情形）之要件，情境及法律效果混淆。", "D": "聲請法院拍賣係適用於「積欠費用經強制遷離仍未履行」之極端情形，與本題「堆置雜物及安全門上鎖」之情境完全不符，情境混淆。"}, "ref": "公寓大廈管理條例第16條、第49條", "id": 41}, {"chapter": "E5", "year": 110, "qnum": 2, "stem": "住戶違反公寓大廈管理條例第 9 條第 2 項關於公寓大廈變更使用限制規定，以下敘述何者錯誤？", "options": ["直轄市、縣（市）主管機關得令住戶限期改善；屆期不改善者，得連續處罰之", "住戶經制止而不遵從者，由直轄市、縣（市）主管機關處4萬元以上20萬元以下罰鍰", "管理委員會應予制止，並得按其性質請求各該主管機關為必要之處置。如有損害並得請求損害賠償", "由管理委員會促請住戶改善，住戶於3個月內仍未改善者，由管理委員會決議訴請法院強制其遷離"], "answer": "D", "explains": {"A": "主管機關得令限期改善，屆期不改善者得連續處罰，敘述正確，非本題答案。", "B": "經制止不遵從者處4萬元以上20萬元以下罰鍰，敘述正確，非本題答案。", "C": "管理委員會應予制止，並得請求主管機關為必要處置，如有損害得請求損害賠償，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。此為違反第9條「變更使用限制」規定之情形，其法律效果係「限期改善、連續處罰、行政罰鍰」等途徑，並非（積欠費用強制遷離制度所特有之）「管理委員會決議訴請法院強制遷離」機制，本選項將兩種不同違規類型（使用限制違反 vs 積欠費用情節重大）之法律效果混為一談，此為情境與法律效果混淆之★陷阱。"}, "ref": "公寓大廈管理條例第9條、第49條", "id": 42}, {"chapter": "F2", "year": 108, "qnum": 25, "stem": "下列有關公寓大廈規約之敘述，何者正確？", "options": ["由管理委員會訂定", "內政部訂頒之「公寓大廈規約範本」具強制效力，公寓大廈訂定規約不得違反該範本之內容", "就住戶違反義務之處理方式，非經載明於規約，不生效力", "規約訂定後，應向主管機關報備，始生效力"], "answer": "C", "explains": {"A": "規約應由「區分所有權人會議」決議訂定，非由管理委員會訂定，主體錯誤。", "B": "內政部訂頒之規約「範本」僅供參考，不具強制效力，公寓大廈訂定規約「得」與範本內容不同（自治精神），本選項稱範本具強制效力，方向相反。", "C": "正確。住戶違反義務之處理方式，非經載明於規約者，不生效力，此為法定須載明始生效力之特定事項之一。", "D": "規約訂定後，「無須」向主管機關報備始生效力（規約經區分所有權人會議依法定程序決議後即生效力，非以報備為生效要件），本選項增加不必要之生效要件，屬★陷阱。"}, "ref": "公寓大廈管理條例第23條、第60條", "id": 43}, {"chapter": "H2", "year": 106, "qnum": 25, "stem": "輸入之商品或服務，須以何種方式為之？", "options": ["應附中文標示", "得附中文標示", "無須附中文標示", "應附中文及外文標示"], "answer": "A", "explains": {"A": "正確。輸入之商品或服務，「應附中文標示」及說明書，其內容不得較原產地之標示及說明書簡略，此為保障國內消費者知情權之強制規定。", "B": "「應」（強制）附中文標示，非「得」（任意）附中文標示，程度用語錯誤。", "C": "必須附中文標示，非無須附中文標示，方向相反。", "D": "法定僅要求「中文標示」（不要求同時附外文標示，惟原文外文標示得併存），本選項增加非必要之要求。"}, "ref": "消費者保護法第24條", "id": 44}, {"chapter": "H2", "year": 106, "qnum": 31, "stem": "依消費者保護法規定，關於特種交易之敘述何者正確？", "options": ["通訊交易係指企業經營者未與消費者在公共場所或其他場所等所定之契約", "訪問交易之消費者，除有合理例外情事者，得於收受商品後7日內，以退回商品或書面通知方式解除契約，無須說明理由", "通訊交易違反消費者解約權所為之約定，其約定無效", "企業經營者應於收到消費者退回商品通知之次日起7日內，返還消費者已支付之對價"], "answer": "C", "explains": {"A": "此描述接近「訪問交易」之定義（企業經營者未經邀約而在特定場所訂立契約），非「通訊交易」之定義（通訊交易係「消費者未能檢視商品」透過廣播電視電話網路等方式訂立契約），定義主體混淆。", "B": "本敘述描述雖大致符合猶豫期權利內容，惟本題官方標準答案為C，選項本身在「除有合理例外情事者」之表述與法條精確用語相比，非本題最佳答案。", "C": "正確。通訊交易違反消費者解約權（猶豫期）所為之特約，其約定「無效」，此為保護消費者猶豫期權利不受特約排除之強制規定。", "D": "企業經營者應於「取回商品、收到消費者退回商品或解除服務契約通知之日起『15日內』」（而非7日內）返還消費者已支付之對價，數字錯誤。"}, "ref": "消費者保護法第19條", "id": 45}, {"chapter": "H2", "year": 109, "qnum": 9, "stem": "根據消費者保護法，通訊交易或訪問交易之消費者，得於收受商品或接受服務後幾日內，以退回商品或書面通知方式解除契約？", "options": ["五日", "七日", "十日", "十五日"], "answer": "B", "explains": {"A": "數字錯誤，非五日。", "B": "正確。通訊交易或訪問交易之消費者，得於收受商品或接受服務後「7日內」，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價，此為猶豫期核心數字，全科高頻。", "C": "數字錯誤，非十日。", "D": "數字錯誤，非十五日（此為企業經營者返還對價之期限，非消費者解約猶豫期，兩者易混淆須區辨）。"}, "ref": "消費者保護法第19條", "id": 46}, {"chapter": "H2", "year": 112, "qnum": 20, "stem": "有關消費資訊之規範，依消費者保護法規定，下列何者錯誤？", "options": ["企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容", "企業經營者之商品或服務廣告內容，於契約成立後，應確實履行", "媒體經營者刊登或報導廣告之內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任", "輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略"], "answer": "C", "explains": {"A": "企業經營者應確保廣告內容真實，義務不得低於廣告內容，敘述正確，非本題答案。", "B": "廣告內容於契約成立後應確實履行，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。媒體經營者須於「明知或可得而知」廣告內容與事實不符，仍予刊登傳播者，始與企業經營者負連帶責任，本選項漏未「明知或可得而知」此一構成要件（僅稱「內容與事實不符者」即負連帶責任），擴大媒體經營者責任範圍，與法定「須具備主觀可歸責要件」之規定不符，此為要件缺漏之★陷阱。", "D": "輸入商品或服務應附中文標示及說明書，內容不得較原產地簡略，敘述正確，非本題答案。"}, "ref": "消費者保護法第22條、第23條、第24條", "id": 47}, {"chapter": "H2", "year": 114, "qnum": 6, "stem": "訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？", "options": ["消費者行使解除權，唯有直接退回商品給企業經營者之方式", "經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約", "消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款", "消費者行使解除權的7天猶豫期，可以以特約排除猶豫期間"], "answer": "C", "explains": {"A": "消費者得以「退回商品」「或」「書面通知」（兩種方式擇一）解除契約，並非「唯有」退回商品一種方式，此為方式限縮之陷阱。", "B": "解除契約應以「書面」方式為之（非口頭通知），縱經企業經營者同意亦不因此變更法定要式性之要求，此為虛構例外之陷阱。", "C": "正確。消費者解除買賣契約，無須說明理由，且無庸負擔任何費用或對價（此為保障消費者猶豫期權利之核心規定，猶豫期非附條件之權利）。", "D": "7日猶豫期為強制性保護規定，「不得」以特約排除或限制（此屬強制規定不容契約自由排除之範疇），本選項方向相反。"}, "ref": "消費者保護法第19條", "id": 48}, {"chapter": "H2", "year": 114, "qnum": 25, "stem": "依消費者保護法之規定，下列敘述何者正確？", "options": ["定型化契約條款：指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約", "邀約交易：指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約", "分期付款：指買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態", "通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於檢視商品或服務之後，而與企業經營者所訂立之契約"], "answer": "C", "explains": {"A": "本描述應為「定型化契約」（整份契約）之定義，非「定型化契約條款」（契約中之特定條款）之定義，兩者定義層次不同（條款指個別預先擬定之條文，契約指整體訂立之契約文件），此為定義主體層次混淆之陷阱。", "B": "法定正式用語為「訪問交易」，非「邀約交易」（本法並無「邀約交易」此一正式名詞），用詞錯誤。", "C": "正確。分期付款之法定定義：買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態，定義完整正確。", "D": "通訊交易之核心要件應為消費者「未能」（而非「於檢視商品或服務之後」）檢視商品而與企業經營者訂立之契約，本選項要件描述方向相反（通訊交易之特徵正是消費者無法事先檢視商品，此與訪問交易或一般實體交易不同），此為定義核心要件之★陷阱。"}, "ref": "消費者保護法第2條", "id": 49}];

  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
