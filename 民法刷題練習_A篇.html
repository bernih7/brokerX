<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 A篇 民法總則 官方歷屆題 99–114</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.ainote{font-size:10.5px;color:#A8A39B;font-style:normal;font-weight:400;padding:0 0 4px;line-height:1.5}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<header>
  <h1>📖 民法概要 A篇 民法總則｜99–114年 官方歷屆題｜刷題練習（107題）</h1>
  <span class="ts">📅 2026-10-05｜版本 v2.0（官方題重建）</span>

<script>
const QS=[{"year": 99, "num": 1, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "法人社員總會決議之內容違反法令或章程者，其決議之效力：", "opts": ["有效", "得撤銷", "無效", "效力未定"], "exp": ["✗A. 依§56Ⅱ，總會決議之「內容」違反法令或章程者，無效，不是有效；內容違法不會因為多數社員通過就變成有效。", "✗B. 「得撤銷」是§56Ⅰ的效果：總會「召集程序」或「決議方法」違反法令章程時，社員得於決議後三個月內請求法院撤銷（出席社員當場未異議者除外）。本題問「決議內容」違法，性質不同。", "✓C. 依民法§56Ⅱ，總會決議之「內容」違反法令或章程者，無效。這是考試最愛混淆的地方：程序違法→得撤銷；內容違法→無效。", "✗D. 效力未定是指須待第三人承認才確定的狀態（如§79限制行為能力人未得允許所訂契約須經法定代理人承認、§170無權代理須經本人承認）；總會決議內容違法，法條直接規定為無效（§56Ⅱ），沒有待承認的問題。"]}, {"year": 99, "num": 2, "ans": "B", "acc": "", "note": "現行§12：滿18歲為成年，17歲仍為限制行為能力人，結論不變。", "src": "ai", "stem": "現年十七歲的高中生甲，假造其父母的同意函，以 3 萬元向乙機車行購買中古機車一部，由於沒有駕照無法辦理過戶。試問：甲與乙間之機車買賣契約之效力如何？", "opts": ["效力未定", "有效", "無效", "得撤銷"], "exp": ["✗A. 限制行為能力人未得法定代理人允許所訂契約，一般是效力未定（§79：須經法定代理人承認始生效力）；但甲用詐術使人信其已得允許，適用§83特別規定，契約直接有效，不再是效力未定。", "✓B. 依民法§83，限制行為能力人「用詐術」使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效。甲假造同意函屬使用詐術，故買賣契約有效，法律不再保護利用詐術的限制行為能力人。", "✗C. 無效是§78（限制行為能力人未得允許所為「單獨行為」）、§75（無行為能力人意思表示）的效果；本題是契約，且適用§83，不是無效。", "✗D. §83已明文規定該法律行為「為有效」，是針對詐術的特別規定，直接排除效力未定；得撤銷（§92）是被詐欺、被脅迫之表意人的權利，並非本題§83所設的效果，故不選。"]}, {"year": 99, "num": 3, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲向乙影視事業公司租借 10 片電影 DVD 片，10 天共計租金為 1000 元，則乙對甲之請求權消滅時效期間為何？", "opts": ["15 年", "10 年", "5 年", "2 年"], "exp": ["✗A. §125 一般請求權15年，但租賃動產為營業者之租價有特別短期時效，不適用15年。", "✗B. 民法無10年之一般請求權時效，§125為15年、§126為5年、§127為2年。", "✗C. §126 之5年適用於租金等定期給付，但以租賃動產為營業者之租價已列入§127，不適用5年。", "✓D（本題答案）. §127③ 以租賃動產為營業者之租價，請求權2年間不行使而消滅；乙影視公司出租DVD即屬之。", "★ 先找特別短期時效再回到15年：§127 的2年是「營業者收的價金」（租價、診費、報酬、商品代價）。陷阱：看到「租金」就選5年；租「動產」且出租人是「營業者」才是2年。"]}, {"year": 99, "num": 4, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "以下關於代理制度之敘述，何者正確？", "opts": ["無權代理人所為之法律行為屬無效之法律行為", "甲為乙之代理人，乙在學校被其他同學霸凌，甲憤而到學校為乙出氣毆打霸凌之同學，則應由乙負賠償責任", "代理人於代理權限內以本人名義所為之法律行為對本人有效", "代理人在代理期間，因為無從辨識之故，只能為本人服務，禁止從事自己的法律行為"], "exp": ["✗A. 無權代理原則上是「效力未定」（§170），須經本人承認才生效，並非當然無效。", "✗B. 甲毆打他人是甲個人的侵權行為（事實行為），與「代理」（法律行為）無關，代理不及於事實行為，應由甲自己負責。", "✓C. 代理制度的核心：代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力（§103Ⅰ）。", "✗D. 代理人並非「只能」為本人服務，代理人仍可從事自己的法律行為，僅雙方代理/自己代理受到限制（§106）。"]}, {"year": 99, "num": 5, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有一年約 70 歲之老翁甲，因已有初期失智之現象，其子乙乃向法院聲請對其為輔助宣告，並以乙為其輔助人。則下列敘述何者錯誤？", "opts": ["甲在路上行走時，被超速行駛的機車駕駛丙撞傷，甲如欲與丙和解，應得乙之同意", "甲擅自移轉其所有房屋一棟之所有權給女兒丁，其法律效果為效力未定", "甲平常喜歡與老友上餐館小酌一番，受輔助宣告之後仍然可以自由為之", "甲為無行為能力人"], "exp": ["✓A. 此敘述正確，故非答案。§15-2Ⅰ第4款：受輔助宣告之人為和解，應經輔助人同意（甲與丙和解屬之）。", "✓B. 此敘述正確，故非答案。§15-2Ⅰ第5款：不動產之處分須經輔助人同意；未經同意，依§15-2Ⅱ準用§78～§83，契約效力未定（§79：須經承認始生效力）。", "✓C. 此敘述正確，故非答案。§15-2Ⅰ但書：「依其年齡及身分、日常生活所必需者」不在須經輔助人同意之列，餐館小酌屬日常生活行為，可自行為之。", "✗D. 本題問「錯誤」者。受輔助宣告之人仍有行為能力，只是就§15-2Ⅰ列舉的重要行為須經輔助人同意；無行為能力人是未滿7歲之未成年人（§13Ⅰ）或受監護宣告之人（§15）。「甲為無行為能力人」錯誤，故為本題答案。"]}, {"year": 99, "num": 7, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "意定代理權之授與，其法律性質為何？", "opts": ["雙方行為", "共同行為", "無相對人之單獨行為", "有相對人之單獨行為"], "exp": ["✗A. 代理權授與是本人單方的行為，無須代理人承諾即生效，非雙方行為（契約）。", "✗B. 共同行為指多數當事人朝同一目的所為之意思表示（如社團設立行為），與代理權授與不同。", "✗C. 代理權授與須向代理人或向代理行為之相對人為之，屬「有相對人」之單獨行為，並非無相對人。", "✓D. 通說認為代理權授與係本人單方之意思表示，向代理人或相對人為之即生效力，屬有相對人之單獨行為（§167）。"]}, {"year": 99, "num": 8, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列何者，非屬事實行為？", "opts": ["無主物的先占", "對要約的拒絕", "無因管理", "埋藏物的發現"], "exp": ["✗A. 先占（§802：以所有之意思占有無主動產者，取得所有權）重在「占有」此一事實，效果由法律直接賦予，不須表達法律效果的意思表示，屬事實行為。", "✓B. 本題問「非」事實行為者。拒絕要約是向要約人表示不願訂約之意思，其效果（§155：要約經拒絕者，失其拘束力）係依表意人所表示之意思而生，屬以「表示」為核心的行為，不是單憑事實發生而依法生效的事實行為，故為答案。", "✗C. 無因管理（§172：未受委任並無義務而為他人管理事務）是管理事務的事實行為，不以意思表示為要件，效果依法律規定發生，屬事實行為。", "✗D. 埋藏物之發見（§808：發見埋藏物而占有者取得所有權；在他人物中發見者，與該物所有人各取一半）重在發見並占有的事實，屬事實行為。"]}, {"year": 99, "num": 10, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "14 歲之甲未得父母之允許，對同學為債務免除之意思表示，其效力如何？", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A. 免除債務屬單獨行為，並非純獲法律上利益，未得允許不能當然有效。", "✓B. 依§78，限制行為能力人未得法定代理人之允許，所為之「單獨行為」無效（相對於契約行為是效力未定，單獨行為則直接無效，兩者是常考的對比考點）。", "✗C. 得撤銷用於意思表示瑕疵情形，與本題行為能力欠缺無關。", "✗D. 效力未定是「契約」未得允許時的效果（§79），本題是單獨行為（債務免除），法條明文規定為無效而非效力未定。"]}, {"year": 99, "num": 12, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲為房屋仲介公司之員工，經甲之斡旋乙同意將其所有房屋出售於丙，乙丙雙方皆委任甲處理登記及付款事宜並授與代理權，事成之後乙丙應支付甲相當之報酬。以下敘述何者錯誤？", "opts": ["此時雖屬所謂雙方代理，但因已經本人許諾，故可有效", "甲有要事需出國，乃將辦理登記事宜委託同事丁代為處理，因丁之疏失致丙受損害，由於甲並無過失可以無庸負責", "由於委任之事項中包含不動產登記事宜，就此部分包含代理權之授與應做成書面契約", "甲處理相關事務時，應以善良管理人之注意程度，謹慎為之"], "exp": ["✓A. 此敘述正確，故非答案。雙方代理原則禁止，但經本人許諾者不在此限（§106：代理人非經本人許諾，不得既為本人又為第三人之代理人而為本人與第三人之法律行為）；乙丙皆授與代理權並許諾，可有效。", "✗B. 本題問「錯誤」者。甲將事務轉託丁，屬複委任：§537規定受任人應自己處理委任事務，須經委任人同意、有習慣或不得已事由才可使第三人代為處理；違反者，依§538Ⅰ就丁之行為與就自己之行為負同一責任；縱依規定轉託，依§538Ⅱ仍須就丁之選任及指示負責。甲不能以「自己無過失」當然免責，故本選項錯誤。", "✓C. 此敘述正確，故非答案。§531：委任處理之法律行為依法應以文字為之者，其處理權及代理權之授與亦應以文字為之；不動產物權變動之行為依§758Ⅱ應以書面為之，故登記事宜之委任及代理權授與須書面。", "✓D. 此敘述正確，故非答案。§535：受任人處理委任事務，原則上與處理自己事務為同一注意，但「受有報酬者」應以善良管理人之注意為之；本題乙丙事成後支付報酬，甲須盡善良管理人之注意。"]}, {"year": 99, "num": 36, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列何種行為，為違反公序良俗？", "opts": ["繼承人拋棄繼承", "夫妻約定家庭生活費用由妻負擔", "父親死亡前，兄弟姊妹預先訂約剝奪母親之應繼分", "出租人與承租人約定，承租人應負責修繕租賃標的物"], "exp": ["✗A. §1174 繼承人得拋棄繼承權，是法律明定之權利，不違反公序良俗。", "✗B. §1003-1 家庭生活費用除法律或契約另有約定外由夫妻分擔，約定由妻負擔屬契約自由範圍。", "✓C（本題答案）. 兄弟姊妹預訂契約剝奪母親應繼分，是對尚未發生之他人繼承權預先處分，有違§72及§1138以下之法定繼承秩序，無效。", "✗D. §429 租賃物修繕除契約另有訂定外由出租人負擔，故可約定由承租人負責修繕，屬有效特約。", "★ 公序良俗（§72）常考「侵害他人身分或繼承利益」「賭博、妨害婚姻自由」等類型。陷阱：選項中「約定改由承租人修繕」看似不公平，但§429本身就允許另有約定。"]}, {"year": 100, "num": 8, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲向乙承諾當民國 100 年 12 月 31 日那天，要將天上的某一顆星星送給乙，乙並允諾之。則甲乙間之約定效力如何？", "opts": ["因自始客觀不能，故約定無效", "因雙方意思表示合致，故約定有效", "因嗣後客觀不能，故約定有效", "因嗣後主觀不能，故約定有效"], "exp": ["✓A. 星星無法交付，屬契約成立時「自始」即客觀不能（任何人皆不能實現）。依§246，以不能之給付為契約標的者，契約無效（例外：不能情形可除去且當事人預期除去後給付者仍有效）；知情一方並須依§247對善意信賴契約有效之他方負賠償責任。", "✗B. 意思表示合致只是契約成立要件之一；標的自始客觀不能，仍依§246使契約無效，不因合意而有效。", "✗C. 「嗣後不能」是契約成立後才發生的給付不能，契約本身有效，僅依§225（不可歸責於債務人，免給付義務）或§226（可歸責，負賠償責任）處理；本題自始即不能，非嗣後不能。", "✗D. 「主觀不能」是債務人個人不能給付而他人可以給付；星星任何人都無法給付，屬客觀不能。主觀不能不適用§246使契約無效，債務人不履行時另依§226等債務不履行規定處理。"]}, {"year": 100, "num": 14, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列何者為附解除條件之法律行為？", "opts": ["甲如能考 100 分，乙就給甲 100 元", "甲向乙借 1 萬元，約定乙每月支付利息 100 元", "當甲大學畢業時，乙的房屋就不再出租給甲", "甲乙間約定於民國 105 年時，二人即結婚"], "exp": ["✗A. 「考100分」是使法律行為「開始生效」的條件，屬停止條件（§99Ⅰ）。", "✗B. 此為單純的借貸利息約定，並非附條件行為，屬確定期限或無條件之給付約定。", "✓C. 「大學畢業」這個不確定事實發生時，使已生效的租賃契約「失其效力」，屬解除條件（§99Ⅱ）。", "✗D. 「民國105年」是確定會到來的期日，屬「期限」（始期）而非「條件」（條件是不確定是否發生之事實），此為期限與條件的重要區辨。"]}, {"year": 100, "num": 15, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於死亡宣告，下列敘述何者錯誤？", "opts": ["得聲請死亡宣告者，僅限於失蹤人之利害關係人", "死亡宣告係私法上的制度，不生公法上的效果", "死亡宣告在於結束失蹤人原住居所為中心之法律關係，而不在剝奪失蹤人之權利能力", "死亡宣告為推定死亡，故允許提出反證而撤銷死亡宣告"], "exp": ["✗A. 本題問「錯誤」者。§8：失蹤滿七年後，法院得因「利害關係人或檢察官」聲請為死亡宣告，並非僅限利害關係人，故本選項錯誤，為本題答案（常考陷阱：檢察官亦得聲請）。", "✓B. 此敘述正確，故非答案。死亡宣告僅發生私法上（如繼承開始、婚姻關係消滅）之效果，不影響公法上權利義務。", "✓C. 此敘述正確，故非答案。死亡宣告制度目的在了結以失蹤人住居所為中心之法律關係，並非使其喪失權利能力。", "✓D. 此敘述正確，故非答案。死亡宣告採「推定」死亡（§9：以判決內確定死亡之時推定其死亡，但有反證者不在此限），得提出反證，經法院撤銷死亡宣告。"]}, {"year": 100, "num": 16, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "關於財團法人之敘述，下列何者正確？", "opts": ["其權利能力始於訂立捐助章程，終於清算解散", "財團為公益法人，其設立須經地方法院許可", "董事有數人者，除章程另有規定外，各董事均得代表法人", "財團法人並非自然人，無侵權行為能力"], "exp": ["✗A. 法人權利能力始於「登記完成」（成立），而非訂立捐助章程；清算完結才終止，並非清算「解散」時。", "✗B. 財團法人之設立許可，應向「目的事業主管機關」申請，並非地方法院；地方法院僅辦理「登記」。", "✓C. 依§27Ⅱ，董事就法人一切事務對外代表法人，董事有數人者，除章程另有規定外，各董事均得單獨代表法人，正確。", "✗D. 法人對於董事等有代表權人因執行職務所加於他人之損害，與行為人連帶負賠償責任（§28），法人具有侵權行為能力（法人實在說）。"]}, {"year": 100, "num": 17, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "關於法人依其性質，不得享有下列何種權利？", "opts": ["姓名權", "自由權", "專利權", "名譽權"], "exp": ["✗A. 姓名權（法人為名稱權）性質上法人得享有。", "✓B. 自由權（如人身自由）以自然人之肉體存在為前提，性質上專屬自然人，法人不得享有，此即§26但書「專屬於自然人之權利義務」之典型例。", "✗C. 專利權為財產權之一種，法人得為專利權人。", "✗D. 名譽權法人得享有（例如公司商譽受侵害得請求救濟）。"]}, {"year": 100, "num": 19, "ans": "", "acc": "B", "note": "本題依考選部公告多重給分：答 B 者均給分", "src": "ai", "stem": "甲僱傭 17 歲未婚之乙為店員，並授與代理權以甲之名義販售物品，若甲之法定代理人均不同意。則：", "opts": ["僱傭契約無效，代理權授與有效", "僱傭契約無效，代理權授與亦無效", "僱傭契約有效，代理權授與無效", "僱傭契約有效，代理權授與亦有效"], "exp": ["✓A. 僱傭契約為限制行為能力人所訂，需法定代理人允許（§77），法定代理人均不同意而拒絕承認則確定無效（§79）；授權行為係本人甲（完全行為能力）所為，有效。", "✗B. 授權行為是由本人甲為之，甲有完全行為能力，其授權有效；§104 代理人不須有行為能力，乙之能力不影響授權效力。", "✗C. 僱傭契約因法定代理人拒絕而無效，並非有效；且授權亦非無效，兩者皆與事實相反。", "✗D. 僱傭契約欠缺法定代理人允許，不能有效（§77、§79），故「契約有效」不成立。", "★ 分清兩個法律行為：僱傭契約的當事人是乙（限制行為能力人，要看乙的法定代理人）；代理權授與的表意人是甲（成年人，有效）。§104 重點：代理人行為能力不影響代理，因為效果歸本人。本題考選部公告多重給分，原因在於契約為「效力未定」或「無效」之描述有爭議。"]}, {"year": 100, "num": 20, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "甲男於民國 90 年 3 月 1 日離開住所，從此失蹤，其妻乙依法聲請死亡宣告，經法院判決宣告死亡。若甲實際上並未死亡，請問下列敘述，何者正確？", "opts": ["推定甲於民國 90 年 3 月 1 日死亡", "受死亡宣告後，甲所為之法律行為均無效", "若甲安然生還，該死亡宣告即自動失去效力", "乙繼承甲之財產，善意處分之部分不受甲生還影響"], "exp": ["✗A. 死亡宣告推定死亡之時點為判決內確定之死亡時，通常為失蹤期間屆滿之時，並非離開住所（失蹤）之當日。", "✗B. 死亡宣告僅發生私法上死亡之擬制效果，甲本人如仍生存，其在外地所為之法律行為仍屬有效，並非當然無效。", "✗C. 死亡宣告須經法院「撤銷」死亡宣告之判決，並非甲生還即自動失效，仍須踐行法定程序。", "✓D. 為保護交易安全，繼承人（乙）於死亡宣告經撤銷前，善意信賴宣告而處分遺產之行為，不因甲事後生還而受影響（民法相關規定及家事事件法意旨），正確。"]}, {"year": 100, "num": 21, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列何者，屬於民法上之物？", "opts": ["活人胸腔中跳動之心臟", "博物館中展示之木乃伊", "天上飄浮的雲層", "植入身體的人造關節"], "exp": ["✗A. 活人身體之一部分為人格之一部，與身體不可分離時不是民法上的物（人格權客體）。", "✓B（本題答案）. 已死亡之人體（木乃伊）已非人格主體，通說認為屬物，得為所有權客體。", "✗C. 雲層不能為人所支配、無法特定與獨立，不具物之性質。", "✗D. 人造關節植入體內即與身體結合成為身體之一部，通說不再視為獨立之物。", "★ 物的三要件：有體、人力可支配、獨立。與身體結合的物（心臟、植入關節）屬人格範圍；與身體分離（如割下之頭髮）或死後人體才是物。陷阱：把「已植入身體之物」當成物。"]}, {"year": 101, "num": 1, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列有關法人之敘述，何者錯誤？", "opts": ["社團法人應設章程", "以遺囑捐助設立財團法人者，不以訂立捐助章程為必要", "應設董事", "應設監察人"], "exp": ["✓A. 此敘述正確，故非答案。§47：設立社團者，應訂定章程並記載目的、名稱、董事、總會等事項。", "✓B. 此敘述正確，故非答案。§60Ⅰ：設立財團應訂立捐助章程，但以遺囑捐助者不在此限；§60Ⅲ：以遺囑捐助而無遺囑執行人時，法院得依主管機關、檢察官或利害關係人之聲請指定遺囑執行人。", "✓C. 此敘述正確，故非答案。§27Ⅰ：法人應設董事，董事對外代表法人並執行事務。", "✗D. 本題問「錯誤」者。§27Ⅳ：法人「得」設監察人，監察法人事務之執行，為任意機關而非必設機關，「應設監察人」錯誤，為本題答案。"]}, {"year": 101, "num": 2, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲於 98 年 6 月 1 日受乙脅迫，約定將甲所有之動產以遠低於市價之價格出售予乙。事經 2 年餘後，乙請求甲依約交付該動產。下列敘述何者正確？", "opts": ["甲得於撤銷原先受脅迫所為之意思表示後，拒絕給付", "甲得撤銷受脅迫意思表示之權利行使期間已過，應為給付", "即使甲未撤銷受脅迫所為之意思表示，仍得拒絕給付", "甲得主張與乙所締結之契約自始無效，拒絕給付"], "exp": ["✗A. §93 撤銷權須自脅迫終止後1年內行使，2年餘後撤銷權已消滅，無法再撤銷。", "✗B. 雖撤銷權期間已過，但被害人仍可依§198 拒絕履行，非「應為給付」。", "✓C（本題答案）. 乙之脅迫構成侵權行為，因侵權行為取得之債權，被害人之廢止請求權縱因時效消滅，仍得拒絕履行（§198）。", "✗D. §92 受脅迫所為意思表示為「得撤銷」，並非自始無效。", "★ 脅迫→得撤銷（§92），撤銷權1年（§93）；但脅迫同時是侵權行為，§198 給被害人永久抗辯權。陷阱：誤以為時效或除斥期間一過就只能履行。"]}, {"year": 101, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲發生車禍傷及腦部，成為植物人，下列敘述何者最正確？", "opts": ["甲成為植物人喪失權利能力", "甲雖成為植物人，但關於個人利益之享受仍具有部分權利能力", "植物人為無行為能力人，並且不具有權利能力", "甲雖成為植物人，仍具有權利能力"], "exp": ["✗A. 權利能力始於出生、終於死亡（§6）；植物人仍生存，權利能力不因此喪失。", "✗B. 植物人仍生存，依§6享有完整權利能力，並非僅就「個人利益之享受」有部分權利能力。「關於個人利益之保護視為既已出生」是§7對「胎兒」的特別規定，不能套用於植物人。", "✗C. 權利能力與行為能力是不同概念：植物人縱受監護宣告而無行為能力（§15），其權利能力仍然存在，不可混淆。", "✓D. 權利能力始於出生終於死亡（§6），植物人生命現象仍存在，具有完整權利能力；其意思能力欠缺，可能影響的是行為能力（得經法院為監護宣告），而非權利能力。"]}, {"year": 101, "num": 24, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲為幫助清寒家庭學生求學，捐助三千萬元成立 A 教育基金會，經主管機關許可後，登記為法人，下列敘述何者最正確？", "opts": ["甲之捐助行為為事實行為", "A 教育基金會應設董事", "A 教育基金會為公益社團法人", "A 教育基金會應設總會，作為基金會之最高意思機關"], "exp": ["✗A. 捐助行為係以財產捐贈成立法人之意思表示，屬法律行為（單獨行為），並非事實行為。", "✓B. 財團法人應設董事，執行財團事務並代表法人對外行使職權（§27Ⅰ準用於財團），正確。", "✗C. 以捐助財產設立、無社員組織者為「財團法人」，非社團法人，本題捐助3000萬元設立基金會，屬財團法人。", "✗D. 財團法人無社員組織，故無「總會」，總會是社團法人特有的最高意思機關，財團法人無此機關設計。"]}, {"year": 101, "num": 26, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲十八歲，已婚，下列敘述何者最正確？", "opts": ["甲已成年", "甲得獨立為有效之單獨行為", "甲授與代理權給乙，其授權行為效力未定", "甲如欲與其配偶兩願離婚，得自行為之，無須得法定代理人之同意"], "exp": ["✗A. 考試當年成年為20歲（舊§12），18歲仍屬未成年；已婚只是擬制有行為能力（舊§13Ⅲ）。", "✓B（本題答案）. 未成年人已結婚者有行為能力（舊§13Ⅲ），故得獨立為有效之單獨行為。", "✗C. 已婚未成年人既有行為能力，授權行為無須法定代理人承認，不屬效力未定。", "✗D. 當年§1049但書規定未成年人兩願離婚應得法定代理人同意，故「無須同意」錯誤。", "★現行法差異：112.1.1起成年為18歲（§12）、最低結婚年齡亦為18歲，已婚未成年之§13Ⅲ已刪；現行法下甲已成年，A敘述為真，D離婚亦無須法定代理人同意，本題情境不復存在。", "★ 舊法下「結婚＝有行為能力」只管財產上行為，身分行為（離婚）另有法定代理人同意規定。現行法已無此情境，見法律變更欄。"]}, {"year": 101, "num": 31, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲為乙之代理人，下列敘述何者最正確？", "opts": ["若甲為意定代理人，其被相對人丙詐欺所為之代理行為，應由甲自行撤銷", "甲逾越代理權限所為之代理行為，得因乙之承認而確定生效", "若甲僅十六歲，甲所為之代理行為無效", "若甲為乙之法定代理人，得因乙之同意，為雙方代理行為"], "exp": ["✗A. 代理人意思表示有無瑕疵（意思欠缺、被詐欺、被脅迫），依§105原則就代理人決定；但法律效果歸屬本人，撤銷權原則上歸屬於本人乙，而非由代理人甲自行撤銷。", "✓B. 代理人逾越代理權限所為之行為屬無權代理，依§170非經本人承認，對本人不生效力（效力未定）；經本人乙承認，即確定生效。", "✗C. 代理人不以有行為能力為必要，§104：代理人所為意思表示之效力不因其為限制行為能力人而受影響，故16歲之甲所為代理行為並非無效。", "✗D. §106：雙方代理（既為本人又為第三人之代理人而為法律行為）須「經本人許諾」才可。甲若為乙之「法定代理人」，表示乙為無行為能力人或限制行為能力人（§76、§77），其許諾本身須由法定代理人（即甲）代為或同意，等於甲自己許諾自己，無從達到由本人判斷利益的目的，故不能認為因乙之同意即可為雙方代理。"]}, {"year": 101, "num": 34, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲與乙通謀虛偽買賣甲所有之 A 土地一筆，並將 A 地所有權移轉給乙，下列敘述何者最正確？", "opts": ["甲與乙所為之通謀虛偽意思表示效力未定", "甲與乙所為之通謀虛偽買賣有效，但所有權之移轉無效", "乙將 A 地出賣給丙，締結買賣契約，乙與丙之買賣構成無權處分", "乙將 A 地出賣給丙，締結買賣契約，乙與丙之買賣契約有效"], "exp": ["✗A. 通謀虛偽意思表示依§87Ⅰ本文為「無效」，不是效力未定。", "✗B. 甲乙間買賣（債權行為）與所有權移轉（物權行為）皆為通謀虛偽之意思表示，依§87Ⅰ本文均無效，並非買賣有效而僅移轉無效。", "✗C. 無權處分（§118Ⅰ：無權利人就權利標的物所為之處分，經有權利人承認始生效力）針對的是「處分行為」（移轉所有權）。乙丙簽訂的買賣契約是負擔行為（債權契約），不是處分，故不構成無權處分；乙事後移轉登記給丙才可能涉及無權處分問題。", "✓D. 乙丙間買賣是負擔行為，出賣人乙負有§348的移轉所有權義務，債權契約不以出賣人有處分權為成立有效要件，故買賣契約有效；至於所有權能否移轉予丙，另涉及§87Ⅰ但書（不得以通謀虛偽之無效對抗善意第三人）的保護。"]}, {"year": 102, "num": 9, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲因負債，為避免債權人強制執行，故與乙訂立虛偽買賣契約，將甲僅有之一棟房屋賣給乙，並將房屋所有權移轉登記於乙（均為通謀虛偽意思表示）。乙將該屋賣給善意之丙，並將房屋所有權移轉登記於善意之丙。下列敘述何者正確？", "opts": ["乙祇是登記名義人，並非真正所有權人，故丙無法取得房屋之所有權", "乙不祇是登記名義人，亦是真正所有權人，故丙可取得房屋之所有權", "丙因信賴不動產之登記，並已依法辦理所有權移轉登記，故取得房屋之所有權", "丙雖信賴不動產之登記，並已依法辦理所有權移轉登記，但仍然無法取得房屋之所有權"], "exp": ["✗A. 甲乙間通謀虛偽意思表示雖無效（乙非真正所有權人），但§87Ⅰ但書明文：不得以其無效對抗善意第三人，故不影響善意丙取得所有權的結果，本選項後段結論錯誤。", "✗B. 乙確實只是登記名義人而非真正所有權人（前半段正確），但後半段丙取得所有權的理由並非因乙是真正所有人，而是善意第三人保護原則，選項邏輯錯誤。", "✓C. 甲乙間買賣及移轉雖無效，但依§87Ⅰ但書，不得以其無效對抗善意第三人丙；丙信賴登記外觀並完成移轉登記，應受保護而取得房屋所有權，此為通謀虛偽意思表示「善意第三人保護」的核心考點。", "✗D. 結論相反，丙應可取得房屋所有權，此為善意保護原則的具體展現。"]}, {"year": 102, "num": 19, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲與女秘書乙發生婚外情，甲與乙約定以繼續維繫婚外情為前提，贈與乙 A 屋一棟，一年後乙不欲繼續維持不倫關係，A 屋該如何處理？", "opts": ["A 屋係以解除條件為前提的贈與契約，條件成就，贈與契約解除，A 屋須返還給甲", "甲與乙之間的贈與契約係以維繫婚外情為前提，贈與契約內容違反公序良俗無效，A 屋須返還給甲", "乙受贈 A 屋係屬不法原因而為給付者，甲事後不能請求返還 A 屋", "甲贈與乙 A 屋為無償行為，故贈與人甲可隨時撤銷該贈與契約，請求返還 A 屋"], "exp": ["✗A. 本題核心並非條件成就與否，而是贈與原因（維繫婚外情）本身違反公序良俗，一開始即無效（§72），不待條件成就使其「解除」。", "✗B. 前半段「違反公序良俗無效」正確（§72：法律行為背於公共秩序或善良風俗者無效）；但後半段「A屋須返還給甲」有誤：甲交付房屋係基於不法原因所為之給付，依§180第4款不得請求返還（但不法原因僅於受領人一方存在者除外），故結論錯誤。", "✓C. 契約因違反公序良俗而無效（§72），甲交付A屋係基於「維繫婚外情」此不法原因所為之給付，依§180第4款不法原因之給付不得請求返還，故甲事後不能請求返還A屋。這是本題最重要的陷阱：無效≠當然可以要回。", "✗D. 贈與為無償行為不代表可隨時撤銷：§408Ⅰ只在「贈與物之權利未移轉前」才得撤銷，本題討論返還A屋，即甲已給付，不得再依§408撤銷；且契約本身已因§72無效，返還與否應依§180第4款處理（不得請求返還）。"]}, {"year": 102, "num": 22, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲未將代理權授與給乙，乙卻以甲之代理人名義與善意之丙訂立買賣契約，甲不承認乙之無權代理行為。下列敘述何者正確？", "opts": ["乙與丙簽訂之買賣契約，效力雖不及於甲，但在乙丙之間有效", "乙與丙簽訂之買賣契約，對甲丙、乙丙均無效，丙得請求乙損害賠償", "乙與丙簽訂之買賣契約，對甲丙、乙丙均無效，丙得請求甲損害賠償", "乙與丙簽訂之買賣契約，對甲丙、乙丙均有效，但丙得撤銷買賣契約"], "exp": ["✗A. 甲拒絕承認後，無權代理行為對甲確定不生效力，且對「乙丙間」也不生效力（因契約是乙以甲之代理人名義訂立，並非乙以自己名義訂約，乙丙間不成立另一個有效契約）。", "✓B. 甲拒絕承認，契約對甲丙、乙丙均確定不生效力（無效）；依§110，無代理權人以他人之代理人名義所為之法律行為，對於善意之相對人（丙），須負損害賠償之責，故丙得向乙（無權代理人）請求損害賠償，正確。", "✗C. 丙得請求損害賠償的對象是無權代理人「乙」，而非本人「甲」，因為甲從未授權，不須負責。", "✗D. 甲既已拒絕承認，契約對甲不生效力，並非有效，選項前提錯誤。"]}, {"year": 102, "num": 24, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "A 公司的董事甲前往與客戶簽約時，不慎撞傷路人乙。下列敘述何者正確？", "opts": ["屬車禍事故，由董事甲自行負損害賠償責任", "由 A 公司負損害賠償責任，但是 A 公司對董事甲有求償權", "由 A 公司與董事甲連帶負損害賠償責任", "A 公司若已盡監督職務執行之責，可舉證免責"], "exp": ["✗A. 董事執行職務（前往簽約）所致損害，屬法人侵權，不得僅由董事個人負責。", "✗B. §28 規定法人與行為人連帶負責，並非單由公司負責；§28 未排除對董事之求償，但選項說法未呈現連帶。", "✓C（本題答案）. §28 法人對董事因執行職務加於他人之損害，與該行為人連帶負賠償責任。", "✗D. §188 的選任監督免責屬僱用人責任；§28 無舉證免責規定，公司不得以盡監督責任免責。", "★ 法人對「董事、有代表權之人」：§28 連帶責任，無免責；對「一般受僱人」：§188 可舉證免責。陷阱：把董事的行為套用§188。"]}, {"year": 102, "num": 25, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "某甲 25 歲，為受輔助宣告之人。下列敘述何者正確？", "opts": ["甲之輔助宣告可由其表哥向社會福利機構提出聲請", "甲受輔助宣告後，自行購買不動產的行為，無效", "甲之輔助人乙，不得受讓甲所有的 A 屋", "甲受輔助宣告後，自行將其所有的智慧型手機贈與好友丙的行為，有效"], "exp": ["✗A. 輔助宣告應向「法院」聲請（§15-1Ⅰ：法院得因本人、配偶、四親等內親屬、檢察官、主管機關或社會福利機構之聲請為輔助宣告）；社會福利機構是有權聲請之人，並非受理聲請的機關，向社會福利機構提出聲請不生聲請之效力。", "✗B. §15-2Ⅰ第5款：受輔助宣告之人處分不動產等重要財產應經輔助人同意；未經同意，依§15-2Ⅱ準用§78～§83，契約效力未定（§79）、單獨行為無效（§78），並非一律無效。", "✓C. §1113-1Ⅱ規定輔助人及有關輔助之職務準用§1102，§1102：監護人不得受讓受監護人之財產。故輔助人乙不得受讓甲所有的A屋，以避免利益衝突。", "✗D. §15-2Ⅰ第2款：受輔助宣告之人為贈與，應經輔助人同意（純獲法律上利益或依年齡身分、日常生活所必需者除外）；贈與手機予友人並非純獲利益，未經同意依§15-2Ⅱ準用§79，效力未定，不是當然有效。"]}, {"year": 102, "num": 38, "ans": "A", "acc": "", "note": "考試當年（102年）成年為20歲，19歲之甲為限制行為能力人；現行§12滿18歲為成年，今日19歲之甲已有完全行為能力，無須法定代理人允許。官方答案仍為A，僅適用舊法。", "src": "old", "stem": "19 歲之甲與 20 歲之乙訂立買賣契約，將一宗土地賣給乙，並將土地所有權移轉登記給乙。下列敘述何者正確？", "opts": ["買賣契約及所有權移轉契約，均需得甲之法定代理人書面或非書面之允許，始生效力", "買賣契約及所有權移轉契約，均需得甲之法定代理人書面允許，一定要書面允許始生效", "買賣契約需得甲之法定代理人書面允許，始生效力；所有權移轉契約則無須書面允許，亦生效力", "所有權移轉契約需得甲之法定代理人書面允許，始生效力；買賣契約則無須書面允許，亦生效力"], "exp": ["✓A. §77限制行為能力人為意思表示應得法定代理人之允許，法條並未要求允許必須以「書面」為之，口頭允許亦可，買賣契約（債權行為）與所有權移轉（物權行為）兩者均須得法定代理人允許（不限書面），始生效力，正確。", "✗B. 法定代理人之允許不以書面為限，本選項限定「一定要書面」錯誤。", "✗C. 物權行為（所有權移轉）同樣是限制行為能力人所為之法律行為，仍須得法定代理人允許，並非無須允許。", "✗D. 買賣契約同樣須得法定代理人允許，並非無須允許即生效力，選項邏輯相反。"]}, {"year": 103, "num": 1, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依法律之規定，有使用文字之必要者，下列敘述何者正確？", "opts": ["須本人自寫，並親自簽名或蓋章", "得不由本人自寫，但必須親自簽名或蓋章", "如以指印、十字或其他符號代簽名者，在文件上，經一人簽名證明，亦與簽名生同等之效力", "如以指印、十字或其他符號代簽名者，在文件上，經一人以指印、十字或其他符號代簽名者證明，亦與簽名生同等之效力"], "exp": ["✗A. §3Ⅰ 使用文字之必要者，得不由本人自寫，並非必須自寫。", "✓B（本題答案）. §3Ⅰ 得不由本人自寫，但必須親自簽名（§3Ⅱ 以蓋章代簽名亦同效力）。", "✗C. §3Ⅲ 以指印、十字或其他符號代簽名者，須經二人簽名證明，非一人。", "✗D. §3Ⅲ 證明者須「簽名」證明，不是以指印、十字等符號代簽。", "★ 口訣：不必自寫、要簽名；蓋章等於簽名；按指印要「兩人簽名證明」。陷阱：人數（一人 vs 二人）與證明方式。"]}, {"year": 103, "num": 2, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "關於形成權，下列敘述何者正確？", "opts": ["所謂形成權係指當事人得依據雙方自由意志，形成法律關係之權利", "形成權的行使，原則上不得附條件或期限", "形成權的行使期間，法律多設有消滅時效", "同意權、抗辯權與解除權均屬形成權"], "exp": ["✗A. 形成權是「單方」以意思表示使法律關係發生、變更或消滅的權利，並非雙方合意，如撤銷權、解除權皆為一方行使即生效力。", "✓B. 形成權行使如附停止條件，則不確定何時生效，影響相對人之法律地位，故原則上不得附條件或期限，正確。", "✗C. 形成權之行使期間通常設有「除斥期間」，而非消滅時效；兩者重要區別：消滅時效完成後，義務人得拒絕給付但債權不消滅；除斥期間經過，形成權本身即消滅，不得再行使。", "✗D. 同意權（如法定代理人承認契約）屬形成權；抗辯權（如同時履行抗辯）不屬形成權，而是拒絕相對人請求之防禦性權利；故並非三者皆屬形成權，敘述錯誤。"]}, {"year": 103, "num": 4, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於社團法人解散時，清算人的職務內容，下列何者正確？1了結現務 2收取債權 3清償債務 4變更章程", "opts": ["123", "124", "134", "234"], "exp": ["✓A（本題答案）. §40Ⅰ 清算人職務為了結現務、收取債權、清償債務、移交賸餘財產；123皆屬之。", "✗B. 4變更章程非清算人職務，清算人不得變更章程。", "✗C. 4變更章程不屬清算職務，且此選項漏列2收取債權。", "✗D. 此選項漏列1了結現務，且包含非職務之4變更章程。", "★ 清算＝收尾，不做新事業：了結現務、收債、還債、分剩餘財產。變更章程是「經營」性質，清算中不能做。"]}, {"year": 103, "num": 5, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列何者不具有民法上之權利能力？", "opts": ["植物人", "受破產宣告之法人", "合夥", "受監護宣告之自然人"], "exp": ["✗A. 植物人仍屬自然人，權利能力始於出生終於死亡（§6），仍具權利能力。", "✗B. 受破產宣告之法人仍具有法人資格與權利能力，僅其財產之管理、處分權轉由破產管理人行使，法人本身並未消滅。", "✓C. 合夥（民法第667條以下）非法人，不具有獨立之民事主體資格，亦無民法上之「權利能力」，其以「合夥人全體」名義為法律行為，並非合夥本身為主體。這是常考的陷阱：合夥≠法人，無權利能力。", "✗D. 受監護宣告之自然人仍具有完全之權利能力，僅行為能力受到限制（被擬制為無行為能力人），兩者務必分清。"]}, {"year": 103, "num": 6, "ans": "B", "acc": "", "note": "選項A文字與§23幾乎相同，但官方答案為B；此處依官方答案不改動，建議核對考選部原卷及更正答案。", "src": "ai", "stem": "關於住所，下列敘述何者正確？", "opts": ["限制行為能力人，因特定行為選定居所者，關於其行為，視為住所", "法人，以其主事務所之所在地為住所", "妻，以夫之住所為住所", "一人同時僅得有兩住所"], "exp": ["✗A. 官方答案認為本項錯誤。限制行為能力人以其法定代理人之住所為住所（§21）；§23雖規定「因特定行為選定居所者，關於其行為，視為住所」，但本選項將其連結於限制行為能力人，與官方答案不合，應以官方為準（建議對照考選部原卷）。", "✓B. 依§29，法人以其主事務所之所在地為住所，正確。", "✗C. 此為民法舊制。現行§1002：夫妻之住所由雙方共同協議之，未協議或協議不成時得聲請法院定之，並非妻當然以夫之住所為住所。", "✗D. §20Ⅱ明定「一人同時不得有兩住所」，故不是「僅得有兩住所」，更不是可有數個住所。"]}, {"year": 103, "num": 7, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於天然孳息，下列敘述何者正確？", "opts": ["稱天然孳息者，謂利息、租金及其他因法律關係所得之收益", "有收取天然孳息權利之人，按其權利存續期間內之日數，取得其孳息", "物之成分及其天然孳息，於分離後，除法律另有規定外，仍屬於其物之所有人", "抵押權之效力，及於抵押物扣押後抵押人就抵押物得收取之天然孳息。但抵押權人，非以扣押抵押物之事情，通知應清償天然孳息之義務人，不得與之對抗"], "exp": ["✗A. 此為「法定孳息」（§69Ⅱ：利息、租金及其他因法律關係所得之收益）；「天然孳息」是果實、動物之產物及其他依物之用法所收穫之出產物（§69Ⅰ）。", "✗B. 按日數取得孳息是「法定孳息」的規則（§70Ⅱ）；天然孳息是有收取權利之人，在其權利存續期間內，取得與原物分離之孳息（§70Ⅰ），並非按日數。", "✓C. 依§766，物之成分及其天然孳息，於分離後，除法律另有規定外，仍屬於其物之所有人，正確。", "✗D. 選項混用規定。現行§863：抵押權效力及於抵押物扣押後自抵押物分離而得由抵押人收取之天然孳息；「得與義務人對抗須通知」的但書屬§864對「法定孳息」的規定。選項把法定孳息的規則與天然孳息的措辭拼在一起，不正確。"]}, {"year": 103, "num": 8, "ans": "D", "acc": "", "note": "考試當年成年為20歲；現行§12滿18歲為成年，今日18歲之甲已有完全行為能力，其撤銷行為並非無效。官方答案仍為D，僅適用舊法。", "src": "ai", "stem": "18 歲之甲所為下列何種行為屬於無效？", "opts": ["買賣他人之物", "買賣違章建築", "被脅迫所締結之買賣契約", "撤銷有關買賣之錯誤意思表示"], "exp": ["✗A. 買賣他人之物，買賣契約（負擔行為）本身有效，出賣人負有取得並移轉標的物所有權之義務（§348）；處分行為才有效力未定問題（§118），故不是無效。", "✗B. 違章建築的買賣本身仍可成立有效的債權契約，並不屬於「無效」；且本題重點在18歲者的行為能力，而非標的物合法性。", "✗C. 被脅迫所為之意思表示，依§92表意人得撤銷，在撤銷前仍有效，不是當然無效。", "✓D. 依官方答案：撤銷錯誤的意思表示（§88）是形成權之行使，屬單獨行為；考試當年（103年）成年為20歲，18歲之甲為限制行為能力人，未得法定代理人允許所為單獨行為，依§78無效（契約才是效力未定，§79）。"]}, {"year": 103, "num": 10, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於附條件的法律行為，下列敘述何者正確？", "opts": ["附停止條件之法律行為，於條件成就時，失其效力", "附條件的法律行為，其條件成就之效果於條件成就之時發生，不得依當事人之特約變更", "因條件成就而受不利益之當事人，如以不正當行為促其條件之成就者，視為條件已成就", "附條件之法律行為當事人，於條件成否未定前，若有損害相對人因條件成就所應得利益之行為者，負賠償損害之責任"], "exp": ["✗A. 附停止條件之法律行為，於條件成就時「開始」發生效力，而非失其效力（失其效力是解除條件成就時的效果）。", "✗B. 依§99Ⅲ，條件成就之效果，當事人得依特約使其溯及效力發生，故非「不得」依特約變更，本選項錯誤。", "✗C. 選項把兩種情形混在一起：§101Ⅰ是「因條件成就而『受不利益』之當事人，以不正當行為『阻』其成就→視為條件已成就」；而「受利益之當事人以不正當行為『促』其成就」依§101Ⅱ是「視為條件不成就」。選項說「受不利益者促其成就→視為已成就」，與兩項規定皆不符，錯誤。", "✓D. 依§100，附條件法律行為之當事人，於條件成否未定前，若有損害相對人因條件成就所應得利益之行為，負損害賠償責任，此為條件成否未定期間當事人的保護規定，正確。"]}, {"year": 103, "num": 12, "ans": "", "acc": "AB", "note": "本題依考選部公告多重給分：答 A或B 者均給分", "src": "ai", "stem": "下列關於暴利行為之敘述，何者錯誤？", "opts": ["雖違反公序良俗，但有效", "利害關係人得行使撤銷權", "並非詐害債權行為", "應於法律行為後一年內提起救濟"], "exp": ["✗A. 暴利行為依§74 為得撤銷或減輕給付，而非因違反§72 而無效；「違反公序良俗但有效」之說法混淆兩者，本題考選部認定有爭議。", "✗B. §74Ⅰ 係「法院因利害關係人聲請撤銷或減輕給付」，須循法院，並非以意思表示逕行撤銷權；本題考選部認定有爭議。", "✓C. 暴利行為與§244 詐害債權行為要件不同，前者為顯失公平，後者為害及債權，故非詐害債權行為。", "✓D. §74Ⅱ 聲請應於法律行為後1年內為之。", "★ §74：急迫、輕率、無經驗＋顯失公平→法院撤銷或減輕給付，1年內。與§72（無效）、§92（意思表示瑕疵）、§244（債權人撤銷權）別混。本題AB均給分。"]}, {"year": 103, "num": 14, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "關於代理，下列敘述何者正確？", "opts": ["代理人非經本人之許諾，不得既為第三人之代理人，而為本人與第三人之法律行為。但其法律行為，係專履行債務者，不在此限", "代理權之限制及撤回，不得以之對抗善意第三人。至於該第三人有無過失而不知其事實者，則非所問", "代理人於代理權限內，以代理人名義所為之意思表示，直接對本人發生效力", "代理人所為或所受意思表示之效力，不因其為無行為能力人而受影響"], "exp": ["✓A. 依§106，代理人未經本人許諾，不得同時擔任雙方當事人之代理人（雙方代理禁止），但「專履行債務之行為」例外，因此類行為對本人無害，正確。", "✗B. 依§107，代理權之限制及撤回，雖不得以之對抗善意第三人，但若第三人知道或「應知道」（有過失而不知）者，仍得對抗，故「有無過失非所問」之描述錯誤。", "✗C. 代理效力的關鍵是以「本人名義」而非「代理人名義」；以代理人自己名義（即使在授權範圍內）不能對本人發生代理效力，此選項描述錯誤。", "✗D. 依§104，代理人所為或所受意思表示之效力「不因其為限制行為能力人而受影響」；若為「無行為能力人」則不得為有效之意思表示，無行為能力人所為之意思表示無效，故§104保護的是「限制行為能力人」代理人，非無行為能力人，本選項以「無行為能力人」替換，屬錯誤敘述。"]}, {"year": 103, "num": 26, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲忘記乙已清償債務，遂誤將對乙之新臺幣 20 萬元之債權，以新臺幣 15 萬元出賣與丙。下列敘述，何者正確？", "opts": ["甲、丙間之買賣契約無效", "甲須負權利瑕疵擔保責任", "丙得主張善意取得該債權", "丙得主張甲應負無權代理人責任"], "exp": ["✗A. 甲乙間之買賣係以「對乙之債權」為標的，甲誤認債權存在，但買賣契約本身在成立上無問題（甲有出售意思、丙有購買意思、合意買賣債權），並非無效。惟甲所出賣之債權實際上不存在（乙已清償），此時涉及權利瑕疵擔保。", "✓B. 甲出賣之債權實際上因乙清償而消滅，即甲出賣的是「不存在的權利」，依出賣人之權利瑕疵擔保責任（§349以下），甲須對丙負權利瑕疵擔保責任，正確。", "✗C. 善意取得（§801、§948）適用於動產物權，「債權」之讓與不適用善意取得原則（債權非動產），丙無法主張善意取得不存在之債權。", "✗D. 無權代理人責任（§110）發生於「無代理權而以代理人名義」為法律行為之情形，本題甲係以自己名義出賣自己（誤以為存在的）債權，並非代理人問題，此主張無所依據。"]}, {"year": 104, "num": 1, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲與乙通謀虛偽意思表示，將甲所有之 A 地賣予乙並移轉登記為乙所有。嗣後乙擅自將 A 地出賣丙，並完成移轉登記，惟丙不知甲、乙通謀虛偽意思表示之事。下列敘述，何者正確？", "opts": ["甲與乙間關於 A 地之買賣契約效力未定", "甲與乙間關於 A 地之買賣契約無效", "甲與乙間關於 A 地之買賣契約有效", "乙與丙間關於 A 地之買賣契約無效"], "exp": ["✗A. 通謀虛偽意思表示依§87Ⅰ為「無效」，並非效力未定。", "✓B. 甲乙通謀虛偽，依§87Ⅰ，其意思表示無效，買賣契約無效；但依但書，不得以此無效對抗善意第三人丙，丙仍得取得A地所有權，正確。", "✗C. 通謀虛偽之意思表示，甲乙間契約無效，並非有效。", "✗D. 乙與丙間之買賣契約（債權行為）本身成立並有效（兩造意思表示合致），且丙為善意，依§87Ⅰ但書受到保護，物權移轉亦對丙有效，故乙丙間買賣契約並非無效。"]}, {"year": 104, "num": 3, "ans": "", "acc": "AC", "note": "本題依考選部公告多重給分：答 A或C 者均給分", "src": "ai", "stem": "甲對乙表示，如不贈與家傳骨董，即告發其走私之事，乙被迫贈與之。該贈與契約之效力為：", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✓A. 受脅迫所為之意思表示於撤銷前仍屬有效，撤銷後始視為自始無效（§92、§114Ⅰ），故答「有效」亦有依據。", "✗B. 受脅迫之贈與並非當然無效，須經撤銷才失效。", "✓C. 被脅迫而為意思表示者，表意人得撤銷之（§92Ⅰ）。", "✗D. 效力未定適用於限制行為能力人、無權代理等情形，不適用於脅迫。", "★ 脅迫＝得撤銷：撤銷前有效、撤銷後溯及無效。考選部因選項描述角度不同，A或C均給分。"]}, {"year": 104, "num": 4, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列契約，何者不得聲請法院撤銷？", "opts": ["因急迫輕率無經驗而訂立週年利率高達 60%之高利貸契約", "乘他人急迫輕率無經驗而訂立之婚約", "債務人所訂立有害及債權之贈與契約", "因被詐欺或被脅迫而訂立之離婚協議"], "exp": ["✓A. §74 乘他人急迫、輕率、無經驗而為顯失公平之財產給付約定，法院得撤銷或減輕；年利率60%之高利貸屬之。", "✗B（本題答案）. §74 僅適用於財產上給付之法律行為，婚約為身分行為，不適用，不得依§74 撤銷。", "✓C. §244Ⅰ 債務人所為無償行為有害及債權者，債權人得聲請法院撤銷。", "✓D. 因被詐欺或被脅迫而為離婚協議，得依§92 撤銷其意思表示。", "★ §74 只限「財產」給付，身分行為（婚約、結婚、離婚）不適用。陷阱：看到急迫輕率無經驗就直接套§74。"]}, {"year": 104, "num": 5, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲授權乙為代理人，由乙代為與丙協議及締結房屋買賣事宜。下列敘述，何者正確？", "opts": ["乙明知該房屋有瑕疵仍與丙締約時，甲得對丙主張瑕疵擔保責任", "乙受甲之授權後，得再另受丙之授權，同時代理甲、丙締結買賣契約", "乙死亡時，代理權消滅，不能為繼承之標的", "乙不得為限制行為能力人"], "exp": ["✗A. 本題以甲為買受人。依§105，代理人之意思表示因明知或可得而知其事情致效力受影響時，其事實之有無就代理人（乙）決之（白話：知不知情看代理人）；乙締約時明知房屋有瑕疵，等同買受人知情，依§355Ⅰ（買受人於契約成立時知其物有瑕疵者，出賣人不負擔保之責），甲不得對丙主張瑕疵擔保。", "✗B. §106：代理人非經本人許諾，不得既為第三人之代理人而為本人與第三人之法律行為（雙方代理禁止；但專履行債務者例外）。乙受甲授權後，若要再受丙授權同時代理雙方，須經本人（甲、丙）許諾，並非當然可為。", "✓C. §108Ⅰ：代理權之消滅，依其所由授與之法律關係定之；授權通常基於委任，依§550委任關係因當事人一方死亡而消滅（契約另有訂定或性質不能消滅者除外），故乙死亡時代理權消滅。代理權專屬於代理人本人，不能成為繼承標的，正確。", "✗D. §104：代理人所為或所受意思表示之效力，不因其為限制行為能力人而受影響，代理人不以有完全行為能力為必要，故乙得為限制行為能力人，本選項錯誤。"]}, {"year": 104, "num": 9, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "甲、乙締結由甲出售其所有之建物予乙之買賣契約，但該建物實際上已於甲、乙締約前一日因火災而全部燒毀。該買賣契約效力如何？", "opts": ["效力未定", "乙得解除契約", "乙得撤銷契約", "無效"], "exp": ["✗A. 效力未定用於限制行為能力或無權代理情形，與本題標的不能問題無關。", "✗B. 契約因自始客觀不能而無效，已無法律效力，無須再以「解除」方式終止（解除是對有效契約之終止手段）。", "✗C. 撤銷用於意思表示瑕疵（如詐欺、脅迫、錯誤），本題並無意思表示瑕疵。", "✓D. 建物於締約前已全部燒毀，給付標的自始即客觀不能（任何人皆無法給付），依§246Ⅰ，以不能之給付為契約標的者，其契約無效，正確。"]}, {"year": 104, "num": 11, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲為成年人，因精神障礙而受監護之宣告，某日甲精神回復而有識別能力，向乙購買手機一只，惟因過失打破櫃台玻璃。下列敘述，何者正確？", "opts": ["甲與乙之手機買賣契約無效，關於打破櫃台玻璃不成立侵權行為", "甲與乙之手機買賣契約有效，關於打破櫃台玻璃成立侵權行為", "甲與乙之手機買賣契約無效，關於打破櫃台玻璃成立侵權行為", "甲與乙之手機買賣契約效力未定，關於打破櫃台玻璃不成立侵權行為"], "exp": ["✗A. 侵權行為以「識別能力」（有識別其行為之責任能力）而非「行為能力」為判斷基礎，甲精神回復時雖有識別能力，仍可成立侵權行為責任，前半段買賣契約無效正確，但後半段否定侵權行為成立錯誤。", "✗B. 受監護宣告之人為無行為能力人（§15），其意思表示無效（§75），買賣契約無效，前半段錯誤。", "✓C. 受監護宣告之人為無行為能力人，意思表示無效，買賣契約無效；但侵權行為以識別能力為要件（§187），甲精神回復有識別能力時，打破玻璃之行為仍可成立侵權行為（§184），正確答案。", "✗D. 買賣契約無效（非效力未定），且侵權行為可成立，兩者均描述錯誤。", "★關鍵分辨：行為能力（意思表示有效與否）≠侵權責任識別能力（侵權行為成立與否）。"]}, {"year": 105, "num": 1, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關民法的法源，民法第 1 條規定「民事，法律所未規定者，依習慣；無習慣者，依法理。」下列敘述何者正確？", "opts": ["民間「洗門風」的習慣，即是該條所稱之「習慣」", "此之「習慣」，係專指習慣法而言", "憲法關於人民之權利義務的規定，是該條所稱之法律", "條約是規範國家間權利義務之協定，絕非是民法法源之一"], "exp": ["✗A. 洗門風之習俗違反公序良俗（§72），不能作為§1之習慣。", "✓B（本題答案）. §1 之習慣，通說指具有法的確信之習慣法，單純事實上習慣不屬之。", "✗C. 憲法人民權利義務規定主要規範國家與人民關係，在私法上透過概括條款間接適用，並非逕為§1 所稱法律。", "✗D. 經國內法程序生效之條約可具有國內法效力，絕非不得為法源之說過於絕對。", "★ §1 法源順序：法律→習慣（需習慣法）→法理。習慣要有「法的確信」且不違反公序良俗。陷阱：「絕非」「專指」等絕對用語。"]}, {"year": 105, "num": 2, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "依民法之規定，下列何種非屬法定要式行為？", "opts": ["兩願離婚", "買賣契約", "所有權移轉", "社團章程之訂定"], "exp": ["✗A. 兩願離婚須以書面為之，並須有二人以上之證人簽名（§1050），屬法定要式行為。", "✓B. 買賣契約（§345）依民法規定屬不要式契約，僅須雙方意思表示合致即可成立，不需書面或特定形式，正確（非法定要式行為）。", "✗C. 不動產物權之移轉或設定，應以書面為之（§758Ⅱ），屬法定要式行為。", "✗D. 社團設立應訂立章程（§47），章程訂定須以書面為之，屬要式行為。"]}, {"year": 105, "num": 4, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "有關人格權之敘述，下列何者錯誤？", "opts": ["自由不得限制", "行為能力不得拋棄", "人格權具有專屬性", "當人格權受侵害時，得請求法院除去其侵害"], "exp": ["✗A（本題答案）. §17Ⅰ：自由不得拋棄；§17Ⅱ：自由之限制，以不背於公共秩序或善良風俗者為限。可見自由可以被限制（只要不違背公序良俗），「自由不得限制」說得太絕對，錯誤，為應選答案。", "✓B. §16：權利能力及行為能力，不得拋棄，正確。", "✓C. 人格權（生命、身體、健康、名譽、隱私等）與人格不可分，具一身專屬性，不得讓與或繼承，正確。", "✓D. §18Ⅰ：人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之，正確。"]}, {"year": 105, "num": 5, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "30 歲的甲患有精神疾病，並受監護宣告。某日，甲於精神狀況良好時，單獨到乙電信公司購買手機一支。試問甲乙間之買賣契約，其效力為何？", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A. 受監護宣告之人之意思表示無效（§15、§75Ⅰ），縱使精神狀況回復，在宣告被撤銷前仍屬無行為能力人，其意思表示不因精神回復而有效。", "✓B. 受監護宣告者在監護宣告撤銷前，其意思表示一律無效（§75Ⅰ），不論其精神狀況實際如何，此為法律上的擬制，買賣契約無效，正確。", "✗C. 得撤銷用於意思表示瑕疵，本題係行為能力欠缺導致無效，並非得撤銷。", "✗D. 效力未定用於限制行為能力人契約或無權代理，本題甲為受監護宣告之無行為能力人，效果為無效而非效力未定。", "★必考區分：受監護宣告（無行為能力）→意思表示無效；受輔助宣告（限制特定行為）→未得同意行為效力未定。"]}, {"year": 105, "num": 6, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲誤認為好友所贈與之戒指，乃鍍金之假鑽戒，遂將該戒指以 5 百元之價格賣給乙，並已交付。甲事後得知此乃真金真鑽之戒指，且價值 5 萬元。有關此法律行為之敘述，下列何者正確？", "opts": ["甲乙間之買賣契約無效，但物權行為有效", "甲乙間之買賣契約有效，但物權行為無效", "甲乙間之買賣契約得撤銷，但物權行為無效", "甲乙間之買賣契約得撤銷，但物權行為有效"], "exp": ["✗A. 甲誤認戒指為假鑽，屬§88Ⅱ「物之性質」錯誤（交易上認為重要者視為意思表示內容錯誤），效果是買賣契約「得撤銷」，經撤銷才視為自始無效（§114Ⅰ），撤銷前契約並非無效；故「契約無效」的說法錯誤。", "✗B. 買賣契約因意思表示錯誤（§88）得撤銷，並非有效；物權行為採無因性，亦非無效。", "✗C. 買賣契約得撤銷（正確），但物權行為（交付）依無因性原則，不因債權行為之效力而影響，交付本身有效，並非無效。", "✓D. 甲誤認戒指為假鑽，對物之性質有重大錯誤，買賣契約之意思表示（§88）得撤銷；但已交付（移轉所有權之物權行為）依物權行為無因性原則，其效力獨立於債權行為之外，交付行為有效（乙已取得所有權）。若甲撤銷債權行為，乙須依不當得利返還，但此是撤銷後之效果，撤銷前物權行為有效，正確。"]}, {"year": 105, "num": 8, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲為限制行為能力人，當其為法律行為時，下列何種行為無效？", "opts": ["甲未得母之允許，於父死後 3 個月內，具狀向法院為拋棄其繼承權之意思表示", "甲以詐術佯稱自己已成年，向乙購買機車一輛", "甲未得父母之同意，擅自接收同學拋棄的筆電一台", "甲未得父母之同意，擅自至福利社購買鉛筆"], "exp": ["✓A. 拋棄繼承權屬「單獨行為」，依§78，限制行為能力人未得法定代理人允許之單獨行為，無效；且拋棄繼承須「一定期間內」以書面向法院聲請（§1174），屬法定要式及有期限之行為，此題測驗點：拋棄繼承為單獨行為→無效。", "✗B. 限制行為能力人使用詐術（佯稱成年），依§83，其法律行為為「有效」，保護善意相對人，而非無效。", "✗C. 接收他人拋棄之動產（無主物先占），屬純獲法律上利益之行為，依§77但書，無須法定代理人允許即有效。", "✗D. 日常生活所必需之行為（購買文具），依§77但書，無須法定代理人允許即有效。"]}, {"year": 106, "num": 2, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "下列有關從物之敘述，何者錯誤？", "opts": ["所有權狀為房地不動產之從物", "屋頂平台為主物大樓建築之從物", "土地共有人出賣房地全棟時，買賣契約效力及於另一共有人原所同意之同宗建築基地依法留設法定保留空地及退縮地之使用權等從權利在內", "主物之處分及於從物，於主物與從權利之關係，亦可適用"], "exp": ["✓A. 所有權狀是不動產管理文件，常助主物（不動產）之效用且各自獨立（土地/建物權狀屬從物），此為實務常見判決見解，正確。", "✗B（本題答案）. 屋頂平台屬建築物之「一部分」（成分），非獨立存在的「從物」；成分與從物的區別：成分是主物不可分的組成部分，從物是獨立存在但常助主物效用的物，本選項將成分誤稱為從物，錯誤，為應選答案。", "✓C. 買賣主物（建物）之效力及於從物及從權利（如基地保留空地使用權），符合§68「主物之處分，及於從物」，正確。", "✓D. 主物之處分及於從物，類推適用於主物與從權利之關係，正確。"]}, {"year": 106, "num": 5, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於意思表示錯誤，下列敘述何者正確？", "opts": ["當事人資格之錯誤，可能得撤銷之", "表意人得向相對人請求損害賠償", "動機錯誤，均為意思表示內容之錯誤", "表示行為錯誤，不得撤銷"], "exp": ["✗A. §88Ⅱ：當事人之資格或物之性質，若交易上認為重要者，其錯誤視為意思表示內容之錯誤；再依§88Ⅰ，只要錯誤非由表意人自己過失所致，即得撤銷。故當事人資格錯誤「可能」得撤銷，正確。", "✓B. 撤銷人（表意人）因錯誤撤銷意思表示，依§91，對於「信其意思表示有效而受損害之相對人」，應負損害賠償責任；是撤銷人對相對人負責，而非「表意人得向相對人請求」，方向相反。", "✓C. 動機錯誤原則上不得撤銷（動機不屬於意思表示內容），僅當事人資格或物之性質之錯誤且依交易上觀念認為重要者，始例外得撤銷，並非「動機錯誤均為意思表示內容之錯誤」。", "✓D. 表示行為錯誤（口誤、筆誤）屬§88Ⅰ「意思表示之內容有錯誤」，表意人得撤銷，但以錯誤非由表意人自己之過失為限；並非「不得撤銷」，故本選項錯誤。"]}, {"year": 106, "num": 6, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲有 A 地，且登記為 A 地所有人。甲因乙之脅迫，出賣且交付 A 地於乙，於甲尚未撤銷買賣契約前。試問，下列敘述何者正確？", "opts": ["甲得撤銷交付 A 地於乙之行為", "現占有 A 地之乙為有權占有人", "乙因此成為 A 地所有人", "甲乙間之 A 地的買賣契約，無效"], "exp": ["✗A. §92Ⅰ可撤銷的對象是因脅迫所為的「意思表示」（買賣契約、移轉所有權的合意）；「交付」A地只是移轉占有的事實行為，本身不是意思表示，無從撤銷「交付行為」。不動產物權變動另須登記（§758Ⅰ），甲要回復，是撤銷買賣及物權移轉之意思表示後，依法請求返還。", "✓B. 買賣契約在撤銷前有效，乙取得A地有法律上原因（有效的買賣契約），故乙為「有權占有人」，正確。", "✗C. 買賣契約雖撤銷前有效，但不動產所有權移轉尚須完成「登記」（§758Ⅰ），本題僅描述「出賣且交付」，未明說完成登記，若未完成登記則乙未成為A地所有人；縱已登記，在甲撤銷後乙仍應返還，本選項過於絕對。", "✗D. 脅迫所為之意思表示效果為「得撤銷」（§92），而非當然無效，在撤銷前契約仍有效。"]}, {"year": 106, "num": 7, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於消滅時效，下列敘述何者正確？", "opts": ["消滅時效之規定，已登記不動產之回復請求權，亦有適用", "一般消滅時效期間，乃 20 年", "請求權因其消滅時效完成而消滅", "以租賃動產為營業者之租價請求權，其消滅時效期間為 2 年"], "exp": ["✗A. 依司法院釋字第107號、第164號，已登記不動產所有人之回復請求權、除去妨害請求權，無§125（請求權15年不行使而消滅）消滅時效之適用；故「亦有適用」錯誤。", "✗B. §125：請求權因15年間不行使而消滅（但法律所定期間較短者依其規定），一般消滅時效期間是15年，不是20年。", "✗C. §144Ⅰ：時效完成後，債務人「得拒絕給付」，即取得抗辯權，請求權本身並未消滅；債務人若仍自願給付，依§144Ⅱ不得以不知時效為由請求返還。故「請求權因時效完成而消滅」錯誤。", "✓D. §127第3款：以租賃動產為營業者之租價，其請求權因2年間不行使而消滅，正確（§127為2年短期時效，如旅店飲食費、運送費、租賃動產租價、醫藥費、律師會計師報酬等）。"]}, {"year": 106, "num": 11, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲有 A 屋，共 95 坪，登記為 A 屋所有人。乙詢問甲 A 屋坪數，甲告知 A 屋計有 100 坪。甲與乙締結 100 坪之 A 屋買賣契約。試問，下列敘述何者錯誤？", "opts": ["甲侵害乙之 A 屋所有權", "乙得解除契約", "乙得請求減少價金", "乙得以甲詐欺為由，撤銷締結該買賣契約之意思表示"], "exp": ["✗A（本題答案）. 甲是A屋「所有人」，其出售行為並非侵害乙的所有權（乙尚未取得所有權），此題情境甲說謊坪數是詐欺或物之瑕疵問題，並非侵權行為，「侵害乙之A屋所有權」描述根本不成立，為錯誤選項，即應選答案。", "✓B. A屋坪數短少，屬物之瑕疵，乙得解除契約（§359），正確。", "✓C. 乙得請求減少價金以彌補坪數短少之損失（§359），正確。", "✓D. 甲故意告知錯誤坪數，屬詐欺（§92），乙得撤銷其意思表示，正確。"]}, {"year": 106, "num": 25, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依民法規定，關於一定之數量有文字與號碼不符合之情形時，下列敘述何者錯誤？", "opts": ["若能探求出當事人原意，應以原意為準", "若不能探求出當事人原意，而契約文書上對於同一數量同時以文字及號碼表示有不相符合之情形，應以文字為準", "若不能探求出當事人原意，契約文書上對於同一數量同時以文字及號碼為數次表示時，應以文字最低額為準", "若不能探求出當事人原意，契約文書上對於同一數量同時以文字及號碼為數次表示時，依實務見解，應以數字最低額為準"], "exp": ["✓A. 依§98，解釋意思表示，應探求當事人真意，應以原意為準，正確。", "✓B. 依§4，文字與號碼不符、法院不能決定當事人原意時，應以文字為準（因文字較不易誤記），正確。", "✓C. §5：以文字或號碼為數次之表示而有不符，法院不能決定何者為當事人原意時，以最低額為準（保護義務人）；再結合§4文字優先於號碼的原則，故以「文字」所表示之最低額為準，敘述正確。", "✗D（本題答案）. §4：文字與號碼不符、不能決定原意時以文字為準；§5：數次表示不符時以最低額為準。兩者合併，應以「文字」最低額為準，而非「數字」最低額，故D錯誤，為應選答案。"]}, {"year": 106, "num": 26, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "依民法之規定，法定要式行為有使用文字之必要時，下述情形何者錯誤？", "opts": ["不動產物權之移轉或設定，當事人得以蓋章代替簽名", "兩願離婚之協議書，夫妻雙方得以蓋章代替簽名", "在代筆遺囑之情形，遺囑人得以蓋章代替簽名", "應以書面方式訂立之人事保證契約，雙方得以蓋章代替簽名"], "exp": ["✓A. §3Ⅱ，如有用印章代替簽名之習慣者，得以蓋章代替簽名，不動產物權移轉書面亦適用此原則，正確。", "✓B. 離婚協議書以蓋章代替簽名，符合§3Ⅱ，正確。", "✗C（本題答案）. §1194：代筆遺囑由見證人全體及遺囑人同行簽名，遺囑人不能簽名者「應按指印代之」，條文只允許簽名或按指印，並未規定得以蓋章代替（與§3Ⅱ一般性的蓋章代簽名不同，遺囑屬嚴格要式行為），故C錯誤，為應選答案。", "✓D. 人事保證契約§756-1須以書面為之，書面得以蓋章代替簽名，正確。"]}, {"year": 106, "num": 27, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "關於撤銷權之性質，下列敘述何者錯誤？", "opts": ["撤銷權屬於形成權之一種，得因撤銷權人單方之意思表示到達相對人時，即生法律關係生效、變更或消滅之效力", "撤銷權之行使期間，不受到消滅時效規定之限制", "撤銷權行使後，其撤銷之客體視為自始無效", "撤銷權須法律明文規定始得發生，當事人間不得以契約約定，由一方當事人因特定事由之發生而取得撤銷權"], "exp": ["✓A. 形成權之行使，以意思表示到達相對人即生效力，撤銷權亦然（§116），正確。", "✓B. 形成權之行使期間為「除斥期間」，不適用消滅時效（除斥期間不得中斷或不完成），正確。", "✓C. 撤銷之效果，民法§114Ⅰ規定，法律行為被撤銷者，視為自始無效（溯及效力），正確。", "✗D（本題答案）. 撤銷權並非僅能由法律明文規定而生，當事人亦得「以契約約定」特定撤銷權（例如商業合約中約定特定情形得解除或撤銷），此為私法自治原則之體現，本選項限縮為「須法律明文」且否定契約約定，描述過於絕對，為錯誤選項，即應選答案。"]}, {"year": 106, "num": 35, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列有關意思表示之敘述，何者錯誤？", "opts": ["因錯誤或被詐欺而締結契約者，在表意人依法撤銷其意思表示之前，契約效力未定", "當事人之意思表示未合致者，其契約自始未成立", "買賣為諾成契約，除當事人另有約定外，縱然未訂立書面，亦不影響契約之成立", "非定期行為之契約，當事人一方遲延給付者，他方當事人得定相當期限催告其履行，如債務人仍不履行時，債權人仍須另為解約之意思表示"], "exp": ["✗A（本題答案）. 因錯誤或被詐欺所訂契約，撤銷前為有效（得撤銷，§88、§92），並非效力未定。", "✓B. §153Ⅰ 意思表示須一致才成立契約，不一致即不成立（§153Ⅱ 無須備之點）。", "✓C. §345 買賣為諾成契約，意思表示一致即成立，無須書面。", "✓D. §254、§258 非定期行為須催告後再為解除之意思表示，並非當然解除。", "★ 瑕疵意思表示：得撤銷（有效至撤銷）；效力未定專指限制行為能力、無權代理、無權處分等。陷阱：「撤銷前效力未定」。"]}, {"year": 106, "num": 40, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關人格權之敘述，何者錯誤？", "opts": ["姓名乃用以區別人己之一種語言標誌，將人個別化，以確定其人之同一性", "法人在法令限制與性質範圍內，亦享有人格權", "公司名稱用以識別企業之主體性，此時姓名權等於商標權", "針對無涉公益之報導，若不當揭載足資識別當事人資料，侵害其名譽權者，得依民法第 18 條請求排除侵害"], "exp": ["✓A. 姓名為區別人己之標誌，姓名權屬人格權（§19）。", "✓B. 法人於法令限制及性質範圍內享有人格權（§26）。", "✗C（本題答案）. 公司名稱受公司法保護，屬營業主體識別，與商標（保護商品或服務來源識別）不同，姓名權不等於商標權。", "✓D. §18Ⅰ 人格權受侵害時得請求法院除去之，有侵害之虞時得請求防止之，名譽權亦適用。", "★ 姓名權（民法）、公司名稱（公司法）、商標權（商標法）三者保護客體不同。陷阱：看到「等於」就要警覺。"]}, {"year": 107, "num": 2, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "A 公司董事長甲於 5 月 1 日上午告訴其助理乙致函於丙，表示願以一億元購買其工廠。乙於 5 月2 日上午發信，信於 5 月 4 日到達丙處。經查，甲於 5 月 2 日晚上心肌梗塞死亡，丙於 5 月 6 日函覆 A 公司為承諾，試問買賣契約是否成立？", "opts": ["買賣契約不成立", "買賣契約效力未定，需視 A 公司繼任董事長是否承認決定其效力", "買賣契約效力未定，需視甲之繼承人是否承認決定其效力", "買賣契約成立"], "exp": ["✗A. 要約於發出後表意人死亡不失其效力（§95Ⅱ），到達後即生效，丙承諾後契約成立。", "✗B. 要約人為A公司而非甲個人，甲死亡不影響要約效力，也無須等待繼任董事長承認。", "✗C. 要約人是A公司，非甲，甲之繼承人不是契約當事人，與繼承無關。", "✓D（本題答案）. §95Ⅰ 非對話意思表示於到達相對人時生效，§95Ⅱ 表意人發出後死亡，意思表示不失效力；丙之承諾使契約成立（§153）。", "★ 非對話意思表示：「發出後死亡、喪失能力不影響效力」（§95Ⅱ）。另外本題代理人（董事長）發出的要約，效果歸A公司。陷阱：誤把死亡當作要約失效。"]}, {"year": 107, "num": 3, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關使者之敘述，何者錯誤？", "opts": ["使者係在傳達他人的意思表示", "使者得為無行為能力人", "身分行為不可藉使者傳達其意思表示", "使者未適時傳達的危險由表意人承擔"], "exp": ["✓A. 使者（messenger）的功能是傳達他人（表意人）已決定的意思表示，有別於代理人（自行決定意思表示內容），正確。", "✓B. 使者僅係傳達機器，不自行決定意思內容，故不需具有行為能力，無行為能力人亦得充任使者，正確。", "✗C（本題答案）. 使者只是「傳達」本人已經決定、完成的意思表示，意思仍是本人所為；身分行為（如結婚、離婚）因高度屬人性而不得「代理」（由他人代為決定意思），但不等於不能由使者傳達本人自己的意思。「身分行為不可藉使者傳達」過於絕對，錯誤，為應選答案。", "✓D. 使者未適時傳達之風險（如信件延誤），由表意人（發出意思表示之人）承擔，正確。"]}, {"year": 107, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "針對民法有關撤銷權之規範，下列敘述何者正確？", "opts": ["撤銷權僅能對不健全的意思表示為之，不得對法律行為或法律關係為之", "任何撤銷權之行使，均只須以意思表示方式為之，即生法律效果", "撤銷權因一定期間內不行使而消滅，此期間稱為消滅時效", "撤銷權之法律性質與解除權相同，均屬形成權之一種"], "exp": ["✗A. 撤銷權不限於撤銷不健全的意思表示，亦可撤銷「法律行為」：如§244債權人得聲請法院撤銷債務人有害債權之行為、§74法院得撤銷乘人急迫輕率無經驗而顯失公平之法律行為（暴利行為），故「不得對法律行為為之」錯誤。", "✗B. 大部分撤銷權以意思表示方式行使即生效，但某些撤銷須向法院聲請（如暴利行為§74、詐害債權§244），並非「任何撤銷權」均以意思表示方式為之。", "✗C. 撤銷權之行使期間為「除斥期間」，不適用消滅時效之中斷、不完成等制度，兩者須嚴格區分，本選項稱為「消滅時效」屬錯誤。", "✓D. 撤銷權（如§92脅迫撤銷）與解除權（如§254違約解除）性質相同，均屬「形成權」，即單方意思表示即可使法律關係發生、變更或消滅，正確。"]}, {"year": 107, "num": 13, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "18 歲之甲考取大學後，拿著父母親給的住宿費、生活費至北部求學，擬向乙承租 A 屋一年。關於甲乙間租賃契約之效力，下列敘述，何者錯誤？", "opts": ["甲為限制行為能力人，故甲所締結之租賃契約無效", "甲得主張關於租賃契約之意思表示，在現代社會中可認為係依其年齡及身分、日常生活所必需者，例外無須得法定代理人允許，契約仍可成立生效", "甲得提出法定代理人就租屋之書面允許，以使契約成立生效", "乙得定期限催告法定代理人，確答是否承認甲乙間租賃契約，以使契約成立生效"], "exp": ["★本題為舊法時代（107年）考題，當時成年年齡為20歲，18歲仍為限制行為能力人。現行法（112年起）已改為18歲成年，故本題情境在現行法下甲已為成年人，但應依本題年度法律狀態作答。", "✗A（本題答案）. 限制行為能力人（18歲）訂立租賃契約，未得法定代理人允許者效果為「效力未定」（§79），非直接無效；再者，若認係依年齡及身分日常生活所必需，還可直接有效，選項直接說「無效」屬錯誤敘述，為應選答案。", "✓B. 依§77但書，限制行為能力人為「依其年齡及身分、日常生活所必需」之行為，不須得法定代理人之允許，大學生在外求學租屋確有此類解釋空間，正確。", "✓C. 法定代理人事先給予住宿費表示允許外出求學，可視為允許締結租賃契約，正確。", "✓D. 相對人（乙）得依§80催告法定代理人確答是否承認，以確定契約效力，正確。"]}, {"year": 107, "num": 15, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "民法關於法人之規定，下列敘述，何者錯誤？", "opts": ["法人可分為財團法人與社團法人", "法人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限", "法人應設董事與監察人", "法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任"], "exp": ["✓A. 民法法人依設立基礎分為財團法人（以財產為基礎）與社團法人（以人為基礎），正確。", "✓B. §26規定法人之權利能力在法令範圍內，且不包含專屬自然人之部分，正確。", "✗C（本題答案）. 法人「應設董事」（§27Ⅰ，必設機關），但「監察人」屬任意機關，法人「得設監察人」（§27Ⅳ），並非必須設置，故「法人應設董事與監察人」之敘述錯誤，此為本題應選答案。", "✓D. §28，法人對其代表人執行職務所加損害，與行為人連帶負賠償責任，正確。"]}, {"year": 108, "num": 1, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列何者非屬我國民法上所稱之「土地的定著物」？", "opts": ["燈塔", "房屋", "柏油馬路", "蓄水池"], "exp": ["✓A. 燈塔繼續附著於土地、具獨立經濟價值，屬定著物。", "✓B. 房屋為典型之定著物。", "✗C（本題答案）. 柏油馬路為土地之構成部分，並非獨立之定著物，不具獨立所有權。", "✓D. 蓄水池於土地上構築，繼續附著並具獨立經濟價值，通說認屬定著物。", "★ 定著物三要件：非土地之構成部分、繼續附著於土地、有獨立經濟價值（§66Ⅰ 不動產）。馬路、鋪面是土地之一部；房屋、燈塔、橋梁、蓄水池可獨立。"]}, {"year": 108, "num": 2, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，以下關於行為能力之敘述，何者錯誤？", "opts": ["無行為能力人之意思表示，無效", "限制行為能力人未得法定代理人之允許，所為之單獨行為，效力未定", "限制行為能力人所訂立之契約，未經承認前，相對人得撤回之", "限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效"], "exp": ["✓A. 受監護宣告之無行為能力人意思表示無效（§75），未滿7歲之未成年人亦同，正確。", "✗B（本題答案）. 限制行為能力人未得法定代理人允許之「單獨行為」→「無效」（§78），並非效力未定；效力未定是「契約行為」未得允許之效果（§79）。本選項將單獨行為的效果說成「效力未定」，錯誤，此為最重要必考對比考點。", "✓C. §82：限制行為能力人所訂立之契約，未經法定代理人承認前，相對人得撤回之（但訂約時知其未得允許者除外），正確。", "✓D. 使用詐術者，依§83，其法律行為有效（排除限制行為能力之保護），正確。"]}, {"year": 108, "num": 3, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲受丙之詐欺，而授權乙向不知情的丁購買 A 屋，請問依我國民法的規定，下列敘述何者正確？", "opts": ["甲因受丙之詐欺而為意思表示，故可撤銷其授權乙之行為", "甲因受丙之詐欺而為意思表示，故可撤銷 A 屋之買賣契約", "甲若欲行使民法第 92 條之撤銷權，應於發現詐欺後，一年內為之。但自意思表示後，經過十年，不得撤銷", "甲因受丙之詐欺而為授權行為，其撤銷意思表示時，可以對抗善意第三人"], "exp": ["✗A. 丙是第三人，其詐欺使甲授權乙；依§92Ⅰ但書，第三人詐欺須「相對人明知其事實或可得而知」才得撤銷。本題未表示授權的相對人（乙）知情，故不能逕認甲可撤銷授權。", "✗B. 買賣契約是乙與丁訂立，丁不知丙詐欺；依§92Ⅰ但書，第三人詐欺須相對人（丁）明知或可得而知方得撤銷，丁善意不知情，甲不得以丙詐欺撤銷A屋買賣契約。", "✓C. 依§93，因詐欺而為意思表示之撤銷，應於「發現詐欺後一年內」為之，且「自意思表示後十年」不得撤銷，此即撤銷權之除斥期間，正確。", "✗D. §92Ⅱ：被詐欺而為之意思表示，其撤銷不得以之對抗善意第三人，與選項「可以對抗善意第三人」正好相反，錯誤。"]}, {"year": 108, "num": 13, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲並無將其所有價值十萬元之 A 手錶出售的意思，卻向乙表示欲以五千元出售之，乙明知甲無出售 A 手錶之意思，仍當場表示願意以五千元購買時，甲出售 A 手錶之意思表示的效力如何？", "opts": ["有效", "無效", "甲得撤銷", "效力未定"], "exp": ["✗A. 甲之意思表示屬「心中保留（單獨虛偽意思表示）」（§86），原則上有效，但以相對人不知情為前提。", "✓B. 依§86但書，若相對人（乙）明知表意人（甲）無真正意思，則該意思表示無效，本題乙明知甲無出售意思，故甲之意思表示無效，買賣契約不成立，正確。", "✗C. 心中保留並非「得撤銷」而是依相對人知情與否決定有效或無效，無撤銷問題。", "✗D. 效力未定通常用於限制行為能力人或無權代理，心中保留效果非效力未定。"]}, {"year": 108, "num": 14, "ans": "A", "acc": "", "note": "108年考試時成年年齡為20歲，甫滿18歲之乙為限制行為能力人；現行§12（112年1月1日起）滿18歲即為成年，乙已是成年人，更無行為能力疑慮，結論仍是代理行為對甲發生效力。官方答案A不變。", "src": "ai", "stem": "甲授與甫滿十八歲之乙代理權，由乙處理出售甲所有之 A 機車的事宜。乙乃以甲之代理人的名義，以一萬元價金與丙訂立買賣 A 機車的契約。乙與丙所締結之買賣契約的效力如何？", "opts": ["對甲發生效力", "甲未承認前，效力未定", "乙之法定代理人未承認前，效力未定", "乙之法定代理人得撤銷之"], "exp": ["✓A. 依§104，代理人不以有行為能力為必要，限制行為能力人（18歲，舊法時代）亦得為代理人；代理人在代理權限內以本人名義所為之意思表示，直接對本人發生效力（§103），故乙代甲與丙訂立買賣契約，效力直接對甲（本人）發生，正確。", "✗B. 既然代理人不以有行為能力為必要，乙雖為限制行為能力人，其代理行為仍有效，無須甲另行承認。", "✗C. 乙是作為代理人（代甲行為），其法律行為效力歸屬於本人甲，乙之法定代理人不涉入此代理行為的效力判斷。", "✗D. §104：代理人所為或所受意思表示之效力，不因其為限制行為能力人而受影響；乙雖為限制行為能力人，代理行為仍有效並對甲發生效力，其法定代理人既無須承認，也無從撤銷，故D錯誤。"]}, {"year": 109, "num": 1, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列關於法律上之物的敘述，何者正確？", "opts": ["從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物", "物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人", "無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有", "已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"], "exp": ["✓A. 依§68，從物是非主物之成分、常助主物效用、同屬一人所有的物；重點：「各自獨立」（非主物成分）且「客觀上常助主物效用」；動產或不動產均可為從物，正確。", "✗B. §766：物之成分及其天然孳息，分離後除法律另有規定外，仍屬於其物之「所有人」，而非占有人；另§70Ⅰ：有收取天然孳息權利之人，於權利存續期間取得分離之孳息。占有人並不當然取得，故B錯誤。", "✗C. §66Ⅰ：不動產指土地及其定著物，土地與其上房屋是各自獨立的不動產；無權占有他人土地建築房屋，房屋由建造人取得所有權，並非歸土地所有人（§811附合規定僅適用於動產附合於不動產而成重要成分，不適用於房屋），土地所有人是請求拆屋還地。", "✗D. 已足避風雨可使用之房屋（即便屋頂未完工）屬獨立建築物（定著物），而非土地之「成分」（成分是不可與主物分離之部分），敘述錯誤。"]}, {"year": 109, "num": 2, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列何者非消滅時效適用之客體？", "opts": ["人格權受侵害時之除去妨害請求權", "夫妻因離婚所約定之贍養費請求權", "繼承權受侵害時之回復請求權", "未登記不動產所有權人之返還請求權"], "exp": ["✗A（本題答案）. 人格權之除去妨害請求權在侵害持續期間，性質上不適用消滅時效，不屬消滅時效客體。", "✓B. §126 贍養費等定期給付請求權，5年間不行使而消滅。", "✓C. §1146Ⅱ 繼承回復請求權2年或10年間不行使而消滅。", "✓D. 釋字第107號、第164號：已登記不動產回復請求權不適用時效；未登記不動產所有人之返還請求權仍適用消滅時效（§125）。", "★ 不適用消滅時效：已登記不動產物上請求權、人格權除去妨害、形成權（除斥期間）。陷阱：「未登記」要適用時效。"]}, {"year": 110, "num": 2, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於胎兒的敘述，下列何者正確？", "opts": ["人之權利能力，始於出生，終於死亡。胎兒無權利能力", "胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生", "胎兒為繼承人時，於胎兒出生前，他繼承人不得分割遺產", "胎兒為繼承人時，以其母為繼承人"], "exp": ["✗A. 前半句正確（§6：人之權利能力始於出生、終於死亡），但「胎兒無權利能力」說得太絕對：§7規定胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生（例如可繼承，見§1166），故此句錯誤。", "✓B. §7：胎兒只要將來不是死產（活著出生），關於其個人利益的保護，就當作已經出生；這是條文明文規定，正確。", "✗C. §1166Ⅰ：胎兒為繼承人時，「非保留其應繼分」，他繼承人不得分割遺產，也就是只要先保留胎兒的應繼分，其他繼承人仍可分割；本選項說胎兒出生前「不得分割」過於絕對，錯誤。（考試陷阱：條文是「非保留應繼分不得分割」，不是「一律不得分割」。）", "✗D. 胎兒本身就是繼承人（§7、§1166Ⅰ），並非「以其母為繼承人」；§1166Ⅱ只規定胎兒關於遺產分割，以其母為「代理人」，是代理關係而非繼承人身分，選項把「代理人」誤為「繼承人」，錯誤。"]}, {"year": 110, "num": 3, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於失蹤人的敘述，下列何者正確？", "opts": ["失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告", "失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告", "失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告", "失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"], "exp": ["✓A（本題答案）. §8Ⅰ 失蹤滿7年，法院得因利害關係人或檢察官聲請為死亡宣告。", "✗B. §8Ⅱ 八十歲以上者為失蹤滿3年，非5年。", "✗C. §8Ⅲ 遭遇特別災難者，得於災難終了滿1年後宣告，非3個月。", "✗D. §10 失蹤人財產管理依非訟事件法，非破產法。", "★ 失蹤期間口訣：一般7年、80歲以上3年、特別災難1年。財產管理依非訟事件法。陷阱：把數字與年份張冠李戴。"]}, {"year": 110, "num": 4, "ans": "D", "acc": "", "note": "【現行法提醒】110年考試時法定婚齡為男18歲、女16歲；現行§980已修正為男女均滿18歲（成年年齡亦為18歲，§12）。但違反婚齡之效果仍為§989「得撤銷」，本題答案不變。", "src": "ai", "stem": "關於行為能力之敘述，下列何者錯誤？", "opts": ["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示", "限制行為能力人未得法定代理人之允許，所為之單獨行為，無效", "未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷", "為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"], "exp": ["✓A. §15：受監護宣告之人無行為能力；§75前段：無行為能力人之意思表示無效；§76：無行為能力人由法定代理人代為意思表示，並代受意思表示。三者合併，本選項正確。", "✓B. §78：限制行為能力人未得法定代理人允許所為之「單獨行為」無效（不同於契約行為，依§79為效力未定，須經承認），正確。", "✓C. §989：結婚違反§980（法定結婚年齡）者，當事人或其法定代理人得向法院請求撤銷，效果是「得撤銷」而非無效，正確。", "✗D（本題答案）. §7所保護的是「權利能力」而非「行為能力」；胎兒本身未出生，毫無行為能力（無能力為意思表示），§7是以「將來非死產為限」擬制其已有部分「權利能力」以保護其利益，並非給予行為能力，本選項將「權利能力」說成「行為能力」，概念完全錯誤，為應選答案。"]}, {"year": 110, "num": 5, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "關於代理的敘述，下列何者正確？", "opts": ["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之", "代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限", "由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限", "代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"], "exp": ["✗A. 代理權授與不以書面為必要，口頭授與亦可（法律另有規定除外），本選項「以書面授權方式」之限制不正確。", "✗B. 依§168，代理人有數人者，其代理行為應「共同」為之（非單獨），但法律另有規定或本人另有意思表示者不在此限，本選項把「共同」說成「單獨」，相反。", "✓C. 此描述為§169表見代理的規定：本人以行為表示授與代理權，或知他人以其名義為代理人而不反對者，對善意第三人負授權人責任；但第三人明知無代理權者，不在此限。正確。", "✗D. 前半段（有代理權之代理行為對本人生效）正確，但後半段「無代理權→無效」錯誤：無權代理之效果為「效力未定」（§170），而非無效（須本人不承認才確定不生效）。"]}, {"year": 110, "num": 6, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "下列何種法律行為屬法定書面要式行為？", "opts": ["動產所有權之拋棄", "子女之收養", "贈與契約", "演藝經紀契約"], "exp": ["✗A. 動產所有權之拋棄以「占有之拋棄」為之，並不以書面為必要，並非法定要式行為。", "✓B. 收養子女依§1079Ⅰ，應以書面為之，並向法院聲請認可，屬法定書面要式行為，正確。", "✗C. 贈與契約（§406）為諾成、不要式契約，口頭贈與即有效（但未移轉前得任意撤銷，此為另一層問題），並非法定書面要式。", "✗D. 演藝經紀契約在民法並無明文規定書面要式，依契約自由原則為不要式契約（特別法另有規定者除外）。"]}, {"year": 110, "num": 7, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "關於意思表示不一致的敘述，下列何者正確？", "opts": ["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效", "表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效", "表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效", "虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"], "exp": ["✗A. 依§86，表意人心中保留（無欲受拘束之意），其意思表示「原則上有效」，僅在相對人明知時才無效，並非當然無效。", "✗B. 相對人明知表意人無真意，依§86但書，其意思表示「無效」，並非有效，本選項與法條規定相反。", "✗C. 通謀虛偽意思表示，依§87Ⅰ，其意思表示「無效」，並非不因之無效（因之無效），選項與法條相反。", "✓D. 依§87Ⅱ，通謀虛偽意思表示若「隱藏他項法律行為」（如以買賣外衣隱藏贈與），該虛偽表示雖無效，但所隱藏之真實法律行為（贈與）仍適用其規定（若符合要件則有效），正確。"]}, {"year": 110, "num": 10, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "下列何者屬於授與代理權？", "opts": ["甲創作民法總則一書，授權乙出版社於五年間印製出版該書", "甲有一 A 車，授權乙以甲本人名義買賣 A 車", "甲為知名影星，授權乙週刊使用甲肖像照片", "甲有一昆蟲標本，授權乙予以拍攝"], "exp": ["✗A. 授權出版是著作財產權的授權（「利用授權」），並非民法代理權的授與；乙出版是以乙自己名義出版，並非以甲名義為甲辦理法律行為。", "✓B. 甲授權乙「以甲本人名義」買賣A車，即乙以甲名義對外為法律行為，效果歸屬於甲，此為代理（意定代理）的核心定義，正確。", "✗C. 肖像使用授權是人格權授權，乙使用甲肖像是乙自己的行為，並非代理甲對外為法律行為。", "✗D. 授權拍攝是著作/財產使用授權，乙拍攝以乙名義進行，非代理。"]}, {"year": 110, "num": 13, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列何種情形，當事人一方須以向法院聲請撤銷方式為之？", "opts": ["因受詐欺所為之意思表示", "債務人所為之無償行為，有害及債權者", "締結違反公共秩序之契約", "違反民法第 983 條特定親屬間禁止結婚規定之結婚行為"], "exp": ["✗A. §92 受詐欺所為意思表示由表意人向相對人以意思表示撤銷，無須聲請法院。", "✓B（本題答案）. §244Ⅰ 債權人撤銷權須聲請法院撤銷債務人有害債權之無償行為。", "✗C. §72 違反公共秩序之契約無效，不須撤銷。", "✗D. §988② 違反§983 近親禁婚規定之結婚無效，非聲請法院撤銷。", "★ 須「訴請法院」撤銷：債權人撤銷權（§244）、暴利行為（§74）、結婚撤銷等；詐欺脅迫則是向相對人以意思表示撤銷。"]}, {"year": 111, "num": 8, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "有關現行民法代理制度之介紹，下列何者錯誤？", "opts": ["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為", "民法第 169 條表見代理效力之發生，須無本人之授予代理權為其要件", "間接代理人之代理行為不會對本人直接發生效力", "代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"], "exp": ["✗A（本題答案）. §106規定，代理人非經本人許諾，不得自己代理（自己代理禁止）；未經許諾之自己代理行為效果應為「效力未定」（須本人承認始生效）而非「無效」，將其定性為「無效」描述錯誤，為本題應選答案。", "✓B. 表見代理（§169）的前提是本人並未授與代理權，但因本人的行為或不作為使第三人信賴有代理權而保護之，正確。", "✓C. 間接代理（如行紀）是代理人以自己名義為法律行為，法律效果歸屬代理人，再由代理人移轉給本人，並非直接對本人發生效力，正確。", "✓D. 代理人（乙）受相對人詐欺，意思表示瑕疵依§105以代理人決之，撤銷權歸屬本人（甲），本人得撤銷（以代理人之知情與否決定本人得否撤銷），正確。"]}, {"year": 111, "num": 9, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "對於民法上有關法人規定之說明，下列何者正確？", "opts": ["財團法人具有自律法人之性質", "社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之", "財團法人之設立，得以遺囑為之", "社團法人以社團董事會為其最高意思機關"], "exp": ["✗A. 財團法人之設立目的及章程由捐助人設定，組織較固定，屬「他律法人」（受外部章程拘束），而「自律法人」是指可自行制訂規範（如社團法人），本選項財團法人之說法相反。", "✗B. 開除社員屬社團總會的決議事項，且須有正當理由（§50Ⅱ：變更章程、任免董事及監察人、開除社員等應經總會決議，其中開除社員以有正當理由為限）；並非由董事會特別決議，選項把決議機關誤為董事會，錯誤。（§54是社員退社的規定，勿與開除混淆。）", "✓C. §60Ⅰ但書：設立財團原則上應訂立捐助章程，但以遺囑捐助者，不在此限，亦即財團得以遺囑設立；§60Ⅲ並規定無遺囑執行人時，法院得指定遺囑執行人，正確。", "✗D. §50Ⅰ：社團以「總會」（社員大會）為最高機關；董事是執行及對外代表機關，並非最高意思機關，錯誤。"]}, {"year": 111, "num": 10, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "依現行民法有關住所之規定，下列何者錯誤？", "opts": ["夫妻於雙方共同協議前，推定以共同戶籍地為其法定之住所", "意定住所之設定須具備久住之意思及居住之事實", "因特定行為選定居所，關於其行為，不得視為住所", "16 歲之年輕人，僅能以其父母之住所為法定住所"], "exp": ["✓A. §1002：夫妻之住所由雙方共同協議；未協議或協議不成時，得聲請法院定之；法院裁定前，以夫妻共同戶籍地推定為其住所，正確。", "✓B. §20Ⅰ：依一定事實，足認以「久住之意思」住於一定地域者，即設定其住所於該地，所以須有久住意思與居住事實（主觀＋客觀），正確。", "✗C（本題答案）. §23：因特定行為選定居所者，關於其行為，「視為住所」；本選項說「不得視為住所」，與條文相反，為錯誤選項，即應選答案。", "✓D. §21：無行為能力人及限制行為能力人，以其法定代理人之住所為住所；16歲為限制行為能力人（§13Ⅱ：滿七歲以上之未成年人），其法定代理人通常為父母，故以父母住所為法定住所，正確。"]}, {"year": 111, "num": 11, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於民法第 74 條暴利行為之規定，下列敘述何者正確？", "opts": ["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為", "撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅", "行使暴利行為之撤銷權時，應以意思表示向相對人為之", "暴利行為自始當然無效"], "exp": ["✓A. §74Ⅰ：乘他人急迫、輕率或無經驗，使其為財產上之給付「或為給付之約定」而顯失公平者，法院得因利害關係人之聲請撤銷其法律行為或減輕其給付；不論尚未給付（只有約定）或已給付，均可聲請，正確。", "✗B. §74Ⅱ：聲請應於法律行為後一年內為之，此一年屬「除斥期間」（期間屆滿權利即消滅），並非「消滅時效」；選項誤稱消滅時效，錯誤。", "✗C. §74Ⅰ是由利害關係人「聲請法院」撤銷或減輕給付，而非以意思表示向相對人為之（錯誤、詐欺、脅迫的撤銷才是依§116以意思表示向相對人為之），此為重要區別。", "✗D. 暴利行為非當然無效，須利害關係人積極向法院「聲請撤銷」後，才失其效力；未聲請前契約仍有效。"]}, {"year": 111, "num": 23, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "滿 17 歲且未受監護或輔助宣告之甲男，其所為之下列何種行為，依法須得法定代理人之同意始為有效？", "opts": ["訂立遺囑為遺贈之行為", "純獲法律上利益之行為", "就他人之物所為之無權處分行為", "授予他人代理權之行為"], "exp": ["✗A. §1186Ⅱ 限制行為能力人（滿16歲）得為遺囑，無須法定代理人允許。", "✗B. §77但書 純獲法律上利益之行為不須法定代理人允許即有效。", "✗C. 無權處分之效力取決於權利人承認或取得處分權（§118），法定代理人同意無從補正處分權。", "✓D（本題答案）. 授權行為為單獨行為，非純獲利益，限制行為能力人須得法定代理人允許（§77）；欠缺者無效（§78）。", "★ 限制行為能力：原則須同意；例外純獲利益、日常必需、遺囑（16歲）。陷阱：「無權處分」要看權利人而非法代。"]}, {"year": 111, "num": 24, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於財團法人之敘述，下列何者正確？", "opts": ["財團法人得為公益或營利之目的而設立", "財團法人於設立登記前，應得主管機關之許可", "財團法人之最高意思機關為總會，且為必設之機關", "財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"], "exp": ["✗A. 民法僅在§45規定營利「社團」得依特別法取得法人資格，並無營利「財團」的設計；財團法人以捐助財產為基礎，依通說須以公益為目的，不得為營利目的，故「公益或營利均可」錯誤。", "✓B. §59：財團於登記前，應得主管機關之許可；即未經許可不得辦理設立登記，正確。", "✗C. 總會是社團法人的最高意思機關，財團法人無社員總會，其設立目的及章程由捐助人決定，無「總會」機關設計。", "✗D. §45：「以營利為目的之社團」，其取得法人資格依特別法（如公司法）之規定，適用對象是「社團」而非「財團」；財團法人並無此規定，選項張冠李戴，錯誤。"]}, {"year": 111, "num": 25, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列何者屬於當然無效之法律行為？", "opts": ["單獨虛偽意思表示而該情形為相對人所明知者", "詐欺之意思表示係由第三人所為，而相對人明知其事實或可得而知者", "無權利人就權利標的物為處分後，取得其權利者", "限制行為能力人用詐術使人信其為有行為能力人，所為之法律行為"], "exp": ["✓A. 依§86但書，單獨虛偽意思表示（心中保留），若相對人明知，則意思表示「無效」（當然無效），正確。", "✗B. §92Ⅰ但書：詐欺由第三人所為者，以相對人明知其事實或可得而知者為限，表意人始得「撤銷」其意思表示；撤銷前法律行為仍有效，屬「得撤銷」而非當然無效。", "✗C. 無權利人處分後取得其權利，該處分行為「溯及發生效力」（§118Ⅱ），即補正為有效，並非無效。", "✗D. 限制行為能力人用詐術，依§83，其法律行為「有效」，並非無效。"]}, {"year": 112, "num": 1, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "有關權利能力之敘述，下列何者錯誤？", "opts": ["人的權利能力始於出生終於死亡，因此胎兒尚未出生所以沒有權利能力", "人的權利能力不得拋棄，更不得轉讓", "法人除於法令或性質上之限制外，仍享有權利能力", "植物人仍享有權利能力"], "exp": ["✗A（本題答案）. 雖然「始於出生終於死亡」正確（§6），但推論「胎兒尚未出生所以沒有權利能力」不完全正確：§7規定胎兒以將來非死產者為限，關於個人利益之保護，視為既已出生（擬制有限度的權利能力），故「沒有權利能力」之說法過於絕對，為錯誤敘述，應選答案。", "✓B. 依§16，權利能力不得拋棄，此為人格之基本保障，正確。", "✓C. §26，法人在法令及性質限制範圍內有權利能力，正確。", "✓D. 植物人仍為生存的自然人，生命現象未終止，仍具完整權利能力，正確。"]}, {"year": 112, "num": 2, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關權利客體之敘述，下列何者錯誤？", "opts": ["甲未經乙的同意在乙的土地上種植樹木，該樹木為乙土地上之部分", "甲飼養一頭母牛，後來該母牛生下一頭小牛，小牛所有權仍屬於甲所有", "為收容災民而臨時拼裝之貨櫃屋，仍為定著物，性質上為不動產", "主物之處分效力及於從物，所以購買汽車之契約效力及於備胎"], "exp": ["✓A. 乙土地上尚未與土地分離的樹木，屬不動產之出產物，為該不動產之部分（§66Ⅱ）；甲未經同意種植，樹木附合於乙之土地而成為重要成分，由土地所有人乙取得所有權（§811：動產因附合為不動產重要成分者，不動產所有人取得動產所有權），正確。", "✓B. 小牛屬動物之產物，為天然孳息（§69Ⅰ）；有收取天然孳息權利之人（母牛所有人甲），於權利存續期間內取得與原物分離之孳息（§70Ⅰ），故小牛歸甲所有，正確。", "✗C（本題答案）. 不動產指土地及其定著物（§66Ⅰ）；定著物須固定附著於土地、具繼續性使用而非可隨時移動。臨時拼裝、可隨時移動的貨櫃屋欠缺「定著」性，不是定著物，性質上為動產，本選項說是不動產，錯誤，為應選答案。", "✓D. §68：非主物之成分、常助主物效用而同屬一人者為從物（Ⅰ）；主物之處分，及於從物（Ⅱ）。汽車為主物、備胎為從物，買賣汽車之效力及於備胎，正確。"]}, {"year": 112, "num": 3, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關限制行為能力之敘述，下列何者正確？", "opts": ["滿 16 歲之未成年人寫遺囑時，仍須經法定代理人同意，否則效力未定", "16 歲之甲偽造身分證，使相對人乙誤信甲已滿 18 歲，而與甲簽訂買賣契約，該買賣契約有效", "限制行為能力人為代理人時，代理人受領代理權仍須經法定代理人之同意", "法定代理人可以概括允許限制行為能力人為法律行為"], "exp": ["✗A. §1186Ⅱ明定，滿16歲之未成年人，「得自行訂立遺囑」（身分行為之特別規定），不須法定代理人同意，本選項與法條相反。", "✓B. 限制行為能力人使用詐術（偽造身分證），依§83，其法律行為有效（排除保護），正確。", "✗C. 代理人不以有行為能力為必要（§104），限制行為能力人受領代理權（代理人之地位）無須法定代理人同意，此為代理制度特別規定。", "✗D. §77本文：限制行為能力人為意思表示，應得法定代理人之「允許」。依學說，允許應就特定行為或特定範圍為之；若允許其為「一切」法律行為，等於使限制行為能力人取得完全行為能力，架空限制行為能力制度的保護目的，故不得概括允許，選項過於絕對，錯誤。"]}, {"year": 112, "num": 4, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？", "opts": ["通謀虛偽意思表示所為之法律行為", "因錯誤或誤傳之意思表示而為法律行為", "被詐欺而為意思表示之法律行為", "因暴利行為所為之法律行為"], "exp": ["✗A. 通謀虛偽意思表示依§87Ⅰ當然無效（但不得對抗善意第三人），無須撤銷。", "✗B. 因錯誤（§88）或傳達不實（§89）而撤銷，是以意思表示為之（§116Ⅰ：撤銷應以意思表示為之；相對人確定者向相對人為之，§116Ⅱ），並非向法院聲請，無須法院撤銷即生效力。", "✗C. 因詐欺、脅迫而撤銷（§92Ⅰ），同樣依§116以意思表示向相對人為之，無須向法院聲請。", "✓D. §74Ⅰ暴利行為，須由利害關係人向「法院聲請」撤銷（或減輕給付）才發生效力，與其他撤銷（以意思表示為之）不同，為應選答案，正確。"]}, {"year": 112, "num": 14, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "民法關於死亡宣告的規定，下列何者正確？", "opts": ["失蹤人失蹤滿三年後，法院得因利害關係人之聲請，為死亡之宣告", "受死亡宣告者，以判決內所確定死亡之時，推定其為死亡", "遺產稅捐徵收機關得為失蹤人向法院聲請死亡宣告", "死亡宣告會剝奪失蹤人之權利能力"], "exp": ["✗A. §8Ⅰ一般失蹤失蹤期間須滿「七年」（或特殊情形如危難中滿一年）始得聲請，三年不足，敘述錯誤。", "✓B. 依§9，受死亡宣告者，以判決內所確定死亡之時（通常為失蹤期間屆滿時），「推定」其為死亡（非確定死亡），正確。", "✗C. 依§8，死亡宣告之聲請人為「利害關係人或檢察官」，稅捐機關並非明文規定之聲請權人，敘述錯誤。", "✗D. 死亡宣告為「推定死亡」，失蹤人若仍生存，其權利能力不受影響，死亡宣告不剝奪權利能力，選項描述錯誤。"]}, {"year": 113, "num": 2, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "有關行為能力之敘述，下列何者正確？", "opts": ["年滿 30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力", "年滿 19 歲之乙可以獨自訂立買賣汽車之契約", "受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊", "15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"], "exp": ["✗A. 成年人有精神疾病，須經法院宣告監護/輔助，才影響行為能力；單純「患有精神疾病」並不當然喪失行為能力，須有法院的監護或輔助宣告。", "✓B. 現行民法（112年起）成年年齡為18歲，年滿19歲之乙已為完全行為能力人，可獨自訂立契約，正確。", "✗C. 受輔助宣告之人為「贈與」（非日常生活所必需），依§15-2Ⅰ，應經輔助人同意，不得自行為之，敘述錯誤。", "✗D. 丟棄（拋棄）財物屬單獨行為，15歲（限制行為能力人）未得法定代理人允許之單獨行為無效（§78），敘述錯誤。"]}, {"year": 113, "num": 10, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關意思表示之敘述，下列何者正確？", "opts": ["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係", "甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效", "甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示", "甲受丙脅迫而與之訂立互易契約，該契約當然無效"], "exp": ["✗A. 離婚為身分行為，須當事人有離婚的真意；通謀虛偽離婚欠缺離婚真意，依通謀虛偽意思表示之法理（§87Ⅰ：通謀而為虛偽意思表示者無效），離婚無效，婚姻關係仍存在（實務見解），故「已無婚姻關係」錯誤。", "✗B. 依§86但書，相對人明知表意人（甲）無真意，意思表示無效，贈與契約不成立，並非有效。", "✓C. 甲錯認對方身分為當事人資格之錯誤，依§88Ⅱ，若依交易上觀念認為重要，得撤銷；但撤銷前契約有效（§88為得撤銷非當然無效），正確。", "✗D. 依脅迫而為意思表示（§92）效果為「得撤銷」而非當然無效，在撤銷前契約仍有效，本選項「當然無效」描述錯誤。"]}, {"year": 113, "num": 16, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於 113 年 3 月 1 日因時效而消滅。下列敘述，何者正確？", "opts": ["因從屬於擔保債權，故抵押權隨之消滅", "抵押權人須於消滅時效完成後，5 年間實行其抵押權", "抵押權無消滅時效，可一直存續", "從此之後，抵押權之實行須經債務人同意"], "exp": ["✗A. 消滅時效完成，擔保債權之「請求力」消滅（債務人得拒絕給付），但債權本身及抵押權並未隨之消滅，抵押權仍存在（從屬性並非時效完成即同步消滅）。", "✓B. 依§880，抵押權所擔保之債權，其請求權已因時效消滅，如抵押權人於消滅時效完成後，5年間不實行其抵押權者，抵押權消滅，正確（此為§880的特別規定）。", "✗C. §880規定抵押權存在有期限限制（時效完成後5年不實行即消滅），並非永遠存續，敘述錯誤。", "✗D. 抵押權實行為抵押權人之權利，無須債務人同意，描述錯誤。"]}, {"year": 114, "num": 1, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "依我國民法有關死亡宣告之規定，下述何者錯誤？", "opts": ["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告", "失蹤人已年滿 80 歲，其失蹤期間應滿 3 年後，始得被聲請死亡宣告", "失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告", "受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"], "exp": ["✓A. 共有不動產之其他共有人，因失蹤人之財產狀況與其有法律上利益關係，屬利害關係人，得聲請死亡宣告，正確。", "✓B. 失蹤人年滿80歲，依§8Ⅱ，失蹤期間屆滿三年，即得聲請死亡宣告（縮短期間），正確。", "✗C（本題答案）. 撤銷死亡宣告須向「法院」聲請撤銷（家事事件），並非向「地檢署」聲請，兩者管轄機關不同，敘述錯誤，為應選答案。", "✓D. 死亡宣告係「推定」死亡，若實際仍生存，其權利能力不因此宣告而喪失，正確。"]}, {"year": 114, "num": 2, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？", "opts": ["受監護宣告之成年人，無行為能力", "成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告", "受監護宣告之成年人，仍保有完全之權利能力", "受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"], "exp": ["✓A. §15 受監護宣告之人無行為能力。", "✗B（本題答案）. 「辨識效果能力顯有不足」是輔助宣告之要件（§15-1）；監護宣告為不能辨識（§14）。", "✓C. §6 權利能力始於出生終於死亡，監護宣告不影響權利能力。", "✓D. 受輔助宣告之人欠缺輔助人同意之行為為效力未定（§15-2Ⅱ 準用§78至§83），並非無效。", "★ 監護＝「不能」→無行為能力；輔助＝「顯有不足」→限制性同意權，效力未定。陷阱：兩者要件互換。"]}, {"year": 114, "num": 3, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列敘述，何者與民法法人之規定並不相容？", "opts": ["民法關於公益社團法人之設立，係採取許可主義", "法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格", "法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利", "財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"], "exp": ["✓A. 公益社團法人採許可主義，須經主管機關許可（§46），正確。", "✓B. §40Ⅱ：法人至清算終結止，在清算之必要範圍內，視為存續，故解散後清算中仍有法人格，正確。", "✗C（本題答案）. 法人之權利能力確受「性質」限制（§26但書，專屬自然人之權利除外），但法人「並非無法享有任何人格權」：如名譽權（商譽）、名稱權等，法人均得享有，故「無法享有民法賦予自然人所有之人格權利」過於絕對，與民法規定不相容，為應選答案。", "✓D. §60Ⅰ但書：設立財團應訂立捐助章程，但以遺囑捐助者不在此限，故以遺囑捐助設立財團法人，無須另訂捐助章程（無遺囑執行人時，法院得依§60Ⅲ指定遺囑執行人），選項與民法規定相容，正確。"]}, {"year": 114, "num": 4, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲當選 A const TOTAL=107;
const SK='civlaw_official_a_v2';
let S={};
try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
const YEARS=[...new Set(QS.map(q=>q.year))].sort((a,b)=>a-b);
let aY='all',aF='all';
function isOK(q,L){return q.ans?L===q.ans:(q.acc?q.acc.includes(L):true)}
function gk(q){return q.year+'_'+q.num}
function getFilt(){
  return QS.filter(q=>{
    const k=gk(q),s=S[k];
    if(aY!=='all'&&q.year!==aY)return false;
    if(aF==='un')return!s;
    if(aF==='wrong')return s&&!s.ok;
    return true;
  });
}
function chips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  if(q.note){st.appendChild(mk('div','nl',q.note));}
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(isOK(q,L))o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  if(q.src==='ai'){ex.appendChild(mk('div','exp-line ainote','AI解析・條號已核對現行條文，考前以紙本六法為準'));}
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:isOK(q,ch)};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
