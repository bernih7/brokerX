const QUESTIONS = [{"year": 99, "qnum": 16, "stem": "下列有關公寓大廈營運與管理維護之敘述，何者錯誤？", "options": ["公寓大廈管理員以受僱人身分簽名或蓋章代收稅單即生送達效力", "管理服務人得同時受聘於二家以上之管理維護公司", "公寓大廈利害關係人於必要時，得請求閱覽或影印會計憑證", "管理委員之選任事項，不得以臨時動議提出"], "answer": "B", "explains": {"A": "管理員以受僱人身分代收稅單即生送達效力，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。管理服務人「不得」同時受聘於二家以上之管理維護公司，本選項方向相反，此為避免利益衝突及專責管理之強制規定★陷阱。", "C": "利害關係人於必要時得請求閱覽影印會計憑證，敘述正確，非本題答案。", "D": "管理委員選任事項不得以臨時動議提出，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第40條", "id": 1, "chapter": "E1"}, {"year": 99, "qnum": 23, "stem": "依公寓大廈管理條例第 7 條之規定，下列有關公寓大廈之約定專用部分的敘述何者錯誤？", "options": ["社區內各巷道不得為約定專用", "公寓大廈本身所占之地面視情況得為約定專用", "有固定使用方法，並屬區分所有權人生活利用上不可或缺之共用部分不得為約定專用", "公寓大廈屋頂之構造不得為約定專用"], "answer": "B", "explains": {"A": "社區內各巷道不得為約定專用，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。公寓大廈本身所占之地面「一律不得」為約定專用（非「視情況得」為約定專用），此為法定絕對禁止事項之一，本選項方向錯誤，屬★陷阱。", "C": "有固定使用方法且生活利用上不可或缺之共用部分不得為約定專用，敘述正確，非本題答案。", "D": "屋頂之構造不得為約定專用，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第7條", "id": 2, "chapter": "E1"}, {"year": 99, "qnum": 24, "stem": "住戶違反該公寓大廈規約設置廣告物，管理負責人或管理委員會應予制止，經制止而不遵從者，應報請主管機關依公寓大廈管理條例第 49 條第 1 項規定處理，該住戶並應於多久之內回復原狀？", "options": ["10天", "1個月", "3個月", "6個月"], "answer": "B", "explains": {"A": "數字錯誤，非10天。", "B": "正確。經制止不遵從者報請主管機關處理，該住戶應於「1個月內」回復原狀，此為違規設置廣告物之回復原狀期限核心數字。", "C": "數字錯誤，非3個月。", "D": "數字錯誤，非6個月。"}, "ref": "公寓大廈管理條例第9條、第49條", "id": 3, "chapter": "E1"}, {"year": 100, "qnum": 6, "stem": "依公寓大廈管理條例規定，下列對於供作共同使用部分之法定停車空間的敘述，何者是錯誤的？", "options": ["建商不得將未售出之停車空間，出租予區分所有權人以外之人", "建商不得單獨將停車空間售予未購買主建物之人", "區分所有權人不得分別單獨出售主建物或停車空間", "區分所有權人得單獨將停車空間售予同棟建築物之其他區分所有權人"], "answer": "A", "explains": {"A": "本題依考選部公告為一律給分（答A或D均給分），A選項就法規原意涉及未售出停車位出租限制之解釋有其爭議空間。", "B": "建商不得單獨將停車空間售予未購買主建物之人，此為法定停車空間應隨主建物一併移轉之基本原則，敘述正確，非本題答案。", "C": "區分所有權人不得分別單獨出售主建物或停車空間，敘述正確，非本題答案。", "D": "本題依考選部公告為一律給分，D選項就同棟其他區分所有權人間之停車位移轉是否受限亦有解釋空間，建議對照官方詳解確認。"}, "ref": "公寓大廈管理條例第4條；⚠️本題官方公告為一律給分（答A或D均給分），無強制單一正解", "id": 4, "chapter": "E1"}, {"year": 100, "qnum": 7, "stem": "依公寓大廈管理條例規定，何者不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔？", "options": ["停車位", "約定專用部分", "專有部分", "約定共用部分"], "answer": "C", "explains": {"A": "停車位非本條規範主體本身，題目所問為權利分離移轉之限制主體。", "B": "約定專用部分非本條限制之主體。", "C": "正確。「專有部分」不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔，此為維護建物產權整體性之強制規定。", "D": "約定共用部分非本條限制之主體。"}, "ref": "公寓大廈管理條例第4條", "id": 5, "chapter": "E1"}, {"year": 100, "qnum": 9, "stem": "公寓大廈之起造人或區分所有權人應依使用執照所記載之用途及測繪規定，辦理何種登記？", "options": ["建物所有權第一次登記", "土地總登記", "所有權變更登記", "管理者變更登記"], "answer": "A", "explains": {"A": "正確。起造人或區分所有權人應依使用執照所記載用途及法定測繪規定，辦理「建物所有權第一次登記」（即保存登記）。", "B": "土地總登記為土地法規範之另一登記類型，非本題情形。", "C": "所有權變更登記適用於已登記後之產權變動，非首次登記情形。", "D": "管理者變更登記非本題情形之法定登記類型。"}, "ref": "公寓大廈管理條例第57條", "id": 6, "chapter": "E1"}, {"year": 100, "qnum": 10, "stem": "法院判決區分所有權人出讓區分所有權及基地所有權應有部分確定，經管理委員會聲請法院拍賣之所得，除其他法律另有規定外，依公寓大廈管理條例規定，其所積欠應分擔之費用的受償順序如何？", "options": ["與普通抵押權同等順位", "與一般債權同等順位", "與最高限額抵押權同等順位", "與第一順位抵押權同等順位"], "answer": "D", "explains": {"A": "應與「第一順位抵押權」同順位，非普通抵押權，順位層級錯誤。", "B": "應優先於一般債權，非與一般債權同順位。", "C": "應與「第一順位抵押權」同順位，非最高限額抵押權（性質類型不同）。", "D": "正確。管理委員會聲請法院拍賣所得，積欠應分擔費用之受償順序與「第一順位抵押權」同，此為公寓大廈管理費優先受償權之核心規定，全科高頻。"}, "ref": "公寓大廈管理條例第24條之1（第22條）", "id": 7, "chapter": "E1"}, {"year": 101, "qnum": 4, "stem": "依公寓大廈管理條例規定，公寓大廈之重建，原則上不須經下列何者之同意？", "options": ["基地所有權人", "地上權人", "典權人", "抵押權人"], "answer": "D", "explains": {"A": "公寓大廈重建應經基地所有權人同意，非本題答案。", "B": "公寓大廈重建應經地上權人同意，非本題答案。", "C": "公寓大廈重建應經典權人同意，非本題答案。", "D": "正確。公寓大廈重建原則上須經「全體區分所有權人及基地所有權人、地上權人或典權人」之同意，法定列舉範圍「不含抵押權人」（抵押權人僅有擔保物權，非用益物權人，其權益因重建後之新建物仍存有抵押權效力延續而受保障，故無須另行取得其同意），此為列舉主體範圍之★高頻陷阱。"}, "ref": "公寓大廈管理條例第13條", "id": 8, "chapter": "E1"}, {"year": 101, "qnum": 18, "stem": "依公寓大廈管理條例規定，下列敘述何者最正確？", "options": ["約定共用部分係指公寓大廈共用部分經約定供共同使用者", "約定專用部分係指公寓大廈專有部分經約定供特定區分所有權人使用者", "共用部分係指公寓大廈之一部分，具有使用上之獨立性，且為區分所有之標的者", "區分所有係指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權"], "answer": "D", "explains": {"A": "約定共用部分之正確定義應為「專有部分」經約定供共同使用者（非「共用部分」經約定供共同使用，共用部分本身即為共同使用，無須另行約定），定義主體錯誤。", "B": "約定專用部分之正確定義應為「共用部分」經約定供特定區分所有權人使用者（非「專有部分」經約定，專有部分本即專屬區分所有權人使用，無須另行約定），定義主體錯誤（本選項與A選項恰好將約定專用/約定共用之定義主體互換）。", "C": "此為「專有部分」之定義描述（具構造上使用上獨立性且為區分所有標的者），非「共用部分」之定義（共用部分係指專有部分以外供共同使用之部分），定義主體混淆。", "D": "正確。區分所有之法定定義：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權，定義完整正確。"}, "ref": "公寓大廈管理條例第3條", "id": 9, "chapter": "E1"}, {"year": 102, "qnum": 2, "stem": "專有部分之共同壁內管線損壞，若係因不可歸責共同壁雙方之事由所致者，其維修費用應由何人負擔？", "options": ["由維修之住戶自行負擔", "由維修之區分所有權人自行負擔", "由該共同壁雙方之區分所有權人共同負擔", "由全體區分所有權人共同負擔，並得由公共基金支付"], "answer": "C", "explains": {"A": "非可歸責特定人之事由所致，不應由單一住戶自行負擔，本選項主體及分擔方式錯誤。", "B": "非可歸責特定人之事由所致，不應由單一區分所有權人自行負擔，分擔方式錯誤。", "C": "正確。專有部分共同壁內管線損壞，非因可歸責於任一方之事由所致者，維修費用由該共同壁「雙方」之區分所有權人「共同」負擔，此為共同壁維修費用分擔之核心規定。", "D": "共同壁維修費用僅涉及該共同壁「雙方」（相鄰兩戶），非「全體」區分所有權人共同負擔，範圍過大，此為主體範圍錯誤之陷阱。"}, "ref": "公寓大廈管理條例第12條", "id": 10, "chapter": "E1"}, {"year": 102, "qnum": 16, "stem": "公寓大廈約定專用部分之修繕、管理及維護，由何人負擔其費用？", "options": ["由管理委員會以公共基金支付", "由該約定專用部分之使用人自行負擔", "由區分所有權人按其共有之應有部分比例分擔", "由住戶全體平均負擔"], "answer": "B", "explains": {"A": "約定專用部分費用不由公共基金支付（公共基金係用於共用部分及約定共用部分），主體及費用來源錯誤。", "B": "正確。約定專用部分之修繕、管理、維護，由「該約定專用部分之使用人」自行負擔其費用，此為約定專用部分費用歸屬之核心規定（使用者付費原則）。", "C": "依比例分擔適用於共用部分（非約定專用部分），主體性質錯誤。", "D": "住戶全體平均負擔非約定專用部分之費用分擔方式，此為虛構分擔方式之陷阱。"}, "ref": "公寓大廈管理條例第10條", "id": 11, "chapter": "E1"}, {"year": 102, "qnum": 21, "stem": "下列何者非公寓大廈管理委員會之職務？", "options": ["住戶共同事務應興革事項之建議", "公寓大廈共用部分之重大修繕或改良", "公寓大廈及其周圍之安全及環境維護事項", "管理服務人之委任、僱傭及監督"], "answer": "B", "explains": {"A": "住戶共同事務應興革事項之「建議」（非「決定」）屬管理委員會職務之一，非本題答案。", "B": "正確答案。公寓大廈共用部分之「重大修繕或改良」須依「區分所有權人會議」之決議為之，非管理委員會逕行決定之職務範圍，管理委員會僅負責日常維護管理及執行區權會決議，此為本科重複命題率最高之核心觀念。", "C": "公寓大廈及周圍安全環境維護事項屬管理委員會職務之一，非本題答案。", "D": "管理服務人之委任僱傭及監督屬管理委員會職務之一，非本題答案。"}, "ref": "公寓大廈管理條例第11條、第36條", "id": 12, "chapter": "E1"}, {"year": 103, "qnum": 13, "stem": "甲、乙、丙、丁為 A 公寓大廈的區分所有權人，並為基地的共有人，乙將其基地應有部分與專有部分賣給戊，丁得否主張先買權？", "options": ["得依民法規定主張先買權", "得依土地法規定主張先買權", "得依公寓大廈管理條例規定主張先買權", "不得就基地應有部分主張先買權"], "answer": "D", "explains": {"A": "民法共有物優先購買權（第426條之2）之適用，因公寓大廈基地應有部分依法「應隨同專有部分一併移轉」，不得單獨處分，故不生土地應有部分單獨優先購買之問題。", "B": "土地法第34條之1優先購買權適用於一般共有土地，惟公寓大廈基地應有部分已依法「與專有部分結合為一體」不得分離移轉，性質特殊，不適用一般共有優先購買權規定。", "C": "公寓大廈管理條例未賦予其他區分所有權人就基地應有部分之優先購買權。", "D": "正確。基地應有部分依法應隨同專有部分「一併」移轉，乙係將基地應有部分「與」專有部分一同出賣予戊（非單獨處分基地應有部分），此非「共有物應有部分單獨讓與」之情形，丁不得就基地應有部分主張先買權，此為公寓大廈基地權利與專有部分不可分離特性之核心觀念。"}, "ref": "公寓大廈管理條例第4條、民法第799條", "id": 13, "chapter": "E1"}, {"year": 103, "qnum": 15, "stem": "甲公寓大廈管理委員會欲對積欠管理費的住戶乙行使權利，問甲得否成為訴訟上的原告？", "options": ["得，因為甲有當事人能力", "得，因為甲有權利能力", "不得，因為甲無權利能力", "不得，因為甲並非法人"], "answer": "A", "explains": {"A": "正確。管理委員會雖非法人，不具備完整之「權利能力」，惟公寓大廈管理條例特別明文賦予管理委員會「當事人能力」（訴訟法上得為原告或被告之資格），故甲得為訴訟上之原告，此為訴訟法上「非法人團體有當事人能力」之特殊規定。", "B": "管理委員會本身「不具備」一般民法上之權利能力（非法人，無法如自然人或法人般享有一般權利義務），本選項理由錯誤（雖結論方向巧合，但理由與法律規定不符，正確理由應為「有當事人能力」而非「有權利能力」）。", "C": "管理委員會雖無權利能力，但法律特別賦予其當事人能力，仍得為訴訟上之原告，本選項結論錯誤。", "D": "管理委員會雖非法人，但法律特別賦予其當事人能力，此為法定例外規定，本選項理由雖屬事實（確非法人）但結論錯誤（仍得為原告）。"}, "ref": "公寓大廈管理條例第38條", "id": 14, "chapter": "E1"}, {"year": 103, "qnum": 17, "stem": "A 公寓大廈規約約定住戶不得養貓，新搬進的住戶甲不願遵守，有無理由？", "options": ["有理由，因為依相關法規規定，住戶可以在公寓大廈中養寵物", "有理由，因為甲未參與之前規約的討論", "有理由，因為甲在買受前，無從知悉該規約的內容", "無理由，因為甲應繼受合法規約所定事項"], "answer": "D", "explains": {"A": "公寓大廈管理條例並未賦予住戶「絕對」飼養寵物之權利，飼養動物之限制得由規約另行約定禁止（法令或規約另有禁止規定時從其規定），本選項理由不成立。", "B": "區分所有權之繼受人（新住戶）縱未參與規約訂定之討論，依法仍應遵守合法有效之規約，此為規約對繼受人之拘束力設計，理由不成立。", "C": "區分所有權之繼受人「應於繼受前」向管理負責人或管委會請求閱覽規約（此為繼受人之法定義務），不得以未事先查閱為由主張不知情而免責，理由不成立。", "D": "正確。甲身為區分所有權之繼受人，依法應繼受合法規約所定之一切權利義務事項（含禁養寵物之特別約定，惟該約定須已載明於規約），無理由拒絕遵守。"}, "ref": "公寓大廈管理條例第16條、第24條", "id": 15, "chapter": "E1"}, {"year": 103, "qnum": 18, "stem": "下列關於公寓大廈、區分所有建物的敘述，何者正確？", "options": ["公寓大廈之建築業者甲，不得將共用部分，包含法定空地、法定停車空間及法定防空避難設備，讓售於特定人乙", "公寓大廈有13歲兒童之住戶丙，外牆開口部或陽臺得設置不妨礙逃生且不突出外牆面之防墜設施", "規約之內容顯失公平者，不同意規約的區分所有人丁應於規約成立後六個月內訴請法院撤銷之", "公寓大廈起造人戊，非經領得使用執照，不得辦理銷售"], "answer": "A", "explains": {"A": "正確。共用部分（含法定空地、法定停車空間及法定防空避難設備等）依法屬全體區分所有權人共有，建築業者不得將之讓售於特定人（此為維護共用部分全體共有性質之強制規定）。", "B": "防墜設施特別放寬對象限於「12歲以下」兒童之住戶，本題丙之子女已滿13歲（超過門檻），不符合逕行設置之特別放寬要件，須依一般規定經同意始得設置。", "C": "規約內容顯失公平之撤銷訴請期限應為「規約成立後3個月內」，而非6個月，數字錯誤（此比照民法暴利行為或顯失公平條款之短期除斥期間精神）。", "D": "起造人應「非經領得建造執照」（而非「使用執照」），不得辦理銷售（即取得建照即可銷售預售�屋，非須等到取得使用執照），此為預售屋銷售起點之核心觀念，本選項執照類型錯誤。"}, "ref": "公寓大廈管理條例第4條、第8條、第58條", "id": 16, "chapter": "E1"}, {"year": 104, "qnum": 16, "stem": "依公寓大廈管理條例之規定，公寓大廈之住戶應遵守事項，下列敘述何者正確？", "options": ["於維護、修繕專有部分、約定專用部分或行使其權利時，不得妨害其住戶之安寧、安全及衛生", "他住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，得拒絕", "管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，得拒絕", "於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，不需經管理負責人或管理委員會之同意後為之"], "answer": "A", "explains": {"A": "正確。住戶於維護修繕專有部分約定專用部分或行使權利時，不得妨害其他住戶之安寧、安全及衛生，此為住戶相互尊重之基本義務規定。", "B": "住戶對於他住戶因維護修繕或設置管線而須進入使用其專有部分或約定專用部分時，「不得拒絕」（除有正當理由外），本選項方向相反。", "C": "住戶對於管理負責人或管委會因維護修繕共用部分或設置管線而須進入使用其專有部分或約定專用部分時，「不得拒絕」，本選項方向相反。", "D": "於維護修繕或設置管線而須使用共用部分時，「應」經管理負責人或管理委員會之同意後為之，本選項方向相反。"}, "ref": "公寓大廈管理條例第6條", "id": 17, "chapter": "E1"}, {"year": 104, "qnum": 17, "stem": "依公寓大廈管理條例之規定，公寓大廈約定專用部分之修繕、管理、維護，由何人為之，並負擔其費用？", "options": ["管理委員會", "管理負責人", "管理服務人", "約定專用部分之使用人"], "answer": "D", "explains": {"A": "管理委員會非約定專用部分之修繕管理維護主體（此為共用部分之管理主體）。", "B": "管理負責人非約定專用部分之修繕管理維護主體。", "C": "管理服務人受僱協助管理事務執行，非約定專用部分修繕管理維護之法定負責主體。", "D": "正確。約定專用部分之修繕、管理、維護，由「該約定專用部分之使用人」為之，並負擔其費用，此為使用者付費原則之核心規定。"}, "ref": "公寓大廈管理條例第10條", "id": 18, "chapter": "E1"}, {"year": 104, "qnum": 18, "stem": "依公寓大廈管理條例之規定，公寓大廈專有部分之共同壁及樓地板或其內之管線，其維修費用如何負擔？", "options": ["由維修之區分所有權人負擔", "由維修之住戶負擔", "由該共同壁雙方或樓地板上下方之區分所有權人共同負擔", "由該共同壁雙方或樓地板上下方之住戶共同負擔"], "answer": "C", "explains": {"A": "非因可歸責特定人事由所致者，不應由單一區分所有權人負擔。", "B": "「住戶」非法定分擔主體（法定用語為「區分所有權人」，因涉及財產所有權之修繕費用分擔，主體應為所有權人非單純使用之住戶）。", "C": "正確。專有部分之共同壁及樓地板或其內管線維修費用，由該共同壁雙方或樓地板上下方之「區分所有權人」共同負擔，此為共同壁及樓地板維修費用分擔之核心規定。", "D": "分擔主體應為「區分所有權人」，非「住戶」，主體用語錯誤。"}, "ref": "公寓大廈管理條例第12條", "id": 19, "chapter": "E1"}, {"year": 104, "qnum": 19, "stem": "依公寓大廈管理條例之規定，公寓大廈之重建，應經下列何者之同意？", "options": ["全體區分所有權人及基地所有權人、地上權人或抵押權人", "全體區分所有權人及基地所有權人、地上權人或典權人", "全體區分所有權人及全體住戶、地上權人或抵押權人", "全體區分所有權人及全體住戶、地上權人或典權人"], "answer": "B", "explains": {"A": "應為「典權人」（而非「抵押權人」），法定列舉主體不含抵押權人，此為主體混淆之高頻陷阱。", "B": "正確。公寓大廈重建應經「全體區分所有權人」及「基地所有權人、地上權人或典權人」之同意，法定列舉主體完整正確。", "C": "應為「基地所有權人」（而非「全體住戶」），且不含抵押權人，主體錯誤。", "D": "應為「基地所有權人」（而非「全體住戶」），主體錯誤。"}, "ref": "公寓大廈管理條例第13條", "id": 20, "chapter": "E1"}, {"year": 104, "qnum": 20, "stem": "張先生在甲社區居住 20 年，每年均按月繳交管理費納入公共基金，今年張先生因搬家而出售位於該社區的房地產給陳先生，請問張先生對於該公共基金的權利，依公寓大廈管理條例之規定，應如何處理？", "options": ["用剩的部分退回給張先生", "隨著該房地產移轉給陳先生", "抵繳張先生應負擔的銀行貸款", "抵繳張先生應負擔的搬家費用"], "answer": "B", "explains": {"A": "公共基金權利「不」隨區分所有權移轉而個別退還，本選項方向錯誤。", "B": "正確。區分所有權人對於公共基金之權利，應「隨區分所有權之移轉而移轉」，即張先生出售房地產予陳先生時，其對公共基金之權利一併移轉予陳先生，此為公共基金屬物從屬性之核心規定。", "C": "公共基金不得用於抵繳個人銀行貸款，此為虛構用途之陷阱。", "D": "公共基金不得用於抵繳個人搬家費用，此為虛構用途之陷阱。"}, "ref": "公寓大廈管理條例第18條", "id": 21, "chapter": "E1"}, {"year": 105, "qnum": 33, "stem": "公寓大廈內連通數個專有部分之樓梯間，依公寓大廈管理條例相關規定屬於何種型態？", "options": ["分別所有部分", "共同公共部分", "共用部分", "獨立部分"], "answer": "C", "explains": {"A": "「分別所有部分」非本法正式法律用語（法定用語為「專有部分」）。", "B": "「共同公共部分」非本法正式法律用語（法定用語為「共用部分」）。", "C": "正確。連通數個專有部分之樓梯間，性質上屬供共同使用之部分，歸類為「共用部分」（且屬法定不得約定專用之項目之一）。", "D": "「獨立部分」非本法正式法律用語。"}, "ref": "公寓大廈管理條例第3條、第7條", "id": 22, "chapter": "E1"}, {"year": 105, "qnum": 34, "stem": "關於公寓大廈起造人行為規範之敘述，下列何者錯誤？", "options": ["起造人非經領得建造執照，不得辦理銷售", "起造人應就領得使用執照1年內之管理維護事項，提列一定比例金額作為公共基金，並於使用執照申請時，繳交各地方主管機關公庫代收之證明", "起造人應移交公寓大廈共用部分及設施予管理委員會或管理負責人", "起造人得將法定停車空間讓售於特定人，以增加公共基金收入來源"], "answer": "D", "explains": {"A": "起造人非經領得建造執照不得辦理銷售，敘述正確，非本題答案。", "B": "起造人應提列公共基金並於使用執照申請時繳交公庫代收證明，敘述正確，非本題答案。", "C": "起造人應移交共用部分及設施予管委會或管理負責人，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。法定停車空間（法定空地、防空避難設備等）屬「共用部分」，依法「不得」讓售於特定人（此為維護全體共有性質之強制規定），本選項稱得為增加公共基金收入來源而讓售，虛構不當理由使違法行為正當化，屬★陷阱。"}, "ref": "公寓大廈管理條例第4條、第18條、第57條、第58條", "id": 23, "chapter": "E1"}, {"year": 106, "qnum": 33, "stem": "公寓大廈共用部分不得獨立使用供作專有部分，其為下列何者不得作為約定專用部分？", "options": ["公寓大廈本身所占之地面", "社區內各巷道、防火巷弄", "非連通數個專有部分之樓梯或走廊", "公寓大廈之主要梁柱之構造"], "answer": "C", "explains": {"A": "公寓大廈本身所占地面不得為約定專用，非本題答案。", "B": "社區內各巷道防火巷弄不得為約定專用，非本題答案。", "C": "正確答案。法定禁止約定專用之樓梯或走廊，係限於「連通數個專有部分之」樓梯或走廊，「非連通數個專有部分」（即僅供單一或少數特定專有部分通行之樓梯走廊）之樓梯或走廊，「不在」法定禁止約定專用範圍內，得為約定專用部分，本選項描述之情形恰為「可」約定專用之情形，非「不得」約定專用者。", "D": "公寓大廈主要梁柱之構造不得為約定專用，非本題答案。"}, "ref": "公寓大廈管理條例第7條", "id": 24, "chapter": "E1"}, {"year": 106, "qnum": 36, "stem": "專有部分之樓地板維修時，原則上維護費用應由誰負擔？", "options": ["樓地板上下方區分所有權人，共同負擔", "全體區分所有權人，共同負擔", "由樓地板上方之區分所有權人負擔", "由公寓大廈公共基金負擔"], "answer": "A", "explains": {"A": "正確。專有部分之樓地板（非因可歸責特定人事由所致者）維修費用，由「樓地板上下方」之區分所有權人共同負擔，此為與共同壁維修規定相同法理之核心規定。", "B": "應由「樓地板上下方」（相鄰兩戶）而非「全體」區分所有權人共同負擔，範圍過大。", "C": "應由「上下方」（雙方）而非僅「上方」單方負擔，範圍不完整。", "D": "公共基金非樓地板維修費用之來源（此屬專有部分範疇之維修費用，非公共基金支付範圍）。"}, "ref": "公寓大廈管理條例第12條", "id": 25, "chapter": "E1"}, {"year": 106, "qnum": 37, "stem": "公寓大廈住戶積欠應繳納之公共基金或應分擔之費用，下列何者情形管理委員會得請求法院命其給付？", "options": ["已逾二期，經定相當期間催告仍不給付者，得向法院起訴請求", "雖金額尚未相當，仍可向法院起訴請求", "只要一逾期未繳，即可向法院起訴請求", "視住戶態度決定催討與否或由管理委員會自行吸收"], "answer": "A", "explains": {"A": "正確。住戶積欠應繳納之公共基金或應分擔費用，至少「逾二期」或達相當金額，經定相當期間催告仍不給付者，管理負責人或管委會得訴請法院命其給付應繳金額及遲延利息，此為全科高頻數字（逾二期）之核心規定。", "B": "須「已逾二期或達相當金額」，非「金額尚未相當」即可起訴，要件不符。", "C": "須「逾二期」，非「一逾期未繳」即可起訴，此為期數要件之陷阱。", "D": "法定有明確之訴請給付要件及程序，非任意視住戶態度決定，此為虛構彈性處理方式之陷阱。"}, "ref": "公寓大廈管理條例第21條", "id": 26, "chapter": "E1"}, {"year": 107, "qnum": 15, "stem": "依公寓大廈管理條例規定，有關公寓大廈外牆開口部或陽台設置防墜設施的條件，下列何者錯誤？", "options": ["有十二歲以下兒童之住戶", "有六十五歲以上老人之住戶", "防墜設施須不妨礙逃生且不突出外牆面", "應經管理委員會之同意"], "answer": "D", "explains": {"A": "有十二歲以下兒童之住戶為法定得逕行設置防墜設施之對象，敘述正確，非本題答案。", "B": "正確答案之一（錯誤敘述）。法定得逕行設置防墜設施之對象限於「十二歲以下兒童」之住戶，「不含」六十五歲以上老人之住戶（老人安全防墜非本條特別放寬之對象範圍），此為對象範圍擴大之陷阱。", "C": "防墜設施須不妨礙逃生且不突出外牆面，此為法定要件，敘述正確，非本題答案。", "D": "正確答案之一（錯誤敘述）。有12歲以下兒童之住戶設置防墜設施，法律特別規定「無庸經」管理委員會或區分所有權人會議決議同意，即得逕行設置（惟設置理由消失時應予改善回復原狀），本選項稱應經管委會同意，方向相反，此為本條例特別放寬規定之核心陷阱。⚠️本題官方標準答案為D，惟B選項內容亦有明顯錯誤之處，建議對照官方詳解確認唯一標準答案。"}, "ref": "公寓大廈管理條例第8條；⚠️本題B、D選項皆涉及明顯之錯誤描述，officI標準答案為D，建議對照官方詳解確認出題設計原意", "id": 27, "chapter": "E1"}, {"year": 107, "qnum": 17, "stem": "依公寓大廈管理條例之規定，公寓大廈之起造人或區分所有權人應依使用執照所記載之用途及法定之測繪規定，辦理建物所有權第一次登記。下列敘述何者錯誤？", "options": ["獨立建築物所有權之牆壁，以牆之外緣為界", "建築物共用之牆壁，以牆壁之中心為界", "附屬建物以其外緣為界辦理登記", "無隔牆設置者，以建築執照竣工平面圖區分範圍為界，其面積應包括四周牆壁之厚度"], "answer": "D", "explains": {"A": "獨立建築物所有權之牆壁以牆之外緣為界，敘述正確，非本題答案。", "B": "建築物共用之牆壁以牆壁之中心為界，敘述正確，非本題答案。", "C": "附屬建物以其外緣為界辦理登記，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。無隔牆設置者，以建築執照竣工平面圖區分範圍為界，其面積「不包括」（而非「應包括」）四周牆壁之厚度，本選項方向相反，此為登記測繪細則之★陷阱。"}, "ref": "公寓大廈管理條例第57條", "id": 28, "chapter": "E1"}, {"year": 107, "qnum": 18, "stem": "公寓大廈共用部分原則上不得獨立使用供做專有部分，依公寓大廈管理條例之規定，下列何者屬得為約定專用部分：", "options": ["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄", "無固定使用方法，非屬區分所有權人生活利用上不可或缺之共用部分", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "公寓大廈本身所占之地面"], "answer": "B", "explains": {"A": "連通數個專有部分之走廊樓梯及通路門廳、社區巷道防火巷弄，皆屬法定不得約定專用之項目，非本題答案。", "B": "正確。「無固定使用方法，非屬區分所有權人生活利用上不可或缺之共用部分」，係法定禁止約定專用之「反面」情形（法定禁止者為「有」固定使用方法且「屬」生活利用上不可或缺者），因此「無固定使用方法且非不可或缺」之共用部分「得」為約定專用部分。", "C": "公寓大廈基礎主要樑柱承重牆壁樓地板及屋頂構造，屬法定不得約定專用之項目，非本題答案。", "D": "公寓大廈本身所占之地面，屬法定不得約定專用之項目，非本題答案。"}, "ref": "公寓大廈管理條例第7條", "id": 29, "chapter": "E1"}, {"year": 107, "qnum": 19, "stem": "依公寓大廈管理條例之規定，共用部分指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者。關於共用部分，下列敘述何者錯誤？", "options": ["專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔", "管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕", "各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會之決定為之"], "answer": "D", "explains": {"A": "專有部分不得與共用部分應有部分及基地權利應有部分分離移轉，敘述正確，非本題答案。", "B": "住戶不得拒絕管理負責人或管委會因維護修繕而進入使用其專有/約定專用部分，敘述正確，非本題答案。", "C": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」之決議為之，而非「管理委員會之決定」，此為本科重複命題率最高之核心觀念，多次重複命題。"}, "ref": "公寓大廈管理條例第4條、第6條、第9條、第11條", "id": 30, "chapter": "E1"}, {"year": 108, "qnum": 22, "stem": "下列何者，得為公寓大廈約定專用部分？", "options": ["連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳", "社區內各巷道、防火巷弄", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "樓頂平臺"], "answer": "D", "explains": {"A": "連通數個專有部分之走廊或樓梯及通路門廳，屬法定不得約定專用之項目，非本題答案。", "B": "社區內各巷道防火巷弄，屬法定不得約定專用之項目，非本題答案。", "C": "公寓大廈基礎主要樑柱承重牆壁樓地板及屋頂構造，屬法定不得約定專用之項目，非本題答案。", "D": "正確。「樓頂平臺」非法定列舉禁止約定專用之項目，實務上樓頂平臺常見經規約或區分所有權人會議決議約定供特定住戶（如頂樓住戶）使用，屬得為約定專用部分之典型情形。"}, "ref": "公寓大廈管理條例第7條", "id": 31, "chapter": "E1"}, {"year": 109, "qnum": 13, "stem": "公寓大廈應成立管理委員會或推選管理負責人。下列何種管理委員，不受連選得連任一次之限制？", "options": ["主任委員", "監察委員", "財務委員", "消防委員"], "answer": "D", "explains": {"A": "主任委員之任期屆滿，連選得連任「一次」，受連任次數限制，非本題答案。", "B": "監察委員之任期屆滿，連選得連任「一次」，受連任次數限制，非本題答案。", "C": "財務委員之任期屆滿，連選得連任「一次」，受連任次數限制，非本題答案。", "D": "正確答案。「消防委員」非法定明文限制連任次數之特定職務類型（法定明確限制連任一次者為「主任委員、財務委員及監察委員」三類核心職務），一般管理委員（含消防委員等其他分工職務）任期屆滿「連選得連任」，不受連任一次之次數限制，此為特定職務與一般委員連任規則不同之★陷阱。"}, "ref": "公寓大廈管理條例第29條", "id": 32, "chapter": "E1"}, {"year": 111, "qnum": 18, "stem": "公寓大廈共用部分不得獨立使用供做專有部分。依公寓大廈管理條例之規定，其為特定情形者，並不得為約定專用部分。下列情形非屬前述之特定情形？", "options": ["公寓大廈本身所占之地面", "公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之專用部分", "連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄"], "answer": "C", "explains": {"A": "公寓大廈本身所占之地面，屬法定不得約定專用之特定情形，非本題答案。", "B": "公寓大廈基礎主要樑柱承重牆壁樓地板及屋頂構造，屬法定不得約定專用之特定情形，非本題答案。", "C": "正確答案。法定條文原文應為「其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之『共用』部分」（而非「專用」部分），本選項用詞「專用部分」與法條原文「共用部分」不符（此性質上本即矛盾：若已屬「專用部分」性質，自無「不得約定專用」之問題，法條規範對象應為「共用部分」中具特定特性者），此為關鍵用詞替換之★陷阱。", "D": "連通數個專有部分之走廊樓梯及通路門廳、社區巷道防火巷弄，屬法定不得約定專用之特定情形，非本題答案。"}, "ref": "公寓大廈管理條例第7條", "id": 33, "chapter": "E1"}, {"year": 111, "qnum": 19, "stem": "依公寓大廈管理條例之規定，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔之費用，至少逾多少期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付應繳之金額及遲延利息？", "options": ["一期", "二期", "三期", "六期"], "answer": "B", "explains": {"A": "數字錯誤，非一期。", "B": "正確。住戶積欠應繳納之公共基金或應分擔費用，至少「逾二期」或達相當金額，經催告仍不給付者，管理負責人或管委會得訴請法院命其給付，此為高頻數字，須與強制遷離門檻（積欠達區分所有權總價1%）區辨。", "C": "數字錯誤，非三期。", "D": "數字錯誤，非六期。"}, "ref": "公寓大廈管理條例第21條", "id": 34, "chapter": "E1"}, {"year": 112, "qnum": 8, "stem": "有關公寓大廈周圍上下、外牆面設置防墜設施之規定，下列何者錯誤？", "options": ["須公寓大廈有十二歲以下兒童或六十歲以上老人之住戶", "須於外牆開口部或陽臺設置", "防墜設施須不妨礙逃生且不突出外牆面", "防墜設施設置後，設置理由消失且不符公寓大廈管理條例之限制者，區分所有權人應予改善或回復原狀"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。法定得逕行設置防墜設施之對象僅限「十二歲以下兒童」之住戶，「不含」六十歲以上老人之住戶，本選項擴大對象範圍，此為本科重複出現（與107年-15題同類型）之★高頻陷阱。", "B": "須於外牆開口部或陽臺設置，敘述正確，非本題答案。", "C": "防墜設施須不妨礙逃生且不突出外牆面，敘述正確，非本題答案。", "D": "設置理由消失者應予改善或回復原狀，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第8條", "id": 35, "chapter": "E1"}, {"year": 112, "qnum": 11, "stem": "依公寓大廈管理條例規定，有關起造人責任之敘述，下列何者錯誤？", "options": ["就公寓大廈領得使用執照一年內之管理維護事項，起造人應按工程造價一定比例或金額提列公共基金", "公寓大廈之起造人，非經領得建造執照，不得辦理銷售", "公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約", "起造人應將公寓大廈共用部分、約定共用部分與其附屬設施設備等，確認其功能正常無誤後，移交管理委員會或管理負責人"], "answer": "C", "explains": {"A": "起造人應就領得使用執照1年內之管理維護事項按工程造價比例提列公共基金，敘述正確，非本題答案。", "B": "起造人非經領得建造執照不得辦理銷售，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。起造人申請建造執照時，應檢附之文件為專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及「規約草約」（而非「規約」本身，因規約須經區分所有權人會議正式決議始成立，起造人於申請建照階段僅能提出「草約」供參考），用詞精確度錯誤，此為★陷阱。", "D": "起造人應將共用部分約定共用部分及附屬設施設備確認功能正常後移交管委會或管理負責人，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第56條、第57條、第58條", "id": 36, "chapter": "E1"}, {"year": 112, "qnum": 13, "stem": "關於公寓大廈管理維護公司之執業，下列何者正確？", "options": ["應經直轄市、縣（市）政府許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經直轄市、縣（市）政府許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業", "應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業"], "answer": "D", "explains": {"A": "許可及登記證核發機關皆應為「中央主管機關」，非「直轄市、縣（市）政府」，機關層級錯誤。", "B": "許可機關應為「中央主管機關」，非「直轄市、縣（市）政府」，機關層級錯誤。", "C": "登記證核發機關應為「中央主管機關」，非「直轄市、縣（市）政府」，機關層級錯誤。", "D": "正確。管理維護公司之執業，應經「中央主管機關」許可及辦理公司登記，並向「中央主管機關」申領登記證後，始得執業，許可及登記證核發皆屬中央權限（與經紀業之地方主管機關屬性不同，須區辨）。"}, "ref": "公寓大廈管理條例第43條", "id": 37, "chapter": "E1"}, {"year": 113, "qnum": 22, "stem": "1 樓露台屬於全體住戶共有，為了有效利用露台空間，住戶間常會將露台給該特定住戶使用，此露台稱為？", "options": ["專有部分", "共用部分", "約定專用部分", "約定共用部分"], "answer": "C", "explains": {"A": "露台本身屬共用性質，經約定供特定人使用後仍非「專有部分」（專有部分係具構造上使用上獨立性且屬單獨所有權標的者），本選項性質不符。", "B": "露台原屬共用部分，惟經約定供特定住戶使用後，已轉化為特殊分類，非單純之一般「共用部分」。", "C": "正確。原屬共用部分之露台，經約定供「特定」區分所有權人（住戶）使用者，稱為「約定專用部分」，此為約定專用部分之典型情境範例。", "D": "約定共用部分係指「專有部分」經約定供共同使用者（與本題「共用部分」經約定供特定人使用之情形相反），性質不符。"}, "ref": "公寓大廈管理條例第3條", "id": 38, "chapter": "E1"}, {"year": 114, "qnum": 14, "stem": "甲剛搬來社區不久，即受到鄰居推薦，並順利當選社區管理委員會之委員。依公寓大廈管理條例之規定，該管理委員會有那一種能力？", "options": ["權利能力", "行為能力", "意思能力", "當事人能力"], "answer": "D", "explains": {"A": "管理委員會非法人，不具備一般民法上完整之「權利能力」，本選項非法定賦予之能力類型。", "B": "「行為能力」係自然人法律上得自主為法律行為之資格概念，與管理委員會之組織性質無涉。", "C": "「意思能力」係自然人之精神識別能力概念，與管理委員會之組織性質無涉。", "D": "正確。管理委員會雖非法人，但公寓大廈管理條例特別明文賦予其「當事人能力」（訴訟法上得為原告或被告之資格），此為本科重複命題之核心觀念（與103年-15題相呼應）。"}, "ref": "公寓大廈管理條例第38條", "id": 39, "chapter": "E1"}];
const STORAGE_KEY = "brokerlaw_e1_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
