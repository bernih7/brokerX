<header><div class="hrow"><h1>民法申論專練卷①（自擬・限時 75 分鐘）</h1><button class="th" id="th" aria-label="切換深淺色">深色</button></div><div class="sub">自擬專練卷（非官方考題）：申論 3 題、每題 25 分，限時 75 分鐘。補本站限時模擬卷沒練到的三個主題——共有（預測「高」）、行為能力＋詐欺＋瑕疵擔保（預測「高」，107 年後 7 屆沒考）、贈與＋歸扣與限定責任（選擇題 21 題的「其他各種之債」章原本沒有範文）。建議先寫在紙上，再展開擬答對照；依據見 <a href="民法_申論115出題預測.html">115 出題預測</a>。</div></div></header>

<script>
var D={"Q": [], "E": [{"t": "申論題一（25分）｜共有：分管約定與多數決出租", "q": "甲、乙、丙共有 A 地，應有部分各三分之一。三人口頭約定：A 地東半部由甲使用，西半部由乙、丙使用，未辦理登記。113 年甲將其應有部分出賣並移轉登記予丁，丁買受時不知上開約定。114 年乙、丙未經丁同意，將 A 地全部出租予戊經營停車場，租期三年，每月租金 3 萬元均由乙、丙收取。試問：（一）甲乙丙間之使用約定，對丁有無拘束力？（二）乙、丙出租 A 地之效力如何？丁得否請求戊返還 A 地？丁就租金得主張何種權利？", "parts": [["一、定義", "『分管約定』指共有人間約定各自分別占有、使用共有物特定部分之契約，屬共有物使用、管理之約定。『共有物之管理』指對共有物為保存、改良及利用之行為；依通說及實務，將共有物出租他人屬管理行為，而非處分行為。"], ["二、法條", "① 第826條之1第1項：「不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依第八百二十條第一項規定所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。其由法院裁定所定之管理，經登記後，亦同。」\n② 第820條第1項：「共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。」第2項：「依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。」第4項：「共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。」\n③ 第818條：「各共有人，除契約另有約定外，按其應有部分，對於共有物之全部，有使用收益之權。」\n④ 第821條：「各共有人對於第三人，得就共有物之全部為本於所有權之請求。但回復共有物之請求，僅得為共有人全體之利益為之。」第767條第1項前段：「所有人對於無權占有或侵奪其所有物者，得請求返還之。」\n⑤ 第179條：「無法律上之原因而受利益，致他人受損害者，應返還其利益。雖有法律上之原因，而其後已不存在者，亦同。」"], ["三、涵攝分析", "（一）分管約定對丁之效力：甲乙丙就 A 地東西半部之使用約定，屬第826條之1第1項之「使用、管理之約定」。A 地為不動產，該約定須「於登記後」始對應有部分之受讓人具有效力；本題未辦理登記，丁受讓甲之應有部分，不論其是否知悉，均不受該約定拘束（「知悉其情事或可得而知」之標準僅適用於動產，第826條之1第2項）。\n（二）乙丙出租之效力：出租 A 地屬共有物之管理。原分管約定既不能拘束丁，就丁而言即無第820條第1項「除契約另有約定外」之適用，應回歸多數決。乙丙二人占共有人三人中之過半數，應有部分合計三分之二亦已過半數，符合第820條第1項之多數決，該管理決定合法，對不同意之丁亦有效力（丁於決定作成時已為共有人，係直接受第820條第1項拘束，並非決定後之受讓人，無第826條之1登記與否之問題）。戊基於有效之租賃契約占有 A 地，屬有權占有，丁不得依第821條、第767條請求戊返還。\n丁之救濟：①依第818條，丁按其應有部分三分之一對 A 地有收益權，每月租金 3 萬元中 1 萬元應歸丁；乙丙收取全部租金，其中逾越其二人應有部分之每月 1 萬元，無法律上原因而受利益，致丁受損害，丁得依第179條請求乙丙就其各自所受逾越應有部分之利益返還（合計每月 1 萬元）。②若出租條件（如租金顯低於行情）使丁受不利益而顯失公平，丁得依第820條第2項聲請法院裁定變更。③乙丙為管理決定若有故意或重大過失致丁受損害，依第820條第4項對丁連帶負賠償責任。"], ["四、結論", "（一）分管約定未登記，依第826條之1第1項對受讓人丁不生效力。（二）乙丙出租符合第820條第1項多數決，出租有效，戊為有權占有，丁不得請求戊返還；丁得依第818條、第179條請求乙丙返還其逾越應有部分所受之租金（合計每月 1 萬元），並得視情形依第820條第2項聲請法院變更、依同條第4項請求賠償。"], ["考試陷阱", "① 不動產分管看「登記」，不是看受讓人知不知道（知悉標準是動產）。② 出租是「管理」，用第820條多數決，不是第819條第2項處分須全體同意。③ 多數決合法≠多數共有人可獨拿租金：收益仍按應有部分（第818條）。"]], "warn": "自擬模擬題（非官方考題）。對照範文：指揮中心申論分頁 114-一（默示分管＋對後手效力）、預03（多數決與分管登記）、102-一（出租 vs 修繕）。條文引文已逐字對照《民法_現行條文核實表》。「出租屬管理行為」為通說與實務見解，作答宜寫明。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "分管＝共有物使用管理之約定；出租＝管理行為（通說、實務）。"], ["二、法條", "§826-1Ⅰ 不動產約定登記後對受讓人有效；§820Ⅰ 管理多數決、Ⅱ 顯失公平聲請變更、Ⅳ 連帶賠償；§818 按應有部分收益；§821、§767Ⅰ前段；§179。"], ["三、涵攝", "（一）未登記→丁不受拘束（知悉標準限動產）。（二）分管約定不拘束丁→回歸§820Ⅰ；乙丙 2/3 人數、2/3 應有部分→多數決合法→出租有效，戊有權占有，丁不得依§821、§767Ⅰ請求返還；租金 1/3（每月 1 萬）依§818＋§179 請求乙丙就各自所受逾越部分返還（合計每月 1 萬）；可依§820Ⅱ、Ⅳ。"], ["四、結論", "（一）無拘束力；（二）出租有效、不得請求戊返還；得請求乙丙返還每月 1 萬元租金。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "分管約定｜登記後｜應有部分之受讓人｜管理行為｜除契約另有約定外｜過半數及應有部分合計過半數｜有權占有｜按應有部分收益｜不當得利｜顯失公平｜連帶賠償", "ok"], ["常見失分點", "① 用「丁不知情所以不受拘束」作理由（不動產應以登記為準）\n② 把出租當處分，寫成須全體同意、出租無效\n③ 只寫出租有效，漏寫丁的租金請求（§818、§179）\n④ 漏寫§820第2項、第4項的救濟", "bad"]]}], "m": "不動產分管看登記；出租管理多數決；租金照份分，多拿要返還", "kw": ["分管約定", "登記後", "應有部分之受讓人", "管理行為", "過半數", "應有部分合計過半數", "有權占有", "使用收益", "不當得利", "顯失公平", "連帶負賠償責任"], "lj": "<div class=\"ljs\"><span>排法</span><div class=\"ljseg\"><button type=\"button\" data-lj=\"A\" class=\"on\">① 推理鏈</button><button type=\"button\" data-lj=\"B\">② 條文｜本題</button><button type=\"button\" data-lj=\"C\">③ 地圖＋勾選</button></div></div><div class=\"ljp\" data-lj=\"A\"><p class=\"ljd\">一步一步推：先問一句 → 條文 → 本題 → 小結，箭頭寫上下關係。適合第一次讀懂。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲乙丙間之使用約定，對丁有無拘束力？</span></div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">1</span>東半部歸甲、西半部歸乙丙的口頭約定，是什麼性質？要什麼條件才拘束受讓人？</div><p><span class=\"ljt tl\">條文</span><b>§826-1Ⅰ</b>：不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依第八百二十條第一項規定所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。</p><p><span class=\"ljt tf\">本題</span>甲乙丙約定各自使用 A 地特定部分，屬共有物使用之約定（分管約定）；A 地為不動產，約定未辦理登記。</p><p><span class=\"ljt ta\">小結</span>未登記 → 對應有部分之受讓人丁不生效力。</p></div><div class=\"ljar\">↓ 丁買受時不知道有這個約定──這點重要嗎？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">2</span>丁「不知情」是不是丁不受拘束的理由？</div><p><span class=\"ljt tl\">條文</span><b>§826-1Ⅱ</b>：動產共有人間就共有物為前項之約定、決定或法院所為之裁定，對於應有部分之受讓人或取得物權之人，以受讓或取得時知悉其情事或可得而知者為限，亦具有效力。</p><p><span class=\"ljt tf\">本題</span>「知悉其情事或可得而知」是動產的標準；A 地是不動產，丁知或不知都不影響，只看有無登記。</p><p><span class=\"ljt ta\">小結</span>理由是「未登記」，不是「丁不知情」。</p></div><div class=\"ljans\"><b>答一：</b>分管約定<b>未登記</b>，依 §826-1Ⅰ <b>對受讓人丁無拘束力</b>；丁是否知悉不影響結論（知悉標準限動產，§826-1Ⅱ）。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">乙、丙出租 A 地之效力如何？丁得否請求戊返還 A 地？</span></div><div class=\"ljar ljpre\">接問題一：分管約定拘束不了丁，A 地怎麼利用就回到法定的多數決規則。</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">3</span>出租是處分還是管理？乙丙兩人同意夠不夠？</div><p><span class=\"ljt tl\">條文</span><b>§820Ⅰ</b>：共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。</p><p><span class=\"ljt tf\">本題</span>出租屬管理行為（通說、實務見解），非 §819Ⅱ 之處分；分管約定不拘束丁，無「契約另有約定」；乙丙 2 人／3 人、應有部分合計 2/3，人數與應有部分均過半數。</p><p><span class=\"ljt ta\">小結</span>多數決合法 → 出租有效，對不同意之丁亦生效力。</p></div><div class=\"ljar\">↓ 出租有效，戊占有 A 地算有權還是無權？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">4</span>丁能不能以共有人身分請求戊返還 A 地？</div><p><span class=\"ljt tl\">條文</span><b>§767Ⅰ前段</b>：所有人對於無權占有或侵奪其所有物者，得請求返還之。</p><p><span class=\"ljt tf\">本題</span>戊基於有效之租賃契約占有 A 地，屬有權占有；§821 本於所有權之請求亦以無權占有為前提。</p><p><span class=\"ljt ta\">小結</span>丁不得依 §821、§767Ⅰ 請求戊返還。</p></div><div class=\"ljans\"><b>答二：</b>出租屬管理行為，乙丙符合 §820Ⅰ <b>人數及應有部分雙過半</b>，<b>出租有效</b>；戊為<b>有權占有</b>，丁<b>不得</b>依 §821、§767Ⅰ <b>請求戊返還</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題三</span><span class=\"ljqt\">丁就租金得主張何種權利？</span></div><div class=\"ljar ljpre\">接問題二：出租有效，但多數決合法不等於多數共有人可以獨拿租金。</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">5</span>每月 3 萬元租金，丁應得多少？</div><p><span class=\"ljt tl\">條文</span><b>§818</b>：各共有人，除契約另有約定外，按其應有部分，對於共有物之全部，有使用收益之權。</p><p><span class=\"ljt tf\">本題</span>丁應有部分三分之一，每月 3 萬元租金中 1 萬元應歸丁。</p><p><span class=\"ljt ta\">小結</span>丁每月應得 1 萬元。</p></div><div class=\"ljar\">↓ 乙丙全部收走，丁用什麼請求權要回來？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">6</span>乙丙收走全部租金，丁怎麼請求？</div><p><span class=\"ljt tl\">條文</span><b>§179</b>：無法律上之原因而受利益，致他人受損害者，應返還其利益。</p><p><span class=\"ljt tf\">本題</span>乙丙收取逾越其二人應有部分之每月 1 萬元，無法律上原因，致丁受損害。</p><p><span class=\"ljt ta\">小結</span>丁得請求乙丙就各自所受逾越部分返還，合計每月 1 萬元。</p></div><div class=\"ljar\">↓ 如果出租條件本身對丁不公平呢？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">7</span>出租條件顯失公平，丁能怎麼辦？</div><p><span class=\"ljt tl\">條文</span><b>§820Ⅱ</b>：依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。</p><p><span class=\"ljt tf\">本題</span>若租金顯低於行情等致丁受不利益而顯失公平，丁得聲請法院裁定變更。</p><p><span class=\"ljt ta\">小結</span>視情形聲請法院變更。</p></div><div class=\"ljar\">↓ 丁若因此受損害，能向誰求償？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">8</span>多數決本身有故意或重大過失，丁能請求賠償嗎？</div><p><span class=\"ljt tl\">條文</span><b>§820Ⅳ</b>：共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。</p><p><span class=\"ljt tf\">本題</span>乙丙作成出租決定若有故意或重大過失致丁受損害，對丁連帶負賠償責任。</p><p><span class=\"ljt ta\">小結</span>視情形請求乙丙連帶賠償。</p></div><div class=\"ljans\"><b>答三：</b>丁依 §818 <b>按應有部分每月應得 1 萬元</b>，得依 §179 <b>請求乙丙返還逾越部分（合計每月 1 萬元）</b>；並得視情形依 §820Ⅱ <b>聲請法院變更</b>、依 §820Ⅳ <b>請求連帶賠償</b>。</div><div class=\"kou\"><b>口訣</b>　不動產分管看登記 → 不知情不是理由 → 出租是管理雙過半 → 戊有權占有不必還 → 租金照份分 → 多拿依§179還 → 不公平找法院、重過失連帶賠</div></div><div class=\"ljp\" data-lj=\"B\" hidden><p class=\"ljd\">左＝條文說什麼，右＝本題套進去，一列一組。適合對答案。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲乙丙間之使用約定，對丁有無拘束力？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§826-1Ⅰ</div>不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依第八百二十條第一項規定所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。</div><div class=\"ljr\"><div class=\"ljh\">口頭約定、未登記</div>甲乙丙約定各自使用 A 地特定部分，屬共有物使用之約定（分管約定）；A 地為不動產，約定未辦理登記。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§826-1Ⅱ</div>動產共有人間就共有物為前項之約定、決定或法院所為之裁定，對於應有部分之受讓人或取得物權之人，以受讓或取得時知悉其情事或可得而知者為限，亦具有效力。</div><div class=\"ljr\"><div class=\"ljh\">丁不知約定</div>「知悉其情事或可得而知」是動產的標準；A 地是不動產，丁知或不知都不影響，只看有無登記。</div></div><div class=\"ljans\"><b>答一：</b>分管約定<b>未登記</b>，依 §826-1Ⅰ <b>對受讓人丁無拘束力</b>；丁是否知悉不影響結論（知悉標準限動產，§826-1Ⅱ）。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">乙、丙出租 A 地之效力如何？丁得否請求戊返還 A 地？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§820Ⅰ</div>共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。</div><div class=\"ljr\"><div class=\"ljh\">乙丙出租、未經丁同意</div>出租屬管理行為（通說、實務見解），非 §819Ⅱ 之處分；分管約定不拘束丁，無「契約另有約定」；乙丙 2 人／3 人、應有部分合計 2/3，人數與應有部分均過半數。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§767Ⅰ前段</div>所有人對於無權占有或侵奪其所有物者，得請求返還之。</div><div class=\"ljr\"><div class=\"ljh\">戊依租約占有</div>戊基於有效之租賃契約占有 A 地，屬有權占有；§821 本於所有權之請求亦以無權占有為前提。</div></div><div class=\"ljans\"><b>答二：</b>出租屬管理行為，乙丙符合 §820Ⅰ <b>人數及應有部分雙過半</b>，<b>出租有效</b>；戊為<b>有權占有</b>，丁<b>不得</b>依 §821、§767Ⅰ <b>請求戊返還</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題三</span><span class=\"ljqt\">丁就租金得主張何種權利？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§818</div>各共有人，除契約另有約定外，按其應有部分，對於共有物之全部，有使用收益之權。</div><div class=\"ljr\"><div class=\"ljh\">應有部分 1/3</div>丁應有部分三分之一，每月 3 萬元租金中 1 萬元應歸丁。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§179</div>無法律上之原因而受利益，致他人受損害者，應返還其利益。</div><div class=\"ljr\"><div class=\"ljh\">乙丙收取全部租金</div>乙丙收取逾越其二人應有部分之每月 1 萬元，無法律上原因，致丁受損害。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§820Ⅱ</div>依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。</div><div class=\"ljr\"><div class=\"ljh\">丁為不同意之共有人</div>若租金顯低於行情等致丁受不利益而顯失公平，丁得聲請法院裁定變更。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§820Ⅳ</div>共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。</div><div class=\"ljr\"><div class=\"ljh\">乙丙為管理決定</div>乙丙作成出租決定若有故意或重大過失致丁受損害，對丁連帶負賠償責任。</div></div><div class=\"ljans\"><b>答三：</b>丁依 §818 <b>按應有部分每月應得 1 萬元</b>，得依 §179 <b>請求乙丙返還逾越部分（合計每月 1 萬元）</b>；並得視情形依 §820Ⅱ <b>聲請法院變更</b>、依 §820Ⅳ <b>請求連帶賠償</b>。</div></div><div class=\"ljp\" data-lj=\"C\" hidden><p class=\"ljd\">一眼看完推理順序，下方寫完逐項勾。適合考前複習。</p><div class=\"ljmap\"><div><h6>問題一｜甲乙丙間之使用約定，對丁有無拘束力？</h6><ul><li><span class=\"ljno\">1</span>不動產分管看登記</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">2</span>知悉標準限動產</li></ul><div class=\"ljans\"><b>答：</b>分管約定<b>未登記</b>，依 §826-1Ⅰ <b>對受讓人丁無拘束力</b>；丁是否知悉不影響結論（知悉標準限動產，§826-1Ⅱ）。</div></div><div><h6>問題二｜乙、丙出租 A 地之效力如何？丁得否請求戊返還 A 地？</h6><ul><li><span class=\"ljno\">3</span>出租＝管理 → 雙過半即可</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">4</span>租約有效 → 戊有權占有</li></ul><div class=\"ljans\"><b>答：</b>出租屬管理行為，乙丙符合 §820Ⅰ <b>人數及應有部分雙過半</b>，<b>出租有效</b>；戊為<b>有權占有</b>，丁<b>不得</b>依 §821、§767Ⅰ <b>請求戊返還</b>。</div></div><div><h6>問題三｜丁就租金得主張何種權利？</h6><ul><li><span class=\"ljno\">5</span>收益按應有部分</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">6</span>多拿的 → 不當得利返還</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">7</span>顯失公平 → 聲請法院變更</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">8</span>故意重過失 → 連帶賠償</li></ul><div class=\"ljans\"><b>答：</b>丁依 §818 <b>按應有部分每月應得 1 萬元</b>，得依 §179 <b>請求乙丙返還逾越部分（合計每月 1 萬元）</b>；並得視情形依 §820Ⅱ <b>聲請法院變更</b>、依 §820Ⅳ <b>請求連帶賠償</b>。</div></div></div><div class=\"ljck\"><b>寫完逐項勾（7 個採分點；<span class=\"ljhot\">常錯</span>＝最常漏寫或寫錯）</b><ul><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§826-1Ⅰ：不動產分管約定登記後才對應有部分受讓人有效<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>丁知不知情不重要，知悉標準限動產（§826-1Ⅱ）</label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>出租＝管理行為，§820Ⅰ 人數及應有部分雙過半；不是 §819Ⅱ 全體同意<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>乙丙 2/3 人數、2/3 應有部分 → 出租有效，戊有權占有，丁不得請求返還</label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§818 收益按應有部分 → 丁每月 1 萬元<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題三</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>乙丙多收部分依 §179 返還（各就所受逾越部分）</label><span class=\"ljg\">問題三</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§820Ⅱ 顯失公平聲請變更；§820Ⅳ 故意重過失連帶賠償</label><span class=\"ljg\">問題三</span></li></ul></div></div>"}, {"t": "申論題二（25分）｜行為能力＋詐欺＋瑕疵擔保", "q": "17 歲之甲未得父母同意，持偽造之父母同意書，向乙車行購買二手機車一部，價金 6 萬元當場付清並交車。乙明知該車曾經泡水，卻向甲保證「本車無泡水、無重大事故」。一個月後甲發現該車曾泡水，引擎受損須支出修理費 2 萬元，甲隨即通知乙。甲之父母得知後，主張買賣契約未經其同意而無效。試問：（一）甲乙間買賣契約之效力如何？甲父母之主張有無理由？（二）甲對乙得主張何種權利？", "parts": [["一、定義", "『限制行為能力人』指滿七歲以上之未成年人；現行法滿十八歲為成年。『詐術』指限制行為能力人以積極行為使相對人誤信其有行為能力或已得法定代理人允許。『詐欺』指故意示以不實之事，令人陷於錯誤而為意思表示。『物之瑕疵擔保』指出賣人就買賣標的物於危險移轉時無瑕疵、具所保證品質所負之法定無過失責任。"], ["二、法條", "① 第12條：「滿十八歲為成年。」第13條第2項：「滿七歲以上之未成年人，有限制行為能力。」\n② 第77條：「限制行為能力人為意思表示及受意思表示，應得法定代理人之允許。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限。」第79條：「……所訂立之契約，須經法定代理人之承認，始生效力。」第83條：「限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效。」\n③ 第92條第1項本文：「因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。」第93條：「前條之撤銷，應於發見詐欺或脅迫終止後，一年內為之。但自意思表示後，經過十年，不得撤銷。」第114條第1項：「法律行為經撤銷者，視為自始無效。」\n④ 第354條（物之瑕疵擔保：第1項價值、效用之瑕疵；第2項所保證之品質）、第356條（從速檢查、即通知）、第357條、第359條：「……買受人得解除其契約或請求減少其價金。但依情形，解除契約顯失公平者，買受人僅得請求減少價金。」第360條：「買賣之物，缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。」第365條（通知後六個月、交付後五年；第2項：故意不告知者不適用六個月）。\n⑤ 第227條：「因可歸責於債務人之事由，致為不完全給付者，債權人得依關於給付遲延或給付不能之規定行使其權利。因不完全給付而生前項以外之損害者，債權人並得請求賠償。」\n⑥ 第78條：「限制行為能力人未得法定代理人之允許，所為之單獨行為，無效。」第184條第1項後段：「故意以背於善良風俗之方法，加損害於他人者亦同。」"], ["三、涵攝分析", "（一）契約效力：甲 17 歲，依第12條、第13條第2項為限制行為能力人。購買 6 萬元機車非純獲法律上利益，亦非依其年齡及身分日常生活所必需，依第77條應得法定代理人允許；未得允許所訂契約，依第79條原屬效力未定（並非無效）。惟甲持偽造之父母同意書，係以積極行為使乙誤信其已得法定代理人之允許，屬第83條之「詐術」，該買賣契約確定有效。甲父母主張無效，無理由（且縱無詐術，效果亦為效力未定，非無效）。\n（二）甲之權利：\n1. 詐欺撤銷：乙明知泡水而積極保證無泡水，係故意示以不實之事，使甲陷於錯誤而締約，甲得依第92條第1項撤銷其意思表示，並應於發見後一年內為之（第93條）。撤銷為單獨行為，且使甲負返還機車之義務，非純獲法律上利益；甲仍未成年，應由法定代理人代為或得其允許，否則依第78條無效（下述解除契約、請求減少價金亦同）。撤銷後契約視為自始無效（第114條第1項），甲得依第179條請求返還價金 6 萬元，乙得請求返還機車。\n2. 物之瑕疵擔保：泡水致引擎受損，減少機車之價值及通常效用，屬第354條第1項之瑕疵；乙並保證「無泡水」，泡水車缺少所保證之品質（同條第2項）。甲發現後隨即通知，符合第356條；且乙故意不告知瑕疵，依第357條本不受第356條檢查通知義務之限制。甲得依第359條解除契約或請求減少價金；或因缺少所保證之品質，且乙故意不告知瑕疵，依第360條不解除契約或請求減少價金，而請求不履行之損害賠償（修理費 2 萬元）。第360條之損害賠償係代替解除或減價，三者擇一行使，不得同時請求。又第365條之期間係針對解除權及減少價金請求權；乙故意不告知瑕疵，依同條第2項不適用通知後六個月之期間，僅受交付後五年之限制。\n3. 不完全給付與侵權行為：物之瑕疵擔保與不完全給付得否併存，實務見解曾以瑕疵係於契約成立後始發生且可歸責於出賣人者為限；學說則多認為出賣人明知瑕疵仍為交付者，即屬可歸責之不完全給付。本文採後說，理由在於乙明知泡水仍積極保證並交付，可歸責性明確，若僅因瑕疵發生於締約前即免除其債務不履行責任，無異保護惡意出賣人。故甲並得依第227條請求不完全給付之損害賠償（修理費 2 萬元）。此外，乙故意以詐欺方法使甲受財產上損害，甲亦得依第184條第1項後段請求損害賠償。\n4. 上述權利要件效果不同，甲得擇其有利者主張；欲保留機車僅求償修理費，以第360條最直接。惟撤銷後契約視為自始無效，即不得再主張以契約有效為前提之瑕疵擔保或不完全給付，二者亦屬擇一。"], ["四、結論", "（一）甲為限制行為能力人，但以偽造同意書使乙信其已得允許，依第83條契約有效；甲父母主張無效無理由。（二）甲得依第92條、第93條於發見後一年內撤銷（由法定代理人代為或經其允許），並依第179條請求返還價金；或依第359條解除契約、請求減少價金，或依第360條不解除、不減價而請求修理費 2 萬元之損害賠償（三者擇一）；並得依第227條請求不完全給付之損害賠償、依第184條第1項後段請求侵權行為之損害賠償。"], ["考試陷阱", "① 未得允許的契約是「效力未定」不是「無效」；用詐術才「有效」。② 「詐術」須有積極欺罔行為（如偽造證件），單純沉默不構成；單純口頭謊稱已成年是否構成有爭議，本文認為只要其積極欺罔足使相對人陷於誤信即屬詐術，不以使用證件為限，因第83條旨在保護因受欺罔而信賴之相對人。③ 第360條兩種情形：缺少保證品質、故意不告知瑕疵；本題兩者都有。④ 故意不告知時，第365條六個月不適用。⑤ 第359條解除、減價與第360條損害賠償擇一行使，不可寫成同時請求。"]], "warn": "自擬模擬題（非官方考題）。對照範文：指揮中心申論分頁 106-二（行為能力＋海砂屋）、預38（行為能力）、預26（詐欺撤銷與瑕疵擔保）。條文引文已逐字對照《民法_現行條文核實表》。「單純口頭謊稱成年是否構成詐術」屬解釋問題，本題用偽造同意書以避開爭議。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "限制行為能力人＝7～未滿18歲；詐術＝積極使人信已得允許；瑕疵擔保＝無過失法定責任。"], ["二、法條", "§12、§13Ⅱ；§77、§79、§83；§92Ⅰ、§93、§114Ⅰ、§179；§78；§354、§356、§357、§359、§360、§365Ⅱ；§227；§184Ⅰ後段。"], ["三、涵攝", "（一）原效力未定（§79），偽造同意書＝詐術→§83 有效，父母主張無理由。（二）①詐欺撤銷（1 年內，法定代理人代為或允許）→返還價金；②§354 瑕疵＋保證品質、已通知→§359 解除減價或§360 賠修理費 2 萬（擇一）；故意不告知→§365Ⅱ 解除、減價不受 6 個月限制；③§227（本文：明知瑕疵仍交付屬可歸責）；④§184Ⅰ後段。撤銷與瑕疵擔保亦擇一。"], ["四、結論", "（一）契約有效，父母主張無理由；（二）甲可撤銷並請求返還價金，或依§359 解除、減價／§360 請求修理費（擇一），並得依§227、§184Ⅰ後段求償。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "限制行為能力人｜應得法定代理人之允許｜效力未定｜詐術｜其法律行為為有效｜詐欺｜發見後一年｜視為自始無效｜瑕疵｜所保證之品質｜故意不告知｜不履行之損害賠償｜擇一｜不完全給付｜背於善良風俗", "ok"], ["常見失分點", "① 把未得允許的契約寫成「無效」\n② 漏寫第83條詐術，直接判效力未定\n③ 撤銷權漏寫一年期間，或漏寫未成年人行使撤銷須經法定代理人\n④ 瑕疵擔保只寫解除減價，漏第360條損害賠償與第365條第2項\n⑤ 把第359條解除、減價與第360條損害賠償寫成可同時請求", "bad"]]}], "m": "未允許＝效力未定，用詐術＝有效；被騙一年內撤銷，泡水可賠修理費", "kw": ["限制行為能力人", "法定代理人之允許", "效力未定", "詐術", "其法律行為為有效", "詐欺", "發見", "視為自始無效", "瑕疵", "所保證之品質", "故意不告知", "不履行之損害賠償", "不完全給付"], "lj": "<div class=\"ljs\"><span>排法</span><div class=\"ljseg\"><button type=\"button\" data-lj=\"A\" class=\"on\">① 推理鏈</button><button type=\"button\" data-lj=\"B\">② 條文｜本題</button><button type=\"button\" data-lj=\"C\">③ 地圖＋勾選</button></div></div><div class=\"ljp\" data-lj=\"A\"><p class=\"ljd\">一步一步推：先問一句 → 條文 → 本題 → 小結，箭頭寫上下關係。適合第一次讀懂。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲乙間買賣契約之效力如何？甲父母之主張有無理由？</span></div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">1</span>17 歲的甲有沒有完全行為能力？</div><p><span class=\"ljt tl\">條文</span><b>§13Ⅱ</b>：滿七歲以上之未成年人，有限制行為能力。</p><p><span class=\"ljt tf\">本題</span>滿十八歲為成年（§12），甲 17 歲為限制行為能力人。</p><p><span class=\"ljt ta\">小結</span>甲是限制行為能力人。</p></div><div class=\"ljar\">↓ 未得父母同意買機車，契約效力怎樣？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">2</span>未得法定代理人允許所訂的買賣契約，效力如何？</div><p><span class=\"ljt tl\">條文</span><b>§79</b>：限制行為能力人未得法定代理人之允許，所訂立之契約，須經法定代理人之承認，始生效力。</p><p><span class=\"ljt tf\">本題</span>買 6 萬元機車非純獲法律上利益，也非依年齡身分日常生活所必需（§77），本應得允許而未得。</p><p><span class=\"ljt ta\">小結</span>原則效力未定，不是無效。</p></div><div class=\"ljar\">↓ 甲還偽造了父母同意書──結果會變嗎？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">3</span>偽造同意書使乙相信已得允許，效果為何？</div><p><span class=\"ljt tl\">條文</span><b>§83</b>：限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效。</p><p><span class=\"ljt tf\">本題</span>甲以偽造同意書之積極行為使乙誤信已得法定代理人允許，構成詐術。</p><p><span class=\"ljt ta\">小結</span>契約確定有效；父母主張無效無理由。</p></div><div class=\"ljans\"><b>答一：</b>甲為<b>限制行為能力人</b>，未得允許之契約原<b>效力未定</b>（非無效）；但甲以偽造同意書施用<b>詐術</b>，依 §83 <b>契約有效</b>，甲父母主張無效<b>無理由</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">甲對乙得主張何種權利？</span></div><div class=\"ljar ljpre\">接問題一：契約有效，甲同時是被詐欺的表意人、受領瑕疵物的買受人。</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">4</span>乙明知泡水卻保證無泡水，甲能撤銷嗎？</div><p><span class=\"ljt tl\">條文</span><b>§92Ⅰ</b>：因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。</p><p><span class=\"ljt tf\">本題</span>乙故意示以不實之事使甲陷於錯誤而締約；應於發見後一年內撤銷（§93）；撤銷非純獲法律上利益，須法定代理人代為或允許（§78）；撤銷後自始無效（§114Ⅰ），依 §179 請求返還價金。</p><p><span class=\"ljt ta\">小結</span>得撤銷並請求返還價金 6 萬元。</p></div><div class=\"ljar\">↓ 甲若想留下機車，還有什麼主張？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">5</span>泡水車是否構成物之瑕疵？</div><p><span class=\"ljt tl\">條文</span><b>§354Ⅱ</b>：出賣人並應擔保其物於危險移轉時，具有其所保證之品質。</p><p><span class=\"ljt tf\">本題</span>泡水減少價值及通常效用（§354Ⅰ），且缺少乙所保證「無泡水」之品質；甲發現後隨即通知（§356），乙故意不告知另有 §357。</p><p><span class=\"ljt ta\">小結</span>乙應負物之瑕疵擔保責任。</p></div><div class=\"ljar\">↓ 瑕疵擔保下，解除、減價、賠償能一起主張嗎？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">6</span>甲要求修理費 2 萬元，依據為何？能否與解除、減價併主張？</div><p><span class=\"ljt tl\">條文</span><b>§360</b>：買賣之物，缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。</p><p><span class=\"ljt tf\">本題</span>§360 兩種情形本題都有；但損害賠償是代替 §359 解除或減價，三者擇一；解除、減價依 §365Ⅱ 不受通知後六個月限制。</p><p><span class=\"ljt ta\">小結</span>得擇一請求修理費 2 萬元之損害賠償。</p></div><div class=\"ljar\">↓ 除了瑕疵擔保，還有債務不履行或侵權嗎？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">7</span>乙明知泡水仍交付，是否另構成不完全給付？</div><p><span class=\"ljt tl\">條文</span><b>§227Ⅰ</b>：因可歸責於債務人之事由，致為不完全給付者，債權人得依關於給付遲延或給付不能之規定行使其權利。</p><p><span class=\"ljt tf\">本題</span>實務見解曾限於瑕疵係契約成立後發生且可歸責者；本文採學說，明知瑕疵仍交付即屬可歸責之不完全給付。另乙故意詐欺，甲得依 §184Ⅰ後段請求賠償。</p><p><span class=\"ljt ta\">小結</span>得依 §227、§184Ⅰ後段請求損害賠償。</p></div><div class=\"ljans\"><b>答二：</b>甲得依 §92Ⅰ、§93 <b>於發見後一年內撤銷</b>（由<b>法定代理人代為或允許</b>），並依 §179 <b>請求返還價金</b>；或依 §359 <b>解除、減價</b>，或依 §360 <b>請求修理費 2 萬元（三者擇一）</b>；並得依 <b>§227 不完全給付</b>、<b>§184Ⅰ後段</b>請求損害賠償。撤銷與瑕疵擔保亦擇一。</div><div class=\"kou\"><b>口訣</b>　十七歲限制能力 → 未允許效力未定 → 偽造同意書用詐術就有效 → 被騙一年內撤銷（法代出手） → 泡水缺保證品質 → 解除減價或§360賠修理費擇一 → 明知仍交付再加§227、§184</div></div><div class=\"ljp\" data-lj=\"B\" hidden><p class=\"ljd\">左＝條文說什麼，右＝本題套進去，一列一組。適合對答案。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲乙間買賣契約之效力如何？甲父母之主張有無理由？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§13Ⅱ</div>滿七歲以上之未成年人，有限制行為能力。</div><div class=\"ljr\"><div class=\"ljh\">甲 17 歲</div>滿十八歲為成年（§12），甲 17 歲為限制行為能力人。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§79</div>限制行為能力人未得法定代理人之允許，所訂立之契約，須經法定代理人之承認，始生效力。</div><div class=\"ljr\"><div class=\"ljh\">6 萬元機車、未得同意</div>買 6 萬元機車非純獲法律上利益，也非依年齡身分日常生活所必需（§77），本應得允許而未得。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§83</div>限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效。</div><div class=\"ljr\"><div class=\"ljh\">偽造父母同意書</div>甲以偽造同意書之積極行為使乙誤信已得法定代理人允許，構成詐術。</div></div><div class=\"ljans\"><b>答一：</b>甲為<b>限制行為能力人</b>，未得允許之契約原<b>效力未定</b>（非無效）；但甲以偽造同意書施用<b>詐術</b>，依 §83 <b>契約有效</b>，甲父母主張無效<b>無理由</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">甲對乙得主張何種權利？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§92Ⅰ</div>因被詐欺或被脅迫而為意思表示者，表意人得撤銷其意思表示。</div><div class=\"ljr\"><div class=\"ljh\">乙明知泡水仍保證</div>乙故意示以不實之事使甲陷於錯誤而締約；應於發見後一年內撤銷（§93）；撤銷非純獲法律上利益，須法定代理人代為或允許（§78）；撤銷後自始無效（§114Ⅰ），依 §179 請求返還價金。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§354Ⅱ</div>出賣人並應擔保其物於危險移轉時，具有其所保證之品質。</div><div class=\"ljr\"><div class=\"ljh\">泡水、引擎受損</div>泡水減少價值及通常效用（§354Ⅰ），且缺少乙所保證「無泡水」之品質；甲發現後隨即通知（§356），乙故意不告知另有 §357。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§360</div>買賣之物，缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。</div><div class=\"ljr\"><div class=\"ljh\">缺保證品質＋故意不告知</div>§360 兩種情形本題都有；但損害賠償是代替 §359 解除或減價，三者擇一；解除、減價依 §365Ⅱ 不受通知後六個月限制。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§227Ⅰ</div>因可歸責於債務人之事由，致為不完全給付者，債權人得依關於給付遲延或給付不能之規定行使其權利。</div><div class=\"ljr\"><div class=\"ljh\">乙明知瑕疵仍交付</div>實務見解曾限於瑕疵係契約成立後發生且可歸責者；本文採學說，明知瑕疵仍交付即屬可歸責之不完全給付。另乙故意詐欺，甲得依 §184Ⅰ後段請求賠償。</div></div><div class=\"ljans\"><b>答二：</b>甲得依 §92Ⅰ、§93 <b>於發見後一年內撤銷</b>（由<b>法定代理人代為或允許</b>），並依 §179 <b>請求返還價金</b>；或依 §359 <b>解除、減價</b>，或依 §360 <b>請求修理費 2 萬元（三者擇一）</b>；並得依 <b>§227 不完全給付</b>、<b>§184Ⅰ後段</b>請求損害賠償。撤銷與瑕疵擔保亦擇一。</div></div><div class=\"ljp\" data-lj=\"C\" hidden><p class=\"ljd\">一眼看完推理順序，下方寫完逐項勾。適合考前複習。</p><div class=\"ljmap\"><div><h6>問題一｜甲乙間買賣契約之效力如何？甲父母之主張有無理由？</h6><ul><li><span class=\"ljno\">1</span>7～未滿 18 → 限制行為能力</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">2</span>未允許 → 效力未定</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">3</span>用詐術 → 有效</li></ul><div class=\"ljans\"><b>答：</b>甲為<b>限制行為能力人</b>，未得允許之契約原<b>效力未定</b>（非無效）；但甲以偽造同意書施用<b>詐術</b>，依 §83 <b>契約有效</b>，甲父母主張無效<b>無理由</b>。</div></div><div><h6>問題二｜甲對乙得主張何種權利？</h6><ul><li><span class=\"ljno\">4</span>詐欺 → 一年內撤銷（法代為之）</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">5</span>減少價值效用＋缺保證品質</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">6</span>§359 與 §360 擇一</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">7</span>明知瑕疵仍交付 → 可歸責（本文）</li></ul><div class=\"ljans\"><b>答：</b>甲得依 §92Ⅰ、§93 <b>於發見後一年內撤銷</b>（由<b>法定代理人代為或允許</b>），並依 §179 <b>請求返還價金</b>；或依 §359 <b>解除、減價</b>，或依 §360 <b>請求修理費 2 萬元（三者擇一）</b>；並得依 <b>§227 不完全給付</b>、<b>§184Ⅰ後段</b>請求損害賠償。撤銷與瑕疵擔保亦擇一。</div></div></div><div class=\"ljck\"><b>寫完逐項勾（8 個採分點；<span class=\"ljhot\">常錯</span>＝最常漏寫或寫錯）</b><ul><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§77＋§79：未得允許之契約效力未定（不是無效）</label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§83：用詐術使人信已得允許 → 法律行為有效<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>偽造父母同意書＝積極詐術 → 父母主張無效無理由</label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§92Ⅰ、§93：被詐欺 → 發見後一年內撤銷；撤銷須法定代理人代為或允許（§78）</label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§354Ⅰ、Ⅱ：泡水＝減少價值效用之瑕疵，且缺保證品質</label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§360：缺保證品質／故意不告知 → 不解除不減價，請求不履行之損害賠償（與 §359 擇一）<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§365Ⅱ：故意不告知 → 解除、減價不受通知後六個月限制</label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>§227：明知瑕疵仍交付屬可歸責之不完全給付（本文立場）；另 §184Ⅰ後段</label><span class=\"ljg\">問題二</span></li></ul></div></div>"}, {"t": "申論題三（25分）｜贈與之撤銷＋歸扣與限定責任", "q": "甲（配偶已歿）有子乙、女丙。（一）113 年甲以書面（未經公證）與乙約定，將 A 地無償贈與乙，尚未辦理移轉登記，甲旋即反悔，以書面通知乙撤銷，嗣將 A 地出售他人，價金已花用殆盡。甲之撤銷是否有效？（二）114 年 5 月，甲將 B 屋（時值 800 萬元）贈與丙並辦妥移轉登記，丙並非因結婚、分居或營業而受贈。114 年 12 月甲死亡，遺有現金 400 萬元，另積欠丁 600 萬元。乙主張 B 屋應加入遺產由兄妹平均分配；丁則請求乙、丙清償 600 萬元。試問乙、丁之主張有無理由？", "parts": [["一、定義", "『贈與』指當事人約定，一方以自己之財產無償給與他方，他方允受之契約。『歸扣』指繼承人於繼承開始前因結婚、分居或營業受有被繼承人之贈與，於遺產分割時將該贈與價額加入應繼遺產並由其應繼分中扣除之制度。『限定責任』指繼承人對被繼承人之債務，以因繼承所得遺產為限負清償責任。"], ["二、法條", "① 第406條：「稱贈與者，謂當事人約定，一方以自己之財產無償給與他方，他方允受之契約。」第408條：「贈與物之權利未移轉前，贈與人得撤銷其贈與。其一部已移轉者，得就其未移轉之部分撤銷之。前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。」第419條第1項：「贈與之撤銷，應向受贈人以意思表示為之。」\n② 第1173條第1項：「繼承人中有在繼承開始前因結婚、分居或營業，已從被繼承人受有財產之贈與者，應將該贈與價額加入繼承開始時被繼承人所有之財產中，為應繼遺產。但被繼承人於贈與時有反對之意思表示者，不在此限。」\n③ 第1138條（第一順序：直系血親卑親屬）、第1141條：「同一順序之繼承人有數人時，按人數平均繼承。……」\n④ 第1148條第2項：「繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。」第1148條之1：「繼承人在繼承開始前二年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產。前項財產如已移轉或滅失，其價額，依贈與時之價值計算。」第1153條：「繼承人對於被繼承人之債務，以因繼承所得遺產為限，負連帶責任。繼承人相互間對於被繼承人之債務，除法律另有規定或另有約定外，按其應繼分比例負擔之。」"], ["三、涵攝分析", "（一）A 地贈與：甲乙間贈與契約已成立（第406條），惟 A 地尚未移轉登記，贈與物之權利未移轉；該贈與僅以書面為之而未經公證，亦非為履行道德上義務，不屬第408條第2項之例外。故甲得依第408條第1項撤銷；甲以書面通知乙撤銷，已依第419條第1項向受贈人以意思表示為之，撤銷有效。撤銷後甲不負移轉 A 地之義務，其嗣後出售 A 地係處分自己之財產，乙不得請求移轉或賠償；A 地及其價金亦不在遺產之列。書面不影響撤銷權（舊法「立有字據不得撤銷」已修正）。\n（二）乙之主張：乙丙為第一順序繼承人，依第1141條平均繼承，各二分之一。B 屋雖係丙於繼承開始前受贈，但第1173條歸扣限於「因結婚、分居或營業」之贈與，本題丙非因此受贈，B 屋不加入應繼遺產；第1148條之1 之「視為其所得遺產」係為計算限定責任之範圍而設（依立法理由及實務），並非使贈與財產成為應分割之遺產。故遺產僅現金 400 萬元，乙丙各分得 200 萬元，乙之主張無理由。\n丁之主張：依第1148條第2項、第1153條第1項，乙丙以因繼承所得遺產為限，對丁負連帶責任。乙之所得遺產，以遺產按應繼分分割計為 200 萬元，且責任不及於乙之固有財產；丙除分得 200 萬元外，B 屋係繼承開始前二年內（114 年 5 月）受贈，依第1148條之1 第1項視為其所得遺產，丙之責任限度為 200 萬元＋B 屋（800 萬元）＝1,000 萬元。故丁得請求乙、丙連帶清償，但乙以 200 萬元為限，丙得就 600 萬元全額負責。乙丙內部依第1153條第2項按應繼分比例，各應負擔 300 萬元；惟乙係限定責任，本文認為其內部分擔亦不逾其所得遺產 200 萬元，理由在於第1153條第1項「以因繼承所得遺產為限」係限定繼承人之總責任，若內部求償得超過此限，將使乙以固有財產清償，架空限定責任；故丙清償後向乙求償不得超過 200 萬元，餘額由丙負擔。"], ["四、結論", "（一）A 地未移轉、贈與未經公證亦非履行道德上義務，甲依第408條第1項、第419條第1項以書面向乙為撤銷之意思表示，撤銷有效。（二）B 屋非因結婚、分居或營業所受贈與，不適用第1173條歸扣，乙主張無理由，遺產 400 萬元由乙丙各分 200 萬元；丁得依第1153條第1項請求乙丙連帶清償，乙以 200 萬元為限，丙因第1148條之1 將 B 屋視為其所得遺產，責任限度 1,000 萬元，足以清償 600 萬元；內部分擔乙以 200 萬元為限，餘由丙負擔。"], ["考試陷阱", "① 第408條例外只有「經公證」與「履行道德上義務」，書面不是例外。② 第1173條歸扣（分遺產用，限結婚、分居、營業）≠ 第1148條之1（算清償責任用，二年內受贈）。③ 限定責任下仍是「連帶」，只是各人以所得遺產為限。"]], "warn": "自擬模擬題（非官方考題），補「其他各種之債」章（贈與）沒有範文的缺口。對照範文：指揮中心申論分頁 101-一（拋棄繼承權等效力比較）、預04（特留分扣減）。條文引文已逐字對照《民法_現行條文核實表》。第1148條之1 與第1173條功能不同，係依立法理由及實務，作答宜寫明。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "贈與＝無償給與＋允受；歸扣＝結婚、分居、營業受贈加回應繼遺產；限定責任＝以所得遺產為限清償。"], ["二、法條", "§406、§408、§419Ⅰ；§1173Ⅰ；§1138、§1141；§1148Ⅱ、§1148-1、§1153。"], ["三、涵攝", "（一）未移轉、未公證、非道德義務→§408Ⅰ 得撤銷；已書面通知乙（§419Ⅰ）→撤銷有效。（二）B 屋非結婚分居營業→不歸扣，遺產 400 萬各 200 萬；丁：乙丙連帶，乙限 200 萬，丙 200 萬＋B 屋 800 萬（§1148-1）＝1,000 萬；內部按應繼分各 300 萬，但乙以 200 萬為限，餘由丙負擔。"], ["四、結論", "甲之撤銷有效；乙主張無理由；丁得請求連帶清償（乙限 200 萬、丙限 1,000 萬，丁可足額受償）。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "贈與物之權利未移轉前｜經公證｜履行道德上義務｜向受贈人以意思表示｜結婚、分居或營業｜應繼遺產｜按人數平均｜以因繼承所得遺產為限｜繼承開始前二年內｜視為其所得遺產｜連帶責任｜按其應繼分比例負擔", "ok"], ["常見失分點", "① 以為「有書面」就不得撤銷（舊法）\n② 把第1148條之1 當成歸扣，把 B 屋加入遺產分割\n③ 限定責任寫成「各自按應繼分負責」，漏了對外連帶\n④ 漏算丙因第1148條之1 擴大的責任限度\n⑤ 內部分擔寫成乙丙各半，忽略乙之限定責任上限", "bad"]]}], "m": "未移轉未公證，贈與可撤銷；歸扣看婚分營，二年受贈只算債", "kw": ["贈與物之權利未移轉前", "經公證", "履行道德上義務", "意思表示", "結婚、分居或營業", "應繼遺產", "平均繼承", "以因繼承所得遺產為限", "繼承開始前二年內", "視為其所得遺產", "連帶責任", "應繼分比例"], "lj": "<div class=\"ljs\"><span>排法</span><div class=\"ljseg\"><button type=\"button\" data-lj=\"A\" class=\"on\">① 推理鏈</button><button type=\"button\" data-lj=\"B\">② 條文｜本題</button><button type=\"button\" data-lj=\"C\">③ 地圖＋勾選</button></div></div><div class=\"ljp\" data-lj=\"A\"><p class=\"ljd\">一步一步推：先問一句 → 條文 → 本題 → 小結，箭頭寫上下關係。適合第一次讀懂。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲之撤銷是否有效？</span></div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">1</span>A 地還沒過戶，甲能反悔嗎？</div><p><span class=\"ljt tl\">條文</span><b>§408Ⅰ</b>：贈與物之權利未移轉前，贈與人得撤銷其贈與。</p><p><span class=\"ljt tf\">本題</span>甲乙贈與契約已成立（§406），但 A 地尚未辦理移轉登記。</p><p><span class=\"ljt ta\">小結</span>原則得撤銷。</p></div><div class=\"ljar\">↓ 有書面，是不是就不能撤銷了？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">2</span>書面贈與是否屬於不得撤銷的例外？</div><p><span class=\"ljt tl\">條文</span><b>§408Ⅱ</b>：前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。</p><p><span class=\"ljt tf\">本題</span>僅以書面為之而未經公證，父贈子土地亦非履行道德上義務。</p><p><span class=\"ljt ta\">小結</span>不屬例外，仍得撤銷。</p></div><div class=\"ljar\">↓ 撤銷要用什麼方式？甲做到了嗎？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">3</span>撤銷的方式？甲的撤銷生效了嗎？</div><p><span class=\"ljt tl\">條文</span><b>§419Ⅰ</b>：贈與之撤銷，應向受贈人以意思表示為之。</p><p><span class=\"ljt tf\">本題</span>甲以書面通知受贈人乙撤銷，已為意思表示；撤銷後甲出售 A 地係處分自己財產，乙不得請求移轉或賠償。</p><p><span class=\"ljt ta\">小結</span>撤銷有效。</p></div><div class=\"ljans\"><b>答一：</b>A 地<b>未移轉</b>、贈與<b>未經公證</b>亦<b>非履行道德上義務</b>，甲依 §408Ⅰ 得撤銷，並已以書面依 §419Ⅰ <b>向乙為意思表示</b>，<b>撤銷有效</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">乙主張 B 屋應加入遺產由兄妹平均分配，有無理由？</span></div><div class=\"ljar ljpre\">接問題一：A 地贈與已撤銷，乙並未受贈；甲死亡時遺產僅現金 400 萬元。</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">4</span>乙丙怎麼分遺產？</div><p><span class=\"ljt tl\">條文</span><b>§1141</b>：同一順序之繼承人有數人時，按人數平均繼承。</p><p><span class=\"ljt tf\">本題</span>配偶已歿，乙丙為第一順序直系血親卑親屬（§1138），各二分之一。</p><p><span class=\"ljt ta\">小結</span>應繼分各 1/2。</p></div><div class=\"ljar\">↓ 丙生前受贈的 B 屋要不要加回來分？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">5</span>丙生前受贈的 B 屋，要不要歸扣？</div><p><span class=\"ljt tl\">條文</span><b>§1173Ⅰ</b>：繼承人中有在繼承開始前因結婚、分居或營業，已從被繼承人受有財產之贈與者，應將該贈與價額加入繼承開始時被繼承人所有之財產中，為應繼遺產。</p><p><span class=\"ljt tf\">本題</span>歸扣限於結婚、分居或營業之贈與；丙不符合。§1148-1「視為其所得遺產」只用於計算清償責任，不使 B 屋成為應分割之遺產。</p><p><span class=\"ljt ta\">小結</span>B 屋不加入；遺產 400 萬元乙丙各 200 萬元。</p></div><div class=\"ljans\"><b>答二：</b>B 屋<b>非因結婚、分居或營業</b>所受贈與，<b>不適用 §1173 歸扣</b>，乙主張<b>無理由</b>；遺產現金 400 萬元由乙丙<b>各分 200 萬元</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題三</span><span class=\"ljqt\">丁請求乙、丙清償 600 萬元，有無理由？</span></div><div class=\"ljar ljpre\">接問題二：遺產只有 400 萬元，債務 600 萬元──不足的部分誰負責？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">6</span>繼承人對被繼承人的債務，對外怎麼負責？</div><p><span class=\"ljt tl\">條文</span><b>§1153Ⅰ</b>：繼承人對於被繼承人之債務，以因繼承所得遺產為限，負連帶責任。</p><p><span class=\"ljt tf\">本題</span>乙丙對丁連帶負責，但各以所得遺產為限；乙所得遺產按應繼分計 200 萬元，不及於固有財產。</p><p><span class=\"ljt ta\">小結</span>丁得請求乙丙連帶清償，乙以 200 萬元為限。</p></div><div class=\"ljar\">↓ 丙生前受贈的 B 屋會不會擴大丙的責任？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">7</span>B 屋是否算進丙的責任限度？</div><p><span class=\"ljt tl\">條文</span><b>§1148-1Ⅰ</b>：繼承人在繼承開始前二年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產。</p><p><span class=\"ljt tf\">本題</span>B 屋係繼承開始前二年內受贈，視為丙所得遺產；丙責任限度 200 萬＋800 萬＝1,000 萬元。</p><p><span class=\"ljt ta\">小結</span>丙得就 600 萬元全額負責，丁可足額受償。</p></div><div class=\"ljar\">↓ 丙付完以後，能向乙要回多少？</div><div class=\"ljst\"><div class=\"ljsq\"><span class=\"ljno\">8</span>乙丙內部如何分擔？</div><p><span class=\"ljt tl\">條文</span><b>§1153Ⅱ</b>：繼承人相互間對於被繼承人之債務，除法律另有規定或另有約定外，按其應繼分比例負擔之。</p><p><span class=\"ljt tf\">本題</span>各應負擔 300 萬元；本文認為乙之內部分擔亦以所得遺產 200 萬元為限，否則架空限定責任。</p><p><span class=\"ljt ta\">小結</span>乙以 200 萬元為限，餘由丙負擔。</p></div><div class=\"ljans\"><b>答三：</b>丁之請求<b>有理由</b>：乙丙依 §1153Ⅰ <b>連帶清償</b>，<b>乙以 200 萬元為限</b>；丙因 §1148-1 B 屋<b>視為其所得遺產</b>，責任限度 <b>1,000 萬元</b>，足以清償 600 萬元。內部依 §1153Ⅱ 各 300 萬元，<b>乙以 200 萬元為限</b>，餘由丙負擔。</div><div class=\"kou\"><b>口訣</b>　未移轉未公證，贈與可撤銷 → 書面通知即生效 → 歸扣看婚分營 → 遺產四百各兩百 → 對外連帶以遺產為限 → 二年受贈只算債（丙到一千萬） → 內部各半但乙封頂兩百</div></div><div class=\"ljp\" data-lj=\"B\" hidden><p class=\"ljd\">左＝條文說什麼，右＝本題套進去，一列一組。適合對答案。</p><div class=\"ljq\"><span class=\"ljqn\">問題一</span><span class=\"ljqt\">甲之撤銷是否有效？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§408Ⅰ</div>贈與物之權利未移轉前，贈與人得撤銷其贈與。</div><div class=\"ljr\"><div class=\"ljh\">A 地未移轉登記</div>甲乙贈與契約已成立（§406），但 A 地尚未辦理移轉登記。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§408Ⅱ</div>前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。</div><div class=\"ljr\"><div class=\"ljh\">書面、未公證</div>僅以書面為之而未經公證，父贈子土地亦非履行道德上義務。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§419Ⅰ</div>贈與之撤銷，應向受贈人以意思表示為之。</div><div class=\"ljr\"><div class=\"ljh\">書面通知乙</div>甲以書面通知受贈人乙撤銷，已為意思表示；撤銷後甲出售 A 地係處分自己財產，乙不得請求移轉或賠償。</div></div><div class=\"ljans\"><b>答一：</b>A 地<b>未移轉</b>、贈與<b>未經公證</b>亦<b>非履行道德上義務</b>，甲依 §408Ⅰ 得撤銷，並已以書面依 §419Ⅰ <b>向乙為意思表示</b>，<b>撤銷有效</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題二</span><span class=\"ljqt\">乙主張 B 屋應加入遺產由兄妹平均分配，有無理由？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§1141</div>同一順序之繼承人有數人時，按人數平均繼承。</div><div class=\"ljr\"><div class=\"ljh\">子乙、女丙</div>配偶已歿，乙丙為第一順序直系血親卑親屬（§1138），各二分之一。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§1173Ⅰ</div>繼承人中有在繼承開始前因結婚、分居或營業，已從被繼承人受有財產之贈與者，應將該贈與價額加入繼承開始時被繼承人所有之財產中，為應繼遺產。</div><div class=\"ljr\"><div class=\"ljh\">丙非因結婚、分居、營業受贈</div>歸扣限於結婚、分居或營業之贈與；丙不符合。§1148-1「視為其所得遺產」只用於計算清償責任，不使 B 屋成為應分割之遺產。</div></div><div class=\"ljans\"><b>答二：</b>B 屋<b>非因結婚、分居或營業</b>所受贈與，<b>不適用 §1173 歸扣</b>，乙主張<b>無理由</b>；遺產現金 400 萬元由乙丙<b>各分 200 萬元</b>。</div><div class=\"ljq\"><span class=\"ljqn\">問題三</span><span class=\"ljqt\">丁請求乙、丙清償 600 萬元，有無理由？</span></div><div class=\"ljch\"><span>條文說什麼</span><span>本題套進去</span></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§1153Ⅰ</div>繼承人對於被繼承人之債務，以因繼承所得遺產為限，負連帶責任。</div><div class=\"ljr\"><div class=\"ljh\">乙丙對丁</div>乙丙對丁連帶負責，但各以所得遺產為限；乙所得遺產按應繼分計 200 萬元，不及於固有財產。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§1148-1Ⅰ</div>繼承人在繼承開始前二年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產。</div><div class=\"ljr\"><div class=\"ljh\">114 年 5 月受贈、12 月繼承開始</div>B 屋係繼承開始前二年內受贈，視為丙所得遺產；丙責任限度 200 萬＋800 萬＝1,000 萬元。</div></div><div class=\"ljrow\"><div class=\"ljl\"><div class=\"ljh\">§1153Ⅱ</div>繼承人相互間對於被繼承人之債務，除法律另有規定或另有約定外，按其應繼分比例負擔之。</div><div class=\"ljr\"><div class=\"ljh\">應繼分各 1/2</div>各應負擔 300 萬元；本文認為乙之內部分擔亦以所得遺產 200 萬元為限，否則架空限定責任。</div></div><div class=\"ljans\"><b>答三：</b>丁之請求<b>有理由</b>：乙丙依 §1153Ⅰ <b>連帶清償</b>，<b>乙以 200 萬元為限</b>；丙因 §1148-1 B 屋<b>視為其所得遺產</b>，責任限度 <b>1,000 萬元</b>，足以清償 600 萬元。內部依 §1153Ⅱ 各 300 萬元，<b>乙以 200 萬元為限</b>，餘由丙負擔。</div></div><div class=\"ljp\" data-lj=\"C\" hidden><p class=\"ljd\">一眼看完推理順序，下方寫完逐項勾。適合考前複習。</p><div class=\"ljmap\"><div><h6>問題一｜甲之撤銷是否有效？</h6><ul><li><span class=\"ljno\">1</span>權利未移轉 → 得撤銷</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">2</span>例外只有公證、道德義務</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">3</span>向受贈人表示 → 撤銷有效</li></ul><div class=\"ljans\"><b>答：</b>A 地<b>未移轉</b>、贈與<b>未經公證</b>亦<b>非履行道德上義務</b>，甲依 §408Ⅰ 得撤銷，並已以書面依 §419Ⅰ <b>向乙為意思表示</b>，<b>撤銷有效</b>。</div></div><div><h6>問題二｜乙主張 B 屋應加入遺產由兄妹平均分配，有無理由？</h6><ul><li><span class=\"ljno\">4</span>同順序按人數平均</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">5</span>歸扣看婚、分、營</li></ul><div class=\"ljans\"><b>答：</b>B 屋<b>非因結婚、分居或營業</b>所受贈與，<b>不適用 §1173 歸扣</b>，乙主張<b>無理由</b>；遺產現金 400 萬元由乙丙<b>各分 200 萬元</b>。</div></div><div><h6>問題三｜丁請求乙、丙清償 600 萬元，有無理由？</h6><ul><li><span class=\"ljno\">6</span>對外連帶＋以所得遺產為限</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">7</span>二年內受贈 → 算進清償限度</li><li class=\"ljdn\">↓</li><li><span class=\"ljno\">8</span>內部按應繼分，但乙不逾 200 萬</li></ul><div class=\"ljans\"><b>答：</b>丁之請求<b>有理由</b>：乙丙依 §1153Ⅰ <b>連帶清償</b>，<b>乙以 200 萬元為限</b>；丙因 §1148-1 B 屋<b>視為其所得遺產</b>，責任限度 <b>1,000 萬元</b>，足以清償 600 萬元。內部依 §1153Ⅱ 各 300 萬元，<b>乙以 200 萬元為限</b>，餘由丙負擔。</div></div></div><div class=\"ljck\"><b>寫完逐項勾（7 個採分點；<span class=\"ljhot\">常錯</span>＝最常漏寫或寫錯）</b><ul><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§408Ⅰ、Ⅱ：未移轉前得撤銷；例外只有經公證、履行道德上義務（書面不是例外）<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>甲已書面通知乙（§419Ⅰ）→ 撤銷有效；嗣後出售 A 地乙無從主張</label><span class=\"ljg\">問題一</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§1173Ⅰ：歸扣限結婚、分居、營業之贈與<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>§1148-1 只算清償責任，不把 B 屋加入分割；遺產 400 萬各 200 萬</label><span class=\"ljg\">問題二</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§1153Ⅰ：以因繼承所得遺產為限，對外負連帶責任</label><span class=\"ljg\">問題三</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tl\">條文</span>§1148-1Ⅰ：繼承開始前二年內受贈 → 視為其所得遺產；丙限度 1,000 萬<span class=\"ljhot\">常錯</span></label><span class=\"ljg\">問題三</span></li><li><label><input type=\"checkbox\"><span class=\"ljt tf\">本題</span>§1153Ⅱ 內部各 300 萬，但乙分擔不逾 200 萬（本文立場）</label><span class=\"ljg\">問題三</span></li></ul></div></div>"}], "timer": true},ID="civess1";
