<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="bx-vp.js"></script>

<script>(function(){try{var s=localStorage.getItem("bx-theme")}catch(e){}if(s)document.documentElement.setAttribute("data-theme",s)})()</script>
<style>
:root{--hl:#FFE58F;--bg:#F8F3E9;--card:#FFFEFA;--fg:#2B2A27;--mut:#6B665C;--line:#E2DACA;--ac:#2F5D50;--ok:#3D7A4A;--okbg:#E7F1E4;--ng:#A8402B;--ngbg:#F7E5DF;--gold:#BC8A2E;--goldbg:#FBF1D9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#6E5716;--bg:#1C1B19;--card:#262421;--fg:#ECE7DD;--mut:#A9A294;--line:#3B3833;--ac:#8FC1AE;--ok:#8FCF9B;--okbg:#1F3324;--ng:#F0957F;--ngbg:#3A2420;--gold:#E2B862;--goldbg:#3A3020;color-scheme:dark}}
:root[data-theme="dark"]{--hl:#6E5716;--bg:#1C1B19;--card:#262421;--fg:#ECE7DD;--mut:#A9A294;--line:#3B3833;--ac:#8FC1AE;--ok:#8FCF9B;--okbg:#1F3324;--ng:#F0957F;--ngbg:#3A2420;--gold:#E2B862;--goldbg:#3A3020;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--mut);font-size:.92rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums}
.stats b{font-size:1.15rem}
.k-ok{color:var(--ok)}.k-ng{color:var(--ng)}.k-mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;cursor:pointer}
.btn{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
.btn.on{border-color:var(--ac);color:var(--ac);font-weight:700}
details summary{cursor:pointer;font-weight:700}
.stuck div{padding:4px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.stuck a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--mut)}
.qh .no{font-weight:700;color:var(--fg);font-size:1rem}
.tag{padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.tag.todo{border-color:var(--ng);color:var(--ng)}.tag.new{border-color:var(--gold);color:var(--gold)}.tag.done{border-color:var(--ok);color:var(--ok)}
.stem{margin:8px 0 10px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg)}
.opt b{margin-right:6px}
.card.done .opt{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--ngbg);border-color:var(--ng)}
.opt .ex{display:none;margin-top:8px;font-size:.95rem;color:var(--fg);white-space:pre-wrap;line-height:1.7}
.ex .pill{display:inline-block;padding:0 9px;margin-right:8px;border-radius:999px;font-weight:700;font-size:.85rem;border:1px solid}
.ex .p-ok{color:var(--ok);border-color:var(--ok);background:var(--okbg)}.ex .p-ng{color:var(--ng);border-color:var(--ng);background:var(--ngbg)}
.ex .core{font-weight:700}.ex .exb{margin-top:4px}.ex .core+.exb{color:var(--mut)}
.ex mark,.an mark,.tr mark{background:var(--hl);color:var(--fg);font-weight:700;border-radius:3px;padding:0 2px}
.opt .who{display:none;margin-left:6px;font-size:.8rem;font-weight:700;padding:0 8px;border-radius:999px;vertical-align:2px}
.opt.ok .who.c{display:inline-block;background:var(--ok);color:var(--card)}.opt.bad .who.y{display:inline-block;background:var(--ng);color:var(--card)}
.card.done .opt:not(.ok):not(.bad){opacity:.78}
.card.done .opt .ex{display:block}
.res{font-weight:700;margin:4px 0}.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
.tr{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--goldbg);font-size:.92rem;white-space:pre-wrap}
.card.done .tr.has{display:block}
.an{display:none;margin-top:8px;font-size:.92rem;white-space:pre-wrap;line-height:1.7}.an b{display:block;margin-bottom:2px}
.card.done .an.has{display:block}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;font-weight:700;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.hist div{font-size:.92rem;padding:2px 0}
.fin{border-color:var(--ac)}.fin a,.score a{color:var(--ac)}
.card{scroll-margin-top:56px}
a.src{color:var(--ac)}
#hub{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px}
</style>

</head><body><div class="wrap">
<h1>@@NAME@@錯題複習卷</h1>
<div class="sub">從@@NAME@@所有模擬卷和歷屆真題抽題。答錯過、還沒放過的題先出，再補沒做過的新題，兩種混在一起考。@@RATIO_TXT@@<br>放過規則：第一次就答對的題直接放過；答錯過的題要<b>連續答對 3 次</b>才放過，中間錯一次就從 0 重算。</div>
<div class="box"><div class="stats" id="st"></div>
<div class="row"><span class="k-mut">一份幾題：</span><span id="nsel"></span></div>
<div class="row"><label><input type="checkbox" id="useh" checked> 新題不夠時，補歷屆真題</label></div>
<div class="row"><button class="btn pri" id="go">產生新的一份</button><span class="k-mut" id="hint"></span></div></div>
<details class="box" id="stk"><summary>一直錯的題</summary><div class="stuck" id="stuck"></div></details>
<div id="paper"></div>
<details class="box"><summary>本複習卷歷次紀錄</summary><div class="hist" id="hist"></div></details>
</div>
<a id="hub" href="@@HUB@@" title="回備考中心">🏠</a>
<script>
(function(){
var S=BXPOOL.S,P=BXPOOL.papers,Q=BXPOOL.q,BY={},L="ABCD";Q.forEach(function(q){BY[q.id]=q});
var CK="bx_drillcur_"+S,HK="bx_drillh_"+S,NK="bx_drilln_"+S;
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function srcHtml(q){var p=P[q.p];return p?'<a class="src" href="'+encodeURI(p[1])+'" target="_blank" rel="noopener">'+esc(q.src)+'</a>':esc(q.src)}
function badge(r){var s=BXMR.state(r);return s==="new"?'<span class="tag new">新題</span>':s==="done"?'<span class="tag done">已放過</span>':'<span class="tag todo">錯過・連對 '+r.s+'/3</span>'}
var N=ld(NK,25);
/* 歷屆題同步寫入各科刷題作答紀錄（指揮中心「選擇題」進度與錯題本讀這裡）：id＝章-年-題，民法章＝篇字母 */
var Q2={civ:"bxm-q2",land:"bx-q2",jj:"bxj-q2",val:"bxv-q2"};
function q2rec(q,i,ok){try{if(q.p!=="h"||!q.sec||!Q2[S])return;var m=/^h:(\d+)-(\d+)$/.exec(q.id);if(!m)return;
 var ch=S==="civ"?q.sec.charAt(0):q.sec,key=Q2[S],DB=ld(key,{}),id=ch+"-"+m[1]+"-"+m[2],r=DB[id]||{n:0,w:0,h:[]};
 r.c=i;r.ok=ok?1:0;r.g=0;r.k="";delete r.sh;r.t=Math.floor(Date.now()/1000);r.n=(r.n||0)+1;if(!ok)r.w=(r.w||0)+1;
 (r.h=r.h||[]).push([r.t,r.ok,0]);if(r.h.length>10)r.h.shift();DB[id]=r;sv(key,DB)}catch(e){}}
function stats(){var A=BXMR.all(S),c={done:0,todo:0,nm:0,nh:0};
 Q.forEach(function(q){var s=BXMR.state(A[q.id]);if(s==="done")c.done++;else if(s==="todo")c.todo++;else if(q.p==="h")c.nh++;else c.nm++});
 $("st").innerHTML='<span>題庫共 <b>'+Q.length+'</b></span><span>已放過 <b class="k-ok">'+c.done+'</b></span><span>還要練 <b class="k-ng">'+c.todo+'</b></span><span>模擬卷沒做過 <b>'+c.nm+'</b></span><span class="k-mut">歷屆沒做過 '+c.nh+'</span>';
 var st=Q.filter(function(q){var r=A[q.id];return r&&r.w&&!BXMR.done(r)}).sort(function(a,b){var x=A[a.id],y=A[b.id];return y.w-x.w||x.s-y.s||y.t-x.t});
 $("stuck").innerHTML=st.length?st.slice(0,30).map(function(q){var r=A[q.id];return '<div>'+srcHtml(q)+(q.sec?'｜'+esc(q.sec):'')+'｜錯 '+r.w+' 次｜連對 '+r.s+'/3｜最近：'+r.h.split("").map(function(x){return x==="1"?"✓":"✗"}).join("")+'</div>'}).join(""):'<div class="k-mut">目前沒有答錯還沒放過的題。</div>';
 $("stk").querySelector("summary").textContent="一直錯的題（"+st.length+"）";
 $("hint").textContent=c.todo?"這份會先放 "+Math.min(c.todo,Math.ceil(N*0.7))+" 題還要練的":"";
 return c}
var RATIO=@@RATIO@@;
// 章節代碼：sec 開頭「A2」→A2；只有「E」→E（之後依同字母的章分配）
function ck(q){var m=/^([A-I])(\d)?/.exec(q.sec||"");return m?m[1]+(m[2]||""):""}
// 歷屆 107–114 年各章題數＝出題比例
var W={},WT=0;Q.forEach(function(q){var m=/^h:(\d+)-/.exec(q.id);if(m&&+m[1]>=107){var c=ck(q);if(/\d$/.test(c)){W[c]=(W[c]||0)+1;WT++}}});
function inCh(q,c){var k=ck(q);return k===c||k===c.charAt(0)}
// 新題名額依「整份應有題數－已排錯題數」的缺口分配，讓整份接近歷屆比例
function byRatio(out,fresh,K){if(K<=0||!WT)return[];
 var t={};out.forEach(function(id){var c=ck(BY[id]);if(!W[c]&&c)for(var w in W)if(w.charAt(0)===c){c=w;break}t[c]=(t[c]||0)+1});
 var D={},DT=0;for(var c in W){var d=Math.max(0,W[c]/WT*(K+out.length)-(t[c]||0));D[c]=d;DT+=d}
 if(DT<=0){D=W;DT=WT}
 // 系統抽樣：每章拿到 floor 或 ceil，期望值剛好等於比例（小章也有機會出現）
 var q={},u=Math.random(),cum=0,ks=shuf(Object.keys(D));ks.forEach(function(c){var a=Math.floor(cum+u);cum+=D[c]/DT*K;q[c]=Math.floor(cum+u)-a});
 var got=[],seen={};
 Object.keys(q).forEach(function(c){var n=q[c];if(!n)return;
  // 先模擬卷新題（同章優先，再同篇未細分），再歷屆新題
  var a=fresh.filter(function(id){var z=BY[id];return z.p!=="h"&&ck(z)===c}),b=fresh.filter(function(id){var z=BY[id];return z.p!=="h"&&ck(z)===c.charAt(0)}),h=fresh.filter(function(id){var z=BY[id];return z.p==="h"&&ck(z)===c});
  a.concat(b,h).forEach(function(id){if(n>0&&!seen[id]){seen[id]=1;got.push(id);n--}})});
 return got}
function pick(only){var A=BXMR.all(S),todo=[],nm=[],nh=[];
 Q.forEach(function(q){var s=BXMR.state(A[q.id]);if(s==="todo")todo.push(q.id);else if(s==="new")(q.p==="h"?nh:nm).push(q.id)});
 todo.sort(function(a,b){var x=A[a],y=A[b];return x.s-y.s||y.w-x.w||y.t-x.t});
 if(only)return shuf(todo.slice(0,N));
 var nT=Math.min(todo.length,Math.ceil(N*0.7)),out=todo.slice(0,nT),fresh=shuf(nm);
 if($("useh").checked)fresh=fresh.concat(shuf(nh));
 // 11-14 使用者選 A：模擬卷新題先全部做完（模擬卷內仍依各章比例挑），模擬卷沒新題了才依比例出歷屆題
 if(RATIO){var K=N-out.length,m=shuf(nm),pm=byRatio(out,m,K);pm=pm.concat(m.filter(function(x){return pm.indexOf(x)<0})).slice(0,K);
  var ph=[];if(pm.length<K&&$("useh").checked){var hh=shuf(nh);ph=byRatio(out.concat(pm),hh,K-pm.length);ph=ph.concat(hh.filter(function(x){return ph.indexOf(x)<0}))}
  fresh=pm.concat(ph)}
 out=out.concat(fresh.filter(function(x,i,a){return a.indexOf(x)===i&&out.indexOf(x)<0}).slice(0,N-out.length));
 if(out.length<N)out=out.concat(todo.slice(nT,nT+N-out.length));
 return shuf(out)}
function nsel(){$("nsel").innerHTML=[10,25,40].map(function(n){return '<button class="btn'+(n===N?' on':'')+'" data-n="'+n+'">'+n+' 題</button>'}).join(" ");
 [].forEach.call($("nsel").querySelectorAll("button"),function(b){b.onclick=function(){N=+b.dataset.n;sv(NK,N);nsel();stats()}})}
function archive(){var c=ld(CK,null);if(!c)return;var a=0,k=0,w=[];c.ids.forEach(function(id){var p=c.pk[id];if(p===undefined)return;a++;if(BY[id]&&BY[id].ok.indexOf(p)>=0)k++;else w.push(id)});
 if(a){var h=ld(HK,[]);h.push({t:c.t,a:a,c:k,n:c.ids.length,w:w});sv(HK,h.slice(-30))}try{localStorage.removeItem(CK)}catch(e){}}
function hist(){var h=ld(HK,[]);$("hist").innerHTML=h.length?h.slice().reverse().map(function(r,i){var t=new Date(r.t);return '<div>第'+(h.length-i)+'次｜'+(t.getMonth()+1)+'/'+t.getDate()+'｜答對 '+r.c+'/'+r.a+(r.a<r.n?'（共 '+r.n+' 題）':'')+(r.w.length?'｜錯：'+r.w.map(function(id){return BY[id]?esc(BY[id].src):id}).join("、"):'')+'</div>'}).join(""):'<div class="k-mut">還沒有完成的紀錄（按「產生新的一份」時，上一份會存成一筆）。</div>'}
function paper(c,restoring){var host=$("paper");host.innerHTML="";if(!c)return;
 var sc=document.createElement("div");sc.className="score";host.appendChild(sc);
 var fin=document.createElement("div");fin.className="box fin";fin.hidden=true;
 function upd(){var a=0,k=0;c.ids.forEach(function(id){var p=c.pk[id];if(p===undefined)return;a++;if(BY[id].ok.indexOf(p)>=0)k++});
  var all=a===c.ids.length;sc.innerHTML="已答 "+a+"/"+c.ids.length+"｜答對 "+k+(all?'｜<a href="#fin" class="k-ok">✓ 做完了，看下一步 ↓</a>':"");
  fin.hidden=!all;if(!all)return;var A=BXMR.all(S),d=0,t=0,wr=[];c.ids.forEach(function(id){var r=A[id];if(BXMR.done(r))d++;else{t++;}if(BY[id].ok.indexOf(c.pk[id])<0)wr.push(id)});
  var tot=0,dn=0,nm=0,nh=0;Q.forEach(function(q){var s2=BXMR.state(A[q.id]);if(s2==="todo")tot++;else if(s2==="done")dn++;else if(q.p==="h")nh++;else nm++});
  fin.innerHTML='<div id="fin" style="font-weight:700;font-size:1.1rem">這份做完了：答對 '+k+"/"+c.ids.length+'</div>'+
   '<div class="k-mut" style="margin:4px 0 8px">這份 '+c.ids.length+' 題裡：已放過 '+d+'、還要練 '+t+'。整個題庫目前還要練 <b class="k-ng">'+tot+'</b> 題。</div>'+
   '<div class="k-mut" style="margin:0 0 8px">整個題庫共 '+Q.length+' 題：已放過 <b class="k-ok">'+dn+'</b>、還要練 '+tot+'、沒做過 '+(nm+nh)+'（模擬卷 '+nm+'、歷屆 '+nh+'）。全部放過才算結束；照每份 '+N+' 題，沒做過的題至少還要約 '+Math.ceil((nm+nh)/N)+' 份。歷屆題作答也會記進指揮中心的選擇題進度。</div>'+
   (wr.length?'<div style="font-size:.92rem">這次錯的：'+wr.map(function(id){var j=c.ids.indexOf(id)+1;return '<a href="#q'+j+'">第'+j+'題</a>'}).join("、")+'（先點回去看解析，再做下一份）</div>':"")+
   '<div class="row"><button class="btn pri" type="button" data-m="mix">再來一份（錯題＋新題）</button>'+(tot?'<button class="btn" type="button" data-m="only">只練還要練的（'+Math.min(tot,N)+' 題）</button>':"")+'</div>'+
   '<div class="k-mut" style="font-size:.88rem;margin-top:6px">按下去，這份會存進下方「本複習卷歷次紀錄」。</div>';
  [].forEach.call(fin.querySelectorAll("button[data-m]"),function(b){b.onclick=function(){newPaper(b.dataset.m==="only")}})}
 var A=BXMR.all(S);
 c.ids.forEach(function(id,ix){var q=BY[id];if(!q)return;var d=document.createElement("div");d.className="card";d.id="q"+(ix+1);
  var r0=c.st&&c.st[id]?c.st[id]:A[id];
  d.innerHTML='<div class="qh"><span class="no">第'+(ix+1)+'題</span>'+badge(r0)+'<span>'+srcHtml(q)+'</span>'+(q.sec?'<span>'+esc(q.sec)+'</span>':'')+'</div><div class="stem"></div><div class="res"></div><div class="os"></div><div class="an'+(q.an?' has':'')+'"></div><div class="tr'+(q.tr?' has':'')+'"></div>';
  d.querySelector(".stem").textContent=q.stem;d.querySelector(".tr").innerHTML=q.tr?"<b>🎯 陷阱：</b>"+qm(esc(q.tr),[]):"";if(q.an){var an=d.querySelector(".an");an.innerHTML="<b>逐項判斷</b>";an.insertAdjacentHTML("beforeend",qm(esc(q.an.join("\n")),[]))}
  var os=d.querySelector(".os");
  q.opts.forEach(function(t,i){var b=document.createElement("button");b.className="opt";b.type="button";b.innerHTML='<b>('+L[i]+')</b><span class="ot"></span><span class="who c">正解</span><span class="who y">你選的</span><div class="ex"></div>';
   b.querySelector(".ot").textContent=t;b.querySelector(".ex").innerHTML=fx(q,i);
   b.onclick=function(){if(d.classList.contains("done"))return;show(i,false)};os.appendChild(b)});
  function show(i,old){d.classList.add("done");var ok=q.ok.indexOf(i)>=0;
   [].forEach.call(os.children,function(b,j){if(q.ok.indexOf(j)>=0)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
   var r=(old?BXMR.get(S,id):BXMR.rec(S,id,ok))||{};
   if(!old){c.pk[id]=i;sv(CK,c);q2rec(q,i,ok)}
   var res=d.querySelector(".res");res.className="res "+(ok?"ok":"ng");
   res.textContent=(ok?"答對":"答錯，正解 "+q.ok.map(function(k){return L[k]}).join("／"))+"｜"+(BXMR.done(r)?"這題放過了 ✓":r.w?"連對 "+r.s+"/3（錯過的題要連對 3 次）":"");
   upd();if(!old)stats()}
  if(c.pk[id]!==undefined)show(c.pk[id],true);
  host.appendChild(d)});
 host.appendChild(fin);upd()}
