<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="UTF-8">

<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;
--b1:#2F6B8C;--b1s:#E3EFF6;--b2:#7A5BA6;--b2s:#EEE8F6;--b3:#2F7A55;--b3s:#E1F1E8;--b4:#B8782E;--b4s:#F8EBD3;--hl:#FFE9A8}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 1.45rem/1.3 "Noto Serif TC",serif;margin:6px 0 2px;text-wrap:balance}
.lead{color:var(--sub);font-size:.92rem;margin:0 0 14px}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}

.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:.88rem}.top a{white-space:nowrap}.top>span{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}

.sec-h{font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--sub);font-weight:400}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;color:var(--ink)}
.qi .n{font-size:.78rem;color:var(--sub);min-width:4.2em}
.qi .t{min-width:0;font-size:.93rem;line-height:1.5}
.qi .r{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.chip.new{background:var(--acc-soft);color:var(--acc);font-weight:700}
.chip.hard{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.mid{background:var(--b1s);color:var(--b1);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qi .go{font-size:.8rem;color:var(--pri);font-weight:700}
.more{margin-top:8px}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar .row{display:flex;align-items:center;gap:10px}
.stg{font-weight:700;font-size:.98rem;flex:1;min-width:0}

.segs{display:grid;grid-template-columns:30fr 30fr 150fr 60fr 30fr;gap:3px;margin-top:8px}

.qbox.clamp .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qbox .qx{display:none;margin-left:8px;font-size:.8rem;color:var(--pri);background:none;border:0;padding:0;font-weight:700}.qbox.clamp .qx,.qbox.open .qx{display:inline}
.qbox .qt{white-space:pre-line}

.recall{margin-top:12px;background:var(--acc-soft);border-radius:12px;padding:12px 14px}

.recall ol{margin:4px 0 0;padding-left:1.4em}
.mn{margin-top:10px;font-size:.88rem;color:var(--sub)}

.blk-l{display:inline-block;font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}

.blk .art{color:var(--sub);font-weight:400}
.blk .evp{margin-top:12px}.blk .evh{font-weight:700;margin-top:0}
.blk .evx{display:flex;gap:8px;align-items:baseline}
.blk .lawn{color:var(--ink);font-weight:500;margin-left:2px}
.blk .evli{display:block;padding-left:1.15em;text-indent:-1.15em;margin-top:3px}
.blk .evt{flex:none;font-size:.74em;line-height:1.6;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--sub);font-weight:600}
.blk.dim{opacity:.38}
.blk.focus{outline:2px solid var(--c);outline-offset:-2px}
.cover{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:.92rem}
/* 檢核 */
.ck{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6;cursor:pointer}
.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pri)}
.ck label.on{border-color:var(--ok);background:var(--ok-soft)}
.must{flex:none;font-size:.72rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 7px;margin-top:3px}
.score{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:900 1.8rem/1 "Noto Serif TC",serif;color:var(--pri)}
.score small{color:var(--sub)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:700}
.rate button.on[data-v="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rate button.on[data-v="2"]{border-color:var(--b1);background:var(--b1s);color:var(--b1)}
.rate button.on[data-v="3"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hist{margin-top:10px;font-size:.84rem;color:var(--sub)}
/* 底部操作列 */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.act .hint{font-size:.78rem;color:var(--sub);opacity:.6;flex:1;min-width:0;transition:opacity .8s}
.done-box{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:480px){.modes{grid-template-columns:1fr}.clk{font-size:1.4rem}}
.pz{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;line-height:1;padding:0}
body.paused .pz{background:var(--pri);border-color:var(--pri);color:var(--on)}
.pzbox{display:none;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub)}
.pzbox b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:4px}
body.paused .pzbox{display:block}
body.paused #body,body.paused .qbox,body.paused .ttl,body.paused .meta{display:none}
body.paused .clk{opacity:.5}
body.paused #nextBtn{opacity:.45;pointer-events:none}
.thb{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.howto{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.howto>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:.9rem;color:var(--sub);display:flex;justify-content:space-between;gap:8px}.howto>summary::-webkit-details-marker{display:none}.howto>summary::after{content:"點開 ▾";font-size:.8rem}.howto[open]>summary::after{content:"收起 ▴"}.howto>summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}.howto .hb{padding:0 14px 12px}.howto .hb>*:first-child{margin-top:0}.modes .mode small{display:none}.howto[open]~.modes .mode small{display:block}
.swq{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 2px 0;font-size:.86rem;color:var(--sub)}.swq a{font-weight:600;white-space:nowrap}
.dnb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dnb .btn{text-decoration:none;display:inline-flex;align-items:center}.rv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.rvh{font-weight:700;margin-bottom:8px}.rvnav{display:flex;gap:8px;align-items:center}.rvnav select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 8px;font:inherit;font-size:.88rem}.rvnav .btn{white-space:nowrap;padding:7px 12px}.rvnav .btn:disabled{opacity:.4}#rvB{margin-top:12px}.rvq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}.ck label.miss{opacity:.75}.ck label .mk{font-weight:700;min-width:1.2em}.ck label.on .mk{color:var(--ok)}.kw.miss{opacity:.6}@media(max-width:480px){.rvnav .btn{padding:7px 10px}}
</style><style id="sprint-bardim-css">.act{transition:opacity .8s}.act.dim{opacity:.22}.act.dim:hover,.act.dim:focus-within{opacity:1}.act .hint{font-size:.78rem;color:var(--sub);flex:1;min-width:0}</style>

<div class="wrap">
  <div class="top"><a href="估價備考指揮中心.html">← 指揮中心</a><span style="color:var(--sub)"><span id="sum"></span>　<button type="button" id="thBtn" class="thb" aria-label="切換深淺色"></button>　<a id="swTop" href="估價_申論5分鐘_推理版.html">切到推理版 ▸</a></span></div>

  <!-- 開始畫面 -->
  <section id="home">
    <h1>申論 5 分鐘衝刺</h1>
    <p class="lead">一題約 5 分鐘：讀題 → 先自己想 → 讀考場版 → 對結論 → 關鍵檢核。紀錄與申論範文頁、指揮中心同步（輪數、自評、分數）。</p>
    <details class="howto" id="howto"><summary>流程、時間怎麼分、兩種模式說明</summary><div class="hb"><ul class="flow"><li><b>0:30</b>讀題</li><li><b>0:30</b>先自己想</li><li><b>2:30</b>意義・法條・涵攝</li><li><b>1:00</b>結論</li><li><b>0:30</b>關鍵檢核</li></ul></div></details>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-m="h"><b>⚡ 衝刺</b><small>每段時間到就變紅並自動進下一段；讀過的段落會被蓋住，不能回頭看。</small></button>

    </div>

    <button type="button" class="btn more" id="moreBtn">顯示全部</button>

  <!-- 作答畫面 -->
  <section id="run" hidden>

      <div class="row">
        <div class="stg" id="stg"></div>
        <span class="modechip" id="mchip"></span><button type="button" class="pz" id="pauseBtn" aria-label="暫停">⏸</button>

<script>
var CARDS=/*__DATA__*/[];
var STG=[{n:'① 讀題',d:'看清楚問什麼、問幾問',s:30},{n:'② 先自己想',d:'不看答案，先列出條號與分點',s:30},{n:'③ 意義・法條・涵攝',d:'先看（一）（二）小標，再看例、理由',s:150},{n:'④ 結論',d:'對照題目每一問有沒有回答到',s:60},{n:'⑤ 關鍵檢核',d:'不看答案，勾出你剛剛有想到的',s:30}];
var TOTAL=300, LOG='bxv-es-log', SP='bxv-es-sprint', MK='bxv-sprint-mode';
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}
function sv(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function mmss(s){var a=Math.abs(s);return (s<0?'+':'')+Math.floor(a/60)+':'+('0'+(a%60)).slice(-2)}
var RL={1:'✅ 熟',2:'📖 還沒背起來',3:'😵 太難'}, VN={ok:1,mem:2,hard:3};
function rdList(){try{var a=JSON.parse(localStorage.getItem('bx-essay-read')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}

/* ---- 模式 ---- */
var mode='h';try{mode=localStorage.getItem(MK)||'h'}catch(e){}
function paintMode(){[].forEach.call(document.querySelectorAll('.mode'),function(b){b.classList.toggle('on',b.getAttribute('data-m')===mode)})}
[].forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){mode=b.getAttribute('data-m');try{localStorage.setItem(MK,mode)}catch(e){}paintMode()}});
paintMode();

/* ---- 狀態與排序：沒做過的優先，再來不熟的 ---- */
function stat(id){
  var L=ld(LOG)[id]||{}, S=ld(SP)[id]||[], R=rdList().indexOf(id)>=0;
  var last=S[0]||null;
  return {n:(L.n||0), sp:S.length, v:VN[L.v]||0, last:last, read:!!R, t:Math.max(L.t||0,last?last.t:0)};
}
function order(){
  var arr=CARDS.map(function(c,i){var s=stat(c.id);return {c:c,s:s,i:i}});
  function kindRank(c){return ({off:0,pred:1,mkc:2,mkls:3})[c.k]!=null?({off:0,pred:1,mkc:2,mkls:3})[c.k]:4}
  var fresh=arr.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read});
  var seen=arr.filter(function(x){return x.s.n||x.s.sp||x.s.read});
  fresh.sort(function(a,b){return kindRank(a.c)-kindRank(b.c)||a.c.tier-b.c.tier||a.i-b.i});
  function vr(v){return v===3?0:(v===2?1:(v===0?2:3))}
  function pct(x){return x.s.last?x.s.last.sc/Math.max(1,x.s.last.mx):-1}
  seen.sort(function(a,b){return vr(a.s.v)-vr(b.s.v)||pct(a)-pct(b)||a.s.t-b.s.t});
  return fresh.concat(seen);
}
function reason(x){
  var s=x.s,o=[];
  if(!s.n&&!s.sp&&!s.read)o.push('<span class="chip new">沒做過</span>');
  if(s.v===3)o.push('<span class="chip hard">😵 太難</span>');
  else if(s.v===2)o.push('<span class="chip mid">📖 還沒背起來</span>');
  else if(s.v===1)o.push('<span class="chip ok">✅ 熟</span>');
  if(s.sp)o.push('<span class="chip">衝刺 '+s.sp+' 次</span>');
  if(s.last)o.push('<span class="chip">上次 '+s.last.sc+'／'+s.last.mx+'</span>');
  if(s.n)o.push('<span class="chip">讀過 '+s.n+' 輪</span>');
  o.push('<span class="chip">'+esc(x.c.g)+'</span>');
  return o.join('');
}
var showAll=false;
function home(){
  swGo('');
  var Q=order(), f=Q.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read}).length;
  $('qcount').textContent='沒做過 '+f+'・做過 '+(Q.length-f)+'・共 '+Q.length+' 題';
  var tot=0,done=0;CARDS.forEach(function(c){var S=ld(SP)[c.id]||[];tot+=S.length;if(S.length)done++});
  $('sum').textContent='衝刺過 '+done+'／'+CARDS.length+' 題・共 '+tot+' 次';
  var list=showAll?Q:Q.slice(0,8);
  $('qlist').innerHTML=list.map(function(x){return '<button type="button" class="qi" data-id="'+x.c.id+'"><span class="n">'+esc(x.c.no)+'</span><span class="t">'+esc(x.c.t)+'</span><span class="go">開始 ▸</span><span class="r">'+reason(x)+'</span></button>'}).join('');
  [].forEach.call($('qlist').querySelectorAll('.qi'),function(b){b.onclick=function(){start(b.getAttribute('data-id'))}});

var pick='order';
function randPick(ex){var a=CARDS.filter(function(c){return c.id!==ex});return a[Math.floor(Math.random()*a.length)]}
$('startBtn').onclick=function(){pick='order';start(order()[0].c.id)};

/* ---- 作答 ---- */
var cur=null, st=0, stLeft=0, elapsed=0, iv=null, peek=false;
var SWU='估價_申論5分鐘_推理版.html';
function swGo(id){var u=SWU+(id?'#q='+encodeURIComponent(id):'');$('swTop').href=u;var w=$('swq');if(w)w.innerHTML=id?'<span>同一題換個練法</span><a href="'+u+'">這題改用推理版 ▸</a>':''}
var CARDU='估價_申論卡.html';

/* ---- 存檔後：再練一次／看完整解說／回看本題（11-03） ---- */
function doneExtra(revPages){
  var id=cur.id,b=$('body');
  b.insertAdjacentHTML('beforeend','<div class="dnb"><button type="button" class="btn" id="againBtn">🔁 再練一次</button><a class="btn" href="'+CARDU+'?v=0#'+encodeURIComponent(id)+'" target="_blank" rel="noopener">📖 看完整解說（另開）</a></div>'
    +'<div class="rv"><div class="rvh">回看本題（不計時）</div><div class="rvnav"><button type="button" class="btn" id="rvP">◀ 上一頁</button><select id="rvS" aria-label="跳到哪一頁"></select><button type="button" class="btn" id="rvN">下一頁 ▶</button></div><div id="rvB"></div></div>');
  $('againBtn').onclick=function(){$('nextBtn').onclick=next;$('quitBtn').textContent='放棄這題';start(id)};
  var P=revPages(),i=0;
  $('rvS').innerHTML=P.map(function(p,k){return '<option value="'+k+'">'+(k+1)+'／'+P.length+'　'+esc(p[0])+'</option>'}).join('');
  function go(k){i=Math.max(0,Math.min(P.length-1,k));$('rvS').value=String(i);$('rvB').innerHTML=P[i][1];$('rvP').disabled=i===0;$('rvN').disabled=i===P.length-1}
  $('rvP').onclick=function(){go(i-1)};$('rvN').onclick=function(){go(i+1)};$('rvS').onchange=function(){go(+this.value)};
  go(0);
}
function sprintPages(){
  var rc='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）或哪個公式</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">口訣：<b>'+esc(cur.mn)+'</b></div>':'');
  var ck='<div class="ck">'+cur.ck.map(function(c,i){var g=!!cur.got[i];return '<label class="'+(g?'on':'miss')+'"><span class="mk">'+(g?'✓':'✗')+'</span>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>';
  return [[STG[0].n,'<div class="rvq">'+esc(cur.q)+'</div>'],[STG[1].n,rc],[STG[2].n,evHTML([0,1,2],[],[])],[STG[3].n,evHTML([3],[],[])],[STG[4].n+'（✓ 有勾／✗ 漏掉）',ck],['考場版全文',evHTML([0,1,2,3],[],[])]];
}
function start(id){
  swGo(id);
  setPause(false);
  cur=CARDS.filter(function(c){return c.id===id})[0]; if(!cur)return;
  st=0; stLeft=STG[0].s; elapsed=0; peek=false; cur.got={}; cur.rate=0;
  $('home').hidden=true; $('run').hidden=false; $('act').hidden=false;
  var s=stat(id);
  $('meta').innerHTML='<span>'+esc(cur.no)+'</span><span>'+esc(cur.g)+'</span>'+(cur.lv?'<span>'+esc(cur.lv)+'</span>':'')+'<span>第 '+(s.sp+1)+' 次衝刺'+(s.last?'・上次 '+s.last.sc+'／'+s.last.mx:'')+'</span>';
  $('ttl').textContent=cur.t;
  $('qbox').innerHTML='<div class="qt">'+esc(cur.q)+'</div><span class="nq">本題 '+cur.nq+' 問</span><button type="button" class="qx" id="qx">展開題目</button>';$('qbox').className='qbox';
  $('qx').onclick=function(){var q=$('qbox'),o=q.classList.contains('clamp');q.classList.toggle('clamp',!o);q.classList.toggle('open',o);this.textContent=o?'收起題目':'展開題目'};
  $('mchip').className='modechip '+mode; $('mchip').textContent=mode==='h'?'⚡ 衝刺':'🪑 停留';
  render(); tick(true);
  if(iv)clearInterval(iv); iv=setInterval(function(){tick(false)},1000);
  scrollTo(0,0);
}
function evHTML(show,focus,dim){
  return '<div class="ev">'+cur.b.map(function(h,i){
    if(show.indexOf(i)<0)return '';
    return '<div class="blk b'+(i+1)+(focus.indexOf(i)>=0?' focus':'')+(dim.indexOf(i)>=0?' dim':'')+'">'+h+'</div>'}).join('')+'</div>';
}
function render(){
  var b=$('body'), h='';
  if(st===0){h='<div class="cover">讀完題目，數清楚問幾問。<br>答案在後面，現在先不看。</div>'}
  else if(st===1){h='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）或哪個公式</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">提示口訣（想不出來再看）：<b>'+esc(cur.mn)+'</b></div>':'')}
  else if(st===2){h=evHTML([0,1,2],[2],[])}
  else if(st===3){h=evHTML([0,1,2,3],[3],[0,1,2])}
  else if(st===4){
    var hide=(mode==='h'||!peek);
    h=(hide?'<div class="cover">答案已蓋住。憑記憶勾出你剛剛有想到、考試會寫到的關鍵。'+(mode==='s'?'<br><button type="button" class="btn" id="peekBtn" style="margin-top:8px">偷看一下答案</button>':'')+'</div>':evHTML([0,1,2,3],[],[]))
      +'<div class="ck" id="ck">'+cur.ck.map(function(c,i){return '<label data-i="'+i+'"'+(cur.got[i]?' class="on"':'')+'><input type="checkbox"'+(cur.got[i]?' checked':'')+'>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>'
      +'<div class="score"><span class="big" id="sc"></span><small id="scs"></small></div>'
      +'<div class="rate" id="rate">'+[1,2,3].map(function(v){return '<button type="button" data-v="'+v+'"'+(cur.rate===v?' class="on"':'')+'>'+RL[v]+'</button>'}).join('')+'</div>'
      +'<div class="hist" id="hist"></div>';
  }
  b.innerHTML=h;
  if(st===4){
    var pb=$('peekBtn'); if(pb)pb.onclick=function(){peek=true;render()};
    [].forEach.call(b.querySelectorAll('.ck label'),function(l){var i=+l.getAttribute('data-i'),cb=l.querySelector('input');
      cb.onchange=function(){cur.got[i]=cb.checked;l.classList.toggle('on',cb.checked);score()}});
    [].forEach.call(b.querySelectorAll('#rate button'),function(x){x.onclick=function(){cur.rate=+x.getAttribute('data-v');
      [].forEach.call(b.querySelectorAll('#rate button'),function(y){y.classList.toggle('on',y===x)});paintAct()}});
    score(); hist();
  }
  var qb=$('qbox'); if(!qb.classList.contains('open'))qb.classList.toggle('clamp',st>=2&&st<=4);
  paintStage(); paintAct();
}
function score(){
  var sc=0,mx=cur.ck.length,hm=0,hx=0;cur.ck.forEach(function(c,i){if(cur.got[i])sc++;if(c.h){hx++;if(cur.got[i])hm++}});
  cur.sc=sc;cur.mx=mx;cur.hm=hm;cur.hx=hx;
  $('sc').textContent=sc+'／'+mx;
  $('scs').textContent='關鍵字樣'+(hx?'・必寫 '+hm+'／'+hx:'');
}
function hist(){
  var S=ld(SP)[cur.id]||[];
  $('hist').innerHTML=S.length?'過去衝刺：'+S.slice(0,5).map(function(r){var d=new Date(r.t*1000);return (d.getMonth()+1)+'/'+d.getDate()+' '+r.sc+'／'+r.mx+(r.m==='h'?'⚡':'🪑')}).join('　'):'這題第一次衝刺。';
}
function paintStage(){
  $('stg').innerHTML=STG[st].n+'<small>'+STG[st].d+'</small>';
  [].forEach.call($('segs').children,function(seg,i){seg.classList.toggle('done',i<st);seg.classList.remove('over')});
}
function paintAct(){
  var nb=$('nextBtn');
  if(st<4){nb.textContent=st===3?'去檢核 →':'下一段 →';nb.disabled=false;
    $('hint').textContent=mode==='h'?'時間到會自動往下；讀過的段落會蓋住。':'時間到只會變紅，看完再按下一段。'}
  else{nb.textContent='存檔';nb.disabled=!cur.rate;$('hint').textContent=cur.rate?'':'勾完關鍵後，選一個自評才能存檔。'}

  if(window.barWake)barWake();
}
function tick(first){
  if(!first){ if(paused||document.visibilityState!=='visible')return; elapsed++; stLeft--; }
  var clk=$('clk'),seg=$('segs').children[st].querySelector('b');
  clk.textContent=mmss(stLeft); clk.classList.toggle('red',stLeft<=0);
  seg.style.width=Math.min(100,(STG[st].s-stLeft)/STG[st].s*100)+'%';
  $('segs').children[st].classList.toggle('over',stLeft<0);
  var t=$('tot'); t.textContent='總 '+mmss(elapsed).replace('+','')+'／5:00'; t.classList.toggle('red',elapsed>TOTAL);
  if(stLeft<=0&&mode==='h'&&st<4&&!first){next()}
}
function toConc(){var b=document.querySelector('#body .blk.b4');if(!b)return;var bar=document.querySelector('.bar');var y=b.getBoundingClientRect().top+scrollY-(bar?bar.offsetHeight:0)-8;setTimeout(function(){scrollTo({top:y,behavior:'smooth'})},60)}
function next(){
  if(paused)return;
  if(st>4)return;
  if(st<4){st++;stLeft=STG[st].s;render();tick(true);scrollTo(0,0);if(st===3)toConc();return}
  save();
}
function save(){
  if(!cur.rate)return;
  var now=Math.floor(Date.now()/1000);
  var S=ld(SP); S[cur.id]=[{t:now,sc:cur.sc,mx:cur.mx,hm:cur.hm,hx:cur.hx,m:mode,sec:elapsed,v:cur.rate}].concat(S[cur.id]||[]).slice(0,30); sv(SP,S);
  var L=ld(LOG), r=L[cur.id]=L[cur.id]||{n:0,s:[],tot:0};
  r.n=(r.n||0)+1; r.tot=(r.tot||0)+elapsed; r.s=[elapsed].concat(r.s||[]).slice(0,5); r.v=['','ok','mem','hard'][cur.rate]; r.t=now; sv(LOG,L);
  clearInterval(iv); iv=null;
  var nx=pick==='rand'?{c:randPick(cur.id)}:order().filter(function(x){return x.c.id!==cur.id})[0];
  $('body').innerHTML='<div class="done-box"><b>已存檔</b>：'+cur.sc+'／'+cur.mx+'・'+RL[cur.rate]+'・用時 '+mmss(elapsed).replace('+','')+'<br><span style="color:var(--sub);font-size:.88rem">範文頁這張卡的輪數、自評與指揮中心紀錄會一起更新。</span>'
    +(nx?'<div style="margin-top:10px;font-size:.9rem">'+(pick==='rand'?'🎲 隨機':'')+'下一題：'+esc(nx.c.no)+'｜'+esc(nx.c.t)+'</div>':'')+'</div>';
  doneExtra(sprintPages);
  $('stg').innerHTML='完成<small>這題的紀錄已同步</small>';
  [].forEach.call($('segs').children,function(seg){seg.classList.add('done')});
  st=5; $('hint').textContent=''; $('quitBtn').textContent='回清單';
  var nb=$('nextBtn'); nb.disabled=!nx; nb.textContent='下一題 ▸';
  nb.onclick=function(){nb.onclick=next;$('quitBtn').textContent='放棄這題';start(nx.c.id)};
}
$('nextBtn').onclick=next;
$('quitBtn').onclick=function(){setPause(false);$('quitBtn').textContent='放棄這題';$('nextBtn').onclick=next;clearInterval(iv);iv=null;cur=null;$('run').hidden=true;$('act').hidden=true;$('home').hidden=false;swGo('');home();scrollTo(0,0)};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!$('home').hidden)home()});
(function(){var m=/^#q=(.+)$/.exec(location.hash||''),id=m?decodeURIComponent(m[1]):'';
  if(id&&CARDS.some(function(c){return c.id===id})){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}start(id)}else home()})();

var paused=false;
function setPause(v){paused=v;document.body.classList.toggle('paused',v);var b=$('pauseBtn');b.textContent=v?'▶':'⏸';b.setAttribute('aria-label',v?'繼續':'暫停');if(!v)scrollTo(0,0)}
$('pauseBtn').onclick=function(){setPause(!paused)};
$('resumeBtn').onclick=function(){setPause(false)};

<script id="sprint-keys">
/* 鍵盤：練習中 →／空白鍵＝下一段（推理版未翻開先翻開）；回看本題 ←／→ 翻頁；空白鍵＝下一題 */
document.addEventListener('keydown',function(e){
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
 var t=e.target,tag=(t&&t.tagName)||'';if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)||(t&&t.isContentEditable))return;
 var k=e.key;if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!==' '&&k!=='Spacebar')return;
 var run=document.getElementById('run');if(!run||run.hidden)return;
 if(document.body.classList.contains('paused'))return;
 var rvP=document.getElementById('rvP'),rvN=document.getElementById('rvN'),nb=document.getElementById('nextBtn');
 function hit(b){if(b&&!b.disabled&&b.offsetParent!==null){e.preventDefault();b.click();return true}return false}
 if(rvP&&rvP.offsetParent!==null){            /* 存檔後：回看本題 */
  if(k==='ArrowLeft')return void hit(rvP);
  if(k==='ArrowRight')return void hit(rvN);
  return void hit(nb);                       /* 空白鍵＝下一題 */
 }
 if(k==='ArrowLeft')return;
 if(hit(document.getElementById('flip')))return;
 hit(nb);
});
</script>
<script id="sprint-bardim">
/* 底部操作列整列淡出：閱讀階段每段 4 秒後變淡；碰到就恢復 */
(function(){var a=document.getElementById('act'),t=null;if(!a)return;
 function reading(){return typeof st==='number'&&st<4}
 window.barWake=function(){a.classList.remove('dim');clearTimeout(t);if(reading())t=setTimeout(function(){if(reading())a.classList.add('dim')},4000)};
 a.addEventListener('pointerdown',function(){if(a.classList.contains('dim'))barWake()},true);
 setInterval(function(){if(!reading()&&a.classList.contains('dim'))a.classList.remove('dim')},500);
})();
</script>
