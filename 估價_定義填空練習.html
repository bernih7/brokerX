<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>估價定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F8F3E9; --ink:#2A2722; --red:#A8402B; --gold:#BC8A2E;
  --green:#5C7A4A; --card:#FFFDF8; --line:#E4DAC4; --muted:#7A6E5E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--red),#8c3322);color:#fff;padding:24px 20px 20px;text-align:center}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--red);color:#fff;border-color:var(--red)}

/* main */
main{max-width:720px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:18px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--ink);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:rgba(168,64,43,.08);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:rgba(168,64,43,.15)}
.blank.revealed{
  color:var(--red);
  background:rgba(168,64,43,.12);
  border-bottom-color:var(--green);
}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--red);color:#fff}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:#fff}
.reveal-all-btn.done{background:var(--green);color:#fff;border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.card-hint{font-size:12px;color:var(--muted);margin-bottom:8px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:#F0F6EC;border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:var(--red);font-weight:700}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}
</style>
</head>

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)">
      <span class="blank-mask">＿＿</span><span class="blank-val" style="display:none">${ans}</span>
    </span>`;
  });
  return html;
}

// build nav
const nav = document.getElementById('nav');
const main = document.getElementById('main');
let cardDone = {}; // cardKey -> bool

DATA.forEach((ch,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (ci===0?' on':'');
  btn.textContent = ch.label;
  btn.onclick = ()=> switchCh(ch.id);
  nav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'chapter' + (ci===0?' active':'');
  div.id = 'ch-'+ch.id;

  const total = ch.cards.length;
  div.innerHTML = `<div class="ch-title">${ch.label}</div>
    <div class="prog">
      <div class="prog-bar"><div class="prog-fill" id="pf-${ch.id}" style="width:0%"></div></div>
      <div class="prog-txt" id="pt-${ch.id}">0 / ${total}</div>
    </div>${ch.top||''}`;

  ch.cards.forEach((c,i)=>{
    const key = ch.id+'-'+i;
    cardDone[key] = false;
    const blankCount = (c.blank.match(/___/g)||[]).length;
    const builtBlank = buildBlankLine(c.blank, c.answer, key);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+key;
    card.innerHTML = `
      <div class="term">${c.term}</div>
      <div class="card-hint">💡 點空格顯示答案，再點收起</div>
      <div class="blank-line" id="bl-${key}">${builtBlank}</div>
      <div class="card-btns">
        <button class="reveal-btn" onclick="revealAllBlanks('${key}','${ch.id}',${total})">全部顯示</button>
        <button class="reveal-all-btn" id="rb-${key}" onclick="markDone('${key}','${ch.id}',${total})">已確認 ✓</button>
      </div>
      <div class="answer-note" id="ans-${key}">
        <div class="key-note">${c.answer}</div>
        <div class="src" style="margin-top:6px;font-size:12px;color:var(--muted)">📌 ${c.src}</div>
      </div>`;
    div.appendChild(card);
  });

  main.appendChild(div);
});

function toggleBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val  = el.querySelector('.blank-val');
  const showing = val.style.display !== 'none';
  if (showing) {
    val.style.display = 'none';
    mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = '';
    mask.style.display = 'none';
    el.classList.add('revealed');
  }
}

function revealAllBlanks(key, chId, total) {
  document.querySelectorAll(`.blank[data-key="${key}"]`).forEach(el => {
    el.querySelector('.blank-mask').style.display = 'none';
    el.querySelector('.blank-val').style.display = '';
    el.classList.add('revealed');
  });
  // 同時顯示完整答案注記
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  const btn = document.getElementById('rb-'+key);
  if(btn){ btn.textContent='✓ 完成'; btn.classList.add('done'); }
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 更新進度
  const done = Object.keys(cardDone).filter(k=>k.startsWith(chId+'-')&&cardDone[k]).length;
  const pct = Math.round(done/total*100);
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = pct+'%';
  if(pt) pt.textContent = done+' / '+total;
}

function switchCh(id){
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ch-'+id).classList.add('active');
  [...document.querySelectorAll('.nav-btn')].find(b=>b.textContent.startsWith(id)).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}
