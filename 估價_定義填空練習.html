<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估價定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root[data-theme="light"]{
  --bg:#F8F3E9; --ink:#2A2722; --red:#A8402B; --gold:#BC8A2E;
  --green:#5C7A4A; --card:#FFFDF8; --line:#E4DAC4; --muted:#7A6E5E;
  --blue:#1E3E6E; --surface2:#F0EBE0;
  color-scheme:light;
}
:root{
  --bg:#F8F3E9; --ink:#2A2722; --red:#A8402B; --gold:#BC8A2E;
  --green:#5C7A4A; --card:#FFFDF8; --line:#E4DAC4; --muted:#7A6E5E;
  --blue:#1E3E6E; --surface2:#F0EBE0;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1612; --ink:#F0E8D8; --red:#E05040; --gold:#D4A030;
  --green:#5AAA48; --card:#26201A; --line:#3C3028; --muted:#9A8C7C;
  --blue:#6090D8; --surface2:#302820;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1612; --ink:#F0E8D8; --red:#E05040; --gold:#D4A030;
  --green:#5AAA48; --card:#26201A; --line:#3C3028; --muted:#9A8C7C;
  --blue:#6090D8; --surface2:#302820;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--red),#8c3322);color:#fff;padding:24px 20px 20px;text-align:center}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--red);color:#fff;border-color:var(--red)}

/* main */
main{max-width:720px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:18px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--ink);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:rgba(168,64,43,.08);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:rgba(168,64,43,.15)}
.blank.revealed{
  color:var(--red);
  background:rgba(168,64,43,.12);
  border-bottom-color:var(--green);
}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--red);color:#fff}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:#fff}
.reveal-all-btn.done{background:var(--green);color:#fff;border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.section-hint{font-size:11px;color:#AAA09A;margin-bottom:14px;letter-spacing:.3px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:#F0F6EC;border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:var(--red);font-weight:700}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 模式切換 tab */
.mode-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.mode-tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px 0;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .15s}
.mode-tab.on{color:var(--red);border-bottom-color:var(--red);background:transparent}

/* 測驗模式 */
#quiz-mode{display:none;max-width:720px;margin:0 auto;padding:20px 16px 80px}
#quiz-mode.active{display:block}

/* 章節過濾 */
.quiz-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qf-btn{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.qf-btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.qf-all.on{background:var(--ink);border-color:var(--ink)}

/* 題卡 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px 16px;margin-bottom:16px}
.qc-meta{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px}
.qc-chapter{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qc-counter{font-size:11px;color:var(--muted)}
.qc-term{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
  color:var(--red);margin-bottom:14px;text-wrap:balance}
.qc-blank{font-size:14px;line-height:2.4;color:var(--ink);margin-bottom:14px;
  word-break:break-all}
.qc-blank .blank{
  display:inline-block;border-bottom:2px solid var(--red);
  padding:0 3px;color:transparent;background:rgba(168,64,43,.08);
  border-radius:3px;vertical-align:bottom;cursor:pointer;user-select:none;
  transition:color .18s,background .18s;font-weight:700;font-size:13.5px}
.qc-blank .blank:hover{background:rgba(168,64,43,.15)}
.qc-blank .blank.revealed{color:var(--red);background:rgba(168,64,43,.12);
  border-bottom-color:var(--green)}
.qc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qc-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  border-radius:8px;border:1.5px solid;cursor:pointer;transition:all .15s}
.qc-btn-reveal{border-color:var(--red);color:var(--red);background:transparent}
.qc-btn-reveal:hover{background:var(--red);color:#fff}
.qc-btn-all{border-color:var(--green);color:var(--green);background:transparent}
.qc-btn-all:hover{background:var(--green);color:#fff}
.qc-btn-next{border-color:var(--blue);color:var(--blue);background:transparent}
.qc-btn-next:hover{background:var(--blue);color:#fff}
.qc-btn-prev{border-color:var(--muted);color:var(--muted);background:transparent}
.qc-btn-prev:hover{background:var(--muted);color:#fff}
.qc-btn-prev:disabled{opacity:.3;cursor:default}
.qc-btn-prev:disabled:hover{background:transparent;color:var(--muted)}
.qc-answer{display:none;margin-top:10px;padding:10px 14px;
  background:rgba(92,122,74,.12);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85}
.qc-answer.show{display:block}
.qc-answer .key{color:var(--red);font-weight:700}
.qc-answer .src{margin-top:6px;font-size:12px;color:var(--muted)}
.qc-exam-stat{display:none;margin-top:10px;padding:6px 12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px}
.qc-exam-stat.show{display:block}
.qc-exam-stat strong{color:var(--ink)}
/* 主題切換按鈕 */
#theme-btn{position:fixed;top:10px;right:10px;z-index:50;
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.quiz-progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.quiz-done-banner{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.quiz-done-banner .big{font-size:48px;margin-bottom:8px}
</style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()" title="切換深淺色">☀️</button>
<header>
  <h1>估價概要｜定義填空練習</h1>
  <div class="sub">章節練習 + 隨機測驗模式｜全科 61 題</div>

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)">
      <span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span>
    </span>`;
  });
  return html;
}

function toggleBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val  = el.querySelector('.blank-val');
  const showing = el.classList.contains('revealed');
  if (showing) {
    val.style.display = 'none';
    mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = 'inline';
    mask.style.display = 'none';
    el.classList.add('revealed');
  }
}

function revealAllBlanks(key, chId, total) {
  document.querySelectorAll(`.blank[data-key="${key}"]`).forEach(el => {
    el.querySelector('.blank-mask').style.display = 'none';
    el.querySelector('.blank-val').style.display = '';
    el.classList.add('revealed');
  });
  // 同時顯示完整答案注記
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 顯示考試出題紀錄
  const bstat = document.getElementById('bstat-'+key);
  if(bstat) bstat.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  const btn = document.getElementById('rb-'+key);
  if(btn){ btn.textContent='✓ 完成'; btn.classList.add('done'); }
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 更新進度
  const done = Object.keys(cardDone).filter(k=>k.startsWith(chId+'-')&&cardDone[k]).length;
  const pct = Math.round(done/total*100);
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = pct+'%';
  if(pt) pt.textContent = done+' / '+total;
}

function switchCh(id){
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ch-'+id).classList.add('active');
  [...document.querySelectorAll('.nav-btn')].find(b=>b.textContent.startsWith(id)).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

    browse.style.display = 'none'; nav.style.display = 'none';
    quizEl.classList.add('active');
    tabB.classList.remove('on'); tabQ.classList.add('on');
    initQuiz();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach(c => {
        quizPool.push({ chId: ch.id, chLabel: ch.label, term: c.term, blank: c.blank, answer: c.answer, src: c.src, mc: c.mc||0, essay: c.essay||0 });
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const allBtn = document.createElement('button');
    allBtn.className = 'qf-btn qf-all on';
    allBtn.textContent = '全部章節';
    allBtn.onclick = () => setQuizFilter('ALL', allBtn);
    filterEl.appendChild(allBtn);
    DATA.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'qf-btn';
      btn.textContent = ch.label;
      btn.onclick = () => setQuizFilter(ch.id, btn);
      filterEl.appendChild(btn);
    });
  }
  startQuizRound();
}

function setQuizFilter(id, btn) {
  quizFilter = id;
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  startQuizRound();
}

function startQuizRound() {
  const pool = quizFilter === 'ALL' ? quizPool : quizPool.filter(c => c.chId === quizFilter);
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    area.innerHTML = `<div class="quiz-done-banner"><div class="big">🎉</div>本輪 ${quizQueue.length} 題全部完成！<br><br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(c.answer)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  const qid = 'q' + quizIdx;
  const builtBlank = c.blank.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const plainAns = ans.replace(/<[^>]+>/g, '');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    const idx = ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-qid="${qid}" onclick="toggleQBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span></span>`;
  });

  const statParts = [];
  if (c.mc > 0) statParts.push(`選擇 <strong>${c.mc}</strong> 次`);
  if (c.essay > 0) statParts.push(`申論 <strong>${c.essay}</strong> 次`);
  const statHtml = statParts.length ? statParts.join('　｜　') : '尚無歷屆出題紀錄';

  area.innerHTML = `
    <div class="quiz-card">
      <div class="qc-meta">
        <span class="qc-chapter">${c.chLabel}</span>
        <span class="qc-counter">${quizIdx + 1} / ${quizQueue.length}</span>
      </div>
      <div class="qc-term">${c.term}</div>
      <div class="qc-blank" id="qblank-${qid}">${builtBlank}</div>
      <div class="qc-btns">
        <button class="qc-btn qc-btn-prev" id="qbtn-prev-${qid}" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled' : ''}>← 上一題</button>
        <button class="qc-btn qc-btn-reveal" id="qbtn-reveal-${qid}" onclick="revealOneQuizBlank('${qid}')">顯示一個 ▶</button>
        <button class="qc-btn qc-btn-all" onclick="revealAllQuizBlanks('${qid}')">全部顯示</button>
        <button class="qc-btn qc-btn-next" onclick="nextQuiz()">下一題 →</button>
      </div>
      <div class="qc-answer" id="qans-${qid}">
        <div>${c.answer}</div>
        <div class="src">📌 ${c.src}</div>
      </div>
      <div class="qc-exam-stat" id="qstat-${qid}">${statHtml}</div>
    </div>`;
}

function toggleQBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val = el.querySelector('.blank-val');
  if (val.style.display !== 'none') {
    val.style.display = 'none'; mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = ''; mask.style.display = 'none';
    el.classList.add('revealed');
  }
}

function revealOneQuizBlank(qid) {
  const blanks = document.querySelectorAll(`#qblank-${qid} .blank`);
  for (const b of blanks) {
    if (!b.classList.contains('revealed')) {
      b.querySelector('.blank-mask').style.display = 'none';
      b.querySelector('.blank-val').style.display = '';
      b.classList.add('revealed');
      break;
    }
  }
  // 如果顯示完最後一個，自動全顯示並改按鈕
  const remaining = document.querySelectorAll(`#qblank-${qid} .blank:not(.revealed)`);
  if (remaining.length === 0) {
    revealAllQuizBlanks(qid);
    const revBtn = document.getElementById('qbtn-reveal-' + qid);
    if (revBtn) {
      revBtn.textContent = '下一題 →';
      revBtn.className = 'qc-btn qc-btn-next';
      revBtn.onclick = () => nextQuiz();
    }
  }
}

function revealAllQuizBlanks(qid) {
  document.querySelectorAll(`#qblank-${qid} .blank`).forEach(b => {
    b.querySelector('.blank-mask').style.display = 'none';
    b.querySelector('.blank-val').style.display = '';
    b.classList.add('revealed');
  });
  const ans = document.getElementById('qans-' + qid);
  if (ans) ans.classList.add('show');
  const stat = document.getElementById('qstat-' + qid);
  if (stat) stat.classList.add('show');
}

function nextQuiz() {
  quizIdx++;
  renderQuizCard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function prevQuiz() {
  if (quizIdx > 0) {
    quizIdx--;
    renderQuizCard();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

// ===主題切換===
function updateThemeBtn(theme) {
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  updateThemeBtn(next);
  try { localStorage.setItem('bx-theme', next); } catch(e) {}
}
(function(){
  try {
    const saved = localStorage.getItem('bx-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    updateThemeBtn(saved || 'light');
  } catch(e) {}
})();
</script>
