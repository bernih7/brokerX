<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>估價定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F1E6; --paper:#FFFEFA; --paper-deep:#F0EDE0;
  --fg:#25302C; --ink:#25302C; --ink-soft:#7A8C84;
  --primary:#2F5D50;
  --line:#DDD6C3; --rule:#DDD6C3;
  --muted:#7A8C84; --shadow:rgba(37,48,44,.09);
  --gold:#B8782E; --green:#2F6B45; --blue:#1E6B8C; --mn:#1E5FA8; --ansbg:#9CCBF0; --ansline:#1E6B8C;
  --orange:#B8782E; --purple:#7B5C8C; --red:#2F5D50; --redbg:#2F5D50; --stamp:#2F5D50;
  color-scheme: light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F1D; --paper:#222926; --paper-deep:#1E2420;
    --fg:#E8EDE6; --ink:#E8EDE6; --ink-soft:#7A9488;
    --primary:#5A9E88;
    --line:#2E3A34; --rule:#2E3A34;
    --muted:#7A9488; --shadow:rgba(0,0,0,.3);
    --gold:#D09848; --green:#4A9060; --blue:#4FB0DC; --mn:#7CC8EE; --ansbg:color-mix(in srgb,#4FB0DC 48%,var(--paper)); --ansline:#7CC8EE;
    --orange:#D09848; --purple:#9A7CB0; --red:#8CCFB8; --redbg:#3D7A66; --stamp:#8CCFB8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F1D; --paper:#222926; --paper-deep:#1E2420;
  --fg:#E8EDE6; --ink:#E8EDE6; --ink-soft:#7A9488;
  --primary:#5A9E88;
  --line:#2E3A34; --rule:#2E3A34;
  --muted:#7A9488; --shadow:rgba(0,0,0,.3);
  --gold:#D09848; --green:#4A9060; --blue:#4FB0DC; --mn:#7CC8EE; --ansbg:color-mix(in srgb,#4FB0DC 48%,var(--paper)); --ansline:#7CC8EE;
  --orange:#D09848; --purple:#9A7CB0; --red:#8CCFB8; --redbg:#3D7A66; --stamp:#8CCFB8;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--redbg),color-mix(in srgb,var(--redbg) 70%,#000));color:#fff;padding:24px 20px 20px;text-align:center}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
html,body{overflow-x:hidden;max-width:100%}
.answer-note,.qc-answer,.card{overflow-wrap:anywhere;max-width:100%;box-sizing:border-box}
nav{max-width:100%;box-sizing:border-box;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:none;gap:8px;flex-wrap:wrap;justify-content:center}
nav.open{display:flex}
#navbar{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;justify-content:center;position:sticky;top:0;z-index:10}
#navtog{font:inherit;font-size:13.5px;font-weight:700;padding:6px 18px;border-radius:99px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
#navtog b{color:var(--ink)}
nav .nav-btn{flex:0 0 auto}

.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--redbg);color:#fff;border-color:var(--redbg)}
.nav-btn.h1{background:color-mix(in srgb,var(--gold) 30%,transparent);border-color:var(--gold);color:var(--ink)}
.nav-btn.h2{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.nav-btn.h4{opacity:.72}
.nav-btn.on{background:var(--redbg)!important;color:#fff!important;border-color:var(--redbg)!important;opacity:1}
.nav-btn small{font-size:10px;margin-left:5px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.nav-btn.on small{color:#fff}
.card.h1{background:color-mix(in srgb,var(--gold) 13%,var(--paper))}
.card.h2{background:color-mix(in srgb,var(--gold) 6%,var(--paper))}
.heat{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:5px;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
.heat.h1{background:var(--gold);color:#fff}
.heat.h2{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.heat.h3{background:var(--line);color:var(--muted)}
.ch-heat{font-size:12px;color:var(--muted);margin:-8px 0 14px}


/* main */
main{max-width:1240px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:18px}

/* card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--fg);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--fg);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:color-mix(in srgb,var(--primary) 12%,transparent);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}
.blank.revealed{
  color:var(--red);font-weight:800;
  border-bottom-color:var(--red);margin:0 2px;
}
.blank .blank-mask{display:inline}
.blank.revealed .blank-mask{display:none}
.blank .blank-val{display:none;color:var(--ink)}
.blank.revealed .blank-val{display:inline}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--redbg);color:#fff}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:#fff}
.reveal-all-btn.done{background:var(--green);color:#fff;border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.section-hint{font-size:11px;color:#AAA09A;margin-bottom:14px;letter-spacing:.3px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:color-mix(in srgb,#F2C94C 22%,var(--paper));border-left:3px solid #D9A81E;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:#7A1212;font-weight:800;background:#F3D55B;padding:0 4px;border-radius:3px}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--redbg);color:#fff;font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 模式切換 tab */
.mode-tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}
.mode-tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px 0;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .15s}
.mode-tab.on{color:var(--red);border-bottom:3px solid var(--red);background:transparent}

/* 測驗模式 */
#quiz-mode{display:none;max-width:1240px;margin:0 auto;padding:20px 16px 80px}
#quiz-mode.active{display:block}

/* 章節過濾 */
.quiz-filter{display:none;flex-wrap:wrap;gap:6px;margin-bottom:16px;justify-content:center}
.quiz-filter.open{display:flex}
.navtog{font:inherit;font-size:13.5px;font-weight:700;padding:6px 18px;border-radius:99px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
.navtog b{color:var(--ink)}
.qf-btn{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.qf-btn.on{background:var(--redbg);color:#fff;border-color:var(--redbg)}
.qf-all.on{background:var(--ink);border-color:var(--ink)}

/* 題卡 */
.quiz-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px 16px;margin-bottom:16px}
.qc-meta{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px}
.qc-chapter{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qc-counter{font-size:11px;color:var(--muted)}
.qc-term{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
  color:var(--red);margin-bottom:14px;text-wrap:balance}
.qc-blank{font-size:14px;line-height:2.4;color:var(--fg);margin-bottom:14px;
  word-break:break-all}
.qc-blank .blank{
  display:inline-block;border-bottom:2px solid var(--red);
  padding:0 3px;color:transparent;background:color-mix(in srgb,var(--primary) 12%,transparent);
  border-radius:3px;vertical-align:bottom;cursor:pointer;user-select:none;
  transition:color .18s,background .18s;font-weight:700;font-size:13.5px}
.qc-blank .blank:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}
.qc-blank .blank.revealed{color:var(--red);font-weight:800;border-bottom-color:var(--red)}
.qc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.qc-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  border-radius:8px;border:1.5px solid;cursor:pointer;transition:all .15s}
.qc-btn-reveal{border-color:var(--red);color:var(--red);background:transparent}
.qc-btn-reveal:hover{background:var(--redbg);color:#fff}
.qc-btn-all{border-color:var(--green);color:var(--green);background:transparent}
.qc-btn-all:hover{background:var(--green);color:#fff}
.qc-btn-next{border-color:var(--blue);color:var(--blue);background:transparent}
.qc-btn-next:hover{background:var(--blue);color:#fff}
.qc-nav{margin-left:auto;display:flex;gap:6px}
.qc-ic{font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer}
.qc-ic:disabled{opacity:.3;cursor:default}
.qc-btn-prev{border-color:var(--muted);color:var(--muted);background:transparent}
.qc-btn-prev:hover{background:var(--muted);color:#fff}
.qc-btn-prev:disabled{opacity:.3;cursor:default}
.qc-btn-prev:disabled:hover{background:transparent;color:var(--muted)}
.qc-answer{display:none;margin-top:10px;padding:10px 14px;
  background:rgba(92,122,74,.12);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85}
.qc-answer.show{display:block}
.qc-answer .key{color:#7A1212;font-weight:800;background:#F3D55B;padding:0 4px;border-radius:3px}
.qc-answer .src{margin-top:6px;font-size:12px;color:var(--muted)}
.qc-exam-stat{display:none;margin-top:10px;padding:6px 12px;
  background:var(--paper-deep);border:1px solid var(--line);border-radius:8px;
  font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px}
.qc-exam-stat.show{display:block}
.qc-exam-stat strong{color:var(--ink)}
/* #theme-btn removed — using .theme-toggle only */
.quiz-progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.quiz-done-banner{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.quiz-done-banner .big{font-size:48px;margin-bottom:8px}

/* 主題切換按鈕 */
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:999;
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--paper);
  color:var(--fg);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px var(--shadow);
  transition:all .2s ease;
}
.theme-toggle:hover{background:var(--fg);color:var(--bg);}

</style>
<script src="bxv-use.js"></script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="切換亮/暗模式">🌙</button>

<header>
  <h1>估價概要｜定義填空練習</h1>
  <div class="sub">章節練習 + 隨機測驗模式｜全科 81 題</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab on" id="tab-browse" onclick="setMode('browse')">📖 章節瀏覽</button>
  <button class="mode-tab" id="tab-quiz" onclick="setMode('quiz')">🎲 隨機測驗</button>
</div>

<nav id="nav"></nav>

<main id="main"></main>

<div id="quiz-mode">
  <div class="quiz-filter" id="quiz-filter"></div>
  <div class="quiz-progress" id="quiz-progress"></div>
  <div id="quiz-card-area"></div>
</div>

<a id="hub" href="%E4%BC%B0%E5%83%B9%E5%82%99%E8%80%83%E6%8C%87%E6%8F%AE%E4%B8%AD%E5%BF%83.html" title="回備考指揮中心">🏠</a>

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val">${ans}</span></span>`;
  });
  return html;
}

function fmtAns(h,pair){
  const C='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';let nx=1;
  const pl=h.replace(/<[^>]+>/g,'').length,cnt=(h.match(/[①-⑳]/g)||[]).length;
  const two=pair&&cnt>=4&&pl/cnt<16;
  if(/[②]/.test(h.replace(/<[^>]+>/g,''))){
    h=h.replace(/(^|[\s\u3000→>）。；])([①-⑳])/g,(m,pre,ch)=>{
      if(C.indexOf(ch)===nx){const i=nx;nx++;if(two&&i%2===1)return m;return (pre==='→'||/\s|\u3000/.test(pre)?'':pre)+'<br>'+ch;}
      return m;});
    h=h.replace(/^<br>/,'');
  }
  h=h.replace(/\u3000(?=[二三四五六七八九十]、)/g,'<br>');
  return h;
}

}

function cardAllRevealed(key){return ![...document.querySelectorAll('.blank[data-key="'+key+'"]')].some(e=>!e.classList.contains('revealed'));}
function toggleBlank(el) {
  el.classList.toggle('revealed');
  const key=el.dataset.key, m=key.match(/^(.*)-\d+$/);
  if(el.classList.contains('revealed')&&cardAllRevealed(key)&&m){
    const ch=DATA.find(c=>c.id===m[1]);revealAllBlanks(key,m[1],ch?ch.cards.length:1);

function revealOne(key,chId,total){
  const nx=[...document.querySelectorAll('.blank[data-key="'+key+'"]')].find(e=>!e.classList.contains('revealed'));
  if(nx) nx.classList.add('revealed');
  if(cardAllRevealed(key)) revealAllBlanks(key,chId,total);
}

function revealAllBlanks(key, chId, total) {
  document.querySelectorAll(`.blank[data-key="${key}"]`).forEach(el => {
    el.classList.add('revealed');
  });
  // 同時顯示完整答案注記
  const note = document.getElementById('ans-'+key);

  const bstat = document.getElementById('bstat-'+key);
  if(bstat) bstat.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 更新進度
  const done = Object.keys(cardDone).filter(k=>k.startsWith(chId+'-')&&cardDone[k]).length;
  const pct = Math.round(done/total*100);
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = pct+'%';
  if(pt) pt.textContent = done+' / '+total;
}

}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach(c => {
        quizPool.push({ chId: ch.id, chLabel: ch.label, term: c.term, blank: c.blank, answer: c.answer, src: c.src, mc: c.mc||0, essay: c.essay||0 });
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const allBtn = document.createElement('button');
    allBtn.className = 'qf-btn qf-all on';
    allBtn.textContent = '全部章節';
    allBtn.onclick = () => setQuizFilter('ALL', allBtn);
    allBtn.dataset.q='ALL';
    filterEl.appendChild(allBtn);
    DATA.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'qf-btn';
      btn.textContent = ch.label;
      btn.onclick = () => setQuizFilter(ch.id, btn);
      btn.dataset.q=ch.id;
      filterEl.appendChild(btn);
    });
  }
  if(!document.getElementById('qftog')){
    const t=document.createElement('button');t.id='qftog';t.className='navtog';
    t.onclick=()=>{filterEl.classList.toggle('open');t.innerHTML='📑 章節：<b>'+quizFilterLabel()+'</b> '+(filterEl.classList.contains('open')?'▴':'▾');};
    const w=document.createElement('div');w.style.cssText='display:flex;justify-content:center;margin-bottom:10px';w.appendChild(t);filterEl.parentNode.insertBefore(w,filterEl);
    t.innerHTML='📑 章節：<b>全部章節</b> ▾';
  }
  startQuizRound();
}

function quizFilterLabel(){
  if(!quizFilter.size)return '全部章節';
  const n=[...quizFilter].map(id=>{const c=DATA.find(x=>x.id===id);return c?c.label.split(' ')[0]:id;});
  return n.length<=3?n.join('、'):n.slice(0,3).join('、')+' 等'+n.length+'章';
}
function setQuizFilter(id, btn) {
  if(id==='ALL') quizFilter.clear();
  else if(quizFilter.has(id)) quizFilter.delete(id); else quizFilter.add(id);
  document.querySelectorAll('.qf-btn').forEach(b=>{
    const q=b.dataset.q;b.classList.toggle('on',q==='ALL'?quizFilter.size===0:quizFilter.has(q));
  });
  const t=document.getElementById('qftog');if(t)t.innerHTML='📑 章節：<b>'+quizFilterLabel()+'</b> '+(document.getElementById('quiz-filter').classList.contains('open')?'▴':'▾');
  startQuizRound();
}
function startQuizRound() {
  const pool = quizFilter.size === 0 ? quizPool : quizPool.filter(c => quizFilter.has(c.chId));
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    area.innerHTML = `<div class="quiz-done-banner"><div class="big">🎉</div>本輪 ${quizQueue.length} 題全部完成！<br><br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    // 存完成輪數
    try{
      var fc=parseInt(localStorage.getItem('bxe-fill')||'0')+1;
      localStorage.setItem('bxe-fill',fc);
      if(typeof BXREP!=='undefined') BXREP.fillMark('fill');
    }catch(e){}
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(c.answer)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  const qid = 'q' + quizIdx;
  const builtBlank = fmtAns(c.blank,true).replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const plainAns = ans.replace(/<[^>]+>/g, '');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    const idx = ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-qid="${qid}" onclick="toggleQBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span></span>`;
  });

  const statParts = [];
  if (c.mc > 0) statParts.push(`選擇 <strong>${c.mc}</strong> 次`);
  if (c.essay > 0) statParts.push(`申論 <strong>${c.essay}</strong> 次`);
  const statHtml = statParts.length ? statParts.join('　｜　') : '尚無歷屆出題紀錄';

  area.innerHTML = `
    <div class="quiz-card">
      <div class="qc-meta">
        <span class="qc-chapter">${c.chLabel}</span>
        <span class="qc-counter">${quizIdx + 1} / ${quizQueue.length}</span>
      </div>
      <div class="qc-term">${c.term}</div>
      <div class="qc-blank" id="qblank-${qid}">${builtBlank}</div>
      <div class="qc-btns">
        <button class="qc-btn qc-btn-reveal" id="qbtn-reveal-${qid}" onclick="revealOneQuizBlank('${qid}')">顯示一個 ▶</button>
        <button class="qc-btn qc-btn-all" id="qbtn-all-${qid}" onclick="revealAllQuizBlanks('${qid}')">全部顯示</button>
        <button class="qc-btn qc-btn-next qc-after" id="qbtn-nx-${qid}" style="display:none" onclick="nextQuiz()">下一題 →</button>
        <button class="qc-btn qc-btn-prev qc-after" id="qbtn-pv-${qid}" style="display:none" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled' : ''}>← 上一題</button>
        <span class="qc-nav" id="qnav-${qid}"><button class="qc-ic" id="qbtn-prev-${qid}" onclick="prevQuiz()" aria-label="上一題" ${quizIdx === 0 ? 'disabled' : ''}>‹</button><button class="qc-ic" onclick="nextQuiz()" aria-label="下一題">›</button></span>
      </div>
      <div class="qc-answer" id="qans-${qid}">
        <div class="key-note">${fmtAns(c.answer)}</div>
        <div class="src">📌 ${c.src}</div>
      </div>
      <div class="qc-exam-stat" id="qstat-${qid}">${statHtml}</div>
    </div>`;
  tintMnemonic(area);
}

function toggleQBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val = el.querySelector('.blank-val');
  if (val.style.display !== 'none') {
    val.style.display = 'none'; mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = ''; mask.style.display = 'none';
    el.classList.add('revealed');
    const q=el.dataset.qid;if(!document.querySelector('#qblank-'+q+' .blank:not(.revealed)'))revealAllQuizBlanks(q);
  }
}

function revealOneQuizBlank(qid) {
  const blanks = document.querySelectorAll(`#qblank-${qid} .blank`);
  for (const b of blanks) {
    if (!b.classList.contains('revealed')) {
      b.querySelector('.blank-mask').style.display = 'none';
      b.querySelector('.blank-val').style.display = '';
      b.classList.add('revealed');
      break;
    }
  }
  // 如果顯示完最後一個，自動全顯示並改按鈕
  const remaining = document.querySelectorAll(`#qblank-${qid} .blank:not(.revealed)`);
  if (remaining.length === 0) {
    revealAllQuizBlanks(qid);
    const revBtn = document.getElementById('qbtn-reveal-' + qid);
    if (revBtn) revBtn.style.display = 'none';
  }
}

function revealAllQuizBlanks(qid) {
  document.querySelectorAll(`#qblank-${qid} .blank`).forEach(b => {
    b.querySelector('.blank-mask').style.display = 'none';
    b.querySelector('.blank-val').style.display = '';
    b.classList.add('revealed');
  });
  const ans = document.getElementById('qans-' + qid);
  if (ans) ans.classList.add('show');
  const rb = document.getElementById('qbtn-reveal-' + qid); if (rb) rb.style.display='none'; const ab=document.getElementById('qbtn-all-' + qid); if (ab) ab.style.display='none';
  ['qbtn-nx-','qbtn-pv-'].forEach(p=>{const e=document.getElementById(p+qid);if(e)e.style.display='';});
  const qn=document.getElementById('qnav-' + qid); if(qn) qn.style.display='none';
  const stat = document.getElementById('qstat-' + qid);
  if (stat) stat.classList.add('show');
}

function nextQuiz() {
  quizIdx++;
  renderQuizCard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function prevQuiz() {
  if (quizIdx > 0) {
    quizIdx--;
    renderQuizCard();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

// theme handled by themeToggle block below
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/brokerX/sw.js",{scope:"/brokerX/"});</script>
<script>
// 主題切換（統一使用 bx-theme key）
(function(){
  var btn = document.getElementById('themeToggle');
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if(t==='dark') return true;
    if(t==='light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
  }
  function apply(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if(btn) btn.textContent = dark ? '☀️' : '🌙';
  }
  // 初始化：先讀 bx-theme，fallback bxr-theme，再 fallback OS
  try {
    var saved = localStorage.getItem('bx-theme') || localStorage.getItem('bxr-theme');
    if(saved) apply(saved === 'dark');
    else apply(isDark());
  } catch(e){ apply(isDark()); }
  if(btn) btn.addEventListener('click', function(){
    var next = !isDark();
    apply(next);
    try { localStorage.setItem('bx-theme', next ? 'dark' : 'light'); } catch(e){}
  });
})();
</script>
<script>(function(){var nav=document.getElementById('nav');if(!nav)return;var bar=document.createElement('div');bar.id='navbar';var t=document.createElement('button');t.id='navtog';bar.appendChild(t);nav.parentNode.insertBefore(bar,nav);
function lab(){var on=nav.querySelector('.nav-btn.on');t.innerHTML='📑 章節：<b>'+(on?on.textContent.replace(/[★☆\s]+$/,''):'')+'</b> '+(nav.classList.contains('open')?'▴':'▾');}
t.onclick=function(){nav.classList.toggle('open');lab();};
nav.addEventListener('click',function(e){if(e.target.closest('.nav-btn'))setTimeout(lab,30);});
setTimeout(lab,200);})();</script>
