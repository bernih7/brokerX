<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 A篇 99–106年 前期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>📖 民法概要 A篇｜99–106年 前期｜整批刷題練習</h1>
  <span class="ts">📅 2026-07-02｜版本 v1.0</span>
</header>
<div class="bar">
  <div class="filter-btns">
    <button class="fbtn active" data-f="all">顯示全部</button>
    <button class="fbtn" data-f="un">只看未作答</button>
    <button class="fbtn" data-f="wrong">只看答錯</button>
    <button class="fbtn danger" data-f="clear">清除作答紀錄</button>
  </div>
  <span class="stat" id="stat"></span>
</div>
<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill" id="prog" style="width:0%"></div></div></div>
<div class="chips" id="chips"></div>
<main id="main"></main>
<footer>📅 最新編輯時間：2026-07-02｜版本 v1.0｜民法概要 A篇（總則基礎）99–106年 前期｜BrokerX備考專案</footer>
<script>
const QS=[{"year": 99, "num": 1, "ans": "C", "stem": "法人社員總會決議之內容違反法令或章程者，其決議之效力：", "opts": ["有效", "得撤銷", "無效", "效力未定"], "exp": ["✗A. 違反強行法或章程屬於違反效力規定，並非當然有效。", "✗B. 「得撤銷」是總會「召集程序」或「決議方法」違反法令章程時的效果（§56Ⅰ），本題問的是「決議內容」違法，性質不同。", "✓C. 依民法§56Ⅱ，總會決議之「內容」違反法令或章程者，無效。這是考試最愛混淆的地方：程序違法→得撤銷；內容違法→無效。", "✗D. 效力未定通常用於須經第三人承認之情形（如限制行為能力人未得允許之契約），與本題無關。"]}, {"year": 99, "num": 2, "ans": "B", "stem": "現年十七歲的高中生甲，假造其父母的同意函，以3萬元向乙機車行購買中古機車一部，由於沒有駕照無法辦理過戶。試問：甲與乙間之機車買賣契約之效力如何？", "opts": ["效力未定", "有效", "無效", "得撤銷"], "exp": ["✗A. 效力未定是「未使用詐術、單純未得允許」時的效果，本題甲已使用詐術。", "✓B. 依民法§83，限制行為能力人「用詐術」使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效。甲假造同意函屬使用詐術，故買賣契約有效，法律不再保護利用詐術的限制行為能力人。", "✗C. 買賣契約本身並非無效，本題重點在詐術阻斷了限制行為能力保護。", "✗D. 得撤銷通常用於意思表示瑕疵（詐欺、脅迫等被害人一方），此處是甲自己施用詐術，非乙可撤銷之情形。"]}, {"year": 99, "num": 4, "ans": "C", "stem": "以下關於代理制度之敘述，何者正確？", "opts": ["無權代理人所為之法律行為屬無效之法律行為", "甲為乙之代理人，乙在學校被其他同學霸凌，甲憤而到學校為乙出氣毆打霸凌之同學，則應由乙負賠償責任", "代理人於代理權限內以本人名義所為之法律行為對本人有效", "代理人在代理期間，因為無從辨識之故，只能為本人服務，禁止從事自己的法律行為"], "exp": ["✗A. 無權代理原則上是「效力未定」（§170），須經本人承認才生效，並非當然無效。", "✗B. 甲毆打他人是甲個人的侵權行為（事實行為），與「代理」（法律行為）無關，代理不及於事實行為，應由甲自己負責。", "✓C. 代理制度的核心：代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力（§103Ⅰ）。", "✗D. 代理人並非「只能」為本人服務，代理人仍可從事自己的法律行為，僅雙方代理/自己代理受到限制（§106）。"]}, {"year": 99, "num": 5, "ans": "D", "stem": "有一年約70歲之老翁甲，因已有初期失智之現象，其子乙乃向法院聲請對其為輔助宣告，並以乙為其輔助人。則下列敘述何者錯誤？", "opts": ["甲在路上行走時，被超速行駛的機車駕駛丙撞傷，甲如欲與丙和解，應得乙之同意", "甲擅自移轉其所有房屋一棟之所有權給女兒丁，其法律效果為效力未定", "甲平常喜歡與老友上餐館小酌一番，受輔助宣告之後仍然可以自由為之", "甲為無行為能力人"], "exp": ["✓A. 依§15-2Ⅰ第7款，受輔助宣告之人為和解，應經輔助人同意，正確。", "✓B. 未經輔助人同意所為之不動產處分行為，效力未定（§15-2Ⅱ準用§79），正確。", "✓C. 日常生活所必需之行為（如小酌），受輔助宣告之人仍得自為之，無須輔助人同意，正確。", "✗D. 受輔助宣告之人仍具有行為能力，只是就重要法律行為受到限制，並非無行為能力人（無行為能力人是未滿7歲或受監護宣告之人，§13、§15）。此為錯誤選項，即本題答案。"]}, {"year": 99, "num": 7, "ans": "D", "stem": "意定代理權之授與，其法律性質為何？", "opts": ["雙方行為", "共同行為", "無相對人之單獨行為", "有相對人之單獨行為"], "exp": ["✗A. 代理權授與是本人單方的行為，無須代理人承諾即生效，非雙方行為（契約）。", "✗B. 共同行為指多數當事人朝同一目的所為之意思表示（如社團設立行為），與代理權授與不同。", "✗C. 代理權授與須向代理人或向代理行為之相對人為之，屬「有相對人」之單獨行為，並非無相對人。", "✓D. 通說認為代理權授與係本人單方之意思表示，向代理人或相對人為之即生效力，屬有相對人之單獨行為（§167）。"]}, {"year": 99, "num": 8, "ans": "B", "stem": "下列何者，非屬事實行為？", "opts": ["無主物的先占", "對要約的拒絕", "無因管理", "埋藏物的發現"], "exp": ["✗A. 先占（§802）為事實行為：有無所有意思占有無主動產即發生效果，不以意思表示為要件。", "✓B. 拒絕要約是一種「意思通知」，屬於準法律行為，其效果仍依當事人表示的意思內容而定，一般歸類為表示行為（廣義法律行為的一環），與純粹不論表意內容即依法發生效果的事實行為不同，故本題選其為「非屬事實行為」。", "✗C. 無因管理（§172）不以管理人有意思表示為必要，屬事實行為。", "✗D. 埋藏物之發現（§808）為事實行為，發現並占有即依法發生效果。"]}, {"year": 99, "num": 10, "ans": "B", "stem": "14歲之甲未得父母之允許，對同學為債務免除之意思表示，其效力如何？", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A. 免除債務屬單獨行為，並非純獲法律上利益，未得允許不能當然有效。", "✓B. 依§78，限制行為能力人未得法定代理人之允許，所為之「單獨行為」無效（相對於契約行為是效力未定，單獨行為則直接無效，兩者是常考的對比考點）。", "✗C. 得撤銷用於意思表示瑕疵情形，與本題行為能力欠缺無關。", "✗D. 效力未定是「契約」未得允許時的效果（§79），本題是單獨行為（債務免除），法條明文規定為無效而非效力未定。"]}, {"year": 99, "num": 12, "ans": "B", "stem": "甲為房屋仲介公司之員工，經甲之斡旋乙同意將其所有房屋出售於丙，乙丙雙方皆委任甲處理登記及付款事宜並授與代理權，事成之後乙丙應支付甲相當之報酬。以下敘述何者錯誤？", "opts": ["此時雖屬所謂雙方代理，但因已經本人許諾，故可有效", "甲有要事需出國，乃將辦理登記事宜委託同事丁代為處理，因丁之疏失致丙受損害，由於甲並無過失可以無庸負責", "由於委任之事項中包含不動產登記事宜，就此部分包含代理權之授與應做成書面契約", "甲處理相關事務時，應以善良管理人之注意程度，謹慎為之"], "exp": ["✓A. 雙方代理原則上禁止，但本人（乙、丙）許諾者不在此限（§106），正確。", "✗B. 複代理人（丁）之選任及監督如有過失，代理人（甲）本人仍須負責；本題甲並非「無論如何都不負責」，若甲對丁之選任監督有過失仍應負責，故本選項敘述過於絕對，屬錯誤選項，即本題答案。", "✓C. 代理權授與是要式或不要式依所代理行為而定；本題委任事項含不動產物權登記，實務上此部分委任及代理權授與宜作成書面，屬正確敘述。", "✓D. 受任人（甲）處理委任事務，原則上應以善良管理人之注意為之（§535），正確。"]}, {"year": 100, "num": 8, "ans": "A", "stem": "甲向乙承諾當民國100年12月31日那天，要將天上的某一顆星星送給乙，乙並允諾之。則甲乙間之約定效力如何？", "opts": ["因自始客觀不能，故約定無效", "因雙方意思表示合致，故約定有效", "因嗣後客觀不能，故約定有效", "因嗣後主觀不能，故約定有效"], "exp": ["✓A. 星星無法交付，屬於契約成立時「自始」即客觀不能（任何人皆不能實現），依§246Ⅰ，以自始客觀不能之給付為契約標的者，其契約無效。", "✗B. 意思表示合致僅是契約成立要件之一，標的自始客觀不能仍使契約無效，非有效。", "✗C. 「嗣後」不能是指契約成立「後」才發生的不能，本題自始即不能，非嗣後不能。", "✗D. 「主觀」不能是指債務人個人不能給付但他人可以，星星是任何人都不能給付，屬客觀不能，非主觀不能。"]}, {"year": 100, "num": 14, "ans": "C", "stem": "下列何者為附解除條件之法律行為？", "opts": ["甲如能考100分，乙就給甲100元", "甲向乙借1萬元，約定乙每月支付利息100元", "當甲大學畢業時，乙的房屋就不再出租給甲", "甲乙間約定於民國105年時，二人即結婚"], "exp": ["✗A. 「考100分」是使法律行為「開始生效」的條件，屬停止條件（§99Ⅰ）。", "✗B. 此為單純的借貸利息約定，並非附條件行為，屬確定期限或無條件之給付約定。", "✓C. 「大學畢業」這個不確定事實發生時，使已生效的租賃契約「失其效力」，屬解除條件（§99Ⅱ）。", "✗D. 「民國105年」是確定會到來的期日，屬「期限」（始期）而非「條件」（條件是不確定是否發生之事實），此為期限與條件的重要區辨。"]}, {"year": 100, "num": 15, "ans": "A", "stem": "關於死亡宣告，下列敘述何者錯誤？", "opts": ["得聲請死亡宣告者，僅限於失蹤人之利害關係人", "死亡宣告係私法上的制度，不生公法上的效果", "死亡宣告在於結束失蹤人原住居所為中心之法律關係，而不在剝奪失蹤人之權利能力", "死亡宣告為推定死亡，故允許提出反證而撤銷死亡宣告"], "exp": ["✗A（本題答案）. 依§8，聲請權人除利害關係人外，「檢察官」亦得聲請死亡宣告，並非僅限利害關係人，此為常考陷阱。", "✓B. 死亡宣告僅發生私法上（如繼承開始、婚姻關係消滅）之效果，不影響公法上權利義務，正確。", "✓C. 死亡宣告制度目的在了結以失蹤人住居所為中心之法律關係，並非使其喪失權利能力，正確。", "✓D. 死亡宣告採「推定」死亡（§9），得提出反證（如生存事實），經法院撤銷死亡宣告，正確。"]}, {"year": 100, "num": 16, "ans": "C", "stem": "關於財團法人之敘述，下列何者正確？", "opts": ["其權利能力始於訂立捐助章程，終於清算解散", "財團為公益法人，其設立須經地方法院許可", "董事有數人者，除章程另有規定外，各董事均得代表法人", "財團法人並非自然人，無侵權行為能力"], "exp": ["✗A. 法人權利能力始於「登記完成」（成立），而非訂立捐助章程；清算完結才終止，並非清算「解散」時。", "✗B. 財團法人之設立許可，應向「目的事業主管機關」申請，並非地方法院；地方法院僅辦理「登記」。", "✓C. 依§27Ⅱ，董事就法人一切事務對外代表法人，董事有數人者，除章程另有規定外，各董事均得單獨代表法人，正確。", "✗D. 法人對於董事等有代表權人因執行職務所加於他人之損害，與行為人連帶負賠償責任（§28），法人具有侵權行為能力（法人實在說）。"]}, {"year": 100, "num": 17, "ans": "B", "stem": "關於法人依其性質，不得享有下列何種權利？", "opts": ["姓名權", "自由權", "專利權", "名譽權"], "exp": ["✗A. 姓名權（法人為名稱權）性質上法人得享有。", "✓B. 自由權（如人身自由）以自然人之肉體存在為前提，性質上專屬自然人，法人不得享有，此即§26但書「專屬於自然人之權利義務」之典型例。", "✗C. 專利權為財產權之一種，法人得為專利權人。", "✗D. 名譽權法人得享有（例如公司商譽受侵害得請求救濟）。"]}, {"year": 100, "num": 19, "ans": "B", "stem": "甲僱傭17歲未婚之乙為店員，並授與代理權以甲之名義販售物品，若甲之法定代理人均不同意。則：", "opts": ["僱傭契約無效，代理權授與有效", "僱傭契約無效，代理權授與亦無效", "僱傭契約有效，代理權授與無效", "僱傭契約有效，代理權授與亦有效"], "exp": ["✗A. 僱傭契約（雙務契約）未得法定代理人允許，效果應為效力未定或無效需視情形，惟本題重點在後半段代理權授與部分，先看B選項。", "✓B. 僱傭契約屬契約行為，未經法定代理人允許者為效力未定，法定代理人「不同意」（拒絕承認）即確定不生效力，等同無效；而代理權授與係單獨行為，§78規定限制行為能力人未得允許之單獨行為「無效」，故兩者皆確定不生效力，本選項描述結果相符，故為正確答案。", "✗C. 僱傭契約未經法定代理人同意且已明確拒絕，不能謂之有效。", "✗D. 同上，兩者皆不生效力，並非皆有效。"]}, {"year": 100, "num": 20, "ans": "D", "stem": "甲男於民國90年3月1日離開住所，從此失蹤，其妻乙依法聲請死亡宣告，經法院判決宣告死亡。若甲實際上並未死亡，請問下列敘述，何者正確？", "opts": ["推定甲於民國90年3月1日死亡", "受死亡宣告後，甲所為之法律行為均無效", "若甲安然生還，該死亡宣告即自動失去效力", "乙繼承甲之財產，善意處分之部分不受甲生還影響"], "exp": ["✗A. 死亡宣告推定死亡之時點為判決內確定之死亡時，通常為失蹤期間屆滿之時，並非離開住所（失蹤）之當日。", "✗B. 死亡宣告僅發生私法上死亡之擬制效果，甲本人如仍生存，其在外地所為之法律行為仍屬有效，並非當然無效。", "✗C. 死亡宣告須經法院「撤銷」死亡宣告之判決，並非甲生還即自動失效，仍須踐行法定程序。", "✓D. 為保護交易安全，繼承人（乙）於死亡宣告經撤銷前，善意信賴宣告而處分遺產之行為，不因甲事後生還而受影響（民法相關規定及家事事件法意旨），正確。"]}, {"year": 101, "num": 1, "ans": "D", "stem": "下列有關法人之敘述，何者錯誤？", "opts": ["社團法人應設章程", "以遺囑捐助設立財團法人者，不以訂立捐助章程為必要", "應設董事", "應設監察人"], "exp": ["✓A. 社團設立應訂立章程（§47），正確。", "✓B. 以遺囑捐助設立財團者，如遺囑未訂立捐助章程，其應記載事項由主管機關指定之人訂定，不以訂立捐助章程為設立要件，正確（§60Ⅱ意旨）。", "✓C. 法人應設董事，執行法人事務並代表法人（§27Ⅰ），正確。", "✗D（本題答案）. 監察人為法人「得」設之任意機關，並非法定必設機關（§27Ⅳ：「法人得設監察人」），故「應設監察人」之敘述錯誤。"]}, {"year": 101, "num": 2, "ans": "C", "stem": "甲於98年6月1日受乙脅迫，約定將甲所有之動產以遠低於市價之價格出售予乙。事經2年餘後，乙請求甲依約交付該動產。下列敘述何者正確？", "opts": ["甲得於撤銷原先受脅迫所為之意思表示後，拒絕給付", "甲得撤銷受脅迫意思表示之權利行使期間已過，應為給付", "即使甲未撤銷受脅迫所為之意思表示，仍得拒絕給付", "甲得主張與乙所締結之契約自始無效，拒絕給付"], "exp": ["✗A. 依§93，因被脅迫而為意思表示者，撤銷權自脅迫終止後1年內為之，本題已逾2年，撤銷權已消滅，甲不得再撤銷。", "✓C. 甲之撤銷權雖已因除斥期間經過而消滅，但受脅迫係§93規定「自脅迫終止後，1年內」得撤銷，本題脅迫終止後已逾1年（2年餘），撤銷權消滅，契約仍然有效存在，故甲原則上「不得」拒絕給付，惟本題官方答案為C，依當年考選部公告標準答案認定，說明重點在於：因被脅迫而締結之契約屬「得撤銷」而非「無效」，撤銷權消滅後契約繼續有效，甲原則上應依約給付，但選項C陳述與此相反，此題選項設計具爭議，仍請以官方公告答案C為準並注意期限計算為考試核心重點。", "✗B. 撤銷權行使期間確已經過（逾1年），惟依官方標準答案，此非最適選項。", "✗D. 脅迫所為之意思表示屬「得撤銷」，並非「自始無效」，此為意思表示瑕疵法律效果分類的重要考點：詐欺、脅迫→得撤銷；通謀虛偽→無效。"]}, {"year": 101, "num": 22, "ans": "D", "stem": "甲發生車禍傷及腦部，成為植物人，下列敘述何者最正確？", "opts": ["甲成為植物人喪失權利能力", "甲雖成為植物人，但關於個人利益之享受仍具有部分權利能力", "植物人為無行為能力人，並且不具有權利能力", "甲雖成為植物人，仍具有權利能力"], "exp": ["✗A. 權利能力始於出生終於死亡（§6），植物人仍生存，權利能力不因此喪失。", "✗B. 權利能力具有「全有全無」的性質，不會只保留「部分」，選項描述不精確。", "✗C. 植物人縱使受監護宣告而無行為能力，其權利能力仍然存在，行為能力與權利能力是兩個不同概念，不可混淆。", "✓D. 權利能力始於出生終於死亡，植物人生命現象仍存在，自然享有完整權利能力，僅可能因意思能力欠缺而經法院為監護宣告，影響的是行為能力而非權利能力。"]}, {"year": 101, "num": 24, "ans": "B", "stem": "甲為幫助清寒家庭學生求學，捐助三千萬元成立A教育基金會，經主管機關許可後，登記為法人，下列敘述何者最正確？", "opts": ["甲之捐助行為為事實行為", "A教育基金會應設董事", "A教育基金會為公益社團法人", "A教育基金會應設總會，作為基金會之最高意思機關"], "exp": ["✗A. 捐助行為係以財產捐贈成立法人之意思表示，屬法律行為（單獨行為），並非事實行為。", "✓B. 財團法人應設董事，執行財團事務並代表法人對外行使職權（§27Ⅰ準用於財團），正確。", "✗C. 以捐助財產設立、無社員組織者為「財團法人」，非社團法人，本題捐助3000萬元設立基金會，屬財團法人。", "✗D. 財團法人無社員組織，故無「總會」，總會是社團法人特有的最高意思機關，財團法人無此機關設計。"]}, {"year": 101, "num": 26, "ans": "B", "stem": "甲十八歲，已婚，下列敘述何者最正確？", "opts": ["甲已成年", "甲得獨立為有效之單獨行為", "甲授與代理權給乙，其授權行為效力未定", "甲如欲與其配偶兩願離婚，得自行為之，無須得法定代理人之同意"], "exp": ["★注意：本題為修法前之舊制考題，現行民法自112年1月1日起成年年齡已修正為滿18歲（§12），且結婚最低年齡亦修正為18歲，「因結婚而成年」制度已隨之走入歷史。作答本題時之時空背景（101年）為：成年年齡20歲、法定結婚年齡男18歲女16歲，未成年人已結婚者依舊法§13Ⅲ「視為成年」。", "✗A. 依「當年」條文，成年為滿20歲，甲僅18歲，未達成年年齡本身，但因已結婚而依舊法視為成年，惟此為「擬制」而非「已成年」的直接陳述方式，官方以B為最適選項。", "✓B. 甲已婚依舊法規定「視為成年」，取得完全行為能力，得獨立為有效之法律行為（含單獨行為），為官方標準答案。", "✗C. 承B之說明，甲既視為成年，其代理權授與（單獨行為）應屬有效，非效力未定。", "✗D. 選項描述結果雖為正確方向（成年人得自行離婚），但依官方標準答案認定B較為精確完整，仍請以B為準，D非最適答案。"]}, {"year": 101, "num": 31, "ans": "B", "stem": "甲為乙之代理人，下列敘述何者最正確？", "opts": ["若甲為意定代理人，其被相對人丙詐欺所為之代理行為，應由甲自行撤銷", "甲逾越代理權限所為之代理行為，得因乙之承認而確定生效", "若甲僅十六歲，甲所為之代理行為無效", "若甲為乙之法定代理人，得因乙之同意，為雙方代理行為"], "exp": ["✗A. 代理人意思表示是否有瑕疵，依代理人（甲）決之（§105），但撤銷權原則上仍歸屬於本人（乙），因為法律效果歸屬於本人，並非代理人自行撤銷。", "✓B. 代理人逾越代理權限所為之行為為無權代理（表見代理外），屬效力未定，經本人（乙）承認，即溯及發生效力（§170），正確。", "✗C. 代理人不以有行為能力為必要（§104），限制行為能力人亦得為代理人，甲16歲所為代理行為並非無效。", "✗D. 雙方代理禁止規定於§106，但但書規定「經本人許諾」者不在此限；本題乙若為「本人」而甲為法定代理人，實務上法定代理權之性質使雙方代理之許諾較無適用空間（法定代理人通常無法讓限制行為能力之本人「同意」放寬），故本選項描述不精確，非正確答案。"]}, {"year": 101, "num": 34, "ans": "D", "stem": "甲與乙通謀虛偽買賣甲所有之A土地一筆，並將A地所有權移轉給乙，下列敘述何者最正確？", "opts": ["甲與乙所為之通謀虛偽意思表示效力未定", "甲與乙所為之通謀虛偽買賣有效，但所有權之移轉無效", "乙將A地出賣給丙，締結買賣契約，乙與丙之買賣構成無權處分", "乙將A地出賣給丙，締結買賣契約，乙與丙之買賣契約有效"], "exp": ["✗A. 通謀虛偽意思表示，依§87Ⅰ，其效力為「無效」，並非效力未定。", "✗B. 買賣契約（債權行為）與所有權移轉（物權行為）均屬通謀虛偽，兩者皆無效，並非債權行為有效而物權行為無效。", "✗C. 甲乙間之買賣及移轉登記雖然無效，但乙已登記為所有人，乙將A地出賣給丙，乙是以「登記名義人」身分出賣，此買賣契約（債權行為）本身乙丙間仍為有效的債權契約，並非無權處分（無權處分係指就他人之權利標的物為處分，此處乙是出賣行為非移轉行為，且乙丙間之債權契約不因甲乙間物權效力而無效）。", "✓D. 乙丙間之買賣契約（債權行為）本於契約自由原則有效成立；至於物權變動效力則另依§87Ⅰ但書保護善意第三人丙（甲乙通謀虛偽不得對抗善意第三人丙），故乙丙間買賣契約有效，為最正確之敘述。"]}, {"year": 102, "num": 9, "ans": "C", "stem": "甲因負債，為避免債權人強制執行，故與乙訂立虛偽買賣契約，將甲僅有之一棟房屋賣給乙，並將房屋所有權移轉登記於乙（均為通謀虛偽意思表示）。乙將該屋賣給善意之丙，並將房屋所有權移轉登記於善意之丙。下列敘述何者正確？", "opts": ["乙祇是登記名義人，並非真正所有權人，故丙無法取得房屋之所有權", "乙不祇是登記名義人，亦是真正所有權人，故丙可取得房屋之所有權", "丙因信賴不動產之登記，並已依法辦理所有權移轉登記，故取得房屋之所有權", "丙雖信賴不動產之登記，並已依法辦理所有權移轉登記，但仍然無法取得房屋之所有權"], "exp": ["✗A. 甲乙間通謀虛偽意思表示雖無效（乙非真正所有權人），但§87Ⅰ但書明文：不得以其無效對抗善意第三人，故不影響善意丙取得所有權的結果，本選項後段結論錯誤。", "✗B. 乙確實只是登記名義人而非真正所有權人（前半段正確），但後半段丙取得所有權的理由並非因乙是真正所有人，而是善意第三人保護原則，選項邏輯錯誤。", "✓C. 甲乙間買賣及移轉雖無效，但依§87Ⅰ但書，不得以其無效對抗善意第三人丙；丙信賴登記外觀並完成移轉登記，應受保護而取得房屋所有權，此為通謀虛偽意思表示「善意第三人保護」的核心考點。", "✗D. 結論相反，丙應可取得房屋所有權，此為善意保護原則的具體展現。"]}, {"year": 102, "num": 19, "ans": "C", "stem": "甲與女秘書乙發生婚外情，甲與乙約定以繼續維繫婚外情為前提，贈與乙A屋一棟，一年後乙不欲繼續維持不倫關係，A屋該如何處理？", "opts": ["A屋係以解除條件為前提的贈與契約，條件成就，贈與契約解除，A屋須返還給甲", "甲與乙之間的贈與契約係以維繫婚外情為前提，贈與契約內容違反公序良俗無效，A屋須返還給甲", "乙受贈A屋係屬不法原因而為給付者，甲事後不能請求返還A屋", "甲贈與乙A屋為無償行為，故贈與人甲可隨時撤銷該贈與契約，請求返還A屋"], "exp": ["✗A. 本題核心並非條件成就與否的問題，而是贈與原因本身違反公序良俗，一開始即無效，不待條件成就使其「解除」。", "✗B. 前半段「違反公序良俗無效」判斷正確（§72），但後半段「A屋須返還給甲」有誤：贈與既因不法原因而無效，甲交付房屋係本於不法原因之給付，依§180第4款「因不法之原因而為給付者」不得請求返還，故甲不能請求返還A屋，本選項結論錯誤。", "✓C. 契約因違反公序良俗而無效（§72），甲交付A屋係基於「維繫婚外情」此不法原因所為之給付，依§180第4款不法原因之給付不得請求返還，故甲事後不能請求返還A屋，此為正確答案，也是本題最重要的法律陷阱：無效≠當然可以要回。", "✗D. 本題契約已經無效（違反公序良俗），無須再討論「贈與人任意撤銷權」（§408）之適用，且該條本就有除外規定，本選項論述方向錯誤。"]}, {"year": 102, "num": 22, "ans": "B", "stem": "甲未將代理權授與給乙，乙卻以甲之代理人名義與善意之丙訂立買賣契約，甲不承認乙之無權代理行為。下列敘述何者正確？", "opts": ["乙與丙簽訂之買賣契約，效力雖不及於甲，但在乙丙之間有效", "乙與丙簽訂之買賣契約，對甲丙、乙丙均無效，丙得請求乙損害賠償", "乙與丙簽訂之買賣契約，對甲丙、乙丙均無效，丙得請求甲損害賠償", "乙與丙簽訂之買賣契約，對甲丙、乙丙均有效，但丙得撤銷買賣契約"], "exp": ["✗A. 甲拒絕承認後，無權代理行為對甲確定不生效力，且對「乙丙間」也不生效力（因契約是乙以甲之代理人名義訂立，並非乙以自己名義訂約，乙丙間不成立另一個有效契約）。", "✓B. 甲拒絕承認，契約對甲丙、乙丙均確定不生效力（無效）；依§110，無代理權人以他人之代理人名義所為之法律行為，對於善意之相對人（丙），須負損害賠償之責，故丙得向乙（無權代理人）請求損害賠償，正確。", "✗C. 丙得請求損害賠償的對象是無權代理人「乙」，而非本人「甲」，因為甲從未授權，不須負責。", "✗D. 甲既已拒絕承認，契約對甲不生效力，並非有效，選項前提錯誤。"]}, {"year": 102, "num": 25, "ans": "C", "stem": "某甲25歲，為受輔助宣告之人。下列敘述何者正確？", "opts": ["甲之輔助宣告可由其表哥向社會福利機構提出聲請", "甲受輔助宣告後，自行購買不動產的行為，無效", "甲之輔助人乙，不得受讓甲所有的A屋", "甲受輔助宣告後，自行將其所有的智慧型手機贈與好友丙的行為，有效"], "exp": ["✗A. 輔助宣告之聲請權人須為本人、配偶、四親等內親屬等特定範圍（§15-1），且應向「法院」聲請，並非向社會福利機構聲請，表哥（旁系血親五親等）亦非法定聲請權人。", "✗B. 受輔助宣告人為不動產處分等重要行為，未經輔助人同意者，效力未定，並非當然無效（§15-2Ⅱ準用§79）。", "✓C. 依§15-2Ⅲ準用§106，輔助人與受輔助宣告之人為法律行為時，利益相反者受限制（類似禁止自己代理／雙方代理之精神），輔助人乙不得受讓甲之A屋，避免利益衝突，正確。", "✗D. 日常生活所需之行為受輔助宣告人得自為之，但贈與手機予友人非日常生活所必需之行為，屬應經輔助人同意之範圍，未經同意應為效力未定，非當然有效。"]}, {"year": 102, "num": 38, "ans": "A", "stem": "19歲之甲與20歲之乙訂立買賣契約，將一宗土地賣給乙，並將土地所有權移轉登記給乙。下列敘述何者正確？", "opts": ["買賣契約及所有權移轉契約，均需得甲之法定代理人書面或非書面之允許，始生效力", "買賣契約及所有權移轉契約，均需得甲之法定代理人書面允許，一定要書面允許始生效", "買賣契約需得甲之法定代理人書面允許，始生效力；所有權移轉契約則無須書面允許，亦生效力", "所有權移轉契約需得甲之法定代理人書面允許，始生效力；買賣契約則無須書面允許，亦生效力"], "exp": ["✓A. §77限制行為能力人為意思表示應得法定代理人之允許，法條並未要求允許必須以「書面」為之，口頭允許亦可，買賣契約（債權行為）與所有權移轉（物權行為）兩者均須得法定代理人允許（不限書面），始生效力，正確。", "✗B. 法定代理人之允許不以書面為限，本選項限定「一定要書面」錯誤。", "✗C. 物權行為（所有權移轉）同樣是限制行為能力人所為之法律行為，仍須得法定代理人允許，並非無須允許。", "✗D. 買賣契約同樣須得法定代理人允許，並非無須允許即生效力，選項邏輯相反。"]}, {"year": 103, "num": 2, "ans": "B", "stem": "關於形成權，下列敘述何者正確？", "opts": ["所謂形成權係指當事人得依據雙方自由意志，形成法律關係之權利", "形成權的行使，原則上不得附條件或期限", "形成權的行使期間，法律多設有消滅時效", "同意權、抗辯權與解除權均屬形成權"], "exp": ["✗A. 形成權是「單方」以意思表示使法律關係發生、變更或消滅的權利，並非雙方合意，如撤銷權、解除權皆為一方行使即生效力。", "✓B. 形成權行使如附停止條件，則不確定何時生效，影響相對人之法律地位，故原則上不得附條件或期限，正確。", "✗C. 形成權之行使期間通常設有「除斥期間」，而非消滅時效；兩者重要區別：消滅時效完成後，義務人得拒絕給付但債權不消滅；除斥期間經過，形成權本身即消滅，不得再行使。", "✗D. 同意權（如法定代理人承認契約）屬形成權；抗辯權（如同時履行抗辯）不屬形成權，而是拒絕相對人請求之防禦性權利；故並非三者皆屬形成權，敘述錯誤。"]}, {"year": 103, "num": 4, "ans": "A", "stem": "關於社團法人解散時，清算人的職務內容，下列何者正確？①了結現務 ②收取債權 ③清償債務 ④變更章程", "opts": ["①②③", "①②④", "①③④", "②③④"], "exp": ["✓A. 依§84，清算人之職務：①了結現務、②收取債權、③清償債務、④移交賸餘財產。注意「變更章程」（④在題目選項）並非清算人職務，本題①②③正確，對應選項A。", "✗B. ④「變更章程」非清算人之職務（法人解散清算期間不會再變更章程），此組合錯誤。", "✗C. 同上，④非正確職務項目。", "✗D. 缺少①了結現務，此組合不完整。"]}, {"year": 103, "num": 5, "ans": "C", "stem": "下列何者不具有民法上之權利能力？", "opts": ["植物人", "受破產宣告之法人", "合夥", "受監護宣告之自然人"], "exp": ["✗A. 植物人仍屬自然人，權利能力始於出生終於死亡（§6），仍具權利能力。", "✗B. 受破產宣告之法人仍具有法人資格與權利能力，僅其財產之管理、處分權轉由破產管理人行使，法人本身並未消滅。", "✓C. 合夥（民法第667條以下）非法人，不具有獨立之民事主體資格，亦無民法上之「權利能力」，其以「合夥人全體」名義為法律行為，並非合夥本身為主體。這是常考的陷阱：合夥≠法人，無權利能力。", "✗D. 受監護宣告之自然人仍具有完全之權利能力，僅行為能力受到限制（被擬制為無行為能力人），兩者務必分清。"]}, {"year": 103, "num": 6, "ans": "B", "stem": "關於住所，下列敘述何者正確？", "opts": ["限制行為能力人，因特定行為選定居所者，關於其行為，視為住所", "法人，以其主事務所之所在地為住所", "妻，以夫之住所為住所", "一人同時僅得有兩住所"], "exp": ["✗A. §24規定「依一定事實，足認以久住之意思，住於一定之地域者，即為設定其住所於該地」；§22則規定因特定行為選定居所者，關於其行為「視為住所」，但此規定適用於一般人，與限制行為能力人身分無關，敘述有誤。", "✓B. 依§29，法人以其主事務所之所在地為住所，正確。", "✗C. 此為民法舊制之規定，現行民法已修正，妻之住所不再從夫，此考點已過時，但在舊法年代考題中曾出現，須注意。", "✗D. 依§23，一人同時得有「數個」住所，並非僅得有一個或兩個，法無上限限制。"]}, {"year": 103, "num": 7, "ans": "C", "stem": "關於天然孳息，下列敘述何者正確？", "opts": ["稱天然孳息者，謂利息、租金及其他因法律關係所得之收益", "有收取天然孳息權利之人，按其權利存續期間內之日數，取得其孳息", "物之成分及其天然孳息，於分離後，除法律另有規定外，仍屬於其物之所有人", "抵押權之效力，及於抵押物扣押後抵押人就抵押物得收取之天然孳息。但抵押權人，非以扣押抵押物之事情，通知應清償天然孳息之義務人，不得與之對抗"], "exp": ["✗A. 此描述為「法定孳息」（§69Ⅱ），包含利息、租金等因法律關係所生之收益；「天然孳息」是物依其自然性質所生之產物（§69Ⅰ），如果實、動物出生等，兩者勿混淆。", "✗B. 「按日數比例取得孳息」之規定適用於「法定孳息」（§70Ⅱ），天然孳息則係分離時歸屬於有收取權之人（§70Ⅰ），兩者分配方式不同。", "✓C. 依§70Ⅰ前段，天然孳息於分離前屬主物之成分，分離後除法律另有規定外，仍屬於其物之所有人，正確。", "✗D. 選項描述涉及抵押權效力範圍，適用於物上扣押後抵押物孳息之取得問題，此為物權相關規定而非天然孳息定義，且敘述本身與§870-1比較，有細節出入，非最正確答案。"]}, {"year": 103, "num": 8, "ans": "D", "stem": "18歲之甲所為下列何種行為屬於無效？", "opts": ["買賣他人之物", "買賣違章建築", "被脅迫所締結之買賣契約", "撤銷有關買賣之錯誤意思表示"], "exp": ["✗A. 他人之物的買賣（債權行為）本身有效，只是出賣人須負擔取得標的物之義務；無權處分效力未定（§118），但「買賣他人之物」之債權契約本身有效，非無效。", "✗B. 違章建築之買賣屬違法建築物，但此類買賣事實上仍常見，依司法實務，違章建築之買賣在某些情形下仍為有效，且本題詢問「18歲之甲」的行為，重點在行為能力，非標的物合法性。", "✗C. 被脅迫所締結之買賣契約效力為「得撤銷」（§92），並非當然無效，被害人得決定是否撤銷。", "✓D. 撤銷權屬形成權，18歲者為限制行為能力人（舊法20歲成年），所為之撤銷（單獨行為）未得法定代理人允許者，依§78，無效。這是考試重要陷阱：限制行為能力人的「單獨行為」直接無效（§78），非效力未定（效力未定僅適用於契約），而撤銷行為正是單獨行為。"]}, {"year": 103, "num": 10, "ans": "D", "stem": "關於附條件的法律行為，下列敘述何者正確？", "opts": ["附停止條件之法律行為，於條件成就時，失其效力", "附條件的法律行為，其條件成就之效果於條件成就之時發生，不得依當事人之特約變更", "因條件成就而受不利益之當事人，如以不正當行為促其條件之成就者，視為條件已成就", "附條件之法律行為當事人，於條件成否未定前，若有損害相對人因條件成就所應得利益之行為者，負賠償損害之責任"], "exp": ["✗A. 附停止條件之法律行為，於條件成就時「開始」發生效力，而非失其效力（失其效力是解除條件成就時的效果）。", "✗B. 依§99Ⅲ，條件成就之效果，當事人得依特約使其溯及效力發生，故非「不得」依特約變更，本選項錯誤。", "✗C. 以不正當行為「促使」條件成就者，依§101Ⅰ視為條件不成就（保護受不利益之當事人），而非「視為條件已成就」，選項將效果敘述反了。", "✓D. 依§100，附條件法律行為之當事人，於條件成否未定前，若有損害相對人因條件成就所應得利益之行為，負損害賠償責任，此為條件成否未定期間當事人的保護規定，正確。"]}, {"year": 103, "num": 12, "ans": "A", "stem": "下列關於暴利行為之敘述，何者錯誤？", "opts": ["雖違反公序良俗，但有效", "利害關係人得行使撤銷權", "並非詐害債權行為", "應於法律行為後一年內提起救濟"], "exp": ["✗A（本題答案）. 暴利行為（§74）乘他人急迫、輕率或無經驗所為之法律行為，違反公序良俗（§72），依§74，法院得因利害關係人之聲請，撤銷其法律行為，並非「有效」，故「雖違反公序良俗但有效」之敘述錯誤，此為應選之「錯誤」選項。", "✓B. 利害關係人得依§74聲請法院撤銷，正確。", "✓C. 暴利行為係一方乘他方急迫輕率訂約，目的在保護弱勢方，與「詐害債權」（債務人故意以損害債權人之方式處分財產）的性質完全不同，正確。", "✓D. §74規定撤銷須自法律行為發生後「一年」內聲請，為除斥期間，正確。"]}, {"year": 103, "num": 14, "ans": "A", "stem": "關於代理，下列敘述何者正確？", "opts": ["代理人非經本人之許諾，不得既為第三人之代理人，而為本人與第三人之法律行為。但其法律行為，係專履行債務者，不在此限", "代理權之限制及撤回，不得以之對抗善意第三人。至於該第三人有無過失而不知其事實者，則非所問", "代理人於代理權限內，以代理人名義所為之意思表示，直接對本人發生效力", "代理人所為或所受意思表示之效力，不因其為無行為能力人而受影響"], "exp": ["✓A. 依§106，代理人未經本人許諾，不得同時擔任雙方當事人之代理人（雙方代理禁止），但「專履行債務之行為」例外，因此類行為對本人無害，正確。", "✗B. 依§107，代理權之限制及撤回，雖不得以之對抗善意第三人，但若第三人知道或「應知道」（有過失而不知）者，仍得對抗，故「有無過失非所問」之描述錯誤。", "✗C. 代理效力的關鍵是以「本人名義」而非「代理人名義」；以代理人自己名義（即使在授權範圍內）不能對本人發生代理效力，此選項描述錯誤。", "✗D. 依§104，代理人所為或所受意思表示之效力「不因其為限制行為能力人而受影響」；若為「無行為能力人」則不得為有效之意思表示，無行為能力人所為之意思表示無效，故§104保護的是「限制行為能力人」代理人，非無行為能力人，本選項以「無行為能力人」替換，屬錯誤敘述。"]}, {"year": 103, "num": 26, "ans": "B", "stem": "甲忘記乙已清償債務，遂誤將對乙之新臺幣20萬元之債權，以新臺幣15萬元出賣與丙。下列敘述，何者正確？", "opts": ["甲、丙間之買賣契約無效", "甲須負權利瑕疵擔保責任", "丙得主張善意取得該債權", "丙得主張甲應負無權代理人責任"], "exp": ["✗A. 甲乙間之買賣係以「對乙之債權」為標的，甲誤認債權存在，但買賣契約本身在成立上無問題（甲有出售意思、丙有購買意思、合意買賣債權），並非無效。惟甲所出賣之債權實際上不存在（乙已清償），此時涉及權利瑕疵擔保。", "✓B. 甲出賣之債權實際上因乙清償而消滅，即甲出賣的是「不存在的權利」，依出賣人之權利瑕疵擔保責任（§349以下），甲須對丙負權利瑕疵擔保責任，正確。", "✗C. 善意取得（§801、§948）適用於動產物權，「債權」之讓與不適用善意取得原則（債權非動產），丙無法主張善意取得不存在之債權。", "✗D. 無權代理人責任（§110）發生於「無代理權而以代理人名義」為法律行為之情形，本題甲係以自己名義出賣自己（誤以為存在的）債權，並非代理人問題，此主張無所依據。"]}, {"year": 104, "num": 1, "ans": "B", "stem": "甲與乙通謀虛偽意思表示，將甲所有之A地賣予乙並移轉登記為乙所有。嗣後乙擅自將A地出賣丙，並完成移轉登記，惟丙不知甲、乙通謀虛偽意思表示之事。下列敘述，何者正確？", "opts": ["甲與乙間關於A地之買賣契約效力未定", "甲與乙間關於A地之買賣契約無效", "甲與乙間關於A地之買賣契約有效", "乙與丙間關於A地之買賣契約無效"], "exp": ["✗A. 通謀虛偽意思表示依§87Ⅰ為「無效」，並非效力未定。", "✓B. 甲乙通謀虛偽，依§87Ⅰ，其意思表示無效，買賣契約無效；但依但書，不得以此無效對抗善意第三人丙，丙仍得取得A地所有權，正確。", "✗C. 通謀虛偽之意思表示，甲乙間契約無效，並非有效。", "✗D. 乙與丙間之買賣契約（債權行為）本身成立並有效（兩造意思表示合致），且丙為善意，依§87Ⅰ但書受到保護，物權移轉亦對丙有效，故乙丙間買賣契約並非無效。"]}, {"year": 104, "num": 3, "ans": "A", "stem": "甲對乙表示，如不贈與家傳骨董，即告發其走私之事，乙被迫贈與之。該贈與契約之效力為：", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A→ 實際上「得撤銷」才是正確答案，但本題官方標準答案為A（有效）。", "✗B. 依現行法（§92），因脅迫而為意思表示者，得撤銷，並非當然無效（除非同時違反公序良俗§72，但實務上一般脅迫效果為得撤銷）。", "✓C實為正確法律分析. 依§92，因脅迫而為意思表示者，表意人得撤銷之，效果應為「得撤銷」。然考選部公告標準答案為A（有效），可能係在題目設計上考量：「脅迫」使契約「得撤銷」，撤銷前契約仍屬有效存在，而出題者以「在未撤銷前，契約有效」角度出題，選A為官方答案。備考時以官方公告A為正解。", "✗D. 效力未定通常用於限制行為能力人或無權代理情形，脅迫之法律效果非效力未定。", "★備考提醒：脅迫之法律效果正確應為「得撤銷」，此題官方答案有爭議，考試以A為準，實務理解上應記住「脅迫→得撤銷」。"]}, {"year": 104, "num": 4, "ans": "B", "stem": "下列契約，何者不得聲請法院撤銷？", "opts": ["因急迫輕率無經驗而訂立週年利率高達60%之高利貸契約", "乘他人急迫輕率無經驗而訂立之婚約", "債務人所訂立有害及債權之贈與契約", "因被詐欺或被脅迫而訂立之離婚協議"], "exp": ["✗A. 暴利行為（§74），利害關係人得聲請法院撤銷，可以撤銷。", "✓B. 婚約雖得廢除（§976），但婚約之廢除係以書面或當事人之意思表示為之，並非「向法院聲請撤銷」；且婚約為身分行為，§74暴利行為撤銷制度主要針對財產行為，婚約是否適用有爭議，一般不以法院聲請撤銷方式處理，故本選項選為「不得聲請法院撤銷」，為官方正解。", "✗C. 詐害債權行為，債權人得依§244聲請法院撤銷，可以撤銷。", "✗D. 因被詐欺脅迫訂立之離婚協議，依§92得撤銷，但撤銷方式為意思表示，某些身分行為之撤銷須向法院為之，此情形較複雜，本題官方選B為正解。"]}, {"year": 104, "num": 5, "ans": "C", "stem": "甲授權乙為代理人，由乙代為與丙協議及締結房屋買賣事宜。下列敘述，何者正確？", "opts": ["乙明知該房屋有瑕疵仍與丙締約時，甲得對丙主張瑕疵擔保責任", "乙受甲之授權後，得再另受丙之授權，同時代理甲、丙締結買賣契約", "乙死亡時，代理權消滅，不能為繼承之標的", "乙不得為限制行為能力人"], "exp": ["✗A. 意思表示及其瑕疵依§105以代理人（乙）決之，乙明知瑕疵即視為代理人（本人）知情，甲不得反過來對丙主張瑕疵擔保，概念方向錯誤。", "✗B. 雙方代理（同時代理買賣雙方）依§106原則上禁止，須經本人（甲、丙雙方）許諾，並非甲授權後乙即當然得再受丙之授權而為雙方代理。", "✓C. 代理權屬專屬權，具有人身專屬性，代理人死亡時代理權消滅，不能成為繼承標的（§108，代理關係因代理人死亡或喪失行為能力而消滅），正確。", "✗D. 依§104，代理人不以有行為能力為必要，限制行為能力人亦得擔任代理人，乙得為限制行為能力人，本選項描述錯誤。"]}, {"year": 104, "num": 9, "ans": "D", "stem": "甲、乙締結由甲出售其所有之建物予乙之買賣契約，但該建物實際上已於甲、乙締約前一日因火災而全部燒毀。該買賣契約效力如何？", "opts": ["效力未定", "乙得解除契約", "乙得撤銷契約", "無效"], "exp": ["✗A. 效力未定用於限制行為能力或無權代理情形，與本題標的不能問題無關。", "✗B. 契約因自始客觀不能而無效，已無法律效力，無須再以「解除」方式終止（解除是對有效契約之終止手段）。", "✗C. 撤銷用於意思表示瑕疵（如詐欺、脅迫、錯誤），本題並無意思表示瑕疵。", "✓D. 建物於締約前已全部燒毀，給付標的自始即客觀不能（任何人皆無法給付），依§246Ⅰ，以不能之給付為契約標的者，其契約無效，正確。"]}, {"year": 104, "num": 11, "ans": "C", "stem": "甲為成年人，因精神障礙而受監護之宣告，某日甲精神回復而有識別能力，向乙購買手機一只，惟因過失打破櫃台玻璃。下列敘述，何者正確？", "opts": ["甲與乙之手機買賣契約無效，關於打破櫃台玻璃不成立侵權行為", "甲與乙之手機買賣契約有效，關於打破櫃台玻璃成立侵權行為", "甲與乙之手機買賣契約無效，關於打破櫃台玻璃成立侵權行為", "甲與乙之手機買賣契約效力未定，關於打破櫃台玻璃不成立侵權行為"], "exp": ["✗A. 侵權行為以「識別能力」（有識別其行為之責任能力）而非「行為能力」為判斷基礎，甲精神回復時雖有識別能力，仍可成立侵權行為責任，前半段買賣契約無效正確，但後半段否定侵權行為成立錯誤。", "✗B. 受監護宣告之人為無行為能力人（§15），其意思表示無效（§75），買賣契約無效，前半段錯誤。", "✓C. 受監護宣告之人為無行為能力人，意思表示無效，買賣契約無效；但侵權行為以識別能力為要件（§187），甲精神回復有識別能力時，打破玻璃之行為仍可成立侵權行為（§184），正確答案。", "✗D. 買賣契約無效（非效力未定），且侵權行為可成立，兩者均描述錯誤。", "★關鍵分辨：行為能力（意思表示有效與否）≠侵權責任識別能力（侵權行為成立與否）。"]}, {"year": 105, "num": 2, "ans": "B", "stem": "依民法之規定，下列何種非屬法定要式行為？", "opts": ["兩願離婚", "買賣契約", "所有權移轉", "社團章程之訂定"], "exp": ["✗A. 兩願離婚須以書面為之，並須有二人以上之證人簽名（§1050），屬法定要式行為。", "✓B. 買賣契約（§345）依民法規定屬不要式契約，僅須雙方意思表示合致即可成立，不需書面或特定形式，正確（非法定要式行為）。", "✗C. 不動產物權之移轉或設定，應以書面為之（§758Ⅱ），屬法定要式行為。", "✗D. 社團設立應訂立章程（§47），章程訂定須以書面為之，屬要式行為。"]}, {"year": 105, "num": 4, "ans": "A", "stem": "有關人格權之敘述，下列何者錯誤？", "opts": ["自由不得限制", "行為能力不得拋棄", "人格權具有專屬性", "當人格權受侵害時，得請求法院除去其侵害"], "exp": ["✗A（本題答案）. §16規定「權利能力及行為能力，不得拋棄」，但「自由」之限制，民法允許在一定範圍內以「契約」限制（§17Ⅱ但書，限制自由之契約，如約定在特定期間不得從事特定行業，在合理範圍內有效），故「自由不得限制」之說法過於絕對，屬錯誤敘述，為本題應選之答案。", "✓B. 行為能力依§16不得拋棄，正確。", "✓C. 人格權（生命、身體、健康、名譽、隱私等）具有一身專屬性，不得讓與或繼承，正確。", "✓D. §18Ⅰ，人格權受侵害，得請求法院除去其侵害，人格權之保護尚未受侵害時亦得請求防止，正確。"]}, {"year": 105, "num": 5, "ans": "B", "stem": "30歲的甲患有精神疾病，並受監護宣告。某日，甲於精神狀況良好時，單獨到乙電信公司購買手機一支。試問甲乙間之買賣契約，其效力為何？", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A. 受監護宣告之人之意思表示無效（§15、§75Ⅰ），縱使精神狀況回復，在宣告被撤銷前仍屬無行為能力人，其意思表示不因精神回復而有效。", "✓B. 受監護宣告者在監護宣告撤銷前，其意思表示一律無效（§75Ⅰ），不論其精神狀況實際如何，此為法律上的擬制，買賣契約無效，正確。", "✗C. 得撤銷用於意思表示瑕疵，本題係行為能力欠缺導致無效，並非得撤銷。", "✗D. 效力未定用於限制行為能力人契約或無權代理，本題甲為受監護宣告之無行為能力人，效果為無效而非效力未定。", "★必考區分：受監護宣告（無行為能力）→意思表示無效；受輔助宣告（限制特定行為）→未得同意行為效力未定。"]}, {"year": 105, "num": 6, "ans": "D", "stem": "甲誤認為好友所贈與之戒指，乃鍍金之假鑽戒，遂將該戒指以5百元之價格賣給乙，並已交付。甲事後得知此乃真金真鑽之戒指，且價值5萬元。有關此法律行為之敘述，下列何者正確？", "opts": ["甲乙間之買賣契約無效，但物權行為有效", "甲乙間之買賣契約有效，但物權行為無效", "甲乙間之買賣契約得撤銷，但物權行為無效", "甲乙間之買賣契約得撤銷，但物權行為有效"], "exp": ["✗A. 物權行為（交付）採無因原則，其效力不依附於債權行為，無從因債權行為無效而獨立有效；且本題債權行為並非無效，而是得撤銷。", "✗B. 買賣契約因意思表示錯誤（§88）得撤銷，並非有效；物權行為採無因性，亦非無效。", "✗C. 買賣契約得撤銷（正確），但物權行為（交付）依無因性原則，不因債權行為之效力而影響，交付本身有效，並非無效。", "✓D. 甲誤認戒指為假鑽，對物之性質有重大錯誤，買賣契約之意思表示（§88）得撤銷；但已交付（移轉所有權之物權行為）依物權行為無因性原則，其效力獨立於債權行為之外，交付行為有效（乙已取得所有權）。若甲撤銷債權行為，乙須依不當得利返還，但此是撤銷後之效果，撤銷前物權行為有效，正確。"]}, {"year": 105, "num": 8, "ans": "A", "stem": "甲為限制行為能力人，當其為法律行為時，下列何種行為無效？", "opts": ["甲未得母之允許，於父死後3個月內，具狀向法院為拋棄其繼承權之意思表示", "甲以詐術佯稱自己已成年，向乙購買機車一輛", "甲未得父母之同意，擅自接收同學拋棄的筆電一台", "甲未得父母之同意，擅自至福利社購買鉛筆"], "exp": ["✓A. 拋棄繼承權屬「單獨行為」，依§78，限制行為能力人未得法定代理人允許之單獨行為，無效；且拋棄繼承須「一定期間內」以書面向法院聲請（§1174），屬法定要式及有期限之行為，此題測驗點：拋棄繼承為單獨行為→無效。", "✗B. 限制行為能力人使用詐術（佯稱成年），依§83，其法律行為為「有效」，保護善意相對人，而非無效。", "✗C. 接收他人拋棄之動產（無主物先占），屬純獲法律上利益之行為，依§77但書，無須法定代理人允許即有效。", "✗D. 日常生活所必需之行為（購買文具），依§77但書，無須法定代理人允許即有效。"]}, {"year": 106, "num": 2, "ans": "B", "stem": "下列有關從物之敘述，何者錯誤？", "opts": ["所有權狀為房地不動產之從物", "屋頂平台為主物大樓建築之從物", "土地共有人出賣房地全棟時，買賣契約效力及於另一共有人原所同意之同宗建築基地依法留設法定保留空地及退縮地之使用權等從權利在內", "主物之處分及於從物，於主物與從權利之關係，亦可適用"], "exp": ["✓A. 所有權狀是不動產管理文件，常助主物（不動產）之效用且各自獨立（土地/建物權狀屬從物），此為實務常見判決見解，正確。", "✗B（本題答案）. 屋頂平台屬建築物之「一部分」（成分），非獨立存在的「從物」；成分與從物的區別：成分是主物不可分的組成部分，從物是獨立存在但常助主物效用的物，本選項將成分誤稱為從物，錯誤，為應選答案。", "✓C. 買賣主物（建物）之效力及於從物及從權利（如基地保留空地使用權），符合§68「主物之處分，及於從物」，正確。", "✓D. 主物之處分及於從物，類推適用於主物與從權利之關係，正確。"]}, {"year": 106, "num": 5, "ans": "A", "stem": "關於意思表示錯誤，下列敘述何者正確？", "opts": ["當事人資格之錯誤，可能得撤銷之", "表意人得向相對人請求損害賠償", "動機錯誤，均為意思表示內容之錯誤", "表示行為錯誤，不得撤銷"], "exp": ["✓A. 依§88Ⅱ，當事人資格之錯誤，以其錯誤「依交易上之觀念認為重要者」為限，得撤銷，故在符合條件下「可能」得撤銷，正確。", "✗B. 撤銷人（表意人）因錯誤撤銷意思表示，依§91，對於「信其意思表示有效而受損害之相對人」，應負損害賠償責任；是撤銷人對相對人負責，而非「表意人得向相對人請求」，方向相反。", "✗C. 動機錯誤原則上不得撤銷（動機不屬於意思表示內容），僅當事人資格或物之性質之錯誤且依交易上觀念認為重要者，始例外得撤銷，並非「動機錯誤均為意思表示內容之錯誤」。", "✗D. 表示行為錯誤（如口誤、筆誤）屬§88第1項「意思表示之內容有錯誤」，於交易上認為重要者得撤銷，並非不得撤銷。"]}, {"year": 106, "num": 6, "ans": "B", "stem": "甲有A地，且登記為A地所有人。甲因乙之脅迫，出賣且交付A地於乙，於甲尚未撤銷買賣契約前。試問，下列敘述何者正確？", "opts": ["甲得撤銷交付A地於乙之行為", "現占有A地之乙為有權占有人", "乙因此成為A地所有人", "甲乙間之A地的買賣契約，無效"], "exp": ["✗A. 買賣契約在撤銷前仍屬有效，物權移轉（交付及登記）亦有效，甲尚未撤銷前，乙有合法占有A地之原因（買賣契約有效），甲不得單獨撤銷「交付行為」（物權行為）而不撤銷債權行為。", "✓B. 買賣契約在撤銷前有效，乙取得A地有法律上原因（有效的買賣契約），故乙為「有權占有人」，正確。", "✗C. 買賣契約雖撤銷前有效，但不動產所有權移轉尚須完成「登記」（§758Ⅰ），本題僅描述「出賣且交付」，未明說完成登記，若未完成登記則乙未成為A地所有人；縱已登記，在甲撤銷後乙仍應返還，本選項過於絕對。", "✗D. 脅迫所為之意思表示效果為「得撤銷」（§92），而非當然無效，在撤銷前契約仍有效。"]}, {"year": 106, "num": 7, "ans": "D", "stem": "關於消滅時效，下列敘述何者正確？", "opts": ["消滅時效之規定，已登記不動產之回復請求權，亦有適用", "一般消滅時效期間，乃20年", "請求權因其消滅時效完成而消滅", "以租賃動產為營業者之租價請求權，其消滅時效期間為2年"], "exp": ["✗A. 已登記不動產之所有權不因時效而消滅，相應的物上請求權（回復請求權）亦不受消滅時效限制，依最高法院判例，已登記不動產之回復請求權並無消滅時效之適用（但可從反面理解：物上請求權原則不適用時效，且不動產登記有公示效力），選項描述錯誤。", "✗B. 一般消滅時效期間為「15年」（§125），而非20年；20年已為刑法追訴時效，勿混淆。", "✗C. 消滅時效完成後，「請求權」不消滅，而是義務人取得拒絕給付之「抗辯權」（§144Ⅰ），債權本身仍存在，只是無法強制執行；注意：消滅時效讓「請求力」消滅，並非讓「請求權」本身消滅。", "✓D. 依§127第2款，「以租賃動產為營業者之租價」請求權，時效為2年，正確。"]}, {"year": 106, "num": 11, "ans": "A", "stem": "甲有A屋，共95坪，登記為A屋所有人。乙詢問甲A屋坪數，甲告知A屋計有100坪。甲與乙締結100坪之A屋買賣契約。試問，下列敘述何者錯誤？", "opts": ["甲侵害乙之A屋所有權", "乙得解除契約", "乙得請求減少價金", "乙得以甲詐欺為由，撤銷締結該買賣契約之意思表示"], "exp": ["✗A（本題答案）. 甲是A屋「所有人」，其出售行為並非侵害乙的所有權（乙尚未取得所有權），此題情境甲說謊坪數是詐欺或物之瑕疵問題，並非侵權行為，「侵害乙之A屋所有權」描述根本不成立，為錯誤選項，即應選答案。", "✓B. A屋坪數短少，屬物之瑕疵，乙得解除契約（§359），正確。", "✓C. 乙得請求減少價金以彌補坪數短少之損失（§359），正確。", "✓D. 甲故意告知錯誤坪數，屬詐欺（§92），乙得撤銷其意思表示，正確。"]}, {"year": 106, "num": 25, "ans": "D", "stem": "依民法規定，關於一定之數量有文字與號碼不符合之情形時，下列敘述何者錯誤？", "opts": ["若能探求出當事人原意，應以原意為準", "若不能探求出當事人原意，而契約文書上對於同一數量同時以文字及號碼表示有不相符合之情形，應以文字為準", "若不能探求出當事人原意，契約文書上對於同一數量同時以文字及號碼為數次表示時，應以文字最低額為準", "若不能探求出當事人原意，契約文書上對於同一數量同時以文字及號碼為數次表示時，依實務見解，應以數字最低額為準"], "exp": ["✓A. 依§98，解釋意思表示，應探求當事人真意，應以原意為準，正確。", "✓B. 依§71之2（或類似規範），文字與號碼不符時，以文字為準（因文字較不易誤記），正確。", "✓C. 多次表示均不符時，以最低額（文字最低額）為準，以保護義務人，正確。", "✗D（本題答案）. 若數次表示均不符，應以「文字」最低額為準，而非「數字」最低額，本選項將「文字」改為「數字」，敘述錯誤，為應選之「錯誤」選項。"]}, {"year": 106, "num": 26, "ans": "C", "stem": "依民法之規定，法定要式行為有使用文字之必要時，下述情形何者錯誤？", "opts": ["不動產物權之移轉或設定，當事人得以蓋章代替簽名", "兩願離婚之協議書，夫妻雙方得以蓋章代替簽名", "在代筆遺囑之情形，遺囑人得以蓋章代替簽名", "應以書面方式訂立之人事保證契約，雙方得以蓋章代替簽名"], "exp": ["✓A. §3Ⅱ，如有用印章代替簽名之習慣者，得以蓋章代替簽名，不動產物權移轉書面亦適用此原則，正確。", "✓B. 離婚協議書以蓋章代替簽名，符合§3Ⅱ，正確。", "✗C（本題答案）. 代筆遺囑依§1194，遺囑人須「口述遺囑意旨，由遺囑人親自「簽名」」，法律明文規定須親自簽名，而非蓋章可以代替，此為代筆遺囑的特別規定，遺囑人不得以蓋章替代，故本選項「得以蓋章代替簽名」之描述錯誤，為應選答案。", "✓D. 人事保證契約§756-1須以書面為之，書面得以蓋章代替簽名，正確。"]}, {"year": 106, "num": 27, "ans": "D", "stem": "關於撤銷權之性質，下列敘述何者錯誤？", "opts": ["撤銷權屬於形成權之一種，得因撤銷權人單方之意思表示到達相對人時，即生法律關係生效、變更或消滅之效力", "撤銷權之行使期間，不受到消滅時效規定之限制", "撤銷權行使後，其撤銷之客體視為自始無效", "撤銷權須法律明文規定始得發生，當事人間不得以契約約定，由一方當事人因特定事由之發生而取得撤銷權"], "exp": ["✓A. 形成權之行使，以意思表示到達相對人即生效力，撤銷權亦然（§116），正確。", "✓B. 形成權之行使期間為「除斥期間」，不適用消滅時效（除斥期間不得中斷或不完成），正確。", "✓C. 撤銷之效果，民法§114Ⅰ規定，法律行為被撤銷者，視為自始無效（溯及效力），正確。", "✗D（本題答案）. 撤銷權並非僅能由法律明文規定而生，當事人亦得「以契約約定」特定撤銷權（例如商業合約中約定特定情形得解除或撤銷），此為私法自治原則之體現，本選項限縮為「須法律明文」且否定契約約定，描述過於絕對，為錯誤選項，即應選答案。"]}];
const TOTAL=56;
const SK='civlaw_a_drill_p1_v1';
let S={};
try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
const YEARS=[...new Set(QS.map(q=>q.year))].sort((a,b)=>a-b);
let aY='all',aF='all';
function gk(q){return q.year+'_'+q.num}
function getFilt(){
  return QS.filter(q=>{
    const k=gk(q),s=S[k];
    if(aY!=='all'&&q.year!==aY)return false;
    if(aF==='un')return!s;
    if(aF==='wrong')return s&&!s.ok;
    return true;
  });
}
function chips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:ch===q.ans};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
</script>
