<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 A篇 107–114年 後期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>📖 民法概要 A篇｜107–114年 後期｜整批刷題練習</h1>

</header>
<div class="bar">
  <div class="filter-btns">
    <button class="fbtn active" data-f="all">顯示全部</button>

    <button class="fbtn" data-f="wrong">只看答錯</button>
    <button class="fbtn danger" data-f="clear">清除作答紀錄</button>
  </div>
  <span class="stat" id="stat"></span>
</div>
<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill" id="prog" style="width:0%"></div></div></div>

<main id="main"></main>
<footer>📅 最新編輯時間：2026-07-02｜版本 v1.0｜民法概要 A篇（總則基礎）107–114年 後期｜BrokerX備考專案</footer>
<script>
const QS=[{"year": 107, "num": 3, "ans": "C", "stem": "下列有關使者之敘述，何者錯誤？", "opts": ["使者係在傳達他人的意思表示", "使者得為無行為能力人", "身分行為不可藉使者傳達其意思表示", "使者未適時傳達的危險由表意人承擔"], "exp": ["✓A. 使者（messenger）的功能是傳達他人（表意人）已決定的意思表示，有別於代理人（自行決定意思表示內容），正確。", "✓B. 使者僅係傳達機器，不自行決定意思內容，故不需具有行為能力，無行為能力人亦得充任使者，正確。", "✗C（本題答案）. 身分行為（如結婚、離婚）因高度人身專屬性，固然不能由代理人「代理」，但使用使者「傳達」意思表示，部分見解認為仍可為之（使者傳達並非代理，表意人本人仍然作成意思表示，只是由使者傳達），本選項敘述「絕對不可藉使者傳達」過於絕對，為錯誤敘述，即本題答案。", "✓D. 使者未適時傳達之風險（如信件延誤），由表意人（發出意思表示之人）承擔，正確。"]}, {"year": 107, "num": 12, "ans": "D", "stem": "針對民法有關撤銷權之規範，下列敘述何者正確？", "opts": ["撤銷權僅能對不健全的意思表示為之，不得對法律行為或法律關係為之", "任何撤銷權之行使，均只須以意思表示方式為之，即生法律效果", "撤銷權因一定期間內不行使而消滅，此期間稱為消滅時效", "撤銷權之法律性質與解除權相同，均屬形成權之一種"], "exp": ["✗A. 撤銷權不限於不健全意思表示（如詐欺脅迫），法律亦有其他撤銷型態，如撤銷通謀虛偽隱藏行為（§87Ⅱ）、詐害債權行為之撤銷（§244）等，範圍較廣。", "✗B. 大部分撤銷權以意思表示方式行使即生效，但某些撤銷須向法院聲請（如暴利行為§74、詐害債權§244），並非「任何撤銷權」均以意思表示方式為之。", "✗C. 撤銷權之行使期間為「除斥期間」，不適用消滅時效之中斷、不完成等制度，兩者須嚴格區分，本選項稱為「消滅時效」屬錯誤。", "✓D. 撤銷權（如§92脅迫撤銷）與解除權（如§254違約解除）性質相同，均屬「形成權」，即單方意思表示即可使法律關係發生、變更或消滅，正確。"]}, {"year": 107, "num": 13, "ans": "A", "stem": "18歲之甲考取大學後，拿著父母親給的住宿費、生活費至北部求學，擬向乙承租A屋一年。關於甲乙間租賃契約之效力，下列敘述，何者錯誤？", "opts": ["甲為限制行為能力人，故甲所締結之租賃契約無效", "甲得主張關於租賃契約之意思表示，在現代社會中可認為係依其年齡及身分、日常生活所必需者，例外無須得法定代理人允許，契約仍可成立生效", "甲得提出法定代理人就租屋之書面允許，以使契約成立生效", "乙得定期限催告法定代理人，確答是否承認甲乙間租賃契約，以使契約成立生效"], "exp": ["★本題為舊法時代（107年）考題，當時成年年齡為20歲，18歲仍為限制行為能力人。現行法（112年起）已改為18歲成年，故本題情境在現行法下甲已為成年人，但應依本題年度法律狀態作答。", "✗A（本題答案）. 限制行為能力人（18歲）訂立租賃契約，未得法定代理人允許者效果為「效力未定」（§79），非直接無效；再者，若認係依年齡及身分日常生活所必需，還可直接有效，選項直接說「無效」屬錯誤敘述，為應選答案。", "✓B. 依§77但書，限制行為能力人為「依其年齡及身分、日常生活所必需」之行為，不須得法定代理人之允許，大學生在外求學租屋確有此類解釋空間，正確。", "✓C. 法定代理人事先給予住宿費表示允許外出求學，可視為允許締結租賃契約，正確。", "✓D. 相對人（乙）得依§80催告法定代理人確答是否承認，以確定契約效力，正確。"]}, {"year": 107, "num": 15, "ans": "C", "stem": "民法關於法人之規定，下列敘述，何者錯誤？", "opts": ["法人可分為財團法人與社團法人", "法人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限", "法人應設董事與監察人", "法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任"], "exp": ["✓A. 民法法人依設立基礎分為財團法人（以財產為基礎）與社團法人（以人為基礎），正確。", "✓B. §26規定法人之權利能力在法令範圍內，且不包含專屬自然人之部分，正確。", "✗C（本題答案）. 法人「應設董事」（§27Ⅰ，必設機關），但「監察人」屬任意機關，法人「得設監察人」（§27Ⅳ），並非必須設置，故「法人應設董事與監察人」之敘述錯誤，此為本題應選答案。", "✓D. §28，法人對其代表人執行職務所加損害，與行為人連帶負賠償責任，正確。"]}, {"year": 108, "num": 2, "ans": "B", "stem": "依我國民法之規定，以下關於行為能力之敘述，何者錯誤？", "opts": ["無行為能力人之意思表示，無效", "限制行為能力人未得法定代理人之允許，所為之單獨行為，效力未定", "限制行為能力人所訂立之契約，未經承認前，相對人得撤回之", "限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效"], "exp": ["✓A. 受監護宣告之無行為能力人意思表示無效（§75），未滿7歲之未成年人亦同，正確。", "✗B（本題答案）. 限制行為能力人未得法定代理人允許之「單獨行為」→「無效」（§78），並非效力未定；效力未定是「契約行為」未得允許之效果（§79）。本選項將單獨行為的效果說成「效力未定」，錯誤，此為最重要必考對比考點。", "✓C. 未經法定代理人承認前，相對人得撤回（§80），正確。", "✓D. 使用詐術者，依§83，其法律行為有效（排除限制行為能力之保護），正確。"]}, {"year": 108, "num": 3, "ans": "C", "stem": "甲受丙之詐欺，而授權乙向不知情的丁購買A屋，請問依我國民法的規定，下列敘述何者正確？", "opts": ["甲因受丙之詐欺而為意思表示，故可撤銷其授權乙之行為", "甲因受丙之詐欺而為意思表示，故可撤銷A屋之買賣契約", "甲若欲行使民法第92條之撤銷權，應於發現詐欺後，一年內為之。但自意思表示後，經過十年，不得撤銷", "甲因受丙之詐欺而為授權行為，其撤銷意思表示時，可以對抗善意第三人"], "exp": ["✗A. 甲受「第三人（丙）詐欺」而授權乙，依§92Ⅱ，第三人詐欺時，以「相對人知情或可得而知」為條件才得撤銷；此處授權是對乙的意思表示，若乙不知情，甲不得撤銷對乙的授權。", "✗B. 同理，A屋買賣契約是乙（甲的代理人）與丁所訂，丁不知情，甲依§92Ⅱ亦不得以第三人詐欺為由撤銷買賣契約。", "✓C. 依§93，因詐欺而為意思表示之撤銷，應於「發現詐欺後一年內」為之，且「自意思表示後十年」不得撤銷，此即撤銷權之除斥期間，正確。", "✗D. 依§92Ⅱ後段，以詐欺撤銷意思表示，不得以之對抗善意第三人，故不能對抗善意之丁，本選項描述相反。"]}, {"year": 108, "num": 13, "ans": "B", "stem": "甲並無將其所有價值十萬元之A手錶出售的意思，卻向乙表示欲以五千元出售之，乙明知甲無出售A手錶之意思，仍當場表示願意以五千元購買時，甲出售A手錶之意思表示的效力如何？", "opts": ["有效", "無效", "甲得撤銷", "效力未定"], "exp": ["✗A. 甲之意思表示屬「心中保留（單獨虛偽意思表示）」（§86），原則上有效，但以相對人不知情為前提。", "✓B. 依§86但書，若相對人（乙）明知表意人（甲）無真正意思，則該意思表示無效，本題乙明知甲無出售意思，故甲之意思表示無效，買賣契約不成立，正確。", "✗C. 心中保留並非「得撤銷」而是依相對人知情與否決定有效或無效，無撤銷問題。", "✗D. 效力未定通常用於限制行為能力人或無權代理，心中保留效果非效力未定。"]}, {"year": 108, "num": 14, "ans": "A", "stem": "甲授與甫滿十八歲之乙代理權，由乙處理出售甲所有之A機車的事宜。乙乃以甲之代理人的名義，以一萬元價金與丙訂立買賣A機車的契約。乙與丙所締結之買賣契約的效力如何？", "opts": ["對甲發生效力", "甲未承認前，效力未定", "乙之法定代理人未承認前，效力未定", "乙之法定代理人得撤銷之"], "exp": ["✓A. 依§104，代理人不以有行為能力為必要，限制行為能力人（18歲，舊法時代）亦得為代理人；代理人在代理權限內以本人名義所為之意思表示，直接對本人發生效力（§103），故乙代甲與丙訂立買賣契約，效力直接對甲（本人）發生，正確。", "✗B. 既然代理人不以有行為能力為必要，乙雖為限制行為能力人，其代理行為仍有效，無須甲另行承認。", "✗C. 乙是作為代理人（代甲行為），其法律行為效力歸屬於本人甲，乙之法定代理人不涉入此代理行為的效力判斷。", "✗D. 同上，乙法定代理人無撤銷此代理行為之必要或權限，本選項不正確。"]}, {"year": 109, "num": 1, "ans": "A", "stem": "下列關於法律上之物的敘述，何者正確？", "opts": ["從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物", "物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人", "無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有", "已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"], "exp": ["✓A. 依§68，從物是非主物之成分、常助主物效用、同屬一人所有的物；重點：「各自獨立」（非主物成分）且「客觀上常助主物效用」；動產或不動產均可為從物，正確。", "✗B. 天然孳息分離後屬於「有收取權利之人」（通常是所有人），並非「占有人」；佔有人收取孳息不當然取得所有權，敘述錯誤。", "✗C. 在他人土地上建造房屋，依民法「添附」之規定（§811以下），房屋通常因獨立性而仍屬建造人所有，並非當然屬土地所有人所有（此考點與土地及其定著物一體化原則不同，民法採區分原則）。", "✗D. 已足避風雨可使用之房屋（即便屋頂未完工）屬獨立建築物（定著物），而非土地之「成分」（成分是不可與主物分離之部分），敘述錯誤。"]}, {"year": 110, "num": 2, "ans": "B", "stem": "關於胎兒的敘述，下列何者正確？", "opts": ["人之權利能力，始於出生，終於死亡。胎兒無權利能力", "胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生", "胎兒為繼承人時，於胎兒出生前，他繼承人不得分割遺產", "胎兒為繼承人時，以其母為繼承人"], "exp": ["✗A. 前半段正確（§6），但後半段「胎兒無權利能力」需補充：依§7，胎兒以將來非死產者為限，關於其個人利益保護視為既已出生，具有條件式的保護（擬制），故非完全「無」。", "✓B. 依§7，胎兒以「將來非死產者為限」，關於其個人利益之保護，視為既已出生，此為通說，正確。", "✗C. 民法並未明文規定胎兒為繼承人時，他繼承人不得分割遺產，實務上以保留胎兒應繼分等方式處理，並非「不得分割」，本選項描述過絕對。", "✗D. 胎兒有繼承能力（§1166：胎兒為繼承人時，非保留其應繼分，他繼承人不得分割遺產），胎兒自己是繼承人，而非「以其母為繼承人」，敘述錯誤。"]}, {"year": 110, "num": 4, "ans": "D", "stem": "關於行為能力之敘述，下列何者錯誤？", "opts": ["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示", "限制行為能力人未得法定代理人之允許，所為之單獨行為，無效", "未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷", "為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"], "exp": ["✓A. §75Ⅱ、§76，受監護宣告之人意思表示無效，由法定代理人（監護人）代為並代受，正確。", "✓B. §78，限制行為能力人之單獨行為未得允許者無效，正確（與契約行為之效力未定相對照）。", "✓C. 未達法定婚齡之結婚，效果為「得撤銷」（§989），並非無效，正確。", "✗D（本題答案）. §7所保護的是「權利能力」而非「行為能力」；胎兒本身未出生，毫無行為能力（無能力為意思表示），§7是以「將來非死產為限」擬制其已有部分「權利能力」以保護其利益，並非給予行為能力，本選項將「權利能力」說成「行為能力」，概念完全錯誤，為應選答案。"]}, {"year": 110, "num": 5, "ans": "C", "stem": "關於代理的敘述，下列何者正確？", "opts": ["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之", "代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限", "由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限", "代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"], "exp": ["✗A. 代理權授與不以書面為必要，口頭授與亦可（法律另有規定除外），本選項「以書面授權方式」之限制不正確。", "✗B. 依§168，代理人有數人者，其代理行為應「共同」為之（非單獨），但法律另有規定或本人另有意思表示者不在此限，本選項把「共同」說成「單獨」，相反。", "✓C. 此描述為§169表見代理的規定：本人以行為表示授與代理權，或知他人以其名義為代理人而不反對者，對善意第三人負授權人責任；但第三人明知無代理權者，不在此限。正確。", "✗D. 前半段（有代理權之代理行為對本人生效）正確，但後半段「無代理權→無效」錯誤：無權代理之效果為「效力未定」（§170），而非無效（須本人不承認才確定不生效）。"]}, {"year": 110, "num": 6, "ans": "B", "stem": "下列何種法律行為屬法定書面要式行為？", "opts": ["動產所有權之拋棄", "子女之收養", "贈與契約", "演藝經紀契約"], "exp": ["✗A. 動產所有權之拋棄以「占有之拋棄」為之，並不以書面為必要，並非法定要式行為。", "✓B. 收養子女依§1079Ⅰ，應以書面為之，並向法院聲請認可，屬法定書面要式行為，正確。", "✗C. 贈與契約（§406）為諾成、不要式契約，口頭贈與即有效（但未移轉前得任意撤銷，此為另一層問題），並非法定書面要式。", "✗D. 演藝經紀契約在民法並無明文規定書面要式，依契約自由原則為不要式契約（特別法另有規定者除外）。"]}, {"year": 110, "num": 7, "ans": "D", "stem": "關於意思表示不一致的敘述，下列何者正確？", "opts": ["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效", "表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效", "表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效", "虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"], "exp": ["✗A. 依§86，表意人心中保留（無欲受拘束之意），其意思表示「原則上有效」，僅在相對人明知時才無效，並非當然無效。", "✗B. 相對人明知表意人無真意，依§86但書，其意思表示「無效」，並非有效，本選項與法條規定相反。", "✗C. 通謀虛偽意思表示，依§87Ⅰ，其意思表示「無效」，並非不因之無效（因之無效），選項與法條相反。", "✓D. 依§87Ⅱ，通謀虛偽意思表示若「隱藏他項法律行為」（如以買賣外衣隱藏贈與），該虛偽表示雖無效，但所隱藏之真實法律行為（贈與）仍適用其規定（若符合要件則有效），正確。"]}, {"year": 110, "num": 10, "ans": "B", "stem": "下列何者屬於授與代理權？", "opts": ["甲創作民法總則一書，授權乙出版社於五年間印製出版該書", "甲有一A車，授權乙以甲本人名義買賣A車", "甲為知名影星，授權乙週刊使用甲肖像照片", "甲有一昆蟲標本，授權乙予以拍攝"], "exp": ["✗A. 授權出版是著作財產權的授權（「利用授權」），並非民法代理權的授與；乙出版是以乙自己名義出版，並非以甲名義為甲辦理法律行為。", "✓B. 甲授權乙「以甲本人名義」買賣A車，即乙以甲名義對外為法律行為，效果歸屬於甲，此為代理（意定代理）的核心定義，正確。", "✗C. 肖像使用授權是人格權授權，乙使用甲肖像是乙自己的行為，並非代理甲對外為法律行為。", "✗D. 授權拍攝是著作/財產使用授權，乙拍攝以乙名義進行，非代理。"]}, {"year": 110, "num": 13, "ans": "B", "stem": "下列何種情形，當事人一方須以向法院聲請撤銷方式為之？", "opts": ["因受詐欺所為之意思表示", "債務人所為之無償行為，有害及債權者", "締結違反公共秩序之契約", "違反民法第983條特定親屬間禁止結婚規定之結婚行為"], "exp": ["✗A. 因受詐欺所為意思表示（§92），撤銷方式為「向相對人以意思表示為之」，無須向法院聲請。", "✓B. 詐害債權行為（§244），撤銷必須向「法院聲請」（訴請法院撤銷），並非以意思表示向對方為之，正確。", "✗C. 違反公序良俗（§72）之契約屬「無效」，並非需要向法院聲請撤銷，無效無須撤銷。", "✗D. 違反§983禁婚規定之結婚，其效力為「得撤銷」（§989），撤銷方式依家事事件法，向法院提起撤銷婚姻之訴，但此屬身分行為撤銷之特殊程序，官方標準答案仍認B更精確符合「須向法院聲請」的典型例，以B為正解。"]}, {"year": 111, "num": 8, "ans": "A", "stem": "有關現行民法代理制度之介紹，下列何者錯誤？", "opts": ["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為", "民法第169條表見代理效力之發生，須無本人之授予代理權為其要件", "間接代理人之代理行為不會對本人直接發生效力", "代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"], "exp": ["✗A（本題答案）. §106規定，代理人非經本人許諾，不得自己代理（自己代理禁止）；未經許諾之自己代理行為效果應為「效力未定」（須本人承認始生效）而非「無效」，將其定性為「無效」描述錯誤，為本題應選答案。", "✓B. 表見代理（§169）的前提是本人並未授與代理權，但因本人的行為或不作為使第三人信賴有代理權而保護之，正確。", "✓C. 間接代理（如行紀）是代理人以自己名義為法律行為，法律效果歸屬代理人，再由代理人移轉給本人，並非直接對本人發生效力，正確。", "✓D. 代理人（乙）受相對人詐欺，意思表示瑕疵依§105以代理人決之，撤銷權歸屬本人（甲），本人得撤銷（以代理人之知情與否決定本人得否撤銷），正確。"]}, {"year": 111, "num": 9, "ans": "C", "stem": "對於民法上有關法人規定之說明，下列何者正確？", "opts": ["財團法人具有自律法人之性質", "社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之", "財團法人之設立，得以遺囑為之", "社團法人以社團董事會為其最高意思機關"], "exp": ["✗A. 財團法人之設立目的及章程由捐助人設定，組織較固定，屬「他律法人」（受外部章程拘束），而「自律法人」是指可自行制訂規範（如社團法人），本選項財團法人之說法相反。", "✗B. 依§54，社員之開除，須有正當理由，但開除程序由章程定之（不一定是董事會特別決議），且不限於「特別決議」，描述過於限縮且不精確。", "✓C. 依§60Ⅱ，財團之設立，得以遺囑捐助之方式為之，正確。", "✗D. 社團法人的最高意思機關是「社員總會」（§50），而非董事會；董事會是執行機關，描述錯誤。"]}, {"year": 111, "num": 10, "ans": "C", "stem": "依現行民法有關住所之規定，下列何者錯誤？", "opts": ["夫妻於雙方共同協議前，推定以共同戶籍地為其法定之住所", "意定住所之設定須具備久住之意思及居住之事實", "因特定行為選定居所，關於其行為，不得視為住所", "16歲之年輕人，僅能以其父母之住所為法定住所"], "exp": ["✓A. 現行§20，夫妻住所原則以共同協議定之，未協議前推定以共同戶籍地為住所，正確。", "✓B. §20Ⅱ，住所設定須有「久住意思」及「居住事實」（雙重要件），正確。", "✗C（本題答案）. §22規定，因特定行為選定居所，關於其行為，「視為住所」（而非「不得視為住所」），本選項描述正好相反，為錯誤選項，即應選答案。", "✓D. 限制行為能力人（16歲）無法自行設定住所，以父母之住所為法定住所，正確（§21）。"]}, {"year": 111, "num": 11, "ans": "A", "stem": "關於民法第74條暴利行為之規定，下列敘述何者正確？", "opts": ["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為", "撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅", "行使暴利行為之撤銷權時，應以意思表示向相對人為之", "暴利行為自始當然無效"], "exp": ["✓A. §74暴利行為之撤銷，不論財產是否已給付，均得聲請法院撤銷，正確。", "✗B. §74之撤銷期間為「除斥期間」（非消滅時效），自法律行為成立後一年；除斥期間與消滅時效性質不同，本選項誤稱為消滅時效，且「罹於消滅時效而消滅」描述亦不精確（應為「除斥期間屆滿撤銷權消滅」）。", "✗C. §74暴利行為須「聲請法院撤銷」，而非向相對人以意思表示為之，此與詐欺脅迫撤銷（向相對人意思表示）不同，為重要區別。", "✗D. 暴利行為非當然無效，須利害關係人積極向法院「聲請撤銷」後，才失其效力；未聲請前契約仍有效。"]}, {"year": 111, "num": 23, "ans": "D", "stem": "滿17歲且未受監護或輔助宣告之甲男，其所為之下列何種行為，依法須得法定代理人之同意始為有效？", "opts": ["訂立遺囑為遺贈之行為", "純獲法律上利益之行為", "就他人之物所為之無權處分行為", "授予他人代理權之行為"], "exp": ["✗A. 依§1186Ⅱ，滿16歲之未成年人，得為遺囑，無須法定代理人同意（身分行為例外），甲17歲得自行訂立遺囑。", "✗B. 純獲法律上利益之行為（如接受贈與、債務免除），依§77但書，不須法定代理人允許即有效。", "✗C. 無權處分行為（以他人之物為處分）效力未定（§118），是否生效取決於權利人是否承認，與甲的行為能力無關，甲之法定代理人無須同意。", "✓D. 授予他人代理權屬「單獨行為」，限制行為能力人（17歲）未得法定代理人允許之單獨行為，依§78，無效；須法定代理人同意，此為官方標準答案。"]}, {"year": 111, "num": 24, "ans": "B", "stem": "關於財團法人之敘述，下列何者正確？", "opts": ["財團法人得為公益或營利之目的而設立", "財團法人於設立登記前，應得主管機關之許可", "財團法人之最高意思機關為總會，且為必設之機關", "財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"], "exp": ["✗A. 財團法人依民法規定須以「公益」為目的，不得以「營利」為目的設立（民法上的財團法人屬公益法人），以營利為目的之財團型組織須另依特別法設立。", "✓B. 依§59Ⅰ，財團法人之設立，應以捐助章程，向主管機關請求許可，設立登記前應先取得許可，正確。", "✗C. 總會是社團法人的最高意思機關，財團法人無社員總會，其設立目的及章程由捐助人決定，無「總會」機關設計。", "✗D. 民法財團法人不得以營利為目的；以營利為目的的法人（如股份有限公司）依公司法等特別法設立，並非「以營利為目的設立之財團法人依特別法」，概念本身矛盾。"]}, {"year": 111, "num": 25, "ans": "A", "stem": "下列何者屬於當然無效之法律行為？", "opts": ["單獨虛偽意思表示而該情形為相對人所明知者", "詐欺之意思表示係由第三人所為，而相對人明知其事實或可得而知者", "無權利人就權利標的物為處分後，取得其權利者", "限制行為能力人用詐術使人信其為有行為能力人，所為之法律行為"], "exp": ["✓A. 依§86但書，單獨虛偽意思表示（心中保留），若相對人明知，則意思表示「無效」（當然無效），正確。", "✗B. 第三人詐欺，以相對人知情或可得知情為前提，表意人得「撤銷」（§92Ⅱ）；撤銷前法律行為仍有效，屬得撤銷非當然無效。", "✗C. 無權利人處分後取得其權利，該處分行為「溯及發生效力」（§118Ⅱ），即補正為有效，並非無效。", "✗D. 限制行為能力人用詐術，依§83，其法律行為「有效」，並非無效。"]}, {"year": 112, "num": 1, "ans": "A", "stem": "有關權利能力之敘述，下列何者錯誤？", "opts": ["人的權利能力始於出生終於死亡，因此胎兒尚未出生所以沒有權利能力", "人的權利能力不得拋棄，更不得轉讓", "法人除於法令或性質上之限制外，仍享有權利能力", "植物人仍享有權利能力"], "exp": ["✗A（本題答案）. 雖然「始於出生終於死亡」正確（§6），但推論「胎兒尚未出生所以沒有權利能力」不完全正確：§7規定胎兒以將來非死產者為限，關於個人利益之保護，視為既已出生（擬制有限度的權利能力），故「沒有權利能力」之說法過於絕對，為錯誤敘述，應選答案。", "✓B. 依§16，權利能力不得拋棄，此為人格之基本保障，正確。", "✓C. §26，法人在法令及性質限制範圍內有權利能力，正確。", "✓D. 植物人仍為生存的自然人，生命現象未終止，仍具完整權利能力，正確。"]}, {"year": 112, "num": 2, "ans": "C", "stem": "有關權利客體之敘述，下列何者錯誤？", "opts": ["甲未經乙的同意在乙的土地上種植樹木，該樹木為乙土地上之部分", "甲飼養一頭母牛，後來該母牛生下一頭小牛，小牛所有權仍屬於甲所有", "為收容災民而臨時拼裝之貨櫃屋，仍為定著物，性質上為不動產", "主物之處分效力及於從物，所以購買汽車之契約效力及於備胎"], "exp": ["✓A. 在他人土地上種植之樹木，因「附合」（§811）成為土地之一部（地上定著物視為土地之成分），屬乙土地之部分，正確。", "✓B. 小牛為天然孳息，其所有權依§70Ⅰ歸屬有收取權之人（甲：母牛之所有人），正確。", "✗C（本題答案）. 定著物須「固定附著於土地、繼續性使用」，臨時拼裝之貨櫃屋可隨時移動，缺乏「定著」之持續固定性，不構成定著物（不動產），性質上為動產，本選項描述錯誤，為應選答案。", "✓D. §68Ⅱ，主物之處分及於從物；汽車為主物，備胎為從物（常助汽車使用），購買汽車之契約效力及於備胎，正確。"]}, {"year": 112, "num": 3, "ans": "B", "stem": "有關限制行為能力之敘述，下列何者正確？", "opts": ["滿16歲之未成年人寫遺囑時，仍須經法定代理人同意，否則效力未定", "16歲之甲偽造身分證，使相對人乙誤信甲已滿18歲，而與甲簽訂買賣契約，該買賣契約有效", "限制行為能力人為代理人時，代理人受領代理權仍須經法定代理人之同意", "法定代理人可以概括允許限制行為能力人為法律行為"], "exp": ["✗A. §1186Ⅱ明定，滿16歲之未成年人，「得自行訂立遺囑」（身分行為之特別規定），不須法定代理人同意，本選項與法條相反。", "✓B. 限制行為能力人使用詐術（偽造身分證），依§83，其法律行為有效（排除保護），正確。", "✗C. 代理人不以有行為能力為必要（§104），限制行為能力人受領代理權（代理人之地位）無須法定代理人同意，此為代理制度特別規定。", "✗D. 依§77本文，限制行為能力人須得「個別允許」；概括允許之效力，依通說，原則上不可無限擴張，且法律上並無明文允許完全概括允許，本選項過於絕對。"]}, {"year": 112, "num": 4, "ans": "D", "stem": "下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？", "opts": ["通謀虛偽意思表示所為之法律行為", "因錯誤或誤傳之意思表示而為法律行為", "被詐欺而為意思表示之法律行為", "因暴利行為所為之法律行為"], "exp": ["✗A. 通謀虛偽意思表示依§87當然無效，無須聲請撤銷（無效不需撤銷）。", "✗B. 依§88、§89，因錯誤或誤傳撤銷，以「意思表示向相對人」為之，無須向法院聲請。", "✗C. 依§92，因詐欺撤銷，以「意思表示向相對人」為之，無須向法院聲請。", "✓D. §74暴利行為之撤銷，必須由利害關係人向「法院聲請」撤銷，才發生撤銷效力，與其他撤銷不同，為應選答案，正確。"]}, {"year": 112, "num": 14, "ans": "B", "stem": "民法關於死亡宣告的規定，下列何者正確？", "opts": ["失蹤人失蹤滿三年後，法院得因利害關係人之聲請，為死亡之宣告", "受死亡宣告者，以判決內所確定死亡之時，推定其為死亡", "遺產稅捐徵收機關得為失蹤人向法院聲請死亡宣告", "死亡宣告會剝奪失蹤人之權利能力"], "exp": ["✗A. §8Ⅰ一般失蹤失蹤期間須滿「七年」（或特殊情形如危難中滿一年）始得聲請，三年不足，敘述錯誤。", "✓B. 依§9，受死亡宣告者，以判決內所確定死亡之時（通常為失蹤期間屆滿時），「推定」其為死亡（非確定死亡），正確。", "✗C. 依§8，死亡宣告之聲請人為「利害關係人或檢察官」，稅捐機關並非明文規定之聲請權人，敘述錯誤。", "✗D. 死亡宣告為「推定死亡」，失蹤人若仍生存，其權利能力不受影響，死亡宣告不剝奪權利能力，選項描述錯誤。"]}, {"year": 113, "num": 2, "ans": "B", "stem": "有關行為能力之敘述，下列何者正確？", "opts": ["年滿30歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力", "年滿19歲之乙可以獨自訂立買賣汽車之契約", "受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊", "15歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"], "exp": ["✗A. 成年人有精神疾病，須經法院宣告監護/輔助，才影響行為能力；單純「患有精神疾病」並不當然喪失行為能力，須有法院的監護或輔助宣告。", "✓B. 現行民法（112年起）成年年齡為18歲，年滿19歲之乙已為完全行為能力人，可獨自訂立契約，正確。", "✗C. 受輔助宣告之人為「贈與」（非日常生活所必需），依§15-2Ⅰ，應經輔助人同意，不得自行為之，敘述錯誤。", "✗D. 丟棄（拋棄）財物屬單獨行為，15歲（限制行為能力人）未得法定代理人允許之單獨行為無效（§78），敘述錯誤。"]}, {"year": 113, "num": 10, "ans": "C", "stem": "有關意思表示之敘述，下列何者正確？", "opts": ["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係", "甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效", "甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示", "甲受丙脅迫而與之訂立互易契約，該契約當然無效"], "exp": ["✗A. 通謀虛偽意思表示無效（§87Ⅰ），其隱藏的真實意思（繼續維持婚姻）始生效，因此離婚無效，甲乙間婚姻關係仍然存在，並非「已無婚姻關係」。", "✗B. 依§86但書，相對人明知表意人（甲）無真意，意思表示無效，贈與契約不成立，並非有效。", "✓C. 甲錯認對方身分為當事人資格之錯誤，依§88Ⅱ，若依交易上觀念認為重要，得撤銷；但撤銷前契約有效（§88為得撤銷非當然無效），正確。", "✗D. 依脅迫而為意思表示（§92）效果為「得撤銷」而非當然無效，在撤銷前契約仍有效，本選項「當然無效」描述錯誤。"]}, {"year": 113, "num": 16, "ans": "B", "stem": "甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於113年3月1日因時效而消滅。下列敘述，何者正確？", "opts": ["因從屬於擔保債權，故抵押權隨之消滅", "抵押權人須於消滅時效完成後，5年間實行其抵押權", "抵押權無消滅時效，可一直存續", "從此之後，抵押權之實行須經債務人同意"], "exp": ["✗A. 消滅時效完成，擔保債權之「請求力」消滅（債務人得拒絕給付），但債權本身及抵押權並未隨之消滅，抵押權仍存在（從屬性並非時效完成即同步消滅）。", "✓B. 依§880，抵押權所擔保之債權，其請求權已因時效消滅，如抵押權人於消滅時效完成後，5年間不實行其抵押權者，抵押權消滅，正確（此為§880的特別規定）。", "✗C. §880規定抵押權存在有期限限制（時效完成後5年不實行即消滅），並非永遠存續，敘述錯誤。", "✗D. 抵押權實行為抵押權人之權利，無須債務人同意，描述錯誤。"]}, {"year": 114, "num": 1, "ans": "C", "stem": "依我國民法有關死亡宣告之規定，下述何者錯誤？", "opts": ["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告", "失蹤人已年滿80歲，其失蹤期間應滿3年後，始得被聲請死亡宣告", "失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告", "受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"], "exp": ["✓A. 共有不動產之其他共有人，因失蹤人之財產狀況與其有法律上利益關係，屬利害關係人，得聲請死亡宣告，正確。", "✓B. 失蹤人年滿80歲，依§8Ⅱ，失蹤期間屆滿三年，即得聲請死亡宣告（縮短期間），正確。", "✗C（本題答案）. 撤銷死亡宣告須向「法院」聲請撤銷（家事事件），並非向「地檢署」聲請，兩者管轄機關不同，敘述錯誤，為應選答案。", "✓D. 死亡宣告係「推定」死亡，若實際仍生存，其權利能力不因此宣告而喪失，正確。"]}, {"year": 114, "num": 2, "ans": "B", "stem": "我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？", "opts": ["受監護宣告之成年人，無行為能力", "成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告", "受監護宣告之成年人，仍保有完全之權利能力", "受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"], "exp": ["✓A. 受監護宣告之人為無行為能力人（§15），意思表示無效，正確。", "✗B（本題答案）. 監護宣告之對象是「辨識其意思表示效果之能力顯有不足」→此描述實為「輔助宣告」的門檻（§15-1Ⅰ）；「監護宣告」的門檻是「辨識能力顯有不足」→更嚴重的情況（§14Ⅰ）。本選項將輔助宣告的門檻描述為監護宣告，文字上有混淆，依官方標準答案為B，即本題應選答案。", "✓C. 無論受監護或輔助宣告，自然人之權利能力始於出生終於死亡，不因宣告而改變，正確。", "✓D. 受輔助宣告之人締結汽車買賣契約，依§15-2Ⅰ列舉之事項中，不動產或重要財產交易等須輔助人同意，但汽車買賣是否在列舉範圍視情形而定，若非列舉之重要法律行為，則無須輔助人同意即有效，正確描述方向。"]}, {"year": 114, "num": 3, "ans": "C", "stem": "下列敘述，何者與民法法人之規定並不相容？", "opts": ["民法關於公益社團法人之設立，係採取許可主義", "法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格", "法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利", "財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"], "exp": ["✓A. 公益社團法人採許可主義，須經主管機關許可（§46），正確。", "✓B. 法人解散後清算中，仍具有法人格（僅在清算必要範圍內），正確。", "✗C（本題答案）. 法人之權利能力確受「性質」限制（§26但書，專屬自然人之權利除外），但法人「並非無法享有任何人格權」：如名譽權（商譽）、名稱權等，法人均得享有，故「無法享有民法賦予自然人所有之人格權利」過於絕對，與民法規定不相容，為應選答案。", "✓D. §60Ⅱ，以遺囑捐助設立財團者，如遺囑未訂立捐助章程，其應記載事項由主管機關指定人訂定，無須捐助人親自訂立捐助章程，正確。"]}, {"year": 114, "num": 4, "ans": "C", "stem": "甲當選A法人董事，準備大顯身手，下列敘述何者錯誤？", "opts": ["就A法人一切事務，甲可代表A法人", "A法人可僅設甲一位董事", "A法人若對甲董事之代表權加以限制，其限制得對抗任何第三人", "若A法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"], "exp": ["✓A. §27Ⅱ，董事就法人一切事務對外代表法人，正確。", "✓B. 法人可僅設一名董事，法律並無最低名額限制（須至少一人），正確。", "✗C（本題答案）. 依§27Ⅱ但書，法人對董事代表權之限制，「不得對抗善意第三人」，故並非得對抗「任何」第三人，對善意第三人不生對抗效力，本選項「得對抗任何第三人」描述錯誤，為應選答案。", "✓D. 董事有數人，法人事務之執行原則以過半數決議，若僅兩人意見相左，確實可能陷入僵局（1:1），正確。"]}, {"year": 114, "num": 5, "ans": "D", "stem": "有關自然人從事有效法律行為之情形，依現行民法規定，應以具備完全之行為能力為其要件。對此，下列相關之選項何者正確？", "opts": ["年滿16歲之人，取得完全行為能力", "15歲之人得逕行有效撤銷被他人詐欺而締結日常生活所需之買賣契約", "14歲之未成年人得有效書立遺囑", "某成年人被法院為輔助之宣告，若未得輔助人事前同意，即締結消費借貸契約，其得於法院撤銷該輔助宣告後，承認該消費借貸契約，使之逕行生效"], "exp": ["✗A. 現行法（112年起），成年年齡為18歲；年滿16歲仍為限制行為能力人，未取得完全行為能力。", "✗B. 15歲為限制行為能力人，撤銷（詐欺之意思表示）屬單獨行為，依§78未得法定代理人允許者無效（撤銷自己）。再者，撤銷詐欺意思表示的效力判斷涉及§92，限制行為能力人自己亦難單獨行使，本選項描述不正確。", "✗C. 依§1186，須滿16歲始得書立遺囑，14歲未達遺囑年齡，所立遺囑無效（並非有效）。", "✓D. 受輔助宣告之人未得輔助人同意締結消費借貸，效力未定；若輔助宣告嗣後被法院撤銷，本人取回完全行為能力，得以承認使該契約確定有效（§§79→81準用），正確，為官方標準答案。"]}, {"year": 114, "num": 7, "ans": "C", "stem": "不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依民法第88條規定行使撤銷權。下列相關之敘述，何者錯誤？", "opts": ["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示", "該錯誤必須在交易上被認為具有重要性", "錯誤之表意人必須在意思表示後，於2年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續", "錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"], "exp": ["✓A. §88Ⅰ但書，表意人之錯誤若由其過失所致，不得撤銷，正確。", "✓B. §88Ⅰ，錯誤須依交易上之觀念認為重要者，始得撤銷，正確。", "✗C（本題答案）. §90規定錯誤撤銷之除斥期間：自發見錯誤起1年內行使（非自意思表示後2年），本選項說「意思表示後2年」錯誤；且說「法律關係繼續有效存續」方向雖對（除斥期間過後不得撤銷，法律關係有效），但期間描述（2年）錯誤，故本選項為應選答案。", "✓D. §91，撤銷人對信賴意思表示有效之相對人，應負信賴利益之損害賠償責任，正確。"]}, {"year": 114, "num": 9, "ans": "D", "stem": "甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？", "opts": ["本件代理權的授與和委任契約二者均須書面", "若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲", "若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示", "甲跟乙說好，最多出價1億元，1億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價1億1千萬簽訂契約。該買賣契約在1億元價金的範圍內有效"], "exp": ["✓A. 不動產物權移轉之委任及代理權授與，依§531（委任不動產登記事項應以書面為之），均須書面，正確。", "✓B. 代理之要件之一是「以本人名義」；乙以自己名義簽約（並非以甲名義），法律效果歸屬於乙，而非甲，此為顯名代理原則，正確。", "✓C. 依§105，代理人（乙）意思表示之瑕疵依代理人決之，但甲既知丙詐欺情事（本人知情），依善意保護原則，甲不得以代理人受詐欺為由撤銷，正確。", "✗D（本題答案）. 乙超越代理權限（逾越1億元之授權）與丙簽訂1億1千萬的契約，依§170，越權部分效力未定，並非「在1億元範圍內有效、超過部分無效」的分割效力模式；整個契約效力原則上均未定，須本人承認或拒絕，本選項描述「在1億元範圍內有效」屬超越代理效力判斷錯誤，為應選答案。"]}];

  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:ch===q.ans};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
</script>
</body></html>
