const QUESTIONS = [{"year": 105, "qnum": 22, "stem": "關於消費爭議調解委員會的敘述，下列何者正確？", "options": ["直轄市、縣（市）政府應設消費爭議調解委員會，置委員5至11名", "調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序應公開", "關於消費爭議之調解，當事人不能合意但已甚接近者，調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人", "當事人對於經參與調解委員過半數同意提出解決事件之方案，得於送達後20日之不變期間內，提出異議"], "answer": "C", "explains": {"A": "委員名額應為「7至15名」，非「5至11名」，數字錯誤。", "B": "調解程序原則上「得不公開」，非「應公開」，方向相反。", "C": "正確。當事人不能合意但已甚接近者，調解委員得斟酌一切情形求兩造利益之平衡，於不違反雙方主要意思範圍內依職權提出解決方案並送達當事人，此為一般消費爭議職權調解方案之核心機制描述。", "D": "異議期限為送達後「10日」之不變期間，非「20日」，數字錯誤。"}, "ref": "消費者保護法第45條、第45條之1、第45條之2", "id": 1, "chapter": "H3"}, {"year": 105, "qnum": 23, "stem": "依消費者保護法規定，企業經營者與消費者分期付款買賣契約的敘述，下列何者正確？", "options": ["分期付款買賣契約，應以書面載明頭期款、各期價款與其他附加費用", "分期付款買賣契約，未載明利率者，其利率按現金交易價格週年利率百分之六計算之", "分期付款買賣契約，未載明相關應付款項者，消費者不負現金交易價格加計法定利息以外價款之給付義務", "分期付款買賣契約，於消費者要求時，企業經營者應以書面載明消費者應付總價款與現金交易價格之差額"], "answer": "A", "explains": {"A": "正確。分期付款買賣契約應以書面載明頭期款、各期價款與其他附加費用等法定事項，敘述正確完整。", "B": "未載明利率者按現金交易價格週年利率「5%」計算，非「6%」，數字錯誤。", "C": "未載明總價款與現金交易差額者，消費者「不負現金交易價格以外價款之給付義務」，並非「加計法定利息以外」，此為條文用語精確度之陷阱（消費者僅須給付現金交易價格本身，連法定利息亦不須額外給付）。", "D": "此為契約書「應主動載明」之法定事項（強制規定），並非「於消費者要求時」才須載明，此為要件描述錯誤之陷阱。"}, "ref": "消費者保護法第21條", "id": 2, "chapter": "H3"}, {"year": 105, "qnum": 26, "stem": "依消費者保護法規定，下列敘述何者正確？", "options": ["企業經營者於商品或服務具有危害消費者生命、身體、健康、財產之可能者，未於明顯處為警告標示及緊急處理危險之方法者應負賠償責任。但企業經營者能證明其無過失者，法院得減輕或免除其賠償責任", "商品或服務因其後有較佳之商品或服務，得被推定不符合當時科技或專業水準可合理期待之安全性", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，視為從事設計、生產、製造商品或提供服務之企業經營者", "企業經營者對消費者或第三人之損害賠償責任，得預先約定限制但不得約定免除"], "answer": "C", "explains": {"A": "企業經營者能證明無過失者，法院「得減輕」其賠償責任，並非「得減輕或免除」，此為法定用語程度之陷阱（無過失僅得減輕，不得完全免除）。", "B": "「其後有較佳商品或服務」不得作為推定原商品或服務不符合當時安全性標準之理由，因安全性判斷基準為「當時」科技水準，非事後回顧標準，此為時點基準錯誤之陷阱。", "C": "正確。從事經銷之企業經營者若改裝、分裝商品或變更服務內容者，其行為已實質介入商品內容，故視為從事設計、生產、製造商品或提供服務之企業經營者，適用較嚴格之責任標準（不得主張已盡相當注意之免責事由）。", "D": "企業經營者對消費者或第三人之損害賠償責任「不得預先約定限制或免除」（兩者皆不得約定），本選項稱得約定限制，方向錯誤。"}, "ref": "消費者保護法第7條、第8條", "id": 3, "chapter": "H3"}, {"year": 105, "qnum": 27, "stem": "針對臺灣社會發生食品安全問題（如黑心油），消費者得依消費者保護法第 50 條所定消費者保護團體訴訟（以下簡稱「消保團體訴訟」）尋求救濟。下列敘述何者正確？", "options": ["多數受害之消費者得申請組成消保團體之組織，以便立即以團體自己名義，逕向法院提起消費者團體損害訴訟", "消保團體於受讓20人以上消費者損害賠償請求權，得以自己名義提起訴訟。消費者於言詞辯論終結前，不得終止讓與該損害賠償請求權", "消保團體依法提出消保團體訴訟者，應委任律師代理訴訟", "消保團體就消費者團體損害賠償訴訟，於扣除訴訟、支付予律師之必要費用以及得向消費者請求之報酬後，將訴訟結果所得之賠償交付該讓與請求權之消費者"], "answer": "C", "explains": {"A": "消保團體須符合「許可設立3年以上、置有消費者保護專門人員、經行政院評定優良」等法定要件，並非受害消費者臨時組成即可立即提起訴訟，此為虛構簡化程序之陷阱。", "B": "消費者於「言詞辯論終結前」「得」終止讓與該損害賠償請求權（並非不得終止），本選項方向相反。", "C": "正確。消保團體依第49條規定提起訴訟者，應委任律師代理訴訟，此為強制規定。", "D": "消保團體「不得」向消費者請求報酬（僅得請求預付或償還必要費用），本選項稱得請求報酬，與法定禁止規定不符。"}, "ref": "消費者保護法第49條、第50條", "id": 4, "chapter": "H3"}, {"year": 105, "qnum": 28, "stem": "企業經營者於下列違反消費者保護法之情形，何者所適用罰則所定之法定罰鍰額度為最高？", "options": ["地方政府針對企業經營者提供之商品或服務，經調查認為確有損害消費者身體健康者，命其為限期回收或其他必要處置，而企業經營者拒不遵從者", "企業經營者未依商品標示法等法令為商品或服務之標示", "企業經營者對消費者保證商品或服務之品質時，未主動出具書面保證書", "企業經營者使用定型化契約時，拒絕、規避或阻撓主管機關之派員查核"], "answer": "A", "explains": {"A": "正確。企業經營者拒不遵從主管機關限期回收或必要處置之命令（涉及消費者身體健康之重大違規），屬情節最重大之違規類型，其法定罰鍰額度（含按次處罰、停止營業等加重處分）為本題各選項中最高。", "B": "未依規定標示屬較輕微行政違規，罰鍰級距較低。", "C": "未出具書面保證書屬較輕微行政違規，罰鍰級距較低。", "D": "拒絕規避阻撓查核之罰鍰上限為30萬元，低於本題A選項涉及消費者身體健康重大違規之罰則級距。"}, "ref": "消費者保護法第58條、第60條", "id": 5, "chapter": "H3"}, {"year": 105, "qnum": 30, "stem": "甲於乙商店購得丙手機公司所生產之新型手機，甲交予其子丁使用，詎料丁於使用時竟發生手機電池燃燒，致丁受傷送醫。依消費者保護法規定，關於本案中企業經營者責任之敘述，下列何者錯誤？", "options": ["丙公司係生產問題手機之企業經營者，應確保該手機符合當時科技或專業水準可合理期待之安全性，如有違反，應負損害賠償責任", "該問題手機雖係甲所購買，但如丁因使用而身體受損害，丙公司仍應對丁負損害賠償責任", "若丙公司能證明其於生產手機時無過失者，法院應免除其賠償責任", "經銷手機之乙商店，就使用問題手機所生損害，與丙公司連帶負損害賠償責任。但乙商店得主張對損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害，以免除其與丙公司之連帶責任"], "answer": "C", "explains": {"A": "生產者丙公司應確保商品符合當時科技水準可合理期待之安全性，違反應負賠償責任，敘述正確，非本題答案。", "B": "商品責任保護範圍及於「第三人」（非僅限購買者本人），丁雖非購買者，仍得請求丙公司負賠償責任，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。企業經營者能證明其無過失者，法院「得減輕」其賠償責任，而非「應免除」，程度用語錯誤，此為極高頻重複命題陷阱（無過失僅係減輕事由，非法定當然免責事由）。", "D": "經銷商乙就損害與生產者丙連帶負賠償責任，但得主張已盡相當注意義務而免除連帶責任，敘述正確，非本題答案。"}, "ref": "消費者保護法第7條、第8條", "id": 6, "chapter": "H3"}, {"year": 105, "qnum": 39, "stem": "依公寓大廈管理條例規定，直轄市、縣（市）政府得聘請資深之專家、學者及建築師、律師，並指定公寓大廈及建築管理主管人員，組設何種委員會處理公寓大廈爭議事件？", "options": ["公寓大廈爭議事件調解委員會", "公寓大廈爭議事件調處委員會", "公寓大廈爭議事件調查委員會", "公寓大廈爭議事件審議委員會"], "answer": "B", "explains": {"A": "法定名稱非「調解委員會」，用詞不符。", "B": "正確。直轄市、縣（市）政府得組設「公寓大廈爭議事件調處委員會」，處理公寓大廈爭議事件，法定名稱為「調處委員會」而非「調解委員會」，此為易混淆之用詞陷阱。", "C": "法定名稱非「調查委員會」，用詞不符。", "D": "法定名稱非「審議委員會」，用詞不符。"}, "ref": "公寓大廈管理條例第6條", "id": 7, "chapter": "H3"}, {"year": 106, "qnum": 23, "stem": "依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？", "options": ["7日", "10日", "15日", "20日"], "answer": "B", "explains": {"A": "數字錯誤，非7日。", "B": "正確。當事人對調解委員依職權提出之解決方案有異議者，得於送達後「10日」之不變期間內提出異議，全科高頻數字。", "C": "數字錯誤，非15日。", "D": "數字錯誤，非20日。"}, "ref": "消費者保護法第45條之2", "id": 8, "chapter": "H3"}, {"year": 106, "qnum": 24, "stem": "依消費者保護法規定，關於企業經營者責任之敘述，下列何者錯誤？", "options": ["企業經營者所提供之服務，若具有危害消費者健康之可能者，應為警告標示。違反且致生損害於消費者時應負連帶賠償責任", "從事經銷之企業經營者，對商品或服務所生之損害防免已盡相當之注意，無須負連帶賠償責任", "企業經營者之商品雖致生損害於消費者，若能證明其無過失者，則無須負連帶賠償責任", "企業經營者對商品符合可合理期待之安全性，負舉證責任"], "answer": "C", "explains": {"A": "應為警告標示，違反且致生損害應負連帶賠償責任，敘述正確，非本題答案。", "B": "經銷商已盡相當注意者，無須負連帶賠償責任（得主張免責），敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。企業經營者能證明其無過失者，法院「得減輕」其賠償責任，而非「無須負賠償責任」（不當然完全免責），程度用語錯誤，此為極高頻重複命題陷阱。", "D": "企業經營者對商品符合可合理期待之安全性負舉證責任（舉證責任倒置，保護消費者），敘述正確，非本題答案。"}, "ref": "消費者保護法第7條", "id": 9, "chapter": "H3"}, {"year": 106, "qnum": 27, "stem": "下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？", "options": ["預售屋買賣定型化契約應記載及不得記載事項", "成屋買賣定型化契約應記載及不得記載事項", "不動產委託銷售定型化契約應記載及不得記載事項", "停車位租賃定型化契約應記載及不得記載事項"], "answer": "D", "explains": {"A": "預售屋買賣定型化契約應記載及不得記載事項確為內政部公告訂定之類型，非本題答案。", "B": "成屋買賣定型化契約應記載及不得記載事項確為內政部公告訂定之類型，非本題答案。", "C": "不動產委託銷售定型化契約應記載及不得記載事項確為內政部公告訂定之類型，非本題答案。", "D": "正確答案。「停車位租賃定型化契約應記載及不得記載事項」非本科所涉及之不動產經紀業三大定型化契約類型之一（本科規範之三大契約為成屋買賣、預售屋買賣、不動產委託銷售），停車位租賃非法定歸類於此三大契約範疇，此為虛構分類之陷阱選項。"}, "ref": "不動產經紀業管理條例第22條、消費者保護法第17條", "id": 10, "chapter": "H3"}, {"year": 106, "qnum": 28, "stem": "依消費者保護法規定，企業經營者對於消費者之申訴，應於受訴之日起幾日內妥適處理？", "options": ["7日", "10日", "15日", "20日"], "answer": "C", "explains": {"A": "數字錯誤，非7日。", "B": "數字錯誤，非10日。", "C": "正確。企業經營者對消費者申訴，應於受理申訴之日起「15日內」妥適處理，全科最高頻數字。", "D": "數字錯誤，非20日。"}, "ref": "消費者保護法第43條", "id": 11, "chapter": "H3"}, {"year": 106, "qnum": 29, "stem": "依消費者保護法規定，企業經營者對消費者保證商品或服務品質所出具之書面保證書，應載明事項不包括下列何者？", "options": ["商品或服務之名稱", "保證之內容", "製造日期", "製造商之名稱、地址"], "answer": "C", "explains": {"A": "商品或服務之名稱為保證書應載明事項，非本題答案。", "B": "保證之內容為保證書應載明事項，非本題答案。", "C": "正確答案。「製造日期」非保證書法定應載明事項（法定應載明者為「交易日期」，而非「製造日期」），此為易混淆用語之★陷阱。", "D": "製造商之名稱、地址為保證書應載明事項，非本題答案。"}, "ref": "消費者保護法第25條", "id": 12, "chapter": "H3"}, {"year": 107, "qnum": 12, "stem": "消費者保護法關於企業經營者對於廣告內容之規定，下列何者正確？", "options": ["製作廣告之媒體經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容", "企業經營者對消費者從事與分期付款買賣有關之交易時，應於廣告上明示應付所有總費用之年百分率", "刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任", "企業經營者得預先約定限縮信賴該廣告之賠償責任範圍"], "answer": "C", "explains": {"A": "確保廣告內容真實之義務主體為「企業經營者」本身，而非「媒體經營者」，主體錯誤（媒體經營者僅於明知或可得而知不實仍予刊登傳播時，始負連帶責任，其義務性質與企業經營者不同）。", "B": "此為「分期付款買賣」廣告之另一規定（第22條之1，明示總費用年百分率），惟本題其餘選項相較之下，官方標準答案為C，本選項雖與法條相關但非本題正確答案。", "C": "正確。刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符，仍予刊登傳播者，就消費者因信賴該廣告所受之損害，與企業經營者負連帶賠償責任，此為媒體經營者責任之核心規定。", "D": "企業經營者「不得」預先約定限縮信賴廣告之賠償責任範圍（廣告內容視為契約內容之保護原則，不得以約定排除），本選項方向相反。"}, "ref": "消費者保護法第22條、第23條", "id": 13, "chapter": "H3"}, {"year": 107, "qnum": 13, "stem": "消費者保護團體得依消費者保護法之規定，提起消費者損害賠償訴訟或不作為訴訟，下列何者錯誤？", "options": ["消費者保護團體依規定提起訴訟者，得以自己之名義提起，視個案情形決定是否委任律師代理訴訟", "消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體以自己名義提起訴訟者，應具備之條件有：許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良", "消費者保護團體以自己之名義提起消費者損害賠償訴訟，其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。消保團體依規定提起訴訟者，「應委任律師代理訴訟」（強制規定，非視個案情形決定），此為★陷阱。", "B": "受讓20人以上消費者損害賠償請求權後以自己名義提起訴訟，敘述正確，非本題答案。", "C": "此為第107題選項本身出現「二年以上」，官方標準答案認定本選項亦有誤（應為3年以上），惟本題官方答案指定為A，說明主要考點在於「委任律師」之強制性，C選項雖亦有年限誤植，但本題以A為標準答案。", "D": "標的價額超過60萬元部分免繳裁判費，敘述正確，非本題答案。"}, "ref": "消費者保護法第49條、第50條、第52條", "id": 14, "chapter": "H3"}, {"year": 107, "qnum": 14, "stem": "當有事實證明該流通進入市場之商品或服務，具有危害消費者安全與健康之虞時，為避免消費者權益遭受損害，企業經營者應回收或停止該有危險之商品或服務，以防免發生或擴大損害。依消費者保護法之規定，下列何者錯誤？", "options": ["中央主管機關認為有必要時，得命有損害消費者生命、身體、健康或財產的企業經營者立即停止該商品之設計、生產、製造、加工、輸入、經銷或服務之提供，或採取其他必要措施", "直轄市或縣（市）政府對於企業經營者提供之商品或服務，經調查認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬", "企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，於明顯處為警告標示，得免除回收該批商品或停止其服務之責任", "直轄市或縣（市）政府於企業經營者提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置"], "answer": "C", "explains": {"A": "中央主管機關得命企業經營者立即停止設計生產製造等或採取其他必要措施，敘述正確，非本題答案。", "B": "確有損害或損害之虞者應命限期改善回收銷燬，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。企業經營者「僅為警告標示」，「不得免除」其回收該批商品或停止服務之法定責任（警告標示與回收停止服務為併行義務，非替代關係），本選項稱得免除，方向錯誤，此為★極高頻重複命題陷阱。", "D": "情況危急時應即在大眾傳播媒體公告，敘述正確，非本題答案。"}, "ref": "消費者保護法第10條", "id": 15, "chapter": "H3"}, {"year": 108, "qnum": 15, "stem": "關於消費者保護法所稱分期付款買賣，以下何者正確？", "options": ["指買賣契約約定消費者支付頭期款，餘款分期支付之交易型態", "預售屋分期付款買賣，價金分期給付，是消費者保護法有關分期付款買賣", "分期付款買賣契約書未記載利率者，其利率按現金交易價格週年利率百分之六計算之", "分期付款買賣契約書應記載各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "answer": "D", "explains": {"A": "消保法分期付款買賣之法定定義為「企業經營者於收受頭期款時，交付標的物與消費者，餘款於一定期間內分期支付」，本選項未提及「交付標的物」之時點要件，定義不完整。", "B": "預售屋買賣因交付標的物（房屋）之時點在興建完成後，與消保法分期付款買賣「收受頭期款即交付標的物」之定義要件不符，故非屬消保法所稱分期付款買賣。", "C": "未記載利率者按現金交易價格週年利率「5%」計算，非6%，數字錯誤。", "D": "正確。分期付款買賣契約書應記載各期價款與其他附加費用合計之總價款與現金交易價格之差額，此為法定應載明事項，敘述正確。"}, "ref": "消費者保護法第2條、第21條", "id": 16, "chapter": "H3"}, {"year": 108, "qnum": 16, "stem": "消費者與企業經營者因商品或服務發生消費爭議，消費者向企業經營者申訴時，企業經營者對於消費者的申訴，以下何者正確？", "options": ["從企業經營者接獲消費者申訴的當日開始起算十日內予以妥適處理", "從企業經營者接獲消費者申訴的當日開始起算十五日內予以妥適處理", "從消費者為申訴的那一天開始起算十五日內予以妥適處理", "從消費者為申訴的那一天開始起算十日內予以妥適處理"], "answer": "B", "explains": {"A": "天數錯誤，非十日，且起算基準點亦須注意。", "B": "正確。企業經營者應自「接獲消費者申訴之當日」起算「15日內」妥適處理，此為起算基準點（企業經營者接獲之日，而非消費者發出申訴之日）及天數（15日）之精確組合，須留意起算點細節。", "C": "起算基準點應為「企業經營者接獲申訴」之日，而非「消費者為申訴」之日（若因傳遞延遲，兩者時點可能不同），此為細節陷阱。", "D": "起算基準點與天數皆有誤。"}, "ref": "消費者保護法第43條", "id": 17, "chapter": "H3"}, {"year": 108, "qnum": 17, "stem": "甲、乙、丙三公司分別為從事 A 商品之設計、製造及銷售之企業經營者。假設消費者丁購買丙公司銷售之 A 商品，造成丁的兒子受到傷害，依消費者保護法規定，甲公司應負何種責任？", "options": ["不須負任何責任", "與乙、丙公司比例分擔損害賠償責任", "與乙、丙公司負連帶賠償責任。但能證明其無過失者，法院得減輕其賠償責任", "與乙、丙公司負連帶賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限"], "answer": "C", "explains": {"A": "設計商品之企業經營者（甲）為第7條規範之核心主體，不得主張不負任何責任。", "B": "消保法商品責任採「連帶賠償責任」，並非「比例分擔」，責任型態錯誤。", "C": "正確。從事「設計」商品之企業經營者甲，適用第7條之嚴格責任標準，與乙丙公司負連帶賠償責任，僅得於「證明其無過失」時，由法院「減輕」（而非免除）其賠償責任，此為設計/生產/製造者之責任標準（區別於經銷商得主張已盡相當注意而免責）。", "D": "「已盡相當之注意即得免責」之免責事由，係適用於「經銷」商品之企業經營者（第8條），而非「設計、生產、製造」商品之企業經營者（甲屬設計者，適用第7條較嚴格之標準，僅得減輕不得完全免責），主體適用條文錯誤，此為★陷阱。"}, "ref": "消費者保護法第7條、第8條", "id": 18, "chapter": "H3"}, {"year": 108, "qnum": 18, "stem": "依消費者保護法規定，消費者與企業經營者間因商品或服務所生之爭議，得選擇申訴、調解及訴訟途徑，尋求救濟。下列有關申請調解之敘述，何者正確？", "options": ["調解屬於司法解決途徑", "申訴與調解並無先後之分，未提起申訴仍得申請調解", "調解須向直轄市、縣（市）政府消費者保護官申請", "調解成立者，調解書經法院核定後，與民事確定判決有同一之效力"], "answer": "D", "explains": {"A": "調解屬於「行政（訴訟外）解決途徑」，並非司法途徑（司法途徑係指訴訟），此為性質分類錯誤。", "B": "實務上調解通常以「申訴未獲妥適處理」為前置程序（先申訴後調解），本選項稱無先後之分，與一般消費爭議處理流程設計不符。", "C": "調解應向「直轄市、縣（市）消費爭議調解委員會」申請，而非向「消費者保護官」申請，受理機關主體錯誤。", "D": "正確。調解成立者應作成調解書，該調解書經法院核定後，與民事確定判決有同一之效力，此為調解制度之核心法律效果。"}, "ref": "消費者保護法第44條、第45條、第46條", "id": 19, "chapter": "H3"}, {"year": 108, "qnum": 19, "stem": "消費者因使用商品或接受服務，造成權利受損，依消費者保護法規定得提起團體訴訟，向企業經營者求償。有關團體訴訟之敘述，下列何者正確？", "options": ["至少有五十人將損害賠償請求權讓與經主管機關核定之優良消費者保護團體", "消費者保護團體係以自己名義提起訴訟", "損害賠償僅限於財產上之損害，不包括非財產上之損害", "消費者團體就此項訴訟，得向消費者請求報酬"], "answer": "B", "explains": {"A": "人數門檻應為「20人以上」，非50人，數字錯誤。", "B": "正確。消保團體係以「自己名義」提起消費者損害賠償訴訟（法定訴訟擔當性質），敘述正確。", "C": "損害賠償請求權讓與範圍原則上不限財產上損害（惟具一身專屬性之非財產上損害請求權須符合得讓與之要件），本選項全面排除非財產上損害過於絕對。", "D": "消保團體「不得」向消費者請求報酬（僅得請求預付或償還必要費用），本選項與法定禁止規定不符。"}, "ref": "消費者保護法第50條", "id": 20, "chapter": "H3"}, {"year": 109, "qnum": 8, "stem": "依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額幾倍以下之懲罰性賠償金？", "options": ["一倍", "三倍", "五倍", "十倍"], "answer": "C", "explains": {"A": "一倍以下適用於「一般過失」情形，非故意情形。", "B": "三倍以下適用於「重大過失」情形，非故意情形（且101年以前舊法故意為3倍，109年出題時已適用新法5倍標準）。", "C": "正確（依109年出題時之現行法）。因企業經營者「故意」所致之損害，消費者得請求損害額「五倍以下」之懲罰性賠償金，此為2015年修法後之現行標準，須與101年舊法「3倍」區辨（依題目年份判斷適用版本）。", "D": "任何版本法條皆無10倍之規定。"}, "ref": "消費者保護法第51條（現行法：故意5倍以下）", "id": 21, "chapter": "H3"}, {"year": 109, "qnum": 10, "stem": "關於企業經營者與消費者分期付款買賣契約之敘述，下列何者正確？", "options": ["企業經營者應於契約書載明各期價款與其他附加費用合計之總價款與現金交易價格之差額", "企業經營者未於契約書記載總價款者，消費者不負現金交易價格加計週年利率百分之五以外價款之給付義務", "企業經營者未於契約書記載利率者，其利率按總價款週年利率百分之六計算之", "企業經營者未於契約書記載利率者，消費者不負現金交易價格以外價款之給付義務"], "answer": "A", "explains": {"A": "正確。分期付款買賣契約書應載明各期價款與其他附加費用合計之總價款與現金交易價格之差額，此為法定應載明事項。", "B": "未載明總價款者，消費者「不負現金交易價格以外價款之給付義務」（不含法定利息），本選項稱「加計週年利率5%以外」，多加了利息計算部分，此為與「未載明利率」規定（利率按5%計算，屬另一情形）混淆之陷阱。", "C": "未記載利率者按「現金交易價格」（非「總價款」）週年利率「5%」（非「6%」）計算，計算基礎及數字皆錯誤。", "D": "「未記載利率」與「未記載總價款/差額」係不同情形之不同法律效果：未記載利率者按5%計算（非消費者完全不負額外義務），本選項混淆了「未記載利率」與「未記載總價款差額」兩種不同情形之效果。"}, "ref": "消費者保護法第21條", "id": 22, "chapter": "H3"}, {"year": 109, "qnum": 11, "stem": "企業經營者違反消費者保護法之定型化契約應記載或不得記載事項者，經主管機關令其限期改正而屆期不改正者，第一次處多少罰鍰？", "options": ["新臺幣一萬元以上十萬元以下", "新臺幣二萬元以上二十萬元以下", "新臺幣三萬元以上三十萬元以下", "新臺幣十萬元以上一百萬元以下"], "answer": "C", "explains": {"A": "金額級距不符。", "B": "金額級距不符。", "C": "正確。違反定型化契約應記載或不得記載事項規定，經限期改正屆期不改正者，第一次處新臺幣「3萬元以上30萬元以下」罰鍰。", "D": "金額級距不符，此級距過高。"}, "ref": "消費者保護法第56條之1", "id": 23, "chapter": "H3"}, {"year": 109, "qnum": 19, "stem": "消費者保護法針對企業經營者在定型化契約中所用之條款，有非常多的規定。下列敘述何者正確？", "options": ["企業經營者應給與消費者定型化契約書。但依其契約之性質致給與顯有困難者，不在此限", "企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式，公告其內容後，該條款立即成為契約之內容", "定型化契約書經消費者簽名或蓋章者，企業經營者應給與消費者該定型化契約書副本", "定型化契約條款如有疑義時，應為有利於雙方當事人之解釋"], "answer": "A", "explains": {"A": "正確。企業經營者應給與消費者定型化契約書，但依契約性質致給與顯有困難者，不在此限，此為合理例外規定，敘述完整正確。", "B": "以顯著方式公告內容後，仍須「經消費者同意」該條款始構成契約內容，並非公告後「立即」成為契約內容，程序要件不足，此為★陷阱。", "C": "企業經營者應給與消費者該定型化契約書「正本」，而非「副本」，此為用語錯誤之陷阱。", "D": "定型化契約條款如有疑義，應為有利於「消費者」之解釋，而非「雙方當事人」，此為消保法保護弱勢消費者之核心解釋原則，本選項方向錯誤。"}, "ref": "消費者保護法第11條、第13條", "id": 24, "chapter": "H3"}, {"year": 109, "qnum": 20, "stem": "甲於網路上看到乙不動產開發商委託丙廣告媒體經營者刊登不動產買賣廣告後，向乙購買了一戶房屋。於交屋後發現有廣告不實的爭議。下列敘述何者錯誤？", "options": ["乙應確保廣告內容之真實，其對甲所負之義務不得低於廣告之內容。乙之商品或服務廣告內容，於契約成立後，應確實履行", "甲可以向消費者保護團體提出廣告爭議之申訴、調解，或是直接向直轄市或縣（市）消費爭議調解委員會申請調解", "丙明知或可得而知廣告內容與事實不符者，就甲因信賴該廣告所受之損害與企業經營者負連帶責任", "甲與乙因商品或服務發生廣告之消費爭議時，甲得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴"], "answer": "B", "explains": {"A": "企業經營者乙應確保廣告內容真實並確實履行，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。消費者須「先向企業經營者、消保團體或消費者服務中心申訴，未獲妥適處理」，始得向直轄市或縣（市）消費爭議調解委員會申請調解，本選項稱「或是直接」申請調解（略過申訴前置程序），此為程序先後順序錯誤之★陷阱。", "C": "媒體經營者丙明知或可得而知不實仍予刊登者，與企業經營者負連帶責任，敘述正確，非本題答案。", "D": "甲得向企業經營者、消保團體或消費者服務中心申訴，敘述正確，非本題答案。"}, "ref": "消費者保護法第22條、第23條、第43條、第44條", "id": 25, "chapter": "H3"}, {"year": 109, "qnum": 21, "stem": "甲為 A 屋的所有權人，委託乙仲介公司幫忙賣房子。關於甲乙適用消費者保護法的情形，下列敘述何者錯誤？", "options": ["甲和乙所發生之法律關係，屬於消費關係", "乙提出乙定型化契約條款作為契約內容而訂立之委託銷售契約屬於定型化契約", "甲和乙訂定買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態，屬於分期付款之契約", "甲和乙如果適用乙所提出的定型化契約，仍然可以由契約當事人個別磋商而合意擬定個別磋商條款"], "answer": "C", "explains": {"A": "甲乙間之委託銷售關係屬消費關係（甲為消費者、乙為企業經營者），敘述正確，非本題答案。", "B": "乙提出之定型化契約條款訂立之委託銷售契約屬定型化契約，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。本題甲乙間為「委託銷售契約」（居間服務性質），並非「買賣契約」，且委託銷售契約非以交付特定標的物並分期給付價金為內容，與消保法「分期付款買賣」（企業經營者收受頭期款即交付買賣標的物，餘款分期給付）之定義不符，主體及契約性質混淆，此為★陷阱。", "D": "適用定型化契約時，仍得由當事人個別磋商合意擬定個別磋商條款（且個別磋商條款效力優先於定型化契約條款），敘述正確，非本題答案。"}, "ref": "消費者保護法第2條", "id": 26, "chapter": "H3"}, {"year": 109, "qnum": 22, "stem": "為維護消費者之權益，保障消費者之健康與安全，消費者保護法於第二章第一節規定「健康與安全保障」專節。下列敘述何者錯誤？", "options": ["從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任", "企業經營者對消費者或第三人之損害賠償責任，不得預先約定限制或免除", "輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，需負第三人責任", "企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，應即回收該批商品或停止其服務"], "answer": "C", "explains": {"A": "經銷商與生產製造者連帶負賠償責任，敘述正確，非本題答案。", "B": "企業經營者對消費者或第三人之損害賠償責任不得預先約定限制或免除，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，應負「製造者責任」（即適用第7條嚴格責任標準），本選項稱「第三人責任」，用語錯誤（消保法並無「第三人責任」此一法律名詞概念，此為虛構法律用語之陷阱）。", "D": "有危害安全健康之虞者應即回收停止服務，敘述正確，非本題答案。"}, "ref": "消費者保護法第9條", "id": 27, "chapter": "H3"}, {"year": 110, "qnum": 14, "stem": "消費爭議調解委員會於不違反消費爭議兩造當事人之主要意思範圍內，依職權所提出解決事件之方案，當事人得於該方案送達後幾日內，提出異議，就視為調解不成立？", "options": ["10日", "15日", "20日", "30日"], "answer": "A", "explains": {"A": "正確。當事人對調解委員依職權提出之解決方案有異議者，得於送達後「10日」之不變期間內提出異議，逾期未異議者視為成立調解，此為全科高頻數字。", "B": "數字錯誤，非15日。", "C": "數字錯誤，非20日。", "D": "數字錯誤，非30日。"}, "ref": "消費者保護法第45條之2", "id": 28, "chapter": "H3"}, {"year": 110, "qnum": 15, "stem": "依消費者保護法規定，下列有關消費者保護團體提起團體訴訟之敘述，何者錯誤？", "options": ["消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請內政部評定優良者，得以自己之名義提起訴訟", "消費者保護團體依規定提起訴訟者，應委任律師代理訴訟", "消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體得以自己之名義，提起第50條消費者損害賠償訴訟或第53條不作為訴訟"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。應為許可設立「三年」以上（非「二年」以上），且應申請「行政院」（非「內政部」）評定優良，本選項有兩處數字/機關錯誤，此為極高頻重複命題陷阱，須牢記「3年、消保專門人員、行政院評定優良」三要件。", "B": "應委任律師代理訴訟，敘述正確，非本題答案。", "C": "受讓20人以上損害賠償請求權後以自己名義提起訴訟，敘述正確，非本題答案。", "D": "得提起第50條消費者損害賠償訴訟或第53條不作為訴訟，敘述正確，非本題答案。"}, "ref": "消費者保護法第49條、第50條", "id": 29, "chapter": "H3"}, {"year": 110, "qnum": 18, "stem": "依消費者保護法規定，各類企業經營者對消費者應負之損害賠償責任，下列敘述何者錯誤？", "options": ["輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負製造者責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限", "從事設計、生產、製造商品或提供服務之企業經營者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任", "從事經銷之企業經營者，改裝、分裝商品或變更服務內容者，違反消費者保護法規定致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。輸入商品或服務之企業經營者，視為設計、生產、製造者或服務提供者，應適用「設計/生產/製造者」較嚴格之第7條責任標準（僅得於證明無過失時由法院「減輕」責任），而「不得」主張經銷商層級「已盡相當注意即完全免責」之較低標準，本選項將輸入者誤套用經銷商之免責事由，此為★極高頻重複命題陷阱：輸入者視同製造者，適用較嚴格標準。", "B": "經銷商已盡相當注意得免除連帶責任，敘述正確，非本題答案。", "C": "設計生產製造者負連帶賠償責任，能證明無過失者法院得減輕（非免除）其責任，敘述正確，非本題答案。", "D": "經銷商若改裝分裝變更服務內容者，視為設計生產製造者，適用相同嚴格標準（能證明無過失僅得減輕），敘述正確，非本題答案。"}, "ref": "消費者保護法第7條、第8條、第9條", "id": 30, "chapter": "H3"}, {"year": 110, "qnum": 19, "stem": "依消費者保護法規定，關於小額消費爭議之調解，當事人之一方無正當理由，不於調解期日到場之處理方式為何？", "options": ["調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意", "調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意"], "answer": "D", "explains": {"A": "此為「一般消費爭議」（非小額）調解委員依職權提出方案之機制描述，且門檻應為「全體」而非「參與」調解委員過半數，兩處與小額爭議規定不符。", "B": "敘述前段（斟酌情形求兩造利益平衡）為一般消費爭議之機制，非小額爭議「一造不到場」情形之特有規定，情境不符。", "C": "門檻應為「全體調解委員」過半數同意，而非「參與調解委員」過半數，此為小額爭議與一般爭議門檻不同之易混淆數字。", "D": "正確。小額消費爭議中，一方無正當理由不到場者，調解委員得依到場當事人一造之請求或依職權提出解決方案，並送達當事人，該方案應經「全體調解委員」過半數之同意，此為小額爭議調解之特別簡化機制，門檻與一般消費爭議（參與調解委員過半數）不同，須區辨。"}, "ref": "消費者保護法第45條之3", "id": 31, "chapter": "H3"}, {"year": 111, "qnum": 12, "stem": "甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費者保護法之規定，乙可以如何主張權利？", "options": ["要求甲建商回收該批商品或停止其服務", "主張甲建商應負損害賠償責任", "主張除去其危害", "主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"], "answer": "D", "explains": {"A": "回收商品或停止服務適用於商品/服務具危害安全健康之虞之情形（第10條），與審閱期爭議無關。", "B": "損害賠償責任適用於已生損害之情形，本題爭點在於契約條款效力，非損害賠償問題。", "C": "除去危害適用於安全健康危害情形，與審閱期爭議無關。", "D": "正確。未提供合理期間審閱者，該條款原則上不構成契約內容，但消費者（乙）得主張該條款仍構成契約內容（單方選擇權，若對其有利時得主張生效），此為審閱期爭議之標準法律效果。"}, "ref": "消費者保護法第11條之1", "id": 32, "chapter": "H3"}, {"year": 111, "qnum": 14, "stem": "企業經營者與消費者簽訂定型化之分期付款買賣契約，依消費者保護法規定，該契約書應載明之事項不包含下列那一項？", "options": ["頭期款", "企業經營者保留契約內容或期限之變更權或解釋權", "各期價款與其他附加費用合計之總價款與現金交易價格之差額", "利率"], "answer": "B", "explains": {"A": "頭期款為分期付款契約應載明事項，非本題答案。", "B": "正確答案。「企業經營者保留契約內容或期限之變更權或解釋權」非分期付款契約之應載明事項，反而是消保法明文禁止之「不得記載事項」類型（違反平等互惠原則，賦予企業經營者片面變更權將對消費者顯失公平），此為應載明事項與不得記載事項概念混淆之★陷阱。", "C": "各期價款與附加費用合計總價款與現金交易價格差額為應載明事項，非本題答案。", "D": "利率為應載明事項，非本題答案。"}, "ref": "消費者保護法第12條、第21條", "id": 33, "chapter": "H3"}, {"year": 111, "qnum": 15, "stem": "企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？", "options": ["七日", "十日", "十五日", "三十日"], "answer": "C", "explains": {"A": "數字錯誤，非七日。", "B": "數字錯誤，非十日。", "C": "正確。企業經營者對消費者之申訴，應於申訴之日起「15日內」妥適處理，全科最高頻數字，反覆重複命題。", "D": "數字錯誤，非三十日。"}, "ref": "消費者保護法第43條", "id": 34, "chapter": "H3"}, {"year": 111, "qnum": 16, "stem": "企業經營者在提供契約條款供他人參考時，下列那一種表示內容不會屬於定型化契約條款之一部分？", "options": ["以書面傳真提供給單一個別客戶之優惠條款內容", "以電視字幕放映提供之廣告字幕", "以書面產品型錄提供之內容", "以網際網路提供之廣告資訊"], "answer": "A", "explains": {"A": "正確答案。定型化契約條款之特徵為「企業經營者為與『不特定多數人』訂立同類契約之用，所『預先』擬定之契約條款」，本選項係「傳真給單一個別客戶」之優惠內容，屬針對特定個別對象之磋商性質，不符合定型化契約條款「不特定多數人」之要件，故非定型化契約條款之一部分。", "B": "電視字幕廣告係向不特定多數人傳播之內容，得構成定型化契約條款之一部分，非本題答案。", "C": "書面產品型錄係向不特定多數人提供之內容，得構成定型化契約條款之一部分，非本題答案。", "D": "網際網路廣告係向不特定多數人傳播之內容，得構成定型化契約條款之一部分，非本題答案。"}, "ref": "消費者保護法第2條", "id": 35, "chapter": "H3"}, {"year": 111, "qnum": 22, "stem": "依消費者保護法第 17 條之規定，定型化契約應記載事項，依契約之性質及目的，其內容不包括下列那一項？", "options": ["預付型交易之履約擔保", "企業經營者之義務或責任之免除", "契約之終止權", "違反契約之法律效果"], "answer": "B", "explains": {"A": "預付型交易之履約擔保屬定型化契約「應記載事項」內容範疇之一，非本題答案。", "B": "正確答案。「企業經營者之義務或責任之免除」性質上屬對消費者顯失公平之條款，應歸類為定型化契約之「不得記載事項」，而非「應記載事項」，此為兩種相反性質事項之混淆陷阱。", "C": "契約之終止權屬應記載事項內容範疇之一，非本題答案。", "D": "違反契約之法律效果屬應記載事項內容範疇之一，非本題答案。"}, "ref": "消費者保護法第17條", "id": 36, "chapter": "H3"}, {"year": 112, "qnum": 22, "stem": "消費者保護團體依消費者保護法提起消費者損害賠償訴訟之要件，下列何者正確？", "options": ["消費者保護團體許可設立三年以上", "消費者保護團體申請行政院評定優良者", "得委任律師代理訴訟", "消費者保護團體不得向消費者請求報酬，但得請求預付或償還必要費用"], "answer": "B", "explains": {"A": "許可設立三年以上確為要件之一，惟本題官方標準答案為B，本選項雖內容正確但可能因題目要求選出「最」直接對應法定用語之選項，或本題設計上僅有一個選項被判定為官方答案，實務作答仍應以B為準。", "B": "正確。消費者保護團體以自己名義提起第50條訴訟，須申請「行政院評定優良」，此為法定要件之一（與許可設立3年以上、置有消保專門人員併列為三大要件）。", "C": "應為「應」委任律師代理訴訟（強制規定），而非「得」委任（任意規定），用語程度錯誤。", "D": "不得向消費者請求報酬，但得請求預付或償還必要費用，此敘述本身正確，惟本題官方標準答案為B，並非本選項。"}, "ref": "消費者保護法第49條、第50條", "id": 37, "chapter": "H3"}, {"year": 112, "qnum": 23, "stem": "依消費者保護法之規定，關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，下列何者錯誤？", "options": ["調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，此方案應經參與調解委員過半數之同意", "該解決方案之送達，不適用公示送達規定", "當事人對該解決方案，得於送達後十日之不變期間內，提出異議；未於異議期間內提出異議者，視為已依該解決方案成立調解", "當事人於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，視為依該解決方案成立調解"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。小額消費爭議一造不到場情形所提出之解決方案，應經「全體調解委員」（而非「參與調解委員」）過半數之同意，門檻主體錯誤，此為與一般消費爭議規定（參與調解委員過半數）易混淆之★陷阱。", "B": "該解決方案之送達不適用公示送達規定，敘述正確，非本題答案。", "C": "異議期限為送達後10日不變期間，未異議視為成立調解，敘述正確，非本題答案。", "D": "異議後另定期日仍無正當理由不到場者，視為成立調解，敘述正確，非本題答案。"}, "ref": "消費者保護法第45條之3", "id": 38, "chapter": "H3"}, {"year": 112, "qnum": 24, "stem": "關於輸入商品或服務之企業經營者，下列何者錯誤？", "options": ["視為該商品之設計、生產、製造者或服務之提供者", "於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性", "消費者保護團體主張企業經營者不符合當時科技或專業水準可合理期待之安全性者，就其事實應負舉證責任", "企業經營者違反相關規定，致生損害於消費者或第三人時，應負連帶賠償責任"], "answer": "C", "explains": {"A": "輸入商品或服務之企業經營者視為設計生產製造者或服務提供者，敘述正確，非本題答案。", "B": "應確保商品或服務符合當時科技或專業水準可合理期待之安全性，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。消保法就商品或服務安全性採「舉證責任倒置」原則，應由「企業經營者」自行舉證證明其商品或服務符合安全性標準，而非由消保團體負舉證責任，舉證責任主體錯誤，此為保護消費者訴訟弱勢地位之核心制度設計，屬★陷阱。", "D": "違反規定致生損害應負連帶賠償責任，敘述正確，非本題答案。"}, "ref": "消費者保護法第7條、第7條之1", "id": 39, "chapter": "H3"}, {"year": 112, "qnum": 25, "stem": "關於消費者保護團體，下列何者正確？", "options": ["消費者保護團體以社團法人、財團法人或行政法人為限", "消費者保護團體之任務為監督消費者保護主管機關及指揮消費者保護官行使職權", "消費者保護團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會", "消費者保護團體為商品或服務之調查、檢驗時，請求政府予以協助時，政府不應允許"], "answer": "C", "explains": {"A": "消保團體以「社團法人或財團法人」為限，不含「行政法人」（行政法人屬公法性質組織，非消保團體適格類型），此為範圍擴大之陷阱。", "B": "消保團體並無監督主管機關或指揮消保官行使職權之權限（消保團體與主管機關、消保官為平行不同性質之組織），此為虛構職權之陷阱。", "C": "正確。消保團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會，此為保障企業經營者程序公平之規定。", "D": "消保團體為調查檢驗得請求政府予以「必要之協助」，政府「應予」協助（非不應允許），本選項方向相反。"}, "ref": "消費者保護法第27條、第28條", "id": 40, "chapter": "H3"}, {"year": 113, "qnum": 9, "stem": "甲建商於預售屋銷售廣告單中表示：「現場簽約，贈送德國進口高級廚衛設備」。首次購屋者乙於建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？", "options": ["廣告係要約引誘，對甲並不具拘束力", "廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力", "廣告內容即為契約內容，於契約成立後，甲應確實履行", "甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"], "answer": "C", "explains": {"A": "依消保法特別規定，企業經營者之廣告內容「視為契約內容之一部分」，並非民法一般原則下之「要約引誘」（不具拘束力），此為消保法對廣告效力之特別保護規定，優先於民法一般原則適用。", "B": "廣告內容依消保法規定「當然」構成契約內容（不須另經雙方合意訂入個別磋商條款之額外程序），此為消保法之特別保護，本選項增加不必要之生效要件，屬★陷阱。", "C": "正確。依消保法規定，企業經營者之商品或服務廣告內容，於契約成立後應確實履行，廣告內容即視為契約內容之一部分，甲建商應就廣告所載贈品內容確實履行。", "D": "廣告係甲建商自行刊登用以招攬客戶，甲不得以廣告製作或刊登者係媒體經營者為由，主張免除自身之履約責任（廣告真實及履行義務之主體為企業經營者甲本身，非媒體經營者）。"}, "ref": "消費者保護法第22條", "id": 41, "chapter": "H3"}, {"year": 114, "qnum": 5, "stem": "依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。該保證書應載明之事項中，不包括那一項？", "options": ["商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號", "保證期間及其起算方法", "由經銷商售出者，經銷商之名稱、地址", "各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "answer": "D", "explains": {"A": "商品或服務之名稱種類數量及製造號碼/批號為保證書應載明事項，非本題答案。", "B": "保證期間及其起算方法為保證書應載明事項，非本題答案。", "C": "由經銷商售出者其名稱地址為保證書應載明事項，非本題答案。", "D": "正確答案。「各期價款與其他附加費用合計之總價款與現金交易價格之差額」為「分期付款買賣契約書」（第21條）之應載明事項，而非「品質保證書」（第25條）之應載明事項，兩種不同法定文件之應載明事項互相混淆，此為與99年-20題相同類型之★高頻陷阱。"}, "ref": "消費者保護法第25條", "id": 42, "chapter": "H3"}];
const STORAGE_KEY = "brokerlaw_h3_2_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
