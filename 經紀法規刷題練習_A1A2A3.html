const QUESTIONS = [{"chapter": "A1", "year": 100, "qnum": 18, "stem": "經紀業應於經紀人到職之日起最長幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "B", "explains": {"A": "數字錯誤，非十日。", "B": "正確。經紀業應於經紀人到職之日起「15日內」，造具名冊報請所在地主管機關層報中央主管機關備查，此為全科最高頻數字之一。", "C": "數字錯誤，非二十日。", "D": "數字錯誤，非三十日。"}, "ref": "不動產經紀業管理條例第10條", "id": 1}, {"chapter": "A1", "year": 106, "qnum": 7, "stem": "依不動產經紀業管理條例規定，經紀業應於經紀人到職之日起幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？", "options": ["5日", "10日", "15日", "20日"], "answer": "C", "explains": {"A": "數字錯誤，非5日。", "B": "數字錯誤，非10日。", "C": "正確。經紀人到職應於「15日內」造具名冊報請所在地主管機關層報中央主管機關備查，此為全科最高頻數字之一，反覆重複命題。", "D": "數字錯誤，非20日。"}, "ref": "不動產經紀業管理條例第10條", "id": 2}, {"chapter": "A1", "year": 106, "qnum": 9, "stem": "不動產經紀業管理條例所稱主管機關，下列敘述何者錯誤？", "options": ["內政部營建署", "內政部", "直轄市政府地政處", "縣（市）政府"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。中央主管機關為「內政部」（本身），並非「內政部營建署」（營建署為內政部所屬機關之一，非法定主管機關本身），此為機關層級混淆之★陷阱。", "B": "內政部為中央主管機關，敘述正確，非本題答案。", "C": "直轄市政府地政處為地方主管機關，敘述正確，非本題答案。", "D": "縣（市）政府為地方主管機關，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第3條", "id": 3}, {"chapter": "A1", "year": 107, "qnum": 3, "stem": "甲於 A 市經營不動產經紀業，數年後欲遷出所在地 A 市到 B 縣，應於遷出後多久時間內，以書面向遷入之 B 縣主管機關申請遷入備查，並向原所屬之同業公會報備，及加入 B 縣同業公會，該遷入之同業公會並應轉知其全國聯合會？", "options": ["三十日", "四十五日", "二個月", "三個月"], "answer": "A", "explains": {"A": "正確。經紀業遷址後，應於遷出後「30日內」以書面向遷入地主管機關申請遷入備查，並向原同業公會報備及加入遷入地同業公會，此為經紀業遷址程序之核心期限。", "B": "數字錯誤，非四十五日。", "C": "數字錯誤，非二個月。", "D": "數字錯誤，非三個月。"}, "ref": "不動產經紀業管理條例施行細則", "id": 4}, {"chapter": "A1", "year": 109, "qnum": 2, "stem": "不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？", "options": ["都市發展、城鄉發展", "產業發展", "地政", "財政"], "answer": "C", "explains": {"A": "都市發展、城鄉發展局處非本條例主管機關轄屬，此為與都市計畫相關機關混淆之陷阱。", "B": "產業發展局處非本條例主管機關轄屬。", "C": "正確。不動產經紀業管理條例所稱直轄市主管機關為直轄市政府「地政」處（局），因不動產經紀業務性質與地政業務密切相關。", "D": "財政局處非本條例主管機關轄屬。"}, "ref": "不動產經紀業管理條例第3條", "id": 5}, {"chapter": "A1", "year": 112, "qnum": 7, "stem": "依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？", "options": ["報請所在地主管機關核定", "報請所在地主管機關備查", "報請所在地主管機關層轉中央主管機關核定", "報請所在地主管機關層轉中央主管機關備查"], "answer": "D", "explains": {"A": "應為「層轉中央主管機關」並「備查」，非僅所在地主管機關「核定」，機關層級及處理方式皆不符。", "B": "應「層轉中央主管機關」，非僅所在地主管機關備查即可，程序層級不足。", "C": "應為「備查」，非「核定」（核定為准駁性質之審查，備查僅為知悉性質之陳報，兩者審查強度不同），性質錯誤。", "D": "正確。同業公會關於會員入會、停權、退會情形，應報請所在地主管機關「層轉中央主管機關備查」，兩層機關皆須經過，且性質為「備查」（非核定）。"}, "ref": "不動產經紀業管理條例施行細則", "id": 6}, {"chapter": "A2", "year": 99, "qnum": 1, "stem": "不動產經紀業經主管機關許可後，應於 6 個月之內依「不動產經紀業管理條例」第 7 條第 1 項及第 3 項規定完成下列 3 項工作中之那幾項？①辦妥公司登記或商業登記 ②繳存營業保證金 ③加入登記所在地之同業公會", "options": ["只須完成第①項", "須完成第①與第②項", "須完成第①與第③項", "須完成第①、第②與第③項"], "answer": "D", "explains": {"A": "僅完成①項不足，須完成全部三項。", "B": "漏未③加入同業公會，不完整。", "C": "漏未②繳存營業保證金，不完整。", "D": "正確。經紀業經許可後6個月內，應完成①辦妥公司或商業登記、②繳存營業保證金、③加入登記所在地同業公會，三項工作缺一不可，始得開始營業。"}, "ref": "不動產經紀業管理條例第7條", "id": 7}, {"chapter": "A2", "year": 99, "qnum": 4, "stem": "不動產經紀業分設之營業處所為「不動產經紀業管理條例」第 4 條第 10 款所稱非常態之固定場所者，其向所在地直轄市或縣（市）主管機關申請備查時所應記載的第 2 款應記明事項應改以下列何者代之？", "options": ["以該營業處所代理銷售之不動產名稱及所在地代之", "以該營業處所代理銷售名稱及設立期間代之", "以該營業處所代理銷售之不動產名稱、所在地及設立期間代之", "以該營業處所之設立目的或代理銷售之不動產名稱、所在地、銷售金額及設立期間代之"], "answer": "D", "explains": {"A": "內容不完整，漏未設立目的、銷售金額及設立期間等要素。", "B": "內容不完整，漏未所在地、銷售金額等要素。", "C": "內容不完整，漏未設立目的及銷售金額。", "D": "正確。非常態固定場所（如代銷接待中心）申請備查時，第2款應記明事項應改以「該營業處所之設立目的或代理銷售之不動產名稱、所在地、銷售金額及設立期間」代之，此為因應非常態場所特性之替代記載內容，較一般常態營業處所之記載事項更詳盡（含銷售金額及存續期間）。"}, "ref": "不動產經紀業管理條例施行細則", "id": 8}, {"chapter": "A2", "year": 99, "qnum": 5, "stem": "直轄市或縣（市）不動產經紀業主管機關無需設置下列那一簿冊，並永久保存？", "options": ["不動產經紀業管理登記簿", "不動產經紀業在其所轄區域外設立之營業處所管理登記簿", "不動產經紀人名簿", "不動產經紀營業員名簿"], "answer": "B", "explains": {"A": "經紀業管理登記簿為主管機關應永久保存之法定簿冊，非本題答案。", "B": "正確答案。主管機關無需設置「經紀業在其『所轄區域外』設立之營業處所管理登記簿」（管轄權限僅及於本轄區域內之經紀業及營業處所，非其轄區外設立者，此涉及行政管轄權地域限制之基本原則），此為虛構簿冊之陷阱。", "C": "經紀人名簿為主管機關應永久保存之法定簿冊，非本題答案。", "D": "經紀營業員名簿為主管機關應永久保存之法定簿冊，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則", "id": 9}, {"chapter": "A2", "year": 99, "qnum": 6, "stem": "不動產經紀業設立一非常態營業處所時，若其所銷售總金額達新臺幣 10 億元以上，且該營業處所擁有 25 位經紀營業員時，該非常態營業處所至少應置專業經紀人幾人？", "options": ["1人", "2人", "3人", "4人"], "answer": "B", "explains": {"A": "依銷售金額達6億元以上須置專業經紀人1人之基礎規定，再加計經紀營業員人數逾20名應增設經紀人1人之規定（25位營業員已逾20名門檻），兩項規定合計，至少應置2人，本選項僅計入基礎1人，未計入營業員人數增設規定，數量不足。", "B": "正確。非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人（基礎規定）；又經紀營業員人數每逾20名，應增設經紀人1人（本題25位營業員已逾20名門檻，應增設1人），兩項規定合計，至少應置專業經紀人「2人」。", "C": "數量計算過多，未精確依規定計算。", "D": "數量計算過多，未精確依規定計算。"}, "ref": "不動產經紀業管理條例第11條", "id": 10}, {"chapter": "A2", "year": 100, "qnum": 13, "stem": "不動產經紀業分設營業處所時，應於設立後最長幾日內，以書面將相關事項向主管機關申請備查？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "D", "explains": {"A": "數字錯誤，非十日。", "B": "數字錯誤，非十五日。", "C": "數字錯誤，非二十日。", "D": "正確。經紀業分設營業處所，應於設立後「30日內」以書面向主管機關申請備查，須與裁撤時之期限（同為30日）及經紀人到職備查期限（15日）區辨。"}, "ref": "不動產經紀業管理條例施行細則", "id": 11}, {"chapter": "A2", "year": 100, "qnum": 14, "stem": "經紀業分設之營業處所裁撤時，最長應於裁撤後幾日內，以書面向經紀業所在地直轄市或縣（市）主管機關申請備查？", "options": ["十日", "二十日", "三十日", "四十日"], "answer": "C", "explains": {"A": "數字錯誤，非十日。", "B": "數字錯誤，非二十日。", "C": "正確。營業處所裁撤時，應於裁撤後「30日內」向經紀業所在地主管機關申請備查，與設立時之30日期限相同，兩者皆為30日，易於記憶。", "D": "數字錯誤，非四十日。"}, "ref": "不動產經紀業管理條例施行細則", "id": 12}, {"chapter": "A2", "year": 101, "qnum": 28, "stem": "下列有關營業保證金之敘述，何者為錯誤？", "options": ["由各直轄市或縣（市）政府統一於指定之金融機構設置營業保證金專戶儲存", "經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉", "基金管理委員會委員，由經紀業擔任者，其人數不得超過委員總數之五分之二", "基金之孳息部分，得運用於健全不動產經紀制度"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。營業保證金應由「中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會」（而非「各直轄市或縣市政府」）統一於指定金融機構設置專戶儲存，管理主體錯誤，此為★陷阱：營業保證金採全國統一管理制度，非各地方政府分別管理。", "B": "合併變更組織時營業保證金權利隨之移轉，敘述正確，非本題答案。", "C": "基金管理委員會委員由經紀業擔任者不得超過委員總數五分之二，敘述正確，非本題答案。", "D": "基金孳息得運用於健全不動產經紀制度，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第26條", "id": 13}, {"chapter": "A2", "year": 101, "qnum": 37, "stem": "依不動產經紀業管理條例規定，經紀業經主管機關許可，辦妥公司登記，並加入同業公會後，原則上應於幾個月內開始營業？", "options": ["一", "三", "五", "六"], "answer": "D", "explains": {"A": "數字錯誤，非一個月。", "B": "數字錯誤，非三個月。", "C": "數字錯誤，非五個月。", "D": "正確。經紀業經許可辦妥登記並加入同業公會後，原則上應於「6個月內」開始營業，逾期未開業者主管機關廢止許可（得申請展延一次，以3個月為限），此為經紀業開業期限之核心數字。"}, "ref": "不動產經紀業管理條例第7條", "id": 14}, {"chapter": "A2", "year": 102, "qnum": 11, "stem": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人", "營業處所經紀營業員數每逾10名時，應增設經紀人1人", "經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同", "非中華民國國民，不得充任中華民國不動產經紀人"], "answer": "A", "explains": {"A": "正確。營業處所至少應置經紀人1人；非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人（此1人可與一般營業處所之基礎要求併計或視個案認定），敘述基本符合法定架構。", "B": "經紀營業員人數每逾「20名」（而非10名）應增設經紀人1人，數字錯誤。", "C": "應為到職之日起「15日內」（而非7日內）造具名冊報備，數字錯誤。", "D": "外國人「得」依我國法律應考經紀人考試並充任經紀人員（經一定許可程序），並非絕對禁止非國民充任，本選項過於絕對，與法律開放外國人參與之規定不符。"}, "ref": "不動產經紀業管理條例第11條", "id": 15}, {"chapter": "A2", "year": 103, "qnum": 9, "stem": "依不動產經紀業管理條例有關經營經紀業之規定，下列敍述何者錯誤？", "options": ["應向主管機關申請許可後，依法辦理公司或商業登記", "經紀業分設營業處所，應向直轄市或縣（市）政府申請許可", "其經營國外不動產仲介業務者，應以公司型態組織依法辦理登記", "需加入登記所在地之同業公會後方得營業"], "answer": "B", "explains": {"A": "應先申請許可後依法辦理公司或商業登記，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。經紀業分設營業處所，應向直轄市或縣（市）主管機關申請「備查」，而非「申請許可」，性質錯誤（許可為事前准駁審查，備查僅為事後陳報知悉），此為★陷阱：分設營業處所僅須備查，非須另行申請許可。", "C": "經營國外不動產仲介業務者應以公司型態組織辦理登記，敘述正確，非本題答案。", "D": "須加入登記所在地同業公會後方得營業，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第7條", "id": 16}, {"chapter": "A2", "year": 105, "qnum": 7, "stem": "經紀業應負賠償責任時，受害人於取得對經紀業之執行名義、經仲裁成立或營業保證基金管理委員會之決議支付後，得於該經紀業繳存營業保證金及提供擔保總額內，向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會為如何之請求？", "options": ["預為賠償", "代為賠償", "連帶賠償", "不真正連帶賠償"], "answer": "B", "explains": {"A": "「預為賠償」非法定用語，此為虛構名詞之陷阱。", "B": "正確。受害人取得執行名義等要件後，得向全國聯合會請求「代為賠償」（由營業保證基金代為墊付），全國聯合會非賠償義務之原始主體，僅係「代為」給付，法律用語精確。", "C": "「連帶賠償」是共同債務人各自對全部債務負責之型態，與全國聯合會「代為賠償」之補充性質不同。", "D": "「不真正連帶賠償」非本條例規定之法律用語。"}, "ref": "不動產經紀業管理條例第26條第4項", "id": 17}, {"chapter": "A2", "year": 106, "qnum": 5, "stem": "依不動產經紀業管理條例規定，下列關於條例用辭定義之敘述何者正確？", "options": ["成屋：指領有建造執照，或於實施建築管理前建造完成之建築物", "預售屋：指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "經紀業：指依不動產經紀業管理條例規定從事買賣、互易、租賃之居間或代理業務者", "營業處所：指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所"], "answer": "D", "explains": {"A": "成屋應為領有「使用執照」（而非「建造執照」），或於實施建築管理前建造完成之建築物，執照類型錯誤。", "B": "預售屋應為領有「建造執照」（而非「使用執照」）尚未建造完成之建築物，執照類型錯誤（本選項與成屋定義之執照類型恰好互換，屬典型陷阱）。", "C": "此為「仲介業務」之部分定義描述，「經紀業」之法定定義應為「依本條例規定經營仲介或代銷業務之公司或商號」，主體定義不符（經紀業是組織主體，非業務內容本身）。", "D": "正確。營業處所係指經紀業經營仲介或代銷業務之店面、辦公室或「非常態之固定場所」（如代銷接待中心），定義完整正確。"}, "ref": "不動產經紀業管理條例第4條", "id": 18}, {"chapter": "A2", "year": 106, "qnum": 10, "stem": "下列有關不動產經紀業營業保證金之敘述，何者錯誤？", "options": ["營業保證金獨立於經紀業及經紀人員之外", "除不動產經紀業管理條例另有規定外，得因經紀業或經紀人員之債權、債務關係而為讓與、扣押、抵銷或設定負擔", "營業保證金應隨經紀業之合併、變更組織而移轉", "經紀業申請解散者，得請求退還原繳存之營業保證金"], "answer": "B", "explains": {"A": "營業保證金獨立於經紀業及經紀人員之外，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。營業保證金除本條例另有規定外，「不因」（而非「得因」）經紀業或經紀人員之債權債務關係而為讓與、扣押、抵銷或設定負擔，方向相反，此為★極高頻陷阱：保護營業保證金作為賠償基金之獨立性，不受經紀業個人債務糾紛影響。", "C": "營業保證金應隨經紀業合併變更組織而移轉，敘述正確，非本題答案。", "D": "經紀業申請解散者得請求退還原繳存營業保證金，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第26條", "id": 19}, {"chapter": "A2", "year": 108, "qnum": 1, "stem": "關於不動產經紀業營業保證金之敘述，以下何者錯誤？", "options": ["營業保證金除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押或設定負擔", "不動產經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金。但不包括營業保證金之孳息", "應繳之營業保證金及繳存或提供擔保之辦法，由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會定之", "經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉"], "answer": "C", "explains": {"A": "營業保證金不因債務債權關係而讓與扣押或設定負擔，敘述正確，非本題答案。", "B": "申請解散者得自核准註銷營業之日滿1年後2年內請求退還（不含孳息），敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應繳之營業保證金及繳存或提供擔保之辦法，應由「中央主管機關」定之，而非「全國聯合會」自行訂定（全國聯合會僅負責管理基金專戶及執行相關程序，非訂定辦法之機關），此為訂定機關主體混淆之★極高頻陷阱。", "D": "合併變更組織時營業保證金權利隨之移轉，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第26條", "id": 20}, {"chapter": "A2", "year": 108, "qnum": 2, "stem": "依不動產經紀業管理條例規定，經紀業應依中央主管機關規定繳存營業保證金。下列關於營業保證金之說明，何者錯誤？", "options": ["獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因其債務債權關係而為扣押", "得因經紀業或經紀人員之債務債權關係而抵銷", "經紀業合併時，所繳存營業保證金之權利，應隨之移轉", "經紀業申請解散時，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"], "answer": "B", "explains": {"A": "營業保證金獨立於經紀業及經紀人員之外，不因債務債權關係而扣押，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。營業保證金「不因」（而非「得因」）經紀業或經紀人員之債務債權關係而抵銷，方向相反，此為與106年-10題相同類型之高頻陷阱。", "C": "合併時營業保證金權利隨之移轉，敘述正確，非本題答案。", "D": "申請解散者得自核准註銷營業滿1年後2年內請求退還，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第26條", "id": 21}, {"chapter": "A2", "year": 108, "qnum": 20, "stem": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["營業處所經紀營業員數每逾10名時，應增設經紀人1人", "經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人", "經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同", "非中華民國國民，不得充任中華民國不動產經紀人"], "answer": "B", "explains": {"A": "經紀營業員人數每逾「20名」（而非10名）應增設經紀人1人，數字錯誤。", "B": "正確。營業處所至少應置經紀人1人；非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人，敘述符合法定架構。", "C": "應為到職之日起「15日內」（而非7日內）造具名冊報備，數字錯誤。", "D": "外國人得依我國法律應考並充任經紀人員（經一定許可程序），並非絕對禁止，本選項過於絕對。"}, "ref": "不動產經紀業管理條例第11條", "id": 22}, {"chapter": "A2", "year": 111, "qnum": 1, "stem": "依不動產經紀業管理條例規定，不動產經紀業得請求退還原繳存之營業保證金之情形，不包含那一項？", "options": ["公司組織申請解散者", "商號組織申請歇業者", "營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者", "退出所在地或鄰近直轄市或縣（市）仲介經紀業同業公會"], "answer": "D", "explains": {"A": "公司組織申請解散者，為法定得退還營業保證金之情形，非本題答案。", "B": "商號組織申請歇業者，為法定得退還營業保證金之情形，非本題答案。", "C": "營業項目變更登記後已無仲介代銷業務而組織仍存續者，為法定得退還營業保證金之情形，非本題答案。", "D": "正確答案。「退出同業公會」非法定得請求退還營業保證金之事由（退出公會涉及會員資格問題，非組織解散或營業項目變更之實質退場事由，且退出公會本身可能構成違規，不應成為請求退還保證金之正當理由），此為虛構事由之陷阱。"}, "ref": "不動產經紀業管理條例施行細則第13條之1", "id": 23}, {"chapter": "A2", "year": 112, "qnum": 6, "stem": "不動產經紀業管理條例之「用辭定義」，下列何者正確？", "options": ["不動產︰指土地、土地定著物或房屋及其可移轉之權利", "成屋︰指領有建造執照之建築物", "經紀人員︰經紀營業員之職務為執行仲介或代銷業務", "營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"], "answer": "A", "explains": {"A": "正確。不動產之法定定義為：土地、土地定著物或房屋及其可移轉之權利，定義完整正確。", "B": "成屋應為領有「使用執照」（而非「建造執照」）之建築物，執照類型錯誤。", "C": "「執行仲介或代銷業務」為「經紀人」之職務，「經紀營業員」之職務為「協助」經紀人執行業務，兩者職務範圍描述互換，此為經紀人與經紀營業員角色混淆之陷阱。", "D": "營業處所應為「非常態」之固定場所（而非「常態之非固定場所」），用語邏輯顛倒，此為文字排列混淆之陷阱。"}, "ref": "不動產經紀業管理條例第4條", "id": 24}, {"chapter": "A2", "year": 114, "qnum": 13, "stem": "依據不動產經紀業管理條例，關於經營仲介業務者之規定，下列敘述何者正確？", "options": ["向主管機關申請許可，經審查後即得經營仲介業務", "以商號之型態辦理登記後，即得開始經營仲介業務", "所僱用的經紀人員可以用個人名義執行不動產買賣", "經營國外不動產仲介業務，應以公司型態辦理登記"], "answer": "D", "explains": {"A": "經審查許可後尚須完成公司/商業登記及加入同業公會，並於6個月內開始營業，並非審查後即得逕行經營，程序不完整。", "B": "以商號型態辦理登記後，尚須加入同業公會及繳存營業保證金等程序，並非登記後即可開始經營，程序不完整。", "C": "經紀人員應「專任」於經紀業並以「經紀業名義」執行業務（受經紀業指派簽章等），不得以個人名義執行不動產買賣仲介業務，此為經紀人員執業義務之核心限制。", "D": "正確。經營國外不動產仲介業務者，應以「公司型態」組織依法辦理登記（商號不可），此為國外不動產業務之特別限制規定。"}, "ref": "不動產經紀業管理條例第7條、第16條", "id": 25}, {"chapter": "A2", "year": 114, "qnum": 20, "stem": "依不動產經紀業管理條例之規定，經紀業應完成相關程序後方得營業。下列敘述，何者錯誤？", "options": ["經紀業經主管機關之許可，並辦妥公司登記或商業登記", "加入戶籍所在地之同業公會", "依中央主管機關規定繳存營業保證金", "應於6個月內開始營業；逾期未開始營業者，由主管機關廢止其許可"], "answer": "B", "explains": {"A": "經主管機關許可並辦妥公司或商業登記，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。應加入「經紀業登記所在地」（而非「戶籍所在地」）之同業公會，經紀業之公會歸屬以其「登記地」為準，非負責人個人之戶籍地，此為主體錯置之★陷阱。", "C": "依中央主管機關規定繳存營業保證金，敘述正確，非本題答案。", "D": "應於6個月內開始營業，逾期未開始營業由主管機關廢止其許可，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第7條", "id": 26}, {"chapter": "A3", "year": 99, "qnum": 3, "stem": "不動產經紀業分設營業處所時，在向不動產經紀業所在地直轄市或縣（市）主管機關申請備查時，無需記明下列何種事項？", "options": ["公司負責人、董事、監察人、經理人或商號負責人、經理人", "營業處所名稱、所在地及設立日期", "經紀業名稱、所在地、公司統一編號、營利事業登記證", "該營業處所僱用之經紀人員姓名、身分證明文件字號及證書字號"], "answer": "A", "explains": {"A": "正確答案。分設營業處所備查之記明事項聚焦於「該分設營業處所」本身之資訊（名稱、所在地、僱用經紀人員等），「公司負責人、董事、監察人、經理人」等經紀業本體之人事資訊，已於經紀業原始設立許可申請時記載完成，分設營業處所備查無須重複記明此類經紀業本體人事事項，此為備查事項範圍界定之陷阱。", "B": "營業處所名稱所在地及設立日期為應記明事項，非本題答案。", "C": "經紀業名稱所在地統一編號及營利事業登記證為應記明事項，非本題答案。", "D": "該營業處所僱用經紀人員姓名身分證明字號及證書字號為應記明事項，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則", "id": 27}, {"chapter": "A3", "year": 99, "qnum": 7, "stem": "下列有關不動產經紀營業員及不動產經紀營業員訓練之敘述，何者錯誤？", "options": ["未領有不動產經紀營業員證明者不能充任不動產經紀營業員", "不動產經紀營業員經訓練後取得之證明，於辦理登錄後，其有效期間為3年", "不動產經紀營業員訓練證明有效期限期滿後，可檢附完成訓練20個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄", "不動產經紀營業員訓練不得少於30個小時"], "answer": "B", "explains": {"A": "未領有經紀營業員證明者不能充任經紀營業員，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。經紀營業員證明有效期間應為「4年」，而非「3年」，數字錯誤，此為與經紀人證書效期（同為4年）易混淆之★高頻陷阱。", "C": "效期屆滿後檢附完成訓練20小時以上證明重新辦理登錄，敘述正確，非本題答案。", "D": "經紀營業員訓練不得少於30個小時，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第13條", "id": 28}, {"chapter": "A3", "year": 99, "qnum": 33, "stem": "外國人某甲居住於臺北市，如欲在臺北縣執行仲介或代銷業務，請問該外國人如具有請領不動產經紀人證書之資格，則應向下列那一機關申請？", "options": ["外交部", "外事警察局", "臺北市政府地政處", "臺北縣政府"], "answer": "C", "explains": {"A": "外交部非經紀人證書核發機關。", "B": "外事警察局非經紀人證書核發機關。", "C": "正確。經紀人證書應向申請人「戶籍所在地」（本題外國人居住於臺北市，比照戶籍地認定原則）之直轄市或縣（市）政府申請，而非依「執業地」（臺北縣）申請，此為請領機關認定基準之核心觀念：以戶籍地（或居住地）而非執業地為準。", "D": "臺北縣政府為執業地機關，非請領證書之申請機關（申請機關應以戶籍地/居住地為準）。"}, "ref": "不動產經紀業管理條例第14條", "id": 29}, {"chapter": "A3", "year": 100, "qnum": 19, "stem": "依不動產經紀業管理條例規定，下列何者得以申請許可經營不動產經紀業？", "options": ["犯侵占罪而受一年以上有期徒刑宣告確定之緩刑者", "受廢止經紀人員證明或證書之處分未滿一年者", "滿十八歲高中畢業尚未結婚者", "滿二十歲而受法院監護宣告者"], "answer": "A", "explains": {"A": "正確。犯特定罪（如侵占罪）受有期徒刑1年以上宣告確定，「受緩刑宣告者」，法律明文排除於禁止事由之外（緩刑期間視為未受實際執行，得申請經營經紀業），此為緩刑特別排除規定之★陷阱：一般情形受此類罪刑宣告禁止申請，但受緩刑宣告者例外允許。", "B": "受廢止經紀人員證明或證書處分「未滿5年」者，不得申請經營經紀業，本題「未滿一年」自然亦在禁止期間內，不得申請。", "C": "滿18歲高中畢業尚未結婚，本身不構成禁止事由，惟本題選項需綜合考量行為能力等其他要件，此選項本身描述未直接指向禁止事由，但依官方標準答案，本題正確答案為A，本選項非本題答案。", "D": "受法院監護宣告者，屬「無行為能力人」，依法不得申請經營經紀業，本選項不符。"}, "ref": "不動產經紀業管理條例第6條", "id": 30}, {"chapter": "A3", "year": 100, "qnum": 24, "stem": "下列何者不屬不動產經紀人證書滅失時，申請補發應檢附之文件？", "options": ["申請書", "身分證明文件影本", "一年以上營業員經驗證明文件及其影本", "不動產經紀人考試及格證書及其影本"], "answer": "C", "explains": {"A": "申請書為補發應檢附文件，非本題答案。", "B": "身分證明文件影本為補發應檢附文件，非本題答案。", "C": "正確答案。「1年以上營業員經驗證明文件」係「首次請領」經紀人證書時始須檢附之資格證明文件，證書「滅失後申請補發」係已取得過證書之人員重新取得證書之程序，無須再次證明其資格取得要件（資格於首次請領時已審查完畢），此為首次請領與補發程序要件不同之陷阱。", "D": "考試及格證書及其影本為補發應檢附文件，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則", "id": 31}, {"chapter": "A3", "year": 100, "qnum": 25, "stem": "下列關於充任不動產經紀營業員規定之敘述，何者正確？", "options": ["欲取得不動產經紀營業員證明者，其經紀營業員專業訓練合格時數，不得少於二十個小時", "營業員證明有效期限屆滿後欲取得營業員資格，應檢附三十個小時以上訓練證明辦理登錄", "廢止營業員證明滿三年者，即可申請登錄請領營業員證明", "經不動產經紀人考試及格者，即可充任不動產經紀營業員"], "answer": "B", "explains": {"A": "初次訓練時數應為「不得少於30個小時」（而非20個小時，20小時是效期屆滿後重新登錄之時數要求），數字錯誤。", "B": "正確。營業員證明有效期限屆滿後，應檢附完成訓練「20個小時」以上之證明文件辦理重新登錄——⚠️惟需注意：本題選項文字描述為「三十個小時」，與官方標準答案內容存在文字差異，建議對照官方詳解確認；一般原則為「初次訓練不得少於30小時、效期屆滿重新登錄需20小時以上」，本題官方答案標示為B，宜留意題目情境（可能涉及「證明因故廢止後重新請領」而非單純「效期屆滿重新登錄」之不同情形，兩者時數要求可能不同）。", "C": "廢止營業員證明後之重新登錄，非僅以「滿3年」為要件即可申請，仍須符合相關訓練時數等要件，本選項條件不完整。", "D": "經紀人考試及格者「得」（經登錄後）充任經紀營業員，並非考試及格「即可」充任（仍須完成登錄程序），程序描述不完整。"}, "ref": "不動產經紀業管理條例第13條；⚠️本題選項B之時數描述建議對照官方詳解核實", "id": 32}, {"chapter": "A3", "year": 101, "qnum": 35, "stem": "依不動產經紀業管理條例規定，經不動產經紀人考試及格者，應具備多久經紀營業員經驗，始得請領經紀人證書？", "options": ["一年以上", "一年半以上", "二年以上", "三年以上"], "answer": "A", "explains": {"A": "正確。經考試及格者，應具備「1年以上」經紀營業員經驗，始得請領經紀人證書，此為經紀人證書請領之核心要件，全科高頻數字。", "B": "數字錯誤，非一年半。", "C": "數字錯誤，非二年。", "D": "數字錯誤，非三年。"}, "ref": "不動產經紀業管理條例第14條", "id": 33}, {"chapter": "A3", "year": 102, "qnum": 3, "stem": "請領不動產經紀人證書，應向何機關申請？", "options": ["行政院", "內政部", "經紀業所在地直轄市或縣（市）政府", "戶籍所在地直轄市或縣（市）政府"], "answer": "D", "explains": {"A": "行政院非經紀人證書核發機關。", "B": "內政部為中央主管機關，惟證書核發機關為地方政府，非內政部直接核發。", "C": "應以「戶籍所在地」（而非「經紀業所在地」）為準，主體錯誤。", "D": "正確。請領經紀人證書應向「戶籍所在地」直轄市或縣（市）政府申請，此為請領機關認定之核心基準（以個人戶籍地為準，非執業地或經紀業所在地）。"}, "ref": "不動產經紀業管理條例第14條", "id": 34}, {"chapter": "A3", "year": 104, "qnum": 2, "stem": "依不動產經紀業管理條例規定，領有經紀營業員證明者，於其證明有效期限屆滿時，應檢附完成訓練至少多少小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄？", "options": ["20小時", "30小時", "40小時", "60小時"], "answer": "A", "explains": {"A": "正確。經紀營業員證明效期屆滿時，應檢附完成訓練至少「20小時」以上之證明文件重新辦理登錄，須與「初次訓練不得少於30小時」（經紀營業員）及「經紀人換證需30小時」區辨，此為★高頻數字。", "B": "數字錯誤，30小時為初次訓練或經紀人換證之時數，非重新登錄之時數。", "C": "數字錯誤，非40小時。", "D": "數字錯誤，非60小時。"}, "ref": "不動產經紀業管理條例第13條", "id": 35}, {"chapter": "A3", "year": 104, "qnum": 21, "stem": "甲之戶籍在嘉義縣，現居住於高雄市並任職於高雄市某經紀業。請問甲請領不動產經紀人證書時，應向何機關申請？", "options": ["考選部", "內政部", "高雄市政府", "嘉義縣政府"], "answer": "D", "explains": {"A": "考選部僅辦理考試業務，非證書核發機關。", "B": "內政部為中央主管機關，非證書直接核發機關。", "C": "高雄市政府為甲之「居住地／任職地」，非「戶籍地」，主體不符。", "D": "正確。請領經紀人證書應向「戶籍所在地」（本題為嘉義縣）之直轄市或縣（市）政府申請，不因居住地或任職地不同而改變，此為戶籍地為準原則之核心考點。"}, "ref": "不動產經紀業管理條例第14條", "id": 36}, {"chapter": "A3", "year": 104, "qnum": 22, "stem": "不動產經紀人依規定辦理換發證書時，應於何期限內申請？", "options": ["證書有效期限屆滿前六個月內", "證書有效期限屆滿前三個月內", "證書有效期限屆滿後六個月內", "證書有效期限屆滿後三個月內"], "answer": "A", "explains": {"A": "正確。經紀人辦理換發證書，應於證書有效期限屆滿「前6個月內」申請，此為換證申請期限之核心數字。", "B": "數字錯誤，非屆滿前三個月內。", "C": "應為屆滿「前」而非屆滿「後」申請，時點方向錯誤。", "D": "應為屆滿「前」而非屆滿「後」申請，時點方向錯誤，且數字亦錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 37}, {"chapter": "A3", "year": 104, "qnum": 25, "stem": "依不動產經紀業管理條例之規定，下列有關外國人充任我國不動產經紀人員之敘述，何者錯誤？", "options": ["外國人得依我國法律應不動產經紀人考試", "外國人得依我國法律參加不動產經紀營業員訓練", "外國人應經行政院許可，始得受僱於經紀業為經紀人員", "有關業務上所為之文件、圖說，應以中華民國文字為之"], "answer": "C", "explains": {"A": "外國人得依我國法律應不動產經紀人考試，敘述正確，非本題答案。", "B": "外國人得依我國法律參加經紀營業員訓練，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。外國人應經「內政部」（而非「行政院」）許可，始得受僱於經紀業為經紀人員，許可機關主體錯誤，此為機關層級混淆之★陷阱（內政部為中央主管機關，非行政院直接許可）。", "D": "業務上文件圖說應以中華民國文字為之，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第15條", "id": 38}, {"chapter": "A3", "year": 105, "qnum": 10, "stem": "關於不動產經紀業及經紀人員的敘述，下列何者正確？", "options": ["經營國外不動產仲介業務者，以依法辦理登記之公司或商號為限", "外國人依中華民國法律不得參加不動產經紀人考試或參加營業員訓練", "經紀業取得主管機關許可，依法辦理公司或商業登記，即可開始營業", "經紀業應於經紀人到職之日起15日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同"], "answer": "D", "explains": {"A": "經營國外不動產仲介業務者以「公司型態」為限，不含「商號」，本選項擴大範圍錯誤。", "B": "外國人「得」依我國法律應考經紀人考試及參加營業員訓練，並非不得參加，方向相反。", "C": "辦妥登記後尚須加入同業公會及繳存營業保證金，並非登記後即可開始營業，程序不完整。", "D": "正確。經紀業應於經紀人到職之日起「15日內」，造具名冊報請所在地主管機關層報中央主管機關備查，異動時亦同，此為全科最高頻數字之一，反覆重複命題。"}, "ref": "不動產經紀業管理條例第10條", "id": 39}, {"chapter": "A3", "year": 107, "qnum": 22, "stem": "依不動產經紀業管理條例之規定，下列何種情形不得申請經營經紀業？", "options": ["受破產之宣告尚未復權者", "受感訓處分之裁定確定，執行完畢後已滿三年者", "犯詐欺、背信、侵占罪，經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者", "受廢止經紀人員證書或證明處分已滿五年者"], "answer": "A", "explains": {"A": "正確。受破產宣告「尚未復權」者，屬第6條明文禁止事由，不得申請經營經紀業。", "B": "受感訓處分執行完畢後「已滿3年」者，已超過禁止期間（未滿3年才禁止），得申請經營經紀業，非本題答案。", "C": "犯特定罪執行完畢或赦免後「已滿3年」者，已超過禁止期間，得申請經營經紀業，非本題答案。", "D": "受廢止經紀人員證書處分「已滿5年」者，已超過禁止期間，得申請經營經紀業，非本題答案。"}, "ref": "不動產經紀業管理條例第6條", "id": 40}, {"chapter": "A3", "year": 107, "qnum": 24, "stem": "下列有關不動產經紀人辦理換發證書之規定敘述，何者正確？", "options": ["換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年", "應於證書有效期限屆滿前三個月內申請", "應完成專業訓練至少二十個小時", "應向執業所在地之直轄市或縣（市）政府申請"], "answer": "A", "explains": {"A": "正確。換發之經紀人證書，其有效期限自原證書有效期限屆滿之「次日起算4年」，此為換證後新效期之精確起算方式。", "B": "應於屆滿「前6個月內」（而非3個月內）申請，數字錯誤。", "C": "應完成專業訓練至少「30個小時」（而非20個小時，20小時是經紀營業員之時數要求），時數混淆★陷阱。", "D": "應向「戶籍所在地」（而非執業所在地）直轄市或縣（市）政府申請，主體錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 41}, {"chapter": "A3", "year": 107, "qnum": 25, "stem": "首次請領不動產經紀人證書時，不須檢附下列何種文件？", "options": ["身分證明文件影本", "完成專業訓練三十個小時以上之證明文件", "不動產經紀人考試及格證書及其影本", "一年以上經紀營業員經驗證明文件及其影本"], "answer": "B", "explains": {"A": "身分證明文件影本為首次請領應檢附文件，非本題答案。", "B": "正確答案。「完成專業訓練30個小時以上之證明文件」係經紀人「換證」時應檢附之文件（換證須於4年內完成30小時訓練），並非「首次請領」證書時之要件（首次請領以「考試及格＋1年以上經紀營業員經驗」為要件，尚無須額外之訓練時數證明），此為首次請領與換證要件混淆之★陷阱。", "C": "考試及格證書及其影本為首次請領應檢附文件，非本題答案。", "D": "1年以上經紀營業員經驗證明文件為首次請領應檢附文件，非本題答案。"}, "ref": "不動產經紀業管理條例第14條", "id": 42}, {"chapter": "A3", "year": 110, "qnum": 9, "stem": "依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？", "options": ["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員", "領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員", "取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年", "不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"], "answer": "D", "explains": {"A": "訓練合格後尚須完成「登錄」程序，並非訓練合格即得逕行充任，程序不完整。", "B": "經紀人考試及格者，尚須完成「登錄」程序，並非考試及格即得逕行充任經紀營業員，程序不完整。", "C": "取得資格之初次訓練不得少於「30個小時」（而非20個小時），數字錯誤（20小時是效期屆滿後重新登錄之時數要求）。", "D": "正確。經紀營業員證明因受破產宣告尚未復權等禁止事由而被撤銷者，於該原因消滅後（如復權），得依法重新請領證明，此為禁止事由消滅後資格回復之核心規定。"}, "ref": "不動產經紀業管理條例第6條、第13條", "id": 43}, {"chapter": "A3", "year": 110, "qnum": 11, "stem": "有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？", "options": ["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書", "不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之", "不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年", "不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"], "answer": "B", "explains": {"A": "考試及格後，尚須具備「1年以上經紀營業員經驗」，始得請領證書，並非考試及格即可請領，要件不完整。", "B": "正確。經紀人辦理換發證書，應於證書有效期限屆滿「前6個月內」申辦，此為換證申請期限之核心數字。", "C": "換發證書之效期應自原證書效期屆滿之「次日」（而非「當日」）起算4年，時點描述精確度不足。", "D": "證書滅失申請補發，應向「戶籍所在地直轄市或縣（市）政府」（而非「中央機關」）申請，機關主體錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 44}, {"chapter": "A3", "year": 111, "qnum": 2, "stem": "不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？", "options": ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "經紀人證書有效期限為三年", "經紀營業員訓練不得少於三十個小時", "未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"], "answer": "C", "explains": {"A": "應具備「1年以上」（而非半年以上）經紀營業員經驗，數字錯誤。", "B": "經紀人證書有效期限應為「4年」（而非三年），數字錯誤。", "C": "正確。經紀營業員（初次）訓練不得少於「30個小時」，此為法定訓練時數下限。", "D": "經紀業「不得」僱用未具備經紀人員資格者從事仲介或代銷業務，此為強制禁止規定，不因簽訂專任約而有例外，本選項虛構例外情形，屬★陷阱。"}, "ref": "不動產經紀業管理條例第13條、第14條、第17條", "id": 45}, {"chapter": "A3", "year": 112, "qnum": 2, "stem": "有關外國人任職不動產經紀業之規定，下列何者正確？", "options": ["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試", "經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可", "經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"], "answer": "C", "explains": {"A": "應考不動產經紀人考試無須先經內政部許可（考試資格與受僱許可為不同程序），本選項增加不必要之前置程序。", "B": "應為經「內政部」許可，惟大陸地區人民之許可機關應為「行政院大陸委員會」授權相關機關或依港澳關係條例/兩岸關係條例規定辦理，本選項機關描述雖方向大致正確但精確用語與官方標準答案C相比，本題正確答案為C。", "C": "正確。經內政部或其認可之機構團體舉辦訓練合格或考試及格，並向內政部指定之機構團體登錄及領有經紀營業員證明者，得充任經紀營業員，敘述完整符合法定程序。", "D": "業務上所為之文件圖說「應」以中華民國文字為之（無論本國人或外國人皆同此要求），並非不受限制，本選項方向相反。"}, "ref": "不動產經紀業管理條例第13條、第15條", "id": 46}, {"chapter": "A3", "year": 114, "qnum": 19, "stem": "依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？", "options": ["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "經紀營業員訓練不得少於20個小時，其證明有效期限為4年", "期滿時，經紀營業員應檢附完成訓練30個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄", "經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"], "answer": "A", "explains": {"A": "正確。經紀人考試及格者，亦得選擇向中央主管機關指定之機構團體登錄，並領有經紀營業員證明後充任經紀營業員（此為經紀人資格者兼任/轉任經紀營業員之管道之一），敘述符合法定規定。", "B": "經紀營業員初次訓練不得少於「30個小時」（而非20個小時），數字錯誤。", "C": "效期屆滿重新辦理登錄應檢附完成訓練「20個小時」以上（而非30個小時）之證明文件，數字錯誤（30小時是初次訓練或經紀人換證之時數）。", "D": "經紀營業員經驗之認定應以「經紀業出具之在職證明」或「登錄紀錄」等正式文件為準，非以「所得扣繳資料」證明，此為證明方式錯誤之陷阱（扣繳資料僅能證明任職及所得事實，無法直接證明從事「仲介或代銷業務」之具體內容）。"}, "ref": "不動產經紀業管理條例第13條、第14條", "id": 47}];
const STORAGE_KEY = "brokerlaw_a123_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
