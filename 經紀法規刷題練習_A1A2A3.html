<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65;padding-bottom:84px}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg);}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;margin:0;color:var(--pri);flex:1;min-width:0}
.th{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;flex:none}
.sub{font-size:.76rem;color:var(--sub);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.76rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--sub)}
.stat b{color:var(--pri)}
.controls{max-width:760px;margin:12px auto 0;padding:0 16px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:.82rem;cursor:pointer;font-family:inherit}
.fbtn.active{background:var(--pri);color:var(--on);border-color:var(--pri)}
.fbtn.danger{border-color:var(--bad);color:var(--bad)}
.fbtn.danger.active{background:var(--bad);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);padding:4px 11px;border-radius:14px;font-size:.75rem;cursor:pointer}
.chip.active{background:var(--pri-soft);color:var(--pri);border-color:var(--pri);font-weight:700}
.ords,.exs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:6px 0}
.ords button,.exs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:.78rem;cursor:pointer}
.ords button.on,.exs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.ords .sh{margin-left:auto}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}
main{max-width:760px;margin:0 auto;padding:6px 16px 40px}
.yr-header,.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.92rem;color:var(--pri);padding:10px 0 6px;border-bottom:2px solid var(--pri);margin:16px 0 10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.qcard.answered-ok{border-left:4px solid var(--ok)}
.qcard.answered-ng{border-left:4px solid var(--bad)}
.qmeta{font-size:.72rem;color:var(--sub);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.wrong{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.stem{font-family:"Noto Serif TC",serif;font-size:.98rem;font-weight:500;margin:4px 0 10px;line-height:1.75}
.res{display:none}
.done .res{display:block;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.86rem;margin:0 0 8px;background:var(--bad-soft);color:var(--bad)}
.done .res.ok{background:var(--ok-soft);color:var(--ok)}
.hn{display:none;font-size:.72rem;color:var(--sub);margin:-4px 0 8px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.55}
.opt:hover{border-color:var(--pri)}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.76rem}
.ob{flex:1;min-width:0}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.disabled{cursor:default}
.bg{display:none;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.opt.correct .bg.a{display:inline-block;background:var(--ok)}
.opt.chosen-wrong .bg.p{display:inline-block;background:var(--bad)}
.nt{display:none;font-size:.8rem;line-height:1.6;margin-top:5px;border-top:1px dashed var(--line);padding-top:4px;color:var(--ink);font-weight:400}
.arr{display:none;float:right;margin-left:6px;color:var(--sub);transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.explain-box{display:none;margin-top:10px;padding:10px 12px;background:var(--pri-soft);border:1px solid var(--line);border-radius:8px;font-size:.82rem}
body[data-ex="B"] .done .explain-box{display:block}
.ei{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.6}
.ei:last-child{border-bottom:none}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;color:#fff}
.el.ok{background:var(--ok)}.el.no{background:var(--sub)}.el.ng{background:var(--bad)}
.ref{margin-top:8px;font-size:.76rem;color:var(--sub)}
.errtag-row{margin-top:10px;display:none;gap:6px;flex-wrap:wrap}
.errtag-row.show{display:flex}
.etag{font-size:.72rem;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--sub)}
.etag.on-A{background:var(--bad);color:#fff;border-color:var(--bad)}
.etag.on-B{background:var(--acc);color:#fff;border-color:var(--acc)}
.etag.on-C{background:var(--pri);color:var(--on);border-color:var(--pri)}
footer{text-align:center;font-size:.7rem;color:var(--sub);padding:20px 10px 10px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<script>
const QUESTIONS = [{"chapter": "A1", "year": 100, "qnum": 18, "stem": "經紀業應於經紀人到職之日起最長幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "B", "explains": {"A": "數字錯誤，非十日。", "B": "正確。經紀業應於經紀人到職之日起「15日內」，造具名冊報請所在地主管機關層報中央主管機關備查，此為全科最高頻數字之一。", "C": "數字錯誤，非二十日。", "D": "數字錯誤，非三十日。"}, "ref": "不動產經紀業管理條例第12條", "id": 1}, {"chapter": "A1", "year": 106, "qnum": 7, "stem": "依不動產經紀業管理條例規定，經紀業應於經紀人到職之日起幾日內，造具名冊報請所在地主管機關層報中央主管機關備查？", "options": ["5日", "10日", "15日", "20日"], "answer": "C", "explains": {"A": "數字錯誤，非5日。", "B": "數字錯誤，非10日。", "C": "正確。經紀人到職應於「15日內」造具名冊報請所在地主管機關層報中央主管機關備查，此為全科最高頻數字之一，反覆重複命題。", "D": "數字錯誤，非20日。"}, "ref": "不動產經紀業管理條例第12條", "id": 2}, {"chapter": "A1", "year": 106, "qnum": 9, "stem": "不動產經紀業管理條例所稱主管機關，下列敘述何者錯誤？", "options": ["內政部營建署", "內政部", "直轄市政府地政處", "縣（市）政府"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。中央主管機關為「內政部」（本身），並非「內政部營建署」（營建署為內政部所屬機關之一，非法定主管機關本身；⚠️ 營建署已於 112.9.20 改制為內政部國土管理署），此為機關層級混淆之★陷阱。", "B": "內政部為中央主管機關，敘述正確，非本題答案。", "C": "直轄市政府地政處為地方主管機關，敘述正確，非本題答案。", "D": "縣（市）政府為地方主管機關，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第3條", "id": 3}, {"chapter": "A1", "year": 107, "qnum": 3, "stem": "甲於 A 市經營不動產經紀業，數年後欲遷出所在地 A 市到 B 縣，應於遷出後多久時間內，以書面向遷入之 B 縣主管機關申請遷入備查，並向原所屬之同業公會報備，及加入 B 縣同業公會，該遷入之同業公會並應轉知其全國聯合會？", "options": ["三十日", "四十五日", "二個月", "三個月"], "answer": "A", "explains": {"A": "正確。經紀業遷址後，應於遷出後「30日內」以書面向遷入地主管機關申請遷入備查，並向原同業公會報備及加入遷入地同業公會，此為經紀業遷址程序之核心期限。", "B": "數字錯誤，非四十五日。", "C": "數字錯誤，非二個月。", "D": "數字錯誤，非三個月。"}, "ref": "不動產經紀業管理條例施行細則", "id": 4}, {"chapter": "A1", "year": 109, "qnum": 2, "stem": "不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？", "options": ["都市發展、城鄉發展", "產業發展", "地政", "財政"], "answer": "C", "explains": {"A": "都市發展、城鄉發展局處非本條例主管機關轄屬，此為與都市計畫相關機關混淆之陷阱。", "B": "產業發展局處非本條例主管機關轄屬。", "C": "正確。不動產經紀業管理條例所稱直轄市主管機關為直轄市政府「地政」處（局），因不動產經紀業務性質與地政業務密切相關。", "D": "財政局處非本條例主管機關轄屬。"}, "ref": "不動產經紀業管理條例第3條", "id": 5}, {"chapter": "A1", "year": 112, "qnum": 7, "stem": "依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？", "options": ["報請所在地主管機關核定", "報請所在地主管機關備查", "報請所在地主管機關層轉中央主管機關核定", "報請所在地主管機關層轉中央主管機關備查"], "answer": "D", "explains": {"A": "應為「層轉中央主管機關」並「備查」，非僅所在地主管機關「核定」，機關層級及處理方式皆不符。", "B": "應「層轉中央主管機關」，非僅所在地主管機關備查即可，程序層級不足。", "C": "應為「備查」，非「核定」（核定為准駁性質之審查，備查僅為知悉性質之陳報，兩者審查強度不同），性質錯誤。", "D": "正確。同業公會關於會員入會、停權、退會情形，應報請所在地主管機關「層轉中央主管機關備查」，兩層機關皆須經過，且性質為「備查」（非核定）。"}, "ref": "不動產經紀業管理條例施行細則", "id": 6}, {"chapter": "A2", "year": 99, "qnum": 1, "stem": "不動產經紀業經主管機關許可後，應於 6 個月之內依「不動產經紀業管理條例」第 7 條第 1 項及第 3 項規定完成下列 3 項工作中之那幾項？①辦妥公司登記或商業登記 ②繳存營業保證金 ③加入登記所在地之同業公會", "options": ["只須完成第①項", "須完成第①與第②項", "須完成第①與第③項", "須完成第①、第②與第③項"], "answer": "D", "explains": {"A": "僅完成①項不足，須完成全部三項。", "B": "漏未③加入同業公會，不完整。", "C": "漏未②繳存營業保證金，不完整。", "D": "正確。經紀業經許可後6個月內，應完成①辦妥公司或商業登記、②繳存營業保證金、③加入登記所在地同業公會，三項工作缺一不可，始得開始營業。"}, "ref": "不動產經紀業管理條例第7條", "id": 7}, {"chapter": "A2", "year": 99, "qnum": 4, "stem": "不動產經紀業分設之營業處所為「不動產經紀業管理條例」第 4 條第 10 款所稱非常態之固定場所者，其向所在地直轄市或縣（市）主管機關申請備查時所應記載的第 2 款應記明事項應改以下列何者代之？", "options": ["以該營業處所代理銷售之不動產名稱及所在地代之", "以該營業處所代理銷售名稱及設立期間代之", "以該營業處所代理銷售之不動產名稱、所在地及設立期間代之", "以該營業處所之設立目的或代理銷售之不動產名稱、所在地、銷售金額及設立期間代之"], "answer": "D", "explains": {"A": "內容不完整，漏未設立目的、銷售金額及設立期間等要素。", "B": "內容不完整，漏未所在地、銷售金額等要素。", "C": "內容不完整，漏未設立目的及銷售金額。", "D": "正確。非常態固定場所（如代銷接待中心）申請備查時，第2款應記明事項應改以「該營業處所之設立目的或代理銷售之不動產名稱、所在地、銷售金額及設立期間」代之，此為因應非常態場所特性之替代記載內容，較一般常態營業處所之記載事項更詳盡（含銷售金額及存續期間）。"}, "ref": "不動產經紀業管理條例施行細則第8條第2項（非常態之固定場所，第1項第2款應記明事項改以設立目的或代理銷售之不動產名稱、所在地、銷售總金額及設立期間代之）；非常態固定場所之定義見條例第4條第10款", "id": 8}, {"chapter": "A2", "year": 99, "qnum": 5, "stem": "直轄市或縣（市）不動產經紀業主管機關無需設置下列那一簿冊，並永久保存？", "options": ["不動產經紀業管理登記簿", "不動產經紀業在其所轄區域外設立之營業處所管理登記簿", "不動產經紀人名簿", "不動產經紀營業員名簿"], "answer": "B", "explains": {"A": "經紀業管理登記簿為主管機關應永久保存之法定簿冊，非本題答案。", "B": "正確答案。主管機關無需設置「經紀業在其『所轄區域外』設立之營業處所管理登記簿」（管轄權限僅及於本轄區域內之經紀業及營業處所，非其轄區外設立者，此涉及行政管轄權地域限制之基本原則），此為虛構簿冊之陷阱。", "C": "經紀人名簿為主管機關應永久保存之法定簿冊，非本題答案。", "D": "經紀營業員名簿為主管機關應永久保存之法定簿冊，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則", "id": 9}, {"chapter": "A2", "year": 99, "qnum": 6, "stem": "不動產經紀業設立一非常態營業處所時，若其所銷售總金額達新臺幣 10 億元以上，且該營業處所擁有 25 位經紀營業員時，該非常態營業處所至少應置專業經紀人幾人？", "options": ["1人", "2人", "3人", "4人"], "answer": "B", "explains": {"A": "依銷售金額達6億元以上須置專業經紀人1人之基礎規定，再加計經紀營業員人數逾20名應增設經紀人1人之規定（25位營業員已逾20名門檻），兩項規定合計，至少應置2人，本選項僅計入基礎1人，未計入營業員人數增設規定，數量不足。", "B": "正確。非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人（基礎規定）；又經紀營業員人數每逾20名，應增設經紀人1人（本題25位營業員已逾20名門檻，應增設1人），兩項規定合計，至少應置專業經紀人「2人」。", "C": "不是3人。經紀業條例第11條第2項是「營業處所經紀營業員數『每逾二十名』時，應增設經紀人一人」，本題25名營業員只跨過一次二十名門檻，增設1人；要算到3人，營業員得逾40名。", "D": "不是4人。同上，第11條第2項是每逾二十名增設一人；25名只增設1人，加上第11條第1項但書的專業經紀人1人，合計2人。"}, "ref": "不動產經紀業管理條例第11條", "id": 10}, {"chapter": "A2", "year": 100, "qnum": 13, "stem": "不動產經紀業分設營業處所時，應於設立後最長幾日內，以書面將相關事項向主管機關申請備查？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "D", "explains": {"A": "數字錯誤，非十日。", "B": "數字錯誤，非十五日。", "C": "數字錯誤，非二十日。", "D": "正確。經紀業分設營業處所，應於設立後「30日內」以書面向主管機關申請備查，須與裁撤時之期限（同為30日）及經紀人到職備查期限（15日）區辨。"}, "ref": "不動產經紀業管理條例施行細則", "id": 11}, {"chapter": "A2", "year": 100, "qnum": 14, "stem": "經紀業分設之營業處所裁撤時，最長應於裁撤後幾日內，以書面向經紀業所在地直轄市或縣（市）主管機關申請備查？", "options": ["十日", "二十日", "三十日", "四十日"], "answer": "C", "explains": {"A": "數字錯誤，非十日。", "B": "數字錯誤，非二十日。", "C": "正確。營業處所裁撤時，應於裁撤後「30日內」向經紀業所在地主管機關申請備查，與設立時之30日期限相同，兩者皆為30日，易於記憶。", "D": "數字錯誤，非四十日。"}, "ref": "不動產經紀業管理條例施行細則", "id": 12}, {"chapter": "A2", "year": 101, "qnum": 28, "stem": "下列有關營業保證金之敘述，何者為錯誤？", "options": ["由各直轄市或縣（市）政府統一於指定之金融機構設置營業保證金專戶儲存", "經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉", "基金管理委員會委員，由經紀業擔任者，其人數不得超過委員總數之五分之二", "基金之孳息部分，得運用於健全不動產經紀制度"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。營業保證金應由「中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會」（而非「各直轄市或縣市政府」）統一於指定金融機構設置專戶儲存，管理主體錯誤，此為★陷阱：營業保證金採全國統一管理制度，非各地方政府分別管理。", "B": "合併變更組織時營業保證金權利隨之移轉，敘述正確，非本題答案。", "C": "基金管理委員會委員由經紀業擔任者不得超過委員總數五分之二，敘述正確，非本題答案。", "D": "基金孳息得運用於健全不動產經紀制度，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第8條、第9條", "id": 13}, {"chapter": "A2", "year": 101, "qnum": 37, "stem": "依不動產經紀業管理條例規定，經紀業經主管機關許可，辦妥公司登記，並加入同業公會後，原則上應於幾個月內開始營業？", "options": ["一", "三", "五", "六"], "answer": "D", "explains": {"A": "數字錯誤，非一個月。", "B": "數字錯誤，非三個月。", "C": "數字錯誤，非五個月。", "D": "正確。經紀業經許可辦妥登記並加入同業公會後，原則上應於「6個月內」開始營業，逾期未開業者主管機關廢止許可（得申請展延一次，以3個月為限），此為經紀業開業期限之核心數字。"}, "ref": "不動產經紀業管理條例第7條", "id": 14}, {"chapter": "A2", "year": 102, "qnum": 11, "stem": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人", "營業處所經紀營業員數每逾10名時，應增設經紀人1人", "經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同", "非中華民國國民，不得充任中華民國不動產經紀人"], "answer": "A", "explains": {"A": "正確。營業處所至少應置經紀人1人；非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人（此1人可與一般營業處所之基礎要求併計或視個案認定），敘述基本符合法定架構。", "B": "經紀營業員人數每逾「20名」（而非10名）應增設經紀人1人，數字錯誤。", "C": "應為到職之日起「15日內」（而非7日內）造具名冊報備，數字錯誤。", "D": "外國人「得」依我國法律應考經紀人考試並充任經紀人員（經一定許可程序），並非絕對禁止非國民充任，本選項過於絕對，與法律開放外國人參與之規定不符。"}, "ref": "不動產經紀業管理條例第11條", "id": 15}, {"chapter": "A2", "year": 103, "qnum": 9, "stem": "依不動產經紀業管理條例有關經營經紀業之規定，下列敍述何者錯誤？", "options": ["應向主管機關申請許可後，依法辦理公司或商業登記", "經紀業分設營業處所，應向直轄市或縣（市）政府申請許可", "其經營國外不動產仲介業務者，應以公司型態組織依法辦理登記", "需加入登記所在地之同業公會後方得營業"], "answer": "B", "explains": {"A": "應先申請許可後依法辦理公司或商業登記，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。經紀業分設營業處所，應向直轄市或縣（市）主管機關申請「備查」，而非「申請許可」，性質錯誤（許可為事前准駁審查，備查僅為事後陳報知悉），此為★陷阱：分設營業處所僅須備查，非須另行申請許可。", "C": "經營國外不動產仲介業務者應以公司型態組織辦理登記，敘述正確，非本題答案。", "D": "須加入登記所在地同業公會後方得營業，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第5條（第1項許可與登記、國外業務限公司型態；第3項分設營業處所應向直轄市或縣（市）政府申請「備查」）、第7條第1項（加入同業公會後方得營業）", "id": 16}, {"chapter": "A2", "year": 105, "qnum": 7, "stem": "經紀業應負賠償責任時，受害人於取得對經紀業之執行名義、經仲裁成立或營業保證基金管理委員會之決議支付後，得於該經紀業繳存營業保證金及提供擔保總額內，向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會為如何之請求？", "options": ["預為賠償", "代為賠償", "連帶賠償", "不真正連帶賠償"], "answer": "B", "explains": {"A": "「預為賠償」非法定用語，此為虛構名詞之陷阱。", "B": "正確。受害人取得執行名義等要件後，得向全國聯合會請求「代為賠償」（由營業保證基金代為墊付），全國聯合會非賠償義務之原始主體，僅係「代為」給付，法律用語精確。", "C": "「連帶賠償」是共同債務人各自對全部債務負責之型態，與全國聯合會「代為賠償」之補充性質不同。", "D": "「不真正連帶賠償」非本條例規定之法律用語。"}, "ref": "不動產經紀業管理條例第26條第4項", "id": 17}, {"chapter": "A2", "year": 106, "qnum": 5, "stem": "依不動產經紀業管理條例規定，下列關於條例用辭定義之敘述何者正確？", "options": ["成屋：指領有建造執照，或於實施建築管理前建造完成之建築物", "預售屋：指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "經紀業：指依不動產經紀業管理條例規定從事買賣、互易、租賃之居間或代理業務者", "營業處所：指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所"], "answer": "D", "explains": {"A": "成屋應為領有「使用執照」（而非「建造執照」），或於實施建築管理前建造完成之建築物，執照類型錯誤。", "B": "預售屋應為領有「建造執照」（而非「使用執照」）尚未建造完成之建築物，執照類型錯誤（本選項與成屋定義之執照類型恰好互換，屬典型陷阱）。", "C": "此為「仲介業務」之部分定義描述，「經紀業」之法定定義應為「依本條例規定經營仲介或代銷業務之公司或商號」，主體定義不符（經紀業是組織主體，非業務內容本身）。", "D": "正確。營業處所係指經紀業經營仲介或代銷業務之店面、辦公室或「非常態之固定場所」（如代銷接待中心），定義完整正確。"}, "ref": "不動產經紀業管理條例第4條", "id": 18}, {"chapter": "A2", "year": 106, "qnum": 10, "stem": "下列有關不動產經紀業營業保證金之敘述，何者錯誤？", "options": ["營業保證金獨立於經紀業及經紀人員之外", "除不動產經紀業管理條例另有規定外，得因經紀業或經紀人員之債權、債務關係而為讓與、扣押、抵銷或設定負擔", "營業保證金應隨經紀業之合併、變更組織而移轉", "經紀業申請解散者，得請求退還原繳存之營業保證金"], "answer": "B", "explains": {"A": "營業保證金獨立於經紀業及經紀人員之外，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。營業保證金除本條例另有規定外，「不因」（而非「得因」）經紀業或經紀人員之債權債務關係而為讓與、扣押、抵銷或設定負擔，方向相反，此為★極高頻陷阱：保護營業保證金作為賠償基金之獨立性，不受經紀業個人債務糾紛影響。", "C": "營業保證金應隨經紀業合併變更組織而移轉，敘述正確，非本題答案。", "D": "經紀業申請解散者得請求退還原繳存營業保證金，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第7條、第8條、第9條", "id": 19}, {"chapter": "A2", "year": 108, "qnum": 1, "stem": "關於不動產經紀業營業保證金之敘述，以下何者錯誤？", "options": ["營業保證金除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押或設定負擔", "不動產經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金。但不包括營業保證金之孳息", "應繳之營業保證金及繳存或提供擔保之辦法，由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會定之", "經紀業因合併、變更組織時對其所繳存之營業保證金之權利應隨之移轉"], "answer": "C", "explains": {"A": "營業保證金不因債務債權關係而讓與扣押或設定負擔，敘述正確，非本題答案。", "B": "申請解散者得自核准註銷營業之日滿1年後2年內請求退還（不含孳息），敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應繳之營業保證金及繳存或提供擔保之辦法，應由「中央主管機關」定之，而非「全國聯合會」自行訂定（全國聯合會僅負責管理基金專戶及執行相關程序，非訂定辦法之機關），此為訂定機關主體混淆之★極高頻陷阱。", "D": "合併變更組織時營業保證金權利隨之移轉，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第7條、第8條、第9條", "id": 20}, {"chapter": "A2", "year": 108, "qnum": 2, "stem": "依不動產經紀業管理條例規定，經紀業應依中央主管機關規定繳存營業保證金。下列關於營業保證金之說明，何者錯誤？", "options": ["獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因其債務債權關係而為扣押", "得因經紀業或經紀人員之債務債權關係而抵銷", "經紀業合併時，所繳存營業保證金之權利，應隨之移轉", "經紀業申請解散時，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"], "answer": "B", "explains": {"A": "營業保證金獨立於經紀業及經紀人員之外，不因債務債權關係而扣押，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。營業保證金「不因」（而非「得因」）經紀業或經紀人員之債務債權關係而抵銷，方向相反，此為與106年-10題相同類型之高頻陷阱。", "C": "合併時營業保證金權利隨之移轉，敘述正確，非本題答案。", "D": "申請解散者得自核准註銷營業滿1年後2年內請求退還，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第9條（營業保證金之獨立性：不因債務債權關係而讓與、扣押、抵銷或設定負擔；合併變更組織時權利隨之移轉；申請解散者得自核准註銷營業之日滿一年後二年內請求退還，不含孳息）、第7條第3項（繳存義務）", "id": 21}, {"chapter": "A2", "year": 108, "qnum": 20, "stem": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["營業處所經紀營業員數每逾10名時，應增設經紀人1人", "經紀業設立之營業處所至少應置經紀人1人，但非常態營業處所，其所銷售總金額達新臺幣6億元以上時，該處所至少應置經紀人1人", "經紀業應於經紀人到職之日起7日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同", "非中華民國國民，不得充任中華民國不動產經紀人"], "answer": "B", "explains": {"A": "經紀營業員人數每逾「20名」（而非10名）應增設經紀人1人，數字錯誤。", "B": "正確。營業處所至少應置經紀人1人；非常態營業處所銷售總金額達6億元以上者，至少應置專業經紀人1人，敘述符合法定架構。", "C": "應為到職之日起「15日內」（而非7日內）造具名冊報備，數字錯誤。", "D": "外國人得依我國法律應考並充任經紀人員（經一定許可程序），並非絕對禁止，本選項過於絕對。"}, "ref": "不動產經紀業管理條例第11條", "id": 22}, {"chapter": "A2", "year": 111, "qnum": 1, "stem": "依不動產經紀業管理條例規定，不動產經紀業得請求退還原繳存之營業保證金之情形，不包含那一項？", "options": ["公司組織申請解散者", "商號組織申請歇業者", "營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者", "退出所在地或鄰近直轄市或縣（市）仲介經紀業同業公會"], "answer": "D", "explains": {"A": "公司組織申請解散者，為法定得退還營業保證金之情形，非本題答案。", "B": "商號組織申請歇業者，為法定得退還營業保證金之情形，非本題答案。", "C": "營業項目變更登記後已無仲介代銷業務而組織仍存續者，為法定得退還營業保證金之情形，非本題答案。", "D": "正確答案。「退出同業公會」非法定得請求退還營業保證金之事由（退出公會涉及會員資格問題，非組織解散或營業項目變更之實質退場事由，且退出公會本身可能構成違規，不應成為請求退還保證金之正當理由），此為虛構事由之陷阱。"}, "ref": "不動產經紀業管理條例第9條、施行細則第13條之1", "id": 23}, {"chapter": "A2", "year": 112, "qnum": 6, "stem": "不動產經紀業管理條例之「用辭定義」，下列何者正確？", "options": ["不動產︰指土地、土地定著物或房屋及其可移轉之權利", "成屋︰指領有建造執照之建築物", "經紀人員︰經紀營業員之職務為執行仲介或代銷業務", "營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"], "answer": "A", "explains": {"A": "正確。不動產之法定定義為：土地、土地定著物或房屋及其可移轉之權利，定義完整正確。", "B": "成屋應為領有「使用執照」（而非「建造執照」）之建築物，執照類型錯誤。", "C": "「執行仲介或代銷業務」為「經紀人」之職務，「經紀營業員」之職務為「協助」經紀人執行業務，兩者職務範圍描述互換，此為經紀人與經紀營業員角色混淆之陷阱。", "D": "營業處所應為「非常態」之固定場所（而非「常態之非固定場所」），用語邏輯顛倒，此為文字排列混淆之陷阱。"}, "ref": "不動產經紀業管理條例第4條", "id": 24}, {"chapter": "A2", "year": 114, "qnum": 13, "stem": "依據不動產經紀業管理條例，關於經營仲介業務者之規定，下列敘述何者正確？", "options": ["向主管機關申請許可，經審查後即得經營仲介業務", "以商號之型態辦理登記後，即得開始經營仲介業務", "所僱用的經紀人員可以用個人名義執行不動產買賣", "經營國外不動產仲介業務，應以公司型態辦理登記"], "answer": "D", "explains": {"A": "經審查許可後尚須完成公司/商業登記及加入同業公會，並於6個月內開始營業，並非審查後即得逕行經營，程序不完整。", "B": "以商號型態辦理登記後，尚須加入同業公會及繳存營業保證金等程序，並非登記後即可開始經營，程序不完整。", "C": "經紀人員應「專任」於經紀業並以「經紀業名義」執行業務（受經紀業指派簽章等），不得以個人名義執行不動產買賣仲介業務，此為經紀人員執業義務之核心限制。", "D": "正確。經營國外不動產仲介業務者，應以「公司型態」組織依法辦理登記（商號不可），此為國外不動產業務之特別限制規定。"}, "ref": "不動產經紀業管理條例第5條第1項（許可、登記、國外業務限公司型態）、第7條第1項（公會、6個月內開始營業）、第16條（經紀人員專任義務）", "id": 25}, {"chapter": "A2", "year": 114, "qnum": 20, "stem": "依不動產經紀業管理條例之規定，經紀業應完成相關程序後方得營業。下列敘述，何者錯誤？", "options": ["經紀業經主管機關之許可，並辦妥公司登記或商業登記", "加入戶籍所在地之同業公會", "依中央主管機關規定繳存營業保證金", "應於6個月內開始營業；逾期未開始營業者，由主管機關廢止其許可"], "answer": "B", "explains": {"A": "經主管機關許可並辦妥公司或商業登記，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。應加入「經紀業登記所在地」（而非「戶籍所在地」）之同業公會，經紀業之公會歸屬以其「登記地」為準，非負責人個人之戶籍地，此為主體錯置之★陷阱。", "C": "依中央主管機關規定繳存營業保證金，敘述正確，非本題答案。", "D": "應於6個月內開始營業，逾期未開始營業由主管機關廢止其許可，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第7條", "id": 26}, {"chapter": "A3", "year": 99, "qnum": 3, "stem": "不動產經紀業分設營業處所時，在向不動產經紀業所在地直轄市或縣（市）主管機關申請備查時，無需記明下列何種事項？", "options": ["公司負責人、董事、監察人、經理人或商號負責人、經理人", "營業處所名稱、所在地及設立日期", "經紀業名稱、所在地、公司統一編號、營利事業登記證", "該營業處所僱用之經紀人員姓名、身分證明文件字號及證書字號"], "answer": "A", "explains": {"A": "正確答案。分設營業處所備查之記明事項聚焦於「該分設營業處所」本身之資訊（名稱、所在地、僱用經紀人員等），「公司負責人、董事、監察人、經理人」等經紀業本體之人事資訊，已於經紀業原始設立許可申請時記載完成，分設營業處所備查無須重複記明此類經紀業本體人事事項，此為備查事項範圍界定之陷阱。", "B": "營業處所名稱所在地及設立日期為應記明事項，非本題答案。", "C": "本選項含「經紀業名稱、所在地」，屬施行細則第8條第1項第1款應記明事項，所以不是本題答案。⚠️「公司統一編號、營利事業登記證」是出題當年的記載格式，現行細則第8條第1項『只有三款』：①經紀業名稱及所在地 ②營業處所名稱、所在地及設立日期 ③該營業處所僱用之經紀人員姓名、身分證明文件字號及證書字號——背誦以這三款為準。", "D": "該營業處所僱用經紀人員姓名身分證明字號及證書字號為應記明事項，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則第8條（第1項三款應記明事項；第2項非常態固定場所之替代記載）", "id": 27}, {"chapter": "A3", "year": 99, "qnum": 7, "stem": "下列有關不動產經紀營業員及不動產經紀營業員訓練之敘述，何者錯誤？", "options": ["未領有不動產經紀營業員證明者不能充任不動產經紀營業員", "不動產經紀營業員經訓練後取得之證明，於辦理登錄後，其有效期間為3年", "不動產經紀營業員訓練證明有效期限期滿後，可檢附完成訓練20個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄", "不動產經紀營業員訓練不得少於30個小時"], "answer": "B", "explains": {"A": "未領有經紀營業員證明者不能充任經紀營業員，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。經紀營業員證明有效期間應為「4年」，而非「3年」，數字錯誤，此為與經紀人證書效期（同為4年）易混淆之★高頻陷阱。", "C": "效期屆滿後檢附完成訓練20小時以上證明重新辦理登錄，敘述正確，非本題答案。", "D": "經紀營業員訓練不得少於30個小時，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第13條", "id": 28}, {"chapter": "A3", "year": 99, "qnum": 33, "stem": "外國人某甲居住於臺北市，如欲在臺北縣執行仲介或代銷業務，請問該外國人如具有請領不動產經紀人證書之資格，則應向下列那一機關申請？", "options": ["外交部", "外事警察局", "臺北市政府地政處", "臺北縣政府"], "answer": "C", "explains": {"A": "外交部非經紀人證書核發機關。", "B": "外事警察局非經紀人證書核發機關。", "C": "正確。本國人請領經紀人證書，依施行細則第15條向「戶籍所在地」直轄市或縣（市）主管機關申請；外國人則依施行細則第16條向『居留地』直轄市或縣（市）主管機關申請，並須另附依第38條第2項經中央主管機關許可之證明文件。本題某甲居留於臺北市，故向臺北市申請。★判準是「居留地」，不是比照戶籍地，也不是執業地。", "D": "臺北縣是執業地，不是請領機關。請領機關的判準：本國人看「戶籍所在地」（細則第15條）、外國人看「居留地」（細則第16條），兩者都不是執業地。"}, "ref": "不動產經紀業管理條例第38條第2項（外國人充任經紀人員應經中央主管機關許可）、施行細則第15條（本國人向戶籍所在地申請）、第16條（外國人向「居留地」申請）", "id": 29}, {"chapter": "A3", "year": 100, "qnum": 19, "stem": "依不動產經紀業管理條例規定，下列何者得以申請許可經營不動產經紀業？", "options": ["犯侵占罪而受一年以上有期徒刑宣告確定之緩刑者", "受廢止經紀人員證明或證書之處分未滿一年者", "滿十八歲高中畢業尚未結婚者", "滿二十歲而受法院監護宣告者"], "answer": "A", "explains": {"A": "正確。經紀業條例第6條第1項第3款逐字：犯詐欺、背信、侵占罪等，「經受有期徒刑一年以上刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿三年者」不得申請經營經紀業，『但受緩刑宣告者，不在此限』。本題受緩刑宣告，落在但書，所以得申請。", "B": "依第6條第1項第7款，「受第31條停止執行業務處分尚未執行完畢，或『廢止經紀人員證書或證明處分未滿五年者』」不得申請經營經紀業。本選項「未滿一年」仍在5年禁止期間內，所以不選。", "C": "考試當時（100年）成年年齡為20歲，滿18歲者仍是限制行為能力人，屬禁止事由，所以不選。⚠️ 現行民法已修正成年為18歲，如果今天再考同一題，C 也可能成立；這是「出題年法律已修正」的題型，作答時以當年官方答案A為準。", "D": "受法院監護宣告者為無行為能力人，屬禁止事由，不得申請。"}, "ref": "不動產經紀業管理條例第6條第1項（七款消極資格；第3款但書「受緩刑宣告者，不在此限」；第7款廢止經紀人員證書或證明處分未滿五年）", "id": 30}, {"chapter": "A3", "year": 100, "qnum": 24, "stem": "下列何者不屬不動產經紀人證書滅失時，申請補發應檢附之文件？", "options": ["申請書", "身分證明文件影本", "一年以上營業員經驗證明文件及其影本", "不動產經紀人考試及格證書及其影本"], "answer": "C", "explains": {"A": "申請書為補發應檢附文件，非本題答案。", "B": "身分證明文件影本為補發應檢附文件，非本題答案。", "C": "正確答案。「1年以上營業員經驗證明文件」係「首次請領」經紀人證書時始須檢附之資格證明文件，證書「滅失後申請補發」係已取得過證書之人員重新取得證書之程序，無須再次證明其資格取得要件（資格於首次請領時已審查完畢），此為首次請領與補發程序要件不同之陷阱。", "D": "考試及格證書及其影本為補發應檢附文件，非本題答案。"}, "ref": "不動產經紀業管理條例施行細則", "id": 31}, {"chapter": "A3", "year": 100, "qnum": 25, "stem": "下列關於充任不動產經紀營業員規定之敘述，何者正確？", "options": ["欲取得不動產經紀營業員證明者，其經紀營業員專業訓練合格時數，不得少於二十個小時", "營業員證明有效期限屆滿後欲取得營業員資格，應檢附三十個小時以上訓練證明辦理登錄", "廢止營業員證明滿三年者，即可申請登錄請領營業員證明", "經不動產經紀人考試及格者，即可充任不動產經紀營業員"], "answer": "B", "explains": {"A": "營業員訓練「初次」不得少於三十個小時（99-7、111-2、114-19 的官方答案都是這樣），本選項寫「二十個小時」數字錯誤；20 小時是證明期滿後「重新登錄」的時數（104-2）。", "B": "本題官方答案為B（考選部公告），其中「期滿重新登錄要三十個小時」是出題當年的數字。⚠️ 現行期滿重新登錄為 20 小時（104-2 官方答案），考前以 20 小時為準；這題只用來認識「舊制 30 小時」的出題陷阱，不要當作現行法背誦。初次訓練則是 30 小時，不要互換。", "C": "廢止營業員證明後要重新登錄，不是只要「滿3年」就可以，仍須符合訓練時數等要件，條件不完整。", "D": "經紀人考試及格後，仍須完成登錄程序、領得證明才能充任營業員，不是「即可」充任。"}, "ref": "不動產經紀業管理條例第13條；⚠️本題官方答案B採舊制（期滿重新登錄30小時），現行為20小時；初次訓練為30小時", "id": 32}, {"chapter": "A3", "year": 101, "qnum": 35, "stem": "依不動產經紀業管理條例規定，經不動產經紀人考試及格者，應具備多久經紀營業員經驗，始得請領經紀人證書？", "options": ["一年以上", "一年半以上", "二年以上", "三年以上"], "answer": "A", "explains": {"A": "正確。經考試及格者，應具備「1年以上」經紀營業員經驗，始得請領經紀人證書，此為經紀人證書請領之核心要件，全科高頻數字。", "B": "數字錯誤，非一年半。", "C": "數字錯誤，非二年。", "D": "數字錯誤，非三年。"}, "ref": "不動產經紀業管理條例第14條", "id": 33}, {"chapter": "A3", "year": 102, "qnum": 3, "stem": "請領不動產經紀人證書，應向何機關申請？", "options": ["行政院", "內政部", "經紀業所在地直轄市或縣（市）政府", "戶籍所在地直轄市或縣（市）政府"], "answer": "D", "explains": {"A": "行政院非經紀人證書核發機關。", "B": "內政部為中央主管機關，惟證書核發機關為地方政府，非內政部直接核發。", "C": "應以「戶籍所在地」（而非「經紀業所在地」）為準，主體錯誤。", "D": "正確。請領經紀人證書應向「戶籍所在地」直轄市或縣（市）政府申請，此為請領機關認定之核心基準（以個人戶籍地為準，非執業地或經紀業所在地）。"}, "ref": "不動產經紀業管理條例第14條", "id": 34}, {"chapter": "A3", "year": 104, "qnum": 2, "stem": "依不動產經紀業管理條例規定，領有經紀營業員證明者，於其證明有效期限屆滿時，應檢附完成訓練至少多少小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄？", "options": ["20小時", "30小時", "40小時", "60小時"], "answer": "A", "explains": {"A": "正確。經紀營業員證明效期屆滿時，應檢附完成訓練至少「20小時」以上之證明文件重新辦理登錄，須與「初次訓練不得少於30小時」（經紀營業員）及「經紀人換證需30小時」區辨，此為★高頻數字。", "B": "數字錯誤，30小時為初次訓練或經紀人換證之時數，非重新登錄之時數。", "C": "數字錯誤，非40小時。", "D": "數字錯誤，非60小時。"}, "ref": "不動產經紀業管理條例第13條", "id": 35}, {"chapter": "A3", "year": 104, "qnum": 21, "stem": "甲之戶籍在嘉義縣，現居住於高雄市並任職於高雄市某經紀業。請問甲請領不動產經紀人證書時，應向何機關申請？", "options": ["考選部", "內政部", "高雄市政府", "嘉義縣政府"], "answer": "D", "explains": {"A": "考選部僅辦理考試業務，非證書核發機關。", "B": "內政部為中央主管機關，非證書直接核發機關。", "C": "高雄市政府為甲之「居住地／任職地」，非「戶籍地」，主體不符。", "D": "正確。請領經紀人證書應向「戶籍所在地」（本題為嘉義縣）之直轄市或縣（市）政府申請，不因居住地或任職地不同而改變，此為戶籍地為準原則之核心考點。"}, "ref": "不動產經紀業管理條例第14條", "id": 36}, {"chapter": "A3", "year": 104, "qnum": 22, "stem": "不動產經紀人依規定辦理換發證書時，應於何期限內申請？", "options": ["證書有效期限屆滿前六個月內", "證書有效期限屆滿前三個月內", "證書有效期限屆滿後六個月內", "證書有效期限屆滿後三個月內"], "answer": "A", "explains": {"A": "正確。經紀人辦理換發證書，應於證書有效期限屆滿「前6個月內」申請，此為換證申請期限之核心數字。", "B": "數字錯誤，非屆滿前三個月內。", "C": "應為屆滿「前」而非屆滿「後」申請，時點方向錯誤。", "D": "應為屆滿「前」而非屆滿「後」申請，時點方向錯誤，且數字亦錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 37}, {"chapter": "A3", "year": 104, "qnum": 25, "stem": "依不動產經紀業管理條例之規定，下列有關外國人充任我國不動產經紀人員之敘述，何者錯誤？", "options": ["外國人得依我國法律應不動產經紀人考試", "外國人得依我國法律參加不動產經紀營業員訓練", "外國人應經行政院許可，始得受僱於經紀業為經紀人員", "有關業務上所為之文件、圖說，應以中華民國文字為之"], "answer": "C", "explains": {"A": "外國人得依我國法律應不動產經紀人考試，敘述正確，非本題答案。", "B": "外國人得依我國法律參加經紀營業員訓練，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。外國人應經「內政部」（而非「行政院」）許可，始得受僱於經紀業為經紀人員，許可機關主體錯誤，此為機關層級混淆之★陷阱（內政部為中央主管機關，非行政院直接許可）。", "D": "業務上文件圖說應以中華民國文字為之，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第38條（第1項外國人得應考、參加營業員訓練；第2項應經「中央主管機關」許可始得受僱為經紀人員；第3項業務文件圖說應以中華民國文字為之）", "id": 38}, {"chapter": "A3", "year": 105, "qnum": 10, "stem": "關於不動產經紀業及經紀人員的敘述，下列何者正確？", "options": ["經營國外不動產仲介業務者，以依法辦理登記之公司或商號為限", "外國人依中華民國法律不得參加不動產經紀人考試或參加營業員訓練", "經紀業取得主管機關許可，依法辦理公司或商業登記，即可開始營業", "經紀業應於經紀人到職之日起15日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同"], "answer": "D", "explains": {"A": "經營國外不動產仲介業務者以「公司型態」為限，不含「商號」，本選項擴大範圍錯誤。", "B": "外國人「得」依我國法律應考經紀人考試及參加營業員訓練，並非不得參加，方向相反。", "C": "辦妥登記後尚須加入同業公會及繳存營業保證金，並非登記後即可開始營業，程序不完整。", "D": "正確。經紀業應於經紀人到職之日起「15日內」，造具名冊報請所在地主管機關層報中央主管機關備查，異動時亦同，此為全科最高頻數字之一，反覆重複命題。"}, "ref": "不動產經紀業管理條例第5條第1項（國外業務限公司型態）、第7條（公會、6個月開業、營業保證金）、第12條（到職15日內造冊備查）、第38條第1項（外國人得應考、參加訓練）", "id": 39}, {"chapter": "A3", "year": 107, "qnum": 22, "stem": "依不動產經紀業管理條例之規定，下列何種情形不得申請經營經紀業？", "options": ["受破產之宣告尚未復權者", "受感訓處分之裁定確定，執行完畢後已滿三年者", "犯詐欺、背信、侵占罪，經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者", "受廢止經紀人員證書或證明處分已滿五年者"], "answer": "A", "explains": {"A": "正確。受破產宣告「尚未復權」者，屬第6條明文禁止事由，不得申請經營經紀業。", "B": "受感訓處分執行完畢後「已滿3年」者，已超過禁止期間（未滿3年才禁止），得申請經營經紀業，非本題答案。", "C": "犯特定罪執行完畢或赦免後「已滿3年」者，已超過禁止期間，得申請經營經紀業，非本題答案。", "D": "受廢止經紀人員證書處分「已滿5年」者，已超過禁止期間，得申請經營經紀業，非本題答案。"}, "ref": "不動產經紀業管理條例第6條", "id": 40}, {"chapter": "A3", "year": 107, "qnum": 24, "stem": "下列有關不動產經紀人辦理換發證書之規定敘述，何者正確？", "options": ["換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年", "應於證書有效期限屆滿前三個月內申請", "應完成專業訓練至少二十個小時", "應向執業所在地之直轄市或縣（市）政府申請"], "answer": "A", "explains": {"A": "正確。換發之經紀人證書，其有效期限自原證書有效期限屆滿之「次日起算4年」，此為換證後新效期之精確起算方式。", "B": "應於屆滿「前6個月內」（而非3個月內）申請，數字錯誤。", "C": "應完成專業訓練至少「30個小時」（而非20個小時，20小時是經紀營業員之時數要求），時數混淆★陷阱。", "D": "應向「戶籍所在地」（而非執業所在地）直轄市或縣（市）政府申請，主體錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 41}, {"chapter": "A3", "year": 107, "qnum": 25, "stem": "首次請領不動產經紀人證書時，不須檢附下列何種文件？", "options": ["身分證明文件影本", "完成專業訓練三十個小時以上之證明文件", "不動產經紀人考試及格證書及其影本", "一年以上經紀營業員經驗證明文件及其影本"], "answer": "B", "explains": {"A": "身分證明文件影本為首次請領應檢附文件，非本題答案。", "B": "正確答案。「完成專業訓練30個小時以上之證明文件」係經紀人「換證」時應檢附之文件（換證須於4年內完成30小時訓練），並非「首次請領」證書時之要件（首次請領以「考試及格＋1年以上經紀營業員經驗」為要件，尚無須額外之訓練時數證明），此為首次請領與換證要件混淆之★陷阱。", "C": "考試及格證書及其影本為首次請領應檢附文件，非本題答案。", "D": "1年以上經紀營業員經驗證明文件為首次請領應檢附文件，非本題答案。"}, "ref": "不動產經紀業管理條例第14條", "id": 42}, {"chapter": "A3", "year": 110, "qnum": 9, "stem": "依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？", "options": ["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員", "領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員", "取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年", "不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"], "answer": "D", "explains": {"A": "訓練合格後尚須完成「登錄」程序，並非訓練合格即得逕行充任，程序不完整。", "B": "經紀人考試及格者，尚須完成「登錄」程序，並非考試及格即得逕行充任經紀營業員，程序不完整。", "C": "取得資格之初次訓練不得少於「30個小時」（而非20個小時），數字錯誤（20小時是效期屆滿後重新登錄之時數要求）。", "D": "正確。經紀營業員證明因受破產宣告尚未復權等禁止事由而被撤銷者，於該原因消滅後（如復權），得依法重新請領證明，此為禁止事由消滅後資格回復之核心規定。"}, "ref": "不動產經紀業管理條例第6條、第13條", "id": 43}, {"chapter": "A3", "year": 110, "qnum": 11, "stem": "有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？", "options": ["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書", "不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之", "不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年", "不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"], "answer": "B", "explains": {"A": "考試及格後，尚須具備「1年以上經紀營業員經驗」，始得請領證書，並非考試及格即可請領，要件不完整。", "B": "正確。經紀人辦理換發證書，應於證書有效期限屆滿「前6個月內」申辦，此為換證申請期限之核心數字。", "C": "換發證書之效期應自原證書效期屆滿之「次日」（而非「當日」）起算4年，時點描述精確度不足。", "D": "證書滅失申請補發，應向「戶籍所在地直轄市或縣（市）政府」（而非「中央機關」）申請，機關主體錯誤。"}, "ref": "不動產經紀業管理條例第14條", "id": 44}, {"chapter": "A3", "year": 111, "qnum": 2, "stem": "不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？", "options": ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "經紀人證書有效期限為三年", "經紀營業員訓練不得少於三十個小時", "未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"], "answer": "C", "explains": {"A": "應具備「1年以上」（而非半年以上）經紀營業員經驗，數字錯誤。", "B": "經紀人證書有效期限應為「4年」（而非三年），數字錯誤。", "C": "正確。經紀營業員（初次）訓練不得少於「30個小時」，此為法定訓練時數下限。", "D": "經紀業「不得」僱用未具備經紀人員資格者從事仲介或代銷業務，此為強制禁止規定，不因簽訂專任約而有例外，本選項虛構例外情形，屬★陷阱。"}, "ref": "不動產經紀業管理條例第13條、第14條、第17條", "id": 45}, {"chapter": "A3", "year": 112, "qnum": 2, "stem": "有關外國人任職不動產經紀業之規定，下列何者正確？", "options": ["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試", "經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可", "經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"], "answer": "C", "explains": {"A": "錯在多加了一道程序。§38Ⅰ 逐字：外國人得依中華民國法律「應不動產經紀人考試」或參加營業員訓練。「應考本身不需要任何許可」；許可是後面受僱時才要（§38Ⅱ）。", "B": "前半段其實是對的，「錯在後半段的機關」。§38Ⅱ 確實是應經「中央主管機關」（即內政部）許可…始得受僱於經紀業為經紀人員——這半句沒問題。但本條例全文沒有「大陸委員會」；大陸地區人民在臺工作的許可，依兩岸人民關係條例向「勞動部」申請，不是陸委會。整句因後半段而錯。", "C": "正確。§38Ⅱ＋§13Ⅱ：經中央主管機關或其認可之機構、團體舉辦營業員訓練合格或經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有經紀營業員證明者，得充任經紀營業員；外國人另須經中央主管機關許可始得受僱。", "D": "錯在方向。§38Ⅲ 逐字：外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，「應以中華民國文字為之」。是強制規定，不是「可不限」。"}, "ref": "不動產經紀業管理條例§38（外國人應考、受僱許可、文件應用中文）、§13Ⅱ（營業員登錄）", "id": 46}, {"chapter": "A3", "year": 114, "qnum": 19, "stem": "依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？", "options": ["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員", "經紀營業員訓練不得少於20個小時，其證明有效期限為4年", "期滿時，經紀營業員應檢附完成訓練30個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄", "經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"], "answer": "A", "explains": {"A": "正確。經紀人考試及格者，亦得選擇向中央主管機關指定之機構團體登錄，並領有經紀營業員證明後充任經紀營業員（此為經紀人資格者兼任/轉任經紀營業員之管道之一），敘述符合法定規定。", "B": "經紀營業員初次訓練不得少於「30個小時」（而非20個小時），數字錯誤。", "C": "效期屆滿重新辦理登錄應檢附完成訓練「20個小時」以上（而非30個小時）之證明文件，數字錯誤（30小時是初次訓練或經紀人換證之時數）。", "D": "本選項錯在「施行後」與漏掉前提，不是錯在扣繳資料。經紀業條例第14條第2項的兩種認定方式是：第一款「取得經紀營業員資格」並附有仲介或代銷業務『所得扣繳資料證明』者；第二款限於「本條例『施行前』」已實際從事仲介或代銷業務而有所得扣繳資料證明者。本選項講「施行後」已實際從事而以扣繳資料證明，既不合第二款（第二款只管施行前），也漏掉第一款「已取得經紀營業員資格」這個前提。★所得扣繳資料本身就是法定證明文件，不是不能用。"}, "ref": "不動產經紀業管理條例第13條（營業員登錄與證明）、第14條（經紀人資格：1年以上經紀營業員經驗；第2項兩種認定方式均以「所得扣繳資料證明」為要件，第2款限本條例施行前）、第15條（經紀人證書效期4年、換證30小時）", "id": 47}];

 if(BXO==='rand')return v.slice().sort(function(a,b){return BXR.get(a)-BXR.get(b)});return v}

 document.getElementById('statTotal').textContent=QUESTIONS.length;document.getElementById('statDone').textContent=done;document.getElementById('statCorrect').textContent=cor;document.getElementById('statWrong').textContent=wr;document.getElementById('statRate').textContent=done?Math.round(cor/done*100)+'%':'--'}

 var s=state[q.id],card=document.createElement('div');card.id='q'+q.id;
