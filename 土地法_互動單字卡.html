<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土地法概要｜互動單字卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#2F5D50;--pri2:#3E7566;--key:#8A5517;--onpri:#FFFFFF;--hbg1:#2F5D50;--hbg2:#3E7566;--card:#FFFFFF;--onacc:#FFFFFF;color-scheme:light;
  --paper:#F5F1E6;
  --paper-deep:#ECE6D4;
  --ink:#25302C;
  --ink-soft:#66706A;
  --rule:#DDD6C0;
  --stamp:#A8402B;
  --gold:#B8782E;
  --green:#35693F;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#84C2AE;--pri2:#6FAE9A;--key:#E0B070;--onpri:#10201B;--hbg1:#24413A;--hbg2:#2D4F46;--card:#1F2723;--onacc:#10201B;--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#9AA79F;--rule:#34403A;--stamp:#E0705A;--gold:#E0B070;--green:#8FCB93;color-scheme:dark;}}
:root[data-theme="dark"]{--pri:#84C2AE;--pri2:#6FAE9A;--key:#E0B070;--onpri:#10201B;--hbg1:#24413A;--hbg2:#2D4F46;--card:#1F2723;--onacc:#10201B;--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#9AA79F;--rule:#34403A;--stamp:#E0705A;--gold:#E0B070;--green:#8FCB93;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(188,138,46,0.06), transparent 40%),
    radial-gradient(circle at 90% 95%, color-mix(in srgb,var(--pri) 5%,transparent), transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 48px;
}
.wrap{width:100%;max-width:520px;}
header{text-align:center;margin-bottom:14px;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--pri);
  border:1px solid var(--pri);border-radius:999px;
  padding:3px 12px;margin-bottom:10px;
}
h1{
  font-family:'Noto Serif TC',serif;font-weight:900;
  font-size:22px;letter-spacing:.04em;line-height:1.5;
}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);
  letter-spacing:.08em;margin-top:4px;font-family:'Noto Sans TC',sans-serif;}

.mode-tabs{
  display:flex;gap:8px;margin:18px 0 12px;background:var(--card);
  border:1.5px solid var(--ink);border-radius:12px;padding:4px;
}
.mode-tab{
  flex:1;text-align:center;padding:9px 8px;border-radius:9px;
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;
  cursor:pointer;color:var(--ink-soft);transition:all .15s ease;
  user-select:none;
}
.mode-tab.active{background:var(--ink);color:var(--card);}

.chips{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin:10px 0 6px;
}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--card);color:var(--ink-soft);
  cursor:pointer;user-select:none;transition:all .15s ease;
  white-space:nowrap;
}
.chip.active{color:#fff;border-color:transparent;}

.filter-row{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.filter-row .chip{border-color:var(--ink);color:var(--ink);font-weight:700;}
.filter-row .chip.active{background:var(--ink);color:var(--card);}

.status-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.status-row .chip{border-color:var(--gold);color:var(--gold);}
.status-row .chip.active{background:var(--gold);color:var(--onacc);}
.status-row .chip.review{border-color:var(--pri);color:var(--pri);}
.status-row .chip.review.active{background:var(--pri);color:var(--onpri);}
.status-row .chip.mastered{border-color:var(--green);color:var(--green);}
.status-row .chip.mastered.active{background:var(--green);color:var(--onacc);}

.progress{
  text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px;
}
.progress b{color:var(--ink);font-size:15px;}
.progress-bar{
  height:3px;background:var(--rule);border-radius:2px;overflow:hidden;
  margin:0 auto 18px;max-width:200px;
}
.progress-fill{height:100%;background:var(--pri);transition:width .25s ease;}

.scene{perspective:1400px;width:100%;}
.card{
  position:relative;width:100%;min-height:320px;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;cursor:pointer;
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;border:1.5px solid var(--rule);
  background:var(--card);
  display:flex;flex-direction:column;
  padding:26px 24px;
  box-shadow:0 4px 18px rgba(42,39,34,0.07);
  overflow-y:auto;
}
.face.back{transform:rotateY(180deg);background:var(--paper-deep);}
.cat-badge{
  align-self:flex-start;font-size:11px;font-weight:700;color:#fff;
  padding:4px 12px;border-radius:999px;letter-spacing:.08em;
  margin-bottom:18px;font-family:'Noto Serif TC',serif;
}
.mastery-badge{
  position:absolute;top:14px;right:14px;font-size:18px;line-height:1;
}
.face-body{flex:1;display:flex;align-items:center;}
.term{
  font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:21px;line-height:1.7;color:var(--ink);
}
.answer{font-size:17px;line-height:1.95;color:var(--ink);width:100%;}
.face.back .face-body{align-items:flex-start;}
.kou{margin-top:12px;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--gold) 16%,var(--card));border-left:4px solid var(--gold);font-size:15px;line-height:1.7;font-weight:700;color:var(--ink);}
.kou i{font-style:normal;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);display:block;font-weight:700;}
.exm{margin-top:10px;padding:8px 12px;border-radius:8px;border:1px dashed var(--rule);font-size:13px;line-height:1.7;color:var(--ink-soft);}
.exm b{color:var(--ink);}
.answer b{color:var(--key);}
.face-foot{
  text-align:center;font-size:11px;color:var(--ink-soft);
  letter-spacing:.15em;margin-top:14px;font-family:'Noto Serif TC',serif;
}
.face.back .face-foot{color:var(--gold);}
.face.back{border-left:6px solid var(--cat-color,var(--pri));}

.controls{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:20px;flex-wrap:wrap;
}
.btn{
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;
  border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer;
  transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:var(--card);}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--onpri);}
.btn.primary:hover{background:var(--pri2);}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:var(--onacc);}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:hover{background:var(--gold);color:var(--onacc);}
.btn.wide{flex:1;min-width:120px;text-align:center;}
.btn.icon{padding:10px 14px;}

.quiz-stats{
  text-align:center;font-size:13px;color:var(--ink-soft);
  margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
}
.quiz-stats b{font-family:'Noto Serif TC',serif;}
.quiz-stats .ok{color:var(--green);}
.quiz-stats .ng{color:var(--pri);}

.breakdown{
  margin-top:14px;background:var(--card);border:1px solid var(--rule);
  border-radius:10px;padding:14px;font-size:13px;
}
.breakdown table{width:100%;border-collapse:collapse;}
.breakdown td{padding:5px 4px;border-bottom:1px solid var(--rule);}
.breakdown tr:last-child td{border-bottom:none;}
.breakdown .bar{
  display:block;height:6px;border-radius:3px;background:var(--rule);
  overflow:hidden;margin-top:3px;
}
.breakdown .bar-fill{height:100%;background:var(--green);}

footer{
  margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);
  letter-spacing:.12em;line-height:2;
}
footer .reset{
  text-decoration:underline;cursor:pointer;color:var(--ink-soft);background:none;
  border:none;font-size:11px;letter-spacing:.12em;font-family:inherit;
}
.chip{font-size:11.5px;padding:4px 9px;}
.badge-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;padding-right:30px;flex-wrap:wrap;}
.badge-row .cat-badge{margin-bottom:0;}
.freq-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em;
  background:color-mix(in srgb,var(--ink) 8%,var(--card));color:var(--ink);font-family:'Noto Serif TC',serif;white-space:nowrap;}
.chip[data-cat]:not(.active){background:transparent;color:var(--ink);}
.legend{text-align:center;font-size:11px;color:var(--ink-soft);margin:2px 0 8px;letter-spacing:.04em;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.page-header .titles{flex:1;min-width:0;text-align:center;}
.hdr-controls{flex-shrink:0;padding-top:2px;}
.theme-pill{cursor:pointer;border:1.5px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink-soft);
  height:26px;padding:0 12px;font-size:11px;font-weight:700;font-family:inherit;letter-spacing:.03em;white-space:nowrap;}
.theme-pill:hover{background:var(--rule);color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="page-header">
      <div class="titles">
        <div class="case-tag">土地法概要・核心概念精選</div>
        <h1>土地法概要 互動單字卡
          <span class="sub">核心定義・數字配對・陷阱辨析・共 <span id="totalCards">108</span> 張</span>
        </h1>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em;font-family:'Noto Serif TC',serif;">📅 最新編輯時間：2026-10-17　｜　版本 v1.2（條文以全國法規資料庫核對版為準）</div>
      </div>
      <div class="hdr-controls"><button class="theme-pill" id="theme-btn" onclick="toggleTheme()">深色</button></div>
    </div>
  </header>

  <div class="mode-tabs">
    <div class="mode-tab active" id="tabStudy">📖 學習模式</div>
    <div class="mode-tab" id="tabQuiz">📝 測驗模式</div>
  </div>

  <div class="filter-row" id="resetRow">
    <div class="chip active" id="resetBtn">全部分類</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="legend">★＝考頻（依題庫各章題數：≥60 三星、35–59 兩星、&lt;35 一星）｜「歷屆約N題」＝以關鍵詞比對99–114年題庫的估計｜點分類＝只看該類，再點一次＝回全部</div>

  <div class="status-row" id="statusRow"></div>

  <div class="progress"><b id="curNum">1</b> / <span id="totalNum">108</span>　<span id="catName"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="badge-row"><div class="cat-badge" id="badgeFront"></div><div class="freq-badge" id="freqBadgeFront"></div><div class="freq-badge" id="mcBadgeFront"></div></div>
        <div class="mastery-badge" id="badgeMasteryFront"></div>
        <div class="face-body"><div class="term" id="termText"></div></div>
        <div class="face-foot" id="footFront">點擊卡片　看解析 ▸</div>
      </div>
      <div class="face back">
        <div class="badge-row"><div class="cat-badge" id="badgeBack"></div><div class="freq-badge" id="freqBadgeBack"></div><div class="freq-badge" id="mcBadgeBack"></div></div>
        <div class="mastery-badge" id="badgeMasteryBack"></div>
        <div class="face-body"><div class="answer" id="answerText"></div></div>
        <div class="face-foot" id="footBack">◂ 點擊卡片　回題目</div>
      </div>
    </div>
  </div>

  <div class="controls" id="masteryControls">
    <button class="btn icon" id="markReview">🔄 待複習</button>
    <button class="btn green icon" id="markMastered">✅ 已掌握</button>
  </div>

  <div class="controls" id="quizControls" style="display:none;">
    <button class="btn primary wide" id="revealBtn">👀 顯示答案</button>
    <button class="btn icon" id="quizWrong" style="display:none;border-color:var(--stamp);color:var(--stamp);">❌ 答錯</button>
    <button class="btn green icon" id="quizRight" style="display:none;">✅ 答對</button>
  </div>

  <div class="controls">
    <button class="btn icon" id="prevBtn">◂ 上一張</button>
    <button class="btn primary" id="shuffleBtn">🔀 隨機</button>
    <button class="btn icon" id="nextBtn">下一張 ▸</button>
  </div>

  <div class="quiz-stats" id="quizStatsBar" style="display:none;">
    <span>本輪：<b class="ok" id="quizOk">0</b> 對　<b class="ng" id="quizNg">0</b> 錯</span>
    <span style="cursor:pointer;text-decoration:underline;" id="toggleBreakdown">看分類統計</span>
    <span style="cursor:pointer;text-decoration:underline;" id="resetQuiz">重新測驗</span>
  </div>
  <div class="breakdown" id="breakdownPanel" style="display:none;"></div>

  <footer>不動產經紀人考試・土地法概要｜學習模式：標記掌握度（自動儲存）｜測驗模式：自評答對/答錯並統計<br>
    <button class="reset" id="resetMastery">清除所有「已掌握」標記</button>
  </footer>
</div>

<script>
const CARDS = [{"id": "L001", "cat": "總則・登記", "front": "土地分類（§2）四大類？", "back": "①<b>建築用地</b>　②<b>直接生產用地</b>（農林漁牧礦鹽水源地）　③<b>交通水利用地</b>　④<b>其他土地</b>（沙漠、雪山等）。", "mc": 3, "ex": ["106-39", "103-30", "102-29"]}, {"id": "L002", "cat": "總則・登記", "front": "不得私有之土地（§14）若已私有？", "back": "<b>得依法徵收之</b>（不是逕登記國有，也不是視為消滅）。例：礦泉地、瀑布地、名勝古蹟、可通運水道及其沿岸一定限度內土地。", "mc": 0, "ex": []}, {"id": "L003", "cat": "總則・登記", "front": "私有土地所有權消滅後歸屬？", "back": "<b>國有</b>（§10）。私有土地因天然變遷成湖澤或可通運水道，所有權<b>視為消滅</b>。", "mc": 2, "ex": ["105-10", "99-5"]}, {"id": "L004", "cat": "總則・登記", "front": "外國人不得取得（§17）的土地？", "back": "<b>林、漁、狩獵、鹽、礦、水源地</b>＋<b>要塞軍備區域</b>＋<b>領域邊境土地</b>。陷阱：<b>牧地不在內</b>（口訣：林漁狩鹽礦要水）。繼承取得者須於登記後<b>3年內</b>出售與本國人。", "mc": 8, "ex": ["114-21", "112-17", "111-14", "110-1"], "kou": "林漁狩鹽礦要水"}, {"id": "L005", "cat": "總則・登記", "front": "外國人取得土地應向誰申請？", "back": "一般：向<b>土地所在地直轄市或縣（市）政府</b>申請核准。重大建設／整體經濟／農牧經營之投資：須先經<b>中央目的事業主管機關</b>同意。", "mc": 2, "ex": ["110-1", "106-14"]}, {"id": "L006", "cat": "總則・登記", "front": "私有建築用地面積限制（平均地權條例）？", "back": "未建築之私有建築用地，最高額以<b>十公畝</b>為限；逾期未出售或使用者得<b>照價收買</b>。", "mc": 3, "ex": ["114-24", "108-13", "99-3"]}, {"id": "L007", "cat": "總則・登記", "front": "登記損害賠償（§68～71）重點？", "back": "地政機關負賠償責任；登記費提存<b>10%</b>為登記儲金；登記人員<b>重大過失</b>由地政機關先賠、再由該人員償還（§70，<b>非連帶</b>）；被拒賠得向<b>司法機關</b>起訴。", "mc": 7, "ex": ["114-1", "112-20", "109-22", "108-2"]}, {"id": "L008", "cat": "總則・登記", "front": "免納登記費的登記（§78）？", "back": "總登記、更正、限制（含預告）、消滅、滅失、住址變更、書狀換給補給、<b>土地重劃變更登記</b>。陷阱：<b>繼承登記、共有物分割登記要繳登記費</b>。", "mc": 15, "ex": ["110-4", "109-16", "108-16", "108-21"]}, {"id": "L009", "cat": "總則・登記", "front": "預告登記（§79-1）無排除效力的情形？", "back": "因<b>徵收、法院判決、強制執行</b>而為的新登記（只列此三者；<b>繼承、破產不在內</b>）。可保全請求權：移轉或消滅、內容或次序變更、附條件或期限。可單獨申請（檢附登記名義人同意書），免登記費。", "mc": 11, "ex": ["114-2", "114-10", "113-3", "111-20"]}, {"id": "L010", "cat": "總則・登記", "front": "繼承登記逾期處理（§73-1）流程？", "back": "繼承開始<b>逾1年</b>未辦→公告<b>3個月</b>內聲請→仍未辦<b>列冊管理15年</b>→移請<b>財政部國產署公開標售</b>（優購順序：繼承人、合法使用人、其他共有人）→價款逾<b>10年</b>無人領歸國庫。", "mc": 15, "ex": ["114-8", "113-16", "112-8", "111-1"], "kou": "六月辦繼承，逾一年公告，三月內聲請，列管十五年，價款存十年〔自編〕"}, {"id": "L011", "cat": "總則・登記", "front": "地籍重測原因？", "back": "地籍原圖破損、滅失、比例尺變更（§46-1）。陷阱：<b>界址糾紛不是重測原因</b>。重測公告<b>30日</b>；界址爭議調處後不服須於<b>15日</b>內向司法機關起訴。", "mc": 5, "ex": ["110-2", "106-28", "105-21", "101-4"]}, {"id": "L012", "cat": "優購權・租賃・公有地", "front": "§34-1 共有土地多數決？", "back": "處分、變更及設定<b>地上權、農育權、不動產役權、典權</b>：①人數過半＋應有部分過半；或②應有部分合計<b>逾2/3</b>（人數不計）。<b>設定抵押權不適用</b>（須全體同意）。", "mc": 20, "ex": ["114-5", "114-13", "113-15", "112-6"], "kou": "人份雙過半；份逾三分之二，人不用算；抵押要全體〔自編〕"}, {"id": "L013", "cat": "優購權・租賃・公有地", "front": "§34-1 優先購買權期間與性質？", "back": "他共有人得以同一價格優先承購；<b>15日</b>內不表示視為放棄；<b>債權效力</b>。區分所有建物專有部分連同基地應有部分一併移轉同一人：不適用。", "mc": 12, "ex": ["114-13", "113-10", "113-15", "112-18"]}, {"id": "L014", "cat": "優購權・租賃・公有地", "front": "§104 基地、房屋優先購買權？", "back": "基地出賣：<b>地上權人、典權人、承租人</b>有優購權；房屋出賣：<b>基地所有權人</b>有優購權。<b>10日</b>不表示視為放棄；<b>物權效力（相對）</b>（契約不得對抗優購權人）；<b>抵押權人無</b>優購權。", "mc": 9, "ex": ["114-13", "113-15", "109-24", "108-5"], "kou": "基地賣：地・典・租；房屋賣：地主；十日不表示就放棄〔自編〕"}, {"id": "L015", "cat": "優購權・租賃・公有地", "front": "優購權期間速記：15日 vs 10日？", "back": "<b>§104基地房屋、§107耕地＝10日</b>；<b>三七五減租§15＝15日</b>（書面）。<b>§34-1優先承購條文未定期間；執行要點第13點(一)定15日（要點層級）</b>，15日只見於Ⅵ分割調處不服起訴期間（2026-10-11核）。效力：三七五§15、土地法§104／§107皆為<b>物權效力</b>（條文寫「不得對抗」）；只有§34-1是債權效力。", "mc": 4, "ex": ["113-15", "112-18", "109-24", "108-4"]}, {"id": "L016", "cat": "優購權・租賃・公有地", "front": "§107 耕地承租人優購權？", "back": "出租人出賣或出典耕地，承租人依同樣條件優先承買、承典，<b>10日</b>內不表示視為放棄；準用§104 Ⅱ，<b>物權效力（相對）</b>。", "mc": 5, "ex": ["114-13", "105-20", "104-5", "101-3"]}, {"id": "L017", "cat": "優購權・租賃・公有地", "front": "房屋租金上限（§97）與擔保金（§99）？", "back": "租金不超過土地及建物<b>申報總價年息10%</b>；現金擔保視為租金一部分，不得超過<b>2個月</b>租金總額。", "mc": 5, "ex": ["110-5", "109-14", "106-6", "106-30"]}, {"id": "L018", "cat": "優購權・租賃・公有地", "front": "§100 房屋出租人收回事由（六款）？", "back": "①收回自住或重建　②承租人違反租約　③積欠租金達<b>2個月</b>（扣擔保金後）　④供違法使用　⑤損壞房屋不賠　⑥轉租。", "mc": 7, "ex": ["111-16", "109-13", "109-14", "107-9"], "kou": "自・約・欠・違・損・轉（自住重建、違約、欠二月、違法使用、損壞、轉租）〔自編；各款順序以條文為準〕"}, {"id": "L019", "cat": "優購權・租賃・公有地", "front": "§103 基地出租人收回事由（五款）？", "back": "①契約年限屆滿　②供違法使用　③轉租　④積欠租金達<b>2年</b>總額（扣擔保現金後）　⑤承租人違反租賃契約。", "mc": 0, "ex": [], "kou": "滿・違・轉・欠・約（屆滿、違法使用、轉租、欠二年、違約）〔自編；各款順序以條文為準〕"}, {"id": "L020", "cat": "優購權・租賃・公有地", "front": "§102 租用基地建房登記？", "back": "出租人與承租人應於契約訂立後<b>2個月內</b>，會同聲請<b>地上權登記</b>。", "mc": 2, "ex": ["107-8", "104-28"]}, {"id": "L021", "cat": "優購權・租賃・公有地", "front": "§25 公有土地處分限制？", "back": "直轄市或縣（市）政府對所管公有土地，非經<b>民意機關同意＋行政院核准</b>，不得處分、設定負擔或為<b>超過10年</b>之租賃。政府依法照價收買、區段徵收或土地重劃取得之土地，得隨時公開出售，不受§25限制（平均地權條例§7）。", "mc": 8, "ex": ["110-1", "110-6", "110-20", "106-9"]}, {"id": "L022", "cat": "優購權・租賃・公有地", "front": "公有土地 vs 國有土地？", "back": "公有土地<b>包含</b>國有、直轄市有、縣（市）有、鄉（鎮、市）有。台糖公司（公營事業）的土地屬<b>私有土地</b>。", "mc": 2, "ex": ["103-35", "100-38"]}, {"id": "L023", "cat": "區域・國土・都市計畫", "front": "區域計畫法立法目的 vs 都市計畫法？", "back": "區域計畫法：<b>土地及天然資源保育利用</b>、<b>人口及產業活動合理分布</b>。「促進市鎮鄉街<b>有計畫之均衡發展</b>」是<b>都市計畫法</b>目的（陷阱）。", "mc": 1, "ex": ["101-11"]}, {"id": "L024", "cat": "區域・國土・都市計畫", "front": "非都市土地使用分區與使用地？", "back": "分區<b>11種</b>（特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用）；使用地<b>19種</b>。", "mc": 13, "ex": ["113-22", "110-17", "110-18", "108-20"], "kou": "分區：農二工鄉、森坡風國、河海專（11）｜使用地：甲乙丙丁、農林養鹽礦窯、交水遊古生國殯、海特（19）〔自編〕"}, {"id": "L025", "cat": "區域・國土・都市計畫", "front": "非都市建蔽率／容積率速記？", "back": "甲、乙種建築：<b>60／240</b>；丙種：<b>40／120</b>；丁種：<b>70／300</b>；特定目的事業用地：60／180（考前對紙本）。", "mc": 1, "ex": ["111-8"], "kou": "丙交遊殯＝40/120（四個一樣）｜甲乙＝60/240｜丁＝70/300最高｜窯60/120、特目60/180〔自編〕"}, {"id": "L026", "cat": "區域・國土・都市計畫", "front": "開發規模門檻（變更分區）？", "back": "社區<b>50戶或1公頃</b>→鄉村區；遊憩<b>5公頃</b>→特定專用區；高爾夫<b>10公頃</b>→特定專用區；其他開發<b>2公頃</b>→特定專用區；工業使用<b>10公頃</b>→工業區。", "mc": 0, "ex": [], "kou": "51（50戶/1公頃）鄉村｜工10（產創5）｜遊5・校10・球10・墓5・殯2・其他2→特專〔自編〕"}, {"id": "L027", "cat": "區域・國土・都市計畫", "front": "區域計畫法罰則（§21、§22）？", "back": "違規使用：<b>6萬～30萬</b>罰鍰、限期變更／拆除，可按次處罰；不依限變更（§22）另得處<b>6個月以下有期徒刑或拘役</b>。", "mc": 3, "ex": ["106-24", "102-3", "100-21"]}, {"id": "L028", "cat": "區域・國土・都市計畫", "front": "國土計畫法：中央 vs 地方核定？", "back": "四大分區：國土保育、海洋資源、農業發展、城鄉發展。<b>中央</b>核定：國土保育地區、海洋資源地區使用許可；<b>直轄市縣市</b>核定：農業發展地區、城鄉發展地區使用許可。", "mc": 1, "ex": ["114-19"]}, {"id": "L029", "cat": "區域・國土・都市計畫", "front": "都市計畫種類與市鎮計畫門檻？", "back": "市鎮計畫、鄉街計畫、特定區計畫。市鎮計畫：人口集居<b>3,000人</b>以上且工商業人口占就業人口<b>50%以上</b>。", "mc": 2, "ex": ["112-22", "100-25"]}, {"id": "L030", "cat": "區域・國土・都市計畫", "front": "主要計畫核定與實施？", "back": "公開展覽<b>30天</b>→核定；直轄市、縣政府所在地、縣轄市由<b>內政部</b>核定；鎮、鄉街由<b>縣政府</b>核定、內政部備案；接核定公文<b>30日內</b>發布；進度<b>5年一期</b>、最長<b>25年</b>。", "mc": 16, "ex": ["114-18", "113-4", "113-9", "112-22"]}, {"id": "L031", "cat": "區域・國土・都市計畫", "front": "第一期發展地區期限？", "back": "主要計畫發布後<b>2年內</b>完成細部計畫；細部計畫發布後<b>5年內</b>完成公共設施建設（不要顛倒）。", "mc": 1, "ex": ["111-12"]}, {"id": "L032", "cat": "區域・國土・都市計畫", "front": "公共設施保留地使用／地價稅／土增稅？", "back": "可繼續原來使用或改為妨礙較輕之使用；<b>建築使用統按6‰</b>（自用住宅2‰）；<b>未使用且與使用中土地隔離免徵</b>地價稅；徵收前移轉<b>免徵土增稅</b>。補償：毗鄰非保留地平均公告現值，加成<b>不超過40%</b>。", "mc": 23, "ex": ["114-25", "113-6", "113-14", "112-1"]}, {"id": "L033", "cat": "區域・國土・都市計畫", "front": "容積移轉（§83-1）不適用於？", "back": "適用：保留地取得、公共開放空間提供、歷史建築保存。陷阱：<b>農業用地之保護</b>不屬之。", "mc": 1, "ex": ["99-14"]}, {"id": "L034", "cat": "區域・國土・都市計畫", "front": "都市更新三種方式？", "back": "<b>重建</b>（拆除重新建築）、<b>整建</b>（保持良好狀況、不拆除）、<b>維護</b>（強制修建，必要時對部分徵收拆除）。不願權利變換領現金：減徵土增稅<b>40%</b>。", "mc": 4, "ex": ["111-9", "108-8", "104-20", "103-40"]}, {"id": "L035", "cat": "區域・國土・都市計畫", "front": "都市計畫迅行變更事由？", "back": "①重大事變毀損　②避免重大災害　③國防或經濟發展需要　④配合重大設施。陷阱：<b>土地權利人權利遭受重大損失</b>不是事由。通盤檢討：每<b>3年或5年</b>內至少一次。", "mc": 1, "ex": ["109-6"]}, {"id": "L036", "cat": "平均地權・重劃・收買", "front": "規定地價與申報地價？", "back": "每<b>2年</b>重新規定；申報地價在公告地價<b>80%～120%</b>；超過120%按120%；<b>未滿80%得照價收買或按80%</b>；<b>未申報者按80%</b>。", "mc": 25, "ex": ["113-21", "112-3", "112-21", "111-3"], "kou": "二年一重定，查一年價，三十日，八折〔自編〕"}, {"id": "L037", "cat": "平均地權・重劃・收買", "front": "公告地價 vs 公告土地現值？", "back": "公告地價→課<b>地價稅</b>（隨重新規定地價）；公告土地現值→課<b>土地增值稅</b>（<b>每年1次</b>，1月1日），應接近市價。", "mc": 38, "ex": ["112-4", "112-23", "111-22", "110-4"]}, {"id": "L038", "cat": "平均地權・重劃・收買", "front": "累進起點地價？", "back": "扣除<b>工業用地、礦業用地、農業用地及免稅土地</b>後，<b>七公畝</b>之平均地價；報<b>財政部及內政部</b>備查。<br><b>七公畝</b>＝700㎡（1公畝＝100㎡），約<b>212坪</b>，是算「累進起點地價」的面積基準（每七公畝的平均地價），不是你持有土地的面積。<br>另外「自用住宅」地價稅與土增稅一生一次的非都市面積上限也是 <b>7 公畝</b>（都市 3 公畝，見 L069、L076）。<br>⚠️條文§16 逐字待核。", "mc": 14, "ex": ["113-21", "112-2", "112-5", "110-19"]}, {"id": "L039", "cat": "平均地權・重劃・收買", "front": "市地重劃法定共同負擔十項用地？", "back": "道路、溝渠、兒童遊樂場、鄰里公園、國民小學、國民中學、停車場、廣場、綠地、零售市場。陷阱：<b>機關用地、國民住宅用地不屬之</b>。", "mc": 7, "ex": ["111-23", "111-24", "104-8", "104-9"], "kou": "路溝・兒鄰廣綠・小中・停市（道路、溝渠｜兒童遊樂場、鄰里公園、廣場、綠地｜國小、國中｜停車場、零售市場）〔自編〕"}, {"id": "L040", "cat": "平均地權・重劃・收買", "front": "抵費地重點？", "back": "抵付重劃負擔而保留之土地，出售<b>不計徵土地增值稅</b>；直轄市有抵費地得<b>自行公開標售</b>（免議會、內政部、行政院同意）。", "mc": 4, "ex": ["113-18", "109-5", "104-10", "102-33"]}, {"id": "L041", "cat": "平均地權・重劃・收買", "front": "重劃禁限期間與異議？", "back": "公告禁止移轉、分割、建築等，最長<b>1年6個月</b>；已取得建照並開工者可繼續施工。分配結果異議：先<b>調處</b>，不成報上級主管機關<b>裁決</b>（§60-2），不服循行政救濟。", "mc": 1, "ex": ["104-11"]}, {"id": "L042", "cat": "平均地權・重劃・收買", "front": "自辦市地重劃同意門檻？", "back": "私有土地所有權人<b>過半數</b>，且所有土地面積<b>超過私有總面積過半</b>之同意。獎勵：減半收登記費、低利貸款、減免地價稅等。", "mc": 5, "ex": ["114-20", "109-5", "102-33", "100-19"], "kou": "重劃同意＝人半數＋面積半數，抵付上限 45%〔自編〕"}, {"id": "L043", "cat": "平均地權・重劃・收買", "front": "出租耕地因重劃的補償？", "back": "政府註銷租約（§63）；分配土地者，承租人得向出租人請求補償：重劃計畫書公告當期公告土地現值<b>之1/3（不扣預計土增稅）</b>；未分配者，補償地價出租人2/3、承租人1/3。對比§77終止租約：扣預計土增稅後餘額1/3。", "mc": 4, "ex": ["108-14", "107-11", "105-40", "102-9"], "kou": "有分給房東，租客拿一份（1/3）；沒分給房東，東二客一（2/3、1/3）；三七五扣完稅才 1/3〔自編〕"}, {"id": "L044", "cat": "平均地權・重劃・收買", "front": "空地稅與荒地稅？", "back": "空地稅：按應納地價稅基本稅額加徵<b>2～5倍</b>；荒地稅：農地閒置，加徵田賦<b>1～3倍</b>，加徵滿<b>3年</b>仍不使用得照價收買（以收買當期公告土地現值）。", "mc": 5, "ex": ["112-21", "106-39", "105-1", "104-7"], "kou": "空地二到五，不建就收買；荒地一到三，滿三年收買〔自編〕"}, {"id": "L045", "cat": "平均地權・重劃・收買", "front": "空地認定：10% vs 20%？", "back": "平均地權條例（空地稅）：建築改良物價值不及基地申報地價<b>10%</b>＋經政府認定應增改建；土地法§87：不及<b>20%</b>視為空地。兩者不同勿混。", "mc": 3, "ex": ["112-21", "106-39", "100-8"]}, {"id": "L046", "cat": "平均地權・重劃・收買", "front": "照價收買五種時機？", "back": "①申報地價逾±20%無法調整　②空地逾期未建　③荒地稅滿3年仍閒置　④超過最高面積限額逾期未出售／使用　⑤依限期建築通知，與承租人協議不成後仍未建築。收買後歸<b>直轄市、縣（市）有</b>。", "mc": 14, "ex": ["114-11", "112-21", "109-13", "108-3"], "kou": "價・空・荒・限・建（申報地價、空地、荒地、超限面積、限期建築）〔自編〕"}, {"id": "L047", "cat": "平均地權・重劃・收買", "front": "實價登錄（申報登錄）罰則？", "back": "申報價格或面積資訊不實／未依限申報：先限期改正，屆期未改正處<b>6千～3萬</b>；已辦移轉登記仍未申報（§81-2）<b>3萬～15萬</b>。登錄資訊<b>不當然作為課稅依據</b>（陷阱）。", "mc": 5, "ex": ["113-2", "112-10", "111-25", "110-9"], "kou": "登錄不等於課稅：配套立法完才算〔自編〕"}, {"id": "L048", "cat": "平均地權・重劃・收買", "front": "預售屋轉售規定（§47-4）？", "back": "簽約後不得讓與或轉售第三人；例外：配偶、直系血親、二親等內旁系血親；經公告核准者全國每<b>2年1戶（棟）</b>為限。違規罰<b>50萬～300萬</b>（§81-3）。", "mc": 4, "ex": ["113-1", "112-9", "111-25", "110-10"], "kou": "簽約不轉售；三親可例外（配偶・直系・二親等內旁系）；核准2年1戶；違規罰五十到三百〔自編〕"}, {"id": "L049", "cat": "平均地權・重劃・收買", "front": "私法人買住宅？", "back": "應檢具使用計畫，經<b>中央主管機關許可</b>（合議制），許可有效期限<b>1年</b>；登記後<b>5年內</b>不得預告登記、移轉、讓與、預售。", "mc": 1, "ex": ["113-3"], "kou": "許一年，鎖五年〔自編〕"}, {"id": "L050", "cat": "土地徵收", "front": "徵收評估公益性、必要性應考量？", "back": "社會、經濟、<b>文化及生態</b>、永續發展因素。陷阱：<b>地價因素</b>不在內。原則：公益性、必要性、<b>比例原則</b>（最後手段）。", "mc": 1, "ex": ["102-2"]}, {"id": "L051", "cat": "土地徵收", "front": "協議價購（§11）價格基準？", "back": "<b>市場正常交易價格</b>（不是公告土地現值，也不是公告現值加成）；協議價購時他人的<b>優先購買權不適用</b>。", "mc": 5, "ex": ["113-8", "111-9", "105-26", "101-9"]}, {"id": "L052", "cat": "土地徵收", "front": "特定農業區農牧用地徵收？", "back": "原則不得徵收；例外：<b>國防所必須</b>或<b>行政院核定之重大建設</b>。重大建設爭議須辦<b>聽證</b>，一般徵收辦<b>公聽會</b>。", "mc": 5, "ex": ["114-3", "113-8", "112-14", "107-12"]}, {"id": "L053", "cat": "土地徵收", "front": "徵用逾3年時？", "back": "徵用逾<b>3年</b>（或合計逾3年）須先書面通知；所有權人收到通知<b>30日</b>內得請求<b>徵收所有權</b>（土徵§58Ⅱ）。⚠️舊官方答案107-13寫6年，現行為3年。", "mc": 2, "ex": ["107-13", "99-19"]}, {"id": "L054", "cat": "土地徵收", "front": "一般土地徵收補償標準？", "back": "徵收當期<b>公告土地現值</b>，必要時依地價評議委員會評定之市價變動幅度<b>加成</b>（無40%上限）。公共設施保留地：毗鄰非保留地平均公告現值，加成最高<b>40%</b>。", "mc": 9, "ex": ["109-9", "109-11", "108-14", "107-11"]}, {"id": "L055", "cat": "土地徵收", "front": "建築改良物與農作改良物補償？", "back": "建築改良物：<b>重建價格</b>；農作改良物：與孳息成熟相距<b>≦1年</b>按<b>成熟時孳息</b>，<b>＞1年</b>按<b>種植及培育費用</b>並參酌現值。", "mc": 14, "ex": ["114-22", "113-6", "111-2", "111-21"]}, {"id": "L056", "cat": "土地徵收", "front": "地價變動調查週期？", "back": "各直轄市縣市主管機關每<b>6個月</b>調查地價動態，提交地價評議委員會評定市價變動幅度（土徵§30）。", "mc": 1, "ex": ["103-6"]}, {"id": "L057", "cat": "土地徵收", "front": "先行使用（公共安全急需）可限於？", "back": "<b>國防、交通、水利</b>事業。陷阱：社會福利、環境保護、公共衛生、平價住宅<b>不在內</b>。", "mc": 2, "ex": ["111-10", "101-8"]}, {"id": "L058", "cat": "土地徵收", "front": "補償費專戶保管？", "back": "受領遲延、拒絕或不能受領：補償費發給期限屆滿次日起<b>3個月內</b>存入國庫專戶，<b>視同補償完竣</b>（不適用提存法）；逾<b>15年</b>未領歸屬國庫。", "mc": 6, "ex": ["113-7", "112-13", "110-12", "109-15"], "kou": "三個月存專戶，十五年歸國庫〔自編〕"}, {"id": "L059", "cat": "土地徵收", "front": "徵收權利義務何時終止？", "back": "受補償費<b>發給完竣時</b>終止（不是公告徵收、公告期滿或登記完成時）。申請抵價地者：舊官方答案＝抵價地<b>點交接管時</b>；⚠️現行土徵§40＝<b>接到核定發給抵價地通知時</b>。", "mc": 5, "ex": ["107-15", "105-40", "104-15", "101-1"]}, {"id": "L060", "cat": "土地徵收", "front": "區段徵收抵價地比例？", "back": "原則<b>50%</b>；上級核准特殊情形不得少於<b>40%</b>；曾辦農地重劃部分不得少於<b>45%</b>。申請發給抵價地須在<b>徵收公告期間內</b>書面申請。", "mc": 18, "ex": ["114-9", "111-10", "111-11", "111-17"], "kou": "50 為準，40 打底；農重劃 45〔自編〕"}, {"id": "L061", "cat": "土地徵收", "front": "抵價地第一次移轉原地價？", "back": "以原所有權人<b>實際領回抵價地之地價</b>為原地價（非徵收當期公告現值）；第一次移轉土增稅<b>減徵40%</b>；現金補償者<b>免徵</b>。", "mc": 5, "ex": ["106-4", "105-8", "104-34", "103-19"]}, {"id": "L062", "cat": "土地徵收", "front": "區段徵收後可建築土地處理？", "back": "抵價地發還；國宅、安置、專案核准用地得<b>讓售</b>；道路、公園、綠地、兒童遊樂場、廣場、停車場、體育場所、國民學校用地<b>無償登記</b>為地方有（§44；零售市場不在其中）；其餘可<b>標售、標租、設定地上權</b>，標租不逾<b>99年</b>。", "mc": 10, "ex": ["113-18", "111-17", "108-23", "106-4"]}, {"id": "L063", "cat": "土地徵收", "front": "撤銷徵收 vs 廢止徵收？", "back": "<b>撤銷</b>：徵收本身有瑕疵（如作業錯誤致土地不在用地範圍）；<b>廢止</b>：開始使用前事業改變、計畫註銷，或開始使用後已無徵收必要。均由<b>需用土地人</b>向中央主管機關申請。", "mc": 8, "ex": ["113-5", "112-14", "111-11", "111-19"]}, {"id": "L064", "cat": "土地徵收", "front": "原所有權人收回權（土徵§9）？", "back": "徵收公告之日起<b>20年內</b>申請照原補償價額收回：①補償費發給完竣滿<b>3年</b>未開始使用；②未依核准事業使用；③開始使用後<b>未滿5年</b>不繼續使用。經核准後<b>6個月</b>內繳還補償地價＋加成，逾期視為放棄。<b>區段徵收不適用</b>。", "mc": 6, "ex": ["112-14", "109-11", "106-22", "103-8"], "kou": "二十・三・五・六：20年內申請、3年沒動工、5年內不用、6個月還錢；三種情形＝沒動工／用錯／用不到5年〔自編〕"}, {"id": "L065", "cat": "土地徵收", "front": "徵收後變更目的標售（§59）？", "back": "公告<b>1個月</b>，原所有權人或繼承人有同樣條件<b>優先購買權</b>；他項權利人得申請恢復；<b>區段徵收不適用</b>。", "mc": 2, "ex": ["113-18", "102-24"]}, {"id": "L066", "cat": "地價稅", "front": "地價稅納稅義務人？", "back": "一般：所有權人；<b>典權：典權人</b>（非出典人）；承領：承領人；承墾：耕作權人；信託存續中：<b>受託人</b>；共有：各共有人（得推定一人繳納）。", "mc": 12, "ex": ["114-17", "112-24", "110-7", "108-11"]}, {"id": "L067", "cat": "地價稅", "front": "地價稅代繳（土稅§4）事由？", "back": "權屬不明、納稅義務人行蹤不明、<b>無人管理</b>、所有權人申請由占有人代繳：由稽徵機關指定<b>土地使用人</b>代繳。<b>抵付地租／求償只限前三款</b>；所有權人申請占有人代繳（有同意書）<b>不得求償</b>（§4Ⅲ）。", "mc": 1, "ex": ["112-24"]}, {"id": "L068", "cat": "地價稅", "front": "地價稅稅率級距？", "back": "基本稅率<b>10‰</b>；超過累進起點未達5倍<b>15‰</b>；5～10倍<b>25‰</b>；10～15倍<b>35‰</b>；15～20倍<b>45‰</b>；20倍以上<b>55‰</b>。陷阱：5～10倍不是20‰。", "mc": 18, "ex": ["114-4", "114-24", "113-21", "112-1"], "kou": "15→25→35→45→55（第一級後每級 +10）"}, {"id": "L069", "cat": "地價稅", "front": "自用住宅用地2‰要件？", "back": "本人、配偶或直系親屬辦竣戶籍、無出租營業；都市<b>3公畝</b>、非都市<b>7公畝</b>以內；建物須為本人／配偶／直系親屬所有；全國<b>一處</b>為限。", "mc": 19, "ex": ["114-24", "114-25", "112-1", "112-2"]}, {"id": "L070", "cat": "地價稅", "front": "地價稅免徵情形？", "back": "公有土地供公共使用；古蹟、歷史建築所定著土地；公共設施保留地<b>未使用且與使用中土地隔離</b>；政府機關、地方自治機關、合法立案私立學校用地。", "mc": 12, "ex": ["114-25", "112-1", "111-24", "109-4"]}, {"id": "L071", "cat": "地價稅", "front": "事業直接使用土地的 10‰ 稅率（地價稅），不包含哪一類土地？", "back": "工業用地、礦業用地等按<b>10‰</b>；陷阱：<b>農業用地不在內</b>（另依田賦／農地稅率）。", "mc": 1, "ex": ["103-27"]}, {"id": "L072", "cat": "地價稅", "front": "信託土地地價稅？", "back": "信託關係存續中納稅義務人為<b>受託人</b>；<b>受益人為委託人</b>者，與委託人同一縣市其他土地<b>合併計算地價總額</b>。", "mc": 19, "ex": ["114-5", "113-23", "111-6", "110-22"]}, {"id": "L073", "cat": "地價稅", "front": "地價稅免稅起徵點？", "back": "每年（期）每戶稅額在新臺幣<b>100元以下</b>免課徵（田賦：每戶未滿1賦元免徵）。", "mc": 0, "ex": []}, {"id": "L074", "cat": "土地增值稅", "front": "土增稅稅率（一般）？", "back": "漲價總數額／原地價：<b>100%以下20%</b>；超過100%～200%部分< function fmtBack(s){
  let h=s.replace(/([^\n>])([①②③④⑤⑥⑦⑧⑨⑩])/g,'$1<br>$2').replace(/(<br>)?(陷阱：|⚠️)/g,'<br>$2');
  if(!/[①②③④⑤⑥⑦⑧⑨⑩]/.test(s) && s.length>60) h=h.replace(/；(?!<br>)/g,'；<br>');
  return h.replace(/(<br>\s*){2,}/g,'<br>');
}
function mcInfo(c){
  const n=c.mc||0;
  return n? ('歷屆約 '+n+' 題') : '題庫無直接對應';
}
function fitCard(){
  const back=document.querySelector('.face.back'), front=document.querySelector('.face:not(.back)');
  cardEl.style.minHeight='320px';
  const need=Math.max(320,back.scrollHeight,front.scrollHeight);
  cardEl.style.minHeight=(need+4)+'px';
}
window.addEventListener('resize',fitCard);
const badgeMasteryFront = document.getElementById('badgeMasteryFront');
const badgeMasteryBack = document.getElementById('badgeMasteryBack');
const footFront = document.getElementById('footFront');
const footBack = document.getElementById('footBack');
const curNum = document.getElementById('curNum');
const totalNum = document.getElementById('totalNum');
const catName = document.getElementById('catName');
const progFill = document.getElementById('progFill');
const masteryControls = document.getElementById('masteryControls');
const quizControls = document.getElementById('quizControls');
const revealBtn = document.getElementById('revealBtn');
const quizRight = document.getElementById('quizRight');
const quizWrong = document.getElementById('quizWrong');
const quizStatsBar = document.getElementById('quizStatsBar');
const quizOk = document.getElementById('quizOk');
const quizNg = document.getElementById('quizNg');
const breakdownPanel = document.getElementById('breakdownPanel');

const SKEY='land_flashcard_mastery_v1';
async function loadMastery(){
  try{const v=localStorage.getItem(SKEY);if(v)mastery=JSON.parse(v);}catch(e){mastery={};}
}
async function saveMastery(){
  try{localStorage.setItem(SKEY,JSON.stringify(mastery));}catch(e){}
}

function paintChips(){
  document.querySelectorAll('.chip[data-cat]').forEach(chip=>{
    const cat=chip.dataset.cat, on=activeCats.has(cat);
    chip.classList.toggle('active',on);
    chip.style.background=on?CAT_COLORS[cat]:'transparent';
    chip.style.color=on?'#fff':'';
    chip.style.borderColor=CAT_COLORS[cat];
  });
}
Object.keys(CAT_COLORS).forEach(cat=>{
  const count = CARDS.filter(c=>c.cat===cat).length;
  const f = CAT_FREQ[cat];
  const chip = document.createElement('div');
  chip.className='chip active';
  chip.textContent=`${cat} ${f?f.stars:''} (${count})`;
  chip.dataset.cat=cat;
  chip.addEventListener('click',()=>{
    const solo = activeCats.size===1 && activeCats.has(cat);
    activeCats = solo ? new Set(Object.keys(CAT_COLORS)) : new Set([cat]);
    paintChips();
    rebuildDeck();
  });
  chipsEl.appendChild(chip);
});
paintChips();

resetBtn.addEventListener('click',()=>{
  activeCats = new Set(Object.keys(CAT_COLORS));
  paintChips();
  rebuildDeck();
});

function renderStatusRow(){
  const inCat = CARDS.filter(c=>activeCats.has(c.cat));
  const masteredCount = inCat.filter(c=>mastery[c.id]==='mastered').length;
  const reviewCount = inCat.length - masteredCount;
  statusRow.innerHTML = '';
  const defs = [
    {key:'all', label:`全部 (${inCat.length})`, cls:''},
    {key:'review', label:`🔄 待複習 (${reviewCount})`, cls:'review'},
    {key:'mastered', label:`✅ 已掌握 (${masteredCount})`, cls:'mastered'}
  ];
  defs.forEach(d=>{
    const chip=document.createElement('div');
    chip.className='chip '+d.cls+(statusFilter===d.key?' active':'');
    chip.textContent=d.label;
    chip.addEventListener('click',()=>{
      statusFilter = d.key;
      rebuildDeck();
    });
    statusRow.appendChild(chip);
  });
}

function rebuildDeck(){
  renderStatusRow();
  let pool = CARDS.filter(c=>activeCats.has(c.cat));
  if(statusFilter==='review') pool = pool.filter(c=>mastery[c.id]!=='mastered');
  if(statusFilter==='mastered') pool = pool.filter(c=>mastery[c.id]==='mastered');
  deck = pool.length ? pool : CARDS.filter(c=>activeCats.has(c.cat));
  idx = 0;
  render();
}

document.getElementById('tabStudy').addEventListener('click',()=>switchMode('study'));
document.getElementById('tabQuiz').addEventListener('click',()=>switchMode('quiz'));
function switchMode(m){
  mode = m;
  document.getElementById('tabStudy').classList.toggle('active', m==='study');
  document.getElementById('tabQuiz').classList.toggle('active', m==='quiz');
  masteryControls.style.display = (m==='study') ? 'flex' : 'none';
  quizControls.style.display = (m==='quiz') ? 'flex' : 'none';
  quizStatsBar.style.display = (m==='quiz') ? 'flex' : 'none';
  if(m!=='quiz'){ breakdownPanel.style.display='none'; }
  revealed = false;
  flipped = false;
  render();
}

function render(){
  const c = deck[idx];
  const color = CAT_COLORS[c.cat];
  flipped = (mode==='quiz') ? revealed : false;
  cardEl.classList.toggle('flipped', flipped);
  termText.textContent = c.front;
  let ah = fmtBack(c.back);
  if(c.kou){ ah += '<div class="kou"><i>口訣</i>'+c.kou.replace(/〔自編[^〕]*〕/,function(m){return '<span style="font-weight:500;font-size:12px;color:var(--ink-soft)">'+m+'</span>';})+'</div>'; }
  ah += '<div class="exm"><b>歷屆題庫：</b>'+(c.mc? ('約 '+c.mc+' 題相關'+(c.ex&&c.ex.length?'（例：'+c.ex.join('、')+'）':'')) : '查無直接對應題（不代表不考）')+'<br>以關鍵詞比對 99–114 年題庫估計，非逐題人工分類。</div>';
  answerText.innerHTML = ah;
  mcBadgeFront.textContent = mcInfo(c); mcBadgeBack.textContent = mcInfo(c);
  badgeFront.textContent = c.cat;
  badgeFront.style.background = color;
  badgeBack.textContent = c.cat;
  badgeBack.style.background = color;
  const fq = CAT_FREQ[c.cat];
  const fl = fq ? `${fq.stars} ${fq.count}題` : '';
  freqBadgeFront.textContent = fl;
  freqBadgeBack.textContent = fl;
  document.querySelector('.face.back').style.borderLeftColor = color;
  const m = mastery[c.id];
  const icon = m==='mastered' ? '✅' : '';
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
  curNum.textContent = idx+1;
  totalNum.textContent = deck.length;
  const tc=document.getElementById('totalCards'); if(tc) tc.textContent=CARDS.length;
  catName.textContent = '・' + c.cat;
  progFill.style.width = ((idx+1)/deck.length*100)+'%';

  if(mode==='study'){
    footFront.textContent = '點擊卡片　看解析 ▸';
    footBack.textContent = '◂ 點擊卡片　回題目';
  } else {
    footFront.textContent = '點擊卡片 或「顯示答案」▸';
    footBack.textContent = '看完後請點　答對／答錯';
    revealBtn.style.display = revealed ? 'none' : '';
    quizRight.style.display = revealed ? '' : 'none';
    quizWrong.style.display = revealed ? '' : 'none';
  }
  fitCard();
}

cardEl.addEventListener('click',()=>{
  if(mode==='study'){
    flipped=!flipped;
    cardEl.classList.toggle('flipped',flipped);
  } else {
    if(!revealed){ revealed=true; render(); }
  }
});

function goNext(){
  idx=(idx+1)%deck.length;
  revealed=false; flipped=false;
  render();
}
function goPrev(){
  idx=(idx-1+deck.length)%deck.length;
  revealed=false; flipped=false;
  render();
}
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0; revealed=false; flipped=false; render();
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

document.getElementById('markMastered').addEventListener('click',()=>{
  setMastery('mastered');
});
document.getElementById('markReview').addEventListener('click',()=>{
  setMastery('review');
});
function setMastery(status){
  const c = deck[idx];
  mastery[c.id] = status;
  saveMastery();
  renderStatusRow();
  if(statusFilter!=='all'){
    const stillMatches = (statusFilter==='mastered' && status==='mastered') ||
                          (statusFilter==='review' && status!=='mastered');
    if(!stillMatches){
      let pool = CARDS.filter(cc=>activeCats.has(cc.cat));
      if(statusFilter==='review') pool = pool.filter(cc=>mastery[cc.id]!=='mastered');
      if(statusFilter==='mastered') pool = pool.filter(cc=>mastery[cc.id]==='mastered');
      deck = pool.length ? pool : CARDS.filter(cc=>activeCats.has(cc.cat));
      if(idx>=deck.length) idx=0;
      render();
      return;
    }
  }
  render();
}

quizRight.addEventListener('click',()=>recordAnswer(true));
quizWrong.addEventListener('click',()=>recordAnswer(false));
revealBtn.addEventListener('click',()=>{ revealed=true; render(); });

function recordAnswer(correct){
  const c = deck[idx];
  if(correct){ quizStats.ok++; mastery[c.id]='mastered'; }
  else { quizStats.ng++; mastery[c.id]='review'; }
  if(!quizStats.perCat[c.cat]) quizStats.perCat[c.cat]={ok:0, total:0};
  quizStats.perCat[c.cat].total++;
  if(correct) quizStats.perCat[c.cat].ok++;
  saveMastery();
  renderStatusRow();
  updateQuizStatsBar();
  if(breakdownPanel.style.display!=='none') renderBreakdown();
  goNext();
}

function updateQuizStatsBar(){
  quizOk.textContent = quizStats.ok;
  quizNg.textContent = quizStats.ng;
}

document.getElementById('toggleBreakdown').addEventListener('click',()=>{
  if(breakdownPanel.style.display==='none'){
    renderBreakdown();
    breakdownPanel.style.display='block';
  } else {
    breakdownPanel.style.display='none';
  }
});
function renderBreakdown(){
  const cats = Object.keys(quizStats.perCat);
  if(!cats.length){
    breakdownPanel.innerHTML = '<p style="text-align:center;color:var(--ink-soft);">尚無作答紀錄</p>';
    return;
  }
  let html = '<table>';
  cats.forEach(cat=>{
    const s = quizStats.perCat[cat];
    const pct = Math.round(s.ok/s.total*100);
    html += `<tr><td style="white-space:nowrap;font-weight:700;">${cat}</td>
      <td style="width:100%;"><span class="bar"><span class="bar-fill" style="width:${pct}%;background:${CAT_COLORS[cat]||'var(--green)'}"></span></span></td>
      <td style="white-space:nowrap;text-align:right;">${s.ok}/${s.total}（${pct}%）</td></tr>`;
  });
  html += '</table>';
  breakdownPanel.innerHTML = html;
}

document.getElementById('resetQuiz').addEventListener('click',()=>{
  quizStats = {ok:0, ng:0, perCat:{}};
  updateQuizStatsBar();
  breakdownPanel.style.display='none';
  idx=0; revealed=false; flipped=false; render();
});

document.getElementById('resetMastery').addEventListener('click',async ()=>{
  if(!confirm('確定要清除所有「已掌握」標記嗎？此動作無法復原。')) return;
  mastery = {};
  await saveMastery();
  rebuildDeck();
});

(async function init(){
  await loadMastery();
  renderStatusRow();
  rebuildDeck();
})();
</script>

<script>
function isDark(){var t=document.documentElement.getAttribute('data-theme');if(t==='dark')return true;if(t==='light')return false;return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;}
function applyTheme(dark){document.documentElement.setAttribute('data-theme',dark?'dark':'light');var b=document.getElementById('theme-btn');if(b)b.textContent=dark?'淺色':'深色';}
function toggleTheme(){var next=!isDark();applyTheme(next);try{localStorage.setItem('bx-theme',next?'dark':'light');}catch(e){}}
(function(){try{var s=localStorage.getItem('bx-theme');if(s)applyTheme(s==='dark');else applyTheme(isDark());}catch(e){applyTheme(isDark());}})();
</script>
