<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民法定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root[data-theme="light"]{--bg:#F5F1E6;--ink:#25302C;--red:#A8402B;--gold:#B8782E;--green:#35693F;--card:#FFFEFA;--line:#DDD6C0;--muted:#66726B;--blue:#3A5A7A;--surface2:#EAE6D6;--pri:#2F5D50;--onpri:#FFFFFF;--onc:#FFFFFF;color-scheme:light}
:root{--bg:#F5F1E6;--ink:#25302C;--red:#A8402B;--gold:#B8782E;--green:#35693F;--card:#FFFEFA;--line:#DDD6C0;--muted:#66726B;--blue:#3A5A7A;--surface2:#EAE6D6;--pri:#2F5D50;--onpri:#FFFFFF;--onc:#FFFFFF;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--ink:#E7ECE6;--red:#E8806A;--gold:#D9A863;--green:#7FC18A;--card:#1F2723;--line:#34403A;--muted:#A5B1A8;--blue:#8DB0CE;--surface2:#2A342F;--pri:#84C2AE;--onpri:#10201B;--onc:#10201B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161C19;--ink:#E7ECE6;--red:#E8806A;--gold:#D9A863;--green:#7FC18A;--card:#1F2723;--line:#34403A;--muted:#A5B1A8;--blue:#8DB0CE;--surface2:#2A342F;--pri:#84C2AE;--onpri:#10201B;--onc:#10201B;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:var(--pri);color:var(--onpri);padding:24px 20px 20px;text-align:center}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--red);color:var(--onc);border-color:var(--red)}

/* main */
main{max-width:720px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:18px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--ink);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:rgba(168,64,43,.08);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:rgba(168,64,43,.15)}
.blank.revealed{
  color:var(--red);
  background:rgba(168,64,43,.12);
  border-bottom-color:var(--green);
}
.blank .blank-mask{display:inline}
.blank.revealed .blank-mask{display:none}
.blank .blank-val{display:none;color:var(--red)}
.blank.revealed .blank-val{display:inline}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--red);color:var(--onc)}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:var(--onc)}
.reveal-all-btn.done{background:var(--green);color:var(--onc);border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.section-hint{font-size:11px;color:#AAA09A;margin-bottom:14px;letter-spacing:.3px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:#F0F6EC;border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:var(--red);font-weight:700}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--red);color:var(--onc);font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 模式切換 tab */
.mode-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.mode-tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px 0;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .15s}
.mode-tab.on{color:var(--red);border-bottom-color:var(--red);background:transparent}

/* 測驗模式 */
#quiz-mode{display:none;max-width:720px;margin:0 auto;padding:20px 16px 80px}
#quiz-mode.active{display:block}

/* 章節過濾 */
.quiz-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qf-btn{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.qf-btn.on{background:var(--red);color:var(--onc);border-color:var(--red)}
.qf-all.on{background:var(--ink);border-color:var(--ink)}

/* 題卡 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px 16px;margin-bottom:16px}
.qc-meta{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px}
.qc-chapter{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qc-counter{font-size:11px;color:var(--muted)}
.qc-term{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
  color:var(--red);margin-bottom:14px;text-wrap:balance}
.qc-blank{font-size:14px;line-height:2.4;color:var(--ink);margin-bottom:14px;
  word-break:break-all}
.qc-blank .blank{
  display:inline-block;border-bottom:2px solid var(--red);
  padding:0 3px;color:transparent;background:rgba(168,64,43,.08);
  border-radius:3px;vertical-align:bottom;cursor:pointer;user-select:none;
  transition:color .18s,background .18s;font-weight:700;font-size:13.5px}
.qc-blank .blank:hover{background:rgba(168,64,43,.15)}
.qc-blank .blank.revealed{color:var(--red);background:rgba(168,64,43,.12);
  border-bottom-color:var(--green)}
.qc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qc-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  border-radius:8px;border:1.5px solid;cursor:pointer;transition:all .15s}
.qc-btn-reveal{border-color:var(--red);color:var(--red);background:transparent}
.qc-btn-reveal:hover{background:var(--red);color:var(--onc)}
.qc-btn-all{border-color:var(--green);color:var(--green);background:transparent}
.qc-btn-all:hover{background:var(--green);color:var(--onc)}
.qc-btn-next{border-color:var(--blue);color:var(--blue);background:transparent}
.qc-btn-next:hover{background:var(--blue);color:var(--onc)}
.qc-btn-prev{border-color:var(--muted);color:var(--muted);background:transparent}
.qc-btn-prev:hover{background:var(--muted);color:var(--onc)}
.qc-btn-prev:disabled{opacity:.3;cursor:default}
.qc-btn-prev:disabled:hover{background:transparent;color:var(--muted)}
.qc-answer{display:none;margin-top:10px;padding:10px 14px;
  background:rgba(92,122,74,.12);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85}
.qc-answer.show{display:block}
.qc-answer .key{color:var(--red);font-weight:700}
.qc-answer .src{margin-top:6px;font-size:12px;color:var(--muted)}
.qc-exam-stat{display:none;margin-top:10px;padding:6px 12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px}
.qc-exam-stat.show{display:block}
.qc-exam-stat strong{color:var(--ink)}
/* 主題切換按鈕 */
#theme-btn{position:fixed;top:10px;right:10px;z-index:50;
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.quiz-progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.quiz-done-banner{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.quiz-done-banner .big{font-size:48px;margin-bottom:8px}

/* ===== v2 改版：填空藍／標色／解析面板／固定按鈕列 ===== */
:root{--bk:#245A8C;--bkbg:rgba(36,90,140,.09);--bkbg2:rgba(36,90,140,.17);--hi:#8A5200;--hibg:rgba(184,120,46,.18);--hg:#2E6B3A;--hgbg:rgba(53,105,63,.15);--hp:#6A4F8C;--hpbg:rgba(124,106,142,.18)}
:root[data-theme="light"]{--bk:#245A8C;--bkbg:rgba(36,90,140,.09);--bkbg2:rgba(36,90,140,.17);--hi:#8A5200;--hibg:rgba(184,120,46,.18);--hg:#2E6B3A;--hgbg:rgba(53,105,63,.15);--hp:#6A4F8C;--hpbg:rgba(124,106,142,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bk:#8DB6DC;--bkbg:rgba(141,182,220,.12);--bkbg2:rgba(141,182,220,.22);--hi:#E6B766;--hibg:rgba(217,168,99,.20);--hg:#8FD39A;--hgbg:rgba(127,193,138,.18);--hp:#C7B2E2;--hpbg:rgba(183,166,204,.20)}}
:root[data-theme="dark"]{--bk:#8DB6DC;--bkbg:rgba(141,182,220,.12);--bkbg2:rgba(141,182,220,.22);--hi:#E6B766;--hibg:rgba(217,168,99,.20);--hg:#8FD39A;--hgbg:rgba(127,193,138,.18);--hp:#C7B2E2;--hpbg:rgba(183,166,204,.20)}
.blank,.qc-blank .blank{border-bottom-color:var(--bk);background:var(--bkbg)}
.blank:hover,.qc-blank .blank:hover{background:var(--bkbg2)}
.blank.revealed,.qc-blank .blank.revealed{color:var(--bk);background:var(--bkbg2);border-bottom-color:var(--green)}
.blank .blank-val{color:var(--bk)}
.key{color:var(--bk)!important;font-weight:700}
.answer-note .key,.qc-answer .key{color:var(--bk)!important}
.hi,.hg,.hp{font-weight:700;border-radius:3px;padding:0 2px}
.hi{color:var(--hi);background:var(--hibg)}
.hg{color:var(--hg);background:var(--hgbg)}
.hp{color:var(--hp);background:var(--hpbg)}
.answer-note{background:var(--surface2)}
.an-full{margin-bottom:8px}
.an-sec{margin-top:8px;padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.8;background:var(--card);border:1px solid var(--line)}
.an-sec b.l{display:inline-block;margin-right:6px;font-size:12px;color:var(--pri)}
.an-trap{border-left:3px solid var(--gold)}
.an-mn{border-left:3px solid var(--pri)}
.an-plain{border-left:3px solid var(--blue)}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;background:var(--card)}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:4px 7px;vertical-align:top;text-align:left}
table.cmp th{background:var(--surface2);font-weight:700}
table.cmp td:first-child{white-space:nowrap}
table.cmp td.n{font-weight:700;color:var(--hi);text-align:center}
.es-row{margin:2px 0 10px;font-size:12px}
.es-row summary{cursor:pointer;color:var(--pri);font-weight:700;list-style:none}
.es-row summary::-webkit-details-marker{display:none}
.es-row summary::before{content:"📝 "}
.es-row.none{color:var(--muted)}
.es-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.es-links a{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--pri);color:var(--pri);text-decoration:none;background:var(--card)}
.es-links a.pred{border-style:dashed}
.es-links a:hover{background:var(--pri);color:var(--onpri)}
/* 章節篩選收合 */
details.qf-wrap{margin-bottom:12px}
details.qf-wrap>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;padding:2px 0}
details.qf-wrap>summary::-webkit-details-marker{display:none}
details.qf-wrap .quiz-filter{margin-top:8px}
/* 隨機測試：按鈕列固定在底部，不推擠版面 */
#quiz-mode.active{padding-bottom:24px}
.qc-btns{position:static;display:flex;margin:14px 0 4px;padding:0;gap:6px;flex-wrap:wrap}
.qc-btns .qc-btn{flex:1 1 120px;min-width:0;padding:10px 6px;font-size:14px;white-space:nowrap}
/* 章節瀏覽：各章改為收合清單 */
#nav{display:none!important}
.chapter,.chapter.active{display:block!important}
.ch-title{border-bottom:0!important}
.chtools{display:flex;gap:8px;margin:0 0 12px}
.chtools button{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
details.chd{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0}details.chd:first-of-type{border-top:1px solid var(--line)}details.chd[open]{background:var(--card)}
details.chd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 6px;scroll-margin-top:12px}
details.chd>summary::-webkit-details-marker{display:none}
details.chd>summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;transition:transform .15s}
details.chd[open]>summary::after{transform:rotate(90deg)}
.chn{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;color:var(--ink)}
.chp{font-size:12px;color:var(--pri);background:var(--surface2);border-radius:99px;padding:2px 9px;white-space:nowrap}.chp:empty{display:none}
.chb{padding:0 8px 6px}
#main{max-width:560px}
.qc-exam-stat a.stl{color:var(--pri);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.qc-exam-stat a.stl strong{color:inherit}
/* 響應式：手機單欄；平板加寬；電腦兩欄（寬螢幕三欄） */
@media(min-width:700px){#main{max-width:760px}#quiz-mode{max-width:760px}}
@media(min-width:1100px){
 #main{max-width:1160px;padding:24px 28px}
 #quiz-mode{max-width:860px}
 .chb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start;padding:0 12px 10px}
 .chb>.prog,.chb>.section-hint{grid-column:1/-1}
 .chb>.card{margin-bottom:0}
 .blank-line{font-size:15px}
 .term{font-size:16px}
}
@media(min-width:1600px){
 #main{max-width:1500px}
 .chb{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
<script src="bxm-use.js"></script>
<style id="es-flash-css">details.es-row.es-flash .es-links a{animation:esf 1.8s ease}@keyframes esf{0%,60%{box-shadow:0 0 0 3px var(--gold,#C9A227);background:rgba(201,162,39,.18)}100%{box-shadow:none}}details.es-row.es-flash summary::after{content:"　↓ 點下面任一題開啟";color:var(--gold,#A0781E);font-weight:700}</style></head>
<body>

<button id="theme-btn" onclick="toggleTheme()" title="切換深淺色">☀️</button>
<header>
  <h1>民法概要｜定義填空練習</h1>
  <div class="sub">章節練習 + 隨機測驗模式｜全科 147 題</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab on" id="tab-browse" onclick="setMode('browse')">📖 章節瀏覽</button>
  <button class="mode-tab" id="tab-quiz" onclick="setMode('quiz')">🎲 隨機測驗</button>
</div>

<nav id="nav"></nav>

<main id="main"></main>

<div id="quiz-mode">
  <details class="qf-wrap" id="qf-wrap"><summary id="qf-sum">⚙ 篩選章節（目前：全部章節）</summary><div class="quiz-filter" id="quiz-filter"></div></details>
  <div class="quiz-progress" id="quiz-progress"></div>
  <div id="quiz-card-area"></div>
</div>

<div style="max-width:720px;margin:0 auto;padding:0 16px 40px;font-size:11px;color:var(--muted);line-height:1.8">
<p>※ 條文內容已於 2026-10-08 起對照現行條文（兩個來源）核實，考前仍請以紙本六法為準。</p>
<p>※「選擇 N 次／申論 N 次」＝ 520 題選擇題的題幹與解析、32 題申論的〈相關法條依據〉中，引用該條號的題數（依條號比對，非人工分類）；「尚無歷屆引用紀錄」代表比對不到，不等於不會考。</p>
<p>※ 特留分：兄弟姊妹特留分的刪除（115.7.28 三讀、115.8.17 公布、116.2.17 施行）已兩源核實；本頁依現行條文出題。</p>

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val">${ans}</span></span>`;
  });
  return html;
}


// ── 解析面板（全部顯示）：完整條文＋白話＋口訣＋陷阱＋對照表 ──
function ansHtml(c){
  let h='<div class="an-full">'+c.answer+'</div>';
  if(c.p) h+='<div class="an-sec an-plain"><b class="l">💬 白話</b>'+c.p+'</div>';
  if(c.m) h+='<div class="an-sec an-mn"><b class="l">🎵 口訣</b>'+c.m+'</div>';
  if(c.t) h+='<div class="an-sec an-trap"><b class="l">⚠️ 考試陷阱</b>'+c.t+'</div>';
  if(c.cmp) h+=c.cmp;
  h+='<div class="src">📌 '+c.src+'</div>';
  return h;
}

const HUB='%E6%B0%91%E6%B3%95_%E5%82%99%E8%80%83%E6%8C%87%E6%8F%AE%E4%B8%AD%E5%BF%83.html';
function esLabel(k){const m=ESMAP[k]||{};return (k.indexOf('預')===0?k:k.replace('-','年第')+'題')+'｜'+(m.t||'')}
function esCount(c){const a=(c.es||[]).filter(k=>k.indexOf('預')!==0).length;return [a,(c.es||[]).length-a]}
function esRow(c){
  const n=(c.es||[]).length;
  if(!n) return '<div class="es-row none">📝 相關申論：尚無對應題（歷屆或預測）</div>';
  const [a,b]=esCount(c);
  return '<details class="es-row"><summary>相關申論 '+n+' 題（歷屆 '+a+'・預測 '+b+'）▾</summary><div class="es-links">'+
    c.es.map(k=>'<a class="'+(k.indexOf('預')===0?'pred':'')+'" href="'+HUB+'#essay='+encodeURIComponent(k)+'">'+esLabel(k)+'</a>').join('')+'</div></details>';
}
function openEs(a){const box=a.closest('.quiz-card,.card');const d=box&&box.querySelector('details.es-row');if(!d)return;d.open=true;d.scrollIntoView({block:'center',behavior:'smooth'});d.classList.remove('es-flash');void d.offsetWidth;d.classList.add('es-flash');setTimeout(()=>d.classList.remove('es-flash'),1800);}
function statHtmlOf(c){
  const [a,b]=esCount(c);const parts=[];
  if((c.mc||0)>0) parts.push('選擇 <strong>'+c.mc+'</strong> 次');
  if(a+b>0){
    const lk=(lab,n,ks)=>{ if(!n) return lab+' <strong>0</strong>';
      const h=(ks.length===1)?'href="'+HUB+'#essay='+encodeURIComponent(ks[0])+'"':'href="#" onclick="openEs(this);return false"';
      return '<a class="stl" '+h+'>'+lab+' <strong>'+n+'</strong> ↗</a>'; };
    const es=c.es||[];
    parts.push('申論 '+lk('歷屆',a,es.filter(k=>k.indexOf('預')!==0))+'・'+lk('預測',b,es.filter(k=>k.indexOf('預')===0)));
  }
  return parts.length?parts.join('　｜　'):'尚無歷屆出題紀錄';
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;

// ===測驗模式===
let quizPool = [];        // 所有題目扁平化
let quizQueue = [];       // 本輪隨機排列
let quizIdx = 0;
let quizFilter = 'ALL';   // 'ALL' 或 chapter id

function setMode(mode) {
  const browse = document.getElementById('main');
  const nav = document.getElementById('nav');
  const quizEl = document.getElementById('quiz-mode');
  const tabB = document.getElementById('tab-browse');
  const tabQ = document.getElementById('tab-quiz');
  if (mode === 'browse') {
    browse.style.display = ''; nav.style.display = '';
    quizEl.classList.remove('active');
    tabB.classList.add('on'); tabQ.classList.remove('on');
  } else {
    browse.style.display = 'none'; nav.style.display = 'none';
    quizEl.classList.add('active');
    tabB.classList.remove('on'); tabQ.classList.add('on');
    initQuiz();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach(c => {
        quizPool.push(Object.assign({ chId: ch.id, chLabel: ch.label }, c));
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const allBtn = document.createElement('button');
    allBtn.className = 'qf-btn qf-all on';
    allBtn.textContent = '全部章節';
    allBtn.onclick = () => setQuizFilter('ALL', allBtn);
    filterEl.appendChild(allBtn);
    DATA.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'qf-btn';
      btn.textContent = ch.label;
      btn.onclick = () => setQuizFilter(ch.id, btn);
      filterEl.appendChild(btn);
    });
  }
  startQuizRound();
}

function setQuizFilter(id, btn) {
  quizFilter = id;
  const sm=document.getElementById('qf-sum'); if(sm) sm.textContent='⚙ 篩選章節（目前：'+(id==='ALL'?'全部章節':btn.textContent)+'）';
  const fw=document.getElementById('qf-wrap'); if(fw) fw.open=false;
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  startQuizRound();
}

function startQuizRound() {
  const pool = quizFilter === 'ALL' ? quizPool : quizPool.filter(c => c.chId === quizFilter);
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    let note = '';
    if (quizQueue.length === quizPool.length) {
      if (!quizQueue._counted && window.BXREP && BXREP.readInc) {
        quizQueue._counted = true;
        const cnt = BXREP.readInc(BXREP.PAGE, 1);
        const b = document.querySelector('#bxmRead b'); if (b) b.textContent = cnt;
      }
      note = '<div style="font-size:13px;color:var(--sub,#666);margin-top:8px">已自動記錄「讀過 1 輪」，右下角不用再按＋。</div>';
    } else {
      note = '<div style="font-size:13px;color:var(--sub,#666);margin-top:8px">這輪只練部分章節，不自動記入「讀過 N 輪」；全部 ' + quizPool.length + ' 題做完才會自動記一輪。</div>';
    }
    area.innerHTML = `<div class="quiz-done-banner"><div class="big">🎉</div>本輪 ${quizQueue.length} 題全部完成！${note}<br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(c.answer)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  const qid = 'q' + quizIdx;
  const builtBlank = c.blank.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const plainAns = ans.replace(/<[^>]+>/g, '');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    const idx = ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-qid="${qid}" onclick="toggleQBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span></span>`;
  });

  const statHtml = statHtmlOf(c);

  area.innerHTML = `
    <div class="quiz-card">
      <div class="qc-meta">
        <span class="qc-chapter">${c.chLabel}</span>
        <span class="qc-counter">${quizIdx + 1} / ${quizQueue.length}</span>
      </div>
      <div class="qc-term">${c.term}</div>
      <div class="qc-blank" id="qblank-${qid}">${builtBlank}</div>
      ${esRow(c)}
      <div class="qc-btns">
        <button class="qc-btn qc-btn-prev" id="qbtn-prev-${qid}" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled' : ''}>← 上一題</button>
        <button class="qc-btn qc-btn-reveal" id="qbtn-reveal-${qid}" onclick="revealOneQuizBlank('${qid}')">顯示一個 ▶</button>
        <button class="qc-btn qc-btn-all" onclick="revealAllQuizBlanks('${qid}')">全部顯示</button>
        <button class="qc-btn qc-btn-next" onclick="nextQuiz()">下一題 →</button>
      </div>
      <div class="qc-answer" id="qans-${qid}">${ansHtml(c)}</div>
      <div class="qc-exam-stat" id="qstat-${qid}">${statHtml}</div>
    </div>`;
}

function toggleQBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val = el.querySelector('.blank-val');
  if (val.style.display !== 'none') {
    val.style.display = 'none'; mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = ''; mask.style.display = 'none';
    el.classList.add('revealed');
  }
}

function revealOneQuizBlank(qid) {
  const blanks = document.querySelectorAll(`#qblank-${qid} .blank`);
  for (const b of blanks) {
    if (!b.classList.contains('revealed')) {
      b.querySelector('.blank-mask').style.display = 'none';
      b.querySelector('.blank-val').style.display = '';
      b.classList.add('revealed');
      break;
    }
  }
  // 如果顯示完最後一個，自動全顯示並改按鈕
  const remaining = document.querySelectorAll(`#qblank-${qid} .blank:not(.revealed)`);
  if (remaining.length === 0) {
    revealAllQuizBlanks(qid);
    const revBtn = document.getElementById('qbtn-reveal-' + qid);
    if (revBtn) {
      revBtn.textContent = '下一題 →';
      revBtn.className = 'qc-btn qc-btn-next';
      revBtn.onclick = () => nextQuiz();
    }
  }
}

function revealAllQuizBlanks(qid) {
  document.querySelectorAll(`#qblank-${qid} .blank`).forEach(b => {
    b.querySelector('.blank-mask').style.display = 'none';
    b.querySelector('.blank-val').style.display = '';
    b.classList.add('revealed');
  });
  const ans = document.getElementById('qans-' + qid);
  if (ans) ans.classList.add('show');
  const stat = document.getElementById('qstat-' + qid);
  if (stat) stat.classList.add('show');
}

function nextQuiz() {
  quizIdx++;
  renderQuizCard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function prevQuiz() {
  if (quizIdx > 0) {
    quizIdx--;
    renderQuizCard();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

    const saved = localStorage.getItem('bx-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
