<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>

const QS=[{"year": 99, "num": 13, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲男與乙女為男女朋友關係，甲同意將其名下之豪宅贈與乙，以下之敘述何者錯誤？", "opts": ["甲在未移轉該屋之所有權給乙之前，隨時可以向乙表示反悔，撤銷贈與", "贈與為單獨行為", "甲在未移轉房屋所有權給乙之前，因為電線走火將該屋燒毀時，除非甲有故意重大過失，否則無庸負給付不能之責任", "甲移轉該屋之所有權給乙，乙搬入該屋之後，即使發現該屋漏水嚴重，原則上亦無法請求甲修繕"], "exp": ["✓A. §408 I：贈與物權利未移轉前贈與人得撤銷，但立有字據或履行道德義務者不得撤銷，本題未見字據，情境成立。", "✗B（本題答案）. 贈與須一方無償給與、他方允受（§406），為契約（雙方行為），不是單獨行為。", "✓C. §410：贈與人僅就故意或重大過失對受贈人負給付不能責任，電線走火非故意重大過失者無須負責。", "✓D. §411：贈與物有瑕疵贈與人原則上不負擔保責任（故意不告知或保證無瑕疵例外），故乙原則上無法請求修繕。", "★白話：贈與是『你情我願』的契約，不是甲一人說了算。贈與人責任被大幅減輕（故意重大過失才負責）。陷阱：把贈與誤認為單獨行為。"]}, {"year": 99, "num": 17, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "以下有關租賃關係之敘述何者正確？", "opts": ["租賃物如有修繕之必要，基於使用者付費之原則，應由承租人負擔修繕之費用", "承租人有使用收益租賃物之權利，所以可以自行將房間分租，當二房東", "甲將其房屋出租與乙，言明租期 3 年，有訂立契約書但未公證。至第 2 年時甲將房屋所有權讓與丙，乙得向丙主張該租賃契約仍存在", "租賃之房屋因電線走火發生火災，房屋因而受損時，因承租人未盡善良管理人之責，應負損害賠償責任"], "exp": ["✗A. §429 I：租賃物修繕除契約另有訂定或習慣外，由出租人負擔。", "✗B. §443 I：轉租原則上須經出租人承諾，僅房屋一部分轉租且無反對約定才例外；選項未附條件而概括認為可自行分租，故不成立。", "✓C（本題答案）. §425 I：租賃物交付後所有權讓與第三人，租賃契約對受讓人繼續存在；本題期限3年，未逾§425 II 之5年限制，雖未公證仍適用。", "✗D. §434：承租人失火僅就重大過失負賠償責任，單純未盡善良管理人注意不足以負責。", "★白話：買賣不破租賃——房子換主人，租約照舊，但未公證且逾5年或不定期者例外（§425 II）。陷阱：失火責任限重大過失。"]}, {"year": 100, "num": 1, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "下列關於贈與契約之敘述何者正確？", "opts": ["贈與契約之贈與人對其贈與之物，有瑕疵時，原則上贈與人應負物之瑕疵擔保責任", "贈與契約為無償契約，所以贈與人均可撤銷其贈與", "定期給付之贈與，不因贈與人死亡而失其效力", "贈與人僅就其故意或重大過失，對於受贈人負給付不能之責任"], "exp": ["✗A. 贈與人原則上「不負」物之瑕疵擔保責任（§411），因無償，責任從輕，例外僅在故意不告知瑕疵時負責，原則為不負責。", "✗B. 贈與人撤銷贈與須符合法定要件（如受贈人對贈與人有忘恩負義行為§416），並非任意均可撤銷；已交付者更有限制。", "✗C. 依§415，定期給付之贈與，因贈與人死亡而失其效力，本選項描述相反。", "✓D. 依§410，贈與人因給付不能所生責任，以「故意或重大過失」為限，即僅此情形才負責，正確。"]}, {"year": 100, "num": 2, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "關於租賃契約，下列何者錯誤？", "opts": ["出租人不以所有權人為限", "未立字據之租約無效", "租賃契約之承租人為租賃物之直接占有人，出租人為間接占有人", "租賃契約為有償契約"], "exp": ["✓A. 出租人不以所有人為限，有占有使用權即可出租（如二房東），正確。", "✗B（本題答案）. 租賃契約為「不要式契約」，不以書面為成立要件；口頭租約有效，只是不動產租賃逾一年者應以書面訂立，未以書面者「視為不定期限」（§422），並非無效，「未立字據→無效」之描述錯誤。", "✓C. 承租人直接使用租賃物，為直接占有人；出租人透過承租人間接占有，為間接占有人，正確。", "✓D. 租賃為有償雙務契約（租金對待給付），正確。"]}, {"year": 100, "num": 4, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列何者，非民法所規定關於出租人之義務？", "opts": ["租賃物之交付義務", "對租賃物之修繕義務", "租賃物為動物時，其飼料費之支出", "租賃物為房屋時，該房屋所應繳納之稅金"], "exp": ["✓A. 出租人有交付租賃物義務（§423），正確（屬於出租人義務）。", "✓B. 出租人有修繕義務（§429），正確（屬於出租人義務）。", "✗C（本題答案）. 飼料費是「使用租賃物必要之費用」，若因承租人使用而生，原則上由承租人自行負擔（§432），並非出租人之法定義務，故「飼料費由出租人支出」不是民法明文規定之出租人義務，為非屬出租人義務之選項，即本題答案。", "✓D. 房屋稅等稅捐原則上由出租人（房屋所有人）繳納，屬出租人通常應負擔之費用，正確。"]}, {"year": 100, "num": 9, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲出售土地給乙，交付土地後乙發現實際坪數比契約書所載坪數少 5%。下列敘述，何者錯誤？", "opts": ["若無顯失公平之情形，乙可以請求減少價金或解除契約", "瑕疵擔保責任自土地交付時起經過三年而消滅", "此瑕疵若乙於契約成立時知悉而甲不知，甲不負擔保之責", "乙若不通知甲坪數短少，視為承認其所受領之物"], "exp": ["✓A. §359：物有瑕疵得解除或減少價金，但解除顯失公平者僅得請求減少價金。", "✗B（本題答案）. §365 I：不動產瑕疵之解除權或減價請求權，自物交付後經過五年而消滅，並非三年。", "✓C. §355 I：買受人於契約成立時知其物有瑕疵者，出賣人不負擔保責任。", "✓D. §356：買受人應從速檢查並通知出賣人，怠於通知者視為承認所受領之物。", "★白話：買到有瑕疵的房子要趕快檢查通知；不動產權利消滅期間5年、動產6個月（§365）。陷阱：期間數字混淆。"]}, {"year": 100, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "乙承租甲所有之土地種植果樹，約定租期二年，未訂立字據。關於此案例，下列敘述何者正確？", "opts": ["此為定期租賃契約", "乙於契約成立後，得請求甲為地上權之登記", "若甲於土地交給乙占有後，將土地所有權移轉給丙，乙仍可主張租賃契約對丙成立", "就租賃物應納之一切稅捐，由出租人甲負擔"], "exp": ["✗A. §422：不動產租賃期限逾1年而未以字據訂立者視為不定期租賃，本題兩年未立字據，並非定期租賃。", "✗B. §422-1 地上權登記請求限於租用基地建築房屋，本題為種植果樹，不適用。", "✗C. 本題視為不定期租賃，依§425 II 未公證之不定期租賃不適用買賣不破租賃，乙不得向受讓人丙主張。", "✓D（本題答案）. §427：就租賃物應納之一切稅捐，由出租人負擔。", "★白話：租屋稅金房東付。口頭約定超過一年的不動產租約，法律視為不定期，連帶影響買賣不破租賃的保護。"]}, {"year": 101, "num": 5, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙三人締結合夥契約，並以每月三萬元租金租用甲所有之房屋為共同經營事業之場所。惟因合夥事業經營不順致合夥解散，解散後已無合夥財產清償累計三個月未支付之租金。就積欠之九萬元租金，出租人甲得向乙、丙為如何之主張？", "opts": ["甲僅得分別向乙、丙請求各應支付三萬元", "甲僅得分別向乙、丙請求各應支付四萬五千元", "甲僅得向乙或丙請求應支付六萬元", "甲僅得向乙或丙請求應支付九萬元"], "exp": ["✓A（本題答案）. 甲本身也是合夥人，須自負應分擔之一份；九萬三人均分，甲僅得向乙、丙各請求其分擔額三萬元（§681、§677）。", "✗B. 若乙、丙各負四萬五千元，等於甲不分擔，與合夥人亦應分擔損失之內部關係不符。", "✗C. 甲不得向乙或丙就六萬元全額請求，因甲自己亦為債務人之一，請求範圍限於他人應分擔額。", "✗D. §681 之連帶責任是對外保護第三債權人；甲兼為合夥人，不能請求九萬全額。", "★白話：房東同時是合夥人，自己也要吃一份虧。陷阱：套用 §681 連帶責任而忽略債權人本身也是合夥人。"]}, {"year": 101, "num": 6, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲與乙締結將甲所有 A 屋出售予乙之買賣契約後，A 屋於甲依約交付予乙前因火災燒毀致不能給付。下列敘述何者最正確？", "opts": ["如 A 屋之燒毀係可歸責於甲之事由所致，乙僅須支付二分之一之價金", "如 A 屋之燒毀係可歸責於乙之事由所致，甲僅得請求支付二分之一之價金", "如 A 屋之燒毀係可歸責於甲之事由所致，乙得解除契約", "如 A 屋之燒毀係可歸責於第三人丙之事由所致，乙仍須支付二分之一之價金"], "exp": ["✗A. 可歸責甲致給付不能，乙得依§226 I 請求損害賠償或§256 解除契約，法律無『價金減半』之規定。", "✗B. §267：因可歸責債權人之事由致給付不能，債務人得請求全部對待給付（扣除所免費用與取得利益），並非二分之一。", "✓C（本題答案）. §226 I、§256：可歸責債務人之事由致給付不能，債權人得解除契約並請求損害賠償。", "✗D. 可歸責於第三人而不可歸責雙方者，§225 I 免給付義務、§266 I 乙免為對待給付，並非支付一半。", "★白話：誰的錯誰承擔——債務人的錯，買方可解約求償；買方的錯，賣方照收錢；雙方都沒錯，風險因不可歸責而互免。"]}, {"year": 101, "num": 10, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲對乙有於今年（下同）5 月 31 日到期之買賣價金金錢債權，乙對甲有於 6 月 30 日到期之消費借貸金錢債權。甲於 7 月 1 日主張抵銷，乙於 7 月 5 日回覆同意甲之抵銷的主張。試問：因甲主張抵銷而消滅之債之關係，於何時發生效力？", "opts": ["5 月 31 日", "6 月 30 日", "7 月 1 日", "7 月 5 日"], "exp": ["✗A. 5/31 只是甲之債權屆期，但乙之債權（甲之債務）至6/30始屆期，尚未達雙方均可抵銷。", "✓B（本題答案）. §335 II：抵銷溯及至得為抵銷之時；依通說須兩債務均屆清償期，即6/30，甲7/1單方意思表示（§335 I）即生抵銷。", "✗C. 7/1 為甲為意思表示之日，但抵銷效力依§335 II 溯及得為抵銷之時。", "✗D. 抵銷為單方行為，不需乙同意（§335 I），乙7/5之回覆不影響效力時點。", "★白話：抵銷一說出口就生效，且倒回到雙方都到期的那天。陷阱：誤以為須對方同意或自表示日起生效。"]}, {"year": 101, "num": 13, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲將其所有土地出租予乙建築房屋。下列敘述何者錯誤？", "opts": ["契約成立後，乙得請求甲為地上權之登記", "乙將房屋所有權移轉予丙時，原基地租賃契約對於丙仍繼續存在", "乙出賣房屋時，甲無依同樣條件優先承買之權利", "甲、乙得約定由乙負擔就土地應納之一切稅捐"], "exp": ["✓A. §445規定，租用基地建築房屋者，承租人（乙）於契約成立後得請求出租人（甲）為地上權登記，正確。", "✓B. 乙將房屋移轉給丙，隨同移轉基地之租賃契約（§426-1），原租賃關係對丙繼續有效，正確。", "✗C（本題答案）. 依§426-2，出租人（甲）就租用基地建築房屋，承租人（乙）出賣房屋時，「有依同樣條件優先承買之權」，本選項說「甲無優先承買權」，與法條相反，錯誤，即本題應選答案。", "✓D. 當事人得約定由承租人負擔稅捐（租金或稅的安排屬契約自由），正確。"]}, {"year": 101, "num": 25, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "opts": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "exp": ["✗A. §126：租金請求權之消滅時效為5年，非2年。", "✗B. 買賣不破租賃（§425 I），出賣後租賃關係不因此消滅。", "✓C（本題答案 ✗B. §754 I 隨時終止僅適用連續發生之債務且未定期間者，單一借款且定有期限不適用。", "✗C. 民法並無須催告債權人始能免責之規定；保證人免責事由例如§755 延期未經同意。", "✗D. 終止保證之通知對象為債權人而非主債務人，且本題非連續債務，不適用§754。", "★白話：債權人擅自放寬還款時間，保證人若沒同意就不負責。隨時終止保證僅限連續債務。"]}, {"year": 102, "num": 15, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲承攬乙建設公司之營造工程，在執行承攬事項時，因過失致路人丙受到傷害。下列敘述何者正確？", "opts": ["乙建設公司如非於定作或指示有過失，即不負損害賠償責任", "乙建設公司雖非於定作或指示有過失，但應與甲連帶負損害賠償責任", "乙建設公司賠償丙之損害後，對甲有內部求償權", "乙建設公司應單獨對丙負損害賠償責任，對甲無內部求償權"], "exp": ["✓A（本題答案）. §189：承攬人執行承攬事項不法侵害他人，定作人原則上不負賠償責任，除非定作或指示有過失。", "✗B. 定作人無過失時不與承攬人連帶，只有定作或指示有過失才可能共同負責。", "✗C. 乙原則上無須賠償，亦無代甲負責之內部求償問題；§188 III 求償規定適用於僱傭而非承攬。", "✗D. 乙非單獨負責；無過失時不負責任，有過失時也是與承攬人共同負責。", "★白話：請人蓋房，工人傷到路人，業主原則上不用賠，除非業主指示有錯。陷阱：與僱用人責任（§188）區別。"]}, {"year": 102, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲房東將其所有 A 屋出租給乙房客，嗣後甲因財務問題將 A 屋出售與丙。下列敘述何者正確？", "opts": ["丙擁有 A 屋的所有權，所以丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約未經公證且超過 5 年者，丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約未定期限者，丙可主張隨時終止租賃契約，要求乙房客搬遷", "租期屆滿後，乙得向丙主張返還二個月的押租金"], "exp": ["✗A. §425 I：租賃物所有權讓與時租約對受讓人繼續存在，丙不得逕要求乙搬遷。", "✓B（本題答案）. §425 II：未經公證之不動產租賃，期限逾5年者不適用買賣不破租賃，故丙可要求乙搬遷。", "✗C. 不定期租賃終止須依§450 II、III 先期通知，並非可隨時終止要求搬遷。", "✗D. 題幹未載押租金之約定與交付，且是否由丙承受須視租約是否對受讓人繼續存在，故選項不能成立。", "★白話：買賣不破租賃的例外：未公證且逾5年或不定期。"]}, {"year": 102, "num": 23, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲向乙承租 A 地種植柚子樹，後來政府公告將徵收 A 地。下列敘述何者錯誤？", "opts": ["柚子樹為不動產之出產物，屬於乙所有", "柚子為天然孳息，天然孳息的收取權為土地所有權人乙", "政府徵收乙所有的 A 地，範圍包括甲在 A 地上種植的柚子樹", "政府徵收 A 地之補償金歸屬於乙"], "exp": ["✓A. §66 II：不動產出產物尚未分離者為該不動產之部分，柚子樹屬土地之構成部分，歸土地所有人乙。", "✗B（本題答案）. §70 I：有收取天然孳息權利之人於權利存續期間內取得孳息，承租人甲於租期內有使用收益權（§421 I），收取權人是甲而非乙。", "✓C. 徵收標的為土地及其定著物，土地上之樹木屬土地部分，包括在徵收範圍內。", "✓D. 土地徵收補償金歸土地所有權人乙。", "★白話：孳息歸『有收取權的人』，不一定是所有人。承租人在租期內可收果實。"]}, {"year": 102, "num": 29, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲向乙承租房屋居住，因火災致房屋毀損滅失，乙請求甲損害賠償。下列敘述何者正確？", "opts": ["甲因火災致乙之房屋毀損滅失，構成侵權行為，應負抽象輕過失責任", "甲因火災致乙之房屋毀損滅失，構成侵權行為，應負具體輕過失責任", "甲因火災致乙之房屋毀損滅失，承租人甲僅負重大過失責任", "甲因火災致乙之房屋毀損滅失，承租人甲僅負故意責任"], "exp": ["✗A. §434：承租人失火責任限於重大過失，並非抽象輕過失。", "✗B. 承租人失火不負具體輕過失責任。", "✓C（本題答案）. §434：租賃物因承租人失火而毀損滅失，承租人僅就重大過失負賠償責任。", "✗D. 承租人重大過失即須負責，並非僅限故意。", "★白話：租客失火，只有『重大過失』才賠，輕微疏忽不賠。"]}, {"year": 103, "num": 13, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲將房屋出賣於乙並交付之，但尚未完成移轉登記，乙已支付一半價金，其後該屋因地震而全毀。下列敘述，何者正確？", "opts": ["乙仍應支付全部買賣價金", "甲應承擔一半損失", "乙得解除買賣契約", "甲得主張重建後再交屋"], "exp": ["✓A. 本題關鍵：房屋已「交付」乙（§373，危險自交付時移轉買受人），地震為不可抗力，危險由乙承擔，乙仍須支付全部價金（§373，物之危險自交付時起由買受人負擔），正確。", "✗B. 危險已於交付時移轉乙，甲不須分擔損失。", "✗C. 危險由乙負擔，乙無從解除（危險負擔原則下，乙仍負對待給付義務）。", "✗D. 特定物（房屋）滅失後已無從重建返還相同之物，且危險已移轉乙，甲無義務重建。"]}, {"year": 103, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於居間人之報酬及支出費用，下列敘述何者正確？", "opts": ["契約附有解除條件者，於該條件成就前，居間人不得請求報酬", "居間人因媒介應得之報酬，除契約另有訂定或另有習慣外，應由契約當事人雙方平均負擔", "約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，報酬給付義務人得以意思表示請求酌減之", "居間人違反其對於委託人之義務，而為利於委託人之相對人之行為，或違反誠實及信用方法，由相對人收受利益者，不得向委託人請求報酬，僅得請求償還其支出之必要費用"], "exp": ["✗A. §568 II：契約附停止條件者，條件成就前居間人不得請求報酬；解除條件則契約已生效，居間人得請求報酬。", "✓B（本題答案）. §569 I：居間人因媒介應得報酬，除契約另有訂定或習慣外，由契約當事人雙方平均負擔。", "✗C. §572：報酬過鉅失公平者，須由法院因給付義務人請求酌減，並非自行以意思表示酌減。", "✗D. §571：居間人違反義務而收受相對人利益者，不得向委託人請求報酬及償還費用，並非僅能請求費用。", "★白話：仲介報酬雙方各付一半；報酬過高要找法院酌減。陷阱：停止條件與解除條件的差別。"]}, {"year": 103, "num": 18, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲乙係多年好友，甲長年於國外經商，遂概括委任乙代為管理 A 屋，約定乙就 A 屋得為甲為一切行為。但民法規定，不動產之租賃其期限逾多久者，乙仍須有特別授權？", "opts": ["二年", "一年半", "一年", "半年"], "exp": ["✓A. 依§534第3款，受任人之特別授權事項包含：不動產之租賃期限逾「二年」者，須有特別授權，正確。", "✗B. 一年半無法律明文依據。", "✗C. 一年為一般不動產租賃書面要求（§422逾一年須書面），並非委任特別授權的期限門檻，兩者勿混淆。", "✗D. 半年無法律依據。★必考區分：§534概括委任仍需特別授權的事項包含「不動產之租賃逾2年」、「不動產之買賣或設定負擔」等。"]}, {"year": 103, "num": 19, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於合夥人出資及合夥財產，下列敘述何者正確？", "opts": ["合夥人之出資，得為金錢，其他財產權或勞務，但不得以信用代之", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任", "合夥人之出資及其他合夥財產，為合夥人全體分別共有之集合財產", "合夥因損失而至資本減少時，除合夥契約有特別訂定外，合夥人有補充之義務"], "exp": ["✗A. §667 II：合夥出資得為金錢、其他財產權，或以勞務、信用或其他利益代之，信用亦可出資。", "✓B（本題答案）. §681：合夥財產不足清償合夥債務時，各合夥人對不足額連帶負責。", "✗C. §668：合夥人出資及其他合夥財產為合夥人全體之公同共有，並非分別共有。", "✗D. §669：合夥因損失致資本減少，除契約特別訂定外，合夥人無補充義務。", "★白話：合夥財產是『大家一起公同共有』，不夠還債時合夥人連帶補足。陷阱：公同共有與分別共有。"]}, {"year": 104, "num": 6, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "乙與甲約定，於甲大學畢業時，乙將贈與甲汽車一輛。此項贈與契約所附約款之性質如何？", "opts": ["終期", "始期", "停止條件", "解除條件"], "exp": ["✗A. 終期是指到某一確定期日後法律行為「失效」，本題是到畢業時開始生效，非失效，並非終期。", "✗B. 始期是指到確定期日後法律行為開始生效；「大學畢業」是否發生並不確定（可能退學、休學、未能畢業），故非「確定」到來的期日，非始期。", "✓C. 「大學畢業」為「不確定是否會發生」之事實，符合條件之定義；其成就時使贈與「開始生效」，故為停止條件（§99Ⅰ），正確。", "✗D. 解除條件是條件成就時使「已生效之法律行為失效」；本題是條件成就才生效，非失效，非解除條件。"]}, {"year": 104, "num": 18, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列關於民法規定之贈與契約的敘述，何者正確？", "opts": ["為履行道德上之義務的贈與契約，不得撤銷", "為確認贈與意思，贈與契約須以書面定之", "贈與契約為無償契約，贈與人不負瑕疵擔保責任", "贈與人就其重大過失，對於受贈人不負給付不能之責任"], "exp": ["✓A（本題答案）. §408 II：為履行道德上義務之贈與，不得撤銷。", "✗B. 贈與為不要式契約，口頭即可成立（§406）；書面僅影響撤銷權（§408 II 立有字據不得撤銷）。", "✗C. §411：贈與人原則上不負瑕疵擔保責任，但故意不告知或保證無瑕疵者例外，選項說法絕對化。", "✗D. §410：贈與人就故意或重大過失仍須負給付不能責任。", "★白話：贈與人責任輕，但故意或重大過失仍要負責。道德義務之贈與不能反悔。"]}, {"year": 104, "num": 19, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列關於租賃之敘述，何者錯誤？", "opts": ["租金，得以金錢或租賃物之孳息充之", "不動產之租賃契約，其期限逾一年者，應以字據訂立之", "未以字據訂立之不動產之租賃契約，無效", "租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "exp": ["✓A. §421Ⅱ，租金得以金錢或租賃物之孳息充之，正確。", "✓B. §422，不動產租賃逾一年，應以字據訂立之，正確。", "✗C（本題答案）. §422，未以字據訂立逾一年的不動產租賃，「視為不定期限之租賃」（不是無效），本選項說「無效」與法條規定不符，為錯誤選項，即應選答案。", "✓D. §445，租用基地建築房屋者，承租人於契約成立後得請求出租人為地上權之登記，正確。"]}, {"year": 104, "num": 20, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲出租 A 屋給乙。下列敘述，何者正確？", "opts": ["租賃期間內，甲不願修繕 A 屋漏水之水管，乙得不經催告，逕行終止契約", "A 屋因乙未盡善良管理人之注意致失火燒毀，乙應負損害賠償責任", "若 A 屋是輻射屋，乙雖明知仍承租之，其後乙仍得以其危及健康而終止契約", "依民法第 347 條，租賃契約準用買賣契約「物之瑕疵擔保」規定，故甲依法僅擔保 A 屋於交付時無瑕疵即可"], "exp": ["✗A. §430：出租人未修繕，承租人須定相當期限催告，逾期仍不修繕才得終止契約，不得逕行終止。", "✗B. §434：承租人失火僅就重大過失負責，未盡善良管理人注意尚不足以負責。", "✓C（本題答案）. §424：租賃物有危及承租人健康之瑕疵者，承租人雖於訂約時已知，仍得終止契約。", "✗D. §423：出租人須於租賃關係存續中保持租賃物合於約定使用收益之狀態，並非僅擔保交付時無瑕疵。", "★白話：危害健康的房子，即使租客明知也能退租（§424）。陷阱：失火責任只負重大過失。"]}, {"year": 104, "num": 21, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於民法規定之保證契約。下列敘述，何者正確？", "opts": ["債權人第一次請求清償時，僅得向主債務人請求", "保證人不得僅保證主債務人之債務的一部分", "保證契約由債權人及保證人口頭約定即可成立", "主債務人所有之抗辯，非經其同意，保證人不得主張"], "exp": ["✗A. 債權人可依§745 直接向保證人請求，僅保證人得主張先訴抗辯，非僅得向主債務人請求。", "✗B. 保證人可僅就主債務一部分為保證，保證債務不得重於主債務（§741）。", "✓C（本題答案）. 保證契約為不要式契約，口頭即可成立（最高限額保證另有書面要求，§756-1）。", "✗D. §742 I：主債務人所有之抗辯，保證人得主張之，無須主債務人同意。", "★白話：保證可口頭約定，保證人也可援用主債務人的抗辯。"]}, {"year": 104, "num": 36, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "年甫 16 歲之乙受第三人甲贈與房屋一間，乙之父母丙、丁均健在。下列敘述，何者正確？", "opts": ["丙、丁各得單獨管理該房屋", "非得乙之同意，丙、丁不得使用該房屋", "丙、丁得共同將該房屋出租收取租金", "丙為清償自身之債務，得將該房屋出售並移轉所有權"], "exp": ["✗A. 父母為未成年子女之法定代理人，管理其財產應共同行使（§1088Ⅱ），並非各自單獨管理，選項說「各得單獨管理」不正確。", "✗B. 父母對子女財產有管理權（§1088Ⅰ），無須得乙之同意即可使用，本選項「非得乙之同意不得使用」描述錯誤。", "✓C. 父母共同管理子女財產，包含出租收取租金（管理行為），丙丁共同出租房屋屬正常財產管理，正確。", "✗D. 父母對子女財產之管理行為，係為子女利益，不得以自己之利益損害子女，「為清償自身債務」出售子女房屋屬利益衝突，不得為之（§1088Ⅱ），選項錯誤。"]}, {"year": 105, "num": 9, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲告知乙，若乙願意出國比賽，不管有無得名次，即贈與乙 200 萬元。試問甲乙間之贈與契約的附款為何？", "opts": ["期限", "條件", "負擔", "約款"], "exp": ["✗A. 期限是將來必定到來之事實，出國比賽成否不確定，不屬期限。", "✓B（本題答案）. 出國比賽為將來客觀不確定事實，贈與以之為生效前提，屬停止條件（§99 I）。", "✗C. §412 之負擔是使受贈人負一定給付義務，本題出國比賽為贈與生效之前提，並非受贈人之給付義務。", "✗D. 『約款』並非民法所定附款類型，附款為條件、期限、負擔。", "★白話：『如果…才給』是條件；『受贈後要做…』是負擔。"]}, {"year": 105, "num": 14, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲欲向乙租屋 3 年，雙方僅用通訊軟體 Line 互相協商，乙已於對話中允諾，但後來丙出更高租金，於是乙改將該屋出租給丙並交付之，後來丙得乙之同意將該屋再出租給丁，某日丁因大意未關爐火將該屋燒毀，下列敘述何者正確？", "opts": ["乙可以向丁主張侵權行為責任", "甲可主張乙丙之租賃契約未以書面簽訂，因此無效", "丙可以向丁主張侵權行為責任", "甲可以向丙主張有優先締約權，因此乙丙之租賃契約對甲係屬無效"], "exp": ["✓A（本題答案）. 乙為房屋所有人，丁過失失火燒毀房屋侵害所有權，乙得依§184 I 前段向丁請求侵權行為責任。", "✗B. §422：未以書面訂立僅視為不定期租賃，並非無效，且甲非乙丙租約之當事人。", "✗C. 丙非所有人，其與丁間之損害主要屬轉租契約責任，不能逕以§184 I 前段主張。", "✗D. 租賃無優先締約權，甲不得主張乙丙租約無效。", "★白話：房子被燒，所有人（乙）可向直接侵害人求償。陷阱：未書面租約不是無效。"]}, {"year": 105, "num": 17, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "若買賣標的物為特定物時，買受人不得請求下列那一種物的瑕疵擔保之法定效果？", "opts": ["減價", "解約", "損害賠償", "另行交付他物"], "exp": ["✗A. 物之瑕疵擔保，買受人得請求「減少價金」（§359），正確（可請求）。", "✗B. 買受人得解除契約（§359），正確（可請求）。", "✗C. 若出賣人故意不告知瑕疵，買受人得請求損害賠償（§360），正確（可請求）。", "✓D. 特定物買賣，標的是「該特定物」，買受人不得請求另行交付「他物」（他物是不同的特定物或種類物，特定物買賣本就以該特定物為標的，不能要求替換他物）；只有「種類物」買賣才有請求另行交付無瑕疵之物（§364）的選項，正確。"]}, {"year": 105, "num": 19, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "有關贈與契約之敘述，下列何者正確？", "opts": ["贈與契約一旦成立後，贈與人不得任意撤銷之", "贈與契約為要式契約，因此必須作成贈與契約書", "贈與屬於恩惠行為，故成立贈與契約無須受贈人之同意", "因贈與契約為無償契約，故原則上贈與人不負瑕疵擔保責任"], "exp": ["✗A. 贈與人在交付前得「任意撤銷」（§408Ⅰ），除例外情形（書面、道德義務等）外，成立後仍可撤銷，選項說「不得任意撤銷」錯誤。", "✗B. 贈與契約為不要式契約，不必作成書面（口頭贈與有效），選項錯誤。", "✗C. 贈與為雙方契約，須受贈人「承諾接受」始成立（§406本旨），並非無須同意，選項錯誤。", "✓D. §411，贈與人原則上不負物之瑕疵擔保責任（因無償，責任減輕），但故意不告知瑕疵者除外，正確。"]}, {"year": 105, "num": 20, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依民法之規定，承租人因下列何種情形致失火而使租賃物毀損、滅失者，應對出租人負損害賠償責任？", "opts": ["重大過失", "不可抗力", "具體輕過失", "抽象輕過失"], "exp": ["✓A（本題答案）. §434：承租人因重大過失致失火而使租賃物毀損滅失，應對出租人負賠償責任。", "✗B. 不可抗力係不可歸責，承租人不負責任。", "✗C. §434 限於重大過失，具體輕過失不負責。", "✗D. §434 限於重大過失，抽象輕過失不負責。", "★白話：租客失火，只賠重大過失。"]}, {"year": 106, "num": 1, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關不動產買賣之敘述，何者錯誤？", "opts": ["不動產仲介公司用與不特定之消費者簽定同類委託銷售不動產而先予擬定之契約，屬於定型化契約", "不動產買賣除標的物及價金外，該房地之交付時間、所有權移轉登記時期、價金之給付方式等，通常亦為契約成立之必要之點", "居間人已為報告或媒介而契約不成立者，居間人支出之費用均得請求償還", "約定之違約金是否過高，可斟酌當事人所受損害情形，及債務人如能依約履行時債權人可享受之一切利益"], "exp": ["✓A. 消保法§2 ⑦：企業經營者為與不特定消費者訂立同類契約所提出之契約條款，屬定型化契約，仲介公司先予擬定之委託契約屬之。", "✓B. 依§153 I 當事人就必要之點意思一致契約成立；實務上不動產買賣之交付時間、移轉登記時期、價金給付方式等常被認為必要之點。", "✗C（本題答案）. §569 II：居間人所支出之費用，非經約定不得請求償還，契約不成立時亦同，並非『均得』請求。", "✓D. §252：違約金過高者，法院得減至相當數額，並斟酌債務人如能依約履行時債權人可享受之一切利益。", "★白話：仲介花的錢，除非先約定，否則不能報銷。陷阱：『均得請求』太絕對。"]}, {"year": 106, "num": 3, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲乙是大四同班同學，甲平常騎乘其父丙所贈與之電動機車作為交通工具。某日乙向甲借用該部電動機車，以接送其高中同學到學校所在地之風景名勝地區遊玩。下列有關甲乙間之契約關係的敘述何者錯誤？", "opts": ["甲乙間所訂立之契約為單務契約，乙之返還義務與甲之容忍使用義務間，無同時履行抗辯權之適用", "甲乙間所訂立之契約為要物契約，以物之交付為契約成立之特別要件，必待借用物之交付，契約始得成立", "甲乙間所訂立之契約為使用借貸契約，乙非經甲之同意，不得允許第三人使用該借用物，否則甲得終止契約", "甲乙間所訂立之契約為使用借貸契約，甲對乙不以故意不告知借用物之瑕疵為限，承擔瑕疵擔保的責任，乙因此瑕疵所受之損害，得向甲請求賠償"], "exp": ["✓A. 使用借貸為無償單務契約，借用人返還義務與貸與人容忍使用義務無對價關係，無§264 同時履行抗辯。", "✓B. §464：使用借貸為要物契約，須交付借用物始成立。", "✓C. §467 II：借用人非經貸與人同意不得允許第三人使用借用物，違反時貸與人得依§472 終止契約。", "✗D（本題答案）. §466：貸與人僅就故意不告知借用物瑕疵致借用人受損害者負賠償責任，並非不以故意為限。", "★白話：免費借東西，貸與人只在『故意隱瞞瑕疵』時才賠。陷阱：借貸是要物契約。"]}, {"year": 106, "num": 8, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "依民法規定，關於不動產買賣，下列敘述何者正確？", "opts": ["應作成公證書", "非經登記，不生效力", "非經交付買賣之不動產，不生效力", "因當事人就標的物及其價金互相同意而成立"], "exp": ["✗A. 一般不動產買賣契約（債權行為）不須公證，選項錯誤。", "✗B. 「非經登記不生效力」適用於不動產「物權」變動（§758），而非「買賣契約」（債權行為）本身；買賣契約不以登記為生效要件，選項混淆債權行為與物權行為。", "✗C. 買賣契約為諾成契約，不以交付為成立或生效要件，選項錯誤。", "✓D. 依§345Ⅱ，買賣契約於當事人就標的物及價金互相同意時成立（諾成契約），正確。"]}, {"year": 106, "num": 9, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲有 A 屋，登記為 A 屋所有人。甲將 A 屋贈與乙女。試問，下列敘述何者正確？", "opts": ["非經交付 A 屋，該贈與不生效力", "該贈與應以書面為之", "甲移轉 A 屋所有權予乙前，得撤銷該贈與", "甲遲延交付 A 屋予乙時，乙得請求遲延損害賠償"], "exp": ["✗A. 贈與為諾成契約，意思合致即成立生效，並不以交付為生效要件，選項錯誤。", "✗B. 贈與不要式，無書面要求（書面只是影響能否任意撤銷），選項錯誤。", "✓C. 依§408Ⅰ，贈與物之「權利未移轉前」（本題尚未移轉所有權），贈與人得撤銷其贈與，正確（例外書面贈與或履行道德義務等不得撤銷）。", "✗D. 依§410，贈與人責任以故意或重大過失為限（無償責任從輕），遲延給付之責任標準同此從輕，乙不能主張一般債務不履行之遲延損害賠償（§410特別規定），選項不正確。"]}, {"year": 106, "num": 10, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依民法規定，關於受任人之權利及義務，下列敘述何者正確？", "opts": ["受任人受有報酬者，應以善良管理人之注意，處理委任事務", "受任人未處理委任事務前，不得向委任人請求預付處理委任事務之必要費用", "受任人必有代理權", "受任人不得隨時終止委任契約"], "exp": ["✓A（本題答案）. §535：受任人受有報酬者，應以善良管理人之注意處理委任事務；無報酬者僅負與處理自己事務同一之注意。", "✗B. §545：受任人因處理委任事務，得請求委任人預付必要費用，不必等到處理後才請求。", "✗C. §167：代理權授與是另一個行為，委任契約本身不當然伴隨代理權，委任人可只委託事實行為而不授與代理權。", "✗D. §549 I：當事人任何一方得隨時終止委任契約，受任人也不例外（但於不利委任人之時期終止須賠償，§549 II）。", "★委任是處理事務的債權契約，代理是對外效力的授權，兩者要分開想。陷阱：有償無償決定注意義務高低；§549 雙方都能隨時終止。"]}, {"year": 106, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲有 A 地，登記為 A 地所有人。甲與乙成立承攬契約，由乙承攬 A 地之整地工作。乙不僅整地有瑕疵，而且還趁整地之餘，將有毒廢棄物掩埋於 A 地之下。試問，下列敘述何者錯誤？", "opts": ["甲得請求乙修補瑕疵", "甲依侵權行為法之規定（民法第 184 條第 1 項前半段），得請求乙回復原狀，移除掩埋在 A 地下之有毒廢棄物", "甲得以掩埋有毒廢棄物乃違反保護義務為由，解除契約", "甲得依民法第 495 條第 1 項規定，請求乙賠償 A 地因掩埋有毒廢棄物所減損之價額"], "exp": ["✓A. §493 I：承攬人完成之工作有瑕疵，定作人得定相當期限請求修補。", "✓B. 掩埋毒物侵害甲之 A 地所有權，成立§184 I 前段侵權行為，依§213 I 得請求回復原狀（移除廢棄物）。", "✓C. 乙違反保護甲財產之附隨義務，屬不完全給付之加害給付（§227），債權人得依法解除契約。", "✗D（本題答案）. §495 I 賠償的是「瑕疵本身」（整地瑕疵）所生損害；掩埋毒物致 A 地減損屬瑕疵以外的加害損害，應依§227 II 或侵權行為請求，非§495 I。", "★承攬瑕疵損害（§495）只管工作物自己的瑕疵；瑕疵之外另外造成的損害屬加害給付。陷阱：看到「承攬+損害賠償」就選§495。"]}, {"year": 106, "num": 14, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲對乙負有 1,000 萬元借款債務，丙為甲對乙所負該債務之連帶保證人。試問，下列敘述何者正確？", "opts": ["乙得直接請求丙履行 1,000 萬元保證債務", "乙僅得同時請求甲與丙履行債務", "丙連帶責任之約定無效", "丙負最終責任"], "exp": ["✓A（本題答案）. 連帶保證人與主債務人負連帶責任（§272、§273），且不得主張先訴抗辯（§745、§746①），債權人得直接請求丙履行全部保證債務。", "✗B. §273 I：債權人得對連帶債務人之一人或數人或全體，同時或先後請求全部或一部給付，並非只能同時請求。", "✗C. 連帶責任可由當事人明示約定而成立（§272 II），該約定有效。", "✗D. 主債務人甲才是終局責任人；丙清償後依§749 取得債權人對甲之權利，可向甲求償。", "★連帶保證＝保證人放棄先訴抗辯，債權人可直接找保證人。陷阱：保證人付錢後是向主債務人求償，不是最終負責的人。"]}, {"year": 106, "num": 15, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於合會，下列敘述何者正確？", "opts": ["法人亦得為合會會員", "會首得兼為同一合會之會員", "限制行為能力人亦得為會員", "自然人不得同時為數合會之會首"], "exp": ["✗A. §709-2 I：會首及會員限於自然人，法人不得為合會會員。", "✗B. §709-2 III：會首不得兼為同一合會之會員。", "✓C（本題答案）. §709-2 II：無行為能力人及限制行為能力人不得為會首，但得為會員，故限制行為能力人可為會員。", "✗D. 民法未禁止自然人同時擔任數個合會之會首，此敘述為民法所無之限制。", "★合會只有自然人，會首要完全行為能力。陷阱：限制行為能力人「能當會員、不能當會首」；會首不能兼會員。"]}, {"year": 106, "num": 31, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "就賣方甲與買方乙間訂立之買賣契約，下列敘述何者錯誤？", "opts": ["該買賣標的物因可歸責於甲之事由而滅失，致給付不能者，乙得解除契約並請求損害賠償", "該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，甲得免除該物之給付義務", "該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，乙得免除價金支付之義務", "該買賣標的物因可歸責乙之事由而滅失，致給付不能者，甲不得向乙請求價金之支付"], "exp": ["✓A. 可歸責於甲之給付不能，乙得解除契約（§256→催告後）並請求損害賠償（§226），正確。", "✓B. 不可歸責雙方（危險負擔，§266），甲免給付義務，乙亦免對待給付，正確。", "✓C. 可歸責於買受人（乙）之給付不能，依§267，乙仍須支付全部價金，正確。", "✗D（本題答案）. 可歸責於乙之給付不能，甲「得請求損害賠償」有疑義——§267規定乙仍須支付價金；甲是否「免除給付義務」則因標的已滅失（客觀不能），甲確實無從履行；但「甲得請求損害賠償」在可歸責於乙時適用§267（乙仍付價金），不另有「損害賠償」的適用（乙的價金給付即為甲應受之對待給付），因此甲「得請求損害賠償」之說法有誤，D描述不正確，為應選答案。"]}, {"year": 106, "num": 36, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列有關租賃契約之敘述，何者錯誤？", "opts": ["租賃關係存續中，出租人未使租賃物合於約定使用收益狀態，致承租人未達租賃目的者，承租人得拒絕給付租金", "出租人將已交付承租人之租賃物的所有權讓與他人，承租人與受讓人間仍須另立租賃契約始發生租賃關係", "定有期限之租賃契約，當事人約定得提前終止者，於終止契約前應先期通知", "租賃契約經公證並附有逕受強制執行條款者，當承租人有不付租金、租期屆滿拒不搬遷，或房東不返還押租金時，當事人可直接申請強制執行"], "exp": ["✓A. §423：出租人應保持租賃物合於約定使用收益之狀態；出租人未履行致承租人未達租賃目的，承租人得拒絕給付租金（同時履行抗辯，§264）。", "✗B（本題答案）. §425 I：出租人於租賃物交付後將所有權讓與第三人者，租賃契約對受讓人仍繼續存在（買賣不破租賃），無須另訂契約。", "✓C. §453：定有期限之租賃，約定得提前終止者，終止契約應依§450 III 先期通知。", "✓D. 公證書載明逕受強制執行者，得為執行名義（公證法§13、強制執行法§4 I④）；不付租金、拒不遷讓、不返還押租金均屬可載明事項。", "★買賣不破租賃是法律效果，不須新訂契約，受讓人當然承受。陷阱：§425 要求「交付後」才適用。"]}, {"year": 107, "num": 14, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "下列有關贈與之敘述，何者正確？", "opts": ["贈與係單獨行為", "贈與以物之交付為要件，於物之交付後，贈與行為才為生效", "經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與", "贈與得附有負擔"], "exp": ["✗A. 贈與為雙方契約（須受贈人承諾），非單獨行為，選項錯誤。", "✗B. 贈與係諾成契約，意思合致即成立生效，不以物之交付為成立要件，選項錯誤。", "✗C. §408但書，「經公證」之贈與，贈與人「不得撤銷」（書面公證的贈與有更強的拘束力），本選項說「得隨時撤銷」正好相反，錯誤。", "✓D. 依§412，贈與得附有「負擔」（受贈人須履行一定作為），贈與人於受贈人不履行負擔時得撤銷贈與，正確。"]}, {"year": 107, "num": 17, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於僱傭契約，下列敘述，何者錯誤？", "opts": ["僱傭契約之專屬性較低，故僱用人得將其勞務請求權讓與第三人，無需受僱人同意", "受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償", "定期之僱傭契約，若當事人之一方遇有重大事由，仍得於期限屆至前終止契約", "受僱人因執行職務，不法侵害他人之權利者，原則上係由僱用人與受僱人連帶負損害賠償責任"], "exp": ["✗A（本題答案）. §484 I：僱用人非經受僱人同意，不得將其勞務請求權讓與第三人，故需受僱人同意。", "✓B. §487-1 I：受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償。", "✓C. §489 I：當事人之一方遇有重大事由，其僱傭契約縱定有期限，仍得於期限屆滿前終止。", "✓D. §188 I：受僱人因執行職務不法侵害他人權利，僱用人與行為人連帶負賠償責任（僱用人能證明選任監督無過失者可免責）。", "★僱傭具高度屬人性，勞務請求權讓與與勞務之使用均須對方同意（§484）。陷阱：別因「權利可讓與」就忽略§484 的特別規定。"]}, {"year": 108, "num": 9, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，下列關於租賃契約之敘述何者正確？", "opts": ["甲將自己所有之 A 屋租予乙後，又將 A 屋租予丙並交付占有予丙，乙得知後可向丙主張交付A 屋", "甲將自己所有之 A 屋租予乙，並交付占有予乙後，A 屋竟遭丙無權占有。此時，乙可對丙主張占有物返還請求權", "甲將自己所有之 A 屋租予乙供居住之用，乙雖於訂約時已知 A 屋為輻射屋，但因輻射屋會危及乙的健康，故乙仍得主張減少價金", "甲將自己所有之 A 屋租予乙，約定由甲負修繕義務。按民法規定，乙得自行修繕再請求出租人償還費用"], "exp": ["✗A. 一物二租，兩租賃契約均有效；丙已取得占有，乙不得向丙請求交付，只能向甲主張債務不履行責任。", "✓B（本題答案）. 承租人乙為直接占有人（§941），租賃物被丙無權占有（侵奪）時，乙得依§962 行使占有物返還請求權。", "✗C. §424：租賃物危及承租人健康或安全者，承租人雖訂約時已知其瑕疵，仍得終止契約；法律效果是終止，不是減少價金。", "✗D. §430：出租人負修繕義務而延不修繕時，承租人須先定期催告，逾期仍不修繕，才得自行修繕並請求償還費用；不得未經催告逕自修繕。", "★承租人有占有就有占有保護請求權，不必是所有人。陷阱：自行修繕要「先催告」；輻射屋給的是終止權。"]}, {"year": 108, "num": 11, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，下列關於居間契約之敘述何者錯誤？", "opts": ["稱居間者，謂當事人約定，一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約", "約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，法院得因報酬給付義務人之請求酌減之。報酬已給付者，得請求返還", "因婚姻居間而約定報酬者，就其報酬無請求權", "居間人就其媒介所成立之契約，無為當事人給付或受領給付之權"], "exp": ["✓A. §565：居間為當事人約定，一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約。", "✗B（本題答案）. §572：報酬過鉅失公平，法院得因給付義務人之請求酌減，但報酬已給付者，不得請求返還。", "✓C. §573：因婚姻居間而約定報酬者，其約定無效，居間人就報酬無請求權。", "✓D. §567 I：居間人就其媒介所成立之契約，無為當事人給付或受領給付之權。", "★居間報酬可酌減，但付了就不能要回。陷阱：與§252 違約金酌減不同，這裡「已給付者不得請求返還」。"]}, {"year": 109, "num": 3, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？", "opts": ["於甲與乙簽訂汽車買賣契約時起，由乙承受", "自該車辦理過戶登記於乙時，由乙承受", "自該車交付於乙時起，由乙承受", "於乙支付價金完畢時，由乙承受"], "exp": ["✗A. 買賣契約成立時，危險尚未移轉（交付前仍在甲），成立時由甲承受。", "✗B. 動產危險移轉以「交付」為準（§373），並非以登記（過戶）為準；不動產所有權移轉以登記，但危險移轉仍以「交付」為準，選項錯誤。", "✓C. §373，買賣標的物之利益及危險，自「交付」時起由買受人（乙）承受，無特別約定時以交付為準，正確。", "✗D. 價金支付非危險移轉的依據，依法以交付為準，選項錯誤。"]}, {"year": 109, "num": 8, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列關於房屋租賃之敘述，何者正確？", "opts": ["出租人將租賃之房屋交付承租人後，非經承租人同意，不得將其所有權讓與第三人", "出租人出賣租賃之房屋時，承租人有依同樣條件優先承買之權利", "除有反對之約定外，承租人依法得將其一部分轉租於他人", "房屋租賃之租金，當事人得因其價值之昇降，聲請法院增減之，但以定期租賃為限"], "exp": ["✗A. §425 I 買賣不破租賃：房屋交付後出租人讓與所有權，租約對受讓人繼續存在，無須承租人同意。", "✗B. 一般房屋租賃之承租人無優先承買權；§426-2 的優先承買權僅限於租用基地建築房屋之情形。", "✓C（本題答案）. §443 I 但書：租賃物為房屋者，除有反對約定外，承租人得將其一部分轉租他人。", "✗D. §442：不動產租賃租金得聲請法院增減，但其租賃定有期限者，不在此限，故並非以定期租賃為限（反而排除之）。", "★房屋「一部轉租」可，全部轉租須經承諾。陷阱：§442 增減租金只適用不定期租賃；優先承買權是基地租賃才有。"]}, {"year": 109, "num": 11, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於委任契約受任人之報酬，下列敘述，何者錯誤？", "opts": ["委任關係因可歸責於受任人之事由，而於委任事務處理完畢前經終止者，受任人仍得就已經處理之部分比例請求報酬", "受任人受有報酬之注意義務，高於受任人未受報酬之注意義務", "當事人縱未約定報酬，但依交易習慣或委任事務之性質應給與報酬者，受任人得請求報酬", "除契約另有規定外，原則上於委任關係終止時，受任人須明確報告始末後才能請求報酬"], "exp": ["✗A（本題答案）. §548 II：僅「非可歸責於受任人」之事由而提前終止時，受任人才得就已處理部分比例請求報酬；因可歸責於受任人而終止者不適用。", "✓B. §535：有報酬者以善良管理人注意，無報酬者以處理自己事務同一之注意，前者義務較重。", "✓C. §547：未約定報酬，但依習慣或事務性質應給與報酬者，視為允與報酬。", "✓D. §548 I：應受報酬之受任人，除契約另有訂定外，於委任關係終止及明確報告顛末後，得請求報酬。", "★報酬比例請求以「非可歸責於受任人」為前提。陷阱：記住關鍵字「非」可歸責。"]}, {"year": 109, "num": 12, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將自己所有的違章建築 A 屋賣給乙，有關於買賣違章建築之法律關係。下列敘述，依實務見解，何者錯誤？", "opts": ["土地與土地上之違章建築同屬於一人所有，嗣將違章建築與土地分別讓與相異之人，仍有民法第 425 條之 1 推定租賃關係規定之適用", "違章建築之買受人對於無權占用房屋之人，得行使民法第 767 條之物上請求權", "違章建築遭拍賣，拍定人自取得法院權利移轉證書之日起，取得該違章建築之權利", "甲、乙買賣違章建築，所讓與的是事實上之處分權"], "exp": ["✓A. 實務認為違章建築與土地原屬同一人，其後分別讓與不同人時，類推適用§425-1 推定租賃關係。", "✗B（本題答案）. 違章建築（未辦保存登記）買受人僅取得事實上處分權，並非所有權人，不得行使§767 物上請求權。", "✓C. 實務見解：拍賣違章建築，拍定人自取得權利移轉證書之日起取得其權利（事實上處分權）。", "✓D. 違章建築買賣所讓與者為事實上處分權，非所有權移轉。", "★違建買賣的標的是「事實上處分權」，因此買受人沒有§767 的所有物請求權。陷阱：§425-1 靠實務類推適用違建。"]}, {"year": 110, "num": 1, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲與乙訂立買賣契約，契約條款記載「...價金新臺幣陸拾捌萬元整(NT$860,000)。前揭捌拾陸萬元價金應於訂約後 10 日內支付。」 若嗣後雙方就價金金額爭訟時，法院應如何決定價金？", "opts": ["應認為價金為最後書寫之文字：捌拾陸萬元", "應先探求當事人原意", "應認為價金為兩項金額之平均值：柒拾柒萬元", "如法院不能決定當事人原意，應以數字為準：NT$860,000"], "exp": ["✗A. 契約解釋不是以最後書寫之文字為準，法無此規定。", "✓B（本題答案）. §98：解釋意思表示，應探求當事人之真意，不得拘泥於所用之辭句；文字與數字不符時，應先探求真意。", "✗C. 法無「取平均值」之解釋規則，亦非探求真意之方法。", "✗D. 依民法§4，文字與號碼不符、法院不能決定當事人原意時，應以「文字」為準，不是以數字為準，本選項錯誤。", "★契約解釋第一原則是探求真意（§98）。陷阱：一般契約適用民法§4（不能決定原意→以文字為準）；§5 是「數次表示不符」才以最低額為準，別混。"]}, {"year": 110, "num": 11, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？", "opts": ["同時履行抗辯", "撤銷訴權", "追索權抗辯", "先訴抗辯"], "exp": ["✗A. 同時履行抗辯（§264）：雙務契約一方未提出履行，他方得拒絕己方給付，與保證無關。", "✗B. 撤銷訴權（§244）：債權人撤銷債務人詐害行為之權利，與保證抗辯無關。", "✗C. 追索權見於票據法（票據不獲付款後向前手追索），與民法保證無關。", "✓D. §745「先訴抗辯」（或稱「先訴利益」）：保證人於債權人未先就主債務人財產強制執行無效果前，得拒絕清償，此即先訴抗辯，正確。"]}, {"year": 110, "num": 14, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於合夥的敘述，下列何者正確？", "opts": ["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有", "合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任", "合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"], "exp": ["✗A. §668：合夥人之出資及其他合夥財產，為合夥人全體之公同共有，非分別共有。", "✓B（本題答案）. §669：除有特別訂定外，合夥人無於約定出資外增加出資之義務；因損失致資本減少者，亦無補充義務。", "✗C. §681：合夥財產不足清償合夥債務時，各合夥人對不足之額連帶負責。", "✗D. §690：合夥人退夥後，對於其退夥前合夥所負之債務，仍應負責。", "★合夥財產是公同共有，債務是連帶責任。陷阱：退夥後對退夥前債務仍須負責。"]}, {"year": 110, "num": 15, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於買賣瑕疵擔保的敘述，下列何者正確？", "opts": ["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責", "從物有瑕疵者，買受人得就主物併同從物，解除全部契約", "為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約", "買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"], "exp": ["✗A. §358（買受人保管義務）：由他地送到之物，買受人主張瑕疵不願受領時，如出賣人於受領地無代理人，買受人有暫為保管之責。", "✗B. §362：因主物有瑕疵而解除者效力及於從物；從物有瑕疵者，買受人僅得就從物為解除，不得解除主物或全部契約。", "✓C（本題答案）. §363：數物買賣中一物有瑕疵者，僅就瑕疵物解除；但因瑕疵物與他物分離而顯受損害者，當事人任何一方得解除全部契約。", "✗D. §364 II：另行交付之物，出賣人仍負擔保責任，並非免責。", "★瑕疵解除原則「就瑕疵物」，例外為分離顯受損害才得全部解除（§363）。陷阱：從物瑕疵只能解除從物。"]}, {"year": 111, "num": 13, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何者非屬贈與人或其繼承人，得主張撤銷贈與契約之原因？", "opts": ["附有負擔之贈與，贈與人已為給付而受贈人因過失不履行其負擔者", "受贈人對於贈與人有扶養義務而不履行義務者", "受贈人因故意不法行為致贈與人死亡者", "定期給付之贈與，而受贈人已死亡者"], "exp": ["✓A. §412 I：附負擔之贈與，贈與人已給付而受贈人不履行負擔時，贈與人得請求履行或撤銷贈與。", "✓B. §416 I②：受贈人對贈與人有扶養義務而不履行者，贈與人得撤銷贈與。", "✓C. 受贈人因故意不法行為致贈與人死亡者，贈與人之繼承人得撤銷贈與（§416 II）。", "✗D（本題答案）. 定期給付之贈與，因贈與人或受贈人死亡而失其效力（§415），屬契約失效，並非撤銷原因。", "★本題問「非」撤銷原因：D 是當然失效。陷阱：區分「撤銷」（有形成權）與「失效」（法律規定）。"]}, {"year": 111, "num": 20, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？", "opts": ["解除買賣契約", "請求減少買賣價金", "請求另行交付無瑕疵之物", "故意不告知瑕疵時，請求損害賠償"], "exp": ["✓A. §359，物之瑕疵擔保，買受人得解除契約（物之瑕疵達「重大不符合」程度），正確（可主張）。", "✓B. §359，買受人得請求減少價金，正確（可主張）。", "✗C（應選）. 另行交付無瑕疵之物（請求替換）僅適用於「種類物」（§364）；特定物買賣無從以他物替代（特定物=買的就是這一件），故買受人「不得」請求另行交付他物，為本題「非得主張」之答案。", "✓D. §360，出賣人故意不告知瑕疵者，買受人得請求損害賠償，正確（可主張）。"]}, {"year": 111, "num": 21, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於租賃法律關係之敘述，下列何者正確？", "opts": ["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效", "定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金", "不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權", "租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "exp": ["✗A. §422：不動產租賃逾一年未以字據訂立者，視為不定期租賃，並非無效。", "✗B. §442：定有期限之租賃不得聲請法院增減租金；僅不定期租賃可增減。", "✗C. §445：不動產出租人就租金債權，對於承租人置於該不動產之物享有留置權，而非法定質權。", "✓D（本題答案）. §422-1：租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記。", "★逾一年不動產租賃沒字據→視為不定期，不是無效。陷阱：§445 是「留置權」。"]}, {"year": 112, "num": 6, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？", "opts": ["債權不得作為買賣之標的所以無效", "該買賣標的權利自始不存在，屬於標的不能而無效", "該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保", "甲可依締約上過失向乙請求損害賠償"], "exp": ["✗A. 債權為財產權，得為買賣標的（§348 II 權利買賣），並非不得為標的。", "✗B. 買賣債權時債權已不存在，依§350 出賣人應擔保債權確係存在，足見契約仍屬有效，並非因標的不能而當然無效。", "✓C（本題答案）. 契約有效，債權不存在屬權利瑕疵，出賣人應負權利瑕疵擔保責任（§349、§350）。", "✗D. 締約上過失（§245-1）適用於契約未成立或無效之情形；本題契約有效，應適用瑕疵擔保。", "★權利買賣的標的「不存在」，民法§350 直接用瑕疵擔保處理。陷阱：不要用§246 原始不能或§245-1 套用。"]}, {"year": 112, "num": 9, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依民法之規定，有關租賃契約之效力，下列何者錯誤？", "opts": ["租賃物有修繕之必要時，原則上承租人可直接自行修繕後再請求出租人給付修繕費用", "如租賃物是房屋時，倘出租人無反對之約定，承租人可以將房屋一部轉租", "租賃物因承租人失火而造成損害，承租人僅就重大過失負賠償責任", "租賃物應納之一切稅捐，由出租人負擔"], "exp": ["✗A（本題答案）. §430：租賃物有修繕必要時，承租人須先定期催告出租人修繕，逾期仍不修繕才得自行修繕並請求償還；非原則上得直接自行修繕。", "✓B. §443 I 但書：租賃物為房屋者，除有反對約定外，承租人得將其一部分轉租。", "✓C. §434：租賃物因承租人重大過失致失火而毀損滅失者，承租人負損害賠償責任，輕過失不負責。", "✓D. §427：就租賃物應納之一切稅捐，由出租人負擔。", "★修繕權要「先催告」。陷阱：失火責任限於「重大過失」；稅捐歸出租人。"]}, {"year": 112, "num": 15, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲於民國（下同）107 年 9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣 3 萬元，乙於 108 年 9 月催告後甲仍不為給付，乙便於 109 年 8 月訴請甲給付租金，於 110 年 9 月獲勝訴判決確定。下列何者正確？", "opts": ["乙租車公司的租金請求權時效本為 5 年", "乙於 108 年 9 月催告後 6 個月內未起訴，仍生中斷時效之效力", "乙於 109 年 8 月訴請甲給付租金時，時效不完成", "判決確定後，時效重新起算 5 年"], "exp": ["✗A. 以租賃動產為營業者之租價，請求權時效為二年（§127③），並非五年。", "✗B. §130：時效因請求而中斷者，若於請求後六個月內不起訴，視為不中斷；故催告後未於六個月內起訴，不生中斷效力。", "✗C. §129 I③：起訴為時效中斷事由，並非時效不完成。", "✓D（本題答案）. §137 I、II：時效因起訴中斷，確定判決後重行起算；原期間不滿五年者，重行起算之期間為五年。", "★短期時效經判決確定後一律延為五年（§137 II）。陷阱：催告六個月不起訴視為不中斷；起訴是「中斷」不是「不完成」。"]}, {"year": 112, "num": 16, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣 10 萬元。關於婚姻居間契約，下列何者正確？", "opts": ["甲乙間的契約，無效", "乙得對甲請求給付報酬", "乙對甲無報酬請求權", "婚姻居間契約不得約定報酬"], "exp": ["✗A. 婚姻居間契約本身不違反強行規定或公序良俗（媒人介紹結婚是正常社會行為），契約有效，選項說無效錯誤。", "✗B. 依§573，婚姻居間契約，「報酬請求權不因契約而發生」（婚姻居間報酬依習慣，不能以契約強制請求），乙得不請求報酬（習慣上），但若甲自願給付則乙可受領，選項說「乙得請求」稍有誤。", "✓C. §573，婚姻居間契約，「居間人不得請求報酬」（法律明定婚姻居間不發生報酬請求權），正確。", "✗D. §573前段，婚姻居間契約「雖得約定報酬」（契約自由，約定不違法），但居間人就此項報酬「不得請求」（有約定亦不得強制請求），本選項說「不得約定報酬」錯誤（可以約定，只是不能強制請求）。"]}, {"year": 112, "num": 19, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲在其所有 A 地上興建 B 屋，但 B 屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙訂立 A 地與 B 屋的買賣契約，下列何者錯誤？", "opts": ["B 屋雖為違章建築亦為融通物，得為交易之客體", "甲應將 A 地所有權辦妥移轉登記給乙，乙始取得 A 地所有權", "興建 B 屋時因未為建物所有權保存登記，故甲未取得 B 屋所有權", "甲將B屋讓與乙，乙僅取得對B屋之事實上處分權"], "exp": ["✓A. 違章建築仍為有體物，得為交易客體，屬融通物。", "✓B. §758 I：不動產物權依法律行為而取得者，非經登記不生效力；故A地所有權於移轉登記時取得。", "✗C（本題答案）. 建物於起造完成時，起造人原始取得（事實行為，§759 之反面），不以保存登記為要件，故甲取得B屋所有權（僅無法處分登記）。", "✓D. 違章建築未能辦理移轉登記，買受人僅取得事實上處分權，非所有權。", "★事實行為原始取得所有權不需登記，登記只影響「處分」。陷阱：別把「未登記」等同「無所有權」。"]}, {"year": 113, "num": 3, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？", "opts": ["丙善意取得名畫之所有權", "丙得請求乙損害賠償", "乙與丙之買賣契約有效", "乙與丙之物權契約有效"], "exp": ["✗A. 乙以甲之名義（無代理權）出賣，乙非以自己名義處分，且非有處分權人，丙不能依善意取得（§801、§948）取得所有權。", "✓B（本題答案）. §110：無代理權人以他人代理人名義所為法律行為，對善意相對人負損害賠償責任。", "✗C. 無權代理之買賣契約對本人效力未定（§170 I），經本人拒絕後確定不生效力。", "✗D. 物權契約同為無權代理行為，本人甲不承認故對甲不生效力。", "★無權代理人責任＝§110 損害賠償。陷阱：善意取得需讓與人以自己名義處分，且本題未發生。"]}, {"year": 113, "num": 5, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙 100 萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還 100 萬元？", "opts": ["可以，依據不當得利", "不可，100 萬元為不法原因之給付", "可以，100 萬為違背公序良俗之給付", "可以，依據無因管理"], "exp": ["✗A. 丙雖受領給付，但§180④ 排除不當得利返還請求權。", "✓B（本題答案）. §180④：因不法原因而為給付者，不得請求返還，但不法原因僅於受領人一方存在時不在此限；本題雙方均有不法，不得請求返還。", "✗C. 契約雖因違反公序良俗而無效（§72），但給付之返還仍受§180④ 限制。", "✗D. 丙受領贈與並非為甲管理事務，不成立無因管理（§172）。", "★§180④ 是不當得利之「例外封鎖」。陷阱：契約無效不等於可以要回錢。"]}, {"year": 113, "num": 7, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲與乙訂立租賃契約，將丙所有之 A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？", "opts": ["甲與乙訂立之租賃契約無效", "甲與乙訂立之租賃契約得撤銷", "乙得終止與甲訂立之租賃契約", "乙得以與甲之租賃契約對抗丙"], "exp": ["✗A. 租賃為負擔行為，出租人無處分權亦不影響租賃契約之有效性。", "✗B. 本題無錯誤、詐欺等撤銷原因。", "✓C（本題答案）. 第三人丙起訴請求返還致乙不能使用收益，依§436 準用§349 至§353 關於權利瑕疵擔保及債務不履行規定，乙得終止契約。", "✗D. 租賃權為債權，僅相對效力，不得對抗所有權人丙。", "★出租他人之物契約有效，只是出租人要負權利瑕疵擔保。陷阱：債權不能對抗所有人。"]}, {"year": 113, "num": 8, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "甲將其所有之 A 屋出租於乙，乙未經甲之同意，將 A 屋全部轉租於丙。下列敘述，何者正確？", "opts": ["乙與丙訂立之租賃契約無效", "甲與乙訂立之租賃契約無效", "乙得終止乙與丙之租賃契約", "甲得終止甲與乙之租賃契約"], "exp": ["✗A. 乙丙間之轉租契約（乙以出租人身份與丙簽約）本身成立有效（乙丙雙方合意），只是未得甲同意而違反對甲的義務，乙丙契約本身並非無效。", "✗B. 甲乙間租賃契約並未因乙擅自轉租而無效，選項錯誤。", "✗C. 乙得終止乙丙租賃契約（乙是出租人），但此非本題重點；甲的權利才是問題所在。", "✓D. §443Ⅰ，承租人未得出租人（甲）同意擅自將全部轉租，出租人（甲）得「終止」其與承租人（乙）之租賃契約，正確。"]}, {"year": 113, "num": 11, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲與其 20 歲之兒子乙訂立贈與契約，將甲所有之 A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？", "opts": ["甲得解除贈與契約", "甲得終止贈與契約", "甲得撤銷贈與契約", "甲得撤回贈與契約"], "exp": ["✗A. 贈與契約之救濟為撤銷，非解除。", "✗B. 終止適用於繼續性契約向將來失效，贈與非此類。", "✓C（本題答案）. §416 I②：受贈人對贈與人有扶養義務而不履行者，贈與人得撤銷贈與；已完成登記不影響此撤銷權。", "✗D. §408 之任意撤銷限於「贈與物權利未移轉前」，本題已登記移轉，且民法亦無「撤回」贈與之規定。", "★贈與撤銷有兩類：移轉前任意撤銷（§408）、移轉後法定撤銷（§416）。陷阱：已移轉後只能用法定原因撤銷。"]}, {"year": 114, "num": 11, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲賣給乙一隻狗狗，名喚 S，乙光看甲提供的 S 犬照片就喜歡的不得了，馬上承諾以 10 萬元的價金訂立契約。下列何者錯誤？", "opts": ["若 S 實則在甲、乙訂立契約前已死亡，則甲、乙契約無效", "若 S 身上有跳蚤，並傳染給乙的貓咪 B 和乙家的環境，則甲應負加害給付責任", "若 S 其實是甲母的狗，僅因甲母出國，暫時寄放於甲處，則乙即使已經把 S 抱回家照顧，乙絕不可能取得 S 的所有權", "若乙向甲主張交付 S，甲得主張同時履行抗辯"], "exp": ["✓A. 買賣標的訂約前已滅失屬原始給付不能，契約無效（§246 I 前段）。", "✓B. S 之跳蚤傳染乙之貓與環境，屬瑕疵給付造成固有利益損害，為加害給付，依§227 II 負賠償責任。", "✗C（本題答案）. 動產他人之物，若乙善意受讓並受占有交付，得依§801、§948 善意取得；「絕不可能」取得之敘述過於絕對，錯誤。", "✓D. 買賣為雙務契約，乙請求交付 S，甲得依§264 主張同時履行抗辯（乙未付價金）。", "★動產交易有善意取得保護，非盜贓遺失者受讓人可取得所有權。陷阱：題幹出現「絕不」「一定」多半錯。"]}, {"year": 114, "num": 13, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？", "opts": ["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第 231 條之規定請求贈與人對於遲延給付造成之損害，負賠償責任", "依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為", "贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任", "贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"], "exp": ["✗A. §410：贈與人僅就故意或重大過失，對受贈人負給付遲延責任，因輕過失遲延不負責，故不得依§231 請求（公證不影響此規則）。", "✗B. 贈與為諾成契約（§406），不動產贈與不以交付為成立要件，非要物行為。", "✗C. §411：贈與物有瑕疵，贈與人原則不負擔保責任。", "✓D（本題答案）. §411 但書：贈與人故意不告知其瑕疵或保證其無瑕疵者，對受贈人因瑕疵所生損害負賠償義務。", "★贈與人責任整體較輕：遲延以故意重大過失為限（§410）、瑕疵以故意不告知為限（§411）。陷阱：贈與無「無過失擔保責任」。"]}, {"year": 114, "num": 14, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙兩人合夥開了一家小麵館 M，生意興隆。下列何者錯誤？", "opts": ["如甲在麵館以外之場所猥褻 K，乙無須對 K 負連帶損害賠償責任", "麵體供應商 J 多次索取買賣價金均無果，J 得以 M 為被告請求履行債務", "甲、乙兩人想把 M 收起來，尚須經清算程序", "M 麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"], "exp": ["✓A. 合夥為非法人團體，合夥人在合夥事務之外的個人侵權行為，不屬合夥事務，乙不須連帶負責。", "✓B. 合夥為非法人團體，設有代表人或管理人者有當事人能力（民事訴訟法§40 III），J 得以合夥為被告。", "✓C. 合夥解散後須經清算程序（§694 以下）。", "✗D（本題答案）. §668：合夥人出資及合夥財產為全體合夥人公同共有，餐具與攤車作為出資後已屬公同共有，非各自所有。", "★合夥財產=公同共有，非各自所有。陷阱：出資後權利就歸合夥財產。"]}];

let aY='all',aF='all';
function isOK(q,L){return q.ans?L===q.ans:(q.acc?q.acc.includes(L):true)}
function gk(q){return q.year+'_'+q.num}
function getFilt(){
  return QS.filter(q=>{
    const k=gk(q),s=S[k];
    if(aY!=='all'&&q.year!==aY)return false;
    if(aF==='un')return!s;
    if(aF==='wrong')return s&&!s.ok;
    return true;
  });
}
function chips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  if(q.note){st.appendChild(mk('div','nl',q.note));}
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(isOK(q,L))o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  if(q.src==='ai'){ex.appendChild(mk('div','exp-line nl','※AI解析：條號憑記憶撰寫，以現行條文為準'));}
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:isOK(q,ch)};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
</script>
