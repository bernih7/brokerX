<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>

<script>
const QS=[{"year": 99, "num": 31, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲之配偶早亡，有乙丙丁 3 名子女，其中乙與 A 結婚，有兩子 X 及 Y，丙丁則尚未結婚，甲有財產 3000萬元。以下敘述何者錯誤？", "opts": ["甲死亡時，其子丙已先死亡時，則甲之遺產由乙丁繼承", "甲死亡後，其子乙因悲傷過度亦於 1 個月後死亡，則甲之 3000 萬元遺產，由丙、丁各繼承 1000 萬元，剩餘 1000 萬元由 A 及 X、Y 共同繼承", "甲死亡前，其子乙已先死亡時，則甲之 3000 萬元遺產，由丙、丁各繼承 1000 萬元，剩餘 1000 萬元由A 及 X、Y 共同繼承", "甲得以遺囑自由處分其財產，但不得侵害繼承人之特留分"], "exp": ["✓A. 丙先死亡且未婚無直系卑親屬可代位，第一順序繼承人僅乙、丁（§1138(1)、§1141均分）。", "✓B. 甲死亡時乙尚生存，已繼承1000萬；乙嗣後死亡，該1000萬成為乙之遺產，由乙之繼承人A（配偶）、X、Y繼承（§1138、§1144）。", "✗C（本題答案）. 乙先於甲死亡，其直系卑親屬X、Y代位繼承乙之應繼分1000萬（§1140）；乙之配偶A非甲之繼承人，不得共同繼承。", "✓D. §1187：遺囑人於不違反關於特留分規定之範圍內，得以遺囑自由處分遺產。", "★先死亡＝代位繼承（只有卑親屬，配偶不代位）；後死亡＝轉繼承（進入乙的遺產，配偶A才有份）。差在乙死亡時點。"]}, {"year": 99, "num": 32, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "繼承人於下列何者情形，並不喪失繼承權？", "opts": ["乙酒駕騎乘機車，不小心於家門口將其父甲撞死因而受刑之宣告", "乙為獨占全部遺產，欺騙其父甲其他兄弟丙丁與外人勾結圖謀財產，其父甲因此作成遺囑，將財產全部遺留給乙", "乙為獨占全部遺產，私下塗改父甲之遺囑", "乙與其父甲素來相處不洽，屢次於大庭廣眾之下辱罵父甲豬狗不如，令父甲心灰意冷，向其友人 A 表示遺產絕不留給乙"], "exp": ["✓A（本題答案）. §1145 I(1)限於「故意」致被繼承人於死而受刑之宣告才喪失；酒駕撞死屬過失，不喪失繼承權。", "✗B. §1145 I(3)：以詐欺或脅迫使被繼承人為關於繼承之遺囑，喪失繼承權。", "✗C. §1145 I(4)：偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑，塗改遺囑屬變造，喪失繼承權。", "✗D. §1145 I(5)：對被繼承人有重大虐待或侮辱情事，經被繼承人表示其不得繼承者，喪失繼承權；本題公然辱罵且甲表示不留遺產，符合。", "★喪失繼承權六款中，殺害要「故意」，過失不算；遺囑相關（詐欺脅迫、偽造變造隱匿湮滅）全部喪失；虐待侮辱要再加「被繼承人表示不得繼承」。"]}, {"year": 99, "num": 33, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲（男）乙（女）於民國 94 年 3 月結婚，甲乙依法約定分別財產制為其夫妻財產制。下列敘述，何者正確？", "opts": ["甲乙就其婚後財產，互負報告之義務", "甲乙各自保有其財產之所有權", "甲乙之債務，應由甲乙共同清償", "家庭生活費用由甲負擔，甲得請求乙為相當之負擔"], "exp": ["✗A. 報告財產狀況之義務是法定財產制的規定（§1022）；分別財產制各自管理，無此義務。", "✓B（本題答案）. §1044：分別財產制，夫妻各保有其財產之所有權，各自管理、使用、收益及處分。", "✗C. §1046、§1023 I：分別財產制下，夫妻各自對其債務負清償之責，並非共同清償。", "✗D. §1003-1：家庭生活費用，除法律或契約另有約定外，由夫妻各依其經濟能力、家事勞動或其他情事分擔，並非當然由甲負擔。", "★分別財產制＝你的歸你、我的歸我，債務也各還各的；但家庭生活費仍依能力分擔，別被「男方養家」的舊觀念誤導。"]}, {"year": 99, "num": 34, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "因他人拋棄繼承而為繼承人者，其主張拋棄繼承之法定期間為何？", "opts": ["於知悉其得繼承之日起 2 個月內", "自繼承開始時起 3 個月內，必要時得向法院聲請延展", "於知悉其得繼承之日起 3 個月內", "自繼承開始時起 2 個月內，必要時得向法院聲請延展"], "exp": ["✗A. 拋棄繼承期間為三個月，不是二個月（§1174 II）。", "✗B. 期間自「知悉其得繼承時」起算而非繼承開始時，且拋棄繼承無延展規定；可延展的是限定繼承陳報遺產清冊期間（§1156）。", "✓C（本題答案）. §1174 II：應於知悉其得繼承之時起三個月內以書面向法院為之；因他人拋棄而成為繼承人者，亦自其知悉得繼承時起算。", "✗D. 起算點與延展均不符，同選項B之理由（§1174 II）。", "★拋棄＝「知悉時起3個月」；後順位者要等知道前順位拋棄才開始算。陷阱：把拋棄與限定繼承的期間規定混在一起。"]}, {"year": 99, "num": 35, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲（被繼承人）生前對乙（繼承人）所為之何種贈與，於計算甲之應繼遺產時，係屬應歸扣之生前特種贈與？", "opts": ["乙結婚時，甲贈與乙 100 萬元", "乙生日時，甲贈與乙 100 萬元", "乙生子時，甲贈與乙 100 萬元", "乙參加競賽奪冠，甲贈與乙 100 萬元"], "exp": ["✓A（本題答案）. §1173：繼承人在繼承開始前因結婚、分居或營業已從被繼承人受贈者，應將贈與價額加入應繼遺產（歸扣），結婚贈與屬之。", "✗B. 生日贈與非§1173列舉之結婚、分居、營業，不歸扣。", "✗C. 生子贈與非§1173列舉事由，不歸扣。", "✗D. 競賽奪冠獎勵性贈與非§1173列舉事由，不歸扣。", "★歸扣的特種贈與只有三種：結婚、分居、營業。其他節慶、獎勵之贈與，一律不是。"]}, {"year": 99, "num": 37, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於收養子女，下列敘述，何者錯誤？", "opts": ["收養子女應輩分相當", "被收養人已結婚者，其出養之意思，自己決定，不必得配偶之同意", "除夫妻共同收養外，1 人不能同時為 2 人之養子女", "收養子女，除訂立收養契約外，應經法院之認可"], "exp": ["✓A. §1073-1：旁系血親六親等內、旁系姻親五親等內輩分不相當者不得收養，故收養須輩分相當。", "✗B（本題答案）. 被收養人已結婚者，其配偶為當事人家庭成員，被收養須得配偶同意（§1076），不能自行決定。", "✓C. §1075：除夫妻共同收養外，一人不得同時為二人之養子女。", "✓D. §1079：收養應以書面為之並向法院聲請認可。", "★收養要件：書面＋法院認可；已婚者被收養要配偶同意；一個人不能同時當兩個人的養子女（夫妻共同收養除外）。"]}, {"year": 99, "num": 38, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "關於夫妻財產制之敘述何者錯誤？", "opts": ["除法定財產制外，夫妻可以約定為共同財產制或分別財產制", "夫妻約定財產制時，應以書面為之", "夫妻約定財產制不須登記可以對抗第三人", "共同財產制之下，除夫妻特有財產以外之財產合併為共同財產，屬夫妻公同共有"], "exp": ["✓A. §1005，夫妻得約定共同財產制或分別財產制，正確。", "✓B. §1007，夫妻財產制契約之訂立、變更或廢止，應以書面為之，正確。", "✗C（本題答案）. §1008，夫妻財產制契約之訂立等，「非經登記，不得對抗第三人」，未登記不得對抗第三人，本選項說「不須登記可以對抗」，與法條相反，錯誤，為應選答案。", "✓D. §1031，共同財產制下，除特有財產外，夫妻財產合併為共同財產，為夫妻公同共有，正確。"]}, {"year": 99, "num": 39, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲死亡留有總計 5000 萬元之現金存款，但同時積欠銀行 7000 萬元債務未清償，其妻早已死亡，子女有乙丙丁戊 4 人。以下敘述何者正確？", "opts": ["在一般情形，因為遺產不足清償債務，不足之 2000 萬元應由乙丙丁戊 4 人平均分攤", "乙如欲拋棄繼承，應於知悉繼承之時起 2 個月內，以書面向法院為之", "乙拋棄繼承時，其應繼承之遺產歸國家所有", "分割遺產之前，各繼承人對遺產全部為公同共有"], "exp": ["✗A. 繼承人僅以所得遺產為限負清償責任（§1148 II），不足部分繼承人不須以固有財產平均分擔。", "✗B. 拋棄繼承須於知悉其得繼承之時起三個月內以書面向法院為之（§1174 II），不是二個月。", "✗C. 拋棄者之應繼分歸屬於其他同為繼承之人（§1176），無人繼承時才歸屬國庫（§1185），並非因拋棄即歸國家。", "✓D（本題答案）. §1151：繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有。", "★遺產不夠還債≠子女要自掏腰包（限定責任）；分割前是公同共有，不是分別共有。"]}, {"year": 99, "num": 40, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於剩餘財產分配請求權之敘述何者正確？", "opts": ["夫妻約定為分別財產制者，夫妻離婚時亦可主張剩餘財產分配請求權", "計算剩餘財產之夫妻財產包括婚前財產及婚後財產", "配偶婚後無償取得之財產，不屬計算剩餘財產之標的", "剩餘財產分配請求權，應自請求人知有剩餘財產之差額時起，2 年間不行使而消滅，自法定財產制關係消滅時起，逾十年者，亦同"], "exp": ["✗A. 剩餘財產分配請求權僅於法定財產制關係消滅時產生（§1030-1）；分別財產制為約定財產制，無此請求權。", "✗B. 計算對象僅限婚後財產，婚前財產不列入（§1030-1）。", "✓C（本題答案）. §1030-1 I但書：因繼承或其他無償取得之財產及慰撫金，不列入剩餘財產差額計算。", "✗D. §1030-1 V：請求權自知有差額時起2年、自法定財產制關係消滅時起逾5年不行使而消滅，不是10年。", "★剩餘財產分配＝只算婚後、扣除繼承/贈與/慰撫金；時效「2年＋5年」，別記成10年。"]}, {"year": 100, "num": 30, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於收養之敘述，下列何者錯誤？", "opts": ["限於未成年人，方得被收養", "養父母死亡後，養子女得聲請法院許可終止收養", "夫妻應共同收養子女", "養子女從收養者之姓或維持原來之姓"], "exp": ["✗A（本題答案）. 成年人亦得被收養，並非限於未成年人（§1073以下收養規定，成年人收養另有規範）。", "✓B. 養父母死亡後，養子女得聲請法院許可終止收養，為民法終止收養之規定。", "✓C. §1074：夫妻收養子女時應共同為之，但夫妻一方收養他方之子女者不在此限。", "✓D. §1078：養子女從收養者之姓或維持原來之姓。", "★收養沒有「只限未成年」；夫妻要共同收養，除非收養配偶的子女。"]}, {"year": 100, "num": 31, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於離婚之敘述，下列何者錯誤？", "opts": ["兩願離婚，雙方當事人須以書面為之", "兩願離婚時，不得請求贍養費及損害賠償", "判決離婚時，因判決離婚而受有損害者，得向有過失之他方請求損害賠償", "離婚時，採分別財產制者，各自取回其結婚時之財產"], "exp": ["✓A. §1050：兩願離婚應以書面為之，有二人以上證人簽名並向戶政機關登記。", "✓B. 法定的損害賠償（§1056）與贍養費（§1057）請求權僅規定於判決離婚，兩願離婚無此法定請求權。", "✓C. §1056 I：因判決離婚而受有損害者，得向有過失之他方請求賠償。", "✗D（本題答案）. §1058：離婚時，除採分別財產制者外，各自取回其固有財產；分別財產制本來即各保有其財產，無「取回」問題，且取回標的是固有財產而非結婚時財產。", "★離婚取回財產的規定排除分別財產制；損害賠償、贍養費只在判決離婚才有法定請求權。"]}, {"year": 100, "num": 32, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依民法關於結婚之規定，下列敘述何者錯誤？", "opts": ["未成年人結婚，應由法定代理人代為意思表示", "表兄妹結婚者，無效", "有配偶者再與他人結婚時，後婚無效", "原則上結婚後夫妻各保其本姓"], "exp": ["✗A（本題答案）. 結婚須當事人自行為意思表示，不得由法定代理人代為；舊§981僅規定未成年人結婚須得法定代理人「同意」。", "✓B. §983：旁系血親六親等內不得結婚（因收養而成立之四親等、六親等旁系血親輩分相同者除外），表兄妹為非收養之四親等旁系血親，其結婚依§988無效。", "✓C. §988(3)：違反§985重婚禁止者，後婚無效。", "✓D. §1000：夫妻各保有其本姓，但得書面約定冠姓並登記。", "★現行法差異：112.1.1起成年與結婚年齡均為18歲，舊§981（未成年人結婚須法定代理人同意）已刪除，未成年人不得結婚；本題A敘述現行法下仍為錯誤。", "★婚姻是身分行為，不能代理；表兄妹結婚在現行法下是無效婚。"]}, {"year": 100, "num": 33, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於拋棄繼承之敘述，下列何者正確？", "opts": ["應於繼承開始之日起 2 個月內為之", "繼承之拋棄，溯及於繼承開始時發生效力", "拋棄繼承者，就其所管理之遺產，於拋棄當時不負任何責任", "配偶拋棄繼承權者，其應繼分應歸後順序之繼承人"], "exp": ["✗A. 拋棄繼承期間為知悉其得繼承時起三個月內，非繼承開始日起2個月（§1174 II）。", "✓B（本題答案）. §1175：繼承之拋棄，溯及於繼承開始時發生效力。", "✗C. §1176-1：拋棄繼承者，就其管理之遺產，於其他繼承人或遺產管理人開始管理前，應與處理自己事務為同一注意，繼續管理，並非不負責任。", "✗D. §1176：配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人，不是後順序繼承人。", "★拋棄溯及繼承開始時＝視為從來不是繼承人；但拋棄後仍有「交接前繼續管理」的義務。"]}, {"year": 100, "num": 34, "ans": "", "acc": "AC", "note": "本題依考選部公告多重給分：答 A或C 者均給分", "src": "ai", "stem": "甲男乙女欲結婚，請問下列何種情形，甲乙不得結婚？", "opts": ["甲男曾與乙女之母親結婚，後因不孕而離婚", "甲 18 歲，乙 17 歲", "甲之祖母與乙之祖母為二親等之親姊妹", "甲之父母為丙、丁，乙之父母為戊、己，丙、己各自與前配偶離婚後，丙、己結婚"], "exp": ["✓A. §983 III：直系姻親結婚之限制，於姻親關係消滅後亦適用；甲曾為乙之母的配偶（乙之繼父），離婚後仍不得結婚。", "✗B. 100年當時男滿18歲、女滿16歲即達結婚年齡（須法定代理人同意），故可結婚；現行法已改為18歲，見law_change。", "✓C. 甲祖母與乙祖母為親姊妹，甲、乙為六親等旁系血親，非因收養，依§983不得結婚。", "✗D. 丙、己再婚後，甲乙為無血緣之繼兄妹，彼此非§969所稱血親或姻親，無§983之結婚限制。", "★現行法差異：112.1.1起結婚年齡男女均為18歲（§980）；選項B中乙17歲在現行法下不得結婚，故現行法下B亦屬不得結婚情形。", "★姻親關係離婚後消滅，但直系姻親的結婚禁止仍存續；繼兄妹無血緣也非姻親，可以結婚。本題依考選部公告A或C均給分。"]}, {"year": 100, "num": 35, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於法定夫妻財產制，下列敘述，何者正確？", "opts": ["夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還", "因繼承而得之財產，不計入夫或妻現存之婚後財產", "夫或妻於婚姻關係存續中，就其婚後財產所為履行道德上義務之贈與，他方得聲請法院撤銷之", "剩餘財產分配請求權專屬夫或妻享有，不得由繼承人主張之"], "exp": ["✗A. §1023 II：夫妻之一方以自己財產清償他方之債務時，雖於婚姻關係存續中，亦得請求償還。", "✓B（本題答案）. §1030-1 I但書：因繼承或其他無償取得之財產，不列入剩餘財產差額計算。", "✗C. §1020-1：夫妻無償行為有害剩餘財產分配請求權者他方得聲請撤銷，但為履行道德上義務所為之相當贈與不在此限，故不得撤銷。", "✗D. §1030-1：請求權原則上不得讓與或繼承，但已依契約承諾或已起訴者除外，繼承人於此情形可主張。", "★法定財產制：繼承、無償取得、慰撫金不算入差額；請求權原則專屬，但已起訴或契約承諾者可由繼承人承受。"]}, {"year": 100, "num": 36, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列親屬若未同居一處，何者不互負扶養義務？", "opts": ["父母子女間", "夫妻之間", "兄弟姊妹相互間", "直系姻親相互間"], "exp": ["✗A. §1114(1)：直系血親相互間互負扶養義務，不以同居為要件。", "✗B. §1116-1：夫妻互負扶養義務，不以同居為要件。", "✗C. §1114(3)：兄弟姊妹相互間互負扶養義務，不以同居為要件。", "✓D（本題答案）. 直系姻親僅「夫妻一方與他方之父母同居」時才互負扶養義務（§1114(2)）；未同居者互不負扶養義務。", "★姻親（岳父母、媳婦）扶養要「同居」才成立；血親與夫妻則否。"]}, {"year": 100, "num": 37, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列之人：1直系血親卑親屬 2祖父母 3兄弟姊妹 4父母；其正確之法定遺產繼承順序為何？", "opts": ["1432", "1423", "4123", "4312"], "exp": ["✓A（本題答案）. §1138：第一順序直系血親卑親屬，第二順序父母，第三順序兄弟姊妹，第四順序祖父母，即1→4→3→2。", "✗B. 此排列把祖父母排在兄弟姊妹之前，不符§1138。", "✗C. 此排列把父母排第一，直系血親卑親屬排第二，不符§1138。", "✗D. 此排列完全顛倒，不符§1138。", "★口訣：子女、父母、兄弟姊妹、祖父母；題目編號順序易錯，要對照編號換算。"]}, {"year": 100, "num": 38, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲死亡時遺留存款三百萬元以及債務五百萬元，無配偶，有子乙與孫丙各一人。下列敘述何者正確？", "opts": ["若乙未依法辦理拋棄繼承，乙必須全部清償所繼承之五百萬元債務", "若乙拋棄繼承，丙亦同受拋棄效力所及，無須繼承", "乙所繼承之債務，以因繼承所得遺產為限，負連帶責任", "乙欲拋棄繼承，應於知悉其得繼承之時起三個月內，以書面向甲之債權人與債務人為之"], "exp": ["✗A. 繼承人僅以所得遺產為限清償（§1148 II），無須全部清償500萬。", "✗B. 拋棄繼承僅及於拋棄者本人，乙之子丙為第一順序繼承人，因乙拋棄而得繼承，並非當然同受拋棄效力；丙須自行於期間內決定是否拋棄（§1174）。", "✓C（本題答案）. §1148 II限定責任；§1153 I繼承人對被繼承人之債務負連帶責任，故乙以所得遺產為限負連帶責任。", "✗D. 拋棄應於知悉其得繼承之時起三個月內以書面向法院為之，並通知因其拋棄而應為繼承之人，並非向債權人與債務人為之（§1174 II）。", "★債務也是遺產的一部分，但以遺產為限；拋棄對象是法院，不是債權人。"]}, {"year": 100, "num": 39, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於遺囑之敘述何者正確？", "opts": ["未滿 18 歲者不得為遺囑", "自書遺囑必須親筆自書，不得自行電腦打字列印後，親自簽名為之", "18 歲以上之人得為遺囑見證人", "口授遺囑，自遺囑人能依其他方式為遺囑之時起，經過二個月而失其效力"], "exp": ["✗A. §1186：限制行為能力人無須法定代理人允許即得為遺囑，但未滿16歲者不得為遺囑，門檻是16歲而非18歲。", "✓B（本題答案）. §1190：自書遺囑應自書遺囑全文、記明年月日並親自簽名；電腦打字列印不符「自書全文」要件。", "✗C. §1198：未成年人及受監護宣告之人等不得為見證人；考試當年成年為20歲，18歲者不得為見證人（現行法見law_change）。", "✗D. §1196：口授遺囑自遺囑人能依其他方式為遺囑時起，經過三個月失其效力，非二個月。", "★現行法差異：112.1.1起成年為18歲，18歲者已非未成年人，C選項在現行法下是否能為見證人須再檢視§1198其他欠格事由；§1186立遺囑年齡（滿16歲）不受影響。", "★自書遺囑一定要手寫全文；立遺囑能力16歲、口授遺囑失效期3個月。"]}, {"year": 100, "num": 40, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何種繼承人之繼承特留分，為其應繼分三分之一？", "opts": ["直系血親卑親屬", "父母", "配偶", "祖父母"], "exp": ["✗A. §1223(1)：直系血親卑親屬之特留分為其應繼分二分之一。", "✗B. §1223(2)：父母之特留分為其應繼分二分之一。", "✗C. §1223(3)：配偶之特留分為其應繼分二分之一。", "✓D（本題答案）. §1223(5)：祖父母之特留分為其應繼分三分之一（兄弟姊妹亦同）。", "★特留分：卑親屬、父母、配偶 1/2；兄弟姊妹、祖父母 1/3。"]}, {"year": 101, "num": 8, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "被繼承人甲於生前立下遺囑。下列敘述何者最正確？", "opts": ["甲遺囑中之受遺贈人於遺囑生效前死亡者，其遺贈無效", "甲得以遺囑禁止遺產之分割，但其禁止之效力以五年為限", "未滿十六歲之甲於經其法定代理人允許時，得立遺囑", "甲遺囑中之受遺贈人拋棄遺贈者，自為拋棄之意思表示時發生效力"], "exp": ["✓A（本題答案）. §1201：受遺贈人於遺囑發生效力前死亡者，其遺贈不生效力。", "✗B. §1165 II：遺囑禁止遺產分割者，其禁止效力以十年為限，不是五年。", "✗C. §1186：未滿16歲者不得為遺囑，且限制行為能力人立遺囑無須法定代理人允許，故不因法定代理人允許而得立。", "✗D. §1206 II：遺贈之拋棄，溯及遺囑人死亡時發生效力，不是自表示時。", "★遺贈三個數字/時點：受遺贈人先死亡失效；禁止分割10年；拋棄溯及死亡時。"]}, {"year": 101, "num": 17, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲懷胎乙五個月時，其丈夫丙因病過世，留下一棟房屋與現金 200 萬元之遺產，下列敘述何者最正確？", "opts": ["乙尚未出生，不具有權利能力，不得繼承丙之遺產", "乙雖尚未出生，但關於利益之享有具有部分行為能力，得繼承丙之遺產", "乙以將來非死產者為限，關於個人利益之保護享有行為能力，在出生後得溯及繼承開始時繼承丙之遺產", "乙以將來非死產者為限，關於個人利益之保護享有權利能力，得繼承丙之遺產"], "exp": ["✗A. §7：胎兒以將來非死產者為限，關於個人利益之保護，視為既已出生，故得繼承。", "✗B. §7係視為既已出生而有權利能力，並非「部分行為能力」；胎兒無行為能力。", "✗C. 胎兒享有的是權利能力而非行為能力，選項概念錯誤（§7）。", "✓D（本題答案）. §7：以將來非死產為限，關於個人利益之保護享有權利能力，可繼承丙之遺產（§1166亦規定保留胎兒應繼分）。", "★胎兒＝有權利能力（限於個人利益、須活產），但沒有行為能力。"]}, {"year": 101, "num": 20, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於法定夫妻財產制，下列敘述何者錯誤？", "opts": ["無論是婚前財產或婚後財產，由夫妻各自所有", "夫或妻婚前財產，於婚姻關係存續中所生之孳息，推定為婚後財產", "夫或妻各自管理、使用、收益及處分其財產", "夫妻因判決而離婚者，其現存婚後財產之價值的計算，以起訴時為準"], "exp": ["✓A. §1017 I：夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有。", "✗B（本題答案）. §1017 II：婚前財產於婚姻關係存續中所生之孳息，是「視為」婚後財產，而非推定，不得以反證推翻。", "✓C. §1018：夫妻各自管理、使用、收益及處分其財產。", "✓D. §1030-4 I但書：因判決離婚者，現存婚後財產價值以起訴時為準。", "★「推定」可推翻、「視為」不可推翻，法條用字是陷阱。判決離婚價值基準日＝起訴時。"]}, {"year": 101, "num": 21, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲死亡時有遺族配偶乙，子女丙及丁，丙之子女戊。下列敘述何者最正確？", "opts": ["如繼承財產不足清償繼承債務，乙以其固有財產清償繼承債務後，不得向債權人主張不當得利返還請求權", "丙未表示是否繼承前即死亡，戊得於甲死亡後一年內，拋棄對甲之繼承", "即使丁於拋棄繼承時尚未成年，亦不得於事後撤銷拋棄之意思表示", "如丙已先於甲死亡，且丙於生前即表示拋棄繼承，則戊不得繼承甲之財產"], "exp": ["✓A（本題答案）. 繼承人負限定責任（§1148 II），超出遺產部分屬自然債務，乙自願以固有財產清償，不得再向債權人主張不當得利返還（參§180）。", "✗B. 拋棄期間為知悉其得繼承時起三個月（§1174 II），不是一年；戊之主張期間亦不因此延長。", "✗C. 限制行為能力人未得法定代理人允許所為單獨行為無效（§78），拋棄繼承為單獨行為，並非「不得撤銷」 。", "✗B. 財產酌給請求權為§1149，指被繼承人生前繼續扶養之人得請求酌給遺產。", "✗C. 扶養費請求權為扶養義務之給付請求，與本題無關。", "✗D. 贍養費請求權為§1057，指判決離婚時無過失之一方生活陷困得請求給與。", "★剩餘財產：差額平均分；酌給遺產：生前被扶養的人；贍養費：判決離婚無過失者。"]}, {"year": 103, "num": 31, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列何者不屬於夫妻之特有財產？", "opts": ["妻之化妝品", "夫之行醫工具", "夫上班代步所駕駛之自用汽車", "妻之首飾"], "exp": ["✗A. §1031-1 I：專供夫或妻個人使用之物屬特有財產，化妝品屬之。", "✗B. §1031-1 I：專供夫或妻職業上必需之物屬特有財產，行醫工具屬之。", "✓C（本題答案）. 自用代步汽車並非專供個人使用或職業上必需之物，不屬特有財產。", "✗D. §1031-1 I：專供個人使用之物屬特有財產，首飾屬之。", "★特有財產（共同財產制，§1031-1）＝專供個人使用、職業必需、經贈與人書面聲明者；汽車屬一般財產。"]}, {"year": 103, "num": 33, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "夫妻之財產及所得，除特有財產外，合併為共同財產者，屬於下述何種所有型態？", "opts": ["夫妻公同共有", "夫妻分別共有", "夫妻區分所有", "夫妻總體共有"], "exp": ["✓A. §1031，夫妻共同財產制下，除特有財產外，夫妻之財產「合併為共同財產，屬夫妻公同共有」，正確。", "✗B. 分別共有是各人有確定應有部分比例的共有，夫妻共同財產無此結構，選項錯誤。", "✗C. 區分所有指各自就建物特定部分有所有權（如公寓），與夫妻財產制無關，選項錯誤。", "✗D. 「總體共有」並非民法用語，選項錯誤。"]}, {"year": 103, "num": 34, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲死亡，由配偶乙繼承其遺產，乙對於甲所積欠丙之債務，應負何種責任？", "opts": ["負無限清償責任", "負部分清償責任", "不負責任", "以因繼承所得遺產為限負清償責任"], "exp": ["✗A. 繼承人負限定責任而非無限責任（§1148 II）。", "✗B. 並無「部分清償責任」之法律類型，繼承人以遺產為限負責。", "✗C. 繼承人並非不負責任，仍須以所得遺產清償。", "✓D（本題答案）. §1148 II：繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。", "★現行法一律限定責任：只賠遺產那麼多，不必動用自己的錢。"]}, {"year": 103, "num": 35, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "因他人拋棄繼承而應為繼承之人，為拋棄繼承時，應於知悉其得繼承之日起多久為之？", "opts": ["一個月", "二個月", "三個月", "六個月"], "exp": ["✗A. 期間為三個月，非一個月。", "✗B. 期間為三個月，非二個月（§1174 II）。", "✓C（本題答案）. §1174 II：應於知悉其得繼承之時起三個月內以書面向法院為之。", "✗D. 期間為三個月，非六個月。", "★拋棄期間：知悉得繼承時起三個月，書面向法院。"]}, {"year": 103, "num": 36, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲、乙約定為共同財產制為其夫妻財產制，其後甲死亡，繼承人為乙及生女丙，經查甲、乙之共同財產共價值新臺幣 100 萬元，乙得分得金額為：", "opts": ["新臺幣 75 萬元", "新臺幣 50 萬元", "新臺幣 100 萬元", "新臺幣 25 萬元"], "exp": ["✓A（本題答案）. 甲死亡使共同財產制消滅，夫妻各取得共同財產之半數（§1039）：乙先取得50萬元；甲之50萬元為遺產，乙與丙（配偶與第一順位平均，§1144①）各得25萬元，乙合計75萬元。", "✗B. 50萬元僅是乙依§1039取得之共同財產一半，漏算乙另可繼承甲遺產25萬元。", "✗C. 共同財產不會全歸生存配偶；§1039原則上各取半數，甲之一半才是遺產。", "  "75 萬元", "50 萬元", "20 萬元"], "exp": ["✗A. 遺囑侵害特留分，受遺贈人不可能取得全部，特留分人得行使扣減權（§1225）。", "✗B. 75萬元超過可處分額，仍侵害特留分。", "✓C（本題答案）. 配偶乙、子丙應繼分各1/2（§1144①），特留分各為應繼分1/2（§1223①③），共計1/2＝50萬元，可自由處分之遺產即為50萬元，丁得50萬元。", "✗D. 20萬元不符特留分計算。", "★可自由處分額＝遺產－特留分。本題乙、丙特留分各1/4，合計一半，可遺贈一半。陷阱：忘記特留分是「應繼分的1/2」不是遺產的1/2。"]}, {"year": 104, "num": 33, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲之兄長乙與丙結婚，丙有兄長丁。關於四人之親系及親等關係，下列敘述，何者錯誤？", "opts": ["甲與乙為旁系血親二親等", "乙與丁為旁系姻親二親等", "甲與丙為旁系姻親二親等", "甲與丁為旁系姻親二親等"], "exp": ["✓A. 甲、乙為兄弟，同源於父母，為旁系血親二親等，敘述正確。", "✓B. 乙之配偶丙之兄長丁為配偶之血親，從配偶之親等（§970②），丙與丁二親等，故乙與丁為旁系姻親二親等，正確。", "✓C. 丙為甲之血親（兄）乙之配偶，屬血親之配偶（§969①），從血親之親等（§970①），為旁系姻親二親等，正確。", "✗D（本題答案）. 甲與丁之關係為「血親之配偶之血親」，不屬§969所列姻親三類（血親之配偶、配偶之血親、配偶之血親之配偶），兩人不是姻親，敘述錯誤。", "★姻親只有三種：血親之配偶、配偶之血親、配偶之血親之配偶。親家之間、妯娌之間皆非姻親（妯娌為配偶之血親之配偶則是）。陷阱：以為「繞一圈」就算姻親。"]}, {"year": 104, "num": 34, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲男婚外情，甲妻丁得知忿而與甲離婚，並完成登記。甲旋即與乙女於教堂牧師見證下，宣布結為夫妻，並請鄰近攤販丙、戊於結婚證書上簽名。下列敘述，何者正確？", "opts": ["甲、乙婚姻有效成立，因甲、乙有公開之儀式及二人以上之證人", "甲、乙婚姻有效成立，因甲、丁已離婚，且甲、乙有結婚證書", "甲、乙婚姻不成立，因甲不得同時與二人結婚", "甲、乙婚姻不成立，因甲、乙未辦理結婚登記"], "exp": ["✗A. 現行§982結婚要件為書面、二人以上證人簽名及戶政登記，不再以公開儀式為要件，故婚姻非因儀式而成立。", "✗B. 甲乙雖有結婚證書，但結婚仍須登記（§982），離婚登記完成也不能取代結婚登記。", "✗C. 甲與丁已離婚登記，並無重婚問題（§985），不是因此不成立。", "✓D（本題答案）. 結婚須有書面、二人以上證人簽名，並應由雙方向戶政機關為結婚登記（§982），本題未登記，婚姻不成立。", "★結婚＝書面＋兩位證人簽名＋戶政登記，登記是生效要件（形式要件）。陷阱：牧師證婚、辦喜宴、舉行儀式都不算；舊法「公開儀式」已刪。"]}, {"year": 104, "num": 35, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於子女之監護，下列敘述，何者錯誤？", "opts": ["夫妻離婚者，對於未成年子女權利義務之行使或負擔，原則上由夫任之", "夫妻未為協議或協議不成者，法院得依夫妻之一方、主管機關、社會福利機構或其他利害關係人之請求或依職權酌定之", "協議不利於子女者，法院得依主管機關、社會福利機構或其他利害關係人之請求或依職權為子女之利益改定之", "行使、負擔權利義務之一方未盡保護教養之義務或對未成年子女有不利之情事者，他方、未成年子女、主管機關、社會福利機構或其他利害關係人得為子女之利益，請求法院改定之"], "exp": ["✗A（本題答案）. 離婚後未成年子女權利義務之行使或負擔，依協議由一方或雙方共同任之（§1055I），現行法已無「原則由夫任之」，敘述錯誤。", "✓B. 未為協議或協議不成者，法院得依夫妻之一方、主管機關、社會福利機構或其他利害關係人請求或依職權酌定（§1055I），正確。", "✓C. 協議不利於子女者，法院得依主管機關等請求或依職權為子女利益改定（§1055II），正確。", "✓D. 一方未盡保護教養義務或有不利情事，他方、子女、主管機關等得請求法院改定（§1055III），正確。", "★核心是「子女最佳利益」，由協議→法院酌定→改定。陷阱：舊法「由夫任之」早已修正。"]}, {"year": 104, "num": 37, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "某富婆在其遺囑中載明將遺產全部留給自己之愛狗繼承。依我國法律規定，狗可否取得該遺產？", "opts": ["可以", "不可以", "由繼承人決定", "由法院決定"], "exp": ["✗A. 狗為物而非權利主體，無權利能力（§6），不能成為繼承人或受遺贈人。", "✓B（本題答案）. 狗無法取得遺產，A錯誤，B正確。", "✗C. 是否取得與繼承人意願無關，狗根本無權利能力。", "✗D. 亦非法院決定，法律已明定權利能力限於自然人與法人。", "★只有自然人（§6）與法人（§26）有權利能力，動物屬「物」。陷阱：想用遺囑「贈與狗」，無效；可考慮附負擔遺贈給人、請其照顧。"]}, {"year": 104, "num": 38, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲、乙夫婦因重大車禍入院，夫甲於入院當日死亡、妻乙於次日死亡。甲有弟一人丙、乙有母丁及妹一人戊。甲之遺產總額為 720 萬元時，丙、丁、戊三人如何分配？", "opts": ["丙 240 萬元、丁 240 萬元、戊 240 萬元", "丙 240 萬元、丁 300 萬元、戊 180 萬元", "丙 360 萬元、丁 360 萬元、戊 0 元", "丙 360 萬元、丁 180 萬元、戊 180 萬元"], "exp": ["✗A. 甲死後乙繼承1/2（配偶與兄弟姊妹同繼承，§1144③），丙1/2；乙次日才死，乙所繼承部分成為乙之遺產，不是三等分。", "✗B. 丁不可得300萬元，乙之遺產由第二順位母丁單獨繼承，戊被排除。", "✓C（本題答案）. 甲遺產配偶乙1/2＝360萬、弟丙1/2＝360萬（§1144③）；乙死後所得360萬為其遺產，乙無子女，由第二順位母丁繼承（§1138②），第三順位妹戊不得繼承，故丙360、丁360、戊0。", "✗D. 戊為第三順位兄弟姊妹，因第二順位母丁存在不得繼承（§1138），不是180萬元。", "★兩人非同時死亡（相差一日，不適用§11推定），須分兩次繼承。陷阱：把甲遺產直接分給乙方親屬，或忘了順位排除。"]}, {"year": 104, "num": 39, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲為 18 歲之人，未得法定代理人之允許，自書遺囑一份，寫明將所有財產全部捐給某公益團體。該遺囑之效力如何？", "opts": ["效力未定，因為未得法定代理人之允許", "無效，因為未得法定代理人之允許", "有效，因為無須法定代理人之允許", "無效，因為內容違反特留分之規定"], "exp": ["✗A. 18歲遺囑不是效力未定；遺囑為單獨行為，限制行為能力人無須法定代理人允許（§1186II），只須年滿16歲。", "✗B. 遺囑有效，不須允許，非無效。", "✓C（本題答案）. 限制行為能力人滿16歲即可自行立遺囑，不須法定代理人允許（§1186II），自書遺囑只要符合§1190方式，即為有效。", "✗D. 侵害特留分只是繼承人得行使扣減權（§1225），遺囑並非無效。", "★現行法差異：112.1.1起成年年齡為18歲，題目所稱18歲之甲現行法下已成年而有完全行為能力，遺囑有效之結論不變，但理由不再是「限制行為能力人無須允許」。", "★遺囑能力：未滿16歲不得為遺囑；16歲以上即使為限制行為能力人也不須允許。陷阱：套用§79、§78法定代理人同意規則。"]}, {"year": 104, "num": 40, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲死亡後，其法定繼承人為其妻乙及兄丙、妹丁，計算法定繼承人特留分之基礎財產額為 480 萬元。丁之特留分金額為何？", "opts": ["60 萬元", "40 萬元", "30 萬元", "20 萬元"], "exp": ["✗A. 60萬元為應繼分1/4之1/2（120萬之一半）所得，誤用特留分比例（兄弟姊妹之特留分為應繼分1/3，§1223④）。", "✓B（本題答案）. 配偶乙1/2、兄丙1/4、妹丁1/4（§1144③）；丁應繼分120萬，兄弟姊妹特留分為應繼分三分之一（§1223④），120×1/3＝40萬元。", "✗C. 30萬元不符計算。", "✗D. 20萬元不符計算。", "★特留分＝基礎財產×應繼分×比例（直系卑親屬、父母、配偶1/2；兄弟姊妹、祖父母1/3）。陷阱：記錯比例。"]}, {"year": 105, "num": 31, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列何者違反近親禁婚範圍之規定？", "opts": ["甲先收養丙男，再收養丁女，丙與丁之結婚", "甲有一子乙，再收養一女丙，之後乙育有一子丁，丙育有一女戊，丁與戊之結婚", "乙有一女丙，另外收養一女丁，戊有一子己，另外收養一子庚。未久，甲收養乙與戊，丙與己之結婚，丁與庚之結婚", "甲與前妻育有一子乙，丙與前夫育有一女丁，甲與丙後來結婚，未久，乙與丁欲結婚"], "exp": ["✓A（本題答案）. 丙、丁同被甲收養成為養兄妹，屬因收養而成立之二親等旁系血親，§983I②但書僅放寬四親等及六親等，二親等仍不得結婚，違反規定。", "✗B. 丁與戊為四親等旁系血親，且係因收養而成立、輩分相同，屬§983I②但書例外，得結婚。", "✗C. 丙與己、丁與庚均為因收養成立之四親等旁系血親，輩分相同，適用§983I②但書，得結婚。", "✗D. 乙與丁為繼兄妹，雙方並非血親，也非姻親（血親之配偶之血親不屬§969），不在§983禁婚範圍。", "★禁婚口訣：直系血親、直系姻親絕對不行；旁系血親六親等內不行，但「因收養而成立、輩分相同的四、六親等」可以。陷阱：收養後成為「養兄妹」是二親等，仍不可。"]}, {"year": 105, "num": 32, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列何者非屬我國現行民法中所規定之約定財產制？", "opts": ["統一財產制", "分別財產制", "一般共同財產制", "勞力所得共同財產制"], "exp": ["✓A（本題答案）. 統一財產制已於修法廢止，現行約定財產制僅有共同財產制與分別財產制（§1004），故不屬現行約定財產制，符合題意。", "✗B. 分別財產制屬現行約定財產制（§1004、§1044），不符「非屬」題意。", "✗C. 一般共同財產制屬現行約定財產制（§1031），不符「非屬」題意。", "✗D. 勞力所得共同財產制屬現行約定財產制（§1041），不符「非屬」題意。", "★現行：法定＝法定財產制（§1017）；約定＝共同財產制（一般共同、勞力所得共同）與分別財產制。陷阱：舊法「統一財產制」已刪。"]}, {"year": 105, "num": 33, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關夫妻財產制的規定，下列敘述何者正確？", "opts": ["依民法規定，夫妻除可以選擇分別財產制及共同財產制外，亦得基於契約自由原則，選擇其他分配方式", "夫妻選擇分別財產制，將來離婚時仍有剩餘財產分配請求權之適用", "夫妻選擇共同財產制後，可以再變更為分別財產制，互相轉換並無次數上的限制", "夫妻因未約定夫妻財產制而採用法定財產制時，將來就不得任意再變更"], "exp": ["✗A. 夫妻僅得就法定的約定財產制類型選擇其一（§1004），不能任意創設其他分配方式。", "✗B. 分別財產制各自保有財產，無剩餘財產差額分配（§1030-1僅於法定財產制適用）。", "✓C（本題答案）. 夫妻於婚姻關係存續中得以契約廢止財產契約或改用他種約定財產制（§1012），法律未限制次數，正確。", "✗D. 未約定者適用法定財產制（§1005），婚姻中亦可以契約改用約定財產制（§1012），並非不得變更。", "★約定財產制採類型強制，但變更自由。陷阱：「契約自由」不能超出法定類型。"]}, {"year": 105, "num": 34, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關法定夫妻財產制之敘述，下列何者錯誤？", "opts": ["夫或妻各自管理、使用、收益及處分其財產", "夫妻就其婚前財產及婚後財產，互負報告之義務", "不論夫或妻之婚前財產或婚後財產，均屬夫或妻各自所有", "夫或妻之婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產"], "exp": ["✓A. 夫或妻各自管理、使用、收益及處分其財產（§1018），敘述正確。", "✗B（本題答案）. 夫妻僅就「婚後財產」互負報告義務（§1022），不及於婚前財產，敘述錯誤。", "✓C. 夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有（§1017I），正確。", "✓D. 婚前財產於婚姻關係存續中所生孳息，視為婚後財產（§1017I），正確。", "★報告義務只針對婚後財產（為算剩餘財產）。陷阱：婚前財產無報告義務，但其孳息屬婚後財產。"]}, {"year": 105, "num": 35, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列何者屬於剩餘財產分配請求權之標的財產？", "opts": ["婚前財產", "婚後之薪資所得", "婚後因繼承所得之財產", "婚後所取得之慰撫金"], "exp": ["✗A. 婚前財產不是婚後財產，不在剩餘財產分配範圍（§1030-1I）。", "✓B（本題答案）. 婚後薪資為婚後取得之財產，且非繼承、無償取得或慰撫金，屬剩餘財產分配標的（§1030-1I）。", "✗C. 因繼承或其他無償取得之財產排除分配（§1030-1I①）。", "✗D. 慰撫金排除分配（§1030-1I②）。", "★剩餘財產＝婚後財產－債務，排除「繼承、無償取得、慰撫金」。陷阱：以為繼承也算婚後財產而納入分配。"]}, {"year": 105, "num": 36, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "隱瞞已婚之乙女與甲同居數年後，某日生下丙隨即離甲而去，甲獨力扶養丙，俟丙 19 歲生日，甲對丙告知其生母為乙，當日丙因思母心切隨即趕赴乙家要求相認，相認時刻被乙女丈夫丁撞見，一切東窗事發，乙丁大吵。過了 2 年後，上述相關人等決心為此事作一了結。試問此刻以下何人有資格提起婚生否認之訴？", "opts": ["甲", "乙", "丙", "丁"], "exp": ["✗A. 甲為生父，並非夫妻之一方或子女，不得依§1063II提起婚生否認之訴。", "✗B. 乙為母，為夫妻之一方，但自知悉子女非婚生起已逾2年，除斥期間經過。", "✓C（本題答案）. 丙為子女，丙19歲知悉，其提起否認之訴期限為成年後2年內（§1063II），題設當時丙仍在期間內，有資格提起。", "✗D. 丁為夫，自知悉子女非婚生起已逾2年，除斥期間經過。", "★現行法差異：112.1.1起成年年齡為18歲，題目中丙19歲知悉、再過2年已21歲，依現行成年年齡計算，丙「成年後2年」之期間是否仍未屆滿需重新計算，不宜直接套用考試當年結論。", "★婚生推定→否認之訴：夫妻之一方（知悉起2年內）、子女（成年後2年內）。生父不能提。陷阱：除斥期間起算點。"]}, {"year": 105, "num": 37, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，當胎兒為繼承人時，他繼承人如未保留胎兒之應繼分而分割遺產者，其分割行為之效力如何？", "opts": ["有效", "無效", "得撤銷", "效力未定"], "exp": ["✗A. 未保留胎兒應繼分而分割遺產，違反§1166II（非保留其應繼分，他繼承人不得分割遺產）之強行規定，分割行為無效，並非有效。", "✓B（本題答案）. 分割行為無效（§1166II、§71），正確。", "✗C. 並非「得撤銷」，法律效果為無效。", "✗D. 並非效力未定，無須經胎兒追認。", "★胎兒繼承：保留應繼分是分割的前提。陷阱：記成「得撤銷」。實務通說為無效。"]}, {"year": 105, "num": 38, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲乙為夫妻育有二女丙與丁，甲為傳香火認識已婚之戊女，同居一年後生下己男，甲把己接回家中同住將其養育成人，但丙與己相處極為不睦，丙亦曾對己口出穢言且被判刑確定，某日丙與己再起爭執，己一時失手將丙刺成重傷，丁見狀，起身亦把己刺成重傷，丁與己嗣後雙雙被判重刑確定，乙為此人倫悲劇在眾人前以不堪字眼侮辱甲，甲亦默默承受，但隔日即因傷心過度辭世。試問本案中，何人對甲無繼承權？", "opts": ["乙", "丙", "丁", "己"], "exp": ["✗A. 乙雖公開侮辱甲，但甲默默承受而未表示其不得繼承，不符§1145I⑤，乙不喪失繼承權（且乙為配偶）。", "✗B. 丙僅辱罵己，對象不是被繼承人甲，亦未致人於死，不符§1145I①，有繼承權。", "✗C. 丁刺傷己，己非法律上之應繼承人，且僅為重傷未致死，不符§1145I①，有繼承權。", "✓D（本題答案）. 己為已婚之戊所生，推定為戊之夫之婚生子女（§1063I），在未經否認前與甲無法律上父子關係，視為認領（§1065I）僅適用於非婚生子女，故己對甲無繼承權。", "★「視為認領」只適用非婚生子女；母親已婚時，所生子女受婚生推定，須先否認。陷阱：只看事實血緣，忽略婚生推定；侮辱須經被繼承人「表示不得繼承」才失權。"]}, {"year": 105, "num": 39, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有關拋棄繼承之敘述，下列何者正確？", "opts": ["向戶政機關為之", "得以言詞或書面為之", "於被繼承人死亡之時起 3 個月內為之", "繼承之拋棄，溯及於繼承開始時發生效力"], "exp": ["✗A. 拋棄繼承應以書面向法院為之，非向戶政機關（§1174II）。", "✗B. 拋棄繼承須以書面向法院為之，不得以言詞（§1174II）。", "✗C. 期間為知悉其得繼承之時起3個月內（§1174II），不是自死亡時起。", "✓D（本題答案）. 繼承之拋棄溯及於繼承開始時發生效力（§1175），正確。", "★拋棄＝書面、向法院、知悉起3個月、溯及繼承開始時。陷阱：起算點是「知悉」，不是死亡。"]}, {"year": 105, "num": 40, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列那種情形，甲所立的遺囑為有效？", "opts": ["甲 6 歲，經由其父母之代理而立之遺囑", "甲 15 歲，預立遺囑後，得其父母之追認", "甲 10 歲，但已得其父母之同意而立之遺囑", "甲 17 歲，未得其父母之允許或承認而立之遺囑"], "exp": ["✗A. 6歲為無行為能力人，不得為遺囑，亦不得由法定代理人代理（§1186I）。", "✗B. 未滿16歲不得為遺囑（§1186II），事後追認亦無用。", "✗C. 10歲不得為遺囑，即使得到同意亦同。", "✓D（本題答案）. 17歲為限制行為能力人，無須法定代理人允許即可為遺囑（§1186II），為有效。", "★遺囑須本人親自為，不可代理；16歲是門檻。陷阱：以為須法定代理人同意或追認。"]}, {"year": 106, "num": 4, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "關於繼承之效力，下列敘述何者錯誤？", "opts": ["繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任", "繼承，因被繼承人死亡而開始", "繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有", "繼承人從被繼承人生前所受贈之全部財產，視為其所得遺產"], "exp": ["✓A. §1148Ⅱ，繼承人對被繼承人之債務以繼承所得遺產為限（法定限定繼承），正確。", "✓B. §1147，繼承因被繼承人死亡而開始，正確。", "✓C. §1151，繼承人有數人時，在分割前，各繼承人對遺產全部「公同共有」，正確。", "✗D（本題答案）. §1148-1，繼承人從被繼承人生前所受贈之財產「視為其所得遺產」，用於計算特留分等，但並非「全部」視為所得遺產——法條有時間限制（死亡前一定年限內或特定情形），選項說「全部財產」過於絕對，超出法條範圍，為應選答案。"]}, {"year": 106, "num": 13, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於遺囑，下列敘述何者正確？", "opts": ["遺囑乃非要式行為", "無行為能力人，僅得為公證遺囑", "代筆遺囑，應由遺囑人指定二人以上之見證人", "繼承人及其配偶或其直系血親，不得為遺囑見證人"], "exp": ["✗A. 遺囑為要式行為，須依法定方式（§1189）。", "✗B. 無行為能力人不得為遺囑（§1186I），並非得為公證遺囑。", "✗C. 代筆遺囑應由遺囑人指定三人以上之見證人（§1194），非二人。", "✓D（本題答案）. 繼承人及其配偶或直系血親不得為遺囑見證人（§1198），正確。", "★遺囑見證人消極資格：未成年人、繼承人與其配偶直系血親、受遺贈人及其配偶直系血親等。陷阱：代筆遺囑是「三人」，其他要式遺囑多為二人。"]}, {"year": 106, "num": 18, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於婚約下列敘述何者正確？", "opts": ["婚約，得由未成年人之法定代理人代理為之", "未成年人訂定婚約，無須經法定代理人之同意", "婚約，得請求強迫履行", "因訂定婚約而為贈與者，婚約解除時，當事人之一方，得請求他方返還贈與物"], "exp": ["✗A. 婚約應由男女當事人自行訂定（§972），不得代理。", "✗B. 未成年人訂定婚約，應得法定代理人同意（§974），非無須同意。", "✗C. 婚約不得請求強迫履行（§975）。", "✓D（本題答案）. 因訂定婚約而為贈與者，婚約無效、解除或撤銷時，得請求返還贈與物（§979-1），正確。", "★婚約是「身分行為」：本人親自為、不得強迫履行；贈與物可請求返還。陷阱：誤以為可請求履行或可代理。"]}, {"year": 106, "num": 19, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於結婚，下列敘述何者正確？", "opts": ["男未滿 17 歲，女未滿 15 歲者，不得結婚", "結婚應以公開儀式為之", "直系血親及直系姻親在 6 親等以內者，不得結婚", "當事人之一方，於結婚時不能人道而不能治者，他方得向法院請求撤銷之"], "exp": ["✗A. 17歲、15歲不符規定（現行§980為男女均須年滿18歲，舊制為男18、女16），敘述錯誤。", "✗B. 現行§982結婚以書面、二人以上證人簽名及登記為要件，不再以公開儀式為要件。", "✗C. 直系血親及直系姻親不論親等一律不得結婚（§983I①），並非限於六親等以內。", "✓D（本題答案）. 一方於結婚時不能人道而不能治者，他方得向法院請求撤銷（§995），正確。", "★撤銷婚姻事由：未成年、不能人道、重婚、監護人同意等。陷阱：直系血親、姻親不受親等限制，旁系血親才限六親等。"]}, {"year": 106, "num": 32, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列有關夫妻離婚後所生身分及財產上效力之說明，何者正確？", "opts": ["夫妻離婚後，其子女對未享有親權之父母一方，喪失原本享有之法定繼承權", "夫妻離婚後，未享有親權之父母一方與其子女間，互相不負扶養之義務", "兩願離婚之場合，關於子女之親權，由夫任之", "夫妻無過失之一方，因判決離婚而限於生活困難者，他方縱無過失，亦應給予贍養費"], "exp": ["✗A. 離婚不影響親子血親關係，子女對任何一方仍有法定繼承權。", "✗B. 直系血親互負扶養義務（§1114①），離婚後未親權一方仍負扶養義務。", "✗C. 兩願離婚者，子女權利義務依協議由一方或雙方共同任之（§1055I），非當然由夫任之。", "✓D（本題答案）. 判決離婚時，無過失之一方陷於生活困難者，他方縱無過失亦應給與相當贍養費（§1057），正確。", "★離婚切斷夫妻關係，不切斷親子關係。贍養費是「無過失一方＋判決離婚＋生活困難」。陷阱：兩願離婚無贍養費（§1057限判決離婚）。"]}, {"year": 106, "num": 33, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關遺產分割之敘述，何者錯誤？", "opts": ["繼承人請求分割遺產之不動產，性質上為處分行為，依民法第 759 條規定，於未辦妥繼承登記前，不得為之", "被繼承人之遺囑，定有分割遺產之方法，或託他人代定者，從其所定", "繼承人對被繼承人已屆清償期之債務，自遺產分割時起，15 年內仍負連帶責任", "繼承人之一所分得之土地持分短少，得向其他繼承人請求賠償短少分配之同額價金"], "exp": ["✓A. 遺產分割為處分行為，繼承人就不動產未辦繼承登記前不得處分（§759），敘述正確。", "✓B. 被繼承人遺囑定有分割方法或託他人代定者，從其所定（§1165I），正確。", "✗C（本題答案）. 繼承人之連帶責任，自遺產分割時起，如債權清償期在分割後，自清償期屆滿時起，經過5年而免除（§1171II），不是15年。", "✓D. 各繼承人對他繼承人因分割所得之遺產負與出賣人同一之擔保責任（§1168），短少時可請求賠償，敘述正確。", "★遺產分割後債務連帶責任5年免除。陷阱：把5年記成10年或15年。"]}, {"year": 106, "num": 34, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列有關繼承之敘述，何者錯誤？", "opts": ["奠儀於繼承發生時並不存在，非屬被繼承人所遺財產", "繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任", "債權人得單獨向法院聲請命繼承人於 3 個月內提出遺產清冊", "繼承人對於遺產全部為公同共有關係，無應有部分，故若逾越應繼分比例享有（行使）權利，毋須負返還義務"], "exp": ["✓A. 奠儀繼承開始時不存在，不屬被繼承人所遺財產，正確。", "✓B. 繼承人對被繼承人債務，以因繼承所得遺產為限負清償責任（§1148II），正確。", "✓C. 債權人得向法院聲請命繼承人於3個月內提出遺產清冊（§1156-1），正確。", "✗D（本題答案）. 遺產為公同共有（§1151），分割前不得單獨處分，逾越應繼分取得時，依不當得利仍須返還（§179），敘述「毋須負返還義務」錯誤。", "★公同共有「無應有部分」不等於「可多拿」。陷阱：現行繼承採限定責任為原則。"]}, {"year": 107, "num": 6, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "債務人甲所有之抵押物上，設有擔保乙 200 萬元債權之第一次序抵押權、丙 120 萬元債權之第二次序抵押權及丁 50 萬元債權之第三次序抵押權。抵押物拍賣所得價金為 300 萬元。乙將其第一次序之優先受償利益拋棄予丁，則應如何分配拍賣所得之金額？", "opts": ["乙 150 萬元，丙 0 元，丁 50 萬元", "乙 160 萬元，丙 100 萬元，丁 40 萬元", "乙 0 元，丙 100 萬元，丁 200 萬元", "乙 150 萬元，丙 100 萬元，丁 50 萬元"], "exp": ["✗A. 乙拋棄優先受償利益後與丁同順位，按債權比例分配，非乙150、丁50之分配。", "✓B（本題答案）. 先依原順位分配：乙200、丙100（丙債權120不足）、丁0；乙、丁合計可得200，依債權額200:50＝4:1分配，乙160、丁40，丙仍100，正確。", "✗C. 乙不是全部讓出，仍可就比例受償，不是0元。", "✗D. 乙150、丁50不符比例；乙、丁合計200，應為160:40。", "★抵押權次序拋棄：拋棄者與受益者就原可受分配總額，按債權比例分配；他人（丙）所得不變。陷阱：誤當成「次序讓與」或全部讓出。"]}, {"year": 107, "num": 9, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關夫妻分別財產制之規定，下列何者錯誤？", "opts": ["分別財產制為約定財產制之一種", "夫妻各自保有財產之所有權，並各自為管理、使用、收益及處分", "夫妻之一方得因他方有花柳病或其他惡疾，向法院請求宣告改用分別財產制", "夫妻各自對其債務負清償之責，但夫妻之一方以自己財產清償他方債務時，得請求返還"], "exp": ["✓A. 分別財產制為約定財產制之一（§1004），正確。", "✓B. 夫妻各保有財產所有權，各自管理、使用、收益及處分（§1044），正確。", "✗C（本題答案）. 宣告改用分別財產制之事由規定於§1010，列舉如不給付家庭生活費用、分居達六個月以上等，並無「花柳病或惡疾」，敘述錯誤。", "✓D. 夫妻各自對其債務負清償責任，一方以自己財產清償他方債務得請求返還（§1023 II，分別財產制依§1046準用），正確。", "★改用分別財產制須依法列舉事由並向法院聲請。陷阱：舊式「惡疾」事由不在現行法中。"]}, {"year": 107, "num": 10, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列有關夫妻法定財產制之敘述，下列何者正確？", "opts": ["婚前財產由夫妻各自所有，婚後財產由夫妻公同共有", "婚前財產及婚後財產均由夫妻各自所有", "婚前財產由夫妻各自所有，婚後財產由夫妻分別共有", "婚前財產及婚後財產均由夫妻公同共有，且夫妻對其結婚而公同共有之財產均有管理、使用、收益、處分之權利，若將來離婚對他方有請求分割之權利"], "exp": ["✗A. 婚後財產亦各自所有，非公同共有。", "✓B（本題答案）. 法定財產制下婚前及婚後財產均由夫妻各自所有（§1017I），正確。", "✗C. 並非分別共有，而是各自所有。", "✗D. 公同共有、請求分割為共同財產制之特徵，與法定財產制不符。", "★法定財產制＝「分別財產」＋離婚或婚姻消滅時剩餘財產差額分配。陷阱：誤把法定財產制當共同財產制。"]}, {"year": 107, "num": 23, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲與乙於民國 100 年結婚，雙方並未約定夫妻財產制，嗣於 105 年乙因外遇而雙方離婚。關於婚後財產，下列敘述何者正確？", "opts": ["甲於民國 103 年因其父親過世所獲得的遺產 300 萬元是婚後財產", "乙於民國 102 年因車禍所獲 50 萬元慰撫金之非財產上損害賠償屬於婚後財產", "甲於民國 100 年將婚前所投資之股票出售，獲利 30 萬元，屬於婚後財產", "乙於民國 101 年所購入之房屋屬於婚後財產"], "exp": ["✗A. 繼承所得雖發生於婚後，依§1030-1I①不列入剩餘財產分配範圍，不屬本題所問婚後財產。", "✗B. 慰撫金依§1030-1I②排除分配，非本題所稱婚後財產。", "✗C. 婚前所持股票出售所得，是婚前財產之變形，並非婚前財產之孳息，仍為婚前財產（§1017I）。", "✓D（本題答案）. 婚姻關係存續中取得之房屋，除能證明為婚前財產或無償取得外，推定為婚後財產（§1017I）。", "★區分三步：婚前財產、婚後財產、排除項（繼承、無償取得、慰撫金）。陷阱：婚前財產之「孳息」才視為婚後財產，增值或出售所得不是孳息。"]}, {"year": 107, "num": 25, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲有子女乙丙二人，乙與丁結婚後育有一女戊，丙收養一女己；然乙卻因工時過長，過勞而亡。甲於乙死亡後兩年亦病逝。有關甲遺產之繼承，下列敘述何者正確？", "opts": ["戊、己得以代位繼承", "丙、戊為甲的遺產繼承人", "丙、戊、己為甲的遺產繼承人", "丙、丁、戊、己均為甲的遺產繼承人"], "exp": ["✗A. 己為丙之養女，因丙仍生存，己不得代位；代位繼承者僅戊（§1140）。", "✓B（本題答案）. 乙早於甲死亡，其直系血親卑親屬戊代位繼承；丙為第一順位繼承人（§1138①、§1140），故丙、戊為繼承人，正確。", "✗C. 己非繼承人，因被代位之人是乙，且丙仍生存。", "✗D. 丁為乙之配偶，非甲之繼承人，己亦非繼承人。", "★代位繼承：被代位人（子女）先死亡，由其直系血親卑親屬代位；配偶不代位；子女活著，其子女（孫輩）不繼承。陷阱：誤把養孫女列入。"]}, {"year": 108, "num": 5, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，下列關於夫妻財產制之敘述，何者錯誤？", "opts": ["夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以共同財產制，為其夫妻財產制", "夫妻財產制契約之訂立、變更或廢止，應以書面為之", "夫妻財產制契約之訂立、變更或廢止，非經登記，不得以之對抗第三人", "夫妻於婚姻關係存續中，得以契約廢止其財產契約，或改用他種約定財產制"], "exp": ["✗A（本題答案）. 夫妻未訂立契約者，以法定財產制為其夫妻財產制（§1005），不是共同財產制，敘述錯誤。", "✓B. 夫妻財產制契約之訂立、變更或廢止，應以書面為之（§1007），正確。", "✓C. 非經登記，不得以之對抗第三人（§1008I），正確。", "✓D. 婚姻關係存續中得以契約廢止財產契約，或改用他種約定財產制（§1012），正確。", "★法定財產制是預設值。陷阱：預設不是共同財產制。"]}, {"year": 108, "num": 6, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，下列關於監護之敘述，何者正確？", "opts": ["已結婚的未成年人而無父母，或父母均不能行使、負擔對於其未成年子女之權利、義務時，應置監護人", "父母對其未成年之子女，得因特定事項，於一定期限內，以書面委託他人行使監護之職務", "為保護未成年子女之權益，監護人不得辭任其職務", "監護人得受讓受監護人之財產"], "exp": ["✗A. 未成年人無父母或父母均不能行使負擔權利義務時應置監護人，但已結婚者不在此限（§1091），敘述錯誤。", "✓B（本題答案）. 父母對未成年子女，得因特定事項於一定期限內以書面委託他人行使監護職務，正確。", "✗C. 監護人有正當理由經法院許可得辭任（§1095），非不得辭任。", "✗D. 監護人不得受讓受監護人之財產（§1102），敘述錯誤。", "★監護人受法律嚴格限制，避免利益衝突。陷阱：已結婚之未成年人已有行為能力，不需另置監護人。"]}, {"year": 108, "num": 10, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲未婚生有乙、丙、丁三子，某日甲因細故與乙口角，乙遂憤而毆打甲成傷，當時丙雖在場，然畏懼乙身強體壯，並未勸阻。甲心灰意冷，當場表示自己百年後，乙不得繼承其財產；事後更逢人便訴說丙也不孝，未挺身護甲。丙得知此事甚為憤怒，認為自己僅求自保並沒有錯，遂在某日憤而持刀殺甲，經丁阻止而未得逞，但日後仍經法院判決殺人未遂而受刑之宣告確定。不久甲因年老體衰而去世，請問下列敘述，何者正確？", "opts": ["甲僅表示乙不得繼承其財產，未表示丙不得繼承，故丙仍可繼承其財產", "甲雖表示乙不得繼承其財產，但並未追訴乙之傷害罪，乙既未受刑之宣告，故乙仍得繼承甲的財產", "甲若宥恕丙之行為，則乙、丙、丁三人可以一起繼承甲的財產", "僅有丁可以繼承甲的財產"], "exp": ["✗A. 丙殺人未遂受刑之宣告，依§1145I①喪失繼承權，不可再繼承。", "✗B. 乙毆打甲屬重大虐待，經被繼承人表示不得繼承，依§1145I⑤喪失繼承權，不以受刑宣告為要件。", "✗C. 甲宥恕效力僅及第二款至第四款（§1145II），不適用第一款殺人未遂；乙、丙仍喪失繼承權。", "✓D（本題答案）. 乙、丙均喪失繼承權，僅丁可繼承（§1145I①⑤），正確。", "★喪失繼承權：①殺害（受刑宣告）、②③詐欺脅迫遺囑、④偽造遺囑、⑤重大虐待侮辱＋表示。陷阱：宥恕只適用②③④款。"]}, {"year": 108, "num": 20, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲育有子女乙，丙育有子女丁、戊，乙男與丁女結婚後育有子女己。就此情形，下列敘述何者錯誤？", "opts": ["甲、丁為直系姻親", "乙、戊為旁系姻親", "甲、丙為旁系姻親", "己、戊為旁系血親"], "exp": ["✓A. 丁為甲之子乙之配偶，屬血親之配偶，為直系姻親（§969、§970），正確。", "✓B. 戊為乙之配偶丁之血親（妹），為配偶之血親，旁系姻親（§970②），正確。", "✗C（本題答案）. 甲與丙為親家關係，屬血親之配偶之血親，不屬§969所列姻親，敘述錯誤。", "✓D. 己為丁之子，戊為丁之手足，為舅姨與外甥關係，三親等旁系血親，正確。", "★親家、連襟（配偶之血親之配偶除外）不是姻親。陷阱：「親家」是日常用語，法律上無親屬關係。"]}, {"year": 108, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙婚後生育有子女丙、丁、戊。戊與己結婚生育有子女庚、辛後，不幸早於其父母去世。就甲高齡過世後遺下之財產，下列法定繼承人之應繼分比例，何者正確？", "opts": ["乙二分之一、丙四分之一、丁四分之一", "乙三分之一、丙三分之一、丁三分之一", "乙四分之一、丙四分之一、丁四分之一、己四分之一", "乙四分之一、丙四分之一、丁四分之一、庚八分之一、辛八分之一"], "exp": ["✗A. 乙為配偶，與第一順位繼承人同為繼承時應繼分平均（§1144①），不是二分之一。", "✗B. 並非三等分，戊雖早亡，其直系血親卑親屬庚、辛代位繼承其應繼分（§1140）。", "✗C. 己為戊之配偶，不得代位，不得繼承甲之遺產。", "✓D（本題答案）. 乙、丙、丁、戊代位各1/4，庚、辛代位繼承戊之1/4，各1/8（§1140、§1144①），正確。", "★先算「本人」份數，再把代位份拆給代位人。陷阱：配偶不代位。"]}, {"year": 108, "num": 23, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列關於遺囑之敘述，何者正確？", "opts": ["十八歲之限制行為能力人所為之遺囑，當然無效", "受輔助宣告之成年人所為之遺囑，當然無效", "口授遺囑，自遺囑人能依其他方式為遺囑之時起，經過三個月而失其效力", "公證人的受僱人得為公證遺囑之見證人"], "exp": ["✗A. 18歲者已成年，非限制行為能力人；即使為限制行為能力人，滿16歲即得遺囑（§1186II），並非當然無效。", "✗B. 受輔助宣告者並不當然喪失行為能力（§15-1），遺囑僅排除無行為能力人（§1186I），並非當然無效。", "✓C（本題答案）. 口授遺囑自遺囑人能依其他方式為遺囑之時起，經過三個月失其效力（§1196），正確。", "✗D. 公證人之受僱人不得為遺囑見證人（§1198⑤），敘述錯誤。", "★現行法差異：112.1.1起成年為18歲，選項A所稱「十八歲之限制行為能力人」在現行法下已不存在，18歲者已成年；本題答案仍為C。", "★口授遺囑為緊急方式，三個月失效。陷阱：見證人消極資格包含公證人之同居人、助理人、受僱人。"]}, {"year": 108, "num": 24, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依我國民法之規定，下列關於子女姓氏之敘述，何者錯誤？", "opts": ["父母於子女出生登記前，應以書面約定子女從父姓或母姓。未約定或約定不成者，於戶政事務所抽籤決定之", "子女經出生登記後，於未成年前，得由父母以書面約定變更為父姓或母姓", "子女已成年者，得變更為父姓或母姓", "非婚生子女從母姓。經生父認領者，從父姓"], "exp": ["✓A. §1059 I：父母於子女出生登記前，應以書面約定從父姓或母姓；未約定或約定不成者，於戶政事務所抽籤決定。", "✓B. §1059 II：子女出生登記後、未成年前，得由父母以書面約定變更為父姓或母姓（變更以一次為限）。", "✓C. §1059 III：子女已成年者，得變更為父姓或母姓。", "✗D（本題答案）. §1059-1 I：非婚生子女從母姓；經生父認領後，是適用§1059 II至IV，由父母書面約定變更，並非當然改從父姓。", "★ 白話：姓氏是「約定」不是「自動換」。陷阱：認領≠改姓，認領後仍從母姓，要改須書面約定且有次數限制。"]}, {"year": 108, "num": 25, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲乙為夫妻，育有一子丙，並共同收養丁為養子。某日甲因交通意外去世，未留有遺囑，請問依我國民法的規定，下列敘述，何者錯誤？", "opts": ["乙、丙、丁三人得以繼承", "乙、丙、丁三人之應繼分各為三分之一", "在分割遺產前，乙、丙、丁三人對於遺產全部按其應繼分為分別共有", "繼承人對於甲之債務，以因繼承所得遺產為限，負清償責任"], "exp": ["✓A. 乙為配偶（§1144），丙為婚生子女，丁為養子；養子女與養父母之婚生子女地位相同（§1077 I），同為繼承人。", "✓B. 配偶與第一順序直系血親卑親屬同為繼承時，按人數平均（§1144 I），乙丙丁三人各三分之一。", "✗C（本題答案）. 分割前繼承人對遺產全部為「公同共有」（§1151），不是分別共有。", "✓D. §1148 II：繼承人對被繼承人債務，以因繼承所得遺產為限負清償責任（限定責任）。", "★ 白話：繼承人在分割前是「大家綁在一起」的公同共有，沒有各自可處分的份額。陷阱：應繼分是比例，不等於分別共有。"]}, {"year": 109, "num": 20, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列關於夫妻財產制契約之訂立，何者正確？", "opts": ["夫妻於結婚前或結婚後，均得以書面約定夫妻財產制契約", "夫妻財產制契約之訂立應經登記，否則不生效力", "夫妻財產制契約之訂立，當事人如為未成年人時，應得其法定代理人之同意始為有效", "夫妻於婚姻關係存續中，得以契約廢止其財產制契約，或改用他種約定財產制，但以一次為限"], "exp": ["✓A（本題答案）. §1004、§1007：夫妻於結婚前或結婚後，均得以書面訂立夫妻財產制契約，選擇約定財產制之一。", "✗B. 依§1008 I，契約之訂立、變更或廢止非經登記，僅「不得對抗第三人」，並非不生效力。", "✗C. 民法對夫妻財產制契約僅要求書面（§1007），並無須法定代理人同意之特別規定；當時未成年已結婚者有行為能力（舊§13 III）。", "✗D. §1012：婚姻關係存續中得以契約廢止財產制契約或改用他種約定財產制，條文並無「以一次為限」之限制。", "★ 白話：契約本身有效，登記只是為了對抗外人。陷阱：「不生效力」vs「不得對抗第三人」是常考的偷換字眼。"]}, {"year": 109, "num": 21, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲、乙結婚並約定共同財產制為夫妻財產制，共同財產制關係存續中二人之共同財產為 2000 萬元，若甲、乙離婚而無特別約定時，則乙可分得若干共同財產？", "opts": ["2000 萬元", "1000 萬元", "1500 萬元", "500 萬元"], "exp": ["✗A. 共同財產制關係消滅時，除另有約定外，各得共同財產之半數（§1040），並非全部歸乙。", "✓B（本題答案）. 離婚使共同財產制消滅，無特別約定時各得共同財產之半數（§1040 I），2000萬×1/2＝1000萬。", "✗C. 並無依比例分得四分之三之規定，法定為各得半數。", "✗D. 500萬為四分之一，與法定半數不符。", "★ 白話：共同財產制＝財產放同一個鍋，散夥時對半分。陷阱：與法定財產制「差額分配」區分，這裡是直接分共同財產。"]}, {"year": 109, "num": 22, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於夫妻法定財產制之敘述，何者正確？", "opts": ["於法定財產制下，夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "於法定財產制下，夫或妻之婚前及婚後財產，於婚姻關係存續中所生之孳息，均屬於婚後財產之範圍", "無論採何種約定財產，當夫或妻其財產不足清償其債務時，法院得因他方之請求，宣告改用法定財產制", "夫或妻各自管理、使用、收益其婚前財產與婚後財產，但對於婚後財產為處分時，應得他方之同意"], "exp": ["✗A. §1017 I：婚前、婚後財產均「由夫妻各自所有」，婚後財產並非共有。", "✓B（本題答案）. §1017 II：婚前財產之孳息視為婚後財產；婚後財產之孳息本屬婚後財產，故二者之孳息均在婚後財產範圍。", "✗C. 夫妻財產不足清償債務，依§1010，法院得因他方請求宣告改用「分別財產制」，而非法定財產制；且約定財產制才談改用。", "✗D. §1018：夫妻各自管理、使用、收益及處分其財產，處分婚後財產無須他方同意（僅有§1018-1等特別規定）。", "★ 白話：法定財產制是「各管各的，離婚才算差額」。陷阱：婚後財產不是共有，也不必經對方同意才能處分。"]}, {"year": 109, "num": 23, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲乙夫妻育有丙、丁二子及戊女。丙與己女結婚，婚後育有一子庚，戊女未婚生下一子辛。多年後甲死亡，而戊早於甲死亡，丙則拋棄繼承。設甲留有遺產 900 萬元，則甲之遺產應如何繼承？", "opts": ["乙、丁、庚各繼承 300 萬元", "乙、丁、辛各繼承 300 萬元", "乙、丁各繼承 450 萬元", "乙、丁、庚、辛各繼承 225 萬元"], "exp": ["✗A. 庚為丙之子，但丙係拋棄繼承，拋棄不發生代位繼承（§1140僅限先死亡或喪失繼承權），庚不得繼承。", "✓B（本題答案）. 戊先於甲死亡，其非婚生子女辛與生母戊之關係視為婚生（§1065 II），得代位繼承（§1140）；丙拋棄，故繼承人為乙、丁、辛三人，配偶與第一順序平均（§1144 I），各300萬。", "✗C. 遺漏辛之代位繼承，且乙、丁各450萬之算法不成立。", "✗D. 庚因丙拋棄而無繼承權，四人均分之說法錯誤。", "★ 白話：「拋棄」＝自始不當繼承人，份額回流給其他同順位者；「先死亡」＝由子女代位。陷阱：非婚生子女對生母視為婚生，可代位。"]}, {"year": 109, "num": 24, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲、乙為夫妻，並無子女。丙、丁為甲之父母。甲死亡時留有 350 萬元之現金及對丙有 50 萬元之債權。試問，於遺產分割時，丙可以分得多少遺產？", "opts": ["50 萬元", "100 萬元", "200 萬元", "350 萬元"], "exp": ["✓A（本題答案）. 遺產含現金350萬與對丙之50萬債權共400萬（§1148 I）；丙為第二順序，與配偶乙同為繼承，丙應繼分1/4（§1144 II）＝100萬，但丙對被繼承人負債50萬，分割時依§1172自其應繼分內扣還，實得50萬。", "✗B. 100萬為應繼分數額，未扣還丙對甲之50萬債務（§1172）。", "✗C. 200萬誤把父母二人合計當丙一人，或誤算配偶應繼分。", "✗D. 350萬僅為現金總額，忽略應繼分比例與債務扣還。", "★ 白話：繼承人欠被繼承人錢，要從自己那份「抵掉」。陷阱：配偶與父母同繼承，配偶1/2、父母平分另1/2，別忘債權也是遺產。"]}, {"year": 109, "num": 25, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲乙夫妻婚後育有一子丙，三人與甲寡居之母親丁同住。甲乙兩人因感情不睦，故協議離婚，惟某日前往辦理離婚登記途中，甲不幸發生事故身亡。甲生前曾預立有效遺囑一份，記載將來所有遺產均由獨子丙繼承。甲身後遺有現金 600 萬元。若繼承人主張特留分扣減權時，甲之遺產應如何分配？", "opts": ["乙繼承 300 萬元，丙繼承 300 萬元", "乙繼承 150 萬元，丙繼承 450 萬元", "乙繼承 200 萬元，丁繼承 200 萬元，丙繼承 200 萬元", "乙繼承 100 萬元，丁繼承 100 萬元，丙繼承 400 萬元"], "exp": ["✗A. 乙、丙各300萬為無遺囑時之應繼分；本題有遺囑全給丙，須經特留分扣減才有此外加調整。", "✓B（本題答案）. 離婚須登記才生效（§1050），乙仍為配偶。應繼分乙、丙各1/2；特留分均為應繼分1/2（§1223），乙特留分150萬，經扣減後乙150萬、丙450萬。", "✗C. 丁為第二順序，有第一順序丙時不得繼承（§1138、§1139），不應分得遺產。", "✗D. 同樣誤把丁列為繼承人，且乙特留分金額錯誤。", "★ 白話：遺囑不能把法定保留額度吃光。陷阱：沒登記完成的離婚＝還是配偶；有子女時父母不繼承，特留分是「應繼分的一半」。"]}, {"year": 110, "num": 19, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於夫妻財產制契約的敘述，下列何者正確？", "opts": ["夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行", "夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制", "夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力", "夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"], "exp": ["✗A. §1004：夫妻得於結婚前「或結婚後」以契約選擇約定財產制，婚後亦可（另見§1012）。", "✗B. §1005：未訂立契約者，以「法定財產制」為其夫妻財產制，聯合財產制已不存在。", "✗C. 依§1008 I，未登記僅「不得對抗第三人」，非不生效力。", "✓D（本題答案）. §1008 II：夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力。", "★ 白話：夫妻財產制登記和不動產登記是兩套系統，互不取代。陷阱：預設制度是法定財產制，不是聯合財產制。"]}, {"year": 110, "num": 22, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "民法關於非婚生子女之規定，下列何者錯誤？", "opts": ["如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴", "非婚生子女，其生父與生母結婚者，視為婚生子女", "非婚生子女經生父認領者，視為婚生子女", "非婚生子女或其生母，對於生父之認領，得否認之"], "exp": ["✗A（本題答案）. §1063 II：推定婚生子女，夫妻之一方或子女能證明非婚生者，提起的是「否認之訴」，不是認領之訴。", "✓B. §1064：非婚生子女，其生父與生母結婚者，視為婚生子女（準正）。", "✓C. §1065 I：非婚生子女經生父認領者，視為婚生子女。", "✓D. §1066：非婚生子女或其生母，對於生父之認領，得否認之。", "★ 白話：推定婚生用「否認之訴」推翻，非婚生用「認領之訴」確認。陷阱：兩個訴訟名稱常被調換。"]}, {"year": 110, "num": 23, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？", "opts": ["甲之遺產繼承人順序，丙優先於乙", "配偶丁與乙有相互繼承遺產之權", "就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應由丁繼承乙所繼承自甲之遺產", "拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之"], "exp": ["✓A. §1138：第一順序為直系血親卑親屬，第三順序才是兄弟姊妹，丙優先於乙。", "✓B. 配偶互為繼承人（§1144），丁與乙有相互繼承權。", "✗C（本題答案）. 乙於丙拋棄前已死亡，於丙拋棄時乙已無權利能力（§6），無法成為因拋棄而遞補之次順序繼承人（§1176 V），丁無從繼承乙取得自甲之遺產。", "✓D. §1174 II：拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之。", "★ 白話：遞補繼承要「人還活著」才接得到。陷阱：拋棄繼承溯及繼承開始，但已死亡者不能因此成為繼承人，別以為可以再轉給配偶。"]}, {"year": 110, "num": 24, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於喪失繼承權情事的敘述，下列何者正確？", "opts": ["故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者", "以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之，因而受刑之宣告者", "以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之，因而受刑之宣告者", "偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑，因而受刑之宣告，但經被繼承人宥恕者"], "exp": ["✓A（本題答案）. §1145 I①：故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者，喪失繼承權。", "✗B. §1145 I②：以詐欺或脅迫使被繼承人為遺囑或使其撤回、變更者即喪失，條文並無「因而受刑之宣告」之要件。", "✗C. §1145 I③：妨害遺囑之作成、撤回或變更者即喪失繼承權，無須受刑之宣告。", "✗D. §1145 I④：偽造、變造、隱匿或湮滅遺囑者喪失，不須受刑宣告；宥恕係另在§1145 II規定，選項把要件混入。", "★ 白話：只有「殺人」類才有「受刑宣告」的限制。陷阱：把第1款的受刑要件套到2～4款。"]}, {"year": 110, "num": 25, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於遺產分割的敘述，下列何者正確？", "opts": ["繼承人於服喪三年後得隨時請求分割遺產", "遺囑禁止遺產之分割者，其禁止之效力以二十年為限", "遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之支付能力，負擔保之責", "繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除"], "exp": ["✗A. §1164：繼承人得隨時請求分割遺產（法律另有規定或契約另有訂定者除外），並無「服喪三年」之限制。", "✗B. §1165 II：遺囑禁止遺產分割之效力以「十年」為限，不是二十年。", "✗C. §1169：擔保責任係就「遺產分割時」債務人之支付能力，非應清償時。", "✓D（本題答案）. §1171 II：繼承人連帶責任，自遺產分割時起，如債權清償期在分割後者自清償期屆滿時起，經過五年而免除。", "★ 白話：連帶責任不是永遠綁，五年過了就解套。陷阱：十年、二十年、「分割時」vs「清償時」等數字與時點。"]}, {"year": 111, "num": 1, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依我國民法第 1173 條有關歸扣之規定，下列何種被繼承人生前將財產贈與某特定繼承人，無須將該贈與價額，於遺產分割時，由該繼承人之應繼分中扣除？", "opts": ["因該特定繼承人結婚時之贈與", "因該特定繼承人重大災難生還時之贈與", "因該特定繼承人從家裡決定分居時之贈與", "因該特定繼承人決定經營事業時之贈與"], "exp": ["✗A. 因結婚所為之贈與，屬§1173 I列舉之特種贈與，須歸扣。", "✓B（本題答案）. 重大災難生還之贈與不屬§1173 I所列「結婚、分居、營業」，無須歸扣。", "✗C. 因分居所為之贈與，屬§1173 I列舉事由，須歸扣。", "✗D. 因營業所為之贈與，屬§1173 I列舉事由，須歸扣。", "★ 白話：只有結婚、分居、營業三種，才算「預先給的應繼分」。陷阱：本題問「無須」歸扣，答案是不在列舉內者（符號✓＝符合題幹「無須歸扣」）。"]}, {"year": 111, "num": 2, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列何種情況是非屬於近親禁止結婚之規範範圍？", "opts": ["與離婚後無依無靠之前小姨子結婚", "與終止收養後之前養女結婚", "與自己兒子離婚後之前媳婦結婚", "與叔叔死亡後孤苦守寡之叔母結婚"], "exp": ["✓A（本題答案）. 前小姨子為旁系姻親（二親等、同輩），§983 I③僅禁止「輩分不同」之旁系姻親五親等內結婚，故不在禁止範圍。", "✗B. 前養女與養父為因收養成立之直系血親，終止收養後仍適用禁止（§983 III），屬禁婚範圍。", "✗C. 前媳婦為直系姻親，姻親關係消滅後仍禁止結婚（§983 II），屬禁婚範圍。", "✗D. 叔母為旁系姻親三親等且輩分不同，屬§983 I③禁婚範圍。", "★ 白話：姻親只禁「長輩晚輩」和「直系」，同輩旁系姻親（如小姨子）不禁。陷阱：本題問「非屬」，符號✓＝不在禁婚範圍。"]}, {"year": 111, "num": 3, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何者得為被繼承人親屬中之法定繼承人？", "opts": ["被繼承人兄弟之配偶", "被繼承人父親之兄弟", "被繼承人母親之兄弟之配偶", "被繼承人所認領之非婚生子女"], "exp": ["✗A. 兄弟之配偶為旁系姻親，非§1138所列血親繼承人（僅配偶為例外）。", "✗B. 父親之兄弟為四親等旁系血親（伯叔），不在§1138所列順序（兄弟姊妹、祖父母止）。", "✗C. 母親之兄弟之配偶為姻親，非繼承人。", "✓D（本題答案）. 認領之非婚生子女視為婚生子女（§1065 I），屬第一順序直系血親卑親屬（§1138①）。", "★ 白話：繼承人只有配偶＋四個血親順序。陷阱：姻親（含兄弟之配偶）一律不是繼承人；本題問「得為」，符號✓＝符合題幹。"]}, {"year": 111, "num": 15, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承權。設甲死亡時留有遺產現金 600 萬元，並未立有遺囑。問：甲之遺產依法應如何分配？", "opts": ["乙、丙、丁、戊各 150 萬元", "乙、戊各 200 萬元，庚、辛各 100 萬元", "乙、丁、戊各 150 萬元，庚、辛各 75 萬元", "乙、戊各 300 萬元"], "exp": ["✓A（本題答案）. 丙對母乙侮辱，並非對「被繼承人甲」，不符§1145 I⑤，未喪失繼承權；丁於繼承開始前表示拋棄無效（§1174僅繼承開始後可為）。繼承人乙＋丙丁戊共四人平均（§1144 I），各150萬。", "✗B. 丙未喪失繼承權，庚辛無代位繼承（§1140）；且丁未有效拋棄。", "✗C. 丁預先之拋棄無效，仍為繼承人，且庚辛無代位原因。", "✗D. 丙、丁均仍為繼承人，不能僅由乙、戊分配。", "★ 白話：虐待侮辱要針對「被繼承人」，拋棄要等「繼承開始後」。陷阱：生前聲明拋棄無效；非婚生子女庚辛對丙為婚生，但沒有代位事由就不能繼承。"]}, {"year": 111, "num": 16, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於限定繼承之敘述，下列何者正確？", "opts": ["限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務", "繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益", "繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益", "繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"], "exp": ["✗A. §1148 II：限定繼承是仍繼承債務，但責任以所得遺產為限，並非不繼承債務。", "✓B（本題答案）. 現行§1148 II採有限責任為原則，未陳報遺產清冊並不當然喪失利益；喪失事由限於§1163所列。", "✗C. §1163：隱匿遺產情節重大者，不得主張§1148 II之利益。", "✗D. §1159 II、§1160：應先償還債權人（優先權者先），清償後才得對受遺贈人交付遺贈。", "★ 白話：現在是「概括繼承、有限責任」，不用特別辦也享有保護；做壞事（隱匿、虛報、詐害）才失去。陷阱：清償順序債權人先於受遺贈人。"]}, {"year": 111, "num": 17, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於夫妻法定財產制之規定，下列敘述何者正確？", "opts": ["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產", "夫或妻各自管理、使用、收益及處分其婚前及婚後財產，並各自對其債務負清償之責", "剩餘財產差額分配請求權屬一身專屬性之權利，請求權人自法定財產制關係消滅時起，二年間不行使而消滅"], "exp": ["✗A. §1017 I：婚前、婚後財產均各自所有，婚後財產不是共有。", "✗B. §1030-3：須「為減少他方分配 const TOTAL=117;
const SK='civlaw_official_e_v2';
let S={};
try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
const YEARS=[...new Set(QS.map(q=>q.year))].sort((a,b)=>a-b);
let aY='all',aF='all';
function isOK(q,L){return q.ans?L===q.ans:(q.acc?q.acc.includes(L):true)}
function gk(q){return q.year+'_'+q.num}
function getFilt(){
  return QS.filter(q=>{
    const k=gk(q),s=S[k];
    if(aY!=='all'&&q.year!==aY)return false;
    if(aF==='un')return!s;
    if(aF==='wrong')return s&&!s.ok;
    return true;
  });
}
function chips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  if(q.note){st.appendChild(mk('div','nl',q.note));}
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(isOK(q,L))o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  if(q.src==='ai'){ex.appendChild(mk('div','exp-line nl','※AI解析：條號憑記憶撰寫，以現行條文為準'));}
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:isOK(q,ch)};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
