<style>
:root{--pri:#2F5D50;--pri2:#3E7566;--key:#8A5517;--onpri:#FFFFFF;--hbg1:#2F5D50;--hbg2:#3E7566;--bg:#F5F1E6;--ink:#25302C;--red:#A8402B;--gold:#B8782E;--green:#35693F;--card:#FFFEFA;--line:#DDD6C0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.7;padding-bottom:76px !important}
header{padding:18px 16px 8px;max-width:760px;margin:auto}h1{font-family:'Noto Serif TC',serif;font-size:22px;margin:0;color:var(--pri)}
.sub{font-size:13px;color:#5F6B63}.wrap{max-width:760px;margin:auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin:12px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:15px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.qn{font-family:'Noto Serif TC',serif;color:var(--pri);font-weight:700}.stem{white-space:pre-wrap;margin:4px 0 10px}
.tag{display:inline-block;background:var(--gold);color:#fff;font-size:12px;padding:0 8px;border-radius:8px;margin-left:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;margin:6px 0;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.opt b{color:var(--key);margin-right:4px}.opt.ok{border-color:var(--green);background:#E0EFE0}.opt.bad{border-color:var(--red);background:#F8E4DD}
.opt .nt{display:none;font-size:13px;color:#4a443a;margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}.done .opt .nt{display:block}
.trap,.src,.cls{display:none;margin-top:8px;padding:8px 10px;font-size:14px;border-radius:6px}
.trap{background:#FBF1D9;border-left:4px solid var(--gold)}.src{font-size:12px;color:#5F6B63;padding:0 2px}
.done .trap,.done .src{display:block}.wrong.done .cls{display:block;background:#F8E4DD}
.cls button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;margin:2px;font-family:inherit;font-size:13px;cursor:pointer}.cls button.sel{background:var(--pri);color:var(--onpri)}
.score{position:sticky;top:50px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px}
.score button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-family:inherit}
.bar{height:14px;background:#EFE7D3;border-radius:7px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--green)}.bar i.lo{background:var(--red)}
.row{display:flex;justify-content:space-between;font-size:14px}.note{font-size:13px;color:#5F6B63}
.ph{font-family:'Noto Serif TC',serif;color:var(--green);font-weight:700;margin-top:10px}.pb{white-space:pre-wrap}
details summary{cursor:pointer;color:var(--pri);font-weight:700}.warn{font-size:13px;color:var(--red);margin-top:8px}
#tm{font-weight:700;color:var(--pri)}
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 解析樣式 B分離 / C摺疊 / D結論優先 */
.score{flex-wrap:wrap}.exs{flex-basis:100%;display:flex;gap:6px;align-items:center;margin:0;padding-top:4px;border-top:1px dashed var(--line);font-size:13px;color:#5F6B63;flex-wrap:wrap}
.exs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.exs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.bg{display:none;font-size:11px;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.done .opt.ok .bg.a{display:inline-block;background:var(--green)}.done .opt.bad .bg.p{display:inline-block;background:var(--red)}
.res,.exa{display:none}.tl{display:none;margin-top:8px}.done .tl{display:block}.tl a{display:inline-block;margin:2px 6px 2px 0;padding:2px 11px;border:1px solid var(--gold);border-radius:99px;color:var(--key);text-decoration:none;font-size:13px;font-weight:700;background:#FBF1D9}
.done .res{display:block;padding:8px 12px;border-radius:10px;font-weight:700;margin:6px 0;background:#F8E4DD;color:var(--red)}
.done:not(.wrong) .res{background:#E0EFE0;color:var(--green)}
.exa{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:13.5px}
.exa h4{margin:0 0 4px;font-size:14px;color:var(--pri)}.exa div{padding:5px 0;border-bottom:1px solid var(--line)}.exa div:last-child{border:0}
.card.done .opt .nt{display:none}
body[data-ex="B"] .done .exa{display:block}
body[data-ex="B"] .done .trap:not(.top),body[data-ex="D"] .done .trap:not(.top){display:none}body[data-ex="B"] .done .exa .tp{display:block}
body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="D"] .done .res{display:block}body[data-ex="B"] .done .res,body[data-ex="C"] .done .res{display:block}
.trap.top{display:none!important}body[data-ex="D"] .done .trap.top{display:block!important}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.arr{display:none;float:right;margin-left:6px;color:#8a8478;transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
.vd{display:none;margin-left:6px;font-size:13px}
body[data-ex="C"] .done .opt:not(.open) .vd,body[data-ex="D"] .done .opt:not(.open) .vd{display:inline}
body.allopen .done .vd{display:none!important}
.hn{display:none;font-size:12px;color:#5F6B63;margin:2px 0 6px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}

var D={"Q": [{"n": 1, "ch": "A", "sec": "A1 不得私有", "stem": "依土地法規定，下列何者屬於不得私有之土地？", "opts": ["林地", "漁地", "礦泉地", "牧地"], "ans": "C", "notes": ["❌ 林地是第17條「外國人不得取得」的土地，不是第14條不得私有。", "❌ 漁地同樣是第17條外國人不得取得，本國人可以私有。", "✅ 第14條第1項第6款：礦泉地不得為私有。", "❌ 牧地既不在第14條，也不在第17條（第17條沒有牧地）。"], "trap": "§14 不得私有（海岸、湖澤、水道、道路、礦泉地、瀑布地、公共需用之水源地、名勝古蹟）vs §17 外國人不得取得（林、漁、狩獵、鹽、礦、水源、要塞軍備及邊境）。兩條混著出是固定考法。", "src": "土地法§14Ⅰ、§17Ⅰ（官方逐字，已對全文）", "neg": false}, {"n": 2, "ch": "A", "sec": "A2 登記費", "stem": "依土地法規定，下列何種登記免繳納登記費？", "opts": ["繼承登記", "共有物分割登記", "土地總登記", "住址變更登記"], "ans": "D", "notes": ["❌ 繼承屬權利變更登記，按權利價值千分之一繳登記費（§76）。", "❌ 共有物分割登記也是權利變更登記，要繳。", "❌ 土地總登記按申報地價千分之二繳登記費（§65）。", "✅ 第78條第6款：住址變更登記免繳登記費。"], "trap": "§78 免費八款：重劃變更、更正、消滅、塗銷、更名、住址變更、標示變更、限制登記。繼承、分割、總登記都要繳。", "src": "土地法§78（官方逐字，已對全文）；§65、§76 見核實表", "neg": false}, {"n": 3, "ch": "A", "sec": "A2 地籍圖重測", "stem": "有關地籍圖重測，依土地法規定，下列敘述何者正確？", "opts": ["土地所有權人聲請複丈，經複丈者，不得再聲請複丈", "土地所有權人間發生界址糾紛，為辦理地籍圖重測之法定原因", "重新實施地籍測量之結果，應予公告，其期間為十五日", "未依規定設立界標或到場指界之土地所有權人，仍得於公告期間內聲請複丈"], "ans": "A", "notes": ["✅ 第46條之3第2項後段：經複丈者，不得再聲請複丈。", "❌ 第46條之1 的原因是地籍原圖破損、滅失、比例尺變更或其他重大原因；界址糾紛不是。", "❌ 公告期間為三十日（§46-3Ⅰ）。", "❌ §46-3Ⅱ 明文排除「未依前條規定設立界標或到場指界者」。"], "trap": "重測公告 30 日；未設界標、未到場指界的人不能聲請複丈；複丈只有一次。", "src": "土地法§46-1、§46-3（官方逐字，已對全文）", "neg": false}, {"n": 4, "ch": "A", "sec": "A2 預告登記", "stem": "依土地法第79條之1規定，預告登記對於下列何者所為之新登記，無排除之效力？", "opts": ["登記名義人將土地出賣他人所為之所有權移轉登記", "登記名義人將土地贈與他人所為之所有權移轉登記", "因強制執行而為之新登記", "登記名義人就土地設定地上權所為之登記"], "ans": "C", "notes": ["❌ 這是登記名義人自己的處分；對所登記之請求權有妨礙者無效（§79-1Ⅱ）。", "❌ 同上，屬登記名義人之處分。", "✅ 第79條之1第3項：預告登記對於因徵收、法院判決或強制執行而為新登記，無排除之效力。", "❌ 設定地上權也是登記名義人之處分，受預告登記拘束。"], "trap": "無排除效力只有三種：徵收、法院判決、強制執行。看到「登記名義人自己做的」一律受限制。", "src": "土地法§79-1（官方逐字，已對全文）", "neg": false}, {"n": 5, "ch": "A", "sec": "A3 §34-1 適用範圍", "stem": "依土地法第34條之1規定，共有土地得以共有人過半數及其應有部分合計過半數之同意，為下列何種行為？", "opts": ["設定抵押權", "設定不動產役權", "共有物之分割", "以共有土地成立信託"], "ans": "B", "notes": ["❌ 第1項只列地上權、農育權、不動產役權、典權；抵押權不在內，須全體同意（民法§819Ⅱ）。", "✅ 第1項明列「設定……不動產役權」。", "❌ 執行要點第3點：處分不包括共有物分割；分割走§34-1Ⅵ調處或法院。", "❌ 執行要點第3點：處分以有償讓與為限，不包括信託行為。"], "trap": "四種用益物權（地上、農育、不動產役、典）可以多數決；抵押權不行。處分不含信託、交換所有權、分割。", "src": "土地法§34-1Ⅰ（官方逐字）；§34-1 執行要點第3點（112.8.22，核實表）", "neg": false}, {"n": 6, "ch": "A", "sec": "A3 §34-1 程序", "neg": false, "stem": "共有人依土地法第34條之1規定處分共有土地時，下列敘述何者錯誤？", "opts": ["應事先以書面通知他共有人", "同意處分之共有人，對於他共有人應得之對價或補償，負連帶清償責任", "共有人之應有部分合計逾三分之二者，其人數不予計算", "他共有人不能以書面通知者，應聲請法院為公示催告"], "ans": "D", "notes": ["✅ 第2項前段，敘述正確。", "✅ 第3項前段，敘述正確。", "✅ 第1項但書，敘述正確。", "❌ 第2項後段是「應公告之」，不是聲請法院公示催告（本題答案）。"], "trap": "不能書面通知→「公告」（要點：最後登載日起 20 日生通知效力）；不是公示催告。", "src": "土地法§34-1Ⅰ～Ⅲ（官方逐字，已對全文）"}, {"n": 7, "ch": "A", "sec": "A4 收回房屋", "neg": false, "stem": "依土地法第100條規定，出租人非因下列情形之一，不得收回房屋。下列何者非屬之？", "opts": ["出租人欲將房屋出售予第三人時", "出租人收回自住或重新建築時", "承租人積欠租金額，除擔保金抵償外，達二個月以上時", "承租人損壞出租人之房屋或附著財物，而不為相當之賠償時"], "ans": "A", "notes": ["❌ 出售房屋不在第100條六款之內（買賣不破租賃，民法§425）——本題答案。", "✅ 第1款。", "✅ 第3款。", "✅ 第6款。"], "trap": "房屋（§100）積欠租金「二個月」；基地（§103）積欠租金「二年」。數字對調是常考陷阱。", "src": "土地法§100（官方逐字，已對全文）；§103 見核實表"}, {"n": 8, "ch": "A", "sec": "A5 公有土地", "stem": "有關公有土地，下列敘述何者正確？", "opts": ["直轄市或縣（市）政府對於其所管公有土地，非經該管區內民意機關同意，並經行政院核准，不得為超過五年期間之租賃", "土地法所稱公有土地，為國有土地、直轄市有土地、縣（市）有土地或鄉（鎮、市）有之土地", "政府因一般徵收而取得之土地，得隨時公開出售，不受土地法第25條之限制", "直轄市或縣（市）政府處分其所管公有土地，經該管區內民意機關同意即可，無須經行政院核准"], "ans": "B", "notes": ["❌ 第25條是「超過十年期間之租賃」。", "✅ 第4條定義。", "❌ 平均地權條例§7 只限照價收買、區段徵收、土地重劃取得之土地；一般徵收不在內。", "❌ 第25條要「民意機關同意，並經行政院核准」兩道。"], "trap": "§25 三件事要雙重同意：處分、設定負擔、超過 10 年租賃。可隨時出售的只有照價收買、區段徵收、重劃取得的地。", "src": "土地法§4、§25；平均地權條例§7（官方逐字，已對全文）", "neg": false}, {"n": 9, "ch": "B", "sec": "B1 區域計畫公告", "stem": "依區域計畫法規定，區域計畫核定後，擬定計畫之機關應於接到核定公文之日起幾日內公告實施？", "opts": ["三十日", "四十日", "六十日", "九十日"], "ans": "B", "notes": ["❌ 三十日是公開展示期間的下限（不得少於三十日），不是公告實施期限。", "✅ 區域計畫法第10條：接到核定公文之日起四十天內公告實施。", "❌ 無此規定。", "❌ 無此規定。"], "trap": "區計：40 天內公告實施、展示不少於 30 日；都計：接到核定公文 30 日內發布實施（§21）。", "src": "區域計畫法§10（核實表，已對全文）；都市計畫法§21", "neg": false}, {"n": 10, "ch": "B", "sec": "B2 迅行變更", "neg": false, "stem": "依都市計畫法第27條規定，都市計畫經發布實施後，遇有下列情事之一時，當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所，應視實際情況迅行變更。下列何者非屬之？ , "法院發給權利移轉證明書之日"], "ans": "D", "notes": ["❌ 拍定日是土地稅法§30 拍賣土地「移轉現值」的審核基準日，不是契稅申報起算日。", "❌ 無此規定。", "❌ 契稅要在登記前申報，不會以登記日起算。", "✅ 第16條第4項：以法院發給權利移轉證明書之日為申報起算日。"], "trap": "契稅起算：一般契約成立日、糾紛看判決確定日、公產看產權移轉證明書、法院拍賣看權利移轉證明書、變更起造人看使用執照核發滿 30 日。", "src": "契稅條例§16（官方逐字，已對全文）；土地稅法§30Ⅰ⑤", "neg": false}, {"n": 24, "ch": "G", "sec": "G1 免徵契稅", "stem": "依契稅條例規定，下列何者免徵契稅？", "opts": ["依法領買公產之不動產", "各級政府機關因公使用而取得之不動產，但供營業用者除外", "向法院標購拍賣之不動產", "因占有而依法取得所有權之不動產"], "ans": "B", "notes": ["❌ 第11條：依法領買或標購公產，仍應申報繳納契稅。", "✅ 第14條第1款。", "❌ 第11條：向法院標購拍賣之不動產，仍應申報繳納。", "❌ 第2條：因占有而取得所有權應申報繳納（稅率 6%）。"], "trap": "「領買公產、法院拍賣」常被誤以為免稅，其實§11 明文仍應繳。免徵五款首款是政府機關因公使用（供營業用除外）。", "src": "契稅條例§2、§11、§14（官方逐字，已對全文）", "neg": false}, {"n": 25, "ch": "H", "sec": "H1 自住免稅", "neg": false, "stem": "個人交易其自住房屋、土地，依所得稅法第4條之5規定申請免納所得稅，下列敘述何者錯誤？", "opts": ["個人或其配偶、未成年子女辦竣戶籍登記、持有並居住於該房屋連續滿六年", "交易前六年內，無出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易前六年內未曾適用本款規定", "免稅所得額以新臺幣四百萬元為限，超過部分按百分之二十課徵"], "ans": "D", "notes": ["✅ 第4條之5第1項第1款第1目。", "✅ 第2目。", "✅ 第3目。", "❌ 超過四百萬元部分稅率為百分之十（§14-4Ⅲ①(八)）——本題答案。"], "trap": "房地合一自住：三個「6 年」＋免稅 400 萬、超過部分 10%。20% 是持有 5～10 年或非自願因素。", "src": "所得稅法§4-5、§14-4（官方逐字，已對全文）"}], "E": [{"t": "申論一（25分）", "q": "一、甲所有A地位於都市計畫區內，經都市計畫劃設為「公園用地」，迄今已逾二十五年仍未經政府取得；甲於該地上一直經營露天停車場。試依都市計畫法及土地徵收條例規定說明：㈠保留期間，甲得為如何之使用？㈡政府取得公共設施保留地之方式為何？甲有無主動促使政府取得之途徑？㈢如政府嗣後辦理徵收，A地之地價應如何補償？（25分）", "parts": [["一、定義", "公共設施保留地，係指都市計畫劃設為公共設施用地（如公園、道路、學校），但尚未由政府依法取得之私有土地（學理用語，都市計畫法未設定義條文）。保留期間所有權仍屬原所有權人，僅使用受到限制，並由法律提供臨時建築、交換及徵收補償等配套。"], ["二、法條", "1. 都市計畫法第51條：「依本法指定之公共設施保留地，不得為妨礙其指定目的之使用。但得繼續為原來之使用或改為妨礙目的較輕之使用。」\n2. 同法第50條第1項：「公共設施保留地在未取得前，得申請為臨時建築使用。」第2項：臨時建築之權利人，經地方政府通知開闢公共設施並限期拆除回復原狀時，「應自行無條件拆除；其不自行拆除者，予以強制拆除」。\n3. 同法第48條：公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；「其餘由該管政府或鄉、鎮、縣轄市公所依左列方式取得之：一、徵收。二、區段徵收。三、市地重劃。」\n4. 同法第50條之2第1項：「私有公共設施保留地得申請與公有非公用土地辦理交換，……劃設逾二十五年未經政府取得者，得優先辦理交換。」\n5. 土地徵收條例第30條第1項：「被徵收之土地，應按照徵收當期之市價補償其地價。在都市計畫區內之公共設施保留地，應按毗鄰非公共設施保留地之平均市價補償其地價。」第2項：市價由直轄市、縣（市）主管機關提交地價評議委員會評定之。"], ["三、涵攝分析", "㈠ 保留期間之使用：甲原經營露天停車場，屬「原來之使用」，依都市計畫法第51條但書得繼續使用，亦得改為妨礙公園目的較輕之使用；但不得為妨礙公園指定目的之使用（例如興建永久性建築物）。甲如需搭建設施，只能依第50條申請臨時建築，日後地方政府通知開闢公園並限期拆除時，應自行無條件拆除，否則強制拆除。\n㈡ 取得方式：A地為公園用地，非供公用事業設施之用，依第48條由該管政府或鄉、鎮、縣轄市公所以徵收、區段徵收或市地重劃取得。甲之主動途徑：依第50條之2第1項，甲得申請以A地與公有非公用土地辦理交換；A地劃設已逾二十五年未經政府取得，得「優先」辦理交換。\n㈢ 徵收補償：依土地徵收條例第30條第1項後段，A地應按「毗鄰非公共設施保留地之平均市價」補償，該市價由主管機關提交地價評議委員會評定。舊制「平均公告土地現值加成補償」已非現行規定，作答不可再寫。"], ["四、結論", "甲於保留期間得繼續經營停車場或改為妨礙目的較輕之使用，搭建設施僅能申請臨時建築並負無條件拆除義務；政府依都市計畫法第48條以徵收、區段徵收、市地重劃取得，甲得依第50條之2申請與公有非公用土地交換，因劃設逾二十五年得優先辦理；將來徵收時，按毗鄰非公共設施保留地之平均市價補償。"]], "warn": "考選部不公布申論參考答案；本解答依現行條文自擬，引號內為條文逐字（2026-11-11 對照站上條文庫）。"}, {"t": "申論二（25分）", "q": "二、甲在A市有下列三筆土地：A1地為都市土地，面積四公畝，地上房屋由甲與配偶、子女居住並設有戶籍，無出租或營業；A2地已設定典權予乙；A3地為甲與丙分別共有，應有部分各二分之一。試依土地稅法規定說明：㈠A1、A2、A3地地價稅之納稅義務人各為何？㈡A1地申請適用自用住宅用地稅率之要件、稅率及申請期限為何？其面積超過部分如何課徵？（25分）", "parts": [["一、定義", "地價稅是對已規定地價之土地，按申報地價課徵之持有稅，採累進稅率。土地稅法第9條：「本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。」"], ["二、法條", "1. 土地稅法第3條第1項：「地價稅或田賦之納稅義務人如左：一、土地所有權人。二、設有典權土地，為典權人。三、承領土地，為承領人。四、承墾土地，為耕作權人。」第2項：土地所有權屬於公有或公同共有者，以管理機關或管理人為納稅義務人；「其為分別共有者，地價稅以共有人各按其應有部分為納稅義務人」。\n2. 同法第17條第1項：「合於左列規定之自用住宅用地，其地價稅按千分之二計徵：一、都市土地面積未超過三公畝部分。二、非都市土地面積未超過七公畝部分。」第3項：「土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。」\n3. 同法第41條第1項：適用特別稅率之用地，「土地所有權人應於每年地價稅開徵四十日前提出申請，逾期申請者，自申請之次年開始適用。前已核定而用途未變更者，以後免再申請。」第2項：原因、事實消滅時，應即向主管稽徵機關申報。\n4. 同法第16條第1項：「地價稅基本稅率為千分之十。」地價總額超過累進起點地價者，就超過部分依千分之十五至千分之五十五累進課徵。"], ["三、涵攝分析", "㈠ 納稅義務人：A1地為甲所有，納稅義務人為所有權人甲（§3Ⅰ①）。A2地設有典權，納稅義務人為典權人乙，而非所有權人甲（§3Ⅰ②）。A3地為分別共有，地價稅以甲、丙各按應有部分二分之一為納稅義務人（§3Ⅱ）；注意「推舉代表人」只適用於田賦，地價稅不適用。\n㈡ A1地自用住宅用地：\n1. 要件：甲與配偶、子女於該地辦竣戶籍登記，且無出租或供營業用，屬住宅用地（§9）；甲與配偶及未成年之受扶養親屬以一處為限（§17Ⅲ）。\n2. 稅率及面積：都市土地未超過三公畝部分，按千分之二計徵（§17Ⅰ①）。\n3. 申請期限：甲應於每年地價稅開徵四十日前提出申請；逾期者自申請之次年開始適用；核定後用途未變更者以後免再申請；如嗣後出租或營業，應即申報（§41）。\n4. 超過部分：A1地四公畝，其中三公畝按千分之二；超過之一公畝不適用自用住宅稅率，依第16條一般稅率課徵，即併入甲之地價總額，按基本稅率千分之十，超過累進起點地價者累進課徵。"], ["四、結論", "A1地由甲、A2地由典權人乙、A3地由甲與丙各按二分之一負擔地價稅。A1地符合設籍、無出租營業、以一處為限等要件，經於開徵四十日前申請後，三公畝部分按千分之二課徵，超過之一公畝依第16條一般稅率課徵。"]], "warn": "考選部不公布申論參考答案；本解答依現行條文自擬，引號內為條文逐字（2026-11-11 對照站上條文庫）。"}], "timer": true},ID="landdiag2";

 qHost.querySelector("#sc").textContent="已答 "+a+"/"+D.Q.length+"｜答對 "+c+"｜選擇題 "+(c*2)+"/"+(D.Q.length*2);save()}
function mm(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function mkQ(host){
 var top='<div class="score"><span id="sc"></span>'+(D.timer?'<span id="tm">90:00</span><button id="tb">開始計時</button>':'')+'<button id="rs">重做</button><div class="exs">解析樣式<button data-m="B">分離式</button><button data-m="C">摺疊式</button><button data-m="D">結論優先</button><button class="ea" id="ea">全部展開</button></div></div>';
 host.innerHTML=top;
 [].forEach.call(host.querySelectorAll(".exs button[data-m]"),function(b){b.onclick=function(){setEx(b.dataset.m)}});host.querySelector("#ea").onclick=function(){var on=document.body.classList.toggle("allopen");this.textContent=on?"全部收合":"全部展開"};setEx(EX);
 D.Q.forEach(function(q){
  var c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="qn">第'+q.n+'題<span class="tag">'+q.sec+'</span>'+(q.neg?'<span class="tag" style="background:var(--red)">問錯誤</span>':'')+'</div><div class="stem"></div><div class="res"></div><div class="trap top"></div><div class="hn">點每個選項可展開／收合說明；右上「全部展開」一次看完</div><div class="os"></div><div class="exa"></div><div class="trap"></div><div class="tl"></div><div class="src"></div><div class="cls">這題為何答錯？<span class="bs"></span></div>';
  c.querySelector(".stem").textContent=q.stem;
  var os=c.querySelector(".os");
  q.opts.forEach(function(t,i){
   var b=document.createElement("button");b.className="opt";
   b.innerHTML='<b>('+L[i]+')</b><span class="tx"></span><span class="bg a">正解</span><span class="bg p">你選的</span><span class="arr">▾</span><span class="vd"></span><div class="nt"></div>';
   b.querySelector(".tx").textContent=t;b.querySelector(".nt").textContent=q.notes[i];
   b.onclick=(function(qq,ii,cc){return function(){
     if(cc.classList.contains("done")){this.classList.toggle("open");return}
     cc.classList.add("done");var ok=(L[ii]===qq.ans);st[qq.n]=ok;if(!ok)cc.classList.add("wrong");
     cc.querySelectorAll(".opt").forEach(function(x,j){if(L[j]===qq.ans)x.classList.add("ok");else if(j===ii)x.classList.add("bad")});
     qq.opts.forEach(function(t,j){var vd=cc.querySelectorAll(".opt")[j].querySelector(".vd"),ch=qq.notes[j].charAt(0);vd.textContent=(ch==="❌"||ch==="✅")?ch:""});
     applyOpen(cc);
     cc.querySelector(".res").textContent=(ok?"答對了":"答錯了")+"　正解 "+qq.ans+(ok?"":"（你選 "+L[ii]+"）");
     var tp=cc.querySelector(".trap.top");tp.textContent="🎯 考試陷阱："+qq.trap;
     var ea=cc.querySelector(".exa");ea.innerHTML="<h4>逐選項解析</h4>";qq.opts.forEach(function(t,j){var d=document.createElement("div");d.textContent="("+L[j]+") "+qq.notes[j];ea.appendChild(d)});
     var tt=document.createElement("div");tt.className="tp";tt.textContent="🎯 考試陷阱："+qq.trap;tt.style.cssText="background:#FBF1D9;border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px";ea.appendChild(tt);
     upd();}})(q,i,c);
   os.appendChild(b)});
  c.querySelector(".trap:not(.top)").textContent="🎯 考試陷阱（正解 "+q.ans+"）："+q.trap;
  c.querySelector(".src").textContent="來源："+q.src;
  var tl=c.querySelector(".tl");taxLinks(q).forEach(function(a){var e=document.createElement("a");e.href="土地法_稅率總表.html#"+a[1];e.target="_blank";e.rel="noopener";e.textContent="💰 稅務總表："+a[0]+" →";tl.appendChild(e)});
  var bs=c.querySelector(".bs");
  [["A","A 法條混淆"],["B","B 粗心"],["C","C 真的不熟"]].forEach(function(t){
   var b=document.createElement("button");b.textContent=t[1];
   b.onclick=(function(qq,k,bb,cc){return function(){cl[qq.n]=k;cc.querySelectorAll(".cls button").forEach(function(x){x.className=""});bb.className="sel"}})(q,t[0],b,c);
   bs.appendChild(b)});
  host.appendChild(c)});
 qHost.querySelector("#rs").onclick=function(){st={};cl={};if(tmr){clearInterval(tmr);tmr=null}left=5400;mkQ(qHost);go(0)};
 if(D.timer){qHost.querySelector("#tb").onclick=function(){
   if(tmr){clearInterval(tmr);tmr=null;qHost.querySelector("#tb").textContent="繼續計時";return}
   qHost.querySelector("#tb").textContent="暫停";tmr=setInterval(function(){left--;qHost.querySelector("#tm").textContent=mm(Math.max(left,0));
    if(left<=0){clearInterval(tmr);tmr=null;qHost.querySelector("#tm").textContent="時間到";qHost.querySelector("#tb").textContent="已結束"}},1000)}}
 upd()}
function mkE(host){
 host.innerHTML='<div class="note">申論兩題共 50 分。建議先自己寫在紙上，再展開四段式參考解答對照。</div>';
 D.E.forEach(function(x){
  var c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="qn"></div><div class="stem"></div><details><summary>展開四段式參考解答</summary><div class="ans"></div></details><div class="warn"></div>';
  c.querySelector(".qn").textContent=x.t;c.querySelector(".stem").textContent=x.q;
  var a=c.querySelector(".ans");
  x.parts.forEach(function(p){var h=document.createElement("div");h.className="ph";h.textContent=p[0];var b=document.createElement("div");b.className="pb";b.textContent=p[1];a.appendChild(h);a.appendChild(b)});
  c.querySelector(".warn").textContent="⚠️ "+x.warn;host.appendChild(c)})}
function mkR(host){
 host.innerHTML="";var N=D.Q.length;
 var tot={},ok={},n=0;
 D.Q.forEach(function(q){tot[q.ch]=(tot[q.ch]||0)+1;if(st[q.n]!==undefined)n++;if(st[q.n])ok[q.ch]=(ok[q.ch]||0)+1});
 var c=document.createElement("div");c.className="card";
 var h='<div class="qn">分篇答對率</div>';
 if(n<N)h+='<div class="note">尚有 '+(N-n)+' 題未作答，結果僅供參考。</div>';
 Object.keys(NAMES).forEach(function(k){if(!tot[k])return;var t=tot[k],o=ok[k]||0,p=Math.round(o*100/t);
  h+='<div class="row"><span>'+NAMES[k]+'</span><span>'+o+'/'+t+'（'+p+'%）</span></div><div class="bar"><i class="'+(p<70?'lo':'')+'" style="width:'+p+'%"></i></div>'});
 c.innerHTML=h;host.appendChild(c);
 var wr=D.Q.filter(function(q){return st[q.n]===false});
 var cnt={A:0,B:0,C:0,N:0};wr.forEach(function(q){cnt[cl[q.n]||"N"]++});
 var d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="qn">錯題歸類</div><div class="note">A 法條混淆 '+cnt.A+'｜B 粗心 '+cnt.B+'｜C 真的不熟 '+cnt.C+'｜未歸類 '+cnt.N+'</div><div class="ls"></div>';
 var ls=d.querySelector(".ls");
 if(!wr.length){ls.textContent=n?"目前沒有答錯的題目。":"尚未作答。"}
 wr.forEach(function(q){var p=document.createElement("div");p.className="row";p.style.margin="6px 0";
  p.textContent="第"+q.n+"題｜"+q.sec+"｜"+(cl[q.n]?cl[q.n]+"型":"未歸類");ls.appendChild(p)});
 host.appendChild(d);
 var e=document.createElement("div");e.className="card";
 e.innerHTML='<div class="qn">怎麼讀這份結果</div><div class="note">單一篇低於 70%（紅條）＝優先補強；A 型多＝做混淆對比表；C 型多＝回重點筆記重讀；B 型多＝放慢題幹審題。把結果貼回專案對話，我據此調整後續卷。</div>';
 host.appendChild(e)}

mkQ(qHost);go(0);
