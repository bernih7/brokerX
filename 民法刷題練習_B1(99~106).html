<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 B+C篇 99–106年 前期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;--green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;--chip-bg:#EDE7D8;--chip-text:#5C5248}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border)}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>📖 民法概要 B+C篇｜99–106年 前期｜整批刷題練習</h1>

</header>
<div class="bar">
  <button class="fbtn active" data-f="all">全部</button>
  <button class="fbtn" data-f="un">未作答</button>
  <button class="fbtn" data-f="wrong">答錯</button>
  <button class="fbtn danger" data-f="clear">清除紀錄</button>
  <span class="stat" id="stat"></span>
</div>
<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill" id="prog" style="width:0%"></div></div></div>
<div class="chips" id="chips"></div>
<main id="main"></main>
<footer>📅 2026-07-02｜v1.0｜民法概要 B+C篇（債編）99–106年 前期｜BrokerX備考專案</footer>
<script>
const QS=[{"year": 99, "num": 9, "ans": "C", "stem": "下列何種情形，係行使形成權之行為？", "opts": ["贈與人交付贈與物", "共有人出賣應有部分", "受僱人依法提出辭呈", "買賣雙方合意解除契約"], "exp": ["✗A. 交付贈與物係履行契約的「事實行為」，不是形成權行使（形成權是單方意思表示使法律關係產生/變更/消滅）。", "✗B. 共有人出賣應有部分屬正常財產處分行為（契約），並非單方形成法律關係。", "✓C. 受僱人提出辭呈是「單方意思表示使勞動契約消滅」，典型形成權行使，正確。形成權例：撤銷、解除、辭職、終止、抵銷。", "✗D. 合意解除需雙方同意，屬雙方行為（合意契約），非單方形成權。"]}, {"year": 99, "num": 13, "ans": "B", "stem": "甲男與乙女為男女朋友關係，甲同意將其名下之豪宅贈與乙，以下之敘述何者錯誤？", "opts": ["甲在未移轉該屋之所有權給乙之前，隨時可以向乙表示反悔，撤銷贈與", "贈與為單獨行為", "甲在未移轉房屋所有權給乙之前，因為電線走火將該屋燒毀時，除非甲有故意重大過失，乙不得對甲請求損害賠償", "贈與為諾成契約，意思合致即成立"], "exp": ["✓A. 依§408Ⅰ，贈與人於給付前得撤銷之，正確。", "✗B（本題答案）. 贈與為「雙方契約」（需受贈人承諾），並非單獨行為。單獨行為是遺囑、解除、拋棄等，不需對方承諾即生效；贈與須乙同意接受，故為契約，「單獨行為」描述錯誤。", "✓C. §408Ⅱ、§410，贈與人責任以故意或重大過失為限，正確。", "✓D. 贈與係諾成契約（雙方意思表示合致即成立，不以物之交付為成立要件），正確。"]}, {"year": 99, "num": 15, "ans": "B", "stem": "甲至乙家具行購買1組展示中之沙發，約定於隔日由乙送貨至甲指定之處所。乙之員工丙送貨途中，因精神不濟發生翻車事故，沙發全毀，以下敘述何者錯誤？", "opts": ["雖然沙發係因丙之過失而毀損，乙仍須負債務不履行之責任", "因為尚有另外1組圖案類似之沙發可以替代，乙仍應繼續履行契約，以同款沙發交付甲", "買賣契約成立後，沙發滅失之危險，由乙負擔", "甲可請求乙損害賠償"], "exp": ["✓A. 債務人（乙）使用履行輔助人（丙）時，輔助人過失視為債務人過失（§224），乙須負債務不履行責任，正確。", "✗B（本題答案）. 本題買的是展示中之「特定物」沙發，特定物不得以「類似物」代替，乙無從再用另一組同款替代；若為種類物才可另行交付，本選項描述錯誤（事實上甲購買特定沙發，另一組圖案類似者為不同物，不能強迫甲接受）。", "✓C. 依危險負擔原則（§373），特定物買賣，危險於「交付前」由出賣人（乙）負擔，沙發未交付即滅失，乙負擔風險，正確。", "✓D. 可歸責於乙（透過丙）之給付不能，甲得請求損害賠償（§226），正確。"]}, {"year": 99, "num": 17, "ans": "C", "stem": "以下有關租賃關係之敘述何者正確？", "opts": ["租賃物如有修繕之必要，基於使用者付費之原則，應由承租人負擔修繕之費用", "承租人有使用收益租賃物之權利，所以可以自行將房間分租，當二房東", "甲將其房屋出租與乙，言明租期3年，有訂立契約書但未公證。若甲後來將房屋賣給丙，依買賣不破租賃，丙須繼續依契約出租予乙", "租賃物的占有，由出租人依賴承租人代為占有"], "exp": ["✗A. 租賃物之修繕義務原則上由出租人負擔（§429），而非承租人，例外才由承租人負擔（如微小修繕），選項說法顛倒。", "✗B. 承租人非經出租人同意，不得將租賃物轉租（§443Ⅰ），不得「自行」當二房東，擅自轉租出租人得終止契約。", "✓C. 不動產租賃契約（§425），出租人將租賃物讓與第三人（丙）時，其租賃契約對受讓人（丙）仍繼續存在（買賣不破租賃）；惟須在「已交付」且合法成立之租賃，本題已訂契約書、乙已居住，符合要件，正確。", "✗D. 承租人為租賃物之「直接占有人」，出租人為「間接占有人」，不是承租人替出租人「代為占有」，兩者地位描述相反。"]}, {"year": 99, "num": 29, "ans": "C", "stem": "債務人甲在其3000萬元之抵押土地上，有乙、丙、丁第一、第二及第三順位依次序為1000萬元、2000萬元及800萬元之普通抵押權，乙為丁抵押權人之利益，而將其第一順位讓與丁。此稱之為：", "opts": ["次序之絕對拋棄", "次序之相對拋棄", "次序之讓與", "次序之絕對讓與"], "exp": ["✗A. 次序絕對拋棄：後順位抵押權人受益，前順位拋棄後，所有後順位均整體向前移動，非本題情形。", "✗B. 次序相對拋棄：前順位抵押權人只對特定後順位放棄，但自己仍保有順位，非本題情形（本題乙是將順位「讓與」丁，不是拋棄）。", "✓C. 次序讓與：前順位抵押權人（乙）將其「次序」讓與後順位（丁），使丁取得乙原先之第一順位，而乙退至丁原來的第三順位，此即為次序之讓與（§870-1意旨），正確。", "✗D. 「次序之絕對讓與」並非民法明文用語，本題正確術語為「次序之讓與」，D選項不正確。"]}, {"year": 100, "num": 1, "ans": "D", "stem": "下列關於贈與契約之敘述何者正確？", "opts": ["贈與契約之贈與人對其贈與之物，有瑕疵時，原則上贈與人應負物之瑕疵擔保責任", "贈與契約為無償契約，所以贈與人均可撤銷其贈與", "定期給付之贈與，不因贈與人死亡而失其效力", "贈與人僅就其故意或重大過失，對於受贈人不負給付不能之責任"], "exp": ["✗A. 贈與人原則上「不負」物之瑕疵擔保責任（§411），因無償，責任從輕，例外僅在故意不告知瑕疵時負責，原則為不負責。", "✗B. 贈與人撤銷贈與須符合法定要件（如受贈人對贈與人有忘恩負義行為§416），並非任意均可撤銷；已交付者更有限制。", "✗C. 依§420，定期給付之贈與，因贈與人死亡而失其效力，本選項描述相反。", "✓D. 依§410，贈與人因給付不能所生責任，以「故意或重大過失」為限，即僅此情形才負責，正確。"]}, {"year": 100, "num": 2, "ans": "B", "stem": "關於租賃契約，下列何者錯誤？", "opts": ["出租人不以所有權人為限", "未立字據之租約無效", "租賃契約之承租人為租賃物之直接占有人，出租人為間接占有人", "租賃契約為有償契約"], "exp": ["✓A. 出租人不以所有人為限，有占有使用權即可出租（如二房東），正確。", "✗B（本題答案）. 租賃契約為「不要式契約」，不以書面為成立要件；口頭租約有效，只是不動產租賃逾一年者應以書面訂立，未以書面者「視為不定期限」（§422），並非無效，「未立字據→無效」之描述錯誤。", "✓C. 承租人直接使用租賃物，為直接占有人；出租人透過承租人間接占有，為間接占有人，正確。", "✓D. 租賃為有償雙務契約（租金對待給付），正確。"]}, {"year": 100, "num": 3, "ans": "A", "stem": "下列何種契約之屬性為無償契約？", "opts": ["使用借貸", "僱傭契約", "承攬契約", "居間契約"], "exp": ["✓A. 使用借貸（§464）：借用人「無償」使用後返還，為無償契約，正確。", "✗B. 僱傭契約以給付報酬為要件（§482），為有償雙務契約。", "✗C. 承攬契約定作人須給付報酬（§490），為有償契約。", "✗D. 居間人促成契約後得請求報酬（§565），為有償契約。"]}, {"year": 100, "num": 4, "ans": "C", "stem": "下列何者，非民法所規定關於出租人之義務？", "opts": ["租賃物之交付義務", "對租賃物之修繕義務", "租賃物為動物時，其飼料費之支出", "租賃物為房屋時，該房屋所應繳納之稅金"], "exp": ["✓A. 出租人有交付租賃物義務（§423），正確（屬於出租人義務）。", "✓B. 出租人有修繕義務（§429），正確（屬於出租人義務）。", "✗C（本題答案）. 飼料費是「使用租賃物必要之費用」，若因承租人使用而生，原則上由承租人自行負擔（§432），並非出租人之法定義務，故「飼料費由出租人支出」不是民法明文規定之出租人義務，為非屬出租人義務之選項，即本題答案。", "✓D. 房屋稅等稅捐原則上由出租人（房屋所有人）繳納，屬出租人通常應負擔之費用，正確。"]}, {"year": 100, "num": 7, "ans": "B", "stem": "甲向大大車行買一台中古A車給其子乙，並約定其子乙得直接向該車行請求交付A車，則甲與大大車行間之契約屬於：", "opts": ["附負擔之法律行為", "第三人利益契約", "債權讓與行為", "第三人保證契約"], "exp": ["✗A. 附負擔是在法律行為（如贈與）中附加受益人須履行某義務，本題並無對乙的附加義務要求。", "✓B. 第三人利益契約（§269）：契約約定向第三人（乙）為給付者，第三人得直接請求債務人履行，本題完全符合，甲（要約人）、車行（承諾人/債務人）、乙（受益第三人），正確。", "✗C. 債權讓與是甲將既有債權移轉給乙，本題甲是新設第三人受益條款，並非讓與既有債權。", "✗D. 保證是保證人擔保他人債務，此處乙並非在保證甲的債務，選項性質不符。"]}, {"year": 100, "num": 11, "ans": "D", "stem": "下列敘述，何者正確？", "opts": ["契約之要約人，因要約而受拘束，不可預先聲明不受拘束", "貨物標定賣價陳列者，視為要約之引誘", "對話為要約者，非立時承諾，即失其拘束力，因此不得定承諾期限", "將要約變更而承諾者，視為拒絕原要約而為新要約"], "exp": ["✗A. 依§154Ⅱ，要約人得預先聲明不受拘束（如「本廣告不構成要約」），本選項說「不可」聲明不受拘束，錯誤。", "✗B. 依§154Ⅱ，貨物標定賣價陳列者「視為要約」（非要約引誘），此為考試常見混淆點。", "✗C. 對話要約雖應立時承諾，但當事人得另定承諾期限，本選項「不得定承諾期限」描述錯誤。", "✓D. 依§160Ⅱ，將要約「擴張、限制或為其他變更」而承諾者，視為拒絕原要約而為新要約，正確，此為「非正式承諾」→「反要約」之考點。"]}, {"year": 100, "num": 12, "ans": "D", "stem": "乙承租甲所有之土地種植果樹，約定租期二年，未訂立字據。關於此案例，下列敘述何者正確？", "opts": ["此為定期租賃契約", "乙於契約成立後，得請求甲為地上權之登記", "若甲於土地交給乙占有後，將土地所有權移轉給丙，乙仍可主張租賃契約對丙成立", "就租賃物之損壞，乙應負善良管理人之注意義務"], "exp": ["✗A. 依§422，不動產租賃逾一年未以書面訂立者，視為不定期限之租賃，本題雖約定二年租期但未立字據，應視為「不定期限」，而非定期租賃。", "✗B. §445規定承租人「租用基地建築房屋」（非種植果樹）者始得請求地上權登記，種植果樹無此請求權，選項不符。", "✗C. 買賣不破租賃（§425）適用前提：已交付且於訂立租賃後出賣，且租賃期限逾五年須書面；本題未立字據視為不定期限，加上§425Ⅱ規定未公證之租約不得對抗第三人之特定情形，本題不確定能對丙主張（買賣不破租賃要件受限），此選項有爭議，但官方以D為正解。", "✓D. 承租人使用租賃物，依§432，應盡善良管理人之注意義務，正確。"]}, {"year": 100, "num": 13, "ans": "A", "stem": "下列關於不當得利之敘述，何者正確？", "opts": ["無法律上之原因而受利益，致他人受損害者，應返還其利益", "因清償債務而為給付，於給付時明知無給付之義務者，得請求返還", "不當得利之受領人，只須返還其所受之利益，如本於該利益更有所取得者，無須返還", "不當得利之受領人，均應依原物返還其所受之利益"], "exp": ["✓A. §179，不當得利的要件：無法律上原因、受益、致他人受損害、三者間有關聯，應返還其利益，正確。", "✗B. §180第3款，給付時「明知」無給付義務者，不得請求返還（自己明知卻給付，不保護），本選項說「得請求返還」錯誤。", "✗C. §181，受領人除返還原受利益外，如「本於該利益更有所取得」者，亦應一併返還，本選項說「無須返還」後取得利益，錯誤。", "✗D. 不當得利之返還以「原物返還」為原則，但若原物不能返還（如已滅失或消費），則返還其「價額」（§181但書），並非絕對必須依原物返還，本選項「均應依原物返還」過於絕對。"]}, {"year": 100, "num": 18, "ans": "C", "stem": "甲到乙所開設之賭場賭博，賭輸了10萬元，下列敘述何者正確？", "opts": ["賭博為甲乙間債務發生之原因關係，所以甲應支付乙10萬元", "如甲已經付款給乙，則甲得主張賭博行為違反公序良俗無效，依不當得利向乙請求返還", "如甲已經付款給乙，雖甲得主張賭博行為違反公序良俗無效，但依不法原因給付，不得請求返還", "賭博雖違反公序良俗，但甲乙間之賭博行為與借錢同視，乙可請求甲支付賭債"], "exp": ["✗A. 賭博契約違反公序良俗（§72）無效，甲無須支付，選項說「應支付」錯誤。", "✗B. 甲固可主張賭博無效，但「不法原因之給付」（§180第4款）不得請求返還——自己基於不法原因而給付，法律不予保護，B說「得請求返還」錯誤。", "✓C. 賭博違反公序良俗（§72）無效；但甲給付賭資係基於不法原因（§180第4款），不得依不當得利請求返還，正確。此為考試必考陷阱：違反公序良俗無效 ≠ 可以請求返還（須看是否不法原因給付）。", "✗D. 賭博債務依法不具強制執行力，乙不得請求甲支付，選項錯誤。"]}, {"year": 101, "num": 3, "ans": "D", "stem": "甲當面向乙表示願以一千萬元出售甲所有之A房屋予乙，乙當場未置可否，經三日後乙回覆甲願以一千萬元購買A屋。就甲、乙各自之意思表示，下列敘述何者最正確？", "opts": ["甲之意思表示為要約，乙之意思表示為承諾", "甲之意思表示為要約引誘，乙之意思表示為要約", "甲之意思表示為要約，乙之意思表示為新要約", "甲之意思表示為要約引誘，乙之意思表示為承諾"], "exp": ["✗A. 甲之意思表示確為要約，但乙未「立時」承諾——「對話要約」須立時承諾（§156），乙三日後才回覆，已逾對話要約之拘束期，甲之要約已失效，乙三日後的「承諾」只是新要約，並非有效承諾。", "✗B. 甲明確表示以1000萬元出售特定房屋，屬要約而非要約引誘（要約引誘是邀請他人要約，未有具體條件），選項將甲說成要約引誘錯誤。", "✓C. 甲當面表示為「對話要約」，乙未立時承諾，甲之要約失效；三日後乙的回覆（雖條件相同）法律上為「新要約」，非原承諾，正確。", "✗D. 甲為要約而非要約引誘，且乙三日後回覆性質上為新要約（非承諾），兩者均有誤。"]}, {"year": 101, "num": 5, "ans": "A", "stem": "甲、乙、丙三人締結合夥契約，並以每月三萬元租金租用甲所有之房屋為共同經營事業之場所。惟因合夥事業經營不順致合夥解散，解散後已無合夥財產清償累計三個月未支付之租金。就積欠之九萬元租金，出租人甲得向乙、丙為如何之主張？", "opts": ["甲僅得分別向乙、丙各請求三萬元", "甲得向乙、丙任一人請求九萬元", "甲得向乙、丙任一人請求六萬元", "甲得向乙、丙各請求九萬元"], "exp": ["✓A. 合夥債務，合夥人對不足清償合夥財產部分負連帶責任（§681），但此處特別情形：甲（出租人）同時也是合夥人之一，甲自己也分擔1/3（三萬元），剩餘6萬元由乙丙連帶負責。然依官方答案A，甲對乙、丙各只能請求3萬元——因甲本身也是合夥人負擔1/3，向乙、丙求償時須扣除自己份額，最終甲得向乙、丙各請求分擔額（各3萬元），正確。", "✗B. 若可向任一人請求全額9萬元，代表連帶責任，但甲作為出租人同時也是合夥人，須先扣除自己應負擔的份額，不能就自己份額也向他人求償。", "✗C. 6萬元說法不符合分擔計算邏輯，並非最精確答案。", "✗D. 不得各請求9萬元，因各人只分擔1/3，且雙重計算違反連帶債務內部分擔規則。"]}, {"year": 101, "num": 6, "ans": "C", "stem": "甲與乙締結將甲所有A屋出售予乙之買賣契約後，A屋於甲依約交付予乙前因火災燒毀致不能給付。下列敘述何者最正確？", "opts": ["如A屋之燒毀係可歸責於甲之事由所致，乙僅須支付二分之一之價金", "如A屋之燒毀係可歸責於乙之事由所致，甲僅得請求二分之一之價金", "如A屋之燒毀係不可歸責於甲、乙之事由所致，乙免給付價金", "如A屋之燒毀係不可歸責於甲、乙之事由所致，乙應繼續支付全部之價金"], "exp": ["✗A. 可歸責於出賣人（甲）之給付不能，乙得解除契約或請求損害賠償，並非僅付1/2價金，說法無據。", "✗B. 可歸責於買受人（乙）之給付不能，甲仍得請求全部價金（§267），並非僅一半，本選項說「僅得請求1/2」錯誤。", "✓C. 雙方均不可歸責之給付不能（危險負擔）——A屋未交付前滅失，依§266，出賣人（甲）免交付義務，買受人（乙）也免給付對待給付（價金），契約雙方均免責，正確。", "✗D. 不可歸責雙方時，依§266危險負擔規定，乙免給付價金，不是繼續支付全部，描述相反。"]}, {"year": 101, "num": 9, "ans": "D", "stem": "甲借款十萬元予乙，約定於半年後清償。下列敘述何者最正確？", "opts": ["對於乙之期前清償，甲不得為反對之意思表示", "甲請求乙為期前清償時，乙不得拒絕", "乙之期前清償縱經甲受領，乙仍得以其期限利益受損，向甲主張不當得利返還請求權", "乙之期前清償如經甲受領，即生清償之效力，乙不得請求返還"], "exp": ["✗A. 期限利益原則上屬於債務人（乙），乙若提前清償，甲是否接受甲有選擇權，甲得為反對之表示（選擇不提早受領），本選項說「不得為反對意思表示」過於絕對。", "✗B. 期限係為乙之利益而設（一般借貸），乙享有期限利益，甲不得強迫乙提前清償，甲請求期前清償時，乙得拒絕，本選項描述相反。", "✗C. 乙之期前清償一旦甲受領，即生清償效力，債之關係消滅，乙不得事後以「期限利益受損」向甲主張不當得利，此說法無根據。", "✓D. 乙期前清償而甲受領後，即發生清償效力（§316），債消滅，乙不得請求返還，正確。"]}, {"year": 101, "num": 10, "ans": "B", "stem": "甲對乙有於今年5月31日到期之買賣價金金錢債權，乙對甲有於6月30日到期之消費借貸金錢債權。甲於7月1日主張抵銷，乙於7月5日回覆同意甲之抵銷的主張。試問：因甲主張抵銷而消滅之債之關係，於何時消滅？", "opts": ["於7月5日乙回覆同意甲抵銷主張時", "於7月1日甲主張抵銷時", "應以當事人合意為準，即7月5日", "於5月31日甲的債權到期時"], "exp": ["✗A. 抵銷是單方意思表示（§335），不需對方同意即生效，乙回覆「同意」只是知悉，並非抵銷生效的要件。", "✓B. 依§335Ⅱ，抵銷之意思表示，溯及最初得為抵銷時（即兩債權均已到期之時，此處為6月30日乙的債權到期時）發生效力；但抵銷意思表示於「7月1日」到達相對人即生效，溯及消滅效力追溯至6月30日，本題選項中B「7月1日甲主張抵銷時」為官方標準答案（意思表示到達日即生單方效力，不待對方同意），正確。", "✗C. 抵銷為單方行為，無需合意，「以當事人合意為準」說法根本上錯誤。", "✗D. 5月31日雖甲的債權到期，但乙的債權尚未到期（6月30日才到期），在乙的債權到期前，雙方互負之債未同時可主張，無法在5月31日完成抵銷。"]}, {"year": 101, "num": 11, "ans": "D", "stem": "甲、乙間約定由甲幫乙為訂約之媒介，並由乙給付報酬予甲。甲、乙所定契約之名稱為下列何者？", "opts": ["承攬契約", "代辦契約", "僱傭契約", "居間契約"], "exp": ["✗A. 承攬（§490）：承攬人完成一定工作，定作人給付報酬，重在完成「結果」，而非「媒介訂約」。", "✗B. 代辦商（商事法）是以代理商人之名義從事商業活動，與本題居間媒介性質不同。", "✗C. 僱傭（§482）：受雇人提供勞務，雇用人給付報酬，著重服務過程而非媒介功能。", "✓D. 居間（§565）：一方（居間人甲）為他方（乙）媒介契約之訂立，或為當事人相互之訂約提供機會，他方給付報酬，本題完全符合，正確。"]}, {"year": 101, "num": 13, "ans": "C", "stem": "甲將其所有土地出租予乙建築房屋。下列敘述何者錯誤？", "opts": ["契約成立後，乙得請求甲為地上權之登記", "乙將房屋所有權移轉予丙時，原基地租賃契約對於丙仍繼續存在", "乙出賣房屋時，甲無依同樣條件優先承買之權利", "甲、乙得約定由乙負擔就土地應納之一切稅捐"], "exp": ["✓A. §445規定，租用基地建築房屋者，承租人（乙）於契約成立後得請求出租人（甲）為地上權登記，正確。", "✓B. 乙將房屋移轉給丙，隨同移轉基地之租賃契約（§426-1），原租賃關係對丙繼續有效，正確。", "✗C（本題答案）. 依§426-2，出租人（甲）就租用基地建築房屋，承租人（乙）出賣房屋時，「有依同樣條件優先承買之權」，本選項說「甲無優先承買權」，與法條相反，錯誤，即本題應選答案。", "✓D. 當事人得約定由承租人負擔稅捐（租金或稅的安排屬契約自由），正確。"]}, {"year": 101, "num": 19, "ans": "C", "stem": "甲以其對乙尚未屆清償期之金錢債權設定權利質權於丙，以擔保丙對甲之金錢債權，並於設定時即通知乙。下列敘述何者最正確？", "opts": ["該權利質權之設定，未得乙之同意，無效", "乙得以於受通知後始對甲取得之金錢債權，對丙主張抵銷", "乙得以於受通知時對甲已取得之金錢債權，對丙主張抵銷", "丙僅得以其對甲之債權為限，就甲對乙之金錢債權受償"], "exp": ["✗A. 債權質之設定（§900）毋須債務人（乙）同意，通知乙即可對乙主張，設定本身有效，不因乙未同意而無效。", "✗B. 依§902準用§297，通知後乙對甲取得的新債權，不得拿來對質權人（丙）主張抵銷（因質權設定通知後，乙已知其債權遭質押，不能再藉抵銷對抗）。", "✓C. 依§902、§297，債務人（乙）於「受通知時已取得之」對讓與人（甲）的債權，仍得主張抵銷；僅「通知後才取得的新債權」不能再對丙主張抵銷，「通知時已有的債權」可以抵銷，正確。", "✗D. 丙作為質權人，得就質物（甲對乙的債權）受清償，並非僅以丙的債權額為限（清償來源是乙應給付甲的金額，在丙的債權範圍內受償），描述不精確。"]}, {"year": 101, "num": 25, "ans": "C", "stem": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "opts": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續有效", "租賃之標的物，出租人得為間接占有"], "exp": ["✗A. 依§127第9款，租金請求權消滅時效為「5年」（並非2年；2年時效適用於其他特定債權如旅店費、飲食店費等），本選項時效年數有誤。", "✗B. 買賣不破租賃（§425），甲出賣房屋給丙，租賃關係對丙繼續有效（前提是已交付且合法），並非租賃關係消滅。", "✓C. §425「買賣不破租賃」不僅適用於買賣，亦適用於贈與等處分行為；甲將房屋贈與丁，乙之租賃契約對丁仍繼續有效，正確。", "✗D. 題目本身描述「出租人得為間接占有」，此點雖然正確（承租人直接占有、出租人間接占有），但相較於C選項，D並非「最正確」之完整答案。"]}, {"year": 101, "num": 27, "ans": "C", "stem": "甲委任乙處理A土地買賣相關事宜，下列敘述何者最正確？", "opts": ["委任人甲得將對乙之處理委任事務請求權讓與第三人", "受任人乙若受有報酬，委任人甲無須因受任人之請求，預付處理委任事務之必要費用", "受任人乙因不可歸責於自己之事由，不得已須在不利時期終止契約，即使因此使甲受損害，乙亦不負損害賠償責任", "受任人乙以自己之名義為甲取得之物，應移轉於甲"], "exp": ["✗A. 委任關係（受任人）具人身專屬性，委任人對受任人之請求權，不得任意讓與第三人（涉及信任關係），選項說「得讓與」不正確。", "✗B. 依§546，不論受任人有無報酬，委任人甲均應因受任人（乙）之請求，預付處理委任事務之必要費用，本選項說「無須預付」錯誤。", "✓C. 依§549Ⅱ，受任人因不可歸責自己之事由，不得已須終止委任者（即使在不利時期），所生損害由委任人負擔，受任人不負損害賠償責任，正確。", "✗D. 依§541Ⅱ，受任人以自己名義為委任人取得之物，應移轉予委任人，此點敘述正確；但官方以C為最正確答案，且D本身亦正確，本題選最符合考點者C。"]}, {"year": 101, "num": 29, "ans": "D", "stem": "甲將位於忠孝路的一間公寓出租給乙，租期三年，下列敘述何者最正確？", "opts": ["乙若遲繳租金，甲應在兩年內請求乙繳納，否則租金請求權將罹於消滅時效", "甲與乙之租賃契約若未經公證，在乙搬入租賃房屋後，縱使甲將租賃物所有權讓與第三人，甲與乙之租賃契約仍無法對抗第三人", "乙可將該公寓之全部轉租給丙，毋庸甲之同意", "非經甲之同意，乙不得將其租賃物返還請求權讓與丁"], "exp": ["✗A. 租金請求權時效為5年（§127第9款），並非2年，選項有誤。", "✗B. 依§425，租賃物已交付承租人（乙已搬入）後，縱所有權讓與第三人，租賃契約對受讓人仍繼續有效（買賣不破租賃）；本選項說「無法對抗第三人」，與§425相反，錯誤。", "✗C. §443Ⅰ，承租人非得出租人（甲）同意，不得將全部租賃物轉租，本選項說「毋庸同意」錯誤。", "✓D. 依§294，債權讓與原則上不須債務人（出租人甲）同意，但承租人對出租人的債權（如返還請求權）涉及「隨同租賃關係的請求」，有人身依附性；加上§443關於不得未經同意轉租之精神，本題依官方答案認定D正確：非得甲同意，乙不得讓與租賃物返還請求權，正確。"]}, {"year": 101, "num": 30, "ans": "C", "stem": "乙家中的寵物飼料已吃完，向鄰居甲借用一包飼料供家中寵物食用，並約定隔日還給甲一包相同的新飼料，下列敘述何者最正確？", "opts": ["甲與乙之間成立使用借貸", "甲與乙之借貸契約於雙方意思合致時即為成立", "甲與乙之契約如未約定報償，貸與人甲對於借用物之瑕疵，無須負任何責任", "甲與乙之間成立消費借貸"], "exp": ["✗A. 使用借貸是借用後「原物返還」，本題約定還「相同的新飼料」（種類物），屬消費借貸，非使用借貸。", "✗B. 消費借貸為「要物契約」（§474），須物之交付才成立（意思合致+交付），僅意思合致尚不成立，本選項說「意思合致即成立」錯誤。", "✓C. 消費借貸（飼料借用返還同種物）為無償借貸；依§475-1，無償使用借貸對於借用物之瑕疵，貸與人不負擔保責任（同§411贈與無償減輕責任）；本題雖係消費借貸，無償時責任亦從輕，貸與人對於一般瑕疵無須負責，正確。", "✗D. 本選項雖正確（消費借貸），但C是更精確完整答案；D本身亦正確，但題目問「最正確」，官方以C為準。"]}, {"year": 101, "num": 32, "ans": "C", "stem": "甲向乙提出給付，但給付遲延，下列敘述何者最正確？", "opts": ["乙得向甲主張遲延之損害賠償以代替原定給付", "甲在遲延中，對於因不可抗力而生之損害，原則上毋須負責", "遲延之債務，以支付金錢為標的者，債權人乙得向債務人甲請求以法定利率計算之遲延利息", "甲在遲延中，若標的物因颱風而全毀，因係不可抗力，甲可依不可抗力向乙主張免責"], "exp": ["✗A. 損害賠償「以代替原定給付」，需在給付「不能」時（§226），給付遲延時乙仍得請求原給付+遲延損害賠償，不能直接以賠償替代原給付（除非催告後不履行再解除）。", "✗B. §231Ⅱ，債務人在遲延中，對於因不可抗力而生之損害，「仍須負責」（加重責任），原則上「須」負責，本選項「毋須」說法相反。", "✓C. §233Ⅰ，遲延之債務以金錢為標的者，債權人得請求依「法定利率」計算之遲延利息，正確。（法定利率為年利5%，§203）", "✗D. 承B之說明，甲在遲延中，不可抗力造成損害仍須負責（§231Ⅱ），不得主張不可抗力免責，選項錯誤。"]}, {"year": 101, "num": 33, "ans": "B", "stem": "甲向乙訂購珍珠項鍊一條，甲與乙並約定由乙直接向第三人丙提出給付，丙對乙有直接請求權，下列敘述何者最正確？", "opts": ["在丙表示享受其利益之意思後，甲與乙仍得隨時撤銷丙所取得之利益", "在丙表示享受其利益之意思後，丙得請求乙向自己提出給付，但乙得以甲乙間所生之抗辯事由對抗丙", "在丙表示享受其利益之意思後，丙喪失直接請求乙之權利", "在丙表示享受其利益之意思後，乙得以甲乙間所生之抗辯事由對丙主張，但甲對丙之抗辯事由，乙不得對丙主張"], "exp": ["✗A. 依§270，丙表示享受利益後，甲與乙不得任意撤銷（第三人既得利益不可剝奪），本選項說「仍得隨時撤銷」錯誤。", "✓B. 依§269，丙得直接請求乙履行；但依§270，乙得以甲乙間契約所生之抗辯事由（如甲尚未付價金）對抗丙，正確。", "✗C. 丙表示享受利益後，反而「確定取得」直接請求權，並不喪失，本選項描述相反。", "✗D. 依§270，乙得以甲乙間抗辯對丙主張（B已正確敘述此點），甲對丙之個人抗辯乙不得主張亦正確，但本選項整體表述有誤或不如B完整。"]}, {"year": 101, "num": 36, "ans": "C", "stem": "甲將自己之汽車停在乙的停車格內多日，乙自己沒有汽車，停車格也未出租給他人使用，甲在乙的要求下將汽車開走，下列敘述何者最正確？", "opts": ["乙仍得對甲主張無因管理，請求必要費用之返還", "乙仍得對甲主張債務不履行之損害賠償責任", "乙仍得對甲主張不當得利，請求返還相當於租金之不當得利", "乙仍得依侵權行為對甲請求非財產上損害賠償"], "exp": ["✗A. 無因管理是指為「他人」管理事務，乙並非在管理甲的事務（乙沒有幫甲做任何事），不構成無因管理，此主張不成立。", "✗B. 乙與甲間並無契約關係，無從主張「債務不履行」。", "✓C. 甲未經乙同意占用乙的停車格，無法律上原因受有利益（免付停車費）、致乙受有損害（停車格遭占用），構成不當得利，乙得請求相當於租金之不當得利返還，正確。", "✗D. 財產損害賠償或許可主張，但停車格遭占用通常不涉及「非財產上損害」（精神損害），此主張在本案情境不成立。"]}, {"year": 101, "num": 37, "ans": "D", "stem": "甲向乙借一套百科全書，下列敘述何者最正確？", "opts": ["在乙承諾將百科全書借給甲後，甲與乙之借貸契約即成立", "甲與乙之借貸契約為諾成契約", "甲與乙之借貸契約為消費借貸契約", "甲與乙之借貸契約為要物契約，以物之交付作為契約之成立要件"], "exp": ["✗A. 使用借貸為「要物契約」，須物之交付才成立，乙僅承諾而未交付，借貸尚未成立。", "✗B. 使用借貸非諾成契約，係要物契約，選項錯誤。", "✗C. 百科全書為特定物，借後須「原物返還」（不得以同類書籍替換），屬「使用借貸」（§464），非消費借貸（消費借貸是以同種同量替代物返還）。", "✓D. 使用借貸（§464）為要物契約，以「物之交付」為成立要件，正確。此為使用借貸與消費借貸共同特徵：均為要物契約。"]}, {"year": 101, "num": 38, "ans": "C", "stem": "甲與乙締結A畫的買賣契約，約定由出賣人甲在兩天內將A畫送至乙處；甲將A畫交由店員丙送至乙處，因丙之過失，A畫滅失。下列敘述何者最正確？", "opts": ["甲免給付義務", "乙得向丙主張侵害所有權之損害賠償責任", "甲應對乙負擔給付不能之損害賠償責任", "甲免給付義務，但乙得向甲請求損害賠償"], "exp": ["✗A. 可歸責於甲（透過履行輔助人丙，§224，丙過失視同甲過失）之給付不能，甲仍須負責，並非「免給付義務」。", "✗B. A畫在交付前，所有權仍屬甲（尚未移轉），A畫非乙之物，乙無法以「侵害所有權」主張侵權，此主張不成立。", "✓C. 丙為甲之履行輔助人，丙過失=甲過失（§224），造成特定物給付不能；依§226，可歸責於債務人（甲）之給付不能，債權人（乙）得請求損害賠償，正確。", "✗D. 甲並未免給付義務（因可歸責於甲），前半段描述錯誤，C更精確。"]}, {"year": 102, "num": 1, "ans": "D", "stem": "甲向乙建設公司購買預售屋一戶，約定甲應依已完成之工程進度所定付款明細表之規定於工程完工後繳款，半年後乙建設公司資金週轉不靈，財產遭法院查封，甲是否應繼續繳納約定的工程款？", "opts": ["資金週轉不靈，屬可歸責於乙建設公司之事由，甲可拒絕繳納已完工部分之工程款", "甲應繼續依約繳款，因係甲自己之義務，乙的財務狀況並不影響甲的給付義務", "若甲確定乙無法完成建設，甲得主張不安抗辯，拒絕給付全部工程款", "因乙已資不抵債，甲得主張其工程款債務與其對乙之損害賠償債權抵銷"], "exp": ["✗A. 乙財產遭查封並不等於「已完工部分」的給付有問題（工程已完成的部分），甲不能僅以查封為由拒付已完工款項，理由不充分。", "✗B. 雖甲有給付義務，但若乙將來顯然無法履行其義務（完工交屋），甲得依不安抗辯等手段保護自己，不能說「乙財務不影響甲義務」如此絕對。", "✗C. §265不安抗辯：若乙財產顯著減少，有難為對待給付之虞，甲得「拒絕先為給付」（即拒絕先付款）並非拒絕「全部」工程款（完工後仍須付）；適用要件為乙的對待給付能力有疑慮，且本題已查封，有一定根據主張，但「全部」工程款描述不精確。", "✓D. 若乙建設公司已資不抵債且確定無法完工，甲有損害賠償債權（§226、§254），得與應付工程款互為抵銷（§334），正確。"]}, {"year": 102, "num": 2, "ans": "C", "stem": "甲將其所有A屋委託乙仲介公司銷售，定價新臺幣980萬元，丙經乙仲介公司銷售人員帶看之後，對A屋甚是滿意，但是希望價格能降為新臺幣950萬元，乃給付新臺幣20萬元斡旋金予乙仲介公司作為與屋主斡旋差價之用。下列敘述何者正確？", "opts": ["甲如同意以950萬元出售A屋，斡旋金20萬元即歸乙仲介公司所有", "丙所給付之20萬元斡旋金具有訂金之性質", "若甲如同意以950萬元出售A屋，則斡旋金20萬元應轉為買賣價金之一部分或定金", "甲如同意以950萬元出售A屋，丙應在20萬元之外另行給付定金"], "exp": ["✗A. 斡旋金是丙交給仲介的「授權費用」，若甲接受950萬元條件，斡旋金轉為定金或價款一部，並非歸仲介公司所有。", "✗B. 斡旋金本身不必然具有訂金性質，須待甲接受條件後，才轉為定金或價款一部。", "✓C. 依仲介業務實務（消保法及不動產仲介規範），甲若同意以950萬元成交，斡旋金20萬元應轉為「買賣價款之一部」或「定金」，此為不動產仲介業常見規則，正確。", "✗D. 若甲同意後斡旋金已轉為定金性質，丙不需另外再繳定金，選項說「另行給付定金」多餘。"]}, {"year": 102, "num": 3, "ans": "D", "stem": "甲經由乙仲介向丙購得A屋，甲於交屋遷入後始得知A屋曾發生非自然死亡事件。關於當事人間的權利義務，下列敘述何者正確？", "opts": ["凶宅為不完全給付，甲得向丙請求損害賠償，但不得要求解除契約", "A屋並無滅失或減少其通常效用，甲不得向丙主張物之瑕疵擔保", "甲得向乙主張物之瑕疵擔保責任，請求乙減少價金", "甲得向丙主張物之瑕疵擔保責任，請求解除契約或減少價金"], "exp": ["✗A. 凶宅在台灣社會確實影響市場價值（減少通常效用），屬物之瑕疵，甲得請求解除或減少價金（§354、§359），不能說「不得解除」。", "✗B. 凶宅雖物理上無損壞，但依台灣實務，「有非自然死亡事件」之房屋影響交易價值，屬「減少其通常效用及市場價值」之瑕疵，甲得主張瑕疵擔保，選項說「不得主張」錯誤。", "✗C. 物之瑕疵擔保責任應向「出賣人」（丙）主張，而非向仲介（乙）主張（仲介非買賣當事人），選項對象錯誤。", "✓D. 甲得向出賣人丙主張物之瑕疵擔保（§354），選擇解除契約或減少價金（§359），正確。"]}, {"year": 102, "num": 4, "ans": "D", "stem": "甲以新臺幣1000萬元向乙購買某特定房屋，買賣契約何時成立？", "opts": ["甲交付新臺幣1000萬元於乙時", "乙將該特定房屋交付於甲時", "甲、乙完成交屋及付清價金時", "甲、乙就房屋及價金互相同意時"], "exp": ["✗A. 交付價金是「履行」契約的行為，並非契約「成立」時點，成立不需先交付。", "✗B. 交付房屋同樣是履行行為，非契約成立要件。", "✗C. 買賣契約不以「完成交屋及付清價金」為成立要件，成立遠早於此。", "✓D. 依§345Ⅱ，當事人就「標的物」及「價金」互相同意時，買賣契約即為成立（諾成契約），正確。買賣是最典型的諾成契約：意思合致→成立→各負交付義務。"]}, {"year": 102, "num": 5, "ans": "C", "stem": "甲與乙訂立租賃契約，向乙承租房屋，雙方約定租賃期限為二年，未以書面為之，且甲亦未交付押金。下列敘述何者正確？", "opts": ["租賃契約於甲交付押金後始成立", "租賃契約於甲交付押金後始生效", "租賃契約未以書面為之，視為不定期限之租賃", "租賃契約未以書面為之，不生效力"], "exp": ["✗A. 租賃為諾成契約，不以押金交付為成立要件，意思合致即成立。", "✗B. 同上，押金交付非生效要件，合意即生效。", "✓C. 依§422，不動產租賃期限逾一年者，應以書面訂立；未以書面訂立者，「視為不定期限之租賃」（不是無效），正確。", "✗D. 未以書面並非不生效力，而是改成不定期限，選項說「不生效力」錯誤，此為常見陷阱。"]}, {"year": 102, "num": 13, "ans": "A", "stem": "甲於民國102年1月1日向乙借新臺幣10萬元，約定同年6月30日清償，並由丙於其期限內擔任保證人。下列敘述何者正確？", "opts": ["清償期屆滿，乙允許甲延期清償時，應得丙之同意，否則丙不負保證責任", "丙得隨時通知乙終止保證契約", "甲未清償到期債務，乙得不先向甲請求，即逕向丙請求清償", "丙與乙間之保證契約，依法應以書面訂立，否則無效"], "exp": ["✓A. 保證責任之重要原則：延期清償（主債務之內容變更）未得保證人同意，可能使保證人免責（§756，準用民法類似規定之精神）；依§754，就定有期限之債務為保證，延期而未得保證人同意，保證人對延期後之債務不負責，正確。", "✗B. 一般保證契約非隨時可終止，須依契約約定或法定事由（如不定期限保證§752），本題定有期限，丙不得隨時終止。", "✗C. 一般保證有「先訴抗辯權」（§745），保證人得要求債權人先就主債務人之財產強制執行無效果後，才向保證人請求；乙應先向甲請求，本選項「不先向甲即逕向丙」違反先訴抗辯，錯誤。", "✗D. 依§739-1，保證契約應以書面為之，否則不生效力；但本題問的是答案A（延期清償需得丙同意），D本身雖正確但A才是本題最正確選項。"]}, {"year": 102, "num": 15, "ans": "A", "stem": "甲承攬乙建設公司之營造工程，在執行承攬事項時，因過失致路人丙受到傷害。下列敘述何者正確？", "opts": ["乙建設公司如非於定作或指示有過失，即不負損害賠償責任", "乙建設公司雖非於定作或指示有過失，但應與甲連帶負損害賠償責任", "乙建設公司賠償丙之損害後，得向甲代位請求", "甲的行為屬僱用人責任，乙應就甲之過失行為連帶負責"], "exp": ["✓A. 依§189，定作人（乙建設公司）對承攬人（甲）因執行承攬事項所加於他人之損害，「僅於定作或指示有過失時」始負連帶責任；若乙對定作及指示均無過失，乙不負責，正確。", "✗B. 承攬人為獨立工作者，定作人對其不負一般監督責任（不同於僱傭關係），無過失時乙不連帶負責，本選項描述錯誤。", "✗C. 乙若非過失而無責任，則不會賠償，無從代位；且代位請求之邏輯亦不符本題情境。", "✗D. 甲是「承攬人」非「受僱人」，甲與乙為獨立承攬關係，§188僱用人責任不適用於承攬關係，本選項適用法條錯誤。"]}, {"year": 102, "num": 17, "ans": "B", "stem": "甲房東將其所有A屋出租給乙房客，嗣後甲因財務問題將A屋出售與丙。下列敘述何者正確？", "opts": ["丙擁有A屋的所有權，所以丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約未經公證且超過5年者，丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約已完成公證且不逾5年者，丙須繼續依該租賃契約出租予乙", "丙為A屋之所有人，所以得不管甲乙間之租賃契約，而依侵權行為向乙請求返還A屋"], "exp": ["✗A. 買賣不破租賃（§425），丙取得所有權後，仍受原租賃契約拘束，不得要求乙搬遷（前提：乙已占有且租賃合法）。", "✓B. §425Ⅱ，租賃期限逾5年或「未定期限」者，應經「公證」才得對抗受讓人；若未公證且超過5年，丙取得後不受拘束，得要求乙搬遷，正確。", "✗C. 已公證且不逾5年，丙受原租賃拘束須繼續出租，但本選項說「已公證且不逾5年須繼續出租」，其中「不逾5年無須公證亦受拘束（§425Ⅰ）」；C的表述雖部分正確，但相比B的明確界限，官方以B為正解。", "✗D. 買賣不破租賃讓乙對丙有租賃上的對抗力，丙不得以侵權行為理由請求乙返還（乙有合法占有原因），描述錯誤。"]}, {"year": 102, "num": 29, "ans": "C", "stem": "甲向乙承租房屋居住，因火災致房屋毀損滅失，乙請求甲損害賠償。下列敘述何者正確？", "opts": ["甲因火災致乙之房屋毀損滅失，構成侵權行為，應負抽象輕過失責任", "甲因火災致乙之房屋毀損滅失，構成侵權行為，應負具體輕過失責任", "甲因火災致乙之房屋毀損滅失，構成債務不履行，應負抽象輕過失責任", "甲因火災致乙之房屋毀損滅失，構成侵權行為，應負故意或重大過失責任"], "exp": ["✗A. 此為「債務不履行」（承租人應以善良管理人注意使用租賃物，§432）而非侵權行為，且因善良管理人注意義務=「抽象輕過失」責任，但法律關係性質描述為侵權行為錯誤。", "✗B. 同A，應為債務不履行而非侵權行為。", "✓C. 甲為承租人，對租賃物負「善良管理人之注意義務」（§432），善良管理人注意=抽象輕過失（比具體輕過失更嚴），承租人違反注意義務致房屋損毀屬「債務不履行」，本選項兩點均正確，正確。", "✗D. 故意或重大過失的責任標準（輕過失免責）是贈與人的特殊責任標準，並非承租人的標準，承租人應負抽象輕過失，不是僅故意或重大過失時才負責。"]}, {"year": 103, "num": 9, "ans": "A", "stem": "甲與乙於民國103年10月1日簽訂買賣契約將自有古董錶以新臺幣20萬元出售予乙，約定同年11月1日交付該錶予乙。但同年10月5日不知情的丙向甲表示願以25萬元之價格購買該古董錶，甲同意丙之提議。下列敘述，何者正確？", "opts": ["乙得解除甲乙間之買賣契約，並向甲請求損害賠償", "甲得解除甲乙間之買賣契約，向乙請求返還已交付之錶", "因甲之物已屬丙所有，乙對甲之請求不得執行", "丙應負損害賠償責任，因其明知甲之行為而與甲共謀侵害乙之利益"], "exp": ["✓A. 甲再賣給丙屬「一物二賣」，甲對乙之給付（交付古董錶）因可歸責於甲（甲故意再賣給丙）而不能，乙得依§256（催告不履行解除）或§226（給付不能賠償）主張解除並請求損害賠償，正確。", "✗B. 甲不得主動解除，解除權在受害方乙，甲無解除甲乙契約之理由。", "✗C. 甲乙間買賣有效，乙對甲有債權（請求給付），並非「錶屬丙所有就不得執行」——乙仍得向甲請求損害賠償（填補損失）。", "✗D. 丙「不知情」（題目明示），無從主張共謀；即使丙知情，侵害債權的侵權行為成立要件嚴格，本案情境不成立。"]}, {"year": 103, "num": 13, "ans": "A", "stem": "甲將房屋出賣於乙並交付之，但尚未完成移轉登記，乙已支付一半價金，其後該屋因地震而全毀。下列敘述，何者正確？", "opts": ["乙仍應支付全部買賣價金", "甲應承擔一半損失", "乙得解除買賣契約", "甲得主張重建後再交屋"], "exp": ["✓A. 本題關鍵：房屋已「交付」乙（§373，危險自交付時移轉買受人），地震為不可抗力，危險由乙承擔，乙仍須支付全部價金（§373，物之危險自交付時起由買受人負擔），正確。", "✗B. 危險已於交付時移轉乙，甲不須分擔損失。", "✗C. 危險由乙負擔，乙無從解除（危險負擔原則下，乙仍負對待給付義務）。", "✗D. 特定物（房屋）滅失後已無從重建返還相同之物，且危險已移轉乙，甲無義務重建。"]}, {"year": 103, "num": 15, "ans": "B", "stem": "甲駕駛機車載乙，與丙發生車禍，致乙跌落機車，身體多處受傷，經查甲、丙均有過失。下列敘述，何者錯誤？", "opts": ["乙得向丙請求損害賠償", "丙不得主張乙應承擔甲之過失", "乙得向甲請求損害賠償", "甲丙為共同侵權行為人"], "exp": ["✓A. 丙有過失致乙受傷，乙自可向丙請求侵權損害賠償，正確。", "✗B（本題答案）. 乙是搭乘甲機車的乘客，甲與乙之間為同乘關係，並非委任或代理；但是，若甲有過失且乙對甲的過失行為有「與有過失」（因搭乘而知甲過失仍不制止），丙得主張乙方應分擔甲的過失以減輕丙的賠償額（§217與有過失）。本選項說「丙不得主張乙應承擔甲之過失」，若依§217，丙確實可主張，故本選項描述錯誤，為應選之「錯誤」選項。", "✓C. 甲有過失致乙受傷，乙亦得向甲請求損害賠償，正確。", "✓D. 甲丙數人共同過失侵害乙，成立共同侵權行為（§185），連帶負賠償責任，正確。"]}, {"year": 103, "num": 18, "ans": "A", "stem": "甲乙係多年好友，甲長年於國外經商，遂概括委任乙代為管理A屋，約定乙就A屋得為甲為一切行為。但民法規定，不動產之租賃其期限逾多久者，乙仍須有特別授權？", "opts": ["二年", "一年半", "一年", "半年"], "exp": ["✓A. 依§534第3款，受任人之特別授權事項包含：不動產之租賃期限逾「二年」者，須有特別授權，正確。", "✗B. 一年半無法律明文依據。", "✗C. 一年為一般不動產租賃書面要求（§422逾一年須書面），並非委任特別授權的期限門檻，兩者勿混淆。", "✗D. 半年無法律依據。★必考區分：§534概括委任仍需特別授權的事項包含「不動產之租賃逾2年」、「不動產之買賣或設定負擔」等。"]}, {"year": 103, "num": 21, "ans": "B", "stem": "甲、乙、丙共同竊取丁之財物，丁損失共計新臺幣30萬元，丁僅原諒其子甲之行為，而免除其債務。下列敘述，何者正確？", "opts": ["乙若全額清償後，得向甲、丙各求償新臺幣10萬元", "乙若全額清償後，僅得向丙求償新臺幣10萬元", "乙若全額清償後，得向甲、丙各求償新臺幣15萬元", "丁免除甲之債務，乙、丙之連帶債務亦同時免除"], "exp": ["✗A. 丁已免除甲之債務（§276），甲的份額免責，但不影響乙丙的連帶責任；乙全額清償後，對甲的求償——甲已被免除對丁的債務，但內部關係中甲仍應分擔1/3（§280），然丁之免除是否及於內部求償有爭議；依§276，免除連帶債務人中一人之債務，其他人仍就各自應分擔部分連帶負責，乙向甲求償仍有可能，但官方答案認定B。", "✓B. 丁免除甲之連帶債務，僅使乙丙免除甲之分擔額（1/3=10萬），乙丙仍就其餘部分（20萬）連帶負責；乙全額清償30萬後，可向丙求償丙應分擔之10萬（1/3），而甲因已被免除其分擔部分，乙對甲的求償受到影響，依官方答案僅得向丙求償10萬，正確。", "✗C. 各自分擔1/3為10萬，非15萬，計算錯誤。", "✗D. §276，免除連帶債務人之一的債務，其他連帶債務人仍對剩餘部分（扣除免除分擔額後）負責，並非全部免除。"]}, {"year": 104, "num": 6, "ans": "C", "stem": "乙與甲約定，於甲大學畢業時，乙將贈與甲汽車一輛。此項贈與契約所附約款之性質如何？", "opts": ["終期", "始期", "停止條件", "解除條件"], "exp": ["✗A. 終期是指到某一確定期日後法律行為「失效」，本題是到畢業時開始生效，非失效，並非終期。", "✗B. 始期是指到確定期日後法律行為開始生效；「大學畢業」是否發生並不確定（可能退學、休學、未能畢業），故非「確定」到來的期日，非始期。", "✓C. 「大學畢業」為「不確定是否會發生」之事實，符合條件之定義；其成就時使贈與「開始生效」，故為停止條件（§99Ⅰ），正確。", "✗D. 解除條件是條件成就時使「已生效之法律行為失效」；本題是條件成就才生效，非失效，非解除條件。"]}, {"year": 104, "num": 8, "ans": "C", "stem": "下列關於因債務不履行而解除契約之敘述，何者正確？", "opts": ["債權人解除契約者，即不得再向債務人請求損害賠償", "因債務人給付不能而為解除時，債權人仍須對債務人為履行之催告始得解除", "如債權人為履行之催告時未定期間，催告後經相當期間，仍得逕為解除", "給付遲延時，債權人得不經催告逕行解除契約"], "exp": ["✗A. §260，解除權之行使，「不妨礙損害賠償之請求」，解除後仍得請求損害賠償，選項說「不得」錯誤。", "✗B. 給付不能（§256：催告解除適用於給付遲延；§262規定給付不能得不催告直接解除），給付不能時無須催告，本選項說「仍須催告」錯誤。", "✓C. 依§254，催告時未定期間，仍發生催告效力，催告後「經相當期間」而債務人未履行，債權人得解除，正確。", "✗D. 給付遲延（§254）原則上「須催告」後始得解除，例外（§255定期行為）才可不催告，選項說「得不經催告逕行解除」過於絕對，錯誤。"]}, {"year": 104, "num": 10, "ans": "D", "stem": "甲、乙締結由甲出售10打市面上普遍流通之紅酒予乙之買賣契約，甲依約於約定期日將標的物運送至乙之住所地時，乙以自己尚未備妥儲藏場所為由拒絕受領。甲不得已乃將物品運回繼續保管，卻於保管期間中該等紅酒全數破裂。下列敘述，何者正確？", "opts": ["因乙拒絕受領，危險已移轉於乙，甲不負損害賠償責任，且得請求費用", "因乙拒絕受領，甲乙間之買賣契約已解除，甲不負損害賠償責任", "因甲乙間之買賣契約尚未解除，甲仍負給付義務，且不得向乙請求費用", "乙受領遲延，甲僅就故意或重大過失負損害賠償責任，且得向乙請求費用"], "exp": ["✗A. 危險移轉需視具體情形（若為種類物，送達提出仍需特定），本題為普遍流通種類物，提出給付後乙遲延受領，危險移轉，甲不負損害賠償有理，但本選項說法不完整。", "✗B. 乙拒絕受領屬受領遲延，並非解除契約，甲乙契約仍存在。", "✗C. 乙受領遲延後，甲責任已減輕，且甲得向乙請求保管費用，本選項「不得請求費用」錯誤。", "✓D. 依§241，受領遲延（乙的責任）後，甲的給付義務轉為「僅就故意或重大過失負責」（責任減輕）；甲因乙遲延而產生的保管費用得向乙請求（§240），正確。"]}, {"year": 104, "num": 13, "ans": "D", "stem": "甲、乙、丙三人對丁負有各自分擔比例為三分之一之300萬元連帶債務。下列敘述，何者正確？", "opts": ["連帶債務罹於消滅時效後，甲對丁為債務之承認時，該中斷時效之效力及於乙、丙", "甲以時價300萬元之珠寶對丁為代物清償時，如事前未得乙、丙同意，代物清償無效", "甲、乙、丙其中一人對丁為清償時，其效力不及於他人，各人仍對丁負連帶債務", "甲清償全額後，甲得向乙、丙各求償100萬元"], "exp": ["✗A. §276，時效中斷（如承認）之效力，僅「對承認人（甲）」有效，不及於其他連帶債務人（乙、丙），選項說效力及於乙丙錯誤。", "✗B. 代物清償只要丁（債權人）同意即可，不必得乙丙同意，本選項說「未得乙丙同意則無效」錯誤。", "✗C. 連帶債務人中一人清償，依§274，效力及於其他連帶債務人（一人清償全部，全部債務消滅），並非「不及於他人」，本選項相反。", "✓D. 甲清償全額300萬後，依§281，甲得向其他連帶債務人（乙、丙）求償各自應分擔部分（各1/3=100萬），正確。"]}, {"year": 104, "num": 14, "ans": "B", "stem": "甲賣A屋給乙，尚未移轉交付，嗣後A屋因可歸責於丙之事由失火滅失，然甲對A屋投有火災保險。下列敘述，何者錯誤？", "opts": ["甲得主張免給付義務，乙亦得主張免對待給付", "此為給付不能，甲、乙間之買賣契約無效", "乙得履行對待給付後，請求甲讓與其對丙之損害賠償請求權", "乙得履行對待給付後，請求甲讓與其對保險公司之保險給付請求權"], "exp": ["✓A. 因可歸責於第三人丙之給付不能，不可歸責於甲乙，此為危險負擔：§266，雙方均免對待給付（甲免交屋、乙免付款），正確。", "✗B（本題答案）. 可歸責於第三人（丙）之給付不能，適用危險負擔（§266）而非使契約「無效」，契約本身並未無效，只是雙方互相免除給付義務，選項說「契約無效」錯誤，為應選答案。", "✓C. 依§267，乙得履行對待給付，請求甲讓與其對第三人（丙）之損害賠償請求權，正確。", "✓D. 乙得請求甲讓與保險給付請求權（§267準用），正確。"]}, {"year": 104, "num": 15, "ans": "A", "stem": "甲有A車一輛借乙使用，乙因滑手機未注意車前狀況，而與丙酒駕闖紅燈之B車相撞，乙重傷，A車全毀。下列敘述，何者正確？", "opts": ["甲若向丙請求A車之損害賠償，丙不得主張甲就A車投有保險，應扣除保險金", "乙及丙對A車之損害，甲只能擇一請求賠償", "因甲有投保，所以甲不得向乙或丙請求A車之損害賠償", "甲若向乙請求A車之損害賠償，乙得主張因丙闖紅燈亦有過失，拒絕甲之請求"], "exp": ["✓A. 損益相抵與保險理賠：受損害人（甲）已取得保險理賠，並不因此使加害人（丙）得主張「扣除保險金」而減少賠償（保險是甲自己付保費獲得，不能讓丙得益），正確。", "✗B. 乙與丙對A車之損害若為共同侵權，甲得向乙與丙「連帶」請求（§185），並非只能擇一。", "✗C. 投保不影響向加害人請求賠償的權利，選項說「不得」請求錯誤。", "✗D. 乙有與有過失（分擔責任），但不能以丙也有過失為由「拒絕」甲之請求，最多只能主張過失相抵減輕自己的賠償比例。"]}, {"year": 104, "num": 16, "ans": "C", "stem": "甲因長期出國，將其所有名貴青花瓷一只交由乙代為保管。乙向丙偽稱該瓷為己有，欲以該瓷與丙所有之名車互易，雙方達成讓與合意並互相交付完畢。下列敘述，何者錯誤？", "opts": ["該互易契約有效", "丙得主張因善意受讓而取得該只青花瓷之所有權", "丙移轉名車所有權予乙之物權行為有效", "甲對乙得主張債務不履行及侵權行為損害賠償"], "exp": ["✓A. 互易契約（債權行為）本身甲乙丙均有意思能力，且乙丙之互易契約（乙以他人之物交換）在債權行為層面有效，只是乙就青花瓷為無權處分，正確。", "✓B. 丙善意受讓動產，依§801、§948善意取得制度，丙取得青花瓷所有權，正確。", "✗C（本題答案）. 「丙移轉名車所有權予乙之物權行為有效」——丙是名車所有人，以名車換青花瓷，丙讓與名車的物權行為本人有處分權，確實有效；但此為「錯誤」選項，因為本選項是正確的，而本題問「何者錯誤」。官方標準答案C；從題目邏輯，C描述本身正確而所有其他需要核驗，C可能是出題設計上另有所指，以官方答案C為準。★建議記憶：乙無權處分青花瓷→甲可向丙主張所有物返還，除非丙善意取得（B正確，丙善意取得，甲不得再向丙主張）。", "✓D. 乙未經授權處分甲之青花瓷，對甲構成債務不履行（乙本應保管）及侵權行為，甲得對乙請求損害賠償，正確。"]}, {"year": 104, "num": 17, "ans": "B", "stem": "下列關於抵銷之敘述，何者正確？", "opts": ["甲對乙有金錢債權、乙對甲有因侵權行為而生之損害賠償請求權時，乙不得對甲主張抵銷", "甲對乙有金錢債權、乙對甲有禁止扣押之金錢債權時，甲不得對乙主張抵銷", "甲對乙之金錢債權及乙對甲之金錢債權的履行地不同時，不得主張抵銷", "甲對乙之金錢債權尚未屆清償期時，甲不得對乙主張抵銷，乙亦不得對甲主張抵銷"], "exp": ["✗A. 因侵權行為所生之損害賠償請求權「可以」作為抵銷之標的（§339但書仍允許），乙得對甲主張抵銷（除非特殊情形），本選項說「不得」錯誤。", "✓B. 依§340，禁止扣押之債權（如撫養費、退休金）不得作為抵銷之標的；甲若想以自己的債權去抵銷乙「禁止扣押」的債權，是不被允許的（保護弱者，避免透過抵銷迂迴扣押），正確。", "✗C. 依§335，履行地不同時，不妨礙抵銷，但主張抵銷之一方須賠償他方因抵銷而生之損害，本選項說「不得主張抵銷」過於絕對，錯誤。", "✗D. 清償期尚未屆至者，負有清償義務之人（債務人）得拋棄其期限利益而提早清償，即可用尚未到期的自己債權主張抵銷；對方（債權人）則可等自己的債權到期後再主張，本選項過於限縮，錯誤。"]}, {"year": 104, "num": 18, "ans": "A", "stem": "下列關於民法規定之贈與契約的敘述，何者正確？", "opts": ["為履行道德上之義務的贈與契約，不得撤銷", "為確認贈與意思，贈與契約須以書面定之", "贈與契約為無償契約，贈與人不負瑕疵擔保責任", "贈與人就其重大過失，對於受贈人不負給付不能之責任"], "exp": ["✓A. §408Ⅱ但書，「為履行道德上義務而為贈與者」不得撤銷（如資助困難的親友，屬道義上應為之事），正確。", "✗B. 贈與契約為不要式契約，不須書面（§406），口頭贈與即有效，書面僅影響撤銷與否之操作。", "✗C. 贈與人原則上不負瑕疵擔保責任（§411前段），但故意不告知瑕疵者除外（§411但書），並非「絕對不負」，本選項雖方向大致正確但不夠完整；官方以A為正解。", "✗D. §410，贈與人因可歸責之給付不能，僅就「故意或重大過失」負責，本選項說「就重大過失不負責」，與§410相反，錯誤。"]}, {"year": 104, "num": 19, "ans": "C", "stem": "下列關於租賃之敘述，何者錯誤？", "opts": ["租金，得以金錢或租賃物之孳息充之", "不動產之租賃契約，其期限逾一年者，應以字據訂立之", "未以字據訂立之不動產之租賃契約，無效", "租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "exp": ["✓A. §421Ⅱ，租金得以金錢或租賃物之孳息充之，正確。", "✓B. §422，不動產租賃逾一年，應以字據訂立之，正確。", "✗C（本題答案）. §422，未以字據訂立逾一年的不動產租賃，「視為不定期限之租賃」（不是無效），本選項說「無效」與法條規定不符，為錯誤選項，即應選答案。", "✓D. §445，租用基地建築房屋者，承租人於契約成立後得請求出租人為地上權之登記，正確。"]}, {"year": 104, "num": 20, "ans": "C", "stem": "甲出租A屋給乙。下列敘述，何者正確？", "opts": ["租賃期間內，甲不願修繕A屋漏水之水管，乙得不經催告，逕行終止契約", "A屋因乙未盡善良管理人之注意致失火燒毀，乙應負損害賠償責任", "若A屋是輻射屋，乙雖明知仍承租之，其後乙仍得以其有物之瑕疵主張解約或減少價金", "非因乙之過失，A屋因火災燒毀，乙亦須負損害賠償責任"], "exp": ["✗A. 甲不修繕，乙應先「催告」出租人修繕（§430），催告後仍不修繕才得自行修繕並請求費用或終止契約，並非不經催告逕行終止。", "✗B. 未盡善良管理人注意（抽象輕過失）致損壞，乙確須負責（§432），但「燒毀」描述中若因乙故意才明確，本選項描述方向正確，但官方以C為最正確答案。", "✓C. §366，買受人知有瑕疵而仍買受（接受），不得主張瑕疵擔保；但租賃另有規定——依§§354以下準用，承租人知有瑕疵而仍承租，原則上不得再主張減少租金或解約，但若出租人故意不告知或特別保證者則不同。然官方答案C認：承租人明知輻射屋仍承租，「仍得」主張（可能係考量人身健康安全之強行規定保護），以官方答案C為準，正確。", "✗D. 非因乙之過失之滅失，乙不負損害賠償責任（§432僅在乙有過失時負責），本選項說「亦須負責」錯誤。"]}, {"year": 104, "num": 21, "ans": "C", "stem": "關於民法規定之保證契約。下列敘述，何者正確？", "opts": ["債權人第一次請求清償時，僅得向主債務人請求", "保證人不得僅保證主債務人之債務的一部分", "保證契約由債權人及保證人口頭約定即可成立", "主債務人所有之抗辯，非經其同意，保證人不得主張"], "exp": ["✗A. 並無此規定，債權人得同時或先後向主債務人及保證人請求（除非有先訴抗辯），選項限制無根據。", "✗B. 保證得為「部分保證」，即保證人僅就部分債務負保證責任，民法並不禁止，選項說「不得」錯誤。", "✓C. 依§739-1，保證契約應以書面為之——等等，書面要件（§739-1）是保證必要形式，口頭約定「不生效力」！本選項說「口頭即可成立」，應為錯誤；但若官方公告C為正解，可能基於修法前版本（§739-1係後來增修），或本題考年（104年）版本適用問題。依現行法（§739-1）保證須書面，口頭保證不生效力，本選項描述依現行法應為錯誤，但官方答案為C，備考請以官方答案C為準並注意修法時點。", "✗D. 依§742，主債務人之抗辯，保證人「得」主張（如主債務尚未到期、已罹時效等），不必得主債務人同意，本選項說「非經同意不得主張」錯誤。"]}, {"year": 104, "num": 31, "ans": "A", "stem": "乙所有A地及建造於A地上之B屋。甲因其對乙之債權屆期未獲清償，乃向法院聲請拍賣A地，並由丙拍定。乙之B屋與丙取得之A地間的法律關係如何？", "opts": ["視為已有地上權之設定", "視為在B屋得使用期限內，有租賃關係", "推定在B屋得使用期限內，有地上權之設定", "推定在B屋得使用期限內，有租賃關係"], "exp": ["✓A. 依§877-1（民法物權篇），土地及其上之建物同屬一人，而僅以土地或僅以建物為抵押，拍賣時，「視為」已就他方設定地上權（「視為」=擬制，確定有效），正確。", "✗B. 地上權而非租賃關係，且為「視為」非「推定」。", "✗C. 「推定」可被推翻，「視為」不可；本題依法應為「視為」，而非「推定」。", "✗D. 同C，應為地上權而非租賃，且應為「視為」而非「推定」。★重點：抵押土地拍賣→視為設定地上權（§877-1）；買賣土地建物分離→推定租賃關係（§425-1）。務必分清。"]}, {"year": 104, "num": 36, "ans": "C", "stem": "年甫16歲之乙受第三人甲贈與房屋一間，乙之父母丙、丁均健在。下列敘述，何者正確？", "opts": ["丙、丁各得單獨管理該房屋", "非得乙之同意，丙、丁不得使用該房屋", "丙、丁得共同將該房屋出租收取租金", "丙為清償自身之債務，得將該房屋出售並移轉所有權"], "exp": ["✗A. 父母為未成年子女之法定代理人，管理其財產應共同行使（§1088Ⅱ），並非各自單獨管理，選項說「各得單獨管理」不正確。", "✗B. 父母對子女財產有管理權（§1088Ⅰ），無須得乙之同意即可使用，本選項「非得乙之同意不得使用」描述錯誤。", "✓C. 父母共同管理子女財產，包含出租收取租金（管理行為），丙丁共同出租房屋屬正常財產管理，正確。", "✗D. 父母對子女財產之管理行為，係為子女利益，不得以自己之利益損害子女，「為清償自身債務」出售子女房屋屬利益衝突，不得為之（§1088Ⅱ），選項錯誤。"]}, {"year": 105, "num": 3, "ans": "B", "stem": "有關財產權之描述，下列敘述何者正確？", "opts": ["債權是請求權，所以只能約定由特定人請求另一特定人為一定作為，但不能約定不作為", "債權具有相對性，所以當出賣人一屋先後兩賣時，前後買賣契約皆為有效", "基於契約自由原則，當事人可以自由創設物權種類", "物權具有絕對性，所以任何債務人均得以其財產對抗債權人"], "exp": ["✗A. 債權不只是「作為」請求，亦可約定「不作為」（如不競業條款、不得轉讓條款），選項說「不能約定不作為」錯誤。", "✓B. 債權具有相對性（僅在契約當事人間有效），出賣人一屋二賣，前買賣契約有效、後買賣契約也有效（債權相對性，雙方各自的契約均有效），但履行上只能選擇一方履行（物權只能移轉一次），正確。", "✗C. 物權法定主義（§757），物權種類及內容，由法律規定，不得自由創設，選項違反物權法定主義，錯誤。", "✗D. 物權具對世性，可對抗所有人；「債務人財產得對抗債權人」說法混亂，且債務人財產是用來清償債務，並非「對抗」，描述邏輯不通。"]}, {"year": 105, "num": 7, "ans": "D", "stem": "有關法律行為之標的，下列敘述何者正確？", "opts": ["甲乙約定以火星上岩石為贈與標的物，該契約有效", "甲乙約定故宮翠玉白菜為買賣標的物，該契約有效", "甲乙約定甲需於1日內完成環島健走行程，該契約有效", "甲乙婚前協議約定，婚後任一方若有出軌行為，願支付對方500萬元，該契約有效"], "exp": ["✗A. 以火星岩石為贈與標的，自始客觀不能（任何人皆無從給付），依§246Ⅰ，契約無效。", "✗B. 故宮翠玉白菜為國家財產（非流通物），雖可討論其可讓性，但依通說：國家公有財產屬不融通物，無法私自買賣，契約標的不能，涉及無效或違法，不認為有效。", "✗C. 1日內環島健走（約1,000公里）現實上幾乎不可能，屬自始事實上不能，按§246意旨，可歸為客觀不能，契約無效或有重大瑕疵；但若嚴格說主觀上某些人可能做到，分類有爭議。", "✓D. 婚前協議一方出軌支付另一方500萬，屬婚姻身份關係外的財產約定（夫妻財產契約或附條件贈與等），在現代民法架構下，不違反強行規定也不違反公序良俗（條件成就的財產給付），有效，正確。"]}, {"year": 105, "num": 9, "ans": "B", "stem": "甲告知乙，若乙願意出國比賽，不管有無得名次，即贈與乙200萬元。試問甲乙間之贈與契約的附款為何？", "opts": ["期限", "條件", "負擔", "約款"], "exp": ["✗A. 期限是確定將來發生之事實，「出國比賽」是否發生並不確定（乙可能不去），非確定期限，也非始期。", "✗B. 條件是「不確定是否發生」之未來事實——但本題重點：附款要求乙必須「出國比賽」，這是一種作為義務，受贈人須為一定行為（履行義務）才能受贈，這是「負擔」而非純粹的停止條件。", "✓C. 「負擔」（§412）：贈與附有要求受贈人履行一定義務之附款，受贈人不履行時贈與人得撤銷贈與；本題要求乙「出國比賽」即為負擔，正確。", "✗D. 約款為泛稱，並非民法特定法律術語，此非精確答案。"]}, {"year": 105, "num": 10, "ans": "A", "stem": "甲於出國遊玩期間，適逢颱風來襲，甲家的大門因此破損，門戶洞開。鄰居乙擔心甲家遭遇盜賊，乃好心召來工匠為其修繕，支出8千元。試問乙得依下列何種法律關係向甲請求返還8千元？", "opts": ["無因管理", "侵權行為", "不當得利", "債務不履行"], "exp": ["✓A. 無因管理（§172）：乙為甲（本人）管理事務（修繕甲的門），未受委任也無義務，且符合甲之利益（防盜賊），乙可向甲請求必要費用8千元返還（§176），正確。", "✗B. 侵權行為是加害人賠償被害人，本題乙並未侵害甲，而是幫助甲，性質完全不同。", "✗C. 不當得利請求返還受益，本題乙支出費用是因無因管理，雖甲確有受益，但更精確的法律關係是無因管理（有更完整的費用返還規定）。", "✗D. 乙與甲無契約，無從主張債務不履行（需有合約義務始可）。"]}, {"year": 105, "num": 11, "ans": "B", "stem": "有關契約之敘述，下列何者正確？", "opts": ["契約為事實行為的一種", "契約得因要約交錯之方式成立", "契約皆須以書面方式為之，方得以成立", "基於契約自由原則，醫生得拒絕醫治病情危急的情敵"], "exp": ["✗A. 契約屬「法律行為」（需意思表示），非事實行為（事實行為不以意思表示為要素，如占有、無因管理）。", "✓B. 依§162，要約交錯：雙方各自獨立發出的要約，在不知對方要約之情況下，若內容一致，可構成契約成立，正確。", "✗C. 契約原則上為不要式，除法律明定書面要式者外，口頭即可成立，選項過於絕對，錯誤。", "✗D. 醫師有緊急醫療義務（醫師法等公法），不得以個人好惡拒絕急救，本選項以「契約自由」主張可拒絕，忽略公法義務的限制，錯誤。"]}, {"year": 105, "num": 12, "ans": "D", "stem": "依現行民法規定，有關違反法定要式規定之法律行為效力，下列何者應為無效？", "opts": ["會員已交付首期會款，但未訂立會單", "不動產買賣之債權契約，未經書面公證", "不動產租賃契約期限約定2年，且未以書面簽訂", "人事保證契約未以書面簽訂"], "exp": ["✗A. 合會未訂立會單：依§709-3修法前後，合會應訂立會單，但未訂立者各種情形下可能仍成立有效但僅效力有爭議，並非當然無效。", "✗B. 不動產買賣債權契約（如購屋買賣契約書）：民法並未規定須公證，雖公證較安全，但不公證並不無效，債權行為無書面強制要求。", "✗C. 不動產租賃2年未以書面：§422視為「不定期限租賃」，並非無效，A類似。", "✓D. 依§756-1Ⅱ，人事保證（承諾雇主因受僱人之行為所生損害）契約，應以書面為之，否則不生效力（無效），正確，這是少數民法明文要求書面且違反時無效的債權契約。"]}, {"year": 105, "num": 14, "ans": "A", "stem": "甲欲向乙租屋3年，雙方僅用通訊軟體Line互相協商，乙已於對話中允諾，但後來丙出更高租金，於是乙改將該屋出租給丙並交付之，後來丙得乙之同意將該屋再出租給丁，某日丁因大意未關爐火將該屋燒毀，下列敘述何者正確？", "opts": ["乙可以向丁主張侵權行為損害賠償", "甲可以主張買賣不破租賃，要求乙繼續出租", "乙若要得到損害賠償，只能向丙請求", "丁燒毀房屋，是因丙轉租給丁的，所以丁不需要負侵權行為損害賠償責任"], "exp": ["✓A. 丁（轉租之次承租人）因過失（未關爐火）燒毀乙（出租人/所有人）之房屋，對乙構成侵權行為（§184），乙可向丁請求損害賠償，正確。", "✗B. 甲與乙雖有Line上允諾，但「3年期租賃未以書面訂立」（§422），視為不定期限租賃，且乙未交付甲占有房屋，買賣不破租賃（§425）前提是已交付，甲未取得占有故不得主張，選項錯誤。", "✗C. 乙得向丁（實際行為人）主張侵權行為（A正確），並非「只能向丙請求」，選項過度限縮。", "✗D. 丁有過失（大意未關爐火），仍須對此過失行為造成的損害負責，轉租並不使丁免於侵權責任，選項錯誤。"]}, {"year": 105, "num": 15, "ans": "D", "stem": "依侵權行為請求損害賠償之說明，下列敘述何者正確？", "opts": ["純粹經濟上之損失亦屬於一種損害，與權利受損一樣，得依民法第184條第1項前段主張之", "債權亦屬於一種財產權，被侵害時，祗得依民法第184條第1項前段主張，而不得依同條項後段或第2項主張", "侵權行為以過失責任為原則，故依同法第191條之3主張危險責任，無須舉證故意過失", "依民法第184條第1項前段請求損害賠償者，被害人就加害人有故意或過失，負舉證責任"], "exp": ["✗A. §184Ⅰ前段「故意或過失不法侵害他人之『權利』」，純粹經濟損失（如合理期待利益減損）並非「權利」本身，無法直接依§184Ⅰ前段主張，需透過後段或其他規定，選項過於擴大。", "✗B. 債權雖難以依§184Ⅰ前段主張（因非物權性質），但得依§184Ⅰ後段（故意以背於善良風俗之方法加損害）或§184Ⅱ（違反保護他人之法律）主張，並非「只能依前段」，選項過度限縮。", "✗C. §191-3（危險責任）係特殊侵權，雖不須舉證加害人過失（推定過失），但性質上仍可能須一定舉證，且說「無須舉證故意過失」不完全準確。", "✓D. 依一般侵權行為§184，被害人應就加害人之「故意或過失」負舉證責任（誰主張誰舉證），除非有舉證責任倒置的特殊規定（如§184Ⅱ推定過失），正確。"]}, {"year": 105, "num": 16, "ans": "B", "stem": "有關民法第250條規定之違約金類型有「損害賠償總額預定違約金」與「懲罰性違約金」兩種，下列敘述何者正確？", "opts": ["「損害賠償總額預定違約金」，倘若債務人有債務不履行發生，惟債權人所受實際損害遠低於約定之額度時，債權人即不得請求此一違約金", "「懲罰性違約金」，倘若債務人有債務不履行發生，不論債權人實際上有無受損害，均得請求此一違約金", "「損害賠償總額預定違約金」，倘若債務人有債務不履行發生，若債權人所受損害高於約定額度時，不得請求超出約定額度之損害賠償", "「懲罰性違約金」，倘若債務人有債務不履行發生，無論約定金額多高，均不得聲請法院減少其數額"], "exp": ["✗A. 損害賠償預定性違約金，當實際損害低於約定額時，債權人「仍可請求約定額」（此即預定性的意義），法院得依§252減少過高違約金，並非「不得請求」，選項錯誤。", "✓B. 懲罰性違約金（§250Ⅱ後段），無論有無實際損害均可請求（懲罰性質，不問損害），正確。", "✗C. 損害賠償預定性違約金之目的是「預先確定賠償額」，實際損害超出約定時，一般不得再額外請求超出部分（預定上限），本選項表述方向正確，但官方以B為最正確答案。", "✗D. §252，違約金過高者，法院得依職權或當事人聲請減少，懲罰性違約金亦可聲請減少，本選項說「不得聲請減少」錯誤。"]}, {"year": 105, "num": 17, "ans": "D", "stem": "若買賣標的物為特定物時，買受人不得請求下列那一種物的瑕疵擔保之法定效果？", "opts": ["減價", "解約", "損害賠償", "另行交付他物"], "exp": ["✗A. 物之瑕疵擔保，買受人得請求「減少價金」（§359），正確（可請求）。", "✗B. 買受人得解除契約（§359），正確（可請求）。", "✗C. 若出賣人故意不告知瑕疵，買受人得請求損害賠償（§360），正確（可請求）。", "✓D. 特定物買賣，標的是「該特定物」，買受人不得請求另行交付「他物」（他物是不同的特定物或種類物，特定物買賣本就以該特定物為標的，不能要求替換他物）；只有「種類物」買賣才有請求另行交付無瑕疵之物（§364）的選項，正確。"]}, {"year": 105, "num": 18, "ans": "A", "stem": "甲將透天厝（不含基地）立約賣給乙後，尚未交付予乙前，即逢超級強烈颱風來襲，致透天厝完全倒塌。下列敘述何者正確？", "opts": ["乙免給付價金予甲", "甲仍負有交屋之義務", "甲仍得請求乙支付價金", "乙得向甲主張侵權行為"], "exp": ["✓A. 颱風為不可歸責雙方之事由（危險負擔，§266），房屋未交付前滅失，出賣人（甲）免給付義務，買受人（乙）亦免給付對待給付（價金），乙免付，正確。", "✗B. 特定物已滅失（颱風倒塌），甲無從再交屋，給付客觀不能，甲之交付義務消滅，並非「仍負有交屋義務」。", "✗C. 依§266，不可歸責雙方的危險負擔，甲乙雙方互免，甲不得再請求乙支付價金，選項錯誤。", "✗D. 颱風倒塌不可歸責於甲，甲並無過失或故意，乙無從主張甲的侵權行為。"]}, {"year": 105, "num": 19, "ans": "D", "stem": "有關贈與契約之敘述，下列何者正確？", "opts": ["贈與契約一旦成立後，贈與人不得任意撤銷之", "贈與契約為要式契約，因此必須作成贈與契約書", "贈與屬於恩惠行為，故成立贈與契約無須受贈人之同意", "因贈與契約為無償契約，故原則上贈與人不負瑕疵擔保責任"], "exp": ["✗A. 贈與人在交付前得「任意撤銷」（§408Ⅰ），除例外情形（書面、道德義務等）外，成立後仍可撤銷，選項說「不得任意撤銷」錯誤。", "✗B. 贈與契約為不要式契約，不必作成書面（口頭贈與有效），選項錯誤。", "✗C. 贈與為雙方契約，須受贈人「承諾接受」始成立（§406本旨），並非無須同意，選項錯誤。", "✓D. §411，贈與人原則上不負物之瑕疵擔保責任（因無償，責任減輕），但故意不告知瑕疵者除外，正確。"]}, {"year": 105, "num": 20, "ans": "A", "stem": "依民法之規定，承租人因下列何種情形致失火而使租賃物毀損、滅失者，應對出租人負損害賠償責任？", "opts": ["重大過失", "不可抗力", "具體輕過失", "抽象輕過失"], "exp": ["✗A→ 先看官方：本題官方答案為A（重大過失）。", "✗B. 不可抗力免責，不須賠償，選項錯誤（不可抗力下不負責）。", "✗C. 一般承租人之責任標準是善良管理人注意（抽象輕過失），但失火特別規定另有§434。", "★依§434，承租人因「重大過失」致租賃物失火者，對出租人負損害賠償責任。因此正確選項A（重大過失），此為民法對失火責任之「特別規定」（一般侵權行為為輕過失即負責，租賃失火例外僅限重大過失才負責），正確。"]}, {"year": 105, "num": 29, "ans": "C", "stem": "有關惡意占有人與善意占有人，在損害賠償請求方面，下列敘述何者正確？", "opts": ["善意占有人就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人僅以滅失或毀損所受之利益為限，負賠償之責", "惡意占有人或無所有意思之占有人，就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人不負賠償責任", "惡意占有人就占有物之滅失或毀損，對於回復請求人負完全賠償責任，即使係不可歸責於惡意占有人之事由所致者，亦同", "善意占有人就占有物之滅失或毀損，不論是否可歸責於自己，均對於回復請求人負損害賠償責任"], "exp": ["✓A. §956（現行§954），善意占有人就占有物之滅失毀損，如不可歸責於自己，「僅以所受之利益為限」負責（即其受有利益部分），正確。", "✗B. 惡意占有人就算不可歸責自己之事由，仍須負全部賠償責任（§957），本選項說「不負賠償責任」錯誤。", "✓C. 依§957（現行規定），惡意占有人就占有物滅失或毀損，「縱不可歸責於自己之事由所致者，亦應負賠償之責」——惡意占有人承擔更重的責任，即使不可抗力也須負責，正確，為官方答案。", "✗D. 善意占有人並非「不論是否可歸責」均負責——如係不可歸責自己之事由，僅以所受利益為限（A已正確描述），D說「均負損害賠償」過於嚴格，錯誤。"]}, {"year": 106, "num": 1, "ans": "C", "stem": "下列有關不動產買賣之敘述，何者錯誤？", "opts": ["不動產仲介公司用與不特定之消費者簽定同類委託銷售不動產而先予擬定之契約，屬於定型化契約", "不動產買賣除標的物及價金外，該房地之交付時間、所有權移轉登記時期、價金之給付方式等，通常亦為契約成立之必要之點", "不動產買賣契約非經法院公證，不生效力", "不動產買賣之價金，因一般習慣，買賣雙方通常係分批給付"], "exp": ["✓A. 仲介公司預先擬定之定型化格式契約，符合消費者保護法定型化契約定義，正確。", "✓B. 買賣契約成立需「必要之點」合意，除標的物及價金外，其他重要事項（交付時間、登記時期、付款方式）通常也是成立要素，正確。", "✗C（本題答案）. 不動產買賣契約（債權行為）並無「須經法院公證才生效」之規定，只有特定情形（如公司法分割、某些特殊移轉）才要求公證；一般不動產買賣不以公證為生效要件，本選項錯誤，為應選答案。", "✓D. 不動產買賣實務中分期（分批）付款極為常見，正確。"]}, {"year": 106, "num": 3, "ans": "D", "stem": "甲乙是大四同班同學，甲平常騎乘其父丙所贈與之電動機車作為交通工具。某日乙向甲借用該部電動機車，以接送其高中同學到學校所在地之風景名勝地區遊玩。下列有關甲乙間之契約關係的敘述何者錯誤？", "opts": ["甲乙間所訂立之契約為單務契約，乙之返還義務與甲之貸與義務不在同一個契約之中", "甲乙間所訂立之契約為無償契約", "甲乙間所訂立之契約為不要式契約", "甲乙間所訂立之契約為諾成契約，無須以機車之交付作為契約成立之要件"], "exp": ["✓A. 使用借貸為單務契約（乙負返還義務；甲之貸與義務在交付前消失，使用借貸須物之交付才成立，成立後只有借用人負返還義務），正確。", "✓B. 使用借貸為無償契約（§464），正確。", "✓C. 使用借貸無書面要求，為不要式契約，正確。", "✗D（本題答案）. 使用借貸為「要物契約」（§464），須以「機車交付」為成立要件，並非「諾成契約」，本選項說「諾成、無須交付即成立」錯誤，為應選答案。"]}, {"year": 106, "num": 8, "ans": "D", "stem": "依民法規定，關於不動產買賣，下列敘述何者正確？", "opts": ["應作成公證書", "非經登記，不生效力", "非經交付買賣之不動產，不生效力", "因當事人就標的物及其價金互相同意而成立"], "exp": ["✗A. 一般不動產買賣契約（債權行為）不須公證，選項錯誤。", "✗B. 「非經登記不生效力」適用於不動產「物權」變動（§758），而非「買賣契約」（債權行為）本身；買賣契約不以登記為生效要件，選項混淆債權行為與物權行為。", "✗C. 買賣契約為諾成契約，不以交付為成立或生效要件，選項錯誤。", "✓D. 依§345Ⅱ，買賣契約於當事人就標的物及價金互相同意時成立（諾成契約），正確。"]}, {"year": 106, "num": 9, "ans": "C", "stem": "甲有A屋，登記為A屋所有人。甲將A屋贈與乙女。試問，下列敘述何者正確？", "opts": ["非經交付A屋，該贈與不生效力", "該贈與應以書面為之", "甲移轉A屋所有權予乙前，得撤銷該贈與", "甲遲延交付A屋予乙時，乙得請求遲延損害賠償"], "exp": ["✗A. 贈與為諾成契約，意思合致即成立生效，並不以交付為生效要件，選項錯誤。", "✗B. 贈與不要式，無書面要求（書面只是影響能否任意撤銷），選項錯誤。", "✓C. 依§408Ⅰ，贈與物之「權利未移轉前」（本題尚未移轉所有權），贈與人得撤銷其贈與，正確（例外書面贈與或履行道德義務等不得撤銷）。", "✗D. 依§410，贈與人責任以故意或重大過失為限（無償責任從輕），遲延給付之責任標準同此從輕，乙不能主張一般債務不履行之遲延損害賠償（§410特別規定），選項不正確。"]}, {"year": 106, "num": 12, "ans": "D", "stem": "甲有A地，登記為A地所有人。甲與乙成立承攬契約，由乙承攬A地之整地工作。乙不僅整地有瑕疵，而且還趁整地之餘，將有毒廢棄物掩埋於A地之下。試問，下列敘述何者錯誤？", "opts": ["甲得請求乙修補瑕疵", "甲依侵權行為法之規定（民法第184條）得請求乙清除有毒廢棄物", "乙將有毒廢棄物掩埋於A地，乙對甲構成不完全給付", "乙將有毒廢棄物掩埋於A地，甲得依民法規定解除契約並請求回復原狀，同時可另行主張損害賠償"], "exp": ["✓A. 承攬有瑕疵，定作人（甲）得請求修補（§493），正確。", "✓B. 掩埋有毒廢棄物侵害甲之土地所有權，構成侵權行為（§184），甲得請求清除，正確。", "✓C. 不完全給付：給付工作有瑕疵（整地有缺陷）且附帶造成額外損害（有毒廢棄物），成立不完全給付（§227），正確。", "✗D（本題答案）. 解除契約後的回復原狀（§259）與損害賠償（§260）可以並行；問題在於：「掩埋有毒廢棄物」部分，能否以「解除契約」+「回復原狀」解決（清除廢棄物），這超出一般承攬瑕疵解除的範疇；選項D說「得解除並請求回復原狀，同時另行主張損害賠償」，此描述在法律上可能產生重複請求問題，或解除後回復原狀的法律效果並不當然包含有毒廢棄物的清除，因此選項D有邏輯瑕疵，為應選之「錯誤」選項。"]}, {"year": 106, "num": 31, "ans": "D", "stem": "就賣方甲與買方乙間訂立之買賣契約，下列敘述何者錯誤？", "opts": ["該買賣標的物因可歸責於甲之事由而滅失，致給付不能者，乙得解除契約並請求損害賠償", "該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，甲得免除該物之給付義務", "該買賣標的物因可歸責於乙之事由而滅失，致給付不能者，乙仍負支付全部買賣價金之義務", "該買賣標的物因可歸責於乙之事由而滅失，致給付不能者，甲得請求損害賠償，並免除給付義務"], "exp": ["✓A. 可歸責於甲之給付不能，乙得解除契約（§256→催告後）並請求損害賠償（§226），正確。", "✓B. 不可歸責雙方（危險負擔，§266），甲免給付義務，乙亦免對待給付，正確。", "✓C. 可歸責於買受人（乙）之給付不能，依§267，乙仍須支付全部價金，正確。", "✗D（本題答案）. 可歸責於乙之給付不能，甲「得請求損害賠償」有疑義——§267規定乙仍須支付價金；甲是否「免除給付義務」則因標的已滅失（客觀不能），甲確實無從履行；但「甲得請求損害賠償」在可歸責於乙時適用§267（乙仍付價金），不另有「損害賠償」的適用（乙的價金給付即為甲應受之對待給付），因此甲「得請求損害賠償」之說法有誤，D描述不正確，為應選答案。"]}, {"year": 106, "num": 36, "ans": "B", "stem": "下列有關租賃契約之敘述，何者錯誤？", "opts": ["租賃關係存續中，出租人未使租賃物合於約定使用收益狀態，致承租人未達租賃目的者，承租人得拒絕給付租金", "出租人將已交付承租人之租賃物的所有權讓與他人，承租人與受讓人間仍須另立租賃契約始發生租賃關係", "出租人於租賃物交付後，應保持其合於約定使用收益之狀態", "承租人如依約定方法使用租賃物，並有相當理由，得以自己費用，就租賃物之一部添置設備"], "exp": ["✓A. 同時履行抗辯（§264），出租人未履行保持租賃物使用狀態義務，承租人得拒付租金，正確。", "✗B（本題答案）. 買賣不破租賃（§425），出租人讓與租賃物所有權給受讓人，承租人「無須另立租賃契約」，原租賃關係當然對受讓人繼續有效，本選項說「仍須另立租賃契約始發生租賃關係」，與§425相反，錯誤，為應選答案。", "✓C. 出租人有義務保持租賃物合於使用收益之狀態（§423），正確。", "✓D. 承租人在合理範圍內得添置設備（不違反約定使用方法），正確（§438精神）。"]}, {"year": 106, "num": 38, "ans": "C", "stem": "下列有關契約解除之敘述，何者錯誤？", "opts": ["契約解除時，當事人雙方負回復原狀之義務", "解除權之行使，不妨礙損害賠償之請求", "房屋買賣契約解除時，原買受人已支出之裝潢費用均得請求出賣人返還", "解除權之行使，得以送達訴狀繕本予他方當事人之方法為之"], "exp": ["✓A. §259，契約解除後當事人負回復原狀義務（返還已受領給付），正確。", "✓B. §260，解除不妨礙損害賠償請求（可同時主張），正確。", "✗C（本題答案）. 回復原狀（§259）是返還「已受領的給付」，裝潢費用係買受人自己花費的「附加費用」，並非出賣人給付的標的，解除契約後能否請求返還裝潢費用須視具體情況（裝潢屬於買受人在標的物上的投入，可能透過損害賠償請求，但並非「均得請求出賣人返還」）；本選項說「均得請求返還」過於絕對，且裝潢費用性質上非「已受領之給付」，C描述錯誤，為應選答案。", "✓D. 解除權行使係形成權，得以訴狀送達作為意思表示方式（§116），正確。"]}];
const TOTAL=81;
const YEARS=[99, 100, 101, 102, 103, 104, 105, 106];
const SK='civlaw_bc_drill_p1_v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
let aY='all',aF='all';
function gk(q){return q.year+'_'+q.num}
function getFilt(){return QS.filter(q=>{const k=gk(q),s=S[k];if(aY!=='all'&&q.year!==aY)return false;if(aF==='un')return!s;if(aF==='wrong')return s&&!s.ok;return true})}
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length,cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function buildChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const a=mk('div','chip'+(aY==='all'?' active':''));a.textContent='全部('+TOTAL+')';a.onclick=()=>{aY='all';render()};c.appendChild(a);
  YEARS.forEach(y=>{const cnt=QS.filter(q=>q.year===y).length,d=mk('div','chip'+(aY===y?' active':''));d.textContent=y+'年('+cnt+')';d.onclick=()=>{aY=y;render()};c.appendChild(d)});
}
function card(q){
  const k=gk(q),s=S[k],c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln[0]==='✓')d.classList.add('cl');else if(ln[0]==='✗')d.classList.add('wl');else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    const lb=mk('span',null,'錯題分類：');lb.style.cssText='font-size:11px;color:var(--gray)';tr.appendChild(lb);
    [['a','A法條混淆'],['b','B粗心'],['c','C真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);return c;
}
function renderCard(q){const old=document.getElementById('c_'+gk(q));if(old)old.replaceWith(card(q))}
function choose(q,ch){
  S[gk(q)]={ch,ok:ch===q.ans};sv();renderCard(q);
  document.getElementById('c_'+gk(q))?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  buildChips();const qs=getFilt(),m=document.getElementById('main');m.innerHTML='';stats();
  if(!qs.length){m.innerHTML='<div class="empty">無符合條件的題目，請切換篩選條件</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
</script>
