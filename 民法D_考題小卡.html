<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="bx-vp.js"></script>
<title>民法概要｜歷屆考題小卡（D・物權編）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F1E6;--paper-deep:#EAE6D6;--ink:#25302C;--ink-soft:#66726B;--rule:#DDD6C0;--stamp:#A8402B;--gold:#B8782E;--green:#35693F;--blue:#3A5A7A;--orange:#B8782E;--purple:#7A4F8A;--red:#A8402B;--surf:#FFFEFA;--onc:#FFFFFF;--t-red:var(--t-red);--t-green:#E9F1E6;--t-gold:#FAF0DC;--t-blue:#E8EEF4;--t-zebra:#FAF7EE;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#A5B1A8;--rule:#34403A;--stamp:#E8806A;--gold:#D9A863;--green:#7FC18A;--blue:#8DB0CE;--orange:#D9A863;--purple:#C3A0D4;--red:#E8806A;--surf:#1F2723;--onc:#10201B;--t-red:#3A2420;--t-green:#1F3326;--t-gold:#3A2F1C;--t-blue:#1E2D3A;--t-zebra:#1B221E;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#A5B1A8;--rule:#34403A;--stamp:#E8806A;--gold:#D9A863;--green:#7FC18A;--blue:#8DB0CE;--orange:#D9A863;--purple:#C3A0D4;--red:#E8806A;--surf:#1F2723;--onc:#10201B;--t-red:#3A2420;--t-green:#1F3326;--t-gold:#3A2F1C;--t-blue:#1E2D3A;--t-zebra:#1B221E;color-scheme:dark}
#bxth{position:fixed;top:10px;right:12px;z-index:70;padding:4px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--surf);color:var(--ink);font-size:12px;cursor:pointer;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.15)}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(188,138,46,0.06), transparent 40%),
    radial-gradient(circle at 90% 95%, rgba(168,64,43,0.05), transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 48px;
}
.wrap{width:100%;max-width:560px;}
header{text-align:center;margin-bottom:14px;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--stamp);
  border:1px solid var(--stamp);border-radius:999px;
  padding:3px 12px;margin-bottom:10px;
}
h1{
  font-family:'Noto Serif TC',serif;font-weight:900;
  font-size:21px;letter-spacing:.04em;line-height:1.5;
}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);
  letter-spacing:.06em;margin-top:4px;font-family:'Noto Sans TC',sans-serif;}

/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 6px;}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--surf);color:var(--ink-soft);
  cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;
}
.chip.active{color:#fff;border-color:transparent;}
.filter-row{display:flex;justify-content:center;margin-bottom:14px;}
.filter-row .chip{border-color:var(--ink);color:var(--ink);font-weight:700;}
.filter-row .chip.active{background:var(--ink);color:var(--onc);}

/* progress */
.progress{
  text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px;
}
.progress b{color:var(--ink);font-size:15px;}
.progress-bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 auto 18px;max-width:200px;}
.progress-fill{height:100%;background:var(--stamp);transition:width .25s ease;}

/* card */
.scene{perspective:1800px;width:100%;}
.card{
  position:relative;width:100%;min-height:540px;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;border:1.5px solid var(--rule);
  background:var(--surf);display:flex;flex-direction:column;
  padding:20px;box-shadow:0 4px 18px rgba(42,39,34,0.07);
  overflow-y:auto;
}
.face.back{transform:rotateY(180deg);background:var(--paper-deep);}
.face.back{border-left:6px solid var(--cat-color,var(--stamp));}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.cat-badge{
  font-size:11px;font-weight:700;color:#fff;padding:4px 12px;border-radius:999px;
  letter-spacing:.06em;font-family:'Noto Serif TC',serif;
}
.year-badge{
  font-size:11px;font-weight:700;color:var(--ink-soft);border:1px solid var(--rule);
  border-radius:999px;padding:3px 10px;font-family:'Noto Serif TC',serif;
}
.mastery-badge{font-size:18px;line-height:1;}
.q-text{font-size:14px;line-height:1.8;margin-bottom:14px;font-weight:500;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;gap:8px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--surf);font-size:13px;line-height:1.6;cursor:pointer;transition:all .15s ease;
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--stamp);background:var(--t-red);}
.opt .letter{
  font-family:'Noto Serif TC',serif;font-weight:900;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;letter-spacing:.1em;font-family:'Noto Serif TC',serif;}

/* back face */
.answer-banner{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:15px;
  padding:10px;border-radius:8px;margin-bottom:12px;
}
.answer-banner.correct{background:var(--t-green);color:var(--green);border:1.5px solid var(--green);}
.answer-banner.wrong{background:var(--t-red);color:var(--stamp);border:1.5px solid var(--stamp);}
.exp-list{display:flex;flex-direction:column;gap:8px;}
.exp-item{padding:9px 10px;border-radius:8px;font-size:12.5px;line-height:1.75;border:1.5px solid var(--rule);background:var(--surf);}
.exp-item.right{border-color:var(--green);background:var(--t-green);}
.exp-item .exp-head{font-weight:900;font-family:'Noto Serif TC',serif;margin-bottom:3px;}
.exp-item.right .exp-head{color:var(--green);}
.exp-item:not(.right) .exp-head{color:var(--stamp);}

/* controls */
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;
  border:1.5px solid var(--ink);background:var(--surf);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer;transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:var(--onc);}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--onc);}
.btn.primary:hover{background:color-mix(in srgb,var(--stamp) 78%,#000);}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:var(--onc);}
.btn.icon{padding:10px 14px;}

.quiz-stats{
  text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px;
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
}
.quiz-stats b{font-family:'Noto Serif TC',serif;}
.quiz-stats .ok{color:var(--green);}
.quiz-stats .ng{color:var(--stamp);}

footer{margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.12em;line-height:2;}
footer .reset{text-decoration:underline;cursor:pointer;color:var(--ink-soft);background:none;border:none;font-size:11px;letter-spacing:.12em;font-family:inherit;}
</style>
<script src="bxm-use.js"></script>
<script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}if(s)document.documentElement.setAttribute("data-theme",s)})();</script>
<script src="bxm-exp.js"></script><script src="bxm-links.js"></script></head>
<body>
<div class="wrap">
  <header>
    <div class="case-tag">案號 D・歷屆試題精選</div>
    <h1>民法概要 考題小卡
      <span class="sub">99-114年不動產經紀人考題・共 18 題</span>
    </h1>
  </header>

  <div class="filter-row" id="resetRow"><div class="chip active" id="resetBtn">全部分類</div></div>
  <div class="chips" id="chips"></div>

  <div class="progress"><b id="curNum">1</b> / <span id="totalNum">18</span>　<span id="catName"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="top-row">
          <span class="cat-badge" id="badgeFront"></span>
          <span class="year-badge" id="yearFront"></span>
          <span class="mastery-badge" id="badgeMasteryFront"></span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="opt-list" id="optList"></div>
        <div class="hint">點選一個選項　看詳解 ▸</div>
      </div>
      <div class="face back">
        <div class="top-row">
          <span class="cat-badge" id="badgeBack"></span>
          <span class="year-badge" id="yearBack"></span>
          <span class="mastery-badge" id="badgeMasteryBack"></span>
        </div>
        <div class="answer-banner" id="answerBanner"></div>
        <div class="exp-list" id="expList"></div>
        <div class="hint">◂ 點擊卡片　回題目</div>
      </div>
    </div>
  </div>

  <div class="controls" id="masteryControls">
    <button class="btn icon" id="markReview">🔄 待複習</button>
    <button class="btn green icon" id="markMastered">✅ 已掌握</button>
  </div>

  <div class="controls">
    <button class="btn icon" id="prevBtn">◂ 上一題</button>
    <button class="btn primary" id="shuffleBtn">🔀 隨機</button>
    <button class="btn icon" id="nextBtn">下一題 ▸</button>
  </div>

  <div class="quiz-stats" id="quizStatsBar">
    <span>本輪：<b class="ok" id="quizOk">0</b> 對　<b class="ng" id="quizNg">0</b> 錯</span>
    <span style="cursor:pointer;text-decoration:underline;" id="resetQuiz">重新測驗</span>
  </div>
  <div class="quiz-stats" id="overallStatsBar">
    <span>累積：已作答 <b id="totalAttempts">0</b> 題次・正確率 <b id="overallAcc">—</b>・已掌握 <b id="masteredCount">0</b>/<b id="totalCards">0</b></span>
  </div>

  <footer>不動產經紀人考試・民法概要｜每題附A-D逐選項詳解，點選答案後自動判對錯並標記掌握度<br>
    <button class="reset" id="resetMastery">清除所有「已掌握」標記</button>
  </footer>
</div>

<script>
const CARDS = [{"id": "ED01", "cat": "物權通則與所有權基礎", "year": "110年第9題", "q": "依現行民法規定，下列何者須經登記始生法律效力？", "opts": ["遺產之繼承", "土地買賣契約", "設定抵押權之物權行為", "夫妻就共同財產制之約定"], "correct": 2, "exps": ["§759：繼承於登記前即已取得不動產物權，僅處分時須先登記，不以登記為取得要件，選項排除。", "§345：土地買賣「契約」為債權行為，當事人就標的物及價金互相同意即成立，不以登記為生效要件，選項排除。", "§758Ⅰ：不動產物權依法律行為而取得、設定、喪失及變更者，非經登記不生效力；設定抵押權之物權行為屬之，正確。", "§1007：夫妻財產制契約應以書面為之；§1008Ⅰ：非經登記不得對抗第三人，登記僅關乎對抗第三人，並非契約生效要件，選項排除。"], "core": ["繼承登記前已取得物權", "買賣契約是債權行為不需登記", "設定抵押物權行為須登記生效", "夫妻財產制登記只為對抗第三人"], "key": [["登記前即已取得"], ["債權行為", "互相同意即成立"], ["非經登記不生效力"], ["不得對抗第三人", "並非契約生效要件"]], "tk": ["ng", "ng", "ok", "ng"]}, {"id": "ED02", "cat": "物權通則與所有權基礎", "year": "105年第21題", "q": "有關物權之優先性，在同一標的物下，下列敘述何者正確？", "opts": ["當所有權與定限物權併存時，所有權之效力依舊優先於定限物權", "當內容或性質相衝突之物權併存時，二者效力均等", "先成立用益物權，再設定擔保物權時，該擔保物權不得對抗該已成立之用益物權", "先成立擔保物權，再設定用益物權時，該擔保物權人無論如何皆可主張塗銷該用益物權"], "correct": 2, "exps": ["定限物權對所有權有限制作用，所有權於定限物權存在時受其限制，效力並非優先。", "內容或性質相衝突之物權併存時，先成立者優先，非效力均等。", "先成立之用益物權，後設擔保物權時，擔保物權不得對抗該用益物權（實行時不得除去之）。", "先成立擔保物權、再設用益物權者，須實行受影響時才得除去（§866 II），並非無論如何皆得塗銷。"], "core": ["定限物權限制所有權，非所有權優先", "衝突時先成立者優先，非均等", "後設擔保物權不得對抗先用益", "須實行受影響時才得除去"], "key": [["受其限制", "限制作用"], ["先成立者優先"], ["不得對抗", "不得除去之"], ["實行受影響時", "才得除去"]], "tk": ["ng", "ng", "ok", "ng"], "trap": "物權優先性：時間在先者強；先用益後擔保→擔保打不過；先擔保後用益→擔保受影響時才能除去。"}, {"id": "ED03", "cat": "物權通則與所有權基礎", "year": "100年第21題", "q": "下列何者，屬於民法上之物？", "opts": ["活人胸腔中跳動之心臟", "博物館中展示之木乃伊", "天上飄浮的雲層", "植入身體的人造關節"], "correct": 1, "exps": ["活人身體之一部分為人格之一部，與身體不可分離時不是民法上的物（人格權客體）。", "已死亡之人體（木乃伊）已非人格主體，通說認為屬物，得為所有權客體。", "雲層不能為人所支配、無法特定與獨立，不具物之性質。", "人造關節植入體內即與身體結合成為身體之一部，通說不再視為獨立之物。"], "core": ["活人身體一部不是物", "已死人體非人格主體，屬物", "雲層無法支配特定，不是物", "植入的人造關節已成身體一部"], "key": [["人格之一部"], ["已非人格主體", "屬物"], ["不能為人所支配"], ["成為身體之一部"]], "tk": ["ng", "ok", "ng", "ng"], "trap": "物的三要件：有體、人力可支配、獨立。與身體結合的物（心臟、植入關節）屬人格範圍；與身體分離（如割下之頭髮）或死後人體才是物。陷阱：把「已植入身體之物」當成物。"}, {"id": "ED04", "cat": "共有", "year": "113年第14題", "q": "甲乙丙丁分別共有A地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？", "opts": ["甲乙丙丁於判決確定時，各自取得分得部分之所有權", "甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權", "共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係", "共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"], "correct": 0, "exps": ["分割共有物判決屬形成判決，確定時即生物權變動，各共有人取得分得部分所有權，不待登記（§759、§824-1）。", "形成判決確定時即取得所有權，不須再請求辦理登記才取得。", "分割判決為形成判決，不是確認判決。", "分割判決為形成判決，不是給付判決，無須請求他共有人「給付」所有權。"], "core": ["形成判決確定即取得，不待登記", "判決確定即取得，不須登記後", "分割判決是形成判決，非確認判決", "分割判決是形成判決，非給付判決"], "key": [["形成判決", "不待登記"], ["確定時即取得"], ["形成判決"], ["形成判決"]], "tk": ["ok", "ng", "ng", "ng"], "trap": "因判決取得不動產物權，不待登記即生效力（§759）；分割判決是形成判決。"}, {"id": "ED05", "cat": "共有", "year": "111年第14題", "q": "關於共有不動產分管契約之敘述，下列何者正確？", "opts": ["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之", "分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之", "共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式", "分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"], "correct": 1, "exps": ["§820 I 之門檻為「共有人過半數及其應有部分合計過半數」（應有部分合計逾三分之二者人數不計），選項寫「半數以上」與條文不符（分管屬共有物之管理，現行§820 I 得以多數決訂定；修法前實務採須全體同意）。", "§820 III：共有物管理因情事變更難以繼續時，法院得因任何共有人之聲請以裁定變更之。", "分管無法達成協議時，法院無從替當事人訂立分管契約；欲終止共有關係須依§824 請求分割。", "§826-1 I：不動產分管約定須經登記，對受讓人才有效力；單純知悉不足，「知悉或可得而知」者限於動產共有。"], "core": ["門檻是過半數，不是半數以上", "情事變更得聲請法院裁定變更", "法院不能代訂分管，只能請求分割", "不動產分管須登記，知悉不足"], "key": [["共有人過半數", "合計過半數"], ["情事變更", "以裁定變更之"], ["法院無從", "請求分割"], ["須經登記", "單純知悉不足"]], "tk": ["ng", "ok", "ng", "ng"], "trap": "分管屬共有物之管理，現行法得依§820 I 多數決訂定；不動產須登記才拘束受讓人（§826-1）；法院只能裁定變更管理，不能代為訂約。"}, {"id": "ED06", "cat": "共有", "year": "106年第22題", "q": "關於公同共有，下列敘述何者正確？", "opts": ["公同關係存續中，各公同共有人，不得請求分割其公同共有物", "各公同共有人，得自由處分其應有部分", "公同關係，不以法律規定或習慣者為限", "各公同共有人之權利，僅及於公同共有物之應有部分"], "correct": 0, "exps": ["§829：公同關係存續中，各公同共有人不得請求分割公同共有物（須公同關係消滅後才可分割），正確。", "§827Ⅲ：公同共有人之權利及於公同共有物之全部，並無「應有部分」可言；公同共有物之處分須經全體同意（§828Ⅲ），故不得自由處分應有部分，選項錯誤。", "§827Ⅱ：依法律行為成立之公同關係，以有法律規定或習慣者為限（如合夥§668、繼承§1151）；選項稱「不以法律規定或習慣為限」與條文相反，錯誤。", "§827Ⅲ：各公同共有人之權利，及於公同共有物之「全部」，而非僅及於應有部分，選項錯誤。"], "core": ["公同關係存續中不得請求分割", "公同共有無應有部分，不能自由處分", "公同關係以法律規定或習慣為限", "權利及於全部，不是僅及應有部分"], "key": [["不得請求分割"], ["並無「應有部分」", "全體同意"], ["以有法律規定", "習慣者為限"], ["「全部」", "非僅及於應有部分"]], "tk": ["ok", "ng", "ng", "ng"]}, {"id": "ED07", "cat": "地上權與農育權", "year": "105年第23題", "q": "有關地上權之敘述何者正確？", "opts": ["地上權乃為債權", "地上權人必須支付地租", "地上權之存續期間，有法定最長20年之限制", "地上權人原則上得將其權利讓與他人或設定抵押權"], "correct": 3, "exps": ["依§832，普通地上權是以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權，屬物權（用益物權），不是債權，選項錯誤。", "地租是否支付由當事人約定：§834 規定「無支付地租之約定」的地上權人得隨時拋棄權利，§835 則規範「有地租約定」的情形，可知地上權可為無償，並非必須支付地租，選項錯誤。", "租賃契約期限不得逾20年（§449Ⅰ），且租用基地建築房屋者不適用（§449Ⅲ）；地上權並無最長20年的法定限制，選項錯誤。", "依§838Ⅰ，地上權人得將其權利讓與他人或設定抵押權，但契約另有約定或另有習慣者不在此限，故原則上可讓與及抵押，正確。"], "core": ["地上權是物權，不是債權", "地上權可為無償，非必付地租", "20年上限是租賃，非地上權", "原則上可讓與及設定抵押"], "key": [["屬物權", "用益物權"], ["由當事人約定", "可為無償"], ["租賃契約期限", "並無最長20年"], ["讓與他人", "設定抵押權"]], "tk": ["ng", "ng", "ng", "ok"]}, {"id": "ED08", "cat": "地上權與農育權", "year": "110年第17題", "q": "地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權。下列何者正確？", "opts": ["二十年", "十五年", "十年", "五年"], "correct": 0, "exps": ["§833-1：地上權未定有期限者，存續期間逾二十年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌各種情形定其存續期間或終止其地上權，正確。", "十五年是§913典權絕賣條款之門檻（約定期限不滿十五年者，不得附有到期不贖即作絕賣之條款），與地上權無關。", "十年是§770善意無過失占有他人未登記不動產之取得時效期間，非§833-1所定數字。", "五年是§861Ⅱ抵押權利息優先受償之期間（聲請執行前五年內），非§833-1所定數字。★§833-1：未定期限地上權→逾20年，法院得介入。"], "core": ["§833-1未定期限逾二十年", "十五年是典權絕賣門檻", "十年是§770時效期間", "五年是§861Ⅱ利息期間"], "key": [["存續期間逾二十年"], ["典權絕賣條款"], ["取得時效期間"], ["利息優先受償"]], "tk": ["ok", "ng", "ng", "ng"]}, {"id": "ED09", "cat": "地上權與農育權", "year": "113年第9題", "q": "甲在其所有之A地上興建B屋後，將B屋出售並移轉所有權登記於乙。下列敘述，何者正確？", "opts": ["推定甲與乙在房屋得使用期限內有租賃關係", "視為甲與乙在房屋得使用期限內有租賃關係", "推定乙在房屋得使用期限內對A地有普通地上權", "視為乙在房屋得使用期限內對A地有普通地上權"], "correct": 0, "exps": ["§425-1，土地及其上建物同屬一人，僅將建物移轉（甲將B屋賣給乙），「推定」（非視為）在房屋得使用期限內，甲乙間有租賃關係，正確。", "應為「推定」而非「視為」（視為不可推翻，推定可以反証），選項錯誤。", "§425-1規定的是「租賃」關係，並非地上權，且為推定，選項錯誤。", "同C，應為推定租賃，非視為地上權。★重要對比：土地房屋一般買賣分離→§425-1推定租賃；抵押拍賣分離→§876視為地上權。"], "core": ["§425-1推定有租賃關係", "是推定，不是視為", "§425-1是租賃，不是地上權", "應為推定租賃，非視為地上權"], "key": [["「推定」", "租賃關係"], ["「推定」", "反証"], ["「租賃」", "並非地上權"], ["推定租賃", "非視為地上權"]], "tk": ["ok", "ng", "ng", "ng"]}, {"id": "ED10", "cat": "不動產役權", "year": "105年第25題", "q": "以他人不動產供自己不動產通行、汲水、採光、眺望、電信 -1 I：最高限額抵押權為就一定範圍內之不特定債權，在最高限額內設定之抵押權。", "§881-2 I：就已確定之原債權，僅得於約定最高限額範圍內行使抵押權。", "§881-5 I：未約定確定期日者，抵押人或抵押權人得隨時請求確定原債權。", "§881-4 I：確定期日係得於「確定期日前」約定變更；期日屆至後原債權即確定，不得事後再變更，D所述順序顛倒。"], "core": ["§881-1一定範圍不特定債權擔保", "已確定原債權僅於最高限額內行使", "未約定期日得隨時請求確定", "只能在確定期日前變更，非期日後"], "key": [["不特定債權"], ["最高限額範圍內"], ["得隨時請求確定"], ["確定期日前", "不得事後再變更"]], "tk": ["ok", "ok", "ok", "ng"], "trap": "最高限額抵押權的「確定」：期日可事前約定、事前變更（上限30年，§881-4）；沒約定期日則隨時請求確定（§881-5）。"}, {"id": "ED14", "cat": "質權與留置權", "year": "105年第28題", "q": "乙將其所有汽車為甲設定動產質權，以為其對甲借款債務之擔保。該車並已交付甲之占有。下列那種情形，甲之動產質權並不消滅？", "opts": ["丙仗義相助幫乙清償該債務", "甲將該車返還給乙", "甲喪失對該車之占有，於第3年始請求返還", "該車被盜後，隔年再讓與給善意第三人，甲對該第三人行使回復請求權時"], "correct": 3, "exps": ["債務經第三人清償而消滅，質權因從屬性亦消滅。", "質權人返還質物於出質人，動產質權消滅（§897）。", "質權人喪失占有，須於二年內請求返還（§898）；第三年才請求，質權已消滅。", "甲因車被盜而喪失占有，題目說「隔年」讓與善意第三人時甲即行使回復請求權，仍在喪失占有後二年內：§949 I 允許原占有人（甲）自喪失占有之時起二年以內，向善意受讓之現占有人請求回復其物；§898 則只在「二年內未請求返還」時才使質權消滅，甲已請求，質權不消滅。"], "core": ["債務清償，質權因從屬性消滅", "返還質物給出質人，質權消滅", "喪失占有須2年內請求返還", "2年內已請求回復，質權不消滅"], "key": [["第三人清償", "因從屬性亦消滅"], ["返還質物於出質人", "動產質權消滅"], ["二年內請求返還", "質權已消滅"], ["甲已請求", "質權不消滅"]], "tk": ["ng", "ng", "ng", "ok"], "trap": "動產質權靠「占有」：返還給出質人就消滅（§897），喪失占有2年內不請求返還也消滅（§898）。陷阱：記成一年或三年。"}, {"id": "ED15", "cat": "典權", "year": "106年第29題", "q": "依民法之規定，稱典權者，謂支付典價在他人之不動產為使用、收益，於他人不回贖時，取得該不動產所有權之權。下列關於典權之敘述，何者錯誤？", "opts": ["典權人對於典物因轉典所受之損害，負賠償責任", "典權之約定期限超過15年時，當事人間得附有到期不贖即作絕賣之條款", "典權人為典物支出有益費用，使典物增加價值，不論該增益之價值是否仍然存在，得請求出典人償還", "未定期限之典權，出典人得隨時以原典價回贖典物。但自出典後經過30年不回贖者，典權人即取得典物所有權"], "correct": 2, "exps": ["§916：典權人對於典物因轉典或出租所受之損害，負賠償責任。", "§913 I：典權約定期限不滿15年者，不得附有到期不贖即作絕賣之條款；超過15年者可以約定。", "§927 I：典權人支出有益費用使典物價值增加，出典人回贖時僅以「現存之增價額」為限償還，增益價值已不存在則不得請求。", "§924：未定期限之典權，出典人得隨時以原典價回贖；但出典後經過30年不回贖者，典權人取得典物所有權。"], "core": ["§916轉典所受損害應負賠償", "超過15年可附絕賣條款", "有益費用限現存增價額償還", "未定期限典權30年不贖取得所有權"], "key": [["負賠償責任"], ["超過15年者"], ["現存之增價額"], ["經過30年不回贖", "取得典物所有權"]], "tk": ["ok", "ok", "ng", "ok"], "trap": "典權數字：期限上限30年（§912）、15年門檻（絕賣條款，§913）、未定期限典權出典後30年不回贖→典權人取得所有權（§924）；有益費用「現存增價額」是共通模式，不論「是否仍存在」就是陷阱。 async function loadMastery(){
  try{
    const res = await window.storage.get('exam_mastery_data_d');
    if(res && res.value) mastery = JSON.parse(res.value);
  }catch(e){ mastery = {}; }
}
async function saveMastery(){
  try{ await window.storage.set('exam_mastery_data_d', JSON.stringify(mastery)); }
  catch(e){ console.error('storage save failed', e); }
}

Object.keys(CAT_COLORS).forEach(cat=>{
  const count = CARDS.filter(c=>c.cat===cat).length;
  const chip = document.createElement('div');
  chip.className='chip active';
  chip.style.background=CAT_COLORS[cat];
  chip.style.borderColor=CAT_COLORS[cat];
  chip.style.color='#fff';
  chip.textContent=`${cat} (${count})`;
  chip.dataset.cat=cat;
  chip.addEventListener('click',()=>{
    if(activeCats.has(cat)){
      if(activeCats.size===1) return;
      activeCats.delete(cat);
      chip.classList.remove('active');
      chip.style.background='var(--surf)';
      chip.style.color=CAT_COLORS[cat];
    } else {
      activeCats.add(cat);
      chip.classList.add('active');
      chip.style.background=CAT_COLORS[cat];
      chip.style.color='#fff';
    }
    rebuildDeck();
  });
  chipsEl.appendChild(chip);
});

resetBtn.addEventListener('click',()=>{
  activeCats = new Set(Object.keys(CAT_COLORS));
  document.querySelectorAll('.chip[data-cat]').forEach(chip=>{
    const cat=chip.dataset.cat;
    chip.classList.add('active');
    chip.style.background=CAT_COLORS[cat];
    chip.style.color='#fff';
  });
  rebuildDeck();
});

function getStat(id){
  const m = mastery[id];
  if(!m) return {status:null, attempts:0, correct:0};
  if(typeof m === 'string') return {status:m, attempts:1, correct:(m==='mastered'?1:0)};
  return m;
}
function masteryIcon(stat){
  if(!stat.status) return '';
  const icon = stat.status==='mastered' ? '✅' : '🔄';
  return stat.attempts>0 ? `${icon}×${stat.attempts}` : icon;
}
function updateOverallStats(){
  let attempts=0, correct=0, mastered=0;
  CARDS.forEach(c=>{
    const s = getStat(c.id);
    attempts += s.attempts;
    correct += s.correct;
    if(s.status==='mastered') mastered++;
  });
  document.getElementById('totalAttempts').textContent = attempts;
  document.getElementById('overallAcc').textContent = attempts ? Math.round(correct/attempts*100)+'%' : '—';
  document.getElementById('masteredCount').textContent = mastered;
  document.getElementById('totalCards').textContent = CARDS.length;
}

function rebuildDeck(){
  deck = CARDS.filter(c=>activeCats.has(c.cat));
  idx = 0;
  render();
}

function render(){
  const c = deck[idx];
  const color = CAT_COLORS[c.cat];
  flipped = false;
  selectedOpt = null;
  cardEl.classList.remove('flipped');
  qText.textContent = c.q;
  badgeFront.textContent = c.cat;
  badgeFront.style.background = color;
  badgeBack.textContent = c.cat;
  badgeBack.style.background = color;
  yearFront.textContent = c.year;
  yearBack.textContent = c.year;
  document.querySelector('.face.back').style.borderLeftColor = color;
  const stat = getStat(c.id);
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
  curNum.textContent = idx+1;
  totalNum.textContent = deck.length;
  catName.textContent = '・' + c.cat;
  progFill.style.width = ((idx+1)/deck.length*100)+'%';

  optList.innerHTML = '';
  const letters = ['A','B','C','D'];
  c.opts.forEach((opt,i)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    div.addEventListener('click', ()=> selectOption(i));
    optList.appendChild(div);
  });
}

function okOf(c){return c.ok||[c.correct]}
function selectOption(i){
  if(flipped) return;
  const c = deck[idx];
  selectedOpt = i;
  const correct = (okOf(c).includes(i));
  document.querySelectorAll('.opt')[i].classList.add('selected');

  // build back face
  answerBanner.className = 'answer-banner ' + (correct ? 'correct' : 'wrong');
  const letters = ['A','B','C','D'];
  answerBanner.textContent = correct
    ? `✅ 答對！正解是 ${okOf(c).map(x=>letters[x]).join('、')}`
    : `❌ 答錯了，你選 ${letters[i]}，正解是 ${okOf(c).map(x=>letters[x]).join('、')}`;

  expList.innerHTML = '';
  c.exps.forEach((exp,j)=>{
    const div = document.createElement('div');
    div.className = 'exp-item' + (okOf(c).includes(j) ? ' right' : '');
    const mark = okOf(c).includes(j) ? '✓ 正解' : '✗';
    div.innerHTML = `${window.bxmExp?'<div>'+bxmExp(exp,(c.core||[])[j],(c.key||[])[j],(c.tk||[])[j],'',{L:letters[j],ans:okOf(c).includes(j)})+'</div>':'<div class="exp-head">'+letters[j]+'. '+mark+'</div><div>'+exp+'</div>'}`;
    expList.appendChild(div);
  });
  if(window.BXM_LINKS_HTML){const ym=String(c.year||'').match(/(\d+)年第(\d+)題/);const lk=ym?BXM_LINKS_HTML(ym[1]+'-'+ym[2]):'';if(lk){const w=document.createElement('div');w.innerHTML=lk;expList.appendChild(w)}}/*bxm-links*/

  // stats + mastery
  if(correct) quizStats.ok++; else quizStats.ng++;
  const stat = getStat(c.id);
  stat.attempts += 1;
  if(correct) stat.correct += 1;
  stat.status = correct ? 'mastered' : 'review';
  mastery[c.id] = stat;
  saveMastery();
  quizOk.textContent = quizStats.ok;
  quizNg.textContent = quizStats.ng;
  updateOverallStats();

  setTimeout(()=>{ flipped=true; cardEl.classList.add('flipped'); }, 150);

  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
}

cardEl.addEventListener('click',()=>{
  if(flipped){ flipped=false; cardEl.classList.remove('flipped'); }
});

function goNext(){ idx=(idx+1)%deck.length; render(); }
function goPrev(){ idx=(idx-1+deck.length)%deck.length; render(); }
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0; render();
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
});

document.getElementById('markMastered').addEventListener('click',()=>{
  const c = deck[idx];
  const stat = getStat(c.id);
  stat.status='mastered';
  mastery[c.id]=stat; saveMastery();
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent=icon; badgeMasteryBack.textContent=icon;
  updateOverallStats();
});
document.getElementById('markReview').addEventListener('click',()=>{
  const c = deck[idx];
  const stat = getStat(c.id);
  stat.status='review';
  mastery[c.id]=stat; saveMastery();
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent=icon; badgeMasteryBack.textContent=icon;
  updateOverallStats();
});

document.getElementById('resetQuiz').addEventListener('click',()=>{
  quizStats = {ok:0, ng:0};
  quizOk.textContent=0; quizNg.textContent=0;
});

document.getElementById('resetMastery').addEventListener('click',async ()=>{
  if(!confirm('確定要清除所有學習記錄（已掌握/待複習/作答次數）嗎？此動作無法復原。')) return;
  mastery = {};
  await saveMastery();
  render();
  updateOverallStats();
});

(async function init(){
  await loadMastery();
  rebuildDeck();
  updateOverallStats();
})();
</script>
