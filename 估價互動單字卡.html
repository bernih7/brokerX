<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不動產估價概要｜互動單字卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E6; --paper:#FFFEFA; --paper-deep:#F0EDE0;
  --fg:#25302C; --ink:#25302C; --ink-soft:#7A8C84;
  --primary:#2F5D50;
  --line:#DDD6C3; --rule:#DDD6C3;
  --muted:#7A8C84; --shadow:rgba(37,48,44,.09);
  --stamp:#A84030; --gold:#B8782E; --green:#2F6B45; --blue:#1E6B8C;
  --orange:#B8782E; --purple:#7B5C8C; --red:#A84030;
  color-scheme: light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F1D; --paper:#222926; --paper-deep:#1E2420;
    --fg:#E8EDE6; --ink:#E8EDE6; --ink-soft:#7A9488;
    --primary:#5A9E88;
    --line:#2E3A34; --rule:#2E3A34;
    --muted:#7A9488; --shadow:rgba(0,0,0,.3);
    --stamp:#C05A42; --gold:#D09848; --green:#4A9060; --blue:#3A8CAC;
    --orange:#D09848; --purple:#9A7CB0; --red:#C05A42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F1D; --paper:#222926; --paper-deep:#1E2420;
  --fg:#E8EDE6; --ink:#E8EDE6; --ink-soft:#7A9488;
  --primary:#5A9E88;
  --line:#2E3A34; --rule:#2E3A34;
  --muted:#7A9488; --shadow:rgba(0,0,0,.3);
  --stamp:#C05A42; --gold:#D09848; --green:#4A9060; --blue:#3A8CAC;
  --orange:#D09848; --purple:#9A7CB0; --red:#C05A42;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--fg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 48px;
}
.wrap{width:100%;max-width:520px;}
header{text-align:center;margin-bottom:14px;}
.page-header{margin-bottom:14px;}
.page-header .titles{text-align:left;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--stamp);
  border:1px solid var(--stamp);border-radius:999px;
  padding:3px 12px;margin-bottom:10px;
}
h1{
  font-family:"Noto Serif TC",serif;font-weight:900;
  font-size:22px;letter-spacing:.04em;line-height:1.5;
}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);
  letter-spacing:.08em;margin-top:4px;font-family:"Noto Sans TC",sans-serif;}

.mode-tabs{
  display:flex;gap:8px;margin:18px 0 12px;background:var(--paper);
  border:1.5px solid var(--ink);border-radius:12px;padding:4px;
}
.mode-tab{
  flex:1;text-align:center;padding:9px 8px;border-radius:9px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
  cursor:pointer;color:var(--ink-soft);transition:all .15s ease;
  user-select:none;
}
.mode-tab.active{background:var(--primary);color:#fff;}

.chips{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin:10px 0 6px;
}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--paper);color:var(--ink-soft);
  cursor:pointer;user-select:none;transition:all .15s ease;
  white-space:nowrap;
}
.chip.active{color:#fff;border-color:transparent;}

.filter-row{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.filter-row .chip{border-color:var(--fg);color:var(--fg);font-weight:700;}
.filter-row .chip.active{background:var(--ink);color:#fff;}

.status-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.status-row .chip{border-color:var(--gold);color:var(--gold);}
.status-row .chip.active{background:var(--gold);color:#fff;}
.status-row .chip.review{border-color:var(--stamp);color:var(--stamp);}
.status-row .chip.review.active{background:var(--stamp);color:#fff;}
.status-row .chip.mastered{border-color:var(--green);color:var(--green);}
.status-row .chip.mastered.active{background:var(--green);color:#fff;}

.progress{
  text-align:center;font-family:"Noto Serif TC",serif;font-weight:700;
  font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px;
}
.progress b{color:var(--fg);font-size:15px;}
.progress-bar{
  height:3px;background:var(--rule);border-radius:2px;overflow:hidden;
  margin:0 auto 18px;max-width:200px;
}
.progress-fill{height:100%;background:var(--stamp);transition:width .25s ease;}

.scene{perspective:1400px;width:100%;}
.card{
  position:relative;width:100%;min-height:320px;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;cursor:pointer;
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;border:1.5px solid var(--rule);
  background:var(--paper);
  display:flex;flex-direction:column;
  padding:26px 24px;
  box-shadow:0 4px 18px var(--shadow);
  overflow-y:auto;
}
.face.back{transform:rotateY(180deg);background:var(--paper-deep);}
.badge-row{display:flex;flex-direction:row;align-items:center;gap:6px;margin-bottom:18px;}
.cat-badge{
  font-size:11px;font-weight:700;color:#fff;
  padding:4px 12px;border-radius:999px;letter-spacing:.08em;
  font-family:"Noto Serif TC",serif;
}
.freq-badge{
  font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;letter-spacing:.04em;
  background:color-mix(in srgb,var(--fg) 8%,var(--paper));color:var(--fg);
  font-family:"Noto Serif TC",serif;white-space:nowrap;
}
.mastery-badge{
  position:absolute;top:14px;right:14px;font-size:18px;line-height:1;
}
.face-body{flex:1;display:flex;align-items:center;}
.term{
  font-family:"Noto Serif TC",serif;font-weight:700;
  font-size:18px;line-height:1.7;color:var(--fg);
}
.answer{font-size:14px;line-height:2.1;color:var(--fg);}
/* 覆蓋 data 裡的 inline style 硬碼色 */
.answer small[style]{color:var(--muted)!important;}
.answer b{color:var(--stamp);}
.answer .trap{
  display:inline-block;margin-top:10px;
  background:color-mix(in srgb,var(--stamp) 12%,var(--paper));border-left:3px solid var(--stamp);
  color:var(--stamp);font-size:12.5px;padding:5px 10px;border-radius:0 6px 6px 0;
  line-height:1.6;width:100%;box-sizing:border-box;
}
.answer .def{
  display:inline-block;margin-bottom:4px;
  background:color-mix(in srgb,var(--green) 12%,var(--paper));border-left:3px solid var(--green);
  color:var(--green);font-size:12.5px;padding:5px 10px;border-radius:0 6px 6px 0;
  line-height:1.6;width:100%;box-sizing:border-box;
}
.answer .formula{
  display:inline-block;margin:6px 0;
  background:color-mix(in srgb,var(--blue) 10%,var(--paper));border-left:3px solid var(--blue);
  color:var(--blue);font-size:12.5px;padding:6px 10px;border-radius:0 6px 6px 0;
  line-height:1.8;width:100%;box-sizing:border-box;font-family:"Noto Serif TC",serif;
}
/* 口訣提示框 */
.answer .tip{
  display:inline-block;margin-top:8px;
  background:color-mix(in srgb,var(--gold) 10%,var(--paper));
  border-left:3px solid var(--gold);color:var(--fg);
  font-size:12px;padding:5px 10px;border-radius:0 6px 6px 0;
  line-height:1.6;width:100%;box-sizing:border-box;
}
.ask-chip{
  align-self:flex-start;margin-top:10px;
  font-size:12px;font-weight:700;color:var(--gold);
  background:color-mix(in srgb,var(--gold) 12%,var(--paper));
  border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  padding:3px 11px;border-radius:999px;font-family:"Noto Serif TC",serif;
}
.q-echo{
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:-6px 0 12px;
  font-family:"Noto Serif TC",serif;
}
.q-echo b{color:var(--gold);margin-right:5px;}
.exam-line{
  margin-top:12px;padding-top:9px;border-top:1px dashed var(--rule);
  font-size:11.5px;line-height:1.7;color:var(--ink-soft);
}
.exam-line b{color:var(--fg);}
.exam-line .zero{color:var(--muted);}
.face-foot{
  text-align:center;font-size:11px;color:var(--ink-soft);
  letter-spacing:.15em;margin-top:14px;font-family:"Noto Serif TC",serif;
}
.face.back .face-foot{color:var(--gold);}
.face.back{border-left:6px solid var(--cat-color,var(--stamp));}

.controls{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:20px;flex-wrap:wrap;
}
.btn{
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;
  border:1.5px solid var(--ink);background:var(--paper);color:var(--fg);
  border-radius:10px;padding:10px 16px;cursor:pointer;
  transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:#fff;}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.btn.primary:hover{background:color-mix(in srgb,var(--stamp) 75%,#000);}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:#fff;}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:hover{background:var(--gold);color:#fff;}
.btn.wide{flex:1;min-width:120px;text-align:center;}
.btn.icon{padding:10px 14px;}

.quiz-stats{
  text-align:center;font-size:13px;color:var(--ink-soft);
  margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
}
.quiz-stats b{font-family:"Noto Serif TC",serif;}
.quiz-stats .ok{color:var(--green);}
.quiz-stats .ng{color:var(--stamp);}

.breakdown{
  margin-top:14px;background:var(--paper);border:1px solid var(--rule);
  border-radius:10px;padding:14px;font-size:13px;
}
.breakdown table{width:100%;border-collapse:collapse;}
.breakdown td{padding:5px 4px;border-bottom:1px solid var(--rule);}
.breakdown tr:last-child td{border-bottom:none;}
.breakdown .bar{
  display:block;height:6px;border-radius:3px;background:var(--rule);
  overflow:hidden;margin-top:3px;
}
.breakdown .bar-fill{height:100%;background:var(--green);}

footer{
  margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);
  letter-spacing:.12em;line-height:2;
}
footer .reset{
  text-decoration:underline;cursor:pointer;color:var(--ink-soft);background:none;
  border:none;font-size:11px;letter-spacing:.12em;font-family:inherit;
}

/* 主題切換按鈕 */
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:999;
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--paper);
  color:var(--fg);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px var(--shadow);
  transition:all .2s ease;
}
.theme-toggle:hover{background:var(--fg);color:var(--bg);}









/* ── 整合控制膠囊（主題＋計數）── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.page-header .titles{flex:1;min-width:0}
.hdr-controls{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;padding-top:4px}
.ctrl-pill{display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--paper);height:26px}
.ctrl-pill .vsep{width:1px;height:14px;background:var(--rule);flex-shrink:0}
.ctrl-pill .theme-btn-pill{all:unset;cursor:pointer;padding:0 10px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;font-family:inherit;white-space:nowrap;transition:background .1s,color .1s}
.ctrl-pill .theme-btn-pill:hover{background:var(--rule);color:var(--primary)}
.ctrl-pill .bxv-mini{display:flex;align-items:center;height:26px}
.ctrl-pill .bxv-mini .cnt{min-width:22px;padding:0 4px;height:26px;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums}
.ctrl-pill .bxv-mini .sep{width:1px;height:14px;background:var(--rule);flex-shrink:0}
.ctrl-pill .bxv-mini button{all:unset;cursor:pointer;width:24px;height:26px;display:grid;place-items:center;font-size:.85rem;color:var(--ink-soft);transition:background .1s,color .1s}
.ctrl-pill .bxv-mini button:hover{background:var(--rule);color:var(--gold)}
</style>
<style>



</style><script src="bxv-use.js"></script>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div class="titles">
      <div class="case-tag">不動產估價概要・核心概念精選</div>
      <h1>不動產估價概要 互動單字卡
        <span class="sub">核心定義・公式・陷阱辨析・共 91 張</span>
      </h1>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em;">📅 最新編輯時間：2026-06-30　｜　版本 v1.0</div>
    </div>
    <div class="hdr-controls">
      <div class="ctrl-pill">
        <button class="theme-btn-pill" id="theme-btn" onclick="toggleTheme()">深色</button>
        <div class="vsep"></div>
        <div class="bxv-mini">
          <button onclick="bxvDec()" title="減一">－</button>
          <div class="sep"></div>
          <div class="cnt" id="bxv-n">0</div>
          <div class="sep"></div>
          <button onclick="bxvInc()" title="加一">＋</button>
        </div>
      </div>
    </div>
  </div>

  <div class="mode-tabs">
    <div class="mode-tab active" id="tabStudy">📖 學習模式</div>
    <div class="mode-tab" id="tabQuiz">📝 測驗模式</div>
  </div>

  <div class="filter-row" id="resetRow">
    <div class="chip active" id="resetBtn">全部分類</div>
  </div>
  <div class="chips" id="chips"></div>

  <div class="status-row" id="statusRow"></div>

  <div class="progress"><b id="curNum">1</b> / <span id="totalNum">84</span>　<span id="catName"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="badge-row">
          <div class="cat-badge" id="badgeFront"></div>
          <div class="freq-badge" id="freqBadgeFront"></div>
        </div>
        <div class="mastery-badge" id="badgeMasteryFront"></div>
        <div class="face-body"><div class="term" id="termText"></div></div>
        <div class="ask-chip" id="askChip"></div>
        <div class="face-foot" id="footFront">點擊卡片　看解析 ▸</div>
      </div>
      <div class="face back">
        <div class="badge-row">
          <div class="cat-badge" id="badgeBack"></div>
          <div class="freq-badge" id="freqBadgeBack"></div>
        </div>
        <div class="mastery-badge" id="badgeMasteryBack"></div>
        <div class="q-echo" id="qEcho"></div>
        <div class="face-body"><div class="answer" id="answerText"></div></div>
        <div class="exam-line" id="examLine"></div>
        <div class="face-foot" id="footBack">◂ 點擊卡片　回題目</div>
      </div>
    </div>
  </div>

  <div class="controls" id="masteryControls">
    <button class="btn icon" id="markReview">🔄 待複習</button>
    <button class="btn green icon" id="markMastered">✅ 已掌握</button>
  </div>

  <div class="controls" id="quizControls" style="display:none;">
    <button class="btn primary wide" id="revealBtn">👀 顯示答案</button>
    <button class="btn icon" id="quizWrong" style="display:none;border-color:var(--stamp);color:var(--stamp);">❌ 答錯</button>
    <button class="btn green icon" id="quizRight" style="display:none;">✅ 答對</button>
  </div>

  <div class="controls">
    <button class="btn icon" id="prevBtn">◂ 上一張</button>
    <button class="btn primary" id="shuffleBtn">🔀 隨機</button>
    <button class="btn icon" id="nextBtn">下一張 ▸</button>
  </div>

  <div class="quiz-stats" id="quizStatsBar" style="display:none;">
    <span>本輪：<b class="ok" id="quizOk">0</b> 對　<b class="ng" id="quizNg">0</b> 錯</span>
    <span style="cursor:pointer;text-decoration:underline;" id="toggleBreakdown">看分類統計</span>
    <span style="cursor:pointer;text-decoration:underline;" id="resetQuiz">重新測驗</span>
  </div>
  <div class="breakdown" id="breakdownPanel" style="display:none;"></div>

  <footer>不動產經紀人考試・不動產估價概要｜學習模式：標記掌握度（自動儲存）｜測驗模式：自評答對/答錯並統計（可來回翻看題目）<br>
  徽章「選N・申M」＝99–114年 519 題官方選擇題＋32 題官方申論中，題幹或正確選項涉及該卡概念的題數（關鍵字比對，約略值，用來判斷重要性）<br>
    <button class="reset" id="resetMastery">清除所有「已掌握」標記</button>
  </footer>
</div>

<script>
const CARDS = [
{id:"V01", cat:"估價原則", front:"最有效使用原則的完整定義？", back:"<span class='def'>客觀上具有<b>良好意識及通常使用能力者</b>，<br>在<b>合法、實質可能、正當合理、財務可行</b>前提下，<br>得以獲致<b>最高利益</b>之使用</span><span class='trap'>⚠️ 是「<b>客觀上</b>」——非消費者主觀效用認知</span>"},
{id:"V02", cat:"估價原則", front:"替代原則在估價上的意義？", back:"<span class='def'>審慎消費者<b>不會支付高於</b>相同滿意度替代財貨之代價</span><b>比較法、成本法、收益法三大方法之共同基礎</b><br><small style='color:#7A7165;'>（交易觀點 / 重置觀點 / 投資觀點）</small>"},
{id:"V03", cat:"估價原則", front:"貢獻原則 vs 均衡原則，如何區分？", back:"<b>貢獻原則</b>：<b>局部</b>對<b>整體</b>價值之貢獻<br><small style='color:#7A7165;'>（如加裝電梯使整體價值提升）</small><br><b>均衡原則</b>：<b>生產要素間</b>達最適配置才能創造最高價值<span class='trap'>⚠️ 老舊公寓飆漲 ≠ 均衡原則（均衡 = 要素配置，與單純漲價無關）</span>"},
{id:"V04", cat:"估價原則", front:"外部性原則是什麼？怎麼和貢獻原則區分？", back:"<b>周邊環境設施</b>（非標的本身）對價格之影響。例：鄰近公園/捷運（加值）、殯儀館/高壓電塔/垃圾掩埋場（減損）。<span class='trap'>⚠️ 貢獻 vs 外部性辨別口訣：<b>自己的改良→貢獻原則</b>（加裝電梯、取得綠建築標章）；<b>別人的設施→外部性原則</b>（附近有公園、圖書館、殯儀館）</span>"},
{id:"V05", cat:"估價原則", front:"變動原則對估價報告書有什麼影響？（和預期原則怎麼分？）", back:"不動產價格<b>隨時間變動</b>，故估價報告書須訂明<b>價格日期</b>及<b>有效期間</b>。<span class='trap'>⚠️ 變動 vs 預期辨別：<b>變動原則</b>=已發生的價格隨時間改變（如三年前35萬→現今50萬）；<b>預期原則</b>=現在反映對未來的預期（如航空城開發案帶動周邊漲價）</span>"},
{id:"V06", cat:"估價原則", front:"不動產市場的四大特性？", back:"產品<b>異質性</b>高　／　<b>人為干預多</b><br><b>交易成本高</b>　／　<b>資訊不完全</b><span class='trap'>⚠️ → 是<b>非完全競爭市場</b>（選「完全競爭市場」即錯）</span><span class='tip'>口訣：異質干預、成高資缺 → 異質性高、人為干預多、交易成本高、資訊不完全</span>"},
{id:"V07", cat:"價格種類", front:"正常、限定、特定、特殊四種價格，哪些具市場性？各是怎麼來的？", back:"<b>正常價格</b>：具市場性，正常交易<br><b>限定價格</b>：具市場性，因<b>合併/分割</b>形成<br><b>特定價格</b>：具市場性，因<b>特定條件</b>（如變更）形成<br><b>特殊價格</b>：<b>不具市場性</b>之不動產所估計之價值<span class='tip'>只有「特殊價格」不具市場性，其餘三種均具市場性</span>"},
{id:"V08", cat:"價格種類", front:"限定價格的三種形成條件？", back:"① 其他<b>權利與所有權合併</b>為目的<br><small style='color:#7A7165;'>（如地上權人購買設定地上權之土地）</small><br>② <b>不動產合併</b>為目的<br><small style='color:#7A7165;'>（相鄰土地合併開發）</small><br>③ 違反經濟合理性之不動產<b>分割</b>為前提<span class='tip'>「一合一合一分」→ 權利合併、地合、地分</span>"},
{id:"V09", cat:"價格種類", front:"哪一種價格估價時，須敘明估價條件並同時估計正常價格？", back:"<b>特定價格</b>（§6Ⅱ）<span class='trap'>⚠️ 只有特定價格才須；限定、特殊價格無此規定。（105年第7題官方答案為限定價格，與現行§6Ⅱ不符，考場遇到以該年答案為準、平時以§6Ⅱ為準）</span>"},
{id:"V10", cat:"價格種類", front:"特殊價格的常見例子？", back:"總統府、孔廟、媽祖廟<br>龜山島、太平島、東沙島、釣魚台<br>→ <b>不具市場性</b><span class='trap'>⚠️ 但估價時<b>仍須以貨幣金額表示</b>（並非無法表示）</span>"},
{id:"V11", cat:"價格種類", front:"特定價格的典型情境？", back:"具市場性，但基於<b>特定條件</b>（如預期容積變更、都市計畫變更）形成之價值。例：都市邊緣農地以未來變更為建地之前提估價。"},
{id:"V12", cat:"影響因素", front:"一般因素、區域因素、個別因素的判斷關鍵？", back:"判斷關鍵：<b>影響範圍</b><br><b>一般因素</b>＝全國性<br><small style='color:#7A7165;'>（利率、房地合一稅、國土計畫）</small><br><b>區域因素</b>＝影響近鄰地區<br><small style='color:#7A7165;'>（捷運站、道路寬度）</small><br><b>個別因素</b>＝影響標的本身<br><small style='color:#7A7165;'>（臨街寬度、路沖、坐向）</small>"},
{id:"V13", cat:"影響因素", front:"同一供需圈的正確定義？", back:"比較標的與勘估標的間能成立<b>替代關係</b>（非貢獻關係），且其價格<b>互為影響</b>之最適範圍＝近鄰地區＋類似地區。"},
{id:"V14", cat:"影響因素", front:"近鄰地區 vs 類似地區？", back:"<b>近鄰地區</b>：標的<b>周圍</b>，供相同或類似用途之不動產，形成<b>同質性較高</b>之地區。<b>類似地區</b>：同一供需圈內，<b>近鄰地區外</b>，與標的使用性質相近之地區。"},
{id:"V15", cat:"估價程序", front:"估價作業8步驟的正確順序？", back:"①確定估價基本事項 → ②擬定估價計畫<br>③<b>蒐集資料</b> → ④<b>確認勘估標的狀態</b><br>⑤整理比較分析資料 → ⑥運用估價方法推算價格<br>⑦決定勘估標的價格 → ⑧製作估價報告書<span class='trap'>⚠️ ③先蒐集資料、④再確認狀態——順序勿顛倒</span>"},
{id:"V16", cat:"估價程序", front:"確定估價基本事項應包含哪些？不含什麼？", back:"應含：委託人、估價目的、<b>價格日期</b>、價格種類及條件、勘估標的內容。<b>不含</b>估價方法、不含勘察日期。"},
{id:"V17", cat:"估價程序", front:"價格日期 vs 勘察日期？", back:"<b>價格日期</b>：勘估標的<b>價格之基準日期</b>。<b>勘察日期</b>：至勘估標的<b>現場調查</b>之日期。兩者先後關係<b>不一定</b>。"},
{id:"V18", cat:"估價程序", front:"獨立估價 vs 部分估價？", back:"<b>獨立估價</b>：土地上有建物，估價時將土地<b>視為素地</b>（不考慮建物影響）。<b>部分估價</b>：附有建物之宗地估價，<b>考慮</b>建物對宗地價格之影響。"},
{id:"V19", cat:"估價程序", front:"估價時，違章建築要如何處理？", back:"違建部分<b>不予評估</b>；委託人要求評估者，應就合法建物及違建部分<b>分別標示</b>價格（非合併計算）。"},
{id:"V20", cat:"比較法", front:"比較法調整流程的正確順序？", back:"<span class='formula'>情況調整 → 價格日期調整 → 區域因素調整 → 個別因素調整</span><span class='trap'>⚠️ 調整對象是<b>比較標的</b>價格（不是勘估標的）</span><span class='tip'>口訣：情日區個（情況→日期→區域→個別）</span>"},
{id:"V21", cat:"比較法", front:"比較法三道排除規則（單項調整率／總調整率／試算價格差距），數字各是多少？", back:"<span class='formula'>單項調整率 ≤ <b>15%</b><br>總調整率（四項合計）≤ <b>30%</b><br>試算價格差距率 ≤ <b>20%</b>（超過需排除）</span><span class='tip'>記法：1530二十 → 單項15%、合計30%、差距20%</span>"},
{id:"V22", cat:"比較法", front:"試算價格差距率怎麼算？", back:"差距率 ＝ (較高試算價格－較低試算價格) ÷ <b>試算價格平均值</b>。達20%以上者排除該試算價格。"},
{id:"V23", cat:"比較法", front:"比較標的原則上應採用幾件以上？", back:"<b>三件以上</b><span class='trap'>⚠️ 常考陷阱：誤植為「五件以上」</span>"},
{id:"V24", cat:"比較法", front:"比較標的、試算價格、比較價格的差異？", back:"<b>比較標的</b>：原始選定之交易實例。<b>試算價格</b>：比較標的價格經各項調整後初步得出之價格。<b>比較價格</b>：試算價格經重新檢討確認適當合理後的最終價格。"},
{id:"V25", cat:"比較法", front:"價格日期調整的計算公式？", back:"<span class='formula'>調整後價格 ＝ 比較標的成交價<br>× (<b>勘估標的</b>價格日期指數 ÷ <b>比較標的</b>交易日期指數)</span><small style='color:#7A7165;'>分子是勘估標的、分母是比較標的</small>"},
{id:"V26", cat:"比較法", front:"合併開發分配計算公式？", back:"某筆土地合併後分配價格 ＝ 合併後總價格 × (<b>該筆土地合併前價值</b> ÷ <b>各筆土地合併前價值總和</b>)。先求比例，再乘總價格。"},
{id:"V27", cat:"比較法", front:"畸零地合併使用之交易，屬於哪種調整？", back:"屬於<b>情況調整</b>範疇（非個別因素調整）。"},
{id:"V28", cat:"比較法", front:"蒐集比較實例應依循的4項原則？", back:"① 使用性質或管制相同或相近　② 同一供需圈之近鄰或類似地區　③ 價格形成日期與價格日期接近　④ 價格種類相同或可調整為相同。"},
{id:"V29", cat:"成本法", front:"重建成本 vs 重置成本？", back:"<b>重建成本</b>（原則）：相同或極類似建材標準重新複製之成本。<b>重置成本</b>（例外）：建材已無生產或施工方法改變時，以現代建材標準替代之成本。"},
{id:"V30", cat:"成本法", front:"營造施工費的直接法兩種？", back:"<b>淨計法</b>：逐一材料人工數量×單價及工資（最精細，較少用）。<b>單位工程法</b>：建築細部工程各項目單價×施工數量（實務上最常用）。"},
{id:"V31", cat:"成本法", front:"營造施工費的間接法兩種？", back:"<b>工程造價比較法</b>：按工程概算項目逐項比較調整。<b>單位面積（體積）比較法</b>：以比較標的單位面積營造費為基礎調整。"},
{id:"V32", cat:"成本法", front:"規劃設計費的計算基礎是什麼？", back:"按<b>營造施工費</b>之2%至3%推估（注意：不是按總成本，這與廣告費/管理費/稅捐不同）。"},
{id:"V33", cat:"成本法", front:"哪些項目由全聯會公告？哪些看起來像、但不是？", back:"<b>全聯會公告 7 項</b>：施工費標準表（§56）、廣銷管稅費率（§61，乘總成本）、利潤率（§60）、工程進度營造費用比例表（§63）、經濟耐用年數表（§66）、<b>殘餘價格率</b>（§67，≤10%）、樓層別效用比（§98）<br><b>不是</b>：建築改良物標準單價表、建造執照工程造價表（縣市政府）；規劃設計費不是公告費率（§57：施工費2～3%）<span class='tip'>施・費・利・進・耐・殘・樓</span>"},{id:"V34", cat:"成本法", front:"房地成本價格怎麼算？", back:"房地成本價格 ＝ 土地總成本 ＋ <b>建物成本價格</b>（已扣除折舊的建物現值）。不是土地+建物未扣折舊的總成本。"},
{id:"V35", cat:"成本法", front:"三種折舊路徑及對應方法？", back:"<b>等速折舊</b> → 定額法（直線）<br><b>初期加速折舊</b> → 定率法（直線下方）<br><b>初期減速折舊</b> → 償債基金法（直線上方）<span class='trap'>⚠️ 無「後期減速折舊」選項——此選項必錯</span><span class='tip'>直下上 → 定額直線、定率直線下方（先快後慢）、償債直線上方（先慢後快）</span>"},
{id:"V36", cat:"成本法", front:"定額法折舊計算公式？", back:"<span class='formula'>年折舊額 ＝ C × (1－s) ÷ N<br>累積折舊額Dn ＝ 年折舊額 × n<br>建物現值 ＝ C － Dn</span><small style='color:#7A7165;'>C＝重建成本　s＝殘餘價格率　N＝耐用年數　n＝經歷年數</small>"},
{id:"V37", cat:"成本法", front:"經濟耐用年數 vs 物理耐用年數？", back:"<b>經濟耐用年數</b>：因功能或效益衰退至不值得使用——<b>折舊計算以此為主</b>。<b>物理耐用年數</b>：因自然耗損或外力破壞至結構脆弱。<span class='tip'>物理看「結構壞掉」，經濟看「效益衰退」</span>"},
{id:"V38", cat:"成本法", front:"建物殘餘價格率上限是多少？", back:"<b>不超過10%</b>（原則），由全聯會公告。無殘餘價格者，計算折舊時<b>不予提列</b>（非以最低殘餘價格率提列）。"},
{id:"V39", cat:"成本法", front:"物理性折舊、功能性折舊、經濟性折舊的差異？", back:"<b>物理性</b>：自然耗損、外力破壞（牆壁龜裂）。<b>功能性</b>：技術革新、設計過時（建物落伍）。<b>經濟性</b>：外部環境變化（周邊嫌惡設施）。注意：隔壁施工造成龜裂＝物理性，非經濟性。"},
{id:"V40", cat:"收益法", front:"直接資本化法的公式？", back:"<span class='formula'>收益價格 ＝ <b>客觀淨收益</b> ÷ <b>收益資本化率</b></span><small style='color:#7A7165;'>三個關鍵字：<b>未來</b>（預期）、<b>客觀</b>淨收益、以<b>價格日期</b>為基準</small>"},
{id:"V41", cat:"收益法", front:"有效總收入怎麼算？", back:"總收入 ＝ 月租金×12；押金運用收益 ＝ 押金×利率；<b>有效總收入</b> ＝ 總收入×(1－空置率)。"},
{id:"V42", cat:"收益法", front:"總費用不應計入的四大陷阱項目？", back:"<span class='trap'>⚠️ 以下四項絕對不可計入總費用：<br><b>所得稅</b>／<b>貸款利息（債務利息）</b><br><b>土地增值稅</b>／<b>改良性資本支出</b></span><span class='tip'>口訣：所貸增改 → 所得稅、貸款利息、土地增值稅、改良性資本支出，四者不納入費用</span>"},
{id:"V43", cat:"收益法", front:"收益法估價程序的順序？", back:"①蒐集總收入總費用資本化率等資料 → ②推算有效總收入 → ③推算總費用 → ④計算淨收益 → ⑤決定收益資本化率 → ⑥計算收益價格。應蒐集最近<b>3年</b>資料。<span class='tip'>步驟口訣：蒐→有→費→淨→率→算（蒐資料→有效總收入→費用→淨收益→資本化率→算價格）</span>"},
{id:"V44", cat:"收益法", front:"折舊前 vs 折舊後淨收益，如何還原價格？", back:"折舊<b>前</b>淨收益：以「資本化率＋<b>折舊提存率</b>」（房地綜合收益資本化率）還原。折舊<b>後</b>淨收益：僅以資本化率還原即可。"},
{id:"V45", cat:"收益法", front:"五種收益資本化率決定方法？", back:"① <b>風險溢酬法</b>（一般性財貨基準＋風險加計）② <b>市場萃取法</b>（淨收益÷價格）③ <b>WACC加權平均資金成本法</b> ④ <b>有效總收入乘數法</b> ⑤ <b>債務保障比率法</b>。<span class='tip'>口訣：風市加有債 → 風險溢酬、市場萃取、加權平均WACC、有效總收入乘數、債務保障比率</span>"},
{id:"V46", cat:"收益法", front:"不動產的流通性、增值性、風險性、管理難度，各讓資本化率偏高還是偏低？", back:"流通性高 → 較<b>低</b><br>風險性高 → 較<b>高</b><br>增值性高 → 較<b>低</b><br>管理難度高 → 較<b>高</b><span class='trap'>⚠️ 增值性高→較低（方向與風險性相反，常考陷阱）</span><span class='tip'>流增→低（流通好/增值高，投資人願接受低回報）；風管→高（風險/管理難，需高回報補償）</span>"},
{id:"V47", cat:"收益法", front:"綜合資本化率怎麼算？", back:"綜合資本化率 ＝ 土地資本化率×(土地價值÷總價值) ＋ 建物資本化率×(建物價值÷總價值)。一般而言<b>建物資本化率高於土地</b>（建物有折舊耗損風險）。"},
{id:"V48", cat:"收益法", front:"DCF折現現金流量分析法 vs 直接資本化法？", back:"DCF：<b>多期</b>現金流量、<b>須加計期末處分價值</b>並折現、適用<b>以投資為目的</b>之評估。直接資本化法：未來平均<b>1年</b>淨收益、不考慮期末處分價值。"},
{id:"V49", cat:"收益法", front:"不動產證券化DCF評估的特殊規則？", back:"各期淨收益以<b>契約租金</b>計算為原則（契約租金未知者以<b>經濟租金</b>推估）；以契約約定租金作信託利益分配基礎者，DCF收益價格應賦予<b>較大權重</b>。"},
{id:"V50", cat:"土地開發分析法", front:"土地開發分析法核心公式？", back:"<span class='formula'>V ＝ [S ÷ (1+r) ÷ (1+i)] － (C+M)</span><small style='color:#7A7165;'>V：開發分析價格　S：總銷售金額<br>r：利潤率　i：資本利息綜合利率<br>C：直接成本　M：間接成本</small>"},
{id:"V51", cat:"土地開發分析法", front:"資本利息綜合利率公式？建物比率為何要×1/2？", back:"資本利息綜合利率 ＝ 資本利息年利率×(土地價值比率＋建物價值比率×<b>1/2</b>)×開發年數。建物資金通常於開發中後段才投入，平均占用時間僅半期；土地資金自始即占用全期，不打折。"},
{id:"V52", cat:"土地開發分析法", front:"土地開發分析法應蒐集的資料？不含什麼？", back:"含：開發計畫內容、可銷售面積、總銷售金額市場行情、直接成本、間接成本、利潤率、資本利息綜合利率。<b>不含「資本化率」</b>（這是收益法概念）。"},
{id:"V53", cat:"土地開發分析法", front:"土地開發分析法本質上屬於哪種方法的延伸？", back:"屬於<b>成本法</b>之延伸應用（非比較法、非收益法），（官方答案 99-33）；適用時依 §87 參酌<b>比較法</b>或<b>收益法</b>之評估結果決定估價額（成本法不在條文中）。"},
{id:"V54", cat:"租金估計", front:"租金估計以何種租金為原則？", back:"以估計勘估標的之「<b>實質租金</b>」為原則。"},
{id:"V55", cat:"租金估計", front:"實質租金 vs 經濟租金的差異？", back:"<b>實質租金</b>：支付租金<b>加計</b>押金、權利金等運用收益之總數<br><b>經濟租金</b>：不動產以<b>最有效利用</b>方式所能產生的市場收益<span class='trap'>⚠️ 兩者性質不同，大小關係<b>不一定</b>（無法說誰必定較高）</span>"},
{id:"V56", cat:"租金估計", front:"實質租金計算公式？", back:"實質租金 ＝ 支付租金（月租×12）＋ 押金運用收益 ＋ 權利金運用收益 ＋ 其他相關運用收益。押金運用收益＝押金×利率。"},
{id:"V57", cat:"租金估計", front:"續訂租約差額分配法公式？", back:"差額 ＝ <b>市場經濟租金</b> － <b>原契約租金</b>；出租人應分得差額 ＝ 差額×(1－承租人應有貢獻比例)；續租合理租金 ＝ 原契約租金＋出租人應分得之差額。"},
{id:"V58", cat:"租金估計", front:"新訂租約 vs 續訂租約的估計方式差異？", back:"<b>新訂租約</b>：可分析企業經營總收入、或價格×租金收益率。<b>續訂租約</b>：以原契約租金之淨收益依變動趨勢調整（差額分配法），不適用前述新訂租約方式。"},
{id:"V59", cat:"特殊估價綜合", front:"樓層別效用比的理論基礎與基準樓層？", back:"理論基礎：<b>建物貢獻原則</b>（非土地貢獻原則）。基準樓層：通常以各層中<b>價格或租金最低之樓層</b>為基準（非地面層恆定，也非樓層愈高效用比愈高）。"},
{id:"V60", cat:"特殊估價綜合", front:"樓層別效用比計算公式？", back:"某樓層之土地分配價格 ＝ 土地總價 × (該樓層效用比 ÷ 各樓層效用比總和)。"},
{id:"V61", cat:"特殊估價綜合", front:"權利估價範圍包含哪些？不包含什麼？", back:"✅ §114 包含：<b>地上權、典權、永佃權、農育權、不動產役權、耕作權、抵押權、租賃權、市地重劃、容積移轉、都市更新權利變換</b><span class='trap'>⚠️ 不包含<b>質權</b>（高頻陷阱）<br>市地重劃現行§114 已列入；舊官方答案對是否含市地重劃說法不一，依題目選項判斷</span><span class='tip'>質權✗ → 地上權、典權、永佃權、農育權、不動產役權、耕作權、抵押權、租賃權可估</span>"},
{id:"V62", cat:"特殊估價綜合", front:"特殊宗地估價：哪些用比較法？哪些用成本法？", back:"<b>比較法</b>為原則：公共設施保留地、林地、農場牧場、鹽田、高爾夫球場。<b>成本法</b>：受污染土地、受地層下陷/土壤液化影響土地（因不具市場性或需估算特殊成本）。<span class='tip'>一般特殊宗地「比較法先」；污染/地陷/液化才改用「成本法」（因市場無可比較案例）</span>"},
{id:"V63", cat:"特殊估價綜合", front:"都市更新基地價值比率計算公式？", back:"基地價值比率 ＝ 該所有權人<b>更新前</b>權利價值 ÷ <b>權利變換前</b>各所有權人權利價值之總和。應分配權利價值 ＝ 基地價值比率 × <b>更新後實施者實際分配</b>之權利價值總和。"},
{id:"V64", cat:"特殊估價綜合", front:"計量模型分析法（CAMA）的三大適用門檻？", back:"<span class='formula'>樣本數 ≥ 自變數個數 × <b>5倍</b><br>判定係數 ≥ <b>0.7</b><br>顯著機率 ≤ <b>5%</b>（不得大於）</span>屬於<b>比較法</b>之延伸應用"},
{id:"V65", cat:"特殊估價綜合", front:"CAMA常見的兩個錯誤敘述陷阱？", back:"<span class='trap'>⚠️ ①「判定係數越低代表解釋能力越好」→ <b>錯</b>，應越高越好<br>②「自變數間應具高度共線性」→ <b>錯</b>，應<b>避免</b>高度共線性</span>"},
// === 宗地通則 §83-89 ===
{id:"VG01", cat:"宗地通則", front:"宗地合併後，原先各宗地如何計算分配價格？", back:"§84Ⅰ：以<b>合併後土地估價</b>，再按<b>合併前各筆土地價值比例</b>分算各筆土地價格。<span class='trap'>⚠️ 比例依合併前價值，不是面積平均；同一所有人相連土地、非以合併利用為目的者比照辦理（§84Ⅱ）</span>"},
{id:"VG02", cat:"宗地通則", front:"以合併或分割為前提之宗地估價，應如何處理？", back:"依§83，應考慮合併或分割前後之價格變動情形，而予<b>酌量增減</b>。<b>分割通常造成損失</b>（違反最有效使用）。<span class='tip'>合併估價§84：合併後估價，按合併前各筆價值比例分算</span>"},
{id:"VG03", cat:"宗地通則", front:"多用途宗地的估價方式？", back:"§85：先考量各用途之<b>相關性</b>及<b>分割難易度</b>，決定<b>分別估價</b>或<b>依主要用途</b>（整體）估價。<span class='trap'>⚠️ 不是一律只看主要用途，也不是一律分別估價；分別估價時各部分價格合計，非取平均</span>"},
{id:"VG04", cat:"宗地通則", front:"宗地上有建物時，估價方式為？", back:"<b>獨立估價</b>（視為素地）或<b>部分估價</b>（考量建物影響）。違章建築不予評估；委託人要求時分別標示。<span class='tip'>獨立=視素地；部分=考慮建物影響</span>"},
{id:"VG05", cat:"宗地通則", front:"§88 設施限制宗地（架空線路/地下管線）估價程序？", back:"①先估計無設施限制之正常價格；②估計設施限制造成之<b>減損金額</b>；③正常價格－減損金額。<span class='trap'>⚠️ 設施限制屬個別因素負向調整，非成本法</span>"},
{id:"VG06", cat:"宗地通則", front:"§89 受污染土地的估價方式？", back:"先估計<b>未受污染</b>之正常價格，再依委託人提供之土壤、地下水污染檢測資料，考量污染影響計算<b>減損額</b>，由正常價格扣除（建物污染見§113，處理相同）。<span class='trap'>⚠️ 與§88 同一邏輯：先估正常價格→再扣減損</span>"},
// === 土地改良物 §107-113 ===
{id:"VI201", cat:"土地改良物", front:"土地改良物的五大類型？", back:"① <b>建物</b>（房屋及其他建築）<br>② <b>農作改良物</b>（農作物、農作物設施）<br>③ <b>林木竹木</b>（經濟性林木、竹木）<br>④ <b>水產養殖物</b><br>⑤ <b>土壤改良物</b><span class='tip'>口訣：建農林水土</span>"},
{id:"VI202", cat:"土地改良物", front:"建物的基本估價方法及原則？", back:"以<b>成本法</b>為原則：重建成本（或重置成本）減去折舊。建物無法獨立存在，需附屬於土地；估價時通常採<b>房地一體</b>，再以收益分析分離地價或建物價格。"},
{id:"VI203", cat:"土地改良物", front:"農作改良物單獨估算的兩種情形？", back:"①土地及農作改良物所有人<b>不同</b>；②農作改良物因<b>徵收</b>等需單獨評估損失。估算時以<b>成本法</b>或<b>市場法</b>為主。<span class='trap'>⚠️ 同一人所有者通常不單獨估算</span>"},
{id:"VI204", cat:"土地改良物", front:"林木竹木的估價方式？", back:"成熟林以<b>市場販售價值</b>減除採伐運送費用；未成熟林以<b>成本法</b>（投入費用+生長年數折算）。依樹齡、樹種、立地條件差異估算。"},
{id:"VI205", cat:"土地改良物", front:"土壤改良物的估價重點？", back:"以<b>成本法</b>為主，估計已投入之改良費用現值（含施肥、改良材料、人工）。需考量改良效益是否仍存在（效益殘存年限）及投資報酬率合理性。"},
// === 權利估價各論 §116-125 ===
{id:"VJ101", cat:"權利估價各論", front:"地上權的估價（§116）？", back:"應考慮<b>用途、權利存續期間、支付地租之有無及高低、權利讓與之限制、設定之空間位置</b>等因素。<span class='trap'>⚠️ 條文只列考慮因素，沒有固定公式</span>"},
{id:"VJ102", cat:"權利估價各論", front:"典權的估價（§117）？", back:"以<b>典價</b>為基礎估計，並考慮<b>權利存續期間、權利讓與之限制</b>等因素。<span class='trap'>⚠️ 基礎是典價</span>"},
{id:"VJ103", cat:"權利估價各論", front:"農育權的六種目的（民法§850-1）？", back:"① 農作 ② 森林 ③ 養殖 ④ 畜牧 ⑤ 種植竹木 ⑥ <b>保育</b><span class='trap'>⚠️ 共6種，保育是高頻陷阱，比典權/地上權更廣</span><span class='tip'>口訣：農森養畜竹保</span>"},
{id:"VJ104", cat:"權利估價各論", front:"不動產役權估價（技術規則§119）？", back:"<b>供役不動產</b>：役權限制使用 → <b>減損</b>（正常價格 ─ 役權損害額）<br><b>需役不動產</b>：役權帶來利益 → <b>增加</b>（正常價格 ＋ 役權利益額）<span class='trap'>⚠️ 供役→減損，需役→增加，方向相反！（§119 條文只列應考慮：需役與供役不動產之使用情況、權利存續期間、不動產役權使用性質、民間習俗）</span>"},
{id:"VJ105", cat:"權利估價各論", front:"抵押權估價的特殊規定（§121）？", back:"以<b>實際債權額</b>為基礎（非抵押設定額）：先估價格日期當時之正常價格，再考慮其他順位抵押權設定狀況，並就流通性、風險性、增值性及執行難易度調整。<span class='trap'>⚠️ 設定額≠實際債權額</span>"},
{id:"VJ106", cat:"權利估價各論", front:"租賃權的估價（§122）？", back:"應考慮<b>契約內容、用途、租期、租金支付方式、使用目的及使用情形</b>等因素。<span class='tip'>學理：契約租金低於市場租金之差額折現＝租賃權利益</span>"},
{id:"VJ107", cat:"權利估價各論", front:"容積移轉的估價（§123）？", back:"應考慮容積<b>送出基地</b>、<b>接受基地</b>，以及其他影響不動產價格之因素和相關法令。<span class='trap'>⚠️ 條文沒有固定公式，兩端基地都要考慮</span>"},
{id:"VJ108", cat:"權利估價各論", front:"區分所有建物權利變換前之基地權利價值（§125）？", back:"以全棟建物之<b>基地價值比率</b>，分算各戶房地總價中之基地權利價值：各戶基地權利價值＝房地總價×基地價值比率；基地價值比率＝素地總價值÷（素地總價值＋建物成本價格〔營造施工費單價×(1－累積折舊率)×全棟面積〕）。"},
{id:"VC01", cat:"成本法精要", front:"重建成本 vs 重置成本的差異？何時用哪個？", back:"<b>重建成本</b>（原則）：以<b>相同或極類似</b>建材標準重新複製之成本，適用建材仍存在之情形。<b>重置成本</b>（例外）：建材已無生產或施工方法改變，改以<b>現代同功能</b>建材替代之成本。<span class='trap'>⚠️ 原則用重建，例外才用重置。考題若無說明，預設用重建成本</span><span class='tip'>重建＝複製原來的；重置＝替換成現代的</span>"},
{id:"VC02", cat:"成本法精要", front:"四種施工費（單位成本）求法？", back:"① <b>淨計法</b>：用建物<b>不含停車位</b>之單位面積成本直接算（最常用）<br>② <b>單位工程費法</b>：依各工程分項計算（結構/機電/裝修分別計費）<br>③ <b>工程造價法</b>：以建造執照核准之工程造價為基礎<br>④ <b>單位面積法</b>：按全棟含停車位之總面積計算<span class='trap'>⚠️ 最容易混淆：①淨計法「不含」停車位；④單位面積法「含」停車位</span><span class='tip'>口訣：淨不含、單面積含</span>"},
{id:"VC03", cat:"成本法精要", front:"定額法、定率法、償債基金法的折舊曲線，各是什麼形狀？", back:"<b>定額法</b>（等速）→ <b>直線</b>下降，每年折舊相同<br><b>定率法</b>（加速）→ <b>曲線在直線下方，初期折舊大<br><b>償債基金法</b>（減速）→ <b>曲線在直線上方，初期折舊小<span class='trap'>⚠️ 陷阱選項「後期減速折舊」→ 不存在！考題常用來混淆</span><span class='tip'>等速＝直線、加速＝直線下方、減速＝直線上方</span>"},
{id:"VC04", cat:"成本法精要", front:"題目寫「每年減價額劃一、逐年累計」「每年乘以一定比率」「每年提存一定金額、以複利計算」——各是哪一種折舊法？", back:"<b>劃一固定、逐年累計</b> → <b>定額法</b>（等速折舊）<br><b>乘以一定比率</b>（對前一年餘值）→ <b>定率法</b>（初期加速）<br><b>提存一定金額、複利</b> → <b>償債基金法</b>（初期減速）<span class='trap'>⚠️ 101-27 還有一個干擾句「期初先確定減價額，累計時呈現減價額遞減」——不屬於三法任何一種</span><span class='tip'>劃一＝定額，比率＝定率，複利＝償債</span>"},
{id:"VC05", cat:"收益法精要", front:"「從已知投資成分價值乘以資本化率求其收益，再由總收益扣除，求未知成分價格」——這個方法叫什麼？怎麼算？", back:"<b>殘餘法</b>（土地殘餘／建物殘餘）<br>①已知成分收益＝其價值×資本化率<br>②未知成分收益＝總收益－已知成分收益<br>③未知成分價格＝其收益÷資本化率<br>例：房地淨收益100萬、建物600萬×6%＝36萬 → 土地收益64萬 ÷4%＝<b>1,600萬</b><span class='trap'>⚠️ 101-33 干擾項：分配法、積算法、收益倍數法；「殘餘法」是教材用語，技術規則無此名稱</span><span class='tip'>已知先拿，剩的給未知</span>"},
{id:"VC06", cat:"成本法精要", front:"全聯會公報：一般房屋（辦公、商店、住宅）各構造的經濟耐用年數？", back:"<b>鋼骨／SRC／RC／預鑄混凝土造 50年</b><br>加強磚造 35 ／ 磚造 25<br>鋼架造有披覆 20 ／ 無披覆 15 ／ 木造 10<br>工廠、車庫、停車場類各降一級：35・30・20・15・10・8<span class='trap'>⚠️ 102-40：住宅RC＝50年（35、40、60 皆為干擾）；§65 折舊以經濟耐用年數為主，估價師得視實際狀況推估而異於公報，須於報告書敘明</span><span class='tip'>一般房屋 50・35・25・20・15・10</span>"},

Object.keys(CAT_COLORS).forEach(cat=>{
  const count = CARDS.filter(c=>c.cat===cat).length;
  const chip = document.createElement('div');
  chip.className='chip active';
  chip.style.background=getCatColor(cat);
  chip.style.borderColor=getCatColor(cat);
  chip.style.color='#fff';
  const f = CAT_FREQ[cat];
  chip.textContent=`${cat} ${f?f.stars:''} (${count})`;
  chip.dataset.cat=cat;
  chip.addEventListener('click',()=>{
    const isSolo = activeCats.size===1 && activeCats.has(cat);
    if(isSolo){
      // 已是solo狀態再點 → 恢復全選
      activeCats = new Set(Object.keys(CAT_COLORS));
      document.querySelectorAll('.chip[data-cat]').forEach(c=>{
        const cc=c.dataset.cat;
        c.classList.add('active');
        c.style.background=getCatColor(cc);
        c.style.color='#fff';
      });
    } else {
      // 單擊 = 只看這科
      activeCats = new Set([cat]);
      document.querySelectorAll('.chip[data-cat]').forEach(c=>{
        if(c.dataset.cat===cat){
          c.classList.add('active');
          c.style.background=getCatColor(cat);
          c.style.color='#fff';
        } else {
          c.classList.remove('active');
          c.style.background='transparent';
          c.style.color=getCatColor(c.dataset.cat);
          c.style.border=`1.5px solid ${getCatColor(c.dataset.cat)}`;
        }
      });
    }
    rebuildDeck();
  });
  chipsEl.appendChild(chip);
});

function renderStatusRow(){
  const inCat = CARDS.filter(c=>activeCats.has(c.cat));
  const masteredCount = inCat.filter(c=>mastery[c.id]==='mastered').length;
  const reviewCount = inCat.length - masteredCount;
  statusRow.innerHTML = '';
  const defs = [
    {key:'all', label:`全部 (${inCat.length})`, cls:''},
    {key:'review', label:`🔄 待複習 (${reviewCount})`, cls:'review'},
    {key:'mastered', label:`✅ 已掌握 (${masteredCount})`, cls:'mastered'}
  ];
  defs.forEach(d=>{
    const chip=document.createElement('div');
    chip.className='chip '+d.cls+(statusFilter===d.key?' active':'');
    chip.textContent=d.label;
    chip.addEventListener('click',()=>{
      statusFilter = d.key;
      rebuildDeck();
    });
    statusRow.appendChild(chip);
  });
}

function rebuildDeck(){
  renderStatusRow();
  let pool = CARDS.filter(c=>activeCats.has(c.cat));
  if(statusFilter==='review') pool = pool.filter(c=>mastery[c.id]!=='mastered');
  if(statusFilter==='mastered') pool = pool.filter(c=>mastery[c.id]==='mastered');
  deck = pool.length ? pool : CARDS.filter(c=>activeCats.has(c.cat));
  idx = 0;
  render();
}

// 題型提示：依題目面的問法，告訴自己「這題要答什麼形式」
function askType(f){
  if(/vs|差異|區分|差別|分別/.test(f)) return '⚖️ 比較：說出兩者差在哪';
  if(/公式|怎麼算|計算/.test(f))       return '🧮 寫出公式或算法';
  if(/順序|步驟/.test(f))              return '🔀 依序說出步驟';
  if(/幾件|多少|上限|數字|各是多少/.test(f)) return '🔢 答出數字';
  if(/哪些|幾種|兩種|三種|四種|五種|六種|四大|五大|三大|例子|情境|包含|不含|類型|各是/.test(f)) return '📋 列舉項目';
  if(/判斷|關鍵/.test(f))              return '🔍 說出判斷關鍵';
  if(/為何|為什麼|何時|意義|定義|是什麼|什麼|關係|影響/.test(f)) return '📖 說明意思';
  if(/如何|方式|原則|程序/.test(f))    return '🛠 說明做法';
  return '💬 簡答';
}
function examBadgeText(id){
  const x = EXAM[id]; if(!x) return '';
  return (x.m||x.e) ? `選${x.m}・申${x.e}` : '歷屆未考';
}
function examLineHTML(id){
  const x = EXAM[id]; if(!x) return '';
  if(!x.m && !x.e) return '📊 歷屆：<span class="zero">選擇、申論都<b>未考過</b>（99–114年）</span>';
  const ys = x.y.length>8 ? x.y.slice(0,8).join('、')+'…' : x.y.join('、');
  const mc = x.m ? `選擇 <b>${x.m}</b> 題（${ys}年）` : '選擇 <span class="zero">0 題</span>';
  const es = x.e ? `申論 <b>${x.e}</b> 題（${x.l.join('、')}）` : '申論 <span class="zero">0 題</span>';
  return `📊 歷屆：${mc}　${es}`;
}

  freqBadgeFront.textContent = freqLabel;
  freqBadgeBack.textContent = freqLabel;
  freqBadgeFront.title = freqBadgeBack.title = '99–114年官方題中，題幹或正解涉及此概念的題數（選擇／申論），約略值';
  document.querySelector('.face.back').style.borderLeftColor = color;
  const m = mastery[c.id];
  const icon = m==='mastered' ? '✅' : '';
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
  curNum.textContent = idx+1;
  totalNum.textContent = deck.length;
  catName.textContent = '・' + c.cat;
  progFill.style.width = ((idx+1)/deck.length*100)+'%';

  if(mode==='study'){
    footFront.textContent = '點擊卡片　看解析 ▸';
    footBack.textContent = '◂ 點擊卡片　回題目';
  } else {
    footFront.textContent = '點擊卡片 或「顯示答案」▸';
    footBack.textContent = '◂ 可再點卡片回題目　／　看完請按 答對・答錯';
    revealBtn.style.display = '';
    revealBtn.textContent = flipped ? '↩ 回題目' : (revealed ? '👀 再看答案' : '👀 顯示答案');
    quizRight.style.display = revealed ? '' : 'none';
    quizWrong.style.display = revealed ? '' : 'none';
  }
  fitCard();
}

cardEl.addEventListener('click',()=>{
  if(mode==='study'){
    flipped=!flipped;
    cardEl.classList.toggle('flipped',flipped);
  } else {
    flipped = !flipped;
    if(flipped) revealed = true;
    render();
  }
});

function goNext(){
  idx=(idx+1)%deck.length;
  revealed=false; flipped=false;
  render();
}
function goPrev(){
  idx=(idx-1+deck.length)%deck.length;
  revealed=false; flipped=false;
  render();
}
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0; revealed=false; flipped=false; render();
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
  if(e.key===' '){ e.preventDefault(); cardEl.click(); }
});

document.getElementById('markMastered').addEventListener('click',()=>{
  setMastery('mastered');
});
document.getElementById('markReview').addEventListener('click',()=>{
  setMastery('review');
});
function setMastery(status){
  const c = deck[idx];
  mastery[c.id] = status;
  saveMastery();
  renderStatusRow();
  if(statusFilter!=='all'){
    const stillMatches = (statusFilter==='mastered' && status==='mastered') ||
                          (statusFilter==='review' && status!=='mastered');
    if(!stillMatches){
      let pool = CARDS.filter(cc=>activeCats.has(cc.cat));
      if(statusFilter==='review') pool = pool.filter(cc=>mastery[cc.id]!=='mastered');
      if(statusFilter==='mastered') pool = pool.filter(cc=>mastery[cc.id]==='mastered');
      deck = pool.length ? pool : CARDS.filter(cc=>activeCats.has(cc.cat));
      if(idx>=deck.length) idx=0;
      render();
      return;
    }
  }
  render();
}

quizRight.addEventListener('click',()=>recordAnswer(true));
quizWrong.addEventListener('click',()=>recordAnswer(false));
revealBtn.addEventListener('click',()=>{ flipped = !flipped; if(flipped) revealed = true; render(); });

function recordAnswer(correct){
  const c = deck[idx];
  if(correct){ quizStats.ok++; mastery[c.id]='mastered'; }
  else { quizStats.ng++; mastery[c.id]='review'; }
  if(!quizStats.perCat[c.cat]) quizStats.perCat[c.cat]={ok:0, total:0};
  quizStats.perCat[c.cat].total++;
  if(correct) quizStats.perCat[c.cat].ok++;
  saveMastery();
  renderStatusRow();
  updateQuizStatsBar();
  if(breakdownPanel.style.display!=='none') renderBreakdown();
  goNext();
}

function updateQuizStatsBar(){
  quizOk.textContent = quizStats.ok;
  quizNg.textContent = quizStats.ng;
}

document.getElementById('toggleBreakdown').addEventListener('click',()=>{
  if(breakdownPanel.style.display==='none'){
    renderBreakdown();
    breakdownPanel.style.display='block';
  } else {
    breakdownPanel.style.display='none';
  }
});
function renderBreakdown(){
  const cats = Object.keys(quizStats.perCat);
  if(!cats.length){
    breakdownPanel.innerHTML = '<p style="text-align:center;color:var(--ink-soft);">尚無作答紀錄</p>';
    return;
  }
  let html = '<table>';
  cats.forEach(cat=>{
    const s = quizStats.perCat[cat];
    const pct = Math.round(s.ok/s.total*100);
    html += `<tr><td style="white-space:nowrap;font-weight:700;">${cat}</td>
      <td style="width:100%;"><span class="bar"><span class="bar-fill" style="width:${pct}%;background:${getCatColor(cat)||'var(--green)'}"></span></span></td>
      <td style="white-space:nowrap;text-align:right;">${s.ok}/${s.total}（${pct}%）</td></tr>`;
  });
  html += '</table>';
  breakdownPanel.innerHTML = html;
}

document.getElementById('resetQuiz').addEventListener('click',()=>{
  quizStats = {ok:0, ng:0, perCat:{}};
  updateQuizStatsBar();
  breakdownPanel.style.display='none';
  idx=0; revealed=false; flipped=false; render();
});

document.getElementById('resetMastery').addEventListener('click',async ()=>{
  if(!confirm('確定要清除所有「已掌握」標記嗎？此動作無法復原。')) return;
  mastery = {};
  await saveMastery();
  rebuildDeck();
});

(async function init(){
  await loadMastery();
  renderStatusRow();
  rebuildDeck();
})();
</script>
