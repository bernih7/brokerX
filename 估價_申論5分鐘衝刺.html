<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>/*bxdef*/(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>估價｜申論 5 分鐘衝刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;
--b1:#2F6B8C;--b1s:#E3EFF6;--b2:#7A5BA6;--b2s:#EEE8F6;--b3:#2F7A55;--b3s:#E1F1E8;--b4:#B8782E;--b4s:#F8EBD3;--hl:#FFE9A8}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 1.45rem/1.3 "Noto Serif TC",serif;margin:6px 0 2px;text-wrap:balance}
.lead{color:var(--sub);font-size:.92rem;margin:0 0 14px}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:.88rem}.top a{white-space:nowrap}.top>span{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}
/* 模式選擇 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:1.02rem}
.mode small{display:block;color:var(--sub);line-height:1.55;margin-top:2px}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;padding:0;list-style:none;font-size:.82rem;color:var(--sub)}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow li b{color:var(--ink);font-weight:700;margin-right:4px}
/* 佇列 */
.sec-h{font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--sub);font-weight:400}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;color:var(--ink)}
.qi .n{font-size:.78rem;color:var(--sub);min-width:4.2em}
.qi .t{min-width:0;font-size:.93rem;line-height:1.5}
.qi .r{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.chip.new{background:var(--acc-soft);color:var(--acc);font-weight:700}
.chip.hard{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.mid{background:var(--b1s);color:var(--b1);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qi .go{font-size:.8rem;color:var(--pri);font-weight:700}
.more{margin-top:8px}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar .row{display:flex;align-items:center;gap:10px}
.stg{font-weight:700;font-size:.98rem;flex:1;min-width:0}
.stg small{display:block;font-weight:400;color:var(--sub);font-size:.8rem;line-height:1.4}
.clk{font:700 1.6rem/1 "Noto Sans TC",monospace;font-variant-numeric:tabular-nums;color:var(--pri)}
.clk.red{color:var(--bad)}
.tot{font-size:.78rem;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.tot.red{color:var(--bad);font-weight:700}
.segs{display:grid;grid-template-columns:30fr 30fr 150fr 60fr 30fr;gap:3px;margin-top:8px}
.segs i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--pri)}
.segs i.over b{background:var(--bad)}
.segs i.done b{width:100%!important}
.modechip{font-size:.74rem;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.modechip.h{background:var(--bad-soft);color:var(--bad)}
.modechip.s{background:var(--pri-soft);color:var(--pri)}
/* 題卡 */
.card{margin-top:14px}
.meta{font-size:.8rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ttl{font-weight:700;font-size:1.05rem;line-height:1.5;margin:4px 0 8px;text-wrap:balance}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}
.qbox.clamp .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qbox .qx{display:none;margin-left:8px;font-size:.8rem;color:var(--pri);background:none;border:0;padding:0;font-weight:700}.qbox.clamp .qx,.qbox.open .qx{display:inline}
.qbox .qt{white-space:pre-line}
.qbox .nq{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:0 10px}
.recall{margin-top:12px;background:var(--acc-soft);border-radius:12px;padding:12px 14px}
.recall b{display:block;margin-bottom:2px}
.recall ol{margin:4px 0 0;padding-left:1.4em}
.mn{margin-top:10px;font-size:.88rem;color:var(--sub)}
.mn b{color:var(--ink)}
.ev{margin-top:12px}
.blk{border-radius:10px;padding:12px 15px;margin:8px 0;background:var(--cs);transition:opacity .25s}
.blk.b1{--c:var(--b1);--cs:var(--b1s)}.blk.b2{--c:var(--b2);--cs:var(--b2s)}.blk.b3{--c:var(--b3);--cs:var(--b3s)}.blk.b4{--c:var(--b4);--cs:var(--b4s)}
.blk-l{display:inline-block;font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}
.blk p{margin:4px 0 0;line-height:1.85}
.blk .art{color:var(--sub);font-weight:400}
.blk .evp{margin-top:12px}.blk .evh{font-weight:700;margin-top:0}
.blk .evx{display:flex;gap:8px;align-items:baseline}
.blk .lawn{color:var(--ink);font-weight:500;margin-left:2px}
.blk .evli{display:block;padding-left:1.15em;text-indent:-1.15em;margin-top:3px}
.blk .evt{flex:none;font-size:.74em;line-height:1.6;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--sub);font-weight:600}
.blk.dim{opacity:.38}
.blk.focus{outline:2px solid var(--c);outline-offset:-2px}
.cover{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:.92rem}
/* 檢核 */
.ck{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6;cursor:pointer}
.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pri)}
.ck label.on{border-color:var(--ok);background:var(--ok-soft)}
.must{flex:none;font-size:.72rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 7px;margin-top:3px}
.score{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:900 1.8rem/1 "Noto Serif TC",serif;color:var(--pri)}
.score small{color:var(--sub)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:700}
.rate button.on[data-v="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rate button.on[data-v="2"]{border-color:var(--b1);background:var(--b1s);color:var(--b1)}
.rate button.on[data-v="3"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hist{margin-top:10px;font-size:.84rem;color:var(--sub)}
/* 底部操作列 */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.act .hint{font-size:.78rem;color:var(--sub);opacity:.6;flex:1;min-width:0;transition:opacity .8s}
.done-box{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:480px){.modes{grid-template-columns:1fr}.clk{font-size:1.4rem}}
.pz{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;line-height:1;padding:0}
body.paused .pz{background:var(--pri);border-color:var(--pri);color:var(--on)}
.pzbox{display:none;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub)}
.pzbox b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:4px}
body.paused .pzbox{display:block}
body.paused #body,body.paused .qbox,body.paused .ttl,body.paused .meta{display:none}
body.paused .clk{opacity:.5}
body.paused #nextBtn{opacity:.45;pointer-events:none}
.thb{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.howto{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.howto>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:.9rem;color:var(--sub);display:flex;justify-content:space-between;gap:8px}.howto>summary::-webkit-details-marker{display:none}.howto>summary::after{content:"點開 ▾";font-size:.8rem}.howto[open]>summary::after{content:"收起 ▴"}.howto>summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}.howto .hb{padding:0 14px 12px}.howto .hb>*:first-child{margin-top:0}.modes .mode small{display:none}.howto[open]~.modes .mode small{display:block}
.swq{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 2px 0;font-size:.86rem;color:var(--sub)}.swq a{font-weight:600;white-space:nowrap}
.dnb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dnb .btn{text-decoration:none;display:inline-flex;align-items:center}.rv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.rvh{font-weight:700;margin-bottom:8px}.rvnav{display:flex;gap:8px;align-items:center}.rvnav select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 8px;font:inherit;font-size:.88rem}.rvnav .btn{white-space:nowrap;padding:7px 12px}.rvnav .btn:disabled{opacity:.4}#rvB{margin-top:12px}.rvq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}.ck label.miss{opacity:.75}.ck label .mk{font-weight:700;min-width:1.2em}.ck label.on .mk{color:var(--ok)}.kw.miss{opacity:.6}@media(max-width:480px){.rvnav .btn{padding:7px 10px}}
/*flt*/.flt{margin:8px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:grid;gap:6px}
.flt .fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flt .fl{font-size:.76rem;font-weight:700;color:var(--sub);min-width:2.6em}
.flt button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:2px 11px;font-size:.84rem;line-height:1.6}
.flt button.on{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.flt .fs{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub)}
.flt .fs a{cursor:pointer}
</style><style id="sprint-bardim-css">.act{transition:opacity .8s}.act.dim{opacity:.22}.act.dim:hover,.act.dim:focus-within{opacity:1}.act .hint{font-size:.78rem;color:var(--sub);flex:1;min-width:0}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="估價備考指揮中心.html">← 指揮中心</a><span style="color:var(--sub)"><span id="sum"></span>　<button type="button" id="thBtn" class="thb" aria-label="切換深淺色"></button>　<a id="swTop" href="估價_申論5分鐘_推理版.html">切到推理版 ▸</a></span></div>

  <!-- 開始畫面 -->
  <section id="home">
    <h1>申論 5 分鐘衝刺</h1>
    <p class="lead">一題約 5 分鐘：讀題 → 先自己想 → 讀考場版 → 對結論 → 關鍵檢核。紀錄與申論範文頁、指揮中心同步（輪數、自評、分數）。</p>
    <div class="flt" id="flt"></div>
    <details class="howto" id="howto"><summary>流程、時間怎麼分、兩種模式說明</summary><div class="hb"><ul class="flow"><li><b>0:30</b>讀題</li><li><b>0:30</b>先自己想</li><li><b>2:30</b>意義・法條・涵攝</li><li><b>1:00</b>結論</li><li><b>0:30</b>關鍵檢核</li></ul></div></details>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-m="h"><b>⚡ 衝刺</b><small>每段時間到就變紅並自動進下一段；讀過的段落會被蓋住，不能回頭看。</small></button>
      <button type="button" class="mode" data-m="s"><b>🪑 停留</b><small>時間到一樣變紅，但可以繼續看，自己按「下一段」。</small></button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" id="startBtn">開始下一題</button><button type="button" class="btn" id="randBtn">🎲 隨機出題</button></div>
    <div class="sec-h"><span>接下來的順序</span><small id="qcount"></small></div>
    <div class="qlist" id="qlist"></div>
    <button type="button" class="btn more" id="moreBtn">顯示全部</button>
  </section>

  <!-- 作答畫面 -->
  <section id="run" hidden>
    <div class="bar">
      <div class="row">
        <div class="stg" id="stg"></div>
        <span class="modechip" id="mchip"></span><button type="button" class="pz" id="pauseBtn" aria-label="暫停">⏸</button>
        <div><div class="clk" id="clk">0:30</div><div class="tot" id="tot">總 0:00／5:00</div></div>
      </div>
      <div class="segs" id="segs"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    </div>
    <div class="card">
      <div class="meta" id="meta"></div>
      <div class="ttl" id="ttl"></div>
      <div class="qbox" id="qbox"></div><div class="swq" id="swq"></div>
      <div class="pzbox" id="pzbox"><b>已暫停</b>計時停止，題目與答案先蓋住。<br><button type="button" class="btn pri" id="resumeBtn" style="margin-top:12px">▶ 繼續</button></div>
    <div id="body"></div>
    </div>
  </section>
</div>

<script>
var CARDS=[{"id": "e105-1", "no": "105年第一題", "t": "成本法折舊路徑種類＋定額法計算並繪製示意圖", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "成本法", "q": "建物累積折舊額之計算，應視建物特性及市場動態，選擇適合的折舊方法。依不動產估價技術規則的規定，有那些路徑的折舊方法？請詳述說明之。假設有一價值200萬元的建物，耐用年數50年，殘價率5%，試繪製示意圖說明之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>建物累積折舊額之計算，應視建物特性及市場動態選擇折舊方法。技術規則所定折舊路徑共三種：等速折舊、初期加速折舊、初期減速折舊。本題並以定額法（等速）計算200萬元建物之折舊，再以示意圖說明三路徑之差異。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§68Ⅰ</span>：累積折舊額之計算，應視建物特性及市場動態，選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法。</span><span class=\"evli\"><span class=\"art\">§67Ⅰ</span>：殘餘價格率由全聯會公告，以不超過百分之十為原則。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）三種折舊路徑（<span class=\"art\">§68Ⅰ</span>；方法對應為教材整理）</p><p>1. <b>等速折舊</b>：每年折舊金額固定，呈直線遞減，（教材）以定額法計算。</p><p class=\"evx\"><span class=\"evt\">例</span><span>損耗大致平均之一般住宅。</span></p><p>2. <b>初期加速折舊</b>：初期折舊快、後期漸緩，曲線在直線下方（先陡後緩），（教材）以定率法計算。</p><p class=\"evx\"><span class=\"evt\">例</span><span>商場、裝修比重高者。</span></p><p>3. <b>初期減速折舊</b>：初期折舊慢、後期加速，曲線在直線上方（先緩後陡），（教材）以償債基金法計算。</p><p class=\"evx\"><span class=\"evt\">例</span><span>結構堅固、維修良好者。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）定額法計算（C=200萬、s=5%、N=50年）</p><p>公式：每年折舊額＝C×(1－s)÷N；累積折舊Dn＝C×(1－s)÷N×n；建物現值＝C－Dn。</p><p>代入：每年折舊額＝200×0.95÷50＝<b>3.8萬元/年</b>。</p><p>結果：n＝10，累積折舊38.0萬元、現值162.0萬元；n＝25，累積折舊95.0萬元、現值105.0萬元；n＝50，累積折舊190.0萬元、現值10.0萬元（殘值＝200×5%）。本題殘價率5%，符合<span class=\"art\">§67Ⅰ</span>不超過百分之十之原則。</p></div><div class=\"evp\"><p class=\"evh\">（三）示意圖說明</p><p>橫軸為經歷年數（0→50年），縱軸為建物價值（200→10萬元）；三條路徑起點均為200萬、終點均為殘餘價值10萬。等速為斜率固定（每年下降3.8萬）之直線；初期加速曲線在直線下方；初期減速曲線在直線上方。</p><p class=\"evx\"><span class=\"evt\">例</span><span>（教材）n＝25時，定率法現值≈44.7萬、等速105.0萬、償債基金法（假設i＝5%，題目未給）≈156.7萬。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>依技術規則，折舊路徑分等速、初期加速、初期減速三種，沒有「後期加速折舊」之說法。本題採定額法，每年折舊3.8萬元，50年末殘值10萬元，呈均勻遞減之直線；選擇路徑應依建物特性與市場，才能反映真實價值。</p>"], "ck": [{"x": "§68：視建物特性及市場動態，選等速、初期加速、初期減速路徑", "h": false}, {"x": "三種路徑與方法：等速（定額法）、初期加速（定率法）、初期減速（償債基金法）", "h": false}, {"x": "只有三種，不可寫「後期加速折舊」", "h": true}, {"x": "Dn＝C×(1－s)÷N×n 並寫出符號", "h": false}, {"x": "200×0.95÷50＝3.8 萬元/年（列式）", "h": false}, {"x": "50 年末殘值 10 萬元（＝200×5%）", "h": false}, {"x": "圖：橫軸經歷年數、縱軸建物價值；三線起點 200、終點 10", "h": true}, {"x": "加速曲線在直線下方（先陡後緩）、減速在直線上方（先緩後陡）", "h": true}], "mn": "§68 三路徑（等速・加速・減速）→ 定額法 Dn＝C(1－s)÷N×n → 3.8 萬/年 → 末殘值 10 萬 → 圖：直線居中", "hp": 1030, "hpl": "中"}, {"id": "e107-1", "no": "107年第一題", "t": "定率法折舊公式＋計算第5年建物現值", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "成本法", "q": "請列式說明定率法的折舊公式。如果一個1000萬元的建築物，以每年減損2%的速度折舊，請問第5年年末，該建築物的現值為多少？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>定率法係依每年固定折舊率，對當年「餘值」（而非原始成本）計算折舊，故每年折舊金額逐年遞減。（教材）定率法為初期加速折舊路徑所對應之方法。本題以定率法求1000萬元建物第5年末現值。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">§68</span>：建物累積折舊額之計算，應視建物特性及市場動態，選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）定率法公式</p><p>第n年末建物現值＝C×(1－r)ⁿ（C＝建物總成本、r＝年折舊率（固定）、n＝經歷年數）。</p><p>（教材）第n年折舊額＝C×r×(1－r)<sup>n－1</sup>；累積折舊額Dn＝C×[1－(1－r)<sup>n</sup>]；折舊率r＝1－(殘餘價格÷C)<sup>1/N</sup>，本題已直接給r＝2%。</p><p class=\"evx\"><span class=\"evt\">例</span><span>第1年折舊＝1000×2%＝20.0萬。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）代入計算（C=1000萬、r=2%、n=5）</p><p>第5年末現值＝1000×(0.98)⁵＝1000×0.9039≈<b>903.9萬元</b>。</p><p>累積折舊額＝1000－903.9≈<b>96.1萬元</b>。</p><p>逐年：第1年折舊20.0萬（期末980.0萬）→第2年19.6萬（960.4萬）→第3年19.2萬（941.2萬）→第4年18.8萬（922.4萬）→第5年18.4萬（903.9萬）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>折舊額由20.0萬逐年遞減至18.4萬。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）陷阱</p><p>定率法是對「餘值」計算，不是原始成本×n，與定額法公式不可混用。</p></div>", "<span class=\"blk-l\">四、結論</span><p>依定率法，折舊率固定但基礎逐年縮小，故折舊金額逐年遞減，屬初期加速折舊路徑。本題建物第5年末現值約903.9萬元，累積折舊約96.1萬元（逐年表為四捨五入）；選法要合乎市場實態。</p>"], "ck": [{"x": "定率法意義：固定折舊率×餘值，折舊逐年遞減（初期加速折舊）", "h": false}, {"x": "公式 C×(1－r)ⁿ，並寫出 C、r、n 符號", "h": false}, {"x": "對餘值計算，不是原始成本×n；與定額法不可混用", "h": true}, {"x": "題意「每年減損 2%」判斷為定率法，列出 C＝1,000、r＝2%、n＝5", "h": false}, {"x": "代入 1000×(0.98)⁵ 要列式", "h": false}, {"x": "0.98⁵＝0.9039 算對，不可誤用 1000×2%×5（會得 900 萬）", "h": true}, {"x": "逐年表：折舊 20.0、19.6、19.2、18.8、18.4 遞減", "h": false}, {"x": "第 5 年末現值約 903.9 萬元（要寫單位）", "h": true}], "mn": "定率＝餘值×固定率 → C×(1－r)ⁿ → 1000×0.98⁵ → 903.9 萬", "hp": 1029, "hpl": "中"}, {"id": "e111-1", "no": "111年第一題", "t": "建物折舊額與累積折舊額之計算", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "成本法", "q": "建物折舊額如何計算？建物累積折舊額又如何計算？請依不動產估價技術規則述說之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>建物折舊額須先決定耐用年數與殘餘價格率，再依公式求每年折舊額；累積折舊額則須選擇折舊路徑並推估耐用年數，最後自建物總成本扣除。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§65</span>：以經濟耐用年數為主。</span><span class=\"evli\"><span class=\"art\">§66</span>：耐用年數表由全聯會公告。</span><span class=\"evli\"><span class=\"art\">§67</span>：殘餘價格率以不超過百分之十為原則。</span><span class=\"evli\"><span class=\"art\">§40-1</span>：等速折舊型、償債基金型。</span><span class=\"evli\"><span class=\"art\">§68Ⅰ</span>：選擇折舊路徑。</span><span class=\"evli\"><span class=\"art\">§68Ⅱ</span>：推估耐用年數。</span><span class=\"evli\"><span class=\"art\">§69Ⅰ</span>：建物成本價格之計算。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）建物折舊額</p><p>1. 耐用年數（<span class=\"art\">§65</span>、<span class=\"art\">§66</span>）：經濟耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數；物理耐用年數指因自然耗損或外力破壞至結構脆弱而不堪使用之年數。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經歷年數大於經濟耐用年數時，應重新調整經濟耐用年數。</span></p><p>2. 殘餘價格率（<span class=\"art\">§67</span>）：指經濟耐用年數屆滿後，賸餘結構材料及內部設備仍能出售之價格占建物總成本之比率，故應折舊總額＝C×(1－s)。</p><p class=\"evx\"><span class=\"evt\">例</span><span>確實無殘餘價格者，計算折舊時不予提列。</span></p><p>3. 每年折舊額（<span class=\"art\">§40-1</span>）：</p><p>等速折舊型＝C×(1－s)×(1/N)；</p><p>償債基金型＝C×(1－s)×{ i ／[(1＋i)<sup>N</sup>－1] }；</p><p>（教材）定率法：每年折舊額＝前一年餘值×r，r＝1－s<sup>1/N</sup>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>償債基金法每年提存金額固定，但折舊曲線先緩後陡。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）建物累積折舊額</p><p>1. 選擇路徑（<span class=\"art\">§68Ⅰ</span>）：（教材）定額法對應等速（直線）、定率法對應初期加速（直線下方）、償債基金法對應初期減速（直線上方）。</p><p>2. 計算式（教材）：定額法Dn＝C×(1－s)÷N×n；定率法Dn＝C×[1－(1－r)<sup>n</sup>]；償債基金法Dn＝C×(1－s)×[(1＋i)<sup>n</sup>－1]÷[(1＋i)<sup>N</sup>－1]。</p><p>3. 考量因素（<span class=\"art\">§68Ⅱ</span>）：按個別建物之實際構成部分與使用狀態，觀察維修及整建情形，推估賸餘經濟耐用年數，加計已經歷年數求算耐用年數，並於估價報告書中敘明。</p><p>4. 求成本價格（<span class=\"art\">§69Ⅰ②</span>）：建物總成本扣除累積折舊額。</p></div>", "<span class=\"blk-l\">四、結論</span><p>建物折舊額依<span class=\"art\">§65</span>以經濟耐用年數為主，配合<span class=\"art\">§66</span>、<span class=\"art\">§67</span>全聯會公告之耐用年數表與殘餘價格率，按<span class=\"art\">§40-1</span>等速折舊型或償債基金型（或教材定率法）計算；累積折舊額依<span class=\"art\">§68Ⅰ</span>選擇路徑、<span class=\"art\">§68Ⅱ</span>推估耐用年數，最後依<span class=\"art\">§69Ⅰ②</span>自建物總成本扣除。耐用年數推估須敘明理由，確保估價可驗證。</p>"], "ck": [{"x": "折舊額＝單期（每年）減損；累積折舊額＝多期加總", "h": false}, {"x": "定額法每年折舊額＝C×(1－s)÷N，並寫出符號", "h": false}, {"x": "定率法（對前一年餘值、初期折舊大）、償債基金法（複利提存、本利和等於應折舊總額）", "h": false}, {"x": "償債基金法提存額固定，但折舊曲線先緩後陡，不要搞混", "h": true}, {"x": "開頭先寫：路徑須視建物特性及市場動態選擇", "h": true}, {"x": "路徑與方法對應：等速＝定額法、初期加速＝定率法、初期減速＝償債基金法", "h": true}, {"x": "三法累積折舊額：定額 Dn＝C×(1－s)÷N×n；定率 C×[1－(1－r)ⁿ]；償債基金 C×(1－s)×[(1＋i)ⁿ－1]÷[(1＋i)ᴺ－1]", "h": false}, {"x": "結論說明選用理由與三法差異（折舊速度趨勢）", "h": false}], "mn": "折舊額單期 → 累積折舊額多期 → 路徑（等速・加速・減速）→ 對應三法 → 公式 → 說明選用理由", "hp": 1028, "hpl": "中"}, {"id": "e111-2", "no": "111年第二題", "t": "重建成本vs重置成本＋成本法估價程序", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "成本法", "q": "何謂重建成本？何謂重置成本？以成本法進行不動產估價時，請說明決定不動產勘估標的價格之程序與所需資料。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>重建成本，指使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本；重置成本，指與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§48</span>：以重建成本為原則，得採重置成本替代。</span><span class=\"evli\"><span class=\"art\">§49</span>：估價程序八步驟。</span><span class=\"evli\"><span class=\"art\">§69</span>：成本價格之計算。<span class=\"art\">第11條</span>：應蒐集之資料。</span><span class=\"evli\"><span class=\"art\">第50條</span>：成本法另得蒐集之資料。<span class=\"art\">第51條</span>：同一供需圈內之成本資料。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）重建成本vs重置成本（<span class=\"art\">§48</span>）</p><p>重建成本＝相同或極類似建材、設計之重新複製；重置成本＝相同效用、現代建材與設計。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建物使用之材料目前已無生產者，得採重置成本替代。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）決定價格之程序（<span class=\"art\">§49</span>、<span class=\"art\">§69</span>）</p><p>1. 蒐集資料；2. 現況勘察；3. 調查、整理、比較及分析各項成本及相關費用；4. 選擇適當方法推算營造或施工費；5. 推算其他各項費用及利潤；6. 計算總成本；7. 計算建物累積折舊額；8. 計算成本價格（口訣「蒐勘整選推總折價」）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>第八步依<span class=\"art\">第69條</span>，房地成本價格＝土地價格＋建物成本價格；土地價格求取有困難者，得以比較法或收益法計算之，並於估價報告書中敘明。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）所需資料</p><p>1. 依<span class=\"art\">第11條</span>：勘估標的之標示、權利、法定用途及使用管制等基本資料；一般、區域及個別因素；相關交易、收益及成本資料。</p><p>2. 依<span class=\"art\">第50條</span>：土地開發及建築構想計畫書、設計圖說、相關許可或執照、施工計畫書、竣工圖、使用執照、登記（簿）謄本或建物平面位置圖。</p><p>3. 依<span class=\"art\">第51條</span>：同一供需圈內各項施工材料、人工之價格水準；營造、施工、規劃、設計、廣告、銷售、管理及稅捐等費用；資本利率；開發或建築利潤率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>（教材歸納）可再分土地部分、建物重建（重置）成本、折舊（經濟耐用年數、殘餘價格率、經歷年數、建物現況）三類。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>重建成本為原則、重置成本為例外（<span class=\"art\">§48</span>）。成本法應依<span class=\"art\">§49</span>八步驟，由蒐集資料至計算成本價格，並依<span class=\"art\">§69</span>求房地成本價格；所需資料則依<span class=\"art\">第11條</span>、<span class=\"art\">第50條</span>、<span class=\"art\">第51條</span>蒐集。題目問程序與所需資料兩件事，缺一不可。</p>"], "ck": [{"x": "重建成本定義：相同或極類似建材、設計、配置、施工品質重新複製（§48）", "h": true}, {"x": "§48 原則求重建成本；建材已無生產或施工方法已改變得採重置成本替代", "h": false}, {"x": "重置成本定義：相同效用、現代建材標準、設計及配置（§48）", "h": true}, {"x": "程序：蒐集資料→土地價格→重建成本→折舊額→建物成本價格→房地成本價格", "h": false}, {"x": "§49 法定為八步，§69 土地價格＝土地總成本，困難得改比較法或收益法並敘明", "h": false}, {"x": "房地成本價格＝土地價格＋建物成本價格（建物成本價格＝成本－折舊）", "h": false}, {"x": "所需資料三類都要寫：土地、建物成本費用、折舊資料", "h": true}, {"x": "費用項目：施工費、設計費、廣告銷售費、管理費、稅捐、資本利息；利潤視題意才加", "h": false}], "mn": "定義 §48（重建原則・重置替代）→ 程序 六步（§49 八步）→ 土地 §69 → 建物成本＝成本－折舊 → 資料三類"}, {"id": "e112-2", "no": "112年第二題", "t": "屋齡10年建物等速折舊計算＋合理性分析", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "成本法", "q": "有一屋齡10年的中古住宅，於建物重新建造成本800萬元、耐用年數50年、殘餘價格率5%的條件下，依不動產估價技術規則的等速折舊路徑計算，建物的現在價值是多少？另請以專業人士的觀點，分析這個價格的合理性。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>等速折舊路徑係每年折舊金額固定，教材稱定額法，以建物總成本扣除殘值後按耐用年數平均分攤，求得累積折舊額後自建物總成本扣除，即為建物現值。本題須先算出屋齡10年建物之現在價值，再以專業觀點分析其合理性。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§68</span>：累積折舊額應視建物特性及市場動態選擇折舊路徑；</span><span class=\"evli\"><span class=\"art\">§68Ⅱ</span>：得按個別建物使用狀態推估耐用年數。</span><span class=\"evli\"><span class=\"art\">§65</span>：以經濟耐用年數為主，必要時得以物理耐用年數計算。</span><span class=\"evli\"><span class=\"art\">§67Ⅰ</span>：殘餘價格率由全聯會公告，以不超過百分之十為原則。</span><span class=\"evli\"><span class=\"art\">§14</span>：應兼採二種以上估價方法。</span><span class=\"evli\"><span class=\"art\">§15Ⅰ</span>：就金額顯著差異者重新檢討。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）計算建物現在價值</p><p>公式：累積折舊Dn＝C×(1－s)÷N×n；建物現值＝C－Dn。</p><p>代入：800萬×(1－5%)÷50年×10年，每年折舊15.2萬→累積折舊額Dn＝<b>152萬元</b>。</p><p>結果：800－152＝<b>648萬元</b>。</p></div><div class=\"evp\"><p class=\"evh\">（二）合理性分析</p><p>1. 路徑選用：等速現值居中，初期加速（定率法）較低、初期減速（償債基金法）較高。</p><p class=\"evx\"><span class=\"evt\">例</span><span>屋齡10年自用住宅使用穩定，採等速合理。</span></p><p>2. 參數符合規定（<span class=\"art\">§65</span>、<span class=\"art\">§67Ⅰ</span>）：本題殘餘價格率5%未超過上限。</p><p class=\"evx\"><span class=\"evt\">例</span><span>（教材／實務）全聯會公報RC住宅50年、殘價率4～5%相符；惟題目未載構造，若為加強磚造（35年、殘價率0）參數即不當。</span></p><p>3. 成本法侷限：反映重建成本扣除折舊，不是買方願付價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>地段房價上漲時，成交價可能高於成本法結果。</span></p><p>4. 未計土地與區域因素：648萬元只是建物部分。</p><p class=\"evx\"><span class=\"evt\">例</span><span>房地總價須再加土地價格。</span></p><p>5. 交叉驗證（<span class=\"art\">§14</span>、<span class=\"art\">§15Ⅰ</span>）：應兼採二種以上方法。</p><p class=\"evx\"><span class=\"evt\">例</span><span>（教材）依替代原則，參酌附近類似中古住宅比較實例與出租收益綜合比較。</span></p><p>6. 實際耗損（<span class=\"art\">§68Ⅱ</span>）：應實地勘查屋況，必要時推估賸餘經濟耐用年數或調整折舊路徑。</p><p class=\"evx\"><span class=\"evt\">例</span><span>維修情形不佳者，耐用年數應重新推估。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>本案建物依等速折舊路徑計算之現在價值為648萬元，路徑與參數符合規定（以鋼筋混凝土造住宅為前提）、結果合理；惟僅反映建物成本價格，未涵蓋土地價值與市場供需，仍須搭配比較法及收益法綜合決定，並以專業判斷補充說明。</p>"], "ck": [{"x": "等速折舊＝定額法，Dn＝C×(1－s)÷N×n", "h": false}, {"x": "代入 800×(1－5%)÷50×10＝152 萬（要列式，有部分分數）", "h": false}, {"x": "建物現值 800－152＝648 萬元", "h": false}, {"x": "說出為何選等速、為何不選另外兩種（居中、使用狀況穩定）", "h": true}, {"x": "s＝5% 未超過 10%（全聯會公告）；N 用經濟耐用年數", "h": false}, {"x": "成本法侷限：僅建物、不含土地、反映成本非市價", "h": true}, {"x": "比較法、收益法交叉驗證；依屋況調整經歷年數", "h": true}, {"x": "648 萬合理，但僅為建物成本價格", "h": false}], "mn": "等速＝定額 → Dn＝C(1－s)÷N×n＝152 → 現值 648 → 合理性：路徑・參數・侷限・交叉驗證", "hp": 1027, "hpl": "中"}, {"id": "e104-2", "no": "104年第二題", "t": "收益法建物折舊提存費之計算＋成本法營造或施工費之估計", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "成本法", "q": "不論是收益法或是成本法在房地產收益價格估計時都扮演著重要的角色，當估價時，勘估標的如果包含建物應加計建物之折舊提存費，請問要如何計算建物的折舊提存費？又勘估標的在估價時，對於其營造或施工費要如何估計？請分別論述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>收益法中勘估標的包含建物者，須加計建物折舊提存費，可列入總費用或將折舊提存率加入資本化率；成本法中之營造或施工費，則為總成本項目之一，須依直接法或間接法擇一求取。本題分別論述二者之計算與估計方法。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§40</span>：建物折舊提存費得列入總費用，或將折舊提存率d加入資本化率或折現率。</span><span class=\"evli\"><span class=\"art\">§40-1</span>：等速折舊型、償債基金型兩種計算方式。</span><span class=\"evli\"><span class=\"art\">§41</span>：未來每年折舊提存率之計算。</span><span class=\"evli\"><span class=\"art\">§52</span>：總成本七項。</span><span class=\"evli\"><span class=\"art\">§53</span>：營造或施工費之組成。</span><span class=\"evli\"><span class=\"art\">§54</span>：得按直接法、間接法擇一求取。</span><span class=\"evli\"><span class=\"art\">§55</span>：直接法（淨計法、單位工程法）。</span><span class=\"evli\"><span class=\"art\">§56</span>：間接法（工程造價比較法、單位面積比較法）。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）建物折舊提存費（<span class=\"art\">§40</span>、<span class=\"art\">§40-1</span>）</p><p>公式：等速折舊型＝C×（1－s）÷N；償債基金型＝C×（1－s）×i÷[（1＋i）ᴺ－1]（C＝建物總成本、s＝殘餘價格率、i＝自有資金利率、N＝經濟耐用年數）。</p><p>代入（C＝800萬，s＝5%，N＝50年，i＝2%）：等速型＝800×0.95÷50；償債基金型＝800×0.95×2%÷[1.02⁵⁰－1]≈15.2÷1.6916。</p><p>結果：等速型<b>15.2萬/年</b>；償債基金型≈<b>8.99萬/年</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>償債基金型提存額較小，因利息幫忙累積。另依<span class=\"art\">§41</span>，等速折舊型d＝[(1−s)／N]÷[1−(1−s)n／N]、償債基金型d＝i÷[(1＋i)<sup>n′</sup>−1]。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）營造或施工費之估計（<span class=\"art\">§53</span>～<span class=\"art\">§56</span>）</p><p>1. 組成（<span class=\"art\">§53</span>）：直接材料、直接人工、間接材料、間接人工、管理費、稅捐、資本利息、施工利潤。</p><p>2. 直接法（<span class=\"art\">§55</span>）：淨計法逐項計算材料及人工數量乘以單價，再加計管理費、稅捐、資本利息及利潤；單位工程法以細部工程各項目單價乘以施工數量合計。</p><p>3. 間接法（<span class=\"art\">§56</span>）：工程造價比較法逐項比較工程概算項目差異調整；單位面積（或體積）比較法以比較標的或標準建物之單位面積造價乘以勘估標的面積。</p><p class=\"evx\"><span class=\"evt\">例</span><span>考選部102-33標準答案認定實務最常用者為單位面積比較法。</span></p><p>4. 間接法須選取同一供需圈內近鄰地區或類似地區之比較標的或標準建物；營造或施工費標準表由全聯會公告，未公告前依地價調查用建築改良物標準單價表為準（<span class=\"art\">§56Ⅲ</span>）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>收益法折舊提存費依<span class=\"art\">§40-1</span>等速折舊型或償債基金型計算，並以加入總費用或資本化率處理；成本法營造或施工費依<span class=\"art\">§54</span>直接法、間接法擇一求取，採淨計法、單位工程法，或工程造價比較法、單位面積比較法估計，依資料選用以求合理準確。</p>"], "ck": [{"x": "§40 含建物須加計折舊提存費：列入總費用，或把 d 加入資本化率或折現率", "h": false}, {"x": "§40-1 兩式：等速 C(1－s)÷N、償債基金 C(1－s)×i÷[(1＋i)ᴺ－1]，並寫出 C、s、i、N", "h": false}, {"x": "代入 800 萬例：15.2 萬/年與約 8.99 萬/年", "h": false}, {"x": "折舊提存費（收益法）≠ 累積折舊額（成本法）；償債基金型較小", "h": true}, {"x": "§53 營造施工費八項組成", "h": false}, {"x": "§55 直接法：淨計法與單位工程法各寫內容", "h": false}, {"x": "§56 間接法兩個方法都寫，並說明須選同一供需圈內比較標的或標準建物", "h": true}, {"x": "§57 規劃設計費 2%至 3%；兩個子問題分別寫完", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "收益法 §40 → 兩式 §40-1（等速・償債基金）→ 成本法營造費組成 §53 → 直接法 §55 → 間接法 §56 → 設計費 §57", "hp": 1040, "hpl": "中"}, {"id": "mk-c2-1", "no": "綜合模擬卷二 申論一", "t": "成本法意義、程序＋定率遞減法折舊計算", "lv": "本站模擬卷・必考（A級）", "k": "mkc", "tier": 0, "g": "成本法", "q": "試說明成本法估價之意義、應用時機及估價程序。並依「不動產估價技術規則」，說明折舊之定義，以及定率遞減法（定率法）之計算公式，試以一棟建物為例：建物重建成本為 800 萬元，耐用年數 50 年，殘值率 10%，已使用 20 年，請以定率遞減法求算折舊後之建物現值。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>成本法係求取勘估標的於價格日期之重建成本或重置成本，扣減其累積折舊額或其他應扣除部分，以推算勘估標的價格之估價方法。</p><p>應用時機：無市場交易案例或案例缺乏可比性（如特殊工業廠房、寺廟）、新建或完工不久之建物、公益性設施估價，及保險金額之估算、徵收補償。</p><p>折舊（學理）係指建物因物理性、機能性及經濟性因素，致價值減損。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§48</span>：成本法之意義。</span><span class=\"evli\"><span class=\"art\">§49</span>：成本法估價程序。</span><span class=\"evli\"><span class=\"art\">§54</span>～<span class=\"art\">§56</span>：營造施工費以直接法、間接法推算；</span><span class=\"evli\"><span class=\"art\">§52</span>：計算總成本。</span><span class=\"evli\"><span class=\"art\">§65</span>：折舊以經濟耐用年數為主；</span><span class=\"evli\"><span class=\"art\">§67</span>：殘餘價格率原則不超過10%。</span><span class=\"evli\"><span class=\"art\">§68</span>：累積折舊額依建物特性選擇等速、初期加速或初期減速折舊路徑；定率遞減法屬初期加速折舊路徑。</span><span class=\"evli\"><span class=\"art\">§69</span>：建物成本價格＝總成本－累積折舊；土地＝總成本。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）估價程序</p><p>蒐集資料並現場勘察→調查、整理、比較、分析成本資料及相關費用→推算營造施工費→推算設計費、資本利息、利潤等，計算總成本→計算累積折舊額→計算成本價格。</p></div><div class=\"evp\"><p class=\"evh\">（二）定率遞減法公式</p><p>殘值率＝(1－年折舊率)<sup>耐用年數</sup>，故年折舊率r＝1－(殘值率)<sup>1/耐用年數</sup>。</p></div><div class=\"evp\"><p class=\"evh\">（三）代入</p><p>殘值率0.1、N＝50，r＝1－0.1<sup>0.02</sup>；0.1<sup>0.02</sup>＝e<sup>0.02×(－2.3026)</sup>＝e<sup>－0.046052</sup>≈0.9550，r≈0.0450（年折舊率約4.50%）。</p><p>已使用20年，成數＝(0.9550)<sup>20</sup>＝e<sup>20×(－0.046052)</sup>＝e<sup>－0.9210</sup>≈0.3981。</p><p>建物現值＝800×0.3981≈<b>318.5萬元</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>成本法以重建或重置成本扣除累積折舊額求取價格。本題依定率遞減法，年折舊率約4.50%，已使用20年之成數約0.3981，折舊後建物現值約318.5萬元；若考試給定r＝4.5%，依題目給定值為準。</p>"], "ck": [{"x": "§48 意義：重建或重置成本扣減累積折舊額或其他應扣除部分", "h": false}, {"x": "應用時機：無交易案例或缺乏可比性、新建建物、公益設施、保險與徵收補償", "h": false}, {"x": "程序（§49）：營造施工費（§54～§56）→總成本（§52）→累積折舊額（§68）→成本價格（§69）", "h": true}, {"x": "折舊：物理性、機能性、經濟性因素致價值減損（學理）；以經濟耐用年數為主（§65）", "h": false}, {"x": "殘餘價格率原則不超過 10%（§67）；三路徑（§68），定率遞減法屬初期加速", "h": true}, {"x": "公式：殘值率＝(1－r)^N → r＝1－(殘值率)^(1/N)", "h": false}, {"x": "r＝1－0.1^0.02≈1－0.9550＝4.50%（列出指數 0.02）", "h": true}, {"x": "成數 (0.9550)^20≈0.3981；建物現值＝800×0.3981≈318.5 萬元", "h": false}], "mn": "成本－累積折舊 → 施工費・總成本・折舊・價格 → 殘值率＝(1－r)^N → r≈4.50% → 0.3981 → 318.5萬", "hp": 1033, "hpl": "中"}, {"id": "pred-1", "no": "115預測①", "t": "成本法折舊三路徑計算（定額、定率、償債基金法）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "成本法", "q": "依不動產估價技術規則之規定，試述建物折舊的三種路徑方法，並舉例說明其異同。假設某建物重建成本為1,200萬元，耐用年數40年，殘餘價格率10%，屋齡8年，年利率2%，試分別以定額法、定率法及償債基金法計算該建物之折舊額及現值。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>建物折舊依技術規則<span class=\"art\">§68</span>分三路徑：等速折舊（定額法）、初期加速折舊（定率法）、初期減速折舊（償債基金法）。三者因折舊認列之時間分佈不同，同一建物之現值差異甚大。本題以重建成本1,200萬元建物，分別計算8年之折舊額及現值。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§68</span>：三路徑為等速折舊、初期加速折舊、初期減速折舊。</span><span class=\"evli\">代號：C＝重建成本1,200萬、s＝殘餘價格率10%、N＝耐用年數40年、n＝屋齡8年、i＝年利率2%。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）三路徑異同</p><p>定額法每年折舊固定，累積折舊呈直線；定率法初期快後期緩，現值曲線在直線下方；償債基金法初期慢後期快，現值曲線在直線上方。</p><p class=\"evx\"><span class=\"evt\">例</span><span>前8年定額法認列18%、定率法36.9%、償債基金法12.8%。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）定額法</p><p>公式：每年折舊額＝C×(1－s)÷N。</p><p>代入：1,200×0.9÷40＝<b>27萬元/年</b>；8年累積27×8＝216萬元。</p><p>結果：現值＝1,200－216＝<b>984萬元</b>。</p></div><div class=\"evp\"><p class=\"evh\">（三）定率法</p><p>公式：r＝1－(s)¹⁄ᴺ；8年後現值＝C×sⁿ⁄ᴺ。</p><p>代入：r＝1－(0.1)¹⁄⁴⁰＝1－0.9441＝約5.59%；現值＝1,200×(0.1)<sup>0.2</sup>≈1,200×0.6310。</p><p>結果：現值≈<b>757.2萬元</b>，折舊總額≈<b>442.8萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>第1年折舊≈67.1萬、第2年≈63.3萬。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）償債基金法</p><p>公式：d＝C×(1－s)×i÷[(1＋i)ᴺ－1]；累積基金＝d×[(1＋i)ⁿ－1]÷i。</p><p>代入：1,080×0.02÷[2.2080－1]＝21.6÷1.2080≈17.88萬元/年；17.88×8.5830。</p><p>結果：累積≈<b>153.5萬元</b>，現值＝1,200－153.5≈<b>1,046.5萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>忘記乘年金終值係數會低估累積額。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）比較</p><p>定額法216.0萬／984.0萬；定率法442.8萬／757.2萬；償債基金法153.5萬／1,046.5萬。</p></div>",
