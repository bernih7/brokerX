>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§37</span>：推算時應與往年資料、相同產業或具替代性比較標的、目前或未來可能之計畫收入校核比較。</span><span class=\"evli\"><span class=\"art\">§38</span>：總費用依相同或相似不動產之費用資料或會計報表推算。</span><span class=\"evli\"><span class=\"art\">§39</span>：重置提撥費按有效使用年期及耗損比率分年攤提。</span><span class=\"evli\"><span class=\"art\">§40</span>：包含建物者應加計建物之折舊提存費，或於計算收益價格時加計折舊提存率。</span><span class=\"evli\"><span class=\"art\">§46</span>：房地收益價格＝房地淨收益÷房地綜合收益資本化率；淨收益已扣除折舊提存費時，綜合率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）有效總收入（<span class=\"art\">§36</span>）</p><p>分析並推算總收入→推算閒置及其他原因造成之收入損失→前者扣除後者。</p></div><div class=\"evp\"><p class=\"evh\">（二）總費用（<span class=\"art\">§38</span>）</p><p>地價稅或地租、房屋稅、保險費、管理費及維修費等；<b>營運性不動產</b>並應加計營運費用。</p></div><div class=\"evp\"><p class=\"evh\">（三）淨收益（<span class=\"art\">§42</span>）</p><p>有效總收入減總費用；營運性不動產之淨收益，應扣除不屬於不動產所產生之其他淨收益。</p></div><div class=\"evp\"><p class=\"evh\">（四）直接資本化法（<span class=\"art\">§46</span>）</p><p>公式：有效總收入＝總收入－收入損失；淨收益＝有效總收入－總費用；價格＝淨收益÷綜合率</p><p>代入：480×(1－5%)＝456萬；456－96＝360萬（總費用已含折舊提存費）；3%×50%＋5%×50%＝4%；360÷4%</p><p>結果：房地收益價格＝<b>9,000萬元</b></p><p>陷阱：折舊提存費已列在總費用時，不得再加折舊提存率（否則重複扣）；綜合率用價值比率加權，不是兩個率相加或取平均。</p></div>", "<span class=\"blk-l\">四、結論</span><p>有效總收入＝總收入－收入損失；總費用依<span class=\"art\">§38</span>列舉項目並含折舊提存費，營運性不動產另加營運費用；淨收益＝有效總收入－總費用。本題淨收益360萬元，綜合資本化率4%，房地收益價格<b>9,000萬元</b>。</p>"], "ck": [{"x": "有效總收入＝總收入－閒置及其他原因造成之收入損失（§36）", "h": true}, {"x": "總費用項目：地價稅或地租、房屋稅、保險費、管理費、維修費；營運性加營運費用（§38）", "h": false}, {"x": "包含建物者加計折舊提存費（或折舊提存率），不可重複（§40）", "h": true}, {"x": "淨收益＝有效總收入－總費用；營運性須扣除不屬於不動產之其他淨收益（§42）", "h": false}, {"x": "房地收益價格＝房地淨收益÷房地綜合收益資本化率（§46）", "h": false}, {"x": "有效總收入 480×0.95＝456；淨收益 456－96＝360（要列式）", "h": false}, {"x": "綜合率＝3%×50%＋5%×50%＝4%（用價值比率加權）", "h": true}, {"x": "房地收益價格 9,000 萬元", "h": false}], "mn": "總收入→扣損失→有效總收入→扣總費用→淨收益→除綜合率→價格", "hp": 1042, "hpl": "中"}, {"id": "pred-16", "no": "115預測⑯", "t": "資本化率之決定方法：債務保障比率法與有效總收入乘數法計算（§43）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "收益法", "q": "依不動產估價技術規則第四十三條，(一)收益資本化率或折現率應於哪些方法中，綜合評估最適宜之方法決定？請列舉並簡述市場萃取法。(二)某房地投資，債務保障比率1.4、貸款常數8%、貸款資金占不動產價格比率70%，依債務保障比率法求收益資本化率。(三)類似不動產每年淨收益占每年有效總收入之合理淨收益率為70%，有效總收入乘數為10，依有效總收入乘數法求收益資本化率。(四)若該房地年淨收益為235.2萬元，以(二)之資本化率求其收益價格。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p><span class=\"art\">§43</span>列五款決定資本化率之方法：風險溢酬法、市場萃取法、加權平均資金成本法、債務保障比率法、有效總收入乘數法，應綜合評估最適宜之方法決定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§43Ⅰ</span>：於五款方法中，綜合評估最適宜之方法決定。</span><span class=\"evli\"><span class=\"art\">§43</span>末段：有採取其他方法計算之必要時，應於估價報告書中敘明。</span><span class=\"evli\"><span class=\"art\">§46</span>：房地收益價格＝房地淨收益÷房地綜合收益資本化率。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）五款方法（<span class=\"art\">§43</span>）</p><p>1. 風險溢酬法：以定存利率、公債利率等最具一般性財貨之投資報酬率為基準，比較流通性、風險性、增值性及管理難易程度決定。2. <b>市場萃取法</b>：選數個相同或相似比較標的，以其淨收益除以價格，所得之商數加以比較決定。3. 加權平均資金成本法：r＝ΣWiKi，ΣWi＝1。4. 債務保障比率法。5. 有效總收入乘數法。</p></div><div class=\"evp\"><p class=\"evh\">（二）債務保障比率法</p><p>公式：r＝債務保障比率×貸款常數×貸款資金占不動產價格比率</p><p>代入：r＝1.4×8%×70%</p><p>結果：r＝<b>7.84%</b></p><p>陷阱：三項連乘；貸款常數<span class=\"art\">§43</span>沒有定義，是教材概念（每年還本付息額÷貸款金額）。</p></div><div class=\"evp\"><p class=\"evh\">（三）有效總收入乘數法</p><p>公式：r＝淨收益率÷有效總收入乘數</p><p>代入：r＝70%÷10</p><p>結果：r＝<b>7%</b>（除法，分母是乘數）</p></div><div class=\"evp\"><p class=\"evh\">（四）收益價格（<span class=\"art\">§46</span>）</p><p>公式：收益價格＝淨收益÷收益資本化率</p><p>代入：235.2÷7.84%</p><p>結果：<b>3,000萬元</b></p></div>", "<span class=\"blk-l\">四、結論</span><p>資本化率應於<span class=\"art\">§43</span>五款方法中綜合評估決定。本題債務保障比率法得7.84%，有效總收入乘數法得7%，以7.84%求價為3,000萬元。不同方法結果不同時，應綜合評估並說明採用理由，而非擇一照算。</p>"], "ck": [{"x": "§43 五款方法依序列舉，並綜合評估最適宜之方法", "h": true}, {"x": "市場萃取法＝比較標的淨收益除以價格之商數比較決定", "h": false}, {"x": "債務保障比率法：r＝債務保障比率×貸款常數×貸款資金占不動產價格比率", "h": true}, {"x": "1.4×8%×70%＝7.84%（要列式）", "h": false}, {"x": "有效總收入乘數法：r＝淨收益率÷有效總收入乘數", "h": true}, {"x": "70%÷10＝7%", "h": false}, {"x": "房地收益價格＝房地淨收益÷資本化率（§46）", "h": false}, {"x": "收益價格 3,000 萬元", "h": false}], "mn": "溢萃加債乘；債＝三項相乘，乘數＝除", "hp": 1049, "hpl": "中"}, {"id": "e101-2", "no": "101年第二題", "t": "經濟租金、實質租金、支付租金之意義與計算", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "租金估計", "q": "何謂經濟租金？何謂實質租金？何謂支付租金？某甲以低於市場行情一成的租金向某乙承租房屋一年，言明月租金9,000元、押金兩個月，於一年期定存利率2%下，請問年經濟租金、實質租金、支付租金各為多少？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p><b>經濟租金</b>（學理用語，技術規則<span class=\"art\">§2</span>未定義）：不動產於市場上以最有效使用方式利用所能產生之收益，即正常市場下之合理租金（市場租金）；相對於支付租金，可看出租約是否偏離市場。<b>實質租金</b>：承租人承租不動產之真實代價。<b>支付租金</b>：承租人每期支付予出租人之租金。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">§130Ⅱ</span>：實質租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數。支付租金即其前段文字，不含押金、保證金、權利金之運用收益。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）年支付租金</p><p>公式：月租金×12</p><p>代入：9,000×12</p><p>結果：<b>108,000元</b></p></div><div class=\"evp\"><p class=\"evh\">（二）年實質租金</p><p>公式：支付租金＋押金運用收益</p><p>代入：（9,000×2）×2%＝360元；108,000＋360</p><p>結果：<b>108,360元</b>（押金是兩個月18,000元，利率用一年期定存2%）</p></div><div class=\"evp\"><p class=\"evh\">（三）年經濟租金</p><p>公式：支付租金＝經濟租金×（1－10%）</p><p>代入：108,000÷0.9</p><p>結果：<b>120,000元</b>（是÷0.9還原，不是×0.9）</p><p>另解：若視經濟租金為市場實質租金、市場同收兩個月押金，則為120,000＋20,000×2%＝120,400元。</p></div><div class=\"evp\"><p class=\"evh\">（四）租金利益</p><p>支付口徑120,000－108,000＝<b>12,000元</b>；實質口徑120,400－108,360＝<b>12,040元</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>本題年經濟租金為120,000元，年實質租金為108,360元，年支付租金為108,000元。本解假設「低於市場行情一成」指每期支付租金，承租人每年少付12,000元；若市場同樣收取兩個月押金，市場實質租金為120,400元，與本約實質租金108,360元相差12,040元。租金利益要同口徑相減，並寫明假設。</p>"], "ck": [{"x": "支付租金定義：依契約實際支付，不含押金運用收益", "h": false}, {"x": "年支付租金 9,000×12＝108,000 元", "h": false}, {"x": "實質租金＝支付租金＋押金、保證金、權利金及其他運用收益（§130）", "h": false}, {"x": "押金是兩個月（18,000 元），利率用題目給的一年期定存 2%：18,000×2%＝360", "h": true}, {"x": "年實質租金 108,000＋360＝108,360 元", "h": false}, {"x": "經濟租金定義：正常市場下之合理租金", "h": false}, {"x": "經濟租金＝支付租金÷0.9，不是×0.9，也不用實質租金還原", "h": true}, {"x": "年經濟租金 108,000÷0.9＝120,000 元；三者大小排序", "h": false}], "mn": "支付＝9,000×12＝108,000 → 實質＝＋押金收益 360＝108,360 → 經濟＝支付÷0.9＝120,000"}, {"id": "e110-2", "no": "110年第二題", "t": "經紀人如何提供租戶租金估計建議（社會住宅包租代管）", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "租金估計", "q": "社會住宅包租代管的政策讓不動產經紀人投入租賃仲介，根據不動產估價技術規則規定，不動產經紀人要如何提供租戶租金估計建議？試敘述分析之。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>經紀人向租戶提供租金估計建議，應依技術規則以<b>實質租金</b>為原則（<span class=\"art\">§130</span>），考量<span class=\"art\">§129</span>各因素，並區分<b>新訂</b>（<span class=\"art\">§132</span>）與<b>續訂</b>（<span class=\"art\">§133</span>）租約分別估計（<span class=\"art\">§131</span>）。新訂租約目標為正常租金，續訂租約屬限定租金。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§129</span>：考慮契約內容、租期長短、使用目的、稅費負擔、租金水準、變遷狀態、租約更新、變更條件及其他相關因素。</span><span class=\"evli\"><span class=\"art\">§130</span>：實質租金＝每期支付之租金，加計押金或保證金、權利金及其他相關運用收益之總數。</span><span class=\"evli\"><span class=\"art\">§131</span>：新訂與續訂分別估計；</span><span class=\"evli\"><span class=\"art\">§132</span>新訂3種、<span class=\"art\">§133</span>續訂4種。</span><span class=\"evli\"><span class=\"art\">§2⑤</span>正常租金；</span><span class=\"evli\"><span class=\"art\">§2⑥</span>限定租金。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）基本規定（<span class=\"art\">§129</span>～<span class=\"art\">§131</span>）</p><p>建議時應以實質租金與市場比較；管理費、水電負擔屬<span class=\"art\">§129</span>稅費負擔，另行說明。</p></div><div class=\"evp\"><p class=\"evh\">（二）新訂租約（<span class=\"art\">§132</span>）</p><p>1. 以新訂租約之租賃實例為比較標的，運用比較法；2. 勘估標的價格×租金收益率＋必要費用；3. 分析企業經營總收入之淨收益＋必要費用（教材稱企業經營收入分析法）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>（實務）蒐集同一供需圈內類似條件之新訂租賃實例。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）續訂租約（<span class=\"art\">§133</span>）</p><p>1. 續訂租賃實例比較法；2. 正常價格×續租租金收益率＋必要費用；3. 原契約租金淨收益依變動趨勢調整＋必要費用；4. 原契約租金與市場經濟租金差額中應歸屬出租人之適當部分，加計契約租金（教材稱差額分配法，僅用於續訂）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>租戶續約時，應提醒續訂租金屬限定租金，不必然等於新訂市場租金。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）建議步驟（教材／實務）</p><p>蒐集並查證租賃實例→篩選條件相近者→調整差異並換算為實質租金→提供合理區間而非單一數字，並說明資料來源與限制。</p><p class=\"evx\"><span class=\"evt\">例</span><span>社會住宅包租代管之租金條件可能依政策計畫約定，應向租戶說明約定租金與市場租金之差異。</span></p><p>（教材／實務）經紀人之租金估計屬行情參考建議，並非估價師簽證之估價報告。</p></div>", "<span class=\"blk-l\">四、結論</span><p>經紀人提供租戶租金建議，應以實質租金為原則，考量契約內容、租期、稅費負擔等因素，區分新訂（<span class=\"art\">§132</span>）與續訂（<span class=\"art\">§133</span>）租約，採租賃實例比較法等方法調整後求得合理租金區間，並說明實質租金構成、稅費負擔及資料限制。</p>"], "ck": [{"x": "§129 考慮因素（契約內容、租期、使用目的、稅費負擔等）", "h": false}, {"x": "§130 以實質租金為原則（含押金、保證金、權利金）", "h": true}, {"x": "§131 新訂與續訂租約分別估計", "h": false}, {"x": "§132 新訂租約三法", "h": false}, {"x": "差額分配法只適用續訂租約（§133）", "h": true}, {"x": "同時說明押金、管理費等實質負擔，並與市場租金比較", "h": false}, {"x": "提供合理區間並說明資料來源與限制；屬行情參考、非估價報告", "h": true}, {"x": "結論：實質租金為原則、分新訂續訂、給區間並說明限制", "h": false}], "mn": "考慮因素 §129 → 實質租金 §130 → 新訂續訂分開 §131 → 新訂三法 §132 → 給區間說限制"}, {"id": "e114-1", "no": "114年第一題", "t": "實質租金之意義＋租金估計應考慮之因素", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "租金估計", "q": "何謂實質租金？不動產租金之估計應考慮那些因素？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產租金估計，以估計勘估標的之<b>實質租金</b>為原則。實質租金係指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，即承租人承租該不動產之真實代價。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§130</span>：實質租金之意義。</span><span class=\"evli\"><span class=\"art\">§129</span>：租金估計應考慮之因素。</span><span class=\"evli\"><span class=\"art\">§131</span>：租金估計應視新訂租約與續訂租約分別為之；</span><span class=\"evli\"><span class=\"art\">§132</span>新訂3種方法、<span class=\"art\">§133</span>續訂4種方法（含差額分配法）。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p>（一）實質租金＝每期支付租金＋押金或保證金、權利金及其他相關運用收益。（教材）押金、保證金於租期屆滿要返還，只計其運用收益（押金×利率）；權利金不返還，計其每期攤提額及運用收益。</p></div><div class=\"evp\"><p class=\"evh\">（二）應考慮之因素（<span class=\"art\">§129</span>）</p><p>1. 契約內容：押金、免租期、優惠條件等契約約定。2. 租期長短：長期租約與短期租約之租金水準不同。3. 使用目的：住宅、商業、辦公等用途不同。4. 稅費負擔：地價稅、房屋稅、管理費、修繕費等由何方負擔。5. 租金水準：同一供需圈內類似不動產之市場租金。6. 變遷狀態：租金水準隨時間、環境變動之趨勢。7. 租約更新：（教材舉例）續約時租金的調整方式與更新條件。8. 變更條件：（教材舉例）租賃期間用途、面積、設備等之變更約定。9. 其他相關因素。</p></div>", "<span class=\"blk-l\">四、結論</span><p>實質租金反映承租之真實代價，為租金估計之原則；租金估計應考慮上述因素，並區分新訂與續訂租約分別估計，兼顧市場與既有關係。</p>"], "ck": [{"x": "§130 租金估計以實質租金為原則", "h": false}, {"x": "實質租金＝每期租金＋押金或保證金、權利金及其他相關運用收益之總數", "h": true}, {"x": "點出是承租的真實代價", "h": false}, {"x": "§129 因素逐項列全（契約、租期、目的、稅費、水準、變遷、更新、變更條件）", "h": true}, {"x": "各因素舉例說明（如稅費負擔：地價稅、房屋稅、管理費、修繕費）", "h": false}, {"x": "§131 新訂與續訂分別估計；§132 三種、§133 四種", "h": true}, {"x": "子題一給實質租金一句定義", "h": false}, {"x": "子題二給因素一句答案並帶出 §131", "h": false}], "mn": "§130 實質租金（租金＋押金・權利金運用收益）→ §129 七類因素 → §131 新訂 §132／續訂 §133"}, {"id": "mk-c3-1", "no": "綜合模擬卷三 申論一", "t": "實質租金原則＋新訂／續訂租金估計＋實質租金計算", "lv": "本站模擬卷・參考（B級）", "k": "mkc", "tier": 1, "g": "租金估計", "q": "試依「不動產估價技術規則」說明租金估計應以何種租金為原則及其定義；並說明新訂租約與續訂租約之租金估計方式各有哪些。另就下列資料求算該租約之實質租金：月租金30,000元、押金600,000元、權利金240,000元，押金及權利金之運用收益率以年利率2%計。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>租金估計，以估計<b>實質租金</b>為原則。實質租金＝承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數；支付租金只是其中的第一項，不可只算月租。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§130</span>：租金估計以實質租金為原則及其定義。</span><span class=\"evli\"><span class=\"art\">§131</span>：新訂租約與續訂租約之租金估計目的與資料不同，應分別估計。</span><span class=\"evli\"><span class=\"art\">§132</span>：新訂租約租金估計方式三種。</span><span class=\"evli\"><span class=\"art\">§133</span>：續訂租約租金估計方式四種。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）新訂租約（<span class=\"art\">§132</span>）</p><p>1.以新訂租約實例資料，運用比較法估計；2.以價格乘以租金收益率估計淨收益，再加計必要費用；3.分析企業經營總收入，估計淨收益再加計必要費用。</p></div><div class=\"evp\"><p class=\"evh\">（二）續訂租約（<span class=\"art\">§133</span>）</p><p>1.以續訂租約實例資料，運用比較法估計；2.以正常價格為基礎，乘以續租租金收益率，估計淨收益再加計必要費用；3.以原契約租金淨收益，依變動趨勢調整；4.分析原契約租金與市場經濟租金之差額中應歸屬出租人之適當部分，加計契約租金（<b>差額分配法</b>）。新訂②用「價格」、續訂②用「價格日期之正常價格」，差額分配法專屬續訂租約。</p></div><div class=\"evp\"><p class=\"evh\">（三）計算</p><p>押金與權利金之運用收益（年）＝（600,000＋240,000）×2%＝16,800元；年實質租金＝30,000×12＋16,800＝<b>376,800元</b>；月實質租金＝376,800÷12＝<b>31,400元</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>本題實質租金為每月31,400元（每年376,800元），較支付租金高出的部分，即押金與權利金之運用收益。</p>"], "ck": [{"x": "§130 租金估計以實質租金為原則", "h": false}, {"x": "實質租金＝支付租金＋押金或保證金、權利金及其他相關運用收益之總數", "h": true}, {"x": "§131 新訂租約與續訂租約應分別估計", "h": false}, {"x": "§132 新訂三種：比較法、價格×租金收益率＋必要費用、企業經營總收入", "h": false}, {"x": "§133 續訂四種，第四種差額分配法專屬續訂租約", "h": true}, {"x": "運用收益＝(600,000＋240,000)×2%＝16,800 元（押金、權利金都要算）", "h": true}, {"x": "年實質租金 376,800 元；月實質租金 31,400 元", "h": false}], "mn": "實質＝支付＋運用收益 → 新三（§132）續四（§133）→ 84萬×2%＝16,800 → 376,800 → 31,400"}, {"id": "pred-5", "no": "115預測⑤", "t": "支付／實質／經濟租金計算＋租金估計方式", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "租金估計", "q": "何謂支付租金、實質租金、經濟租金？某乙以低於市場行情5%之租金承租店面，約定月租金12,000元、押金3個月，當年一年期定存利率1.5%，試分別計算其年支付租金、實質租金及經濟租金。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p><b>支付租金</b>為承租人依契約實際支付之租金額（不含押金運用收益）；<b>實質租金</b>為承租人承租之真實代價；<b>經濟租金</b>為標的不動產於正常市場狀況下應有之合理租金水準（市場租金）。三者區分在於是否計入押金等運用收益、是否反映市場水準。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§130</span>：實質租金為支付租金加計押金或保證金、權利金及其他相關運用收益之總數。</span><span class=\"evli\"><span class=\"art\">§132</span>：新訂租約估計方式3種。</span><span class=\"evli\"><span class=\"art\">§133</span>：續訂租約估計方式4種（含差額分配法）。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）年支付租金</p><p>公式：月租金×12</p><p>代入：12,000×12</p><p>結果：<b>144,000元</b></p></div><div class=\"evp\"><p class=\"evh\">（二）年實質租金（<span class=\"art\">§130</span>）</p><p>公式：支付租金＋押金運用收益（押金×利率）</p><p>代入：押金運用收益＝(12,000×3)×1.5%＝36,000×1.5%＝540元；144,000＋540</p><p>結果：<b>144,540元</b></p></div><div class=\"evp\"><p class=\"evh\">（三）年經濟租金</p><p>公式：低於行情5%→支付租金＝經濟租金×95%，故經濟租金＝支付租金÷0.95</p><p>代入：144,000÷0.95</p><p>結果：≈<b>151,579元</b></p><p class=\"evx\"><span class=\"evt\">例</span><span>經濟租金以支付租金還原，不是以實質租金還原，因押金運用收益屬個案契約條件，不反映市場水準；101年原題（月租9,000、押2個月、利率2%、低一成）即同一題型。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）租金估計方式</p><p>新訂租約（<span class=\"art\">§132</span>，3種）：<span class=\"evli\">①新訂租賃實例比較法 </span><span class=\"evli\">②勘估標的價格×租金收益率＋必要費用 </span><span class=\"evli\">③分析企業經營總收入之淨收益＋必要費用。</span></p><p>續訂租約（<span class=\"art\">§133</span>，4種）：<span class=\"evli\">①續訂租賃實例比較法 </span><span class=\"evli\">②價格日期之正常價格×租金收益率＋必要費用 </span><span class=\"evli\">③原契約租金依租金變動趨勢調整＋必要費用 </span><span class=\"evli\">④差額分配法。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>差額分配法取原契約租金與市場經濟租金差額中應歸出租人之適當部分，加計契約租金，僅適用續訂。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>本例年支付租金144,000元、實質租金144,540元、經濟租金約151,579元，三者由低至高排列。租金估計應以實質租金掌握承租真實代價；新訂與續訂租約之估計方式數（3種vs4種）及差額分配法僅適用續訂，為命題陷阱點。</p>"], "ck": [{"x": "三種租金定義：支付、實質（加押金運用收益）、經濟（市場租金）", "h": false}, {"x": "年支付租金 12,000×12＝144,000", "h": false}, {"x": "押金運用收益 36,000×1.5%＝540；實質租金 144,540", "h": false}, {"x": "經濟租金 144,000÷0.95≈151,579", "h": true}, {"x": "經濟租金以支付租金還原，不以實質租金還原", "h": true}, {"x": "三數字由低至高：144,000＜144,540＜151,579", "h": false}, {"x": "§132 新訂 3 種", "h": false}, {"x": "§133 續訂 4 種", "h": false}, {"x": "差額分配法只屬續訂；分析企業經營總收入只屬新訂", "h": true}], "mn": "支付 144,000 → ＋押金 540＝實質 144,540 → ÷0.95＝經濟 151,579 → 新訂 3、續訂 4（差額分配法只續訂）"}, {"id": "e101-1", "no": "101年第一題", "t": "三種主要估價方法之意義與估價程序", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "不動產估價技術規則規定有那三種主要估價方法？試說明之，並敘述其估價之程序。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產估價技術規則所定三種主要估價方法為<b>比較法、收益法與成本法</b>，分別以市場比較、未來收益折算、重建成本扣除折舊求取價格。三法各有法定程序，並應兼採兩種以上方法、比較調和後決定最終價格。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§18</span> 比較法；</span><span class=\"evli\"><span class=\"art\">§28</span>、<span class=\"art\">§29</span>、<span class=\"art\">§31</span> 收益法；</span><span class=\"evli\"><span class=\"art\">§48</span> 成本法。</span><span class=\"evli\"><span class=\"art\">§21</span>、<span class=\"art\">§34</span>、<span class=\"art\">§49</span>：三法估價程序。</span><span class=\"evli\"><span class=\"art\">§14</span>：兩種以上方法；</span><span class=\"evli\"><span class=\"art\">§15</span>：比較調和並敘明理由。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）比較法（<span class=\"art\">§18</span>）</p><p>以比較標的價格為基礎，經比較、分析及調整，推算勘估標的價格，得比較價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>住宅交易實例多（教材）；農場或牧場以比較法估價為原則（<span class=\"art\">§93</span>）。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）收益法（<span class=\"art\">§28</span>）</p><p>直接資本化法以未來平均一年期間之客觀淨收益，應用適當之收益資本化率推算（<span class=\"art\">§29</span>）；折現現金流量分析法將各期淨收益及期末價值以適當折現率折現加總（<span class=\"art\">§31Ⅰ</span>），得適用於投資評估（<span class=\"art\">§31Ⅱ</span>），得收益價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>辦公大樓、店面、旅館（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）成本法（<span class=\"art\">§48</span>）</p><p>求取價格日期之重建成本或重置成本，扣減累積折舊額或其他應扣除部分，得成本價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建物估價以成本法為原則（<span class=\"art\">§108</span>）。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）估價程序</p><p>1.比較法（<span class=\"art\">§21</span>）六步：蒐集並查證比較標的資料→選擇條件相同或相似之比較標的→情況調整及價格日期調整→比較區域因素及個別因素差異，求取調整率或調整額→計算試算價格→決定比較價格。</p><p>2.收益法（<span class=\"art\">§34</span>）六步：蒐集總收入、總費用及收益資本化率或折現率資料→推算有效總收入→推算總費用→計算淨收益→決定收益資本化率或折現率→計算收益價格。</p><p>3.成本法（<span class=\"art\">§49</span>）八步：蒐集資料→現況勘察→調查、整理、比較及分析各項成本及費用→推算營造或施工費→推算其他各項費用及利潤→計算總成本→計算建物累積折舊額→計算成本價格。</p></div><div class=\"evp\"><p class=\"evh\">（五）方法併用</p><p>依<span class=\"art\">§14</span>應以兩種以上方法估價；依<span class=\"art\">§15</span>檢討差異後調和決定並敘明理由。</p></div>", "<span class=\"blk-l\">四、結論</span><p>三種主要估價方法為比較法、收益法與成本法，分別求得比較價格、收益價格與成本價格，並依<span class=\"art\">§21</span>六步、<span class=\"art\">§34</span>六步、<span class=\"art\">§49</span>八步之程序進行。實務上應併用兩種以上方法並調和，以確保估價合理。</p>"], "ck": [{"x": "§18 比較法意義與比較價格", "h": false}, {"x": "§28 收益法含直接資本化法與 DCF，所得收益價格", "h": false}, {"x": "§48 成本法：重建或重置成本扣除累積折舊額，所得成本價格", "h": false}, {"x": "§21 比較法六步，順序正確", "h": false}, {"x": "§34 收益法六步，順序正確", "h": false}, {"x": "§49 成本法八步（步數與其他兩法不同）", "h": true}, {"x": "§14 兼採兩種以上方法、§15 比較調和並敘明理由", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "三法三價（§18・§28・§48）→ 比較六步（§21）→ 收益六步（§34）→ 成本八步（§49）→ §14 兩種以上、§15 調和"}, {"id": "e103-1", "no": "103年第一題", "t": "影響不動產價格之因素＋比較法估價程序＋兩者之關聯", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "影響不動產價格的因素有那些？（10分）又比較法的估價程序為何？（10分）並請說明此兩者之間的關聯性。（5分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>影響不動產價格之因素，依<span class=\"art\">§2</span>分為<b>一般因素、區域因素、個別因素</b>三類。比較法則依<span class=\"art\">§21</span>六步驟推算比較價格，其中調整步驟正是將三類因素之差異逐項量化，兩者因而密切相關。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>：三類因素定義。</span><span class=\"evli\"><span class=\"art\">§11②</span>：應蒐集三類因素資料。</span><span class=\"evli\"><span class=\"art\">§21</span>：比較法程序。</span><span class=\"evli\"><span class=\"art\">§19③④</span>：區域、個別因素調整。</span><span class=\"evli\"><span class=\"art\">§24</span>：百分率法或差額法。</span><span class=\"evli\"><span class=\"art\">§25</span>：調整率上限。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）影響價格之因素（<span class=\"art\">§2</span>）</p><p>1.一般因素：對不動產市場及其價格水準發生全面影響之自然、政治、社會、經濟等共同因素。</p><p class=\"evx\"><span class=\"evt\">例</span><span>利率、景氣、人口、法令稅制。</span></p><p>2.區域因素：影響近鄰地區不動產價格水準之因素。</p><p class=\"evx\"><span class=\"evt\">例</span><span>交通、公共設施、生活機能、使用管制。</span></p><p>3.個別因素：不動產因受本身條件之影響而產生價格差異之因素。</p><p class=\"evx\"><span class=\"evt\">例</span><span>面積、形狀、臨路、樓層、屋齡。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）比較法估價程序（<span class=\"art\">§21</span>）</p><p>蒐集並查證比較標的資料→選擇與勘估標的條件相同或相似之比較標的→進行情況調整及價格日期調整→比較區域因素及個別因素之差異，求取調整率或調整額→計算試算價格→決定比較價格。</p></div><div class=\"evp\"><p class=\"evh\">（三）兩者之關聯</p><p>1.條文連結：依<span class=\"art\">§11②</span>估價應蒐集三類因素資料；<span class=\"art\">§21Ⅰ④</span>比較法第四步即比較、分析區域因素及個別因素之差異，求取調整率或調整額。</p><p>2.對應關係（教材整理，非條文）：一般因素影響價格水準隨時間變動，對應價格日期調整；區域因素對應區域因素調整（比較標的不在同一近鄰地區時，<span class=\"art\">§19③</span>）；個別因素對應個別因素調整（<span class=\"art\">§19④</span>）；情況調整則處理交易條件是否正常。</p><p class=\"evx\"><span class=\"evt\">例</span><span>比較標的位於另一近鄰地區，須先就交通、公設差異作區域因素調整。</span></p><p>3.調整方法與界限：依<span class=\"art\">§24</span>以百分率法為原則，亦得以差額法；依<span class=\"art\">§25</span>，區域或個別因素單獨項目調整率大於百分之十五，或總調整率大於百分之三十時，判定差異過大，應排除該比較標的。</p></div>", "<span class=\"blk-l\">四、結論</span><p>影響價格因素分為一般、區域、個別三類；比較法依<span class=\"art\">§21</span>六步驟進行，其調整步驟正是將三類因素之差異逐項量化，並受<span class=\"art\">§25</span>調整率上限之限制。因素分析之正確與否，直接決定比較法調整之合理性與估價結果。</p>"], "ck": [{"x": "§2 三類因素：一般、區域、個別，各寫定義", "h": false}, {"x": "各類舉例（利率景氣／交通公共設施／面積臨路屋齡）", "h": false}, {"x": "§21 六步驟完整且依序", "h": true}, {"x": "第三步是情況調整及價格日期調整；第四步比較區域及個別因素", "h": true}, {"x": "一般→價格日期調整；區域→區域因素調整；個別→個別因素調整", "h": false}, {"x": "情況調整處理交易條件是否正常，須查證", "h": false}, {"x": "結論：調整步驟逐項量化三類因素差異", "h": false}], "mn": "三類因素（一般・區域・個別）→ 六步驟（蒐集→選標的→調整→比較→試算→決定）→ 因素對應調整項目", "hp": 10, "hpl": "高"}, {"id": "e103-2", "no": "103年第二題", "t": "不動產價格種類＋已設定地上權土地之價格與估價方式", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "依不動產估價技術規則之規定，不動產價格有那些種類？（10分）基於公有土地資源永續利用，政府對公有大面積土地皆以設定地上權方式釋出，請說明評估已設定地上權的土地是評估那一種價格？（5分）又設定地上權土地的估價方式有那些？請說明之。（10分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>技術規則之價格分<b>正常、限定、特定、特殊</b>四種。已設定地上權之土地評估何種價格，須視買受人是否為地上權人而定；其估價方式，條文僅列考慮因素，方法多屬教材／實務做法。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>、<span class=\"art\">§6</span>：四種價格。土地法<span class=\"art\">§104Ⅰ</span>：地上權人優先購買權。</span><span class=\"evli\"><span class=\"art\">§115</span>：權利估價考慮因素。</span><span class=\"evli\"><span class=\"art\">§116</span>：地上權估價考慮因素。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）價格種類（<span class=\"art\">§2</span>、<span class=\"art\">§6</span>）</p><p>1.正常價格：具市場性之不動產，於有意願之買賣雙方，依專業知識、謹慎行動，不受脅迫，經適當市場行銷及正常交易條件形成之合理價值。</p><p>2.限定價格：以其他權利與所有權合併、以不動產合併為目的，或以違反經濟合理性之分割為前提所形成之價值。</p><p>3.特定價格：具市場性之不動產，基於特定條件下形成之價值，須敘明估價條件並同時估計正常價格。</p><p>4.特殊價格：對不具市場性之不動產所估計之價值。</p></div><div class=\"evp\"><p class=\"evh\">（二）已設定地上權土地評估何種價格</p><p>1.買受人為地上權人：依土地法<span class=\"art\">§104Ⅰ</span>地上權人有優先購買權，買受後地上權與所有權合併，屬所有權以外其他權利與所有權合併，評估<b>限定價格</b>。</p><p>2.公開標售、不限資格並競價成交：評估<b>正常價格</b>，由投標者就地上權負擔自行判斷。</p></div><div class=\"evp\"><p class=\"evh\">（三）設定地上權土地之估價方式</p><p>1.<span class=\"art\">§115</span>、<span class=\"art\">§116</span>僅列考慮因素，未規定估價方法。</p><p>2.底地（教材／實務）：扣除法＝素地正常價格－地上權剩餘價值；收益法＝存續期間地租收入現值＋期滿收回素地價值之現值；比較法以底地買賣實例比較。</p><p>3.地上權價格（教材／實務）：市價比較法、價格比率法、設定實例比較法、差額租金還原法。差額租金還原法：P＝a×[(1＋r)ⁿ－1]÷[r×(1＋r)ⁿ]，a＝正常（經濟）地租－實付地租，r＝收益資本化率，n＝地上權剩餘年限。</p></div>", "<span class=\"blk-l\">四、結論</span><p>不動產價格分正常、限定、特定、特殊四種；已設定地上權之土地，買受人為地上權人評估限定價格，一般競標評估正常價格。底地得以扣除法、收益法、比較法求取（教材／實務），並依<span class=\"art\">§115</span>、<span class=\"art\">§116</span>所列因素估計地上權價格。</p>"], "ck": [{"x": "§2 四種價格定義：正常、限定、特定、特殊", "h": false}, {"x": "限定價格三個限定條件（權利與所有權合併、不動產合併、不合理分割）", "h": false}, {"x": "特定價格須敘明估價條件並同時估正常價格（§6）", "h": true}, {"x": "買受人為地上權人 → 限定價格；公開競標 → 正常價格，並寫出理由", "h": true}, {"x": "先寫四種價格定義，再依買受人身分下判斷", "h": true}, {"x": "土地價格＝素地正常價格－地上權剩餘價值", "h": false}, {"x": "§116 地上權估價考慮因素五項", "h": false}, {"x": "四種估法；差額租金還原法公式與符號 a、r、n", "h": false}], "mn": "四種價格（正常・限定・特定・特殊）→ 地上權人買＝限定、競標＝正常 → 素地價格－地上權剩餘價值 → §116 因素 → 四種估法", "hp": 1037, "hpl": "中"}, {"id": "e106-1", "no": "106年第一題", "t": "都市計畫住宅區可立即開發建地之估價方法與程序", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "有一宗位於都市計畫住宅區可立即開發之建地，請問應如何評估其價格？請詳述採用之方法及其運用程序。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>都市計畫住宅區可立即開發之建地，依最有效使用應為開發建築，屬以進行開發為前提之宗地，應以<b>土地開發分析法</b>為主，並以比較法交叉檢驗，依<span class=\"art\">§14</span>、<span class=\"art\">§15</span>調和決定土地價格。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§87</span>：開發前提之宗地採土地開發分析法。</span><span class=\"evli\"><span class=\"art\">§71</span>：八步驟。</span><span class=\"evli\"><span class=\"art\">§73</span>～<span class=\"art\">§80</span>：勘察、面積、銷售金額、成本、利率。</span><span class=\"evli\"><span class=\"art\">§81</span>：價格公式。</span><span class=\"evli\"><span class=\"art\">§21</span>、<span class=\"art\">§27</span>：比較法程序。</span><span class=\"evli\"><span class=\"art\">§14</span>、<span class=\"art\">§15</span>：兩種以上方法並調和。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）方法選擇</p><p>依<span class=\"art\">§87</span>，本宗可立即開發，以土地開發分析法為主；住宅區建地交易較多，以比較法為輔。</p><p class=\"evx\"><span class=\"evt\">例</span><span>以類似建地交易交叉檢驗。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）土地開發分析法程序（<span class=\"art\">§71</span>）</p><p>確定開發內容及時間→調查成本費用並蒐集市場行情→現況勘察並調查環境發展程度→估算可銷售面積→估算總銷售金額→估算各項成本→選擇利潤率及資本利息綜合利率→計算土地開發分析價格。</p></div><div class=\"evp\"><p class=\"evh\">（三）步驟要點</p><p>1.現況勘察：確認<b>勘估標的</b>之工程進度、施工及環境狀況並攝製必要照片或影像檔（<span class=\"art\">§73</span>），寫成比較標的即錯。</p><p>2.可銷售面積：依建照圖說；未取得時按最有效使用估算（<span class=\"art\">§74</span>）。</p><p>3.總銷售金額：可銷售面積×推定銷售單價，單價以比較法或收益法求取（<span class=\"art\">§75</span>）。</p><p>4.成本：直接成本為營造或施工費；間接成本為規劃設計費、廣告費、銷售費、管理費、稅捐及其他負擔（<span class=\"art\">§76</span>）；廣告、銷售、管理費及稅捐按總銷售金額乘以費率（<span class=\"art\">§77</span>）。</p><p>5.資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1／2）×開發年數（<span class=\"art\">§79</span>）；開發年數自價格日期起至開發完成為止（<span class=\"art\">§80</span>）。</p><p>6.公式（<span class=\"art\">§81</span>）：V＝S÷(1＋R)÷(1＋i)－(C＋M)。S為總銷售金額，R為利潤率，i為資本利息綜合利率，C為直接成本，M為間接成本。</p></div><div class=\"evp\"><p class=\"evh\">（四）比較法程序（<span class=\"art\">§21</span>）</p><p>蒐集查證比較標的→選擇相同或相似者（至少三件，<span class=\"art\">§27</span>）→情況及價格日期調整→區域與個別因素比較→試算價格→比較價格。</p></div>", "<span class=\"blk-l\">四、結論</span><p>本宗建地應以土地開發分析法為主，依<span class=\"art\">§71</span>八步驟估算銷售金額、成本、利潤與資本利息，代入<span class=\"art\">§81</span>公式求得土地價格，並以比較法交叉檢驗，依<span class=\"art\">§14</span>、<span class=\"art\">§15</span>調和決定。</p>"], "ck": [{"x": "§87 以開發為前提之宗地，以土地開發分析法為主，參酌比較法或收益法", "h": false}, {"x": "說明為何為主：住宅區、可立即開發、最有效使用為開發建築", "h": false}, {"x": "§14 兩種以上方法；§15 比較、調和決定價格", "h": true}, {"x": "§71 八步驟依序寫完", "h": true}, {"x": "§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M)，並寫符號", "h": false}, {"x": "§21 比較法程序；§27 至少三件", "h": false}, {"x": "結論：土開法為主、比較法交叉檢驗、§14§15 調和", "h": false}], "mn": "方法（§87 土開為主、比較輔、§14§15）→ 八步 §71（定調勘面＋S→C+M→R、i→V）→ 公式 §81 → 比較法 §21", "hp": 1026, "hpl": "中"}, {"id": "e108-2", "no": "108年第二題", "t": "數筆土地合併開發利用之估價方式與方法", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "數筆土地合併開發利用，應如何估價？應採用何種估價方法？請詳述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>數筆土地合併開發利用，應<b>以合併後土地為一宗整體估價</b>，再依合併前各筆土地價值比例分算各筆價格。因以不動產合併為目的，屬限定價格；方法以土地開發分析法為主，比較法、收益法為輔。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§83</span>：合併前提，考慮前後價格變動。</span><span class=\"evli\"><span class=\"art\">§84</span>：合併後估價、按比例分算。</span><span class=\"evli\"><span class=\"art\">§2</span>、<span class=\"art\">§6</span>：限定價格。</span><span class=\"evli\"><span class=\"art\">§87</span>、<span class=\"art\">§81</span>：土地開發分析法。</span><span class=\"evli\"><span class=\"art\">§23</span>：合併使用交易之調整。</span><span class=\"evli\"><span class=\"art\">§14</span>、<span class=\"art\">§15</span>：兩種以上方法並調和。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）估價方式</p><p>1.依<span class=\"art\">§83</span>，應考慮合併前後價格變動而酌量增減。</p><p>2.依<span class=\"art\">§84Ⅰ</span>，以合併後土地估價，並以合併前各筆價值比例分算；依<span class=\"art\">§84Ⅱ</span>，非以合併為目的之相連土地，屬同一所有權人者比照（要件是非以合併為目的，不是未合併使用）。</p><p>3.價格種類：以不動產合併為目的，屬限定價格（<span class=\"art\">§2</span>），報告書須註明（<span class=\"art\">§6</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）估價方法</p><p>1.土地開發分析法為主：合併後以開發為前提，依<span class=\"art\">§87</span>、<span class=\"art\">§81</span>估價，並參酌比較法或收益法。</p><p>2.比較法、收益法為輔：比較標的屬畸零地或有合併使用之交易者，應先作適當調整；無法有效掌握及量化調整時，不予採用（<span class=\"art\">§23</span>第五款）。</p><p>3.依<span class=\"art\">§14</span>採兩種以上方法，依<span class=\"art\">§15</span>比較調和。</p></div><div class=\"evp\"><p class=\"evh\">（三）運用程序（教材／實務）</p><p>擬定合併後開發計畫→以土地開發分析法估算整體價格V＝S÷(1＋R)÷(1＋i)－(C＋M)→估計合併前各筆單獨價值求比例→依比例分算。</p><p>例（教材示例）：甲地1,000萬元、乙地500萬元，合併後整體1,800萬元，甲分得1,800×1,000÷1,500＝1,200萬元，乙分得600萬元。</p></div><div class=\"evp\"><p class=\"evh\">（四）合併增值（學理名詞）</p><p>整體價值常高於單獨價值總和，各筆依比例分享；畸零地等條件須反映於合併前價值比例。</p></div>", "<span class=\"blk-l\">四、結論</span><p>數筆土地合併開發利用，應以合併後之土地為一宗估價，採土地開發分析法為主，並參酌比較法或收益法求得整體價格，再依合併前各筆土地價值比例分算（<span class=\"art\">§84</span>）。此屬限定價格，須於報告書載明，維持透明。</p>"], "ck": [{"x": "§83 合併前提須考慮前後價格變動", "h": false}, {"x": "§84 以合併後土地為一宗估價，按合併前各筆價值比例分算", "h": true}, {"x": "§84 毗連同一所有權人者亦同", "h": false}, {"x": "屬限定價格（§2），須註明價格種類（§6）", "h": true}, {"x": "§87 土地開發分析法為主，§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M)", "h": false}, {"x": "§14 兩種以上方法、§15 綜合比較；比較法收益法為輔", "h": true}, {"x": "運用程序：最有效使用→整體價→價值比例→分算", "h": false}, {"x": "子題一給整體估價再分算的一句答案", "h": false}, {"x": "子題二給方法主輔的一句答案", "h": false}], "mn": "§83 前後價差 → §84 合併整體估再分算 → 限定價格 §2・§6 → 開發法為主 §87・§81 → §14・§15 交叉檢驗"}, {"id": "e109-1", "no": "109年第一題", "t": "估價工作法則＋現場勘查事項＋委託人未領勘之處理", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "試說明不動產估價工作進行時，應留意那些工作法則？為確認勘估標的狀態，應到現場勘查之事項有那些？如委託人未領勘，確認標的狀態出現困難，應如何處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>估價工作法則，指技術規則總則（<span class=\"art\">§3</span>～<span class=\"art\">§7</span>）及作業程序章（<span class=\"art\">§13</span>、<span class=\"art\">§17</span>）要求估價師遵循之基本原則。本題三小題分別作答：工作法則、現場勘查事項（<span class=\"art\">§13</span>），以及委託人未領勘時應<b>於報告書敘明並說明不確定性</b>，而非拒絕估價。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§3</span>～<span class=\"art\">§7</span>：總則工作法則。</span><span class=\"evli\"><span class=\"art\">§13</span>：現場勘察事項及未領勘之敘明。</span><span class=\"evli\"><span class=\"art\">§16</span>：報告書載明須敘明之情況。</span><span class=\"evli\"><span class=\"art\">§17</span>：事實描述真實確切。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）工作法則</p><p>1.蒐集市場資訊（<span class=\"art\">§3</span>）：房地供需、環境變遷、人口、公共設施、交通、金融市場等。</p><p>2.蒐集並查證資料（<span class=\"art\">§4</span>）：詳予求證可靠性。</p><p class=\"evx\"><span class=\"evt\">例</span><span>向當事人、四鄰、地政機關、金融機構查證。</span></p><p>3.保持客觀（<span class=\"art\">§5</span>）：運用邏輯方法及經驗法則進行估價工作。</p><p>4.價格日期與種類（<span class=\"art\">§6</span>）：切合價格日期當時價值並註明價格種類；特定價格應敘明估價條件並同時估計正常價格。</p><p>5.面積（<span class=\"art\">§7</span>）：以登記面積為準；未登記或以部分面積估價者，應調查註明。</p><p>6.事實描述（<span class=\"art\">§17</span>）：真實確切、用語明確肯定。</p></div><div class=\"evp\"><p class=\"evh\">（二）現場勘查事項（<span class=\"art\">§13</span>）</p><p>1.確認勘估標的之基本資料及權利狀態。</p><p>2.調查勘估標的及比較標的之使用現況（及於比較標的者只有此款）。</p><p>3.確認影響價格之各項資料。</p><p>4.作成紀錄及攝製必要之照片或影像檔。</p><p>例（教材／實務）：勘察土地面積形狀臨路、建物構造屋齡及有無違建。</p></div><div class=\"evp\"><p class=\"evh\">（三）委託人未領勘之處理</p><p>1.盡力查證（教材／實務）：外部勘察、拍照，向鄰近居民、管理委員會、地政機關查證，核對登記謄本、使用執照。</p><p>2.於報告書敘明：無法確認範圍或無法進入室內勘察時，應於報告書敘明（<span class=\"art\">§13</span>），並依<span class=\"art\">§16</span>第一項第十三款載明。</p><p>3.依<span class=\"art\">§17</span>說明難以確定事項可能影響權利或價值之情形。</p><p>4.必要時請委託人補正或協助領勘（教材補充）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>估價人員應依總則蒐集並查證資料、保持客觀、載明價格日期與價格種類；現場應依<span class=\"art\">§13</span>確認基本資料、權利狀態、使用現況及影響價格資料並作成紀錄攝影。委託人未領勘者，應盡力查證，依<span class=\"art\">§13</span>於報告書敘明，並依<span class=\"art\">§17</span>說明難以確定事項之影響。</p>"], "ck": [{"x": "§3 蒐集市場資訊、§4 蒐集並查證資料、§5 保持客觀", "h": false}, {"x": "§6 價格日期與價格種類、§7 登記面積、§17 真實精確", "h": false}, {"x": "特定價格須同時估計正常價格（§6）", "h": false}, {"x": "§13 勘察勘估標的及比較標的：基本資料、權利、使用現況、價格因素", "h": false}, {"x": "勘察作成紀錄並攝製必要之照片或影像檔", "h": false}, {"x": "§13 無法確認範圍或無法進入室內須於報告書敘明", "h": false}, {"x": "§17 說明難以確定事項之可能影響", "h": true}, {"x": "盡力查證：外部勘察、拍照、向鄰居管委會地政查證、核對謄本", "h": false}, {"x": "三個子問題分別作答；不是拒絕估價", "h": true}], "mn": "法則 §3→§4→§5→§6→§7→§17 → 勘查 §13 → 未領勘：查證→敘明→假設", "hp": 13, "hpl": "高"}, {"id": "e112-1", "no": "112年第一題", "t": "凶殺事件屬影響價格因素之那一類＋是否影響價格", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "一棟12層大樓的第10層擬出售，該樓層在前一年於梯廳位置曾發生過凶殺致死案，請問該事件屬於影響不動產價格因素的那一類？是否會影響該層樓之價格？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">§2</span>，影響不動產價格之因素只有一般、區域、個別三類。凶殺致死案影響範圍僅及第10層，屬不動產因受本身條件影響而產生價格差異，為<b>個別因素</b>，且會使該層樓價格下降。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>：一般、區域、個別因素之定義。</span><span class=\"evli\"><span class=\"art\">§19</span>第四款：個別因素調整之定義。</span><span class=\"evli\"><span class=\"art\">§24</span>：調整以百分率法為原則，亦得以差額法，並於報告書敘明。</span><span class=\"evli\"><span class=\"art\">§30</span>：直接資本化法，收益價格＝客觀淨收益÷收益資本化率。</span><span class=\"evli\"><span class=\"art\">§23</span>第九款、<span class=\"art\">§19</span>第一款：受迷信影響之交易屬比較標的之情況調整。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）因素歸類</p><p>1.一般因素：對市場及價格水準發生全面影響之共同因素；區域因素：影響近鄰地區價格水準之因素；個別因素：不動產因受本身條件影響而產生價格差異之因素。</p><p>2.本題事件影響僅及該層，非全面影響，亦非影響近鄰地區價格水準，故屬個別因素。</p><p>3.事件發生在梯廳（共用部分），但歸類看的是影響該樓層本身的條件，不是事件是否發生在專有部分，兩者不衝突。</p></div><div class=\"evp\"><p class=\"evh\">（二）比較法</p><p>依<span class=\"art\">§19</span>第四款，個別因素調整係以比較標的價格為基礎，就個別因素不同所生價格差異逐項分析調整；依<span class=\"art\">§24</span>以百分率法為原則，亦得以差額法。</p><p class=\"evx\"><span class=\"evt\">例</span><span>第10層個別因素劣於比較標的，比較價格應<b>向下修正</b>。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）收益法</p><p>依<span class=\"art\">§30</span>，收益價格＝未來平均一年期間之客觀淨收益÷收益資本化率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>該層因事件乏人承租、租金下降，淨收益下降，收益價格隨之下降。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）補充（教材／實務）</p><p>梯廳雖為共用部分，縱非說明書就專有部分應記載之非自然死亡事項，惟為同層出入必經之處、事件距價格日期尚近，污名損失仍存。影響幅度須依市場資料判斷，不能憑空寫固定折減比率。</p></div><div class=\"evp\"><p class=\"evh\">（五）區辨</p><p><span class=\"art\">§23</span>第九款受迷信影響之交易，是比較標的成交情況不正常時之情況調整（<span class=\"art\">§19</span>第一款），與本題勘估標的本身條件所生之個別因素分屬兩事。</p></div>", "<span class=\"blk-l\">四、結論</span><p>該事件屬影響不動產價格因素中之個別因素，會使該層樓比較價格向下修正、收益價格下降，故會影響該層樓價格。事件雖發生於梯廳，惟為同層出入必經之處，污名損失仍存；影響幅度須依市場資料判斷。</p>"], "ck": [{"x": "一般、區域、個別三類因素定義", "h": false}, {"x": "事件發生在該樓層，只影響標的本身，故為個別因素", "h": true}, {"x": "說明為何不是一般因素（非全面）、區域因素（非近鄰地區）", "h": false}, {"x": "比較法：個別因素調整，以百分率或金額逐項調整", "h": false}, {"x": "比較價格向下修正", "h": false}, {"x": "收益法：租金下降→客觀淨收益下降；收益價格＝客觀淨收益÷收益資本化率", "h": false}, {"x": "比較法、收益法兩條路各說一次", "h": true}, {"x": "幅度依市場資料，不寫固定折減比率", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "三類因素 → 發生在該樓層＝個別因素 → 比較法向下修正 → 收益法租金↓淨收益↓價格↓ → 幅度看市場", "hp": 1035, "hpl": "中"}, {"id": "e114-2", "no": "114年第二題", "t": "估價方法選取原則＋三法適用時機", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "A篇概念", "q": "依據不動產估價技術規則之規定，不動產估價方法之選取原則為何？請說明比較法、收益法及成本法等估價方法的適用時機？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>估價方法之選取原則，係<b>兼採二種以上方法</b>，綜合比較、就顯著差異重新檢討後決定價格並敘明理由（<span class=\"art\">§14</span>、<span class=\"art\">§15</span>），另對特定標的規定以某法為原則。三法之適用時機，取決於有無比較實例、能否推估客觀淨收益、能否估算成本。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§14</span>：兼採二種以上方法。</span><span class=\"evli\"><span class=\"art\">§15</span>：綜合比較、敘明理由、證券化權重。</span><span class=\"evli\"><span class=\"art\">§108</span>、<span class=\"art\">§112</span>：成本法為原則。</span><span class=\"evli\"><span class=\"art\">§93</span>～<span class=\"art\">§95</span>、<span class=\"art\">§97</span>：比較法為原則。</span><span class=\"evli\"><span class=\"art\">§18</span>、<span class=\"art\">§28</span>、<span class=\"art\">§48</span>：三法意義及適用條件。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）選取原則</p><p>1.兼採二種以上（<span class=\"art\">§14</span>）；情況特殊不能採取且於報告書敘明者，不在此限。</p><p>2.綜合比較、敘明理由（<span class=\"art\">§15Ⅰ</span>）：顯著差異者重新檢討，視資料可信度及估價種類目的條件差異決定價格，非簡單平均。</p><p>3.特定標的：建物以成本法為原則（<span class=\"art\">§108</span>）；工事及水利土壤之改良以成本法為原則，得斟酌比較法及收益法（<span class=\"art\">§112</span>）；農場或牧場、鹽田、池沼、墓地、公共設施用地及保留地以比較法為原則（<span class=\"art\">§93</span>～<span class=\"art\">§95</span>、<span class=\"art\">§97</span>）。</p><p>4.證券化（<span class=\"art\">§15Ⅱ</span>）：以契約約定租金為信託利益分配基礎者，折現現金流量分析法賦予較大權重；清算時不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（二）適用時機</p><p>1.比較法（<span class=\"art\">§18</span>）：能於近鄰或類似地區蒐得性質相近、價格日期接近之實例（<span class=\"art\">§12</span>），並採三件以上（<span class=\"art\">§27</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>實務上常見於住宅、一般土地；交易稀少之特殊用途不動產不宜單獨採用（教材通說）。</span></p><p>2.收益法（<span class=\"art\">§28</span>）：能推估未來平均一年期間之客觀淨收益（<span class=\"art\">§29</span>）；折現現金流量分析法得適用於投資評估（<span class=\"art\">§31Ⅱ</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>實務上常見於出租中之辦公大樓、店面、旅館；自用、無收益者不宜單獨採用（教材通說）。</span></p><p>3.成本法（<span class=\"art\">§48</span>）：能求取重建成本或重置成本及累積折舊額。</p><p class=\"evx\"><span class=\"evt\">例</span><span>實務上常見於新建建物及學校、廟宇等特殊建物（教材通說）；土地價格求取有困難時，得改以比較法或收益法計算並敘明（<span class=\"art\">§69Ⅱ</span>）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>選取原則為兼採二種以上方法，綜合比較後決定價格並敘明理由（<span class=\"art\">§14</span>、<span class=\"art\">§15</span>）。三法適用時機：能蒐得三件以上實例者用比較法，具收益者用收益法，建物或缺乏實例與收益之特殊不動產用成本法。</p>"], "ck": [{"x": "§14 應兼採二種以上，但有「情況特殊並敘明」之但書", "h": true}, {"x": "§15Ⅰ 綜合比較、顯著差異重新檢討、依可信度決定並敘明理由", "h": false}, {"x": "最後價格不是簡單平均", "h": true}, {"x": "§15Ⅱ 證券化以契約租金為基礎者 DCF 加重權重（清算除外）", "h": false}, {"x": "特定標的原則：建物成本法（§108）、農鹽池墓公設比較法、工事土壤改良成本法（§112）", "h": false}, {"x": "三法定義與所得價格：比較價格（§18）、收益價格（§28）、成本價格（§48）", "h": false}, {"x": "三法適用時機，區分條文規定與教材歸納", "h": true}, {"x": "說明為何採此方法、為何不採另一方法", "h": false}], "mn": "§14 兼採二種以上 → §15 綜合比較・敘明理由 → 特定標的以某法為原則 → 三法適用時機"}, {"id": "mk-c4-1", "no": "綜合模擬卷四 申論一", "t": "估價程序八步驟、估價基準日（價格日期）與估價報告書應載明事項", "lv": "本站模擬卷・參考（B級）", "k": "mkc", "tier": 1, "g": "A篇概念", "q": "試依「不動產估價技術規則」說明估價師執行不動產估價之程序（步驟），並說明「估價基準日」之意義及其重要性。另依技術規則，說明估價報告書應記載之主要事項有哪些？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>估價程序，係估價師依<span class=\"art\">§8</span>所定八個程序執行估價。估價基準日，技術規則稱價格日期，係估算不動產價格之基準時點。估價報告書應載明事項規定於<span class=\"art\">§16</span>。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§8</span>：估價八程序。</span><span class=\"evli\"><span class=\"art\">§9</span>：估價基本事項。</span><span class=\"evli\"><span class=\"art\">§14</span>：原則兼採二種以上方法。</span><span class=\"evli\"><span class=\"art\">§15</span>：價格差異顯著者重新檢討。</span><span class=\"evli\"><span class=\"art\">§6Ⅰ</span>：「不動產估價，應切合價格日期當時之價值」；</span><span class=\"evli\"><span class=\"art\">§2</span>第7款定義價格日期。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）程序</p><p>①確定估價基本事項②擬定估價計畫③蒐集資料④確認勘估標的狀態⑤整理、比較、分析資料⑥運用估價方法推算勘估標的價格⑦決定勘估標的價格⑧製作估價報告書。</p></div><div class=\"evp\"><p class=\"evh\">（二）估價基準日之重要性</p><p>不動產價格隨市場條件變動，同一標的在不同時點之估算價格可能不同，故：1.決定適用之市場資料時間範圍；2.比較案例需進行價格日期調整；3.確保估價結果之時間一致性。</p></div><div class=\"evp\"><p class=\"evh\">（三）報告書應載明</p><p>委託人、勘估標的之基本資料、<b>價格日期及勘察日期</b>、價格種類、估價條件、估價目的、估價金額、所有權及他項權利與其他負擔狀態、使用現況、法定使用管制、價格形成之主要因素分析、估價方法之推算過程及決定理由、依本規則應敘明之情況、其他必要事項、估價師姓名及證照字號。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，估價依<span class=\"art\">§8</span>八程序進行，以價格日期為基準日，最後依<span class=\"art\">§16</span>十五款製作估價報告書。</p>"], "ck": [{"x": "§8 八程序依序寫出", "h": true}, {"x": "§14 原則兼採二種以上方法；§15 價格差異顯著者重新檢討", "h": false}, {"x": "估價基準日＝技術規則之價格日期（§2第7款定義、§9 基本事項）", "h": true}, {"x": "§6Ⅰ：不動產估價，應切合價格日期當時之價值", "h": false}, {"x": "重要性三點：資料時間範圍、價格日期調整、時間一致性", "h": false}, {"x": "§16 報告書應載明十五款", "h": false}, {"x": "第三款寫「價格日期及勘察日期」兩個日期", "h": true}], "mn": "基計蒐狀整估決書 → 基準日＝價格日期 → 報告書十五款", "hp": 17, "hpl": "高"}, {"id": "pred-8", "no": "115預測⑧", "t": "估價報告書應載明事項與估價條件、價格種類（§6、§16）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "A篇概念", "q": "甲受託評估一筆都市邊緣農地，委託人要求以「將來變更為建地」為前提評估價格。請依不動產估價技術規則說明：(一)此估價屬何種價格種類？報告書對估價條件及正常價格應如何處理？(二)估價報告書應載明哪些事項？(三)估價報告書交付前應有哪些程序及附件？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>委託人要求以將來變更為建地為前提估價，屬基於特定條件形成之價值，即<b>特定價格</b>；該前提即估價條件。依<span class=\"art\">§6</span>後段，須敘明估價條件並同時估計正常價格，報告書並應依<span class=\"art\">§16</span>載明十五款事項、簽章後交付。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§6Ⅰ</span>：價格四種、租金兩種。</span><span class=\"evli\"><span class=\"art\">§6</span>後段：特定價格敘明條件並同時估正常價格。</span><span class=\"evli\"><span class=\"art\">§16Ⅰ</span>：簽章交付。</span><span class=\"evli\"><span class=\"art\">§16Ⅱ</span>：十五款。</span><span class=\"evli\"><span class=\"art\">§16Ⅲ</span>：圖說。</span><span class=\"evli\"><span class=\"art\">§16Ⅳ</span>：執行案件例外。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）價格種類與估價條件</p><p>都市邊緣農地以「將來變更為建地」為前提，是基於特定條件形成之價值，屬特定價格，非正常價格。依<span class=\"art\">§6</span>後段，報告書須敘明該估價條件，並同時估計其正常價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>另估維持現行農地使用下之價格，讓委託人看出條件對價格之影響。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）應載明事項（<span class=\"art\">§16Ⅱ</span>十五款）</p><p>1.人事時地額（一～七款）：委託人、勘估標的之基本資料、價格日期及勘察日期、價格種類、估價條件、估價目的、估價金額。</p><p>2.權利與狀態（八～十款）：所有權、他項權利及其他負擔；使用現況；法定使用管制或其他管制事項。</p><p> 。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地上權</p><p>依<span class=\"art\">§116</span>所列因素估計；已設定地上權土地價格＝未設定地上權素地正常價格－價格日期當時地上權之剩餘價值（教材做法）。</p></div><div class=\"evp\"><p class=\"evh\">（二）差額租金還原法（教材常用做法）</p><p>公式：a＝每年淨收益－每年應付地租；P＝a×[(1＋r)ⁿ－1]÷[r×(1＋r)ⁿ]</p><p>代入：a＝90－30＝60萬；P＝60×[(1.04)²⁰－1]÷[0.04×(1.04)²⁰]＝60×13.5903</p><p>結果：地上權價格<b>≈815.4萬元</b></p><p>陷阱：直接用90萬會高估；n是地上權剩餘年限。</p></div><div class=\"evp\"><p class=\"evh\">（三）抵押權</p><p>依<span class=\"art\">§121</span>先估正常價格，再以實際債權額為基礎，考慮順位等因素調整，不是債權額本身。</p></div>", "<span class=\"blk-l\">四、結論</span><p>權利估價依<span class=\"art\">§114</span>涵蓋地上權至都更權利變換等；本題以差額租金60萬、資本化率4%、剩餘20年還原，地上權價格約815.4萬元；抵押權以債權額為基礎調整，反映擔保風險。</p>"], "ck": [{"x": "§114 權利估價範圍（列舉至都更權利變換）", "h": false}, {"x": "§116 地上權考慮因素五項", "h": false}, {"x": "用差額租金 a＝90－30＝60 萬，不是直接用 90 萬", "h": true}, {"x": "代入公式，n 為剩餘年限 20、r＝4%：60×13.5903≈815.4 萬", "h": false}, {"x": "註明差額租金還原法是教材做法、非條文逐字", "h": true}, {"x": "地上權價格約 815.4 萬元", "h": false}, {"x": "§121 先估正常價格，再以實際債權額為基礎調整", "h": true}, {"x": "抵押權估價不是債權額本身", "h": false}], "mn": "範圍 §114 → 地上權因素 §116 → 差額 a＝90－30 → 還原 ×13.5903＝815.4 → 抵押權 §121 正常價格為基礎"}, {"id": "pred-17", "no": "115預測⑰", "t": "估價作業程序八步驟與估價基本事項、估價計畫、資料蒐集、現場勘察（§8～§11、§13）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "A篇概念", "q": "依不動產估價技術規則，(一)不動產估價作業程序為何？(二)「確定估價基本事項」與「擬定估價計畫」各包括哪些事項？(三)估價應蒐集之資料有哪三類？(四)確認勘估標的狀態時，應至現場勘察哪些事項？委託人未領勘或無法進入室內勘察時，應如何處理？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產估價作業程序依<span class=\"art\">§8</span>共八步驟；<span class=\"art\">§8</span>只列八個程序名稱，各程序的內容分別在<span class=\"art\">§9</span>～<span class=\"art\">§13</span>等條。程序的意義在使估價可驗證、可追溯。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§8</span>：作業程序。</span><span class=\"evli\"><span class=\"art\">§9</span>：基本事項。</span><span class=\"evli\"><span class=\"art\">§10</span>：估價計畫。</span><span class=\"evli\"><span class=\"art\">§11</span>：蒐集資料。</span><span class=\"evli\"><span class=\"art\">§13</span>：現場勘察；委託人未領勘或無法進入室內勘察時，應於估價報告書敘明。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）程序（<span class=\"art\">§8</span>）</p><p>①確定估價基本事項②擬定估價計畫③蒐集資料④確認勘估標的狀態⑤整理、比較、分析資料⑥運用估價方法推算勘估標的價格⑦決定勘估標的價格⑧製作估價報告書。</p></div><div class=\"evp\"><p class=\"evh\">（二）<span class=\"art\">§9</span>基本事項四項</p><p>勘估標的內容、價格日期、價格種類及條件、估價目的（常漏寫「及條件」；不含蒐集資料）。<span class=\"art\">§10</span>估價計畫五項：確定作業步驟、預估所需時間、預估所需人力、預估作業經費、擬定作業進度表。</p></div><div class=\"evp\"><p class=\"evh\">（三）<span class=\"art\">§11</span>三類資料</p><p><span class=\"evli\">①勘估標的之標示、權利、法定用途及使用管制等基本資料；</span><span class=\"evli\">②影響價格之一般因素、區域因素及個別因素；</span><span class=\"evli\">③勘估標的相關交易、收益及成本資料。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）<span class=\"art\">§13</span>現場勘察</p><p><span class=\"evli\">①確認基本資料及權利狀態；</span><span class=\"evli\">②調查勘估標的及比較標的之使用現況；</span><span class=\"evli\">③確認影響價格之各項資料；</span><span class=\"evli\">④作成紀錄及攝製必要之照片或影像檔。委託人未領勘，無法確認勘估標的範圍或無法進入室內勘察時，<b>不是不能估價</b>，而是應於估價報告書敘明。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>估價依<span class=\"art\">§8</span>八個步驟進行：先確定基本事項（<span class=\"art\">§9</span>四項）與估價計畫（<span class=\"art\">§10</span>五項），再蒐集資料（<span class=\"art\">§11</span>三類）、至現場確認標的狀態（<span class=\"art\">§13</span>），其後整理分析、推算與決定價格並製作報告書。</p>"], "ck": [{"x": "§8 八步驟依序默寫（基計蒐狀整估決書）", "h": true}, {"x": "§9 基本事項四項：標的內容、價格日期、價格種類及條件、估價目的", "h": true}, {"x": "§10 估價計畫五項", "h": false}, {"x": "§11 蒐集資料三類", "h": false}, {"x": "§13 現場勘察四事項", "h": false}, {"x": "委託人未領勘或無法進入室內→於估價報告書敘明（§13）", "h": true}, {"x": "程序先基本事項、後蒐集資料、最後製作報告書", "h": false}], "mn": "基計蒐狀整估決書", "hp": 16, "hpl": "高"}, {"id": "pred-18", "no": "115預測⑱", "t": "房地估價特殊情形：超容積、違建、未達最有效使用、用途不符與無使用價值（§102～§106）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "A篇概念", "q": "依不動產估價技術規則，下列房地估價情形應如何處理？(一)實際建築使用之容積率超過法定容積率。(二)附有違章建築。(三)未達最有效使用狀態。(四)建物原核定用途與現行土地使用管制不符之合法建物。(五)建物已不具備使用價值。（25分）", "nq": 5, "b": ["<span class=\"blk-l\">一、意義</span><p>房地估價遇有超容積、附違建、未達最有效使用、用途與現行管制不符及建物已無使用價值等特殊情形時，技術規則<span class=\"art\">§102</span>～<span class=\"art\">§106</span>分別明定其處理方式。共通精神是以合法使用為本，並於估價報告書充分揭露。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§102</span>：超容積→合法部分現況估價。</span><span class=\"evli\"><span class=\"art\">§103</span>：違建部分原則不予以評估。</span><span class=\"evli\"><span class=\"art\">§104</span>：未達最有效使用→先求正常價格再調整。</span><span class=\"evli\"><span class=\"art\">§105</span>：用途不符之合法建物→依現行管制允許用途估價。</span><span class=\"evli\"><span class=\"art\">§106</span>：無使用價值→得將基地視為素地估價。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）超容積</p><p>依<span class=\"art\">§102</span>，實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響。</p><p class=\"evx\"><span class=\"evt\">例</span><span><b>不是估全部實際使用面積</b>，超過法定容積部分不計。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）附違建</p><p>依<span class=\"art\">§103</span>，違建部分不予以評估；但委託人要求評估其價值，並就合法建物及違建部分於估價報告書中分別標示各該部分之價格者，不在此限。</p><p class=\"evx\"><span class=\"evt\">例</span><span>原則只估合法建物；委託人要求且分別標示價格時，才可一併評估，並非一律不能估。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）未達最有效使用</p><p>依<span class=\"art\">§104</span>，應先求取其最有效使用狀態之正常價格，再視其低度使用情況進行調整。</p><p class=\"evx\"><span class=\"evt\">例</span><span>低度使用之房地，不直接以現況估價，而是先求最有效使用價格再往下調整。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）用途不符之合法建物</p><p>依<span class=\"art\">§105</span>，應以現行土地使用分區管制允許之建物用途估價，並就其與建物法定用途估價之差額於估價報告書中敘明。</p><p class=\"evx\"><span class=\"evt\">例</span><span>適用對象限於<b>合法建物</b>，且差額須於報告書揭露。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）無使用價值</p><p>依<span class=\"art\">§106</span>，建物已不具備使用價值，得將其基地視為素地估價，但應考量建物拆除成本予以調整之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>條文用「得」視為素地，且視為素地後仍須考量拆除成本。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>五種情形各有條文明定：超容積依合法部分現況估價（<span class=\"art\">§102</span>）、違建原則不予評估（<span class=\"art\">§103</span>）、未達最有效使用先求最有效使用價格再調整（<span class=\"art\">§104</span>）、用途不符依現行管制允許用途估價並敘明差額（<span class=\"art\">§105</span>）、無使用價值視基地為素地並考量拆除成本（<span class=\"art\">§106</span>）。特殊情形應以合法使用為本，並於報告書充分揭露。</p>"], "ck": [{"x": "超容積：以實際建築使用合法部分之現況估價並敘明法定容積影響（§102）", "h": false}, {"x": "違建不予評估；例外＝委託人要求＋分別標示價格（§103）", "h": true}, {"x": "未達最有效使用：先求最有效使用正常價格再低度使用調整（§104）", "h": false}, {"x": "用途不符：以現行管制允許之用途估價，差額敘明（§105）", "h": false}, {"x": "無使用價值：基地視為素地，考量建物拆除成本（§106）", "h": true}, {"x": "五種情形各用一句對應條號回答", "h": false}], "mn": "超容合法部分；違建不評估；低度先最有效；不符照現管；無用視素地扣拆"}, {"id": "pred-19", "no": "115預測⑲", "t": "權利估價：共同考慮因素、典權、租賃權、容積移轉與都更權利變換（§114、§115、§117、§122～§124、§127、§128）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "A篇概念", "q": "依不動產估價技術規則，(一)權利估價包括哪些估價？應考慮哪些共同因素？(二)典權估價與租賃權估價各應考慮哪些因素？(三)容積移轉估價應考慮哪些因素？(四)都市更新權利變換估價之評估項目依據為何？權利變換前基地未建築使用者，土地權利價值如何推估？權利變換後區分所有建物及其土地應有部分應如何查估？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>權利價值取決於權利內容與存續狀態，不能只看土地價格。作答架構：先依<span class=\"art\">§115</span>考量共同因素，再依各權利類型考量個別因素。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§114</span>：權利估價範圍。</span><span class=\"evli\"><span class=\"art\">§115</span>：共同考慮因素。</span><span class=\"evli\"><span class=\"art\">§117</span>：典權以典價為基礎。</span><span class=\"evli\"><span class=\"art\">§122</span>：租賃權應考慮因素。</span><span class=\"evli\"><span class=\"art\">§123</span>：容積移轉應考慮因素。</span><span class=\"evli\"><span class=\"art\">§124</span>：權利變換評估項目依都市更新相關法令。</span><span class=\"evli\"><span class=\"art\">§127</span>：變換前未建築→以素地價值推估。</span><span class=\"evli\"><span class=\"art\">§128</span>：變換後→以新成屋價格查估。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）範圍與共同因素</p><p>依<span class=\"art\">§114</span>，權利估價包括地上權、典權、永佃權、農育權、不動產役權、耕作權、抵押權、租賃權、市地重劃、容積移轉、都市更新權利變換之估價；依<span class=\"art\">§115</span>，應考慮契約內容、權利存續期間、權利登記狀況、相關法令規定、民間習俗、正常市場權利狀態。</p><p class=\"evx\"><span class=\"evt\">例</span><span>共同因素與個別因素不要混寫。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）典權與租賃權</p><p>依<span class=\"art\">§117</span>，典權估價應考慮權利存續期間、權利讓與之限制等因素，以<b>典價</b>為基礎估計之；依<span class=\"art\">§122</span>，租賃權估價應考慮契約內容、用途、租期、租金支付方式、使用目的及使用情形等因素。</p><p class=\"evx\"><span class=\"evt\">例</span><span>典權以典價為基礎，可對照抵押權（<span class=\"art\">§121</span>）以實際債權額為基礎。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）容積移轉</p><p>依<span class=\"art\">§123</span>，應考慮容積送出基地、接受基地及其他影響不動產價格及相關法令等因素。</p><p class=\"evx\"><span class=\"evt\">例</span><span>須同時觀察送出與接受兩端基地。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）都市更新權利變換</p><p>依<span class=\"art\">§124</span>，評估項目依都市更新條例及都市更新權利變換實施辦法等相關法令規定辦理。依<span class=\"art\">§127</span>，權利變換前之基地未建築使用者，以<b>素地價值</b>推估其土地權利價值。依<span class=\"art\">§128</span>，變換後區分所有建物及其土地應有部分，考量建築計畫、建材標準、設備等級、工程造價水準及更新前後樓層別效用比關聯性等因素，以都市更新評價基準日當時之新成屋價格查估之。</p><p class=\"evx\"><span class=\"evt\">例</span><span>基準為評價基準日當時之價格。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>權利估價先依<span class=\"art\">§115</span>考量共同因素，再依各權利類型考量個別因素：典權以典價為基礎（<span class=\"art\">§117</span>），租賃權重契約與租金（<span class=\"art\">§122</span>），容積移轉看送出與接受基地（<span class=\"art\">§123</span>），權利變換依專法辦理（<span class=\"art\">§124</span>），變換前未建築者以素地價值推估（<span class=\"art\">§127</span>），變換後以新成屋價格查估（<span class=\"art\">§128</span>）。</p>"], "ck": [{"x": "§114 權利估價十一類（地典永農役耕抵租重容更）", "h": false}, {"x": "§115 共同因素六項", "h": true}, {"x": "典權以典價為基礎（§117）", "h": true}, {"x": "租賃權因素：契約內容、用途、租期、租金支付方式、使用目的及使用情形（§122）", "h": false}, {"x": "容積移轉：送出基地、接受基地（§123）", "h": false}, {"x": "權利變換依都更條例及實施辦法（§124）；變換前未建築→素地價值（§127）", "h": false}, {"x": "變換後以評價基準日當時新成屋價格查估（§128）", "h": true}, {"x": "共同因素與個別因素分開寫", "h": false}], "mn": "先共同（契期登法俗正），再個別；典看典價，變換看專法"}, {"id": "pred-20", "no": "115預測⑳", "t": "特殊宗地與土地改良物估價：多用途、設施通過、污染、溫泉、高爾夫與農作改良物（§85、§88～§91、§109～§111）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "A篇概念", "q": "依不動產估價技術規則，(一)一宗土地內有數種不同法定用途時，應如何估價？(二)土地之上下因有其他設施通過致使用受限制，及土地受有土壤或地下水污染，應如何估價？某宗地未受限制之正常價格1億元，考量設施通過影響後之地價減損額為1,800萬元，該宗地價格為何？(三)溫泉地與高爾夫球場估價各應考慮哪些因素？(四)農作改良物之估價方式有哪三種？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>特殊宗地因用途、設施通過、污染或標的性質特殊，<span class=\"art\">§85</span>、<span class=\"art\">§88</span>～<span class=\"art\">§91</span>明定其估價方式；農作改良物（<span class=\"art\">§109</span>）依<span class=\"art\">§110</span>、<span class=\"art\">§111</span>估價。重點在先還原正常、再量化減損。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§85</span>：多用途→分別估價或依主要用途估價。</span><span class=\"evli\"><span class=\"art\">§88</span>：設施通過→正常價格扣地價減損額。</span><span class=\"evli\"><span class=\"art\">§89</span>：污染→未受污染正常價格扣地價減損額。</span><span class=\"evli\"><span class=\"art\">§90</span>：溫泉地應考慮因素。</span><span class=\"evli\"><span class=\"art\">§91</span>：高爾夫球場應考慮因素。</span><span class=\"evli\"><span class=\"art\">§110</span>：農作改良物考量因素。</span><span class=\"evli\"><span class=\"art\">§111</span>：農作改良物三種估價方式。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）多用途宗地</p><p>依<span class=\"art\">§85</span>，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價。</p><p class=\"evx\"><span class=\"evt\">例</span><span>結論是<b>二擇一</b>，作答須寫出判斷因素。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）設施通過與污染</p><p>依<span class=\"art\">§88</span>，先估算其正常價格，再考量該設施通過造成土地利用之影響，並計算其地價減損額後，從正常價格中扣除之，以其餘額為該宗地之價格。</p><p>公式：宗地價格＝正常價格－地價減損額</p><p>代入：10,000萬元－1,800萬元</p><p>結果：<b>8,200萬元</b>（<span class=\"art\">§88</span>）。</p><p>依<span class=\"art\">§89</span>，污染土地同理，但先估算其<b>未受污染</b>之正常價格，再依據委託人提供之土壤污染檢測資料，考量污染之影響，計算地價減損額後從正常價格中扣除。</p><p class=\"evx\"><span class=\"evt\">例</span><span><span class=\"art\">§88</span>、<span class=\"art\">§89</span>都是「扣除」地價減損額，不是加計。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）溫泉地與高爾夫球場</p><p>依<span class=\"art\">§90</span>，溫泉地應考慮水權內容、開發成本、水量、水質、水溫、交通、設施、遊客人數；依<span class=\"art\">§91</span>，高爾夫球場應考慮會員制度、球場設施、開發成本、收益及營運費用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>高爾夫球場特有會員制度因素。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）農作改良物</p><p>依<span class=\"art\">§110</span>，依其類別考量生產環境、農業災害、生產技術、生產期間、樹齡大小、生長情形、結果習性、管理狀況及農業設施等因素。依<span class=\"art\">§111</span>：<span class=\"evli\">①幼小且距孳息成熟期尚長者，依種植及培育費用，並視作物生長情況估計；</span><span class=\"evli\">②接近孳息成熟期者，估計收穫量及市場價格，必要時得扣減價格日期至成熟期間收成所應投入之費用；</span><span class=\"evli\">③距成熟期一年以上，且有期待收穫價值者，得以產地價格為基礎，推估未來收穫價格後折算為價格日期之價格，但應扣除收成所應投入之費用。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>三款依成熟遠近區分：幼小、接近成熟、距成熟一年以上。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>多用途宗地依最有效使用等因素決定分別或依主要用途估價（<span class=\"art\">§85</span>）；設施通過與污染土地均先估正常價格再扣地價減損額（<span class=\"art\">§88</span>、<span class=\"art\">§89</span>），本題宗地價格為8,200萬元；溫泉地、高爾夫球場各依<span class=\"art\">§90</span>、<span class=\"art\">§91</span>因素；農作改良物依<span class=\"art\">§111</span>三種方式視成熟遠近估價。</p>"], "ck": [{"x": "多用途宗地：最有效使用、相關性、分割難易度→分別估價或依主要用途估價（§85）", "h": false}, {"x": "設施通過：正常價格－地價減損額（§88）", "h": true}, {"x": "污染土地：未受污染正常價格－地價減損額，依委託人提供之檢測資料（§89）", "h": true}, {"x": "10,000－1,800＝8,200 萬元", "h": false}, {"x": "溫泉地因素（§90）；高爾夫球場因素（§91）", "h": false}, {"x": "農作改良物三種方式依成熟遠近區分（§111）", "h": true}, {"x": "每小題對應條號作答", "h": false}], "mn": "多用途二擇一；設施、污染都是正常價格扣減損額；農作看成熟遠近"}, {"id": "e100-2", "no": "100年第二題", "t": "替代原則於三大估價法之考量與替代性之觀察", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "估價原則", "q": "替代原則為三大估價法（成本法、比較法與收益法）之基礎，試說明該原則於三大估價法運用時之基本考量，以及實務上如何觀察並掌握不動產相互間的替代性？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>替代原則：效用相近之不動產，其價格會互相牽制；理性之買方不會以高於同樣效用替代品之價格購買。故一宗不動產之價格，受到市場上可替代不動產價格之限制。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>：同一供需圈。</span><span class=\"evli\"><span class=\"art\">§12</span>：比較實例蒐集原則。</span><span class=\"evli\"><span class=\"art\">§48</span>：重置成本。</span><span class=\"evli\"><span class=\"art\">§33</span>：客觀淨收益。</span><span class=\"evli\"><span class=\"art\">§43</span>：風險溢酬法、市場萃取法。</span><span class=\"evli\"><span class=\"art\">§25</span>、<span class=\"art\">§26</span>：排除差異過大者。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）三大估價法之基本考量</p><p>1.比較法（市場上之替代）：依<span class=\"art\">§12</span>，比較實例應與勘估標的位於同一供需圈之近鄰地區或類似地區，且使用性質或使用管制相同或相近，再調整差異。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方可改買類似不動產。</span></p><p>2.成本法（重新取得之替代）：依<span class=\"art\">§48</span>，重置成本，指與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本，再扣除折舊。</p><p class=\"evx\"><span class=\"evt\">例</span><span>反映「自己蓋一棟同樣效用建物」之代價。</span></p><p>3.收益法（投資之替代）：依<span class=\"art\">§33</span>，客觀淨收益應參酌鄰近類似不動產在最有效使用情況下之收益推算；依<span class=\"art\">§43</span>，風險溢酬法選擇最具一般性財貨之投資報酬率為基準，市場萃取法以比較標的之淨收益除以價格所得商數比較決定。</p><p class=\"evx\"><span class=\"evt\">例</span><span>資金可改投資定存、公債，報酬須具競爭性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）實務上觀察並掌握替代性</p><p>1.依<span class=\"art\">§2</span>，同一供需圈為比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。實務上可觀察（教材／實務）：地域範圍、使用性質、區域因素、個別因素、市場面（買方群體、價格帶、去化速度）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方是否把兩者放在同一組比較。</span></p><p>2.量化檢驗：依<span class=\"art\">§25</span>，區域因素、個別因素或其內任一單獨項目之價格調整率大於百分之十五，或總調整率大於百分之三十時，應排除該比較標的；依<span class=\"art\">§26</span>，檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>差異過大即替代性不足。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>替代原則是三大方法共同之基礎：比較法以市場替代品之價格為參考，成本法以重新取得替代品之成本為參考，收益法以其他投資之報酬為比較。實務上須從同一供需圈、使用性質、區域與個別因素及市場買方群體觀察替代性，替代性愈高，結果愈可靠。</p>"], "ck": [{"x": "替代原則定義：效用相近價格互相牽制；屬學理非條文", "h": true}, {"x": "比較法＝市場替代，比較標的須有替代關係再調整", "h": false}, {"x": "成本法＝重新取得替代，重建或重置成本扣除折舊", "h": false}, {"x": "收益法＝投資替代，資本化率或折現率參考其他投資報酬", "h": true}, {"x": "§2 同一供需圈定義", "h": false}, {"x": "觀察五面向：地域、使用性質、區域因素、個別因素、市場面", "h": true}, {"x": "子題一給三法各一個替代觀點", "h": false}, {"x": "子題二給觀察面向的一句答案", "h": false}], "mn": "替代原則（學理）→ 比較＝市場、成本＝重新取得、收益＝投資 → 觀察：供需圈・使用性質・區域・個別・市場面", "hp": 12, "hpl": "高"}, {"id": "e104-1", "no": "104年第一題", "t": "不景氣屬何種估價原則＋應掌握之估價原則", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "估價原則", "q": "最近國內房地產市場呈現不景氣狀況，此一現象在不動產估價原則來說是屬於那一種原則？對於不動產估價工作來說，需要掌握那些不動產估價原則？請詳述說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>變動原則：不動產價格是各項價格形成因素相互作用的結果，而一般因素、區域因素、個別因素隨時間不斷變動，價格亦隨之變動。房地產由景氣轉為不景氣，是經濟因素變動使需求減少、價格下修，故屬變動原則。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>第十四款：一般因素。</span><span class=\"evli\"><span class=\"art\">§2</span>第17款：最有效使用。</span><span class=\"evli\"><span class=\"art\">§6</span>：價格日期當時之價值。</span><span class=\"evli\"><span class=\"art\">§3</span>：蒐集市場資訊。</span><span class=\"evli\"><span class=\"art\">§23</span>：急售、拍賣等特殊交易。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）不景氣屬變動原則</p><p>依<span class=\"art\">§6</span>，「不動產估價，應切合價格日期當時之價值」，即變動原則之條文落點；同時亦反映供需原則（需求下降）與預測原則（市場預期轉悲觀）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>需求減少、價格下修，估價須以價格日期當時為準。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）估價工作需掌握之十項原則（學理分類）</p><p><span class=\"evli\">①供需原則：價格由供給與需求相互作用決定。</span><span class=\"evli\">②替代原則：效用相近之不動產價格互相牽制，為三大方法之共同基礎。</span><span class=\"evli\">③預測原則：價格反映對未來收益與效用之預期，為收益法之基礎。</span><span class=\"evli\">④變動原則：價格隨價格形成因素變動而變動。</span><span class=\"evli\">⑤均衡原則：內部構成要素之組合平衡，價格最高。</span><span class=\"evli\">⑥貢獻原則：某要素對整體價格之貢獻程度決定其價值。</span><span class=\"evli\">⑦收益遞增遞減原則：追加投資，收益先遞增、後遞減。</span><span class=\"evli\">⑧適合原則：不動產與環境相適合，價格較高。</span><span class=\"evli\">⑨外部性原則：周邊環境與設施對價格之正負影響。</span><span class=\"evli\">⑩最有效使用原則：依<span class=\"art\">§2</span>第17款，在合法、實質可能、正當合理、財務可行四前提下，所作得以獲致最高利益之使用。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>外部性如公園、嫌惡設施；最有效使用四前提缺一不可，最常漏的是<b>財務可行</b>。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不景氣時之運用</p><p><span class=\"evli\">①價格日期（<span class=\"art\">§6</span>）：不景氣時價格變動快，價格日期之掌握更重要；</span><span class=\"evli\">②資料蒐集（<span class=\"art\">§3</span>）：經常蒐集供需、環境變遷等市場資訊，掌握價格走勢；</span><span class=\"evli\">③比較標的：交易量萎縮，須注意<span class=\"art\">§23</span>之急售、拍賣等特殊交易。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>避免以急售、拍賣等非正常交易作為比較標的。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>不景氣是經濟因素變動導致價格變動，屬變動原則，並涉及供需、預測原則。估價工作需掌握供需、替代、預測、變動、均衡、貢獻、收益遞增遞減、適合、外部性及最有效使用等十項原則，並於不景氣時特別留意價格日期與資料篩選，確保時點正確。</p>"], "ck": [{"x": "不景氣屬變動原則", "h": false}, {"x": "變動原則定義：價格隨價格形成因素變動而變動", "h": false}, {"x": "並涉及供需原則（需求下降）、預測原則（預期轉悲觀）", "h": true}, {"x": "九項原則逐項列出並各附一句重點", "h": true}, {"x": "結合：價格日期（§6）、市場資訊（§3）、特殊交易（§23）", "h": false}, {"x": "估價原則屬學理分類，以學理名稱與定義作答，原則本身不寫條號（結合估價工作時才引條號）", "h": true}, {"x": "結論：變動原則＋九項原則＋不景氣時留意價格日期與資料篩選", "h": false}], "mn": "不景氣＝變動原則（兼供需・預測）→ 九原則 → 結合 §6 價格日期・§3 資料・§23 特殊交易", "hp": 11, "hpl": "高"}];

function stat(id){
  var L=ld(LOG)[id]||{}, S=ld(SP)[id]||[], R=rdList().indexOf(id)>=0;
  var last=S[0]||null;
  return {n:(L.n||0), sp:S.length, v:VN[L.v]||0, last:last, read:!!R, t:Math.max(L.t||0,last?last.t:0)};
}
function order(){
  var arr=CARDS.map(function(c,i){var s=stat(c.id);return {c:c,s:s,i:i}}).filter(function(x){return fpass(x.c,x.s)});
  function kindRank(c){return ({off:0,pred:1,mkc:2,mkls:3})[c.k]!=null?({off:0,pred:1,mkc:2,mkls:3})[c.k]:4}
  var fresh=arr.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read});
  var seen=arr.filter(function(x){return x.s.n||x.s.sp||x.s.read});
  function hpR(c){return c.hp==null?9999:c.hp}
  fresh.sort(function(a,b){return hpR(a.c)-hpR(b.c)||kindRank(a.c)-kindRank(b.c)||a.c.tier-b.c.tier||a.i-b.i});
  function vr(v){return v===3?0:(v===2?1:(v===0?2:3))}
  function pct(x){return x.s.last?x.s.last.sc/Math.max(1,x.s.last.mx):-1}
  seen.sort(function(a,b){return vr(a.s.v)-vr(b.s.v)||hpR(a.c)-hpR(b.c)||pct(a)-pct(b)||a.s.t-b.s.t});
  return fresh.concat(seen);
}

  return o.join('');
}

  $('sum').textContent='衝刺過 '+done+'／'+CARDS.length+' 題・共 '+tot+' 次';
  var list=showAll?Q:Q.slice(0,8);
  $('qlist').innerHTML=list.map(function(x){return '<button type="button" class="qi" data-id="'+x.c.id+'"><span class="n">'+esc(x.c.no)+'</span><span class="t">'+esc(x.c.t)+'</span><span class="go">開始 ▸</span><span class="r">'+reason(x)+'</span></button>'}).join('');
  [].forEach.call($('qlist').querySelectorAll('.qi'),function(b){b.onclick=function(){start(b.getAttribute('data-id'))}});
  $('moreBtn').textContent=showAll?'只看前 8 題':'顯示全部 '+Q.length+' 題';
}
$('moreBtn').onclick=function(){showAll=!showAll;home()};
var pick='order';
function randPick(ex){var a=fpool().filter(function(c){return c.id!==ex});if(!a.length)a=CARDS.filter(function(c){return c.id!==ex});return a[Math.floor(Math.random()*a.length)]}
$('startBtn').onclick=function(){pick='order';var o=order();if(!o.length){alert0();return}start(o[0].c.id)};
function alert0(){var f=$('flt');if(f){f.scrollIntoView({block:'start'});f.style.outline='2px solid var(--bad)';setTimeout(function(){f.style.outline=''},1200)}}
$('randBtn').onclick=function(){pick='rand';start(randPick('').id)};

/* ---- 作答 ---- */
var cur=null, st=0, stLeft=0, elapsed=0, iv=null, peek=false;
var SWU='估價_申論5分鐘_推理版.html';
function swGo(id){var u=SWU+(id?'#q='+encodeURIComponent(id):'');$('swTop').href=u;var w=$('swq');if(w)w.innerHTML=id?'<span>同一題換個練法</span><a href="'+u+'">這題改用推理版 ▸</a>':''}
var CARDU='估價_申論卡.html';

/* ---- 存檔後：再練一次／看完整解說／回看本題（11-03） ---- */
function doneExtra(revPages){
  var id=cur.id,b=$('body');
  b.insertAdjacentHTML('beforeend','<div class="dnb"><button type="button" class="btn" id="againBtn">🔁 再練一次</button><a class="btn" href="'+CARDU+'?v=0#'+encodeURIComponent(id)+'" target="_blank" rel="noopener">📖 看完整解說（另開）</a></div>'
    +'<div class="rv"><div class="rvh">回看本題（不計時）</div><div class="rvnav"><button type="button" class="btn" id="rvP">◀ 上一頁</button><select id="rvS" aria-label="跳到哪一頁"></select><button type="button" class="btn" id="rvN">下一頁 ▶</button></div><div id="rvB"></div></div>');
  $('againBtn').onclick=function(){$('nextBtn').onclick=next;$('quitBtn').textContent='放棄這題';start(id)};
  var P=revPages(),i=0;
  $('rvS').innerHTML=P.map(function(p,k){return '<option value="'+k+'">'+(k+1)+'／'+P.length+'　'+esc(p[0])+'</option>'}).join('');
  function go(k){i=Math.max(0,Math.min(P.length-1,k));$('rvS').value=String(i);$('rvB').innerHTML=P[i][1];$('rvP').disabled=i===0;$('rvN').disabled=i===P.length-1}
  $('rvP').onclick=function(){go(i-1)};$('rvN').onclick=function(){go(i+1)};$('rvS').onchange=function(){go(+this.value)};
  go(0);
}
function sprintPages(){
  var rc='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）或哪個公式</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">口訣：<b>'+esc(cur.mn)+'</b></div>':'');
  var ck='<div class="ck">'+cur.ck.map(function(c,i){var g=!!cur.got[i];return '<label class="'+(g?'on':'miss')+'"><span class="mk">'+(g?'✓':'✗')+'</span>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>';
  return [[STG[0].n,'<div class="rvq">'+esc(cur.q)+'</div>'],[STG[1].n,rc],[STG[2].n,evHTML([0,1,2],[],[])],[STG[3].n,evHTML([3],[],[])],[STG[4].n+'（✓ 有勾／✗ 漏掉）',ck],['考場版全文',evHTML([0,1,2,3],[],[])]];
}
function start(id){
  swGo(id);
  setPause(false);
  cur=CARDS.filter(function(c){return c.id===id})[0]; if(!cur)return;
  st=0; stLeft=STG[0].s; elapsed=0; peek=false; cur.got={}; cur.rate=0;
  $('home').hidden=true; $('run').hidden=false; $('act').hidden=false;
  var s=stat(id);
  $('meta').innerHTML='<span>'+esc(cur.no)+'</span><span>'+esc(cur.g)+'</span>'+(cur.lv?'<span>'+esc(cur.lv)+'</span>':'')+'<span>第 '+(s.sp+1)+' 次衝刺'+(s.last?'・上次 '+s.last.sc+'／'+s.last.mx:'')+'</span>';
  $('ttl').textContent=cur.t;
  $('qbox').innerHTML='<div class="qt">'+esc(cur.q)+'</div><span class="nq">本題 '+cur.nq+' 問</span><button type="button" class="qx" id="qx">展開題目</button>';$('qbox').className='qbox';
  $('qx').onclick=function(){var q=$('qbox'),o=q.classList.contains('clamp');q.classList.toggle('clamp',!o);q.classList.toggle('open',o);this.textContent=o?'收起題目':'展開題目'};
  $('mchip').className='modechip '+mode; $('mchip').textContent=mode==='h'?'⚡ 衝刺':'🪑 停留';
  render(); tick(true);
  if(iv)clearInterval(iv); iv=setInterval(function(){tick(false)},1000);
  scrollTo(0,0);
}
function evHTML(show,focus,dim){
  return '<div class="ev">'+cur.b.map(function(h,i){
    if(show.indexOf(i)<0)return '';
    return '<div class="blk b'+(i+1)+(focus.indexOf(i)>=0?' focus':'')+(dim.indexOf(i)>=0?' dim':'')+'">'+h+'</div>'}).join('')+'</div>';
}
function render(){
  var b=$('body'), h='';
  if(st===0){h='<div class="cover">讀完題目，數清楚問幾問。<br>答案在後面，現在先不看。</div>'}
  else if(st===1){h='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）或哪個公式</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">提示口訣（想不出來再看）：<b>'+esc(cur.mn)+'</b></div>':'')}
  else if(st===2){h=evHTML([0,1,2],[2],[])}
  else if(st===3){h=evHTML([0,1,2,3],[3],[0,1,2])}
  else if(st===4){
    var hide=(mode==='h'||!peek);
    h=(hide?'<div class="cover">答案已蓋住。憑記憶勾出你剛剛有想到、考試會寫到的關鍵。'+(mode==='s'?'<br><button type="button" class="btn" id="peekBtn" style="margin-top:8px">偷看一下答案</button>':'')+'</div>':evHTML([0,1,2,3],[],[]))
      +'<div class="ck" id="ck">'+cur.ck.map(function(c,i){return '<label data-i="'+i+'"'+(cur.got[i]?' class="on"':'')+'><input type="checkbox"'+(cur.got[i]?' checked':'')+'>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>'
      +'<div class="score"><span class="big" id="sc"></span><small id="scs"></small></div>'
      +'<div class="rate" id="rate">'+[1,2,3].map(function(v){return '<button type="button" data-v="'+v+'"'+(cur.rate===v?' class="on"':'')+'>'+RL[v]+'</button>'}).join('')+'</div>'
      +'<div class="hist" id="hist"></div>';
  }
  b.innerHTML=h;
  if(st===4){
    var pb=$('peekBtn'); if(pb)pb.onclick=function(){peek=true;render()};
    [].forEach.call(b.querySelectorAll('.ck label'),function(l){var i=+l.getAttribute('data-i'),cb=l.querySelector('input');
      cb.onchange=function(){cur.got[i]=cb.checked;l.classList.toggle('on',cb.checked);score()}});
    [].forEach.call(b.querySelectorAll('#rate button'),function(x){x.onclick=function(){cur.rate=+x.getAttribute('data-v');
      [].forEach.call(b.querySelectorAll('#rate button'),function(y){y.classList.toggle('on',y===x)});paintAct()}});
    score(); hist();
  }
  var qb=$('qbox'); if(!qb.classList.contains('open'))qb.classList.toggle('clamp',st>=2&&st<=4);
  paintStage(); paintAct();
}
function score(){
  var sc=0,mx=cur.ck.length,hm=0,hx=0;cur.ck.forEach(function(c,i){if(cur.got[i])sc++;if(c.h){hx++;if(cur.got[i])hm++}});
  cur.sc=sc;cur.mx=mx;cur.hm=hm;cur.hx=hx;
  $('sc').textContent=sc+'／'+mx;
  $('scs').textContent='關鍵字樣'+(hx?'・必寫 '+hm+'／'+hx:'');
}
function hist(){
  var S=ld(SP)[cur.id]||[];
  $('hist').innerHTML=S.length?'過去衝刺：'+S.slice(0,5).map(function(r){var d=new Date(r.t*1000);return (d.getMonth()+1)+'/'+d.getDate()+' '+r.sc+'／'+r.mx+(r.m==='h'?'⚡':'🪑')}).join('　'):'這題第一次衝刺。';
}
function paintStage(){
  $('stg').innerHTML=STG[st].n+'<small>'+STG[st].d+'</small>';
  [].forEach.call($('segs').children,function(seg,i){seg.classList.toggle('done',i<st);seg.classList.remove('over')});
}
function paintAct(){
  var nb=$('nextBtn');
  if(st<4){nb.textContent=st===3?'去檢核 →':'下一段 →';nb.disabled=false;
    $('hint').textContent=mode==='h'?'時間到會自動往下；讀過的段落會蓋住。':'時間到只會變紅，看完再按下一段。'}
  else{nb.textContent='存檔';nb.disabled=!cur.rate;$('hint').textContent=cur.rate?'':'勾完關鍵後，選一個自評才能存檔。'}

  if(window.barWake)barWake();
}
function tick(first){if(first)segFix();
  if(!first){ if(paused||document.visibilityState!=='visible')return; elapsed++; stLeft--; }
  var clk=$('clk'),seg=$('segs').children[st].querySelector('b');
  clk.textContent=mmss(stLeft); clk.classList.toggle('red',stLeft<=0);
  seg.style.width=Math.min(100,(STG[st].s-stLeft)/STG[st].s*100)+'%';
  $('segs').children[st].classList.toggle('over',stLeft<0);
  var t=$('tot'); t.textContent='總 '+mmss(elapsed).replace('+','')+'／5:00'; t.classList.toggle('red',elapsed>TOTAL);
  if(stLeft<=0&&mode==='h'&&st<4&&!first){next()}
}
function toConc(){var b=document.querySelector('#body .blk.b4');if(!b)return;var bar=document.querySelector('.bar');var y=b.getBoundingClientRect().top+scrollY-(bar?bar.offsetHeight:0)-8;setTimeout(function(){scrollTo({top:y,behavior:'smooth'})},60)}
function toBody(){var b=$('body');if(!b||st<1||st>4)return;var bar=document.querySelector('.bar');var y=Math.max(0,b.getBoundingClientRect().top+scrollY-(bar?bar.offsetHeight:0)-8);scrollTo({top:y,behavior:'smooth'})}
function segFix(){[].forEach.call($('segs').children,function(g,i){if(i===st)return;var b=g.querySelector('b');if(b)b.style.width=i<st?'100%':'0%';if(i>st)g.classList.remove('over')})}
function next(){
  if(paused)return;
  if(st>4)return;
  if(st<4){st++;stLeft=STG[st].s;render();tick(true);toBody();if(st===3)toConc();return}
  save();
}
function save(){
  if(!cur.rate)return;
  var now=Math.floor(Date.now()/1000);
  var S=ld(SP); S[cur.id]=[{t:now,sc:cur.sc,mx:cur.mx,hm:cur.hm,hx:cur.hx,m:mode,sec:elapsed,v:cur.rate}].concat(S[cur.id]||[]).slice(0,30); sv(SP,S);
  var L=ld(LOG), r=L[cur.id]=L[cur.id]||{n:0,s:[],tot:0};
  r.n=(r.n||0)+1; r.tot=(r.tot||0)+elapsed; r.s=[elapsed].concat(r.s||[]).slice(0,5); r.v=['','ok','mem','hard'][cur.rate]; r.t=now; sv(LOG,L);
  clearInterval(iv); iv=null;
  var nx=pick==='rand'?{c:randPick(cur.id)}:order().filter(function(x){return x.c.id!==cur.id})[0];
  $('body').innerHTML='<div class="done-box"><b>已存檔</b>：'+cur.sc+'／'+cur.mx+'・'+RL[cur.rate]+'・用時 '+mmss(elapsed).replace('+','')+'<br><span style="color:var(--sub);font-size:.88rem">範文頁這張卡的輪數、自評與指揮中心紀錄會一起更新。</span>'
    +(nx?'<div style="margin-top:10px;font-size:.9rem">'+(pick==='rand'?'🎲 隨機':'')+'下一題：'+esc(nx.c.no)+'｜'+esc(nx.c.t)+'</div>':'')+'</div>';
  doneExtra(sprintPages);
  $('stg').innerHTML='完成<small>這題的紀錄已同步</small>';
  [].forEach.call($('segs').children,function(seg){seg.classList.add('done')});
  st=5; $('hint').textContent=''; $('quitBtn').textContent='回清單';
  var nb=$('nextBtn'); nb.disabled=!nx; nb.textContent='下一題 ▸';
  nb.onclick=function(){nb.onclick=next;$('quitBtn').textContent='放棄這題';start(nx.c.id)};
}
$('nextBtn').onclick=next;
$('quitBtn').onclick=function(){setPause(false);$('quitBtn').textContent='放棄這題';$('nextBtn').onclick=next;clearInterval(iv);iv=null;cur=null;$('run').hidden=true;$('act').hidden=true;$('home').hidden=false;swGo('');home();scrollTo(0,0)};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!$('home').hidden)home()});
(function(){var m=/^#q=(.+)$/.exec(location.hash||''),id=m?decodeURIComponent(m[1]):'';
  if(id&&CARDS.some(function(c){return c.id===id})){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}start(id)}else home()})();

var paused=false;
function setPause(v){paused=v;document.body.classList.toggle('paused',v);var b=$('pauseBtn');b.textContent=v?'▶':'⏸';b.setAttribute('aria-label',v?'繼續':'暫停');if(!v){if(cur&&st>=1&&st<=4)toBody();else scrollTo(0,0)}}
$('pauseBtn').onclick=function(){setPause(!paused)};
$('resumeBtn').onclick=function(){setPause(false)};
</script>
<script id="th-js">/* 深淺色切換：有存過看 bx-theme，沒存過跟系統；按了才寫入（全站共用鍵） */

function dark(){var a=H.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function paint(){b.textContent=dark()?'☀️ 淺色':'🌙 深色'}

<script id="sprint-keys">
/* 鍵盤：練習中 →／空白鍵＝下一段（推理版未翻開先翻開）；回看本題 ←／→ 翻頁；空白鍵＝下一題 */
document.addEventListener('keydown',function(e){
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
 var t=e.target,tag=(t&&t.tagName)||'';if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)||(t&&t.isContentEditable))return;
 var k=e.key;if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!==' '&&k!=='Spacebar')return;
 var run=document.getElementById('run');if(!run||run.hidden)return;
 if(document.body.classList.contains('paused'))return;
 var rvP=document.getElementById('rvP'),rvN=document.getElementById('rvN'),nb=document.getElementById('nextBtn');
 function hit(b){if(b&&!b.disabled&&b.offsetParent!==null){e.preventDefault();b.click();return true}return false}
 if(rvP&&rvP.offsetParent!==null){            /* 存檔後：回看本題 */
  if(k==='ArrowLeft')return void hit(rvP);
  if(k==='ArrowRight')return void hit(rvN);
  return void hit(nb);                       /* 空白鍵＝下一題 */
 }
 if(k==='ArrowLeft')return;
 if(hit(document.getElementById('flip')))return;
 hit(nb);
});
</script>
<script id="sprint-bardim">
/* 底部操作列整列淡出：閱讀階段每段 4 秒後變淡；碰到就恢復 */

 function reading(){return typeof st==='number'&&st<4}
 window.barWake=function(){a.classList.remove('dim');clearTimeout(t);if(reading())t=setTimeout(function(){if(reading())a.classList.add('dim')},4000)};
 a.addEventListener('pointerdown',function(){if(a.classList.contains('dim'))barWake()},true);
 setInterval(function(){if(!reading()&&a.classList.contains('dim'))a.classList.remove('dim')},500);
})();
</script>
