</span>：交叉檢驗。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）建物總成本（<span class=\"art\">§52</span>）</p><p>公式：小計＝營造施工費＋規劃設計費＋廣告銷售管理稅捐；資本利息＝小計×2%×½；利潤＝(小計＋利息)×10%。</p><p>代入：規劃設計費2,400×3%＝72；其他費用2,400×8%＝192；小計2,400＋72＋192＝2,664；資本利息2,664×2%×½＝26.64；利潤(2,664＋26.64)×10%＝269.06。</p><p>結果：建物總成本C＝2,664＋26.64＋269.06＝<b>2,959.70萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>利息×½、利潤基礎、其他費用8%為題目假設，答案應寫明基礎；依<span class=\"art\">§58Ⅲ</span>、<span class=\"art\">§60Ⅳ</span>，含土地者基礎應另加計土地價格，本題為題目指定之簡化。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）累積折舊額（定額法，教材公式）</p><p>公式：Dn＝C×(1−s)÷N×n。</p><p>代入：2,959.70×(1−5%)÷50×10。</p><p>結果：<b>562.34萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>折舊基礎是建物總成本（含設計、利息、利潤），不是只有營造施工費。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）成本價格（<span class=\"art\">§69</span>）</p><p>建物成本價格＝2,959.70−562.34＝<b>2,397.36萬元</b>。</p><p>房地成本價格＝6,000＋2,397.36＝<b>8,397.36萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>折舊只扣建物，土地總成本全額計入。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>依<span class=\"art\">§69</span>，房地成本價格＝土地價格＋建物成本價格。本題建物總成本約2,959.70萬元，扣累積折舊562.34萬元後為2,397.36萬元，加土地6,000萬元，房地成本價格約8,397.36萬元；實務上仍應與比較法、收益法交叉檢驗（<span class=\"art\">§14</span>、<span class=\"art\">§15</span>）。</p>"], "ck": [{"x": "§48 成本法定義、§49 八步驟", "h": false}, {"x": "§69：房地＝土地價格＋建物成本價格；建物成本價格＝建物總成本－累積折舊額", "h": false}, {"x": "§52 總成本七項（營造施工費、設計費、廣告銷售、管理、稅捐、資本利息、利潤）", "h": false}, {"x": "設計費 72、其他費用 192、小計 2,664；資本利息 26.64、利潤 269.06、總成本 2,959.70", "h": false}, {"x": "折舊基礎是建物總成本（含設計、利息、利潤），不是只有營造施工費", "h": true}, {"x": "(1－s)＝0.95，累積折舊 562.34", "h": false}, {"x": "土地不折舊，6,000 萬全額計入", "h": true}, {"x": "列出「步驟→金額」，只寫結果會漏分；寫明題目假設的基礎", "h": true}, {"x": "房地成本價格約 8,397.36 萬元", "h": false}], "mn": "§49 八步驟 → 小計 2,664 → 利息 26.64 → 利潤 269.06 → 總成本 2,959.70 → 折舊 562.34 → 建物 2,397.36 → ＋土地 6,000＝8,397.36", "hp": 1034, "hpl": "中"}, {"id": "pred-10", "no": "115預測⑩", "t": "營造或施工費之求取方法與總成本各項費用（§52～§62）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "成本法", "q": "依不動產估價技術規則，(一)成本法總成本包括哪些項目？(二)營造或施工費之求取方法有哪些？(三)某標準建物營造施工費單價每坪8萬元，勘估標的施工條件較佳，調整率1.05，總面積300坪，試以單位面積比較法求營造施工費，並依規定估計規劃設計費之範圍；(四)資本利息應如何計息？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>成本法之總成本由營造或施工費等七項構成，土地或包含土地者另加計土地價格。營造或施工費之求取分直接法與間接法；規劃設計費、資本利息等其他費用依規定基礎估計。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§52</span>：總成本七項。</span><span class=\"evli\"><span class=\"art\">§53</span>：營造或施工費之組成。</span><span class=\"evli\"><span class=\"art\">§55</span>：直接法（淨計法、單位工程法）。</span><span class=\"evli\"><span class=\"art\">§56</span>：間接法（工程造價比較法、單位面積比較法）。</span><span class=\"evli\"><span class=\"art\">§57</span>：規劃設計費按建築師酬金標準表及建造執照工程造價表計算，或按營造施工費2%至3%推估。</span><span class=\"evli\"><span class=\"art\">§58</span>、<span class=\"art\">§59</span>：資本利息計息。</span><span class=\"evli\"><span class=\"art\">§60</span>～<span class=\"art\">§62</span>：利潤、廣告銷售、管理、稅捐費率由全聯會公告，視性質得不予計入。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）總成本項目（<span class=\"art\">§52</span>）</p><p>①營造或施工費②規劃設計費③廣告費、銷售費④管理費⑤稅捐及其他負擔⑥資本利息⑦開發或建築利潤；土地或包含土地者，另加計土地價格。費率以全聯會公告為準，不憑記憶寫固定百分比。</p></div><div class=\"evp\"><p class=\"evh\">（二）營造或施工費之求取（<span class=\"art\">§53</span>～<span class=\"art\">§56</span>）</p><p>組成含直接材料、直接人工、間接材料、間接人工、管理費、稅捐、資本利息、營造或施工利潤。</p><p>直接法：淨計法逐項計算材料、人工數量乘以價格日期單價，再加計管理費、稅捐、資本利息及利潤；單位工程法以細部工程各項目單價乘以施工數量合計之。</p><p>間接法：工程造價比較法按工程概算項目逐項比較勘估標的與標準建物差異調整；單位面積（體積）比較法以標準建物單位面積單價為基礎，調整後乘以總面積。直接法、間接法各兩種，別互換。</p></div><div class=\"evp\"><p class=\"evh\">（三）代入計算</p><p>公式：營造施工費＝標準建物單價×調整率×總面積；規劃設計費＝營造施工費×2%～3%（<span class=\"art\">§57</span>）。</p><p>代入：8萬×1.05×300坪；2,520×2%～2,520×3%。</p><p>結果：營造施工費<b>2,520萬元</b>；規劃設計費<b>50.4萬～75.6萬元</b>。調整率乘在標準建物單價上；設計費基礎是營造施工費。</p></div><div class=\"evp\"><p class=\"evh\">（四）資本利息（<span class=\"art\">§58</span>、<span class=\"art\">§59</span>）</p><p>依分期投入資本數額及使用年數，自有資金與借貸資金分別計息；自有資金利率不高於一年期定存利率、不低於活存利率；借款依銀行短期放款利率；預售收入之資金不計息。</p></div>", "<span class=\"blk-l\">四、結論</span><p>總成本含營造施工費等七項（土地另加）；營造施工費可採直接法或間接法。本題單位面積比較法求得營造施工費2,520萬元，規劃設計費約50.4萬至75.6萬元；資本利息分自有、借貸資金計息，預售收入不計息。</p>"], "ck": [{"x": "§52 總成本七項，土地或含土地者另加土地價格", "h": false}, {"x": "直接法（§55）：淨計法、單位工程法；間接法（§56）：工程造價比較法、單位面積比較法，不可互換", "h": true}, {"x": "§53 營造或施工費含直接材料至營造施工利潤八項", "h": false}, {"x": "單位面積比較法：調整率乘在標準建物單價上", "h": true}, {"x": "8×1.05×300＝2,520 萬元（要列式）", "h": false}, {"x": "規劃設計費基礎是營造施工費（不是總銷售金額或總成本）：2,520×2%～3%＝50.4～75.6 萬", "h": true}, {"x": "§58 自有與借貸資金分別計息", "h": false}, {"x": "§59 自有資金利率區間；預售收入之資金不計息", "h": false}, {"x": "四個子題各給一句直接答案", "h": false}], "mn": "七項（§52）→ 直接二法（§55）、間接二法（§56）→ 8×1.05×300＝2,520 → ×2%～3% → 資本利息分開計、預售不計息（§58・§59）"}, {"id": "pred-14", "no": "115預測⑭", "t": "建物折舊參數之判斷（耐用年數、殘餘價格率）與定額法計算（§65～§68）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "成本法", "q": "依不動產估價技術規則，(一)計算建物折舊額，應以何種耐用年數為主？經濟耐用年數與物理耐用年數有何不同？(二)建物經歷年數大於經濟耐用年數時，應如何處理？(三)殘餘價格率如何決定？確實無殘餘價格者，計算折舊時如何處理？(四)某建物重建成本1,000萬元，經濟耐用年數40年，已經歷12年，採定額法，試分別計算殘餘價格率10%及確實無殘餘價格兩種情況之累積折舊額與建物現值。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>建物折舊額之計算，以經濟耐用年數為主。經濟耐用年數係因功能或效益衰退至不值得使用之年數；物理耐用年數係因自然耗損或外力破壞至結構脆弱不堪使用之年數。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§65</span>：以經濟耐用年數為主，必要時得以物理耐用年數計算；經歷年數大於經濟耐用年數時，應重新調整經濟耐用年數。</span><span class=\"evli\"><span class=\"art\">§67</span>：殘餘價格率由全聯會公告，以不超過10%為原則；確實無殘餘價格者，計算折舊時不予提列。</span><span class=\"evli\"><span class=\"art\">§68</span>：等速折舊、初期加速折舊、初期減速折舊三種路徑。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）耐用年數</p><p>以經濟耐用年數為主，不是物理。</p></div><div class=\"evp\"><p class=\"evh\">（二）經歷年數大於經濟耐用年數</p><p>應重新調整經濟耐用年數。</p></div><div class=\"evp\"><p class=\"evh\">（三）殘餘價格率</p><p>以不超過10%為原則，不可寫成固定10%；確實無殘餘價格者不提列（相當s＝0），差異30萬就在這裡。</p></div><div class=\"evp\"><p class=\"evh\">（四）定額法計算</p><p>公式：Dn＝C×(1－s)÷N×n。</p><p>代入：情況一（s＝10%）：1,000×0.9÷40×12；情況二（s＝0）：1,000÷40×12。</p><p>結果：情況一<b>270萬</b>，現值＝1,000－270＝<b>730萬</b>；情況二<b>300萬</b>，現值＝1,000－300＝<b>700萬</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>折舊額以經濟耐用年數為主，經歷年數大於經濟耐用年數應重新調整；殘餘價格率依全聯會公告、以不超過10%為原則，確無殘餘價格者不予提列。本題殘餘價格率10%時累積折舊270萬、現值730萬；無殘餘價格時累積折舊300萬、現值700萬。</p>"], "ck": [{"x": "折舊額以經濟耐用年數為主，必要時得以物理耐用年數", "h": true}, {"x": "經濟耐用年數（功能或效益衰退）與物理耐用年數（自然耗損或外力破壞）的區別", "h": false}, {"x": "經歷年數大於經濟耐用年數 → 重新調整，並於報告書敘明", "h": false}, {"x": "§67 殘餘價格率由全聯會公告，以不超過10%為原則", "h": true}, {"x": "確實無殘餘價格者不予提列（s＝0），不是仍用10%", "h": true}, {"x": "定額法 Dn＝C×(1－s)÷N×n，建物現值＝C－Dn", "h": false}, {"x": "情況一：1,000×0.9÷40×12＝270 萬，現值 730 萬（要列式）", "h": false}, {"x": "情況二：1,000÷40×12＝300 萬，現值 700 萬", "h": false}, {"x": "兩種情況各給累積折舊額與現值", "h": false}], "mn": "經濟為主 → 超過重調 → 殘價率 ≤10% 全聯會公告 → 無殘餘不提列 → Dn＝C(1－s)÷N×n：270／730 vs 300／700", "hp": 1032, "hpl": "中"}, {"id": "pred-21", "no": "115預測㉑", "t": "成本法資料蒐集、未完工建物之估價與特殊狀況成本之處理（§50、§51、§63、§64）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "成本法", "q": "依不動產估價技術規則，(一)成本法估價應蒐集哪些資料？(二)未完工之建物應如何估價？建物工程進度營造費用比例表由何者公告？(三)因特殊狀況致土地或建物投資無法產生相對正常報酬之成本，於成本估價時應如何處理？(四)某未完工建物，依標準建物之營造或施工費標準表估算完工營造費用為1,000萬元，假設查得工程進度營造費用比例表所列目前進度比例為40%，其已完成部分之營造費用為何？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>成本法除<span class=\"art\">§11</span>一般資料外，尚須就建物之設計、施工及成本費用蒐集資料，以估算成本價格。未完工建物須依實際完成部分或工程進度比例估算；因特殊狀況致投資無法產生相對正常報酬之成本，則不應全額計入。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§50</span>：除依<span class=\"art\">§11</span>蒐集資料外，<b>得</b>視需要申請及蒐集土地及建物所需資料七種。</span><span class=\"evli\"><span class=\"art\">§51</span>：<b>應</b>蒐集同一供需圈內之施工材料人工價格水準、各項費用資料、資本利率、開發或建築利潤率。</span><span class=\"evli\"><span class=\"art\">§63</span>：未完工建物依實際完成部分估價，或以標準建物營造或施工費標準表為基礎，參考建物工程進度營造費用比例表估算；比例表由全聯會公告。</span><span class=\"evli\"><span class=\"art\">§64</span>：投資無法產生相對正常報酬之成本，得不予計入或於折舊中扣除，並於報告書敘明。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應蒐集資料</p><p>依<span class=\"art\">§50</span>得蒐集土地開發及建築構想計畫書、設計圖說、相關許可或執照、施工計畫書、竣工圖、使用執照、登記（簿）謄本或建物平面位置圖；依<span class=\"art\">§51</span>應蒐集同一供需圈內各項施工材料、人工之價格水準，營造、施工、規劃、設計、廣告、銷售、管理及稅捐等費用資料，資本利率，開發或建築利潤率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>材料人工價格須取<b>同一供需圈內</b>資料，不得任意引用他區行情。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）未完工建物</p><p>依<span class=\"art\">§63</span>，應依實際完成部分估價，或以標準建物之營造或施工費標準表為基礎，參考建物工程進度營造費用比例表估算；該比例表<b>由全聯會公告</b>，不是估價師自訂。</p><p class=\"evx\"><span class=\"evt\">例</span><span>施工中之建物，以完工營造費用乘工程進度比例估算已完成部分。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）特殊狀況成本</p><p>依<span class=\"art\">§64</span>，因特殊狀況致土地或建物投資無法產生相對正常報酬之成本，於成本估價時<b>得</b>不予計入或於折舊中扣除，並應於估價報告書中敘明。</p><p class=\"evx\"><span class=\"evt\">例</span><span>無法由市場正常回收之投入，不計入成本價格，並於報告書說明理由。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）計算（<span class=\"art\">§63</span>）</p><p>公式：已完成部分營造費用＝完工營造費用×工程進度比例。代入：1,000萬元×40%。結果：<b>400萬元</b>（比例40%為題目假設）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>比例應依全聯會公告之比例表查得。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>成本法除<span class=\"art\">§11</span>資料外，得蒐集<span class=\"art\">§50</span>七種資料，並應蒐集<span class=\"art\">§51</span>同一供需圈內之材料人工、費用、資本利率及利潤率；未完工建物依<span class=\"art\">§63</span>以實際完成部分或參考全聯會公告之比例表估算；特殊狀況成本依<span class=\"art\">§64</span>得不計入或於折舊扣除並敘明。本題已完成部分營造費用為<b>400萬元</b>。</p>"], "ck": [{"x": "§50 得蒐集七種資料；§51 應蒐集同一供需圈內四類資料", "h": true}, {"x": "§63 未完工建物依實際完成部分或比例表估算", "h": false}, {"x": "建物工程進度營造費用比例表由全聯會公告（§63）", "h": true}, {"x": "§64 無相對正常報酬之成本得不予計入或於折舊中扣除，並於報告書敘明", "h": true}, {"x": "1,000×40%＝400 萬（比例為題目假設）", "h": false}, {"x": "已完成部分營造費用 400 萬元", "h": false}], "mn": "得蒐集七種、應蒐集四類；未完工看進度比例；無報酬成本不計入或折舊扣"}, {"id": "e100-1", "no": "100年第一題", "t": "土地開發分析法之利潤率與資本利息綜合利率", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "土地開發", "q": "運用土地開發分析法進行估價，除了必須確定開發計畫之可銷售土地與建築面積，同時估算總銷售金額與各項成本及相關費用，還有更重要的是如何有效選擇適當之利潤率及資本利息綜合利率，試說明利潤率及資本利息綜合利率計算依據與方法？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法係以開發完成後預期總銷售金額，扣除利潤、資本利息及直接、間接成本，回推土地開發分析價格。利潤率R與資本利息綜合利率i是公式中的兩個除數，選擇是否適當直接影響土地價格；利潤率是開發商要求之報酬，資本利息是資金成本，兩者不同。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§81</span>：V＝S÷(1＋R)÷(1＋i)－(C＋M)。</span><span class=\"evli\"><span class=\"art\">§78</span>、<span class=\"art\">§60</span>：利潤率依<span class=\"art\">§60</span>規定；</span><span class=\"evli\"><span class=\"art\">§60Ⅲ</span>建築工期之定義；</span><span class=\"evli\"><span class=\"art\">§60Ⅳ</span>勘估標的為土地或包含土地者，合計額應另加計土地價格。</span><span class=\"evli\"><span class=\"art\">§58</span>、<span class=\"art\">§59</span>：自有資金與借貸資金分別計息；預售收入不計息。</span><span class=\"evli\"><span class=\"art\">§79</span>：資本利息綜合利率公式及例外調整。</span><span class=\"evli\"><span class=\"art\">§80</span>：開發年數之估計。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）利潤率之依據</p><p>依<span class=\"art\">§60Ⅰ</span>，開發或建築利潤應視工程規模、開發年數與經濟景氣等因素，按營造或施工費、規劃設計費、廣告費、銷售費、管理費、資本利息、稅捐及其他負擔之合計額乘以適當利潤率計算；勘估標的為土地或包含土地者，合計額應另加計土地價格（<span class=\"art\">§60Ⅳ</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span><span class=\"art\">§81</span>公式中R是除在總銷售金額上，基礎與<span class=\"art\">§60</span>不同。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）利潤率之方法</p><p>由<b>全聯會定期公告</b>；未公告前，依營造或建築業之平均經營利潤率為準，並得依開發型態、經營風險及工期長短調整；建築工期指自申請建造執照開始至建築完成達到可交屋使用為止無間斷所需之時間（<span class=\"art\">§60Ⅲ</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>風險愈高、工期愈長，利潤率愈高（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）資本利息年利率</p><p>依<span class=\"art\">§58</span>，依分期投入資本額與使用年數，自有資金與借貸資金分別計息，資金比例依銀行一般放款成數決定；自有資金利率不高於一年期定存利率、不低於活存利率，借款依銀行短期放款利率；<b>預售收入不計息</b>（<span class=\"art\">§59</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>資金含預售收入者，該部分利率以0計。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）綜合利率</p><p>依<span class=\"art\">§79</span>，資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×½）×開發年數；開發年數依<span class=\"art\">§80</span>。土地於取得時即全額投入、全期計息，建物依工程進度分批投入、平均約半期，故<b>只有建物乘½</b>（教材）。資本利息負擔特殊，或取得土地後不是立即動工，得調整½並於報告書敘明；建物價值得以營造施工費加規劃設計費計。</p><p class=\"evx\"><span class=\"evt\">例</span><span>取得土地後未立即動工者，調整½並敘明。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>利潤率依全聯會公告或營造、建築業平均經營利潤率，並視開發型態、經營風險、工期長短調整；資本利息綜合利率則以自有、借貸資金加權之年利率，乘以（土地價值比率＋建物價值比率×½）再乘開發年數。最後代入V＝S÷(1＋R)÷(1＋i)－(C＋M)求土地開發分析價格。</p>"], "ck": [{"x": "§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M)，說明 R、i 位置", "h": false}, {"x": "§60・§78 利潤率：全聯會公告，未公告依營造或建築業平均經營利潤率", "h": false}, {"x": "可依開發型態、風險、工期調整（§60 未規定調整方向；「風險愈高、工期愈長，利潤率愈高」為教材補充）", "h": false}, {"x": "§79 i＝年利率×（土地比率＋建物比率×½）×開發年數", "h": true}, {"x": "§58・§59 年利率：自有與借貸資金分別計息；自有資金利率區間；預售收入不計息", "h": true}, {"x": "解釋土地乘 1、建物乘 ½ 的理由", "h": true}, {"x": "§80 開發年數；§79 例外得調整 ½ 並敘明", "h": false}, {"x": "區分利潤率（報酬）與資本利息（資金成本），最後代入 §81 求 V", "h": false}], "mn": "V 公式 §81 → 利潤率 §60・§78（公告→平均→調整）→ i＝年利率×(土地＋建物×½)×年數 §79 → §58・§59・§80", "hp": 1022, "hpl": "中"}, {"id": "e102-2", "no": "102年第二題", "t": "土地開發分析法試算價格計算（1600坪住宅區建地）", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "土地開發", "q": "現有一筆建地，土地面積1600坪，位於都市計畫住宅區，建蔽率50%，容積率225%，所在地區生活機能健全，土地現況不需整地為可建築狀態。根據最有效利用原則確立未來土地開發方式為興建透天住宅，在計算開發完成之總銷售面積與蒐集市場行情之後，得知一年後建築完成之預期總銷售金額為新臺幣12億4200萬元（一年之資金折現率為1.33%），建築所需的直接成本為新臺幣1億8000萬元，資本利息綜合利率為1.94%，開發商的要求利潤率為20%，規劃設計費用為營造費用的3%，廣告銷售費用為總銷售金額的5%，稅捐費用為總銷售金額的1%，管理費用為總銷售金額的3%，施工期間1年。請以土地開發分析法推估該土地的試算價格。", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法係以開發完成後總銷售金額，除以（1＋利潤率）及（1＋資本利息綜合利率）後，扣除直接成本與間接成本，求得土地開發分析價格。土地面積、建蔽率、容積率是用來推算可銷售面積；本題已直接給總銷售金額，故為干擾資料，不必計算。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">§81</span>：V＝S÷(1＋R)÷(1＋i)－(C＋M)；V＝土地開發分析價格，S＝開發完成後總銷售金額，R＝利潤率，i＝資本利息綜合利率，C＝直接成本，M＝間接成本。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）總銷售金額折現</p><p>公式：S＝一年後總銷售金額÷(1＋折現率)。代入：12億4200萬÷1.0133。結果：S≈<b>12億2,570萬元</b>（1,225,698,214）。</p></div><div class=\"evp\"><p class=\"evh\">（二）直接成本</p><p>C＝<b>1億8,000萬元</b>。</p></div><div class=\"evp\"><p class=\"evh\">（三）間接成本</p><p>規劃設計費＝1億8,000萬×3%＝540萬；廣告銷售費＝S×5%＝6,128萬；稅捐＝S×1%＝1,226萬；管理費＝S×3%＝3,677萬；M≈<b>1億1,571萬元</b>。規劃設計費以營造費（直接成本）為基礎，廣告、稅捐、管理費以總銷售金額為基礎。</p></div><div class=\"evp\"><p class=\"evh\">（四）代入公式</p><p>利潤率20%、資本利息綜合利率1.94%直接代入，不用再算（1.94%已含施工1年）。S÷1.20÷1.0194≈10億0,198萬元；V＝10億0,198萬－（1億8,000萬＋1億1,571萬）≈<b>7億0,626萬元</b>（706,264,000元），平均每坪約<b>44.1萬元</b>。</p></div><div class=\"evp\"><p class=\"evh\">（五）計算基礎</p><p>補習班老師擬答採「費用配合折現後之 S」，得706,263,988元；老師並自註「技術規則並無明確規定」。若不折現，V約7.18億；若S折現而費用直接按題給12.42億計，M≈1.1718億、V約7.0480億。作答時務必寫明費用的計算基礎。</p></div>", "<span class=\"blk-l\">四、結論</span><p>以土地開發分析法推估，該筆土地之試算價格約為<b>7億0,626萬元</b>（每坪約44.1萬元）。計算重點：<span class=\"evli\">①總銷售金額折現；</span><span class=\"evli\">②間接成本之計算基礎不同（設計費按營造費、其餘按總銷售金額）；</span><span class=\"evli\">③利潤率與資本利息綜合利率依公式代入。</span></p>"], "ck": [{"x": "§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M)，寫出各符號", "h": false}, {"x": "土地面積、建蔽率、容積率為干擾資料，不必計算", "h": true}, {"x": "S＝12.42 億÷1.0133≈12.257 億（一年後折現）", "h": false}, {"x": "M 基礎不同：設計費按營造費，廣告、稅捐、管理按總銷售金額；M≈1.157 億", "h": true}, {"x": "利潤率 20%、資本利息綜合利率 1.94% 直接代入", "h": false}, {"x": "S÷1.20÷1.0194≈10.0198 億，再減(C＋M)", "h": false}, {"x": "寫明假設與費用基礎：本解 7.06 億；費用按題給 12.42 億約 7.05 億；不折現約 7.18 億（官方採哪種查不到）", "h": true}, {"x": "V≈7.06 億元，約 44.1 萬/坪", "h": false}], "mn": "S 折現 → 再除(1+R)(1+i) → 減(C+M)；設計費按營造費、其餘按總銷售", "hp": 1021, "hpl": "中"}, {"id": "e105-2", "no": "105年第二題", "t": "土地開發分析法資本利息綜合利率之公式與計算", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "土地開發", "q": "請依不動產估價技術規則之規定，列示土地開發分析法中計算資本利息綜合利率之公式。假設土地與建物價值比率為6：4，自有、借貸與預售收入之資金比例為4：5：1，自有資金與借貸資金之計息利率為2%與6%，而取得土地至開發完成之年數為2年，則資本利息綜合利率為若干？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>資本利息綜合利率i，係以資本利息年利率乘以（土地比率＋建物比率×½）再乘以開發年數求得；年利率依資金比例加權，預售收入不計息。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§79</span>：資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×½）×開發年數。</span><span class=\"evli\"><span class=\"art\">§58</span>、<span class=\"art\">§59</span>：自有資金與借貸資金分別計息、依資金比例加權；預售收入不計息。</span><span class=\"evli\"><span class=\"art\">§80</span>：開發年數自價格日期起至開發完成為止無間斷所需之時間。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）資本利息年利率</p><p>公式：依資金比例加權。代入：4/10×2%＋5/10×6%＋1/10×0%＝0.8%＋3.0%＋0。結果：<b>3.8%</b>。預售收入屬購屋人預付款，不是需付利息之資金，故利率為0。</p></div><div class=\"evp\"><p class=\"evh\">（二）括號項</p><p>土地60%、建物40%，只有建物乘½；60%＋40%×½＝<b>80%</b>。6：4用在括號，4：5：1用在年利率，兩組比例不同。</p></div><div class=\"evp\"><p class=\"evh\">（三）綜合利率</p><p>3.8%×80%×2年＝<b>6.08%</b>；別忘了乘開發年數2年。</p></div>", "<span class=\"blk-l\">四、結論</span><p>資本利息綜合利率之公式為：資本利息年利率×（土地價值比率＋建物價值比率×½）×開發年數。本題年利率3.8%，括號項80%，開發2年，故資本利息綜合利率為<b>6.08%</b>。</p>"], "ck": [{"x": "§79 公式：年利率×（土地比率＋建物比率×½）×開發年數", "h": false}, {"x": "年利率依 §58、§59：自有與借貸分別計息、依資金比例加權", "h": false}, {"x": "預售收入不計息（§59），利率以 0 計", "h": true}, {"x": "年利率 4/10×2%＋5/10×6%＋1/10×0%＝3.8%", "h": false}, {"x": "土地建物 6:4 進括號，資金 4:5:1 算年利率，兩組比例不混用；括號＝80%", "h": true}, {"x": "3.8%×80%×2 年＝6.08%，別忘乘開發年數", "h": true}, {"x": "公式一句話答出", "h": false}, {"x": "結論：綜合利率 6.08%", "h": false}], "mn": "§79 公式 → 年利率 3.8%（預售不計息）→ 括號 80%（建物×½）→ ×2 年＝6.08%", "hp": 1020, "hpl": "中"}, {"id": "e109-2", "no": "109年第二題", "t": "土地開發分析法應蒐集之資料", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "土地開發", "q": "依土地開發分析法對不動產進行估價時，需要蒐集那些資料，方能利於計算土地開發分析價格？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法所需資料，除一般估價之基本資料外，得視需要另蒐集開發構想、設計圖說、成本費用、資本利率及利潤率資料，並蒐集市場行情，以對應公式中可銷售面積、S、C、M、R與i之計算。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§11</span>：基本資料、價格影響因素及交易、收益、成本資料。</span><span class=\"evli\"><span class=\"art\">§72</span>：除依<span class=\"art\">§11</span>外，得視需要另蒐集土地及建物所需資料。</span><span class=\"evli\"><span class=\"art\">§71②</span>：調查各項成本及相關費用並蒐集市場行情等資料。</span><span class=\"evli\"><span class=\"art\">§73</span>：現況勘察與環境發展程度之調查及分析事項。</span><span class=\"evli\"><span class=\"art\">§75</span>：銷售單價以比較法或收益法求取。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）基本資料（<span class=\"art\">§11</span>）</p><p>勘估標的之標示、權利、法定用途及使用管制等基本資料（教材：如位置、面積、使用分區及使用強度〈建蔽率、容積率〉）；影響價格之一般因素、區域因素及個別因素；相關交易、收益及成本資料。</p></div><div class=\"evp\"><p class=\"evh\">（二）得另蒐集之資料（<span class=\"art\">§72</span>）</p><p>開發構想計畫書；建築設計圖說或土地規劃配置圖說；建照申請書或建造執照；營造或施工費資料；規劃、設計、廣告、銷售、管理及稅捐等費用資料；資本利率；開發或建築利潤率。</p></div><div class=\"evp\"><p class=\"evh\">（三）程序與現況勘察資料（<span class=\"art\">§71②</span>、<span class=\"art\">§73</span>）</p><p>調查各項成本及相關費用並蒐集市場行情；調查影響總銷售金額、成本及費用等因素；確認勘估標的之工程進度、施工及環境狀況並攝製必要照片或影像檔；市場交易資料之蒐集、調查；週遭環境土地建物及公共設施開發程度。銷售單價以比較法或收益法求取（<span class=\"art\">§75</span>），故須蒐集比較、收益案例。</p></div><div class=\"evp\"><p class=\"evh\">（四）資料對應公式</p><p>設計圖說、配置圖、建照估算可銷售面積（<span class=\"art\">§74</span>）；市場交易資料估算S（<span class=\"art\">§75</span>）；營造或施工費估算C（<span class=\"art\">§76</span>）；規劃設計、廣告、銷售、管理、稅捐估算M（<span class=\"art\">§76</span>、<span class=\"art\">§77</span>、<span class=\"art\">§78</span>）；利潤率、資本利息年利率、土地建物比率、開發年數求R與i（<span class=\"art\">§60</span>、<span class=\"art\">§79</span>、<span class=\"art\">§80</span>）。只列成本面資料會漏分。</p></div>", "<span class=\"blk-l\">四、結論</span><p>土地開發分析法除<span class=\"art\">§11</span>基本資料外，得視需要依<span class=\"art\">§72</span>另蒐集開發構想計畫書、設計圖說、建照、營造或施工費、各項費用、資本利率及開發或建築利潤率等資料；並依<span class=\"art\">§71②</span>、<span class=\"art\">§73</span>調查成本費用、蒐集市場交易資料、確認工程進度與周遭開發程度，據以計算V。</p>"], "ck": [{"x": "§11 基本資料：標示、權利、法定用途、使用管制；一般・區域・個別因素；比較・收益・成本", "h": false}, {"x": "§72 七項另蒐集資料逐項列出", "h": false}, {"x": "設計圖說、配置圖、建照→可銷售面積（§74）", "h": false}, {"x": "市場交易資料（比較法或收益法）→總銷售金額 S（§75）", "h": true}, {"x": "利潤率、資本利息之利率資料→R 與 i", "h": true}, {"x": "資料對應 S、C、M、R、i，不只列成本面", "h": true}, {"x": "結論：除基本資料外另蒐集 §72 各項，據以計算 V", "h": false}], "mn": "§11 基本 → §72 七項 → 對應 S・C・M・R・i → 不只成本面", "hp": 1019, "hpl": "中"}, {"id": "e113-2", "no": "113年第二題", "t": "土地開發分析法之計算公式與成本項目", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "土地開發", "q": "請說明土地開發分析法之計算公式，又土地開發分析法之成本項目內容為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法之公式為V＝S÷(1＋R)÷(1＋i)－(C＋M)。成本項目分直接成本C與間接成本M；資本利息與利潤不列入C或M，而是分別以i與R在公式中處理。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§81</span>：計算公式。</span><span class=\"evli\"><span class=\"art\">§60</span>、<span class=\"art\">§78</span>：適當利潤率R。</span><span class=\"evli\"><span class=\"art\">§79</span>：資本利息綜合利率i。</span><span class=\"evli\"><span class=\"art\">§76</span>：成本項目。</span><span class=\"evli\"><span class=\"art\">§77</span>：廣告費、銷售費、管理費、稅捐按總銷售金額乘全聯會公告費率。</span><span class=\"evli\"><span class=\"art\">§78</span>準用<span class=\"art\">§57</span>：規劃設計費。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公式（<span class=\"art\">§81</span>）</p><p>V為土地開發分析價格；S為開發或建築後預期總銷售金額；R為適當利潤率；i＝資本利息年利率×（土地價值比率＋建物價值比率×½）×開發年數；C為直接成本；M為間接成本。S先除以（1＋R）與（1＋i），再扣（C＋M），不是直接減法。</p></div><div class=\"evp\"><p class=\"evh\">（二）直接成本C</p><p>營造或施工費，可參照成本法之直接法或間接法（<span class=\"art\">§54</span>～<span class=\"art\">§56</span>）估計（教材／實務）。直接成本只有營造施工費，其餘皆為間接成本。</p></div><div class=\"evp\"><p class=\"evh\">（三）間接成本M</p><p><span class=\"evli\">①規劃設計費：依<span class=\"art\">§78</span>準用<span class=\"art\">§57</span>，按建築師酬金標準表及建造執照工程造價表計算，或按實際營造施工費之百分之二至百分之三推估；</span><span class=\"evli\">②廣告費、銷售費；</span><span class=\"evli\">③管理費；</span><span class=\"evli\">④稅捐及其他負擔。</span><span class=\"evli\">②～④按總銷售金額乘全聯會公告費率（<span class=\"art\">§77</span>）；其他負擔<span class=\"art\">§77</span>未列，依實際情形估列（教材／實務）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>土地開發分析法之公式為V＝S÷(1＋R)÷(1＋i)－(C＋M)；直接成本為營造或施工費，間接成本包括規劃設計費、廣告銷售費、管理費及稅捐等；資本利息與利潤則以資本利息綜合利率與利潤率於公式中計入。</p>"], "ck": [{"x": "§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M)", "h": false}, {"x": "逐一寫出 V、S、R、i、C、M 符號意義", "h": false}, {"x": "§79 資本利息綜合利率＝年利率×（土地比率＋建物比率×½）×開發年數", "h": false}, {"x": "先除以（1＋R）（1＋i）再扣（C＋M），不是 S－成本－利息－利潤", "h": true}, {"x": "§76 直接成本＝營造或施工費；間接成本四項", "h": false}, {"x": "規劃設計費 §57 或 2%～3%；廣告銷售、管理、稅捐按總銷售金額乘公告費率（§77）", "h": false}, {"x": "資本利息與利潤不列入 C 或 M", "h": true}, {"x": "稅捐屬間接成本；直接成本只有營造施工費", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "公式 §81 → i §79 → 先除後扣 → C＝營造施工費 → M＝設計・廣告銷售・管理・稅捐 → 息、利不入 C、M", "hp": 1018, "hpl": "中"}, {"id": "mk-c5-1", "no": "綜合模擬卷五 申論一", "t": "土地開發分析法之意義、程序、公式與計算（資本利息綜合利率6.4%）", "lv": "本站模擬卷・必考（A級）", "k": "mkc", "tier": 0, "g": "土地開發", "q": "試依「不動產估價技術規則」說明土地開發分析法之意義、估價程序及價格公式。某開發案資料：預期總銷售金額100,000萬元，直接成本（營造施工費）36,000萬元，間接成本9,000萬元，適當利潤率15%，資本利息年利率4%，土地價值比率60%、建物價值比率40%，開發年數2年。試求資本利息綜合利率及土地開發分析價格。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法，指根據土地法定用途及使用強度，進行開發或建築所需之成本推算，估算開發或建築後之總銷售金額，扣除直接成本、間接成本、資本利息及利潤後，求得開發前或建築前之土地價格；所求得之價格為<b>土地開發分析價格</b>（<span class=\"art\">§70</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§71</span>估價程序：①確定土地開發內容及預期開發時間②調查各項成本及相關費用並蒐集市場行情等資料③現況勘察並進行環境發展程度之調查及分析④估算開發或建築後可銷售之土地或建物面積⑤估算開發或建築後總銷售金額⑥估算開發或建築所需各項成本及相關費用⑦選擇適當之利潤率及資本利息綜合利率⑧計算土地開發分析價格。</span><span class=\"evli\"><span class=\"art\">§81</span>：V＝S÷(1＋R)÷(1＋i)－(C＋M)；V＝土地開發分析價格；S＝總銷售金額；R＝適當利潤率；i＝資本利息綜合利率；C＝直接成本；M＝間接成本。</span><span class=\"evli\"><span class=\"art\">§79</span>：i＝年利率×（土地價值比率＋建物價值比率×1/2）×開發年數。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）資本利息綜合利率</p><p>i＝4%×（0.6＋0.4×1/2）×2＝4%×0.8×2＝<b>6.4%</b>。建物資金係陸續投入，平均占用約半期，故建物價值比率乘1/2；土地資金自始占用，不打折。</p></div><div class=\"evp\"><p class=\"evh\">（二）代入計算</p><p>100,000÷1.15÷1.064≈81,726萬元；C＋M＝36,000＋9,000＝45,000萬元；V＝81,726－45,000＝<b>36,726萬元</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，本案資本利息綜合利率為6.4%，土地開發分析價格約為36,726萬元（<span class=\"art\">§79</span>、<span class=\"art\">§81</span>）。考試時依題目所給數字與取位為準。</p>"], "ck": [{"x": "§70 意義：總銷售金額扣除直接成本、間接成本、資本利息及利潤", "h": false}, {"x": "§71 八步程序依序寫出", "h": false}, {"x": "§81 公式 V＝S÷(1＋R)÷(1＋i)－(C＋M) 及符號說明", "h": true}, {"x": "§79 i＝年利率×（土地價值比率＋建物價值比率×1/2）×開發年數", "h": true}, {"x": "i＝4%×0.8×2＝6.4%", "h": false}, {"x": "100,000÷1.15÷1.064≈81,726（先連除再減）", "h": true}, {"x": "V＝81,726－45,000＝36,726萬元", "h": false}], "mn": "賣完的錢 → 除利潤、除利息 → 減成本 → 土地價", "hp": 1024, "hpl": "中"}, {"id": "mk-ls1", "no": "來勝115（一）申論一", "t": "土地開發分析法之意義、應用時機、公式及估價程序", "lv": "補習班模擬卷・參考", "k": "mkls", "tier": 3, "g": "土地開發", "q": "試述土地開發分析法之意義、應用時機、公式及估價程序？（25分）\n出題：許文昌（高點・永慶）｜補習班模擬題，非考選部官方試題｜打開整份模擬卷", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p><b>土地開發分析法</b>，指依土地法定用途與使用強度，估算開發或建築後之總銷售金額，扣除開發期間之直接成本、間接成本、資本利息及利潤後，求得開發前或建築前之土地開發分析價格（<span class=\"art\">§70</span>）。核心精神為房價推求地價，即由開發完成後的價值反推土地價值。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§70</span>：定義；</span><span class=\"evli\"><span class=\"art\">§71</span>：估價程序八步；</span><span class=\"evli\"><span class=\"art\">§59</span>：預售收入之資金不計息。</span><span class=\"evli\"><span class=\"art\">§81</span>公式：V＝S÷（1＋R）÷（1＋i）－（C＋M）。V：土地開發分析價格；S：開發或建築後預期總銷售金額；R：適當利潤率；C：直接成本；M：間接成本；i：資本利息綜合利率。</span><span class=\"evli\"><span class=\"art\">§79</span>：i＝資本利息年利率×（土地價值比率＋建物價值比率×½）×開發年數。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應用時機</p><p>1.建地之估價。</p><p class=\"evx\"><span class=\"evt\">例</span><span>住宅、商業、工業用地。2.須經開發改良之土地於開發前之地價。例：山坡地、工業區土地、重劃區土地。3.共同條件：土地具開發或再開發可能，且開發後之使用類型、規模及市場需求可合理預測。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）公式運用</p><p>利潤率R與利息i以「除」處理，因利潤、利息皆按總成本比例計算，故先自總銷售金額還原，再減直接成本與間接成本。建物成本分批投入故乘½，土地於取得時即投入故乘1；年利率依借貸、自有資金比例加權，預售收入不計息。</p></div><div class=\"evp\"><p class=\"evh\">（三）估價程序（<span class=\"art\">§71</span>）</p><p>1.確定開發內容（面積、用途、使用強度）及預期開發時間；2.調查各項成本及相關費用，蒐集市場行情資料（<span class=\"art\">§72</span>）；3.現況勘察，分析環境及周邊開發程度（<span class=\"art\">§73</span>）；4.在最有效使用下，估算可銷售之土地或建物面積（<span class=\"art\">§74</span>）；5.面積乘以可銷售單價，加總得總銷售金額（<span class=\"art\">§75</span>）；6.估算營造施工費、規劃設計費、廣告費及銷售費、管理費、稅捐及其他負擔等成本（<span class=\"art\">§76</span>、<span class=\"art\">§77</span>）；7.選定適當利潤率，並計算資本利息綜合利率（<span class=\"art\">§78</span>、<span class=\"art\">§79</span>）；8.代入公式，求得土地開發分析價格（<span class=\"art\">§81</span>）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，土地開發分析法適用於有開發潛力之建地與待改良土地，先估銷售、再逐項扣除成本與利息利潤，倒推得開發前地價（<span class=\"art\">§70</span>、<span class=\"art\">§71</span>、<span class=\"art\">§81</span>）。</p>"], "ck": [{"x": "§70 意義：總銷售金額扣除直接成本、間接成本、資本利息及利潤，求開發前或建築前之土地開發分析價格", "h": false}, {"x": "核心精神：房價推求地價", "h": false}, {"x": "應用時機兩點並各舉例：建地（住宅、商業、工業用地）；待開發改良土地（山坡地、工業區土地、重劃區土地）", "h": true}, {"x": "§81 V＝S÷(1＋R)÷(1＋i)－(C＋M)，利潤、利息是「除」不是「減」，六個符號寫齊", "h": true}, {"x": "§79 i＝年利率×（土地比率＋建物比率×½）×開發年數；預售收入不計息（§59）", "h": true}, {"x": "§71 八步依序寫出，最後一步代入公式", "h": false}, {"x": "四個子題（意義、時機、公式、程序）各有標題與一句結論", "h": false}], "mn": "賣完的錢 → 除利潤、除利息 → 減成本 → 開發前地價", "hp": 1025, "hpl": "中"}, {"id": "pred-3", "no": "115預測③", "t": "土地開發分析法完整計算（含資本利息綜合利率）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "土地開發", "q": "某建地600坪，開發後預期總銷售金額（價格日期現值）6億元；直接成本（營造施工費）1億8,000萬元；規劃設計費為營造施工費之3%；廣告銷售費為總銷售金額之5%，稅捐1%，管理費3%；資本利息年利率：銀行借款60%（利率3%）、自有資金40%（利率6%）〔⚠ 本題利率為模擬題自設且刻意與 §59 的方向相反——§59 規定自有資金計息利率應不高於一年期定存且不低於活存，實務上低於借款利率；作答時依題給數字計算，但不要把「自有＞借貸」記成常態〕；土地與建物價值比率5：5；開發期間2年；開發利潤率15%。試以土地開發分析法推估土地總價及每坪單價。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地開發分析法以開發完成後總銷售金額，除以（1＋R）、（1＋i）後，扣除直接成本與間接成本，求取土地開發分析價格。本題先算資本利息年利率與綜合利率，再算間接成本，最後代入公式。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§81</span>：V＝S÷(1＋R)÷(1＋i)－(C＋M)。</span><span class=\"evli\"><span class=\"art\">§58</span>、<span class=\"art\">§59</span>：資本利息年利率；預售收入不計息。實務自有資金利率應不高於一年期定存利率、不低於活存利率，題目另有給定者從題目。</span><span class=\"evli\"><span class=\"art\">§79</span>：綜合利率。</span><span class=\"evli\"><span class=\"art\">§76</span>～<span class=\"art\">§78</span>：間接成本。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）年利率（<span class=\"art\">§58</span>、<span class=\"art\">§59</span>）</p><p>60%×3%＋40%×6%＝1.8%＋2.4%＝<b>4.2%</b>（本題利率為模擬題自設）。</p></div><div class=\"evp\"><p class=\"evh\">（二）綜合利率i（<span class=\"art\">§79</span>）</p><p>公式：年利率×（土地比率＋建物比率×½）×開發年數。代入：4.2%×（50%＋50%×½）×2年＝4.2%×75%×2。結果：<b>6.3%</b>。土地乘1、建物乘½，並乘開發年數。</p></div><div class=\"evp\"><p class=\"evh\">（三）直接成本C</p><p><b>18,000萬元</b>。</p></div><div class=\"evp\"><p class=\"evh\">（四）間接成本M</p><p>規劃設計費18,000×3%＝540；廣告銷售費60,000×5%＝3,000；稅捐60,000×1%＝600；管理費60,000×3%＝1,800；M＝<b>5,940萬元</b>。規劃設計費以營造施工費為基礎，其餘以總銷售金額為基礎。</p></div><div class=\"evp\"><p class=\"evh\">（五）代入公式</p><p>60,000÷1.15÷1.063≈49,082；V＝49,082－（18,000＋5,940）≈<b>25,142萬元</b>；每坪≈25,142÷600≈<b>41.9萬元/坪</b>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>依土地開發分析法，本案土地總價約<b>2億5,142萬元</b>，每坪約<b>41.9萬元</b>。計算關鍵：資本利息綜合利率＝年利率×（土地價值比率＋建物價值比率×½）×開發年數；V＝S÷(1＋R)÷(1＋i)－(C＋M)（<span class=\"art\">§79</span>、<span class=\"art\">§81</span>）。</p>"], "ck": [{"x": "§81 V＝S÷(1＋R)÷(1＋i)－(C＋M)，並寫出符號", "h": false}, {"x": "資本利息年利率 60%×3%＋40%×6%＝4.2%", "h": false}, {"x": "§79 i＝年利率×（土地比率＋建物比率×½）×開發年數＝6.3%", "h": true}, {"x": "M：規劃設計費按營造施工費 540；廣告銷售費、稅捐、管理費按總銷售金額 3,000、600、1,800；M＝5,940", "h": true}, {"x": "先把 S 除以（1＋R）、（1＋i），再減（C＋M）", "h": true}, {"x": "土地總價約 25,142 萬元", "h": false}, {"x": "每坪單價 25,142÷600≈41.9 萬元", "h": false}, {"x": "答出總價與每坪單價兩個數字，附單位", "h": false}], "mn": "年利率 4.2% → 綜合利率 6.3% → C 18,000 → M 5,940 → V＝60,000÷1.15÷1.063－23,940 → ÷600≈41.9", "hp": 1023, "hpl": "中"}, {"id": "pred-6", "no": "115預測⑥", "t": "區分所有建物樓層別效用比與基地單價推估", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "土地開發", "q": "區分所有建物之估價為何須考量樓層別效用比？依技術規則，如何由房地價格推估區分所有建物之基地單價？假設某大樓第5層住宅房地價格2,000萬元，土地價值比率40%，基地持分面積8坪，該戶樓層別效用比120，平均樓層別效用比100，試求其基地單價。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>樓層別效用比，係區分所有建物各樓層因採光、景觀、便利性與使用效用不同而產生之價格比值，用以調整比較標的與勘估標的之樓層差異（教材）；其比值由全聯會按不同地區所蒐集案例公告，並依市場行情及地方習慣推估（<span class=\"art\">§98Ⅱ</span>）。土地價值比率為房地總價中土地所占比率，應參酌當地市場調查資料，運用估價方法計算（<span class=\"art\">§99Ⅲ</span>、<span class=\"art\">§101Ⅱ</span>）。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§98Ⅰ</span>：區分所有建物應就專有部分、共用部分之比例及基地權利合併估價，並考量樓層別效用比及位置差異調整。</span><span class=\"evli\"><span class=\"art\">§99</span>：基地價格＝房地價格－建物成本價格；基地單價＝基地價格÷基地面積。</span><span class=\"evli\"><span class=\"art\">§100</span>：地價分配率法，以建物成本價格相減並以地價分配率調整。</span><span class=\"evli\"><span class=\"art\">§101</span>：基地權利價格＝房地價格×土地價值比率；基地權利單價＝基地權利價格÷基地持分面積；基地單價＝基地權利單價×平均樓層別效用比÷該建物之樓層別效用比。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）為何考量樓層別效用比</p><p>依<span class=\"art\">§98Ⅰ</span>，各樓層效用不同致價格不同，須合併估價並就樓層別效用比與位置差異作適當調整。</p><p class=\"evx\"><span class=\"evt\">例</span><span><span class=\"art\">§98</span>要合併估價專有、共用部分與基地權利，不能只估專有部分。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）如何推估基地單價</p><p>已知土地價值比率者依<span class=\"art\">§101</span>；給建物成本價格者依<span class=\"art\">§100</span>（一般房地依<span class=\"art\">§99</span>）相減並以地價分配率調整。兩條是二選一的不同算法，依題目條件判斷，勿混用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>本題給土地價值比率40%，故適用<span class=\"art\">§101</span>。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）計算（<span class=\"art\">§101</span>）</p><p><span class=\"evli\">①基地權利價格＝房地價格×土地價值比率＝2,000×40%＝<b>800萬元</b>；</span><span class=\"evli\">②基地權利單價＝基地權利價格÷基地持分面積＝800÷8坪＝<b>100萬元/坪</b>；</span><span class=\"evli\">③基地單價＝基地權利單價×平均樓層別效用比÷該戶樓層別效用比＝100×(100÷120)＝100×0.8333≈<b>83.33萬元/坪</b>。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>第5層效用比高於平均（120＞100），房地價格含樓層溢價，不屬於土地，故基地單價低於權利單價。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）陷阱</p><p><span class=\"art\">§101</span>是乘平均、除該戶，顛倒會變成100×120÷100＝120；求單價用持分面積，不是整棟基地面積。</p><p class=\"evx\"><span class=\"evt\">例</span><span>效用比是相對比值，不要誤當成價格。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>區分所有建物須合併專有部分、共用部分與基地權利估價，並就樓層別效用比與位置差異調整（<span class=\"art\">§98</span>）。本題已知土地價值比率，依<span class=\"art\">§101</span>：2,000×40%＝800萬，除以持分8坪得100萬/坪，再乘平均效用比100、除以該戶效用比120，基地單價約<b>83.33萬元/坪</b>。</p>"], "ck": [{"x": "§98 樓層別效用比定義，用於調整樓層差異；全聯會公告供參考", "h": false}, {"x": "§98 合併估價專有部分、共用部分與基地權利，不能只估專有部分", "h": true}, {"x": "區分所有建物：§100 與 §101 二選一（一般標的為 §99），依題目給的條件判斷，勿混用", "h": true}, {"x": "§100 基地單價＝權利單價×平均地價分配率÷該建物地價分配率，並寫出分配率公式", "h": false}, {"x": "§101 三步公式：房地價格×比率→÷持分面積→×平均效用比÷該戶效用比", "h": false}, {"x": "代入 2,000×40%＝800；800÷8＝100（用持分面積）", "h": true}, {"x": "乘平均 100、除該戶 120，不可顛倒", "h": false}, {"x": "基地單價約 83.33 萬元/坪，並說明低於權利單價的原因", "h": false}], "mn": "§98 合併估價＋效用比調整 → §99・§100 或 §101 二選一 → §101：房地×比率 → ÷持分面積 → ×平均÷該戶＝83.33"}, {"id": "pred-13", "no": "115預測⑬", "t": "都市更新基地價值比率與「由房地價格拆出土地、建物價格」（§125、§99、§101-1）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "土地開發", "q": "某都市更新權利變換案，基地總面積400坪，素地單價每坪50萬元；建物營造施工費單價每坪10萬元，累積折舊率20%，全棟建物面積1,000坪。(一)依技術規則求基地價值比率；(二)某戶房地價格3,000萬元，基地持分面積8坪，試依價值比率求其土地價格、建物價格及基地權利單價；(三)說明本題做法與「房地價格－建物成本價格」直接相減有何不同。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>基地價值比率（<span class=\"art\">§125</span>）係都市更新權利變換前為區分所有建物者，以基地價值占「基地價值＋建物價值」之比率，分算各區分所有建物房地總價之基地權利價值。其建物價值須以營造施工費扣除累積折舊後計算。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§125</span>：各區分所有建物之基地權利價值＝各區分所有建物房地總價×基地價值比率；基地價值比率＝素地單價×基地總面積÷〔素地單價×基地總面積＋營造或施工費單價×（1－累積折舊率）×全棟建物面積〕；顯失公平者得依<span class=\"art\">§126-2</span>調整。</span><span class=\"evli\"><span class=\"art\">§99</span>：基地價格＝房地價格－建物成本價格；比率已知者，基地價格＝房地價格×土地價值比率。</span><span class=\"evli\"><span class=\"art\">§101-1</span>：建物價格得以房地價格×建物價值比率計算。</span><span class=\"evli\"><span class=\"art\">§100</span>：區分所有建物給建物成本價格者，以相減求基地權利價格。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）基地價值比率（<span class=\"art\">§125</span>）</p><p>素地總價值＝50萬×400坪＝<b>20,000萬</b>；建物價值＝10萬×(1－20%)×1,000坪＝<b>8,000萬</b>；基地價值比率＝20,000÷(20,000＋8,000)＝<b>71.43%</b>，建物價值比率＝28.57%。</p><p class=\"evx\"><span class=\"evt\">例</span><span>分母須含扣折舊後之建物價值，營造施工費要乘(1－累積折舊率)。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）土地價格、建物價格及基地權利單價</p><p>土地價格＝3,000×71.43%≈<b>2,142.9萬</b>；建物價格＝3,000×28.57%≈<b>857.1萬</b>（<span class=\"art\">§101-1</span>）；基地權利單價＝2,142.9÷8坪≈<b>267.9萬/坪</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>基地權利單價用持分面積計算。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）與直接相減之不同</p><p>若題目改給建物成本價格1,000萬元，則區分所有建物依<span class=\"art\">§100</span>相減（一般房地依<span class=\"art\">§99</span>）：基地價格＝3,000－1,000＝2,000萬元。價值比率法按整個基地建物的價值比例拆分，直接相減則以個案建物成本價格為準，故兩者數字不同。</p><p class=\"evx\"><span class=\"evt\">例</span><span>給成本→減（<span class=\"art\">§100</span>）；給比率→乘（<span class=\"art\">§101</span>）；都更權利變換→<span class=\"art\">§125</span>先算比率再乘。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>依<span class=\"art\">§125</span>，本案基地價值比率約<b>71.43%</b>；某戶房地價格3,000萬元，依價值比率拆得土地價格約2,142.9萬元、建物價格約857.1萬元，基地權利單價約267.9萬元/坪。若題目給的是建物成本價格，則依<span class=\"art\">§100</span>相減，須依題目條件擇一，不可混用。</p>"], "ck": [{"x": "§125 基地價值比率公式，分母為土地價值＋折舊後建物價值", "h": false}, {"x": "建物價值要乘(1－累積折舊率)：10×0.8×1,000＝8,000 萬", "h": true}, {"x": "比率 20,000÷28,000＝71.43%；建物比率＝1－基地比率＝28.57%", "h": false}, {"x": "給比率→乘：基地用 §99Ⅱ、建物用 §101-1", "h": false}, {"x": "土地 2,142.9 萬、建物 857.1 萬", "h": false}, {"x": "基地權利單價用持分面積 8 坪：2,142.9÷8≈267.9 萬/坪", "h": true}, {"x": "§99 給建物成本價格→相減（3,000－1,000＝2,000 萬）", "h": false}, {"x": "兩種條件數字不同，依題目條件擇一不可混用", "h": true}], "mn": "給成本→減（§100）；給比率→乘（§99Ⅱ、§101-1）；都更權利變換→§125 先算比率再乘"}, {"id": "e99-2", "no": "99年第二題", "t": "比較法情況、價格日期、區域因素與個別因素之調整重點", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "比較法", "q": "比較法以比較標的不動產之價格為基礎，經比較、分析與調整推算勘估標的不動產之價格，請分別就情況、價格日期、區域因素與個別因素等調整內容，詳細說明調整之重點為何？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>依<span class=\"art\">§21</span>比較法程序，先做<b>情況調整、價格日期調整</b>，再比較<b>區域因素、個別因素</b>差異求調整率或調整額，最後算試算價格。四項調整各有重點。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§19</span>：情況、價格日期、區域因素、個別因素調整之定義。</span><span class=\"evli\"><span class=\"art\">§21</span>：比較法程序。</span><span class=\"evli\"><span class=\"art\">§22</span>：交易價格等事項之查證。</span><span class=\"evli\"><span class=\"art\">§23</span>：特殊情況先作適當調整，無法有效掌握及量化者不予採用。</span><span class=\"evli\"><span class=\"art\">§24</span>：百分率法為原則，亦可採差額法。</span><span class=\"evli\"><span class=\"art\">§25</span>、<span class=\"art\">§26</span>、<span class=\"art\">§27</span>：調整率門檻、試算價格差距、至少三件。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）情況調整</p><p>依<span class=\"art\">§22</span>先查證交易價格與費用負擔方式、交易條件（含特殊付款）、標的狀況、交易日期；有<span class=\"art\">§23</span>所列情況應先作適當之調整，無法有效掌握及量化調整時，應不予採用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>急買急賣、親友交易、拍賣價格多偏低，期待因素、哄抬交易價格多偏高（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）價格日期調整</p><p>依<span class=\"art\">§19②</span>以適當之變動率或變動金額，將比較標的價格調整為勘估標的價格日期之價格，並說明變動率依據（教材）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>以地價指數、房價指數、實價登錄趨勢換算（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）區域因素調整</p><p>依<span class=\"art\">§19③</span>，比較標的與勘估標的不在同一近鄰地區時，以比較標的之區域價格水準為基礎，轉化為勘估標的同一近鄰地區內之價格水準。</p><p class=\"evx\"><span class=\"evt\">例</span><span>依交通、公共設施、環境、使用管制差異逐項調整（教材）；同一近鄰地區則不需此項。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）個別因素調整</p><p>就個別條件差異逐項調整。</p><p class=\"evx\"><span class=\"evt\">例</span><span>面積、形狀、臨路、方位、樓層、屋齡（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）調整方式與檢核</p><p>以百分率法為原則，亦可採差額法並於報告書敘明（<span class=\"art\">§24</span>）；單項調整率<b>大於15%</b>或總調整率<b>大於30%</b>應排除（<span class=\"art\">§25</span>）；試算價格重新檢討後差距仍<b>達20%</b>以上者排除（<span class=\"art\">§26</span>）；至少三件（<span class=\"art\">§27</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>剛好15%不排除，剛好20%要排除。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>四項調整依序為情況、價格日期、區域因素、個別因素。情況調整重在查證並排除或量化非正常交易；價格日期調整重在以適當變動率換算；區域與個別因素調整重在逐項比較差異並控制調整幅度（單項15%、總30%）。再取至少三件決定比較價格。</p>"], "ck": [{"x": "§21 順序：情況→價格日期→區域因素→個別因素", "h": false}, {"x": "§22 先查證交易價格、條件、標的狀況、交易日期", "h": false}, {"x": "§23 情形先調整，無法量化者不採用", "h": false}, {"x": "價格日期調整：以適當變動率換算，並說明依據", "h": false}, {"x": "區域因素調整只在不在同一近鄰地區時做", "h": true}, {"x": "§24 百分率法為原則，差額法須於報告書敘明；§20 計量模型三門檻", "h": false}, {"x": "§25 單項大於 15%、總大於 30% 排除（剛好不排除）", "h": true}, {"x": "§26 差距達 20% 以上排除（剛好要排除）；§27 至少三件", "h": true}, {"x": "四項調整各給一句重點", "h": false}], "mn": "情況（先查證 §22）→ 價格日期（變動率）→ 區域（不同近鄰才做）→ 個別 → 檢核 15%・30%・20%・三件", "hp": 5, "hpl": "高"}, {"id": "e102-1", "no": "102年第一題", "t": "比較標的無法有效掌握及量化調整者應不予採用之情況", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "比較法", "q": "運用比較法進行估價時，比較標的有那些情況會影響交易價格，且無法有效掌握及量化調整者，應不予採用？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>比較標的若有特殊情況影響交易價格，其成交價即偏離正常價格。依<span class=\"art\">§23</span>，此類比較標的應<b>先作適當之調整</b>；只有該情況<b>無法有效掌握及量化調整</b>時，才不予採用。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§23</span>：「比較標的有下列情況，應先作適當之調整；該影響交易價格之情況無法有效掌握及量化調整時，應不予採用。」</span><span class=\"evli\"><span class=\"art\">§22</span>：查證有困難者，應於估價報告書敘明。</span><span class=\"evli\"><span class=\"art\">§25</span>、<span class=\"art\">§26</span>：採用後仍須通過調整幅度與試算價格差距之檢核（延伸）。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）交易動機類（<span class=\"art\">§23①②⑨⑪</span>）</p><p>急買急賣或急出租急承租，價格偏離正常；期待因素影響，含炒作或預期上漲；受迷信影響，屬非理性因素；人為哄抬，屬操縱價格。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買方預期房價上漲而加價承購，無法量化即不採。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）交易關係類（<span class=\"art\">§23③④</span>）</p><p>受債權債務關係影響，價格含債務考量；親友關係人間之交易，非獨立市場交易。</p><p class=\"evx\"><span class=\"evt\">例</span><span>已查證之親友交易，可依市場行情還原後採用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）交易標的類（<span class=\"art\">§23⑤⑥⑩⑫</span>）</p><p>畸零地或有合併使用（合併價）、地上物處理有糾紛（權利瑕疵）、包含公共設施用地（含非建築用地）、與法定用途不符。</p><p class=\"evx\"><span class=\"evt\">例</span><span>工業區作住宅使用，價格含違規使用之預期或風險（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）交易程序類（<span class=\"art\">§23⑦⑧</span>）</p><p>拍賣、公有土地標售讓售。</p><p class=\"evx\"><span class=\"evt\">例</span><span>法院拍賣可能不點交、不負瑕疵擔保，成交價常低於市價；公有土地標售為競標，價格常偏高（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）其他特殊交易（<span class=\"art\">§23⑬</span>）</p><p>概括規定。</p></div><div class=\"evp\"><p class=\"evh\">（六）可調整 vs 不採用</p><p>能掌握、能量化者先作情況調整後可採用；無法掌握或無法量化者不得採用；查證有困難者應於報告書敘明（<span class=\"art\">§22</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>急迫程度、哄抬幅度、期待心理無從估計者不採。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>比較標的屬<span class=\"art\">§23</span>所列急買急賣、期待因素、債權債務、親友關係、畸零合併、地上物糾紛、拍賣、公有土地標售讓售、迷信、公共設施用地、哄抬、用途不符及其他特殊交易者，應先調整；無法有效掌握及量化調整者，即應不予採用。並非13款一律不採，以確保比較價格反映正常市場價格。</p>"], "ck": [{"x": "§23：先作適當之情況調整，無法有效掌握及量化調整者不得採用", "h": false}, {"x": "十三款逐項列出（急買急賣、期待、債權債務、親友關係人、畸零、地上物糾紛、拍賣、公有土地標售讓售、迷信、公共設施用地、哄抬、用途不符、其他）", "h": false}, {"x": "能量化→調整後可採；無法量化→不得採用（各舉例）", "h": true}, {"x": "查證有困難須於報告書敘明（§22）", "h": false}, {"x": "採用後仍須過 §25（15%／30%）與 §26（20%）檢核", "h": true}, {"x": "結論：先調整，無法有效掌握及量化者不予採用", "h": false}], "mn": "§23 十三款（急期債親畸糾拍公迷公哄法其）→ 先調整 → 無法量化才不採 → §22 敘明 → 過 §25・§26", "hp": 4, "hpl": "高"}, {"id": "e106-2", "no": "106年第二題", "t": "不動產估價應蒐集之資料＋蒐集比較實例之原則", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "比較法", "q": "請依不動產估價技術規則之規定，詳述不動產估價應蒐集之資料及蒐集比較實例之原則。", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>估價人員應經常蒐集市場資訊與交易、收益、成本資料，並蒐集勘估標的基本資料，查證其可靠性；蒐集比較實例則依<span class=\"art\">§12</span>所定原則為之。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§3</span>：市場資訊。</span><span class=\"evli\"><span class=\"art\">§4</span>：交易、收益、成本資料及資料來源。</span><span class=\"evli\"><span class=\"art\">§11</span>：估價之基本資料。</span><span class=\"evli\"><span class=\"art\">§22</span>：資料之查證事項。</span><span class=\"evli\"><span class=\"art\">§12</span>：蒐集比較實例之原則。</span><span class=\"evli\"><span class=\"art\">§23</span>：無法有效掌握及量化者不採。</span><span class=\"evli\"><span class=\"art\">§27</span>：比較標的至少三件。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應蒐集之資料</p><p>1.市場資訊（<span class=\"art\">§3</span>）：房地供需、環境變遷、人口、居民習性、公共與公用設施、交通運輸、所得水準、產業結構、金融市場、土地規劃、管制與使用現況、未來發展趨勢等資料。</p><p>2.交易、收益、成本資料（<span class=\"art\">§4</span>）：「不動產估價師應經常蒐集比較標的相關交易、收益及成本等案例及資料，並詳予求證其可靠性。」來源包括當事人、四鄰、地政機關、金融機構等。</p><p>3.基本資料（<span class=\"art\">§11</span>）：勘估標的之標示、權利、法定用途及使用管制；一般、區域及個別因素；相關交易、收益及成本資料。</p><p>4.查證（<span class=\"art\">§22</span>）：交易價格及費用負擔方式、交易條件、標的狀況、交易日期；查證確有困難者應於報告書敘明。</p></div><div class=\"evp\"><p class=\"evh\">（二）蒐集比較實例之原則（<span class=\"art\">§12</span>）</p><p>1.實例之價格屬正常價格、可調整為正常價格或與勘估標的價格種類相同者（無法有效掌握及量化者不採，<span class=\"art\">§23</span>）。</p><p>2.與勘估標的位於同一供需圈之近鄰地區或類似地區者。</p><p>3.與勘估標的使用性質或使用管制相同或相近者。</p><p>4.實例價格形成日期與勘估標的之價格日期接近者。</p><p>其後選用比較標的至少三件（<span class=\"art\">§27</span>）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>估價人員應經常蒐集市場資訊與交易、收益、成本資料，並蒐集勘估標的基本資料及一般、區域、個別因素資料，並查證其可靠性。蒐集比較實例應以正常價格或可調整為正常價格者、同一供需圈之近鄰或類似地區、使用性質或使用管制相同或相近、價格形成日期接近者為原則。</p>"], "ck": [{"x": "§3 市場資訊：供需、環境變遷、人口、公共建設、所得等", "h": false}, {"x": "§4 交易、收益、成本資料並查證可靠性；列資料來源", "h": false}, {"x": "§11 基本資料三項（標的基本資料、三類因素、交易收益成本資料）", "h": false}, {"x": "§22 查證四項（價格費用負擔、交易條件、標的狀況、交易日期），困難須敘明", "h": true}, {"x": "§12 四原則逐項列出", "h": false}, {"x": "§23 非正常交易：可調整者可用，無法量化者不採", "h": true}, {"x": "後續至少採三件（§27）", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "資料：市場（§3）→ 交易收益成本（§4）→ 基本資料（§11）→ 查證（§22）；比較實例四原則（§12）→ 至少三件（§27）", "hp": 9, "hpl": "高"}, {"id": "e107-2", "no": "107年第二題", "t": "同一供需圈、近鄰地區與類似地區之意義與關係", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "比較法", "q": "何謂同一供需圈？何謂近鄰地區？何謂類似地區？請說明三者的關係。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p><b>同一供需圈</b>是能成立替代關係、價格互為影響之最適範圍，其內包含<b>近鄰地區</b>與<b>類似地區</b>；比較標的取自何者，決定是否須作區域因素調整。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§2</span>：三者之定義。</span><span class=\"evli\"><span class=\"art\">§12</span>：同一供需圈內之近鄰地區或類似地區。</span><span class=\"evli\"><span class=\"art\">§19③④</span>：不在同一近鄰地區者，先作區域因素調整，再作個別因素調整。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）同一供需圈（<span class=\"art\">§2</span>）</p><p>比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。範圍依標的類型而異：住宅多以生活圈、通勤範圍為限；大型商辦、工業區、高爾夫球場等可擴及跨縣市（教材／實務）。</p></div><div class=\"evp\"><p class=\"evh\">（二）近鄰地區（<span class=\"art\">§2</span>）</p><p>勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某捷運站周邊住宅區，同站周邊同質住宅為近鄰地區（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）類似地區（<span class=\"art\">§2</span>）</p><p>同一供需圈內，近鄰地區以外而與勘估標的使用性質相近之其他地區。</p><p class=\"evx\"><span class=\"evt\">例</span><span>同線另一站、使用性質相近之住宅區（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）關係</p><p>同一供需圈 ⊃ 近鄰地區＋類似地區。實務上優先自近鄰地區選取、不足時再擴及類似地區（教材歸納，<span class=\"art\">§12</span> 未定順序）。取自近鄰地區時，免做區域因素調整，只做個別因素調整；取自類似地區時，須以比較標的之區域價格水準為基礎先做區域因素調整，再做個別因素調整（<span class=\"art\">§19③④</span>）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>同一供需圈是能互相替代、價格互相影響之範圍，其內含近鄰地區與類似地區。比較標的以近鄰地區優先，必要時擴及類似地區，後者須作區域因素調整。</p>"], "ck": [{"x": "同一供需圈：替代關係、價格互為影響之最適範圍（§2）", "h": false}, {"x": "近鄰地區：周圍供相同或類似用途、同質性較高（§2）", "h": false}, {"x": "類似地區：同一供需圈內、近鄰以外、使用性質相近（§2）", "h": false}, {"x": "圈包含近鄰地區＋類似地區，近鄰同質性較高", "h": true}, {"x": "§12 列同一供需圈內近鄰或類似地區（優先順序為教材歸納）", "h": false}, {"x": "不在同一近鄰地區須作區域因素調整（§19）", "h": true}, {"x": "四個子題各給一句直接答案", "h": false}], "mn": "圈（替代・互為影響）⊃ 近鄰（同質高）＋類似（圈內・近鄰外）→ 選取近鄰優先 → 不同近鄰須調區域因素", "hp": 3, "hpl": "高"}, {"id": "e108-1", "no": "108年第一題", "t": "房仲以甲社區2戶成交每坪18萬推論委託人房屋價格是否恰當", "lv": "官方・參考（C級）", "k": "off", "tier": 2, "g": "比較法", "q": "有一房屋仲介業者對委託人說：「附近甲社區最近成交了2戶，每坪都是18萬，您的房子，也一樣可以賣一坪18萬。」此房仲業者以這2個實例來做比較是否恰當？請從以下資料依不動產估價技術規則之規定分析說明之。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>比較法須依技術規則選擇比較標的，並經情況、價格日期、區域因素、個別因素調整後，才能推算價格。本題房仲僅以甲社區2戶成交單價每坪18萬直接推論，未選擇適格比較標的、未作調整，屬<b>不恰當</b>。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§12</span>：比較實例之蒐集原則（同一供需圈、使用性質或使用管制相同或相近、日期接近）。</span><span class=\"evli\"><span class=\"art\">§2</span>、<span class=\"art\">§19</span>：地區範圍；不在同一近鄰地區須作區域因素調整。</span><span class=\"evli\"><span class=\"art\">§21</span>：比較法程序。</span><span class=\"evli\"><span class=\"art\">§22</span>、<span class=\"art\">§23</span>：交易情況之查證與特殊交易處理。</span><span class=\"evli\"><span class=\"art\">§98</span>：區分所有建物之樓層別效用比與位置差異。</span><span class=\"evli\"><span class=\"art\">§25</span>、<span class=\"art\">§26</span>、<span class=\"art\">§27</span>：調整率、試算價格差距、至少三件。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）符合之處（<span class=\"art\">§12②④</span>）</p><p>成交時間「最近」，合於<span class=\"art\">§12④</span>；相距500公尺且使用現況同為住宅用，可能屬同一供需圈。</p><p class=\"evx\"><span class=\"evt\">例</span><span>同為住宅用，表面上條件相同。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）使用分區不同（<span class=\"art\">§12</span>）</p><p>委託人為<b>住宅區</b>，A、B戶為<b>工商綜合區</b>，土地使用管制與強度（建蔽率、容積率、可使用項目）不同，價格水準未必可比。</p><p class=\"evx\"><span class=\"evt\">例</span><span>使用現況雖同為住宅用，仍不能忽略分區差異。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）地區範圍（<span class=\"art\">§2</span>、<span class=\"art\">§12</span>、<span class=\"art\">§19</span>）</p><p>相距500公尺是否屬同一近鄰地區須實地判斷；分區不同，較可能分屬不同近鄰地區或僅為類似地區，須作區域因素調整。</p><p class=\"evx\"><span class=\"evt\">例</span><span>不能直接以其單價代入。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）未作調整（<span class=\"art\">§21</span>、<span class=\"art\">§98</span>）</p><p>未見情況、價格日期、區域及個別因素（面積、樓層、屋齡、格局）調整。</p><p class=\"evx\"><span class=\"evt\">例</span><span>若為區分所有建物，應考量樓層別效用比及位置差異。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）未查證交易情況（<span class=\"art\">§22</span>、<span class=\"art\">§23</span>）</p><p>兩戶是否為親友、急售、債務等非正常交易未查證。</p><p class=\"evx\"><span class=\"evt\">例</span><span>2戶皆每坪18萬，可能是同一建商、同一型式之集體交易，缺乏代表性。</span></p></div><div class=\"evp\"><p class=\"evh\">（六）件數不足（<span class=\"art\">§27</span>）</p><p>至少須採用三件，並檢核調整率（<span class=\"art\">§25</span>）與試算價格差距（<span class=\"art\">§26</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>本題僅2件，亦未經檢核。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>房仲僅以甲社區2戶成交單價直接推論，雖成交時間接近（<span class=\"art\">§12④</span>），但未考慮使用分區不同、地區範圍、價格調整、交易情況查證及件數不足，<b>不恰當</b>。應重新選擇同一供需圈內、分區相近之比較標的至少三件，經情況、價格日期、區域及個別因素調整後，再決定比較價格。</p>"], "ck": [{"x": "§12 比較標的使用分區須相同或相近", "h": false}, {"x": "住宅區 vs 工商綜合區；使用現況同為住宅用不能掩蓋分區差異", "h": true}, {"x": "500 公尺且不同分區 → 分屬不同近鄰地區或類似地區，須區域因素調整（§19）", "h": true}, {"x": "§21 情況、價格日期、區域、個別四項調整", "h": false}, {"x": "§22・§23 未查證交易情況（可能集體交易）", "h": false}, {"x": "§27 至少三件；§25・§26 須檢核", "h": false}, {"x": "結論：不恰當，應重選至少三件並調整", "h": false}], "mn": "分區 → 距離 → 四項調整 → 查證 → 三件＋檢核", "hp": 2, "hpl": "高"}, {"id": "e110-1", "no": "110年第一題", "t": "疫情後特殊交易案例：比較標的應不予採用之情況", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "比較法", "q": "不動產市場因為世界各國疫情趨緩開始活絡，不動產買賣不論是新屋、中古屋都出現很特殊的交易案例現象，根據不動產估價技術規則規定，不動產估價時對於比較標的如果無法有效掌握，應不予採用的情況有那些？試說明之。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>疫情趨緩後市場活絡，易出現急買、預期加碼、炒作等特殊交易，其成交價偏離正常價格。依<span class=\"art\">§23</span>，比較標的有所列情況應<b>先作適當之調整</b>；影響交易價格之情況<b>無法有效掌握及量化調整</b>時，應不予採用。本題須把疫情情境對應到條文款次作答。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§23</span>：比較標的有所列情況應先作適當之調整，無法有效掌握及量化調整者不予採用。</span><span class=\"evli\"><span class=\"art\">§22Ⅰ②</span>：交易條件；有特殊付款方式者，其方式，應詳予查證確認。</span><span class=\"evli\"><span class=\"art\">§22Ⅱ</span>：查證確有困難之事項，應於估價報告書中敘明。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）<span class=\"art\">§23</span>所列情況</p><p>交易動機類有①急買急賣或急出租急承租、<span class=\"evli\">②期待因素影響、</span><span class=\"evli\">⑨受迷信影響、</span><span class=\"evli\">⑪人為哄抬；交易關係類有③債權債務、</span><span class=\"evli\">④親友關係人間；交易標的類有⑤畸零地或合併使用、</span><span class=\"evli\">⑥地上物處理糾紛、</span><span class=\"evli\">⑩包含公共設施用地、</span><span class=\"evli\">⑫與法定用途不符；交易程序類有⑦拍賣、</span><span class=\"evli\">⑧公有土地標售讓售；</span><span class=\"evli\">⑬其他特殊交易為概括規定。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>拍賣屬非自願、限制多。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）疫情後情境對應（教材）</p><p>1.買氣湧現、買方搶購：易出現急買（①）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>疫情趨緩後買方搶購。</span></p><p>2.預期房價續漲而加碼：屬期待因素影響（②）。</p><p>3.炒作、連續轉手拉高成交價：屬人為哄抬（⑪）。</p><p>4.含特殊付款方式、搭售車位等條件：應依<span class=\"art\">§22Ⅰ②</span>查證交易條件，查證確有困難者依<span class=\"art\">§22Ⅱ</span>於報告書敘明；其影響無法有效掌握及量化調整時，依<span class=\"art\">§23</span>不予採用。</p><p>5.新屋預售與中古屋價格形成條件不同，亦須注意比較標的之使用性質與狀況是否相近。</p></div><div class=\"evp\"><p class=\"evh\">（三）判斷原則</p><p>能掌握並量化者先調整後可用；無法有效掌握及量化者不予採用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>哄抬幅度無從估計之轉手案，不予採用。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>疫情後市場活絡，估價人員蒐集比較標的時，應特別留意急買、期待因素、人為哄抬等特殊交易；凡無法有效掌握其影響並加以量化調整者，應依<span class=\"art\">§23</span>不予採用（查證確有困難之事項，另依<span class=\"art\">§22Ⅱ</span>於報告書敘明），以免比較價格偏離正常價格。</p>"], "ck": [{"x": "§23 原則：先作情況調整；無法有效掌握及量化調整者不予採用", "h": true}, {"x": "§23 十三款完整列出（至少寫出主要款次與概括款）", "h": false}, {"x": "十三款可依動機、關係、標的、程序分類說明", "h": false}, {"x": "買氣搶購→急買（第1款）", "h": true}, {"x": "預期續漲加碼→期待因素（第2款）；炒作轉手→人為哄抬（第11款）", "h": true}, {"x": "特殊付款、搭售須查證（§22），無法掌握者不採", "h": false}, {"x": "結論：蒐集比較標的時留意特殊交易，查證確有困難者依§22Ⅱ於報告書敘明", "h": false}], "mn": "§23 先調整→無法量化不採 → 十三款（動機・關係・標的・程序）→ 疫情對應 1・2・11 → §22 查證", "hp": 1, "hpl": "高"}, {"id": "mk-c1-2", "no": "綜合模擬卷一 申論二", "t": "比較法意義、程序＋情況調整與區域／個別因素調整", "lv": "本站模擬卷・參考（B級）", "k": "mkc", "tier": 1, "g": "比較法", "q": "試說明比較法估價之意義、應用時機及估價程序。並依「不動產估價技術規則」，說明比較法中「情況調整」之意義及其相關規定，以及「區域因素調整」與「個別因素調整」之意義與差異。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>比較法係蒐集與勘估標的相同或相似不動產之交易事例，就其與勘估標的比較，進行情況調整、價格日期調整及不動產因素調整，以推算勘估標的價格之估價方法。</p><p>應用時機：市場交易活絡、比較案例充足之一般住宅、商業不動產；土地或建物之正常價格估算；做為收益法、成本法之輔助驗證。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§18</span>、<span class=\"art\">§21</span>：比較法之意義及程序。</span><span class=\"evli\"><span class=\"art\">§22</span>：蒐集並查證比較標的資料；</span><span class=\"evli\"><span class=\"art\">§12</span>、<span class=\"art\">§23</span>：選擇條件相同或相似之比較標的。</span><span class=\"evli\"><span class=\"art\">§23</span>：急買急賣、拍賣等特殊交易（十三款情形之一），無法量化調整者不得採用。</span><span class=\"evli\"><span class=\"art\">§24</span>：比較區域因素及個別因素之差異，求取調整率或調整額，原則採百分率法。</span><span class=\"evli\"><span class=\"art\">§25</span>：區域、個別因素調整或其內任一單獨項目大於15%，或總調整率大於30%者，應排除該比較標的。</span><span class=\"evli\"><span class=\"art\">§26</span>：試算價格偏高或偏低者，應先重新檢討；檢討後差距仍達20%以上者，排除該試算價格。</span><span class=\"evli\"><span class=\"art\">§27</span>：決定比較價格應採用三件以上比較標的之試算價格。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）估價程序</p><p>蒐集查證→選擇比較標的→情況及價格日期調整→區域及個別因素調整→計算試算價格→決定比較價格。</p></div><div class=\"evp\"><p class=\"evh\">（二）情況調整（<span class=\"art\">§19</span>）</p><p>將比較標的之成交價格，調整排除非屬正常交易情況之影響，使其反映正常市場下之交易價格。</p></div><div class=\"evp\"><p class=\"evh\">（三）區域因素調整</p><p>調整比較標的與勘估標的所在「地區」間之差異，如商業繁榮度、交通便利性、公共設施完善度等。</p></div><div class=\"evp\"><p class=\"evh\">（四）個別因素調整</p><p>調整二者「個體條件」間之差異，如面積、形狀、臨路寬度、地勢、建物年齡等。</p></div><div class=\"evp\"><p class=\"evh\">（五）差異</p><p>區域因素針對「宏觀地區環境」；個別因素針對「微觀個體特性」，二者均依<span class=\"art\">§19</span>、<span class=\"art\">§24</span>調整。</p></div>", "<span class=\"blk-l\">四、結論</span><p>比較法以交易事例經各項調整推算價格；情況調整在排除非正常交易之影響，並以15%、30%、20%及三件以上把關；區域因素重地區環境，個別因素重個體條件。</p>"], "ck": [{"x": "意義：交易事例經情況調整、價格日期調整及不動產因素調整推算價格（§18、§21）", "h": false}, {"x": "程序六步：蒐集查證→選擇→情況及價格日期調整→區域及個別因素調整→試算價格→決定比較價格", "h": false}, {"x": "情況調整意義（§19）：排除非屬正常交易情況之影響，反映正常市場交易價格", "h": false}, {"x": "§23 急買急賣、拍賣等無法量化調整者不得採用", "h": false}, {"x": "§25 區域、個別因素（含單項）大於15%、總調整率大於30%排除比較標的；§26 試算價格偏高或偏低先檢討，檢討後差距仍達20%排除試算價格", "h": true}, {"x": "決定比較價格須三件以上比較標的（§27）", "h": true}, {"x": "區域因素＝地區間差異；個別因素＝個體條件差異，各舉例", "h": false}, {"x": "差異：宏觀地區環境 vs 微觀個體特性；原則採百分率法（§24）", "h": true}], "mn": "查・選・情日・區個・試算・決定 → 15／30／20＋三件 → 區＝宏觀地區、個＝微觀個體", "hp": 8, "hpl": "高"}, {"id": "pred-4", "no": "115預測④", "t": "比較法：質的排除（§23）＋量的三關卡（§25、§26）", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "比較法", "q": "採用比較法估價時，何種情況之比較標的應不予採用？又比較標的經調整後，其調整幅度有何限制？請分別說明並舉例。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>比較法有兩道防線：<b>質的排除</b>（<span class=\"art\">§23</span>）是「無法量化」才不採；<b>量的管控</b>（<span class=\"art\">§25</span>、<span class=\"art\">§26</span>）是「可量化但幅度過大」而排除。兩者不要混答。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§23</span>：特殊交易應先調整，無法有效掌握及量化調整者不得採用。</span><span class=\"evli\"><span class=\"art\">§25</span>：單項大於15%、總調整率大於30%者排除；性質或區位特殊並敘明者不在此限。</span><span class=\"evli\"><span class=\"art\">§26</span>：試算價格差距達20%以上，先重新檢討，仍達20%即排除。</span><span class=\"evli\"><span class=\"art\">§27</span>：至少三件。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）質的排除（<span class=\"art\">§23</span>）</p><p>急買急賣、期待因素、債權債務關係、親友關係人間、畸零地或合併使用、地上物處理糾紛、拍賣、公有土地標售讓售、受迷信影響、包含公共設施用地、人為哄抬、與法定用途不符、其他特殊交易，應先調整；無法有效掌握及量化調整者，不得採用。例一：法院拍賣案（<span class=\"art\">§23⑦</span>）若無法量化其折價，不得採用。</p></div><div class=\"evp\"><p class=\"evh\">（二）第一關（<span class=\"art\">§25</span>）</p><p>區域因素、個別因素或其中任一單獨項目調整率<b>大於15%</b>即排除，剛好15%不排除。例二：僅面積較大，屬個別因素差異，若該項調整率為18%，仍應排除。</p></div><div class=\"evp\"><p class=\"evh\">（三）第二關（<span class=\"art\">§25</span>）</p><p>情況、價格日期、區域及個別因素之總調整率<b>大於30%</b>即排除，剛好30%不排除。<span class=\"art\">§25</span>例外只適用<span class=\"art\">§25</span>，不適用<span class=\"art\">§26</span>。</p></div><div class=\"evp\"><p class=\"evh\">（四）第三關（<span class=\"art\">§26</span>）</p><p>差距＝高低價差÷高低價平均，<b>達20%</b>以上先重新檢討，仍達20%即排除，剛好20%要排除。例三：980萬、1,000萬、1,250萬，差距＝(1,250－980)÷1,115≈24.2%，須先重新檢討。</p></div>", "<span class=\"blk-l\">四、結論</span><p>比較法先依<span class=\"art\">§23</span>排除無法有效掌握及量化之非正常交易，再依<span class=\"art\">§25</span>（單項大於15%、總調整率大於30%）及<span class=\"art\">§26</span>（試算價格差距達20%以上）管控調整幅度，使試算價格趨近正常價格。</p>"], "ck": [{"x": "§23 所列非正常交易情形，應先調整", "h": false}, {"x": "無法有效掌握及量化調整者不得採用；舉例（拍賣）", "h": false}, {"x": "§23 是無法量化；§25、§26 是可量化但幅度過大，質與量不混答", "h": true}, {"x": "§25 單項大於 15%、總調整率大於 30% 排除", "h": false}, {"x": "15%、30% 用「大於」（剛好不排除）；20% 用「達」（剛好要排除）", "h": true}, {"x": "§26 試算價格差距達 20% 以上，差距＝高低價差÷高低價平均", "h": true}, {"x": "例三：(1,250－980)÷1,115≈24.2%，須排除", "h": false}, {"x": "特殊例外須於報告書敘明（§25）；至少三件（§27）", "h": false}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "質：§23 無法量化→不採；量：§25 15%・30%（大於）→§26 20%（達）", "hp": 6, "hpl": "高"}, {"id": "pred-7", "no": "115預測⑦", "t": "計量模型分析法（CAMA）之意義、適用條件與限制", "lv": "預測・參考（B級）", "k": "pred", "tier": 1, "g": "比較法", "q": "何謂計量模型分析法？依技術規則，應用該方法應符合哪些條件？某估價師以6個自變數蒐集27件比較標的，迴歸結果調整後判定係數0.68，整體模型（截距項以外各主要影響價格因素之係數估計值同時為零）之顯著機率為 7%，試評論其是否可採。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>計量模型分析法（<span class=\"art\">§19</span>第7款）：蒐集相當數量具代表性之比較標的，透過計量模型分析，求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主要影響價格因素之調整率及調整額之方法。教材常以複迴歸分析為例（CAMA＝電腦輔助大量估價）。應用時須符合<span class=\"art\">§20</span>三項條件。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§19</span>第7款：計量模型分析法之定義。</span><span class=\"evli\"><span class=\"art\">§20</span>第1款：須蒐集自變數個數五倍以上之比較標的。</span><span class=\"evli\"><span class=\"art\">§20</span>第2款：採迴歸分析者，調整後判定係數不得低於0.7。</span><span class=\"evli\"><span class=\"art\">§20</span>第3款：截距項以外各主要影響價格因素之係數估計值同時為零之顯著機率不得大於5%。</span><span class=\"evli\"><span class=\"art\">§24</span>：價格調整以百分率法為原則，亦得以差額法，並應於報告書敘明。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）樣本數（<span class=\"art\">§20</span>第1款）</p><p>公式：樣本數 ≥ 自變數個數 × 5 → 代入：6 × 5 ＝ 30件 → 結果：本例僅<b>27件</b>，不足3件，❌不符。</p><p class=\"evx\"><span class=\"evt\">例</span><span>5倍是「自變數個數」的5倍，不是樣本數的5倍。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）調整後判定係數（<span class=\"art\">§20</span>第2款）</p><p>公式：調整後判定係數 ≥ 0.7 → 代入：0.68 → 結果：0.68＜0.7，<b>低於門檻</b>，❌不符。</p><p class=\"evx\"><span class=\"evt\">例</span><span>0.7指調整後判定係數而非一般R²，等於0.7可以。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）顯著機率（<span class=\"art\">§20</span>第3款）</p><p>公式：顯著機率 ≤ 5% → 代入：7% → 結果：7%＞5%，<b>超過門檻</b>，❌不符。</p><p class=\"evx\"><span class=\"evt\">例</span><span>此為「截距項以外各主要影響價格因素之係數估計值同時為零」之整體模型聯合檢定，單一因素p值不等於聯合檢定不過；等於5%可以。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）評論</p><p>三項皆不符<span class=\"art\">§20</span>，該模型<b>不得採用</b>。估價師應增加樣本至30件以上、檢討自變數（刪除不顯著因素或合併共線性變數）後重估，或改採百分率法／差額法調整（<span class=\"art\">§24</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>教材補充（非條文）之限制包括樣本須具代表性、需同一供需圈與同質市場；共線性、遺漏變數、極端值會扭曲係數；模型不宜外推到樣本範圍以外。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>計量模型分析法以比較標的與價格之關係式推算各因素調整率，但須符合<span class=\"art\">§20</span>三項條件：樣本數≥自變數5倍、調整後判定係數≥0.7、顯著機率≤5%。本例6個自變數須30件，僅27件，且判定係數0.68、顯著機率7%皆未達標，<b>模型不得採用</b>，應補足樣本與修正模型，或回到百分率法。</p>"], "ck": [{"x": "§19 第7款 定義：蒐集比較標的，以關係式推算調整率及調整額", "h": false}, {"x": "§20 第1款：樣本≥自變數個數五倍（是自變數的 5 倍）", "h": true}, {"x": "§20 第2款：調整後判定係數不得低於 0.7（等於可以）", "h": true}, {"x": "§20 第3款：顯著機率不得大於 5%（等於可以）", "h": true}, {"x": "逐項涵攝：6×5＝30 vs 27；0.68＜0.7；7%＞5%", "h": false}, {"x": "三項皆不符，模型不得採用", "h": false}, {"x": "補救：補樣本至 30 件、修正模型，或改百分率法／差額法（§24）", "h": false}], "mn": "定義 §19 第7款 → §20 三門檻（5 倍・0.7・5%）→ 涵攝 27＜30、0.68＜0.7、7%＞5% → 不可採，補樣本或改百分率法", "hp": 7, "hpl": "高"}, {"id": "e99-1", "no": "99年第一題", "t": "收益資本化率之風險因素與比較基準＋加權平均資金成本法計算", "lv": "官方・必考（A級）", "k": "off", "tier": 0, "g": "收益法", "q": "收益法又稱收益資本化法，除了精準計算房地客觀淨收益外，收益資本化率或折現率的有效掌握對於價格決定具有關鍵影響。請說明收益資本化率或折現率一般考慮的風險因素與選擇比較基準？同時，請試舉例說明依加權平均資金成本方式決定收益資本化率或折現率的計算過程與結果？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>收益資本化率或折現率對收益價格有關鍵影響。依技術規則<span class=\"art\">第43條</span>，以風險溢酬法為例，先選擇<b>最具一般性財貨之投資報酬率</b>作為比較基準，再就勘估標的之<b>個別特性</b>加以比較觀察而定；亦得以<b>加權平均資金成本法</b>依資金來源比重與利率加權求得。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§43</span>：收益資本化率或折現率之決定方法（風險溢酬法；第3款加權平均資金成本法；第4款債務保障比率法）。</span><span class=\"evli\"><span class=\"art\">§30</span>：直接資本化法，收益價格＝年淨收益÷收益資本化率。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）選擇比較基準（<span class=\"art\">§43</span>）</p><p>一般性財貨之投資報酬率，應考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況、不動產價格之變動趨勢。</p><p class=\"evx\"><span class=\"evt\">例</span><span>以定存或公債利率作為基準起點。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）風險因素（<span class=\"art\">§43</span>）</p><p>再與勘估標的特性比較：</p><p>1.流通性：變現愈慢，要求報酬愈高。</p><p>2.風險性：市場波動、政策、災害、收益不確定，風險愈高，資本化率愈高。</p><p>3.增值性：增值潛力愈大，可接受較低資本化率。</p><p>4.管理上難易：管理愈繁複，要求報酬愈高。</p><p class=\"evx\"><span class=\"evt\">例</span><span>商場、旅館需積極管理，住宅多為穩定出租。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）加權平均資金成本法（<span class=\"art\">§43</span>第3款）</p><p>公式：r＝Σ（Wi × Ki），Wi＝第 i 個資金來源占總資金成本比例，ΣWi＝1；Ki＝第 i 個資金來源之利率或要求報酬率。</p><p>代入：假設自有資金40%，要求報酬率8%；借貸資金60%，借款利率4%。</p><p>r＝40% × 8% ＋ 60% × 4%＝3.2% ＋ 2.4%</p><p>結果：r＝<b>5.6%</b>。</p></div><div class=\"evp\"><p class=\"evh\">（四）延伸用於收益價格（<span class=\"art\">§30</span>）</p><p>公式：收益價格＝年客觀淨收益÷資本化率</p><p>代入：年客觀淨收益100萬元，100 ÷ 5.6%</p><p>結果：收益價格≈<b>1,785.7萬元</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>自訂例子時各資金比重合計須為100%，自有資金要求報酬率通常高於借款利率；此處用利率，不是貸款常數（貸款常數用於<span class=\"art\">§43</span>第4款債務保障比率法）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>收益資本化率或折現率應先以定存利率、公債利率、不動產投資風險性、貨幣變動狀況及價格變動趨勢選定比較基準，再就流通性、風險性、增值性及管理難易調整。若採加權平均資金成本法，本例為<b>5.6%</b>，可進一步用於直接資本化法求得收益價格約1,785.7萬元。</p>"], "ck": [{"x": "§43 風險溢酬法：先選一般性財貨報酬率為基準，再比較個別特性", "h": false}, {"x": "基準考慮五項：定存利率、公債利率、投資風險性、貨幣變動、價格趨勢", "h": false}, {"x": "流通性、風險性、增值性、管理難易四因素與影響方向", "h": false}, {"x": "WACC 公式 r＝Σ（Wi×Ki），各 Wi 合計 100%", "h": true}, {"x": "40%×8%＋60%×4%＝3.2%＋2.4%＝5.6%（列式）", "h": false}, {"x": "100÷5.6%≈1,785.7 萬元（§30）", "h": false}, {"x": "用利率、不是貸款常數；自有資金報酬率高於借款利率", "h": true}, {"x": "兩部分（風險因素＋計算）都要寫完", "h": true}], "mn": "§43 基準（定存・公債・風險・貨幣・趨勢）→ 比四因素 → WACC：ΣWi×Ki＝5.6% → ÷ 得 1,785.7 萬", "hp": 1047, "hpl": "中"}, {"id": "e113-1", "no": "113年第一題", "t": "DCF法與直接資本化法之差異比較", "lv": "官方・參考（B級）", "k": "off", "tier": 1, "g": "收益法", "q": "何謂折現現金流量分析法？又其與直接資本化法有何差異？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>折現現金流量分析法（DCF），指勘估標的未來折現現金流量分析期間之各期淨收益及期末價值，以適當折現率折現後加總推算勘估標的價格之方法（<span class=\"art\">§31Ⅰ</span>）。DCF與直接資本化法同屬收益法（<span class=\"art\">§28</span>），兩者並非新舊方法。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§28</span>：收益法得採直接資本化法、折現現金流量分析法等方法。</span><span class=\"evli\"><span class=\"art\">§29</span>、<span class=\"art\">§30</span>：直接資本化法意義與公式。</span><span class=\"evli\"><span class=\"art\">§31</span>、<span class=\"art\">§32</span>：DCF意義、適用與公式。</span><span class=\"evli\"><span class=\"art\">§33</span>、<span class=\"art\">§38</span>、<span class=\"art\">§15Ⅱ</span>：淨收益基準與證券化之特別規定。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）DCF公式（<span class=\"art\">§32</span>）</p><p>P＝Σ CFk÷(1＋Y)ᵏ＋Pn'÷(1＋Y)ⁿ'（CFk各期淨收益、Y折現率、Pn'期末價值）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>租約有階梯租金之辦公大樓，逐年折現加總（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）直接資本化法（<span class=\"art\">§29</span>、<span class=\"art\">§30</span>）</p><p>以未來平均一年客觀淨收益除以收益資本化率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>成熟商圈出租店面可視為永續（教材）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）差異比較</p><p>1.淨收益範圍：直接資本化法為未來平均一年之客觀淨收益（<span class=\"art\">§29</span>）；DCF為分析期間內各期淨收益＋期末價值（<span class=\"art\">§31Ⅰ</span>）。</p><p>2.換算工具：前者以收益資本化率相除（<span class=\"art\">§30</span>）；後者以折現率逐期折現加總（<span class=\"art\">§32</span>）。</p><p>3.期末處理：前者無期末價值項；後者須估期末價值並折現。</p><p>4.適用目的：前者條文未特別限定；DCF得適用於以投資為目的之不動產投資評估（<span class=\"art\">§31Ⅱ</span>）。</p><p>5.淨收益基準：前者以勘估標的作最有效使用之客觀淨收益為基準（<span class=\"art\">§33Ⅰ</span>）；DCF用於證券化時，各期淨收益以契約租金計算為原則（<span class=\"art\">§33Ⅱ</span>），總費用依信託計畫資料推算（<span class=\"art\">§38</span>）。</p><p>6.價格決定：以契約約定租金作為證券化信託利益分配基礎者，DCF之收益價格應賦予相對較大之權重，清算時不在此限（<span class=\"art\">§15Ⅱ</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（四）限制（教材）</p><p>期末價值與折現率假設影響大，主觀性較高。</p></div>", "<span class=\"blk-l\">四、結論</span><p>DCF是將分析期間各期淨收益與期末價值以適當折現率折現後加總推算價格（<span class=\"art\">§31Ⅰ</span>、<span class=\"art\">§32</span>）；直接資本化法則以未來平均一年客觀淨收益除以收益資本化率（<span class=\"art\">§29</span>、<span class=\"art\">§30</span>）。差異在淨收益範圍、換算工具、期末價值及適用目的；證券化者加權的是<b>DCF之收益價格</b>（<span class=\"art\">§15Ⅱ</span>），不是整個收益法。</p>"], "ck": [{"x": "§31 DCF 定義：各期淨收益＋期末價值，折現後加總", "h": false}, {"x": "§32 公式 P＝ΣCFk÷(1＋Y)ᵏ＋Pn'÷(1＋Y)ⁿ'，並寫出符號", "h": false}, {"x": "兩者同屬收益法（§28Ⅰ），價格為收益價格（§28Ⅱ）", "h": true}, {"x": "§29・§30 直接資本化法：平均一年客觀淨收益 ÷ 收益資本化率", "h": false}, {"x": "三差異：取樣範圍、換算工具（資本化率 vs 折現率）、期末價值", "h": true}, {"x": "§33Ⅱ 契約租金、§15Ⅱ DCF 權重較大（清算除外）", "h": false}, {"x": "資本化率與折現率不可混用；不評論哪個較優", "h": true}, {"x": "兩子題各給一句直接答案", "h": false}], "mn": "定義 §31 → 公式 §32 → 對照直接法 §29・§30 → 三差異（取樣・工具・期末）→ 證券化 §33Ⅱ・§15Ⅱ", "hp": 1039, "hpl": "中"}, {"id": "mk-c1-1", "no": "綜合模擬卷一 申論一", "t": "收益法意義、程序＋綜合資本化率計算", "lv": "本站模擬卷・必考（A級）", "k": "mkc", "tier": 0, "g": "收益法", "q": "試依「不動產估價技術規則」說明收益法之意義、應用時機及估價程序。並就下列資料，以直接資本化法求算該收益性不動產之收益價格：\n【已知條件】\n・年可能總收入：1,200萬元\n・空租損失率：5%\n・年費用（含管理費、折舊、稅捐）：180萬元\n・土地價值占不動產總值之50%，土地資本化率3.5%\n・建物價值占不動產總值之50%，建物資本化率7.5%\n請先求算綜合資本化率，再求算收益價格。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>收益法係將勘估標的未來所能產生之淨收益，以適當之資本化率予以資本化，或以折現率折現，以求取勘估標的價格之估價方法，分直接資本化法、折現現金流量法。</p><p>應用時機：具有穩定收益之出租型不動產、具有租賃市場之住宅，及收益型不動產之合理性驗證。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§28</span>：直接資本化法、折現現金流量法。</span><span class=\"evli\"><span class=\"art\">§34</span>：估價程序六步。</span><span class=\"evli\"><span class=\"art\">§35</span>：蒐集最近三年總收入、總費用及資本化率或折現率等資料。</span><span class=\"evli\"><span class=\"art\">§36</span>：推算有效總收入；</span><span class=\"evli\"><span class=\"art\">§38</span>～<span class=\"art\">§41</span>：推算總費用。</span><span class=\"evli\"><span class=\"art\">§42</span>：淨收益＝有效總收入－總費用。</span><span class=\"evli\"><span class=\"art\">§43</span>：資本化率五法；</span><span class=\"evli\"><span class=\"art\">§46</span>：房地綜合資本化率依土地、建物價值比率加權。</span><span class=\"evli\"><span class=\"art\">§30</span>：收益價格P＝a÷r。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p>（一）年有效總收入＝1,200×(1－5%)＝1,200×0.95＝<b>1,140萬元</b></p></div><div class=\"evp\"><p>（二）年淨收益＝1,140－180＝<b>960萬元</b></p></div><div class=\"evp\"><p>（三）綜合資本化率＝3.5%×50%＋7.5%×50%＝1.75%＋3.75%＝<b>5.5%</b></p></div><div class=\"evp\"><p>（四）收益價格＝960÷5.5%≈<b>17,455萬元</b></p></div>", "<span class=\"blk-l\">四、結論</span><p>本題有效總收入1,140萬元、淨收益960萬元，綜合資本化率5.5%，收益價格約17,455萬元（約1.75億元）。</p>"], "ck": [{"x": "意義：未來淨收益以資本化率資本化或以折現率折現；直接資本化法、折現現金流量法（§28）", "h": false}, {"x": "應用時機三種：出租型不動產、具租賃市場之住宅、收益型不動產合理性驗證", "h": false}, {"x": "程序六步（§34）依序並附條號：§35→§36→§38～§41→§42→§43／§46→§30", "h": true}, {"x": "§46 房地綜合資本化率依土地、建物價值比率加權", "h": false}, {"x": "先扣空租損失 5% 得有效總收入 1,140 萬，再減費用 180 萬得淨收益 960 萬", "h": true}, {"x": "綜合資本化率＝3.5%×50%＋7.5%×50%＝5.5%（要列式）", "h": true}, {"x": "收益價格＝960÷5.5%≈17,455 萬元（約 1.75 億元）", "h": false}], "mn": "意義→時機→六步（資料・有效總收入・費用・淨收益・率・價格）→1,140→960→5.5%→17,455萬", "hp": 1046, "hpl": "中"}, {"id": "mk-c4-2", "no": "綜合模擬卷四 申論二", "t": "折現現金流量分析法之意義、應用時機、公式及估價程序（綜合卷四版）", "lv": "本站模擬卷・參考（B級）", "k": "mkc", "tier": 1, "g": "收益法", "q": "試述折現現金流量分析法之意義、應用時機、公式及估價程序？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p><b>折現現金流量分析法</b>，指勘估標的未來折現現金流量分析期間之各期淨收益及期末價值，以適當折現率折現後加總推算勘估標的價格之方法（<span class=\"art\">§31Ⅰ</span>）。直接資本化法用「未來平均一年期間」之客觀淨收益÷收益資本化率（<span class=\"art\">§29</span>、<span class=\"art\">§30</span>）；DCF則用分析期間內「各期」淨收益及期末價值折現加總。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§31Ⅱ</span>：得適用於以投資為目的之不動產投資評估。</span><span class=\"evli\"><span class=\"art\">§33Ⅱ</span>：以不動產證券化為估價目的者，各期淨收益以契約租金計算為原則。</span><span class=\"evli\"><span class=\"art\">§15Ⅱ</span>：以契約約定租金作為信託利益分配基礎者，DCF之收益價格應賦予相對較大之權重。</span><span class=\"evli\"><span class=\"art\">§32</span>：P＝Σ CFₖ÷(1＋Y)<sup>k</sup>＋Pₙ′÷(1＋Y)<sup>n′</sup>（k＝1～n′）；P＝收益價格；CFₖ＝各期淨收益；Y＝折現率；n′＝折現現金流量分析期間；k＝各年期；Pₙ′＝期末價值。</span><span class=\"evli\"><span class=\"art\">§34</span>：估價程序，與收益法同一套六步。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應用時機</p><p>1.條文明定：以投資為目的之不動產投資評估。2.以不動產證券化為估價目的者，以契約租金計算各期淨收益，並賦予DCF較大權重。3.實務歸納：各期收益有明確變動趨勢（如租金逐年調升）、各期淨收益不穩定而直接資本化法不易適用時。</p></div><div class=\"evp\"><p class=\"evh\">（二）估價程序</p><p><span class=\"evli\">①蒐集總收入、總費用及折現率等資料（<span class=\"art\">§35</span>：最近三年）；</span><span class=\"evli\">②推算有效總收入（<span class=\"art\">§36</span>）；</span><span class=\"evli\">③推算總費用（<span class=\"art\">§38</span>；證券化目的者依<b>信託計畫資料</b>推算）；</span><span class=\"evli\">④計算淨收益：有效總收入－總費用（<span class=\"art\">§42</span>）；</span><span class=\"evli\">⑤決定折現率（<span class=\"art\">§43</span>五種方法）；</span><span class=\"evli\">⑥計算收益價格：依<span class=\"art\">§32</span>將各期淨收益及期末價值折現加總。</span></p></div><div class=\"evp\"><p>（三）DCF另須決定<b>分析期間n′</b>與<b>期末價值Pₙ′</b>（<span class=\"art\">§31</span>、<span class=\"art\">§32</span>）。期末價值常以第n′＋1期淨收益÷期末資本化率推估，此為教材作法，條文未規定；推估後仍以折現率Y折現。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，DCF將各期淨收益及期末價值均以折現率Y折現後加總求取收益價格，適用於以投資為目的之不動產投資評估及不動產證券化估價，並依<span class=\"art\">§34</span>六步程序辦理。</p>"], "ck": [{"x": "§31Ⅰ 定義：各期淨收益＋期末價值，以適當折現率折現後加總", "h": true}, {"x": "§31Ⅱ 以投資為目的之不動產投資評估", "h": false}, {"x": "證券化：§33Ⅱ 契約租金計算為原則；§15Ⅱ DCF 權重較大", "h": false}, {"x": "§32 公式與六個符號照條文", "h": true}, {"x": "n′＝折現現金流量分析期間，不是耐用年數", "h": false}, {"x": "§34 六步程序，配 §35、§36、§38、§42、§43", "h": false}, {"x": "期末價值也用折現率 Y 折現；用期末資本化率推估期末價值是教材作法", "h": true}], "mn": "各期＋期末 → 全用 Y 折現 → 加總", "hp": 1044, "hpl": "中"}, {"id": "mk-ls2", "no": "來勝115（一）申論二", "t": "折現現金流量分析法之意義、應用時機、公式及估價程序", "lv": "補習班模擬卷・參考", "k": "mkls", "tier": 3, "g": "收益法", "q": "試述折現現金流量分析法之意義、應用時機、公式及估價程序？（25分）\n出題：許文昌（高點・永慶）｜補習班模擬題，非考選部官方試題｜打開整份模擬卷", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p><b>折現現金流量分析法</b>（DCF），指勘估標的未來折現現金流量分析期間之各期淨收益及期末價值，以適當折現率折現後加總，推算勘估標的價格之方法（<span class=\"art\">§31</span>），屬收益法之一。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§31</span>：DCF定義。</span><span class=\"evli\"><span class=\"art\">§32</span>公式：P＝Σ［CFₖ÷(1＋Y)<sup>k</sup>］（k＝1～n′）＋Pₙ′÷(1＋Y)<sup>n′</sup>。P：收益價格；CFₖ：第k期淨收益；Y：折現率；n′：分析期間；Pₙ′：期末價值。前項為各期淨收益現值之和，後項為期末價值之現值。</span><span class=\"evli\"><span class=\"art\">§47</span>：期末價值「得」扣除處分之相關費用（老師版寫應扣除）。</span><span class=\"evli\"><span class=\"art\">§29</span>：直接資本化法用「未來平均一年期間」之客觀淨收益÷資本化率，與DCF不同。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應用時機</p><p>1.營運性不動產：各期收益隨營運變動。</p><p class=\"evx\"><span class=\"evt\">例</span><span>觀光飯店、百貨商場、出租辦公大樓。2.投資決策評估：委託人擬投資收益性不動產，需逐期現金流量供決策參考。3.比較：各期淨收益穩定者可用直接資本化法；各期不穩定、有明確逐期變動，才以DCF較適合。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）估價程序</p><p>1.蒐集總收入、總費用及折現率等資料。2.推算分析期間（一般5年或10年）各年總收入，扣除閒置及其他損失，得有效總收入。3.推算各年總費用。4.有效總收入減總費用，得各年淨收益。5.推估期末價值：處分標的所得價格，並扣除處分之相關費用（<span class=\"art\">§47</span>為「得」扣除）。6.決定折現率：可採加權平均資金成本法。7.代入公式，求得收益價格。</p></div><div class=\"evp\"><p class=\"evh\">（三）折現率與資本化率</p><p>折現率Y反映資金成本與風險，用於DCF各期折現；資本化率用於直接資本化或求期末價值，兩者不同。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，DCF適用於收益逐期變動之營運性不動產與投資評估，重點在逐期淨收益、期末價值（得扣處分費用）與折現率三項，依上述七步驟代入<span class=\"art\">§32</span>公式求得收益價格。</p>"], "ck": [{"x": "§31 定義：各期淨收益＋期末價值，以適當折現率折現後加總", "h": false}, {"x": "應用時機：營運性不動產（舉例）＋投資決策評估", "h": false}, {"x": "與直接資本化法區分：收益穩定用直資法，逐期變動才用 DCF", "h": false}, {"x": "§32 公式與符號（P、CFₖ、Y、n′、Pₙ′）", "h": true}, {"x": "折現率≠資本化率；期末價值也要以 Y 折現", "h": true}, {"x": "程序七步：有效總收入扣閒置及其他損失；分析期間一般 5 年或 10 年", "h": false}, {"x": "期末價值扣處分費用，§47 為「得」不是「應」", "h": true}, {"x": "折現率可採加權平均資金成本法，最後代入公式求收益價格", "h": false}], "mn": "各期淨收益＋期末價值 → 全用 Y 折現 → 加總＝收益價格", "hp": 1045, "hpl": "中"}, {"id": "pred-2", "no": "115預測②", "t": "收益法資本化率決定方法（WACC加權平均資金成本法）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "收益法", "q": "試說明不動產估價技術規則中，收益法之資本化率決定方法有哪些？並以下列條件計算某辦公室之資本化率：自有資金佔30%、年報酬率7%；借款資金佔70%、年利率2.5%；估計之年淨收益為60萬元。以加權平均資金成本法（WACC）求出資本化率，並計算該不動產之收益價格。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p><b>資本化率</b>係收益法中將年淨收益還原為收益價格之比率。技術規則<span class=\"art\">第43條</span>共列五種決定方法，至少要能背出名稱，並能說明加權平均資金成本法（WACC）之計算邏輯：依各資金來源之比重與利率（要求報酬率）加權平均。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\">技術規則<span class=\"art\">第43條</span>（<span class=\"art\">§43</span>）資本化率決定方法五種：</span><span class=\"evli\">1. 風險溢酬法；2. 市場萃取法；3. 加權平均資金成本法（WACC）；4. 債務保障比率法；5. 有效總收入乘數法。</span><span class=\"evli\">收益價格＝年淨收益÷資本化率。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）資本化率決定方法（<span class=\"art\">§43</span>）</p><p>1. 風險溢酬法：以一般性財貨之投資報酬率為比較基準（定存利率、公債利率、投資風險、貨幣變動、價格趨勢），再比較標的之流通性、風險性、增值性、管理難易。</p><p>2. 市場萃取法：選擇數個類似不動產，以各自之淨收益除以價格，比較其比率。</p><p>3. WACC：依各資金來源之比重與利率（要求報酬率）加權平均。</p><p>4. 債務保障比率法：資本化率＝債務保障比率×貸款常數×貸款資金占不動產價格比率。</p><p>5. 有效總收入乘數法：資本化率＝淨收益率（合理淨收益率）÷有效總收入乘數。</p><p class=\"evx\"><span class=\"evt\">例</span><span>已知近期成交價1,500萬元、年淨收益57萬元，市場萃取資本化率＝57÷1,500＝3.80%。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）WACC計算資本化率</p><p>公式：r＝自有資金比例×自有資金報酬率＋借款比例×借款利率</p><p>代入：r＝0.30×7%＋0.70×2.5%＝2.1%＋1.75%</p><p>結果：r＝<b>3.85%</b></p><p class=\"evx\"><span class=\"evt\">例</span><span>若忘記乘以各自比例，直接相加7%＋2.5%＝9.5%，將嚴重高估資本化率。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）計算收益價格</p><p>公式：收益價格＝年淨收益÷資本化率</p><p>代入：60萬元÷3.85%＝60÷0.0385</p><p>結果：≈<b>1,558.4萬元</b></p><p class=\"evx\"><span class=\"evt\">例</span><span>若誤用年淨收益×資本化率，結果只有2.3萬，明顯不合理。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>以WACC法計算之資本化率為3.85%，據以推算該辦公室之收益價格約為1,558萬元。實務中估價師應再以市場萃取法核驗此一資本化率是否符合市場現況（上例3.80%與3.85%相近，可相互佐證），確保估價結果之合理性。</p>"], "ck": [{"x": "§43 五種方法名稱完整列出", "h": false}, {"x": "WACC 邏輯與債務保障比率法、有效總收入乘數法公式", "h": false}, {"x": "WACC 公式：自有比例×報酬率＋借款比例×利率", "h": false}, {"x": "0.30×7%＋0.70×2.5%＝2.1%＋1.75%＝3.85%，要乘各自比例，不可 7%＋2.5%", "h": true}, {"x": "收益價格＝年淨收益÷資本化率", "h": true}, {"x": "60÷0.0385≈1,558.4 萬元（不是相乘得 2.3 萬）", "h": false}, {"x": "資本化率（直接法）與折現率（DCF）不可混用", "h": true}, {"x": "三子題各給一句直接答案，數字要寫單位", "h": false}], "mn": "§43 五法 → WACC＝比例×報酬率相加＝3.85% → 60÷3.85%＝1,558 萬", "hp": 1048, "hpl": "中"}, {"id": "pred-22", "no": "115預測㉒", "t": "殘餘法：土地收益價格與建物收益價格（§44、§45）＋一定期間收益價格（§47）", "lv": "預測・必考（A級）", "k": "pred", "tier": 0, "g": "收益法", "q": "依不動產估價技術規則：(一)土地收益價格與建物收益價格各應如何求取？請列式說明，並說明「折舊前淨收益」與「已扣除折舊提存費之淨收益」在算式上的差別。(二)某房地之年淨收益（已扣折舊提存費）為100萬元，建物成本價格2,000萬元、建物收益資本化率3%、土地收益資本化率2%，試求土地收益價格。(三)某不動產可收益年數10年，每年折舊前淨收益10萬元，收益資本化率3%，試求其收益價格。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>收益法中，若房地淨收益已知，而土地與建物其中一方之價格或淨收益可先行確定，即可將房地淨收益扣除已知的那一半，剩餘部分還原為未知那一半之收益價格，實務與教材稱為<b>殘餘法</b>。另收益年限若限於一定期間，不得以永續年金直接除，應以年金現值之觀念折現。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"evli\"><span class=\"art\">§44</span>：土地收益價格＝（房地淨收益－建物淨收益）÷土地收益資本化率；建物淨收益＝建物成本價格×建物收益資本化率（折舊前者加計折舊提存率於乘數）。</span><span class=\"evli\"><span class=\"art\">§45</span>：建物收益價格＝（房地淨收益－土地淨收益）÷建物收益資本化率；土地淨收益得先以比較法求取土地比較價格再乘土地收益資本化率（折舊前者加計折舊提存率於分母）。</span><span class=\"evli\"><span class=\"art\">§47</span>：一定期間收益價格P＝a×[1－1÷(1＋r)<sup>n′</sup>]÷r；有期末價值者得加計其現值。</span></p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）土地與建物收益價格之求取及折舊差別</p><p>1. 依<span class=\"art\">§44</span>，淨收益已扣除折舊提存費者適用第二項第一款，建物淨收益＝建物成本價格×建物收益資本化率；屬<b>折舊前淨收益</b>者，依第二項第二款，建物折舊前淨收益＝建物成本價格×（建物收益資本化率＋建物價格日期當時價值未來每年折舊提存率），分母恆為土地收益資本化率。</p><p>2. 依<span class=\"art\">§45</span>，方向相反，房地淨收益減土地淨收益後除以建物收益資本化率，折舊前者將折舊提存率加計於<b>分母</b>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>土地不折舊，始終僅用土地收益資本化率。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）土地收益價格（<span class=\"art\">§44</span>）</p><p>本題淨收益已扣折舊提存費，建物該半不加折舊提存率。</p><p>公式：土地收益價格＝（房地淨收益－建物成本價格×建物收益資本化率）÷土地
