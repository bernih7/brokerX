td.lw{font-size:.74rem;color:var(--muted);white-space:nowrap}

.pill{display:inline-block;font-weight:800;border-radius:7px;padding:1px 9px;line-height:1.5}

.nt{font-size:.78rem;color:var(--muted)}

.empty{padding:30px;text-align:center;color:var(--muted)}
.tip{font-size:.78rem;color:var(--muted);margin:8px 2px}
