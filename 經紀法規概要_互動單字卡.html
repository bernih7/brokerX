<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規概要｜互動單字卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F8F3E9;
  --paper-dark: #EFE7D6;
  --ink: #2A2722;
  --vermillion: #A8402B;
  --gold: #BC8A2E;
  --green: #4C6B43;
  --blue: #3A5A78;
  --orange: #C07830;
  --purple: #6B4C8A;
  --line: #D9CFB8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  line-height: 1.7;
}
.app { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: 1.4rem;
  text-align: center;
  margin: 10px 0 2px;
}
.subtitle { text-align: center; font-size: .78rem; color: #6b6354; margin-bottom: 16px; }

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(42,39,34,.05);
}
.stats-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.stat-chip {
  background: var(--paper-dark);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 11px;
  font-size: .74rem;
  font-weight: 600;
}
.stat-chip b { color: var(--vermillion); }

.section-label {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  font-size: .92rem;
  margin-bottom: 8px;
  border-left: 4px solid var(--vermillion);
  padding-left: 8px;
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.group-chip {
  border: 1px solid var(--line);
  background: var(--paper-dark);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: .78rem;
  cursor: pointer;
  font-weight: 700;
}
.group-chip.active { background: var(--vermillion); color: #fff; border-color: var(--vermillion); }
.btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
button {
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: .86rem;
  cursor: pointer;
}
button:active { transform: scale(.97); }
.btn-primary { background: var(--vermillion); color: #fff; flex: 1; min-width: 130px; }
.btn-secondary { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); }
.btn-mini { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: .74rem; }
.mode-chip { border: 1px solid var(--line); background: var(--paper-dark); border-radius: 16px; padding: 6px 14px; font-size: .8rem; cursor: pointer; font-weight: 700; }
.mode-chip.active { background: var(--gold); color: #fff; border-color: var(--gold); }

#studyArea { display: none; }
.progress-bar-wrap { background: var(--paper-dark); border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 10px; }
.progress-bar-fill { background: var(--gold); height: 100%; transition: width .25s; }
.card-meta { display: flex; justify-content: space-between; font-size: .74rem; color: #807660; margin-bottom: 8px; font-weight: 600; }

.flashcard-wrap { perspective: 1200px; margin-bottom: 16px; }
.flashcard {
  position: relative;
  display: grid;
  min-height: 220px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .5s;
  transform-style: preserve-3d;
}
.flashcard.flipped { transform: rotateY(180deg); }
.card-face {
  grid-area: 1 / 1;
  position: relative;
  border-radius: 14px;
  padding: 44px 22px 18px;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(42,39,34,.08);
}
.card-front {
  background: #fff;
  border: 2px solid var(--line);
}
.card-back {
  transform: rotateY(180deg);
  color: #fff;
}
.cat-def .card-back { background: linear-gradient(135deg, var(--green), #3a5234); }
.cat-law .card-back { background: linear-gradient(135deg, var(--blue), #2a4258); }
.cat-confuse .card-back { background: linear-gradient(135deg, var(--orange), #9a5f1f); }
.cat-mnem .card-back { background: linear-gradient(135deg, var(--purple), #4f3868); }
.cat-trap .card-back { background: linear-gradient(135deg, var(--vermillion), #7a2c1c); }

.cat-tag {
  position: absolute;
  top: 12px;
  left: 14px;
  font-size: .65rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 10px;
  background: var(--paper-dark);
  color: var(--ink);
}
.card-back .cat-tag { background: rgba(255,255,255,.22); color: #fff; }
.card-front-text {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.15rem;
  font-weight: 700;
  text-align: center;
  margin-top: 4px;
  white-space: pre-wrap;
}
.card-back-text {
  font-size: .95rem;
  white-space: pre-wrap;
  margin-top: 4px;
  font-weight: 500;
  line-height: 1.75;
  text-align: left;
}
.hl{padding:0 .2em;border-radius:4px;font-weight:700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-k{background:#F7D774;color:#2A2722}
.hl-a{background:#FFB4A2;color:#3A1410}
.hl-b{background:#A9D6FF;color:#10283F}
.hl-c{background:#B8E6B0;color:#12301A}
.hl-d{background:#FFC48A;color:#3A2008}
.hl-e{background:#D8C2F0;color:#2A1640}
.hl-m{color:#FFE08A;font-size:1.08em;letter-spacing:.08em;border-bottom:2px solid #FFE08A;border-radius:0;padding:0}
.hl-n{background:rgba(255,255,255,.2);color:#FFE9A8}
.card-front .hl-n{background:#F6E3D8;color:#A8402B}
.card-front .hl-m{color:#A8402B;border-bottom-color:#A8402B}
.flip-hint {
  text-align: center;
  font-size: .7rem;
  color: #9a917a;
  margin-top: 6px;
}
.card-back .flip-hint { color: rgba(255,255,255,.6); }

.mastery-row { display: flex; gap: 8px; margin-top: 4px; }
.mastery-btn {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  border: none;
  font-weight: 700;
  font-size: .85rem;
  cursor: pointer;
}
.mastery-no { background: #FBEAE6; color: var(--vermillion); }
.mastery-soso { background: #FCF1DB; color: var(--orange); }
.mastery-yes { background: #EAF1E6; color: var(--green); }

.nav-row { display: flex; gap: 8px; margin-top: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: .68rem; margin-top: 10px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.footer-note { text-align: center; font-size: .68rem; color: #9a917a; margin-top: 22px; }
</style>
</head>
<body>
<div class="app">
  <h1>經紀法規概要｜互動單字卡</h1>
  <div class="subtitle">102張卡・A-H八篇完整涵蓋・翻牌學習＋掌握度追蹤</div>

  <div id="setupArea">
    <div class="panel">
      <div class="stats-row" id="overallStats"></div>
      <div class="section-label">選擇篇章（可複選，預設全選）</div>
      <div class="chip-grid" id="groupChips"></div>
      <div class="btn-row">
        <button class="btn-mini" id="selectAllBtn">全選</button>
        <button class="btn-mini" id="selectNoneBtn">全不選</button>
        <button class="btn-mini" id="selectWeakBtn">只練不熟的卡</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-label">卡片順序</div>
      <div class="chip-grid">
        <div class="mode-chip active" data-mode="order">依篇章順序</div>
        <div class="mode-chip" data-mode="random">隨機亂序</div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="startBtn">開始學習</button>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:#4C6B43"></i>定義原則</span>
        <span><i class="dot" style="background:#3A5A78"></i>法條要件</span>
        <span><i class="dot" style="background:#C07830"></i>易混淆比較</span>
        <span><i class="dot" style="background:#6B4C8A"></i>口訣速記</span>
        <span><i class="dot" style="background:#A8402B"></i>高頻陷阱</span>
      </div>
    </div>
  </div>

  <div id="studyArea">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="card-meta">
      <span id="cardPosition"></span>
      <span id="cardChapterLabel"></span>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front" id="cardFrontFace">
          <div class="cat-tag" id="frontCatTag"></div>
          <div class="card-front-text" id="cardFrontText"></div>
          <div class="flip-hint">點擊卡片查看解析</div>
        </div>
        <div class="card-face card-back" id="cardBackFace">
          <div class="cat-tag" id="backCatTag"></div>
          <div class="card-back-text" id="cardBackText"></div>
          <div class="flip-hint">點擊卡片返回正面</div>
        </div>
      </div>
    </div>
    <div class="mastery-row">
      <button class="mastery-btn mastery-no" data-level="no">😵 不熟</button>
      <button class="mastery-btn mastery-soso" data-level="soso">🤔 普通</button>
      <button class="mastery-btn mastery-yes" data-level="yes">😎 掌握</button>
    </div>
    <div class="nav-row">
      <button class="btn-secondary" id="prevBtn">上一張</button>
      <button class="btn-secondary" id="backToSetupBtn">結束學習</button>
    </div>
  </div>

  <div class="footer-note">BrokerX 備考 Project・依《經紀法規概要_重點筆記》A-H八篇28子章節整理</div>
</div>

<script>
const ALL_CARDS = [{"id":"A101","front":"主管機關層級","back":"中央：內政部\n直轄市：地政處\n縣市：縣市政府","category":"def","chapter":"A1"},{"id":"A102","front":"「不動產」的法定定義","back":"土地、土地定著物或房屋及其可移轉之權利","category":"def","chapter":"A1"},{"id":"A103","front":"「成屋」vs「預售屋」","back":"成屋：領有使用執照，或實施建管前建造完成之建築物\n預售屋：領有建造執照尚未建造完成，以將來完成之建築物為交易標的","category":"confuse","chapter":"A1"},{"id":"A104","front":"「仲介業務」vs「代銷業務」","back":"仲介業務：從事買賣互易租賃之居間或代理\n代銷業務：受起造人或建築業委託，企劃並代理銷售不動產","category":"confuse","chapter":"A1"},{"id":"A105","front":"「經紀人」vs「經紀營業員」","back":"經紀人：執行仲介或代銷業務\n經紀營業員：協助經紀人執行業務（不可單獨執行）","category":"confuse","chapter":"A1"},{"id":"A106","front":"★陷阱：「差價」的定義","back":"實際買賣交易價格與「委託銷售價格」之差額\n（不是與市場行情價的差額！）","category":"trap","chapter":"A1"},{"id":"A201","front":"經紀業設立四步驟","back":"①{{a|申請許可}}\n②辦{{b|公司或商業登記}}\n③加入登記所在地{{c|同業公會}}\n④{{n|6個月}}內{{d|開始營業}}\n\n口訣：{{m|許・登・會・營}}","category":"law","chapter":"A2"},{"id":"A202","front":"開業期限與展延","back":"應於許可後6個月內開始營業；逾期未開業主管機關廢止許可；有正當理由得申請展延一次，以3個月為限","category":"law","chapter":"A2"},{"id":"A203","front":"★陷阱：經營國外不動產業務的組織型態","back":"經營國外不動產仲介或代銷業務者，應以「公司」型態組織辦理登記，商號不可！","category":"trap","chapter":"A2"},{"id":"A204","front":"不得申請經營經紀業之事由（時間數字版）","back":"{{a|詐欺、背信、侵占罪}}：徒刑{{n|1年}}以上，執行完畢／赦免後未滿{{n|3年}}\n{{b|受感訓處分}}：執行完畢後未滿{{n|3年}}\n{{c|撤銷或廢止許可}}：未滿{{n|5年}}\n{{d|廢止經紀人員證書}}：未滿{{n|5年}}\n\n口訣：刑與感訓{{m|3年}}；撤廢許可、廢證{{m|5年}}","category":"law","chapter":"A2"},{"id":"A205","front":"營業保證金管理","back":"由「全國聯合會」統一設置營業保證基金專戶管理\n基金管理委員會中經紀業代表人數不得超過委員總數5分之2","category":"def","chapter":"A2"},{"id":"A206","front":"營業保證金退還條件","back":"公司解散/商號歇業/組織存續但已無仲介代銷業務\n可自核准註銷營業滿1年後2年內請求退還（孳息不退還）","category":"law","chapter":"A2"},{"id":"A207","front":"★高頻數字：經紀人配置門檻","back":"一般營業處所：至少置經紀人1人\n非常態營業處所銷售額達6億元以上：至少專業經紀人1人\n經紀營業員每逾20名：應增設經紀人1人","category":"trap","chapter":"A2"},{"id":"A301","front":"★陷阱：經紀人證書請領條件","back":"考試及格≠可以請證！\n須「具備1年以上經紀營業員經驗」才能向直轄市/縣市政府請領經紀人證書","category":"trap","chapter":"A3"},{"id":"A302","front":"經紀人證書效期與換證","back":"證書有效期限4年\n期滿需檢附4年內完成30小時以上專業訓練證明辦理換證","category":"law","chapter":"A3"},{"id":"A303","front":"經紀營業員訓練與登錄","back":"初次訓練不得少於30小時，證明有效期限4年\n期滿需完成20小時以上訓練重新登錄","category":"law","chapter":"A3"},{"id":"A304","front":"★高頻易混淆：訓練時數比較","back":"經紀{{a|人}}換證：{{n|30小時}}以上\n經紀{{b|營業員}}重新登錄：{{n|20小時}}以上\n\n→兩者證書效期皆為{{n|4年}}\n口訣：{{m|人30、員20}}","category":"confuse","chapter":"A3"},{"id":"A305","front":"★陷阱：經紀人員可以兼職嗎？","back":"原則：應{{a|專任}}一經紀業，不得為自己或他經紀業執行業務\n例外：經{{k|所屬經紀業同意}}為他經紀業執行業務 → 不在此限\n\n→並非絕對禁止兼職！","category":"trap","chapter":"A3"},{"id":"A306","front":"經紀人員保密義務","back":"對因業務知悉或持有之他人秘密，不得無故洩漏（第25條）","category":"def","chapter":"A3"},{"id":"A401","front":"廣告與銷售三前提","back":"①須先與委託人簽訂{{a|委託契約書}}，才可刊登廣告及銷售\n②廣告銷售內容須{{b|與事實相符}}，並註明{{b|經紀業名稱}}\n③不符者→{{c|負損害賠償責任}}","category":"law","chapter":"A4"},{"id":"A402","front":"★高頻：應由經紀人簽章之六類文件","back":"經紀人要簽章的六類文件（§22Ⅰ）：\n①不動產出租、出售{{a|委託契約書}}\n②不動產承租、承購{{a|要約書}}\n③{{b|定金收據}}\n④不動產{{c|廣告稿}}\n⑤不動產{{d|說明書}}\n⑥租賃、買賣{{e|契約書}}\n\n口訣：{{m|委・要・定・廣・說・契}}\n★代銷不適用①②（見下一張）","category":"law","chapter":"A4"},{"id":"A403","front":"★高頻陷阱：代銷業務的例外","back":"第1、2款（委託契約書、要約書）於經營「代銷業務」者不適用！\n因代銷業是建商委託，相對人是社會大眾買方，無「委託契約書」概念","category":"trap","chapter":"A4"},{"id":"A404","front":"★極高頻：不動產說明書解說流程口訣","back":"製作→委託人先簽章確認→經紀人向相對人解說→締約時交付相對人並簽章→視為契約之一部分","category":"mnem","chapter":"A4"},{"id":"A405","front":"★高頻陷阱：說明書≠現況確認書","back":"不動產說明書：條例22-24條，經紀人製作，需委託人與相對人簽章，視為契約一部分\n建物現況確認書：成屋契約附件一，賣方自填，不能替代說明書內容","category":"trap","chapter":"A4"},{"id":"A406","front":"雙方代理六項義務","back":"經買賣或租賃{{k|雙方書面同意}}，才可同時接受雙方委託，並應：\n①{{a|公平}}提供雙方類似不動產{{a|交易價格}}\n②公平提供{{b|契約內容}}規範說明\n③提供{{c|必要資訊}}\n④告知{{d|應查知之瑕疵}}\n⑤協助{{e|必要檢查}}\n⑥其他中央主管機關規定","category":"law","chapter":"A4"},{"id":"A407","front":"★高頻：申報登錄期限","back":"{{a|仲介}}業務（租賃案件）\n　簽訂租賃契約書起{{n|30日}}內→{{k|申報登錄}}成交資訊\n\n{{b|代銷}}業務（委託代銷契約）\n　簽訂／變更／終止起{{n|30日}}內→報請{{k|備查}}\n\n{{c|代銷}}業務（買賣契約）\n　簽訂買賣契約書起{{n|30日}}內→{{k|申報登錄}}","category":"law","chapter":"A4"},{"id":"A408","front":"損害賠償責任歸屬","back":"可歸責經紀業未能履行委託契約：經紀業負責\n經紀人員執行業務故意過失致損害：經紀業與經紀人員「連帶」賠償","category":"def","chapter":"A4"},{"id":"A409","front":"★高頻：報酬限制與違反處理","back":"不得收取差價或其他報酬，應依實際成交價金按主管機關報酬標準計收\n違反者：已收取部分應「加計利息後加倍返還」支付人","category":"trap","chapter":"A4"},{"id":"A501","front":"★高頻金額：經紀業最常見罰鍰級距","back":"罰鍰 NT${{n|6萬-30萬}}，常見違反的條文（第29條）：\n\n{{m|倫・配・僱・收・廣・簽}}\n\n第7條Ⅵ　經紀業{{a|倫理規範}}（冷門）\n第11條　營業處所經紀人{{b|配置人數}}不足\n第17條　{{c|僱用}}未具資格人員\n第19條Ⅰ　{{d|收取}}差價或其他報酬\n第21條　{{e|廣告}}及銷售：未先簽委託契約書／內容不實／未註明經紀業名稱\n第22條Ⅰ　法定文件未由經紀人{{k|簽章}}","category":"law","chapter":"A5"},{"id":"A502","front":"經紀人員懲戒：申誡 vs 停止執行業務","back":"{{a|申誡}}（輕）\n　第16條　{{a|兼業}}限制\n　第22條Ⅰ　{{a|簽章}}義務\n　第23條　說明書{{a|解說}}義務\n　第25條　{{a|保密}}義務　→口訣：{{m|兼・簽・解・密}}\n\n{{b|停止執行業務 6個月以上3年以下}}（重）\n　第19條Ⅰ　收取差價或報酬\n\n★同是第19條Ⅰ：對經紀{{k|業}}＝罰鍰{{n|6萬-30萬}}；對經紀{{k|人員}}＝停止執行業務","category":"confuse","chapter":"A5"},{"id":"A503","front":"★陷阱：申誡累計後果","back":"{{a|申誡}}累計{{n|3次}}\n　→ 另予{{b|停止執行業務}}{{n|6個月}}以上{{n|3年}}以下\n\n{{b|停止執行業務}}累計達{{n|5年}}以上\n　→ {{c|廢止}}經紀人員證書\n\n口訣：{{m|3次申誡換停執、5年停執出局}}","category":"trap","chapter":"A5"},{"id":"A504","front":"★陷阱：非經紀業違法經營，先罰後刑","back":"{{a|第一步（行政罰）}}\n　主管機關{{k|禁止營業}}，並處負責人或行為人罰鍰{{n|10萬-30萬}}\n\n{{b|第二步（刑罰）}}\n　經禁止後{{k|仍繼續營業}}→{{n|1年}}以下徒刑、拘役，得科或併科罰金{{n|10萬-30萬}}\n\n★陷阱：{{a|先罰}}後{{b|刑}}，不是一犯就有刑責","category":"trap","chapter":"A5"},{"id":"B101","front":"申請不合規定時，補正期限幾日？","back":"不合規定 → 通知{{k|補正}}\n　{{n|15日}}內補正，屆期未補正→{{a|駁回}}\n\n▍適用三處（施行細則）\n　§3　經紀業許可申請\n　§15　經紀人證書申請\n　§17　經紀人換證","category":"law","chapter":"B1"},{"id":"B102","front":"備查「30日」四件事，怎麼記？","back":"{{m|變・遷・分・撤}}＝{{n|30日}}內書面申請備查\n\n{{a|變}}更登記事項　§6（名稱、所在地、組織、負責人等）\n{{b|遷}}入他縣市　§7（遷出後30日，向遷入地申請）\n{{c|分}}設營業處所　§8（設立後30日）\n{{d|撤}}銷（裁撤）營業處所　§10（裁撤後30日）","category":"mnem","chapter":"B1"},{"id":"B103","front":"★15日 vs 30日，怎麼分？","back":"{{b|15日}}＝「補正」與「剛開始」\n　①不合規定→補正（§3／§15／§17）\n　②{{b|開始營業後}}申請備查（§5）\n　③經紀人到職→造名冊備查（條例§12）\n\n{{c|30日}}＝「變動」四件事\n　{{m|變遷分撤}}（§6／§7／§8／§10）\n\n★陷阱：第一次營業備查是{{b|15日}}，之後有變動才是{{c|30日}}","category":"trap","chapter":"B1"},{"id":"B104","front":"主管機關須永久保存的簿冊有哪5種？（§14）","back":"直轄市、縣（市）主管機關設置，{{k|永久}}保存（不是5年）：\n\n①經紀{{a|業}}管理登記簿\n②{{b|外縣市}}經紀業在{{b|本轄區內}}設立之營業處所管理登記簿\n③經紀{{c|人}}名簿\n④經紀{{d|營業員}}名簿\n⑤經紀業{{e|專冊}}\n\n口訣：{{m|業・外・人・員・冊}}\n\n★陷阱：②是「外縣市業者來本轄區設處所」；說成「本轄區業者在區域外設處所」＝錯（99年考過）","category":"def","chapter":"B1"},{"id":"B105","front":"經紀人換發證書：什麼時候換？效期多久？","back":"▍何時申請：證書屆滿前{{n|6個月}}內（§17）\n▍要完成：專業訓練{{n|30小時}}\n▍新效期：自原證書{{k|屆滿次日}}起算{{n|4年}}\n\n▍沒換怎麼辦：屆滿仍未換發→原核發機關{{a|註銷}}證書並公告（§18）","category":"law","chapter":"B1"},{"id":"B106","front":"請領經紀人證書：要向哪裡申請？附哪5樣文件？（§15）","back":"向{{k|戶籍所在地}}直轄市或縣（市）主管機關申請\n\n①申請書\n②身分證明文件{{b|影本}}\n③{{n|1年}}內相片{{n|2張}}\n④{{a|考試及格證書}}＋影本\n⑤{{a|1年以上經紀營業員經驗}}證明＋影本\n\n不合規定→{{n|15日}}內補正，逾期駁回（退還文件）","category":"law","chapter":"B1"},{"id":"B107","front":"★營業處所要揭示哪4樣文件？哪些可影本？代銷免揭哪項？（§21）","back":"明顯處揭示 {{k|4項}}：\n①經紀業{{a|許可文件}}\n②{{a|同業公會會員證書}}\n③不動產{{a|經紀人證書}}\n④{{b|報酬標準及收取方式}}\n\n▍①②③ → {{k|得以影本}}\n▍④ → {{b|代銷經紀業不適用}}（代銷沒有向客戶收報酬的標準）\n\n口訣：{{m|許・會・證}}可影本，{{m|報酬}}代銷免","category":"trap","chapter":"B1"},{"id":"B108","front":"經紀業許可後：6個月內要完成哪3件？開始營業後呢？","back":"許可後{{n|6個月}}內完成 {{k|3件}}（§4）：\n①公司或商業{{a|登記}}\n②繳存營業{{b|保證金}}\n③加入同業{{c|公會}}\n\n開始營業後{{n|15日}}內→向主管機關申請{{k|備查}}（§5）\n　檢附：申請書、登記證明、保證金證明、公會會員證明、經紀人員名冊及證書影本","category":"law","chapter":"B1"},{"id":"B109","front":"加盟經營、收受文件，各有什麼規定？","back":"{{a|加盟經營}}（§22）\n　廣告、市招、名片等明顯處，標明「{{k|加盟店}}／{{k|加盟經營}}」字樣\n\n{{b|收受文件}}（§23）\n　經紀人員收受委託人或交易相對人的文件→應{{k|掣給收據}}","category":"law","chapter":"B1"},{"id":"B110","front":"業務紀錄與主管機關查核？拒絕查核會怎樣？","back":"▍§25 經紀業執行業務→應{{k|記錄辦理情形}}\n▍主管機關得查詢、取閱紀錄文件，並得限期令提出資料\n▍經紀業{{a|不得規避、妨礙或拒絕}}\n\n▍拒絕查核的罰則（條例§27→§29）：\n　先{{b|限期改正}}→屆期未改正→罰鍰{{n|3萬-15萬}}","category":"law","chapter":"B1"},{"id":"B111","front":"處罰與懲戒，由哪個機關管？","back":"{{a|處罰}}（對經紀業，§25-1）\n　由{{k|經紀業所在地}}主管機關為之\n　分設處所在別的縣市→由該處所在地機關查明後，{{k|移請}}經紀業所在地機關處罰\n\n{{b|懲戒}}（對經紀人員，§27）\n　由其{{k|經紀業所在地}}主管機關交付懲戒\n　結果通知當事人，並函請{{k|戶籍所在地}}主管機關登錄","category":"law","chapter":"B1"},{"id":"C101","front":"土地說明書七大記載項目（口訣）","back":"七大項目（依序）：\n①{{a|標示}}及權利範圍（坐落、面積、地籍圖）\n②所有權人或他項權利人\n③交易{{b|權利種類}}及登記狀態\n④{{c|管理與使用}}情況\n⑤{{d|使用管制}}內容\n⑥重要{{e|交易條件}}\n⑦{{k|其他}}重要事項\n\n口訣：{{m|標・人・權・管・制・條・他}}","category":"mnem","chapter":"C1"},{"id":"C201","front":"成屋建物型態三分類","back":"{{a|一般建物}}\n　獨棟／連棟／雙併（{{k|無共有部分}}）\n\n{{b|區分所有建物}}\n　公寓／透天厝／店面／辦公商業大樓／住宅大樓／華廈／套房\n\n{{c|其他特殊建物}}\n　工廠／廠辦／農舍／倉庫","category":"def","chapter":"C2"},{"id":"C202","front":"★115年新增：建築能效情形","back":"成屋說明書新增第6目：有無取得建築能效標示？\n若有應敘明等級、核發日期及證書效期（配合近零碳建築政策）","category":"trap","chapter":"C2"},{"id":"C301","front":"預售屋特有記載事項","back":"預售屋比成屋「多出來」的記載事項：\n①{{a|建造執照}}字號\n②出售面積與權利範圍（主建物面積{{a|占比}}）\n③共有部分項目與{{b|分配比例}}\n④主要{{c|建材廠牌}}規格\n⑤{{d|工程進度}}：開工、取照、通知交屋、保固期限\n⑥{{e|規約草約}}（{{n|7項}}內容）","category":"def","chapter":"C3"},{"id":"C302","front":"★115年陷阱：氯離子檢測新舊用語","back":"舊：建築物混凝土氯離子含量檢測報告＋無放射性污染證明\n新：施工中建築物「新拌」混凝土氯離子含量檢測報告單＋無「輻射」污染證明\n→僅見於預售屋，成屋章節未同步修正！","category":"trap","chapter":"C3"},{"id":"C401","front":"不得記載事項六項","back":"不得記載事項（土地、成屋、預售屋共通；④僅預售屋）：\n①不得載「{{a|僅供參考}}」\n②不得載「{{a|繳回}}說明書」\n③不得用{{b|受益／銷售／使用面積}}等名詞\n④預售屋不得載未領照{{c|夾層}}\n⑤不得以{{d|現況確認書}}替代說明書\n⑥不得載{{e|房價上漲}}空間或預測上漲","category":"law","chapter":"C4"},{"id":"C501","front":"★115年三大最新修正重點","back":"①{{a|建築能效}}標示揭露（成屋、預售屋皆增列）\n②{{b|太陽光電}}發電設備設置情形揭露\n③最近{{n|5年}}內基地周邊半徑{{n|300公尺}}有無申請{{c|水災淹水救助}}紀錄\n\n口訣：{{m|能・光・水}}","category":"trap","chapter":"C5"},{"id":"C502","front":"★陷阱：300公尺水災紀錄的適用範圍","back":"成屋與預售屋的「其他重要事項」皆新增此項\n但「土地素地」章節未列入此項！","category":"trap","chapter":"C5"},{"id":"D101","front":"成屋買賣契約審閱期","back":"至少5日","category":"def","chapter":"D1"},{"id":"D102","front":"★高頻：成屋交屋遲延違約金","back":"賣方逾期交屋：買方得請求每日按已付價款萬分之二單利計算之損害賠償","category":"law","chapter":"D1"},{"id":"D103","front":"★核心高頻：成屋違約罰則","back":"{{a|賣方違約}}\n　全部退還已付價款＋每日{{n|萬分之二}}單利＋同額違約金\n　違約金{{k|不超過}}總價{{n|15%}}\n\n{{b|買方違約}}（逾期{{n|5日}}未付款）\n　賣方沒收已付價款充違約金\n　沒收{{k|不超過}}總價{{n|15%}}","category":"trap","chapter":"D1"},{"id":"D104","front":"成屋契約不得記載：利率上限","back":"不得記載超過民法第205條週年16%利率之利息","category":"law","chapter":"D1"},{"id":"D201","front":"預售屋履約擔保五選一","back":"五種擇一（口訣：{{m|開・返・價・同・公}}）\n①不動產{{a|開發信託}}（土地與興建資金信託，專款專用）\n②價金{{b|返還}}之保證\n③{{c|價金信託}}\n④{{d|同業}}連帶擔保\n⑤{{e|公會}}辦理連帶保證協定","category":"def","chapter":"D2"},{"id":"D202","front":"★陷阱：面積誤差找補規則","back":"{{a|不足}}部分：賣方{{k|全部找補}}\n{{b|超過}}部分：買方{{k|最多找補}}{{n|2%}}為限\n誤差超過{{n|3%}}：買方得{{c|解除契約}}\n\n口訣：不足全補、超過2%、誤差3%解約","category":"trap","chapter":"D2"},{"id":"D203","front":"預售屋保固期限","back":"結構部分（基礎/樑柱/承重牆/樓地板/屋頂/樓梯/擋土牆）：保固15年\n固定建材設備（門窗/粉刷/地磚）：保固1年","category":"law","chapter":"D2"},{"id":"D204","front":"★陷阱：預售屋違約罰則方向相反","back":"{{a|賣方違約}}：賠償總價款百分比，{{k|不得低於}}{{n|15%}}（但不超過已繳價款）\n{{b|買方違約}}：沒收金額{{k|最高不得超過}}{{n|15%}}\n\n→與成屋「不超過15%」邏輯相反！","category":"trap","chapter":"D2"},{"id":"D301","front":"委託銷售契約審閱期","back":"不得少於3日（注意：與成屋/預售屋「至少5日」不同！）","category":"trap","chapter":"D3"},{"id":"D302","front":"受託人（仲介業者）六大義務","back":"受託人（仲介業者）六大義務：\n①以{{a|善良管理人}}之注意處理仲介事務\n②簽約前提供近{{n|3個月}}{{b|成交行情}}\n③市調、廣告費用原則{{c|自行負擔}}\n④說明書指派{{d|經紀人簽章}}\n⑤要約書{{n|24小時}}內{{e|轉交}}委託人\n⑥定金{{n|24小時}}內{{k|送交}}","category":"law","chapter":"D3"},{"id":"D303","front":"★高頻陷阱：委託銷售契約禁止收取斡旋金","back":"不得約定在契約成立前，受託人得向消費者收取斡旋金、訂金或其他任何名目之費用\n→實務常見但定型化契約明文禁止事先收取！","category":"trap","chapter":"D3"},{"id":"D304","front":"要約書關鍵規則","back":"審閱期不得少於3日\n買方撤回權：要約期限內可撤回，但賣方已承諾並送達買方者不可\n賣方變更要約內容而承諾＝視為拒絕原要約而為新要約","category":"def","chapter":"D3"},{"id":"D401","front":"★必背：三契約審閱期比較","back":"{{a|成屋買賣}}　至少{{n|5日}}\n{{a|預售屋買賣}}　至少{{n|5日}}\n{{b|委託銷售／要約書}}　不得少於{{n|3日}}\n\n口訣：{{m|買賣5、委託3}}","category":"confuse","chapter":"D4"},{"id":"D402","front":"★必背：違約金比例方向相反","back":"{{a|成屋}}買賣違約金：{{k|不超過}}總價{{n|15%}}\n{{b|預售屋}}買賣違約金：{{k|不得低於}}{{n|15%}}\n\n→方向完全相反：{{m|成屋封頂、預售保底}}","category":"trap","chapter":"D4"},{"id":"E101","front":"公寓大廈「四種部分」：各自怎麼定義？（條例§3）","back":"{{a|專有部分}}\n　公寓大廈的一部分，有{{k|使用上獨立性}}，且為{{k|區分所有之標的}}\n\n{{b|共用部分}}\n　專有部分以外的其他部分＋不屬專有的附屬建築物，供{{k|共同使用}}\n\n{{c|約定專用部分}}\n　{{b|共用部分}}，經約定供{{k|特定}}區分所有權人使用\n\n{{d|約定共用部分}}\n　{{a|專有部分}}，經約定供{{k|共同}}使用\n\n口訣：專用←共用　共用←專有\n（{{m|共用變專用、專有變共用}}）\n★陷阱：最愛把「約定專用」與「約定共用」的來源對調","category":"def","chapter":"E1"},{"id":"E102","front":"住戶 vs 管理委員會 vs 管理負責人","back":"{{a|住戶}}：區權人、承租人、經同意使用人、取得停車空間所有權者\n{{b|管理委員會}}：執行區分所有權人會議決議的組織\n{{c|管理負責人}}：未成立管委會時，推選之住戶{{n|1人}}","category":"confuse","chapter":"E1"},{"id":"E103","front":"「規約」的定義","back":"區分所有權人為增進共同利益確保良好生活環境，經區權會決議之共同遵守事項","category":"def","chapter":"E1"},{"id":"E104","front":"約定專用 vs 約定共用：來源、同意、費用怎麼比？","back":"▍來源\n　{{c|約定專用}}←{{b|共用部分}}（給特定人用）\n　{{d|約定共用}}←{{a|專有部分}}（給大家用）\n\n▍成立／變更\n　{{c|專用}}：範圍及使用主體→{{k|須載明於規約}}，否則不生效力（§23）；變更→須經{{k|使用人同意}}（§33）\n　{{d|共用}}：專有部分約定為共用→須經{{k|該專有部分所有人同意}}（§33）\n\n▍修繕費\n　{{c|專用}}→{{k|使用人}}自己負擔\n　{{d|共用}}→{{k|公共基金}}或按{{k|應有部分比例}}分擔（不是原所有人）\n\n▍相同：專有部分不得與共用部分應有部分、基地應有部分{{a|分離}}移轉或設定負擔","category":"confuse","chapter":"E1"},{"id":"E201","front":"★高頻：哪5種共用部分「不得」約定專用？（§7）","back":"共用部分原則可約定專用，但這{{n|5種}}{{a|不行}}（寫進規約也無效）：\n\n①公寓大廈{{k|本身所占之地面}}\n②{{k|連通走廊、樓梯}}、通往室外通路、門廳；社區內{{k|巷道、防火巷弄}}\n③{{k|基礎、主要樑柱、承重牆壁、樓地板、屋頂之構造}}\n④約定專用有{{k|違法令使用限制}}者\n⑤其他有{{k|固定使用方法}}，且屬生活利用{{k|不可或缺}}者\n\n口訣：{{m|地・道・構・法・缺}}\n\n✅例外可約定專用：{{c|屋頂突出物、屋頂平臺}}（③但書）；無固定使用方法、非生活不可或缺者（如露臺）","category":"law","chapter":"E2"},{"id":"E202","front":"外牆變更構造限制與回復義務","back":"違反者管理負責人應制止，逾1個月未回復原狀，得由管委會代為回復，費用由該住戶負擔","category":"law","chapter":"E2"},{"id":"E203","front":"★高頻：強制遷離/強制拍賣完整流程","back":"{{a|①起因}}：積欠費用達區分所有權總價{{n|1%}}，或受罰鍰後不改善\n　↓ 管理負責人／管委會{{k|促請改善}}\n{{b|②}}{{n|3個月}}內未改善\n　↓ 依區權會決議訴請法院{{k|強制遷離}}\n{{c|③}}若為區分所有權人：訴請法院命其{{k|出讓}}\n　↓ 判決確定後{{n|3個月}}內未完成移轉\n{{d|④}}聲請法院{{k|拍賣}}\n　↓ 受償順序＝與{{k|第一順位抵押權}}同","category":"mnem","chapter":"E2"},{"id":"E204","front":"【申論骨幹】約定專用部分之變更（起造人已成立者亦同）","back":"四段式：定義→法條→涵攝→結論\n\n①{{a|定義}}：約定專用部分＝共用部分經約定供特定區分所有權人使用（§3）\n②{{b|法條}}：§33 特別生效要件——成立之約定專用部分變更，應經使用人同意\n③{{c|涵攝}}：起造人申請建照時成立者，性質仍是依法成立的約定專用 → 區權會{{k|不得逕以決議}}片面變更\n④{{d|結論}}：原則須經{{k|使用人同意}}；例外：顯違公共利益，經管委會或管理負責人{{k|訴請法院判決確定}}→免使用人同意","category":"law","chapter":"E2"},{"id":"E301","front":"★高頻陷阱：區權會決議門檻","back":"{{a|一般決議（§31）}}\n　區權人{{n|2/3}}以上＋區分所有權比例{{n|2/3}}以上{{k|出席}}\n　出席者{{n|3/4}}以上{{k|同意}}\n\n{{b|流會重新召集（§32）}}\n　區權人{{n|3人}}並{{n|1/5}}以上出席\n　出席者{{k|過半數}}同意\n　決議後{{n|7日}}內得提反對意見","category":"trap","chapter":"E3"},{"id":"E302","front":"★陷阱：單一人表決權限制","back":"任一區權人的區分所有權占全部{{n|1/5}}以上：\n　{{a|超過}}部分{{k|不予計算}}\n\n→防止大戶壟斷決議","category":"trap","chapter":"E3"},{"id":"E303","front":"★陷阱：管理委員連任次數限制","back":"{{a|主委／管理負責人／財務、監察委員}}\n　連選得連任{{n|1次}}\n{{b|其餘一般管理委員}}\n　連選得連任，{{k|無次數限制}}","category":"trap","chapter":"E3"},{"id":"E304","front":"管委會的當事人能力","back":"管理委員會有當事人能力，可為原告或被告","category":"def","chapter":"E3"},{"id":"E401","front":"★高頻：非經載明於規約不生效力七項","back":"規約「{{a|沒寫就無效}}」的七項（§23）：\n①{{a|約定專用／約定共用}}的範圍與使用主體\n②共用部分{{b|使用收益}}的特約\n③{{c|禁止飼養動物}}的特約\n④{{d|違反義務}}的處理方式\n⑤{{e|財務運作}}的監督規定\n⑥區權會{{k|出席人數、表決權}}特約\n⑦{{k|糾紛}}協調程序","category":"law","chapter":"E4"},{"id":"E402","front":"規約範本的法律地位","back":"由中央主管機關定之，性質為「參考性」非強制套用\n條例施行前已取得建照者，訂定規約前以規約範本「視為規約」","category":"def","chapter":"E4"},{"id":"E501","front":"★高頻罰鍰級距對照","back":"{{a|第47條}}（召集義務、棄置垃圾等）\n　罰鍰 {{n|3千-1萬5千}}\n{{b|第49條}}（外觀變更、未投保、未繳公共基金等）\n　罰鍰 {{n|4萬-20萬}}\n{{c|第49-1條}}（未成立管委會）\n　每專有部分 {{n|4萬-20萬}}","category":"law","chapter":"E5"},{"id":"E502","front":"★陷阱：刑事責任的特殊限制","back":"僅限「供營業使用事實之住戶」違反第49條第3、4款致人於死或重傷才有刑責\n致死：1年以上7年以下徒刑；致重傷：6個月以上5年以下徒刑","category":"trap","chapter":"E5"},{"id":"E601","front":"起造人移交義務","back":"應於管委會成立或負責人推選後7日內，會同檢測水電機械消防管線後移交","category":"law","chapter":"E6"},{"id":"E602","front":"★陷阱：重建的同意門檻","back":"原則：應經「全體」區權人及基地所有權人/地上權人/典權人同意\n例外（配合都更/嚴重毀損/災變）：不在此限，可依區權會決議重建","category":"trap","chapter":"E6"},{"id":"F101","front":"★高頻計算：公共基金提列比例","back":"依工程造價（公共基金提列比例）：\n{{n|1000萬}}以下 → 千分之{{k|20}}\n逾{{n|1000萬}}至{{n|1億}} → 千分之{{k|15}}\n逾{{n|1億}}至{{n|10億}} → 千分之{{k|5}}\n逾{{n|10億}} → 千分之{{k|3}}","category":"law","chapter":"F1"},{"id":"F102","front":"區分所有權總價的定義","back":"建築物評定標準價格＋當期土地公告現值之和（用於計算1%強制遷離門檻）","category":"def","chapter":"F1"},{"id":"F201","front":"★高頻：規約範本四層級效力分類","back":"規約範本四層級（效力由強到弱）：\n{{a|①沒寫就無效}}　條例§23七項\n{{b|②寫了也無效}}　條例§7不得約定專用\n{{c|③僅得變更}}　須先有規定，如決議額數\n{{d|④可以變更}}　任意性規定，如外牆限制、任期","category":"mnem","chapter":"F2"},{"id":"F202","front":"★陷阱：第1類vs第2類邏輯相反","back":"{{a|非經載明於規約不生效力}}＝{{a|沒寫}}就無效\n{{b|載明於規約亦不生效力}}＝{{b|寫了}}也無效\n\n→兩者邏輯完全相反，極易混淆！","category":"trap","chapter":"F2"},{"id":"G101","front":"★高頻：第21條不實廣告核心要件","back":"事業不得在商品或廣告上，對足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵","category":"def","chapter":"G1"},{"id":"G102","front":"★廣告連帶責任：三種人各負什麼責？","back":"三種人同一句話：「{{k|明知或可得而知}}」仍為之→與廣告主{{k|連帶賠償}}\n\n{{a|廣告代理業}}　{{a|製作、設計}}引人錯誤的廣告\n{{b|廣告媒體業}}　{{b|傳播、刊載}}該廣告\n{{c|廣告薦證者}}　{{c|薦證}}（親身見證、推薦）\n\n▍薦證者的例外：非知名公眾人物／專業人士／機構→只在受廣告主報酬{{n|10倍}}範圍內連帶\n\n口訣：{{m|代理做、媒體播、薦證推}}\n★陷阱：只有{{c|薦證者}}有「10倍」限縮","category":"law","chapter":"G1"},{"id":"G103","front":"公平法損害賠償與罰則金額","back":"故意行為：法院得酌定不超過已證明損害額3倍之賠償\n違反第21條：NT$5萬-2500萬罰鍰；屆期不改正按次處10萬-5000萬","category":"law","chapter":"G1"},{"id":"G201","front":"★極高頻：廣告查核五種分工情形","back":"廣告誰來查？五種情形：\n①經紀業自身廣告→{{a|主管機關}}（管理條例）\n②涉及企業形象、行銷策略→{{b|公平會}}（公平法）\n③加盟未標明加盟字樣→{{a|主管機關}}\n④建商與經紀業{{k|共同具名}}→{{b|公平會}}\n⑤無法劃分→{{c|協調處理}}\n\n口訣：{{a|業自己、加盟}}找主管；{{b|形象、共同具名}}找公平會","category":"mnem","chapter":"G2"},{"id":"G202","front":"★陷阱：建商自行銷售廣告不實的管轄","back":"若非經紀業所為（建商自售），廣告不實非屬管理條例範疇\n應回歸公平交易法處理（呼應分工原則第一款的對照組）","category":"trap","chapter":"G2"},{"id":"G203","front":"不實廣告認定標準七項","back":"七項「不符」：\n①{{a|坐落地點}}不符\n②{{a|面積}}不符登記\n③{{b|格局}}與事實不符\n④{{b|圖說、文字}}不符\n⑤{{c|建材}}不符\n⑥{{c|公設、交通}}表徵不符\n⑦{{d|停車位}}廣告與施工圖不符","category":"law","chapter":"G2"},{"id":"H101","front":"★核心高頻：定型化契約法源（第17條）","back":"中央主管機關得選擇特定行業，擬訂應記載/不得記載事項，報請行政院核定後公告\n→此即三大定型化契約之法律授權來源","category":"def","chapter":"H1"},{"id":"H102","front":"★審閱期：母法30日、公告5日、3日，怎麼分？","back":"{{k|審閱期}}＝簽約前，讓消費者把整份契約看完的天數\n\n▍{{a|母法}}（消保法§11-1）\n　只訂{{a|上限}}：{{n|30日}}以內（不是固定30天）\n\n▍{{b|各行業公告}}（不動產，是{{b|下限}}）\n　{{b|成屋／預售屋買賣契約}}→至少{{n|5日}}\n　{{c|委託銷售契約}}→不得少於{{n|3日}}\n\n▍效果\n　拋棄審閱權的條款→{{a|無效}}\n　未給足審閱期→該條款不構成契約內容，但消費者{{k|得主張}}仍構成\n\n★陷阱：{{b|買賣5日}}、{{c|委託3日}}別對調；30日只是母法上限","category":"trap","chapter":"H1"},{"id":"H103","front":"定型化契約效力三規則","back":"{{a|違反誠信、顯失公平}}的條款 → {{k|無效}}\n{{b|個別磋商}}條款牴觸定型化條款 → 定型化條款{{k|該部分無效}}\n{{c|違反公告}}應記載／不得記載事項 → {{k|無效}}","category":"law","chapter":"H1"},{"id":"H104","front":"★高頻：未記載仍構成契約內容","back":"中央主管機關公告之應記載事項，雖未記載於契約，仍構成契約內容（第17條第5項）","category":"trap","chapter":"H1"},{"id":"H201","front":"★高頻：七日猶豫期","back":"通訊交易或訪問交易消費者得於收受商品或接受服務後7日內解除契約，無須說明理由及負擔費用","category":"law","chapter":"H2"},{"id":"H202","front":"★陷阱：不動產買賣是否適用七日解約權","back":"一般不動產買賣：面對面接洽、實地看屋\n　→原則{{a|非}}通訊交易、訪問交易\n\n{{k|七日解約權（消保法§19）通常不適用}}一般不動產買賣！\n{{b|審閱期}}才是主要保護工具","category":"trap","chapter":"H2"},{"id":"H301","front":"廣告真實義務與媒體連帶責任","back":"企業經營者對消費者所負義務不得低於廣告內容（第22條）\n媒體經營者明知或可得而知不實仍刊登：與企業經營者連帶責任（第23條）","category":"law","chapter":"H3"},{"id":"H302","front":"★高頻：懲罰性賠償金三級倍數","back":"{{a|故意}}：{{n|5倍}}以下\n{{b|重大過失}}：{{n|3倍}}以下\n{{c|過失}}：{{n|1倍}}以下\n\n口訣：{{m|故5、重3、過1}}","category":"mnem","chapter":"H3"},{"id":"H303","front":"消保法罰則金額","back":"違反應記載／不得記載事項，限期改正屆期不改：\n　罰鍰 {{n|3萬-30萬}}\n再次限期仍不改正：\n　罰鍰 {{n|5萬-50萬}}，得{{k|按次}}處罰","category":"law","chapter":"H3"}];
const GROUPS = {"A": ["A1", "A2", "A3", "A4", "A5"], "B": ["B1"], "C": ["C1", "C2", "C3", "C4", "C5"], "D": ["D1", "D2", "D3", "D4"], "E": ["E1", "E2", "E3", "E4", "E5", "E6"], "F": ["F1", "F2"], "G": ["G1", "G2"], "H": ["H1", "H2", "H3"]};
const GROUP_TITLES = {"A": "A篇　經紀業管理條例", "B": "B篇　施行細則", "C": "C篇　不動產說明書", "D": "D篇　三大定型化契約", "E": "E篇　公寓大廈管理條例", "F": "F篇　施行細則與規約範本", "G": "G篇　公平交易法", "H": "H篇　消費者保護法"};
const CAT_LABELS = {def:'定義原則', law:'法條要件', confuse:'易混淆比較', mnem:'口訣速記', trap:'高頻陷阱'};

let selectedGroups = new Set(Object.keys(GROUPS));
let order = 'order';
let pool = [];
let current = 0;
let flipped = false;
let mastery = {};

async function loadMastery() {
  try {
    const r = await window.storage.get('jingji_flashcard_mastery');
    if (r && r.value) mastery = JSON.parse(r.value);
  } catch(e) { mastery = {}; }
  renderSetup();
}
async function saveMastery() {
  try { await window.storage.set('jingji_flashcard_mastery', JSON.stringify(mastery)); } catch(e) {}
}

function chapterToGroup(chapter) {
  const letter = chapter[0];
  return letter;
}

function renderSetup() {
  const total = ALL_CARDS.length;
  const masteredCount = Object.values(mastery).filter(m => m === 'yes').length;
  const weakCount = Object.values(mastery).filter(m => m === 'no').length;
  document.getElementById('overallStats').innerHTML = `
    <div class="stat-chip">總卡數 <b>${total}</b></div>
    <div class="stat-chip">已掌握 <b>${masteredCount}</b></div>
    <div class="stat-chip">待加強 <b>${weakCount}</b></div>
  `;

  const chipDiv = document.getElementById('groupChips');
  chipDiv.innerHTML = '';
  Object.keys(GROUPS).forEach(g => {
    const cnt = ALL_CARDS.filter(c => chapterToGroup(c.chapter) === g).length;
    const chip = document.createElement('div');
    chip.className = 'group-chip' + (selectedGroups.has(g) ? ' active' : '');
    chip.textContent = `${GROUP_TITLES[g]} (${cnt})`;
    chip.onclick = () => {
      if (selectedGroups.has(g)) selectedGroups.delete(g);
      else selectedGroups.add(g);
      renderSetup();
    };
    chipDiv.appendChild(chip);
  });
}

document.getElementById('selectAllBtn').onclick = () => { selectedGroups = new Set(Object.keys(GROUPS)); renderSetup(); };
document.getElementById('selectNoneBtn').onclick = () => { selectedGroups = new Set(); renderSetup(); };
document.getElementById('selectWeakBtn').onclick = () => {
  const weakIds = new Set(Object.keys(mastery).filter(k => mastery[k] === 'no'));
  pool = ALL_CARDS.filter(c => weakIds.has(c.id));
  if (pool.length === 0) { alert('目前沒有標記「不熟」的卡片！'); return; }
  startStudy(pool);
};

document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    order = chip.dataset.mode;
  };
});

document.getElementById('startBtn').onclick = () => {
  let filtered = ALL_CARDS.filter(c => selectedGroups.has(chapterToGroup(c.chapter)));
  if (filtered.length === 0) { alert('請至少選擇一個篇章'); return; }
  if (order === 'random') filtered = [...filtered].sort(() => Math.random() - 0.5);
  startStudy(filtered);
};

function startStudy(list) {
  pool = list;
  current = 0;
  flipped = false;
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('studyArea').style.display = 'block';
  renderCard();
}

function fmt(t){
  let h=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\{\{([kabcdemn])\|([^}]*?)\}\}/g,(m,c,x)=>'<span class="hl hl-'+c+'">'+x+'</span>');
  return h.split(/(<span class="hl[^>]*>.*?<\/span>)/).map((p,i)=>i%2?p:p.replace(/(\d+(?:[-~]\d+)?(?:日|個月|月|年|小時|倍|%|％|萬|億|期|次|張)(?:以[上下內])?)/g,'<span class="hl hl-n">$1</span>')).join('');
}
function renderCard() {
  const c = pool[current];
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('progressFill').style.width = `${(current/pool.length)*100}%`;
  document.getElementById('cardPosition').textContent = `第 ${current+1} / ${pool.length} 張`;
  document.getElementById('cardChapterLabel').textContent = c.chapter;

  document.getElementById('frontCatTag').textContent = CAT_LABELS[c.category];
  document.getElementById('backCatTag').textContent = CAT_LABELS[c.category];
  document.getElementById('cardFrontText').innerHTML = fmt(c.front);
  document.getElementById('cardBackText').innerHTML = fmt(c.back);

  const cardEl = document.getElementById('flashcard');
  cardEl.className = 'flashcard cat-' + c.category;

  document.getElementById('prevBtn').disabled = current === 0;
}

document.getElementById('flashcard').onclick = () => {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
};

document.querySelectorAll('.mastery-btn').forEach(btn => {
  btn.onclick = async (e) => {
    e.stopPropagation();
    const c = pool[current];
    mastery[c.id] = btn.dataset.level;
    await saveMastery();
    if (current < pool.length - 1) {
      current++;
      renderCard();
    } else {
      alert('本輪卡片已全部複習完成！');
      backToSetup();
    }
  };
});

document.getElementById('prevBtn').onclick = () => {
  if (current > 0) { current--; renderCard(); }
};
function backToSetup() {
  document.getElementById('studyArea').style.display = 'none';
  document.getElementById('setupArea').style.display = 'block';
  renderSetup();
}
document.getElementById('backToSetupBtn').onclick = backToSetup;

loadMastery();
</script>
