<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規概要｜互動單字卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F8F3E9;
  --paper-dark: #EFE7D6;
  --ink: #2A2722;
  --vermillion: #A8402B;
  --gold: #BC8A2E;
  --green: #4C6B43;
  --blue: #3A5A78;
  --orange: #C07830;
  --purple: #6B4C8A;
  --line: #D9CFB8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans TC', sans-serif;
  line-height: 1.7;
}
.app { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: 1.4rem;
  text-align: center;
  margin: 10px 0 2px;
}
.subtitle { text-align: center; font-size: .78rem; color: #6b6354; margin-bottom: 16px; }

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(42,39,34,.05);
}
.stats-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.stat-chip {
  background: var(--paper-dark);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 11px;
  font-size: .74rem;
  font-weight: 600;
}
.stat-chip b { color: var(--vermillion); }

.section-label {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  font-size: .92rem;
  margin-bottom: 8px;
  border-left: 4px solid var(--vermillion);
  padding-left: 8px;
}
.chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.group-chip {
  border: 1px solid var(--line);
  background: var(--paper-dark);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: .78rem;
  cursor: pointer;
  font-weight: 700;
}
.group-chip.active { background: var(--vermillion); color: #fff; border-color: var(--vermillion); }
.btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
button {
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: .86rem;
  cursor: pointer;
}
button:active { transform: scale(.97); }
.btn-primary { background: var(--vermillion); color: #fff; flex: 1; min-width: 130px; }
.btn-secondary { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); }
.btn-mini { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: .74rem; }
.mode-chip { border: 1px solid var(--line); background: var(--paper-dark); border-radius: 16px; padding: 6px 14px; font-size: .8rem; cursor: pointer; font-weight: 700; }
.mode-chip.active { background: var(--gold); color: #fff; border-color: var(--gold); }

#studyArea { display: none; }
.progress-bar-wrap { background: var(--paper-dark); border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 10px; }
.progress-bar-fill { background: var(--gold); height: 100%; transition: width .25s; }
.card-meta { display: flex; justify-content: space-between; font-size: .74rem; color: #807660; margin-bottom: 8px; font-weight: 600; }

.flashcard-wrap { perspective: 1200px; margin-bottom: 16px; }
.flashcard {
  position: relative;
  min-height: 220px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .5s;
  transform-style: preserve-3d;
}
.flashcard.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  padding: 22px;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(42,39,34,.08);
}
.card-front {
  background: #fff;
  border: 2px solid var(--line);
}
.card-back {
  transform: rotateY(180deg);
  color: #fff;
}
.cat-def .card-back { background: linear-gradient(135deg, var(--green), #3a5234); }
.cat-law .card-back { background: linear-gradient(135deg, var(--blue), #2a4258); }
.cat-confuse .card-back { background: linear-gradient(135deg, var(--orange), #9a5f1f); }
.cat-mnem .card-back { background: linear-gradient(135deg, var(--purple), #4f3868); }
.cat-trap .card-back { background: linear-gradient(135deg, var(--vermillion), #7a2c1c); }

.cat-tag {
  position: absolute;
  top: 12px;
  left: 14px;
  font-size: .65rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 10px;
  background: var(--paper-dark);
  color: var(--ink);
}
.card-back .cat-tag { background: rgba(255,255,255,.22); color: #fff; }
.card-front-text {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.15rem;
  font-weight: 700;
  text-align: center;
  margin-top: 10px;
  white-space: pre-wrap;
}
.card-back-text {
  font-size: .95rem;
  white-space: pre-wrap;
  margin-top: 10px;
  font-weight: 500;
}
.flip-hint {
  text-align: center;
  font-size: .7rem;
  color: #9a917a;
  margin-top: 6px;
}
.card-back .flip-hint { color: rgba(255,255,255,.6); }

.mastery-row { display: flex; gap: 8px; margin-top: 4px; }
.mastery-btn {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  border: none;
  font-weight: 700;
  font-size: .85rem;
  cursor: pointer;
}
.mastery-no { background: #FBEAE6; color: var(--vermillion); }
.mastery-soso { background: #FCF1DB; color: var(--orange); }
.mastery-yes { background: #EAF1E6; color: var(--green); }

.nav-row { display: flex; gap: 8px; margin-top: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: .68rem; margin-top: 10px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.footer-note { text-align: center; font-size: .68rem; color: #9a917a; margin-top: 22px; }
</style>
</head>
<body>
<div class="app">
  <h1>經紀法規概要｜互動單字卡</h1>
  <div class="subtitle">89張卡・A-H八篇完整涵蓋・翻牌學習＋掌握度追蹤</div>

  <div id="setupArea">
    <div class="panel">
      <div class="stats-row" id="overallStats"></div>
      <div class="section-label">選擇篇章（可複選，預設全選）</div>
      <div class="chip-grid" id="groupChips"></div>
      <div class="btn-row">
        <button class="btn-mini" id="selectAllBtn">全選</button>
        <button class="btn-mini" id="selectNoneBtn">全不選</button>
        <button class="btn-mini" id="selectWeakBtn">只練不熟的卡</button>
      </div>
    </div>
    <div class="panel">
      <div class="section-label">卡片順序</div>
      <div class="chip-grid">
        <div class="mode-chip active" data-mode="order">依篇章順序</div>
        <div class="mode-chip" data-mode="random">隨機亂序</div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="startBtn">開始學習</button>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:#4C6B43"></i>定義原則</span>
        <span><i class="dot" style="background:#3A5A78"></i>法條要件</span>
        <span><i class="dot" style="background:#C07830"></i>易混淆比較</span>
        <span><i class="dot" style="background:#6B4C8A"></i>口訣速記</span>
        <span><i class="dot" style="background:#A8402B"></i>高頻陷阱</span>
      </div>
    </div>
  </div>

  <div id="studyArea">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="card-meta">
      <span id="cardPosition"></span>
      <span id="cardChapterLabel"></span>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front" id="cardFrontFace">
          <div class="cat-tag" id="frontCatTag"></div>
          <div class="card-front-text" id="cardFrontText"></div>
          <div class="flip-hint">點擊卡片查看解析</div>
        </div>
        <div class="card-face card-back" id="cardBackFace">
          <div class="cat-tag" id="backCatTag"></div>
          <div class="card-back-text" id="cardBackText"></div>
          <div class="flip-hint">點擊卡片返回正面</div>
        </div>
      </div>
    </div>
    <div class="mastery-row">
      <button class="mastery-btn mastery-no" data-level="no">😵 不熟</button>
      <button class="mastery-btn mastery-soso" data-level="soso">🤔 普通</button>
      <button class="mastery-btn mastery-yes" data-level="yes">😎 掌握</button>
    </div>
    <div class="nav-row">
      <button class="btn-secondary" id="prevBtn">上一張</button>
      <button class="btn-secondary" id="backToSetupBtn">結束學習</button>
    </div>
  </div>

  <div class="footer-note">BrokerX 備考 Project・依《經紀法規概要_重點筆記》A-H八篇28子章節整理</div>
</div>

<script>
const ALL_CARDS = [{"id": "A101", "front": "主管機關層級", "back": "中央：內政部\n直轄市：地政處\n縣市：縣市政府", "category": "def", "chapter": "A1"}, {"id": "A102", "front": "「不動產」的法定定義", "back": "土地、土地定著物或房屋及其可移轉之權利", "category": "def", "chapter": "A1"}, {"id": "A103", "front": "「成屋」vs「預售屋」", "back": "成屋：領有使用執照，或實施建管前建造完成之建築物\n預售屋：領有建造執照尚未建造完成，以將來完成之建築物為交易標的", "category": "confuse", "chapter": "A1"}, {"id": "A104", "front": "「仲介業務」vs「代銷業務」", "back": "仲介業務：從事買賣互易租賃之居間或代理\n代銷業務：受起造人或建築業委託，企劃並代理銷售不動產", "category": "confuse", "chapter": "A1"}, {"id": "A105", "front": "「經紀人」vs「經紀營業員」", "back": "經紀人：執行仲介或代銷業務\n經紀營業員：協助經紀人執行業務（不可單獨執行）", "category": "confuse", "chapter": "A1"}, {"id": "A106", "front": "★陷阱：「差價」的定義", "back": "實際買賣交易價格與「委託銷售價格」之差額\n（不是與市場行情價的差額！）", "category": "trap", "chapter": "A1"}, {"id": "A201", "front": "經紀業設立四步驟", "back": "①申請許可→②辦理公司或商業登記→③加入登記所在地同業公會→④6個月內開始營業", "category": "law", "chapter": "A2"}, {"id": "A202", "front": "開業期限與展延", "back": "應於許可後6個月內開始營業；逾期未開業主管機關廢止許可；有正當理由得申請展延一次，以3個月為限", "category": "law", "chapter": "A2"}, {"id": "A203", "front": "★陷阱：經營國外不動產業務的組織型態", "back": "經營國外不動產仲介或代銷業務者，應以「公司」型態組織辦理登記，商號不可！", "category": "trap", "chapter": "A2"}, {"id": "A204", "front": "不得申請經營經紀業之事由（時間數字版）", "back": "詐欺背信侵占罪：徒刑1年以上，執行完畢/赦免後未滿3年\n受感訓處分：執行完畢後未滿3年\n撤銷或廢止許可：未滿5年\n廢止經紀人員證書：未滿5年", "category": "law", "chapter": "A2"}, {"id": "A205", "front": "營業保證金管理", "back": "由「全國聯合會」統一設置營業保證基金專戶管理\n基金管理委員會中經紀業代表人數不得超過委員總數5分之2", "category": "def", "chapter": "A2"}, {"id": "A206", "front": "營業保證金退還條件", "back": "公司解散/商號歇業/組織存續但已無仲介代銷業務\n可自核准註銷營業滿1年後2年內請求退還（孳息不退還）", "category": "law", "chapter": "A2"}, {"id": "A207", "front": "★高頻數字：經紀人配置門檻", "back": "一般營業處所：至少置經紀人1人\n非常態營業處所銷售額達6億元以上：至少專業經紀人1人\n經紀營業員每逾20名：應增設經紀人1人", "category": "trap", "chapter": "A2"}, {"id": "A301", "front": "★陷阱：經紀人證書請領條件", "back": "考試及格≠可以請證！\n須「具備1年以上經紀營業員經驗」才能向直轄市/縣市政府請領經紀人證書", "category": "trap", "chapter": "A3"}, {"id": "A302", "front": "經紀人證書效期與換證", "back": "證書有效期限4年\n期滿需檢附4年內完成30小時以上專業訓練證明辦理換證", "category": "law", "chapter": "A3"}, {"id": "A303", "front": "經紀營業員訓練與登錄", "back": "初次訓練不得少於30小時，證明有效期限4年\n期滿需完成20小時以上訓練重新登錄", "category": "law", "chapter": "A3"}, {"id": "A304", "front": "★高頻易混淆：訓練時數比較", "back": "經紀人換證：30小時以上\n經紀營業員重新登錄：20小時以上\n→兩者證書效期皆為4年", "category": "confuse", "chapter": "A3"}, {"id": "A305", "front": "★陷阱：經紀人員可以兼職嗎？", "back": "原則應專任一經紀業，不得為自己或他經紀業執行業務\n但「經所屬經紀業同意」為他經紀業執行業務者，不在此限\n→並非絕對禁止兼職！", "category": "trap", "chapter": "A3"}, {"id": "A306", "front": "經紀人員保密義務", "back": "對因業務知悉或持有之他人秘密，不得無故洩漏（第25條）", "category": "def", "chapter": "A3"}, {"id": "A401", "front": "廣告與銷售三前提", "back": "①須先與委託人簽訂委託契約書，方得刊登廣告及銷售\n②廣告銷售內容應與事實相符並註明經紀業名稱\n③不符者負損害賠償責任", "category": "law", "chapter": "A4"}, {"id": "A402", "front": "★高頻：應由經紀人簽章之六類文件", "back": "①委託契約書②要約書③定金收據④廣告稿⑤不動產說明書⑥租賃買賣契約書", "category": "law", "chapter": "A4"}, {"id": "A403", "front": "★高頻陷阱：代銷業務的例外", "back": "第1、2款（委託契約書、要約書）於經營「代銷業務」者不適用！\n因代銷業是建商委託，相對人是社會大眾買方，無「委託契約書」概念", "category": "trap", "chapter": "A4"}, {"id": "A404", "front": "★極高頻：不動產說明書解說流程口訣", "back": "製作→委託人先簽章確認→經紀人向相對人解說→締約時交付相對人並簽章→視為契約之一部分", "category": "mnem", "chapter": "A4"}, {"id": "A405", "front": "★高頻陷阱：說明書≠現況確認書", "back": "不動產說明書：條例22-24條，經紀人製作，需委託人與相對人簽章，視為契約一部分\n建物現況確認書：成屋契約附件一，賣方自填，不能替代說明書內容", "category": "trap", "chapter": "A4"}, {"id": "A406", "front": "雙方代理六項義務", "back": "①公平提供雙方類似不動產交易價格②公平提供契約內容說明③提供必要資訊④告知應查知瑕疵⑤協助必要檢查⑥其他中央主管機關規定", "category": "law", "chapter": "A4"}, {"id": "A407", "front": "★高頻：申報登錄期限", "back": "仲介（租賃案件）：簽約起30日內申報登錄\n代銷（委託代銷契約）：簽訂變更終止起30日內報請備查\n代銷（買賣契約）：簽約起30日內申報登錄", "category": "law", "chapter": "A4"}, {"id": "A408", "front": "損害賠償責任歸屬", "back": "可歸責經紀業未能履行委託契約：經紀業負責\n經紀人員執行業務故意過失致損害：經紀業與經紀人員「連帶」賠償", "category": "def", "chapter": "A4"}, {"id": "A409", "front": "★高頻：報酬限制與違反處理", "back": "不得收取差價或其他報酬，應依實際成交價金按主管機關報酬標準計收\n違反者：已收取部分應「加計利息後加倍返還」支付人", "category": "trap", "chapter": "A4"}, {"id": "A501", "front": "★高頻金額：經紀業最常見罰鍰級距", "back": "第7Ⅵ/11/17/19Ⅰ/21/22Ⅰ等條文：NT$6萬以上30萬以下", "category": "law", "chapter": "A5"},  "trap", "chapter": "D1"}, {"id": "D104", "front": "成屋契約不得記載：利率上限", "back": "不得記載超過民法第205條週年16%利率之利息", "category": "law", "chapter": "D1"}, {"id": "D201", "front": "預售屋履約擔保五選一", "back": "不動產開發信託／價金返還之保證／價金信託／同業連帶擔保／公會辦理連帶保證協定", "category": "def", "chapter": "D2"}, {"id": "D202", "front": "★陷阱：面積誤差找補規則", "back": "不足部分：賣方應「全部找補」\n超過部分：買方最多找補2%為限\n誤差超過3%：買方得解除契約", "category": "trap", "chapter": "D2"}, {"id": "D203", "front": "預售屋保固期限", "back": "結構部分（基礎/樑柱/承重牆/樓地板/屋頂/樓梯/擋土牆）：保固15年\n固定建材設備（門窗/粉刷/地磚）：保固1年", "category": "law", "chapter": "D2"}, {"id": "D204", "front": "★陷阱：預售屋違約罰則方向相反", "back": "賣方違約：賠償總價款百分比「不得低於15%」（但不超過已繳價款）\n買方違約：沒收金額「最高不得超過15%」\n→與成屋「不超過15%」邏輯相反！", "category": "trap", "chapter": "D2"}, {"id": "D301", "front": "委託銷售契約審閱期", "back": "不得少於3日（注意：與成屋/預售屋「至少5日」不同！）", "category": "trap", "chapter": "D3"}, {"id": "D302", "front": "受託人（仲介業者）六大義務", "back": "①善良管理人注意義務②簽約前提供近3個月成交行情③市調廣告費用自行負擔④說明書指派經紀人簽章⑤要約書24小時內轉交⑥定金24小時內送交", "category": "law", "chapter": "D3"}, {"id": "D303", "front": "★高頻陷阱：委託銷售契約禁止收取斡旋金", "back": "不得約定在契約成立前，受託人得向消費者收取斡旋金、訂金或其他任何名目之費用\n→實務常見但定型化契約明文禁止事先收取！", "category": "trap", "chapter": "D3"}, {"id": "D304", "front": "要約書關鍵規則", "back": "審閱期不得少於3日\n買方撤回權：要約期限內可撤回，但賣方已承諾並送達買方者不可\n賣方變更要約內容而承諾＝視為拒絕原要約而為新要約", "category": "def", "chapter": "D3"}, {"id": "D401", "front": "★必背：三契約審閱期比較", "back": "成屋買賣：至少5日\n預售屋買賣：至少5日\n委託銷售/要約書：不得少於3日", "category": "confuse", "chapter": "D4"}, {"id": "D402", "front": "★必背：違約金比例方向相反", "back": "成屋買賣違約金：不超過15%\n預售屋買賣違約金：不得低於15%\n→方向完全相反，極易混淆！", "category": "trap", "chapter": "D4"}, {"id": "E101", "front": "公寓大廈四種部分定義", "back": "專有部分／共用部分／約定專用部分／約定共用部分", "category": "def", "chapter": "E1"}, {"id": "E102", "front": "住戶 vs 管理委員會 vs 管理負責人", "back": "住戶：區權人/承租人/經同意使用人/取得停車空間所有權者\n管理委員會：執行區權會決議的組織\n管理負責人：未成立管委會時推選之住戶1人", "category": "confuse", "chapter": "E1"}, {"id": "E103", "front": "「規約」的定義", "back": "區分所有權人為增進共同利益確保良好生活環境，經區權會決議之共同遵守事項", "category": "def", "chapter": "E1"}, {"id": "E201", "front": "★高頻：不得約定專用之共用部分五項", "   try {
    const r = await window.storage.get('jingji_flashcard_mastery');
    if (r && r.value) mastery = JSON.parse(r.value);
  } catch(e) { mastery = {}; }
  renderSetup();
}
async function saveMastery() {
  try { await window.storage.set('jingji_flashcard_mastery', JSON.stringify(mastery)); } catch(e) {}
}

function chapterToGroup(chapter) {
  const letter = chapter[0];
  return letter;
}

function renderSetup() {
  const total = ALL_CARDS.length;
  const masteredCount = Object.values(mastery).filter(m => m === 'yes').length;
  const weakCount = Object.values(mastery).filter(m => m === 'no').length;
  document.getElementById('overallStats').innerHTML = `
    <div class="stat-chip">總卡數 <b>${total}</b></div>
    <div class="stat-chip">已掌握 <b>${masteredCount}</b></div>
    <div class="stat-chip">待加強 <b>${weakCount}</b></div>
  `;

  const chipDiv = document.getElementById('groupChips');
  chipDiv.innerHTML = '';
  Object.keys(GROUPS).forEach(g => {
    const cnt = ALL_CARDS.filter(c => chapterToGroup(c.chapter) === g).length;
    const chip = document.createElement('div');
    chip.className = 'group-chip' + (selectedGroups.has(g) ? ' active' : '');
    chip.textContent = `${GROUP_TITLES[g]} (${cnt})`;
    chip.onclick = () => {
      if (selectedGroups.has(g)) selectedGroups.delete(g);
      else selectedGroups.add(g);
      renderSetup();
    };
    chipDiv.appendChild(chip);
  });
}

document.getElementById('selectAllBtn').onclick = () => { selectedGroups = new Set(Object.keys(GROUPS)); renderSetup(); };
document.getElementById('selectNoneBtn').onclick = () => { selectedGroups = new Set(); renderSetup(); };
document.getElementById('selectWeakBtn').onclick = () => {
  const weakIds = new Set(Object.keys(mastery).filter(k => mastery[k] === 'no'));
  pool = ALL_CARDS.filter(c => weakIds.has(c.id));
  if (pool.length === 0) { alert('目前沒有標記「不熟」的卡片！'); return; }
  startStudy(pool);
};

document.querySelectorAll('.mode-chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    order = chip.dataset.mode;
  };
});

document.getElementById('startBtn').onclick = () => {
  let filtered = ALL_CARDS.filter(c => selectedGroups.has(chapterToGroup(c.chapter)));
  if (filtered.length === 0) { alert('請至少選擇一個篇章'); return; }
  if (order === 'random') filtered = [...filtered].sort(() => Math.random() - 0.5);
  startStudy(filtered);
};

function startStudy(list) {
  pool = list;
  current = 0;
  flipped = false;
  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('studyArea').style.display = 'block';
  renderCard();
}

function renderCard() {
  const c = pool[current];
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('progressFill').style.width = `${(current/pool.length)*100}%`;
  document.getElementById('cardPosition').textContent = `第 ${current+1} / ${pool.length} 張`;
  document.getElementById('cardChapterLabel').textContent = c.chapter;

  document.getElementById('frontCatTag').textContent = CAT_LABELS[c.category];
  document.getElementById('backCatTag').textContent = CAT_LABELS[c.category];
  document.getElementById('cardFrontText').textContent = c.front;
  document.getElementById('cardBackText').textContent = c.back;

  const cardEl = document.getElementById('flashcard');
  cardEl.className = 'flashcard cat-' + c.category;

  document.getElementById('prevBtn').disabled = current === 0;
}

document.getElementById('flashcard').onclick = () => {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
};

document.querySelectorAll('.mastery-btn').forEach(btn => {
  btn.onclick = async (e) => {
    e.stopPropagation();
    const c = pool[current];
    mastery[c.id] = btn.dataset.level;
    await saveMastery();
    if (current < pool.length - 1) {
      current++;
      renderCard();
    } else {
      alert('本輪卡片已全部複習完成！');
      backToSetup();
    }
  };
});

document.getElementById('prevBtn').onclick = () => {
  if (current > 0) { current--; renderCard(); }
};
function backToSetup() {
  document.getElementById('studyArea').style.display = 'none';
  document.getElementById('setupArea').style.display = 'block';
  renderSetup();
}
document.getElementById('backToSetupBtn').onclick = backToSetup;

loadMastery();
</script>
</body>
</html>
