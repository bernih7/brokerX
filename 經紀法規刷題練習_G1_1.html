<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65;padding-bottom:84px}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg);}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;margin:0;color:var(--pri);flex:1;min-width:0}
.th{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;flex:none}
.sub{font-size:.76rem;color:var(--sub);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.76rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--sub)}
.stat b{color:var(--pri)}
.controls{max-width:760px;margin:12px auto 0;padding:0 16px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:.82rem;cursor:pointer;font-family:inherit}
.fbtn.active{background:var(--pri);color:var(--on);border-color:var(--pri)}
.fbtn.danger{border-color:var(--bad);color:var(--bad)}
.fbtn.danger.active{background:var(--bad);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);padding:4px 11px;border-radius:14px;font-size:.75rem;cursor:pointer}
.chip.active{background:var(--pri-soft);color:var(--pri);border-color:var(--pri);font-weight:700}
.ords,.exs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:6px 0}
.ords button,.exs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:.78rem;cursor:pointer}
.ords button.on,.exs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.ords .sh{margin-left:auto}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}
main{max-width:760px;margin:0 auto;padding:6px 16px 40px}
.yr-header,.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.92rem;color:var(--pri);padding:10px 0 6px;border-bottom:2px solid var(--pri);margin:16px 0 10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.qcard.answered-ok{border-left:4px solid var(--ok)}
.qcard.answered-ng{border-left:4px solid var(--bad)}
.qmeta{font-size:.72rem;color:var(--sub);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.wrong{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.stem{font-family:"Noto Serif TC",serif;font-size:.98rem;font-weight:500;margin:4px 0 10px;line-height:1.75}
.res{display:none}
.done .res{display:block;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.86rem;margin:0 0 8px;background:var(--bad-soft);color:var(--bad)}
.done .res.ok{background:var(--ok-soft);color:var(--ok)}
.hn{display:none;font-size:.72rem;color:var(--sub);margin:-4px 0 8px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.55}
.opt:hover{border-color:var(--pri)}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.76rem}
.ob{flex:1;min-width:0}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.disabled{cursor:default}
.bg{display:none;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.opt.correct .bg.a{display:inline-block;background:var(--ok)}
.opt.chosen-wrong .bg.p{display:inline-block;background:var(--bad)}
.nt{display:none;font-size:.8rem;line-height:1.6;margin-top:5px;border-top:1px dashed var(--line);padding-top:4px;color:var(--ink);font-weight:400}
.arr{display:none;float:right;margin-left:6px;color:var(--sub);transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.explain-box{display:none;margin-top:10px;padding:10px 12px;background:var(--pri-soft);border:1px solid var(--line);border-radius:8px;font-size:.82rem}
body[data-ex="B"] .done .explain-box{display:block}
.ei{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.6}
.ei:last-child{border-bottom:none}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;color:#fff}
.el.ok{background:var(--ok)}.el.no{background:var(--sub)}.el.ng{background:var(--bad)}
.ref{margin-top:8px;font-size:.76rem;color:var(--sub)}
.errtag-row{margin-top:10px;display:none;gap:6px;flex-wrap:wrap}
.errtag-row.show{display:flex}
.etag{font-size:.72rem;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--sub)}
.etag.on-A{background:var(--bad);color:#fff;border-color:var(--bad)}
.etag.on-B{background:var(--acc);color:#fff;border-color:var(--acc)}
.etag.on-C{background:var(--pri);color:var(--on);border-color:var(--pri)}
footer{text-align:center;font-size:.7rem;color:var(--sub);padding:20px 10px 10px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<script>
const QUESTIONS = [{"year": 99, "qnum": 8, "stem": "下列何者不屬於聯合行為？", "options": ["事業以契約與有競爭關係之他事業共同決定商品或服務之價格", "事業以協議限制數量、技術、產品、設備、交易對象、交易地區等", "事業以直接或間接控制他事業之業務經營", "事業以其他方式之合意相互約束事業活動之行為"], "answer": "B", "explains": {"A": "以契約與有競爭關係之他事業共同決定價格，屬聯合行為之典型態樣，非本題答案。", "B": "本題官方答案為B（已與考選部公告核對）。⚠️ 但「協議限制數量、技術、產品、設備、交易對象、交易地區」本身就是聯合行為的典型態樣，依條文邏輯這句話屬聯合行為，與題目「何者不屬於」互相矛盾。我無法判斷官方給B的理由；作答時依官方答案B，但觀念上要記：這些限制行為是聯合行為。", "C": "「直接或間接控制他事業之業務經營或人事任免」是結合的態樣（結合申報規定），不是聯合行為，依條文邏輯 C 才是「不屬於聯合行為」。⚠️ 官方公布答案為B，與此衝突。", "D": "以其他方式合意相互約束事業活動，屬聯合行為之概括態樣，非本題答案。"}, "ref": "公平交易法第14條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 1, "chapter": "G1"}, {"year": 99, "qnum": 9, "stem": "下列甲與乙兩事業結合時，那種情況無須向中央主管機關申請許可？", "options": ["甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且其市場占有率各為5%與26%", "甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且市場占有率各為15%與17%", "甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且市場占有率各為20%與20%", "甲與乙兩事業之上一會計年度銷售金額皆達中央主管機關所公告金額，且市場占有率各為14%與16%"], "answer": "A", "explains": {"A": "本題官方答案為A（已與考選部公告核對）。⚠️ 但依結合申報的標準（參與結合之一事業市占率達1/4、結合後市占率達1/3、或銷售金額超過公告金額），乙市占率26%已達1/4，依條文邏輯應申報，與官方答案衝突；我無法判斷官方給A的理由。考試依官方答案A，觀念上要記：任一參與事業市占率達1/4就要申報。", "B": "雙方市占率15%、17%，各自未達1/4，合計32%也未達1/3，銷售金額又未達公告金額，依條文邏輯這才是「無須申報」的情形。⚠️ 官方公布答案為A，與此衝突。", "C": "雙方市占率各20%，結合後40%已超過1/3門檻，應申報，不選。", "D": "銷售金額已達公告金額，應申報，不選。"}, "ref": "公平交易法第11條（已依lawplayer/考選部官方答案核實：答案為A）", "id": 2, "chapter": "G1"}, {"year": 99, "qnum": 10, "stem": "公平交易法規定事業不得為聯合行為，但有益於整體經濟與公共利益，並經中央主管機關許可者，可不受此一限制。下列何者不為前述得不受限制之情形：", "options": ["為降低成本、改良品質或增進效率，但不統一商品規格或型式者", "為促進事業合理經營，而分別做專業發展者", "為加強貿易效能，而就國外商品之輸入採取共同行為者", "為確保或促進輸出，而專就國外市場之競爭予以約定者"], "answer": "A", "explains": {"A": "正確答案。法定得申請許可之情形應為「統一商品規格或型式」以降低成本改良品質增進效率，本選項稱「不統一商品規格或型式」，恰與法定要件相反（統一規格才是允許之聯合行為態樣），此為方向相反之陷阱。", "B": "為促進事業合理經營分別作專業發展，屬法定得申請許可情形，非本題答案。", "C": "為加強貿易效能就國外商品輸入採共同行為，屬法定得申請許可情形，非本題答案。", "D": "為確保或促進輸出就國外市場競爭予以約定，屬法定得申請許可情形，非本題答案。"}, "ref": "公平交易法第15條（列舉聯合行為許可事由）、第16條（許可期限，現行為5年，已依law.moj.gov.tw核實）", "id": 3, "chapter": "G1"}, {"year": 99, "qnum": 11, "stem": "下列之說明，何者為正確？", "options": ["公平交易委員會依公平交易法為調查時，得通知有關機關或個人提出帳冊等證物", "未經認許之外國法人或團體，就公平交易法規定事項不得為告訴、自訴或提起民事訴訟", "多層次傳銷事業，係指就多層次傳銷訂定授權計畫或組織，統籌規劃傳銷行為之事業", "當事人或關係人於公平交易委員會調查程序進行中，得申請抄閱有關行政決定前之擬稿"], "answer": "D", "explains": {"A": "本選項寫「有關機關或個人」，與條文用語不符，非本題答案。★現行第27條第1項第2款逐字是「通知『當事人及關係人」提出帳冊、文件及其他必要之資料或證物」——三款的對象都是「當事人及關係人」。出題年（99年）條文用語為「有關機關、團體、事業或個人」，本選項漏列團體、事業；兩個版本都跟本選項不同。背誦以現行的「當事人及關係人」為準。", "B": "錯在方向。公平法§47 逐字：未經認許之外國法人或團體，就本法規定事項「得」為告訴、自訴或提起民事訴訟。但以依條約或其本國法令、慣例，中華民國人或團體得在該國享受同等權利者為限。條文寫的是「得」（互惠原則），本選項寫「不得」，方向相反。", "C": "多層次傳銷事業是指就多層次傳銷訂定「營業計畫」或組織，統籌規劃傳銷行為的事業；本選項寫成「授權計畫」，用語錯誤。「附帶一提：這個定義當年在公平交易法裡，103.1.29 已移到《多層次傳銷管理法》，公平法 104.2.4 全文修正時刪除，現在不會再考多層次傳銷。」", "D": "官方答案為 D，但「依現行法這句話是錯的」，要分清楚：行政程序法§46Ⅱ① 明定行政決定前之「擬稿」或其他準備作業文件得拒絕閱覽；公平法 100 年版的§27-1 也把擬稿列在不得申請閱覽的五款例外裡，而該條在 104 年全文修正後已不存在。「本題實際是靠刪去法」：A 漏列「團體、事業」、B 方向相反、C 把「營業計畫」寫成「授權計畫」，三個都明確錯，只剩 D。作答選 D，但絕對不要把「擬稿可抄閱」背成通則。"}, "ref": "公平交易法第27條（調查程序三款，對象均為「當事人及關係人」；第3項受調查者無正當理由不得規避妨礙拒絕）、第47條（未經認許之外國法人或團體之訴訟權）；⚠️ D 選項與行政程序法第46條第2項第1款衝突，官方答案為 D，本題靠刪去法，D 的內容不可引為現行規定", "id": 4, "chapter": "G1"}, {"year": 99, "qnum": 13, "stem": "下列何者不屬於行政院公平交易委員會之職掌：", "options": ["事業活動及經濟情況之調查", "擬訂公平交易政策及法規", "違反公平交易法之調查與處分", "事業結合時，公告參與結合之事業其銷售金額之標準"], "answer": "B", "explains": {"A": "事業活動及經濟情況之調查屬公平會職掌，非本題答案。", "B": "本題官方答案為B（已與考選部公告核對）。⚠️ 但依我對公平交易委員會組織法職掌的理解，「公平交易政策、法規之擬訂、修正及廢止」本來就屬公平會職掌，與「不屬於」的題意衝突；我無法判斷官方給B的理由，請考前核對組織法第2條。作答時依官方答案B。", "C": "違反公平交易法之調查與處分屬公平會職掌，非本題答案。", "D": "事業結合銷售金額標準之公告屬公平會職掌，非本題答案。"}, "ref": "⚠️ 本題依據不在公平交易法：現行第26條只規定「主管機關對於涉有違反本法規定，危害公共利益之情事，得依檢舉或職權調查處理」，沒有職掌列舉；職掌應查公平交易委員會組織法第2條（出題年為公平法舊第25條，104.2.4 全文修正時刪除）。官方答案為B，理由待核", "id": 5, "chapter": "G1"}, {"year": 99, "qnum": 14, "stem": "法院對事業違反公平交易法之規定，致侵害他人權益時，對被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之幾倍？", "options": ["2倍", "3倍", "4倍", "5倍"], "answer": "C", "explains": {"A": "數字錯誤，非2倍。", "B": "依我所知，公平交易法懲罰性賠償（故意行為）上限歷來是「三倍」（現行第31條，已與經紀法規查證清單核對）。⚠️ 但本題官方公布答案為C（4倍），與條文不符，我無法判斷原因（可能是題目或答案登載有誤）；請務必記「三倍」，不要背成4倍。", "C": "本題官方公布答案為C（4倍）。⚠️ 現行第31條故意行為上限為三倍，我也沒有查到任何「舊版本為4倍」的依據，原本解析中「99年版本為4倍」的說法未經核實，請不要背誦4倍；考試以現行三倍為準，這題僅作為「官方答案與條文衝突」的警示。", "D": "數字錯誤，非5倍。"}, "ref": "公平交易法第31條（現行：故意行為得酌定損害額以上之賠償，但不得超過已證明損害額之3倍；⚠️本題官方答案C為4倍，與條文不符）", "id": 6, "chapter": "G1"}, {"year": 99, "qnum": 21, "stem": "下列對未經消費者要約而對之郵寄或投遞之商品之敘述何者錯誤？", "options": ["未經消費者要約而對之郵寄或投遞之商品，消費者負保管義務", "未經消費者要約而對之郵寄或投遞之商品之寄送人，經消費者定相當期限通知取回而逾期取回者，視為拋棄其寄投之商品", "未經消費者要約而對之郵寄或投遞之商品之寄送人，雖未經通知，但在寄送後逾1個月未經消費者表示承諾，而仍不取回其商品者，視為拋棄其寄投之商品", "消費者得請求償還因寄送物所受之損害，及處理寄送物所支出之必要費用"], "answer": "B", "explains": {"A": "消保法第20條第1項規定：未經消費者要約而寄送的商品，消費者「不負保管義務」。本選項寫「負保管義務」，與條文直接衝突，是明確的錯誤敘述。⚠️ 官方公布答案為B，A 同樣是錯誤敘述。", "B": "本題官方公布答案為B（已與考選部公告核對）。本選項寫「逾期『取回』者視為拋棄」，條文原意是「逾期『未』取回」才視為拋棄，文字上有瑕疵，可能就是官方判定其錯誤的原因。⚠️ 考試依官方答案B，但觀念記條文：逾期「未取回」→視為拋棄。", "C": "寄送後逾1個月未經消費者表示承諾仍不取回者，視為拋棄，敘述正確，非本題答案。", "D": "消費者得請求償還因寄送物所受損害及處理必要費用，敘述正確，非本題答案。"}, "ref": "消費者保護法第20條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 7, "chapter": "G1"}, {"year": 99, "qnum": 34, "stem": "下列何者非涉犯公平交易法第 24 條規定之虞：", "options": ["房屋仲介人員以「回殺」賺取差價", "經紀業有拒絕交易之杯葛行為", "建築投資商要求購買人須繳回契約書始交付房屋", "經紀業者未告知購屋人斡旋金契約與內政部版「要約書」之區別"], "answer": "B", "explains": {"A": "「回殺」賺取差價是欺罔或顯失公平的行為，屬出題年第24條（概括條款，現行為第25條）規範範圍，另外也違反經紀業管理條例收取差價的禁止規定，所以涉及第24條，不是本題答案。", "B": "本題官方答案為B。拒絕交易的杯葛行為屬限制競爭行為（出題年第19條，現行為第20條），不是第24條（欺罔或顯失公平）的規範範圍，所以「非涉犯第24條」成立，為本題答案。⚠️ 出題年與現行條號不同（第24條→現行第25條，第19條→現行第20條），請考前核對現行條號。", "C": "要求購買人繳回契約書才交付房屋，是欺罔或顯失公平的行為，屬出題年第24條（現行第25條）範圍，所以涉及第24條，不選。", "D": "未告知斡旋金契約與要約書的區別，屬欺罔或顯失公平行為，涉及第24條（現行第25條），不選。"}, "ref": "公平交易法第24條（出題年條號；現行為§25「其他足以影響交易秩序之欺罔或顯失公平之行為」概括規定，104.2.4 全文修正時由§24移為§25。已依lawplayer/考選部官方答案核實：答案為B）", "id": 8, "chapter": "G1"}, {"year": 100, "qnum": 26, "stem": "下列何者非屬「結合」之定義？", "options": ["直接或間接控制他事業之業務經營或人事任免者", "受讓或承租他事業全部或主要部分之營業或財產者", "與他事業經常共同經營或受他事業委託經營者", "持有或取得他事業之股份或出資額，達到他事業有表決權股份或資本總額四分之一以上者"], "answer": "D", "explains": {"A": "直接或間接控制他事業業務經營或人事任免，屬結合定義態樣之一，非本題答案。", "B": "受讓或承租他事業全部或主要部分營業或財產，屬結合定義態樣之一，非本題答案。", "C": "與他事業經常共同經營或受委託經營，屬結合定義態樣之一，非本題答案。", "D": "正確答案。結合定義中「持有或取得他事業股份或出資額」之門檻應為「三分之一以上」，而非「四分之一以上」（四分之一是「結合申報」之門檻，非結合「定義」之門檻），此為定義門檻與申報門檻混淆之★高頻陷阱。"}, "ref": "公平交易法第11條", "id": 9, "chapter": "G1"}, {"year": 100, "qnum": 27, "stem": "下列事業之經營規模，何者不屬獨占事業之認定範圍？", "options": ["一事業在特定市場之占有率達二分之一", "二事業全體在特定市場之占有率達二分之一", "二事業全體在特定市場之占有率達三分之二", "三事業全體在特定市場之占有率達四分之三"], "answer": "B", "explains": {"A": "一事業市占率達1/2，屬獨占認定範圍，非本題答案。", "B": "正確答案。二事業全體市占率應達「三分之二」，而非「二分之一」，始列入獨占事業認定範圍，本選項門檻過低，此為認定基準之★陷阱：一事業1/2、二事業2/3、三事業3/4。", "C": "二事業全體市占率達2/3，屬獨占認定範圍，非本題答案。", "D": "三事業全體市占率達3/4，屬獨占認定範圍，非本題答案。"}, "ref": "公平交易法第7條（獨占定義）、第8條（獨占事業認定基準：1/2、2/3、3/4）", "id": 10, "chapter": "G1"}, {"year": 100, "qnum": 28, "stem": "依消費者保護法之規定，下列敘述何者正確？", "options": ["從事製造商品之企業經營者，就其市場商品符合當時科技水準合理期待的安全性之事實，負擔舉證責任", "消費者因企業經營者過失所致之損害，依本法向法院提起訴訟者，得請求損害額三倍以下之懲罰性賠償金", "企業經營者對於消費者因信賴媒體所刊明知或可得而知之不實廣告內容所致之損害，不須負擔損害賠償責任", "輸入商品之企業經營者，對於因其所輸入之商品而致消費者的健康受有損害時，其應負之責任為過失責任"], "answer": "A", "explains": {"A": "正確。製造商品之企業經營者就商品符合當時科技水準可合理期待安全性之事實，負舉證責任，此為消保法舉證責任倒置保護消費者之核心規定。", "B": "一般過失致損害得請求「一倍以下」懲罰性賠償金，非三倍以下（三倍以下適用於重大過失情形），此為2015年修法後之版本，本題100年出題時法條仍為舊制（僅有故意3倍、過失無倍數規定），依當年舊法過失情形不適用懲罰性賠償金，本選項不符。", "C": "媒體明知或可得而知不實仍予刊登者，應與企業經營者負連帶損害賠償責任，非不須負擔，此為責任承擔之陷阱。", "D": "輸入商品之企業經營者視為製造者，適用嚴格責任標準（僅得於證明無過失時減輕責任），並非僅負「過失責任」（一般過失責任要求被害人舉證企業經營者有過失，與嚴格責任舉證責任倒置性質不同）。"}, "ref": "消費者保護法第7條、第9條", "id": 11, "chapter": "G1"}, {"year": 100, "qnum": 29, "stem": "依消費者保護法之規定，未經消費者要約而對之郵寄或投遞之商品，有關消費者應負義務之敘述，何者正確？", "options": ["消費者應負通知之義務", "消費者不負保管之義務", "消費者應負寄回之義務", "消費者應負檢視之義務"], "answer": "B", "explains": {"A": "消費者不負通知義務（通知取回是消費者「得」行使之權利，非義務）。", "B": "正確。消費者對於未經要約而收受之商品，不負保管義務，此為保護消費者免受騷擾行銷侵擾之特別規定。", "C": "消費者不負寄回義務。", "D": "消費者不負檢視義務。"}, "ref": "消費者保護法第20條", "id": 12, "chapter": "G1"}, {"year": 100, "qnum": 33, "stem": "依公平交易法規定，事業不得為有限制競爭或妨礙公平競爭之虞的情形，下列何者不屬之？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以公司營利為目的，促使他事業對該特定事業退出市場之行為", "以脅迫、利誘或其他不正當方法，使競爭者之交易相對人與自己交易之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為"], "answer": "B", "explains": {"A": "無正當理由差別待遇，屬第20條限制競爭行為態樣，非本題答案。", "B": "正確答案。法定限制競爭行為之要件應為「以損害特定事業為目的」（而非「以公司營利為目的」），促使他事業對該特定事業斷絕供給購買或其他交易（而非「退出市場」），本選項要件描述與法條原文不符，此為虛構要件之陷阱。", "C": "脅迫利誘使競爭者交易相對人與自己交易，屬第20條態樣，非本題答案。", "D": "不正當限制交易相對人事業活動為條件而交易，屬第20條態樣，非本題答案。"}, "ref": "公平交易法第20條", "id": 13, "chapter": "G1"}, {"year": 100, "qnum": 34, "stem": "下列關於事業違反公平交易法之規定，以致侵害他人權益之損害賠償的敘述，何者正確？", "options": ["事業因過失侵害行為而受有利益者，被害人得請求專依該項利益計算損害額", "因事業之故意侵害行為所致之損害，法院得依侵害情形酌定損害額三倍以上之賠償", "事業因故意侵害行為而受有利益者，被害人得請求專依該項利益及利息加倍計算損害額", "因事業之過失行為所致之損害，法院得依侵害情形酌定損害額三倍以上之賠償"], "answer": "A", "explains": {"A": "正確。事業（不論故意或過失）侵害行為受有利益者，被害人得請求專依該項利益計算損害額，此為不能證明實際損害額時之替代計算方式。", "B": "應為酌定損害額「以上」之賠償，「但不得超過已證明損害額之3倍」（即3倍為上限，非「3倍以上」），程度描述錯誤。", "C": "法條未規定「加倍計算」之特殊機制，此為虛構加重計算方式之陷阱。", "D": "懲罰性賠償金僅適用於「故意」行為，過失行為不適用3倍以上賠償規定，主體錯誤。"}, "ref": "公平交易法第30條（事業違反本法致侵害他人權益者負損害賠償責任）、第31條（第1項故意行為得酌定損害額以上之賠償，不得超過已證明損害額之三倍；第2項侵害人因侵害行為受有利益者，被害人得請求專依該項利益計算損害額——本題正解依據）、第32條（請求權時效2年／10年）。出題年條號為舊第31條、第32條，104.2.4 全文修正後移為第30條、第31條", "id": 14, "chapter": "G1"}, {"year": 100, "qnum": 35, "stem": "依公平交易法規定，下列有關事業結合的敘述，何者正確？", "options": ["事業結合行為原則上禁止，例外採取申報主義", "主管機關對於受理事業結合申報案件所為延長受理期間之決定，不得附加條件", "事業在中央主管機關受理申報期間，不得為結合行為", "事業申報後，經中央主管機關禁止其結合而結合，處新臺幣五萬元以上五千萬元以下罰鍰"], "answer": "C", "explains": {"A": "事業結合原則上「不禁止」，僅達一定門檻者須事前申報，並非原則禁止例外申報，此為性質描述錯誤。", "B": "主管機關對延長受理期間之決定「得」附加條件，非不得附加條件，方向相反。", "C": "正確。事業在主管機關受理申報之等待期間內（原則30工作日，得延長不逾60工作日），不得為結合行為，此為結合申報等待期間之核心限制規定。", "D": "下限金額錯。違法結合（含申報後經主管機關禁止其結合而仍結合）的罰鍰級距，第39條第1項逐字是「新臺幣『二十萬元』以上五千萬元以下」，下限是20萬元，不是5萬元。★順帶記：5萬元以上2,500萬元以下是第42條（違反第21條、第23條至第25條）的級距，兩組不要混。"}, "ref": "公平交易法第10條（結合之定義五款）、第11條（結合申報門檻）、第12條（六款不適用申報）、第39條第1項（違法結合 20萬–5,000萬罰鍰）", "id": 15, "chapter": "G1"}, {"year": 100, "qnum": 36, "stem": "對於公平交易法所定中央主管機關應附期限許可事業之聯合行為，在許可期限屆滿前，事業得申請延展，每次最長延展期限不得逾幾年？", "options": ["一年", "三年", "五年", "六年"], "answer": "B", "explains": {"A": "數字錯誤，非一年。", "B": "正確（依100年出題當時之官方答案）。100年（2011年）當時，聯合行為許可期限及延展期限皆為「3年」。★重要提醒：經查證law.moj.gov.tw，現行公平交易法（第16條）已修正為統一「5年」上限（不論初次許可或延展，每次皆不得逾5年），115年應考務必以現行「5年」為準，本題3年僅為100年當時歷史答案。", "C": "非100年當時之官方答案（當年法條為3年）。★但「五年」正是現行法（115年應考適用）之正確數字，並非僅限「經濟不景氣產銷過剩」之特殊情形，現行法已統一為5年上限。", "D": "數字錯誤，非六年。"}, "ref": "公平交易法第16條第2項（現行：許可期限不得逾5年，延展每次不得逾5年，須於屆滿前3至6個月書面申請）。⚠️ 出題年（100年）的「3年」屬修正前條文，條號與現行不同，站內條文庫只收現行條文；115年應考一律以現行5年為準", "id": 16, "chapter": "G1"}, {"year": 100, "qnum": 37, "stem": "甲、乙二電子零件供應銷售業，透過聚餐交換經營意見，雙方合意決定在特定時點提高電子零件售價。此種行為是：", "options": ["獨占行為", "寡占行為", "結合行為", "聯合行為"], "answer": "D", "explains": {"A": "獨占行為是單一（或視為單一）事業處於無競爭狀態之情形，非本題平行合意行為。", "B": "寡占非本法正式法律用語分類。", "C": "結合行為係取得控制從屬關係，非本題單純價格合意行為。", "D": "正確。甲乙二有競爭關係之事業以合意方式共同決定提高售價，相互約束事業活動，構成「聯合行為」，此為聯合行為之典型態樣（價格卡特爾）。"}, "ref": "公平交易法第14條", "id": 17, "chapter": "G1"}, {"year": 101, "qnum": 2, "stem": "依公平交易法規定，中央主管機關為事業聯合行為之許可時，原則上許可期限不得逾幾年？", "options": ["一年", "一年半", "二年", "三年"], "answer": "D", "explains": {"A": "數字錯誤，非一年。", "B": "數字錯誤，非一年半。", "C": "數字錯誤，非二年。", "D": "正確（依101年出題當時之官方答案）。101年（2012年）當時，聯合行為許可期限原則上為「3年」。★重要提醒：現行公平交易法（第16條）已修正為「5年」，115年應考務必以現行5年為準（本題選項未列5年，因101年當時法條尚為3年，屬歷史考題）。"}, "ref": "公平交易法第16條第2項（現行：許可期限不得逾5年，延展每次不得逾5年）。⚠️ 出題年（101年）的「3年」屬修正前條文，115年應考一律以現行5年為準", "id": 18, "chapter": "G1"}, {"year": 101, "qnum": 3, "stem": "依公平交易法規定，事業結合時，下列何種情形，不須先向中央主管機關提出申報？", "options": ["事業因結合而使其市場占有率達三分之一者", "參與結合之一事業，其市場占有率達四分之一者", "參與結合之一事業已持有他事業達百分之五十以上之有表決權股份，再與該他事業結合者", "參與結合之事業，其上一會計年度之銷售金額，超過中央主管機關所公告之金額者"], "answer": "C", "explains": {"A": "因結合使市場占有率達1/3者，須申報，非本題答案。", "B": "參與結合之一事業市占率達1/4者，須申報，非本題答案。", "C": "正確答案。參與結合之一事業已持有他事業50%以上有表決權股份，再與該他事業結合者，因結合前已具實質控制關係，結合前後市場結構並無實質改變，法律明文排除此情形之申報義務，此為結合申報之特別排除規定★陷阱。", "D": "銷售金額超過公告金額者，須申報，非本題答案。"}, "ref": "公平交易法第11條", "id": 19, "chapter": "G1"}, {"year": 101, "qnum": 5, "stem": "依公平交易法規定，事業以契約與有競爭關係之他事業共同決定商品或服務之價格或交易地區等，相互約束事業活動之行為，稱為下列何者？", "options": ["結合行為", "聯合行為", "獨占行為", "結盟行為"], "answer": "B", "explains": {"A": "結合行為係取得控制從屬關係，非本題平行合意行為。", "B": "正確。此為聯合行為之法定定義：有競爭關係之事業以契約、協議或其他方式之合意，共同決定商品或服務之價格或交易地區等，相互約束事業活動之行為。", "C": "獨占行為是單一事業之市場支配地位，非本題平行合意行為。", "D": "結盟行為非本法正式法律用語。"}, "ref": "公平交易法第14條", "id": 20, "chapter": "G1"}, {"year": 101, "qnum": 6, "stem": "依公平交易法規定，事業在特定市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者，稱為下列何者？", "options": ["競爭", "壟斷", "獨占", "寡占"], "answer": "C", "explains": {"A": "競爭是市場正常運作狀態，與本題描述相反。", "B": "壟斷非本法正式法律用語（法定用語為獨占）。", "C": "正確。此為「獨占」之法定定義：事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者。", "D": "寡占非本法正式法律用語分類。"}, "ref": "公平交易法第7條", "id": 21, "chapter": "G1"}, {"year": 101, "qnum": 12, "stem": "按事業不得在其商品或廣告上，或以其他使公眾得知之方法，對於商品之價格、數量、品質、內容、製造方法、製造日期、有效期限、使用方法、用途、原產地、製造者、製造地、加工者、加工地等，為虛偽不實或引人錯誤之表示或表徵。事業有違反前述規定者，下列何者為最正確？", "options": ["行政院公平交易委員會得限期命其採取必要更正措施，並得處新臺幣十萬元以上一千萬元以下罰鍰", "行政院公平交易委員會得限期命其改正其行為或停止其措施，並得處新臺幣十萬元以上一千五百萬元以下罰鍰", "行政院公平交易委員會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣十萬元以上二千五百萬元以下罰鍰", "行政院公平交易委員會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣五萬元以上二千五百萬元以下罰鍰"], "answer": "D", "explains": {"A": "處分內容不完整（漏「停止」）且下限金額錯誤。", "B": "處分內容不完整（漏「採取必要更正措施」）且下限金額錯誤。", "C": "處分內容完整，但罰鍰下限應為「5萬元」而非「10萬元」，數字錯誤。", "D": "正確。違反虛偽不實廣告（第21條）規定者，公平會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣「5萬元以上2500萬元以下」罰鍰，處分內容及金額皆完整正確。"}, "ref": "公平交易法第21條、第42條", "id": 22, "chapter": "G1"}, {"year": 101, "qnum": 14, "stem": "行政院公平交易委員會依公平交易法為調查時，得依下列程序進行。以下所述何者為最正確？", "options": ["通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→通知當事人及關係人到場陳述意見→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查", "通知當事人及關係人到場陳述意見→通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查", "派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查→通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→通知當事人及關係人到場陳述意見", "聯絡相關單位提供相關資料→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查→通知當事人及關係人到場陳述意見"], "answer": "B", "explains": {"A": "法定條文列舉順序與本選項排序不符。", "B": "正確。公平會調查程序的列舉順序是：①到場陳述意見 → ②提出帳冊、文件及其他必要之資料或證物 → ③派員前往事務所、營業所或其他場所為必要之調查，本選項的排序相符。⚠️ 用語請改記現行版：第27條第1項三款的對象都是「『當事人及關係人』」（出題年條文寫「有關機關、團體、事業或個人」「有關團體或事業之事務所」，104.2.4 全文修正後已改）。順序沒變，變的是受通知的主體。", "C": "順序與法條列舉不符。", "D": "「聯絡相關單位提供相關資料」非法條明文列舉之調查方式，此為虛構程序之陷阱。"}, "ref": "公平交易法第27條第1項（三款調查程序，對象均為「當事人及關係人」；出題年條文用語為「有關機關、團體、事業或個人」，104.2.4 全文修正後已改，順序未變）", "id": 23, "chapter": "G1"}, {"year": 101, "qnum": 20, "stem": "依公平交易法規定，損害賠償請求權，自請求權人知有行為及賠償義務人時起，多久期間不行使而消滅？", "options": ["半年", "一年", "一年半", "二年"], "answer": "D", "explains": {"A": "數字錯誤，非半年。", "B": "數字錯誤，非一年。", "C": "數字錯誤，非一年半。", "D": "正確。損害賠償請求權，自請求權人知有行為及賠償義務人時起，「2年」間不行使而消滅；自行為時起，逾「10年」者亦同，此為全科高頻雙重時效數字，反覆重複命題。"}, "ref": "公平交易法第33條（出題年條號；現行「請求權時效」在§32，2026-10-14核對）", "id": 24, "chapter": "G1"}, {"year": 101, "qnum": 21, "stem": "依公平交易法所處停止營業之期間，每次以多久期間為限？", "options": ["一個月", "三個月", "六個月", "十二個月"], "answer": "C", "explains": {"A": "數字錯誤，非一個月。", "B": "數字錯誤，非三個月。", "C": "正確。依公平交易法所處停止營業之期間，每次以「6個月」為限，與不動產經紀業管理條例之停止營業處分期間概念不同（本條例無固定期限，公平法則明定6個月上限）。", "D": "數字錯誤，非十二個月。"}, "ref": "公平交易法第41條（出題年條號；現行「停止營業每次6個月」在§39Ⅳ，2026-10-14核對）", "id": 25, "chapter": "G1"}, {"year": 102, "qnum": 5, "stem": "事業違反公平交易法第 19 條之規定，以脅迫方法使他事業參與聯合之行為，經中央主管機關限期命其停止後，再為相同或類似違反行為者，得處行為人如何之罰責？", "options": ["新臺幣五萬元以上二千五百萬元以下罰鍰", "新臺幣十萬元以上五千萬元以下罰鍰", "二年以下有期徒刑、拘役或科或併科新臺幣五千萬元以下罰金", "三年以下有期徒刑、拘役或科或併科新臺幣一億元以下罰金"], "answer": "C", "explains": {"A": "此金額級距適用於違反第21/24/25條（虛偽不實廣告等）之罰鍰，非本題第19條情形，且本題應處刑罰而非罰鍰。", "B": "本選項寫的「10萬元以上5,000萬元以下罰鍰」『確實存在』，那是第40條第1項的行政罰鍰級距（主管機關對違反第9條、第15條、第19條、第20條之事業，得限期令停止、改正，並得處10萬元以上5,000萬元以下罰鍰；屆期不停止不改正者，按次處20萬元以上1億元以下）。但本題問的是「經限期命停止後『再為』相同或類似違反行為」，這一步已經進入刑罰階段（第36條：2年以下有期徒刑、5,000萬元以下罰金），所以本選項是把罰鍰與刑罰的性質放錯了。", "C": "正確。本題是出題年第19條（以脅迫方法使他事業參與聯合）之情形，經主管機關限期命停止後再為相同或類似違反行為者，處行為人「2年以下有期徒刑、拘役或科或併科新臺幣5,000萬元以下罰金」。★現行條號對照：脅迫態樣在第20條第4款，刑罰在第36條（違反第19條或第20條，2年／5,000萬）。要跟第34條分開：違反第9條『獨占』或第15條『聯合行為』才是3年／1億。", "D": "這是第34條的刑罰級距——違反第9條『獨占』或第15條『聯合行為』，經限期令停止而屆期未停止或停止後再為相同違反行為者，處行為人3年以下有期徒刑、拘役或科或併科1億元以下罰金。本題是第36條（違反第19條、第20條，2年／5,000萬）的情形，刑度與罰金都不同。★第34條管獨占與聯合行為，第36條管限制轉售價格與限制競爭。"}, "ref": "公平交易法：出題年第19條（脅迫使他事業參與聯合）→現行第20條第4款；刑罰為第36條（違反第19條或第20條，經限期令停止而屆期未停止或停止後再為相同違反行為，2年以下、5,000萬元以下罰金）；對照第34條（違反第9條獨占或第15條聯合行為，3年以下、1億元以下）、第40條第1項（行政罰鍰 10萬–5,000萬，按次 20萬–1億）", "id": 26, "chapter": "G1"}, {"year": 102, "qnum": 17, "stem": "公寓大廈之規約範本，由何機關定之？", "options": ["內政部", "行政院公平交易委員會", "行政院消費者保護委員會", "直轄市、縣（市）政府"], "answer": "A", "explains": {"A": "正確。公寓大廈規約範本由「內政部」定之（中央主管機關）。", "B": "行政院公平交易委員會非規約範本訂定機關。", "C": "行政院消費者保護委員會非規約範本訂定機關（⚠️ 消保會已於 102.1.1 裁撤，現為行政院消費者保護處）。", "D": "直轄市、縣（市）政府為地方執行機關，非全國性規約範本之訂定機關。"}, "ref": "公寓大廈管理條例第60條（規約範本由中央主管機關定之；第56條規約草約得依規約範本制作）", "id": 27, "chapter": "G1"}, {"year": 102, "qnum": 28, "stem": "公平交易法規定，法院得對事業之故意行為，依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之幾倍？", "options": ["一倍", "二倍", "三倍", "四倍"], "answer": "C", "explains": {"A": "數字錯誤，非一倍。", "B": "數字錯誤，非二倍。", "C": "正確。事業故意行為致侵害他人權益者，法院酌定之賠償不得超過已證明損害額之「3倍」，全科最高頻數字，反覆重複命題。", "D": "數字錯誤，非四倍。"}, "ref": "公平交易法第31條", "id": 28, "chapter": "G1"}, {"year": 102, "qnum": 32, "stem": "當有益於整體經濟與公共利益時，行政院公平交易委員會得許可事業之聯合行為，該許可之期限不得逾幾年？", "options": ["十年", "五年", "三年", "二年"], "answer": "C", "explains": {"A": "數字錯誤，非十年。", "B": "非102年當時之官方答案（當年法條為3年）。★但「五年」正是現行法（115年應考適用）之正確數字，並非僅限「經濟不景氣產銷過剩」之特殊情形，現行法已統一為5年上限，此為本題最重要之現行法提醒。", "C": "正確（依102年出題當時之官方答案）。102年當時法條許可期限為3年。★重要提醒：經查證law.moj.gov.tw，現行公平交易法（第16條）已修正為統一「5年」上限，115年應考務必以現行5年為準，本題3年僅為102年當時歷史答案。", "D": "數字錯誤，非二年。"}, "ref": "公平交易法第16條第2項（現行：許可期限不得逾5年，延展每次不得逾5年）。⚠️ 出題年（102年）的「3年」屬修正前條文，115年應考一律以現行5年為準", "id": 29, "chapter": "G1"}, {"year": 102, "qnum": 34, "stem": "依公平交易法規定裁處停止營業之期間，每次以幾個月為限？", "options": ["六個月", "五個月", "三個月", "二個月"], "answer": "A", "explains": {"A": "正確。依公平交易法裁處停止營業之期間，每次以「6個月」為限。", "B": "數字錯誤，非五個月。", "C": "數字錯誤，非三個月。", "D": "數字錯誤，非二個月。"}, "ref": "公平交易法第41條（出題年條號；現行「停止營業每次6個月」在§39Ⅳ，2026-10-14核對）", "id": 30, "chapter": "G1"}, {"year": 102, "qnum": 35, "stem": "事業因結合而使其市場占有率達多少比例時，應先向行政院公平交易委員會提出申報？", "options": ["二分之一", "三分之一", "四分之一", "五分之一"], "answer": "B", "explains": {"A": "比例錯誤，非二分之一。", "B": "正確。事業因結合而使其市場占有率達「三分之一」者，應先向公平會提出申報，此為結合申報三大門檻之一（另二者為單一事業市占率達1/4、銷售金額超過公告金額），全科高頻數字。", "C": "比例錯誤，四分之一是「參與結合之單一事業」市占率門檻，非「結合後」市占率門檻，此為易混淆之陷阱。", "D": "比例錯誤，非五分之一。"}, "ref": "公平交易法第11條", "id": 31, "chapter": "G1"}, {"year": 102, "qnum": 36, "stem": "關於多層次傳銷參加人解除多層次傳銷契約之敘述，以下何者正確？", "options": ["多層次傳銷參加人得自訂約日起十五日內以書面通知多層次傳銷事業解除契約", "多層次傳銷事業應於契約解除生效後六十日內，接受參加人退貨之申請，取回商品或由參加人自行送回商品", "多層次傳銷事業依規定返還參加人所為之給付時，得扣除已因該進貨而對參加人給付之獎金或報酬", "前述之退貨如係該事業取回者，多層次傳銷事業亦不得扣除取回該商品所需運費"], "answer": "C", "explains": {"A": "參加人得自訂約日起「30日」內解除契約，非十五日，數字錯誤。", "B": "傳銷事業應於契約解除生效後「30日」內接受退貨申請，非六十日，數字錯誤。", "C": "正確。傳銷事業返還參加人所為之給付時，得扣除已因該進貨而對參加人給付之獎金或報酬，此為避免不當得利之合理扣除規定。", "D": "傳銷事業「得」扣除取回商品所需之運費，並非不得扣除，此為方向相反之陷阱。"}, "ref": "⚠️ 法源已移出公平交易法：多層次傳銷管理法第20條（第1項訂約日起30日內書面解除或終止；第2項事業應於解除或終止生效後30日內接受退貨申請、受領送回商品並返還價金及其他款項；第3項得扣除可歸責傳銷商之毀損滅失價值及該進貨之獎金或報酬；第4項事業取回退貨者並得扣除運費）。公平法 104.2.4 全文修正時已刪除多層次傳銷規定，不在本科範圍", "id": 32, "chapter": "G1"}, {"year": 102, "qnum": 37, "stem": "關於公平交易法所規定損害賠償請求權之敘述，以下何者正確？", "options": ["自行為時起，二年間不行使而消滅", "自行為時起，五年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，二年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，五年間不行使而消滅"], "answer": "C", "explains": {"A": "「二年」時效之起算點應為「請求權人知有行為及賠償義務人時」，而非「行為時」（行為時起算的時效期間為10年），起算點錯誤。", "B": "「行為時起」對應之時效期間應為「10年」，非五年，數字錯誤。", "C": "正確。損害賠償請求權，自請求權人知有行為及賠償義務人時起，「2年」間不行使而消滅，此為主觀起算時效。", "D": "「請求權人知有行為及賠償義務人時起」對應之期間應為「2年」，非五年，數字錯誤。"}, "ref": "公平交易法第33條（出題年條號；現行「請求權時效」在§32，2026-10-14核對）", "id": 33, "chapter": "G1"}, {"year": 102, "qnum": 38, "stem": "關於公平交易法對於「事業」規定之敘述，以下何者正確？", "options": ["公平交易法所稱事業不包含同業公會", "事業即使有正當理由，仍不得對其他事業給予差別待遇", "事業對於其交易相對人，就其供給之商品轉售與第三人時，得約定限制其價格", "事業與他事業經常共同經營或受他事業委託經營者，即屬結合"], "answer": "D", "explains": {"A": "公平交易法所稱事業「包含」同業公會（法定明文事業所組成之同業公會視為本法所稱事業），本選項方向相反。", "B": "事業「有正當理由」者，「得」對他事業為差別待遇（法定限制競爭行為以「無正當理由」為要件，有正當理由則不受限制），本選項過於絕對。", "C": "事業原則上「不得」限制交易相對人轉售價格（此為限制轉售價格之禁止規定，除有正當理由外），本選項方向相反。", "D": "正確。事業與他事業經常共同經營或受他事業委託經營者，即屬「結合」之法定定義態樣之一。"}, "ref": "公平交易法第2條、第11條、第20條", "id": 34, "chapter": "G1"}, {"year": 103, "qnum": 34, "stem": "依公平交易法規定，事業持有或取得他事業之股份或出資額，達到他事業有表決權股份或資本總額三分之一以上者，稱為下列何者？", "options": ["結合", "獨占", "聯合行為", "寡占行為"], "answer": "A", "explains": {"A": "正確。持有或取得他事業股份或出資額達其有表決權股份或資本總額「三分之一以上」者，屬「結合」之法定定義態樣之一。", "B": "獨占是市場支配地位之描述，非股份持有比例之定義。", "C": "聯合行為是平行合意約束事業活動之行為，非股份持有比例之定義。", "D": "寡占非本法正式法律用語。"}, "ref": "公平交易法第11條", "id": 35, "chapter": "G1"}, {"year": 103, "qnum": 35, "stem": "依公平交易法規定，多層次傳銷參加人終止契約後，多層次傳銷事業應以何種價格買回參加人所持有之商品？", "options": ["商品之進貨價金", "商品進貨價金並可扣除商品減損之價額", "原購價格百分之九十", "原購價格百分之九十並可扣除終止契約違約金"], "answer": "C", "explains": {"A": "應以「原購價格90%」買回，非「進貨價金」，計算基礎不同。", "B": "應以「原購價格90%」計算，非「進貨價金並扣除減損價額」，計算方式不符。", "C": "正確。多層次傳銷參加人終止契約後，傳銷事業應以「原購價格90%」買回參加人所持有之商品，此為保障傳銷參加人退出機制之核心數字。", "D": "法定不得另行扣除終止契約違約金，此為額外增加限制之陷阱。"}, "ref": "⚠️ 法源已移出公平交易法：多層次傳銷管理法第21條（第1項30日期間經過後仍得隨時書面終止，但商品自可提領之日起算已逾6個月者不得要求退貨；第2項終止生效後30日內以原購價格「百分之九十」買回；第3項得扣除獎金報酬與減損金額；第4項事業取回者得扣除運費）。對照第20條：訂約日起30日內解除或終止者，返還所付價金及其他款項。公平法104.2.4 全文修正時已刪除多層次傳銷規定，不在本科範圍", "id": 36, "chapter": "G1"}, {"year": 103, "qnum": 36, "stem": "甲因違反公平交易法而被處罰鍰，請問目前應移送何處強制執行？", "options": ["普通法院", "行政法院", "法務部行政執行署", "財政部國有財產署"], "answer": "C", "explains": {"A": "普通法院非行政罰鍰之強制執行機關。", "B": "行政法院是行政訴訟審理機關，非強制執行機關。", "C": "正確。違反公平交易法所處罰鍰，經通知繳納逾期未繳納者，移送「法務部行政執行署」強制執行，此為行政罰鍰之標準執行機關。", "D": "財政部國有財產署管理國有財產，非罰鍰強制執行機關。"}, "ref": "行政執行法（公法上金錢給付義務逾期不履行，移送法務部行政執行署所屬行政執行分署強制執行）。⚠️ 行政執行法不在站內條文庫，本題依據為該法而非公平交易法", "id": 37, "chapter": "G1"}, {"year": 103, "qnum": 38, "stem": "依公平交易法規定，事業結合時，有下列何種情形，應先向中央主管機關提出申報？", "options": ["事業因結合而使其市場占有率達百分之四十者", "參與結合之一事業，其市場占有率達百分之二十者", "同一事業所持有有表決權股份或出資額達百分之五十以上之事業間結合者", "事業將其全部或主要部分之營業、財產或可獨立營運之全部或一部營業，讓與其獨自新設之他事業者"], "answer": "A", "explains": {"A": "正確。事業因結合而使其市場占有率達「1/3（約33.3%）以上」者應申報，本選項40%已超過1/3門檻，應申報。", "B": "參與結合之單一事業市占率門檻應為「1/4（25%）」，本選項20%尚未達標，非本題應申報之情形（低於門檻，若市占率描述達1/4以上才須申報）。", "C": "同一事業已持有他事業50%以上表決權股份，再與該事業結合者，因結合前後市場結構無實質改變，法律明文排除此情形之申報義務。", "D": "事業將營業財產讓與「其獨自新設」之他事業者，因新設事業與原事業實質上為同一經濟體，法律明文排除此情形之申報義務。"}, "ref": "公平交易法第11條", "id": 38, "chapter": "G1"}, {"year": 103, "qnum": 39, "stem": "甲不動產仲介業向購屋人乙收取斡旋金時，如故意未同時告知乙得選擇採用內政部版要約書，下列敘述何者不正確？", "options": ["依個案情形，甲可能受刑法制裁", "依個案情形，此可能屬於足以影響交易秩序之欺罔或顯失公平的行為", "依個案情形，甲可能違反公平交易法", "依個案情形，乙可能得向甲請求懲罰性賠償"], "answer": "A", "explains": {"A": "正確答案（不正確之敘述）。此類行為屬公平交易法第25條「足以影響交易秩序之欺罔或顯失公平行為」之行政不法範疇，並非刑法所規範之犯罪行為，本選項稱「可能受刑法制裁」缺乏法律依據，屬★陷阱（除非另涉詐欺等刑事犯罪要件，單純未告知斡旋金與要約書區別本身非刑事犯罪）。", "B": "依個案情形可能構成足以影響交易秩序之欺罔或顯失公平行為（第25條），敘述可能成立，非本題答案。", "C": "依個案情形可能違反公平交易法，敘述可能成立，非本題答案。", "D": "依個案情形乙可能得向甲請求懲罰性賠償（消保法或公平法皆有相關賠償機制），敘述可能成立，非本題答案。"}, "ref": "公平交易法第25條", "id": 39, "chapter": "G1"}, {"year": 103, "qnum": 40, "stem": "關於甲不動產經紀業（加盟業主）以限制加盟店收取服務報酬為條件，而與加盟店交易之行為，下列敘述何者不正確？", "options": ["為保護消費者，甲不應容許其加盟店自由決定服務報酬", "甲的行為有限制競爭之虞", "甲的行為有妨礙公平競爭之虞", "甲的行為有違反公平交易法規定之虞"], "answer": "A", "explains": {"A": "正確答案（不正確之敘述）。以限制加盟店服務報酬為條件而與其交易，構成「以不正當限制交易相對人事業活動為條件而與其交易」，涉有限制競爭之虞，並「非」保護消費者之正當理由，本選項以「保護消費者」合理化此限制競爭行為，屬★陷阱：限制報酬並非法定正當化事由。", "B": "甲行為有限制競爭之虞，敘述正確，非本題答案。", "C": "甲行為有妨礙公平競爭之虞，敘述正確，非本題答案。", "D": "甲行為有違反公平交易法規定之虞，敘述正確，非本題答案。"}, "ref": "公平交易法第20條", "id": 40, "chapter": "G1"}, {"year": 104, "qnum": 5, "stem": "甲與乙兩事業結合時，依公平交易法規定，下列那種情況無須向中央主管機關申請許可？", "options": ["甲與乙兩事業因結合而使其市場占有率達1/3", "甲與乙之一事業，其市場占有率達1/4", "甲與乙兩事業之上一會計年度銷售金額，皆未達主管機關所公告之金額", "甲與乙兩事業之上一會計年度銷售金額，超過主管機關所公告之金額"], "answer": "C", "explains": {"A": "結合後市占率達1/3，觸及申報門檻，須申報。", "B": "參與結合之一事業市占率達1/4，觸及申報門檻，須申報。", "C": "正確。銷售金額未達公告金額，且未觸及市占率相關門檻者，無須申報，本選項符合三項門檻皆未觸及之情形。", "D": "銷售金額超過公告金額，觸及申報門檻，須申報。"}, "ref": "公平交易法第11條", "id": 41, "chapter": "G1"}, {"year": 104, "qnum": 6, "stem": "不動產經紀業者以協議之方式，與有競爭關係之其他不動產經紀業者，共同決定服務報酬之行為，係屬於公平交易法所規定之何種行為？", "options": ["結合行為", "聯合行為", "獨占行為", "加盟行為"], "answer": "B", "explains": {"A": "結合行為係取得控制從屬關係，非本題平行合意行為。", "B": "正確。以協議與有競爭關係之他事業共同決定服務報酬，屬「聯合行為」之典型態樣（價格協議），此為經紀業常考情境題。", "C": "獨占行為是單一事業之市場支配地位，非本題平行合意行為。", "D": "加盟行為非本法正式法律用語分類。"}, "ref": "公平交易法第14條", "id": 42, "chapter": "G1"}, {"year": 104, "qnum": 7, "stem": "依公平交易法之規定，中央主管機關許可之事業聯合行為，下列何者非屬法定得申請之情形？", "options": ["為促進事業合理經營，而分別作專業發展者", "為確保或促進輸出，而專就國外市場之競爭予以約定者", "為保障事業合理利潤，由同業公會協調決定商品價格者", "為加強貿易效能，而就國外商品之輸入採取共同行為者"], "answer": "C", "explains": {"A": "為促進事業合理經營分別作專業發展，屬法定得申請許可情形，非本題答案。", "B": "為確保或促進輸出就國外市場競爭予以約定，屬法定得申請許可情形，非本題答案。", "C": "正確答案。「為保障事業合理利潤，由同業公會協調決定商品價格」並非法定得申請許可之聯合行為情形，此類單純以維護業者利潤為目的之價格協議，本質即為違法之價格卡特爾，不得以此為由申請許可，此為虛構許可事由之陷阱。", "D": "為加強貿易效能就國外商品輸入採共同行為，屬法定得申請許可情形，非本題答案。"}, "ref": "公平交易法第15條（列舉聯合行為許可事由）", "id": 43, "chapter": "G1"}, {"year": 104, "qnum": 8, "stem": "依公平交易法之規定，關於事業結合的敘述，下列何者正確？", "options": ["事業結合行為原則上禁止，例外採取申報主義", "主管機關對於受理事業結合申報案件所為延長受理期間之決定，不得附加條件", "事業自主管機關受理其提出完整申報資料之日起算30日內，不得為結合行為", "事業申報後，經中央主管機關禁止其結合而結合，處新臺幣五萬元以上五千萬元以下罰鍰"], "answer": "C", "explains": {"A": "事業結合原則上不禁止，僅達門檻者須申報，非原則禁止例外申報。", "B": "主管機關對延長受理期間之決定得附加條件，非不得附加條件。", "C": "正確。事業自主管機關受理其提出完整申報資料之日起算「30個工作日」內，不得為結合行為，此為結合等待期間之核心規定（精確用語為「工作日」，惟本題選項用「日」表述，仍以官方公告答案為準）。", "D": "下限金額錯。第39條第1項逐字是「新臺幣『二十萬元』以上五千萬元以下」罰鍰，下限20萬元。（5萬元以上2,500萬元以下是第42條的級距。）"}, "ref": "公平交易法第10條（結合之定義）、第11條（申報門檻）、第12條（不適用申報之六款）、第39條第1項（違法結合 20萬–5,000萬）", "id": 44, "chapter": "G1"}, {"year": 104, "qnum": 10, "stem": "依公平交易法規定，違反獨占或聯合行為之規定，經主管機關限期命其停止、改正其行為或採取必要更正措施，屆期未停止、改正其行為或未採取必要更正措施，或停止後再為相同違反行為時，處行為人幾年以下有期徒刑？", "options": ["1年", "2年", "3年", "5年"], "answer": "C", "explains": {"A": "數字錯誤，非1年。", "B": "數字錯誤，非2年（2年係違反第19條脅迫等特殊情形之刑度，非違反獨占/聯合行為一般情形）。", "C": "正確。違反獨占（第9條）或聯合行為（第15條）規定，屆期未改正或停止後再為相同違反行為者，處行為人「3年以下」有期徒刑、拘役或科或併科新臺幣1億元以下罰金，此為一般情形之標準刑度。", "D": "數字錯誤，非5年。"}, "ref": "公平交易法第37條（出題年條號；現行為§34——違反§9獨占或§15聯合行為，經依§40Ⅰ限期令停止、改正而屆期未停止改正，或停止後再為相同違反行為者，處行為人3年以下有期徒刑、拘役或科或併科1億元以下罰金。2026-10-28 對逐字條文庫核實）", "id": 45, "chapter": "G1"}, {"year": 104, "qnum": 35, "stem": "依公平交易法之規定，事業不得為聯合行為，但經主管機關許可者，不在此限。主管機關之許可應附期限，最長不得超過多久？", "options": ["3年", "4年", "5年", "6年"], "answer": "C", "explains": {"A": "3年是舊制數字。現行公平交易法第16條第2項規定許可期限不得逾「五年」（延展每次亦不得逾五年），所以A錯。★105年第15題考同一個數字，兩題一起記。", "B": "不是4年。公平交易法第16條第2項的上限是「五年」，延展每次也是不得逾五年，法條裡沒有出現過4年。", "C": "官方標準答案（已依考選部公告核實）。公平交易法第16條第2項：「許可應附期限，其期限『不得逾五年』；事業如有正當理由，得於期限屆滿前三個月至六個月期間內，以書面向主管機關申請延展；其延展期限，每次不得逾五年。」★分工要記清楚：第15條管「哪八種聯合行為可以申請許可」（並定主管機關應於三個月內決定），第16條管「許可的條件、負擔與期限」。", "D": "不是6年。公平交易法第16條第2項的上限是「五年」，而且是『許可與延展都是五年』，沒有比五年更長的級距。"}, "ref": "公平交易法第16條第2項（許可應附期限，不得逾五年；延展每次不得逾五年）、第15條（聯合行為八款許可事由，主管機關應於三個月內為決定）", "id": 46, "chapter": "G1"}, {"year": 104, "qnum": 37, "stem": "下列何者屬於公平交易法之「不公平競爭」？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "事業限制其交易相對人就供給之商品轉售價格之行為", "事業在商品或廣告上為虛偽不實或引人錯誤之表示或表徵"], "answer": "D", "explains": {"A": "差別待遇屬「限制競爭」行為（第20條），非不公平競爭。", "B": "不正當限制交易相對人事業活動為條件交易，屬「限制競爭」行為（第20條），非不公平競爭。", "C": "限制轉售價格屬「限制競爭」行為（第19條），非不公平競爭。", "D": "正確。事業在商品或廣告上為虛偽不實或引人錯誤表示表徵（第21條），屬「不公平競爭」行為體系（第21-25條：不實廣告、仿冒、損害信譽、不當贈品、欺罔顯失公平），須與「限制競爭」行為體系（第9-20條：獨占、結合、聯合、妨害公平競爭）區辨分類。"}, "ref": "公平交易法第21條", "id": 47, "chapter": "G1"}, {"year": 104, "qnum": 38, "stem": "依公平交易法之規定，反托拉斯基金設置目的為何？", "options": ["強化聯合行為查處，促進市場競爭秩序之健全發展", "維護交易秩序與消費者利益，避免獨占事業壟斷市場，促進經濟之安定與繁榮", "保障消費者權益，專供損害賠償之用", "檢舉不公平競爭行為獎金之支出"], "answer": "A", "explains": {"A": "正確。反托拉斯基金設置目的為「強化聯合行為查處，促進市場競爭秩序之健全發展」，此為法定明文之設置目的。", "B": "此為公平交易法整體立法目的之描述，非「反托拉斯基金」設置目的之精確表述。", "C": "反托拉斯基金非專供損害賠償之用，此為虛構用途之陷阱。", "D": "檢舉獎金支出僅為基金用途之一部分，非其設置之核心目的本身。"}, "ref": "公平交易法第47條之1", "id": 48, "chapter": "G1"}, {"year": 104, "qnum": 39, "stem": "依公平交易法之規定，對公平交易委員會依本法所為之處分或決定不服者，應依下列何種方式處理？", "options": ["依法申請調處", "直接適用行政訴訟程序", "依法提起司法訴訟", "申請仲裁"], "answer": "B", "explains": {"A": "申請調處非法定救濟途徑，此為虛構程序之陷阱。", "B": "正確。對公平會依本法所為之處分或決定不服者，「直接適用行政訴訟程序」（不須先經訴願程序），此為特殊救濟途徑，全科高頻。", "C": "「司法訴訟」是泛稱，可能包含民事訴訟；本法規定的救濟途徑是行政訴訟，所以C用語不精確，不選。", "D": "申請仲裁非本法規定之救濟途徑。"}, "ref": "公平交易法第48條", "id": 49, "chapter": "G1"}];

 if(BXO==='rand')return v.slice().sort(function(a,b){return BXR.get(a)-BXR.get(b)});return v}

function makeCard(q){
 var s=state[q.id],card=document.createElement('div');card.id='q'+q.id;
 card.className='qcard'+(s?(s.correct?' answered-ok done':' answered-ng done'):'');
 var meta=document.createElement('div');meta.className='qmeta';
 meta.innerHTML='<span class="badge">'+q.year+'年第'+q.qnum+'題</span><span class="badge">'+q.chapter+'</span>'+(s?(s.correct?'<span class="badge ok">已答對</span>':'<span class="badge wrong">已答錯</span>'):'');
 card.appendChild(meta);
 var stem=document.createElement('div');stem.className='stem';stem.textContent=q.stem;card.appendChild(stem);
 if(s){var r=document.createElement('div');r.className='res'+(s.correct?' ok':'');r.textContent=(s.correct?'答對了':'答錯了')+'　正解 '+q.answer+(s.correct?'':'（你選 '+s.chosen+'）');card.appendChild(r);
  var hn=document.createElement('div');hn.className='hn';hn.textContent='點每個選項可展開／收合說明；上方「全部展開」一次看完';card.appendChild(hn)}
 LB.forEach(function(L,i){var b=document.createElement('button');b.className='opt';
  b.innerHTML='<span class="ltr">'+L+'</span><span class="ob"><span class="tx"></span><span class="bg a">正解</span><span class="bg p">你選的</span><span class="arr">▾</span><div class="nt"></div></span>';
  b.querySelector('.tx').textContent=q.options[i];
  if(s){b.classList.add('disabled');b.querySelector('.nt').textContent=(q.explains&&q.explains[L])||'';
   if(L===q.answer)b.classList.add('correct');else if(L===s.chosen)b.classList.add('chosen-wrong');
   b.onclick=function(){if(EX==='C'||EX==='D')b.classList.toggle('open')}}
  else b.onclick=function(){answer(q,L)};
  card.appendChild(b)});
 if(s){applyOpen(card);
  var ex=document.createElement('div');ex.className='explain-box';
  var v='<div style="margin-bottom:6px"><b>'+(s.correct?'答對了':'答錯了')+'</b></div>';
  LB.forEach(function(L){var ec=L===q.answer?'ok':(L===s.chosen?'ng':'no');v+='<div class="ei"><span class="el '+ec+'">'+L+'</span><span class="eh"></span></div>'});
  ex.innerHTML=v;[].forEach.call(ex.querySelectorAll('.eh'),function(e,i){e.textContent=(q.explains&&q.explains[LB[i]])||''});card.appendChild(ex);
  var ref=document.createElement('div');ref.className='ref';ref.textContent='法規依據：'+q.ref;card.appendChild(ref);
  var tr=document.createElement('div');tr.className='errtag-row show';
  if(!s.correct){['A','B','C'].forEach(function(t){var tb=document.createElement('div');var lab=t==='A'?'A 法條混淆':(t==='B'?'B 粗心':'C 真的不熟');
   tb.className='etag'+(s.tag===t?' on-'+t:'');tb.textContent=lab;
   tb.onclick=function(){s.tag=(s.tag===t)?null:t;saveState(state);try{window.BXREP&&BXREP.tag(q,s.tag||'')}catch(e){}[].forEach.call(tr.children,function(x,j){x.className='etag'+(s.tag===['A','B','C'][j]?' on-'+['A','B','C'][j]:'')})};tr.appendChild(tb)})}
  card.appendChild(tr)}
 return card}
function answer(q,L){if(state[q.id])return;state[q.id]={chosen:L,correct:L===q.answer,tag:null};saveState(state);try{window.BXREP&&BXREP.rec(q,L,L===q.answer)}catch(e){}
 var old=document.getElementById('q'+q.id),nw=makeCard(q);old.replaceWith(nw);updateStats();
 setTimeout(function(){nw.scrollIntoView({behavior:'smooth',block:'nearest'})},30)}
function renderList(){var list=document.getElementById('quizList');list.innerHTML='';
 var items=bxOrd(QUESTIONS.filter(matchesFilter));
 if(!items.length){list.innerHTML='<div class="empty">目前篩選條件下沒有題目。</div>';updateStats();return}
 var last='';items.forEach(function(q){var hk=BXO==='rand'?'':(BXO==='ch'?q.chapter:q.year+' 年');
  if(hk&&hk!==last){var h=document.createElement('div');h.className=BXO==='ch'?'ch-header':'yr-header';h.textContent=hk;list.appendChild(h);last=hk}
  list.appendChild(makeCard(q))});updateStats()}
[].forEach.call(document.querySelectorAll('.fbtn[data-filter]'),function(b){b.onclick=function(){[].forEach.call(document.querySelectorAll('.fbtn[data-filter]'),function(x){x.classList.remove('active')});b.classList.add('active');currentFilter=b.dataset.filter;renderList()}});
document.getElementById('resetBtn').onclick=function(){if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){state={};saveState(state);renderList()}};
function markOrd(){[].forEach.call(document.querySelectorAll('#ords button[data-o]'),function(b){b.className=b.dataset.o===BXO?'on':''});document.getElementById('shuf').style.display=BXO==='rand'?'':'none'}
[].forEach.call(document.querySelectorAll('#ords button[data-o]'),function(b){b.onclick=function(){BXO=b.dataset.o;lsS('bx-ord',BXO);if(BXO==='rand')bxShuffle();markOrd();renderList();window.scrollTo({top:0})}});
document.getElementById('shuf').onclick=function(){bxShuffle();renderList();window.scrollTo({top:0})};
function setEx(m){EX=m;document.body.dataset.ex=m;lsS('bx-ex2',m);[].forEach.call(document.querySelectorAll('.qcard.done'),applyOpen);[].forEach.call(document.querySelectorAll('.exs button[data-m]'),function(b){b.className=b.dataset.m===m?'on':''})}
[].forEach.call(document.querySelectorAll('.exs button[data-m]'),function(b){b.onclick=function(){setEx(b.dataset.m)}});
document.getElementById('ea').onclick=function(){var on=document.body.classList.toggle('allopen');this.textContent=on?'全部收合':'全部展開'};
var th=document.getElementById('th');function isDark(){var t=document.documentElement.dataset.theme;return t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)}
function setTh(m){if(m)document.documentElement.dataset.theme=m;th.textContent=isDark()?'淺色':'深色'}
setTh(lsG('bx-theme')||'light');th.onclick=function(){var n=isDark()?'light':'dark';lsS('bx-theme',n);setTh(n)};
markOrd();setEx(EX);renderChips();renderList();
</script>

#bxfab .bx-hub{width:40px;height:40px;border-radius:50%;background:var(--fp);color:var(--fo);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);text-decoration:none}
