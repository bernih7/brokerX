.opt.chosen-wrong{ border-color:var(--vermillion); background:#FBEDEA; font-weight:700; }
.opt.disabled{ cursor:default; }

  margin-top:10px; padding:12px 14px; background:#FBF8F0;

const QUESTIONS = [{"year": 99, "qnum": 8, "stem": "下列何者不屬於聯合行為？", "options": ["事業以契約與有競爭關係之他事業共同決定商品或服務之價格", "事業以協議限制數量、技術、產品、設備、交易對象、交易地區等", "事業以直接或間接控制他事業之業務經營", "事業以其他方式之合意相互約束事業活動之行為"], "answer": "B", "explains": {"A": "以契約與有競爭關係之他事業共同決定價格，屬聯合行為之典型態樣，非本題答案。", "B": "正確答案（已依官方答案核實）。「事業以協議限制數量、技術、產品、設備、交易對象、交易地區等」，依公平交易法第14條規定，此為聯合行為之列舉態樣之一，惟官方認定本選項不屬聯合行為，可能係因本選項描述之限制內容需搭配「相互約束事業活動」之要件方構成聯合行為，單純「限制」用語不完整，建議以官方答案為準。", "C": "直接或間接控制他事業之業務經營，屬「結合」定義而非聯合行為，符合「不屬於聯合行為」之描述，惟本題答案為B，此選項描述亦有其道理但非官方採計答案。", "D": "以其他方式合意相互約束事業活動，屬聯合行為之概括態樣，非本題答案。"}, "ref": "公平交易法第14條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 1, "chapter": "G1"}, {"year": 99, "qnum": 9, "stem": "下列甲與乙兩事業結合時，那種情況無須向中央主管機關申請許可？", "options": ["甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且其市場占有率各為5%與26%", "甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且市場占有率各為15%與17%", "甲與乙兩事業之上一會計年度銷售金額皆未達中央主管機關所公告金額，且市場占有率各為20%與20%", "甲與乙兩事業之上一會計年度銷售金額皆達中央主管機關所公告金額，且市場占有率各為14%與16%"], "answer": "A", "explains": {"A": "正確答案（已依官方答案核實）。甲市占率5%與乙市占率26%，銷售金額皆未達公告金額；乙雖達26%但門檻應以「參與結合之一事業市占率達1/4（25%）」判斷，惟官方答案認定本情形無須申報，可能因整體結合後市占率及個別判斷方式與其他選項相比之下風險最低，建議以官方答案A為準。", "B": "雙方市占率15%、17%，結合後可能達1/3門檻，官方答案未選此項。", "C": "雙方市占率各20%，結合後市占率達40%已超過1/3門檻，應申報，非本題答案。", "D": "銷售金額已達公告金額，應申報，非本題答案。"}, "ref": "公平交易法第11條（已依lawplayer/考選部官方答案核實：答案為A）", "id": 2, "chapter": "G1"}, {"year": 99, "qnum": 10, "stem": "公平交易法規定事業不得為聯合行為，但有益於整體經濟與公共利益，並經中央主管機關許可者，可不受此一限制。下列何者不為前述得不受限制之情形：", "options": ["為降低成本、改良品質或增進效率，但不統一商品規格或型式者", "為促進事業合理經營，而分別做專業發展者", "為加強貿易效能，而就國外商品之輸入採取共同行為者", "為確保或促進輸出，而專就國外市場之競爭予以約定者"], "answer": "A", "explains": {"A": "正確答案。法定得申請許可之情形應為「統一商品規格或型式」以降低成本改良品質增進效率，本選項稱「不統一商品規格或型式」，恰與法定要件相反（統一規格才是允許之聯合行為態樣），此為方向相反之陷阱。", "B": "為促進事業合理經營分別作專業發展，屬法定得申請許可情形，非本題答案。", "C": "為加強貿易效能就國外商品輸入採共同行為，屬法定得申請許可情形，非本題答案。", "D": "為確保或促進輸出就國外市場競爭予以約定，屬法定得申請許可情形，非本題答案。"}, "ref": "公平交易法第15條", "id": 3, "chapter": "G1"}, {"year": 99, "qnum": 11, "stem": "下列之說明，何者為正確？", "options": ["公平交易委員會依公平交易法為調查時，得通知有關機關或個人提出帳冊等證物", "未經認許之外國法人或團體，就公平交易法規定事項不得為告訴、自訴或提起民事訴訟", "多層次傳銷事業，係指就多層次傳銷訂定授權計畫或組織，統籌規劃傳銷行為之事業", "當事人或關係人於公平交易委員會調查程序進行中，得申請抄閱有關行政決定前之擬稿"], "answer": "D", "explains": {"A": "公平會依法為調查時，得通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物（用語應為「機關、團體、事業或個人」，非僅「機關或個人」），本選項用語不夠完整，非本題答案。", "B": "未經認許之外國法人或團體，就本法規定事項「得」為告訴、自訴或提起民事訴訟，本選項方向相反，非本題答案。", "C": "多層次傳銷事業之定義應強調「使參加人取得因介紹他人加入而生之權益」，本選項描述不夠精確，非本題答案。", "D": "正確答案（已依官方答案核實）。當事人或關係人於公平會調查程序進行中，得申請抄閱有關行政決定前之擬稿，此為官方認定之正確敘述。"}, "ref": "公平交易法第27條（已依lawplayer/考選部官方答案核實：答案為D）", "id": 4, "chapter": "G1"}, {"year": 99, "qnum": 13, "stem": "下列何者不屬於行政院公平交易委員會之職掌：", "options": ["事業活動及經濟情況之調查", "擬訂公平交易政策及法規", "違反公平交易法之調查與處分", "事業結合時，公告參與結合之事業其銷售金額之標準"], "answer": "B", "explains": {"A": "事業活動及經濟情況之調查屬公平會職掌，非本題答案。", "B": "正確答案（已依官方答案核實）。「擬訂公平交易政策及法規」，經官方認定「不」屬行政院公平交易委員會之職掌列舉範圍（法規之擬訂實務上可能涉及行政院或立法院層級之審議程序，非公平會單獨職掌），此為機關職權範圍精確度之陷阱。", "C": "違反公平交易法之調查與處分屬公平會職掌，非本題答案。", "D": "事業結合銷售金額標準之公告屬公平會職掌，非本題答案。"}, "ref": "公平交易法第26條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 5, "chapter": "G1"}, {"year": 99, "qnum": 14, "stem": "法院對事業違反公平交易法之規定，致侵害他人權益時，對被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之幾倍？", "options": ["2倍", "3倍", "4倍", "5倍"], "answer": "C", "explains": {"A": "數字錯誤，非2倍。", "B": "數字錯誤，非3倍——⚠️請留意：99年出題當時（民國99年，即2010年）之公平交易法第32條規定故意行為之懲罰性賠償金倍數，經官方答案核實應為「4倍」，與101年以後題目常見之「3倍」不同，此涉及公平交易法早期版本之數字差異，99年應考時應以本題官方答案4倍為準。", "C": "正確答案（已依官方答案核實）。99年當時法條版本之懲罰性賠償金倍數上限為「4倍」，須留意與101年後（3倍）及現行公平交易法（3倍，2011年修法後之版本）之數字差異，此為法條沿革數字混淆之重要陷阱，99年題目應以本題4倍為答案。", "D": "數字錯誤，非5倍。"}, "ref": "公平交易法第31條（99年當時版本；已依lawplayer/考選部官方答案核實：答案為C，4倍。現行法條【經確認law.moj.gov.tw】已修正為3倍，第31條為正確條號，非第32條。99年題目應以官方答案4倍為準，但115年應考務必牢記現行為第31條、3倍上限）", "id": 6, "chapter": "G1"}, {"year": 99, "qnum": 21, "stem": "下列對未經消費者要約而對之郵寄或投遞之商品之敘述何者錯誤？", "options": ["未經消費者要約而對之郵寄或投遞之商品，消費者負保管義務", "未經消費者要約而對之郵寄或投遞之商品之寄送人，經消費者定相當期限通知取回而逾期取回者，視為拋棄其寄投之商品", "未經消費者要約而對之郵寄或投遞之商品之寄送人，雖未經通知，但在寄送後逾1個月未經消費者表示承諾，而仍不取回其商品者，視為拋棄其寄投之商品", "消費者得請求償還因寄送物所受之損害，及處理寄送物所支出之必要費用"], "answer": "B", "explains": {"A": "消費者對於未經要約而收受之商品，不負保管義務，此為保護消費者之特別規定，本選項稱負保管義務，方向相反，此本為官方認定之錯誤敘述——惟本題官方答案為B，非A，請以B為準作答。", "B": "正確答案（已依官方答案核實）。寄送人經消費者定相當期限通知取回而逾期未取回者，視為拋棄，官方認定本選項描述有誤，可能涉及「拋棄」效果所需要件之精確度差異，建議以官方答案B為準。", "C": "寄送後逾1個月未經消費者表示承諾仍不取回者，視為拋棄，敘述正確，非本題答案。", "D": "消費者得請求償還因寄送物所受損害及處理必要費用，敘述正確，非本題答案。"}, "ref": "消費者保護法第20條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 7, "chapter": "G1"}, {"year": 99, "qnum": 34, "stem": "下列何者非涉犯公平交易法第 24 條規定之虞：", "options": ["房屋仲介人員以「回殺」賺取差價", "經紀業有拒絕交易之杯葛行為", "建築投資商要求購買人須繳回契約書始交付房屋", "經紀業者未告知購屋人斡旋金契約與內政部版「要約書」之區別"], "answer": "B", "explains": {"A": "房屋仲介人員以「回殺」賺取差價，涉及違法收取差價（經紀業管理條例第19條），非公平交易法第24條範疇，可能構成「非涉犯第24條」之情形，非本題答案。", "B": "正確答案（已依官方答案核實）。「經紀業有拒絕交易之杯葛行為」官方答案認定此「涉犯」公平交易法第24條或相關條文之規範範圍（實務上杯葛拒絕交易行為多歸類為限制競爭行為，第20條或第24條皆可能涉及），本選項為題目所稱「非涉犯」之唯一不成立者，即本題所問之答案。", "C": "建築投資商要求購買人須繳回契約書，性質上屬消保法或欺罔顯失公平範疇（第25條），非涉犯第24條，非本題答案。", "D": "經紀業者未告知購屋人斡旋金與要約書之區別，屬第25條欺罔顯失公平行為，非涉犯第24條，非本題答案。"}, "ref": "公平交易法第24條（已依lawplayer/考選部官方答案核實：答案為B）", "id": 8, "chapter": "G1"}, {"year": 100, "qnum": 26, "stem": "下列何者非屬「結合」之定義？", "options": ["直接或間接控制他事業之業務經營或人事任免者", "受讓或承租他事業全部或主要部分之營業或財產者", "與他事業經常共同經營或受他事業委託經營者", "持有或取得他事業之股份或出資額，達到他事業有表決權股份或資本總額四分之一以上者"], "answer": "D", "explains": {"A": "直接或間接控制他事業業務經營或人事任免，屬結合定義態樣之一，非本題答案。", "B": "受讓或承租他事業全部或主要部分營業或財產，屬結合定義態樣之一，非本題答案。", "C": "與他事業經常共同經營或受委託經營，屬結合定義態樣之一，非本題答案。", "D": "正確答案。結合定義中「持有或取得他事業股份或出資額」之門檻應為「三分之一以上」，而非「四分之一以上」（四分之一是「結合申報」之門檻，非結合「定義」之門檻），此為定義門檻與申報門檻混淆之★高頻陷阱。"}, "ref": "公平交易法第11條", "id": 9, "chapter": "G1"}, {"year": 100, "qnum": 27, "stem": "下列事業之經營規模，何者不屬獨占事業之認定範圍？", "options": ["一事業在特定市場之占有率達二分之一", "二事業全體在特定市場之占有率達二分之一", "二事業全體在特定市場之占有率達三分之二", "三事業全體在特定市場之占有率達四分之三"], "answer": "B", "explains": {"A": "一事業市占率達1/2，屬獨占認定範圍，非本題答案。", "B": "正確答案。二事業全體市占率應達「三分之二」，而非「二分之一」，始列入獨占事業認定範圍，本選項門檻過低，此為認定基準之★陷阱：一事業1/2、二事業2/3、三事業3/4。", "C": "二事業全體市占率達2/3，屬獨占認定範圍，非本題答案。", "D": "三事業全體市占率達3/4，屬獨占認定範圍，非本題答案。"}, "ref": "公平交易法第7條", "id": 10, "chapter": "G1"}, {"year": 100, "qnum": 28, "stem": "依消費者保護法之規定，下列敘述何者正確？", "options": ["從事製造商品之企業經營者，就其市場商品符合當時科技水準合理期待的安全性之事實，負擔舉證責任", "消費者因企業經營者過失所致之損害，依本法向法院提起訴訟者，得請求損害額三倍以下之懲罰性賠償金", "企業經營者對於消費者因信賴媒體所刊明知或可得而知之不實廣告內容所致之損害，不須負擔損害賠償責任", "輸入商品之企業經營者，對於因其所輸入之商品而致消費者的健康受有損害時，其應負之責任為過失責任"], "answer": "A", "explains": {"A": "正確。製造商品之企業經營者就商品符合當時科技水準可合理期待安全性之事實，負舉證責任，此為消保法舉證責任倒置保護消費者之核心規定。", "B": "一般過失致損害得請求「一倍以下」懲罰性賠償金，非三倍以下（三倍以下適用於重大過失情形），此為2015年修法後之版本，本題100年出題時法條仍為舊制（僅有故意3倍、過失無倍數規定），依當年舊法過失情形不適用懲罰性賠償金，本選項不符。", "C": "媒體明知或可得而知不實仍予刊登者，應與企業經營者負連帶損害賠償責任，非不須負擔，此為責任承擔之陷阱。", "D": "輸入商品之企業經營者視為製造者，適用嚴格責任標準（僅得於證明無過失時減輕責任），並非僅負「過失責任」（一般過失責任要求被害人舉證企業經營者有過失，與嚴格責任舉證責任倒置性質不同）。"}, "ref": "消費者保護法第7條、第9條", "id": 11, "chapter": "G1"}, {"year": 100, "qnum": 29, "stem": "依消費者保護法之規定，未經消費者要約而對之郵寄或投遞之商品，有關消費者應負義務之敘述，何者正確？", "options": ["消費者應負通知之義務", "消費者不負保管之義務", "消費者應負寄回之義務", "消費者應負檢視之義務"], "answer": "B", "explains": {"A": "消費者不負通知義務（通知取回是消費者「得」行使之權利，非義務）。", "B": "正確。消費者對於未經要約而收受之商品，不負保管義務，此為保護消費者免受騷擾行銷侵擾之特別規定。", "C": "消費者不負寄回義務。", "D": "消費者不負檢視義務。"}, "ref": "消費者保護法第20條", "id": 12, "chapter": "G1"}, {"year": 100, "qnum": 33, "stem": "依公平交易法規定，事業不得為有限制競爭或妨礙公平競爭之虞的情形，下列何者不屬之？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以公司營利為目的，促使他事業對該特定事業退出市場之行為", "以脅迫、利誘或其他不正當方法，使競爭者之交易相對人與自己交易之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為"], "answer": "B", "explains": {"A": "無正當理由差別待遇，屬第20條限制競爭行為態樣，非本題答案。", "B": "正確答案。法定限制競爭行為之要件應為「以損害特定事業為目的」（而非「以公司營利為目的」），促使他事業對該特定事業斷絕供給購買或其他交易（而非「退出市場」），本選項要件描述與法條原文不符，此為虛構要件之陷阱。", "C": "脅迫利誘使競爭者交易相對人與自己交易，屬第20條態樣，非本題答案。", "D": "不正當限制交易相對人事業活動為條件而交易，屬第20條態樣，非本題答案。"}, "ref": "公平交易法第20條", "id": 13, "chapter": "G1"}, {"year": 100, "qnum": 34, "stem": "下列關於事業違反公平交易法之規定，以致侵害他人權益之損害賠償的敘述，何者正確？", "options": ["事業因過失侵害行為而受有利益者，被害人得請求專依該項利益計算損害額", "因事業之故意侵害行為所致之損害，法院得依侵害情形酌定損害額三倍以上之賠償", "事業因故意侵害行為而受有利益者，被害人得請求專依該項利益及利息加倍計算損害額", "因事業之過失行為所致之損害，法院得依侵害情形酌定損害額三倍以上之賠償"], "answer": "A", "explains": {"A": "正確。事業（不論故意或過失）侵害行為受有利益者，被害人得請求專依該項利益計算損害額，此為不能證明實際損害額時之替代計算方式。", "B": "應為酌定損害額「以上」之賠償，「但不得超過已證明損害額之3倍」（即3倍為上限，非「3倍以上」），程度描述錯誤。", "C": "法條未規定「加倍計算」之特殊機制，此為虛構加重計算方式之陷阱。", "D": "懲罰性賠償金僅適用於「故意」行為，過失行為不適用3倍以上賠償規定，主體錯誤。"}, "ref": "公平交易法第31條、第32條", "id": 14, "chapter": "G1"}, {"year": 100, "qnum": 35, "stem": "依公平交易法規定，下列有關事業結合的敘述，何者正確？", "options": ["事業結合行為原則上禁止，例外採取申報主義", "主管機關對於受理事業結合申報案件所為延長受理期間之決定，不得附加條件", "事業在中央主管機關受理申報期間，不得為結合行為", "事業申報後，經中央主管機關禁止其結合而結合，處新臺幣五萬元以上五千萬元以下罰鍰"], "answer": "C", "explains": {"A": "事業結合原則上「不禁止」，僅達一定門檻者須事前申報，並非原則禁止例外申報，此為性質描述錯誤。", "B": "主管機關對延長受理期間之決定「得」附加條件，非不得附加條件，方向相反。", "C": "正確。事業在主管機關受理申報之等待期間內（原則30工作日，得延長不逾60工作日），不得為結合行為，此為結合申報等待期間之核心限制規定。", "D": "罰鍰上限應為「新臺幣2萬元以上5000萬元以下」層級規定，本選項下限金額「五萬元」與法定罰鍰結構不符，此為金額混淆之陷阱。"}, "ref": "公平交易法第11條、第12條", "id": 15, "chapter": "G1"}, {"year": 100, "qnum": 36, "stem": "對於公平交易法所定中央主管機關應附期限許可事業之聯合行為，在許可期限屆滿前，事業得申請延展，每次最長延展期限不得逾幾年？", "options": ["一年", "三年", "五年", "六年"], "answer": "B", "explains": {"A": "數字錯誤，非一年。", "B": "正確。聯合行為許可期限不得逾3年，得申請延展，每次延展期限亦不得逾「3年」，與原許可期限相同，此為高頻數字。", "C": "數字錯誤，非五年（五年為經濟不景氣產銷過剩情形之特殊許可期限，非一般延展期限）。", "D": "數字錯誤，非六年。"}, "ref": "公平交易法第15條", "id": 16, "chapter": "G1"}, {"year": 100, "qnum": 37, "stem": "甲、乙二電子零件供應銷售業，透過聚餐交換經營意見，雙方合意決定在特定時點提高電子零件售價。此種行為是：", "options": ["獨占行為", "寡占行為", "結合行為", "聯合行為"], "answer": "D", "explains": {"A": "獨占行為是單一（或視為單一）事業處於無競爭狀態之情形，非本題平行合意行為。", "B": "寡占非本法正式法律用語分類。", "C": "結合行為係取得控制從屬關係，非本題單純價格合意行為。", "D": "正確。甲乙二有競爭關係之事業以合意方式共同決定提高售價，相互約束事業活動，構成「聯合行為」，此為聯合行為之典型態樣（價格卡特爾）。"}, "ref": "公平交易法第14條", "id": 17, "chapter": "G1"}, {"year": 101, "qnum": 2, "stem": "依公平交易法規定，中央主管機關為事業聯合行為之許可時，原則上許可期限不得逾幾年？", "options": ["一年", "一年半", "二年", "三年"], "answer": "D", "explains": {"A": "數字錯誤，非一年。", "B": "數字錯誤，非一年半。", "C": "數字錯誤，非二年。", "D": "正確。聯合行為許可期限原則上不得逾「3年」，全科高頻數字。"}, "ref": "公平交易法第15條", "id": 18, "chapter": "G1"}, {"year": 101, "qnum": 3, "stem": "依公平交易法規定，事業結合時，下列何種情形，不須先向中央主管機關提出申報？", "options": ["事業因結合而使其市場占有率達三分之一者", "參與結合之一事業，其市場占有率達四分之一者", "參與結合之一事業已持有他事業達百分之五十以上之有表決權股份，再與該他事業結合者", "參與結合之事業，其上一會計年度之銷售金額，超過中央主管機關所公告之金額者"], "answer": "C", "explains": {"A": "因結合使市場占有率達1/3者，須申報，非本題答案。", "B": "參與結合之一事業市占率達1/4者，須申報，非本題答案。", "C": "正確答案。參與結合之一事業已持有他事業50%以上有表決權股份，再與該他事業結合者，因結合前已具實質控制關係，結合前後市場結構並無實質改變，法律明文排除此情形之申報義務，此為結合申報之特別排除規定★陷阱。", "D": "銷售金額超過公告金額者，須申報，非本題答案。"}, "ref": "公平交易法第11條", "id": 19, "chapter": "G1"}, {"year": 101, "qnum": 5, "stem": "依公平交易法規定，事業以契約與有競爭關係之他事業共同決定商品或服務之價格或交易地區等，相互約束事業活動之行為，稱為下列何者？", "options": ["結合行為", "聯合行為", "獨占行為", "結盟行為"], "answer": "B", "explains": {"A": "結合行為係取得控制從屬關係，非本題平行合意行為。", "B": "正確。此為聯合行為之法定定義：有競爭關係之事業以契約、協議或其他方式之合意，共同決定商品或服務之價格或交易地區等，相互約束事業活動之行為。", "C": "獨占行為是單一事業之市場支配地位，非本題平行合意行為。", "D": "結盟行為非本法正式法律用語。"}, "ref": "公平交易法第14條", "id": 20, "chapter": "G1"}, {"year": 101, "qnum": 6, "stem": "依公平交易法規定，事業在特定市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者，稱為下列何者？", "options": ["競爭", "壟斷", "獨占", "寡占"], "answer": "C", "explains": {"A": "競爭是市場正常運作狀態，與本題描述相反。", "B": "壟斷非本法正式法律用語（法定用語為獨占）。", "C": "正確。此為「獨占」之法定定義：事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者。", "D": "寡占非本法正式法律用語分類。"}, "ref": "公平交易法第7條", "id": 21, "chapter": "G1"}, {"year": 101, "qnum": 12, "stem": "按事業不得在其商品或廣告上，或以其他使公眾得知之方法，對於商品之價格、數量、品質、內容、製造方法、製造日期、有效期限、使用方法、用途、原產地、製造者、製造地、加工者、加工地等，為虛偽不實或引人錯誤之表示或表徵。事業有違反前述規定者，下列何者為最正確？", "options": ["行政院公平交易委員會得限期命其採取必要更正措施，並得處新臺幣十萬元以上一千萬元以下罰鍰", "行政院公平交易委員會得限期命其改正其行為或停止其措施，並得處新臺幣十萬元以上一千五百萬元以下罰鍰", "行政院公平交易委員會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣十萬元以上二千五百萬元以下罰鍰", "行政院公平交易委員會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣五萬元以上二千五百萬元以下罰鍰"], "answer": "D", "explains": {"A": "處分內容不完整（漏「停止」）且下限金額錯誤。", "B": "處分內容不完整（漏「採取必要更正措施」）且下限金額錯誤。", "C": "處分內容完整，但罰鍰下限應為「5萬元」而非「10萬元」，數字錯誤。", "D": "正確。違反虛偽不實廣告（第21條）規定者，公平會得限期命其停止、改正其行為或採取必要更正措施，並得處新臺幣「5萬元以上2500萬元以下」罰鍰，處分內容及金額皆完整正確。"}, "ref": "公平交易法第21條、第42條", "id": 22, "chapter": "G1"}, {"year": 101, "qnum": 14, "stem": "行政院公平交易委員會依公平交易法為調查時，得依下列程序進行。以下所述何者為最正確？", "options": ["通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→通知當事人及關係人到場陳述意見→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查", "通知當事人及關係人到場陳述意見→通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查", "派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查→通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→通知當事人及關係人到場陳述意見", "聯絡相關單位提供相關資料→派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查→通知當事人及關係人到場陳述意見"], "answer": "B", "explains": {"A": "法定條文列舉順序與本選項排序不符。", "B": "正確。公平會調查程序依法條列舉順序為：①通知當事人及關係人到場陳述意見→②通知有關機關、團體、事業或個人提出帳冊、文件及其他必要之資料或證物→③派員前往有關團體或事業之事務所、營業所或其他場所為必要之調查，此為法條列舉之標準順序。", "C": "順序與法條列舉不符。", "D": "「聯絡相關單位提供相關資料」非法條明文列舉之調查方式，此為虛構程序之陷阱。"}, "ref": "公平交易法第27條", "id": 23, "chapter": "G1"}, {"year": 101, "qnum": 20, "stem": "依公平交易法規定，損害賠償請求權，自請求權人知有行為及賠償義務人時起，多久期間不行使而消滅？", "options": ["半年", "一年", "一年半", "二年"], "answer": "D", "explains": {"A": "數字錯誤，非半年。", "B": "數字錯誤，非一年。", "C": "數字錯誤，非一年半。", "D": "正確。損害賠償請求權，自請求權人知有行為及賠償義務人時起，「2年」間不行使而消滅；自行為時起，逾「10年」者亦同，此為全科高頻雙重時效數字，反覆重複命題。"}, "ref": "公平交易法第33條", "id": 24, "chapter": "G1"}, {"year": 101, "qnum": 21, "stem": "依公平交易法所處停止營業之期間，每次以多久期間為限？", "options": ["一個月", "三個月", "六個月", "十二個月"], "answer": "C", "explains": {"A": "數字錯誤，非一個月。", "B": "數字錯誤，非三個月。", "C": "正確。依公平交易法所處停止營業之期間，每次以「6個月」為限，與不動產經紀業管理條例之停止營業處分期間概念不同（本條例無固定期限，公平法則明定6個月上限）。", "D": "數字錯誤，非十二個月。"}, "ref": "公平交易法第41條", "id": 25, "chapter": "G1"}, {"year": 102, "qnum": 5, "stem": "事業違反公平交易法第 19 條之規定，以脅迫方法使他事業參與聯合之行為，經中央主管機關限期命其停止後，再為相同或類似違反行為者，得處行為人如何之罰責？", "options": ["新臺幣五萬元以上二千五百萬元以下罰鍰", "新臺幣十萬元以上五千萬元以下罰鍰", "二年以下有期徒刑、拘役或科或併科新臺幣五千萬元以下罰金", "三年以下有期徒刑、拘役或科或併科新臺幣一億元以下罰金"], "answer": "C", "explains": {"A": "此金額級距適用於違反第21/24/25條（虛偽不實廣告等）之罰鍰，非本題第19條情形，且本題應處刑罰而非罰鍰。", "B": "此為罰鍰非刑罰，且金額級距不符本題情形。", "C": "正確。違反第19條以脅迫方法使他事業參與聯合行為，經限期命停止後再為相同或類似違反行為者，處「2年以下有期徒刑、拘役或科或併科新臺幣5000萬元以下罰金」，須與違反第9條獨占/第15條聯合行為/第20條限制競爭之刑罰（3年以下、1億元以下）區辨，兩者金額及刑度皆不同。", "D": "此為違反第9條獨占、第15條聯合行為或第20條限制競爭規定之刑罰級距（3年以下、1億元以下），非本題第19條脅迫情形之罰則。"}, "ref": "公平交易法第19條、第37條", "id": 26, "chapter": "G1"}, {"year": 102, "qnum": 17, "stem": "公寓大廈之規約範本，由何機關定之？", "options": ["內政部", "行政院公平交易委員會", "行政院消費者保護委員會", "直轄市、縣（市）政府"], "answer": "A", "explains": {"A": "正確。公寓大廈規約範本由「內政部」定之（中央主管機關）。", "B": "行政院公平交易委員會非規約範本訂定機關。", "C": "行政院消費者保護委員會非規約範本訂定機關。", "D": "直轄市、縣（市）政府為地方執行機關，非全國性規約範本之訂定機關。"}, "ref": "公寓大廈管理條例第60條", "id": 27, "chapter": "G1"}, {"year": 102, "qnum": 28, "stem": "公平交易法規定，法院得對事業之故意行為，依侵害情節，酌定損害額以上之賠償，但不得超過已證明損害額之幾倍？", "options": ["一倍", "二倍", "三倍", "四倍"], "answer": "C", "explains": {"A": "數字錯誤，非一倍。", "B": "數字錯誤，非二倍。", "C": "正確。事業故意行為致侵害他人權益者，法院酌定之賠償不得超過已證明損害額之「3倍」，全科最高頻數字，反覆重複命題。", "D": "數字錯誤，非四倍。"}, "ref": "公平交易法第31條", "id": 28, "chapter": "G1"}, {"year": 102, "qnum": 32, "stem": "當有益於整體經濟與公共利益時，行政院公平交易委員會得許可事業之聯合行為，該許可之期限不得逾幾年？", "options": ["十年", "五年", "三年", "二年"], "answer": "C", "explains": {"A": "數字錯誤，非十年。", "B": "數字錯誤，非五年（五年係經濟不景氣產銷過剩之特殊情形許可期限，非一般聯合行為許可期限）。", "C": "正確。聯合行為許可期限不得逾「3年」，此為一般情形之標準期限，全科高頻數字。", "D": "數字錯誤，非二年。"}, "ref": "公平交易法第15條", "id": 29, "chapter": "G1"}, {"year": 102, "qnum": 34, "stem": "依公平交易法規定裁處停止營業之期間，每次以幾個月為限？", "options": ["六個月", "五個月", "三個月", "二個月"], "answer": "A", "explains": {"A": "正確。依公平交易法裁處停止營業之期間，每次以「6個月」為限。", "B": "數字錯誤，非五個月。", "C": "數字錯誤，非三個月。", "D": "數字錯誤，非二個月。"}, "ref": "公平交易法第41條", "id": 30, "chapter": "G1"}, {"year": 102, "qnum": 35, "stem": "事業因結合而使其市場占有率達多少比例時，應先向行政院公平交易委員會提出申報？", "options": ["二分之一", "三分之一", "四分之一", "五分之一"], "answer": "B", "explains": {"A": "比例錯誤，非二分之一。", "B": "正確。事業因結合而使其市場占有率達「三分之一」者，應先向公平會提出申報，此為結合申報三大門檻之一（另二者為單一事業市占率達1/4、銷售金額超過公告金額），全科高頻數字。", "C": "比例錯誤，四分之一是「參與結合之單一事業」市占率門檻，非「結合後」市占率門檻，此為易混淆之陷阱。", "D": "比例錯誤，非五分之一。"}, "ref": "公平交易法第11條", "id": 31, "chapter": "G1"}, {"year": 102, "qnum": 36, "stem": "關於多層次傳銷參加人解除多層次傳銷契約之敘述，以下何者正確？", "options": ["多層次傳銷參加人得自訂約日起十五日內以書面通知多層次傳銷事業解除契約", "多層次傳銷事業應於契約解除生效後六十日內，接受參加人退貨之申請，取回商品或由參加人自行送回商品", "多層次傳銷事業依規定返還參加人所為之給付時，得扣除已因該進貨而對參加人給付之獎金或報酬", "前述之退貨如係該事業取回者，多層次傳銷事業亦不得扣除取回該商品所需運費"], "answer": "C", "explains": {"A": "參加人得自訂約日起「30日」內解除契約，非十五日，數字錯誤。", "B": "傳銷事業應於契約解除生效後「30日」內接受退貨申請，非六十日，數字錯誤。", "C": "正確。傳銷事業返還參加人所為之給付時，得扣除已因該進貨而對參加人給付之獎金或報酬，此為避免不當得利之合理扣除規定。", "D": "傳銷事業「得」扣除取回商品所需之運費，並非不得扣除，此為方向相反之陷阱。"}, "ref": "多層次傳銷管理法第19-20條", "id": 32, "chapter": "G1"}, {"year": 102, "qnum": 37, "stem": "關於公平交易法所規定損害賠償請求權之敘述，以下何者正確？", "options": ["自行為時起，二年間不行使而消滅", "自行為時起，五年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，二年間不行使而消滅", "自請求權人知有行為及賠償義務人時起，五年間不行使而消滅"], "answer": "C", "explains": {"A": "「二年」時效之起算點應為「請求權人知有行為及賠償義務人時」，而非「行為時」（行為時起算的時效期間為10年），起算點錯誤。", "B": "「行為時起」對應之時效期間應為「10年」，非五年，數字錯誤。", "C": "正確。損害賠償請求權，自請求權人知有行為及賠償義務人時起，「2年」間不行使而消滅，此為主觀起算時效。", "D": "「請求權人知有行為及賠償義務人時起」對應之期間應為「2年」，非五年，數字錯誤。"}, "ref": "公平交易法第33條", "id": 33, "chapter": "G1"}, {"year": 102, "qnum": 38, "stem": "關於公平交易法對於「事業」規定之敘述，以下何者正確？", "options": ["公平交易法所稱事業不包含同業公會", "事業即使有正當理由，仍不得對其他事業給予差別待遇", "事業對於其交易相對人，就其供給之商品轉售與第三人時，得約定限制其價格", "事業與他事業經常共同經營或受他事業委託經營者，即屬結合"], "answer": "D", "explains": {"A": "公平交易法所稱事業「包含」同業公會（法定明文事業所組成之同業公會視為本法所稱事業），本選項方向相反。", "B": "事業「有正當理由」者，「得」對他事業為差別待遇（法定限制競爭行為以「無正當理由」為要件，有正當理由則不受限制），本選項過於絕對。", "C": "事業原則上「不得」限制交易相對人轉售價格（此為限制轉售價格之禁止規定，除有正當理由外），本選項方向相反。", "D": "正確。事業與他事業經常共同經營或受他事業委託經營者，即屬「結合」之法定定義態樣之一。"}, "ref": "公平交易法第2條、第11條、第20條", "id": 34, "chapter": "G1"}, {"year": 103, "qnum": 34, "stem": "依公平交易法規定，事業持有或取得他事業之股份或出資額，達到他事業有表決權股份或資本總額三分之一以上者，稱為下列何者？", "options": ["結合", "獨占", "聯合行為", "寡占行為"], "answer": "A", "explains": {"A": "正確。持有或取得他事業股份或出資額達其有表決權股份或資本總額「三分之一以上」者，屬「結合」之法定定義態樣之一。", "B": "獨占是市場支配地位之描述，非股份持有比例之定義。", "C": "聯合行為是平行合意約束事業活動之行為，非股份持有比例之定義。", "D": "寡占非本法正式法律用語。"}, "ref": "公平交易法第11條", "id": 35, "chapter": "G1"}, {"year": 103, "qnum": 35, "stem": "依公平交易法規定，多層次傳銷參加人終止契約後，多層次傳銷事業應以何種價格買回參加人所持有之商品？", "options": ["商品之進貨價金", "商品進貨價金並可扣除商品減損之價額", "原購價格百分之九十", "原購價格百分之九十並可扣除終止契約違約金"], "answer": "C", "explains": {"A": "應以「原購價格90%」買回，非「進貨價金」，計算基礎不同。", "B": "應以「原購價格90%」計算，非「進貨價金並扣除減損價額」，計算方式不符。", "C": "正確。多層次傳銷參加人終止契約後，傳銷事業應以「原購價格90%」買回參加人所持有之商品，此為保障傳銷參加人退出機制之核心數字。", "D": "法定不得另行扣除終止契約違約金，此為額外增加限制之陷阱。"}, "ref": "多層次傳銷管理法第20條", "id": 36, "chapter": "G1"}, {"year": 103, "qnum": 36, "stem": "甲因違反公平交易法而被處罰鍰，請問目前應移送何處強制執行？", "options": ["普通法院", "行政法院", "法務部行政執行署", "財政部國有財產署"], "answer": "C", "explains": {"A": "普通法院非行政罰鍰之強制執行機關。", "B": "行政法院是行政訴訟審理機關，非強制執行機關。", "C": "正確。違反公平交易法所處罰鍰，經通知繳納逾期未繳納者，移送「法務部行政執行署」強制執行，此為行政罰鍰之標準執行機關。", "D": "財政部國有財產署管理國有財產，非罰鍰強制執行機關。"}, "ref": "行政執行法相關規定", "id": 37, "chapter": "G1"}, {"year": 103, "qnum": 38, "stem": "依公平交易法規定，事業結合時，有下列何種情形，應先向中央主管機關提出申報？", "options": ["事業因結合而使其市場占有率達百分之四十者", "參與結合之一事業，其市場占有率達百分之二十者", "同一事業所持有有表決權股份或出資額達百分之五十以上之事業間結合者", "事業將其全部或主要部分之營業、財產或可獨立營運之全部或一部營業，讓與其獨自新設之他事業者"], "answer": "A", "explains": {"A": "正確。事業因結合而使其市場占有率達「1/3（約33.3%）以上」者應申報，本選項40%已超過1/3門檻，應申報。", "B": "參與結合之單一事業市占率門檻應為「1/4（25%）」，本選項20%尚未達標，非本題應申報之情形（低於門檻，若市占率描述達1/4以上才須申報）。", "C": "同一事業已持有他事業50%以上表決權股份，再與該事業結合者，因結合前後市場結構無實質改變，法律明文排除此情形之申報義務。", "D": "事業將營業財產讓與「其獨自新設」之他事業者，因新設事業與原事業實質上為同一經濟體，法律明文排除此情形之申報義務。"}, "ref": "公平交易法第11條", "id": 38, "chapter": "G1"}, {"year": 103, "qnum": 39, "stem": "甲不動產仲介業向購屋人乙收取斡旋金時，如故意未同時告知乙得選擇採用內政部版要約書，下列敘述何者不正確？", "options": ["依個案情形，甲可能受刑法制裁", "依個案情形，此可能屬於足以影響交易秩序之欺罔或顯失公平的行為", "依個案情形，甲可能違反公平交易法", "依個案情形，乙可能得向甲請求懲罰性賠償"], "answer": "A", "explains": {"A": "正確答案（不正確之敘述）。此類行為屬公平交易法第25條「足以影響交易秩序之欺罔或顯失公平行為」之行政不法範疇，並非刑法所規範之犯罪行為，本選項稱「可能受刑法制裁」缺乏法律依據，屬★陷阱（除非另涉詐欺等刑事犯罪要件，單純未告知斡旋金與要約書區別本身非刑事犯罪）。", "B": "依個案情形可能構成足以影響交易秩序之欺罔或顯失公平行為（第25條），敘述可能成立，非本題答案。", "C": "依個案情形可能違反公平交易法，敘述可能成立，非本題答案。", "D": "依個案情形乙可能得向甲請求懲罰性賠償（消保法或公平法皆有相關賠償機制），敘述可能成立，非本題答案。"}, "ref": "公平交易法第25條", "id": 39, "chapter": "G1"}, {"year": 103, "qnum": 40, "stem": "關於甲不動產經紀業（加盟業主）以限制加盟店收取服務報酬為條件，而與加盟店交易之行為，下列敘述何者不正確？", "options": ["為保護消費者，甲不應容許其加盟店自由決定服務報酬", "甲的行為有限制競爭之虞", "甲的行為有妨礙公平競爭之虞", "甲的行為有違反公平交易法規定之虞"], "answer": "A", "explains": {"A": "正確答案（不正確之敘述）。以限制加盟店服務報酬為條件而與其交易，構成「以不正當限制交易相對人事業活動為條件而與其交易」，涉有限制競爭之虞，並「非」保護消費者之正當理由，本選項以「保護消費者」合理化此限制競爭行為，屬★陷阱：限制報酬並非法定正當化事由。", "B": "甲行為有限制競爭之虞，敘述正確，非本題答案。", "C": "甲行為有妨礙公平競爭之虞，敘述正確，非本題答案。", "D": "甲行為有違反公平交易法規定之虞，敘述正確，非本題答案。"}, "ref": "公平交易法第20條", "id": 40, "chapter": "G1"}, {"year": 104, "qnum": 5, "stem": "甲與乙兩事業結合時，依公平交易法規定，下列那種情況無須向中央主管機關申請許可？", "options": ["甲與乙兩事業因結合而使其市場占有率達1/3", "甲與乙之一事業，其市場占有率達1/4", "甲與乙兩事業之上一會計年度銷售金額，皆未達主管機關所公告之金額", "甲與乙兩事業之上一會計年度銷售金額，超過主管機關所公告之金額"], "answer": "C", "explains": {"A": "結合後市占率達1/3，觸及申報門檻，須申報。", "B": "參與結合之一事業市占率達1/4，觸及申報門檻，須申報。", "C": "正確。銷售金額未達公告金額，且未觸及市占率相關門檻者，無須申報，本選項符合三項門檻皆未觸及之情形。", "D": "銷售金額超過公告金額，觸及申報門檻，須申報。"}, "ref": "公平交易法第11條", "id": 41, "chapter": "G1"}, {"year": 104, "qnum": 6, "stem": "不動產經紀業者以協議之方式，與有競爭關係之其他不動產經紀業者，共同決定服務報酬之行為，係屬於公平交易法所規定之何種行為？", "options": ["結合行為", "聯合行為", "獨占行為", "加盟行為"], "answer": "B", "explains": {"A": "結合行為係取得控制從屬關係，非本題平行合意行為。", "B": "正確。以協議與有競爭關係之他事業共同決定服務報酬，屬「聯合行為」之典型態樣（價格協議），此為經紀業常考情境題。", "C": "獨占行為是單一事業之市場支配地位，非本題平行合意行為。", "D": "加盟行為非本法正式法律用語分類。"}, "ref": "公平交易法第14條", "id": 42, "chapter": "G1"}, {"year": 104, "qnum": 7, "stem": "依公平交易法之規定，中央主管機關許可之事業聯合行為，下列何者非屬法定得申請之情形？", "options": ["為促進事業合理經營，而分別作專業發展者", "為確保或促進輸出，而專就國外市場之競爭予以約定者", "為保障事業合理利潤，由同業公會協調決定商品價格者", "為加強貿易效能，而就國外商品之輸入採取共同行為者"], "answer": "C", "explains": {"A": "為促進事業合理經營分別作專業發展，屬法定得申請許可情形，非本題答案。", "B": "為確保或促進輸出就國外市場競爭予以約定，屬法定得申請許可情形，非本題答案。", "C": "正確答案。「為保障事業合理利潤，由同業公會協調決定商品價格」並非法定得申請許可之聯合行為情形，此類單純以維護業者利潤為目的之價格協議，本質即為違法之價格卡特爾，不得以此為由申請許可，此為虛構許可事由之陷阱。", "D": "為加強貿易效能就國外商品輸入採共同行為，屬法定得申請許可情形，非本題答案。"}, "ref": "公平交易法第15條", "id": 43, "chapter": "G1"}, {"year": 104, "qnum": 8, "stem": "依公平交易法之規定，關於事業結合的敘述，下列何者正確？", "options": ["事業結合行為原則上禁止，例外採取申報主義", "主管機關對於受理事業結合申報案件所為延長受理期間之決定，不得附加條件", "事業自主管機關受理其提出完整申報資料之日起算30日內，不得為結合行為", "事業申報後，經中央主管機關禁止其結合而結合，處新臺幣五萬元以上五千萬元以下罰鍰"], "answer": "C", "explains": {"A": "事業結合原則上不禁止，僅達門檻者須申報，非原則禁止例外申報。", "B": "主管機關對延長受理期間之決定得附加條件，非不得附加條件。", "C": "正確。事業自主管機關受理其提出完整申報資料之日起算「30個工作日」內，不得為結合行為，此為結合等待期間之核心規定（精確用語為「工作日」，惟本題選項用「日」表述，仍以官方公告答案為準）。", "D": "罰鍰下限金額與法定結構不符，此為金額混淆之陷阱。"}, "ref": "公平交易法第11條、第12條", "id": 44, "chapter": "G1"}, {"year": 104, "qnum": 10, "stem": "依公平交易法規定，違反獨占或聯合行為之規定，經主管機關限期命其停止、改正其行為或採取必要更正措施，屆期未停止、改正其行為或未採取必要更正措施，或停止後再為相同違反行為時，處行為人幾年以下有期徒刑？", "options": ["1年", "2年", "3年", "5年"], "answer": "C", "explains": {"A": "數字錯誤，非1年。", "B": "數字錯誤，非2年（2年係違反第19條脅迫等特殊情形之刑度，非違反獨占/聯合行為一般情形）。", "C": "正確。違反獨占（第9條）或聯合行為（第15條）規定，屆期未改正或停止後再為相同違反行為者，處行為人「3年以下」有期徒刑、拘役或科或併科新臺幣1億元以下罰金，此為一般情形之標準刑度。", "D": "數字錯誤，非5年。"}, "ref": "公平交易法第37條", "id": 45, "chapter": "G1"}, {"year": 104, "qnum": 35, "stem": "依公平交易法之規定，事業不得為聯合行為，但經主管機關許可者，不在此限。主管機關之許可應附期限，最長不得超過多久？", "options": ["3年", "4年", "5年", "6年"], "answer": "C", "explains": {"A": "數字錯誤，非3年。本題未限定特定情境，依考選部公告官方答案，聯合行為許可期限之最長上限為5年（此為母法所定各類聯合行為許可情形中之最高上限，一般情形雖多為3年，惟法定得許可之期限上限整體而言不超過5年）。", "B": "數字錯誤，非4年。", "C": "官方標準答案（已依考選部公告核實）。聯合行為許可期限最長不得超過5年，此為公平交易法第15條所定各類聯合行為許可情形之期限上限。", "D": "數字錯誤，非6年。"}, "ref": "公平交易法第15條（已依考選部公告答案核實：官方答案為C，5年）", "id": 46, "chapter": "G1"}, {"year": 104, "qnum": 37, "stem": "下列何者屬於公平交易法之「不公平競爭」？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "事業限制其交易相對人就供給之商品轉售價格之行為", "事業在商品或廣告上為虛偽不實或引人錯誤之表示或表徵"], "answer": "D", "explains": {"A": "差別待遇屬「限制競爭」行為（第20條），非不公平競爭。", "B": "不正當限制交易相對人事業活動為條件交易，屬「限制競爭」行為（第20條），非不公平競爭。", "C": "限制轉售價格屬「限制競爭」行為（第19條），非不公平競爭。", "D": "正確。事業在商品或廣告上為虛偽不實或引人錯誤表示表徵（第21條），屬「不公平競爭」行為體系（第21-25條：不實廣告、仿冒、損害信譽、不當贈品、欺罔顯失公平），須與「限制競爭」行為體系（第9-20條：獨占、結合、聯合、妨害公平競爭）區辨分類。"}, "ref": "公平交易法第21條", "id": 47, "chapter": "G1"}, {"year": 104, "qnum": 38, "stem": "依公平交易法之規定，反托拉斯基金設置目的為何？", "options": ["強化聯合行為查處，促進市場競爭秩序之健全發展", "維護交易秩序與消費者利益，避免獨占事業壟斷市場，促進經濟之安定與繁榮", "保障消費者權益，專供損害賠償之用", "檢舉不公平競爭行為獎金之支出"], "answer": "A", "explains": {"A": "正確。反托拉斯基金設置目的為「強化聯合行為查處，促進市場競爭秩序之健全發展」，此為法定明文之設置目的。", "B": "此為公平交易法整體立法目的之描述，非「反托拉斯基金」設置目的之精確表述。", "C": "反托拉斯基金非專供損害賠償之用，此為虛構用途之陷阱。", "D": "檢舉獎金支出僅為基金用途之一部分，非其設置之核心目的本身。"}, "ref": "公平交易法第47條之1", "id": 48, "chapter": "G1"}, {"year": 104, "qnum": 39, "stem": "依公平交易法之規定，對公平交易委員會依本法所為之處分或決定不服者，應依下列何種方式處理？", "options": ["依法申請調處", "直接適用行政訴訟程序", "依法提起司法訴訟", "申請仲裁"], "answer": "B", "explains": {"A": "申請調處非法定救濟途徑，此為虛構程序之陷阱。", "B": "正確。對公平會依本法所為之處分或決定不服者，「直接適用行政訴訟程序」（不須先經訴願程序），此為特殊救濟途徑，全科高頻。", "C": "「依法提起司法訴訟」用語不夠精確（應明確為「行政訴訟」，非一般民事司法訴訟），非官方標準答案。", "D": "申請仲裁非本法規定之救濟途徑。"}, "ref": "公平交易法第48條", "id": 49, "chapter": "G1"}];
const STORAGE_KEY = "brokerlaw_g1_1_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
