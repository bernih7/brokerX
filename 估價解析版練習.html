<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不動產估價概要｜解析版練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E6;--card:#FFFEFA;--line:#DDD6C0;
  --ink:#25302C;--sub:#5F6B63;--pri:#2F5D50;--onpri:#fff;
  --red:#A8402B;--gold:#B8782E;--green:#35693F;--blue:#3A5A7A;
  --opt:#fff;--okbg:#E0EFE0;--badbg:#F8E4DD;--tipbg:#FBF1D9;--expbg:#EDF3F8;--exptx:#2a3a4a;
  --gA:#3A5A7A;--gB:#35693F;--gC:#B8782E;--gD:#A8402B;--gE:#6B4C8C;--gF:#2E7D7D;--gG:#8A5A44;--gH:#9C3D6E;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b17;--card:#272420;--line:#3d3830;
    --ink:#ece6d8;--sub:#a79f8c;--pri:#4d8a78;--onpri:#fff;
    --red:#e0806a;--gold:#d9b058;--green:#8fb67c;--blue:#8fb3d4;
    --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;--expbg:#222a31;--exptx:#cfd9e2;
    --gA:#4f7396;--gB:#477f52;--gC:#a8702d;--gD:#b5543b;--gE:#7d5ea1;--gF:#3b8f8f;--gG:#9c6a52;--gH:#b04f83;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b17;--card:#272420;--line:#3d3830;
  --ink:#ece6d8;--sub:#a79f8c;--pri:#4d8a78;--onpri:#fff;
  --red:#e0806a;--gold:#d9b058;--green:#8fb67c;--blue:#8fb3d4;
  --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;--expbg:#222a31;--exptx:#cfd9e2;
  --gA:#4f7396;--gB:#477f52;--gC:#a8702d;--gD:#b5543b;--gE:#7d5ea1;--gF:#3b8f8f;--gG:#9c6a52;--gH:#b04f83;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:15px;line-height:1.7;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.35rem;text-align:center;margin:10px 0 4px;letter-spacing:.04em;color:var(--pri)}
.subtitle{text-align:center;font-size:.8rem;color:var(--sub);margin-bottom:16px}
.mode-badge{display:inline-block;background:var(--gold);color:#fff;font-size:.7rem;font-weight:700;padding:2px 10px;border-radius:10px;margin-left:6px;vertical-align:middle}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hidden{display:none!important}
.sec{font-weight:700;margin:14px 0 6px;font-size:.9rem}
.sec:first-child{margin-top:0}
.note{font-size:.78rem;color:var(--sub)}
.g-head{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:.82rem;font-weight:700;color:var(--cc);cursor:pointer;user-select:none}
.g-head::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--cc)}
.g-head small{font-weight:500;color:var(--sub)}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chapter-btn{font:inherit;font-size:.78rem;line-height:1.45;padding:7px 8px;border:1px solid var(--line);border-left:5px solid var(--cc,var(--line));border-radius:7px;background:var(--opt);cursor:pointer;text-align:left;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.chapter-btn.active{background:var(--cc,var(--blue));color:#fff;border-color:var(--cc,var(--blue))}
.chapter-count{font-size:.7rem;opacity:.75}
.cA{--cc:var(--gA)}.cB{--cc:var(--gB)}.cC{--cc:var(--gC)}.cD{--cc:var(--gD)}.cE{--cc:var(--gE)}.cF{--cc:var(--gF)}.cG{--cc:var(--gG)}.cH{--cc:var(--gH)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button.primary{font:inherit;font-weight:700;font-size:.95rem;padding:10px 20px;border-radius:8px;border:none;background:var(--pri);color:var(--onpri);cursor:pointer;flex:1;min-width:0}
button.secondary{font:inherit;font-size:.82rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--opt);color:var(--ink);cursor:pointer}
button.secondary.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
button.secondary:disabled{opacity:.45;cursor:default}
.progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:var(--gold);transition:width .3s}
.meta-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--sub);margin-bottom:6px}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--cc,var(--blue));color:#fff;font-weight:500}
.tag.calc{background:var(--red)}
.qtimer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue)}
.qtimer.over{color:var(--red)}
.qtext{font-family:"Noto Serif TC",serif;font-size:1.05rem;line-height:1.75;margin:10px 0 16px;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--opt);font:inherit;font-size:.92rem;line-height:1.55;cursor:pointer;color:var(--ink);overflow-wrap:anywhere}
.opt .letter{display:inline-block;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-weight:700;margin-right:8px;font-size:.8rem}
.opt.correct{border-color:var(--green);background:var(--okbg)}
.opt.correct .letter{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)}
.opt.wrong .letter{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--ink)}
.law-block{background:var(--expbg);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:12px;font-size:.86rem;line-height:1.7;display:none}
.law-block.show{display:block}
.law-title{font-weight:700;color:var(--blue);font-size:.82rem;margin-bottom:6px;letter-spacing:.05em}
.stamp{display:inline-block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:.9rem;padding:3px 14px;border:2.5px solid;border-radius:6px;margin-bottom:8px;transform:rotate(-2deg)}
.stamp.ok{color:var(--green);border-color:var(--green)}
.stamp.ng{color:var(--red);border-color:var(--red)}
.xr{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);align-items:flex-start}
.xr:first-of-type{border-top:0}
.xl{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;background:var(--line);color:var(--ink)}
.xr.ok .xl{background:var(--green);color:#fff}
.xr.pick .xl{background:var(--red);color:#fff}
.xm{font-weight:700;margin-right:4px}.xr.ok .xm{color:var(--green)}.xr:not(.ok) .xm{color:var(--red)}
.xp{display:inline-block;font-size:.72rem;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 5px;margin-right:4px}
.xt{flex:1;min-width:0;color:var(--exptx);overflow-wrap:anywhere}
.notebox{margin-top:10px;background:var(--tipbg);border-radius:8px;padding:10px 12px;font-size:.84rem;color:var(--ink);overflow-wrap:anywhere}
.wtag-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.wtag{font:inherit;font-size:.78rem;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--opt);color:var(--ink);cursor:pointer}
.wtag.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
.qsec{font-size:.78rem;color:var(--sub);margin-top:8px}
.next-btn{width:100%;margin-top:14px;padding:13px;border-radius:9px;border:none;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat-box{background:var(--opt);border:1px solid var(--line);border-radius:8px;padding:10px 4px}
.stat-num{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.6rem;display:block}
.stat-label{font-size:.7rem;color:var(--sub)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.crow:last-child{border-bottom:none}
.crow>span:first-child{border-left:4px solid var(--cc,transparent);padding-left:6px;min-width:0;overflow-wrap:anywhere}
.mini-bar{display:inline-block;width:80px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}
.mini-bar-fill{display:block;height:100%;background:var(--green)}
details.box{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--opt)}
details.box summary{cursor:pointer;font-weight:700;font-size:.85rem}
table.t{width:100%;border-collapse:collapse;margin-top:6px;font-size:.78rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px;text-align:left}
.tw{overflow-x:auto}
.slow li{margin:2px 0}
#wrongBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.msg{font-size:.82rem;color:var(--red);margin-top:8px;min-height:1.2em}

/* ── 暫停（v527） ── */
.pzbtn{font:inherit;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--paper,#fff);color:var(--sub,#666);margin-left:8px}
.pzbtn:hover{border-color:var(--blue)}
.pzbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
#quizScreen{position:relative}
#pzMask{position:absolute;inset:-8px;z-index:30;border-radius:12px;
  background:var(--paper,#fff);display:grid;place-items:center;padding:24px 18px}
#pzMask[hidden]{display:none!important}
#pzMask .pz-in{max-width:360px;text-align:center}
#pzMask .pz-ic{font-size:2.4rem;line-height:1}
#pzMask .pz-t{font-size:1.12rem;font-weight:800;margin:6px 0 4px}
#pzMask .pz-s{font-size:.83rem;line-height:1.75;color:var(--sub,#666)}
#pzMask .pz-el{font-size:.8rem;font-weight:700;color:var(--blue);margin-top:9px;font-variant-numeric:tabular-nums}
#pzMask .pz-go{margin-top:14px;font:inherit;font-size:.9rem;font-weight:800;padding:10px 22px;border-radius:999px;
  cursor:pointer;border:0;background:var(--blue);color:#fff}

/* ── 答對後的自評（v528） ── */
.conf-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 2px}
.cbtn{font:inherit;font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--paper,#fff);color:var(--ink,#222)}
.cbtn:hover{border-color:var(--blue)}
.cbtn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.conf-row .cfh{flex-basis:100%;font-size:.74rem;opacity:.8;margin-top:2px}
/* theme-fix: dark contrast */
@media(prefers-color-scheme:dark){
:root:not([data-theme="light"]) .mode-badge{color:var(--bg)}
:root:not([data-theme="light"]) .g-head{color:color-mix(in srgb,var(--cc) 55%,#fff)}
}
:root[data-theme="dark"] .mode-badge{color:var(--bg)}
:root[data-theme="dark"] .g-head{color:color-mix(in srgb,var(--cc) 55%,#fff)}
</style>
<script src="bxv-use.js"></script>
</head>
<body>
<div class="app">
  <h1>不動產估價概要 <span class="mode-badge">解析版</span></h1>
  <div class="subtitle">跨章節練習｜99–114 年考古題（共 <span id="totN">540</span> 題）｜逐選項解析・錯誤類型 A/B/C/D・智慧配題・計時</div>

  <div id="setupScreen" class="panel">
    <div class="sec">選擇章節範圍</div>
    <div id="chapterGrid"></div>
    <div class="row">
      <button class="secondary" id="selectAllBtn">全選</button>
      <button class="secondary" id="selectNoneBtn">清空</button>
      <span class="note">點大類名稱可整類選取／取消</span>
    </div>

    <div class="sec">題型</div>
    <div class="row" id="kindRow" style="margin-top:0"></div>

    <div class="sec">出題順序</div>
    <div class="row" id="bxord" style="margin-top:0"></div>
    <div class="note" id="bxnote" style="margin-top:6px"></div>

    <div class="sec">計時上限</div>
    <div class="row" id="tlimRow" style="margin-top:0"></div>
    <div class="note" id="tlimNote" style="margin-top:6px"></div>

    <div class="row" style="margin-top:16px"><button class="primary" id="startBtn">開始練習</button></div>
    <div class="msg" id="setupMsg"></div>

    <div id="wrongBar"></div>
    <details class="box" id="chStat"></details>
    <div id="tHistSetup"></div>
  </div>

  <div id="quizScreen" class="panel hidden">
    <div id="pzMask" hidden><div class="pz-in"><div class="pz-ic">⏸</div><div class="pz-t">已暫停</div><div class="pz-s">計時停住了，題目先蓋起來。回來再按「繼續」，這段時間不會算進本輪與本題。</div><div class="pz-el" id="pzEl"></div><button type="button" id="pzGo" class="pz-go">▶ 繼續作答</button></div></div>
    <div class="meta-row">
      <span id="progressText">1 / 20</span><span id="qTimer" class="qtimer">⏱ 00:00</span><button type="button" id="qPause" class="pzbtn" title="暫停計時（被打斷時用）">⏸ 暫停</button>
      <span><span class="tag" id="kindTag"></span> <span class="tag" id="chapterTag">A1</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="qtext" id="qtext"></div>
    <div id="optionsContainer"></div>
    <div class="law-block" id="lawBlock">
      <div class="law-title">🧩 逐選項解析</div>
      <div id="lawText"></div>
    </div>
    <button class="next-btn hidden" id="nextBtn">下一題</button>
  </div>

  <div id="resultScreen" class="panel hidden">
    <div style="text-align:center;margin-bottom:16px"><div style="font-family:'Noto Serif TC',serif;font-weight:900;font-size:1.1rem">本輪練習完成</div></div>
    <div class="stats-grid" style="margin:16px 0">
      <div class="stat-box"><span class="stat-num" id="resCorrect">0</span><span class="stat-label">答對</span></div>
      <div class="stat-box"><span class="stat-num" id="resTotal">0</span><span class="stat-label">總題數</span></div>
      <div class="stat-box"><span class="stat-num" id="resRate">0%</span><span class="stat-label">正確率</span></div>
    </div>
    <div id="chapterBreakdown"></div>
    <div class="row" style="margin-top:16px">
      <button class="secondary" id="backToSetupBtn">回到章節選擇</button>
      <button class="primary" id="restartBtn">再練一輪</button>
    </div>
  </div>
</div>

<script src="bxv-quiz-data.js"></script><script src="bxv-hl.js"></script>
<script>
(function(){
"use strict";
var D=window.BXV_QUIZ,ITEMS=D.items,LAB=D.labels,GRP=D.groups,GN=D.gnames;
var CHORDER=Object.keys(LAB),GORDER=["A","B","C","D","E","F","G","H"];
var WTL={A:"A 法條混淆",B:"B 粗心",C:"C 真的不熟",D:"D 猜的"};
/* 章節頁自己的作答存檔前綴（與 bxv-use.js 的 ANS 相同；新頁同步寫入，章節頁與中心清單才看得到） */
var ANS={A1:"valuation_practice_a1_v2",A2:"valuation_practice_a2_v2",A3:"valuation_practice_a3_v2",A4:"valuation_practice_a4_v2",B:"valuation_practice_b_v2",C1:"valuation_practice_c1_v2",C2:"valuation_practice_c2_v2",D1:"valuation_practice_d1_v2",D2:"valuation_practice_d2_v2",D3:"valuation_practice_d3_v2",E1:"valuation_practice_e1_v2",F1:"valuation_practice_f1_v2",G1:"valuation_practice_g1_v2",H1H2:"valuation_practice_h1h2_v2",H3I1:"valuation_practice_h3i1_v2",I2J1:"val_prac_i2j1_v1"};
var KEY={ORD:"bxv-ord",SEEN:"bxv-seen",WCLR:"bxv-wclr",TIME:"bxv-anal-time",QT:"bxv-qt",TLIM:"bxv-tlim",KIND:"bxv-kind"};
function $(id){return document.getElementById(id)}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lg(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function q2(){return ld("bxv-q2",{})}
function qk(q){return q.ch+"-"+q.year+"-"+q.id}
function wClr(){return +lg(KEY.WCLR,0)||0}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(x){x=Math.floor(x);return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function adapt(q){return {chapter:q.ch,year:q.year,id:q.id}}
function grp(ch){return GRP[ch]}

/* ---------- 狀態 ---------- */
var sel=new Set(CHORDER),KIND=lg(KEY.KIND,"all"),BXO=lg(KEY.ORD,"new"),TLIMON=lg(KEY.TLIM,"on")!=="off";
var quizQueue=[],quizIndex=0,quizResults=[],answered=false,MODE="normal";
var byId={};ITEMS.forEach(function(q){byId[q.id]=q});
var cnt={};CHORDER.forEach(function(c){cnt[c]=0});ITEMS.forEach(function(q){cnt[q.ch]++});
$("totN").textContent=ITEMS.length;

/* ---------- 作答寫入（共用紀錄＋章節頁存檔雙寫） ---------- */
function stGet(k){try{return JSON.parse(localStorage.getItem("bxv-st:"+k)||"{}")||{}}catch(e){return {}}}
function stSet(k,v){try{localStorage.setItem("bxv-st:"+k,JSON.stringify(v))}catch(e){}}
function recordAnswer(q,idx,ok){
  try{BXREP.rec(adapt(q),idx,ok)}catch(e){}
  var p=ANS[q.ch];if(!p)return;
  var a=stGet(p+"_answers");a[q.id]={selected:idx,correct:!!ok};stSet(p+"_answers",a);
  var t=stGet(p+"_errortags");if(q.id in t){delete t[q.id];stSet(p+"_errortags",t)}
}
function recordTag(q,k){
  try{BXREP.tag(adapt(q),k)}catch(e){}
  var p=ANS[q.ch];if(!p)return;
  var t=stGet(p+"_errortags");t[q.id]=k;stSet(p+"_errortags",t);
}

/* ---------- 錯題本（共用作答紀錄中「最近一次答錯」） ---------- */
function wGet(){var Dd=q2(),c=wClr(),o={};ITEMS.forEach(function(q){var r=Dd[qk(q)];if(r&&r.ok===0&&(r.t||0)>c)o[q.id]=r.k||""});return o}

/* ---------- 計時：整輪 wall-clock；每題只算「有在操作」的秒數 ---------- */
var TM={st:0,iv:0,over:false,pz:0,ps:0},PAUSED=false,TLIM=2400,IDLE=180000,QCAP=600;
var act=Date.now();
["pointerdown","keydown","scroll","touchstart"].forEach(function(ev){addEventListener(ev,function(){act=Date.now()},{passive:true})});
var QT={acc:0,prev:0,calc:false};
function qBegin(){QT.acc=0;QT.prev=Date.now();act=Date.now()}
setInterval(function(){
  var n=Date.now();
  if(!PAUSED&&quizIndex>=0&&!$("quizScreen").classList.contains("hidden")&&!answered&&document.visibilityState==="visible"&&n-act<IDLE)QT.acc+=Math.min(2,(n-QT.prev)/1000);
  QT.prev=n;
},1000);
function tStart(){clearInterval(TM.iv);pzOff();TM={st:Date.now(),iv:0,over:false,pz:0,ps:0};var el=$("qTimer");el.classList.remove("over");el.textContent="⏱ 00:00";

function kindOK(q){return KIND==="all"||(KIND==="calc"?!!q.calc:!q.calc)}
function poolOf(){return ITEMS.filter(function(q){return sel.has(q.ch)&&kindOK(q)})}

function seenAdd(id){var s=seenGet();s[id]=1;sv(KEY.SEEN,s)}
/* 智慧配題：依所選章節歷屆題數比例分配 30 題 →
   章內優先序：錯題（C>A>D>B>未標）→ 未練 → 答對但不熟／猜的 → 答對且很確定（最久沒練優先） */
function smartQueue(pool){
  var N=Math.min(30,pool.length),Dd=q2(),c=wClr(),KO={C:0,A:1,D:2,B:3,"":4};
  /* 0 最近答錯 → 1 沒作答過 → 2 答對但不熟／猜的 → 3 答對且很確定（最久沒練優先） */
  function sc(q){var r=Dd[qk(q)];
    if(r&&r.ok===0&&(r.t||0)>c)return [0,KO[r.k||""]!=null?KO[r.k||""]:4,Math.random()];
    if(!r)return [1,0,Math.random()];
    if(r.sh===1||r.g===1||r.k==="D")return [2,r.t||0,Math.random()];
    return [3,r.t||0,Math.random()]}
  function cmp(a,b){for(var i=0;i<3;i++){if(a.s[i]!==b.s[i])return a.s[i]-b.s[i]}return 0}
  var by={};pool.forEach(function(q){(by[q.ch]=by[q.ch]||[]).push({q:q,s:sc(q)})});
  var chs=Object.keys(by),quota={},rem=[],used=0;
  chs.forEach(function(ch){by[ch].sort(cmp);var e=N*by[ch].length/pool.length,f=Math.min(Math.floor(e),by[ch].length);quota[ch]=f;used+=f;rem.push([e-f,ch])});
  rem.sort(function(a,b){return b[0]-a[0]});
  for(var i=0;used<N&&i<rem.length*3;i++){var ch=rem[i%rem.length][1];if(quota[ch]<by[ch].length){quota[ch]++;used++}}
  var out=[];chs.forEach(function(ch){out=out.concat(by[ch].slice(0,quota[ch]))});
  out.sort(cmp);
  var w=out.filter(function(x){return x.s[0]===0}),o=shuffle(out.filter(function(x){return x.s[0]!==0}));
  return w.map(function(x){return x.q}).concat(o.map(function(x){return x.q}));
}
function buildQueue(pool){
  if(BXO==="smart")return smartQueue(pool);
  if(BXO==="rand")return shuffle(pool).slice(0,Math.min(30,pool.length));
  var seen=seenGet();
  var sorted=pool.slice().sort(function(a,b){return (b.y||-1)-(a.y||-1)||a.n-b.n});
  var fresh=sorted.filter(function(q){return !seen[q.id]});
  if(!fresh.length)fresh=sorted;
  return fresh.slice(0,Math.min(30,fresh.length));
}

    var ts=document.createElement("div");ts.style.cssText="font-size:.82rem;margin-top:10px";
    ts.innerHTML="<b>本輪錯題類型：</b>"+["A","B","C","D"].map(function(k){return WTL[k]+" "+tc[k]}).join("、")+(tc[""]?"、未標 "+tc[""]:"");B.appendChild(ts)}
  var wb=document.createElement("div");wb.className="row";
  wb.innerHTML=rw.length?'<button class="primary" id="wrongRoundBtn">🔁 練本輪錯題（'+rw.length+" 題）</button>":'<span style="font-size:.85rem;color:var(--green);font-weight:700">本輪全對 👍</span>';B.appendChild(wb);
  var wr=$("wrongRoundBtn");if(wr)wr.onclick=function(){startList(quizResults.filter(function(r){return !r.correct}).map(function(r){return byId[r.id]}),"wrong")};
  /* 用時分析 */
  var T=document.createElement("div");T.style.marginTop="12px";
  var th='<div style="font-size:.85rem"><b>本輪用時：</b>'+(sec==null?"超過 40 分鐘，整輪不計時、不列入紀錄（每題用時仍已記錄）":fmt(sec)+"（每題約 "+Math.round(sec/Math.max(1,tot))+" 秒）")+"</div>";
  th+='<div style="font-size:.82rem;margin-top:6px">每題平均（有操作的秒數）：計算題 '+(cs.length?Math.round(avg(cs))+" 秒（"+cs.length+" 題）":"－")+"｜觀念題 "+(os.length?Math.round(avg(os))+" 秒（"+os.length+" 題）":"－")+"</div>";
  var slow=quizResults.slice().sort(function(a,b){return b.sec-a.sec}).slice(0,5);
  th+='<details class="box" open><summary>最慢的 5 題</summary><ul class="slow" style="margin:6px 0 0;padding-left:1.2em;font-size:.82rem">'+slow.map(function(r){var q=byId[r.id];return "<li>"+q.year+"・"+LAB[q.ch].split(" ")[0]+"・"+(r.calc?"計算":"觀念")+"　"+r.sec+" 秒　"+(r.correct?"✓":"✗")+"</li>"}).join("")+"</ul></details>";
  var mc=med(cs),mo=med(os),sr=quizResults.filter(function(r){var m=r.calc?mc:mo;var n=(r.calc?cs:os).length;return r.correct&&n>=3&&r.sec>=45&&r.sec>2*m});
  if(sr.length)th+='<details class="box"><summary>答對但花很久（超過同類中位數 2 倍）：'+sr.length+" 題</summary><ul class=\"slow\" style=\"margin:6px 0 0;padding-left:1.2em;font-size:.82rem\">"+sr.map(function(r){var q=byId[r.id];return "<li>"+q.year+"・"+LAB[q.ch].split(" ")[0]+"　"+r.sec+" 秒</li>"}).join("")+"</ul></details>";
  T.innerHTML=th+tHtml();B.appendChild(T);
  window.scrollTo(0,0);
}
$("backToSetupBtn").onclick=function(){clearInterval(TM.iv);$("resultScreen").classList.add("hidden");$("setupScreen").classList.remove("hidden");renderAll()};
$("restartBtn").onclick=function(){$("startBtn").click()};

/* #q=102-9,104-16,107-19 直接開練這一批題（供整理頁「練整批」用） */
var HASHSET=null;
(function(){var m=(location.hash||"").match(/^#q=([0-9,\-]+)/);if(!m)return;
  var want=m[1].split(",").map(function(x){return x.trim()}).filter(Boolean),list=[],miss=[];
  want.forEach(function(w){var pp=w.split("-");if(pp.length!==2){miss.push(w);return}
    var y=+pp[0],n=+pp[1],hit=null;
    for(var i=0;i<ITEMS.length;i++){if(ITEMS[i].y===y&&ITEMS[i].n===n){hit=ITEMS[i];break}}
    if(hit){if(list.indexOf(hit)<0)list.push(hit)}else{miss.push(w)}});
  if(list.length)HASHSET={list:list,miss:miss};
})();

/* #ch=B,C1 可預先選章節（供章節頁連過來用） */
(function(){var m=(location.hash||"").match(/^#ch=([A-Za-z0-9,]+)/);if(m){var a=m[1].split(",").filter(function(c){return LAB[c]});if(a.length)sel=new Set(a)}})();
renderAll();
if(HASHSET){startList(HASHSET.list,"set");
  if(HASHSET.miss.length){var mm=$("setupMsg");if(mm)mm.textContent="這幾題找不到："+HASHSET.miss.join("、")}}
})();
</script>
