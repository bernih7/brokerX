<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>/*bxdef*/(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><script src="bx-vp.js"></script>
<title>土地法｜申論 5 分鐘衝刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;
--b1:#2F6B8C;--b1s:#E3EFF6;--b2:#7A5BA6;--b2s:#EEE8F6;--b3:#2F7A55;--b3s:#E1F1E8;--b4:#B8782E;--b4s:#F8EBD3;--hl:#FFE9A8}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 1.45rem/1.3 "Noto Serif TC",serif;margin:6px 0 2px;text-wrap:balance}
.lead{color:var(--sub);font-size:.92rem;margin:0 0 14px}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:.88rem}.top a{white-space:nowrap}.top>span{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}
/* 模式選擇 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:1.02rem}
.mode small{display:block;color:var(--sub);line-height:1.55;margin-top:2px}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;padding:0;list-style:none;font-size:.82rem;color:var(--sub)}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow li b{color:var(--ink);font-weight:700;margin-right:4px}
/* 佇列 */
.sec-h{font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--sub);font-weight:400}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;color:var(--ink)}
.qi .n{font-size:.78rem;color:var(--sub);min-width:4.2em}
.qi .t{min-width:0;font-size:.93rem;line-height:1.5}
.qi .r{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.chip.new{background:var(--acc-soft);color:var(--acc);font-weight:700}
.chip.hard{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.mid{background:var(--b1s);color:var(--b1);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qi .go{font-size:.8rem;color:var(--pri);font-weight:700}
.more{margin-top:8px}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar .row{display:flex;align-items:center;gap:10px}
.stg{font-weight:700;font-size:.98rem;flex:1;min-width:0}
.stg small{display:block;font-weight:400;color:var(--sub);font-size:.8rem;line-height:1.4}
.clk{font:700 1.6rem/1 "Noto Sans TC",monospace;font-variant-numeric:tabular-nums;color:var(--pri)}
.clk.red{color:var(--bad)}
.tot{font-size:.78rem;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.tot.red{color:var(--bad);font-weight:700}
.segs{display:grid;grid-template-columns:30fr 30fr 150fr 60fr 30fr;gap:3px;margin-top:8px}
.segs i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--pri)}
.segs i.over b{background:var(--bad)}
.segs i.done b{width:100%!important}
.modechip{font-size:.74rem;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.modechip.h{background:var(--bad-soft);color:var(--bad)}
.modechip.s{background:var(--pri-soft);color:var(--pri)}
/* 題卡 */
.card{margin-top:14px}
.meta{font-size:.8rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ttl{font-weight:700;font-size:1.05rem;line-height:1.5;margin:4px 0 8px;text-wrap:balance}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}
.qbox.clamp .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qbox .qx{display:none;margin-left:8px;font-size:.8rem;color:var(--pri);background:none;border:0;padding:0;font-weight:700}.qbox.clamp .qx,.qbox.open .qx{display:inline}
.qbox .nq{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:0 10px}
.recall{margin-top:12px;background:var(--acc-soft);border-radius:12px;padding:12px 14px}
.recall b{display:block;margin-bottom:2px}
.recall ol{margin:4px 0 0;padding-left:1.4em}
.mn{margin-top:10px;font-size:.88rem;color:var(--sub)}
.mn b{color:var(--ink)}
.ev{margin-top:12px}
.ev mark.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;font-weight:700;padding:0;border-radius:0}
.blk{border-radius:10px;padding:12px 15px;margin:8px 0;background:var(--cs);transition:opacity .25s}
.blk.b1{--c:var(--b1);--cs:var(--b1s)}.blk.b2{--c:var(--b2);--cs:var(--b2s)}.blk.b3{--c:var(--b3);--cs:var(--b3s)}.blk.b4{--c:var(--b4);--cs:var(--b4s)}
.blk-l{display:inline-block;font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}
.blk p{margin:4px 0 0;line-height:1.85}
.blk .art{color:var(--sub);font-weight:400}
.blk .evp{margin-top:12px}.blk .evh{font-weight:700;margin-top:0}
.blk .evx{display:flex;gap:8px;align-items:baseline}
.blk .lawn{color:var(--ink);font-weight:500;margin-left:2px}
.blk .evli{display:block;padding-left:1.15em;text-indent:-1.15em;margin-top:3px}
.blk .evt{flex:none;font-size:.74em;line-height:1.6;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--sub);font-weight:600}
.blk.dim{opacity:.38}
.blk.focus{outline:2px solid var(--c);outline-offset:-2px}
.cover{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:.92rem}
/* 檢核 */
.ck{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6;cursor:pointer}
.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pri)}
.ck label.on{border-color:var(--ok);background:var(--ok-soft)}
.must{flex:none;font-size:.72rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 7px;margin-top:3px}
.score{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:900 1.8rem/1 "Noto Serif TC",serif;color:var(--pri)}
.score small{color:var(--sub)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:700}
.rate button.on[data-v="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rate button.on[data-v="2"]{border-color:var(--b1);background:var(--b1s);color:var(--b1)}
.rate button.on[data-v="3"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hist{margin-top:10px;font-size:.84rem;color:var(--sub)}
/* 底部操作列 */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.act .hint{font-size:.78rem;color:var(--sub);opacity:.6;flex:1;min-width:0;transition:opacity .8s}
.done-box{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:480px){.modes{grid-template-columns:1fr}.clk{font-size:1.4rem}}
.pz{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;line-height:1;padding:0}
body.paused .pz{background:var(--pri);border-color:var(--pri);color:var(--on)}
.pzbox{display:none;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub)}
.pzbox b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:4px}
body.paused .pzbox{display:block}
body.paused #body,body.paused .qbox,body.paused .ttl,body.paused .meta{display:none}
body.paused .clk{opacity:.5}
body.paused #nextBtn{opacity:.45;pointer-events:none}
.thb{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.howto{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.howto>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:.9rem;color:var(--sub);display:flex;justify-content:space-between;gap:8px}.howto>summary::-webkit-details-marker{display:none}.howto>summary::after{content:"點開 ▾";font-size:.8rem}.howto[open]>summary::after{content:"收起 ▴"}.howto>summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}.howto .hb{padding:0 14px 12px}.howto .hb>*:first-child{margin-top:0}.modes .mode small{display:none}.howto[open]~.modes .mode small{display:block}
.swq{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 2px 0;font-size:.86rem;color:var(--sub)}.swq a{font-weight:600;white-space:nowrap}
.dnb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dnb .btn{text-decoration:none;display:inline-flex;align-items:center}.rv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.rvh{font-weight:700;margin-bottom:8px}.rvnav{display:flex;gap:8px;align-items:center}.rvnav select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 8px;font:inherit;font-size:.88rem}.rvnav .btn{white-space:nowrap;padding:7px 12px}.rvnav .btn:disabled{opacity:.4}#rvB{margin-top:12px}.rvq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}.ck label.miss{opacity:.75}.ck label .mk{font-weight:700;min-width:1.2em}.ck label.on .mk{color:var(--ok)}.kw.miss{opacity:.6}@media(max-width:480px){.rvnav .btn{padding:7px 10px}}
/*flt*/.flt{margin:8px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:grid;gap:6px}
.flt .fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flt .fl{font-size:.76rem;font-weight:700;color:var(--sub);min-width:2.6em}
.flt button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:2px 11px;font-size:.84rem;line-height:1.6}
.flt button.on{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.flt .fs{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub)}
.flt .fs a{cursor:pointer}
</style><style id="sprint-bardim-css">.act{transition:opacity .8s}.act.dim{opacity:.22}.act.dim:hover,.act.dim:focus-within{opacity:1}.act .hint{font-size:.78rem;color:var(--sub);flex:1;min-width:0}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="土地法_備考指揮中心.html">← 指揮中心</a><span style="color:var(--sub)"><span id="sum"></span>　<button type="button" id="thBtn" class="thb" aria-label="切換深淺色"></button>　<a id="swTop" href="土地法_申論5分鐘_推理版.html">切到推理版 ▸</a></span></div>

  <!-- 開始畫面 -->
  <section id="home">
    <h1>申論 5 分鐘衝刺</h1>
    <p class="lead">一題約 5 分鐘：讀題 → 先自己想 → 讀考場版 → 對結論 → 關鍵字檢核。紀錄與《申論題分類總覽》同步（輪數、自評、分數）。</p>
    <div class="flt" id="flt"></div>
    <details class="howto" id="howto"><summary>流程、時間怎麼分、兩種模式說明</summary><div class="hb"><ul class="flow"><li><b>0:30</b>讀題</li><li><b>0:30</b>先自己想</li><li><b>2:30</b>意義・法條・涵攝</li><li><b>1:00</b>結論</li><li><b>0:30</b>關鍵檢核</li></ul></div></details>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-m="h"><b>⚡ 衝刺</b><small>每段時間到就變紅並自動進下一段；讀過的段落會被蓋住，不能回頭看。</small></button>
      <button type="button" class="mode" data-m="s"><b>🪑 停留</b><small>時間到一樣變紅，但可以繼續看，自己按「下一段」。</small></button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" id="startBtn">開始下一題</button><button type="button" class="btn" id="randBtn">🎲 隨機出題</button></div>
    <div class="sec-h"><span>接下來的順序</span><small id="qcount"></small></div>
    <div class="qlist" id="qlist"></div>
    <button type="button" class="btn more" id="moreBtn">顯示全部</button>
  </section>

  <!-- 作答畫面 -->
  <section id="run" hidden>
    <div class="bar">
      <div class="row">
        <div class="stg" id="stg"></div>
        <span class="modechip" id="mchip"></span><button type="button" class="pz" id="pauseBtn" aria-label="暫停">⏸</button>
        <div><div class="clk" id="clk">0:30</div><div class="tot" id="tot">總 0:00／5:00</div></div>
      </div>
      <div class="segs" id="segs"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    </div>
    <div class="card">
      <div class="meta" id="meta"></div>
      <div class="ttl" id="ttl"></div>
      <div class="qbox" id="qbox"></div><div class="swq" id="swq"></div>
      <div class="pzbox" id="pzbox"><b>已暫停</b>計時停止，題目與答案先蓋住。<br><button type="button" class="btn pri" id="resumeBtn" style="margin-top:12px">▶ 繼續</button></div>
    <div id="body"></div>
    </div>
  </section>
</div>

<script>
var CARDS=[{"id": "q-109-二", "no": "109-二", "t": "地價稅納稅義務人＋代繳義務人代繳後求償", "lv": "A", "k": "off", "tier": 0, "g": "地價稅・土地增值稅", "q": "請依土地稅法之規定，詳細說明地價稅之納稅義務人，又那些代繳義務人代繳之地價稅，得向納稅義務人求償。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>地價稅之納稅義務人，指依土地稅法第3條第1項<mark class=\"hl\">負繳納地價稅義務之人</mark>；代繳義務人，指有同法第4條第1項各款情形時，<mark class=\"hl\">經主管稽徵機關指定代繳其使用部分地價稅之土地使用人</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第3條、第3條之1、第4條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原則與例外</p><p>依<span class=\"art\">第3條第1項</span>，納稅義務人為：<span class=\"evli\">一、<mark class=\"hl\">土地所有權人</mark>；</span><span class=\"evli\">二、<mark class=\"hl\">設有典權土地，為典權人</mark>；</span><span class=\"evli\">三、承領土地，為承領人；</span><span class=\"evli\">四、承墾土地，為耕作權人。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>甲將土地出典予乙，典權存續期間由乙繳納。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>其實際使用收益土地。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）公有、共有及信託</p><p>依<span class=\"art\">第3條第2項</span>，公有或公同共有者，<mark class=\"hl\">以管理機關或管理人為納稅義務人</mark>；分別共有者，以共有人各按其應有部分為納稅義務人。依<span class=\"art\">第3條之1第1項</span>，信託財產於信託關係存續中，<mark class=\"hl\">以受託人為納稅義務人</mark>；第2項並應與委託人之土地合併計算地價總額，但受益人非委託人且已確定並享有全部信託利益、委託人未保留變更受益人之權利者，與受益人之土地合併計算。</p></div><div class=\"evp\"><p class=\"evh\">（三）代繳義務人</p><p>依<span class=\"art\">第4條第1項</span>，土地有下列情形之一者，主管稽徵機關<mark class=\"hl\">得指定土地使用人負責代繳</mark>其使用部分之地價稅：<span class=\"evli\">一、納稅義務人行蹤不明；</span><span class=\"evli\">二、權屬不明；</span><span class=\"evli\">三、無人管理；</span><span class=\"evli\">四、土地所有權人<mark class=\"hl\">申請由占有人代繳</mark>。第2項規定，所有權人在同一直轄市、縣（市）內有兩筆以上土地為不同使用人所使用，地價稅按累進稅率計算時，各使用人應就所使用土地之地價比例負代繳義務。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）得求償者限前三款</p><p>依<span class=\"art\">第4條第3項</span>，第1項第1款至第3款代繳義務人代繳之地價稅，<mark class=\"hl\">得抵付使用期間應付之地租或向納稅義務人求償</mark>；<mark class=\"hl\">第4款未列入</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>戊行蹤不明，其土地由己承租使用，己代繳後得自應付戊之租金中抵付或向戊求償；若係所有權人自行申請由占有人代繳，占有人不得依本條抵付或求償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>第4款及第2項之代繳義務人均未列入第4條第3項，條文未賦予抵付或求償之權。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>地價稅納稅義務人<mark class=\"hl\">原則為土地所有權人</mark>，例外為典權人、承領人、耕作權人；公有或公同共有者為管理機關或管理人，分別共有者按應有部分，信託土地為受託人。代繳義務人中，僅因納稅義務人行蹤不明、權屬不明、無人管理而代繳者，<mark class=\"hl\">得抵付地租或向納稅義務人求償</mark>；<mark class=\"hl\">所有權人申請由占有人代繳者不在其列</mark>。</p>"], "ck": [{"x": "土稅§3Ⅰ：所有權人；典權人、承領人、耕作權人", "h": false}, {"x": "公有或公同共有→管理機關或管理人；分別共有→各按應有部分", "h": false}, {"x": "土稅§3-1：信託存續中以受託人為納稅義務人", "h": true}, {"x": "土稅§4Ⅰ 代繳四款：行蹤不明、權屬不明、無人管理、所有權人申請由占有人代繳", "h": false}, {"x": "代繳義務人只是代繳使用部分，不等於納稅義務人", "h": true}, {"x": "§4Ⅱ 累進稅率時各使用人按使用土地地價比例代繳", "h": false}, {"x": "前三款得抵付地租或求償，第四款不得", "h": true}], "mn": "所・典・承・耕・託（義務人）→ 代繳四款 → 前三款可求償、第四款不行", "hp": 35, "hpl": "高"}, {"id": "q-108-二", "no": "108-二", "t": "地價稅累進起點地價及一般稅率結構", "lv": "A", "k": "off", "tier": 0, "g": "地價稅・土地增值稅", "q": "請依平均地權條例規定，說明地價稅之累進起點地價及課徵之一般稅率結構。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>累進起點地價，以各該直轄市或縣（市）<mark class=\"hl\">土地7公畝之平均地價為準</mark>，但不包括工業用地、礦業用地、農業用地及免稅土地在內（平均地權條例第18條）。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第18條（累進起點地價）、第19條（基本稅率及五級累進稅率）；土地稅法第16條同旨；土地稅法施行細則第6條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）累進起點地價</p><p>各縣市土地7公畝之平均地價。依<span class=\"art\">平均地權條例第18條</span>，地價稅以各該直轄市或縣（市）<mark class=\"hl\">土地7公畝之平均地價為累進起點地價</mark>，但<mark class=\"hl\">不包括工業用地、礦業用地、農業用地及免稅土地</mark>在內（<span class=\"art\">土地稅法第16條第2項</span>同旨）。依土地稅法施行細則<span class=\"art\">第6條</span>，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，分別報請財政部及內政部備查，以千元為單位，以下四捨五入。其計算公式依施行細則第6條第1項附件二。</p><p class=\"evx\"><span class=\"evt\">例</span><span>平均地價每平方公尺2萬元，累進起點地價即為1,400萬元。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）一般稅率結構</p><p>10‰起，六級距超額累進。依<span class=\"art\">平均地權條例第19條</span>（<span class=\"art\">土地稅法第16條第1項</span>同），<mark class=\"hl\">基本稅率10‰</mark>；地價總額未超過累進起點地價者按基本稅率徵收；超過者：<span class=\"evli\">一、超過未達5倍者，就超過部分課徵15‰；</span><span class=\"evli\">二、超過5倍至10倍者，25‰；</span><span class=\"evli\">三、超過10倍至15倍者，35‰；</span><span class=\"evli\">四、超過15倍至20倍者，45‰；</span><span class=\"evli\">五、超過20倍以上者，55‰，<mark class=\"hl\">連同基本稅率共六級距</mark>。屬超額累進，各級稅率只適用於落在該級距之部分。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>甲之地價總額為累進起點地價之3倍，起點以內按10‰，超過部分（即2倍起點地價）按15‰，不是全部按15‰。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>累進起點地價為各該直轄市或縣（市）<mark class=\"hl\">土地7公畝之平均地價</mark>，不包括工業用地、礦業用地、農業用地及免稅土地；一般稅率結構為<mark class=\"hl\">基本稅率10‰</mark>，超過累進起點地價者依倍數分五級，<mark class=\"hl\">就超過部分課徵15‰至55‰</mark>，連同基本稅率共六級距，採超額累進，各級稅率只適用於落在該級距之部分。</p>"], "ck": [{"x": "平均§18：累進起點地價＝各縣市土地7公畝之平均地價", "h": false}, {"x": "計算起點地價須扣除工業、礦業、農業及免稅土地", "h": true}, {"x": "土稅細則§6：當年開徵前算完，報財政部及內政部備查，以千元為單位", "h": false}, {"x": "基本稅率10‰，未超過起點地價者按基本稅率", "h": false}, {"x": "五級累進15‰、25‰、35‰、45‰、55‰，連同基本稅率共六級距，不能漏55‰", "h": true}, {"x": "超額累進：起點地價3倍者，只有超過部分按15‰，不是全額適用", "h": true}, {"x": "持有愈多、稅負愈重，抑制土地集中與投機，落實平均地權", "h": false}], "mn": "7公畝平均（扣工礦農免）→ 10‰ → 15→25→35→45→55，只加超過部分", "hp": 36, "hpl": "高"}, {"id": "q-105-二", "no": "105-二", "t": "累進起點地價意義＋地價稅稅率結構", "lv": "A", "k": "off", "tier": 0, "g": "地價稅・土地增值稅", "q": "何謂累進起點地價？地價稅之稅率為何？試就平均地權條例及土地稅法之規定敘述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>累進起點地價係計算地價稅累進稅率之基準點，同一直轄市、縣（市）內地價總額超過累進起點地價者，就超過部分適用較高之累進稅率，其數額為各該直轄市或縣（市）<mark class=\"hl\">土地7公畝之平均地價</mark>，不包括工業用地、礦業用地、農業用地及免稅土地（平均地權條例第18條）。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第18條、第19條；土地稅法第15條（地價總額）、第16條（基本稅率與累進稅率）、第17條至第19條（特別稅率）；土地稅法施行細則第6條；平均地權條例第26條（空地稅）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）累進起點地價＝縣市土地7公畝之平均地價</p><p>依<span class=\"art\">平均地權條例第18條</span>及<span class=\"art\">土地稅法第16條第2項</span>，以各該直轄市或縣（市）<mark class=\"hl\">土地7公畝之平均地價為累進起點地價</mark>，但不包括工業用地、礦業用地、農業用地及免稅土地。依施行細則<span class=\"art\">第6條</span>，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，<mark class=\"hl\">以千元為單位</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）一般稅率</p><p>基本稅率10‰，超過部分分五級累進。依<span class=\"art\">土地稅法第16條第1項</span>，地價總額未超過累進起點地價者，<mark class=\"hl\">按10‰徵收</mark>；超過未達5倍者，<mark class=\"hl\">就超過部分課徵15‰</mark>；5倍至10倍者25‰；10倍至15倍者35‰；15倍至20倍者45‰；<mark class=\"hl\">20倍以上者55‰</mark>。地價總額依<span class=\"art\">第15條</span>，指每一土地所有權人在每一直轄市或縣（市）經核列歸戶冊之地價總額。例如（假設）累進起點地價1,000萬元，甲地價總額3,000萬元，超過之2,000萬元按15‰。</p></div><div class=\"evp\"><p class=\"evh\">（三）特別稅率</p><p>不適用累進。依<span class=\"art\">第17條</span>，自用住宅用地都市土地未超過3公畝、非都市土地未超過7公畝部分，<mark class=\"hl\">按2‰，以一處為限</mark>；<span class=\"art\"><span class=\"art\">第19條</span>，公共設施保留地保留期間仍為建築使用者，<mark class=\"hl\">除自用住宅外統按6‰</mark>，<mark class=\"hl\">未作任何使用並與使用中土地隔離者免徵</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）空地稅</p><p>依<span class=\"art\">平均地權條例第26條</span>，私有空地經限期建築而逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額<mark class=\"hl\">加徵2倍至5倍之空地稅或照價收買</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）累進起點地價，為各直轄市、縣（市）<mark class=\"hl\">土地7公畝之平均地價</mark>，不含工業、礦業、農業及免稅土地。（二）地價稅基本稅率10‰，超過累進起點地價部分依倍數分五級累進<mark class=\"hl\">課徵15‰至55‰</mark>；<mark class=\"hl\">自用住宅2‰、事業用地10‰、公設保留地6‰</mark>適用特別稅率；空地另得加徵空地稅。</p>"], "ck": [{"x": "累進起點地價＝計算地價稅累進稅率之基準點", "h": false}, {"x": "平均§18・土稅§16Ⅱ：縣市土地7公畝之「平均地價」，不是持有面積", "h": true}, {"x": "扣除工業、礦業、農業及免稅土地", "h": false}, {"x": "細則§6：規定地價後、當年開徵前算完，報財政部及內政部備查", "h": true}, {"x": "土稅§16Ⅰ 基本10‰，地價總額未超過起點按基本稅率", "h": false}, {"x": "超過部分15→25→35→45→55，第一到第二級加5，之後每級加10", "h": true}, {"x": "特別稅率：自用住宅2‰、事業用地10‰、保留地建築使用6‰", "h": false}, {"x": "平均§26 空地逾期未建，加徵基本稅額2～5倍空地稅或照價收買", "h": false}], "mn": "7公畝平均（扣工礦農免）→ 開徵前算、報兩部 → 10‰起，15→25→35→45→55 → 特別2／10／6", "hp": 37, "hpl": "高"}, {"id": "q-103-二", "no": "103-二", "t": "土地增值稅課徵目的＋減徵情形", "lv": "A", "k": "off", "tier": 0, "g": "地價稅・土地增值稅", "q": "課徵土地增值稅之目的為何？又在那些情況下得予以減徵？試申述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地增值稅係依憲法平均地權原則，對土地非因所有權人努力而自然漲價之利益，<mark class=\"hl\">於所有權移轉時課徵之稅捐</mark>，以實現「<mark class=\"hl\">漲價歸公</mark>」。</p>", "<span class=\"blk-l\">二、法條</span><p>憲法第143條第3項；土地稅法第28條、第28條之2、第31條、第33條、第34條、第39條、第39條之1；都市更新條例第67條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）課徵目的</p><p><mark class=\"hl\">漲價歸公、抑制投機、地盡其利</mark>。依憲法<span class=\"art\">第143條第3項</span>，土地價值非因施以勞力資本而增加者，<mark class=\"hl\">應由國家徵收土地增值稅，歸人民共享之</mark>；<span class=\"art\">土地稅法第28條</span>規定移轉時按土地漲價總數額徵收，<span class=\"art\">第33條</span>按漲價倍數以20%、三十、四十累進課徵。其目的：依憲法第143條第3項，將非因施以勞力資本而增加之土地價值收歸人民共享（漲價歸公）；學理上並認為累進課徵兼有抑制投機、促進土地利用之作用。</p></div><div class=\"evp\"><p class=\"evh\">（二）重劃</p><p>依<span class=\"art\">第39條之1第1項</span>，經重劃之土地於<mark class=\"hl\">重劃後第一次移轉時，減徵40%</mark>；<mark class=\"hl\">已繳納之重劃費用並得自漲價總數額中減除</mark>（<span class=\"art\">第31條第1項第2款</span>）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>獎勵土地重劃。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）長期持有</p><p>依<span class=\"art\">第33條第6項</span>至第8項，<mark class=\"hl\">持有超過20年、30年、40年以上者</mark>，就超過最低稅率部分<mark class=\"hl\">分別減徵20%、三十、四十</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）抵價地及都更</p><p>依<span class=\"art\">第39條之1第3項</span>，<mark class=\"hl\">領回抵價地後第一次移轉，準用減徵40%</mark>；依都市更新條例<span class=\"art\">第67條第1項第4款</span>，依權利變換取得之土地及建築物於更新後第一次移轉，<mark class=\"hl\">減徵土地增值稅及契稅40%</mark>；第5款不願參加權利變換而領取現金補償者，減徵40%。</p></div><div class=\"evp\"><p class=\"evh\">（五）非減徵之情形應區辨</p><p>自用住宅用地依<span class=\"art\">第34條</span>按10%課徵，<mark class=\"hl\">屬優惠稅率</mark>；配偶相互贈與依<span class=\"art\">第28條之2</span><mark class=\"hl\">得申請不課徵</mark>；公共設施保留地徵收前移轉（<span class=\"art\">第39條第2項</span>）及繼承（<span class=\"art\">第28條</span>但書）<mark class=\"hl\">屬免徵</mark>。均與照算稅額後打折之「減徵」不同。</p></div>", "<span class=\"blk-l\">四、結論</span><p>課徵目的為<mark class=\"hl\">漲價歸公、抑制投機、地盡其利</mark>。減徵情形為：<mark class=\"hl\">重劃後第一次移轉減徵40%</mark>；持有逾二十、三十、40年者，就超過最低稅率部分分別減徵20%、三十、四十；領回抵價地後第一次移轉、權利變換取得後第一次移轉及不願參加權利變換領取現金補償者，減徵40%。<mark class=\"hl\">自用住宅、配偶贈與、保留地與繼承則非減徵</mark>。</p>"], "ck": [{"x": "目的三點：漲價歸公、抑制投機、地盡其利，不能只寫一點", "h": true}, {"x": "憲法§143Ⅲ、土稅§28：移轉時按漲價總數額課徵", "h": false}, {"x": "土稅§39-1Ⅰ 重劃後第一次移轉減徵40%", "h": false}, {"x": "土稅§33Ⅵ～Ⅷ 持有20／30／40年三級，只減超過最低稅率部分", "h": true}, {"x": "抵價地第一次移轉減40%（土稅§39-1Ⅲ、平均§42-1）；都更條例§67Ⅰ④⑤ 權變與領現金補償減40%", "h": false}, {"x": "自用住宅10%是優惠稅率；配偶贈與不課徵、保留地與繼承免徵，不可混成減徵", "h": true}], "mn": "目的：歸公・抑投機・地盡其利 → 減徵：重劃40・持有20/30/40・抵價地與都更40 → 不課徵、免徵不是減徵"}, {"id": "q-102-二", "no": "102-二", "t": "地價稅／房屋稅／特種貨物及勞務稅之稅基與納稅義務人", "lv": "A", "k": "off", "tier": 0, "g": "地價稅・土地增值稅", "q": "試分別依土地稅法、房屋稅條例及特種貨物及勞務稅條例之規定，說明「地價稅」、「房屋稅」及「銷售房屋、土地之特種貨物及勞務稅」之稅基及納稅義務人。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>地價稅按地價總額計徵（土地稅法第15條第1項），房屋稅依房屋現值課徵（房屋稅條例第5條第1項）；特種貨物及勞務稅之房地部分，<mark class=\"hl\">自105年1月1日起訂定銷售契約者停止課徵</mark>（特種貨物及勞務稅條例第6條之1）。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第3條、第3條之1、第15條、第16條；平均地權條例第17條第1項；房屋稅條例第4條、第5條第1項、第11條；特種貨物及勞務稅條例第2條第1項第1款、第6條之1、第7條；所得稅法第4條之4。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地價稅</p><p><mark class=\"hl\">稅基為申報地價總額</mark>，<mark class=\"hl\">義務人原則為土地所有權人</mark>。依<span class=\"art\">平均地權條例第17條第1項</span>，已規定地價之土地應按申報地價徵收地價稅；依<span class=\"art\">土地稅法第15條</span>，按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵，並依<span class=\"art\">第16條</span>累進課徵。納稅義務人依<span class=\"art\">第3條</span>：土地所有權人；設有典權土地為典權人；承領土地為承領人；承墾土地為耕作權人；公有或公同共有者為管理機關或管理人；分別共有者各按應有部分。信託土地以受託人為納稅義務人（<span class=\"art\">第3條之1</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）房屋稅</p><p><mark class=\"hl\">稅基為房屋現值</mark>，<mark class=\"hl\">義務人原則為房屋所有人</mark>。依<span class=\"art\">房屋稅條例第5條第1項</span>，依房屋現值按法定稅率課徵；房屋現值以不動產評價委員會依<span class=\"art\">第11條</span>評定之房屋標準價格為核計基礎。納稅義務人依<span class=\"art\">第4條</span>：向房屋所有人徵收；使用權房屋向使用權人；設有典權者向典權人；共有房屋向共有人，由共有人推定一人繳納，不為推定者由現住人或使用人代繳；信託房屋以受託人為納稅義務人（第5項）。</p></div><div class=\"evp\"><p class=\"evh\">（三）特種貨物及勞務稅</p><p><mark class=\"hl\">稅基為銷售價格，由出賣人繳納，現已停徵</mark>。課稅範圍依<span class=\"art\">第2條第1項第1款</span>，為持有期間在2年以內之房屋及其坐落基地或依法得核發建造執照之都市土地及非都市土地之工業區土地；稅率依<span class=\"art\">第7條</span>，持有1年以內者15%，逾1年至2年者10%；稅基為銷售價格、納稅義務人為出賣人（稅基、納稅義務人所據條文站上未收全文，考前對紙本）；免徵情形依<span class=\"art\">第5條</span>列十二款，如自住、繼承或受遺贈取得、營業人興建完成後第一次移轉。依<span class=\"art\">第6條之1</span>，自105年1月1日起訂定銷售契約者停止課徵，<mark class=\"hl\">改課房地合一所得稅</mark>（<span class=\"art\">所得稅法第4條之4</span>）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>地價稅<mark class=\"hl\">以申報地價總額為稅基</mark>，原則由土地所有權人繳納；房屋稅<mark class=\"hl\">以房屋現值為稅基</mark>，原則由房屋所有人繳納；特種貨物及勞務稅以銷售價格為稅基，由出賣人繳納，惟房地部分<mark class=\"hl\">自105年1月1日起訂定銷售契約者停止課徵</mark>。</p>"], "ck": [{"x": "地價稅稅基＝同一縣市申報地價總額（平均§17Ⅰ、土稅§15），依§16累進，不是公告現值", "h": true}, {"x": "土稅§3 地價稅：所有權人；典權人、承領人、耕作權人、管理機關或管理人、分別共有按應有部分", "h": false}, {"x": "典權人與信託受託人都要寫：土稅§3、§3-1；房屋稅§4", "h": true}, {"x": "房屋稅稅基＝房屋現值，以§11房屋標準價格核計", "h": false}, {"x": "房屋稅§4：所有人；使用權人、典權人、共有推定一人、起造人、受託人", "h": false}, {"x": "特貨稅：稅基銷售價格、出賣人繳、持有2年內（15%／10%）", "h": false}, {"x": "交代105年1月1日起不動產部分停徵、改課房地合一", "h": true}], "mn": "地價稅看申報地價總額、所有權人 → 房屋稅看現值、所有人 → 特貨稅看售價、出賣人（已停徵）"}, {"id": "q-114-二", "no": "114-二", "t": "非都市土地適用土地稅法第39條第3項免徵土地增值稅之要件", "lv": "B", "k": "off", "tier": 1, "g": "地價稅・土地增值稅", "q": "甲所有位於A縣非都市土地一筆，擬出售予乙。雙方於訂定土地買賣契約之後，甲經他人告知得適用土地稅法第39條第3項本文規定而免徵土地增值稅，試說明該地所須具備之要件。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地增值稅，係已規定地價之土地於所有權移轉時，<mark class=\"hl\">按其土地漲價總數額徵收之稅</mark>（土地稅法第28條本文）；被徵收之土地免徵（第39條第1項前段）。非都市土地，指都市土地以外之土地（平均地權條例第3條第2款）。非都市土地已供公共設施使用而於被徵收前移轉，符合第39條第3項本文要件者，<mark class=\"hl\">準用第1項前段免徵</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第28條本文、第39條第1項前段、第3項、第4項、第49條第1項；平均地權條例第3條第2款；區域計畫法第15條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）須為非都市土地</p><p>甲地符合。<span class=\"art\">第39條第3項</span>之適用對象<mark class=\"hl\">限於非都市土地</mark>（<span class=\"art\">平均地權條例第3條第2款</span>）；都市計畫公共設施保留地另依同條第2項處理。甲地位於A縣非都市土地，符合。</p></div><div class=\"evp\"><p class=\"evh\">（二）須已開闢或核定供公設使用，並完成使用地編定</p><p>依<span class=\"art\">第39條第3項</span>本文，須「<mark class=\"hl\">經需用土地人開闢完成</mark>」或「<mark class=\"hl\">依計畫核定供公共設施使用</mark>」，且均須「<mark class=\"hl\">依法完成使用地編定</mark>」。甲地須已開闢為道路等公共設施或經核定列為公共設施用地，並已編定為相應之使用地（例如交通用地）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>非都市土地依區域計畫法第15條第1項，由直轄市或縣（市）政府編定各種使用地，實施管制。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）須為被徵收前之移轉</p><p>若已被徵收，則<mark class=\"hl\">直接依第1項前段免徵</mark>。甲於徵收前與乙訂約出售，符合。</p><p>受讓人不以需用土地人為限，甲售予一般私人乙亦屬之（售與需用土地人者另依第1項後段）。</p></div><div class=\"evp\"><p class=\"evh\">（四）須經需用土地人證明</p><p>依<span class=\"art\">第39條第3項</span>本文，須「<mark class=\"hl\">經需用土地人證明</mark>」始準用免徵；證明辦法由財政部會同有關機關定之（第4項）。甲應取得需用土地人之證明。</p></div><div class=\"evp\"><p class=\"evh\">（五）但書</p><p><mark class=\"hl\">變更為非公設使用後再移轉應課徵</mark>。以第一次免徵前之原規定地價，或最近一次課徵時核定之申報移轉現值為原地價計算漲價總數額。若乙取得後土地變更為非公共設施使用，乙再出售時<mark class=\"hl\">須負擔甲、乙兩段持有期間之漲價</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>甲地須具備：非都市土地、經需用土地人開闢完成或依計畫核定供公共設施使用並依法完成使用地編定、<mark class=\"hl\">於被徵收前移轉、經需用土地人證明</mark>，始得準用免徵。甲訂約後始得知不影響適用：應於申報移轉現值時檢附「<mark class=\"hl\">非都市土地供公共設施使用證明書</mark>」申請，申報期限為<mark class=\"hl\">訂約之日起30日內</mark>（土地稅法第49條第1項），甲宜立即向需用土地人申請證明（土地稅法第39條第3項本文、第4項）。</p>"], "ck": [{"x": "條號是土稅§39Ⅲ（準用Ⅰ前段），不是§39-2農業用地不課徵", "h": true}, {"x": "甲地位於A縣非都市土地，符合要件一", "h": false}, {"x": "開闢完成或依計畫核定供公設使用，且均須完成使用地編定", "h": false}, {"x": "甲於徵收前出售予乙，屬徵收前之移轉", "h": false}, {"x": "須經需用土地人證明（§39Ⅳ 證明辦法）", "h": true}, {"x": "四要件齊備 → 準用免徵土地增值稅", "h": false}, {"x": "但書：變更為非公設使用後再移轉，以第一次免徵前原地價課徵", "h": true}], "mn": "非（非都市）→ 開（開闢／核定＋編定）→ 前（徵收前）→ 證（需用土地人證明）→ 但書回溯課"}, {"id": "q-110-一", "no": "110-一", "t": "原地價意義＋土地增值稅作用＋配偶贈與原地價認定", "lv": "B", "k": "off", "tier": 1, "g": "地價稅・土地增值稅", "q": "何謂「原地價」？「原地價」在課徵土地增值稅的作用為何？配偶相互贈與之土地，不課徵土地增值稅。但於再移轉依法應課徵土地增值稅時，其「原地價」為何？請依規定說明之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>原地價係計算土地漲價總數額之基準起點：規定地價後未經移轉者為<mark class=\"hl\">原規定地價</mark>，曾經移轉者為<mark class=\"hl\">前次移轉現值</mark>（繼承取得者為<mark class=\"hl\">繼承開始時之公告土地現值</mark>），與申報移轉現值相減，即得該次移轉應課徵土地增值稅之漲價總數額。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第31條（原地價之認定與漲價總數額計算）、第32條（物價指數調整）、第33條（累進稅率）、第28條之2（配偶相互贈與不課徵及原地價承續）；平均地權條例第38條第2項（原規定地價）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原地價為原規定地價或前次移轉現值</p><p>依<span class=\"art\">土地稅法第31條第1項第1款</span>，規定地價後未經移轉之土地，<mark class=\"hl\">以原規定地價為準</mark>；曾經移轉者，<mark class=\"hl\">以前次移轉現值為準</mark>。原規定地價依<span class=\"art\">平均地權條例第38條第2項</span>，指民國53年規定之地價，其後舉辦者以第一次規定之地價為準。繼承取得者，前次移轉現值指<mark class=\"hl\">繼承開始時之公告現值</mark>（<span class=\"art\">第31條第2項</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）原地價之作用</p><p>決定漲價總數額及稅率級距。依<span class=\"art\">第31條第1項</span>，漲價總數額＝申報移轉現值－原規定地價或前次移轉現值－改良土地費用；依<span class=\"art\">第32條</span>，<mark class=\"hl\">原地價應按物價指數調整後再計算</mark>。依<span class=\"art\">第33條第1項</span>，漲價總數額超過原地價未達100%者，徵收20%；100%以上未達200%者，超過部分徵收30%；200%以上者，超過部分徵收40%。故<mark class=\"hl\">原地價愈高，漲價總數額愈小</mark>，適用級距亦愈低。</p></div><div class=\"evp\"><p class=\"evh\">（三）配偶贈與再移轉，以第一次不課徵前之原地價計算</p><p>依<span class=\"art\">第28條之2第1項</span>，配偶相互贈與之土地<mark class=\"hl\">得申請不課徵土地增值稅</mark>；但再移轉應課徵時，<mark class=\"hl\">以該土地第一次不課徵前之原規定地價</mark>或最近一次課徵土地增值稅時核定之申報移轉現值為原地價。依同條第2項，雙方持有期間支付之改良費用或增繳地價稅，準用<span class=\"art\">第31條</span>減除或抵繳。例如夫甲於100年以500萬元取得，110年贈與妻乙不課徵，乙115年出售時，原地價為500萬元，乙須就甲、乙兩段持有期間之全部漲價負擔。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）原地價為<mark class=\"hl\">原規定地價或前次移轉現值</mark>（繼承者為繼承開始時公告現值）。（二）其作用在<mark class=\"hl\">決定漲價總數額</mark>，並作為累進稅率級距之計算基準。（三）配偶贈與土地再移轉時，以第一次不課徵前之原規定地價或最近一次課徵時核定之申報移轉現值為原地價；<mark class=\"hl\">不課徵只是延後課稅，原地價承續計算</mark>。</p>"], "ck": [{"x": "§31Ⅰ① 未移轉→原規定地價；曾移轉→前次移轉現值；繼承→繼承開始時公告現值", "h": false}, {"x": "平均§38Ⅱ 原規定地價＝53年規定地價或第一次規定地價", "h": false}, {"x": "作用兩項都寫：漲價總數額減除起點（§31、§32）＋§33累進級距基準", "h": true}, {"x": "§28-2Ⅰ 配偶相互贈與「得申請不課徵」，不是免徵", "h": true}, {"x": "再移轉以第一次不課徵前之原地價計算，不是贈與時現值", "h": true}, {"x": "§28-2Ⅱ 改良費用、增繳地價稅準用減除抵繳；自住1年期間合併計算", "h": false}], "mn": "原地價＝起點 → 減出漲價、定級距 → 配偶贈與不課徵、原地價承續（延後不是免稅）", "hp": 1040, "hpl": "中"}, {"id": "q-106-一", "no": "106-一", "t": "土地移轉現值審核標準＋土地增值稅重購退稅", "lv": "B", "k": "off", "tier": 1, "g": "地價稅・土地增值稅", "q": "稅捐稽徵機關對於土地申報移轉現值之審核標準為何？又，土地增值稅得重購退稅之情形為何？請依土地稅法之規定，分別說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>申報移轉現值之審核標準依土地稅法第30條；重購退稅，指出售土地後<mark class=\"hl\">2年內重購</mark>合於規定之土地，得申請就已納土地增值稅額內<mark class=\"hl\">退還不足支付新購土地地價之數額</mark>（同法第35條第1項）。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第30條（平均地權條例第47條之1同）、第35條、第37條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）審核標準</p><p>以訂約日或收件日當期公告土地現值為準。依<span class=\"art\">土地稅法第30條第1項</span>，於訂定契約之日起<mark class=\"hl\">30日內申報者，以訂約日當期之公告土地現值為準</mark>；<mark class=\"hl\">逾30日申報者，以收件日當期為準</mark>；遺贈者以遺贈人死亡日當期為準；依法院判決移轉者以起訴日當期為準；經法院或行政執行分署拍賣者以拍定日當期為準，但拍定價額較低者以拍定價額為準；經政府照價收買或協議購買者以收買日或購買日當期為準，但給付地價較低者以給付地價為準。</p></div><div class=\"evp\"><p class=\"evh\">（二）低報得照價收買或按現值課稅</p><p>依同條第2項，第1款至第4款之申報移轉現值低於公告土地現值者，得由主管機關<mark class=\"hl\">照其申報現值收買</mark>，或<mark class=\"hl\">照公告土地現值徵收土地增值稅</mark>；第1款至第3款超過公告土地現值者，以其申報現值為準。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以公告土地現值為最低審核標準，防止低報。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）重購退稅</p><p>2年內重購且新購地價較高。依<span class=\"art\">第35條第1項</span>，出售土地後<mark class=\"hl\">自完成移轉登記之日起2年內重購</mark>，<mark class=\"hl\">新購地價超過原出售地價扣除土地增值稅後之餘額</mark>者，得申請退還不足支付之數額，情形有三：1.自用住宅用地出售後，另購都市土地未超過3公畝部分或非都市土地未超過7公畝部分仍作自用住宅用地；2.自營工廠用地出售後，另於都市計畫工業區或政府編定之工業用地內購地設廠；3.自耕之農業用地出售後，另購仍供自耕之農業用地。先購後售者準用之（第2項）；自用住宅及先購後售，<mark class=\"hl\">出售前1年內曾供營業使用或出租者不適用</mark>（第3項）。</p></div><div class=\"evp\"><p class=\"evh\">（四）5年內再移轉或改作他用應追繳</p><p>依<span class=\"art\">第37條</span>，重購之土地自完成移轉登記之日起<mark class=\"hl\">5年內再行移轉或改作其他用途者，應追繳原退還稅款</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>移轉現值以<mark class=\"hl\">訂約日（30日內申報）或收件日當期公告土地現值</mark>為審核標準，遺贈、判決、拍賣、政府收買另有基準；低報者得照價收買或按公告土地現值課稅。重購退稅限自用住宅用地、自營工廠用地、自耕農業用地於<mark class=\"hl\">2年內重購且新購地價較高</mark>者，<mark class=\"hl\">5年內再移轉或改作他用應追繳</mark>。</p>"], "ck": [{"x": "土稅§30：30日內申報→訂約日；逾期→收件日當期公告現值", "h": false}, {"x": "遺贈→死亡日、判決→起訴日、拍賣→拍定日、照價收買或協議購買→收買日、購買日", "h": false}, {"x": "低於公告現值得照申報收買或按公告現值課稅；高於者從申報", "h": false}, {"x": "土稅§35：自住、工廠、自耕三類，出售後2年內重購，退不足支付新購地價之數額", "h": false}, {"x": "先購後售期限也是2年，不是1年", "h": true}, {"x": "自住及先購後售：出售前1年內曾營業或出租者不適用", "h": true}, {"x": "土稅§37：重購後5年內再移轉或改作他用 → 追繳原退稅款", "h": true}], "mn": "訂件亡訴拍買買（審核基準日）→ 低報收買 → 2年重購、先購後售也2年 → 前1年營業出租排除 → 5年追繳"}, {"id": "mk-3", "no": "模3", "t": "模擬試題｜信託土地：不課徵土地增值稅之五種移轉與原地價認定", "lv": "模", "k": "mock", "tier": 1, "g": "地價稅・土地增值稅", "q": "一、甲以其所有A地成立信託並移轉予受託人乙。試依土地稅法規定回答下列問題：㈠土地為信託財產者，於哪些信託關係人間移轉所有權，不課徵土地增值稅？㈡前述不課徵土地增值稅之信託土地，嗣後於應課徵土地增值稅時，其原地價應如何認定？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地為信託財產者，於土地稅法第28條之3所列信託關係人間移轉所有權，<mark class=\"hl\">不課徵土地增值稅</mark>；嗣後應課徵時，依第31條之1認定原地價。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第28條之3、第5條之2、第31條之1第1項至第3項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）㈠不課徵之五種移轉</p><p>依<span class=\"art\">土地稅法第28條之3</span>，土地為信託財產者，於下列信託關係人間移轉所有權，<mark class=\"hl\">不課徵土地增值稅</mark>：</p><ol class=\"l5\"><li><b>信託成立</b>：委託人 → 受託人（第1款）<mark class=\"hl\">← 本題甲移轉A地予乙</mark></li><li><b>換受託人</b>：信託存續中受託人變更，原受託人 → 新受託人（第2款）</li><li><b>自益信託結束</b>：契約明定受益人就是委託人，信託消滅時，受託人 → 受益人（第3款）</li><li><b>遺囑信託結束</b>：因遺囑成立之信託，信託消滅時，受託人 → 受益人（第4款）</li><li><b>信託失效</b>：信託行為不成立、無效、解除或撤銷，委託人與受託人間（第5款）</li></ol><p class=\"mn\">口訣：成立、換人、自益滅、遺囑滅、失效回〔自編〕</p><p>第1、2、3、5款屬形式移轉；第4款遺囑信託則於成立時已比照繼承處理，故消滅時不再課徵。</p></div><div class=\"evp\"><p class=\"evh\">（二）㈡原則</p><p>接續原地價。A地嗣後由乙有償移轉、設定典權或轉為其自有土地，或移轉予甲以外之歸屬權利人時（<span class=\"art\">第5條之2</span>），即應課徵。依<span class=\"art\">第31條之1第1項</span>，「以該土地<mark class=\"hl\">第一次不課徵土地增值稅前之原規定地價</mark>或最近一次課徵土地增值稅時核定之申報移轉現值為原地價」，計算漲價總數額，<mark class=\"hl\">而非以信託移轉時之公告土地現值重新起算</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）㈡例外</p><p>以死亡日公告現值為原地價。因遺囑成立之信託，「其原地價指<mark class=\"hl\">遺囑人死亡日當期之公告土地現值</mark>」（<span class=\"art\">第31條之1第2項</span>）；自益信託受益人於存續中死亡，原地價為<mark class=\"hl\">受益人死亡日當期之公告土地現值</mark>，但藉信託契約不當規避或減少納稅義務者不適用（同條第3項）。</p></div>", "<span class=\"blk-l\">四、結論</span><p><p><b>㈠</b> 五種移轉不課徵（成立、換人、自益滅、遺囑滅、失效回）；甲移轉A地予乙屬第1款。</p><p><b>㈡</b> 原地價：</p><ol class=\"l5\"><li><b>原則</b>：<mark class=\"hl\">第一次不課徵前之原規定地價</mark>，或最近一次課徵土地增值稅時核定之申報移轉現值（§31-1Ⅰ）；計算漲價總數額時，再依物價指數調整（§32）</li><li><b>遺囑信託</b>：遺囑人死亡日當期之公告土地現值（§31-1Ⅱ）</li><li><b>自益信託，受益人於信託存續中死亡</b>：受益人死亡日當期之公告土地現值；藉信託規避或減少納稅義務者不適用（§31-1Ⅲ）</li></ol></p>", "<span class=\"blk-l\">一、定義</span><p><p>信託土地不課徵土地增值稅：土地為信託財產者，因信託關係人間移轉所有權，不課徵土地增值稅；嗣後應課徵時，以信託前之原地價（或前次移轉現值）為基礎計算漲價總數額。</p></p>", "<span class=\"blk-l\">二、法條</span><p><p>（一）不課徵情形（土稅§28-3）：土地為信託財產者，有下列信託關係人間移轉所有權之情形，不課徵土地增值稅：</p><p>１.因信託行為成立，委託人與受託人間之移轉。</p><p>２.信託關係存續中受託人變更時，原受託人與新受託人間之移轉。</p><p>３.信託契約明定信託財產之受益人為委託人者，於信託關係消滅時，受託人與受益人間之移轉。</p><p>４.因遺囑成立之信託，於信託關係消滅時，受託人與受益人間之移轉。</p><p>５.因信託行為不成立、無效、解除或撤銷，委託人與受託人間之移轉。</p><p>（二）原地價認定（土稅§31-1）：</p><p>１.一般原則：嗣後於所有權移轉、設定典權，或依信託法規定轉為受託人自有土地而應課徵土地增值稅時，以該土地「第一次不課徵土地增值稅前之原規定地價」或「最近一次課徵土地增值稅時核定之申報移轉現值」為原地價計算漲價總數額；前述原地價或前次移轉現值，並應依政府發布之物價指數調整後，再計算土地漲價總數額。</p><p>２.遺囑信託特殊規定：因遺囑成立之信託，於成立時以土地為信託財產者，嗣後有應課徵土地增值稅之情形時，以「遺囑人死亡日當期之公告土地現值」為原地價。</p><p>３.自益信託受益人死亡特殊規定：以自有土地交付信託，信託契約明定受益人為委託人並享有全部信託利益，而受益人於信託關係存續中死亡者，嗣後有應課徵土地增值稅之情形時，以「受益人死亡日當期之公告土地現值」為原地價；但委託人藉信託契約不當為他人或自己規避或減少納稅義務者，不適用之。</p></p>", "<span class=\"blk-l\">三、涵攝分析</span><p><p>（一）本題甲以A地成立信託移轉予受託人乙：屬第１款「因信託行為成立，委託人與受託人間之移轉」→ 不課徵。</p><p>（二）日後乙移轉或信託關係結束後應課徵時：一般情形以第一次不課徵前之原規定地價（或最近一次課徵時之申報移轉現值）為原地價，並依物價指數調整；若為遺囑信託，改以遺囑人死亡日當期公告土地現值；若為自益信託且受益人（委託人）信託中死亡，改以受益人死亡日當期公告土地現值（不當規避者不適用）。</p></p>", "<span class=\"blk-l\">四、結論</span><p><p>不課徵共五種（成立、受託人變更、受益人為委託人之消滅、遺囑信託消滅、不成立無效解除撤銷）；原地價＝一般原則（第一次不課徵前原規定地價／最近一次課徵申報移轉現值，物價指數調整）＋遺囑信託、自益信託受益人死亡兩種特殊規定（死亡日當期公告土地現值）。</p></p>"], "ck": [{"x": "條文用語是「不課徵」，不是「免徵」", "h": true}, {"x": "甲移轉A地予乙屬§28-3 第1款，不課徵", "h": false}, {"x": "五款寫齊，尤其第5款「信託不成立、無效、解除或撤銷」", "h": true}, {"x": "§5-2：受託人有償移轉、設典、轉自有 → 受託人；移轉委託人以外歸屬權利人 → 歸屬權利人", "h": false}, {"x": "原地價條號是§31-1（不是§31）：第一次不課徵前原規定地價或最近一次申報移轉現值", "h": true}, {"x": "不以信託移轉時公告現值計；遺囑人死亡日、受益人死亡日兩種例外", "h": false}], "mn": "成立、換人、自益滅、遺囑滅、失效回 → 不課徵 → §5-2 真移轉才課 → §31-1 往回接（遺囑人／受益人死亡日例外）", "hp": 1039, "hpl": "中"}, {"id": "pr-02", "no": "預P02", "t": "地價稅與土地增值稅：稅基＋納稅義務人＋特殊規則", "lv": "高", "k": "pred", "tier": 0, "g": "地價稅・土地增值稅", "q": "試比較地價稅與土地增值稅之稅基、納稅義務人及特殊規則（典權、信託、無償移轉等）。", "nq": 3, "b": ["<span class=\"blk-l\">一、性質</span><p>地價稅，指已規定地價之土地<mark class=\"hl\">按申報地價徵收之稅</mark>（平均地權條例第17條第1項）；土地增值稅，指已規定地價之土地於所有權移轉時<mark class=\"hl\">按土地漲價總數額徵收之稅</mark>（土地稅法第28條本文）。兩稅之稅基、納稅義務人與特殊規則皆不同，以下分項對照。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第3條、第3條之1、第5條、第15條、第28條、第28條之2、第28條之3、第31條、第31條之1。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）稅基</p><p><mark class=\"hl\">申報地價總額 vs 漲價總數額</mark>。依<span class=\"art\">第15條</span>，地價稅按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵，超過累進起點地價者累進課徵。依<span class=\"art\">第31條第1項</span>，土地增值稅以申報移轉現值減除原規定地價或前次移轉現值，及改良土地已支付之全部費用後之漲價總數額為稅基，<mark class=\"hl\">原地價並依物價指數調整</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）地價稅義務人</p><p><mark class=\"hl\">看誰持有或管理</mark>。依<span class=\"art\">第3條</span>，原則為土地所有權人；設有典權者為典權人；承領土地為承領人；承墾土地為耕作權人；公有或公同共有者為管理機關或管理人；分別共有者按應有部分。依<span class=\"art\">第3條之1</span>，信託關係存續中<mark class=\"hl\">以受託人為義務人</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）土地增值稅義務人</p><p>看誰移出或取得。依<span class=\"art\">第5條第1項</span>，<mark class=\"hl\">有償移轉為原所有權人</mark>；<mark class=\"hl\">無償移轉為取得所有權之人</mark>；<mark class=\"hl\">設定典權為出典人</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲賣地予乙，由甲繳；甲贈與其子丙，由丙繳。繼承依<span class=\"art\">第28條</span>但書免徵。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）特殊規則</p><p><mark class=\"hl\">不課徵＝延後課稅</mark>。①典權：地價稅向典權人課，設定典權時土地增值稅向出典人課。②信託：依<span class=\"art\">第28條之3</span>，委託人與受託人等信託關係人間之移轉不課徵；日後移轉依<span class=\"art\">第31條之1</span>，原則以<mark class=\"hl\">第一次不課徵前之原規定地價</mark>或最近一次課徵時核定之申報移轉現值為原地價。③配偶相互贈與：依<span class=\"art\">第28條之2</span>得申請不課徵，再移轉時同樣以第一次不課徵前之原地價計算。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維護漲價歸公，原地價承續計算。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>地價稅是<mark class=\"hl\">「持有稅」</mark>，按申報地價總額每年課徵，義務人看現在誰持有或管理土地；土地增值稅是<mark class=\"hl\">「移轉稅」</mark>，按漲價總數額課徵，義務人看誰移出或誰取得。信託、配偶贈與屬「不課徵但原地價承續」，<mark class=\"hl\">只是延後課稅，不是永久免稅；繼承才是免徵</mark>。</p>"], "ck": [{"x": "稅基：地價稅＝地價總額（§15、§16累進）；土增稅＝漲價總數額（§31）", "h": false}, {"x": "土稅§3 地價稅義務人：所有權人、典權人、承領人、耕作權人、管理人、分別共有按應有部分", "h": false}, {"x": "土稅§5 無償移轉（遺贈、贈與）由取得所有權之人繳，不是原所有權人", "h": true}, {"x": "地價稅看「現在誰用地或管地」；土增稅看「誰移出或誰取得」", "h": false}, {"x": "設定典權：地價稅典權人、土增稅出典人", "h": false}, {"x": "信託五種不課徵（§28-3），日後原則以不課徵前原地價計算；遺囑信託、自益信託受益人死亡者以死亡日當期公告現值（§31-1）", "h": true}, {"x": "繼承＝免徵；信託、配偶贈與＝不課徵、原地價承續（延後課稅）", "h": true}], "mn": "地價稅看誰持有、土增稅看誰移出取得 → 典權兩稅相反 → 信託、配偶不課徵承續；繼承免徵", "hp": 38, "hpl": "高"}, {"id": "pr-35", "no": "預P35", "t": "地價稅自用住宅用地：要件、面積、一處為限、申請，與土增稅自用住宅之比較", "lv": "高", "k": "pred", "tier": 0, "g": "地價稅・土地增值稅", "q": "何謂地價稅之自用住宅用地？其適用優惠稅率之要件、面積限制與次數限制為何？與出售自用住宅用地時之土地增值稅優惠稅率有何不同？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>自用住宅用地，指土地所有權人或其配偶、直系親屬<mark class=\"hl\">於該地辦竣戶籍登記</mark>，且<mark class=\"hl\">無出租或供營業用之住宅用地</mark>（土地稅法第9條）；合於第17條者，地價稅<mark class=\"hl\">按2‰計徵</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第9條、第16條、第17條、第41條、第34條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）定義</p><p>依<span class=\"art\">第9條</span>，自用住宅用地指土地所有權人或其<mark class=\"hl\">配偶、直系親屬於該地辦竣戶籍登記</mark>，且<mark class=\"hl\">無出租或供營業用</mark>之住宅用地。</p><p class=\"evx\"><span class=\"evt\">例</span><span>父母設籍於甲之A地房屋且未出租，即合於定義；一樓出租作店面則不合。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）面積</p><p>依<span class=\"art\">第17條第1項</span>，<mark class=\"hl\">都市土地面積未超過3公畝、非都市土地未超過7公畝</mark>部分，<mark class=\"hl\">按2‰計徵</mark>；超過部分回到<span class=\"art\">第16條</span>一般稅率。</p><p class=\"evx\"><span class=\"evt\">例</span><span>都市自住用地4公畝，3公畝按2‰，其餘1公畝依一般稅率。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）一處為限</p><p>依<span class=\"art\">第17條第3項</span>，土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率者<mark class=\"hl\">以一處為限</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>夫妻名下各有一處設籍自住，夫妻二人仍只能擇一處適用。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）申請</p><p>依<span class=\"art\">第41條第1項</span>，應於<mark class=\"hl\">每年地價稅開徵40日前提出申請</mark>，<mark class=\"hl\">逾期者自申請之次年開始適用</mark>；前已核定而用途未變更者，以後免再申請。依第2項，原因、事實消滅時應即申報。</p></div><div class=\"evp\"><p class=\"evh\">（五）與土地增值稅之比較</p><p>依<span class=\"art\">第34條第1項</span>，出售自用住宅用地，都市3公畝、非都市7公畝內，就漲價總數額<mark class=\"hl\">按10%徵收</mark>；依第4項<mark class=\"hl\">以一次為限</mark>，第5項另設再次適用要件；依第2項，出售前1年內曾供營業或出租者不適用。地價稅是每年之持有稅，<mark class=\"hl\">以「處」控管</mark>；土地增值稅是移轉時之一次性稅負，<mark class=\"hl\">以「次」控管</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲已用過一次土增稅優惠，不影響其每年就自住一處適用2‰。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>地價稅自用住宅用地須所有權人或其配偶、直系親屬設籍且無出租營業，<mark class=\"hl\">都市3公畝、非都市7公畝內按2‰</mark>，本人、配偶及未成年受扶養親屬<mark class=\"hl\">合計以一處為限</mark>，並須依限申請；與土地增值稅<mark class=\"hl\">「出售時、百分之十、以一次為限」</mark>不同，作答應以「處」與「次」區分。</p>"], "ck": [{"x": "土稅§17Ⅰ 都市3公畝、非都市7公畝內2‰", "h": true}, {"x": "§17Ⅲ 本人、配偶、未成年受扶養親屬合計一處", "h": true}, {"x": "地價稅看處、土增稅看次（§34Ⅳ 一次為限）", "h": true}], "mn": "自住地價：本人配偶直系設籍、無租營 → 3／7公畝內2‰ → 本人＋配偶＋未成年受扶養親屬一處 → 開徵前40日申請；土增看次"}, {"id": "pr-07", "no": "預P07", "t": "土地增值稅減免：自用住宅、重購退稅、配偶贈與、徵收免徵", "lv": "中", "k": "pred", "tier": 1, "g": "地價稅・土地增值稅", "q": "試說明土地增值稅得優惠稅率、減徵、免徵或不課徵之情形及其要件。", "nq": 5, "b": ["<span class=\"blk-l\">一、意義</span><p>土地增值稅，係已規定地價之土地於所有權移轉時，按其土地漲價總數額徵收之稅（土地稅法第28條本文）；土地稅法就特定情形設有<mark class=\"hl\">優惠稅率、減徵、免徵與不課徵四種</mark>規定。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第28條至第28條之3、第33條至第35條、第37條、第39條至第39條之2。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）優惠稅率</p><p>依土地稅法第34條第1項，出售自用住宅用地，都市土地未超過3公畝或非都市土地未超過7公畝部分<mark class=\"hl\">按10%徵收</mark>；<mark class=\"hl\">出售前1年內曾供營業使用或出租者不適用</mark>（第2項）；自用住宅之評定現值不及所占基地公告土地現值10%者不適用，但建築工程完成滿1年以上者不在此限（第3項）；<mark class=\"hl\">並以一次為限</mark>（第4項）；再出售符合面積一．五公畝或三．五公畝、無其他房屋、持有及設籍滿6年、5年內無營業出租者，不受一次之限制（第5項）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>照顧自住並防止濫用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）減徵</p><p>依<span class=\"art\">第33條第6項</span>至第8項，持有逾20年、30年、40年以上者，就超過最低稅率部分<mark class=\"hl\">分別減徵20%、三十、四十</mark>；依<span class=\"art\">第39條之1第1項</span>，<mark class=\"hl\">重劃後第一次移轉減徵40%</mark>，領回抵價地後第一次移轉準用之。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>長期持有非屬炒作，重劃地主已負擔共同負擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）免徵</p><p>依<span class=\"art\">第39條</span>，<mark class=\"hl\">被徵收之土地及公共設施保留地尚未被徵收前之移轉免徵</mark>；依<span class=\"art\">第28條</span>，<mark class=\"hl\">因繼承而移轉</mark>、公有土地出售或贈與及受贈之私有土地免徵；依<span class=\"art\">第28條之1</span>，私人捐贈供社會福利事業或私立學校使用，符合受贈人為財團法人等要件者免徵。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>徵收非自願、繼承非交易、捐贈為公益。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）不課徵</p><p>依<span class=\"art\">第28條之2</span>，「配偶相互贈與之土地，<mark class=\"hl\">得申請不課徵土地增值稅</mark>」，再移轉時以第一次不課徵前之原地價計算；依<span class=\"art\">第28條之3</span>，<mark class=\"hl\">信託移轉不課徵</mark>；依<span class=\"art\">第39條之2</span>，作農業使用之農業用地<mark class=\"hl\">移轉與自然人得申請不課徵</mark>，未作農業使用且逾期未恢復者，再移轉應課徵。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲將自耕農地移轉予子乙並繼續農用，可申請不課徵。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）重購退稅</p><p>依<span class=\"art\">第35條</span>，出售自用住宅用地、自營工廠用地或自耕農業用地<mark class=\"hl\">後2年內重購</mark>，新購地價超過原出售地價扣除已納稅額之餘額者，得申請<mark class=\"hl\">退還不足支付之數額</mark>；依<span class=\"art\">第37條</span>，<mark class=\"hl\">5年內再行移轉或改作其他用途者，應追繳</mark>原退還稅款。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免換屋者因繳稅而降低居住品質。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>土地增值稅之減免分為<mark class=\"hl\">優惠稅率、減徵、免徵、不課徵四類</mark>。<mark class=\"hl\">「免徵」原則上不再課徵</mark>，<mark class=\"hl\">「不課徵」多是延後課稅並承續原地價</mark>，惟保留地、非都市公設用地免徵後變更用途再移轉，仍以免徵前原地價課徵（土地稅法第39條第2項、第3項但書）。</p>"], "ck": [{"x": "土稅§34 自用住宅10%：都3公畝、非都7公畝，出售前1年未營業出租，一次為限", "h": false}, {"x": "一生一屋要件（1.5／3.5公畝、無其他房屋、持有及設籍6年、前5年無營業出租）要和一生一次分開寫", "h": true}, {"x": "重購退稅：2年內重購（§35）；重購後5年內再移轉或改作他用追繳（§37）", "h": true}, {"x": "§33 持有逾20／30／40年就超過最低稅率部分減20／30／40%；§39-1 重劃後首次移轉減40%", "h": false}, {"x": "免徵：§39 徵收、保留地、非都公設地；§28 繼承、公有、各級政府受贈；§28-1 捐贈社福私校", "h": false}, {"x": "不課徵：§28-2 配偶贈與、§28-3 信託、§39-2 農地移轉自然人", "h": false}, {"x": "免徵原則不再課（§39Ⅱ、Ⅲ 變更後再移轉、§39-1Ⅲ但書抵價地第一次移轉例外）；不課徵是延後課稅、承續原地價", "h": true}], "mn": "優惠10%（一次／一屋）→ 減徵看年數與重劃 → 免徵：繼・徵・公・保・捐 → 不課徵：農・配・信 → 重購2年退、5年追", "hp": 1041, "hpl": "中"}, {"id": "pr-29", "no": "預P29", "t": "土地增值稅計算題：漲價總數額、物價指數調整、累進稅率、長期持有減徵、自用住宅", "lv": "中", "k": "pred", "tier": 1, "g": "地價稅・土地增值稅", "q": "甲於前次移轉時核計土地增值稅之現值為新臺幣1,000萬元，持有期間繳納工程受益費100萬元。今甲以申報移轉現值3,200萬元出售該地，政府發布之物價指數為130%。請計算：（一）土地漲價總數額；（二）一般稅率之應納土地增值稅；（三）若甲持有該地已超過20年，應納稅額為何；（四）若符合自用住宅用地，應納稅額為何。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>土地增值稅係於土地所有權移轉或設定典權時，就土地自然漲價部分課徵之稅，<mark class=\"hl\">以土地漲價總數額為稅基</mark>，依漲價倍數累進課稅，以實現漲價歸公。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第31條、第32條、第33條第1項及第6項、第34條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）漲價總數額1,800萬元</p><p>依<span class=\"art\">土地稅法第31條第1項</span>，自申報移轉現值<mark class=\"hl\">減除前次移轉現值及改良土地費用</mark>（含已繳納之工程受益費）；依<span class=\"art\">第32條</span>，前次移轉現值「<mark class=\"hl\">應按政府發布之物價指數調整後</mark>，再計算其土地漲價總數額」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>1,000萬×130%＝1,300萬元，3,200萬－1,300萬－100萬＝1,800萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>排除通貨膨脹之名目漲價，並扣除所有權人自行投入之改良費用。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）一般稅率應納410萬元</p><p>依<span class=\"art\">第33條第1項</span>，<mark class=\"hl\">漲價未達100%者課20%</mark>；100%以上未達200%者，<mark class=\"hl\">超過部分課30%</mark>；200%以上者，<mark class=\"hl\">超過部分課40%</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>1,800萬÷1,300萬≈138%，1,300萬×20%＋500萬×30%＝260萬＋150萬＝410萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>漲價倍數愈高者負擔愈重。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）持有超過20年應納400萬元</p><p>依<span class=\"art\">第33條第6項</span>，「就其土地增值稅<mark class=\"hl\">超過第一項最低稅率部分減徵百分之二十</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>最低稅率稅額360萬元，超過部分50萬元減徵10萬元，應納400萬元；以410萬元全額減徵為常見錯誤。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>減輕長期持有負擔，但保留最低稅率部分。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）自用住宅用地應納180萬元</p><p>依<span class=\"art\">第34條第1項</span>，都市土地未超過3公畝或非都市土地未超過7公畝部分，<mark class=\"hl\">按10%徵收</mark>；<mark class=\"hl\">出售前1年內曾供營業使用或出租者不適用</mark>（第2項），且以一次為限（第4項）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>1,800萬×10%＝180萬元，已無超過最低稅率部分，不再減徵。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保障人民居住需要。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>本題<mark class=\"hl\">一般稅額410萬元</mark>、<mark class=\"hl\">持有超過20年400萬元</mark>、<mark class=\"hl\">自用住宅180萬元</mark>。</p>"], "ck": [{"x": "土稅§31Ⅰ 漲價總數額＝申報移轉現值－原地價－改良費用", "h": false}, {"x": "原地價先依§32 物價指數調整：1,000萬×130%＝1,300萬", "h": true}, {"x": "扣工程受益費100萬：漲價總數額1,800萬", "h": true}, {"x": "1,800÷1,300≈138% 屬第2級，分段算：260萬＋150萬", "h": true}, {"x": "一般稅率410萬元", "h": false}, {"x": "§33Ⅵ 只就超過最低稅率部分減20%：50萬×20%＝10萬", "h": true}, {"x": "持有逾20年應納400萬元（不是410萬×80%）", "h": false}, {"x": "自用住宅10%：應納180萬元", "h": false}], "mn": "調（物價指數）→ 減（改良費）→ 比（倍數）→ 分段 → 減徵只減超過20%", "hp": 1042, "hpl": "中"}, {"id": "pr-54", "no": "預P54", "t": "地價稅、房屋稅之減免與原因消滅：古蹟等免徵減徵（文資§99）、適用特別稅率或減免原因消滅未申報之罰則、再行出售罰鍰（土稅§54）", "lv": "中", "k": "pred", "tier": 1, "g": "地價稅・土地增值稅", "q": "依文化資產保存法，古蹟、歷史建築等及其所定著之土地，地價稅與房屋稅有何減免？土地所有權人適用特別稅率或減免地價稅之原因、事實消滅時未申報，依土地稅法有何處罰？土地買賣未辦竣移轉登記即再行出售者如何處罰？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>文化資產保存法第99條對古蹟等及其所定著土地<mark class=\"hl\">免徵或減徵房屋稅及地價稅</mark>；適用特別稅率之原因、事實消滅時<mark class=\"hl\">應即申報</mark>（土地稅法第41條第2項），未申報者依同法第54條第1項追補並處罰，同條第2項並處罰未辦竣移轉登記即再行出售者。</p>", "<span class=\"blk-l\">二、法條</span><p>文化資產保存法第99條；土地稅法第54條；平均地權條例第81條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）免徵</p><p>依文化資產保存法<span class=\"art\">第99條第1項</span>，「古蹟、考古遺址、歷史建築、紀念建築及其所定著之土地，<mark class=\"hl\">免徵房屋稅及地價稅</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>房屋經指定為古蹟，房屋及土地均免徵。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>補償保存所受之使用限制。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）減徵</p><p>依同條第2項，「聚落建築群、史蹟、文化景觀及其所定著之土地，<mark class=\"hl\">得在百分之五十範圍內減徵房屋稅及地價稅</mark>」，其範圍、標準及程序由直轄市、縣（市）主管機關訂定，報財政部備查。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>此類文化資產範圍較廣、限制程度不一，故以「得減徵」並授權地方訂定。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）原因消滅未申報</p><p>依<span class=\"art\">土地稅法第54條第1項</span>，適用特別稅率、減免地價稅或田賦之原因、事實消滅時未申報，逃稅或減輕稅賦者，「<mark class=\"hl\">除追補應納部分外</mark>，<mark class=\"hl\">處短匿稅額或賦額三倍以下之罰鍰</mark>」；規避繳納實物者，處應繳田賦實物額1倍之罰鍰。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>減免以特定事實為前提，事實消滅而不申報即屬逃漏。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>自用住宅用地改為出租營業未申報，追補差額並處3倍以下罰鍰。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）再行出售</p><p>依<span class=\"art\">第54條第2項</span>，「土地買賣未辦竣權利移轉登記，再行出售者，<mark class=\"hl\">處再行出售移轉現值百分之二以下之罰鍰</mark>。」</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止以未登記轉售規避稅負與炒作。對照<span class=\"art\">平均地權條例第81條</span>，同一行為「處應納登記費二十倍以下之罰鍰」，兩者基準不同。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）繳納</p><p>依<span class=\"art\">第54條第3項</span>，追補稅額及罰鍰應於<mark class=\"hl\">通知繳納之日起1個月內繳納</mark>，屆期不繳納者<mark class=\"hl\">移送強制執行</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>古蹟、考古遺址、歷史建築、紀念建築及其土地<mark class=\"hl\">免徵房屋稅及地價稅</mark>，聚落建築群、史蹟、文化景觀<mark class=\"hl\">得在50%範圍內減徵</mark>；減免原因消滅未申報者追補並<mark class=\"hl\">處3倍以下罰鍰</mark>，未辦竣移轉登記再行出售者<mark class=\"hl\">處移轉現值2%以下罰鍰</mark>，</p>"], "ck": [{"x": "文資§99 免徵 vs 減徵5成", "h": true}, {"x": "土稅§54Ⅰ 3倍以下", "h": true}, {"x": "土稅§54Ⅱ 移轉現值2%", "h": true}], "mn": "〔自編〕古蹟全免、聚落減半；減免沒了要報，不報罰3倍；沒過戶就轉賣罰2%"}, {"id": "q-114-一", "no": "114-一", "t": "公共設施用地 vs 公共設施保留地判別基準", "lv": "A", "k": "off", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "不動產經紀人員對不動產說明書依法負有「解說義務」。試以都市計畫法等法律之規定為例，列舉四項「判別基準」以解說都市計畫地區內「公共設施用地」與「公共設施保留地」兩者間之區別。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>公共設施用地係依「用途」劃定之土地；公共設施保留地則是其中依都市計畫法指定、未取得前仍屬私人所有之部分，兩者為<mark class=\"hl\">母集合與子集合之關係</mark>。兩者權益有本質差異，以下列舉四項判別基準。</p>", "<span class=\"blk-l\">二、法條</span><p>不動產經紀業管理條例第23條第1項；都市計畫法第42條、第48條、第50條、第50條之1、第50條之2、第51條；土地稅法第19條、第39條第2項；土地徵收條例第30條第1項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）基準一</p><p>法律地位－<mark class=\"hl\">是否已由政府取得</mark>。依<span class=\"art\">都市計畫法第42條第1項</span>，都市計畫地區應設置道路、公園、學校等公共設施用地；保留地則是其中指定、<mark class=\"hl\">未取得前仍屬私人所有之土地</mark>（<span class=\"art\">第48條</span>、<span class=\"art\">第50條第1項</span>）。解說時應先查登記簿。</p></div><div class=\"evp\"><p class=\"evh\">（二）基準二</p><p>使用限制。依<span class=\"art\">第51條</span>，保留地<mark class=\"hl\">不得為妨礙其指定目的之使用</mark>，但<mark class=\"hl\">得繼續為原來之使用或改為妨礙目的較輕之使用</mark>；依<span class=\"art\">第50條</span>，未取得前得申請臨時建築使用，經通知開闢時<mark class=\"hl\">應自行無條件拆除</mark>。已取得之用地所有權已歸政府，原所有權人已無使用權。</p></div><div class=\"evp\"><p class=\"evh\">（三）基準三</p><p>稅捐待遇。依<span class=\"art\">土地稅法第19條</span>，保留地在保留期間仍為建築使用者，除自用住宅用地外，<mark class=\"hl\">統按6‰計徵地價稅</mark>，未作任何使用並與使用中之土地隔離者免徵；依<span class=\"art\">第39條第2項</span>，徵收前之移轉<mark class=\"hl\">準用免徵土地增值稅</mark>，但變更為非公共設施保留地後再移轉，以第一次免徵前之原規定地價或最近一次課徵時核定之申報移轉現值為原地價課徵；依<span class=\"art\">都市計畫法第50條之1</span>，因繼承或配偶、直系血親間之贈與而移轉者，<mark class=\"hl\">免徵遺產稅或贈與稅</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）基準四</p><p>取得方式與補償。依<span class=\"art\">第48條</span>，保留地供公用事業設施之用者，由事業機構徵收或購買，其餘由該管政府<mark class=\"hl\">以徵收、區段徵收、市地重劃方式取得</mark>；依<span class=\"art\">第50條之2</span>，私有保留地<mark class=\"hl\">得申請與公有非公用土地交換</mark>。徵收時依<span class=\"art\">土地徵收條例第30條第1項</span>，<mark class=\"hl\">按毗鄰非公共設施保留地之平均市價補償</mark>。已取得之用地不再有取得與補償問題。</p></div>", "<span class=\"blk-l\">四、結論</span><p>四項判別基準為：<mark class=\"hl\">法律地位</mark>（是否已由政府取得）、<mark class=\"hl\">使用限制</mark>（原來使用、妨礙較輕之使用或臨時建築）、<mark class=\"hl\">稅捐待遇</mark>（地價稅、土地增值稅、遺產稅及贈與稅之優惠）、<mark class=\"hl\">取得方式與補償</mark>（尚待政府取得並給予補償）。保留地為<mark class=\"hl\">「已規劃但尚未取得」</mark>之過渡狀態，經紀人應據此向買方釐清。</p>"], "ck": [{"x": "都計§42 公設用地依用途劃定；保留地是其中尚未取得之私有部分（子集合）", "h": false}, {"x": "已取得的公設用地屬政府，原所有權人已無使用權，不可寫成能繼續使用", "h": true}, {"x": "都計§51 原使用或較輕使用；§50 臨時建築，開闢時無條件拆除", "h": false}, {"x": "土稅§19 兩種：建築使用者除自用住宅外6‰；未使用且隔離者免徵", "h": true}, {"x": "土稅§39Ⅱ 徵收前移轉免徵土增稅；都計§50-1 繼承、配偶直系血親贈與免遺贈稅", "h": false}, {"x": "都計§48 徵收、區段徵收、市地重劃；土徵§30Ⅰ 按毗鄰非保留地平均市價補償（都計§49 加成不適用（土徵§1Ⅲ 優先））", "h": false}, {"x": "四項基準列滿（位・限・稅・取），不能只寫一字之差；結論點出過渡狀態", "h": true}], "mn": "位（子集合）→ 限（原用・臨建）→ 稅（6‰・免土增・免遺贈）→ 取（徵收重劃・市價補償）", "hp": 12, "hpl": "高"}, {"id": "q-112-一", "no": "112-一", "t": "都市計畫農業區變更公共設施保留地（先行區段徵收）說明書解說＋禁止處分登記", "lv": "A", "k": "off", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "甲所有位於某號都市計畫農業區內土地一筆農地（其上建有一間合法農舍），該農業區多年前因實施都市計畫定期通盤檢討變更而變更為住宅區（但未發布實施），其土地開發方式於日前始經核定採取「先行區段徵收」，甲之農地於此次都市計畫通盤檢討變更時變更為公共設施保留地（道路），其土地登記簿上載有積欠地價稅新臺幣10萬元之「禁止處分登記」。甲於獲悉上述資訊後隨即委託A仲介公司代為出售其地，乙對該地有承買意願。若你為A仲介公司之經紀營業員，依法應以該地之「不動產說明書」向乙為「解說」 ，請你從該地所涉及地用與地權法規及其影響之觀點，各提出一點以作為解說之重要內容，以利乙作為承買該地與否之重要依據。又上文所述「先行區段徵收」之意涵與目的各為何？又依法你亦有協助甲與乙公平合理地完成該地買賣契約簽約作業之義務，則應如何處理其上「禁止處分登記」？試依法分述之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、爭點</span><p>本題涉及公共設施保留地使用限制（地用）、欠稅禁止處分登記（地權）及先行區段徵收。經紀營業員應依不動產經紀業管理條例第23條第1項，<mark class=\"hl\">以不動產說明書向乙解說</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第50條、第51條、第52條；土地徵收條例第4條第2項、第30條、第39條第1項、第40條第1項；土地登記規則第136條；稅捐稽徵法第24條第1項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地用</p><p><mark class=\"hl\">道路保留地使用受限，且將被區段徵收</mark>。依<span class=\"art\">都市計畫法第51條</span>，公共設施保留地不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用；依<span class=\"art\">第50條</span>，未取得前得申請臨時建築。本題甲地已變更為道路保留地，乙買受後只能繼續供農業及合法農舍使用或申請臨時建築，不能期待依住宅區興建；又已核定採先行區段徵收，乙將依<span class=\"art\">土地徵收條例第30條</span>受補償地價，得於徵收公告期間內<mark class=\"hl\">以書面申請抵價地，或領取現金</mark>（<span class=\"art\">第39條第1項</span>、<span class=\"art\">第40條第1項</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）地權</p><p><mark class=\"hl\">欠稅禁止處分登記塗銷前不能移轉</mark>。依土地登記規則<span class=\"art\">第136條</span>，限制登記包括其他依法律所為禁止處分之登記。本題甲積欠地價稅10萬元，依稅捐稽徵法<span class=\"art\">第24條第1項</span>，稽徵機關得通知有關機關<mark class=\"hl\">不得為移轉或設定他項權利</mark>，故塗銷前甲無從移轉予乙。</p></div><div class=\"evp\"><p class=\"evh\">（三）先行區段徵收</p><p><mark class=\"hl\">先徵收、後發布都市計畫</mark>，以加速開發。依<span class=\"art\">土地徵收條例第4條第2項</span>，同條第1項第1款至第3款之開發範圍經中央主管機關核定者，得先行區段徵收，並於<mark class=\"hl\">公告期滿後1年內發布實施都市計畫</mark>，不受<span class=\"art\">都市計畫法第52條</span>之限制。本題農業區變更為住宅區，屬第1項第3款情形。其目的在加速整體開發，避免等待都市計畫程序延宕公共設施用地之取得。</p></div><div class=\"evp\"><p class=\"evh\">（四）處理</p><p><mark class=\"hl\">先清償塗銷，再辦移轉</mark>。作法：由甲於簽約前清償地價稅10萬元並塗銷登記；無法即時清償者，於契約明定由乙代為清償、<mark class=\"hl\">自應付價金中扣除</mark>，待塗銷完成始辦所有權移轉登記，使雙方均不必先承擔對方不履行之風險。</p></div>", "<span class=\"blk-l\">四、結論</span><p>地用上，該地為道路保留地，<mark class=\"hl\">僅得為原來使用或臨時建築</mark>，且將被區段徵收；地權上，<mark class=\"hl\">欠稅禁止處分登記未塗銷前不能移轉</mark>。先行區段徵收係先辦區段徵收、<mark class=\"hl\">公告期滿後1年內再發布實施都市計畫</mark>，目的在加速開發。禁止處分登記應由甲先清償塗銷，或約定乙自價金中代償，塗銷後再辦移轉。</p>"], "ck": [{"x": "都計§51 保留地只能繼續原來使用或改為妨礙較輕之使用；§50 臨時建築須無條件拆除", "h": false}, {"x": "道路保留地＋已核定區段徵收：乙不能依住宅區建築，將被徵收，可選抵價地或現金", "h": false}, {"x": "欠稅禁止處分依稅捐稽徵法§24Ⅰ通知不得移轉，屬土登§136「其他依法律所為禁止處分之登記」，塗銷前甲不能移轉（不是預告登記，也不直接套用§141）", "h": true}, {"x": "土徵§4Ⅱ 核定後先行區段徵收，公告期滿後1年內發布實施都市計畫", "h": false}, {"x": "先行區段徵收意涵（先徵收、後發布都計）與目的（加速開發）兩者都要寫", "h": true}, {"x": "具體處理：先清償塗銷再移轉；或約定乙代償、自價金扣除，塗銷後移轉", "h": true}], "mn": "地用：保留地只能原用 → 將被區段徵收；地權：禁止處分 → 先清償塗銷再移轉；先行區徵＝先徵收、1年內發布都計", "hp": 13, "hpl": "高"}, {"id": "q-99-一", "no": "99-一", "t": "都市計畫土地（細部計畫未發布／區段徵收）不動產說明書解說", "lv": "A", "k": "off", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "甲所有位於A市都市計畫範圍內土地二筆，其中一筆（下稱X地）依其主要計畫書所示，其使用別為住宅區建築用地，惟迄未發布細部計畫；另一筆土地（下稱Y地）使用別與X地相同，但其主要計畫書載明未來將採「區段徵收」之整體開發方式。甲因需錢孔急乃委託乙不動產經紀人代為出售該兩筆土地。嗣後乙乃撮合承買人丙與甲簽訂該兩筆土地之買賣契約書，乙依法對丙應負有該兩筆土地說明書之解說義務，試就「土地使用（管制）」面向闡述旨揭兩筆土地說明書之內容。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>經紀人員在執行業務過程中，應<mark class=\"hl\">以不動產說明書向與委託人交易之相對人解說</mark>（不動產經紀業管理條例第23條第1項）。X地涉細部計畫未發布之建築限制，Y地涉區段徵收，均屬應解說之重要事項。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第17條第2項、第22條；土地徵收條例第39條、第40條第1項、第44條第1項第1款；不動產經紀業管理條例第23條、第24條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）X地</p><p><mark class=\"hl\">原則限制建築，但有條件可建</mark>。依<span class=\"art\">都市計畫法第17條第2項</span>，未發布細部計畫地區，<mark class=\"hl\">應限制其建築使用及變更地形</mark>；但<mark class=\"hl\">主要計畫發布已逾2年以上</mark>，而能確定建築線或主要公共設施已照主要計畫興建完成者，得由主管建築機關指定建築線，核發建築執照。X地雖為住宅區建築用地，但迄未發布細部計畫，乙應載明須符合上開例外始得申請指定建築線、核發建照，不能僅以「住宅區」向丙表示可立即建築。因細部計畫才確定道路系統及土地使用分區管制（<span class=\"art\">第22條</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）Y地</p><p>將被區段徵收，應說明補償選擇。依<span class=\"art\">土地徵收條例第39條第1項</span>，區段徵收按徵收當期之市價補償地價，但<mark class=\"hl\">得經土地所有權人申請，以徵收後可供建築之抵價地折算抵付</mark>；同條第2項，抵價地總面積<mark class=\"hl\">以徵收總面積50%為原則</mark>，特殊情形<mark class=\"hl\">不得少於40%</mark>。依<span class=\"art\">第40條第1項</span>，不願領取現金補償者，應<mark class=\"hl\">於徵收公告期間內以書面申請</mark>發給抵價地；依<span class=\"art\">第44條第1項第1款</span>，按應領地價補償費與區段徵收補償地價總額之比率計算權利價值，以實際領回抵價地之單位地價折算。乙應向丙說明抵價地並非原地原面積發還；若Y地亦未發布細部計畫，同受<span class=\"art\">第17條第2項</span>之限制。</p></div><div class=\"evp\"><p class=\"evh\">（三）乙應分項載明並踐行簽章、交付程序</p><p>依經紀條例<span class=\"art\">第23條</span>，<mark class=\"hl\">說明書於提供解說前應經委託人簽章</mark>；依<span class=\"art\">第24條</span>，簽訂買賣契約書時，經紀人應將說明書交付相對人並由其簽章，<mark class=\"hl\">說明書視為買賣契約書之一部分</mark>。本題委託人為甲、相對人為丙，乙應將X地、Y地之使用管制分項寫入說明書，經甲簽章後向丙解說，簽約時交付丙簽章。</p></div>", "<span class=\"blk-l\">四、結論</span><p>X地應載明<mark class=\"hl\">「建築受限但有條件可建」</mark>，須符合主要計畫發布逾2年等例外始得核發建照。Y地應載明<mark class=\"hl\">「未來將被區段徵收」</mark>：得選擇現金補償或於公告期間內書面申請抵價地，<mark class=\"hl\">非原面積發還</mark>。乙並應依經紀條例第23條、第24條踐行簽章與交付，使丙充分知情。</p>"], "ck": [{"x": "經紀條例§23：應以說明書向丙解說；使用管制屬影響權利、價值之重要事項（意旨，非條文字句）", "h": false}, {"x": "都計§17Ⅱ：細部計畫未發布 → 限制建築使用及變更地形", "h": false}, {"x": "X地不能寫成「絕對不能建」：主要計畫發布逾2年且能定建築線或主要公設已完成 → 可指定建築線、核發建照", "h": true}, {"x": "土徵§39Ⅰ：區段徵收按當期市價補償，得申請以抵價地折算抵付", "h": false}, {"x": "Y地要寫：現金或公告期間內書面申請抵價地（§40Ⅰ），比例50%／40%／45%，非原地原面積", "h": true}, {"x": "§23 解說前經甲簽章；§24 簽約時交付丙簽章，視為買賣契約一部分", "h": false}, {"x": "回到說明書義務：X地有條件可建、Y地有徵收風險得選抵價地，分項載明於說明書", "h": true}], "mn": "說明書主動告知 → X：限建＋逾2年例外 → Y：現金或抵價地50／40／45 → 甲簽、丙簽、成契約"}, {"id": "q-99-二", "no": "99-二", "t": "公共設施保留地實質課稅、徵收補償、土地增值稅", "lv": "B", "k": "off", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "甲所有位於A市都市計畫範圍內土地一筆（下稱系爭土地），被都市計畫主管機關依法指定為「市場」公共設施保留地，惟迄未被徵收，都市計畫主管機關告以得為臨時建築使用，甲乃規劃興建為攤販集中場並出租他人供作擺攤之用。不久，A市稅捐稽徵機關稽查人員發現系爭土地之使用內涵與毗鄰商業（場）用地相同，乃基於租稅法上「實質課稅原則」而以該商業用地之地價向甲發單課徵地價稅，甲不服並主張應以系爭土地之地價為稅基計徵地價稅，問甲之主張有無理由？倘若日後系爭土地被徵收時，其地價補償標準為何？若甲於系爭土地被徵收前將之出售予乙，A市稅捐稽徵機關應如何徵收其土地增值稅？又，乙於取得期間系爭土地變更為非公共設施保留地，若乙打算將之出售予丙，則A市稅捐稽徵機關應如何徵收其土地增值稅？理由為何？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>公共設施保留地，係都市計畫指定供公共設施使用、但<mark class=\"hl\">尚未由政府取得之私有土地</mark>；保留期間所有權仍屬原所有權人，僅得繼續原來之使用、改為妨礙目的較輕之使用或<mark class=\"hl\">申請臨時建築使用</mark>（都市計畫法第50條、第51條）。地價稅則按經核列歸戶冊之申報地價課徵。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第17條第1項；土地稅法第15條（地價總額）、第19條（保留期間仍為建築使用者，除自用住宅外統按千分之六）、第39條第2項；納稅者權利保護法第7條（原稅捐稽徵法第12條之1）；土地徵收條例第30條第1項；都市計畫法第50條第2項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲之主張有理由</p><p>地價稅稅基為「該筆土地」經核列歸戶冊之申報地價，屬法定課稅要件（<span class=\"art\">平均地權條例第17條第1項</span>、<span class=\"art\">土地稅法第15條</span>）；實質課稅原則仍須在租稅法律主義範圍內適用（納稅者權利保護法<span class=\"art\">第7條</span>），<mark class=\"hl\">不能變更法定稅基</mark>。系爭土地縱使用內涵與商業用地相同，法律地位仍為保留地，且屬保留期間仍為建築使用，依<span class=\"art\">土地稅法第19條</span>應以其申報地價<mark class=\"hl\">按6‰計徵</mark>。<mark class=\"hl\">稽徵機關之核課欠缺法律依據</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）按毗鄰非公共設施保留地之平均市價補償</p><p>依<span class=\"art\">土地徵收條例第30條第1項</span>，<mark class=\"hl\">按毗鄰非公共設施保留地之平均市價補償地價</mark>。甲之攤販集中場屬臨時建築，依<span class=\"art\">都市計畫法第50條第2項</span>，經通知開闢限期拆除時<mark class=\"hl\">應自行無條件拆除</mark>。（考試年度官方答案係依<span class=\"art\">都市計畫法第49條</span>，屬<span class=\"art\">土地徵收條例第30條</span>修正前之標準。）</p></div><div class=\"evp\"><p class=\"evh\">（三）甲售乙免徵土地增值稅</p><p>依<span class=\"art\">土地稅法第39條第2項</span>前段，保留地尚未被徵收前之移轉，<mark class=\"hl\">準用被徵收土地免徵之規定</mark>。系爭土地為「市場」保留地，甲於徵收前出售予乙，<mark class=\"hl\">應免徵</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）乙售丙應課徵，原地價回溯至甲免徵前</p><p>依同項但書，變更為非公共設施保留地後再移轉時，<mark class=\"hl\">以第一次免徵前之原規定地價</mark>或最近一次課徵土地增值稅時核定之申報移轉現值為原地價計算漲價總數額。甲售乙為第一次免徵，故乙應<mark class=\"hl\">就甲、乙兩段持有期間之全部漲價負擔</mark>；否則甲持有期間之漲價將永久免稅，違反漲價歸公。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）<mark class=\"hl\">甲之主張有理由</mark>，應按系爭土地申報地價以6‰課徵。（二）徵收時<mark class=\"hl\">按毗鄰非公共設施保留地之平均市價補償</mark>。（三）<mark class=\"hl\">甲售乙免徵土地增值稅</mark>。（四）乙售丙應<mark class=\"hl\">以第一次免徵前之原地價計算</mark>漲價總數額課徵。</p>"], "ck": [{"x": "平均§17Ⅰ、土稅§15：地價稅稅基＝該筆土地經規定地價核列歸戶冊之申報地價", "h": true}, {"x": "爭點是稅基：實質課稅（納保法§7）只認定事實、須在租稅法律主義內，不能改法定稅基", "h": false}, {"x": "甲有理由：保留期間仍為建築使用，依土稅§19 除自用住宅外按6‰", "h": false}, {"x": "土徵§30Ⅰ 按毗鄰非保留地平均市價補償；臨時建築依都計§50Ⅱ 自行無條件拆除", "h": true}, {"x": "甲於徵收前賣乙：土稅§39Ⅱ前段 準用免徵土地增值稅", "h": false}, {"x": "乙賣丙應課徵，原地價為第一次免徵前原規定地價或最近一次課徵時申報移轉現值，不是乙的取得價格", "h": true}, {"x": "乙負擔甲乙兩段漲價；免徵只是延後課稅，不是漲價消失", "h": false}], "mn": "稅基看申報 → 補償看毗鄰 → 徵收前免 → 變更後追（回溯第一次免徵前）", "hp": 14, "hpl": "高"}, {"id": "q-102-一", "no": "102-一", "t": "禁止土地所有權移轉三項規定＋公共設施保留地使用限制", "lv": "C", "k": "off", "tier": 2, "g": "都市計畫・公共設施保留地・說明書解說", "q": "按土地法、平均地權條例及土地徵收條例中，均各有若干限制土地所有權人行使土地權利之規定。請就其中，舉出三項「禁止土地所有權移轉」之規定內容。又，都市計畫法對於公共設施保留地之使用，有何限制之規定？請敘述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>法律就特定土地或特定期間設有<mark class=\"hl\">禁止土地所有權移轉</mark>之規定（土地法第17條第1項、土地徵收條例第23條第1項、平均地權條例第53條第3項、第59條第1項）；公共設施保留地之使用另受都市計畫法第50條、第51條限制。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第17條；土地徵收條例第23條；平均地權條例第53條、第59條；都市計畫法第50條、第51條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）土地法第17條</p><p>特定土地禁止移轉於外國人。林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，<mark class=\"hl\">不得移轉、設定負擔或租賃於外國人</mark>（第1項）。但因繼承取得者不在禁止之列，惟應於<mark class=\"hl\">辦理繼承登記完畢之日起3年內出售與本國人</mark>，逾期未出售者，由地政機關移請國有財產局（現財政部國有財產署）公開標售（第2項）。</p></div><div class=\"evp\"><p class=\"evh\">（二）土地徵收條例第23條</p><p>徵收公告後禁止移轉。被徵收之土地或土地改良物<mark class=\"hl\">自公告日起，不得分割、合併、移轉或設定負擔</mark>，並不得為建築改良物之新建、增建、改建或採取土石、變更地形（第1項）。例外：公告前因繼承、強制執行或法院之判決而取得權利，並<mark class=\"hl\">於公告期間內申請登記</mark>者；共有分管之耕地部分被徵收者，得申請共有物分割登記或應有部分交換移轉登記（第2項）。</p></div><div class=\"evp\"><p class=\"evh\">（三）平均地權條例第53條、第59條</p><p>開發地區得公告禁止移轉。區段徵收地區選定後，徵收機關得報經上級主管機關核定，公告禁止土地移轉、分割、設定負擔及建築改良物之新建等，<mark class=\"hl\">禁止期間以1年六個月為期</mark>（<span class=\"art\">第53條第3項</span>、第4項）；市地重劃地區選定後，直轄市或縣（市）政府得報經核定公告禁止或限制同一事項，<mark class=\"hl\">期間不得超過1年6個月</mark>，且<mark class=\"hl\">無須徵詢所有權人之意見</mark>（<span class=\"art\">第59條</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（四）保留地</p><p><mark class=\"hl\">不得妨礙指定目的，得原使用或臨時建築</mark>。依<span class=\"art\">都市計畫法第51條</span>，保留地不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用；依<span class=\"art\">第50條</span>，未取得前得申請臨時建築使用，經通知開闢並限期拆除時，<mark class=\"hl\">應自行無條件拆除</mark>，不自行拆除者予以強制拆除。</p><p class=\"evx\"><span class=\"evt\">例</span><span>公園保留地原作停車場者得繼續使用。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>三項禁止移轉規定為土地法第17條、土地徵收條例第23條、平均地權條例第53條及第59條。公共設施保留地僅得<mark class=\"hl\">繼續原來之使用、改為妨礙目的較輕之使用或申請臨時建築</mark>，通知開闢時<mark class=\"hl\">應自行無條件拆除</mark>。</p>"], "ck": [{"x": "土地法§17 七款土地不得移轉、設定負擔或租賃於外國人", "h": false}, {"x": "土徵§23 徵收公告日起不得分割、合併、移轉或設定負擔", "h": false}, {"x": "第三項寫平均§53、§59，不是國有財產法", "h": true}, {"x": "區段徵收、市地重劃禁止期間是1年6個月，不是1年", "h": true}, {"x": "都計§51 不得妨礙指定目的，但得繼續原來使用或改為妨礙較輕", "h": false}, {"x": "都計§50 臨時建築，經通知開闢應自行無條件拆除", "h": false}, {"x": "三項禁止移轉之外，必須另答保留地使用限制", "h": true}], "mn": "外國人七款（§17）→ 徵收公告（土徵§23）→ 區徵重劃1年6個月（平均§53、§59）→ 保留地原使用、臨時建築要拆（都計§51、§50）"}, {"id": "pr-01", "no": "預P01", "t": "公共設施保留地 × 說明書解說（取得方式、稅、使用限制）", "lv": "高", "k": "pred", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "甲委託乙經紀人出售一筆都市計畫公共設施保留地，請問乙應就地用、地權及稅費三面向向買方解說哪些重點？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>公共設施保留地，是都市計畫指定、尚未由政府取得之私有土地，<mark class=\"hl\">所有權仍在私人，但使用受限</mark>，且隨時可能被取得。經紀人依不動產經紀業管理條例第23條，應以不動產說明書就<mark class=\"hl\">地用、地權、稅費</mark>三面向向買方解說，</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第48條（取得方式）、第50條（臨時建築，通知開闢時應自行無條件拆除）、第51條（不得妨礙指定目的之使用）；土地徵收條例第30條第1項；土地稅法第19條、第39條第2項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地用</p><p><mark class=\"hl\">只能原使用或臨時建築</mark>。依<span class=\"art\">都市計畫法第51條</span>，保留地不得為妨礙指定目的之使用，但得繼續原來之使用或改為妨礙目的較輕之使用；依<span class=\"art\">第50條</span>，未取得前得申請臨時建築使用，經通知開闢限期拆除時，<mark class=\"hl\">應自行無條件拆除</mark>。乙應說明指定用途、現況使用，以及開闢時須無條件拆除之風險，避免買方誤以為可正常建築。</p></div><div class=\"evp\"><p class=\"evh\">（二）地權</p><p>所有權在，但隨時可能被取得。依<span class=\"art\">第48條</span>，由該管政府<mark class=\"hl\">以徵收、區段徵收或市地重劃方式取得</mark>（供公用事業者由事業機構徵收或購買）。乙應查明登記簿有無限制登記、他項權利及租約。徵收時依<span class=\"art\">土地徵收條例第30條第1項</span>，<mark class=\"hl\">按毗鄰非公共設施保留地之平均市價補償</mark>，並非以買方之買價計算。</p></div><div class=\"evp\"><p class=\"evh\">（三）稅費</p><p><mark class=\"hl\">持有輕、移轉免、變更後追課</mark>。依<span class=\"art\">土地稅法第19條</span>，保留期間仍為建築使用者，除自用住宅用地外<mark class=\"hl\">按6‰計徵地價稅</mark>；未作任何使用並與使用中土地隔離者，免徵。依<span class=\"art\">第39條第2項</span>，徵收前之移轉<mark class=\"hl\">準用免徵土地增值稅</mark>；但變更為非公共設施保留地後再移轉，以第一次免徵前之原規定地價或最近一次課徵時核定之申報移轉現值為原地價計算。本題甲出售免徵；買方日後於變更後出售，須以甲免徵前之原地價計算漲價。</p></div>", "<span class=\"blk-l\">四、結論</span><p>保留地之交易重點在<mark class=\"hl\">「所有權雖在、使用受限、隨時可能被取得」</mark>。乙應將地用限制、取得方式與補償標準、稅費優惠與變更後追課風險，<mark class=\"hl\">分項載入說明書</mark>並提示買方，始算履行解說義務。</p>"], "ck": [{"x": "都計§51 原使用或妨礙較輕之使用；§50 臨時建築開闢時無條件拆除", "h": false}, {"x": "說明書寫明不能興建永久建物，臨時建築開闢時須拆除", "h": false}, {"x": "都計§48 取得方式：徵收、區段徵收、市地重劃", "h": false}, {"x": "查登記簿有無限制登記、他項權利與租約", "h": false}, {"x": "補償現行按毗鄰非保留地平均市價（土徵§30Ⅰ），§49 加成不適用（土徵§1Ⅲ 優先）", "h": true}, {"x": "土稅§19 建築使用除自用住宅外6‰，隔離未使用免徵", "h": false}, {"x": "§39Ⅱ 本次免徵，但變更為非保留地後再移轉，以第一次免徵前原地價課徵", "h": true}, {"x": "地用、地權、稅費三面向都要寫，不能只寫稅", "h": true}], "mn": "地用：原使用、臨時建築要拆 → 地權：隨時被取得、補償按市價 → 稅費：6‰、免土增、變更後追課", "hp": 15, "hpl": "高"}, {"id": "pr-34", "no": "預P34", "t": "公共設施保留地之規定地價：以毗鄰商業用地查估公告地價，甲之主張有無道理", "lv": "高", "k": "pred", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "甲有一筆被指定為「公園」之公共設施保留地。今甲將該地臨時建築作攤販集中場，惟政府卻以其毗鄰商業用地查估其公告地價，課以地價稅。甲不服地價查估方式，主張應以較低價格為之，試問甲之主張有無道理？", "nq": 1, "b": ["<span class=\"blk-l\">一、爭點</span><p>地價稅按申報地價課徵，<mark class=\"hl\">申報地價以公告地價為基準</mark>（平均地權條例第16條、第17條第1項），故公告地價之查估直接決定稅負。爭點：公園保留地之公告地價，得否以毗鄰商業用地之地價查估？</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第15條、第16條、第46條；同條例施行細則第63條、第64條；地價調查估計規則第18條第4項；都市計畫法第50條、第51條；土地稅法第19條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）現況</p><p>依施行細則<span class=\"art\">第63條</span>，查估土地現值時，保留地<mark class=\"hl\">以毗鄰非公共設施保留地之區段地價平均計算</mark>；依<span class=\"art\">第64條</span>，地價評議委員會<mark class=\"hl\">得以土地現值表作為評定公告地價之參考</mark>，故甲地之公告地價可能間接反映毗鄰商業用地而偏高。</p></div><div class=\"evp\"><p class=\"evh\">（二）就情</p><p>保留地只能繼續原來之使用、改為妨礙較輕之使用或臨時建築，<mark class=\"hl\">通知開闢時須無條件拆除且不補償</mark>（<span class=\"art\">都市計畫法第50條</span>、<span class=\"art\">第51條</span>）；不補償其使用損失，反以商業地價加重持有稅，<mark class=\"hl\">於情不通</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）就理</p><p><mark class=\"hl\">地價應反映可利用程度</mark>，保留地只能低度使用，價值低於商業用地。依平均地權條例第46條，土地現值表係作為申報、審核土地移轉現值及補償徵收土地地價之依據，<mark class=\"hl\">並非為課徵地價稅而設</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）就法</p><p>細則<span class=\"art\">第63條</span>明定適用於「依本條例第四十六條查估土地現值時」，並非公告地價（<span class=\"art\">第14條</span>、<span class=\"art\">第15條</span>）之直接依據；但<span class=\"art\">第64條</span>及地價調查估計規則<span class=\"art\">第18條第4項</span>但書，使毗鄰地價得間接進入公告地價，故<mark class=\"hl\">只能說依據薄弱</mark>，<mark class=\"hl\">不宜斷言完全於法無據</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）緩和</p><p>甲得於公告期間申報地價，<mark class=\"hl\">最低至公告地價80%</mark>（<span class=\"art\">第16條</span>）；且臨時建築屬保留期間仍為建築使用，依<span class=\"art\">土地稅法第19條</span><mark class=\"hl\">按6‰計徵</mark>。惟稅率優惠不能取代稅基之合理性。</p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">甲之主張不無道理</mark>：就情、理，以商業地價查估使用受限之保留地，與細則第63條保障補償之目的相悖；就法，該條是公告土地現值之規定，僅能間接適用於公告地價，<mark class=\"hl\">依據薄弱</mark>。<mark class=\"hl\">甲現行得申報至8成並適用6‰</mark>；立法上宜明定保留地公告地價應反映其使用限制。</p>"], "ck": [{"x": "先交代公告地價 → 申報地價（平均§16）→ 地價稅稅基（平均§17Ⅰ、土稅§15）", "h": true}, {"x": "細則§63：依§46查估土地現值時，保留地以毗鄰非保留地之區段地價平均計算", "h": false}, {"x": "情：都計§50、§51 使用受限且未補償，反按商業地價加稅", "h": false}, {"x": "理：只能低度使用卻按商業地價課稅；§63 毗鄰查估本為保障徵收補償", "h": false}, {"x": "法：§63 管土地現值、不是公告地價直接依據；但有細則§64、規則§18Ⅳ 間接依據，不宜斷言完全無據", "h": true}, {"x": "現行救濟：申報地價下限公告地價8成；建築使用依土稅§19 按6‰", "h": true}, {"x": "甲之主張不無道理；立法上宜明定保留地公告地價應反映使用限制", "h": false}], "mn": "公告→申報→稅基 → §63管現值、§15管公告 → 情不通、理未合、法薄弱 → 申報8成＋6‰", "hp": 16, "hpl": "高"}, {"id": "pr-41", "no": "預P41", "t": "細部計畫：表明事項、核定機關、分區發展優先次序（2年／5年）與未發布前之限建（都計§15、§17、§22～§24）", "lv": "高", "k": "pred", "tier": 0, "g": "都市計畫・公共設施保留地・說明書解說", "q": "細部計畫應表明哪些事項？由何機關核定？依都市計畫法規定，主要計畫之實施進度與分區發展優先次序有何期限要求？未發布細部計畫之地區，其建築使用受何限制？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>細部計畫，指<mark class=\"hl\">以細部計畫書及細部計畫圖</mark>，就都市計畫法第22條第1項所列事項表明之計畫；主要計畫並須依分區發展優先次序，<mark class=\"hl\">於法定期限內完成細部計畫與公共設施</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第15條、第16條、第17條、第22條、第23條、第24條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）表明事項</p><p>依<span class=\"art\">第22條第1項</span>，細部計畫應以細部計畫書及細部計畫圖表明：<mark class=\"hl\">計畫地區範圍、居住密度及容納人口、土地使用分區管制、事業及財務計畫、道路系統、地區性之公共設施用地、其他</mark>；細部計畫圖比例尺不得小於一千二1%。主要道路、名勝古蹟則屬<span class=\"art\">第15條</span>主要計畫之表明事項，主要計畫圖不得小於一萬分之一，「<mark class=\"hl\">其實施進度以五年為一期，最長不得超過二十五年</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（二）核定</p><p>依<span class=\"art\">第23條第1項</span>，除依<span class=\"art\">第14條</span>由內政部訂定及依<span class=\"art\">第16條</span>與主要計畫合併擬定者由內政部核定外，其餘均<mark class=\"hl\">由該管直轄市、縣（市）政府核定實施</mark>；核定發布實施後，<mark class=\"hl\">應於1年內豎立都市計畫樁</mark>、計算坐標及辦理地籍分割測量（同條第3項）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>細部計畫以地方核定為原則，並以樁位落實到每筆土地。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）期限</p><p>依<span class=\"art\">第17條第1項</span>，「第一期發展地區應於主要計畫發布實施後，<mark class=\"hl\">最多二年完成細部計畫</mark>；並於細部計畫發布後，<mark class=\"hl\">最多五年完成公共設施</mark>。」</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以期限督促政府分期建設。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）未發布前限建</p><p>依<span class=\"art\">第17條第2項</span>，未發布細部計畫地區，<mark class=\"hl\">應限制其建築使用及變更地形</mark>；但<mark class=\"hl\">主要計畫發布已逾2年以上</mark>，而能確定建築線或主要公共設施已照主要計畫興建完成者，得由主管建築機關指定建築線，核發建築執照。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲地主要計畫已發布逾2年、細部計畫未發布，能確定建築線者得申請建照。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）人民自擬</p><p>依<span class=\"art\">第24條</span>，土地權利關係人得配合分區發展計畫，<mark class=\"hl\">自行擬定或變更細部計畫</mark>，並<mark class=\"hl\">附具事業及財務計畫</mark>申請辦理。</p></div>", "<span class=\"blk-l\">四、結論</span><p>細部計畫依第22條表明七款事項，<mark class=\"hl\">原則由直轄市、縣（市）政府核定</mark>，發布後1年內立樁；<mark class=\"hl\">主要計畫5年一期、最長25年</mark>，第一期發展地區<mark class=\"hl\">2年內完成細部計畫</mark>、細部計畫發布後<mark class=\"hl\">5年內完成公共設施</mark>；未發布細部計畫原則限建，主要計畫發布逾2年且能確定建築線者例外。</p>"], "ck": [{"x": "§22 七款（主要道路屬§15 主要計畫）", "h": true}, {"x": "§23 原則地方核定、1年內立樁", "h": true}, {"x": "§17Ⅰ 2年細部、5年公設", "h": true}, {"x": "§17Ⅱ 未發布限建，逾2年可指定建築線", "h": true}], "mn": "〔自編〕細部七款「範密管財路公他」；2年細部、5年公設；5年一期、25年封頂"}, {"id": "pr-31", "no": "預P31", "t": "都市計畫變更：定期通盤檢討 vs 迅行變更，人民申請擬定或變更細部計畫", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "都市計畫發布實施後，得否變更？請說明：（一）定期通盤檢討之規定；（二）迅行變更之法定事由及程序；（三）土地權利關係人得否自行擬定或變更細部計畫，其要件為何。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>都市計畫係在一定地區內有關都市生活之經濟、交通、衛生、保安、國防、文教、康樂等重要設施，作有計畫之發展，並對土地使用作合理規劃。都市計畫發布實施後即對人民發生拘束力，為維護法安定性，<mark class=\"hl\">原則不得任意變更</mark>；但為因應社會發展與突發情事，法律設有<mark class=\"hl\">定期通盤檢討、迅行變更及人民申請</mark>等變更機制。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第22條、第23條、第24條、第26條、第27條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）定期通盤檢討</p><p>依<span class=\"art\">都市計畫法第26條第1項</span>，都市計畫「<mark class=\"hl\">不得隨時任意變更</mark>」，但擬定計畫之機關<mark class=\"hl\">每三年內或5年內至少應通盤檢討一次</mark>，依據發展情況，並參考人民建議作必要之變更；「<mark class=\"hl\">對於非必要之公共設施用地，應變更其使用</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>通盤檢討發現公園保留地已無開闢必要，即應變更其使用。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>計畫須兼顧法安定性與適應發展，並藉通盤檢討解決公共設施保留地長期未取得之問題。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）迅行變更限四款事由</p><p>依<span class=\"art\">第27條第1項</span>，因戰爭、地震等重大事變遭受損壞、為避免重大災害之發生、為適應國防或經濟發展之需要、為配合重大設施時，<mark class=\"hl\">應迅行變更</mark>；第2項，內政部或縣（市）政府得指定原擬定機關限期為之，<mark class=\"hl\">必要時並得逕為變更</mark>。<mark class=\"hl\">權利人遭受重大損失不在四款之內</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>地震致山坡地住宅區崩塌，得不待通盤檢討即迅行變更。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>情事急迫，不宜等待通盤檢討。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）人民得自擬細部計畫</p><p>依<span class=\"art\">第24條</span>，土地權利關係人得配合當地分區發展計畫，<mark class=\"hl\">自行擬定或變更細部計畫</mark>，「<mark class=\"hl\">並應附具事業及財務計畫</mark>」；細部計畫應依<span class=\"art\">第22條</span>表明道路系統、地區性之公共設施用地等事項，並依<span class=\"art\">第23條</span>核定實施。</p><p class=\"evx\"><span class=\"evt\">例</span><span>地主聯合自擬細部計畫開發住宅社區，須自行提出道路系統、地區性公共設施用地配置及事業財務計畫，經縣（市）政府核定後實施。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>讓地主主動推動土地利用，但須證明財務可行。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>都市計畫以<mark class=\"hl\">不得隨時任意變更為原則</mark>，例外透過<mark class=\"hl\">定期通盤檢討、四款迅行變更及土地權利關係人自擬細部計畫</mark>為之，兼顧計畫安定性與社會變遷之需要。</p>"], "ck": [{"x": "都計§26Ⅰ 不得隨時任意變更；擬定機關每三年內或5年內至少通盤檢討一次", "h": true}, {"x": "§26Ⅰ 參考人民建議；非必要之公共設施用地應變更其使用", "h": false}, {"x": "§27Ⅰ 四款：重大事變損壞、避免重大災害、國防或經濟發展、配合重大設施", "h": false}, {"x": "「權利人遭受重大損失」不在迅行變更四款之內", "h": true}, {"x": "§27Ⅱ 內政部或縣（市）政府得指定原擬定機關限期為之，必要時逕為變更", "h": false}, {"x": "§24 人民自擬或變更細部計畫須附具事業及財務計畫，且只限細部計畫", "h": true}, {"x": "§22 細部計畫圖比例尺不小於1/1,200；§23 原則由直轄市、縣（市）政府核定", "h": false}], "mn": "原則不改 → 通檢三五（§26）→ 迅變：災、避、國經、重大設施（§27）→ 人民自擬細部、附事業財務（§24）", "hp": 17, "hpl": "高"}, {"id": "pr-37", "no": "預P37", "t": "主要計畫之擬定、審議、公開展覽、核定與發布實施（都計§18～§21）", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "依都市計畫法規定，主要計畫自擬定至發布實施，應經哪些程序？人民如何表達意見？細部計畫之程序有何不同？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>主要計畫，係市鎮計畫應先擬定之計畫，以主要計畫書就住宅、商業、工業及其他土地使用之配置、主要道路、上下水道及公共設施用地等事項分別表明，並附主要計畫圖（都市計畫法第15條）。其擬定後，須經<mark class=\"hl\">審議、公開展覽、核定及發布實施</mark>等程序（第18條至第21條）。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第18條、第19條、第20條、第21條、第23條、第26條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）先送都市計畫委員會審議</p><p>依<span class=\"art\">都市計畫法第18條</span>，「主要計畫擬定後，<mark class=\"hl\">應先送由該管政府或鄉、鎮、縣轄市都市計畫委員會審議</mark>。」</p></div><div class=\"evp\"><p class=\"evh\">（二）公開展覽，人民得書面提出意見</p><p>依<span class=\"art\">第19條第1項</span>，送審議前應<mark class=\"hl\">公開展覽30天及舉行說明會</mark>；「任何公民或團體得於公開展覽期間內，<mark class=\"hl\">以書面載明姓名或名稱及地址</mark>，向該管政府提出意見」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>市府擬將甲之土地劃為公園用地，甲得於公展30天內以書面陳述意見。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）60天內審議完成</p><p>依<span class=\"art\">第19條第2項</span>，「<mark class=\"hl\">各級都市計畫委員會應於六十天內完成</mark>」，情形特殊者得延長，<mark class=\"hl\">延長以六十天為限</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）一律由內政部核定</p><p>依第20條第1項，主要計畫<mark class=\"hl\">原則由內政部核定</mark>（首都者並轉報行政院備案）；特定區計畫由內政部訂定者，報行政院備案。</p></div><div class=\"evp\"><p class=\"evh\">（五）30日內發布實施</p><p>依<span class=\"art\">第21條第1項</span>，當地直轄市、縣（市）政府應「<mark class=\"hl\">於接到核定或備案公文之日起三十日內</mark>，將主要計畫書及主要計畫圖發布實施」；未依期限發布者，<mark class=\"hl\">內政部得代為發布之</mark>（同條第3項）。</p></div><div class=\"evp\"><p class=\"evh\">（六）細部計畫原則由地方核定</p><p>依<span class=\"art\">第23條第1項</span>，除由內政部訂定及與主要計畫合併擬定者外，「<mark class=\"hl\">其餘均由該管直轄市、縣（市）政府核定實施</mark>」；其擬定、審議、公開展覽及發布實施，分別依<span class=\"art\">第17條第1項</span>、<span class=\"art\">第18條</span>、<span class=\"art\">第19條</span>及<span class=\"art\">第21條</span>規定辦理（同條第5項）。</p></div><div class=\"evp\"><p class=\"evh\">（七）定期通盤檢討</p><p>依<span class=\"art\">第26條第1項</span>，都市計畫經發布實施後，不得隨時任意變更，但擬定計畫之機關「<mark class=\"hl\">每三年內或五年內至少應通盤檢討一次</mark>」。</p></div>", "<span class=\"blk-l\">四、結論</span><p>主要計畫依序為擬定、<mark class=\"hl\">公開展覽30天</mark>（人民得以書面提出意見）、送都市計畫委員會於<mark class=\"hl\">60天內審議</mark>、<mark class=\"hl\">由內政部核定</mark>、<mark class=\"hl\">接到公文30日內發布實施</mark>。細部計畫原則由直轄市、縣（市）政府核定，其程序分別依主要計畫之相關規定辦理。</p>"], "ck": [{"x": "§19Ⅰ 送審前公展30天＋說明會；書面提意見", "h": true}, {"x": "§20 主要計畫一律內政部核定", "h": true}, {"x": "§21 接到公文30日內發布實施", "h": true}], "mn": "擬→審（先公展30）→60天→內政部→30日發布"}, {"id": "pr-38", "no": "預P38", "t": "容積移轉：適用情形與公共設施保留地之取得方式（都計§83-1、§48、§50-2）", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "何謂容積移轉？依都市計畫法規定，得以容積移轉方式辦理之情形為何？其與公共設施保留地之其他取得方式有何關係？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>容積移轉，是<mark class=\"hl\">將一定土地依法可建築之容積移出</mark>，移入其他可建築土地使用。依都市計畫法第83條之1第1項，公共設施保留地之取得、具有紀念性或藝術價值之建築與歷史建築之保存維護及公共開放空間之提供，<mark class=\"hl\">得以容積移轉方式辦理</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第83條之1、第48條、第49條、第50條之2。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得以容積移轉辦理之三種情形</p><p>依<span class=\"art\">都市計畫法第83條之1第1項</span>，「公共設施保留地之取得、具有紀念性或藝術價值之建築與歷史建築之保存維護及公共開放空間之提供，<mark class=\"hl\">得以
