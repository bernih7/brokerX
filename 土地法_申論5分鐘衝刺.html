">第18條</span>，外國人在中華民國取得或設定土地權利，以依條約或其本國法律，<mark class=\"hl\">中華民國人民得在該國享受同樣權利者為限</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）限制一</p><p><mark class=\"hl\">七類土地不得取得</mark>。依<span class=\"art\">第17條第1項</span>，林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，<mark class=\"hl\">不得移轉、設定負擔或租賃於外國人</mark>。依第2項，因繼承取得者不在此限，但應於<mark class=\"hl\">繼承登記完畢之日起3年內出售與本國人</mark>，逾期由地政機關移請國有財產局（現財政部國有財產署）公開標售。</p></div><div class=\"evp\"><p class=\"evh\">（三）限制二</p><p><mark class=\"hl\">限於法定八款用途</mark>。依<span class=\"art\">第19條第1項</span>，外國人為供<mark class=\"hl\">自用、投資或公益之目的</mark>，得取得：<span class=\"evli\">一、住宅；</span><span class=\"evli\">二、營業處所、辦公場所、商店及工廠；</span><span class=\"evli\">三、教堂；</span><span class=\"evli\">四、醫院；</span><span class=\"evli\">五、外僑子弟學校；</span><span class=\"evli\">六、使領館及公益團體之會所；</span><span class=\"evli\">七、墳場；</span><span class=\"evli\">八、有助於國內重大建設、整體經濟或農牧經營之投資，並經中央目的事業主管機關核准者；其面積及所在地點，應受直轄市或縣（市）政府依法所定之限制。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）限制三</p><p><mark class=\"hl\">事前申請核准</mark>。依<span class=\"art\">第20條第1項</span>，應檢附文件申請直轄市或縣（市）政府核准；依第8款取得者，並<mark class=\"hl\">應先經中央目的事業主管機關同意</mark>；依第2項，政府應於<mark class=\"hl\">受理後14日內准駁</mark>，核准後報請中央地政機關備查。</p></div><div class=\"evp\"><p class=\"evh\">（五）限制四</p><p>取得後之管制。依<span class=\"art\">第20條第1項</span>後段，<mark class=\"hl\">變更用途或為繼承以外之移轉，亦應申請核准</mark>；依第3項，依第8款取得者應依核定期限及用途使用，因故未能如期使用者應申請展期，未依核定期限及用途使用者，由政府通知於<mark class=\"hl\">送達後3年內出售</mark>，<mark class=\"hl\">逾期得逕為標售</mark>，價款發還土地所有權人。</p></div>", "<span class=\"blk-l\">四、結論</span><p>外國人取得地權之基本條件為<mark class=\"hl\">平等互惠</mark>（第18條）；限制為：林地等七類土地不得取得，<mark class=\"hl\">繼承者應於3年內出售與本國人</mark>（第17條）；僅得為自用、投資或公益取得<mark class=\"hl\">八款用途</mark>土地，並受面積、地點限制（第19條）；取得前須申請直轄市或縣（市）政府核准，<mark class=\"hl\">14日內准駁</mark>，取得後變更用途或移轉亦須核准，第8款投資未依期限及用途使用者，<mark class=\"hl\">通知3年內出售</mark>（第20條）。</p>"], "ck": [{"x": "土地法§18 平等互惠：我國人民得在該國享受同樣權利者為限", "h": false}, {"x": "§17Ⅰ 林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備及領域邊境土地不得移轉、設定負擔或租賃", "h": true}, {"x": "§17Ⅱ 繼承取得者：繼承登記完畢起3年內出售本國人，逾期公開標售", "h": true}, {"x": "§19 八款用途限制與§20 申請核准程序都要寫，不能只寫互惠", "h": true}, {"x": "§20 申請縣市政府核准，受理後14日內准駁、報中央備查；第8款先經中央目的事業主管機關同意", "h": false}, {"x": "取得後變更用途或繼承以外移轉亦須核准；第8款未依期限用途使用→通知3年內出售", "h": false}, {"x": "三道防線：平等互惠、特定土地禁止取得、用途限制與事前核准", "h": false}], "mn": "互惠（§18）→ 禁地七類（§17，繼承3年賣）→ 八款用途（§19）→ 事前核准14日（§20）", "hp": 1024, "hpl": "中"}, {"id": "q-105-一", "no": "105-一", "t": "憲法第143條＋土地法不得私有土地列舉", "lv": "C", "k": "off", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "憲法第143條第1項前段規定，中華民國領土內之土地屬於國民全體。人民依法取得之土地所有權，應受法律之保障與限制。土地法對於土地取得之限制規定何者土地不得為私有？試述之。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>憲法第143條第1項前段揭示<mark class=\"hl\">「中華民國領土內之土地屬於國民全體」</mark>，為平均地權、漲價歸公等土地政策之憲法依據；同項亦肯認人民依法取得之土地所有權應受法律之保障與限制。故土地私有原則上受保障，僅特定種類土地基於公益考量，例外不得私有。</p>", "<span class=\"blk-l\">二、法條</span><p>憲法第143條第1項；土地法第14條第1項（十款不得私有之土地）、第2項（已成私有者得依法徵收）、第3項（名勝古蹟之兩款例外）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）土地法第14條第1項列舉十款不得私有</p><p>依該項，下列土地<mark class=\"hl\">不得為私有</mark>：<span class=\"evli\">一、海岸一定限度內之土地；</span><span class=\"evli\">二、天然形成之湖澤而為公共需用者，及其沿岸一定限度內之土地；</span><span class=\"evli\">三、可通運之水道及其沿岸一定限度內之土地；</span><span class=\"evli\">四、城鎮區域內水道湖澤及其沿岸一定限度內之土地；</span><span class=\"evli\">五、公共交通道路；</span><span class=\"evli\">六、礦泉地；</span><span class=\"evli\">七、瀑布地；</span><span class=\"evli\">八、公共需用之水源地；</span><span class=\"evli\">九、名勝古蹟；</span><span class=\"evli\">十、其他法律禁止私有之土地。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>此等土地具強烈公共使用性質或生態、文化保育價值，由私人取得將妨礙公共利益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）已成私有者，得依法徵收，非逕歸國有</p><p>依同條第2項，前項土地已成為私有者，<mark class=\"hl\">得依法徵收之</mark>。故政府須依徵收程序並給予補償始能取得，<mark class=\"hl\">不是逕登記為國有</mark>，亦不是所有權視為消滅。例如私人早年已取得之海岸土地，政府為公共需用，應依土地徵收條例辦理徵收並補償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>憲法<span class=\"art\">第143條第1項</span>同時肯認人民依法取得之土地所有權應受保障。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）名勝古蹟設有兩款例外</p><p>依同條第3項，符合下列情形之一者，<mark class=\"hl\">不受第1項第9款之限制</mark>：<span class=\"evli\">一、日據時期原屬私有，臺灣光復後登記為公有，依法得贈與移轉為私有之名勝古蹟；</span><span class=\"evli\">二、公營事業機構及行政法人，有經營或使用古蹟土地需要，並經中央文化主管機關認定古蹟土地移轉為其所有可助於古蹟保存及維護。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧原屬私有之權利回復，及古蹟之活化經營與保存。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>依土地法第14條第1項，海岸、湖澤、水道、公共交通道路、礦泉地、瀑布地、公共需用之水源地、名勝古蹟及其他法律禁止私有之土地等<mark class=\"hl\">十款，不得為私有</mark>；<mark class=\"hl\">已成為私有者，得依法徵收</mark>；<mark class=\"hl\">名勝古蹟則有同條第3項兩款例外</mark>。此一例外清單落實「土地屬於國民全體」之憲法精神，並以徵收補償兼顧財產權保障。</p>"], "ck": [{"x": "憲法§143Ⅰ 土地屬國民全體，但同項亦規定：依法取得之土地所有權應受法律之保障與限制", "h": false}, {"x": "§14Ⅰ 前五款：海岸、公共需用天然湖澤、可通運水道、城鎮水道湖澤、公共交通道路", "h": false}, {"x": "§14Ⅰ 後五款：礦泉地、瀑布地、水源地、名勝古蹟、其他法律禁止私有", "h": true}, {"x": "§14（不得私有）與§17（不得移轉外國人）不可混用", "h": true}, {"x": "§14Ⅱ 已成私有者得依法徵收，不是逕登記國有", "h": true}, {"x": "§14Ⅲ 名勝古蹟兩款例外，113.8.7 新增公營事業、行政法人", "h": false}, {"x": "十款共通點：強烈公共使用或生態文化保育價值，以例外清單落實憲法精神", "h": false}], "mn": "憲法私有為原則 → 海・湖・水・城・道・礦・瀑・源・勝・他 → 已私有得徵收 → 古蹟兩例外", "hp": 1025, "hpl": "中"}, {"id": "q-100-二", "no": "100-二", "t": "自有農地興建農舍限制＋農舍移轉抵押限制", "lv": "C", "k": "off", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "請問自有農地興建農舍有何限制？農舍之移轉與設定抵押有何限制？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>農舍係為配合農業經營需要，許可農民於自有農業用地上興建之住宅；為<mark class=\"hl\">維持農地農用</mark>、防止假農舍真豪宅之投機，法令對其興建及移轉、抵押均設限制。</p>", "<span class=\"blk-l\">二、法條</span><p>農業發展條例第3條第3款、第18條；農業用地興建農舍辦法第10條；實施區域計畫地區建築管理辦法第5條；都市計畫法臺灣省施行細則第29條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）興建資格</p><p>依<span class=\"art\">農業發展條例第18條第1項</span>，89年1月4日修正施行後取得農業用地之農民，<mark class=\"hl\">無自用農舍而需興建者</mark>，經直轄市或縣（市）主管機關核定，於不影響農業生產環境及農村發展，得申請以集村方式或在自有農業用地興建農舍；第4項，<mark class=\"hl\">起造人應為該農舍坐落土地之所有權人</mark>。農民指直接從事農業生產之自然人（<span class=\"art\">第3條第3款</span>），<mark class=\"hl\">非農民之投資客不得申請</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）面積與高度限制</p><p>非都市土地依建管辦法<span class=\"art\">第5條第1項</span>，<mark class=\"hl\">總樓地板面積不得超過四百九十五平方公尺</mark>，<mark class=\"hl\">建築面積不得超過其耕地面積10%</mark>，<mark class=\"hl\">高度不得超過三層樓並不得超過十點五公尺</mark>，最大基層建築面積不得超過三百三十平方公尺（農舍辦法<span class=\"art\">第10條第1項</span>指向該辦法）。都市計畫農業區依臺灣省施行細則<span class=\"art\">第29條第2項第2款</span>，高度不得超過四層或十四公尺，建築面積不得超過該宗農業用地面積10%，總樓地板面積不得超過六百六十平方公尺。</p></div><div class=\"evp\"><p class=\"evh\">（三）不得重複申請</p><p>依<span class=\"art\">第18條第4項</span>，<mark class=\"hl\">已申請興建農舍之農業用地不得重複申請</mark>。都市計畫農業區依細則<span class=\"art\">第29條第2項第3款</span>，應於套繪圖上著色標示，嗣後<mark class=\"hl\">90%農業用地不論是否分割，均不得再行申請</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）移轉與抵押限制</p><p>依<span class=\"art\">第18條第2項</span>，在自有農業用地興建農舍<mark class=\"hl\">滿5年始得移轉</mark>，但<mark class=\"hl\">因繼承或法院拍賣而移轉者，不在此限</mark>；第4項，農舍應與其坐落用地<mark class=\"hl\">併同移轉或併同設定抵押權</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>興建3年即出售，法所不許；亦不得僅以農舍單獨設定抵押權。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持「農地農用、農舍農有」，防止短期轉手炒作。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>興建限制：<mark class=\"hl\">限無自用農舍之農民經核定於自有農業用地興建</mark>，起造人須為土地所有權人；<mark class=\"hl\">建築面積不得超過10%</mark>，並受樓地板面積、高度上限；已申請之農業用地不得重複申請。移轉與抵押限制：<mark class=\"hl\">興建滿5年始得移轉</mark>（繼承、法院拍賣除外），且<mark class=\"hl\">應與坐落用地併同移轉或併同設定抵押權</mark>。</p>"], "ck": [{"x": "農發§18Ⅰ：89.1.4後取得農業用地之農民、無自用農舍、經核定", "h": false}, {"x": "建築面積不得超過該農業用地10%（比例不可寫錯）", "h": true}, {"x": "非都市495㎡／最大基層330㎡、3層10.5m；都計農業區660㎡、4層14m", "h": false}, {"x": "已申請之農業用地不得重複申請，90%分割後也不得再申請；不是「五年內不得重複申請」", "h": true}, {"x": "滿5年始得移轉，繼承、法院拍賣除外", "h": false}, {"x": "農舍須與坐落用地併同移轉或併同設定抵押權，不能單獨抵押", "h": true}], "mn": "資格（89.1.4・農民）→ 規模（10%・495/660）→ 不重複 → 滿5年 → 房地併同"}, {"id": "pr-16", "no": "預P16", "t": "經紀人情境題：外國人委託購買土地，應查核與解說什麼？", "lv": "高", "k": "pred", "tier": 0, "g": "地權總則・農地・非都市管制", "q": "外國人甲委託不動產經紀人乙購買一筆土地，乙應就哪些法律限制向甲解說並協助查核？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>外國人取得土地受土地法特別限制，未事先查核，可能完成交易後仍無法登記。經紀人應於<mark class=\"hl\">簽約前就法定限制向委託人解說並協助查核</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第17條、第18條、第19條、第20條；民法第567條；不動產經紀業管理條例第23條、第24條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）互惠</p><p>依<span class=\"art\">土地法第18條</span>，外國人取得或設定土地權利，以依條約或其本國法律，我國人民得在該國享受同樣權利者為限。乙應先查明甲之國籍是否<mark class=\"hl\">平等互惠</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）標的</p><p>依<span class=\"art\">第17條第1項</span>，林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，<mark class=\"hl\">不得移轉、設定負擔或租賃於外國人</mark>。乙應調閱謄本及使用分區，確認不屬上開七款；並說明因繼承取得者，應於辦竣繼承登記之日起<mark class=\"hl\">3年內出售與本國人</mark>（同條第2項）。</p></div><div class=\"evp\"><p class=\"evh\">（三）用途</p><p>依<span class=\"art\">第19條第1項</span>，外國人為供<mark class=\"hl\">自用、投資或公益目的</mark>，得取得住宅、營業處所、辦公場所、商店及工廠等所列用途之土地，其面積及所在地點<mark class=\"hl\">受直轄市或縣（市）政府依法所定之限制</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲購地自住，屬住宅，並應查明該縣市有無面積、地點限制。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）核准</p><p>依<span class=\"art\">第20條第1項</span>，應檢附文件<mark class=\"hl\">申請該管直轄市或縣（市）政府核准</mark>；第2項，政府應於<mark class=\"hl\">受理後14日內准駁</mark>，核准後報中央地政機關備查。取得後變更用途或為繼承以外之移轉，<mark class=\"hl\">亦須申請核准</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）乙之解說義務</p><p>乙對委託人甲之<mark class=\"hl\">據實報告義務</mark>源自民法<span class=\"art\">第567條第1項</span>，<mark class=\"hl\">調查義務</mark>源自同條第2項；經紀條例<span class=\"art\">第23條</span>、<span class=\"art\">第24條</span>之說明書則是向「與委託人交易之相對人」解說並由其簽章。故乙應<mark class=\"hl\">於簽約前向甲說明上述限制並協助查核</mark>，並宜一併記載於說明書。</p></div>", "<span class=\"blk-l\">四、結論</span><p>乙應依<mark class=\"hl\">「互惠→標的→用途→核准」</mark>四步查核並解說，並提醒<mark class=\"hl\">取得後變更用途或移轉仍須核准</mark>；於簽約前完成，避免交易完成後無法登記。</p>"], "ck": [{"x": "§18 互惠是第一步，不可漏、順序不可亂", "h": true}, {"x": "§17 禁止七款，牧地不在內；繼承取得者3年內出售", "h": false}, {"x": "§19 八款用途，受縣市面積、地點限制", "h": false}, {"x": "§20 向縣市政府申請核准、14日內准駁；重大投資先經中央目的事業主管機關同意", "h": false}, {"x": "每一步都寫出乙要查什麼（國籍、謄本與分區、用途、核准），不能只列法條", "h": true}, {"x": "「契約約定以取得核准為條件」是建議做法，不是法條規定", "h": true}, {"x": "取得後變更用途或繼承以外之移轉亦須核准（§20Ⅰ）", "h": false}, {"x": "乙依民法§567 於簽約前查核解說；§23、§24 說明書對象是相對人（賣方）", "h": false}], "mn": "互（§18）→ 禁（§17）→ 用（§19）→ 核（§20）→ 取得後仍核准 → 簽約前講清楚", "hp": 1029, "hpl": "中"}, {"id": "pr-13", "no": "預P13", "t": "不得私有之土地 × 公有土地處分限制（§14、§10、§25）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "土地法對不得私有之土地，已成為私有者如何處理？政府對其所管公有土地之處分，有何限制？哪些土地不受該限制？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>憲法第143條第1項前段揭示土地屬於國民全體，土地私有原則上受保障，但特定土地因具公共使用性質或保育價值，<mark class=\"hl\">法律禁止私有</mark>；另一方面，直轄市或縣（市）政府所管公有土地之處分，依土地法第25條<mark class=\"hl\">須經民意機關同意並經行政院核准</mark>。兩者<mark class=\"hl\">一禁止取得、一限制處分</mark>，同屬土地權屬之基本管制。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第4條、第10條、第14條、第25條；平均地權條例第7條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）不得私有之土地已成為私有者，得依法徵收</p><p>依<span class=\"art\">土地法第14條第1項</span>，海岸一定限度內之土地、公共交通道路、礦泉地、瀑布地、公共需用之水源地、名勝古蹟等十款土地<mark class=\"hl\">不得為私有</mark>；同條第2項，「<mark class=\"hl\">前項土地已成為私有者，得依法徵收之</mark>」，<mark class=\"hl\">不是逕行登記為國有</mark>。<span class=\"art\">第10條第2項</span>「私有土地之所有權消滅者，為國有土地」，係指所有權消滅之情形，不可混用。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲早年取得之土地經認定屬瀑布地，政府得依法徵收並給予補償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>已成為私有者其所有權仍受憲法保障，須經法定程序並補償始能取得。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）公有土地處分之限制</p><p>依<span class=\"art\">第4條</span>，公有土地為國有、直轄市有、縣（市）有或鄉（鎮、市）有之土地；依<span class=\"art\">第25條</span>，直轄市或縣（市）政府對於其所管公有土地，「<mark class=\"hl\">非經該管區內民意機關同意，並經行政院核准</mark>，不得處分或設定負擔或為<mark class=\"hl\">超過十年期間之租賃</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣政府出租縣有土地12年，須經縣議會同意並報行政院核准；僅出租8年則不受本條限制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以雙重程序防止地方政府隨意處分公共財產。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不受限制之土地</p><p>依<span class=\"art\">平均地權條例第7條</span>，「政府依法照價收買、區段徵收或因土地重劃而取得之土地，<mark class=\"hl\">得隨時公開出售，不受土地法第二十五條之限制</mark>」，<mark class=\"hl\">一般徵收取得者不在其內</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>市地重劃取得之抵費地得隨時公開出售；為興建道路一般徵收取得之土地，出售仍受<span class=\"art\">第25條</span>限制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使政府得及時處分此等土地。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>不得私有之土地透過<mark class=\"hl\">已私有者依法徵收</mark>維持公共使用目的；公有土地則以<mark class=\"hl\">民意機關同意加行政院核准之雙重程序</mark>防止隨意處分，並對照價收買、區段徵收、土地重劃所得之土地放寬。兩者都在守護全民利益。</p>"], "ck": [{"x": "土地法§14Ⅰ 不得私有之土地（如礦泉地、瀑布地、名勝古蹟）", "h": false}, {"x": "已私有者得依法徵收（§14Ⅱ），不是逕登記國有；§10Ⅱ 所有權消滅才為國有", "h": true}, {"x": "§14（不得私有）與§17（外國人不得取得）不可混用", "h": false}, {"x": "§4 公有土地＝國有、直轄市有、縣（市）有、鄉（鎮、市）有，範圍大於國有", "h": true}, {"x": "§25 須民意機關同意＋行政院核准，限制處分、設定負擔、超過10年租賃", "h": true}, {"x": "§25 兩關缺一不可；出租未超過10年不受限制", "h": false}, {"x": "平均§7：照價收買、區段徵收、土地重劃取得者不受§25限制，一般徵收不在內", "h": false}], "mn": "不得私有 → 已私有就徵收（§14）→ 公有處分過兩關：民意＋行政院（§25）→ 照・區・重免關（平均§7）", "hp": 1026, "hpl": "中"}, {"id": "pr-14", "no": "預P14", "t": "外國人繼承取得不得取得之土地：3年內出售、逾期標售（§17）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "外國人因繼承取得土地法第17條所列不得取得之土地時，法律如何處理？並說明與平等互惠原則之關係。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>依土地法第17條第1項，林地等七款土地<mark class=\"hl\">不得移轉、設定負擔或租賃於外國人</mark>。繼承是基於被繼承人死亡而當然發生之取得，無法像買賣一樣事先以核准把關，因此制度上採<mark class=\"hl\">「先承認取得、再限期處分」</mark>之方式處理。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第17條、第18條、第20條、第73條之1。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）七款土地不得移轉、設定負擔或租賃於外國人</p><p>依<span class=\"art\">土地法第17條第1項</span>，林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，<mark class=\"hl\">不得移轉、設定負擔或租賃於外國人</mark>（<mark class=\"hl\">牧地不在其內</mark>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>本國人不得將其水源地出賣或出租予外國人。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>上述土地涉及國防安全與天然資源，不宜由外國人掌控。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）繼承取得應於3年內出售與本國人</p><p>依<span class=\"art\">第17條第2項</span>前段，「前項移轉，不包括因繼承而取得土地，但應於<mark class=\"hl\">辦理繼承登記完畢之日起三年內出售與本國人</mark>」；依<span class=\"art\">第20條第1項</span>，<mark class=\"hl\">繼承取得本身無須事先核准</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外國人A繼承其父所遺之林地，辦竣繼承登記後應於3年內出售與本國人。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>繼承無法如買賣般事先審核，故先承認其取得，再以限期出售排除長期持有。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）逾期未出售者公開標售</p><p>依<span class=\"art\">第17條第2項</span>後段，逾期未出售者，由地政機關<mark class=\"hl\">移請財政部國有財產署公開標售</mark>，標售程序準用<span class=\"art\">第73條之1</span>；此與本國人逾1年未辦繼承登記、列冊管理15年後標售不同，<mark class=\"hl\">不可混用</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>A於3年期滿仍未出售林地，地政機關即移請國有財產署標售。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以強制標售確保禁止類土地終能回到本國人手中。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）平等互惠不能排除第17條之限制</p><p>依<span class=\"art\">第18條</span>，外國人在中華民國取得或設定土地權利，以中華民國人民得在該國享受同樣權利者為限；<span class=\"art\">第17條</span>七款土地則<mark class=\"hl\">與互惠與否無關</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>即使A之本國允許我國人民取得林地，A繼承之林地仍應於3年內出售。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>互惠處理國與國之對等，<span class=\"art\">第17條</span>保護國防安全與天然資源，兩者目的不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>外國人繼承取得第17條第1項之土地，<mark class=\"hl\">不在禁止移轉之列</mark>，但應於辦理繼承登記完畢之日起<mark class=\"hl\">3年內出售與本國人</mark>，逾期由地政機關<mark class=\"hl\">移請國有財產署公開標售</mark>；縱其本國與我國平等互惠（第18條），因第17條未以互惠為例外，<mark class=\"hl\">仍應於3年內出售</mark>。承認繼承但限期出售，兼顧外國人之繼承權益與國家安全等公益。</p>"], "ck": [{"x": "§17Ⅰ 七款：林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境", "h": false}, {"x": "牧地不在§17 七款內", "h": true}, {"x": "§17Ⅱ 繼承取得，應於繼承登記完畢之日起3年內出售與本國人", "h": false}, {"x": "3年期限不要和§73-1 逾1年未辦繼承登記混淆", "h": true}, {"x": "逾期由地政機關移請國有財產署公開標售", "h": true}, {"x": "§18 平等互惠：以我國人民在該國得享同樣權利者為限", "h": false}, {"x": "互惠不能免除§17，仍須3年內出售", "h": false}], "mn": "林漁狩鹽礦要水 → 繼承3年賣本國人 → 逾期標售 → 互惠也不能免", "hp": 1027, "hpl": "中"}, {"id": "pr-15", "no": "預P15", "t": "外國人取得土地之用途與核准程序（§19、§20）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "外國人得取得土地之用途為何？應向何機關申請核准？為重大建設、整體經濟或農牧經營之投資者，程序有何不同？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>外國人取得土地，一方面要符合<mark class=\"hl\">平等互惠</mark>，另一方面須屬第19條所列用途，並依第20條<mark class=\"hl\">事前申請核准</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第18條（平等互惠）、第19條（得取得之用途）、第20條（申請程序與核准機關、重大投資之同意及期限控管）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）用途限八款，並須平等互惠</p><p>依<span class=\"art\">土地法第18條</span>，外國人在中華民國取得或設定土地權利，以依條約或其本國法律，<mark class=\"hl\">中華民國人民得在該國享受同樣權利者為限</mark>；依<span class=\"art\">第19條第1項</span>，外國人為供<mark class=\"hl\">自用、投資或公益之目的</mark>使用，得取得住宅、營業處所、教堂、醫院、墳場等八款用途之土地，其面積及所在地點受直轄市或縣（市）政府依法所定之限制。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外商公司為設立辦公室而購買辦公大樓樓層，屬第2款用途。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧外人投資需求與國土安全，避免土地被用於非必要之用途。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）一般案件向縣市政府申請，14日內准駁</p><p>依<span class=\"art\">第20條第1項</span>前段，外國人依<span class=\"art\">第19條</span>需要取得土地，應檢附相關文件，<mark class=\"hl\">申請該管直轄市或縣（市）政府核准</mark>；土地有變更用途或為<mark class=\"hl\">繼承以外之移轉時，亦同</mark>。依同條第2項，應於<mark class=\"hl\">受理後14日內准駁</mark>，並於核准後報請中央地政機關備查。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外國人甲購買臺北市住宅自住，應向臺北市政府申請核准；日後改作商店使用，亦須再申請核准。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>由地方就面積、地點等限制把關，中央備查以掌握全國情形。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）重大投資須先經中央同意，並受期限控管</p><p>依<span class=\"art\">第20條第1項</span>後段，依<span class=\"art\">第19條第1項第8款</span>取得者，並<mark class=\"hl\">應先經中央目的事業主管機關同意</mark>。依<span class=\"art\">第20條第3項</span>，應依核定期限及用途使用；未依核定期限及用途使用者，由直轄市或縣（市）政府通知土地所有權人於<mark class=\"hl\">通知送達後3年內出售</mark>，逾期未出售者，<mark class=\"hl\">得逕為標售</mark>，所得價款發還土地所有權人。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外商為設置大型農牧場而取得土地，須先經中央目的事業主管機關同意，再向縣政府申請核准。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>外國人取得土地採<mark class=\"hl\">「限定用途＋事前核准」</mark>雙重控管：一般案件由縣市政府核准，重大投資案件<mark class=\"hl\">須先經中央目的事業主管機關同意</mark>，且受核定期限及用途之控管。土地有變更用途或為繼承以外之移轉時，<mark class=\"hl\">亦應申請核准</mark>（第20條第1項）。</p>"], "ck": [{"x": "§18 平等互惠為前提", "h": false}, {"x": "§19Ⅰ 八款用途：住宅、營業辦公商店工廠、教堂、醫院、外僑學校、使領館會所、墳場、重大投資", "h": false}, {"x": "§19 是「得取得之用途」限制，不要與§17 禁止取得之土地混為一談", "h": true}, {"x": "§20Ⅰ 向直轄市或縣（市）政府申請核准；§20Ⅱ 14日內准駁、報中央備查", "h": false}, {"x": "變更用途或繼承以外之移轉，亦須申請核准", "h": true}, {"x": "重大投資「先」經中央目的事業主管機關同意，再走縣市核准", "h": true}, {"x": "§20Ⅲ 依核定期限及用途使用；未使用→3年內出售、逾期逕為標售", "h": false}], "mn": "一般找縣市，重投先中央；用途關＋核准關", "hp": 1028, "hpl": "中"}, {"id": "pr-21", "no": "預P21", "t": "房屋租金管制：租金上限、擔保金與出租人收回房屋（§97、§99、§100）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "依土地法，城市地方房屋租金有何限制？租賃擔保金有何限制？出租人於何種情形得收回房屋？甲將房屋出租予乙，月租金偏高，並收取三個月租金為擔保金，試分析之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋租賃涉及居住安定，土地法第97條、第99條、第100條分別就城市地方房屋之<mark class=\"hl\">租金、擔保金</mark>及出租人<mark class=\"hl\">收回房屋之事由</mark>設有限制。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第97條（租金上限與強制減定）、第98條（擔保金利息視為租金）、第99條（擔保金上限）、第100條（收回事由）、第105條（租用基地建築房屋準用）；民法第443條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）租金以申報總價年息10%為限，超過得減定</p><p>依<span class=\"art\">土地法第97條第1項</span>，「城市地方房屋之租金，以<mark class=\"hl\">不超過土地及其建築物申報總價年息百分之十為限</mark>。」第2項，約定租金超過者，該管直轄市或縣（市）政府<mark class=\"hl\">得強制減定之</mark>；依<span class=\"art\">第98條</span>，以現金為租賃之擔保者，其現金利息<mark class=\"hl\">視為租金之一部</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>土地及建物申報總價為600萬元者，年租金上限為60萬元；甲之月租金連同擔保金利息換算年租後超過60萬元，乙得請求主管機關強制減定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）擔保金以2個月租金為限，超過部分得抵房租</p><p>依<span class=\"art\">第99條第1項</span>，「前條擔保之金額，<mark class=\"hl\">不得超過二個月房屋租金之總額</mark>。」第2項，已交付之擔保金超過限度者，承租人<mark class=\"hl\">得以超過之部份抵付房租</mark>。本題甲收取3個月租金作為擔保金，超過之一個月部分，乙得主張抵付房租。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免出租人藉高額押金變相加租、加重承租人負擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）出租人須有法定六款事由之一始得收回</p><p>依<span class=\"art\">第100條</span>，出租人非因下列情形之一，<mark class=\"hl\">不得收回房屋</mark>：<span class=\"evli\">一、出租人<mark class=\"hl\">收回自住或重新建築</mark>；</span><span class=\"evli\">二、承租人違反民法<span class=\"art\">第443條第1項</span>之規定轉租於他人；</span><span class=\"evli\">三、承租人積欠租金額，除擔保金抵償外，<mark class=\"hl\">達2個月以上</mark>；</span><span class=\"evli\">四、承租人以房屋供違反法令之使用；</span><span class=\"evli\">五、承租人違反租賃契約；</span><span class=\"evli\">六、承租人損壞出租人之房屋或附著財物，而不為相當之賠償。本題若甲欲收回自住，或乙積欠租金經扣除擔保金抵償後仍達2個月以上，甲即得收回。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免出租人任意終止租約，使承租人失其居住處所。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲之租金超過上限者<mark class=\"hl\">得由主管機關強制減定</mark>，擔保金<mark class=\"hl\">超過2個月部分乙得抵付房租</mark>；收回房屋亦<mark class=\"hl\">須具法定事由</mark>。租金上限與擔保金限制在保護承租人，收回事由法定化則兼顧出租人權益與居住安定。</p>"], "ck": [{"x": "§97 限「城市地方」房屋：租金≤申報總價「年息」10%，超過由縣市政府強制減定", "h": true}, {"x": "代入：600萬×10%＝年租60萬（月5萬）；擔保金利息依§98視為租金", "h": false}, {"x": "§99 擔保金≤2個月租金總額，超過部分得抵付房租", "h": true}, {"x": "甲收3個月，超過的1個月部分乙抵房租，不必另行起訴", "h": false}, {"x": "§100 收回六款：自住或重建、違法轉租、欠租2個月、違法使用、違約、損壞不賠", "h": true}, {"x": "欠租2個月是「除擔保金抵償外」才算", "h": false}, {"x": "租金超限強制減定、押金超過抵房租、無法定事由不得收回", "h": false}], "mn": "年息十、押金二，收回要有因"}, {"id": "pr-28", "no": "預P28", "t": "農業用地移轉：不課徵土增稅、遺贈稅免徵、未作農業使用之追繳、農舍移轉限制", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "甲將其作農業使用之農業用地出售予自然人乙，另將其他農業用地贈與其子丙。請說明：（一）甲出售予乙之土地增值稅如何處理？乙嗣後未作農業使用有何效果？（二）丙受贈之土地有何稅捐優惠及應遵守之義務？（三）甲如於自有農業用地興建農舍，該農舍之移轉有何限制？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>農業用地指非都市土地或都市土地農業區、保護區範圍內，依法供農作、森林、養殖、畜牧及保育使用之土地。為落實<mark class=\"hl\">「農地農用」</mark>，法律對作農業使用之農業用地移轉給予租稅優惠。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第39條之2、農業發展條例第37條（移轉自然人不課徵土地增值稅）；農業發展條例第38條（免徵遺產稅、贈與稅及田賦十年）、第18條（農舍興建與移轉限制）；民法第1138條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲出售予自然人乙，得申請不課徵土地增值稅</p><p>依<span class=\"art\">土地稅法第39條之2第1項</span>，「作農業使用之農業用地，<mark class=\"hl\">移轉與自然人時，得申請不課徵土地增值稅</mark>。」本題甲得申請不課徵；所謂不課徵，係<mark class=\"hl\">將稅負遞延至下次移轉</mark>，與免徵不同。</p></div><div class=\"evp\"><p class=\"evh\">（二）乙未作農業使用者，再移轉時應課徵</p><p>依<span class=\"art\">第39條之2第2項</span>，承受人於具有土地所有權之期間內，曾經查獲未作農業使用且<mark class=\"hl\">未在所令期限內恢復</mark>，或恢復後再有未作農業使用情事時，<mark class=\"hl\">於再移轉時應課徵土地增值稅</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙將該地改作停車場，經查獲且未於所令期限內恢復，日後出售時即應課徵。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>不課徵以農地農用為前提，承受人違反即喪失優惠。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙受贈免徵贈與稅及田賦10年，5年內須繼續農用</p><p>依<span class=\"art\">農業發展條例第38條第2項</span>，作農業使用之農業用地及其地上農作物，贈與民法<span class=\"art\">第1138條</span>所定繼承人者，<mark class=\"hl\">免徵贈與稅</mark>，並自受贈之年起<mark class=\"hl\">免徵田賦10年</mark>；受贈人自受贈之日起<mark class=\"hl\">5年內未繼續作農業使用者，應追繳</mark>應納稅賦。本題丙為甲之子，屬直系血親卑親屬，得享上開優惠。</p></div><div class=\"evp\"><p class=\"evh\">（四）農舍滿5年始得移轉，並應與坐落用地併同移轉</p><p>依<span class=\"art\">農業發展條例第18條第2項</span>，在自有農業用地興建農舍<mark class=\"hl\">滿5年始得移轉</mark>，但因繼承或法院拍賣而移轉者，不在此限；依第4項，農舍應與其坐落用地<mark class=\"hl\">併同移轉或併同設定抵押權</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止農舍與農地分離或藉興建農舍炒作農地。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>農業用地之租稅優惠<mark class=\"hl\">以「作農業使用」為前提</mark>：移轉自然人<mark class=\"hl\">得申請不課徵土增稅</mark>，屬延後課稅，承受人違規即於再移轉時課徵；贈與繼承人<mark class=\"hl\">免徵贈與稅</mark>，5年內須繼續農用。農舍則有<mark class=\"hl\">滿5年始得移轉</mark>及與土地併同移轉之限制。</p>"], "ck": [{"x": "土稅§39-2Ⅰ、農發§37Ⅰ：作農業使用＋移轉自然人 → 得申請不課徵", "h": false}, {"x": "不課徵是延後課稅，不能寫成免徵", "h": true}, {"x": "再移轉原地價：89.1.6當期公告現值；曾課徵者用最近一次申報移轉現值", "h": true}, {"x": "贈與對象限民法§1138 繼承人；丙為子女符合，免贈與稅、田賦10年", "h": true}, {"x": "5年內未繼續農用追繳；死亡、被徵收、依法變更為非農業用地除外", "h": false}, {"x": "農舍滿5年始得移轉（繼承、拍賣例外）；與坐落用地併同移轉或抵押", "h": false}], "mn": "給自然人：不課徵（違規再移轉課）→ 給繼承人：免贈與稅・田賦10年（5年追繳）→ 農舍：滿5年・併同"}, {"id": "pr-44", "no": "預P44", "t": "公有土地之撥用與處分：撥用程序（土地法§26）vs 處分・設定負擔・10年以上租賃（§25）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "何謂公有土地？各級政府機關需用公有土地時應如何取得？直轄市或縣（市）政府處分其所管公有土地、設定負擔或出租，應踐行何種程序？兩者有何不同？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>公有土地為國有、直轄市有、縣（市）有或鄉（鎮、市）有之土地。政府機關之間為公用目的移轉使用，<mark class=\"hl\">以撥用為之</mark>；地方政府將所管公有土地處分、設定負擔或長期出租，因涉及公產外流，另設<mark class=\"hl\">民意機關同意與行政院核准之雙重控制</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第4條、第25條、第26條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公有土地之範圍</p><p>依<span class=\"art\">第4條</span>，「本法所稱公有土地，為<mark class=\"hl\">國有土地、直轄市有土地、縣（市）有土地或鄉（鎮、市）有之土地</mark>。」以登記之所有權主體認定，國營事業公司名下之土地<mark class=\"hl\">屬私有土地</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）撥用</p><p>依<span class=\"art\">第26條</span>，「各級政府機關需用公有土地時，應商同該管直轄市或縣（市）政府<mark class=\"hl\">層請行政院核准撥用</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>中央機關需用位於甲縣之國有土地興建辦公廳舍，應商同甲縣政府層請行政院核准撥用。核准機關為行政院，並非財政部國有財產署，條文亦未要求民意機關同意。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>撥用只是政府機關間之使用調整，仍供公用，不涉公產外流。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）處分、設定負擔與長期租賃</p><p>依<span class=\"art\">第25條</span>，「直轄市或縣（市）政府對於其所管公有土地，<mark class=\"hl\">非經該管區內民意機關同意，並經行政院核准</mark>，不得處分或設定負擔或為<mark class=\"hl\">超過十年期間之租賃</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣政府欲出售縣有土地或設定地上權予民間，須先經縣議會同意，再報行政院核准。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>處分及設定負擔使公產移出或受限，須由民意機關監督並由行政院把關。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）比較</p><p>撥用以「各級政府機關需用」為前提，<mark class=\"hl\">只需層請行政院核准</mark>；處分、設定負擔或超過10年期間之租賃，<mark class=\"hl\">須民意機關同意並經行政院核准</mark>；<mark class=\"hl\">10年以內之租賃</mark>，不在<span class=\"art\">第25條</span>限制之列。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依對公產影響程度設計不同強度之控制。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>公有土地依第4條包括國有、直轄市有、縣（市）有及鄉（鎮、市）有土地。各級政府機關需用公有土地，應商同該管直轄市或縣（市）政府<mark class=\"hl\">層請行政院核准撥用</mark>，<mark class=\"hl\">無須民意機關同意</mark>；直轄市或縣（市）政府所管公有土地之處分、設定負擔或超過10年期間之租賃，<mark class=\"hl\">須經民意機關同意並經行政院核准</mark>，以兼顧行政效率與公產保護。</p>"], "ck": [{"x": "§26 層請行政院核准撥用", "h": true}, {"x": "§25 民意機關同意＋行政院核准；10年", "h": true}], "mn": "〔自編〕撥用找行政院；要賣先過議會再過行政院"}, {"id": "pr-45", "no": "預P45", "t": "非都市土地分區變更與開發許可：兩種變更途徑、五款許可條件、開發影響費、審議期限（區計§15～§17）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "依區域計畫法規定，非都市土地如何辦理使用分區變更？申請開發之案件應符合哪些條件始得許可？取得許可後申請人負有何種義務？審議期限為何？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>非都市土地由直轄市或縣（市）政府按分區使用計畫製定分區圖並編定使用地後實施管制。欲變更使用分區，政府得基於資源保育<mark class=\"hl\">逕為變更</mark>；私人為開發利用，須擬具開發計畫<mark class=\"hl\">申請開發許可</mark>，經審議符合法定條件後始得變更，並負擔公共設施用地移轉與<mark class=\"hl\">開發影響費</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>區域計畫法第15條、第15條之1至第15條之5、第16條、第17條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）管制基礎</p><p>依<span class=\"art\">第15條第1項</span>，直轄市或縣（市）政府按非都市土地分區使用計畫製定分區圖並編定各種使用地，<mark class=\"hl\">報經上級主管機關核備後實施管制</mark>；依<span class=\"art\">第16條</span>，分區圖及編定結果應公告，編定結果<mark class=\"hl\">應通知土地所有權人</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）兩種變更途徑</p><p>依<span class=\"art\">第15條之1第1項</span>，政府為加強資源保育須檢討變更使用分區者，得由直轄市、縣（市）政府報經上級主管機關核定時，<mark class=\"hl\">逕為辦理分區變更</mark>；為開發利用，由申請人擬具開發計畫向直轄市、縣（市）政府申請，<mark class=\"hl\">報經區域計畫擬定機關許可</mark>後辦理分區變更，許可前應<mark class=\"hl\">提區域計畫委員會審議</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）許可五條件</p><p>依<span class=\"art\">第15條之2</span>，須國土利用適當合理、不違反土地利用或環境保護計畫、對環保保育及災害防止妥適規劃、與水電交通排水垃圾等公共設施能相互配合，以及「<mark class=\"hl\">取得開發地區土地及建築物權利證明文件者</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建商申請開發社區，須證明已取得權利證明文件，條文並未要求先取得全部所有權。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）許可後義務</p><p>依<span class=\"art\">第15條之3</span>，分區或用地變更前，應將<mark class=\"hl\">公共設施用地分割移轉登記</mark>為直轄市、縣（市）或鄉、鎮（市）有，並<mark class=\"hl\">繳交開發影響費</mark>，「該開發影響費<mark class=\"hl\">得以開發區內可建築土地抵充之</mark>」，都市土地準用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>使開發者負擔其增加之公共設施需求。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）期限與補償</p><p>依<span class=\"art\">第15條之4</span>，地方受理後<mark class=\"hl\">60日內報請審議</mark>，擬定機關<mark class=\"hl\">90日內通知結果</mark>，特殊情形得延長一次；依<span class=\"art\">第17條</span>，原有改良物經令變更使用或拆除所受損害<mark class=\"hl\">應予適當補償</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>非都市土地分區變更有<mark class=\"hl\">政府逕為變更與私人申請開發許可二途</mark>；許可須符合<mark class=\"hl\">五款條件</mark>，許可後先移轉公共設施用地並繳開發影響費，<mark class=\"hl\">得以可建築土地抵充</mark>，審議為<mark class=\"hl\">60日報審、90日通知</mark>。</p>"], "ck": [{"x": "§15-1 兩途", "h": true}, {"x": "§15-2 第五款 權利證明文件", "h": true}, {"x": "§15-3 開發影響費得以可建築土地抵充", "h": true}], "mn": "〔自編〕保育政府改、開發要許可；五條件最後一項「有權證明」；先送地、再繳費"}, {"id": "pr-52", "no": "預P52", "t": "耕地分割之限制與例外（農發§16）、私法人承受耕地之禁止與例外（農發§33）", "lv": "中", "k": "pred", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "何謂耕地？依農業發展條例，耕地分割有何限制？有哪些例外？私法人得否承受耕地？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>耕地是農業生產之基礎，任意細分將使經營規模過小，由一般私法人取得則易流於囤積炒作。農業發展條例因此<mark class=\"hl\">限制耕地分割</mark>，並<mark class=\"hl\">原則禁止私法人承受耕地</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>農業發展條例第3條第11款、第16條、第33條、第34條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）耕地範圍</p><p>依<span class=\"art\">第3條第11款</span>，耕地「指依區域計畫法劃定為<mark class=\"hl\">特定農業區、一般農業區、山坡地保育區及森林區之農牧用地</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（二）分割限制</p><p>依<span class=\"art\">第16條第1項</span>本文，「每宗耕地分割後每人所有面積<mark class=\"hl\">未達〇．二五公頃者，不得分割</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>〇．四公頃由兄弟二人共有，分割後每人僅〇．二公頃，原則不得分割。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止耕地細碎化，維持農業經營規模。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）七款例外</p><p>依同項但書，因購置毗鄰耕地合併或同一人毗鄰耕地宗數未增加之分割合併；部分依法變更為非耕地使用；<mark class=\"hl\">89年一月4日修正施行後所繼承之耕地</mark>；<mark class=\"hl\">同日修正施行前之共有耕地</mark>；三七五租約協議以分割方式終止；非農地重劃地區變更為農水路；專案核准者，得為分割。</p><p class=\"evx\"><span class=\"evt\">例</span><span>前例兄弟於89年一月4日後繼承，得分割為單獨所有。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>合併不增加細碎化，繼承與舊共有屬既存狀態。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）共有分割要件</p><p>依<span class=\"art\">第16條第2項</span>，繼承及舊共有耕地分割為單獨所有者，應先取得共有人之協議或法院確定判決，「<mark class=\"hl\">其分割後之宗數，不得超過共有人人數</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>三人共有之耕地，分割後最多三宗。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免藉例外擴大細分。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）私法人承受</p><p>依<span class=\"art\">第33條</span>，「<mark class=\"hl\">私法人不得承受耕地</mark>。」依<span class=\"art\">第34條</span>，農民團體、農業企業機構或農業試驗研究機構，「其符合技術密集或資本密集之類目及標準者，<mark class=\"hl\">經申請許可後，得承受耕地</mark>」，由地方主管機關核轉中央主管機關許可，並「限制其承受耕地之區位、面積、用途及他項權利設定之最高金額」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>一般建設公司不得以公司名義買受耕地。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保耕地由實際從事農業者取得與經營。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>耕地分割後每人所有面積<mark class=\"hl\">未達〇．二五公頃者不得分割</mark>，但有分割合併、依法變更、89年一月4日後繼承、該日前共有、三七五、農水路及專案核准<mark class=\"hl\">七款例外</mark>，且<mark class=\"hl\">宗數不得超過共有人人數</mark>；<mark class=\"hl\">私法人原則不得承受耕地</mark>，僅符合技術密集或資本密集並經中央主管機關許可者除外，以維持農業經營規模並防止農地炒作。</p>"], "ck": [{"x": "§16 每人0.25公頃", "h": true}, {"x": "§16 89.1.4 後繼承・前共有", "h": true}, {"x": "§33 私法人不得承受", "h": true}], "mn": "〔自編〕耕地每人零點二五；八九年後繼承、八九年前共有可分；分幾塊不超過幾人；公司不能買耕地"}, {"id": "pr-10", "no": "預P10", "t": "非都市土地使用管制（分區・編定・建蔽率容積率・違規處理）", "lv": "低", "k": "pred", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "試說明非都市土地之使用分區與使用地編定，並說明建蔽率、容積率及違規處理。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>非都市土地是都市計畫範圍以外的土地，依區域計畫法體系<mark class=\"hl\">先劃定使用分區，再編定使用地</mark>，兩層管制（區域計畫法第15條第1項）。</p>", "<span class=\"blk-l\">二、法條</span><p>區域計畫法第15條、第21條、第22條；非都市土地使用管制規則第2條、第3條、第6條、第8條、第9條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）先劃定十一種使用分區</p><p>依<span class=\"art\">區域計畫法第15條第1項</span>，由直轄市或縣（市）政府<mark class=\"hl\">製定使用分區圖</mark>並<mark class=\"hl\">編定使用地</mark>；依非都市土地使用管制規則<span class=\"art\">第2條</span>，得劃定為特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用等使用分區。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依自然條件與發展需要分區，保育農業與環境資源。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）再編定十九種使用地並依容許使用</p><p>依<span class=\"art\">第3條</span>，依分區性質編定為甲種建築、乙種建築、農牧、林業等<mark class=\"hl\">十九種使用地</mark>；依<span class=\"art\">第6條</span>，應<mark class=\"hl\">依其容許使用之項目及許可使用細目使用</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以「分區＋編定」兩層管制，避免土地被任意開發。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）原有使用得繼續</p><p>依<span class=\"art\">第8條</span>，原有使用或原有建築物不合規定者，在政府令其變更使用或拆除前，<mark class=\"hl\">得為從來之使用</mark>，「<mark class=\"hl\">原有建築物除准修繕外，不得增建或改建</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>編定前即存在之舊房屋可繼續居住並修繕，但不得增建樓層。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保障既有權益並避免違規擴大。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）建蔽率容積率設上限</p><p>依<span class=\"art\">第9條</span>，甲種、乙種建築用地<mark class=\"hl\">建蔽率60%、容積率240%</mark>，<mark class=\"hl\">丙種建築用地40%、120%</mark>，<mark class=\"hl\">丁種建築用地70%、300%</mark>，縣市得酌予調降。</p><p class=\"evx\"><span class=\"evt\">例</span><span>五百平方公尺之甲種建築用地，建築面積至多三百平方公尺。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依使用地性質控制開發強度。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）違規處理</p><p>依<span class=\"art\">區域計畫法第21條</span>，違反管制使用土地者，<mark class=\"hl\">處6萬元以上30萬元以下罰鍰</mark>，並得限期令其變更使用、停止使用或拆除其地上物恢復原狀，不遵從者得按次處罰；依<span class=\"art\">第22條</span>，不依限恢復原狀者得處<mark class=\"hl\">6個月以下有期徒刑或拘役</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>農牧用地上違規設置鐵皮廠房，得處罰鍰並限期拆除。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以行政罰、行政執行與刑罰層層督促。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>非都市土地依區域計畫法第15條第1項<mark class=\"hl\">劃定使用分區</mark>（管制規則第2條）並<mark class=\"hl\">編定使用地</mark>（第3條），依容許使用項目使用（第6條）；建蔽率、容積率依使用地類別設上限，<mark class=\"hl\">縣市得酌予調降</mark>（第9條）；違規者<mark class=\"hl\">處6萬元以上30萬元以下罰鍰</mark>並得限期恢復原狀，不依限者得處6個月以下有期徒刑或拘役（區域計畫法第21條、第22條）。</p>"], "ck": [{"x": "規則§2 使用分區11種、§3 使用地19種，數量不可記反", "h": true}, {"x": "§6 依容許使用項目及許可使用細目使用", "h": false}, {"x": "§8 原有使用得從來使用，除修繕外不得增建或改建", "h": true}, {"x": "§9Ⅰ 甲乙60/240、丙40/120、丁70/300，數字不可配錯用地", "h": true}, {"x": "窯60/120、交遊殯40/120、特目60/180；縣市得酌予調降", "h": false}, {"x": "區計§21 處6萬～30萬罰鍰，得限期變更、停止使用或拆除恢復原狀", "h": false}, {"x": "不遵從按次處罰、停水停電、強制拆除；§22 得處6個月以下有期徒刑或拘役", "h": false}], "mn": "11分區 → 19使用地 → 容許使用 → 原有只修繕 → 建蔽容積（丁70/300最高）→ 罰6～30萬・§22刑責"}, {"id": "pr-17", "no": "預P17", "t": "外國人取得土地 vs 私法人買受住宅：兩種取得管制的比較", "lv": "低", "k": "pred", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "試比較外國人取得土地與私法人買受住宅之管制，就管制對象、標的、許可機關與取得後限制說明其異同。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>外國人取得土地受土地法第17條至第20條限制，私法人買受供住宅使用之房屋受平均地權條例第79條之1限制。兩者都<mark class=\"hl\">以事前許可為手段</mark>，但管制標的與取得後限制不同。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第17條至第20條（外國人取得土地）；平均地權條例第79條之1（私法人買受供住宅使用房屋之許可與限制）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）對象不同</p><p><mark class=\"hl\">外國人以國籍、私法人以主體性質區分</mark>。依<span class=\"art\">土地法第18條</span>，外國人取得土地<mark class=\"hl\">以平等互惠為前提</mark>；依<span class=\"art\">平均地權條例第79條之1第1項</span>，私法人買受供住宅使用之房屋，應檢具使用計畫，<mark class=\"hl\">經中央主管機關許可</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外國籍自然人甲、本國公司乙，分別受土地法與平均地權條例之管制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>前者著眼國家安全與互惠，後者著眼抑制法人囤房炒作。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）標的不同</p><p><mark class=\"hl\">外國人管土地，私法人管住宅</mark>。依<span class=\"art\">土地法第17條第1項</span>，林地、漁地、礦地、水源地等七類土地，不得移轉、設定負擔或租賃於外國人；依<span class=\"art\">第19條第1項</span>，外國人僅得取得住宅、營業處所等八款用途之土地。私法人則僅以<mark class=\"hl\">「供住宅使用之房屋」</mark>為管制標的。</p></div><div class=\"evp\"><p class=\"evh\">（三）許可不同</p><p><mark class=\"hl\">縣市政府核准與中央主管機關許可</mark>。依<span class=\"art\">土地法第20條第1項</span>、第2項，外國人應申請該管直轄市或縣（市）政府核准，依<span class=\"art\">第19條第1項第8款</span>取得者並應先經中央目的事業主管機關同意。依<span class=\"art\">平均地權條例第79條之1第2項</span>、第4項，私法人許可之文件<mark class=\"hl\">有效期限為1年</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>外國人甲在臺中市買住宅，向臺中市政府申請；本國公司乙買員工宿舍，則向中央主管機關申請許可。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）取得後限制不同</p><p><mark class=\"hl\">外國人管用途，私法人管轉手</mark>。依<span class=\"art\">土地法第20條第1項</span>後段，變更用途或為繼承以外之移轉亦應申請核准；第3項，依第8款取得而未依核定期限及用途使用者，通知於<mark class=\"hl\">送達後3年內出售</mark>。依<span class=\"art\">平均地權條例第79條之1第3項</span>，私法人於<mark class=\"hl\">登記完畢後5年內不得辦理移轉、讓與或預告登記</mark>，但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。</p></div>", "<span class=\"blk-l\">四、結論</span><p>兩者皆為事前許可制度：外國人<mark class=\"hl\">以平等互惠為前提</mark>，管制土地，<mark class=\"hl\">向直轄市或縣（市）政府申請核准</mark>，取得後變更用途或繼承以外之移轉仍須核准；私法人管制供住宅使用之房屋，<mark class=\"hl\">經中央主管機關許可，文件有效期限1年</mark>，登記完畢後<mark class=\"hl\">5年內不得移轉、讓與或預告登記</mark>。</p>"], "ck": [{"x": "土地法§18 外國人取得以平等互惠為限", "h": false}, {"x": "平均§79-1 私法人買受供住宅使用之房屋須許可（中央公告免許可除外）", "h": false}, {"x": "外國人管土地（§17七類禁止、§19八款用途）；私法人只管住宅房屋", "h": false}, {"x": "外國人→縣市政府14日內准駁；私法人→中央主管機關許可，兩者不可混用", "h": true}, {"x": "私法人許可文件有效1年，得以合議制審核", "h": false}, {"x": "外國人變更用途、繼承以外移轉須再核准；繼承禁止類土地3年內出售", "h": false}, {"x": "登記後5年內禁移轉、讓與、預告登記只適用私法人，不適用外國人", "h": true}, {"x": "依對象、標的、許可機關、取得後限制四欄逐欄比較，不要各寫各的", "h": true}], "mn": "外國人看地（互惠、縣市14日、管用途）→ 私法人看住宅（中央許可1年、5年禁三事）", "hp": 10, "hpl": "高"}, {"id": "pr-33", "no": "預P33", "t": "國土計畫法：四大國土功能分區、使用原則、使用許可、與區域計畫法之銜接", "lv": "低", "k": "pred", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "請說明國土計畫法之國土功能分區及其土地使用原則、使用許可之審議分工，以及國土功能分區圖公告後與區域計畫法之關係。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>依國土計畫法第20條第1項，國土功能分區分為<mark class=\"hl\">國土保育地區、海洋資源地區、農業發展地區及城鄉發展地區</mark>；其以「國土功能分區」取代區域計畫法下之非都市土地使用分區及使用地編定。</p>", "<span class=\"blk-l\">二、法條</span><p>國土計畫法第20條、第21條、第23條、第24條、第45條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）四大功能分區</p><p>依<span class=\"art\">國土計畫法第20條第1項</span>，分為<mark class=\"hl\">國土保育地區、海洋資源地區、農業發展地區及城鄉發展地區</mark>，各再分類；第2項，「新訂或擴大都市計畫案件，<mark class=\"hl\">應以位屬城鄉發展地區者為限</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>曾投資建設重大農業改良設施之優良農地，應劃為農業發展地區第一類。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>依資源特性受不同程度之管制。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）使用原則</p><p>依<span class=\"art\">第21條</span>，國土保育地區第一類「<mark class=\"hl\">維護自然環境狀態，並禁止或限制其他使用</mark>」，第二類允許有條件使用；農業發展地區第一類供農業生產及其必要之產銷設施使用；城鄉發展地區依強度高低供居住、產業使用。依<span class=\"art\">第23條第2項</span>，實施都市計畫或國家公園計畫者，<mark class=\"hl\">仍依各該法規管制</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>在農業發展地區第一類興建大型商場，原則受禁止或限制。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>確保糧食安全並導引發展。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）使用許可</p><p>依<span class=\"art\">第24條</span>，一定規模以上之土地使用<mark class=\"hl\">應申請使用許可</mark>，「前項<mark class=\"hl\">使用許可不得變更國土功能分區、分類</mark>」；由直轄市、縣（市）受理，屬國土保育地區或海洋資源地區者核轉中央審議，跨縣市或填海造地亦由中央審議，其餘地方審議。</p><p class=\"evx\"><span class=\"evt\">例</span><span>城鄉發展地區之單一縣市開發案，由該縣政府審議。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>全國性資源由中央把關。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）與區域計畫法銜接</p><p>依<span class=\"art\">第45條</span>，直轄市、縣（市）國土計畫公告實施後<mark class=\"hl\">10年內公告國土功能分區圖</mark>，自公告之日起，<mark class=\"hl\">區域計畫法停止適用</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>目前解說非都市土地，仍以使用分區及使用地編定為準。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免管制真空。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>國土計畫法以<mark class=\"hl\">四大功能分區</mark>、分類管制與使用許可取代區域計畫法；<mark class=\"hl\">分區圖公告前非都市土地仍依區域計畫法管制</mark>，經紀人應提醒買方未來管制可能改變。</p>"], "ck": [{"x": "§20 四大分區名稱：國土保育、海洋資源、農業發展、城鄉發展（不是區計法分區）", "h": true}, {"x": "§20Ⅱ 新訂或擴大都市計畫限城鄉發展地區", "h": false}, {"x": "§21 各區第一類、第二類寬嚴不同；農發一類原則禁止或限制其他使用", "h": false}, {"x": "§24Ⅱ 使用許可不得變更國土功能分區、分類", "h": false}, {"x": "審議：地方受理；國保、海洋中央審，其餘地方審；跨縣市、重大公設跨分區、填海造地中央審", "h": true}, {"x": "§45 全國2年、縣市3年、功能分區圖10年內", "h": false}, {"x": "分區圖公告前仍依區計法；公告之日起區計法才停止適用", "h": true}], "mn": "保、海、農、城 → 愈敏感愈嚴 → 保海中央、農城地方 → 分區圖公告日區計法停"}, {"id": "q-109-一", "no": "109-一", "t": "抵價地意義＋可分配比例原則", "lv": "B", "k": "off", "tier": 1, "g": "土地徵收・區段徵收", "q": "抵價地的意義為何？又關於抵價地可分配之比例及其原則為何？請依土地徵收條例之規定說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>抵價地係區段徵收時，<mark class=\"hl\">以徵收後可供建築之土地</mark>，依原土地所有權人原有土地之地價比例折算分配，<mark class=\"hl\">抵付其補償地價</mark>，作為現金補償之替代（土地徵收條例第39條第1項）。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第39條、第40條、第44條第1項第1款及第2項；平均地權條例第54條第2項、第3項同旨。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）意義</p><p><mark class=\"hl\">以可建築土地折算抵付地價補償，須經申請</mark>。依<span class=\"art\">第39條第1項</span>，區段徵收應依<span class=\"art\">第30條</span>補償地價，地價補償得經所有權人申請，以徵收後可供建築之抵價地折算抵付，其餘補償費依<span class=\"art\">第31條</span>至<span class=\"art\">第34條</span>補償。要件：①須為區段徵收；②<mark class=\"hl\">限於地價補償</mark>，建築改良物、農作改良物補償仍發現金；③須<mark class=\"hl\">於徵收公告期間內</mark>檢具證明文件，以書面向直轄市或縣（市）主管機關申請（<span class=\"art\">第40條第1項</span>），並得就全部或部分應領補償地價申請（同條第2項）。</p></div><div class=\"evp\"><p class=\"evh\">（二）可分配比例</p><p><mark class=\"hl\">以50%為原則，下限40%</mark>。依<span class=\"art\">第39條第2項</span>，抵價地總面積以徵收總面積50%為原則；因情況特殊經上級主管機關核准者不在此限，但不得少於40%；曾經農地重劃者，該重劃地區部分<mark class=\"hl\">不得少於45%</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>徵收總面積100公頃，原則50公頃，縱經核准亦不得少於40公頃。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）分配原則</p><p><mark class=\"hl\">按補償地價比例計算權利價值</mark>。依<span class=\"art\">第44條第1項第1款</span>，由主管機關按其應領地價補償費與區段徵收補償地價總額之比率計算應領之權利價值，並以實際領回抵價地之單位地價折算面積；依同條第2項，領回面積不足最小建築單位面積者，<mark class=\"hl\">應於規定期間內申請合併</mark>，未申請者，主管機關於期間屆滿之日起30日內按原徵收地價補償費發給現金。另依<span class=\"art\">第40條</span>，核定後得申請改發現金，或已領現金者申請改發抵價地，<mark class=\"hl\">以一次為限</mark>。以地價比例而非面積比例分配，因各筆土地原有價值不同，按價值折算始公平。</p></div>", "<span class=\"blk-l\">四、結論</span><p>抵價地係區段徵收時，以徵收後可供建築之土地折算抵付地價補償，<mark class=\"hl\">須所有權人申請</mark>。其總面積以徵收總面積<mark class=\"hl\">50%為原則</mark>，經核准<mark class=\"hl\">不得少於40%</mark>，曾經農地重劃者<mark class=\"hl\">不得少於45%</mark>；分配按應領補償地價比例計算權利價值，以單位地價折算面積，不足最小建築單位面積者<mark class=\"hl\">應申請合併</mark>，否則改發現金。</p>"], "ck": [{"x": "土徵§39Ⅰ 只限地價補償得申請以抵價地抵付，改良物補償仍發現金", "h": false}, {"x": "須於徵收公告期間內書面申請（土徵§40Ⅰ），不是強制領抵價地", "h": true}, {"x": "土徵§39Ⅱ 50%原則，例外40%（上級核准）、45%（曾農地重劃）都要寫", "h": true}, {"x": "土徵§44Ⅰ① 按應領地價補償費比率算權利價值，以實際領回抵價地單位地價折算面積", "h": false}, {"x": "不足最小建築單位：先申請合併，未申請者期滿30日內發現金（土徵§44Ⅱ），不是任選", "h": true}, {"x": "土徵§40ⅢⅣ 改領現金或改發抵價地：須徵得需用土地人同意後核准、1個月內、一次為限；改發抵價地須先繳回補償地價", "h": false}, {"x": "抵價地按地價比例分配，使原所有權人分享開發增值，為區段徵收有別於一般徵收之特色", "h": false}], "mn": "申請才給、只抵地價 → 五〇原則、四〇核准、四五農重 → 地價比例折算 → 太小先合併、不申請才發現金", "hp": 5, "hpl": "高"}, {"id": "q-108-一", "no": "108-一", "t": "土地徵收之必備要件", "lv": "B", "k": "off", "tier": 1, "g": "土地徵收・區段徵收", "q": "土地徵收涉及人民在憲法上所保障權利的侵害，政府在進行土地徵收時一定要嚴守土地徵收的必備要件，請問此必備要件為何？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地徵收係國家因公益需要，依法定程序強制取得私人土地並予補償，其範圍應<mark class=\"hl\">以其事業所必須者為限</mark>（土地徵收條例第3條）。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第3條、第3條之1、第3條之2、第10條、第11條、第13條、第20條、第30條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公益性</p><p><mark class=\"hl\">須為法定公益事業</mark>。依<span class=\"art\">第3條</span>，須因公益需要，興辦國防、交通、公用、水利、公共衛生及環境保護、教育學術及文化、社會福利等法定事業，始得徵收；依<span class=\"art\">第3條之2</span>，需用土地人應依社會、經濟、文化及生態、永續發展等因素，<mark class=\"hl\">評估公益性及必要性</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣政府為興建聯外道路徵收沿線土地，須先完成評估。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）必要性</p><p><mark class=\"hl\">範圍以事業所必須者為限</mark>。依<span class=\"art\">第3條</span>，徵收範圍以其事業所必須者為限；依<span class=\"art\">第3條之1第1項</span>，<mark class=\"hl\">應儘量避免耕地</mark>，並優先使用無使用計畫之公有土地或國營事業土地；<mark class=\"hl\">特定農業區農牧用地</mark>，除零星夾雜難以避免者外不得徵收，但國防、交通、水利事業等所必須或經行政院核定之重大建設所需者，不在此限（第4項）。</p></div><div class=\"evp\"><p class=\"evh\">（三）最後手段性</p><p><mark class=\"hl\">先協議價購</mark>。依<span class=\"art\">第11條第1項</span>，申請徵收前應先與所有權人協議價購或以其他方式取得，拒絕參與協議或未能達成協議者，<mark class=\"hl\">始得申請徵收</mark>；但國防、交通或水利事業因公共安全急需使用土地未及協議者除外。<mark class=\"hl\">協議價購應依市價</mark>為之（第4項、第5項）。</p></div><div class=\"evp\"><p class=\"evh\">（四）正當程序</p><p>公聽會與計畫書審查。依<span class=\"art\">第10條第2項</span>，事業計畫報請許可前<mark class=\"hl\">應舉行公聽會</mark>；特定農業區經行政院核定為重大建設須辦理徵收，若有爭議，<mark class=\"hl\">應依行政程序法舉行聽證</mark>（第3項）。依<span class=\"art\">第13條</span>，應擬具詳細徵收計畫書送核准徵收機關核准，由中央主管機關<mark class=\"hl\">審查公益性、必要性</mark>、執行能力及是否符合都市計畫區域計畫或國土計畫等事項。</p></div><div class=\"evp\"><p class=\"evh\">（五）合理補償</p><p>按市價並限期發給。依<span class=\"art\">第30條第1項</span>，<mark class=\"hl\">按徵收當期之市價補償地價</mark>，市價由地價評議委員會評定（第2項）；依<span class=\"art\">第20條</span>，補償費應於<mark class=\"hl\">公告期滿後15日內發給</mark>，未於期限內發給完竣者，除同條第2項但書情形外，<mark class=\"hl\">該部分之徵收從此失其效力</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>土地徵收之必備要件為：<mark class=\"hl\">公益性</mark>（法定事業並經評估）、<mark class=\"hl\">必要性</mark>（以事業所必須者為限）、<mark class=\"hl\">最後手段性</mark>（先協議價購）、<mark class=\"hl\">正當程序</mark>（公聽會、聽證、計畫書審查）及<mark class=\"hl\">合理補償</mark>（按市價、15日內發給，逾期失效）。</p>"], "ck": [{"x": "土徵§3 法定公益事業＋§3-2 公益性、必要性評估", "h": false}, {"x": "必要性：範圍以事業所必須者為限，避免耕地、優先公有地（§3、§3-1）", "h": true}, {"x": "最後手段：§11 申請徵收前先以市價協議價購，不成始得徵收（國防交通水利急需除外）", "h": true}, {"x": "正當程序：§10 公聽會、§13 徵收計畫書送核准並審查", "h": false}, {"x": "補償寫徵收當期市價（§30），不寫公告現值加成（修法前標準）", "h": true}, {"x": "§20 公告期滿後15日內發給，逾期該部分徵收失效", "h": false}, {"x": "核心＝公益性、必要性、最後手段性三原則，輔以正當程序與合理補償", "h": false}], "mn": "公益（§3）→ 必要（§3-1）→ 協議（§11）→ 程序（§10、§13）→ 補償（§30、§20）"}, {"id": "q-104-一", "no": "104-一", "t": "土地徵收失效之意義", "lv": "C", "k": "off", "tier": 2, "g": "土地徵收・區段徵收", "q": "何謂土地徵收失效？試就現行土地徵收條例及相關法律規定，詳予析論之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地徵收失效，係指已核准之徵收案，因法定事由發生而失去效力或原所有權人得請求回復之制度。依現行土地徵收條例，可分為<mark class=\"hl\">補償費未依限發給致失效、撤銷或廢止徵收、原所有權人收回權三類</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第20條（公告期滿後十五日內發給，逾期失其效力，但書除外）、第21條第1項、第49條至第52條（撤銷、廢止徵收之事由、程序、發還與權利回復）、第9條（收回權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）補償費逾期未發給，徵收失效</p><p>依<span class=\"art\">第20條</span>，補償費應於<mark class=\"hl\">公告期滿後15日內發給</mark>；需用土地人未於期限內繳交發給完竣者，<mark class=\"hl\">該部分之徵收從此失其效力</mark>。但對補償估定有異議而提交地價評議委員會復議、應受補償人書面同意延期或分期、拒絕受領或不能受領、所在地不明者，不在此限。因依<span class=\"art\">第21條第1項</span>，原所有權人權利義務<mark class=\"hl\">於補償費發給完竣時始終止</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）徵收當時即有錯誤者，應撤銷徵收</p><p>依<span class=\"art\">第49條第1項</span>：①<mark class=\"hl\">作業錯誤致不在工程用地範圍內</mark>；②公告徵收時都市計畫已規定以<mark class=\"hl\">聯合開發、市地重劃或其他方式開發</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）事後情事變更者，應廢止徵收</p><p>依<span class=\"art\">第49條第2項</span>：①<mark class=\"hl\">工程變更設計</mark>，致不在工程用地範圍內；②開始使用前興辦事業改變、計畫註銷、開發或取得方式改變；③已開始使用尚未完成之土地，<mark class=\"hl\">因情事變更已無徵收必要</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）撤廢程序與效果</p><p>依<span class=\"art\">第50條</span>，<mark class=\"hl\">由需用土地人向中央申請</mark>，未申請者原所有權人得向直轄市或縣（市）主管機關請求。依<span class=\"art\">第51條</span>，核准後<mark class=\"hl\">公告30日</mark>，通知原所有權人於一定期間（<mark class=\"hl\">不得少於6個月</mark>）繳清補償地價、地價加成補償及遷移費後發還土地；未繳清者不發還，並不得依<span class=\"art\">第9條</span>申請收回。依<span class=\"art\">第52條</span>，原設定之<mark class=\"hl\">他項權利及耕地租約不予回復</mark>（<span class=\"art\">第42條</span>抵價地之抵押權或典權除外）。</p></div><div class=\"evp\"><p class=\"evh\">（五）徵而不用者，得申請收回</p><p>依<span class=\"art\">第9條</span>，<mark class=\"hl\">自徵收公告之日起20年內</mark>，有①補償費發給完竣屆滿3年未開始使用、②未依核准原定興辦事業使用、③開始使用後未滿5年不繼續使用者，原所有權人得申請<mark class=\"hl\">照原徵收補償價額收回</mark>；經核准後<mark class=\"hl\">應於6個月內繳還</mark>補償地價及地價加成補償。第1款係<mark class=\"hl\">不可歸責於需用土地人者不得申請</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>土地徵收失效包括<mark class=\"hl\">補償費逾期而失效、撤銷／廢止徵收、原所有權人申請收回三種態樣</mark>，其發動事由、申請人、期限與效果各不相同（第20條、第49條至第52條、第9條）。</p>"], "ck": [{"x": "§20 公告期滿15日內未發給完竣，該部分徵收失其效力（四種例外）", "h": false}, {"x": "徵收失效＝已核准徵收案失效或得請求回復，分逾期失效、撤銷廢止、收回三類", "h": false}, {"x": "§49Ⅰ 撤銷＝徵收有錯：作業錯誤、都計已定聯合開發或市地重劃", "h": false}, {"x": "§49Ⅱ 廢止＝事後情變，第1款工程變更設計不能漏列", "h": true}, {"x": "§50 需用土地人向中央申請；§51 公告30日、不少於6個月繳清始發還", "h": false}, {"x": "§52 他項權利及耕地租約「不予回復」（例外§42），不是得予回復", "h": true}, {"x": "§9 收回：20年內、3年未使用／未依原事業／未滿5年停用；核准後6個月繳還（不是3個月）", "h": true}, {"x": "三態樣分開寫發動機關、期限、效果，共通目的在避免徵而不用", "h": false}], "mn": "逾期失效（15日）→ 撤銷＝錯、其 → 廢止＝變變變 → 收回（20年、3年／5年、6個月）"}, {"id": "mk-2", "no": "模2", "t": "模擬試題｜作業錯誤與工程變更設計：撤銷與廢止徵收之處理、效力及他項權利租約回復", "lv": "模", "k": "mock", "tier": 1, "g": "土地徵收・區段徵收", "q": "二、甲所有A、B兩筆土地，均經政府為興建道路工程公告徵收並發給補償費。徵收前，A地設定抵押權予丙銀行；B地則出租予丁耕作，訂有耕地租約。嗣主管機關查明，A地係因作業錯誤而誤列入徵收範圍，實際上並不在道路工程用地範圍內；B地原確屬道路工程所需土地，但徵收後因工程變更設計，已不再位於工程用地範圍內。丙、丁並主張，如A、B地返還甲，其原抵押權及耕地租約亦應一併回復。試依土地徵收條例及行政法一般原則規定，說明A、B兩筆土地應如何處理、撤銷與廢止徵收之效力有何不同，以及土地發還後丙、丁之主張是否有理由。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>撤銷徵收，指徵收處分<mark class=\"hl\">作成時即有違法瑕疵</mark>，由主管機關撤銷原處分，使其失效；廢止徵收，指徵收處分作成時合法，嗣因事實變更已無徵收必要，由主管機關廢止原處分，<mark class=\"hl\">使其向將來失效</mark>。土地徵收條例第49條分別列舉應撤銷與應廢止之事由。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第49條第1項、第2項、第50條、第51條、第52條；行政程序法第118條、第125條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A地應撤銷徵收</p><p>依<span class=\"art\">土地徵收條例第49條第1項第1款</span>，「因作業錯誤，致原徵收之土地不在工程用地範圍內」者，應辦理撤銷徵收。A地因作業錯誤誤列入徵收範圍，原徵收處分自始違法，<mark class=\"hl\">應撤銷徵收</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）B地應廢止徵收</p><p>依同條第2項第1款，「因工程變更設計，致原徵收之土地不在工程用地範圍內」者，<mark class=\"hl\">應廢止徵收</mark>。B地徵收當時合法，嗣因工程變更設計不在工程用地範圍內，應廢止徵收。</p></div><div class=\"evp\"><p class=\"evh\">（三）效力不同，發還程序相同</p><p>依行政程序法<span class=\"art\">第118條</span>，「違法行政處分經撤銷後，<mark class=\"hl\">溯及既往失其效力</mark>。」A地原則溯及既往失效，撤銷機關得另定失效日期；依<span class=\"art\">同法第125條</span>，「合法行政處分經廢止後，<mark class=\"hl\">自廢止時或自廢止機關所指定較後之日時起</mark>，失其效力。」B地自廢止時起向將來失效。惟<mark class=\"hl\">兩者發還程序相同</mark>：由需用土地人向中央主管機關申請，未申請者甲得依<span class=\"art\">第50條第2項</span>請求；核准後公告30日，通知甲於<mark class=\"hl\">不少於6個月</mark>之期間內繳清徵收補償地價、地價加成補償及遷移費後發還土地，未於期間內繳清者不發還，且不得再依<span class=\"art\">第9條</span>申請收回（<span class=\"art\">第51條</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（四）丙、丁主張無理由</p><p>依<span class=\"art\">第52條</span>，「撤銷或廢止徵收後，徵收前原設定之<mark class=\"hl\">他項權利及耕地租約不予回復</mark>。」但書僅限於依<span class=\"art\">第42條</span>於抵價地設定之抵押權或典權。本題為一般徵收、發給補償費，不適用但書，<mark class=\"hl\">丙之抵押權、丁之耕地租約均不回復</mark>。又依<span class=\"art\">第51條第5項</span>，甲應繳回之徵收補償地價包括丙、丁原應受領之價金，可見其權益已於徵收時以金錢處理。</p></div>", "<span class=\"blk-l\">四、結論</span><p>A地因作業錯誤誤列，<mark class=\"hl\">應撤銷徵收</mark>；B地因工程變更設計，<mark class=\"hl\">應廢止徵收</mark>。撤銷使徵收處分<mark class=\"hl\">原則溯及既往失效</mark>，廢止則<mark class=\"hl\">自廢止時起向將來失效</mark>，但兩者發還程序相同，甲繳清應繳價額後始發還土地。丙、丁主張抵押權及耕地租約一併回復，依土地徵收條例第52條<mark class=\"hl\">無理由</mark>。</p>", "<span class=\"blk-l\">一、定義</span><p><p>撤銷徵收＝原徵收處分有瑕疵（自始違法），事後消滅其效力；廢止徵收＝原處分合法，因事後情事變更等原因向將來失效（土徵§49）。</p></p>", "<span class=\"blk-l\">二、法條</span><p><p>①土徵§49Ⅰ（應撤銷）：①因作業錯誤，致原徵收土地不在工程用地範圍內；②公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發（但以聯合開發方式開發而土地所有權人不願參與者，不在此限）。</p><p>②土徵§49Ⅱ（應廢止）：①因工程變更設計，致不在工程用地範圍內；②依計畫開始使用前，興辦事業改變、事業計畫經註銷、開發方式或取得方式改變；③已開始使用未完成，因情事變更，致全部或一部已無徵收必要。</p><p>③土徵§50：由需用土地人向中央主管機關申請；需用土地人未申請者，原所有權人得請求直轄市、縣（市）主管機關會同審查後處理；不服函復者，於送達30日內向中央主管機關請求。</p><p>④土徵§51：中央核准後通知地方主管機關，應公告30日並通知原所有權人於一定期間（不得少於六個月）內繳清應繳價額（徵收補償地價＋地價加成補償＋遷移費；已依§34Ⅰ遷移者免遷移費）才發還土地；未繳清不發還，且不得再依§9申請收回。</p><p>⑤土徵§52：撤銷或廢止後，徵收前原設定之他項權利及耕地租約「不予回復」（例外：依§42於抵價地設定之抵押權或典權准予回復）。</p><p>⑥行政程序法§118：違法處分經撤銷後溯及既往失效；§125：合法處分經廢止後向將來失效。</p></p>", "<span class=\"blk-l\">三、涵攝分析</span><p><p>（一）判斷：A地因作業錯誤誤列＝§49Ⅰ①撤銷；B地因工程變更設計不在範圍＝§49Ⅱ①廢止。</p><p>（二）程序：需用土地人向中央主管機關申請（§50）→中央核准後地方公告30日、通知甲於不少於6個月內繳清補償地價、地價加成補償及遷移費（§51）→發還土地；未繳清不發還，也不得再依§9申請收回。</p><p>（三）效力：撤銷溯及既往（行政程序法§118）；廢止向將來失效（§125）。</p><p>（四）丙、丁主張：依§52，撤銷或廢止後原設定的抵押權、耕地租約不予回復；本案A、B均非§42抵價地，無例外，主張無理由。</p></p>", "<span class=\"blk-l\">四、結論</span><p><p>A撤銷、B廢止，均依§50、§51程序繳還應繳價額後發還；丙之抵押權、丁之耕地租約依§52不回復。</p></p>"], "ck": [{"x": "§49Ⅰ① 作業錯誤→撤銷（A地）", "h": false}, {"x": "§49Ⅱ① 工程變更設計→廢止（B地），不是撤銷", "h": true}, {"x": "§51 公告30日、不少於6個月繳清補償地價＋加成＋遷移費，未繳清不發還", "h": false}, {"x": "效力差異要寫：撤銷原則溯及既往（行程§118）、廢止向將來（行程§125）", "h": true}, {"x": "§52 他項權利及耕地租約不予回復；例外僅§42抵價地上之抵押權、典權", "h": false}, {"x": "不分撤銷或廢止都不回復：丙、丁主張無理由", "h": true}, {"x": "§51Ⅴ 甲繳回之補償地價含丙、丁原應受領價金", "h": false}], "mn": "錯了撤、變了廢；撤往回、廢往後；權利租約都不回", "hp": 1, "hpl": "高"}, {"id": "pr-36", "no": "預P36", "t": "土地徵收程序：公聽會、協議價購、核准、公告30日到補償發給", "lv": "高", "k": "pred", "tier": 0, "g": "土地徵收・區段徵收", "q": "依土地徵收條例規定，需用土地人申請徵收私有土地，自事業計畫許可至取得土地，應踐行哪些程序？徵收核准後之公告有何效力？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地徵收是國家為公益需要，<mark class=\"hl\">依法強制取得私有土地並給予補償</mark>之行政行為。因對財產權限制最重，土地徵收條例設一連串正當程序，確保公益性、必要性及受補償之權利。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第10條、第11條、第13條、第18條、第20條、第21條、第23條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公聽會</p><p>依<span class=\"art\">第10條第2項</span>，需用土地人於事業計畫報請許可前，<mark class=\"hl\">應舉行公聽會</mark>，聽取土地所有權人及利害關係人意見；但機密性國防事業或已舉行公聽會、說明會者，不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（二）協議價購</p><p>依<span class=\"art\">第11條第1項</span>，申請徵收前，除國防、交通或水利事業因公共安全急需者外，<mark class=\"hl\">應先與所有權人協議價購</mark>或以其他方式取得；拒絕參與或未能達成協議，始得申請徵收。<mark class=\"hl\">協議價購應依市價</mark>（第4項）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>徵收是最後手段。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）核准</p><p>依<span class=\"art\">第13條</span>，需用土地人應擬具詳細徵收計畫書，<mark class=\"hl\">送核准徵收機關核准</mark>；中央主管機關審查<mark class=\"hl\">公益性、必要性</mark>、是否適當合理、需用土地人有無執行能力、是否符合都市計畫、區域計畫或國土計畫。</p></div><div class=\"evp\"><p class=\"evh\">（四）公告</p><p>依<span class=\"art\">第18條</span>，直轄市或縣（市）主管機關接到核准通知，<mark class=\"hl\">應即公告並書面通知</mark>所有權人及他項權利人，<mark class=\"hl\">公告期間30日</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）公告之效力</p><p>依<span class=\"art\">第23條第1項</span>，自公告日起，除公告前因繼承、強制執行或法院判決取得權利並於公告期間內申請登記者外，<mark class=\"hl\">不得分割、合併、移轉或設定負擔</mark>；並不得新建、增建、改建、採取土石、變更地形或增加種植，已在工作中者<mark class=\"hl\">應即停止</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（六）補償發給</p><p>依<span class=\"art\">第20條</span>，補償費應於<mark class=\"hl\">公告期滿後15日內發給</mark>；未發給完竣者，<mark class=\"hl\">該部分徵收失其效力</mark>，但有提交地價評議委員會復議、書面同意延期或分期、拒絕受領或不能受領等情形者，不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（七）權利終止</p><p>依<span class=\"art\">第21條</span>，所有權人之權利義務<mark class=\"hl\">於應受之補償費發給完竣時終止</mark>；未發給完竣前<mark class=\"hl\">得繼續為從來之使用</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>程序為：<mark class=\"hl\">公聽會→依市價協議價購→徵收計畫書送審核准→公告30日並書面通知</mark>→自公告日起凍結處分與現狀→公告期滿<mark class=\"hl\">15日內發給補償</mark>，逾期未完竣者失效→發給完竣時權利義務終止，落實<mark class=\"hl\">「先補償、後取得」</mark>。</p>"], "ck": [{"x": "§18 核准後應即公告並書面通知，公告30日", "h": true}, {"x": "§23 自公告日起不得分割、合併、移轉、設定負擔", "h": true}, {"x": "§20 期滿15日內發給，未完竣失效；§21 完竣時終止", "h": true}], "mn": "公聽→協議→核准→公告30→凍結→15日發→完竣終止"}, {"id": "pr-11", "no": "預P11", "t": "徵用 vs 徵收：臨時性公共建設使用私地、逾3年的處理", "lv": "中", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "政府為興辦臨時性公共建設而使用私有土地（徵用），與依土地徵收條例徵收土地有何不同？徵用期間逾三年時，所有權人得主張什麼權利？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地徵收，是國家為公益需要，依法<mark class=\"hl\">強制取得人民土地所有權</mark>，並給予補償的行政處分；徵用則是為興辦臨時性公共建設，<mark class=\"hl\">在一定期間內強制使用私有土地，不移轉所有權</mark>。兩者區別在限制的深度與期間。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第3條、第21條、第30條、第58條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）取得權利不同</p><p>依<span class=\"art\">土地徵收條例第21條第1項</span>，被徵收土地之所有權人，其權利義務<mark class=\"hl\">於補償費發給完竣時終止</mark>；依<span class=\"art\">第58條第1項</span>，「國家因興辦臨時性之公共建設工程，得徵用私有土地或土地改良物」，<mark class=\"hl\">所有權不移轉</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>興建捷運站體徵收甲地，所有權歸政府；施工期間設置材料堆置場徵用乙地，所有權仍屬乙。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>符合最小侵害原則。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）適用事業不同</p><p>徵用<mark class=\"hl\">以興辦臨時性之公共建設工程為限</mark>；依<span class=\"art\">第3條</span>，國家因公益需要興辦國防、交通、公用、水利等事業，得徵收私有土地。</p><p class=\"evx\"><span class=\"evt\">例</span><span>施工便道、材料堆置場適用徵用，道路本體應辦理徵收。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>侵害程度須與需求之久暫相當。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）補償不同</p><p>依<span class=\"art\">第30條第1項</span>，徵收<mark class=\"hl\">按徵收當期之市價補償地價</mark>；依<span class=\"art\">第58條第5項</span>，徵用每年補償費，土地依徵用公告期滿第十五日之<mark class=\"hl\">公告土地現值10%計算</mark>，不足1年者按月計算。</p><p class=\"evx\"><span class=\"evt\">例</span><span>公告土地現值1,000萬元，徵用1年6個月，使用補償費共150萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>徵用未取得所有權，只須補償使用之損失。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）程序準用徵收</p><p>依<span class=\"art\">第58條第4項</span>，<mark class=\"hl\">徵收程序於徵用時準用之</mark>；情況緊急者得經中央主管機關核准<mark class=\"hl\">先行使用</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>颱風沖毀道路，須立即徵用鄰地搭設便道。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>徵用同屬強制侵害財產權。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）逾3年得請求徵收</p><p>依<span class=\"art\">第58條第2項</span>，<mark class=\"hl\">徵用期間逾3年</mark>，或二次以上合計逾3年者，需用土地人應於申請徵用前以書面通知，所有權人於收到通知書之日起<mark class=\"hl\">30日內，得請求徵收所有權</mark>，「<mark class=\"hl\">需用土地人不得拒絕</mark>」；依第3項，依此請求徵收者不得再依<span class=\"art\">第9條</span>申請收回。</p><p class=\"evx\"><span class=\"evt\">例</span><span>政府擬徵用丙地4年，丙可於30日內請求改為徵收。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>長期占用已近於剝奪所有權。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">徵收是買斷所有權，徵用是暫時借用</mark>；<mark class=\"hl\">徵用逾3年，所有權人可請求改為徵收</mark>。經紀人說明書遇徵用中之土地，應載明徵用期間與使用補償。</p>"], "ck": [{"x": "徵收於補償費發給完竣時權利義務終止（§21）；徵用只取得使用權，所有權不移轉", "h": true}, {"x": "徵用限臨時性公共建設（便道、堆置場）；長期永久使用依§3徵收", "h": false}, {"x": "徵收按市價（§30）；徵用每年公告現值10%，不足1年按月、不足一月按日（§58Ⅴ）", "h": false}, {"x": "§58Ⅳ 徵用準用第二章程序；情況緊急經中央核准先行使用", "h": false}, {"x": "§58Ⅱ 逾3年或二次以上合計逾3年，申請前書面通知（不是6年）", "h": true}, {"x": "收到通知30日內得請求徵收，需用土地人「不得拒絕」", "h": true}, {"x": "請求徵收後不得再依§9申請收回", "h": false}], "mn": "徵收買斷、徵用借用 → 臨時性才徵用 → 市價 vs 每年10% → 逾3年、書面通知、30日、不得拒絕", "hp": 7, "hpl": "高"}, {"id": "pr-12", "no": "預P12", "t": "徵收補償標準：一般土地、公共設施保留地、市價如何決定", "lv": "中", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "依土地徵收條例，被徵收之土地應按什麼標準補償地價？一般土地與都市計畫公共設施保留地有何不同？該標準如何評定？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>被徵收之土地，應<mark class=\"hl\">按照徵收當期之市價補償其地價</mark>；都市計畫區內之公共設施保留地，<mark class=\"hl\">按毗鄰非公共設施保留地之平均市價補償</mark>（土地徵收條例第30條第1項），<mark class=\"hl\">市價由地價評議委員會評定</mark>（同條第2項）。補償地價是補償費中最核心的部分，標準是否合理，直接影響財產權保障與徵收爭議。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第30條、第31條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）一般土地按徵收當期之市價補償</p><p>依<span class=\"art\">土地徵收條例第30條第1項</span>前段，「被徵收之土地，<mark class=\"hl\">應按照徵收當期之市價補償其地價</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣政府徵收甲之農地開闢道路，即以徵收當期該地之市價補償甲。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>補償應足以填補受徵收人之特別犧牲，市價較能反映其實際損失。舊答案「按公告土地現值補償，必要時加成」屬修法前標準，已非現行規定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）公共設施保留地按毗鄰非保留地之平均市價補償</p><p>依<span class=\"art\">第30條第1項</span>後段，「在都市計畫區內之公共設施保留地，<mark class=\"hl\">應按毗鄰非公共設施保留地之平均市價補償其地價</mark>」，<mark class=\"hl\">不以保留地本身之市價為準</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙之土地被指定為公園保留地，毗鄰為住宅區及商業區，即以該毗鄰住宅區、商業區土地之平均市價補償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>保留地因使用受限，本身市價偏低，若以其本身市價補償，所有權人將因被劃為保留地而再受損失。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）市價由地價評議委員會評定</p><p>依<span class=\"art\">第30條第2項</span>，市價由直轄市、縣（市）主管機關<mark class=\"hl\">提交地價評議委員會評定之</mark>；依第3項，主管機關應經常調查轄區地價動態，<mark class=\"hl\">每六個月</mark>提交地價評議委員會評定被徵收土地市價變動幅度，作為調整徵收補償地價之依據。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某市上半年地價明顯上漲，即應提交評定變動幅度，據以調整補償地價。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>由合議機關評定並定期調整，使補償能反映市場變動。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）地上物補償</p><p>依<span class=\"art\">第31條第1項</span>，建築改良物之補償費，<mark class=\"hl\">按徵收當時該建築改良物之重建價格估定</mark>；依第2項，農作改良物與其孳息成熟時期相距在1年以內者，<mark class=\"hl\">按成熟時之孳息估定</mark>，逾1年者，<mark class=\"hl\">按其種植及培育費用</mark>，並參酌現值估定。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲地上之果樹再3個月即可收成，按成熟時之孳息補償。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>使土地以外之改良物損失亦獲合理填補。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>徵收補償地價以市價為準：一般土地<mark class=\"hl\">按徵收當期市價</mark>，公共設施保留地<mark class=\"hl\">按毗鄰非保留地之平均市價</mark>，<mark class=\"hl\">市價由地價評議委員會評定</mark>，地上物另依<mark class=\"hl\">重建價格或孳息補償</mark>。補償以市價為準，使被徵收人不因公益而受損，落實公平補償與財產權保障。</p>"], "ck": [{"x": "土徵§30Ⅰ前段：一般土地按徵收當期之市價補償", "h": false}, {"x": "不可再寫公告土地現值加成（舊答案100-13，修法前標準）", "h": true}, {"x": "§30Ⅰ後段：公保地按毗鄰非公共設施保留地之平均市價", "h": false}, {"x": "公保地與一般土地標準要分開寫；不是「毗鄰保留地」、也不是公告現值", "h": true}, {"x": "市價由地價評議委員會評定，每6個月評定市價變動幅度", "h": false}, {"x": "§31：建物按重建價格；農作物1年內按孳息、逾1年按培育費參酌現值", "h": true}, {"x": "補償以市價為準：一般地當期市價、公保地毗鄰非保留地平均市價，皆由地價評議委員會評定", "h": false}], "mn": "一般看本身市價 → 公保地看毗鄰非保留地平均 → 地評會評定、每6個月調 → 地上物另依§31", "hp": 6, "hpl": "高"}, {"id": "pr-49", "no": "預P49", "t": "土地徵收之異議、復議與行政救濟：公告事項 vs 補償價額、地價評議委員會復議、不停止執行、差額3個月內發給（土徵§18、§20、§22）", "lv": "中", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "土地所有權人對於徵收公告事項或徵收補償價額不服時，依土地徵收條例應如何救濟？提出異議或救濟後，徵收計畫之執行是否停止？補償價額事後變動時如何處理？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地徵收之救濟，分為<mark class=\"hl\">對公告事項之異議與對補償價額之異議兩條路線</mark>；補償價額爭議經主管機關查處後，得提請地價評議委員會復議，不服復議結果再提起行政救濟；補償費發給完竣後，徵收計畫之執行<mark class=\"hl\">不因異議或救濟而停止</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第18條、第20條、第22條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）公告</p><p>依<span class=\"art\">第18條</span>，主管機關接到核准通知應即公告，並書面通知所有權人及他項權利人，<mark class=\"hl\">公告期間為30日</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）公告事項之異議</p><p>依<span class=\"art\">第22條第1項</span>，對公告事項有異議者，「<mark class=\"hl\">得於公告期間內</mark>向該管直轄市或縣（市）主管機關<mark class=\"hl\">以書面提出</mark>」，主管機關應即查明處理並書面通知。</p><p class=\"evx\"><span class=\"evt\">例</span><span>徵收範圍之地號、面積登載錯誤，應於公告期間內提出。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）補償價額之異議</p><p>依<span class=\"art\">第22條第2項</span>，對徵收補償價額有異議者，「<mark class=\"hl\">得於公告期間屆滿之次日起三十日內</mark>以書面向該管直轄市或縣（市）主管機關提出異議」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲認為補償市價偏低，應於公告期滿次日起30日內書面異議。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）復議與救濟</p><p>依<span class=\"art\">第22條第3項</span>，不服查處者，主管機關得<mark class=\"hl\">提請地價評議委員會復議</mark>，不服復議結果者，<mark class=\"hl\">得依法提起行政救濟</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>補償市價本由地價評議委員會評定，由同一專業機關先行復議。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）不停止執行與不失效</p><p>依<span class=\"art\">第22條第4項</span>，補償費發給完竣後，徵收計畫之執行<mark class=\"hl\">不因異議或行政救濟而停止</mark>；依<span class=\"art\">第20條第2項第1款</span>，因對補償之估定有異議而提交地價評議委員會復議者，<mark class=\"hl\">未於15日內發給完竣亦不失效</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（六）差額發給</p><p>依<span class=\"art\">第22條第5項</span>，補償價額經復議、行政救濟結果有變動或原認定錯誤者，差額應於其<mark class=\"hl\">結果確定之日起3個月內發給</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">公告事項之異議於公告期間內提出</mark>，<mark class=\"hl\">補償價額之異議於期滿次日起30日內提出</mark>，經查處、地價評議委員會復議後再行政救濟；<mark class=\"hl\">補償發給完竣後不停止執行</mark>，復議中不失效，<mark class=\"hl\">差額確定後3個月內發給</mark>。</p>"], "ck": [{"x": "§22Ⅰ・Ⅱ 兩種異議期間", "h": true}, {"x": "§22Ⅲ 地評會復議→行政救濟", "h": true}, {"x": "§22Ⅳ 不停止執行；§22Ⅴ 3個月", "h": true}], "mn": "〔自編〕公告事項期內說、補償價額期滿後30日說；查處→復議→救濟；錢發完照樣施工、差額3個月補"}, {"id": "pr-50", "no": "預P50", "t": "一併徵收：土地改良物之一併徵收與例外（土徵§5、§6）vs 殘餘部分之申請一併徵收（§8）", "lv": "中", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "依土地徵收條例，徵收土地時其地上改良物應如何處理？有何例外？徵收土地或建築改良物之殘餘部分不能為相當使用時，所有權人如何救濟？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>一併徵收有兩種：一是徵收土地時，地上之土地改良物<mark class=\"hl\">原則上隨同徵收</mark>（第5條）；二是徵收後殘餘之土地或建築改良物不能為相當使用時，<mark class=\"hl\">所有權人得申請一併徵收</mark>（第8條），以免剩餘部分無法利用而受損，保障其財產權。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第5條、第6條、第8條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原則</p><p>依<span class=\"art\">第5條第1項</span>本文，「徵收土地時，<mark class=\"hl\">其土地改良物應一併徵收</mark>。」</p><p class=\"evx\"><span class=\"evt\">理由</span><span>土地與改良物通常無法分離使用，一併徵收方能使事業順利進行並使所有權人獲得補償。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）例外</p><p>依同項但書，所有權人要求取回並「<mark class=\"hl\">自公告期滿之日起十五日內自行遷移</mark>」、「<mark class=\"hl\">墳墓及其他紀念物必須遷移</mark>」、建築改良物依法令規定不得建造、農作改良物與正常種植不相當之部分、其他法律另有規定者，不在此限。</p><p class=\"evx\"><span class=\"evt\">例</span><span>徵收範圍內之祖墳，應遷移而非一併徵收。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）徵收時點</p><p>依<span class=\"art\">第5條第2項</span>，得視興辦事業計畫之需要，<mark class=\"hl\">於土地徵收公告之日起3年內徵收</mark>；所有權人於報請徵收土地前請求同時一併徵收者，<mark class=\"hl\">應同時辦理</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）違建與搶種</p><p>依<span class=\"art\">第5條第3項</span>，依法令不得建造之建築改良物及不相當之農作改良物，公告期滿後通知限期遷移或拆除，「<mark class=\"hl\">不予補償</mark>」，屆期不拆遷者<mark class=\"hl\">逕行除去</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止以違法或投機方式套取補償。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）公有土地上之私有改良物</p><p>依<span class=\"art\">第6條</span>，需用土地人取得撥用或提供開發之公有土地，其上私有土地改良物<mark class=\"hl\">得準用前條徵收</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（六）殘餘部分</p><p>依<span class=\"art\">第8條</span>，徵收土地之殘餘部分<mark class=\"hl\">面積過小或形勢不整</mark>，或建築改良物殘餘部分不能為相當之使用者，所有權人得於<mark class=\"hl\">徵收公告之日起1年內申請一併徵收</mark>，逾期不予受理；應以書面為之，補償費發給完竣前得書面撤回，並<mark class=\"hl\">以現金補償</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>剩三角形畸零地無法建築，得於1年內申請。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">改良物原則一併徵收</mark>，例外為取回遷移、墳墓、違建、搶種及他法另有規定，<mark class=\"hl\">違建搶種不予補償</mark>；殘餘部分不能為相當使用者，得於<mark class=\"hl\">徵收公告之日起1年內書面申請一併徵收</mark>，以現金補償，使徵收不留下無法利用之殘餘財產。</p>"], "ck": [{"x": "§5 五款例外", "h": true}, {"x": "§8 1年內書面申請", "h": true}, {"x": "§5Ⅲ 不補償；§8Ⅲ 現金", "h": true}], "mn": "〔自編〕地上物跟著徵：取回、墳墓、違建、搶種、他法例外；剩地1年內書面申請、拿現金"}, {"id": "x-1", "no": "專1", "t": "撤銷徵收與廢止徵收的意義、事由與區別", "lv": "", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "試說明土地徵收條例上「撤銷徵收」與「廢止徵收」之意義與法定事由，並說明二者之區別及申請程序。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>撤銷徵收與廢止徵收，都是讓已公告的徵收案事後失去效力的制度。<mark class=\"hl\">撤銷＝徵收本身有錯誤</mark>，問題出在徵收當時；<mark class=\"hl\">廢止＝徵收原本沒錯，但事後情事變更</mark>，已無徵收必要。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第49條、第50條、第51條、第52條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）撤銷事由二款</p><p>依<span class=\"art\">土地徵收條例第49條第1項</span>，「<mark class=\"hl\">因作業錯誤，致原徵收之土地不在工程用地範圍內</mark>」，或公告徵收時都市計畫已規定以聯合開發、市地重劃或其他方式開發者，<mark class=\"hl\">應撤銷徵收</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>測量作業錯誤將甲地一併徵收，應撤銷。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>該土地自始不應被徵收。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）廢止事由三款</p><p>依<span class=\"art\">第49條第2項</span>，<mark class=\"hl\">因工程變更設計致不在工程用地範圍內</mark>；開始使用前事業改變、計畫註銷、開發或取得方式改變；已開始使用尚未完成使用，因情事變更已無必要者，<mark class=\"hl\">應廢止徵收</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>道路改線致乙地不在範圍內，應廢止。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>必要性嗣後才喪失。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）時點性質不同</p><p>撤銷針對徵收時已存在之錯誤，廢止針對徵收後之變更；<mark class=\"hl\">作業錯誤者撤銷，工程變更設計者廢止</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>沿用行政處分自始有瑕疵者撤銷、嗣後情事變更者廢止之學理。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）與開始使用之關係</p><p><mark class=\"hl\">撤銷不問是否已開始使用</mark>；廢止第2款<mark class=\"hl\">限開始使用前</mark>，第3款<mark class=\"hl\">限已開始使用尚未完成使用</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>尚未動工即註銷計畫屬第2款。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>廢止係以執行進度判斷必要性是否喪失。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）申請程序相同</p><p>依<span class=\"art\">第50條第1項</span>，「撤銷或廢止徵收，<mark class=\"hl\">由需用土地人向中央主管機關申請之</mark>」；未申請者，原土地所有權人得向直轄市或縣（市）主管機關請求，不服處理結果<mark class=\"hl\">得於30日內向中央主管機關請求</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免需用土地人怠於申請。</span></p></div><div class=\"evp\"><p class=\"evh\">（六）發還相同，失效時點不同</p><p>依<span class=\"art\">第51條</span><mark class=\"hl\">繳清價額後發還</mark>，依<span class=\"art\">第52條</span><mark class=\"hl\">他項權利及耕地租約不予回復</mark>；撤銷依行政程序法<span class=\"art\">第118條</span><mark class=\"hl\">溯及失效</mark>，廢止依<span class=\"art\">第125條</span><mark class=\"hl\">自廢止時起失效</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>撤銷與廢止之程序與權利回復相同，區別在事由、性質與失效時點：<mark class=\"hl\">錯誤者撤銷、事後變更者廢止</mark>。<mark class=\"hl\">工程變更設計屬廢止而非撤銷</mark>。</p>"], "ck": [{"x": "§49Ⅰ 撤銷2款：作業錯誤；公告時都計已規定其他開發方式", "h": false}, {"x": "§49Ⅱ 廢止3款：工程變更設計；使用前事業改變或註銷；已使用未完成而情事變更", "h": false}, {"x": "工程變更設計是廢止，不是撤銷（103-7、106-23、108-17）", "h": true}, {"x": "區別在事由與性質：錯誤→撤銷、變更→廢止；程序並無不同", "h": true}, {"x": "§50 需用土地人向中央申請；原所有權人得請求，不服30日內向中央請求", "h": false}, {"x": "§51 公告30日、繳清期間≥6個月；殘餘地一併辦理（§49Ⅲ）", "h": false}, {"x": "§52 他項權利及耕地租約不予回復，例外§42 抵價地上之抵押權、典權", "h": true}], "mn": "錯誤撤（Ⅰ兩款）、變更廢（Ⅱ三款）→ 變更設計是廢止 → 程序同：§50 申請・§51 繳清發還・§52 不回復", "hp": 2, "hpl": "高"}, {"id": "x-2", "no": "專2", "t": "A 撤銷、B 撤銷、C 廢止還是收回？", "lv": "", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "需用土地人甲縣政府為開闢道路，公告徵收乙之A地、丙之B地、丁之C地。其後發現：（1）A地因測量作業錯誤，實際不在道路工程用地範圍內；（2）B地於公告徵收時，其所在都市計畫已規定以市地重劃方式開發；（3）C地補償費發給完竣已逾三年，因道路計畫經註銷而始終未開始使用，丁於徵收公告後第八年欲取回C地。請問：（一）A、B、C地各應如何處理？（二）丁取回C地可循哪兩種途徑？二者有何不同？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>撤銷徵收、廢止徵收與收回權都可能讓原所有權人取回土地，但<mark class=\"hl\">發動原因、申請人、受理機關各不相同</mark>。本題即在考這三者的辨別。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第49條、第50條、第51條、第9條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A地應撤銷徵收</p><p>依<span class=\"art\">土地徵收條例第49條第1項第1款</span>，「因作業錯誤，致原徵收之土地不在工程用地範圍內」者，<mark class=\"hl\">應辦理撤銷徵收</mark>。A地因測量作業錯誤，實際不在道路工程用地範圍內，符合本款。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不在用地範圍之土地，自始欠缺徵收之必要性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）B地應撤銷徵收</p><p>依<span class=\"art\">第49條第1項第2款</span>，公告徵收時都市計畫已規定以市地重劃等方式開發者，<mark class=\"hl\">應撤銷</mark>；但書只適用於聯合開發，<mark class=\"hl\">市地重劃無此例外</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>既已有侵害較小之開發方式，即不應以徵收強制取得所有權。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）C地屬廢止事由，並符合收回權要件</p><p>依<span class=\"art\">第49條第2項第2款</span>，<mark class=\"hl\">開始使用前計畫經註銷者應廢止</mark>；依<span class=\"art\">第9條第1項第1款</span>，「徵收補償費發給完竣屆滿三年，未依徵收計畫開始使用者」，<mark class=\"hl\">得於20年內申請收回</mark>，丁於第八年主張符合期限。惟依<span class=\"art\">第9條第3項</span>不可歸責於需用土地人者不得收回，<mark class=\"hl\">宜以廢止為主要主張</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>廢止有明文依據。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）發動人不同</p><p>依<span class=\"art\">第50條第1項</span>，<mark class=\"hl\">廢止由需用土地人向中央主管機關申請</mark>，未申請者丁得向地方主管機關請求；<mark class=\"hl\">收回權則由丁自行向地方主管機關申請</mark>，經查明後報原核准徵收機關核准。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>撤銷、廢止是機關自行矯正，收回權則屬原所有權人之權利。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）期限不同</p><p><mark class=\"hl\">廢止未設20年期限</mark>；<mark class=\"hl\">收回須於徵收公告之日起20年內申請</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>安定法律關係。</span></p></div><div class=\"evp\"><p class=\"evh\">（六）繳還不同</p><p>依<span class=\"art\">第51條</span>，廢止核准後<mark class=\"hl\">公告30日</mark>，於<mark class=\"hl\">不少於6個月</mark>期間繳清補償地價、加成補償及遷移費，未繳清者並不得依<span class=\"art\">第9條</span>申請收回；依<span class=\"art\">第9條第2項</span>，<mark class=\"hl\">收回應於6個月內繳還</mark>，<mark class=\"hl\">逾期視為放棄收回權</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">A、B地應撤銷，C地屬廢止事由</mark>；<mark class=\"hl\">丁得請求廢止徵收</mark>；收回權部分，如經認定係不可歸責於需用土地人之事由，依第9條第3項<mark class=\"hl\">不得收回</mark>。兩者發動人、期限與繳價期間皆不同。</p>"], "ck": [{"x": "A地測量作業錯誤不在工程用地範圍→撤銷（§49Ⅰ①）", "h": false}, {"x": "B地公告時都計已定市地重劃→撤銷；但書只限聯合開發，不可套用", "h": true}, {"x": "C地開始使用前計畫註銷→廢止（§49Ⅱ②）", "h": false}, {"x": "C地另符合收回權：發給完竣逾3年未使用、20年內（§9Ⅰ①）；§9Ⅲ 不可歸責者不得收回", "h": false}, {"x": "廢止由需用土地人向中央申請（不申請時丁向地方請求）；收回由丁自己向地方申請", "h": true}, {"x": "收回限徵收公告20年內；廢止無20年限制", "h": false}, {"x": "廢止：公告30日、不少於6個月繳清；收回：核准後6個月繳還，逾期視為放棄", "h": false}, {"x": "走廢止逾期未繳清，連§9收回權也一併喪失（§51Ⅱ）", "h": true}], "mn": "錯誤撤（A、B）、變更廢（C）→ C另可收回 → 比：誰申請、向誰、期限、繳還", "hp": 3, "hpl": "高"}, {"id": "x-3", "no": "專3", "t": "不申請怎麼辦？核准後如何發還？他項權利回復嗎？", "lv": "", "k": "pred", "tier": 1, "g": "土地徵收・區段徵收", "q": "已公告徵收之土地，需用土地人未申請撤銷或廢止徵收時，原土地所有權人得如何請求？中央主管機關核准撤銷或廢止徵收後，土地如何發還？原所有權人應繳還何種價額、期間多長、逾期有何效果？撤銷或廢止徵收後，徵收前原設定之他項權利及耕地租約是否回復？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>撤銷或廢止徵收的後半段是程序與權利回復：原所有權人如何促使政府啟動、核准後如何取回土地，以及<mark class=\"hl\">原他項權利與租約之處理</mark>。這是在保障財產權，同時避免國家已付的補償被白拿。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第50條、第51條、第52條、第42條、第9條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原所有權人之請求</p><p>依<span class=\"art\">土地徵收條例第50條第1項</span>，撤銷或廢止徵收<mark class=\"hl\">原則由需用土地人向中央主管機關申請</mark>；依第2項，需用土地人未申請者，「<mark class=\"hl\">原土地所有權人得向該管直轄市或縣（市）主管機關請求之</mark>」；主管機關應會同需用土地人及其他有關機關審查，合於規定者由需用土地人申請（第3項）；不服處理結果者，應於<mark class=\"hl\">函復送達之日起30日內</mark>向中央主管機關請求，仍不服依法提起行政救濟（第4項）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲地因工程變更設計不在範圍內，需用土地人不申請，甲得向縣政府請求。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免需用土地人怠於申請。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）發還程序</p><p>依<span class=\"art\">第51條第1項</span>，中央主管機關核准後應通知直轄市或縣（市）主管機關；依第2項，地方主管機關「<mark class=\"hl\">應公告三十日</mark>，並通知原土地所有權人於一定期間<mark class=\"hl\">繳清應繳納之價額，發還其原有土地</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲繳清後即發還。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以公告使利害關係人知悉，並以繳清價額作為發還之條件。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）繳還價額與期間</p><p>依<span class=\"art\">第51條第4項</span>，應繳徵收補償地價、地價加成補償及遷移費，人口或物件已遷移者<mark class=\"hl\">無須繳納遷移費</mark>；補償地價包括他項權利人或耕地承租人原應受領之價金（第5項）；第3項期間<mark class=\"hl\">不得少於6個月</mark>；<mark class=\"hl\">逾期未繳清者不發還</mark>，並不得依<span class=\"art\">第9條</span>申請收回。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>原所有權人既取回土地，即應返還國家已支付之補償，避免重複得利。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）他項權利不回復</p><p>依<span class=\"art\">第52條</span>，「撤銷或廢止徵收後，徵收前原設定之<mark class=\"hl\">他項權利及耕地租約不予回復</mark>」，但依<span class=\"art\">第42條</span>於抵價地設定抵押權或典權者<mark class=\"hl\">准予回復</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲地原設乙之抵押權，發還時不予回復。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>其價金已計入補償地價。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>流程為請求、審查、<mark class=\"hl\">不服30日內向中央請求</mark>、核准、<mark class=\"hl\">公告30日</mark>、繳價、發還；<mark class=\"hl\">逾期不繳則土地不還、收回權亦喪失</mark>。<mark class=\"hl\">他項權利原則不回復</mark>，依第42條移載者例外回復。</p>"], "ck": [{"x": "§50Ⅱ：需用土地人未申請，原所有權人向直轄市、縣（市）主管機關請求", "h": false}, {"x": "不服地方函復，30日內向中央請求，仍不服提行政救濟（§50Ⅳ）", "h": false}, {"x": "中央核准 → 地方公告30日、通知繳價 → 繳清發還（§51）", "h": false}, {"x": "應繳補償地價、地價加成補償、遷移費（已遷移者免繳遷移費）", "h": false}, {"x": "繳價期間不少於6個月，不是3個月", "h": true}, {"x": "逾期未繳清不發還，且不得再依§9申請收回", "h": true}, {"x": "§52 他項權利及耕地租約原則「不予回復」，不是「得予回復」", "h": true}, {"x": "例外：依§42於抵價地設定之抵押權、典權准予回復", "h": false}], "mn": "請求（§50）→ 審查 → 不服30日 → 核准 → 公告30日 → 繳價≥6個月 → 發還；權利原則不回復（§42例外）", "hp": 4, "hpl": "高"}, {"id": "q-113-一", "no": "113-一", "t": "公辦市地重劃公告通知＋異議處理", "lv": "B", "k": "off", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "請依平均地權條例規定，試述公辦市地重劃之實施過程中，主管機關應盡公告通知之事項為何？所有權人表達異議之時機與方式？以及主管機關對異議如何處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>市地重劃攸關土地所有權人之重大財產權益，故平均地權條例就重劃各階段設有<mark class=\"hl\">公告通知與異議救濟程序</mark>，使所有權人得於重劃確定前表達意見，兼顧行政效率與程序正義。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第56條（重劃計畫書核定公告滿三十日後實施；私有土地所有權人半數以上且面積超過半數反對之調處）、第59條（禁止或限制事項，期間不得超過一年六個月）、第60條之2（分配結果公告三十日、書面異議與調處、裁決）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應公告通知之事項有三</p><p>①重劃計畫書：依<span class=\"art\">第56條第2項</span>，主管機關擬具市地重劃計畫書，送經上級主管機關<mark class=\"hl\">核定公告滿30日後實施</mark>；依市地重劃實施辦法第16條第1項，計畫書核定後應即公告、通知土地所有權人並<mark class=\"hl\">舉行說明會</mark>；禁止或限制事項並應以書面通知所有權人或使用人（同辦法第12條第2項）。②禁止或限制事項：依<span class=\"art\">第59條</span>，重劃地區選定後，得報經上級主管機關核定後，公告禁止或限制土地移轉、分割或設定負擔，及建築改良物之新建、增建、改建或重建及採取土石或變更地形，<mark class=\"hl\">期間不得超過1年6個月</mark>。③分配結果：依<span class=\"art\">第60條之2第1項</span>，分配完畢後應將<mark class=\"hl\">分配結果公告30日</mark>，並通知土地所有權人。</p></div><div class=\"evp\"><p class=\"evh\">（二）異議時機均為公告期間內，方式依階段不同</p><p>依<span class=\"art\">第56條第3項</span>，重劃計畫書公告期間內，重劃地區私有土地所有權人<mark class=\"hl\">得表示反對</mark>；依<span class=\"art\">第60條之2第2項</span>，對分配結果得於公告期間內向主管機關<mark class=\"hl\">以書面提出異議</mark>，未提出者分配結果<mark class=\"hl\">於公告期滿時確定</mark>。至<span class=\"art\">第59條</span>之禁止或限制事項，依同條第3項<mark class=\"hl\">無須徵詢所有權人意見</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）主管機關之處理分兩階段</p><p>計畫書部分，依<span class=\"art\">第56條第3項</span>，公告期間內私有土地所有權人<mark class=\"hl\">半數以上</mark>，而其所有土地面積<mark class=\"hl\">超過重劃地區土地總面積半數</mark>者表示反對時，主管機關<mark class=\"hl\">應予調處</mark>，並參酌反對理由修訂計畫書，重行報請核定，依核定結果公告實施；<mark class=\"hl\">只有人數或面積過半均不足</mark>。分配結果部分，依<span class=\"art\">第60條之2第3項</span>，異議由主管機關調處，調處不成，應<mark class=\"hl\">報請上級主管機關裁決</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）應公告通知者：重劃計畫書（<mark class=\"hl\">核定後公告滿30日實施</mark>）、禁止或限制事項、分配結果（<mark class=\"hl\">公告30日並通知</mark>）。（二）異議時機為<mark class=\"hl\">各公告期間內</mark>：計畫書得表示反對，分配結果應以書面提出異議。（三）處理：計畫書反對達<mark class=\"hl\">人數及面積雙重過半</mark>門檻者，調處並修訂重報核定；分配結果異議先調處，不成<mark class=\"hl\">報請上級主管機關裁決</mark>。</p>"], "ck": [{"x": "§56Ⅱ 重劃計畫書核定公告滿30日後實施", "h": false}, {"x": "§59 禁限（土：移分設；建：新增改重＋土形）移轉、分割、設定負擔及建築等，≤1年6個月、無須徵詢意見", "h": false}, {"x": "§60-2Ⅰ 分配結果公告30日並通知所有權人", "h": false}, {"x": "計畫書（§56）與分配結果（§60-2）兩階段分開寫，不可混成「公告→異議→訴願」", "h": true}, {"x": "異議時機都是「公告期間內」；分配結果須以書面向主管機關提出", "h": true}, {"x": "反對門檻：人數半數以上「且」面積超過半數，缺一不可", "h": true}, {"x": "分配異議：主管機關調處，調處不成報請上級主管機關裁決", "h": false}], "mn": "一計畫、二分配，各30日 → 計畫反對看雙半數 → 分配書面異議、調處、上級裁決；§59 禁限「土：移分設；建：新增改重＋土形」"}, {"id": "q-107-一", "no": "107-一", "t": "市地重劃禁限建例外＋施工中建築物處理＋不動產說明書", "lv": "B", "k": "off", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "甲所有位於A市都市計畫範圍內之一筆建築基地，因故委託乙不動產經紀人代為出售，丙對該地具有潛在購買慾望。不久該地被劃入A市某公辦市地重劃地區內，該市乃依法公告若干土地權利禁止或限制事項（例如禁建），但對此事項亦有例外規定，其內容為何？又，甲倘若於其地被劃入該市地重劃地區內之後、公告禁建之前已依法取得建造執照且正在施工建築者，其施工中建築物之處理內容為何？試依據平均地權條例等法規之規定，分別說明乙不動產經紀人應如何向丙為解說該地所涉上述兩項問題之相關內容？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>市地重劃期間，主管機關得公告禁止或限制移轉及建築，<mark class=\"hl\">期間不得超過1年6個月</mark>（平均地權條例第59條）；例外依市地重劃實施辦法第11條，施工中建築物之處理依同辦法第13條。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第59條、第62條之1；市地重劃實施辦法第11條、第13條；不動產經紀業管理條例第23條、第24條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）禁限建事項與例外</p><p>A市得公告禁止或限制，<mark class=\"hl\">期間不得超過1年6個月</mark>；例外見辦法第11條。依<span class=\"art\">第59條第1項</span>，重劃地區選定後，政府得報經核定後公告禁止或限制：<span class=\"evli\">一、土地移轉、分割或設定負擔；</span><span class=\"evli\">二、建築改良物之新建、增建、改建或重建及採取土石或變更地形；第2項期間不得超過1年6個月。違反者，其改良物因重劃拆除時<mark class=\"hl\">不予補償</mark>（<span class=\"art\">第62條之1第2項</span>但書）。例外：依市地重劃實施辦法第11條，土地繼承登記、建物及其基地登記、因抵繳遺產稅土地所有權移轉國有登記、因強制執行、土地徵收或法院判決確定申請登記、共有土地持分交換移轉登記、剩餘財產差額分配登記、抵押權讓與登記、實施重劃本身所必要之作業，<mark class=\"hl\">非屬公告禁止或限制事項</mark>。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）施工中建築物</p><p><mark class=\"hl\">不妨礙者續建，妨礙者停工</mark>。依辦法<span class=\"art\">第13條</span>，公告禁建前已依法核發建造執照正在施工中之建築物：<span class=\"evli\">一、經審核不妨礙重劃工程及土地交換分配者，得依原核發建造執照繼續施工；</span><span class=\"evli\">二、有妨礙者應通知停工，<mark class=\"hl\">可改善者通知限期改善</mark>；仍不停工或逾期不改善者，依行政執行法強制執行，繼續施工部分之<mark class=\"hl\">拆除不予補償</mark>。甲正屬本條適用對象。若須拆遷，依<span class=\"art\">平均地權條例第62條之1第1項</span>，通知所有權人<mark class=\"hl\">限期30日內自行拆除</mark>，逾期得代為拆除，依第2項應予補償。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙之解說</p><p>依經紀條例<span class=\"art\">第23條</span>，應以說明書向相對人解說，<mark class=\"hl\">解說前應經委託人簽章</mark>；依<span class=\"art\">第24條</span>，簽約時交付相對人簽章，<mark class=\"hl\">說明書視為買賣契約書之一部分</mark>。乙應向丙說明：該地位於公辦市地重劃地區；公告禁限事項與期間，期間內能否移轉、建築；甲之建築物係准續建或已通知停工，有無拆除不予補償之風險。</p></div>", "<span class=\"blk-l\">四、結論</span><p>第一問：A市得公告禁止或限制移轉及建築，<mark class=\"hl\">期間不得超過1年6個月</mark>；繼承、強制執行、土地徵收或法院判決確定之登記等辦法第11條八款，<mark class=\"hl\">非屬禁止或限制事項</mark>。第二問：甲之建築物經審核<mark class=\"hl\">不妨礙重劃者得續建，妨礙者應停工或限期改善</mark>，違反者強制執行且<mark class=\"hl\">拆除不予補償</mark>。乙應將兩項內容逐項載入說明書向丙解說並交付簽章。</p>"], "ck": [{"x": "平均§59 得公告禁止或限制移轉及建築，期間不得超過1年6個月、無須徵詢", "h": true}, {"x": "例外依辦法§11 八款，要寫出繼承、強制執行、徵收、判決確定等", "h": true}, {"x": "違反公告者，改良物拆除不予補償（§62-1Ⅱ但書）", "h": false}, {"x": "重劃辦法§13：禁建前已領建照施工，不妨礙者續建、妨礙者停工", "h": false}, {"x": "不停工依行政執行法強制執行，繼續施工部分拆除不補償", "h": false}, {"x": "經紀條例§23、§24：以說明書解說，簽約時交付相對人簽章", "h": false}, {"x": "說明書寫明重劃區、禁限事項與期間、建物續建或停工、分配位置可能變動", "h": true}], "mn": "禁什麼（§59Ⅰ）→ 禁多久（1年6個月）→ 例外看辦法§11、施工中看§13（續建／停工）→ 寫進說明書（§23、§24）"}, {"id": "q-113-二", "no": "113-二", "t": "空屋房屋稅＋空地定義與空地稅＋限期建築對租約影響", "lv": "C", "k": "off", "tier": 2, "g": "市地重劃・空地・限期建築", "q": "甲在Ｔ市有一間無人設籍空置不為使用的A「空屋」，以及一筆B「空地」租給乙，請問A屋房屋稅如何課徵？又何謂「空地」？空地稅如何課徵？若B地經Ｔ市政府通知應限期建築使用，甲與乙之租約後續如何處理？請依房屋稅條例暨相關法令、土地稅法及平均地權條例詳述之。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>空地，依平均地權條例第3條第7款，指已完成道路、排水及電力設施而<mark class=\"hl\">仍未依法建築使用</mark>，或改良物價值不及所占基地<mark class=\"hl\">申報地價10%</mark>且經政府認定應予增建、改建或重建之建築用地。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第5條；房屋稅自住房屋認定標準第2條；土地法第87條；平均地權條例第3條第7款、第26條、第31條第3款、第74條；土地稅法第11條、第21條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A屋</p><p><mark class=\"hl\">按其他住家用稅率課徵</mark>。依<span class=\"art\">房屋稅條例第5條第1項第1款</span>第4目，其他住家用房屋按房屋現值，<mark class=\"hl\">最低不得少於2%、最高不得超過4.8%</mark>課徵。適用自住稅率1.2%者，須無出租或供營業、供本人配偶或直系親屬實際居住並辦竣戶籍登記，且全國合計3戶以內（認定標準<span class=\"art\">第2條</span>）。A屋無人設籍、空置不用，<mark class=\"hl\">不符自住要件</mark>；稅率由T市政府依甲全國總持有應稅房屋戶數訂定差別稅率（<span class=\"art\">第5條第2項</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）空地</p><p><mark class=\"hl\">兩法定義不同</mark>。依<span class=\"art\">土地法第87條</span>，編為建築用地未依法使用者為空地；改良物價值不及所占地基<mark class=\"hl\">申報地價20%者，視為空地</mark>。依<span class=\"art\">平均地權條例第3條第7款</span>，空地指已完成道路、排水及電力設施而仍未依法建築使用，或改良物價值不及所占基地<mark c
