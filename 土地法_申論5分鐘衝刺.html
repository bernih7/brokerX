容積移轉方式辦理</mark>。」</p></div><div class=\"evp\"><p class=\"evh\">（二）細節由內政部定之</p><p>依同條第2項，送出基地種類、可移出容積訂定方式、換算公式、移轉方式、折繳代金等事項之辦法，「<mark class=\"hl\">由內政部定之</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（三）保留地之法定取得方式</p><p>依<span class=\"art\">第48條</span>，供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所<mark class=\"hl\">以徵收、區段徵收、市地重劃方式取得</mark>。徵收或區段徵收時，依<span class=\"art\">第49條第1項</span>，地價補償以徵收當期毗鄰非公共設施保留地之平均公告土地現值為準，必要時得加成補償，但「<mark class=\"hl\">加成最高以不超過百分之四十為限</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（四）私有保留地得申請交換</p><p>依<span class=\"art\">第50條之2第1項</span>，「私有公共設施保留地<mark class=\"hl\">得申請與公有非公用土地辦理交換</mark>」，不受土地法、國有財產法及各級政府財產管理法令之限制；「<mark class=\"hl\">劃設逾二十五年未經政府取得者，得優先辦理交換</mark>。」</p></div><div class=\"evp\"><p class=\"evh\">（五）與其他取得方式之關係</p><p>依<span class=\"art\">第48條</span>、<span class=\"art\">第50條之2</span>及<span class=\"art\">第83條之1</span>，保留地之取得途徑包括<mark class=\"hl\">徵收、區段徵收、市地重劃、交換及容積移轉</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲之土地被劃為公園保留地多年未取得，經紀人向買方解說時，應一併說明上開取得方式，使買方了解未來可能之處理途徑。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>容積移轉依都市計畫法第83條之1，適用於公共設施保留地之取得、紀念性或藝術價值建築與歷史建築之保存維護及公共開放空間之提供，細節<mark class=\"hl\">由內政部辦法定之</mark>。其與第48條之徵收、區段徵收、市地重劃及第50條之2之交換，<mark class=\"hl\">共同構成公共設施保留地之取得途徑</mark>。</p>"], "ck": [{"x": "§83-1Ⅰ 三種得以容積移轉之情形", "h": true}, {"x": "§83-1Ⅱ 細節由內政部辦法定之", "h": false}, {"x": "§48 三方式＋§50-2 交換＋容積移轉", "h": true}], "mn": "保留地取得：收、區、重＋換＋移"}, {"id": "pr-42", "no": "預P42", "t": "公共設施用地之設置：種類、決定原則、10%比例、閭鄰配置與鄰避設施（都計§42～§47）", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "都市計畫地區範圍內應設置哪些公共設施用地？其項目、位置與面積如何決定？公園、綠地等開放空間之面積比例，以及學校、市場與殯儀館、垃圾處理場等設施之配置原則各為何？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>公共設施用地係都市計畫為增進市民活動之便利、確保良好都市生活環境，就道路、公園、學校、市場、上下水道等公共設施所劃設之用地；都市計畫法就其種類、決定原則、開放空間最低比例及各類設施之配置位置設有規定，<mark class=\"hl\">劃設後尚未取得者即為公共設施保留地</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第42條至第47條、第48條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）種類與公有地優先</p><p>依<span class=\"art\">第42條第1項</span>，公共設施用地分為道路公園綠地廣場等、學校社教機構市場機關等、上下水道郵政電信變電所等公用事業、本章規定之其他四類；同條第2項，「前項各款公共設施用地<mark class=\"hl\">應儘先利用適當之公有土地</mark>。」</p></div><div class=\"evp\"><p class=\"evh\">（二）決定原則</p><p>依<span class=\"art\">第43條</span>，「公共設施用地，<mark class=\"hl\">應就人口、土地使用、交通等現狀及未來發展趨勢</mark>，決定其項目、位置與面積」；依<span class=\"art\">第44條</span>，道路系統、停車場所及加油站按分區及交通配置，鐵路、公路<mark class=\"hl\">應避免穿越市區中心</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）開放空間比例</p><p>依<span class=\"art\">第45條</span>，公園、體育場所、綠地、廣場及兒童遊樂場，「除具有特殊情形外，其占用土地總面積<mark class=\"hl\">不得少於全部計畫面積百分之十</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>計畫面積1000公頃，五項合計原則不少於100公頃。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）閭鄰配置與邊緣設置</p><p>依<span class=\"art\">第46條</span>，中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空等，「<mark class=\"hl\">應按閭鄰單位或居民分布情形適當配置之</mark>」；依<span class=\"art\">第47條</span>，屠宰場、垃圾處理場、殯儀館、火葬場、公墓、污水處理廠、煤氣廠等，「<mark class=\"hl\">於邊緣適當地點設置之</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（五）未取得者為保留地</p><p>依<span class=\"art\">第48條</span>，供公用事業者<mark class=\"hl\">由事業機構徵收或購買</mark>，其餘由該管政府或公所<mark class=\"hl\">以徵收、區段徵收、市地重劃取得</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>公共設施用地依第42條<mark class=\"hl\">分四類並儘先利用公有土地</mark>，依第43條按人口、土地使用、交通決定；開放空間<mark class=\"hl\">不得少於全部計畫面積10%</mark>，生活設施按閭鄰單位配置，<mark class=\"hl\">鄰避設施於邊緣設置</mark>；未取得者依第48條取得。</p>"], "ck": [{"x": "§42Ⅱ 儘先利用適當之公有土地", "h": true}, {"x": "§45 不得少於全部計畫面積10%", "h": true}, {"x": "§46 閭鄰 vs §47 邊緣", "h": true}], "mn": "〔自編〕公有優先、綠地1成、生活就近、鄰避靠邊"}, {"id": "pr-43", "no": "預P43", "t": "舊市區更新（都市計畫法）：更新地區劃定、重建・整建・維護、更新計畫、土地取得與禁限建（都計§63～§73）", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "依都市計畫法規定，舊市區更新地區如何劃定？更新處理方式有哪幾種，其內容為何？辦理更新計畫時，對更新地區內之土地及地上物得以何種方式取得？劃定後有何禁止事項？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>舊市區更新係直轄市、縣（市）政府或鄉、鎮、縣轄市公所對窳陋或髒亂地區，<mark class=\"hl\">依細部計畫劃定更新地區</mark>，以<mark class=\"hl\">重建、整建或維護</mark>方式改善土地使用、建築物與公共設施之制度，規定於都市計畫法第六章。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第63條至第70條、第72條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）劃定</p><p>依<span class=\"art\">第63條</span>，對於窳陋或髒亂地區認為有必要時，「<mark class=\"hl\">得視細部計畫劃定地區範圍</mark>，訂定更新計畫實施之。」依<span class=\"art\">第64條第2項</span>，更新地區之劃定，由直轄市、縣（市）政府按各類使用地區訂定標準，<mark class=\"hl\">送內政部核定</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）三種方式</p><p>依<span class=\"art\">第64條第1項</span>：<mark class=\"hl\">重建係為全地區之徵收</mark>、拆除原有建築、重新建築、住戶安置，並得變更其土地使用性質或使用密度；<mark class=\"hl\">整建係強制區內建築物</mark>為改建、修建、維護或設備之充實，必要時對部分指定之土地及建築物徵收、拆除及重建；<mark class=\"hl\">維護係加強區內土地使用</mark>及建築管理，改進區內公共設施。</p><p class=\"evx\"><span class=\"evt\">例</span><span>社區大多尚堪使用、僅部分危險建物須拆除者，適用整建。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）計畫與程序</p><p>依<span class=\"art\">第65條</span>，更新計畫以圖說表明詳細設計圖說、土地使用計畫、公共設施設計圖說、事業計畫、財務計畫、實施進度；依<span class=\"art\">第66條</span>，劃定及擬定、變更、報核與發布，「<mark class=\"hl\">應分別依照有關細部計畫之規定程序辦理</mark>」；依<span class=\"art\">第67條</span>，由當地政府或公所辦理。</p></div><div class=\"evp\"><p class=\"evh\">（四）取得與禁建</p><p>依<span class=\"art\">第68條</span>，「對於更新地區範圍內之土地及地上物<mark class=\"hl\">得依法實施徵收或區段徵收</mark>。」依<span class=\"art\">第69條</span>，需拆除重建地區，「<mark class=\"hl\">應禁止地形變更、建築物新建、增建或改建</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（五）基地處分與整建執行</p><p>依<span class=\"art\">第70條</span>，拆除整理後之基地得讓售或標售，承受人不依期限重建者，<mark class=\"hl\">應按原售價收回或另行出售</mark>；依<span class=\"art\">第72條</span>，整建地區得限期令其改建、修建、維護或充實設備，並<mark class=\"hl\">給予技術輔導</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>舊市區更新視細部計畫劃定、標準送內政部核定，<mark class=\"hl\">分重建、整建、維護三種</mark>，<mark class=\"hl\">程序依細部計畫規定</mark>；土地以徵收或區段徵收取得，重建地區劃定後<mark class=\"hl\">禁止地形變更及建築物新建、增建、改建</mark>，基地讓售標售並逾期收回。</p>"], "ck": [{"x": "§63 視細部計畫劃定", "h": true}, {"x": "§64Ⅰ 重建・整建・維護", "h": true}, {"x": "§68 徵收或區段徵收；§69 重建地區禁建", "h": true}], "mn": "〔自編〕更新三招：全拆重建、修補整建、管好維護；地靠徵收或區段徵收"}, {"id": "pr-47", "no": "預P47", "t": "都市計畫之種類與擬定機關：市（鎮）計畫・鄉街計畫・特定區計畫（都計§9～§13）與主要計畫之核定（§20）", "lv": "中", "k": "pred", "tier": 1, "g": "都市計畫・公共設施保留地・說明書解說", "q": "依都市計畫法規定，都市計畫分為哪幾種？各應於何種地方擬定？由何機關擬定？其主要計畫由何機關核定？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>依都市計畫法第9條，都市計畫分為<mark class=\"hl\">市（鎮）計畫、鄉街計畫及特定區計畫三種</mark>；第10條至第12條規定各種計畫應擬定之地方，第13條規定擬定機關。</p>", "<span class=\"blk-l\">二、法條</span><p>都市計畫法第9條、第10條、第11條、第12條、第13條、第20條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）三種計畫</p><p>依<span class=\"art\">第9條</span>，「<mark class=\"hl\">都市計畫分為左列三種</mark>：一、市（鎮）計畫。二、鄉街計畫。三、特定區計畫。」</p></div><div class=\"evp\"><p class=\"evh\">（二）市（鎮）計畫</p><p>依<span class=\"art\">第10條</span>，首都、直轄市；省會、市；縣政府所在地及縣轄市；鎮；其他經內政部或縣（市）政府指定之地區，<mark class=\"hl\">應擬定市（鎮）計畫</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）鄉街計畫</p><p>依<span class=\"art\">第11條</span>，鄉公所所在地；「<mark class=\"hl\">人口集居五年前已達三千，而在最近五年內已增加三分之一以上之地區</mark>」；「人口集居達三千，而其中<mark class=\"hl\">工商業人口占就業總人口百分之五十以上</mark>之地區」；其他經縣政府指定者，應擬定鄉街計畫。</p><p class=\"evx\"><span class=\"evt\">例</span><span>某地區人口集居三千五百人，工商業人口占就業總人口6成，應擬定鄉街計畫。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）特定區計畫</p><p>依<span class=\"art\">第12條</span>，為發展工業或為保持優美風景或因其他目的而劃定之特定地區，<mark class=\"hl\">應擬定特定區計畫</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）擬定機關</p><p>依<span class=\"art\">第13條</span>，<mark class=\"hl\">市計畫由直轄市、市政府擬定</mark>；鎮、縣轄市計畫及鄉街計畫分別由鎮、縣轄市、鄉公所擬定，必要時得由縣政府擬定；特定區計畫由直轄市、縣（市）政府擬定；相鄰接之行政地區<mark class=\"hl\">得會同擬定聯合都市計畫</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（六）主要計畫核定</p><p>依<span class=\"art\">第20條第1項</span>，首都、直轄市、省會、市、縣政府所在地及縣轄市之主要計畫均由內政部核定，「<mark class=\"hl\">鎮及鄉街之主要計畫由內政部核定</mark>」；特定區計畫依擬定機關由內政部核定或報行政院備案。</p></div>", "<span class=\"blk-l\">四、結論</span><p>都市計畫分<mark class=\"hl\">市（鎮）、鄉街、特定區三種</mark>；鄉街計畫除鄉公所所在地外，以人口集居5年前已達三千而<mark class=\"hl\">最近5年內增加三分之一以上</mark>，或人口集居達三千而<mark class=\"hl\">工商業人口占就業總人口50%以上</mark>為要件；擬定以地方政府或公所為原則，<mark class=\"hl\">主要計畫均由內政部核定</mark>，兼顧在地需求與全國一致。</p>"], "ck": [{"x": "§9 三種計畫", "h": true}, {"x": "§11 三千人、三分之一、50%", "h": true}, {"x": "§13 地方擬定；§20 內政部核定", "h": true}], "mn": "〔自編〕市鎮鄉街特定區；鄉街三千人、5年多三分之一或工商過半；地方擬、內政部核"}, {"id": "q-111-二", "no": "111-二", "t": "不動產交易所得稅／土地增值稅／契稅／房屋稅之課稅標的", "lv": "A", "k": "off", "tier": 0, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "試說明不動產交易所得稅、土地增值稅、契稅及房屋稅之課稅標的。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產稅捐可分為<mark class=\"hl\">交易行為稅</mark>（交易所得稅、土地增值稅、契稅）與<mark class=\"hl\">持有稅</mark>（房屋稅），各稅目之課稅標的須分別釐清，方能掌握納稅義務之發生時點與計算基礎。</p>", "<span class=\"blk-l\">二、法條</span><p>所得稅法第4條之4、第14條之4；土地稅法第28條、第31條、第32條；契稅條例第2條、第3條、第13條；房屋稅條例第3條、第5條、第11條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）交易所得稅</p><p>房地交易所得。依<span class=\"art\">所得稅法第4條之4</span>，課徵個人及營利事業<mark class=\"hl\">交易105年1月1日以後取得</mark>之房屋、房屋及其坐落基地或依法得核發建造執照之土地之交易所得；設定地上權方式之房屋使用權、預售屋及其坐落基地，視同房屋、土地交易，但<mark class=\"hl\">不包括依農業發展條例興建之農舍</mark>。所得額以成交價額減除成本及費用，再減除土地漲價總數額，<mark class=\"hl\">按持有期間適用稅率</mark>（<span class=\"art\">第14條之4</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）土地增值稅</p><p>土地漲價總數額。依<span class=\"art\">土地稅法第28條</span>，已規定地價之土地於所有權移轉時，<mark class=\"hl\">按土地漲價總數額徵收</mark>；但<mark class=\"hl\">因繼承而移轉之土地</mark>、各級政府出售或依法贈與之公有土地及受贈之私有土地，<mark class=\"hl\">免徵</mark>。漲價總數額為申報移轉現值減除原規定地價或前次移轉現值及改良土地費用後之餘額（<span class=\"art\">第31條第1項</span>），原地價並依物價指數調整（<span class=\"art\">第32條</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（三）契稅</p><p>因買賣、承典、交換、贈與、分割或占有而取得之不動產所有權。依<span class=\"art\">契稅條例第2條</span>，上開情形<mark class=\"hl\">應申報繳納契稅</mark>；但<mark class=\"hl\">開徵土地增值稅區域之土地免徵</mark>。稅基為契價，以不動產評價委員會評定之標準價格為準（<span class=\"art\">第13條</span>），依取得原因適用<mark class=\"hl\">6%、四或二</mark>之稅率（<span class=\"art\">第3條</span>）。故契稅實際上以房屋為主要對象。</p></div><div class=\"evp\"><p class=\"evh\">（四）房屋稅</p><p>附著於土地之各種房屋及增加其使用價值之建築物。依<span class=\"art\">房屋稅條例第3條</span>為課徵對象，依<span class=\"art\">第5條第1項</span><mark class=\"hl\">按用途適用稅率</mark>；稅基為房屋現值，以不動產評價委員會評定之標準價格為依據，<mark class=\"hl\">每三年重行評定一次</mark>（<span class=\"art\">第11條</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>符合自住要件者按1.2%課徵。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>交易所得稅之標的為<mark class=\"hl\">房地交易所得</mark>；土地增值稅為<mark class=\"hl\">土地漲價總數額</mark>；契稅為因買賣等原因取得之不動產所有權，以契價為稅基，<mark class=\"hl\">開徵土地增值稅區域之土地免徵</mark>；房屋稅為房屋及增加其使用價值之建築物，以房屋現值為稅基。前三者於交易時課徵並設扣除或免徵配套，房屋稅則為<mark class=\"hl\">持有期間課徵之財產稅</mark>。</p>"], "ck": [{"x": "房地交易所得稅課房地交易所得：成交價－成本費用－土地漲價總數額（所得稅§14-4）", "h": false}, {"x": "土地增值稅課土地漲價總數額：申報移轉現值－原地價－改良費用（土稅§31）", "h": false}, {"x": "契稅標的是契價，開徵土增稅區域之土地免徵，不要寫成課土地", "h": true}, {"x": "四稅都要寫出「課什麼」，不能只寫稅名", "h": true}, {"x": "房屋稅課房屋現值，標準價格每三年重評（房屋稅§11）", "h": false}, {"x": "房屋稅是持有稅，不是交易行為稅", "h": true}, {"x": "前三稅交易時課且互設扣抵或免徵配套", "h": false}], "mn": "所得稅課房地所得 → 土增稅課土地漲價 → 契稅課契價（土地免）→ 房屋稅課現值（持有）", "hp": 1045, "hpl": "中"}, {"id": "q-107-二", "no": "107-二", "t": "房地交易所得稅交易所得額與稅率＋土地增值稅處理", "lv": "A", "k": "off", "tier": 0, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "甲擬於近日出售其所有位於A市一間房屋及其坐落基地，依法須繳納房地交易所得稅，甲由其從事不動產仲介業務之朋友處得知亦有土地增值稅之負擔問題。則甲於出售該房地而計徵其房地交易所得稅額時，所涉及「交易所得額」與「交易所得稅率」之規定內容為何？又應如何處理其所涉「土地增值稅」？試依據土地稅法及所得稅法等法律之規定分述之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房地合一所得稅制度，係將房屋與其坐落基地之交易所得合併，<mark class=\"hl\">以實際成交價格減除原始取得成本及相關費用核實課徵所得稅</mark>，並抑制短期炒作。</p>", "<span class=\"blk-l\">二、法條</span><p>所得稅法第4條之4、第14條之4（所得額、減除土地漲價總數額、稅率）、第14條之5（申報）；土地稅法第5條、第28條、第49條等。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）交易所得額＝成交價減成本費用，再減土地漲價總數額</p><p>依<span class=\"art\">所得稅法第4條之4第1項</span>，個人交易中華民國<mark class=\"hl\">105年1月1日以後取得</mark>之房屋及其坐落基地，適用房地合一課稅。依<span class=\"art\">第14條之4第1項</span>，出價取得者，<mark class=\"hl\">以成交價額減除原始取得成本</mark>及因取得、改良、移轉而支付之費用後之餘額為所得額；依同條第3項，<mark class=\"hl\">再減除</mark>依<span class=\"art\">土地稅法第30條第1項</span>公告土地現值計算之土地漲價總數額後，按稅率計算應納稅額。</p></div><div class=\"evp\"><p class=\"evh\">（二）稅率依持有期間區分</p><p>依<span class=\"art\">第14條之4第3項第1款</span>，境內居住之個人<mark class=\"hl\">持有2年以內45%、超過2年未逾5年35%、超過5年未逾10年20%、超過10年15%</mark>；非自願性因素等情形20%；符合<span class=\"art\">第4條之5第1項第1款</span>之自住房地，課稅所得<mark class=\"hl\">400萬元以內免稅、超過部分10%</mark>。非境內居住之個人，2年以內45%、超過2年35%。上述為110年7月1日施行之2.0級距；107年考試時適用1.0級距：持有1年以內45%、超過1年未逾2年35%、超過2年未逾10年20%、超過10年15%（考試年度之官方答案依該級距）。</p></div><div class=\"evp\"><p class=\"evh\">（三）土地增值稅仍應申報繳納，但不得重複減除</p><p>依<span class=\"art\">土地稅法第28條</span>，已規定地價之土地移轉時，應按土地漲價總數額徵收土地增值稅；依<span class=\"art\">第5條</span>，<mark class=\"hl\">納稅義務人為原所有權人甲</mark>；應於<mark class=\"hl\">訂約之日起30日內共同申報移轉現值</mark>（<span class=\"art\">第49條</span>），符合<span class=\"art\">第34條</span>自用住宅用地要件者得按10%課徵。依<span class=\"art\">第14條之4第1項</span>但書，土地增值稅除屬當次交易未自所得額減除之土地漲價總數額部分之稅額外，<mark class=\"hl\">不得列為成本費用</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）交易所得額為成交價額減除原始取得成本及取得、改良、移轉費用，<mark class=\"hl\">再減除土地漲價總數額</mark>。（二）稅率依持有期間區分，<mark class=\"hl\">持有愈短愈高</mark>。（三）<mark class=\"hl\">甲仍應申報繳納土地增值稅</mark>，土地漲價總數額已自所得中減除，該稅額除法定情形外<mark class=\"hl\">不得列為成本費用</mark>，以免重複課稅。</p>"], "ck": [{"x": "所得稅§14-4Ⅰ 所得額＝成交價額－原始取得成本－取得改良移轉費用", "h": false}, {"x": "再減除依土稅§30Ⅰ公告土地現值計算之土地漲價總數額（不是減土增稅額）", "h": true}, {"x": "境內個人：2年內45%、超過2年未逾5年35%、超過5年未逾10年20%、超過10年15%", "h": true}, {"x": "非自願、合建、都更危老5年內20%；自住超過400萬部分10%；非境內45%／35%", "h": false}, {"x": "房地合一之外，土增稅仍依土稅§28課徵，有償移轉由甲繳納（§5）", "h": true}, {"x": "土稅§49 訂約30日內共同申報移轉現值；符合§34 自用住宅得按10%；房地合一稅依所得稅§14-5 於登記次日起30日內申報", "h": false}, {"x": "已減除漲價部分之土增稅不得列成本費用（§14-4Ⅰ但書），避免重複課稅", "h": false}], "mn": "105後取得 → 成交價－成本費用－漲價總數額 → 二四五、五三五、十二十、過十一五 → 土增稅照繳、不得再列費用", "hp": 1044, "hpl": "中"}, {"id": "q-112-二", "no": "112-二", "t": "房屋標準價格影響因素＋非自住房屋稅率及徵收率", "lv": "B", "k": "off", "tier": 1, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "按「房屋現值」為課徵房屋稅之稅基，而「房屋標準價格」又為「房屋現值」核計之基礎，則影響「房屋標準價格」之因素為何？有何問題？又若以「非自住住家用」之房屋為例，其徵收房屋稅之稅率為何？直轄市及縣（市）政府對該房屋稅「徵收率」應如何處理？有何問題？請依房屋稅條例等規定分述之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋現值為房屋稅之稅基，<mark class=\"hl\">以不動產評價委員會評定之房屋標準價格為核計基礎</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第11條第1項、第2項；第5條第1項第1款、第2項；第6條第1項、第2項、第4項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）影響因素</p><p><mark class=\"hl\">建材、耐用折舊、地段三項</mark>。依<span class=\"art\">第11條第1項</span>，由不動產評價委員會依下列事項評定：<span class=\"evli\">一、建造材料種類及等級；</span><span class=\"evli\">二、耐用年數及折舊標準；</span><span class=\"evli\">三、房屋所處街道村里之商業交通情形及供求概況，並比較實價登錄之不動產交易價格減除土地價格部分。依第2項，<mark class=\"hl\">每三年重行評定一次</mark>，並依耐用年數按年遞減其價格。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）問題</p><p><mark class=\"hl\">易與市價脫節</mark>。3年才重評一次，行情變動難即時反映；按年折舊，精華地段老屋市價仍高，現值卻逐年降低；地段以街道村里概括評定，難呈現個別差異。第3款比較實價登錄即在<mark class=\"hl\">縮小落差</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）非自住住家用稅率</p><p>1.5%至4.8%。依113.7.1施行之<span class=\"art\">第5條第1項第1款</span>，<mark class=\"hl\">自住者為1.2%</mark>；非自住者分三級：出租申報租賃所得達當地一般租金標準或繼承取得之共有房屋，<mark class=\"hl\">1.5%至2.4%</mark>；起造人待銷售房屋於起課2年內，<mark class=\"hl\">2%至3.6%</mark>；其他住家用，<mark class=\"hl\">2%至4.8%</mark>。112年官方答案依舊<span class=\"art\">第5條</span>（其他供住家用者1.5%至3.6%），作答以現行法為主。</p></div><div class=\"evp\"><p class=\"evh\">（四）徵收率</p><p>地方訂定並按戶數訂差別稅率。依<span class=\"art\">第6條第1項</span>，地方在稅率範圍內訂定徵收率，<mark class=\"hl\">應提經當地民意機關通過，報財政部備查</mark>；依<span class=\"art\">第5條第2項</span>，應就第2目至第4目，按納稅義務人全國總持有應稅房屋戶數或其他合理需要<mark class=\"hl\">分別訂定差別稅率</mark>；<span class=\"art\">第6條第4項</span>，113年7月1日以後未訂差別稅率者，<mark class=\"hl\">依財政部基準計課</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）問題</p><p><mark class=\"hl\">各地不一，恐訂於下限</mark>。同戶數者因縣市不同而稅負不一；地方顧慮稅收或民意，可能訂於下限，削弱效果。故<span class=\"art\">第6條第4項</span><mark class=\"hl\">以財政部基準兜底</mark>；<span class=\"art\">第6條第2項</span>就地方依法辦理仍有稅收實質淨損失者，於財政收支劃分法修正前<mark class=\"hl\">由中央政府補足</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>影響因素為<mark class=\"hl\">建材、耐用折舊、地段三項</mark>，問題在<mark class=\"hl\">3年一評、逐年折舊</mark>，易與市價脫節。非自住住家用稅率為<mark class=\"hl\">1.5%至4.8%</mark>；徵收率由地方訂定、經民意機關通過報財政部備查並訂差別稅率；問題在各地不一、恐訂於下限，故以<mark class=\"hl\">財政部基準兜底、中央補足稅損</mark>。</p>"], "ck": [{"x": "§11Ⅰ 三因素：建材種類等級、耐用年數及折舊、街道村里地段並比較實價登錄", "h": false}, {"x": "比較實價登錄須減除土地價格：地價水準不是評定因素", "h": true}, {"x": "問題：3年一評、按年折舊、街道村里概括評定，易與市價脫節", "h": false}, {"x": "自住1.2%（單一低現值1%）與非自住區間分清楚", "h": true}, {"x": "非自住三級：1.5～2.4%、2～3.6%、2～4.8%（現行法；112年官方答案依舊法）", "h": false}, {"x": "§6Ⅰ 徵收率由地方在法定範圍內訂定，經民意機關通過、報財政部備查", "h": true}, {"x": "問題：各地不一、恐訂下限；§6Ⅳ財政部基準兜底、§6Ⅱ中央補足稅損", "h": false}], "mn": "建材・折舊・地段 → 3年一評易脫節 → 自住1.2、非自住三級 → 地方訂、議會過、財政部備查", "hp": 32, "hpl": "高"}, {"id": "q-104-二", "no": "104-二", "t": "私有房屋減半徵收房屋稅情形及查定手續", "lv": "C", "k": "off", "tier": 2, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "依房屋稅條例之規定，房屋稅之徵收，係以附著於土地之各種房屋及有關增加該房屋使用價值之建築物為對象。茲試問私有房屋有那些情形，其房屋稅減半徵收？又依規定應申報減半徵收之查定手續為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋稅以附著於土地之各種房屋及有關增加該房屋使用價值之建築物為課徵對象（房屋稅條例第3條）；同條例第15條第2項就私有房屋之特定情形規定<mark class=\"hl\">減半徵收</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第15條第2項（減半徵收，共四款）、第15條第3項（申報期限）；第7條第1項（稅籍申報，與減免申報區辨）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）減半徵收共四款</p><p>依<span class=\"art\">第15條第2項</span>，私有房屋有下列情形之一者，其房屋稅<mark class=\"hl\">減半徵收</mark>：<span class=\"evli\">一、政府平價配售之平民住宅；</span><span class=\"evli\">二、合法登記之工廠供直接生產使用之自有房屋；</span><span class=\"evli\">三、農會所有之自用倉庫及檢驗場，經主管機關證明；</span><span class=\"evli\">四、受重大災害，毀損面積占整棟面積<mark class=\"hl\">3成以上不及5成</mark>之房屋。各款要件須逐一符合：第2款須同時為合法登記之工廠、供直接生產使用及自有；第3款須為農會所有、自用並經主管機關證明；第4款以毀損面積占整棟面積之比例判斷。</span></p><p class=\"evx\"><span class=\"evt\">例</span><span>颱風致整棟毀損面積4成，符合第4款；毀損達5成以上則屬同條第1項之免徵，非減半。司法保護事業所有之房屋亦屬第1項免徵，勿混淆。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）查定手續</p><p><mark class=\"hl\">開徵40日以前申報，逾期自次期起適用</mark>。<mark class=\"hl\">減半徵收不會自動適用</mark>。依<span class=\"art\">第15條第3項</span>，依第2項規定減免房屋稅者，應由納稅義務人於每期房屋稅開徵40日以前，向當地主管稽徵機關申報；逾期申報者，自申報之次期開始適用；核定後減免原因未變更者<mark class=\"hl\">免再申報</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>工廠所有人於開徵40日以前申報，當期即可減半；遲至開徵前20日始申報，當期仍全額課徵，自下一期起適用。至稽徵機關受理後如何審核，條例未設明文；另<span class=\"art\">第7條第1項</span>之「三十日」，係房屋建造完成之日起申報稅籍及使用情形，與減免申報之期限不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>私有房屋減半徵收之情形為：政府平價配售之平民住宅、合法登記工廠供直接生產使用之自有房屋、經主管機關證明之農會自用倉庫及檢驗場、受重大災害毀損面積占整棟<mark class=\"hl\">3成以上不及5成</mark>之房屋。查定手續為納稅義務人於<mark class=\"hl\">每期房屋稅開徵40日以前</mark>向當地主管稽徵機關申報；逾期申報者，<mark class=\"hl\">自申報之次期開始適用</mark>；經核定後減免原因未變更者，<mark class=\"hl\">以後免再申報</mark>（第15條第3項）。</p>"], "ck": [{"x": "§15Ⅱ：政府平價配售之平民住宅、合法登記工廠直接生產自有房屋 → 減半", "h": false}, {"x": "§15Ⅱ：農會自用倉庫及檢驗場（經證明）、受災毀損3成以上不及5成 → 減半", "h": false}, {"x": "毀損5成以上、司法保護事業房屋屬§15Ⅰ免徵，不是減半", "h": true}, {"x": "§15Ⅲ：每期開徵40日以前向當地主管稽徵機關申報（不是30日）", "h": true}, {"x": "逾期申報自申報之次期開始適用", "h": false}, {"x": "§7 的30日是建造完成後稅籍申報，與減免申報不同", "h": false}, {"x": "須主動申報並經稽徵機關查定才適用，不會自動減半", "h": false}], "mn": "平工農災（減半四款）→ 5成以上改免徵 → 開徵前40日申報 → 逾期次期起", "hp": 34, "hpl": "高"}, {"id": "q-100-一", "no": "100-一", "t": "店面出租5年期間應負擔之稅負與稅率", "lv": "C", "k": "off", "tier": 2, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "李先生擁有透天店面一棟，與某便利商店簽訂五年租約，請問在出租期間，李先生應負擔那些稅負？稅率為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產所有權人於出租期間，仍負有財產持有及租賃所得申報之雙重納稅義務，須區分<mark class=\"hl\">「持有稅」與「所得稅」</mark>分別說明。</p>", "<span class=\"blk-l\">二、法條</span><p>土地稅法第3條、第15條、第16條、第17條；房屋稅條例第4條、第5條、第6條；所得稅法第14條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地價稅</p><p><mark class=\"hl\">按一般稅率累進課徵</mark>。依<span class=\"art\">土地稅法第3條第1項第1款</span>，納稅義務人為土地所有權人；<span class=\"art\">第15條</span>按每一土地所有權人在每一直轄市或縣（市）轄區內之地價總額計徵；<span class=\"art\">第16條</span>基本稅率10‰，超過累進起點地價者，就超過部分依倍數分別課徵15‰、二十五、三十五、四十五、五十五。本題店面出租予便利商店供營業使用，<mark class=\"hl\">非自用住宅用地</mark>，不得適用<span class=\"art\">第17條</span>2‰之稅率，應與同一縣市其他土地合併計算地價總額，按一般稅率累進課徵。</p></div><div class=\"evp\"><p class=\"evh\">（二）房屋稅</p><p><mark class=\"hl\">營業使用部分3%至5%</mark>。依<span class=\"art\">房屋稅條例第4條第1項</span>，向房屋所有人徵收；<span class=\"art\">第5條第1項第2款</span>，非住家用房屋供營業使用者，最低不得少於房屋現值3%，最高不得超過5%；同項第3款，同時作住家及非住家用者，以實際使用面積分別課徵，但非住家用者課稅面積<mark class=\"hl\">最低不得少於全部面積六分之一</mark>；<span class=\"art\">第6條第1項</span>，地方政府在稅率範圍內訂定之徵收率，應提經當地民意機關通過，報財政部備查。本題供便利商店營業部分按非住家用稅率課徵。</p></div><div class=\"evp\"><p class=\"evh\">（三）綜合所得稅</p><p><mark class=\"hl\">租金併入綜合所得總額</mark>。依<span class=\"art\">所得稅法第14條第1項</span>第五類，以全年租賃收入<mark class=\"hl\">減除必要損耗及費用後之餘額為所得額</mark>；收有押金者，按當地銀行業通行之一年期存款利率計算租賃收入。本題李先生每年租金減除修繕費、折舊、地價稅、房屋稅等必要損耗及費用後，併入綜合所得總額，按累進稅率5%、十二、二十、三十、四十課徵。</p></div><div class=\"evp\"><p class=\"evh\">（四）營業稅</p><p><mark class=\"hl\">辦理營業登記者另須留意</mark>。本題未提及李先生辦理營業登記，故以前三項為主要稅負。</p></div>", "<span class=\"blk-l\">四、結論</span><p>李先生於5年租期內，每年應負擔：一、<mark class=\"hl\">地價稅</mark>，按申報地價總額依一般稅率10‰起累進課徵，<mark class=\"hl\">不適用自用住宅用地2‰</mark>；二、<mark class=\"hl\">房屋稅</mark>，營業使用部分按非住家用稅率房屋現值<mark class=\"hl\">3%至5%</mark>；三、<mark class=\"hl\">綜合所得稅</mark>，租賃所得併入綜合所得總額累進課徵。若辦理營業登記出租，另須留意營業稅。</p>"], "ck": [{"x": "地價稅、房屋稅屬持有稅，不因出租轉由承租人負擔，均由李先生繳", "h": false}, {"x": "租金收入屬第五類租賃所得，須另課綜合所得稅，不能漏答", "h": true}, {"x": "土稅§16 地價稅10‰起累進至55‰；營業用不適用§17 自用住宅2‰", "h": false}, {"x": "房屋稅§5Ⅰ② 營業用屬非住家用3%～5%，不是自住1.2%", "h": true}, {"x": "§5Ⅰ③ 住家兼營業按面積分別課，非住家≥1/6；§6 徵收率經民意機關通過", "h": false}, {"x": "所得稅§14Ⅰ 租金減必要損耗及費用併入綜所；押金按1年期存款利率設算", "h": false}, {"x": "三稅都要寫稅基與稅率，不能只列稅名", "h": true}], "mn": "地（10‰累進）→ 房（營業3～5%）→ 所（租金減費用併綜所）→ 有營業登記才加營業稅"}, {"id": "mk-4", "no": "模4", "t": "模擬試題｜房屋稅：自住優惠條件、按年計徵與使用情形變更申報", "lv": "模", "k": "mock", "tier": 1, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "二、依房屋稅條例規定，適用自住優惠之條件為何？又房屋稅如何按年計徵，以及使用情形變更該如何申報？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋稅係對附著於土地之房屋，依房屋現值按用途別稅率課徵之持有稅。房屋稅條例112年12月19日修正，對非自住住家用房屋改採<mark class=\"hl\">全國歸戶差別稅率</mark>，並維持個人自住房屋之最低稅率，即<mark class=\"hl\">「自住優惠」</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第5條第1項第1款第1目、第6條之1、第7條；住家用房屋供自住及公益出租人出租使用認定標準第2條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）自住優惠須同時符合三要件</p><p>依認定標準<span class=\"art\">第2條第1項</span>，個人所有之住家用房屋須「一、<mark class=\"hl\">房屋無出租或供營業情形</mark>。二、供本人、配偶或直系親屬實際居住使用，且應於該屋<mark class=\"hl\">辦竣戶籍登記</mark>。三、本人、配偶及未成年子女<mark class=\"hl\">全國合計三戶以內</mark>。」始屬自住，依<span class=\"art\">房屋稅條例第5條第1項第1款</span>第1目，為其「<mark class=\"hl\">房屋現值百分之一點二</mark>」。全國僅持有1戶，符合前兩款且現值在一定金額以下者，適用1%（同目但書）。3戶是本人、配偶及未成年子女合併計算，不是每人各3戶。</p></div><div class=\"evp\"><p class=\"evh\">（二）房屋稅按年計徵</p><p>依<span class=\"art\">第6條之1第1項</span>，「房屋稅以<mark class=\"hl\">每年二月之末日為納稅義務基準日</mark>，由當地主管稽徵機關按房屋稅籍資料核定，於每年<mark class=\"hl\">五月一日起至五月三十一日止一次徵收</mark>，其課稅所屬期間為上一年七月一日起至當年六月三十日止。」當期新建、增建、改建完成或拆除者，按月比例計課，未滿1個月不計（同條第2項）。</p></div><div class=\"evp\"><p class=\"evh\">（三）使用情形變更之申報</p><p>依<span class=\"art\">第7條第1項</span>，房屋<mark class=\"hl\">建造完成之日起30日內</mark>應申報稅籍及使用情形，增建、改建、移轉、承典時亦同。依同條第2項，使用情形變更致稅額增加者，應於變更之次期房屋稅<mark class=\"hl\">開徵40日以前申報</mark>，其他情形應於每期開徵40日以前申報；「經核定後使用情形未再變更者，<mark class=\"hl\">以後免再申報</mark>。」致稅額減少而逾期申報者，自申報之次期開始適用；致稅額增加者，自變更之次期開始適用，逾期或未申報者亦同。</p><p class=\"evx\"><span class=\"evt\">例</span><span>營業改為自住而逾期申報，自申報之次期才適用自住稅率。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>自住優惠須無出租營業、本人配偶或直系親屬實際居住並設籍、本人配偶及未成年子女<mark class=\"hl\">全國合計3戶以內，適用1.2%</mark>；全國僅持有1戶且現值在一定金額以下者<mark class=\"hl\">適用1%</mark>。房屋稅以<mark class=\"hl\">二月末日為基準日</mark>，五月一次徵收。使用情形變更應於開徵40日以前申報，<mark class=\"hl\">稅額減少逾期者自申報次期適用</mark>，<mark class=\"hl\">稅額增加者自變更次期適用</mark>。</p>", "<span class=\"blk-l\">一、定義</span><p><p>房屋稅：對附著於土地之建築物及增加其使用價值之附屬設備，按房屋現值課徵，向所有人（或典權人等）每年徵收一次。</p></p>", "<span class=\"blk-l\">二、法條</span><p><p>（一）自住優惠（房屋稅§5）：①供自住或公益出租人出租使用之住家用房屋，稅率為房屋現值1.2%；②本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，稅率1%。自住房屋須無出租或供營業情形，本人、配偶或直系親屬實際居住並辦竣戶籍，且本人、配偶及未成年子女全國合計不超過3戶（住家用房屋供自住及公益出租人出租使用認定標準§2）。</p><p>（二）按年計徵（§6-1）：每年2月末日為納稅義務基準日；按稅籍資料核定，於5月1日至5月31日一次徵收；課稅所屬期間為上一年7月1日至當年6月30日。當期新建、增建、改建或拆除，按月比例計課，未滿1個月不計；3月1日至6月30日新建、增建、改建完成者，併入次期課徵；7月1日至次年2月末日拆除者，拆除前期間仍應課徵當期房屋稅。</p><p>（三）稅籍及使用情形變更（§7）：建造完成30日內申報稅籍及使用情形；使用情形變更致稅額增加者，應於變更後次期開徵40日前申報，致稅額減少或其他情形，於每期開徵40日前申報；經核定後未再變更者免再申報。稅額減少而逾期申報者，自申報之次期開始適用；稅額增加而逾期或未申報者，自變更之次期開始適用。</p></p>", "<span class=\"blk-l\">三、涵攝分析</span><p><p>（一）自住優惠：住家用、無出租或營業、本人／配偶／直系親屬實際居住並辦竣戶籍、本人配偶未成年子女全國合計不超過3戶 → 1.2%；全國僅一戶且現值在一定金額以下 → 1%。</p><p>（二）按年計徵：2月末日基準日、5月徵收、所屬期間上年7/1～當年6/30；當期新建／拆除按月比例，3/1～6/30完成者併入次期，7/1～2月末日拆除者當期仍課徵。</p><p>（三）變更申報：自住改營業（稅額增加）→ 即使逾期或未申報，仍自變更之次期適用；營業改自住（稅額減少）逾期 → 自申報之次期才適用。</p></p>", "<span class=\"blk-l\">四、結論</span><p><p>自住要件四項＋1.2%／1%；按年計徵（基準日2月末日、5月徵收）；使用變更依§7於開徵前40日申報，逾期適用時點增加與減少不同。</p></p>"], "ck": [{"x": "房屋稅§5Ⅰ①(一) 自住1.2%；全國1戶且現值在一定金額以下1%", "h": false}, {"x": "認定標準§2 三要件：無出租營業、實際居住並設籍、全國合計3戶以內", "h": false}, {"x": "3戶是本人、配偶及未成年子女合計；直系親屬只用在實際居住、不算戶數", "h": true}, {"x": "§6-1 二月末日為基準日，5/1～5/31一次徵收", "h": false}, {"x": "課稅所屬期間上年7/1～當年6/30，不是曆年1/1～12/31", "h": true}, {"x": "當期新建拆除按月比例計課，未滿一月不計", "h": false}, {"x": "§7 建造完成30日內申報；使用情形變更於開徵40日以前申報", "h": false}, {"x": "稅額減少逾期→申報之次期；稅額增加→變更之次期（逾期或未申報亦同），不可寫反", "h": true}], "mn": "無租無營、住設籍、3戶內 → 二月底定人、五月繳、七月到六月 → 40天前報，減報次期、增變次期", "hp": 30, "hpl": "高"}, {"id": "pr-27", "no": "預P27", "t": "房屋稅2.0（囤房稅）：自住認定、全國歸戶差別稅率、待銷售、繼承共有", "lv": "高", "k": "pred", "tier": 0, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "甲（已婚，有一未成年子女）於全國持有住家用房屋五戶：A屋全家設籍自住；B屋出租並申報租賃所得達當地一般租金標準；C屋係與兄弟繼承取得之共有房屋；D、E屋空置。另乙建設公司持有使用執照所載為住家用之待銷售房屋。請依現行房屋稅條例說明各屋適用之稅率，及地方政府如何訂定差別稅率。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、定義</span><p>房屋稅以附著於土地之房屋為課徵對象。依房屋稅條例第5條第2項，非自住住家用房屋<mark class=\"hl\">按納稅義務人全國總持有應稅房屋戶數訂定差別稅率</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第5條第1項第1款四目（自住1.2%，單一自住低現值1%；出租達標或繼承共有1.5%～2.4%；起造人待銷售於起課二年內2%～3.6%；其他住家用2%～4.8%）、第5條第2項（按全國總持有戶數訂差別稅率）、第6條（徵收率經民意機關通過，報財政部備查）；住家用房屋供自住及公益出租人出租使用認定標準第2條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A屋</p><p><mark class=\"hl\">1.2%，不適用1%</mark>。自住須無出租或供營業、供本人配偶或直系親屬實際居住並辦竣戶籍登記、本人配偶及未成年子女全國合計3戶以內。A屋全家設籍自住，適用1.2%；但甲全國持有5戶，<mark class=\"hl\">非「全國僅持有一戶」</mark>，不適用1%。</p></div><div class=\"evp\"><p class=\"evh\">（二）B屋、C屋</p><p><mark class=\"hl\">第2目，1.5%～2.4%</mark>。B屋<mark class=\"hl\">出租並申報租賃所得達當地一般租金標準</mark>，C屋為<mark class=\"hl\">繼承取得之共有房屋</mark>，均屬第2目，由所在地政府按甲該目之全國總持有戶數訂稅率。</p></div><div class=\"evp\"><p class=\"evh\">（三）D、E屋</p><p><mark class=\"hl\">第4目，2%～4.8%</mark>。空置屋非自住、非出租、非繼承共有，屬其他住家用，<mark class=\"hl\">戶數愈多稅率愈高</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）乙公司待銷售屋</p><p><mark class=\"hl\">第3目，2%～3.6%</mark>。起造人持有使用執照所載住家用之待銷售房屋，<mark class=\"hl\">於起課2年內適用</mark>；<mark class=\"hl\">逾2年未售出，回歸第4目</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）差別稅率之訂定</p><p>依<span class=\"art\">第5條第2項</span>，地方政府應就第2目至第4目，按納稅義務人全國總持有應稅房屋戶數或其他合理需要<mark class=\"hl\">分別訂定差別稅率</mark>；依<span class=\"art\">第6條</span>，徵收率應<mark class=\"hl\">經當地民意機關通過並報財政部備查</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲之D屋位於新北市，即以甲全國持有之第4目戶數適用新北市所訂稅率。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>房屋稅2.0為<mark class=\"hl\">「自住從輕、非自住按全國戶數從重」</mark>：<mark class=\"hl\">A屋1.2%</mark>；B、C屋1.5%～2.4%；D、E屋2%～4.8%；乙公司待銷售屋<mark class=\"hl\">起課2年內2%～3.6%</mark>，逾期回歸其他住家用。上限2.4%、3.6%、4.8%約為1.2%之2、3、4倍。</p>"], "ck": [{"x": "自住三要件在認定標準§2：無出租營業、設籍實際居住、全國3戶以內", "h": false}, {"x": "A屋1.2%：甲5戶非全國僅持有1戶，不適用1%", "h": true}, {"x": "B出租達標、C繼承共有：1.5%～2.4%", "h": false}, {"x": "D、E空置：其他住家用2%～4.8%", "h": false}, {"x": "乙待銷售限「起課二年內」2%～3.6%，逾2年回第4目", "h": true}, {"x": "差別稅率由地方依全國總持有戶數訂定（不是中央訂），財政部只公告基準", "h": true}, {"x": "§6Ⅰ 徵收率經當地民意機關通過、報財政部備查", "h": false}], "mn": "租・戶・3；本配直、本配未；上限×1×2×3×4", "hp": 31, "hpl": "高"}, {"id": "pr-22", "no": "預P22", "t": "房屋稅與空地稅整合：納稅義務人、稅率、空地認定與逾期未建的後果", "lv": "中", "k": "pred", "tier": 1, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "甲持有一幢住宅（未自住）及一筆未建築之空地。請說明：（一）房屋稅納稅義務人與稅率；（二）空地之認定與空地稅；（三）空地逾期未建築之後果。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋稅課徵於房屋之持有，稅率依使用性質差異化；空地稅則針對閒置土地加重負擔，<mark class=\"hl\">促進土地利用</mark>。二者皆為持有階段之稅負，但稅基與目的不同。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第4條（納稅義務人）、第5條（稅率）；平均地權條例第3條（空地定義）、第26條（空地稅與照價收買）、第31條（照價收買地價）；土地法第87條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲為納稅義務人，未自住屬其他住家用</p><p>依<span class=\"art\">房屋稅條例第4條</span>，房屋稅<mark class=\"hl\">向房屋所有人徵收之</mark>。依<span class=\"art\">第5條第1項第1款</span>，<mark class=\"hl\">供自住者為1.2%</mark>，其他住家用房屋為2%至四點八。本題甲之住宅未自住，若非公益出租等情形，即屬其他住家用，<mark class=\"hl\">依其全國總持有戶數適用差別稅率</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）空地以平均地權條例10%、土地法20%為界</p><p>依<span class=\"art\">平均地權條例第3條第7款</span>，空地指已完成道路、排水及電力設施，而仍未依法建築使用；或建築改良物價值不及所占基地<mark class=\"hl\">申報地價10%</mark>，且經政府認定應予增建、改建或重建之建築用地。<span class=\"art\">土地法第87條</span>則規定，改良物價值不及<mark class=\"hl\">申報地價20%者，視為空地</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）空地稅須先限期建築，逾期加徵二至5倍</p><p>依<span class=\"art\">平均地權條例第26條第1項</span>，政府對於私有空地，得視建設發展情形劃定區域，<mark class=\"hl\">限期建築、增建、改建或重建</mark>；逾期未建築者，按該宗土地應納地價稅基本稅額<mark class=\"hl\">加徵2倍至5倍之空地稅或照價收買</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）逾期未建，政府得照價收買</p><p>收買地價依<span class=\"art\">第31條第3款</span>，<mark class=\"hl\">以收買當期之公告土地現值為準</mark>。另依<span class=\"art\">第26條第2項</span>，新建之改良物價值<mark class=\"hl\">不及所占基地申報地價50%者，不予核發建築執照</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">甲為房屋所有人即納稅義務人</mark>，住宅未自住屬其他住家用，適用2%至四點八之差別稅率；空地經限期建築而逾期未建，面臨<mark class=\"hl\">空地稅加徵或照價收買</mark>。作答時須區分<mark class=\"hl\">平均地權條例10%與土地法20%</mark>之認定標準。</p>"], "ck": [{"x": "房屋稅§4 向所有人徵收；使用權人、典權人、共有推定一人、信託受託人要分清", "h": true}, {"x": "稅率分級寫，不寫單一數字；甲未自住屬其他住家用2%～4.8%", "h": false}, {"x": "自住1.2%須無出租營業、實際居住並設籍、全國3戶內（認定標準§2）", "h": false}, {"x": "空地：平均§3⑦ 10%、土地法§87 20%，不可寫反", "h": true}, {"x": "平均§26Ⅰ 限期建築逾期 → 地價稅基本稅額加徵2～5倍（不是荒地稅1～3倍）", "h": true}, {"x": "照價收買以收買當期公告土地現值（§31③）；程序50日繳書狀、30日內給付（§28）", "h": false}, {"x": "逾期未建＝空地稅或照價收買；新建物不及申報地價50%不發建照（§26Ⅱ）", "h": false}], "mn": "自一二、非自二四八 → 空地10%（平均）／20%（土地法）→ 限期逾期加二至五 → 或照價收買（當期公告現值）"}, {"id": "pr-30", "no": "預P30", "t": "房地合一稅2.0：課稅範圍、所得計算、持有期間稅率、自住400萬、重購退稅", "lv": "中", "k": "pred", "tier": 1, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "甲（境內居住之個人）於110年以1,000萬元購入房地，113年以1,600萬元出售，未提示費用證明，依公告土地現值計算之土地漲價總數額為200萬元。請說明：（一）房地合一所得稅之課稅範圍；（二）甲之應納稅額；（三）若甲另有一筆105年1月1日以後取得、本人設籍並居住連續滿六年之自住房地出售，其課稅與重購退稅規定為何。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>房地合一所得稅，指個人交易<mark class=\"hl\">105年1月1日以後取得</mark>之房屋、土地，以成交價額減除成本、費用後之所得，<mark class=\"hl\">再減除土地漲價總數額</mark>，按持有期間稅率課徵之所得稅（所得稅法第4條之4、第14條之4）。</p>", "<span class=\"blk-l\">二、法條</span><p>所得稅法第4條之4、第4條之5第1項第1款、第14條之4、第14條之5、第14條之8。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）課稅範圍</p><p>依<span class=\"art\">所得稅法第4條之4第1項</span>，<mark class=\"hl\">交易105年1月1日以後取得</mark>之房屋、土地，應課徵所得稅；第2項預售屋、地上權房屋使用權，第3項特定股權交易，均<mark class=\"hl\">視同房地交易</mark>；第4項<mark class=\"hl\">房屋不包括農舍</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲於110年取得，屬課稅範圍。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲應納房地合一所得稅129.5萬元</p><p>依<span class=\"art\">第14條之4第1項</span>，「以交易時之成交價額減除原始取得成本，與因取得、改良及移轉而支付之費用後之餘額為所得額」，未提示費用證明者依申報作業要點第15點<mark class=\"hl\">按3%計算，以30萬元為限</mark>；第3項減除土地漲價總數額後，<mark class=\"hl\">持有超過2年未逾5年者稅率35%</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>所得額570萬元減200萬元，餘額370萬元×35%＝129.5萬元，並依<span class=\"art\">第14條之5</span>於30日內申報。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）自住房地：房地合一所得稅400萬元內免稅</p><p>依<span class=\"art\">第4條之5第1項第1款</span>，須同時符合：<span class=\"evli\">1.本人或配偶、未成年子女設籍，<mark class=\"hl\">持有並居住連續滿6年</mark>；</span><span class=\"evli\">2.<mark class=\"hl\">交易前6年內無出租、供營業或執行業務使用</mark>；</span><span class=\"evli\">3.交易前6年內未曾適用本款。</span><mark class=\"hl\">免稅以課稅餘額400萬元為限，超過部分稅率10%</mark>（<span class=\"art\">第14條之4第3項</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>餘額500萬元者，(500萬元－400萬元)×10%＝10萬元。與土增稅自用住宅（出售前1年）不同，分別判斷。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）自住房地：房地合一所得稅之重購退稅</p><p>依<span class=\"art\">第14條之8</span>，出售自住房地<mark class=\"hl\">繳稅後2年內重購自住房地</mark>者，得於5年內「<mark class=\"hl\">申請按重購價額占出售價額之比率</mark>，自前開繳納稅額計算退還」；先購後售得扣抵；<mark class=\"hl\">重購後5年內改作他用或再移轉者應追繳</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>出售2,000萬元、重購1,000萬元，退已納稅額1/2。土增稅重購退稅（土稅§35）是退「不足支付新購地價之數額」，算法不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲之房地屬房地合一所得稅課稅範圍，<mark class=\"hl\">應納129.5萬元</mark>並於<mark class=\"hl\">移轉登記次日起30日內申報</mark>；另一筆自住房地<mark class=\"hl\">課稅餘額400萬元內免稅、超過部分10%</mark>；2年內重購自住房地得於5年內按比例申請退還房地合一所得稅，<mark class=\"hl\">5年內改用或移轉追繳</mark>。</p>"], "ck": [{"x": "§4-4：105.1.1後取得；地上權使用權、預售屋、特定股權視同；農舍除外", "h": false}, {"x": "費用按成交價3%＝48萬，但以30萬為限", "h": true}, {"x": "所得570萬還要減土地漲價總數額200萬 → 餘額370萬", "h": true}, {"x": "持有約3年屬超過2年未逾5年，35%：應納129.5萬元", "h": true}, {"x": "§14-5：完成移轉登記次日起30日內申報，不論有無應納稅額", "h": false}, {"x": "自住要件要寫「交易前6年內無出租、供營業或執行業務使用」", "h": true}, {"x": "房地合一所得稅自住：課稅餘額400萬內免稅、超過部分10%（不是土增稅）", "h": false}, {"x": "§14-8：2年內重購，5年內按重購價額比率申請退稅；5年內改用或移轉追繳", "h": false}], "mn": "105.1.1後取得 → 減成本、費用3%上限30 → 減土地漲價總數額 → 2年45、5年35、10年20、逾10年15 → 自住6年400萬 → 2年重購退稅", "hp": 1043, "hpl": "中"}, {"id": "pr-39", "no": "預P39", "t": "房屋稅免徵 vs 減半：情形、受災毀損門檻與申報（房屋稅§15）", "lv": "中", "k": "pred", "tier": 1, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "依房屋稅條例規定，私有房屋免徵與減半徵收房屋稅之情形各為何？受重大災害毀損之房屋如何區分？適用減免應如何申報？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>房屋稅以房屋現值按用途別稅率課徵。房屋稅條例第15條就具公益性、政策性或受災之私有房屋，設免徵與減半徵收兩種減免：<mark class=\"hl\">免徵者不必繳納</mark>，<mark class=\"hl\">減半者按應納稅額之半數繳納</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>房屋稅條例第15條第1項至第4項、第8條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）免徵與減半之區別</p><p>依<span class=\"art\">房屋稅條例第15條</span>，<mark class=\"hl\">第1項為免徵、第2項為減半</mark>。免徵是法律直接免除該期房屋稅，不必繳納；減半徵收則仍須繳納，但按應納稅額之半數。</p></div><div class=\"evp\"><p class=\"evh\">（二）減半徵收四款</p><p>依<span class=\"art\">第15條第2項</span>：「一、政府平價配售之平民住宅。二、合法登記之工廠供直接生產使用之自有房屋。三、農會所有之自用倉庫及檢驗場，經主管機關證明。四、受重大災害，<mark class=\"hl\">毀損面積占整棟面積三成以上不及五成之房屋</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>合法登記工廠自有之廠房供直接生產使用，房屋稅減半。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）免徵十一款</p><p>依<span class=\"art\">第15條第1項</span>，免徵包括私立學校、慈善救濟事業、宗祠寺廟、無償供公用或軍用、公益社團、專供農用、受災毀損5成以上、司法保護事業、自然人持有現值10萬元以下住家用房屋（<mark class=\"hl\">全國合計以三戶為限</mark>）、公糧倉庫及公益信託等房屋。<mark class=\"hl\">農會「自用」倉庫及檢驗場是減半</mark>，<mark class=\"hl\">「專供糧政機關儲存公糧」之倉庫才是免徵</mark>，為常見陷阱。</p></div><div class=\"evp\"><p class=\"evh\">（四）受災毀損之區分</p><p>依<span class=\"art\">第15條第2項第4款</span>，<mark class=\"hl\">毀損3成以上不及5成者減半</mark>；依第1項第7款，「<mark class=\"hl\">毀損面積占整棟面積五成以上，必須修復始能使用</mark>」者免徵。</p><p class=\"evx\"><span class=\"evt\">例</span><span>颱風使房屋毀損4成，減半；毀損6成且須修復，免徵。另依<span class=\"art\">第8條</span>，焚燬、坍塌、拆除至不堪居住程度者，申報查實後在未重建完成期內停止課稅。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）申報</p><p>依<span class=\"art\">第15條第3項</span>，減免者「應由納稅義務人於<mark class=\"hl\">每期房屋稅開徵四十日以前</mark>向當地主管稽徵機關申報；逾期申報者，<mark class=\"hl\">自申報之次期開始適用</mark>。經核定後減免原因未變更者，以後免再申報。」第9款原則不在須申報之列；但依同條第4項，10萬元以下住家用房屋全國合計超過3戶時，<mark class=\"hl\">應申報擇定</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>房屋稅條例第15條第1項規定<mark class=\"hl\">免徵十一款</mark>、第2項規定<mark class=\"hl\">減半徵收四款</mark>；受災毀損<mark class=\"hl\">3成以上不及5成者減半</mark>，<mark class=\"hl\">5成以上必須修復始能使用者免徵</mark>。減免原則應於每期<mark class=\"hl\">開徵40日以前申報</mark>，逾期自申報之次期適用。</p>"], "ck": [{"x": "§15Ⅱ 減半四款", "h": true}, {"x": "§15Ⅰ⑨ 10萬以下、自然人全國3戶", "h": false}, {"x": "§15Ⅲ 開徵40日前申報，逾期自次期適用", "h": true}], "mn": "減半：平工農災（3～5成）；免徵：10萬3戶；開徵前40日報"}, {"id": "pr-32", "no": "預P32", "t": "契稅：課徵範圍、稅率、納稅義務人、免徵、與土地增值稅之分界", "lv": "低", "k": "pred", "tier": 2, "g": "房屋稅・契稅・房地合一（持有與交易稅）", "q": "請說明契稅之課徵範圍、各類稅率與納稅義務人；並說明向法院標購拍賣之不動產與在開徵土地增值稅區域之土地，其契稅如何處理。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>契稅係對不動產所有權移轉或設定典權之行為，<mark class=\"hl\">按契價課徵之地方稅</mark>。因<mark class=\"hl\">開徵土地增值稅區域之土地免徵契稅</mark>，契稅實際上以房屋為主要課徵對象。</p>", "<span class=\"blk-l\">二、法條</span><p>契稅條例第2條、第3條、第4條至第9條、第11條、第13條、第14條、第16條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）課徵範圍</p><p>依<span class=\"art\">契稅條例第2條</span>本文，「不動產之買賣、承典、交換、贈與、分割或因占有而取得所有權者，<mark class=\"hl\">均應申報繳納契稅</mark>」，並於<mark class=\"hl\">契約成立之日起30日內申報</mark>（<span class=\"art\">第16條第1項</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲向乙購買房屋，應於30日內申報。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）稅率與納稅義務人</p><p>依<span class=\"art\">第3條</span>，<mark class=\"hl\">買賣、贈與、占有契稅為契價6%</mark>，<mark class=\"hl\">典權4%</mark>，<mark class=\"hl\">交換、分割2%</mark>；由買受人（<span class=\"art\">第4條</span>）、典權人（<span class=\"art\">第5條</span>）、交換人（<span class=\"art\">第6條</span>）、受贈人（<span class=\"art\">第7條</span>）、占有取得所有權之人（<span class=\"art\">第9條</span>）申報。</p><p class=\"evx\"><span class=\"evt\">例</span><span>受贈契價500萬元之房屋，應申報契稅30萬元。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）法院拍賣仍課契稅</p><p>依<span class=\"art\">第11條</span>，「向法院標購拍賣之不動產者，<mark class=\"hl\">仍應申報繳納契稅</mark>」；移轉價格低於評定標準價格者<mark class=\"hl\">從其移轉價格</mark>（<span class=\"art\">第13條第1項</span>）；<mark class=\"hl\">以法院發給權利移轉證明書之日為申報起算日</mark>（<span class=\"art\">第16條第4項</span>）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>以200萬元拍得評定標準價格250萬元之房屋，以200萬元為契價。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）開徵土增稅區域之土地免徵</p><p>依<span class=\"art\">第2條</span>但書，「<mark class=\"hl\">在開徵土地增值稅區域之土地，免徵契稅</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買賣房地，基地課土地增值稅，房屋由買方申報契稅。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）免徵情形</p><p>依<span class=\"art\">第14條</span>，<mark class=\"hl\">政府機關因公使用取得</mark>、郵政事業因業務使用取得等情形免徵。</p><p class=\"evx\"><span class=\"evt\">例</span><span>縣政府購買民宅作為辦公廳舍，免徵契稅。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>契稅以六種取得原因、<mark class=\"hl\">6%／4%／2%</mark>稅率為骨架；<mark class=\"hl\">開徵土增稅區域之土地免契稅</mark>，故實際落在房屋。<mark class=\"hl\">法院拍賣不免徵</mark>，但契價低者從其移轉價格。</p>"], "ck": [{"x": "契稅§2：買賣、承典、交換、贈與、分割、占有取得所有權應課契稅", "h": false}, {"x": "稅率：買賣、贈與、占有6%，典權4%（不是6%），交換、分割2%", "h": true}, {"x": "交換有給付差額價款者，差額依買賣稅率課徵", "h": true}, {"x": "§14 政府因公取得等五款免徵", "h": false}, {"x": "法院拍賣不免徵，仍應申報繳納（§11）", "h": true}, {"x": "§13 移轉價格低於標準價格從其移轉價格；§16 自權利移轉證明書發給日起算", "h": false}, {"x": "開徵土增稅區域之土地免徵契稅：土地課土增稅、房屋課契稅", "h": true}], "mn": "買贈占六、典四、換分二 → 拍賣照課、低者從低 → 土地免契、房屋課"}, {"id": "q-111-一", "no": "111-一", "t": "不動產優先購買權三項規定之要件與性質", "lv": "B", "k": "off", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "關於不動產優先購買權，於土地法中設有明文。請舉出其中三項規定，申述其所定優先購買權之行使要件，並說明其法律性質。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>優先購買權係法律基於特定政策目的，賦予特定權利人<mark class=\"hl\">於同一條件下優先承購之權利</mark>；各規定之性質與效力各有差異。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第34條之1第4項、第104條、第107條；耕地三七五減租條例第15條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）共有土地優先承購權</p><p>債權效力。依<span class=\"art\">第34條之1第4項</span>，共有人出賣其應有部分時，他共有人得<mark class=\"hl\">以同一價格共同或單獨優先承購</mark>。要件：1.共有土地或建築改良物；2.共有人「出賣」應有部分；3.以「同一價格」主張；4.得共同或單獨行使。依執行要點，接到通知後<mark class=\"hl\">15日內不表示者視為放棄</mark>；區分所有建物專有部分連同基地應有部分一併移轉同一人者，無優先承購權。<mark class=\"hl\">性質為債權效力</mark>（最高法院109年度台上大字第2169號裁定），出賣人未通知逕行移轉者，<mark class=\"hl\">移轉仍有效</mark>，他共有人不得請求塗銷登記。</p></div><div class=\"evp\"><p class=\"evh\">（二）基地房屋優先購買權</p><p>物權效力。依<span class=\"art\">第104條第1項</span>，基地出賣時，地上權人、典權人或承租人有<mark class=\"hl\">依同樣條件優先購買之權</mark>；房屋出賣時，基地所有權人亦同。要件：1.基地與房屋分屬不同人，且有地上權、典權或租賃關係；2.須為「出賣」；3.依「同樣條件」；4.接到通知後<mark class=\"hl\">10日內表示</mark>，否則視為放棄（第2項前段）。出賣人未通知而與第三人訂約者，<mark class=\"hl\">其契約不得對抗優先購買權人</mark>（第2項後段），屬物權效力（依條文推論係相對物權效力）。</p></div><div class=\"evp\"><p class=\"evh\">（三）耕地承租人優先承買權</p><p>物權效力。依<span class=\"art\">第107條第1項</span>，出租人出賣或出典耕地時，承租人有<mark class=\"hl\">依同樣條件優先承買或承典之權</mark>；第2項準用<span class=\"art\">第104條第2項</span>。要件：1.有耕地租賃關係；2.出租人出賣或出典；3.依同樣條件；4.接到通知後<mark class=\"hl\">10日內表示</mark>。未通知而與第三人訂約者，其契約不得對抗承租人。三七五耕地另依耕地三七五減租條例<span class=\"art\">第15條</span>，承租人<mark class=\"hl\">15日內未以書面表示承受者視為放棄</mark>，屬特別規定。</p></div>", "<span class=\"blk-l\">四、結論</span><p>三項規定均為同一條件優先承購：第34條之1第4項於共有人出賣應有部分時適用，<mark class=\"hl\">條文未定行使期間，僅具債權效力</mark>；第104條、第107條以基地房屋關係或耕地租賃為要件，<mark class=\"hl\">10日內表示，具物權效力</mark>，違反通知義務者<mark class=\"hl\">其契約不得對抗優先購買權人</mark>。效力差異源於立法目的不同。</p>"], "ck": [{"x": "§34-1Ⅳ 共有人同一價格、共同或單獨優先承購", "h": false}, {"x": "§34-1 期限15日是執行要點，不是條文", "h": true}, {"x": "§104 基地房屋分屬不同人、同樣條件、10日", "h": false}, {"x": "§107 耕地承租人準用§104Ⅱ；三七五§15 書面、15日", "h": true}, {"x": "§34-1Ⅳ 債權效力：移轉仍有效，不得請求塗銷，亦不得依給付不能求償（侵權另論）", "h": false}, {"x": "§104、§107 物權效力：契約不得對抗優先購買權人", "h": false}, {"x": "三項都要寫要件與性質，不能只列名稱", "h": true}], "mn": "共有同價、債權（侵權另論） → 房地同條件、10日不得對抗 → 耕地準用、三七五書面15日", "hp": 1019, "hpl": "中"}, {"id": "q-103-一", "no": "103-一", "t": "預告登記 vs 禁止處分登記", "lv": "B", "k": "off", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "何謂預告登記？何謂禁止處分之登記？試比較說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>預告登記，係請求權人為<mark class=\"hl\">保全</mark>土地權利移轉或消滅、內容或次序變更、附條件或期限之請求權，所為之登記；禁止處分登記，係法院或行政機關依法律<mark class=\"hl\">限制登記名義人處分</mark>其土地權利所為之登記，如查封、假扣押、假處分。二者<mark class=\"hl\">同屬限制登記</mark>，惟一為私法上之請求權保全，一為公法上之處分限制。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第79條之1（預告登記）、第78條第8款（限制登記免繳登記費）；土地登記規則第136條（限制登記之意義與範圍）、第141條第1項（停止新登記及但書例外）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）意義與性質</p><p><mark class=\"hl\">同屬限制登記</mark>。依土地登記規則<span class=\"art\">第136條</span>，限制登記包括預告登記、查封、假扣押、假處分或破產登記，及其他依法律所為禁止處分之登記；依<span class=\"art\">土地法第78條第8款</span>均<mark class=\"hl\">免繳登記費</mark>。例如乙向甲買地約定半年後過戶，為防一地二賣而辦預告登記；甲欠債遭假扣押，則由法院囑託登記。前者保護特定私人請求權，後者確保強制執行、稅捐等公法目的。</p></div><div class=\"evp\"><p class=\"evh\">（二）聲請人不同</p><p><mark class=\"hl\">私人聲請 vs 機關囑託</mark>。依<span class=\"art\">第79條之1第1項</span>，預告登記由請求權人<mark class=\"hl\">檢附登記名義人之同意書</mark>為之；禁止處分登記則由法院或稽徵機關<mark class=\"hl\">依職權囑託辦理</mark>，不以登記名義人同意為要件。</p></div><div class=\"evp\"><p class=\"evh\">（三）效力不同</p><p><mark class=\"hl\">相對無效 vs 停止新登記</mark>。依<span class=\"art\">第79條之1第2項</span>，預告登記未塗銷前，登記名義人所為處分對所登記之請求權<mark class=\"hl\">有妨礙者無效，不妨礙者仍有效</mark>；依土地登記規則<span class=\"art\">第141條第1項</span>，查封、假扣押、假處分等登記未塗銷前，登記機關<mark class=\"hl\">應停止與其權利有關之新登記</mark>。例如甲於預告登記後將土地移轉予丙，對乙無效；土地已遭假扣押者，登記機關即停止受理甲之移轉登記。</p></div><div class=\"evp\"><p class=\"evh\">（四）例外不同</p><p><mark class=\"hl\">預告三種、禁止處分四款</mark>。依<span class=\"art\">第79條之1第3項</span>，預告登記對因徵收、法院判決或強制執行而為之新登記<mark class=\"hl\">無排除效力，繼承不在其內</mark>；依<span class=\"art\">第141條第1項</span>但書，不受停止登記限制者為：<span class=\"evli\">一、徵收、區段徵收或照價收買；</span><span class=\"evli\">二、依法院確定判決申請登記之權利人為原假處分登記之債權人；</span><span class=\"evli\">三、公同共有繼承；</span><span class=\"evli\">四、其他無礙禁止處分之登記。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>預告登記源於私人契約保全，由請求權人<mark class=\"hl\">持登記名義人同意書聲請</mark>，效力為<mark class=\"hl\">相對無效</mark>，對徵收、法院判決、強制執行無排除效力；禁止處分登記源於公權力介入，由法院或機關囑託，<mark class=\"hl\">原則停止新登記</mark>，效力較強，但有<mark class=\"hl\">四款法定例外</mark>。</p>"], "ck": [{"x": "土地法§79-1Ⅰ 預告登記保全三種請求權，屬私法保全", "h": false}, {"x": "土登§136 禁止處分與預告登記同屬限制登記，§78⑧ 免繳登記費", "h": false}, {"x": "聲請人不同：預告由請求權人檢附名義人同意書；禁止處分由法院、稽徵機關囑託", "h": true}, {"x": "預告登記妨礙請求權之處分無效，屬相對無效，不妨礙者仍有效", "h": true}, {"x": "土登§141Ⅰ 查封、假扣押等未塗銷前，登記機關停止與其權利有關之新登記；欠稅禁止處分依稅捐稽徵法§24Ⅰ不得移轉或設定他項權利", "h": false}, {"x": "預告無排除效力只有徵收、法院判決、強制執行三者，繼承不在內", "h": true}, {"x": "預告效力相對有限；禁止處分效力較強但有法定例外", "h": false}], "mn": "預告：私・同意書・相對無效・排除三（徵判執）→ 禁止處分：公・囑託・停止新登記・但書四款", "hp": 1018, "hpl": "中"}, {"id": "q-101-一", "no": "101-一", "t": "土地法第34條之1優先購買權 vs 第104條基地房屋優先購買權比較", "lv": "B", "k": "off", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "土地法第34條之1共有土地之優先購買權與土地法第104條基地或房屋之優先購買權，二者其立法目的、規範內容要件、效力等之差異為何？試比較說明之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>優先購買權係法律賦予特定權利人，<mark class=\"hl\">於同一條件下優先於第三人購買</mark>特定不動產之權利。土地法第34條之1與第104條雖均稱優先購買權，惟立法目的、要件及效力強度均有不同。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第34條之1（第1項多數決、第34條之1第4項優先承購）；土地法第104條第1項、第2項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）立法目的</p><p><mark class=\"hl\">簡化共有關係 vs 房地所有權合一</mark>。<span class=\"art\">第34條之1</span>處理「共有人之間」的關係，以優先承購減少共有人數、避免共有關係複雜化，保障他共有人權益；<span class=\"art\">第104條</span>處理「土地與其上房屋分屬不同人」的關係，旨在促成土地與房屋所有權合一，減少房地分屬不同人所生之法律關係複雜化。</p></div><div class=\"evp\"><p class=\"evh\">（二）要件</p><p><mark class=\"hl\">出賣應有部分 vs 基地或房屋出賣</mark>。<span class=\"art\">第34條之1第4項</span>：①標的為共有土地或建築改良物之應有部分；②須共有人「出賣」其應有部分；③他共有人以「同一價格」共同或單獨承購；條文未定行使期間，依執行要點第13點，接到出賣通知後<mark class=\"hl\">15日內不表示者視為放棄</mark>；區分所有建物之專有部分連同基地應有部分一併移轉同一人者，無優先購買權。至第1項多數決是處分全部共有物之門檻，非優先承購要件。<span class=\"art\">第104條</span>：①基地出賣時，權利人為地上權人、典權人或承租人；房屋出賣時，為基地所有權人；②依「同樣條件」優先購買；③權利人有數人時，<mark class=\"hl\">以登記之先後定順序</mark>（第1項）；④接到出賣通知後<mark class=\"hl\">10日內不表示者，視為放棄</mark>（第2項前段）。</p></div><div class=\"evp\"><p class=\"evh\">（三）效力</p><p><mark class=\"hl\">債權效力 vs 物權效力</mark>。依最高法院109年度台上大字第2169號大法庭裁定及執行要點第13點（五），<span class=\"art\">第34條之1第4項</span>屬債權性質，出賣人未通知而逕行移轉於第三人者，<mark class=\"hl\">移轉仍有效，他共有人不得請求塗銷</mark>，構成侵權行為者得依侵權行為請求。<span class=\"art\">第104條第2項</span>後段明定，未通知而與第三人訂立買賣契約者，<mark class=\"hl\">其契約不得對抗優先購買權人</mark>，屬物權效力（依條文推論係相對物權效力）。</p></div>", "<span class=\"blk-l\">四、結論</span><p>立法目的上，第34條之1在<mark class=\"hl\">簡化共有關係</mark>，第104條在<mark class=\"hl\">使房地所有權合一</mark>；要件上，前者以共有人出賣應有部分、同一價格承購為要件，後者以基地或房屋出賣、同樣條件、接到通知後10日內表示為要件；效力上，前者<mark class=\"hl\">僅具債權效力</mark>，後者<mark class=\"hl\">具物權效力</mark>、買賣契約不得對抗優先購買權人，效力較強。</p>"], "ck": [{"x": "目的：§34-1 簡化共有、保障他共有人；§104 促成房地合一", "h": false}, {"x": "§34-1Ⅰ 多數決是處分全部之門檻，不是Ⅳ優購要件，要分開寫", "h": true}, {"x": "§34-1Ⅳ 共有人出賣應有部分，同一價格、共同或單獨優先承購", "h": false}, {"x": "§34-1 條文未定期間，15日出自執行要點第13點", "h": true}, {"x": "§104 基地出賣→地上權人典權人承租人；房屋出賣→基地所有權人；同樣條件、登記先後、10日", "h": false}, {"x": "§34-1Ⅳ 債權效力（109台上大2169）：移轉仍有效，不得依給付不能求償（侵權另論）", "h": false}, {"x": "§104Ⅱ 契約不得對抗優購權人＝（相對）物權效力，不是債權效力", "h": true}], "mn": "目的：共有簡化 vs 房地合一 → 要件：看Ⅳ不看Ⅰ、要點15日 vs 同樣條件10日 → 效力：債權（侵權另論） vs 不得對抗"}, {"id": "q-101-二", "no": "101-二", "t": "實價登錄申報規範", "lv": "B", "k": "off", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "依平均地權條例規定，政府為建立並提供正常不動產交易價格資訊，要求權利人於不動產所有權移轉時，應申報移轉現值及登錄成交案件實際資訊，其規範要求為何？請闡述之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>實價登錄制度由地政機關建置成交案件申報登錄資料，使民眾得<mark class=\"hl\">查詢實際成交行情</mark>，抑制炒作；移轉現值之申報則是計算土地漲價總數額、<mark class=\"hl\">課徵土地增值稅之基礎</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第47條、第47條之1、第47條之3、第81條之2。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）移轉現值</p><p><mark class=\"hl\">訂約後30日內共同申報</mark>。依<span class=\"art\">第47條第1項</span>，土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起30日內，共同申請登記並共同申報土地移轉現值。依<span class=\"art\">第47條之1第1項</span>，<mark class=\"hl\">30日內申報者以訂約日當期之公告土地現值為準</mark>，逾30日者以受理申報機關收件日當期為準；同條第2項，申報之移轉現值經審核低於公告土地現值者，得<mark class=\"hl\">照其自行申報之移轉現值收買</mark>，或照公告土地現值徵收土地增值稅。</p></div><div class=\"evp\"><p class=\"evh\">（二）成交資訊</p><p><mark class=\"hl\">申請移轉登記時共同申報登錄</mark>。依<span class=\"art\">第47條第2項</span>，買賣案件應於申請所有權移轉登記時，檢附申報書共同申報登錄成交案件實際資訊。預售屋依<span class=\"art\">第47條之3</span>，銷售前應將建案名稱、銷售地點、期間、戶（棟）數及定型化契約報請備查，並應於<mark class=\"hl\">簽訂或解除買賣契約書之日起30日內申報登錄</mark>；委託代銷者，<mark class=\"hl\">簽約之申報登錄由經紀業辦理</mark>，解約之申報仍由銷售者辦理。</p></div><div class=\"evp\"><p class=\"evh\">（三）查詢與查核</p><p>依<span class=\"art\">第47條第3項</span>，申報登錄資訊<mark class=\"hl\">除涉及個人資料外，得提供查詢</mark>，第4項，須相關配套措施完全建立並完成立法後，<mark class=\"hl\">始得為課稅依據</mark>。依第6項，主管機關得向權利人、義務人、地政士或不動產經紀業要求查詢、取閱有關文件或提出說明。</p></div><div class=\"evp\"><p class=\"evh\">（四）罰則</p><p>依<span class=\"art\">第81條之2第1項</span>，未共同申報登錄者先令限期申報；屆期未申報且已辦竣所有權移轉登記者，<mark class=\"hl\">處3萬元以上15萬元以下罰鍰並限期改正</mark>，屆期未改正者按次處罰，經處罰二次仍未改正者，<mark class=\"hl\">按次處30萬元以上100萬元以下罰鍰</mark>；第2項申報登錄價格資訊不實者亦同；第4項價格以外資訊不實者，先令限期改正，屆期未改正<mark class=\"hl\">處6,000元以上3萬元以下罰鍰</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>規範要求為：移轉現值於<mark class=\"hl\">訂約之日起30日內由雙方共同申報</mark>；成交資訊<mark class=\"hl\">於申請移轉登記時共同申報登錄</mark>，預售屋於簽訂或解除契約之日起30日內申報，委託代銷者之簽約申報由經紀業辦理；資訊除個人資料外提供查詢並受主管機關查核；違反者<mark class=\"hl\">處3萬元以上15萬元以下罰鍰並按次處罰</mark>。</p>"], "ck": [{"x": "平均§47Ⅰ：訂約日起30日內雙方共同申報移轉現值（不是15日或60日）", "h": true}, {"x": "§47-1：30日內以訂約日、逾期以收件日當期公告現值；低報得照價收買或照公告現值課徵", "h": false}, {"x": "§47Ⅱ：一般買賣於申請移轉登記時，權利人及義務人共同申報登錄", "h": false}, {"x": "預售屋是簽訂或解除契約30日內申報，代銷之簽約由經紀業辦，不可與成屋時點混寫", "h": true}, {"x": "現行除個資外提供查詢、門牌地號完整揭露，不再寫區段化、去識別化", "h": true}, {"x": "§81-2：未申報先限期，屆期未報處3萬～15萬，處罰2次未改30萬～100萬", "h": false}, {"x": "制度兼顧交易資訊透明與個人資料保護", "h": false}], "mn": "30日共同報現值 → 訂約日／收件日審核 → 登記時報實價（預售30日、代銷經紀業）→ 除個資公開 → 先限期再罰3～15萬", "hp": 11, "hpl": "高"}, {"id": "mk-1", "no": "模1", "t": "模擬試題｜私法人購買住宅：購買前程序與登記後第三年出售", "lv": "模", "k": "mock", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "一、甲股份有限公司（私法人）擬購買一戶登記用途為「住宅」之房屋，作為員工宿舍使用。試問甲公司購買該房屋前，是否有應踐行之程序？甲公司辦竣所有權登記後第三年，擬將該房屋出售予乙並辦理所有權移轉登記，是否可行？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>為防止私法人藉購買住宅囤積、炒作，平均地權條例於112年修正增訂第79條之1，對私法人買受供住宅使用之房屋採<mark class=\"hl\">「事前許可」</mark>及<mark class=\"hl\">「取得後一定期間限制處分」</mark>之雙重管制。本題甲為股份有限公司，屬私法人。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第79條之1第1項至第3項；私法人買受供住宅使用之房屋許可辦法第4條、第11條、第14條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）購買前應檢具使用計畫，經內政部許可</p><p>依<span class=\"art\">平均地權條例第79條之1第1項</span>，「私法人買受供住宅使用之房屋，<mark class=\"hl\">應檢具使用計畫，經中央主管機關許可</mark>。但私法人經中央主管機關公告免經許可之情形者，不在此限。」甲為私法人，所購房屋登記用途為住宅，作員工宿舍使用，屬「供住宅使用之房屋」；題目未載屬免經許可之情形，故<mark class=\"hl\">原則上須申請許可</mark>。用途為宿舍者，依許可辦法<span class=\"art\">第4條</span>，申請戶數及已取得戶數合計<mark class=\"hl\">不得超過經常僱用員工數</mark>，且以成屋為原則。</p></div><div class=\"evp\"><p class=\"evh\">（二）許可文件1年內有效</p><p>依<span class=\"art\">第79條之1第2項</span>，「前項<mark class=\"hl\">許可之文件有效期限為一年</mark>。」成屋自許可日之次日起算（許可辦法<span class=\"art\">第11條</span>），甲應於有效期限內檢附許可文件辦理所有權移轉登記（許可辦法<span class=\"art\">第14條第1項</span>）；「<mark class=\"hl\">未取得許可者，不得辦理登記</mark>；逾許可之有效期限者，亦同。」</p></div><div class=\"evp\"><p class=\"evh\">（三）登記後第三年出售予乙不可行</p><p>依<span class=\"art\">第79條之1第3項</span>，「私法人取得第一項房屋，<mark class=\"hl\">於登記完畢後五年內不得辦理移轉、讓與或預告登記</mark>。但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。」甲辦竣登記後僅第三年，仍在5年限制期間內；出售予乙屬一般買賣，非法定例外，故<mark class=\"hl\">不得辦理所有權移轉登記</mark>，亦不得以預告登記先為乙保全移轉請求權。</p></div><div class=\"evp\"><p class=\"evh\">（四）違反時之效果</p><p>依平均地權條例罰則章，<mark class=\"hl\">並無處罰</mark>違反<span class=\"art\">第79條之1</span>之規定，此一管制係<mark class=\"hl\">在登記端把關</mark>，作答時不宜自行寫出罰鍰金額。</p></div>", "<span class=\"blk-l\">四、結論</span><p>甲公司為私法人，購買供住宅使用之房屋作員工宿舍，除屬內政部公告免經許可之情形外，<mark class=\"hl\">購買前應檢具使用計畫經內政部許可</mark>，<mark class=\"hl\">許可文件1年內有效</mark>。甲登記完畢後第三年將房屋出售予乙，仍在5年限制期間內，且非強制執行、徵收、法院判決等法定例外，<mark class=\"hl\">不得辦理移轉登記及預告登記</mark>，<mark class=\"hl\">須待屆滿5年</mark>始得為之。</p>", "<span class=\"blk-l\">一、定義</span><p><p>私法人買受供住宅使用之房屋，屬平均地權條例對「私法人購買住宅」的管制：為防止藉購買住宅囤房炒作、影響一般民眾居住權益，原則須先經中央主管機關許可，且取得後五年內限制處分。</p></p>", "<span class=\"blk-l\">二、法條</span><p><p>（一）購買前程序（平均地權§79-1）：</p><p>１.原則應經許可：私法人買受供住宅使用之房屋，應檢具使用計畫，經中央主管機關（內政部）許可。</p><p>２.例外免經許可：屬中央主管機關公告免經許可之情形者，不在此限。</p><p>３.審核方式：中央主管機關為審核許可案件，得遴聘（派）專家學者、民間團體及相關機關代表，以合議制方式辦理。</p><p>（二）處分限制（§79-1）：私法人取得前項房屋後，於登記完畢後五年內，不得辦理移轉、讓與或預告登記。但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。</p></p>", "<span class=\"blk-l\">三、涵攝分析</span><p><p>（一）本題甲公司為私法人，擬買受供住宅使用之房屋，購買目的為員工宿舍，不屬中央主管機關公告免經許可之情形，故應檢具使用計畫，經中央主管機關許可；許可文件有效期限為一年。</p><p>（二）甲公司辦竣所有權登記後僅三年，仍在法定五年限制期間內；其欲基於一般買賣將房屋移轉予乙，又無強制執行、徵收、法院判決或其他法律規定之例外情形，原則上不得辦理該房屋之所有權移轉登記。</p></p>", "<span class=\"blk-l\">四、結論</span><p><p>（一）購買前有應踐行程序：須檢具使用計畫，經中央主管機關（內政部）許可（非公告免許可情形）。（二）登記後第三年不可行：五年內不得辦理移轉、讓與或預告登記，除非符合強制執行、徵收、法院判決或其他法律規定之例外。</p></p>"], "ck": [{"x": "甲為股份有限公司屬私法人，員工宿舍屬供住宅使用之房屋", "h": false}, {"x": "平均§79-1Ⅰ 檢具使用計畫經中央主管機關許可（條號不是§79-2 或§81-2）", "h": true}, {"x": "§79-1Ⅱ 許可文件有效期限1年", "h": false}, {"x": "§79-1Ⅲ 登記完畢後5年內不得移轉、讓與或預告登記", "h": false}, {"x": "5年從「登記完畢」起算，不是從買賣契約起算", "h": true}, {"x": "預告登記也在禁止之列", "h": true}, {"x": "第三年出售不可行；罰則章無處罰§79-1，不要寫罰鍰", "h": false}], "mn": "先許可 → 1年有效 → 登記後5年不移、不讓、不預告", "hp": 8, "hpl": "高"}, {"id": "pr-03", "no": "預P03", "t": "實價登錄、預售屋買賣管理、私法人購屋", "lv": "高", "k": "pred", "tier": 0, "g": "土地登記・優先購買權・實價登錄", "q": "依平均地權條例，不動產交易申報登錄、預售屋買賣及私法人購屋各有何規範？經紀人（代銷業）有何義務？", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>平均地權條例以資訊透明與管制投機為主軸，建立三道機制：<mark class=\"hl\">成交實價申報登錄、預售屋買賣管理、私法人購買住宅許可</mark>。經紀業直接參與交易，須掌握各自之義務與罰則。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第47條、第47條之3、第47條之4、第79條之1、第81條之2、第81條之3。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）實價登錄</p><p>買賣雙方於<mark class=\"hl\">申請移轉登記時共同申報</mark>。依<span class=\"art\">第47條第1項</span>，權利人及義務人應於訂約之日起30日內共同申請登記並申報移轉現值；依第2項，買賣案件應於申請所有權移轉登記時，共同申報登錄成交實際資訊。未申報經限期仍未申報且已辦竣移轉登記者，依<span class=\"art\">第81條之2第1項</span><mark class=\"hl\">處3萬元以上15萬元以下罰鍰</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）預售屋</p><p><mark class=\"hl\">備查、定金書面化、禁止轉售</mark>。依<span class=\"art\">第47條之3第1項</span>，銷售前應以書面報請主管機關備查；第2項，簽訂或解除契約之日起<mark class=\"hl\">30日內申報登錄</mark>，委託代銷者，簽約之申報由經紀業辦理。依第5項，收受定金應以書面契據確立標的及價金，委託代銷者亦同；第6項，該契據<mark class=\"hl\">買受人不得轉售</mark>。依<span class=\"art\">第47條之4</span>，<mark class=\"hl\">簽約後不得讓與或轉售契約</mark>，但配偶、直系血親或二親等內旁系血親間，或經公告並核准者，不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（三）私法人購屋</p><p><mark class=\"hl\">許可＋5年</mark>。依<span class=\"art\">第79條之1</span>，私法人買受住宅應檢具使用計畫經中央主管機關許可，許可文件<mark class=\"hl\">有效期限1年</mark>；<mark class=\"hl\">登記完畢5年內不得移轉、讓與或預告登記</mark>，但強制執行、徵收、法院判決等不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（四）經紀業義務</p><p>先分仲介與代銷。一般仲介之買賣案件，申報義務人為權利人及義務人，<mark class=\"hl\">仲介業無申報義務</mark>。代銷業：①<mark class=\"hl\">簽約之申報登錄由其辦理</mark>，未依限申報或價格等不實，依<span class=\"art\">第81條之2第2項</span>處3萬元以上15萬元以下罰鍰；②受查核不得規避、妨礙或拒絕（<span class=\"art\">第47條第6項</span>）；③不得經手轉售，違反<span class=\"art\">第47條之4</span>者依<span class=\"art\">第81條之3</span><mark class=\"hl\">處50萬元以上300萬元以下罰鍰</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>三項制度分管<mark class=\"hl\">「交易資訊」、「預售屋銷售與轉售」、「私法人持有期間」</mark>。經紀業應依期限申報、定金書面化、不協助違規轉售、據實登錄，並提醒客戶私法人購屋之<mark class=\"hl\">許可與5年限制</mark>。</p>"], "ck": [{"x": "平均§47Ⅱ 買賣於申請移轉登記時由雙方共同申報登錄", "h": false}, {"x": "§47-3Ⅱ 簽約或解約30日內申報；代銷者簽約申報由經紀業辦，解約仍由銷售者", "h": false}, {"x": "定金書面契據不得轉售，沒有親屬例外", "h": true}, {"x": "每2年1戶只適用中央公告經核准之例外；親屬間讓與無戶數限制", "h": true}, {"x": "§79-1 許可文件有效1年、登記後5年內不得移轉，兩個期限不可混", "h": true}, {"x": "代銷未依限申報或資訊不實處3萬～15萬，二次未改30萬～100萬（§81-2Ⅱ）", "h": false}, {"x": "經紀人義務：依期限申報、據實登錄、定金書面化、不協助違規轉售、配合查核", "h": false}], "mn": "登錄（雙方共同）→ 預售（備查・30日・定金書面・禁轉售）→ 私法人（許可1年・5年禁移轉）→ 代銷（申報・查核・不協助轉售）", "hp": 9, "hpl": "高"}, {"id": "pr-04", "no": "預P04", "t": "預告登記、限制登記、禁止處分登記", "lv": "高", "k": "pred", "tier": 0, "g": "土地登記・優先購買權・實價登錄", "q": "試比較預告登記與禁止處分登記之申請人、性質、效力，並說明預告登記無排除效力之情形。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>預告登記與禁止處分登記同屬限制登記，都會限制登記名義人之處分，但前者是私人為<mark class=\"hl\">保全「請求權」</mark>所為，後者是<mark class=\"hl\">公權力機關依法律限制處分</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第79條之1、第78條第8款；土地登記規則第136條、第141條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）申請人</p><p><mark class=\"hl\">同意書 vs 機關囑託</mark>。依<span class=\"art\">土地法第79條之1第1項</span>，預告登記由請求權人<mark class=\"hl\">檢附登記名義人之同意書聲請</mark>；禁止處分登記屬土地登記規則<span class=\"art\">第136條第2項</span>之查封、假扣押、假處分、破產登記及其他依法律所為禁止處分之登記，由法院、行政執行分署或稽徵機關<mark class=\"hl\">囑託辦理</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙買甲地尚未過戶，得檢附甲同意書申請預告登記；甲欠稅，則由稽徵機關囑託禁止處分，無須甲同意。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）性質與保全對象</p><p>依土地登記規則<span class=\"art\">第136條第1項</span>，限制登記謂限制登記名義人處分其土地權利所為之登記，兩者皆屬之，依<span class=\"art\">土地法第78條第8款</span><mark class=\"hl\">免繳登記費</mark>。預告登記保全三類請求權：<mark class=\"hl\">移轉或消滅、內容或次序變更、附條件或期限</mark>；禁止處分登記則確保稅捐或債權之執行。</p></div><div class=\"evp\"><p class=\"evh\">（三）效力</p><p><mark class=\"hl\">相對無效 vs 停止新登記</mark>。依<span class=\"art\">第79條之1第2項</span>，預告登記未塗銷前，名義人之處分對所登記之請求權<mark class=\"hl\">有妨礙者無效，不妨礙者仍有效</mark>。依土地登記規則<span class=\"art\">第141條第1項</span>，查封、假扣押、假處分、破產登記等未塗銷前，登記機關<mark class=\"hl\">應停止與其權利有關之新登記</mark>，但徵收、區段徵收或照價收買、依確定判決之原假處分債權人、公同共有繼承、其他無礙禁止處分之登記，不在此限。</p></div><div class=\"evp\"><p class=\"evh\">（四）預告登記無排除效力之情形</p><p>依<span class=\"art\">第79條之1第3項</span>，對於因徵收、法院判決或強制執行而為之新登記，<mark class=\"hl\">無排除之效力</mark>；<mark class=\"hl\">繼承不在條文所列</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙有預告登記，A地嗣後被徵收或經強制執行由戊拍定，仍得登記。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>預告登記源於私人同意，<mark class=\"hl\">僅使妨礙請求權之處分無效</mark>，且<mark class=\"hl\">對徵收、判決、強制執行無排除效力</mark>；禁止處分登記源於公權力，<mark class=\"hl\">原則停止新登記</mark>，效力較強，但亦有法定例外。</p>"], "ck": [{"x": "§79-1Ⅰ 預告登記由請求權人檢附登記名義人同意書申請", "h": false}, {"x": "禁止處分由法院、行政執行分署、稽徵機關囑託，不須名義人同意", "h": false}, {"x": "土登§136 兩者同屬限制登記（土地法§78⑧免登記費）", "h": false}, {"x": "三類請求權：移轉或消滅、內容或次序變更、附條件或期限（不可漏最後一類）", "h": true}, {"x": "預告只使妨礙請求權者無效；禁止處分停止新登記，效力較強，不可說反", "h": true}, {"x": "土登§141 例外：徵收・區段徵收・照價收買、假處分債權人勝訴、公同共有繼承、無礙之登記", "h": false}, {"x": "§79-1Ⅲ 對徵收、法院判決、強制執行無排除效力，繼承不在內", "h": true}], "mn": "同意書 vs 囑託 → 同屬限制登記、保全三類 → 相對無效 vs 停止新登記 → 排除三：徵・判・執", "hp": 1020, "hpl": "中"}, {"id": "pr-18", "no": "預P18", "t": "預告登記：保全的請求權、申請方式與效力（§79-1）", "lv": "高", "k": "pred", "tier": 0, "g": "土地登記・優先購買權・實價登錄", "q": "何謂預告登記？得保全何種請求權？如何申請？預告登記後，登記名義人之處分效力如何？有何例外？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>契約成立至登記完成之間有空窗期，登記名義人仍可能另行處分。預告登記即為保全請求權人，在登記簿上<mark class=\"hl\">預先公示並限制名義人之處分</mark>，屬限制登記之一。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第79條之1、第78條第8款；土地登記規則第136條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）性質</p><p>依土地登記規則<span class=\"art\">第136條第1項</span>，限制登記謂限制登記名義人處分其土地權利所為之登記；第2項明列<mark class=\"hl\">包括預告登記</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>乙向甲買地已付價金但未過戶，得聲請預告登記，防止一地二賣。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得保全之請求權</p><p>依<span class=\"art\">土地法第79條之1第1項</span>，<mark class=\"hl\">限於三類</mark>：1.關於土地權利<mark class=\"hl\">移轉或使其消滅</mark>之請求權；2.土地權利<mark class=\"hl\">內容或次序變更</mark>之請求權；3.<mark class=\"hl\">附條件或期限</mark>之請求權。</p><p class=\"evx\"><span class=\"evt\">例</span><span>買受人請求移轉所有權屬第1款；抵押權人依約請求變更次序屬第2款。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）申請方式</p><p>依同條第1項，應由請求權人<mark class=\"hl\">檢附登記名義人之同意書</mark>為之；依<span class=\"art\">第78條第8款</span>，<mark class=\"hl\">限制登記免納登記費</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>預告登記限制名義人之處分自由，須以其同意為基礎。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）效力——相對無效</p><p>依同條第2項，預告登記未塗銷前，登記名義人就其土地所為之處分，<mark class=\"hl\">對於所登記之請求權有妨礙者無效</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲於預告登記後將土地另賣丙並移轉，妨礙乙之移轉請求權而無效；不妨礙者仍有效。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）例外</p><p>依同條第3項，預告登記對於因徵收、法院判決或強制執行而為之新登記，<mark class=\"hl\">無排除之效力</mark>；條文僅列此三者，<mark class=\"hl\">繼承不在其內</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲之債權人聲請強制執行，拍定人取得登記，乙不能排除。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>預告登記以公示保全<mark class=\"hl\">三類請求權</mark>，須檢附<mark class=\"hl\">名義人同意書</mark>聲請、免納登記費；未塗銷前<mark class=\"hl\">妨礙請求權之處分無效</mark>，但對徵收、法院判決、強制執行之新登記<mark class=\"hl\">不生排除效力</mark>。</p>"], "ck": [{"x": "土登規則§136：預告登記屬限制登記，限制名義人處分", "h": false}, {"x": "§79-1Ⅰ 三類都要寫：移轉或消滅、內容或次序變更、附條件或期限", "h": true}, {"x": "請求權人檢附登記名義人同意書聲請；§78⑧ 免繳登記費", "h": false}, {"x": "妨礙所登記請求權之處分才無效＝相對無效，不是絕對無效", "h": true}, {"x": "§79-1Ⅲ 無排除效力只限徵收、法院判決、強制執行，繼承不在內", "h": true}, {"x": "預告登記以公示保全請求權，但不排除公權力作用之新登記", "h": false}], "mn": "移・變・附 → 同意書、免登記費 → 妨礙才無效（相對）→ 擋不住：徵・判・執", "hp": 1021, "hpl": "中"}, {"id": "pr-20", "no": "預P20", "t": "土地登記之效力與損害賠償：絕對效力、賠償責任、免責與更正（§43、§68～71）", "lv": "高", "k": "pred", "tier": 0, "g": "土地登記・優先購買權・實價登錄", "q": "何謂土地登記之絕對效力？因登記錯誤、遺漏或虛偽致人受損害，由何者負賠償責任？有何免責事由？賠償財源與內部求償如何安排？發現登記錯誤時如何更正？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>土地登記為權利公示之依據，交易相對人依登記簿判斷權利狀態。依土地法第43條，依本法所為之<mark class=\"hl\">登記有絕對效力</mark>；依第68條第1項，因登記錯誤遺漏或虛偽致受損害者，<mark class=\"hl\">由該地政機關負損害賠償責任</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第43條、第68條、第69條、第70條、第71條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）絕對效力</p><p>依<span class=\"art\">第43條</span>，依本法所為之登記，<mark class=\"hl\">有絕對效力</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>登記簿載A地為乙所有，丙信賴登記向乙購買並完成移轉，丙之取得受保護。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）賠償責任</p><p>依<span class=\"art\">第68條第1項</span>本文，因登記錯誤、遺漏或虛偽致受損害者，<mark class=\"hl\">由該地政機關負損害賠償責任</mark>。要件：登記有錯誤遺漏或虛偽、受有損害、損害因該登記所致。<mark class=\"hl\">賠償主體是地政機關</mark>，不是申請人或代理人。</p></div><div class=\"evp\"><p class=\"evh\">（三）免責</p><p>依同項但書，地政機關證明其原因<mark class=\"hl\">應歸責於受害人時，不負賠償責任</mark>，<mark class=\"hl\">舉證責任在地政機關</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）範圍與財源</p><p>依<span class=\"art\">第68條第2項</span>，賠償<mark class=\"hl\">不得超過受損害時之價值</mark>；依<span class=\"art\">第70條第1項</span>，登記費應<mark class=\"hl\">提存10%作為登記儲金</mark>，專備賠償之用。</p></div><div class=\"evp\"><p class=\"evh\">（五）內部求償</p><p>依<span class=\"art\">第70條第2項</span>，損害因登記人員之重大過失所致者，<mark class=\"hl\">由該人員償還</mark>，撥歸登記儲金。</p></div><div class=\"evp\"><p class=\"evh\">（六）救濟</p><p>依<span class=\"art\">第71條</span>，請求經地政機關拒絕者，<mark class=\"hl\">得向司法機關起訴</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（七）更正</p><p>依<span class=\"art\">第69條</span>，登記完畢後發見錯誤或遺漏，<mark class=\"hl\">非以書面聲請該管上級機關查明核准後，不得更正</mark>；但純屬登記人員記載時之疏忽，並有原始登記原因證明文件可稽者，<mark class=\"hl\">由登記機關逕行更正</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>契約載100平方公尺誤載為10平方公尺，得逕行更正。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">登記具絕對效力</mark>；錯誤、遺漏、虛偽之損害<mark class=\"hl\">由地政機關賠償</mark>，歸責於受害人者免責，<mark class=\"hl\">以受損害時價值為上限</mark>，財源為登記儲金，重大過失由人員償還，被拒得起訴。<mark class=\"hl\">更正原則須上級機關核准</mark>，記載疏忽且有原始文件可稽者得逕行更正。</p>"], "ck": [{"x": "§43 依土地法所為之登記有絕對效力", "h": false}, {"x": "賠償主體是地政機關，不是申請人或代理人", "h": true}, {"x": "免責事由是「原因應歸責於受害人」，不是善意", "h": true}, {"x": "§71 請求被拒得向司法機關起訴", "h": false}, {"x": "§68Ⅱ 賠償不得超過受損害時之價值；§70Ⅰ 登記費提存10%為登記儲金", "h": true}, {"x": "§70Ⅱ 重大過失由人員償還，與機關非連帶", "h": true}, {"x": "§69 書面聲請上級機關核准；純屬記載疏忽有原始文件可稽者逕行更正", "h": false}], "mn": "錯漏偽，機關賠 → 受害人自己錯，免 → 賠到受損時價值、儲金10% → 重大過失人員還 → 更正找上級", "hp": 1022, "hpl": "中"}, {"id": "pr-23", "no": "預P23", "t": "共有土地多數決處分（§34-1）情境題：要件、通知、對價、他共有人優先承購", "lv": "高", "k": "pred", "tier": 0, "g": "土地登記・優先購買權・實價登錄", "q": "甲、乙、丙、丁共有A地，應有部分依序為1/2、1/6、1/6、1/6。甲、乙欲將A地全部出售予戊，丙、丁反對。請問：（一）甲、乙得否依土地法第34條之1出售A地全部？其程序要件為何？（二）丙、丁應得之價金如何處理？（三）若甲僅出售自己之應有部分予戊，丙、丁有何權利？其效力如何？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、定義</span><p>共有物之處分，依民法第819條第2項原應得共有人全體同意。土地法第34條之1設<mark class=\"hl\">多數決之特別規定</mark>，並課予同意之共有人通知、對價保障等義務，兼顧土地利用與少數共有人之財產權。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第34條之1第1項（共有人過半數及應有部分合計過半數；應有部分合計逾三分之二者，人數不予計算）、第2項（事先書面通知，不能通知者公告）、第3項（對價或補償負連帶清償責任，登記時提出已受領或提存證明）、第4項（出賣應有部分時，他共有人得以同一價格共同或單獨優先承購）；民法第819條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲、乙不得出售全部</p><p>共有人4人，甲、乙2人，人數未過半；應有部分1/2＋1/6＝2/3，<mark class=\"hl\">僅「達」而未「逾」三分之二</mark>，兩種門檻均不符，仍須依民法<span class=\"art\">第819條第2項</span><mark class=\"hl\">得全體同意</mark>。若另得丙同意，人數3人過半、應有部分5/6過半，即得處分全部，但<mark class=\"hl\">應事先以書面通知丁</mark>，不能通知者應公告。</p></div><div class=\"evp\"><p class=\"evh\">（二）價金處理</p><p>依第3項，同意之共有人對不同意者應得之對價<mark class=\"hl\">負連帶清償責任</mark>；辦理權利變更登記時，應提出他共有人<mark class=\"hl\">已受領或為其提存之證明</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲、乙、丙以6,000萬元出售予戊，丁應得之1,000萬元由甲、乙、丙連帶清償，登記時附丁已受領或已提存之證明。若甲、乙未達門檻逕行出售，即無本項之適用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲只賣應有部分</p><p>此非第1項之全部處分，而屬第4項應有部分之出賣，丙、丁得<mark class=\"hl\">以戊之同一價格共同或單獨優先承購</mark>；此權利條文未如第104條第2項後段明定「不得對抗」，故<mark class=\"hl\">僅具債權效力</mark>：甲違反而移轉登記予戊者，<mark class=\"hl\">移轉仍有效</mark>，丙、丁不得請求塗銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>共有人本得自由處分其應有部分（民法<span class=\"art\">第819條第1項</span>）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲、乙未達第34條之1門檻，<mark class=\"hl\">不得出售A地全部</mark>；取得多數者須書面通知或公告，並對少數共有人之價金<mark class=\"hl\">負連帶清償</mark>、登記時附受領或提存證明。甲僅出賣應有部分時，丙、丁有同一價格之優先承購權，但<mark class=\"hl\">僅具債權效力</mark>。</p>"], "ck": [{"x": "民法§819Ⅱ 原須全體同意；§34-1Ⅰ 雙過半或應有部分逾2/3（不含抵押權）", "h": false}, {"x": "甲乙人數2/4未過半、應有部分2/3只「達」未「逾」→不得賣全部", "h": true}, {"x": "若取得丙同意（3人、5/6）即可，須依§34-1Ⅱ 事先書面通知丁，不能通知者公告", "h": false}, {"x": "§34-1Ⅲ 同意者對他共有人價金負連帶清償，登記附受領或提存證明", "h": true}, {"x": "§34-1Ⅳ 甲賣應有部分，丙丁得以同一價格共同或單獨優先承購", "h": false}, {"x": "執行要點：接到通知15日內不表示視為放棄", "h": false}, {"x": "優購權僅債權效力（109台上大2169）：移轉有效、不得塗銷，不得依給付不能求償（侵權另論）", "h": true}], "mn": "人過半、分過半，或分逾三分二 → 通知（不能就公告）→ 連帶＋提存 → 賣應有部分：同價優購、債權（侵權另論）", "hp": 1023, "hpl": "中"}, {"id": "pr-08", "no": "預P08", "t": "繼承登記逾期列冊管理與標售", "lv": "中", "k": "pred", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "繼承開始後逾一年未辦繼承登記，地政機關得如何處理？標售時繼承人、合法使用人及其他共有人各有何權利？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>繼承後長期不辦繼承登記，依土地法第73條之1第1項，指土地或建築改良物自繼承開始之日起<mark class=\"hl\">逾1年未辦理繼承登記</mark>之情形。土地法第73條之1建立<mark class=\"hl\">「公告催辦、列冊管理、公開標售」</mark>的處理機制，同時保障繼承人的優先購買權與價款請求權。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第73條之1第1項至第5項。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）逾1年未辦登記，公告並列冊管理</p><p>依<span class=\"art\">土地法第73條之1第1項</span>，「<mark class=\"hl\">自繼承開始之日起逾一年未辦理繼承登記者</mark>」，地政機關查明後應即公告繼承人<mark class=\"hl\">於3個月內聲請登記</mark>，並以書面通知；逾期仍未聲請者得<mark class=\"hl\">列冊管理</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲於110年1月死亡，繼承人逾1年未辦登記，地政機關即應公告並通知。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>促使繼承人儘速辦理登記，避免地籍與實際權利人不符。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）列冊15年後公開標售</p><p>依第2項，<mark class=\"hl\">列冊管理期間為15年</mark>，逾期仍未聲請者，移請財政部國有財產署<mark class=\"hl\">公開標售</mark>；標售前應<mark class=\"hl\">公告3個月</mark>（第3項）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以標售使長期閒置之土地回歸市場。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）再標售與登記國有</p><p>依第5項，無人應買或最高價未達最低價額者，由國有財產署定期再標售，酌減數額<mark class=\"hl\">不得逾20%</mark>；<mark class=\"hl\">經五次標售而未標出者，登記為國有</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>底價1,000萬元無人應買，再標售最低得減至800萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免土地無限期閒置。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）繼承人之權利</p><p>依第3項，繼承人、合法使用人或其他共有人就其使用範圍<mark class=\"hl\">依序有優先購買權</mark>，未於<mark class=\"hl\">決標後30日內</mark>表示者視為放棄；依第4項，價款於國庫設立專戶儲存，繼承人得依法定應繼分領取，<mark class=\"hl\">逾10年無人提領者歸屬國庫</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>土地雖經標售，仍保障繼承人之財產價值。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）合法使用人、其他共有人與占有人</p><p>合法使用人或其他共有人<mark class=\"hl\">依序次於繼承人</mark>享有優先購買權；依第2項，「繼承人占有或第三人占有無合法使用權者，<mark class=\"hl\">於標售後喪失其占有之權利</mark>」，租賃期間超過5年者，於標售後<mark class=\"hl\">以五年為限</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>丙之租期尚有8年，標售後僅存續5年。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧合法使用人之信賴與標售後土地之利用。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>本制度為<mark class=\"hl\">「逾一年催辦、三個月內聲請、列冊十五年、再公開標售」</mark>，繼承人之保障在<mark class=\"hl\">優先購買權與價款領取權</mark>。經紀人受託買賣繼承不動產時，應先查繼承登記是否完成、有無列冊管理。此制在解決產權長期不明、促進土地利用，同時保障繼承人權益。</p>"], "ck": [{"x": "§73-1Ⅰ 逾1年未辦，公告3個月內聲請並書面通知", "h": false}, {"x": "催辦公告與標售前公告都是3個月，不要混淆", "h": true}, {"x": "列冊管理15年，期滿移請國有財產署公開標售", "h": false}, {"x": "再標售酌減不逾20%，五次未標出登記國有", "h": false}, {"x": "優購順序：繼承人→合法使用人→其他共有人，決標後30日", "h": true}, {"x": "價款領取期限是10年，列冊管理是15年", "h": true}, {"x": "繼承人或第三人無合法使用權之占有喪失；租賃超過5年者以五年為限", "h": false}], "mn": "1年 → 三月 → 15年 → 10年"}, {"id": "pr-19", "no": "預P19", "t": "情境題：買受人聲請預告登記後，出賣人再處分、被執行、被徵收", "lv": "中", "k": "pred", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "甲將土地出賣予乙，約定日後移轉登記，乙為保全請求權辦理預告登記。其後：（一）甲將該地另行出賣並移轉登記予丙；（二）甲之債權人聲請強制執行，該地被拍賣；（三）該地被政府徵收。請分別說明乙之預告登記效力。並說明經紀人遇有預告登記之標的物時，應向買方如何說明。（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>預告登記，係請求權人<mark class=\"hl\">檢附登記名義人之同意書</mark>，為保全土地法第79條之1第1項所列請求權所為之登記；依土地登記規則第136條，屬<mark class=\"hl\">限制登記</mark>名義人處分其土地權利之限制登記。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第79條之1（第1項第1款移轉請求權、第2項妨礙者無效、第3項無排除效力）；土地登記規則第136條；不動產經紀業管理條例第23條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲另賣並移轉予丙，對乙無效</p><p>依<span class=\"art\">土地法第79條之1第1項第1款</span>，關於土地權利移轉之請求權得聲請預告登記；依第2項，「預告登記未塗銷前，登記名義人就其土地所為之處分，<mark class=\"hl\">對於所登記之請求權有妨礙者無效</mark>。」本題甲未經塗銷即將土地移轉登記予丙，使乙之請求權無從實現，<mark class=\"hl\">該處分對乙無效</mark>；此之無效係相對於所登記之請求權而言，不妨礙者仍屬有效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>預告登記之目的，正是防止出賣人於登記前一地二賣，使登記在先之請求權受保全。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）強制執行拍賣，預告登記無排除效力</p><p>依<span class=\"art\">第79條之1第3項</span>，「預告登記，對於因徵收、法院判決或強制執行而為新登記，<mark class=\"hl\">無排除之效力</mark>。」本題該地經法院拍賣，拍定人因強制執行取得所有權而為之登記，<mark class=\"hl\">乙不得以預告登記排除</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）政府徵收，預告登記亦無排除效力</p><p>依同條第3項，因徵收而為之新登記，<mark class=\"hl\">不受乙之預告登記影響</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）經紀人應查登記簿，於說明書揭示預告登記</p><p>依不動產經紀業管理條例<span class=\"art\">第23條第1項</span>，經紀人員在執行業務過程中，應<mark class=\"hl\">以不動產說明書向與委託人交易之相對人解說</mark>；預告登記依土地登記規則<span class=\"art\">第136條第2項</span>屬限制登記。經紀人宜<mark class=\"hl\">於說明書載明標的物有預告登記</mark>、所保全之請求權人，以及未塗銷前妨礙該請求權之處分無效。</p><p class=\"evx\"><span class=\"evt\">例</span><span>經紀人受甲委託出售已有乙預告登記之土地，應明白告知買方：預告登記未塗銷前，即使完成過戶，仍可能因妨礙乙之請求權而無效。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>限制登記直接影響交易標的之權利，買方須在知悉後才能作成合理決定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙之預告登記<mark class=\"hl\">對甲之再處分有效力</mark>，但<mark class=\"hl\">對強制執行與徵收之新登記無排除效力</mark>。經紀人應於不動產說明書載明標的有預告登記及其請求權人，並請買方查閱謄本、<mark class=\"hl\">確認已塗銷再交易</mark>。</p>"], "ck": [{"x": "土地法§79-1Ⅱ 預告登記未塗銷前，妨礙所登記請求權之處分無效", "h": false}, {"x": "甲賣丙對乙相對無效，不是絕對無效；乙仍得向甲請求移轉", "h": true}, {"x": "§79-1Ⅲ 對徵收、法院判決、強制執行之新登記無排除效力", "h": false}, {"x": "三小題要分辨：再處分無效，強制執行與徵收擋不住，不能全答無效或全答有效", "h": true}, {"x": "強制執行拍賣：拍定人之登記不受預告登記阻擋", "h": false}, {"x": "徵收：預告登記亦無排除效力，公益優先", "h": false}, {"x": "經紀人依經紀條例§23 以說明書揭示預告登記（土登§136Ⅱ 限制登記），提醒買方查謄本", "h": true}], "mn": "妨礙無效（§79-1Ⅱ）→ 徵・判・執擋不住（§79-1Ⅲ）→ 說明書揭示限制登記"}, {"id": "pr-48", "no": "預P48", "t": "土地總登記：五步次序、聲請期限、公有土地囑託與逕為登記、時效取得、公告與異議、無主土地（土地法§48～§59）", "lv": "中", "k": "pred", "tier": 1, "g": "土地登記・優先購買權・實價登錄", "q": "何謂土地總登記？其辦理次序為何？由何人聲請？公有土地如何登記？逾登記期限無人聲請之土地如何處理？土地權利關係人對登記公告有異議時如何處理？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>土地總登記，是<mark class=\"hl\">在一定期間內</mark>就直轄市或縣（市）<mark class=\"hl\">轄區土地之全部為登記</mark>。土地法就其辦理次序、聲請期限與聲請人、公有土地之登記、審查公告、異議處理及逾期未聲請土地之處理設有規定。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第48條至第59條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）次序與期限</p><p>依<span class=\"art\">第48條</span>，「土地總登記，依左列次序辦理。一、<mark class=\"hl\">調查地籍</mark>。二、公布登記區及登記期限。三、接收文件。四、審查并公告。五、登記發給書狀并造冊。」辦理前應公布地籍圖（<span class=\"art\">第50條</span>）；依<span class=\"art\">第49條</span>，「每一登記區接受登記聲請之期限，<mark class=\"hl\">不得少於二個月</mark>。」</p></div><div class=\"evp\"><p class=\"evh\">（二）聲請人</p><p>依<span class=\"art\">第51條</span>，<mark class=\"hl\">由土地所有權人於登記期限內</mark>檢同證明文件聲請；他項權利之登記，<mark class=\"hl\">應由權利人及義務人共同聲請</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（三）公有土地</p><p>依<span class=\"art\">第52條</span>，<mark class=\"hl\">由原保管或使用機關囑託</mark>地政機關登記；依<span class=\"art\">第53條</span>，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，<mark class=\"hl\">由地政機關逕為登記</mark>，所有權人欄<mark class=\"hl\">註明為國有</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）審查公告與異議</p><p>依<span class=\"art\">第55條</span>，審查證明無誤應即公告，應補繳證明文件者限期補繳；依<span class=\"art\">第58條第1項</span>，此公告<mark class=\"hl\">不得少於15日</mark>；駁回者得訴請司法機關確認權利（<span class=\"art\">第56條</span>）。依<span class=\"art\">第59條</span>，公告期間內之異議應以書面附證明文件提出，生權利爭執時<mark class=\"hl\">由地政機關調處</mark>，「不服調處者，<mark class=\"hl\">應於接到調處通知後十五日內</mark>，向司法機關訴請處理」。</p></div><div class=\"evp\"><p class=\"evh\">（五）無主土地</p><p>依<span class=\"art\">第57條</span>，逾登記期限無人聲請或經聲請而逾限未補繳證明文件者，「<mark class=\"hl\">其土地視為無主土地</mark>」，公告期滿無人提出異議，即為國有土地之登記；依<span class=\"art\">第58條第2項</span>，此公告<mark class=\"hl\">不得少於30日</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲聲請後逾限未補繳證明文件，視為無主土地，公告30日以上無人異議即登記為國有。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>督促權利人依限聲請。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>土地總登記依<mark class=\"hl\">五步次序</mark>辦理，聲請期限<mark class=\"hl\">不得少於2個月</mark>；公有土地囑託登記，無保管或使用機關者逕為登記為國有；<mark class=\"hl\">一般公告不得少於15日、無主土地公告不得少於30日</mark>，異議由地政機關調處，<mark class=\"hl\">不服者15日內起訴</mark>，兼顧權利保障與地籍確定。</p>"], "ck": [{"x": "§48 五步、§49 2個月", "h": true}, {"x": "§53 逕為登記國有", "h": true}, {"x": "§58 15日 vs 30日", "h": true}], "mn": "〔自編〕查布收審發；公告一般十五、無主三十；沒人要的地歸國有"}, {"id": "pr-09", "no": "預P09", "t": "優先購買權：物權效力 vs 債權效力（補習班框架）", "lv": "低", "k": "pred", "tier": 2, "g": "土地登記・優先購買權・實價登錄", "q": "試比較土地法§34-1、§104、§107 與耕地三七五§15 之優先購買權要件與效力。", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>優先購買權是特定人<mark class=\"hl\">在同樣條件下優先承買</mark>的權利。土地法第34條之1、第104條、第107條與耕地三七五減租條例第15條，立法目的與效力強度各不相同。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第34條之1第4項、第104條、第107條；耕地三七五減租條例第15條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）權利人與目的不同</p><p>依<span class=\"art\">土地法第34條之1第4項</span>，「共有人出賣其應有部分時，他共有人得<mark class=\"hl\">以同一價格共同或單獨優先承購</mark>」；依<span class=\"art\">第104條第1項</span>，基地出賣時，地上權人、典權人或承租人，房屋出賣時，基地所有權人，有<mark class=\"hl\">依同樣條件優先購買之權</mark>，其順序<mark class=\"hl\">以登記之先後定之</mark>；依<span class=\"art\">第107條第1項</span>及耕地三七五減租條例<span class=\"art\">第15條</span>，耕地出賣或出典時，承租人有優先承買或承受之權，<mark class=\"hl\">貶價再賣仍應照辦</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲將出租予乙之耕地出賣，乙得依同樣條件優先承買。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>四者目的不同：<span class=\"art\">第34條之1</span>簡化共有關係，<span class=\"art\">第104條</span>促成房地合一，<span class=\"art\">第107條</span>與三七五<span class=\"art\">第15條</span>保障耕地承租人。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）行使期間不同</p><p>依<span class=\"art\">第104條第2項</span>，「優先購買權人，於接到出賣通知後<mark class=\"hl\">十日內不表示者，其優先權視為放棄</mark>」，<span class=\"art\">第107條第2項</span>準用之；耕地三七五減租條例<span class=\"art\">第15條第1項</span>，承租人在<mark class=\"hl\">15日內未以書面表示承受者</mark>，視為放棄；<span class=\"art\">第34條之1</span>條文未定期間，<mark class=\"hl\">依執行要點為15日</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>三七五耕地承租人於收到書面通知後第十二日以書面表示承受，仍在期間內；非三七五耕地則應於10日內表示。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）效力不同</p><p><span class=\"art\">第34條之1</span><mark class=\"hl\">為債權效力</mark>，依最高法院109年度台上大字第2169號大法庭裁定，出賣人違反時移轉仍有效，他共有人不得請求塗銷；<span class=\"art\">第104條第2項</span>後段明定「<mark class=\"hl\">其契約不得對抗優先購買權人</mark>」，<span class=\"art\">第107條</span>準用之，耕地三七五減租條例<span class=\"art\">第15條第3項</span>亦規定「其契約不得對抗承租人」，<mark class=\"hl\">屬物權效力</mark>（<span class=\"art\">第104條</span>、<span class=\"art\">第107條</span>為相對物權效力）。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲未通知承租人乙即將耕地賣給丙，丙不得以買賣契約對抗乙。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>房地合一及耕地承租人保護具政策目的，故以不得對抗強化效力。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>四種優先購買權的共同點是<mark class=\"hl\">「同樣條件優先承買」</mark>，差別在於目的與效力強度。效力強弱取決於條文<mark class=\"hl\">是否明定「不得對抗」</mark>：第104條第2項後段（第107條第2項準用）及耕地三七五減租條例第15條第3項均明定，故具物權效力；第34條之1第4項未定，<mark class=\"hl\">僅具債權效力</mark>。</p>"], "ck": [{"x": "§34-1Ⅳ 他共有人以同一價格共同或單獨優先承購", "h": false}, {"x": "§34-1 條文未定行使期間，15日是執行要點，不是條文", "h": true}, {"x": "§104 基地出賣→地上權人、典權人、承租人；房屋出賣→基地所有權人；10日", "h": false}, {"x": "§107 是耕地承租人（不是基地承租人），準用§104Ⅱ、10日", "h": true}, {"x": "三七五§15 書面通知、15日內書面表示；貶價再賣仍須通知", "h": false}, {"x": "§34-1 債權效力（109台上大2169）：移轉有效，不得依給付不能求償（侵權另論）", "h": false}, {"x": "§104 寫物權效力（相對），並引「不得對抗」；§107、三七五§15 同", "h": true}], "mn": "同樣條件是共通 → 期間10、15、條文未定 → 有「不得對抗」才是物權"}, {"id": "pr-26", "no": "預P26", "t": "地籍重測與界址爭議：重測原因、指界、公告30日、複丈、調處與起訴", "lv": "低", "k": "pred", "tier": 2, "g": "土地登記・優先購買權・實價登錄", "q": "某地區因地籍原圖破損辦理地籍重測。請說明：（一）得辦理地籍重測之原因；（二）土地所有權人未到場指界時之施測方式，及指界發生界址爭議時之處理；（三）重測結果公告及所有權人之救濟。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>地籍重測係已辦地籍測量之地區，因<mark class=\"hl\">地籍原圖已不堪使用</mark>，重新實施地籍測量，以確保地籍圖與實地相符。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第46條之1（重測原因）、第46條之2（指界與逕行施測）、第46條之3（公告、複丈及標示變更登記）、第59條第2項（調處與起訴）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）原圖破損屬法定重測原因</p><p>依<span class=\"art\">土地法第46條之1</span>，「已辦地籍測量之地區，因<mark class=\"hl\">地籍原圖破損、滅失、比例尺變更或其他重大原因</mark>，得重新實施地籍測量。」本題地籍原圖破損，符合重測原因。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>地籍圖是土地權利範圍之依據，原圖不堪使用時，須重新測量以確保地籍圖與實地相符。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）未到場指界者，依四順序逕行施測</p><p>依<span class=\"art\">第46條之2第1項</span>，土地所有權人應於地政機關通知之限期內，<mark class=\"hl\">自行設立界標並到場指界</mark>；逾期不設立界標或到場指界者，得依鄰地界址、現使用人之指界、參照舊地籍圖、地方習慣之順序<mark class=\"hl\">逕行施測</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲逾期未到場指界，地政機關先依鄰地乙已指界之界址施測。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>重測須全區一併完成，不能因個別所有權人不配合而停滯，故明定補充之施測順序。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）界址爭議先調處，不服者15日內起訴</p><p>依<span class=\"art\">第46條之2第2項</span>，因設立界標或到場指界發生界址爭議時，準用<span class=\"art\">第59條第2項</span>，由該管直轄市或縣（市）地政機關<mark class=\"hl\">予以調處</mark>，不服調處者，應於<mark class=\"hl\">接到調處通知後15日內</mark>向司法機關訴請處理，逾期不起訴者，<mark class=\"hl\">依原調處結果辦理</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以調處先行，迅速解決多數爭議，並以短期起訴期限避免重測結果長期懸而未決。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）結果公告30日，期間內得聲請複丈一次</p><p>依<span class=\"art\">第46條之3</span>，重測結果應予公告，<mark class=\"hl\">其期間為30日</mark>；所有權人認為測量結果有錯誤，除未依規定設立界標或到場指界者外，得於公告期間內繳納複丈費<mark class=\"hl\">聲請複丈</mark>，<mark class=\"hl\">經複丈者不得再聲請複丈</mark>；確定後據以辦理土地標示變更登記。</p><p class=\"evx\"><span class=\"evt\">例</span><span>甲曾逾期未到場指界，即不得聲請複丈；乙曾到場指界，得於公告30日內繳費聲請複丈一次。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>未盡協力義務者不應再爭執測量結果，並使重測結果早日確定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>地籍重測以原圖不堪用為原因，程序重在所有權人<mark class=\"hl\">自行設界標、指界</mark>；爭議依調處及<mark class=\"hl\">15日內起訴</mark>解決。結果<mark class=\"hl\">公告30日</mark>，<mark class=\"hl\">得聲請複丈一次</mark>，確定後辦理標示變更登記。</p>"], "ck": [{"x": "原圖破損符合§46-1；界址糾紛不是重測原因", "h": true}, {"x": "§46-2Ⅰ 限期自行設立界標並到場指界", "h": false}, {"x": "逕行施測順序：鄰地界址→現使用人指界→舊地籍圖→地方習慣", "h": true}, {"x": "界址爭議準用§59Ⅱ 調處，不服於接到通知後15日內起訴", "h": false}, {"x": "§46-3 結果公告30日，期間內繳費聲請複丈", "h": false}, {"x": "未設界標或未到場指界者不得聲請複丈，經複丈者不得再聲請", "h": true}, {"x": "逾期未聲請或複丈確定後，辦理土地標示變更登記", "h": false}], "mn": "破滅比例（原因）→ 鄰、使、舊、習（逕測）→ 調處15日 → 公告30日、複丈一次"}, {"id": "q-106-二", "no": "106-二", "t": "非都市土地使用管制結構＋公共設施保留地地價稅＋取得方式", "lv": "B", "k": "off", "tier": 1, "g": "地權總則・農地・非都市管制", "q": "試依區域計畫法之規定，說明非都市土地使用管制之結構為何？又，依土地稅法之規定，都市計畫公共設施保留地之地價稅如何課徵？依都市計畫法之規定，私有公共設施保留地之取得方式為何？以上三問，請依序分別說明之。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>非都市土地使用管制，係就都市計畫範圍外之土地<mark class=\"hl\">劃定使用分區並編定使用地類別</mark>，以落實土地合理利用；公共設施保留地則透過特殊稅捐待遇及法定取得方式，兼顧所有權人權益與用地取得。</p>", "<span class=\"blk-l\">二、法條</span><p>區域計畫法第15條、第21條；非都市土地使用管制規則第2條、第3條、第6條；土地稅法第19條；都市計畫法第48條、第50條之2。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）非都市土地</p><p><mark class=\"hl\">「使用分區＋使用地編定」雙軌管制</mark>。依<span class=\"art\">區域計畫法第15條第1項</span>，區域計畫公告實施後，由直轄市或縣（市）政府製定非都市土地使用分區圖並編定各種使用地，報經上級主管機關核備後實施管制。結構為：1.使用分區：特定農業、一般農業、工業、鄉村、森林、山坡地保育、風景、國家公園、河川、海域、特定專用等<mark class=\"hl\">十一種</mark>（管制規則<span class=\"art\">第2條</span>）；2.使用地：甲種至丁種建築、農牧、林業、交通、水利等<mark class=\"hl\">十九種</mark>（<span class=\"art\">第3條</span>）；3.容許使用：依容許使用項目及許可使用細目使用（<span class=\"art\">第6條第1項</span>）；4.罰則：違反者<mark class=\"hl\">處新臺幣6萬元以上30萬元以下罰鍰</mark>，並得限期令其變更使用、停止使用或拆除地上物恢復原狀（<span class=\"art\">區域計畫法第21條</span>）。惟依<span class=\"art\">國土計畫法第45條第3項</span>，國土功能分區圖公告之日起，<mark class=\"hl\">區域計畫法停止適用</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（二）保留地地價稅</p><p><mark class=\"hl\">建築使用6‰，未使用且隔離免徵</mark>。依<span class=\"art\">土地稅法第19條</span>，保留期間仍為建築使用者，除自用住宅用地依<span class=\"art\">第17條</span>規定（2‰）外，<mark class=\"hl\">統按6‰計徵</mark>；未作任何使用並與使用中之土地隔離者，免徵。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保留地使用受限，不宜適用一般累進稅率（10‰至五十五，<span class=\"art\">第16條</span>）。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）取得方式</p><p><mark class=\"hl\">徵收、區段徵收、市地重劃，並得交換</mark>。依<span class=\"art\">都市計畫法第48條</span>，供公用事業設施之用者，由事業機構依法徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所依徵收、區段徵收、市地重劃取得。另依<span class=\"art\">第50條之2</span>，得申請與公有非公用土地辦理交換，<mark class=\"hl\">劃設逾25年未經政府取得者得優先辦理</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>非都市土地以<mark class=\"hl\">「使用分區—使用地編定」雙軌結構</mark>，配合容許使用與罰則實施管制。保留地仍為建築使用者<mark class=\"hl\">按6‰（自用住宅2‰）</mark>計徵地價稅，<mark class=\"hl\">未使用且隔離者免徵</mark>。私有保留地依都市計畫法第48條以徵收、區段徵收、市地重劃取得，並得依第50條之2<mark class=\"hl\">申請交換</mark>。</p>"], "ck": [{"x": "區計§15Ⅰ：製定使用分區圖、編定使用地，報上級核備後實施管制", "h": false}, {"x": "使用分區11種、使用地19種，不可記反", "h": true}, {"x": "區計§21：違規處6萬～30萬，並得限期變更、停止使用或拆除恢復原狀", "h": false}, {"x": "土稅§19 兩種情形都要寫：建築使用6‰（自用住宅2‰）；未使用且隔離免徵", "h": true}, {"x": "都計§48：公用事業由事業機構徵收或購買；其餘徵收、區段徵收、市地重劃", "h": true}, {"x": "§50-2 得與公有非公用土地交換，屬補充方式", "h": false}, {"x": "非都市土地＝分區＋編定雙軌管制，與都市計畫法體系平行互補", "h": false}], "mn": "十一分區、十九編定 → 保留地建築6‰（自住2‰）、隔離免徵 → 公用徵購，其餘徵・區徵・重劃 → 交換補充"}, {"id": "q-110-二", "no": "110-二", "t": "外國人取得地權之基本條件與限制", "lv": "C", "k": "off", "tier": 2, "g": "地權總則・農地・非都市管制", "q": "外國人在我國取得地權之基本條件與限制為何？請依規定說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>我國基於<mark class=\"hl\">互惠原則及國家安全</mark>考量，對外國人取得我國土地權利設有特別規範，土地法就此設有專章。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第18條（平等互惠）；第17條（特定土地不得取得）；第19條、第20條（用途、面積、地點限制及申請核准）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）基本條件</p><p><mark class=\"hl\">平等互惠</mark>。依<span class=\"art\
