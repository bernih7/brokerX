lass=\"hl\">申報地價10%</mark>，且經政府認定應予增建、改建或重建之建築用地（<span class=\"art\">土地稅法第11條</span>同）。B地未建築使用，若公共設施已完成即屬空地。</p></div><div class=\"evp\"><p class=\"evh\">（三）空地稅</p><p><mark class=\"hl\">加徵2倍至5倍或照價收買</mark>。依<span class=\"art\">平均地權條例第26條第1項</span>及<span class=\"art\">土地稅法第21條</span>，政府得劃定區域限期建築；逾期未建者，按應納地價稅基本稅額加徵2倍至5倍之空地稅或照價收買，照價收買<mark class=\"hl\">以收買當期之公告土地現值為準</mark>（<span class=\"art\">第31條第3款</span>）。新建改良物價值<mark class=\"hl\">不及申報地價50%者，不予核發建築執照</mark>（<span class=\"art\">第26條第2項</span>）。B地逾期未建，T市政府得加徵空地稅或照價收買。</p></div><div class=\"evp\"><p class=\"evh\">（四）租約</p><p><mark class=\"hl\">先協議，不成得終止</mark>。依<span class=\"art\">平均地權條例第74條第1款</span>，限期建築之土地出租者，所有權人應於接到通知後與承租人協議建築；<mark class=\"hl\">協議不成時，得終止租約</mark>。甲應先與乙協議，不成得終止租約收回B地自行建築。</p></div>", "<span class=\"blk-l\">四、結論</span><p>A屋<mark class=\"hl\">不適用自住稅率</mark>，按其他住家用<mark class=\"hl\">2%至4.8%</mark>之差別稅率課徵。空地指編為建築用地未依法使用者，或公共設施完成而仍未依法建築使用之建築用地；經限期建築逾期未建者<mark class=\"hl\">加徵2倍至5倍空地稅或照價收買</mark>。B地限期建築時，甲應<mark class=\"hl\">先與乙協議，不成得終止租約</mark>。</p>"], "ck": [{"x": "自住1.2%要件：無出租營業、實際居住並辦竣戶籍、全國合計3戶內", "h": false}, {"x": "A屋無人設籍 → 其他住家用2%～4.8%，依全國持有戶數差別稅率", "h": false}, {"x": "土地法§87 是20%（視為空地），平均§3⑦ 是10%，兩個比例不可混", "h": true}, {"x": "平均§26、土稅§21：限期建築逾期，加徵地價稅基本稅額2～5倍或照價收買", "h": false}, {"x": "照價收買以收買當期公告土地現值；新建物不及申報地價50%不發建照", "h": false}, {"x": "租約影響引平均§74，不是土地法§90", "h": true}, {"x": "順序：甲先與乙協議，協議不成才終止租約", "h": true}, {"x": "終止後仍不建，仍得加徵空地稅或照價收買", "h": false}], "mn": "空屋看設籍（1.2% → 2～4.8%）→ 空地分20%／10% → 限期逾期加2～5倍 → 租約先協議、不成終止", "hp": 33, "hpl": "高"}, {"id": "pr-06", "no": "預P06", "t": "區段徵收 vs 市地重劃：取得方式、負擔、補償", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "試比較區段徵收與市地重劃在土地取得方式、土地所有權人之負擔，以及抵價地與抵費地之性質上有何差異。", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>區段徵收與市地重劃都是整體開發方式。區段徵收是<mark class=\"hl\">先「徵收」全部土地</mark>，再把部分可建築土地以抵價地發還；市地重劃則是土地所有權人共同負擔後，按各宗地價比例重新分配，<mark class=\"hl\">所有權不經徵收</mark>。</p>", "<span class=\"blk-l\">二、法條</span><p>土地徵收條例第39條至第41條、第44條；平均地權條例第56條、第60條、第60條之1、第60條之2；同條例施行細則第87條；土地稅法第39條之1。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）取得方式不同</p><p>依<span class=\"art\">土地徵收條例第39條第1項</span>，區段徵收應依<span class=\"art\">第30條</span>補償地價，經申請<mark class=\"hl\">得以抵價地折算抵付</mark>，公共設施用地<mark class=\"hl\">無償登記為地方政府所有</mark>（<span class=\"art\">第44條</span>）；市地重劃依<span class=\"art\">平均地權條例第56條</span>，計畫書經核定公告滿30日後實施，<mark class=\"hl\">所有權不移轉給政府</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>區段徵收可一次取得公設用地與開發財源。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）負擔比例不同</p><p>依<span class=\"art\">土地徵收條例第39條第2項</span>，「抵價地總面積，<mark class=\"hl\">以徵收總面積百分之五十為原則</mark>」，核准者<mark class=\"hl\">不得少於40%</mark>；依<span class=\"art\">平均地權條例第60條</span>，公設用地不足部分及工程、重劃費用與貸款利息，以未建築土地折價抵付，合計以<mark class=\"hl\">不超過總面積45%為限</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>區段徵收以發還比例、重劃以負擔上限保障所有權人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）抵價地與抵費地性質不同</p><p>依<span class=\"art\">土地徵收條例第40條</span>，不願領現金補償者，應於<mark class=\"hl\">公告期間內書面申請抵價地</mark>，抵價地是補償後發還；依<span class=\"art\">平均地權條例第60條之1</span>，扣除共同負擔後<mark class=\"hl\">依各宗土地地價數額比例分配</mark>，抵付費用之抵費地則依施行細則<span class=\"art\">第87條</span>登記為直轄市、縣（市）有。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>徵收使原權利終止，重劃則延續至分配之土地。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）權利確定程序不同</p><p>依<span class=\"art\">平均地權條例第60條之2</span>，<mark class=\"hl\">分配結果公告30日</mark>，得書面異議，調處不成<mark class=\"hl\">報請裁決</mark>；依<span class=\"art\">土地徵收條例第40條第3項</span>、第4項，得申請改領現金或抵價地，<mark class=\"hl\">以一次為限</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（五）稅負不同</p><p>依<span class=\"art\">土地稅法第39條之1</span>，「經重劃之土地，於重劃後第一次移轉時，<mark class=\"hl\">其土地增值稅減徵百分之四十</mark>」；區段徵收以現金或抵價地補償者<mark class=\"hl\">免徵</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以稅捐優惠鼓勵參與整體開發。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>區段徵收<mark class=\"hl\">「先徵收、再發還」</mark>，抵價地比例<mark class=\"hl\">原則5成</mark>；市地重劃<mark class=\"hl\">「共同負擔、重新分配」</mark>，折價抵付<mark class=\"hl\">上限4成五</mark>。<mark class=\"hl\">抵價地是補償，抵費地是被扣以抵付費用</mark>。</p>"], "ck": [{"x": "重劃不經徵收，原權利延續；不可寫成政府徵收取得所有權", "h": true}, {"x": "區段徵收先徵收全區，公設用地無償登記為地方政府所有（土徵§44）", "h": false}, {"x": "抵價地原則50%（≥40%、農重≥45%）與折價抵付上限45%不可混淆", "h": true}, {"x": "平均§60：未建築土地折價抵付＝公設用地負擔＋抵費地（工程費、重劃費、利息），合計上限45%，過半同意除外", "h": false}, {"x": "性質：抵價地＝補償後發還給原所有權人；抵費地＝抵付工程費、重劃費、貸款利息之負擔（不計徵土增稅，平均細則§87Ⅰ）", "h": false}, {"x": "土徵§40 公告期間內書面申請抵價地；§41 租約、他項權利須先清理", "h": false}, {"x": "平均§60-1：按地價比例分配，多退少補差額地價，未繳不得移轉", "h": false}, {"x": "平均§60-2：分配公告30日 → 書面異議 → 調處 → 上級裁決", "h": false}], "mn": "區徵：先徵收再發還（抵價地原則50%）→ 重劃：共同負擔再分配（折價抵付上限45%）→ 性質：抵價地補償發還 vs 抵費地負擔抵付 → 領回：現金或抵價地 vs 地價比例分配"}, {"id": "pr-24", "no": "預P24", "t": "出租耕地終止租約與補償：三七五§17 vs 平均地權§76、§77、§63", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "甲將其耕地出租予乙，訂有耕地三七五租約。請說明：（一）租期未屆滿前，甲得終止租約之法定事由；（二）該耕地經依法編為建築用地，甲欲收回自行建築時，應如何補償乙？收回後未依計畫建築有何效果？（三）若該耕地因實施市地重劃不能達原租賃目的，租約如何處理、乙得受何補償？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>耕地三七五租約為保障佃農之特別租約，<mark class=\"hl\">出租人原則上不得任意終止</mark>；惟於法定事由發生或土地使用目的改變時，租約得終止或由政府註銷。</p>", "<span class=\"blk-l\">二、法條</span><p>耕地三七五減租條例第17條；平均地權條例第76條、第77條、第63條（重劃註銷租約）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）租期屆滿前，限五款事由始得終止</p><p>依耕地三七五減租條例<span class=\"art\">第17條第1項</span>，租期未屆滿前，非有承租人死亡而無繼承人、放棄耕作權、<mark class=\"hl\">地租積欠達2年之總額</mark>、非因不可抗力<mark class=\"hl\">繼續1年不為耕作</mark>、經依法編定或變更為非耕地使用等情形之一，<mark class=\"hl\">不得終止</mark>。依第5款終止時，同條第2項規定應補償改良費用、尚未收穫農作物之價額及<mark class=\"hl\">扣稅後地價三分之一</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>三七五租約以保障佃農為目的，限制出租人任意終止。</span></p></div><div class=\"evp\"><p>（二）<mark class=\"hl\">編為建地收回</mark>，補償改良費、農作物及扣稅後地價三分之一。依<span class=\"art\">平均地權條例第76條第1項</span>，出租耕地經依法編為建築用地者，出租人為收回自行建築時得終止租約；依<span class=\"art\">第77條</span>，應按申請終止租約當期之公告土地現值<mark class=\"hl\">減除預計土地增值稅後餘額三分之一</mark>給予補償。</p><p class=\"evx\"><span class=\"evt\">例</span><span>公告土地現值900萬元、預計土地增值稅150萬元，甲應補償乙（900萬－150萬）×1/3＝250萬元。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>承租人因土地變更用途而喪失耕作權，應分享部分地價。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）收回屆滿1年不建築，政府得照價收買</p><p>依<span class=\"art\">第76條第2項</span>，<mark class=\"hl\">實際收回耕地屆滿1年後</mark>，不依照使用計畫建築使用者，直轄市或縣（市）政府<mark class=\"hl\">得照價收買之</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止出租人藉收回建築之名終止租約後囤地炒作。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）重劃不能達租賃目的，政府逕為註銷並補償</p><p>依<span class=\"art\">第63條第1項</span>，出租耕地因實施市地重劃致不能達到原租賃之目的者，由直轄市或縣（市）政府<mark class=\"hl\">逕為註銷其租約</mark>；依第2項，重劃後分配土地者，承租人得向出租人請求<mark class=\"hl\">公告土地現值三分之一之補償</mark>；未受分配土地者，補償地價由<mark class=\"hl\">出租人領取三分之二，承租人領取三分之一</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>重劃使原租賃目的無法達成，以法定比例分配地價。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>租期屆滿前，甲僅得依第17條第1項<mark class=\"hl\">五款事由</mark>終止，其中第5款須依同條第2項補償。收回建築與重劃註銷，承租人皆可取得<mark class=\"hl\">約三分之一地價補償</mark>，但第77條<mark class=\"hl\">須先扣除預計土增稅</mark>；<mark class=\"hl\">收回後1年不建築，政府得照價收買</mark>。</p>"], "ck": [{"x": "三七五§17Ⅰ 五款終止事由：亡、棄、欠租2年、1年不耕作、編為非耕地", "h": false}, {"x": "轉租依§16原租約無效，不是§17Ⅰ終止事由", "h": true}, {"x": "平均§76Ⅰ：編為建築用地，收回自建或出售作建築使用得終止", "h": false}, {"x": "§77 地價補償要先減「預計土地增值稅」，再取餘額1/3", "h": true}, {"x": "收回屆滿1年不依計畫建築，政府得照價收買（§76Ⅱ）", "h": true}, {"x": "平均§63：重劃不能達租賃目的，政府逕為註銷", "h": false}, {"x": "§63 直接以公告現值1/3計，不扣土增稅；未分配者出租人2/3、承租人1/3", "h": true}], "mn": "五款才能終止（轉租是無效）→ 收回建築扣稅三一、1年不建照價收買 → 重劃註銷直接三一"}, {"id": "pr-25", "no": "預P25", "t": "規定地價程序與照價收買：申報地價80%～120%、六種收買時機、收買地價", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "請說明：（一）直轄市或縣（市）主管機關辦理規定地價之程序；（二）土地所有權人申報地價之規則；（三）平均地權條例所定得照價收買土地之情形及其收買地價。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>規定地價係直轄市或縣（市）主管機關依法定程序查定土地價格，作為申報地價及<mark class=\"hl\">課徵地價稅之基礎</mark>；照價收買則是政府按法定地價<mark class=\"hl\">強制收買私有土地</mark>之手段（平均地權條例第28條、第31條）。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第15條（規定地價程序）、第16條（申報地價）、第28條（照價收買程序）、第31條（收買地價）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）規定地價依法定五款程序</p><p>依<span class=\"art\">平均地權條例第15條</span>：<span class=\"evli\">一、分區調查<mark class=\"hl\">最近1年之土地買賣價格或收益價格</mark>；</span><span class=\"evli\">二、劃分地價區段並估計區段地價後，<mark class=\"hl\">提交地價評議委員會評議</mark>；</span><span class=\"evli\">三、計算宗地單位地價；</span><span class=\"evli\">四、公告及申報地價，<mark class=\"hl\">其期限為30日</mark>；</span><span class=\"evli\">五、編造地價冊及總歸戶冊。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>由地價評議委員會評議，使地價之評定兼顧專業與公正。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）申報地價以公告地價80%至一百二十為準</p><p>依<span class=\"art\">第16條</span>，未於公告期間申報者，<mark class=\"hl\">以公告地價80%為其申報地價</mark>；申報超過公告地價120%時，<mark class=\"hl\">以120%為其申報地價</mark>；申報未滿80%時，<mark class=\"hl\">得照價收買或以80%為其申報地價</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>公告地價每平方公尺1萬元，申報7,000元者得照價收買或以8,000元計。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止所有權人為少繳地價稅而低報地價。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）照價收買之情形共六種</p><p>依<span class=\"art\">第28條</span>：①<mark class=\"hl\">申報地價未滿公告地價80%</mark>（<span class=\"art\">第16條</span>）；②申報移轉現值經審核低於公告土地現值（<span class=\"art\">第47條之1</span>）；③<mark class=\"hl\">空地經限期建築而逾期未建築</mark>（<span class=\"art\">第26條</span>）；④農業用地加徵荒地稅滿3年仍不使用（<span class=\"art\">第26條之1</span>）；⑤超額建築用地逾期未出售或建築使用（<span class=\"art\">第72條</span>）；⑥出租耕地收回後<mark class=\"hl\">屆滿1年不依計畫建築使用</mark>（<span class=\"art\">第76條</span>）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止地價低報、移轉現值低報及土地閒置不用。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）收買地價「低報什麼就按什麼收買」</p><p>依<span class=\"art\">第31條</span>，依<span class=\"art\">第16條</span>收買者<mark class=\"hl\">以其申報地價為準</mark>，依<span class=\"art\">第47條之1</span>收買者<mark class=\"hl\">以其申報土地移轉現值為準</mark>，其餘<mark class=\"hl\">以收買當期之公告土地現值為準</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>使低報者無利可圖；其餘情形非屬低報，故按公告土地現值收買。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>規定地價以地價評議委員會評議、<mark class=\"hl\">公告申報三十日</mark>為核心，申報地價有<mark class=\"hl\">80%至一百二十</mark>之限制。照價收買共有<mark class=\"hl\">六種法定時機</mark>，收買地價採<mark class=\"hl\">「低報什麼就按什麼收買」</mark>之設計，兼顧公平與政策目的。</p>"], "ck": [{"x": "平均§15 規定地價程序：地價評議委員會評議、公告及申報30日", "h": false}, {"x": "平均§16 未申報以80%計；超過120%以120%計；未滿80%得照價收買或以80%計", "h": false}, {"x": "超過120%只按120%計，不是照價收買事由", "h": true}, {"x": "平均§28 六種收買情形，不能漏§47-1 低報移轉現值與§76 收回不建", "h": true}, {"x": "收買地價：§16 按申報地價、§47-1 按申報移轉現值、其餘按當期公告土地現值，不是全按公告現值", "h": true}, {"x": "平均§30 受領地價完竣或依法提存次日起60日內交付土地", "h": false}, {"x": "低報什麼就按什麼收買，使低報者無利可圖", "h": false}], "mn": "調查→地評會→公告30日 → 80%～120%（超過不收買）→ 六種收買 → 低報什麼按什麼收買 → 60日交地"}, {"id": "pr-40", "no": "預P40", "t": "空地與荒地：土地法與平均地權條例之定義、強制使用、加徵稅與照價收買比較", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "何謂空地？何謂荒地？土地法與平均地權條例對於私有空地、荒地之定義、強制使用方式及逾期未使用之效果（加徵空地稅、荒地稅與照價收買）規定有何不同？試比較說明之。", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>編為建築用地而未建築使用者為<mark class=\"hl\">空地</mark>；編為農業或其他直接生產用地而未依法使用者為<mark class=\"hl\">荒地</mark>。兩法均設限期使用、加徵稅負及照價收買，但門檻、倍數與收買地價不同。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第87條、第88條、第89條、第173條、第174條；平均地權條例第1條、第3條第7款、第26條、第26條之1、第31條第3款。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）適用關係</p><p>依<span class=\"art\">平均地權條例第1條</span>，「<mark class=\"hl\">本條例未規定者，適用土地法</mark>及其他有關法律之規定。」</p><p class=\"evx\"><span class=\"evt\">理由</span><span>平均地權條例為實施平均地權之特別法。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）空地定義</p><p>依<span class=\"art\">土地法第87條</span>，「凡編為建築用地，未依法使用者，為空地。」改良物價值「<mark class=\"hl\">不及所占地基申報地價百分之二十者，視為空地</mark>」；依<span class=\"art\">平均地權條例第3條第7款</span>，改良物價值「<mark class=\"hl\">不及所占基地申報地價百分之十</mark>」。</p><p class=\"evx\"><span class=\"evt\">例</span><span>平房價值為申報地價15%，依土地法視為空地，依平均地權條例則否。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）荒地定義</p><p>依<span class=\"art\">土地法第88條</span>，「凡編為農業或其他直接生產用地，<mark class=\"hl\">未依法使用者為荒地</mark>。」平均地權條例則於<span class=\"art\">第26條之1</span>規定「農業用地閒置不用」，<mark class=\"hl\">另列五款除外情形</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）強制使用</p><p>依<span class=\"art\">土地法第89條第1項</span>，「得劃定區域，規定期限，<mark class=\"hl\">強制依法使用</mark>」；依<span class=\"art\">平均地權條例第26條之1</span>，須「經直轄市或縣（市）政府<mark class=\"hl\">報經內政部核准通知限期使用</mark>或命其委託經營」。</p></div><div class=\"evp\"><p class=\"evh\">（五）空地效果</p><p>依<span class=\"art\">土地法第173條</span>，空地稅「<mark class=\"hl\">不得少於應繳地價稅之三倍，不得超過應繳地價稅之十倍</mark>」；依<span class=\"art\">平均地權條例第26條第1項</span>，「按該宗土地應納地價稅基本稅額<mark class=\"hl\">加徵二倍至五倍之空地稅或照價收買</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（六）荒地效果</p><p>依<span class=\"art\">土地法第174條</span>，荒地稅「不得少於應征之地價稅，<mark class=\"hl\">不得超過應繳地價稅之三倍</mark>」；依<span class=\"art\">平均地權條例第26條之1</span>，「按應納田賦<mark class=\"hl\">加徵一倍至三倍之荒地稅</mark>；<mark class=\"hl\">經加徵荒地稅滿三年，仍不使用者，得照價收買</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（七）收買地價</p><p>依<span class=\"art\">土地法第89條第2項</span>為「<mark class=\"hl\">照申報地價收買</mark>」；依<span class=\"art\">平均地權條例第31條第3款</span>，「<mark class=\"hl\">以收買當期之公告土地現值為準</mark>」。</p></div>", "<span class=\"blk-l\">四、結論</span><p><mark class=\"hl\">平均地權條例優先適用</mark>，<mark class=\"hl\">空地門檻10%</mark>，加徵二至5倍空地稅或照價收買；荒地加徵田賦一至3倍，<mark class=\"hl\">滿3年得照價收買</mark>，以公告土地現值為準。<mark class=\"hl\">土地法空地門檻20%</mark>，空地稅三至10倍、荒地稅一至3倍地價稅，荒地照申報地價收買。</p>"], "ck": [{"x": "平均§1 本條例未規定者適用土地法", "h": true}, {"x": "土地法§87Ⅱ 20% vs 平均§3⑦ 10%", "h": true}, {"x": "土地法§173 3～10倍 vs 平均§26 2～5倍", "h": true}, {"x": "平均§26-1 報經內政部、田賦1～3倍、滿3年", "h": true}, {"x": "收買地價：申報地價（土地法）vs 當期公告土地現值（平均§31③）", "h": true}], "mn": "〔自編〕土地法「二十、三到十、一到三、申報價」；平均「十、二到五、田賦一到三、三年收、公告現值」"}, {"id": "pr-46", "no": "預P46", "t": "耕地租用（土地法）：地租上限、不得預收、不定期租約終止七款、特別改良、爭議處理與三七五調解調處（土地法§110～§124、三七五§26）", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "依土地法規定，耕地出租之地租有何限制？依不定期限租用耕地之契約，得於何種情形終止？承租人為耕地特別改良者如何保障？耕地租佃發生爭議時，土地法與耕地三七五減租條例之處理程序有何不同？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>耕地租用是<mark class=\"hl\">以自任耕作為目的</mark>，約定支付地租使用他人農地之租賃關係。為保護居於弱勢之承租人，土地法就地租上限、擔保金、不定期租約之終止事由、特別改良及爭議處理設有規定；三七五租約之爭議另依耕地三七五減租條例處理。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法第110條、第112條、第113條、第114條、第116條、第117條、第119條、第120條、第122條、第123條；耕地三七五減租條例第26條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）地租限制</p><p>依<span class=\"art\">第110條</span>，「<mark class=\"hl\">地租不得超過地價百分之八</mark>」，超過者減定；依<span class=\"art\">第112條</span>，出租人<mark class=\"hl\">不得預收地租</mark>，現金擔保<mark class=\"hl\">不得超過1年應繳租額四分之一</mark>；依<span class=\"art\">第113條</span>，一部支付時出租人不得拒絕收受。</p><p class=\"evx\"><span class=\"evt\">例</span><span>約定年租為地價10%，應減為8%。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）不定期租約終止</p><p>依<span class=\"art\">第114條</span>，僅得於承租人死亡而無繼承人、放棄耕作權利、出租人收回自耕、耕地依法變更其使用、違反民法<span class=\"art\">第432條</span>及<span class=\"art\">第462條第2項</span>、違反<span class=\"art\">第108條</span>、「<mark class=\"hl\">地租積欠達二年之總額時</mark>」<mark class=\"hl\">七款情形終止</mark>；依<span class=\"art\">第116條</span>，收回自耕及第5款終止時，出租人<mark class=\"hl\">應於1年前通知承租人</mark>；依<span class=\"art\">第117條</span>，收回自耕未滿1年再出租，原承租人<mark class=\"hl\">得以原租用條件承租</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保障承租人耕作安定。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）特別改良</p><p>依<span class=\"art\">第119條</span>，承租人<mark class=\"hl\">得自由為耕地特別改良</mark>，數額應即通知出租人；依<span class=\"art\">第120條</span>，因<span class=\"art\">第114條</span>第2、3、5、6款終止返還耕地時，得要求償還特別改良費，<mark class=\"hl\">以未失效能部分之價值為限</mark>。</p></div><div class=\"evp\"><p class=\"evh\">（四）爭議處理</p><p>依<span class=\"art\">第122條</span>，業佃爭議<mark class=\"hl\">得由地政機關調處</mark>，不服者得訴請司法機關處理；三七五租約依<span class=\"art\">同條例第26條</span>，由鄉（鎮、市、區）公所耕地租佃委員會調解，不成立者由直轄市或縣（市）政府耕地租佃委員會調處，不服者移送司法機關並<mark class=\"hl\">免收裁判費</mark>，「<mark class=\"hl\">前項爭議案件非經調解、調處，不得起訴</mark>」。</p></div><div class=\"evp\"><p class=\"evh\">（五）荒歉</p><p>依<span class=\"art\">第123條</span>，直轄市或縣（市）政府得決定減租或免租，但<mark class=\"hl\">應經民意機關之同意</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>土地法以<mark class=\"hl\">地租不超過地價8%</mark>、<mark class=\"hl\">擔保金不超過1年租額四分之一</mark>、不定期租約<mark class=\"hl\">限七款終止</mark>（積欠達2年）、收回自耕1年前通知及特別改良費償還保障承租人；爭議處理上，三七五租約須先調解、再調處，<mark class=\"hl\">非經調解、調處不得起訴</mark>，以疏解租佃爭議。</p>"], "ck": [{"x": "§110 8%；§112 1/4", "h": true}, {"x": "§114 七款、積欠2年", "h": true}, {"x": "三七五§26 先調解再調處、非經不得起訴", "h": true}], "mn": "〔自編〕租八趴、押四分之一、欠2年才收、收回前1年說；三七五：先調解、再調處、才上法院"}, {"id": "pr-51", "no": "預P51", "t": "自辦市地重劃：獎勵事項、重劃會同意門檻與核准（平均§58）vs 公辦市地重劃之反對門檻（平均§56）", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "依平均地權條例，土地所有權人自行組織重劃會辦理市地重劃，政府得給予哪些獎勵？其實施須經何種同意與核准？與政府主動辦理之市地重劃有何不同？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>自辦市地重劃，是由重劃區內土地所有權人<mark class=\"hl\">自行組織重劃會</mark>辦理之市地重劃；平均地權條例第58條以獎勵鼓勵民間辦理，並以<mark class=\"hl\">人數與面積雙過半之同意及主管機關核准</mark>為實施要件。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第58條、第56條、第60條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）目的</p><p>依<span class=\"art\">第58條第1項</span>，「為促進土地利用，擴大辦理市地重劃，<mark class=\"hl\">得獎勵土地所有權人自行組織重劃會辦理之</mark>。」</p><p class=\"evx\"><span class=\"evt\">理由</span><span>政府財力人力有限，引進民間力量擴大重劃規模。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）獎勵事項</p><p>依同項，獎勵事項為：<mark class=\"hl\">給予低利之重劃貸款</mark>；免收或減收地籍整理規費及換發權利書狀費用；優先興建重劃區及其相關地區之公共設施；<mark class=\"hl\">免徵或減徵地價稅與田賦</mark>；其他有助於市地重劃之推行事項。故<mark class=\"hl\">優先辦理公有土地之撥用不在獎勵之列</mark>。重劃會組織等辦法由中央主管機關定之。</p></div><div class=\"evp\"><p class=\"evh\">（三）同意與核准</p><p>依<span class=\"art\">第58條第3項</span>，「重劃會辦理市地重劃時，應由重劃區內<mark class=\"hl\">私有土地所有權人半數以上</mark>，而其所有土地面積<mark class=\"hl\">超過重劃區私有土地總面積半數以上者之同意</mark>，並<mark class=\"hl\">經主管機關核准後實施之</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>私有土地所有權人一百人、10公頃，須至少五十人且面積超過5公頃同意，再經核准。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）與公辦對照</p><p>依<span class=\"art\">第56條</span>，公辦重劃之計畫書<mark class=\"hl\">公告滿30日後實施</mark>；公告期間內所有權人半數以上且面積超過半數表示反對時，主管機關應予調處並修訂計畫書重行報核。故<mark class=\"hl\">公辦看多數反對，自辦看多數同意</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>公辦具公益性由政府主導，自辦屬私人發動，須先取得多數支持。</span></p></div><div class=\"evp\"><p class=\"evh\">（五）共同負擔</p><p>依<span class=\"art\">第60條</span>，十項公共設施用地除以原公有道路等四項土地抵充外，不足土地及工程費用、重劃費用與貸款利息，由參加重劃土地所有權人<mark class=\"hl\">按受益比例共同負擔</mark>，<mark class=\"hl\">以未建築土地折價抵付</mark>。</p></div>", "<span class=\"blk-l\">四、結論</span><p>自辦市地重劃由重劃會辦理，政府給予<mark class=\"hl\">低利貸款、規費減免、優先興建公共設施、地價稅與田賦減免</mark>等獎勵；實施須私有土地所有權人<mark class=\"hl\">人數與面積均過半同意並經主管機關核准</mark>，與公辦重劃以<mark class=\"hl\">雙過半反對為調處門檻</mark>相對照，兼顧民間參與與多數地主權益。</p>"], "ck": [{"x": "§58Ⅰ 五款獎勵", "h": true}, {"x": "§58Ⅲ 雙過半同意＋核准", "h": true}, {"x": "§56Ⅲ 公辦雙過半反對", "h": true}], "mn": "〔自編〕自辦重劃四大甜頭：貸款便宜、規費少、公設先蓋、稅減免；人頭過半、面積過半才能做"}, {"id": "pr-53", "no": "預P53", "t": "尚未建築私有建築用地之面積最高額（超額建地）：10公畝、扣除、2年內出售或建築、照價收買（平均§71、§72）", "lv": "中", "k": "pred", "tier": 1, "g": "市地重劃・空地・限期建築", "q": "依平均地權條例，直轄市或縣（市）政府對於尚未建築之私有建築用地有何面積限制？超額土地應如何處理？逾期未處理之效果為何？", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>平均地權之目標在使地盡其利、防止土地壟斷。平均地權條例對尚未建築之私有建築用地<mark class=\"hl\">設面積最高額</mark>，超額部分限期出售或建築使用，<mark class=\"hl\">逾期得由政府照價收買</mark>，以免大量持有建地而不建築，推高地價並妨礙都市發展。</p>", "<span class=\"blk-l\">二、法條</span><p>平均地權條例第71條、第72條、第31條第3款、第28條。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）限制對象與最高額</p><p>依<span class=\"art\">第71條第1項</span>，直轄市或縣（市）政府對於尚未建築之私有建築用地，<mark class=\"hl\">應限制所有面積之最高額</mark>；依第2項，「前項所有面積之最高額，<mark class=\"hl\">以十公畝為限</mark>。」但工業用地、學校用地及經政府核准之大規模建築用地，應視實際需要分別訂定。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>一般建地設統一上限，特殊用途依需要另定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）扣除</p><p>依<span class=\"art\">第71條第3項</span>，「計算尚未建築土地面積最高額時，<mark class=\"hl\">對於因法令限制不能建築之土地，應予扣除</mark>。」</p><p class=\"evx\"><span class=\"evt\">例</span><span>尚未建築之建地12公畝，其中3公畝因法令限制不能建築，扣除後為9公畝，未超額。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>法令限制不能建築者並非囤積不用。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）超額處理</p><p>依<span class=\"art\">第72條</span>，超額土地應通知所有權人「<mark class=\"hl\">於二年內出售或建築使用</mark>」；逾期未出售或未建築使用者，<mark class=\"hl\">得予照價收買</mark>，整理後出售與需用土地人建築使用；但<mark class=\"hl\">在建設發展較緩之地段，不在此限</mark>。</p><p class=\"evx\"><span class=\"evt\">例</span><span>建地15公畝，超額5公畝，逾2年未處理，政府得照價收買。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>以期限督促建築，並以照價收買為最後手段。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）收買地價與程序</p><p>依<span class=\"art\">第31條第3款</span>，依<span class=\"art\">第72條</span>收買者，「<mark class=\"hl\">以收買當期之公告土地現值為準</mark>」，並非正常市價。程序依<span class=\"art\">第28條</span>：先行公告並書面通知，受通知人於送達之次日起<mark class=\"hl\">50日內繳交書狀</mark>，審核無訛後<mark class=\"hl\">30日內給付地價</mark>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免囤地者因收買而獲取市價利益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>尚未建築之私有建築用地最高額<mark class=\"hl\">以十公畝為限</mark>，特殊用地另定，並<mark class=\"hl\">扣除法令限制不能建築者</mark>；超額土地<mark class=\"hl\">應於2年內出售或建築使用</mark>，逾期得照價收買，<mark class=\"hl\">以收買當期之公告土地現值為準</mark>，以面積上限與限期使用防止建地壟斷、促進地盡其利。</p>"], "ck": [{"x": "§71 10公畝、扣除", "h": true}, {"x": "§72 2年、照價收買", "h": true}, {"x": "§31③ 公告現值", "h": true}], "mn": "〔自編〕空建地10公畝封頂、不能蓋的扣掉；超過的2年內賣掉或蓋好，不然政府用公告現值買走"}];

function stat(id){
  var L=ld(LOG)[id]||{}, S=ld(SP)[id]||[], R=ld('bx-es-read')[id];
  var last=S[0]||null;
  return {n:(L.n||0), sp:S.length, v:VN(L.v), last:last, read:!!R, t:Math.max(L.t||0,last?last.t:0)};
}
function order(){
  var arr=CARDS.map(function(c,i){var s=stat(c.id);return {c:c,s:s,i:i}}).filter(function(x){return fpass(x.c,x.s)});
  function kindRank(c){return c.k==='off'?0:(c.k==='pred'?1:2)}
  var fresh=arr.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read});
  var seen=arr.filter(function(x){return x.s.n||x.s.sp||x.s.read});
  function hpR(c){return c.hp==null?9999:c.hp}
  fresh.sort(function(a,b){return hpR(a.c)-hpR(b.c)||kindRank(a.c)-kindRank(b.c)||a.c.tier-b.c.tier||a.i-b.i});
  function vr(v){return v===3?0:(v===2?1:(v===0?2:3))}
  function pct(x){return x.s.last?x.s.last.sc/Math.max(1,x.s.last.mx):-1}
  seen.sort(function(a,b){return vr(a.s.v)-vr(b.s.v)||hpR(a.c)-hpR(b.c)||pct(a)-pct(b)||a.s.t-b.s.t});
  return fresh.concat(seen);
}

<script id="sprint-keys">
/* 鍵盤：練習中 →／空白鍵＝下一段（推理版未翻開先翻開）；回看本題 ←／→ 翻頁；空白鍵＝下一題 */
document.addEventListener('keydown',function(e){
 if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
 var t=e.target,tag=(t&&t.tagName)||'';if(/^(INPUT|SELECT|TEXTAREA)$/.test(tag)||(t&&t.isContentEditable))return;
 var k=e.key;if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!==' '&&k!=='Spacebar')return;
 var run=document.getElementById('run');if(!run||run.hidden)return;
 if(document.body.classList.contains('paused'))return;
 var rvP=document.getElementById('rvP'),rvN=document.getElementById('rvN'),nb=document.getElementById('nextBtn');
 function hit(b){if(b&&!b.disabled&&b.offsetParent!==null){e.preventDefault();b.click();return true}return false}
 if(rvP&&rvP.offsetParent!==null){            /* 存檔後：回看本題 */
  if(k==='ArrowLeft')return void hit(rvP);
  if(k==='ArrowRight')return void hit(rvN);
  return void hit(nb);                       /* 空白鍵＝下一題 */
 }
 if(k==='ArrowLeft')return;
 if(hit(document.getElementById('flip')))return;
 hit(nb);
});
</script>
<script id="sprint-bardim">
/* 底部操作列整列淡出：閱讀階段每段 4 秒後變淡；碰到就恢復 */
(function(){var a=document.getElementById('act'),t=null;if(!a)return;
 function reading(){return typeof st==='number'&&st<4}
 window.barWake=function(){a.classList.remove('dim');clearTimeout(t);if(reading())t=setTimeout(function(){if(reading())a.classList.add('dim')},4000)};
 a.addEventListener('pointerdown',function(){if(a.classList.contains('dim'))barWake()},true);
 setInterval(function(){if(!reading()&&a.classList.contains('dim'))a.classList.remove('dim')},500);
})();
</script>
