分布，是區域計畫法第1條所列目的。", "✓ 促進市、鎮、鄉街有計畫之均衡發展，是都市計畫法的立法目的，不是區域計畫法。", "❌ 加速並健全經濟發展、改善生活環境、增進公共福利，是區域計畫法第1條所列目的。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "101", "num": 16, "q": "依非都市土地使用管制規則規定，鹽業、礦業、水利用地之建蔽率與容積率，係由何中央主管機關會同建築管理、地政機關訂定？", "opts": ["經濟部", "內政部", "行政院農業委員會", "交通部"], "ans": 0, "exps": ["✓ 鹽業、礦業、水利用地之建蔽率與容積率，由經濟部會同建築管理、地政機關訂定。", "❌ 內政部是區域計畫的中央主管機關，但這三類用地由經濟部訂定。", "❌ 農業主管機關管農業用地，不管鹽業、礦業、水利用地的強度。", "❌ 交通部不是這三類用地強度的訂定機關。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "101", "num": 18, "q": "為九二一震災地區住宅重建，經縣（市）政府依實施區域計畫地區建築管理辦法第4條之1規定公告位於車籠埔斷層線二側各多少公尺建築管制範圍內之甲種、乙種或丙種建築用地，於震災前已有合法建築物，經全倒或已自動拆除者，除有特定情形者外，土地所有權人得申請其他自有土地變更編定，並將原有甲種、乙種或丙種建築用地，一併申請變更編定為國土保安用地。", "opts": ["十公尺", "十五公尺", "二十公尺", "二十五公尺"], "ans": 1, "exps": ["❌ 10公尺不是題目所指的建築管制範圍。", "✓ 車籠埔斷層線二側各15公尺為建築管制範圍，範圍內震後全倒者可申請變更為國土保安用地。", "❌ 20公尺不是該管制範圍。", "❌ 25公尺不是該管制範圍。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "101", "num": 19, "q": "依區域計畫法規定，有關開發影響費之敍述，下列何者正確？", "opts": ["開發影響費得以開發區內可建築土地抵充之", "開發影響費之收費範圍及標準，由直轄市、縣（市）主管機關定之", "開發影響費得成立基金；其收支保管及運用辦法，由中央主管機關定之", "開發影響費之徵收，不適用於都市土地"], "ans": 0, "exps": ["✓ 開發影響費得以開發區內可建築土地抵充（區域計畫法第15-3條）。", "❌ 區域計畫法§15-3第2項：開發影響費之收費範圍、標準由「中央主管機關」定之，本項寫成直轄市、縣（市），故錯誤（舊筆記有誤，官方答案正確）。", "❌ 區域計畫法§15-3第3項：開發影響費得成立基金，其收支保管及運用辦法由「直轄市、縣（市）主管機關」定之，本項寫成中央，故錯誤（舊筆記有誤）。", "❌ 區域計畫法§15-3第4項：開發影響費之徵收「於都市土地準用之」，並未排除都市土地，此項說法錯誤。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "101", "num": 38, "q": "關於非都市土地使用管制之使用強度，下列何者為最正確的規定？", "opts": ["甲種建築用地︰建蔽率百分之六十。容積率百分之二百四十", "乙種建築用地︰建蔽率百分之六十。容積率百分之一百二十", "丙種建築用地︰建蔽率百分之六十。容積率百分之一百二十", "丁種建築用地︰建蔽率百分之六十。容積率百分之三百"], "ans": 0, "exps": ["✓ 甲種建築用地建蔽率60%、容積率240%，與規則一致。", "❌ 乙種建築用地容積率是240%，不是120%。", "❌ 丙種建築用地建蔽率是40%，不是60%。", "❌ 丁種建築用地建蔽率是70%，不是60%。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 1, "q": "依非都市土地使用管制規則規定，下列何者為甲種建築用地之建蔽率及容積率？", "opts": ["建蔽率 60%，容積率 240%", "建蔽率 60%，容積率 120%", "建蔽率 40%，容積率 240%", "建蔽率 40%，容積率 120%"], "ans": 0, "exps": ["✓ 甲種建築用地建蔽率60%、容積率240%。", "❌ 容積率120%是丙種建築用地的數字。", "❌ 建蔽率40%不屬於甲種建築用地。", "❌ 40%／120%是丙種建築用地的標準。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 3, "q": "依區域計畫法第21條規定，直轄市或縣（市）政府對於違反非都市土地管制使用者之處罰，下列何項罰則錯誤？", "opts": ["處新臺幣六萬元以上五十萬元以下罰鍰", "得限期令其變更使用、停止使用", "拆除其地上物恢復原狀", "經限期繳納而逾期間不繳納罰鍰者，移送法院強制執行"], "ans": 0, "exps": ["✓ 區域計畫法第21條罰鍰是6萬至30萬，不是6萬至50萬，故此項錯誤。", "❌ 得限期變更使用、停止使用，是第21條明定的處分，敘述正確。", "❌ 得拆除地上物恢復原狀，是第21條明定的處分，敘述正確。", "❌ 逾期不繳納罰鍰者移送法院強制執行，敘述正確。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 4, "q": "依非都市土地使用管制規則規定，各級政府為執行區域計畫，得就各區域計畫所列重要風景及名勝地區研擬下列何項計畫？", "opts": ["風景區計畫", "特定專用區計畫", "生態保育區計畫", "觀光遊憩區計畫"], "ans": 0, "exps": ["✓ 各級政府得就區域計畫所列重要風景及名勝地區，研擬風景區計畫。", "❌ 特定專用區是使用分區，不是此處的計畫名稱。", "❌ 生態保育區計畫不是法定用語。", "❌ 觀光遊憩區計畫不是法定用語。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 15, "q": "依非都市土地使用管制規則規定，山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，適用下列何項用地之管制？", "opts": ["特定目的事業用地", "林業用地", "生態保護用地", "國土保安用地"], "ans": 1, "exps": ["❌ 特定目的事業用地不是山坡地未編定土地的預設管制類別。", "✓ 山坡地範圍內森林區、山坡地保育區、風景區土地，未編定使用地類別前，適用林業用地管制。", "❌ 生態保護用地不是預設管制類別。", "❌ 國土保安用地不是預設管制類別。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 36, "q": "依區域計畫法施行細則規定，供山坡地範圍外之農業區內建築使用之土地，依規定編定為何種土地？", "opts": ["甲種建築用地", "乙種建築用地", "丙種建築用地", "丁種建築用地"], "ans": 0, "exps": ["✓ 區域計畫法施行細則§13：甲種建築用地＝供山坡地範圍外之農業區內建築使用者，與官方答案一致（舊筆記記為乙種係錯誤；乙種是鄉村區）。", "❌ 乙種建築用地是供鄉村區內建築使用（施行細則§13），不是山坡地範圍外之農業區。", "❌ 丙種建築用地供森林區、山坡地保育區、風景區及山坡地農業區建築使用。", "❌ 丁種建築用地供工廠及有關工業設施建築使用，不是農業區建築使用。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "102", "num": 37, "q": "依區域計畫法施行細則規定，下列何者為非都市土地得劃定之使用區？", "opts": ["商業區", "住宅區", "住商混合區", "一般農業區"], "ans": 3, "exps": ["❌ 商業區是都市計畫的使用分區，非都市土地不劃定。", "❌ 住宅區是都市計畫的使用分區，非都市土地不劃定。", "❌ 住商混合區不是非都市土地的使用分區。", "✓ 一般農業區是非都市土地11種使用分區之一，可依規定劃定。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "103", "num": 1, "q": "非都市土地申請開發達一定規模者，應辦理土地使用分區變更，下列之相關敘述何者正確？", "opts": ["申請設立學校之土地面積達五公頃以上，應變更為特定專用區", "申請開發遊憩設施之土地面積達五公頃以上，應變更為特定專用區", "申請開發高爾夫球場之土地面積達五公頃以上，應變更為特定專用區", "申請開發社區之計畫達一百戶或土地面積在五公頃以上，應變更為鄉村區"], "ans": 1, "exps": ["❌ 設立學校不是5公頃變更為特定專用區的類型。", "✓ 開發遊憩設施達5公頃以上，應變更為特定專用區。", "❌ 高爾夫球場的門檻是10公頃，不是5公頃。", "❌ 開發社區的門檻是50戶或1公頃，變更為鄉村區，不是100戶或5公頃。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "103", "num": 17, "q": "依據區域計畫法，政府依法編定之各種使用地，其土地能供使用之性質，下列何者為是？", "opts": ["甲種建築用地係供鄉村區內建築使用者", "乙種建築用地係供山坡地範圍外之農業區內建築使用者", "丙種建築用地係供森林區、山坡地保育區、風景區及山坡地範圍之農業區內建築使用者", "生態保護用地係供國土保安使用者"], "ans": 2, "exps": ["❌ 甲種建築用地是供山坡地範圍外之農業區內建築使用（施行細則§13）；供鄉村區的是乙種，故此項錯誤。", "❌ 乙種建築用地是供鄉村區內建築使用（施行細則§13）；供山坡地範圍外農業區的是甲種，故此項錯誤。", "✓ 丙種建築用地供森林區、山坡地保育區、風景區及山坡地範圍農業區內建築使用。", "❌ 生態保護用地供生態保護使用，不是供國土保安使用。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "103", "num": 21, "q": "有關都市土地、非都市土地的敘述與土地登記謄本運用，下列何者正確？", "opts": ["藉由土地登記簿謄本標示部之登載資料，可知該筆土地是否為都市土地或非都市土地", "都市土地係指以土地分區使用計畫及編定各種使用地加以管制", "非都市土地係以土地分區使用計畫對其使用作不同程度之管制", "藉由土地登記簿謄本標示部之登載資料，可知該筆土地之都市土地使用分區"], "ans": 0, "exps": ["✓ 由土地登記謄本標示部的登載資料，可知該筆土地是都市或非都市土地。", "❌ 都市土地依都市計畫管制；以分區使用計畫及編定使用地管制的是非都市土地。", "❌ 非都市土地管制重點是使用分區加使用地編定，本項敘述不被官方答案採認。", "❌ 標示部不是用來查都市土地使用分區的，本項不正確。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "104", "num": 19, "q": "非都市土地申請開發社區之計畫，達到下列何種規模時，應辦理土地使用分區變更為鄉村區？", "opts": ["五十戶或土地面積在一公頃以上", "五十戶或土地面積在二公頃以上", "一百戶或土地面積在二公頃以上", "一百戶或土地面積在三公頃以上"], "ans": 0, "exps": ["✓ 開發社區達50戶或面積1公頃以上，應變更為鄉村區。", "❌ 50戶搭配2公頃的組合不是法定門檻。", "❌ 100戶搭配2公頃的組合不是法定門檻。", "❌ 100戶搭配3公頃的組合不是法定門檻。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "104", "num": 21, "q": "依區域計畫法之規定，區域計畫公告實施後，有關直轄市或縣（市）政府應製定非都市土地使用分區圖，並編定各種使用地，於報經上級主管機關核備後實施管制，請指出該使用分區圖及使用地之製定與編定的依據為何？", "opts": ["非都市土地之開發計畫", "非都市土地分區使用計畫", "非都市土地產業發展計畫", "非都市土地管制計畫"], "ans": 1, "exps": ["❌ 開發計畫是個案申請文件，不是分區圖與使用地編定的依據。", "✓ 使用分區圖及使用地編定，依據是非都市土地分區使用計畫（區域計畫法第15條）。", "❌ 產業發展計畫不是分區編定的法定依據。", "❌ 管制計畫不是法定用語。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "104", "num": 22, "q": "依區域計畫法規定，區域計畫之中央主管機關，下列何者正確？", "opts": ["行政院", "內政部", "國家發展委員會", "營建署"], "ans": 1, "exps": ["❌ 行政院不是區域計畫法所定的中央主管機關。", "✓ 區域計畫法第4條：中央主管機關為內政部。", "❌ 國家發展委員會不是區域計畫法的中央主管機關。", "❌ 營建署是內政部所屬機關（現已改制為內政部國土管理署），法定主管機關為內政部（區域計畫法§4）。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "104", "num": 24, "q": "依區域計畫法之規定，直轄市或縣（市）政府基於法定理由，得報經上級主管機關核定，逕為辦理分區變更。請指出下列何者為所稱之法定理由？", "opts": ["為加強資源保育須檢討變更使用分區者", "為促進區域土地權利調整者", "為實施中央重大建設事業者", "為區域建設推行委員會之建議者"], "ans": 0, "exps": ["✓ 為加強資源保育須檢討變更使用分區，是縣（市）政府得報經上級核定逕為分區變更的法定理由之一。", "❌ 促進區域土地權利調整不是法定的逕為變更理由。", "❌ 實施中央重大建設的列舉文字與法定理由不符，官方答案未採。", "❌ 區域建設推行委員會之建議，不是此處法定的逕為變更理由。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "104", "num": 25, "q": "非都市土地申請開發案件，申請人擬具之興辦事業計畫，土地位屬山坡地範圍內者，除有法規所定之特殊情形者外，其最低開發面積規模之限制，下列何者正確？", "opts": ["五公頃", "十公頃", "十五公頃", "二十公頃"], "ans": 1, "exps": ["❌ 5公頃是遊憩設施變更為特定專用區的門檻，不是山坡地最低開發面積。", "✓ 山坡地範圍內開發案，最低開發面積為10公頃。", "❌ 15公頃不是法定最低開發面積。", "❌ 20公頃不是法定最低開發面積。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "106", "num": 24, "q": "下列有關違反區域計畫管制使用土地者之處罰規定，何者錯誤？", "opts": ["由該管直轄市、縣（市）政府處新臺幣 6 萬元以上 30 萬元以下罰鍰", "經限期變更使用、停止使用或拆除地上物恢復原狀而不遵從者，得按次處罰", "經限期變更使用而不遵從者，並得停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施", "不依限變更土地使用者，除依強制執行法辦理外，並得處 6 個月以下有期徒刑或拘役"], "ans": 3, "exps": ["❌ 處6萬至30萬罰鍰，敘述正確。", "❌ 限期不遵從得按次處罰，敘述正確。", "❌ 限期不遵從得停止供水供電、封閉、強制拆除，敘述正確。", "✓ 不依限變更使用者，是依行政執行法辦理並得處6個月以下徒刑或拘役，不是強制執行法，故此項錯誤。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "106", "num": 25, "q": "下列何者非區域計畫法規定區域計畫得隨時檢討變更之原因？", "opts": ["發生或避免重大災害", "興辦重大開發或建設事業", "為適應國防或經濟發展之需要", "區域建設推行委員會之建議"], "ans": 2, "exps": ["❌ 發生或避免重大災害，是得隨時檢討變更的原因，故非本題答案。", "❌ 興辦重大開發或建設事業，是得隨時檢討變更的原因。", "✓ 為適應國防或經濟發展之需要，不是區域計畫法所列隨時檢討變更的原因（那是都市計畫迅行變更事由）。", "❌ 區域建設推行委員會之建議，是得隨時檢討變更的原因。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "106", "num": 35, "q": "山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地類別之前，適用那項用地之管制？", "opts": ["林業用地", "遊憩用地", "生態保護用地", "國土保安用地"], "ans": 0, "exps": ["✓ 山坡地範圍內森林區、山坡地保育區、風景區未編定使用地類別前，適用林業用地管制。", "❌ 遊憩用地不是預設管制類別。", "❌ 生態保護用地不是預設管制類別。", "❌ 國土保安用地不是預設管制類別。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "107", "num": 17, "q": "依非都市土地使用管制規則規定，山坡地範圍內之土地，在未編定使用地類別前，適用林業用地之管制，下列何者不包含在內？", "opts": ["森林區", "風景區", "國家公園區", "山坡地保育區"], "ans": 2, "exps": ["❌ 森林區包含在適用林業用地管制的範圍內，不是答案。", "❌ 風景區包含在適用林業用地管制的範圍內，不是答案。", "✓ 國家公園區不在森林區、山坡地保育區、風景區三者之內，故不適用此規定。", "❌ 山坡地保育區包含在適用林業用地管制的範圍內，不是答案。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "108", "num": 9, "q": "山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，適用何種管制？", "opts": ["林業用地", "農牧用地", "國土保安用地", "原住民保留地"], "ans": 0, "exps": ["✓ 山坡地範圍內森林區、山坡地保育區、風景區未編定使用地類別前，適用林業用地管制。", "❌ 農牧用地不是預設管制類別。", "❌ 國土保安用地不是預設管制類別。", "❌ 原住民保留地不是使用地編定類別。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "108", "num": 20, "q": "非都市土地申請開發達一定規模者，應辦理土地使用分區變更，下列何項敘述錯誤？", "opts": ["申請開發社區之計畫達五十戶或土地面積在一公頃以上，應變更為鄉村區", "申請開發為工業使用之土地面積達十公頃以上，應變更為工業區", "申請開發遊憩設施之土地面積達五公頃以上，應變更為特定專用區", "申請開發高爾夫球場之土地面積達五公頃以上，應變更為特定專用區"], "ans": 3, "exps": ["❌ 社區開發50戶或1公頃以上變更為鄉村區，敘述正確。", "❌ 工業使用10公頃以上變更為工業區，敘述正確。", "❌ 遊憩設施5公頃以上變更為特定專用區，敘述正確。", "✓ 高爾夫球場的門檻是10公頃，不是5公頃，故此項錯誤。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "108", "num": 25, "q": "非都市土地依區域計畫法施行細則之規定，得劃定幾種使用區？編定幾種使用地？", "opts": ["十種使用區；十八種使用地", "十種使用區；十九種使用地", "十一種使用區；十八種使用地", "十一種使用區；十九種使用地"], "ans": 3, "exps": ["❌ 使用區是11種，不是10種。", "❌ 使用區是11種，不是10種；使用地19種。", "❌ 使用地是19種，不是18種。", "✓ 非都市土地劃定11種使用區、編定19種使用地。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "109", "num": 7, "q": "依非都市土地使用管制規則規定，關於區域計畫擬定機關核發開發許可後，直轄市或縣（市）政府應報經區域計畫擬定機關廢止原開發許可之情形，下列敘述何者錯誤？", "opts": ["興辦事業計畫經目的事業主管機關廢止或依法失其效力、整地排水計畫之核准經直轄市或縣 （市）政府廢止或水土保持計畫之核准經水土保持主管機關廢止或依法失其效力", "申請人自行申請廢止", "與水源供應、鄰近之交通設施、排水系統、電力、電信及垃圾處理等公共設施及公用設備服務 未能相互配合者", "違反核定之土地使用計畫、目的事業或環境影響評估等相關法規，經該管主管機關提出要求處 分並經限期改善而未改善"], "ans": 2, "exps": ["❌ 興辦事業計畫被廢止或失效，是廢止開發許可的事由。", "❌ 申請人自行申請廢止，是廢止開發許可的事由。", "✓ 此項有誤：「與水源供應、交通、排水、電力電信及垃圾處理等公共設施及公用設備服務能相互配合」是區域計畫法§15-2核發開發許可的審議要件，不是開發許可後的廢止情形（舊筆記誤列）。", "❌ 違反核定計畫經限期改善而未改善，是廢止開發許可的事由。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "110", "num": 17, "q": "非都市土地經劃定使用分區並編定使用地類別，應依其容許使用之項目及許可使用細目使用。但中央目的事業主管機關認定為重大建設計畫所需之臨時性設施，經徵得使用地之中央主管機關及有關機關同意後，得核准為臨時使用。中央目的事業主管機關於核准時，應函請直轄市或縣（市）政府將臨時使用用途及期限等資料，依相關規定程序登錄於何處？", "opts": ["土地登記謄本", "土地參考資訊檔", "土地使用分區證明", "非都市土地許可使用書"], "ans": 1, "exps": ["❌ 謄本不是臨時使用資料登錄的處所。", "✓ 臨時使用用途及期限等資料，依規定登錄於土地參考資訊檔。", "❌ 使用分區證明不是登錄處所。", "❌ 許可使用書不是登錄處所。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "110", "num": 18, "q": "依非都市土地使用管制規則規定，土地使用編定後，其原有使用或原有建築物不合土地使用分區規定者，其使用限制，下列敘述何者錯誤？", "opts": ["在政府令其變更使用或拆除建築物前，得為從來之使用", "原有建築物除准修繕和增建外，不得改建", "若該土地或建築物，對公眾安全、衛生及福利有重大妨礙者，該管直轄市或縣（市）政府應限 期令其變更或停止使用、遷移、拆除或改建", "政府令其變更或停止使用，所受損害應予適當補償"], "ans": 1, "exps": ["❌ 政府令其變更或拆除前，得為從來之使用，敘述正確。", "✓ 原有建築物除准修繕外，不得增建或改建；本項說准增建，故錯誤。", "❌ 對公眾安全衛生有重大妨礙者，政府「應」限期令其變更或停止使用、遷移、拆除或改建，敘述正確。", "❌ 令其變更或停止使用所受損害應予適當補償，敘述正確。"]}, {"ch": "B1", "chName": "B1 區域計畫法／非都市土地管制", "year": "111", "num": 8, "q": "依規定，非都市土地甲種建築用地之建蔽率為百分之六十，容積率為百分之二百四十。倘甲有1筆100坪的甲種建築用地想規劃蓋1棟豪宅自住，請問甲的房屋每層樓最大建坪有幾坪？可蓋幾層樓高？", "opts": ["最大建坪 60 坪，4 層樓高", "最大建坪 60 坪，5 層樓高", "最大建坪 100 坪，2 層樓高", "最大建坪 100 坪，3 層樓高"], "ans": 0, "exps": ["✓ 100坪×60%＝每層60坪；總樓地板100坪×240%＝240坪，240÷60＝4層。", "❌ 建坪60坪正確，但5層會超過容積率，樓地板上限是240坪。", "❌ 建坪100坪超過建蔽率60%的上限。", "❌ 建坪100坪超過建蔽率60%的上限。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "99", "num": 14, "q": "依都市計畫法第83條之1規定，下列何者非屬得以容積移轉方式辦理者？", "opts": ["公共設施保留地之取得", "公共開放空間之提供", "歷史建築之保存", "農業用地之保護"], "ans": 3, "exps": ["❌ 公共設施保留地之取得，是都計法第83-1條容積移轉的適用情形。", "❌ 公共開放空間之提供，是容積移轉的適用情形。", "❌ 歷史建築之保存，是容積移轉的適用情形。", "✓ 農業用地之保護不在都計法第83-1條容積移轉適用情形內，故為「非屬」。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "99", "num": 23, "q": "依都市計畫法之規定，公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其佔用土地總面積不得少於全部計畫面積之多少？", "opts": ["百分之五", "百分之十", "百分之二十", "百分之三十"], "ans": 1, "exps": ["❌ 5%低於法定最低比例。", "✓ 公園、體育場所、綠地、廣場、兒童遊樂場，占用土地總面積不得少於全部計畫面積10%（都計法第45條）。", "❌ 20%高於法定最低比例，不是法定數字。", "❌ 30%高於法定最低比例，不是法定數字。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "99", "num": 34, "q": "依都市計畫法之規定，都市計畫經發布實施後，在某些情事發生時，當地直轄市、縣（市）（局）政府或鄉、鎮、縣轄市公所，應視實際情況迅行變更，下列何者不屬之？", "opts": ["因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時", "為避免重大災害之發生時", "為適應國防或經濟發展之需要時", "為保育生態環境及歷史遺跡之需要時"], "ans": 3, "exps": ["❌ 戰爭、地震、水災等重大事變遭受損壞，是迅行變更事由。", "❌ 為避免重大災害之發生，是迅行變更事由。", "❌ 為適應國防或經濟發展之需要，是迅行變更事由。", "✓ 保育生態環境及歷史遺跡不是迅行變更事由；法定四款還有配合中央或地方重大設施。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "100", "num": 23, "q": "下列何者為都市計畫法規定細部計畫書及細部計畫圖應表明事項？", "opts": ["居住密度及容納人口", "主要道路及其他公眾運輸系統", "住宅、商業、工業及其他土地使用配置", "學校用地、大型公園、批發市場之公共設施用地"], "ans": 0, "exps": ["✓ 居住密度及容納人口是細部計畫應表明事項（都計法第22條）。", "❌ 主要道路及公眾運輸系統屬主要計畫事項。", "❌ 住宅、商業、工業等土地使用配置屬主要計畫事項。", "❌ 學校、大型公園、批發市場等公共設施用地屬主要計畫事項。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "100", "num": 25, "q": "依都市計畫法之規定，市鎮計畫應先擬定主要計畫書，其表明之事項不包括：", "opts": ["人口成長、分布、組成", "土地使用分區管制內容", "住宅及其他土地使用之配置", "主要道路及其他公眾運輸系統"], "ans": 1, "exps": ["❌ 人口成長、分布、組成是主要計畫應表明事項。", "✓ 土地使用分區管制屬細部計畫事項，不是主要計畫書應表明事項，故為「不包括」。", "❌ 住宅及其他土地使用之配置是主要計畫應表明事項。", "❌ 主要道路及公眾運輸系統是主要計畫應表明事項。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 10, "q": "都市計畫法中所稱之優先發展區，係指預計在多少年內，必須優先規劃、建設發展之都市計畫地區？", "opts": ["五年", "十年", "十五年", "二十五年"], "ans": 1, "exps": ["❌ 5年不是優先發展區的預計年限。", "✓ 優先發展區指預計在10年內必須優先規劃、建設發展的地區（都計法第7條第4款）。", "❌ 15年不是法定年限。", "❌ 25年是主要計畫的最長實施年限，不是優先發展區。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 12, "q": "都市計畫法規範之都市計畫事業，不包括下列那一項？", "opts": ["公共設施實質建設之事業", "新市區建設實質建設之事業", "舊市區更新實質建設之事業", "開發許可實質建設之事業"], "ans": 3, "exps": ["❌ 公共設施實質建設，屬都市計畫事業。", "❌ 新市區實質建設，屬都市計畫事業。", "❌ 舊市區更新實質建設，屬都市計畫事業。", "✓ 開發許可是非都市土地的制度，不屬於都市計畫事業。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 13, "q": "直轄市、縣（市）（局）政府或鄉、鎮、縣轄市公所對於窳陋或髒亂地區認為有必要時，得視何種計畫劃定地區範圍，訂定更新計畫實施之？", "opts": ["主要計畫", "市地重劃計畫", "細部計畫", "區段徵收計畫"], "ans": 2, "exps": ["❌ 主要計畫只定大方向，更新範圍依官方答案不是據此劃定。", "❌ 市地重劃計畫是重劃制度，不是劃定更新地區範圍所依的計畫。", "✓ 官方答案為細部計畫：更新地區範圍落實在細部計畫層次劃定。", "❌ 區段徵收計畫是取得土地的方式，不是劃定更新範圍所依的計畫。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 14, "q": "依都市計畫法之規定，辦理更新計畫，對於更新地區範圍內之土地及地上物，得依法實施何種方法取得？", "opts": ["市地重劃", "聯合開發", "開發許可", "徵收或區段徵收"], "ans": 3, "exps": ["❌ 市地重劃不是都計法更新地區取得土地及地上物的法定方法。", "❌ 聯合開發不是此處列舉的法定方法。", "❌ 開發許可屬區域計畫法，與都市計畫更新無關。", "✓ 更新地區範圍內的土地及地上物，得依法實施徵收或區段徵收。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 15, "q": "都市更新處理方式，有重建、整建及維護三種。關於整建的定義，下列陳述何者最正確？", "opts": ["係為全地區之徵收、拆除原有建築、重新建築、住戶安置，並得變更其土地使用性質或使用密度", "加強區內土地使用及建築管理，改進區內公共設施，以保持其良好狀況", "強制區內建築物為改建、修建、維護或設備之充實，必要時，對部分指定之土地及建築物徵收、拆除 及重建，改進區內公共設施", "強制區內建築物為改建、修建、維護或設備之充實，必要時對部分指定之土地及建築物重劃、拆除及 重建，改進區內公共設施"], "ans": 2, "exps": ["❌ 這是重建的定義：全地區徵收、拆除、重新建築並安置住戶。", "❌ 這是維護的定義：加強土地使用及建築管理，保持良好狀況。（舊筆記表格把整建與維護對調，係筆記錯誤，以都計法§64為準。）", "✓ 整建：強制建築物改建、修建、維護或充實設備，必要時對部分土地及建築物徵收、拆除重建。（都計法§64整建定義即此；舊筆記對照表有誤。）", "❌ 此項把徵收寫成重劃，與法條文字不符。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 17, "q": "申請興建農舍須符合之規定，下列何者最正確？", "opts": ["興建農舍之申請人不須具備農民身分，並應在該農業區內有農業用地或農場", "農舍之高度不得超過四層或十六公尺，建築面積不得超過申請興建農舍之該宗農業用地面積百分之十， 建築總樓地板面積不得超過六百六十平方公尺，與都市計畫道路境界之距離，除合法農舍申請立體增 建外，不得小於八公尺", "都市計畫農業區內之農業用地，其已申請建築者（包括百分之十農舍面積及百分之九十之農業用地）， 主管建築機關應於都市計畫及地籍套繪圖上著色標示之，嗣後不論該百分之九十農業用地是否分割， 均不得再行申請興建農舍", "農舍得自行變更使用"], "ans": 2, "exps": ["❌ 申請興建農舍須具農民身分，本項說不須具備，錯誤。", "❌ 本項的高度、面積、距離等數字與農舍規定不符。", "✓ 已申請建農舍的農業用地須在套繪圖著色標示，其90%農業用地分割後仍不得再申請農舍。", "❌ 農舍不得自行變更使用，本項錯誤。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 20, "q": "依都市計畫法規定，主要計畫實施進度以五年為一期，最長不得超過多少年？", "opts": ["十年", "十五年", "二十五年", "三十年"], "ans": 2, "exps": ["❌ 10年不是主要計畫實施的最長年限。", "❌ 15年不是最長年限。", "✓ 主要計畫實施進度以5年為一期，最長不得超過25年（都計法第15條第2項）。", "❌ 30年超過法定上限。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "101", "num": 21, "q": "依都市計畫法規定，都市計畫經發布實施後，下列何者非屬應視實際情況迅行辦理都市計畫變更之情事？", "opts": ["因水災或其他重大事變遭受損壞時", "因土地權利人權利遭受重大損失時", "為適應經濟發展之需要", "為配合中央、直轄市或縣（市）興建之重大設施時"], "ans": 1, "exps": ["❌ 因水災等重大事變遭受損壞，是迅行變更事由。", "✓ 因土地權利人權利遭受重大損失，不是迅行變更事由，故為「非屬」。", "❌ 為適應經濟發展之需要，是迅行變更事由。", "❌ 配合中央、直轄市或縣（市）興建重大設施，是迅行變更事由。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "102", "num": 14, "q": "依都市計畫法規定，獲准投資辦理都市計畫事業之私人或團體，其所需用之公共設施用地，屬於私有而無法協議收購者，得依下列何種方式取得？", "opts": ["請求該管地方政府以交換方式取得", "請求該管地方政府實施徵收", "請求該管地方政府照價收買", "應備妥價款，申請該管直轄市或縣（市）政府代為收買之"], "ans": 3, "exps": ["❌ 交換不是私人辦理都市計畫事業取得私有公設用地的方式。", "❌ 私人或團體沒有徵收權，不能請政府替其徵收。", "❌ 照價收買是平均地權手段，不適用此處。", "✓ 私人辦理都市計畫事業，無法協議購買者，應備妥價款申請政府代為收買（都計法第53條）。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "102", "num": 38, "q": "依都市計畫法第17條規定，都市計畫內屬於第一期優先發展之地區，應於細部計畫發布後，最多幾年內應完成公共設施？", "opts": ["一年內", "三年內", "五年內", "七年內"], "ans": 2, "exps": ["❌ 1年不是完成公共設施的期限。", "❌ 3年不是完成公共設施的期限。", "✓ 第一期發展地區於細部計畫發布後，最多5年內完成公共設施建設。", "❌ 7年不是法定期限。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "103", "num": 2, "q": "區域計畫公告實施後，凡依區域計畫應擬定下列何種計畫或已有計畫而須變更者，當地都市計畫主管機關應按規定期限辦理擬定或變更手續？", "opts": ["主要計畫", "綱要計畫", "細部計畫", "特定區計畫"], "ans": 3, "exps": ["❌ 主要計畫不是區域計畫公告後此處所列應擬定的計畫種類。", "❌ 綱要計畫不是都市計畫種類。", "❌ 細部計畫不是此處官方答案所列的種類。", "✓ 官方答案為特定區計畫：區域計畫公告後，依其應擬定或變更的都市計畫，地方須依限辦理。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "103", "num": 39, "q": "依都市計畫法之規定，下列何者非屬細部計畫書及細部計畫圖表明之事項？", "opts": ["主要道路及其他公眾運輸系統", "居住密度及容納人口", "事業及財務計畫", "土地使用分區管制"], "ans": 0, "exps": ["✓ 主要道路及公眾運輸系統屬主要計畫事項，不是細部計畫書表明事項。", "❌ 居住密度及容納人口是細部計畫表明事項。", "❌ 事業及財務計畫是細部計畫表明事項。", "❌ 土地使用分區管制是細部計畫表明事項。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "103", "num": 40, "q": "依都市計畫法指定之公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所取得之，下列取得方式何者為非？", "opts": ["徵收", "都市更新", "市地重劃", "區段徵收"], "ans": 1, "exps": ["❌ 徵收是公共設施保留地的取得方式之一。", "✓ 都市更新不是公設保留地列舉的取得方式，故為「為非」。", "❌ 市地重劃是公設保留地的取得方式之一。", "❌ 區段徵收是公設保留地的取得方式之一。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "104", "num": 23, "q": "依都市計畫法規定，人口集居達三千，而其中工商業人口占就業總人口百分之五十以上之地區，應擬定下列何種計畫？", "opts": ["市計畫", "鎮計畫", "鄉街計畫", "特定區計畫"], "ans": 2, "exps": ["❌ 市計畫另有較大規模與層級的設置條件，不是3,000人這個條件。", "❌ 鎮計畫另有鎮的規模條件，不是本題所問。", "✓ 都市計畫法§11：人口集居達三千，而其中工商業人口占就業總人口50%以上之地區，應擬定鄉街計畫（舊筆記寫在市鎮計畫係錯誤）。", "❌ 特定區計畫依特殊目的劃設，不以人口與工商業比例為條件。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "104", "num": 26, "q": "依都市計畫法規定，未發布細部計畫地區，應限制其建築使用及變更地形。但主要計畫發布至少已逾多少年以上，而能確定建築線者，得依有關建築法令之規定，由主管建築機關指定建築線，核發建築執照？", "opts": ["一年", "二年", "三年", "五年"], "ans": 1, "exps": ["❌ 1年不是門檻。", "✓ 未發布細部計畫地區，主要計畫發布已逾2年且能確定建築線者，得指定建築線核發建照。", "❌ 3年不是門檻。", "❌ 5年是第一期發展地區完成公共設施的期限，不是這裡的門檻。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "104", "num": 27, "q": "私有公共設施保留地得申請與公有非公用土地辦理交換，其劃設逾多少年未經政府取得者，得優先辦理交換？", "opts": ["十年", "十五年", "二十年", "二十五年"], "ans": 3, "exps": ["❌ 10年不是優先辦理交換的劃設年限。", "❌ 15年不是劃設年限。", "❌ 20年不是官方答案；筆記為25年。", "✓ 公設保留地劃設逾25年未經政府取得者，得優先辦理與公有非公用土地交換。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "105", "num": 30, "q": "都市計畫法所定義的都市計畫事業，下列何者不包括在內？", "opts": ["公共設施建設", "新市鎮建設", "新市區建設", "舊市區更新建設"], "ans": 1, "exps": ["❌ 公共設施建設是都市計畫事業。", "✓ 新市鎮建設不在都市計畫事業範圍；事業為公共設施建設、新市區建設、舊市區更新。", "❌ 新市區建設是都市計畫事業。", "❌ 舊市區更新建設是都市計畫事業。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "106", "num": 8, "q": "下列有關都市計畫主要計畫之擬定及核定程序規定，何者錯誤？", "opts": ["主要計畫擬定後，應先送由該管政府或鄉、鎮、縣轄市都市計畫委員會審議", "縣政府所在地及縣轄市之主要計畫由內政部核定", "地方政府於接到主要計畫核定公文之日起 30 日內，應將主要計畫書、圖發布實施", "主要計畫經該管政府都市計畫委員會審議後，應公開展覽 30 天及舉行說明會"], "ans": 3, "exps": ["❌ 本項依官方答案不是錯誤選項。", "❌ 縣政府所在地及縣轄市的主要計畫由內政部核定，敘述正確。", "❌ 接到核定公文30日內發布實施，敘述正確。", "✓ 此項有誤：都市計畫法§19第1項規定主要計畫應於「送都市計畫委員會審議前」公開展覽30天及舉行說明會，不是審議後（舊筆記有誤）。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "106", "num": 26, "q": "下列有關都市計畫法中公共設施用地之設置規定，何者錯誤？", "opts": ["公共設施用地，應就人口、土地使用、交通等現狀及未來發展趨勢，決定其項目、位置與面積", "公共設施用地應儘先利用適當之私有土地", "公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積10%", "道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公路通過實施都市計畫之區域者，應避免穿越市區中心"], "ans": 1, "exps": ["❌ 公共設施用地依人口、土地使用、交通現狀及未來發展趨勢決定項目、位置與面積（都計§43），敘述正確。", "✓ 本項錯誤（官方答案B）：都市計畫法§42Ⅱ「前項各款公共設施用地應儘先利用適當之<b>公有</b>土地」，不是私有土地。", "❌ 都計§45：公園等五項占用土地總面積不得少於全部計畫面積10%，敘述正確。", "❌ 都計§44：道路系統、停車場所及加油站依分區及交通配置；鐵路、公路應避免穿越市區中心，敘述正確。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "106", "num": 27, "q": "依都市計畫法第22條規定，下列何者非細部計畫應以細部計畫書及細部計畫圖應表明之事項？", "opts": ["名勝、古蹟及具有紀念性或藝術價值應予保存之建築", "居住密度及容納人口", "土地使用分區管制", "道路系統"], "ans": 0, "exps": ["✓ 名勝、古蹟及具有紀念性或藝術價值應予保存之建築，是都市計畫法§15第1項第5款「主要計畫」應表明事項，§22細部計畫並未列入，與官方答案一致（原註記有誤）。", "❌ 居住密度及容納人口是細部計畫事項。", "❌ 土地使用分區管制是細部計畫事項。", "❌ 道路系統是細部計畫事項。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "106", "num": 37, "q": "都市計畫發布實施後，應依何法之規定，實施建築管理？", "opts": ["建築法", "建築技術規則", "建築師法", "建築管理規則"], "ans": 0, "exps": ["✓ 都市計畫發布實施後，依建築法實施建築管理（都計法第40條）。", "❌ 建築技術規則是建築法的施行規範，不是法定依據。", "❌ 建築師法規範建築師業務，不管建築管理。", "❌ 建築管理規則不是法條所指的法律。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "107", "num": 16, "q": "區域計畫法有關非都市土地許可開發之規定，下列敘述，何者錯誤？", "opts": ["開發許可前，應先將申請開發案提報各該區域計畫委員會審議之", "申請開發許可，申請人應先取得開發地區內全部土地及建築物之所有權", "開發許可後，辦理分區或用地變更前，應將開發區內公共設施用地完成分割移轉登記為各該直 轄市、縣（市）有或鄉、鎮（市）有，並繳交開發影響費", "直轄市、縣（市）政府受理開發申請案後，除情形特殊者外，應於六十日內報請各該區域計畫 擬定機關審議"], "ans": 1, "exps": ["❌ 開發前先提報區域計畫委員會審議，敘述正確。", "✓ 此項有誤：區域計畫法§15-2只要求申請人「已取得開發地區土地及建築物權利證明文件」，並非須取得全部土地及建築物之所有權（舊筆記有誤）。", "❌ 公共設施用地完成分割移轉登記並繳開發影響費，敘述正確。", "❌ 受理後除特殊情形外60日內報請審議，敘述正確。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "108", "num": 12, "q": "依都市計畫法規定，都市計畫區內之公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之幾？", "opts": ["百分之十", "百分之十二", "百分之十五", "百分之十七"], "ans": 0, "exps": ["✓ 公園、體育場所、綠地、廣場、兒童遊樂場占地不得少於全部計畫面積10%。", "❌ 12%不是法定數字。", "❌ 15%不是法定數字。", "❌ 17%不是法定數字。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "108", "num": 15, "q": "都市計畫應依據現在及既往情況，並預計未來幾年內之發展情形訂定之？", "opts": ["十五年", "二十年", "二十五年", "三十年"], "ans": 2, "exps": ["❌ 15年不是法定預計年限。", "❌ 20年不是法定預計年限。", "✓ 都市計畫應依現況與既往情況，預計25年內的發展情形訂定。", "❌ 30年超過法定年限。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "109", "num": 6, "q": "依都市計畫法之規定，關於都市計畫之變更，下列敘述何者正確？", "opts": ["都市計畫之變更，如直接限制一定區域人民之權利者，則其性質即屬公法上之觀念通知", "都市計畫之變更屬法規性質，並非行政處分，都市計畫個別變更範圍外之人民，如因都市計畫 個別變更致其權利或法律上利益受侵害時，無法提起行政訴訟以資救濟", "為適應國防或經濟發展之需要而變更都市計畫時，應以通盤檢討變更之方式辦理", "為避免重大災害之發生而變更都市計畫時，應以個案迅行變更之方式辦理"], "ans": 3, "exps": ["❌ 都市計畫變更若限制人民權利，屬行政處分，不是觀念通知。", "❌ 個別變更範圍外人民權利受侵害時，仍可救濟，本項說法錯誤。", "❌ 國防或經濟發展需要屬迅行變更事由，不須通盤檢討。", "✓ 為避免重大災害而變更，屬迅行變更（都計法第27條），以個案變更辦理。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "109", "num": 21, "q": "依都市計畫法規定，下列何種公共設施應按閭鄰單位或居民分布情形適當配置之？", "opts": ["社會福利設施", "垃圾處理場", "污水處理廠", "屠宰場"], "ans": 0, "exps": ["✓ 社會福利設施依都計法第46條，按閭鄰單位或居民分布情形配置。", "❌ 垃圾處理場不在第46條列舉的設施內。", "❌ 污水處理廠不在第46條列舉的設施內。", "❌ 屠宰場不在第46條列舉的設施內。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "110", "num": 15, "q": "土地權利關係人依都市計畫法第24條規定自行擬定或變更細部計畫時，主管機關得要求土地權利關係人提供或捐贈都市計畫變更範圍內之那些回饋項目予當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所？①公共設施用地②可建築土地③樓地板面積④一定金額", "opts": ["僅①④", "僅①②③", "僅②③④", "①②③④"], "ans": 3, "exps": ["❌ 僅列①④不完整，漏了可建築土地與樓地板面積。", "❌ 僅列①②③不完整，漏了一定金額。", "❌ 僅列②③④不完整，漏了公共設施用地。", "✓ 主管機關得要求提供公共設施用地、可建築土地、樓地板面積或一定金額四項（第27條之1第1項）。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "110", "num": 16, "q": "私有公共設施保留地得申請與公有非公用土地辦理交換，依都市計畫法之規定，不受下列那些法規相關規定之限制？①土地法②所得稅法③國有財產法④各級政府財產管理法令", "opts": ["②④", "②③④", "①③④", "①②③④"], "ans": 2, "exps": ["❌ ②所得稅法不在排除範圍，且漏了土地法。", "❌ ②所得稅法不在排除範圍。", "✓ 公設保留地交換不受土地法、國有財產法、各級政府財產管理法令限制（第50條之2）。", "❌ 所得稅法不在排除範圍，四項全選錯誤。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "111", "num": 12, "q": "都市計畫地區於訂定分區發展優先次序後，第一期發展地區應於主要計畫發布實施後，多久期限完成細部計畫？並於細部計畫發布後，多久期限完成公共設施建設？", "opts": ["五年內完成細部計畫，細部計畫發布後二年內完成公共設施建設", "四年內完成細部計畫，細部計畫發布後三年內完成公共設施建設", "三年內完成細部計畫，細部計畫發布後四年內完成公共設施建設", "二年內完成細部計畫，細部計畫發布後五年內完成公共設施建設"], "ans": 3, "exps": ["❌ 細部計畫期限不是5年，公共設施也不是2年。", "❌ 細部計畫期限不是4年。", "❌ 細部計畫期限不是3年。", "✓ 第一期發展地區於主要計畫發布後2年內完成細部計畫，細部計畫發布後5年內完成公共設施。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "112", "num": 22, "q": "依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於多少？", "opts": ["五百分之一", "一千分之一", "一萬分之一", "一萬五千分之一"], "ans": 2, "exps": ["❌ 1/500不是主要計畫圖的最小比例尺。", "❌ 1/1,000不是主要計畫圖的最小比例尺。", "✓ 主要計畫圖比例尺不得小於1/10,000（第15條）。", "❌ 1/15,000比例過小，不符規定。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "113", "num": 4, "q": "依都市計畫法規定，有關主要計畫之核定，下列何者正確？", "opts": ["鎮及鄉街之主要計畫由內政部核定", "直轄市之主要計畫由行政院核定", "特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案", "特定區計畫由內政部訂定者，由行政院核定"], "ans": 0, "exps": ["✓ 都市計畫法§20第1項第4款：鎮及鄉街之主要計畫由內政部核定，與官方答案一致（舊筆記「縣政府核定」係錯誤）。", "❌ 直轄市之主要計畫由「內政部」核定（§20第1項第2款），不是行政院，故錯誤。", "❌ §20第1項第5款：特定區計畫由縣（市）政府擬定者，由內政部核定（無「轉報行政院備案」；轉報備案的是直轄市政府擬定者），故錯誤。", "❌ §20第1項第5款：特定區計畫由內政部訂定者，報行政院「備案」，不是由行政院核定，故錯誤。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "113", "num": 9, "q": "依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正者，後續如何辦理？", "opts": ["免再公開展覽及舉行說明會", "再公開展覽", "再舉行說明會", "再公開展覽及舉行說明會"], "ans": 0, "exps": ["✓ 主要計畫經都委會審議修正或內政部指示修正者，免再公開展覽及舉行說明會。", "❌ 再公開展覽並非必要。", "❌ 再舉行說明會並非必要。", "❌ 再公開展覽及說明會並非必要。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "113", "num": 13, "q": "都市計畫地區範圍內，應視實際情況，分別設置公共設施用地，其設置標準之規定，下列何者正確？", "opts": ["應就人口分布、所得及納稅能力、地價高低、產業進駐情形等現狀，決定其項目、位置與面積， 以增進市民活動之便利，及確保良好之都市生活環境", "中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空 等公共設施，應按閭鄰單位或居民分布情形適當配置之", "公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置， 除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之二十", "道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公 路通過實施都市計畫之區域者，應以市區中心為規劃重點，以增進市民活動之便利"], "ans": 1, "exps": ["❌ 項目位置面積應依人口、土地使用、交通等現狀決定，不是所得、納稅能力、地價。", "✓ 中小學校、社教場所、市場、郵電、衛生、警消等，按閭鄰單位或居民分布情形配置（第46條）。", "❌ 公園、體育場所等占地不得少於10%，不是20%。", "❌ 鐵路公路通過都市計畫區應避免穿越市區中心，不是以市區中心為重點。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "113", "num": 14, "q": "依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？", "opts": ["公共設施保留地在未取得前，得申請為臨時建築使用", "不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用", "私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府 財產管理法令相關規定之限制", "地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不 得請求補償"], "ans": 3, "exps": ["❌ 保留地未取得前得申請臨時建築使用，敘述正確。", "❌ 不得妨礙指定目的，但得繼續原來使用或改為妨礙較輕使用，敘述正確。", "❌ 私有保留地得與公有非公用土地交換，不受土地法、國有財產法限制，敘述正確。", "✓ 地上物清除或遷移，政府應予補償；本項說「不得請求補償」，故錯誤。"]}, {"ch": "B2", "chName": "B2 都市計畫法", "year": "114", "num": 18, "q": "依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？", "opts": ["主要計畫其實施進度以 5 年為一期，最長不得超過 25 年", "細部計畫圖，其比例尺不得小於一千五百分之一", "主要計畫圖，其比例尺不得小於一萬五千分之一", "主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起 20 日 內，將主要計畫書及主要計畫圖發布實施"], "ans": 0, "exps": ["✓ 主要計畫實施進度以5年為一期，最長不得超過25年。", "❌ 細部計畫圖比例尺不得小於1/1,200，不是1/1,500。", "❌ 主要計畫圖比例尺不得小於1/10,000，不是1/15,000。", "❌ 主要計畫核定後應於30日內發布實施，不是20日。"]}, {"ch": "B3", "chName": "B3 國土計畫法", "year": "109", "num": 25, "q": "依國土計畫法規定，縣（市）主管機關應於縣（市）國土計畫公告實施後幾年內，依中央主管機關指定之日期，公告國土功能分區圖？", "opts": ["一", "二", "三", "四"], "ans": 3, "exps": ["❌ 1年不是法定期限（舊筆記寫1年係錯誤）。", "❌ 2年不是官方答案。", "❌ 3年不是官方答案。", "✓ 官方答案為4年（109年出題時條文）。現行法：國土計畫法§45已修正（114.01.20）為直轄市、縣（市）國土計畫公告實施後「10年內」公告國土功能分區圖。"]}, {"ch": "B3", "chName": "B3 國土計畫法", "year": "112", "num": 25, "q": "有關土地利用計畫之通盤檢討相關規定，下列何者正確？", "opts": ["全國國土計畫每五年通盤檢討一次", "直轄市、縣（市）國土計畫每十年通盤檢討一次", "都市計畫每三年內或五年內至少應通盤檢討一次", "區域計畫每十年通盤檢討一次"], "ans": 2, "exps": ["❌ 國土計畫法§15：全國國土計畫每「十年」通盤檢討一次，不是五年。", "❌ 國土計畫法§15：直轄市、縣（市）國土計畫每「五年」通盤檢討一次，不是十年。", "✓ 都市計畫每3年或5年內至少應通盤檢討一次（都計法第26條）。", "❌ 區域計畫法§13：區域計畫每「五年」通盤檢討一次，不是十年，故錯誤。"]}, {"ch": "B3", "chName": "B3 國土計畫法", "year": "114", "num": 19, "q": "依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？", "opts": ["國土功能分區之劃設", "國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定", "農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定", "直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"], "ans": 1, "exps": ["❌ 國土計畫法§4：國土功能分區之劃設屬直轄市、縣（市）主管機關事項（中央只規劃劃設順序及原則），故錯誤。", "✓ 國土保育地區、海洋資源地區的使用許可、變更及廢止之核定，由中央主管機關辦理。", "❌ 農業發展地區、城鄉發展地區的使用許可核定，屬直轄市、縣（市）主管機關。", "❌ 縣市國土計畫之擬訂、公告、變更及執行，屬直轄市、縣（市）主管機關。"]}];</script>
