<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不動產估價概要｜整批刷題練習・I2+J1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E6;--card:#FFFEFA;--line:#DDD6C0;
  --ink:#25302C;--sub:#5F6B63;--pri:#2F5D50;
  --key:#8A5517;--red:#A8402B;--gold:#B8782E;--green:#35693F;
  --opt:#fff;--okbg:#E0EFE0;--badbg:#F8E4DD;--tipbg:#FBF1D9;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1b17;--card:#272420;--line:#3d3830;
    --ink:#ece6d8;--sub:#a79f8c;--pri:#2F5D50;
    --key:#B8782E;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;
    --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1b17;--card:#272420;--line:#3d3830;
  --ink:#ece6d8;--sub:#a79f8c;--pri:#2F5D50;
  --key:#B8782E;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;
  --opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--ink);
  min-height:100vh;font-size:15px;line-height:1.7;
  padding:24px 16px 80px;overflow-x:hidden;
}
h1,h2,h3{font-family:"Noto Serif TC",serif;}
.wrap{max-width:720px;margin:0 auto;}
header{text-align:center;margin-bottom:16px;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--red);border:1px solid var(--red);
  border-radius:999px;padding:3px 12px;margin-bottom:10px;
}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:21px;letter-spacing:.04em;color:var(--pri);}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:4px;font-family:"Noto Sans TC",sans-serif;}
.version-tag{font-size:11px;color:var(--sub);margin-top:8px;letter-spacing:.05em;font-family:"Noto Serif TC",serif;}

.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;
}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--sub);
  cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;
}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.statbar{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0 18px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;color:var(--sub);
}
.statbar b{color:var(--ink);font-size:16px;}
.statbar .ok{color:var(--green);}
.statbar .ng{color:var(--red);}

.controls-top{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.btn{
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:9px 16px;cursor:pointer;transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:var(--bg);}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{opacity:.85;}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:#fff;}

.qcard{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.qcard.answered.correct{border-left:5px solid var(--green);}
.qcard.answered.wrong{border-left:5px solid var(--red);}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qbadge{font-size:12px;font-weight:700;color:#fff;background:var(--pri);padding:3px 10px;border-radius:8px;font-family:"Noto Serif TC",serif;}
.qyear{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:"Noto Serif TC",serif;}
.qtext{font-size:15px;line-height:1.8;margin-bottom:12px;font-weight:500;color:var(--ink);}
.opt-list{display:flex;flex-direction:column;gap:7px;}
.opt{
  display:block;width:100%;text-align:left;
  border:1.5px solid var(--line);background:var(--opt);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;
  cursor:pointer;word-break:break-word;transition:border-color .15s,background .15s;
}
.opt b{color:var(--key);margin-right:4px;}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.opt.correct-answer{border-color:var(--green);background:var(--okbg);}
.opt.wrong-selected{border-color:var(--red);background:var(--badbg);}
.note-box{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.7;border-left:4px solid var(--gold);background:var(--tipbg);color:var(--sub);}
.note-box b{color:var(--gold);}
.explain-box{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);}
.explain-title{font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;color:var(--pri);margin-bottom:8px;letter-spacing:.05em;}
.explain-item{display:flex;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;line-height:1.7;background:var(--card);border:1.5px solid var(--line);margin-bottom:6px;color:var(--ink);}
.explain-item:last-child{margin-bottom:0;}
.explain-item.right{border-color:var(--green);background:var(--okbg);}
.explain-letter{font-family:"Noto Serif TC",serif;font-weight:900;flex-shrink:0;color:var(--red);}
.explain-item.right .explain-letter{color:var(--green);}
.error-tag-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.error-tag{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;
}
.error-tag.active-a{background:var(--red);border-color:var(--red);color:#fff;}
.error-tag.active-b{background:var(--gold);border-color:var(--gold);color:#fff;}
.error-tag.active-c{background:var(--pri);border-color:var(--pri);color:#fff;}
.error-tag.active-d{background:var(--green);border-color:var(--green);color:#fff;}

footer{margin-top:30px;text-align:center;font-size:11px;color:var(--sub);letter-spacing:.1em;line-height:2;}
footer .reset{text-decoration:underline;cursor:pointer;color:var(--sub);background:none;border:none;font-size:11px;letter-spacing:.1em;font-family:inherit;}

/* HOME FAB */
.home-fab{
  position:fixed;bottom:18px;right:18px;z-index:999;
  background:var(--pri);color:#fff;
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.35rem;text-decoration:none;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
  transition:transform .15s,box-shadow .15s;
}
.home-fab:hover{transform:scale(1.1);box-shadow:0 5px 18px rgba(0,0,0,.3);}

/* 主題切換按鈕 */
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:999;
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:all .2s ease;
}
.theme-toggle:hover{background:var(--ink);color:var(--bg);}


/* ===== 進度條面板 ===== */
.prog-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
.pbar{position:relative;display:flex;height:12px;background:var(--line);border-radius:6px;margin:6px 0 26px;}
.pbar .s{display:block;height:100%;}
.pbar .s:first-child{border-radius:6px 0 0 6px;}
.s.sure{background:var(--green);}
.s.gok{background:var(--gold);}
.s.ng{background:var(--red);}
.pbar .ln{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px);}
.pbar .ln::after{content:attr(data-v) "%";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.64rem;font-weight:700;color:var(--ink);margin-top:3px;white-space:nowrap;}
.pbar .ln.goal{background:var(--gold);}
.pbar .ln.goal::after{color:var(--key);}
.ptxt{color:var(--ink);font-size:.8rem;line-height:1.7;}
.ptxt b{font-weight:900;}
.pgoal{margin-top:2px;color:var(--sub);font-size:.78rem;}
.pleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:.7rem;color:var(--sub);}
.pleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
.pcat{margin-top:6px;font-size:.75rem;color:var(--ink);}
.ptools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.bxm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;align-items:center;justify-content:center;padding:16px;}
.bxm.on{display:flex;}
.bxb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;max-width:540px;}
.bxt{font-weight:700;font-size:.9rem;margin-bottom:8px;color:var(--ink);}
.bxb textarea{width:100%;font-family:inherit;font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);background:var(--opt);resize:vertical;}
.bxmsg{font-size:.78rem;color:var(--green);min-height:1.2em;margin-top:6px;}
.bxa{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.btn.rep{border-color:var(--gold);color:var(--gold);}
.btn.rep:hover{background:var(--gold);color:#fff;}
</style>
<script src="bxv-use.js"></script>
</head>

<div class="wrap">

  <div id="qlist"></div>

  <footer>不動產經紀人考試・不動產估價概要｜土地改良物與宗地通則補強專練<br>

    <button class="reset" id="resetMastery">清除所有作答與標記紀錄</button>

</div>

  <!-- 對話框 -->
  <div class="bxm" id="bxm">

      </div>
    </div>
  </div>
<script>
const ITEMS = [
// ===== I2 土地改良物 §107-113 =====
{id:"VI2_01", cat:"I2", year:"觀念題", q:"依不動產估價技術規則§107（準用土地法第5條），土地改良物分為哪兩類？", opts:["建築改良物及農作改良物", "建築改良物及土壤改良物", "建築改良物及林木竹木", "農作改良物及水產養殖物"], explains:["§107：土地改良物之分類，依土地法第五條規定。土地法§5：土地改良物分為建築改良物及農作改良物（附著於土地之建築物或工事為建築改良物；附著於土地之農作物及其他植物與水利土壤之改良為農作改良物）。本選項正確。補習班口訣「建農林水土」五大類是教材說法，不是條文分類。", "土地法§5把「水利土壤之改良」歸入農作改良物，不是另立一類；條文只有建築改良物、農作改良物兩類。", "林木竹木屬「附著於土地之農作物及其他植物」，歸入農作改良物（§109也列竹類、造林木），不是另立一類。", "技術規則與土地法§5都沒有「水產養殖物」這一類；且漏了建築改良物。"], correct:0, note:"【自編題，已依條文改寫】§107 準用土地法§5：土地改良物＝建築改良物＋農作改良物兩類。「建農林水土」五大類是補習班口訣，不是條文分類。"},
{id:"VI2_02", cat:"I2", year:"觀念題", q:"依不動產估價技術規則，建物之估價方法以何者為原則？", opts:["比較法", "成本法", "收益法", "直接資本化法"], explains:["依§108，建物估價以成本法為原則，不是比較法。", "技術規則明定建物之估價以成本法（重建或重置成本扣除折舊）為原則，本選項正確。", "收益法適用於具收益性之不動產，但建物本身通常以成本法估算價值，再配合房地整體收益法估算。", "直接資本化法屬於收益法之一種，非建物估價之原則方法。"], correct:1, note:"建物→成本法為原則（重建成本或重置成本減折舊）。"},
{id:"VI2_03", cat:"I2", year:"觀念題", q:"農作改良物應單獨估算的情況，下列何者正確？", opts:["土地及農作改良物所有人不同時", "農作改良物成熟可採收時", "農作改良物種植未滿一年時", "土地所有人要求時"], explains:["（教材說法，非技術規則條文）所有人不同時應單獨估算農作改良物，乃補習班/教材之觀念；§109–§111 只規範農作改良物之估價方法，並無「應單獨估算」之明文。", "農作改良物是否成熟可採收與應否單獨估算無關，技術規則並無此項規定。", "種植年限長短與應否單獨估算無關，技術規則並無此項規定。", "是否單獨估算農作改良物屬教材觀念（技術規則§109–§111無規定）；教材以「土地與農作改良物所有人不同」為判斷標準，不是看土地所有人的主觀要求。"], correct:0, note:"教材/補習班觀念題，非技術規則條文；§109–§111 無「單獨估算」規定。"},
{id:"VI2_04", cat:"I2", year:"觀念題", q:"林木之估算，成熟林（達採收期）與未成熟林分別適用何種方式？", opts:["成熟林用成本法；未成熟林用市場法", "成熟林用市場銷售價值法；未成熟林用成本法", "成熟林與未成熟林均用成本法", "成熟林與未成熟林均用市場法"], explains:["本選項顛倒：§111 接近孳息成熟期者以收穫量及市場價格估計，幼小者則依種植及培育費用（成本導向）。", "本選項正確，方向與§111 大致相符：§111（農作改良物，§109 含造林木）三款為：①幼小且距孳息成熟期尚長者，依其種植及培育費用，並視作物生長情況估計；②接近孳息成熟期者，應估計其收穫量及市場價格，必要時得扣減收成所應投入之費用；③距成熟期一年以上且有期待收穫價值者，得以產地價格為基礎，推估未來收穫價格後折算為價格日期之價格，並扣除收成所應投入之費用。「成熟林」「未成熟林」「市場銷售價值法」並非條文用語（教材簡化說法）。", "並非均用成本法：§111 接近孳息成熟期者，應估計其收穫量及市場價格。", "並非均用市場法：§111 幼小且距孳息成熟期尚長者，依其種植及培育費用估計。"], correct:1, note:"依§111 三階段（幼小→種植及培育費用；接近成熟→收穫量及市場價格；距成熟一年以上且有期待收穫價值→以產地價格推估未來收穫價格折算）；「成熟林／未成熟林」「市場銷售價值法」為教材簡化用語，非條文。"},
{id:"VI2_05", cat:"I2", year:"觀念題", q:"土壤改良物估價以何種方式為主？需考慮哪些因素？", opts:["成本法，考慮改良費用現值及效益殘存年限", "比較法，考慮同區域農地改良後成交價", "收益法，考慮改良後農業收益增加額", "市場法，考慮同類改良物市場交易價格"], explains:["§112 規定附著於土地之工事及水利土壤之改良，以成本法估價為原則，但得斟酌比較法及收益法估價之結果，決定其估價額，本選項「成本法」符合；至於「改良費用現值」「效益殘存年限」等考慮因素，§112 並無列舉，屬教材說法。", "§112 只規定得斟酌比較法之結果，並非以比較法為原則。", "§112 只規定得斟酌收益法之結果，並非以收益法為主。", "「市場法」非§112 用語，且§112 以成本法為原則。"], correct:0, note:"§112：工事及水利土壤改良以成本法為原則，得斟酌比較法及收益法；其餘考量因素（改良費用現值、效益殘存年限等）條文未列，屬教材說法。"},
{id:"VI2_06", cat:"I2", year:"觀念題", q:"依技術規則，建物估價時「重建成本」與「重置成本」的差異為何？", opts:["重建成本是估計重新建造之成本；重置成本是估計維修現有建物之成本", "重建成本是以原材料重新建造；重置成本是以現代替代材料建造", "重建成本較重置成本為高，因原材料更昂貴", "重置成本是指建物殘值，重建成本是指總造價"], explains:["重建成本並非維修成本，而是指以相同或極類似建材重新複製原建物之成本。", "技術規則明定：重建成本是以相同或極類似建材標準重新複製之成本（原則）；重置成本是當建材已無生產或施工方法改變時，以現代替代建材標準建造之成本（例外適用）。本選項正確。", "兩者成本高低需視個案情況，並無必然高低關係。", "重置成本並非殘值之概念，而是以現代材料替代的新建成本。"], correct:1, note:"重建=原材料複製（原則）；重置=現代替代材料（例外，當原材料已無生產時）。"},
{id:"VI2_07", cat:"I2", year:"觀念題", q:"建物折舊之計算，技術規則明定可採何種方法？", opts:["僅定額法（直線法）", "定額法或定率法，由估價師自由選擇", "應視建物特性及市場動態，選擇等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法", "市場萃取法，以市場成交數據推算折舊率"], explains:["§68Ⅰ 並非僅限單一方法，而是依建物特性及市場動態，選擇等速、初期加速或初期減速折舊路徑之方法。", "定額法約相當等速折舊、定率法約相當初期加速折舊，但§68Ⅰ 之用語為三種折舊路徑，且須視建物特性及市場動態選擇，並非由估價師任意選擇。", "§68Ⅰ逐字：「建物累積折舊額之計算，應視建物特性及市場動態，選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法。」本選項正確。（教材另有耐用年數法、觀察折舊法、分解法等分類，不是條文用語。）", "市場萃取法是推算資本化率等之方式，並非§68 之折舊計算方法。"], correct:2, note:"【自編題，已依條文改寫正解選項】§68Ⅰ：三種折舊路徑（等速、初期加速、初期減速），視建物特性及市場動態選擇；§65 以經濟耐用年數為主，必要時得以物理耐用年數計算。"},
{id:"VI2_08", cat:"I2", year:"觀念題", q:"依教材（技術規則無水產養殖物專條），水產養殖物之估算原則為何？", opts:["以飼養成本估算", "以市場銷售價值估算（扣除採收成本）", "以收益法，以年漁獲量折現估算", "以比較法，比較同類養殖場成交價"], explains:["（條文無規定，補習班/教材說法）飼養成本屬成本法概念；技術規則全文無水產養殖物之估價規定。", "教材類推§111農作改良物接近成熟期之作法：以市場銷售價值扣除採收成本估算（技術規則無水產養殖物專條）。", "（教材說法）年漁獲量折現屬收益法概念，條文無此規定。", "（教材說法）比較法需有可比較案例；條文無水產養殖物之規定。"], correct:1, note:"條文無規定（補習班/教材說法）：技術規則全文無「水產養殖物」估價規定。"},
// ===== J1 宗地通則 §83-89 =====
{id:"VJ1_01", cat:"J1", year:"觀念題", q:"依不動產估價技術規則，數筆土地合併為一宗進行土地利用之估價，各筆土地之價格如何求得？", opts:["以合併後宗地面積平均分配","以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格","以各宗地地目類別決定分配比例","由估價師依估價目的自由決定"], explains:["面積平均分配未考量各筆土地合併前之價值差異，不符§84。","§84Ⅰ明定：數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格，本選項正確。","地目雖影響價值，但分算比例依「合併前各筆土地價值」，非單純以地目決定。","§84有明定分算方式，估價師不得自由決定。"], correct:1, note:"§84：合併後估價→按合併前各筆價值比例分算（Ⅱ：同一所有人相連土地、非以合併利用為目的者，比照辦理）。§83：以合併或分割為前提之估價，須考慮合併、分割前後價格變動，酌量增減。"},
{id:"VJ1_02", cat:"J1", year:"觀念題", q:"依不動產估價技術規則，以合併或分割為前提之宗地估價，應如何處理？", opts:["不必考慮合併或分割，僅依現況估價","應考慮合併或分割前後之價格變動情形，而予酌量增減","一律以合併後價格為準","一律評估為特殊價格"], explains:["§83 明定須考慮合併或分割前後之價格變動，不可僅依現況。","§83：以合併或分割為前提之宗地估價，應考慮合併或分割前後之價格變動情形，而予酌量增減，本選項正確。","合併不一定增值，分割也可能減值，須依前後價格變動酌量增減，非一律以合併後價格為準。","特殊價格指不具市場性之不動產（§2），與合併分割無關；合併、分割依§2可能形成限定價格。"], correct:1, note:"§83 合併／分割前後價格變動酌量增減；§84 合併後估價、按合併前價值比例分算。限定價格是§2三種限定條件，不是「必須同時估正常價格」（只有特定價格須同時估，§6 後段）。"},
{id:"VJ1_03", cat:"J1", year:"觀念題", q:"依技術規則§85，一宗土地內有數種不同法定用途時，應如何估價？", opts:["取各種用途估價結果之平均值", "以面積最大之使用部分之單位價格估算全部", "考量最有效使用、各種用途之相關性及分割難易度後，決定分別估價或依主要用途估價", "以最高價值之使用目的估算全部"], explains:["取各種用途之平均值，無法反映不同使用目的之實際價值差異，不符合估價原則。", "以面積最大部分之單位價格估算全部，與§85「依主要用途估價」相近，但須先考量最有效使用、各用途相關性及分割難易度，並非單純取面積最大者。", "§85逐字：「一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價。」本選項正確。", "以最高價值用途估算全部，不是§85的處理方式；§85要求先考量最有效使用、各用途相關性及分割難易度，再決定分別估價或依主要用途估價。"], correct:2, note:"【自編題，已依條文改寫正解選項】§85：先考量最有效使用、各用途相關性、分割難易度，再決定「分別估價」或「依主要用途估價」（二擇一）。"},
{id:"VJ1_04", cat:"J1", year:"觀念題", q:"宗地上有建物時，「獨立估價」與「部分估價」之差異為何？", opts:["獨立估價考量建物對地價之影響；部分估價不考量", "獨立估價不考量建物影響（視為素地）；部分估價考量建物影響", "獨立估價指土地與建物分開估價；部分估價指房地合一估價", "獨立估價只估土地；部分估價只估建物"], explains:["與§86 意旨相反：附有建物宗地原則上應考慮建物對宗地價格之影響。", "§86：附有建物之宗地估價，應考慮該建物對該宗地價格造成之影響；但以素地估價為前提並於估價報告書敘明者，不在此限。「獨立估價」「部分估價」非條文用語（教材說法）；本選項「視為素地 vs 考量建物影響」之對照，與§86 本文及但書意旨相符。", "並非房地合一與分開之概念，重點是是否考慮建物對宗地價格之影響（§86）。", "兩種方式均是針對土地的估價，而非限定只估建物。"], correct:1, note:"依§86：原則考慮建物對宗地價格之影響；以素地估價為前提並於報告書敘明者不在此限。「獨立估價／部分估價」為教材用語，非條文。"},
{id:"VJ1_05", cat:"J1", year:"觀念題", q:"依技術規則§88，宗地受架空線路或地下埋設管線等設施限制時，其估價程序為何？", opts:["直接以成本法估算設施修建成本", "先估計無設施限制之正常價格，再扣除設施限制造成之減損金額", "以受限制之宗地直接比較附近無限制地之交易案例", "由相關主管機關公告補償標準，直接適用"], explains:["§88 為先估算正常價格，再扣除地價減損額，並非採成本法估算設施修建成本。", "§88：土地之上下因有其他設施通過致使用受限制之宗地，應先估算其正常價格，再考量該設施通過造成土地利用之影響，並計算其地價減損額後，從正常價格中扣除之，以其餘額為該宗地之價格，本選項正確。", "§88 要求先估算正常價格，再計算地價減損額後扣除，並非直接以受限宗地與無限制地之交易案例比較了事。", "主管機關補償標準可作參考，但§88 之估價程序為先估正常價格再扣除地價減損額。"], correct:1, note:"§88：正常價格－地價減損額＝該宗地之價格。"},
{id:"VJ1_06", cat:"J1", year:"觀念題", q:"依技術規則§89，受有土壤或地下水污染之土地，其估價程序為何？", opts:["比較法（以附近相似污染地為比較標的）", "收益法（以污染後之預期收益折現）", "先估算未受污染之正常價格，再依委託人提供之檢測資料計算地價減損額後扣除", "殘餘法（以未受污染時之價值回推）"], explains:["§89沒有規定以污染地為比較標的；而是先估「未受污染」之正常價格，再扣地價減損額。", "§89沒有規定以污染後收益折現；而是先估「未受污染」之正常價格，再扣地價減損額。", "§89：「應先估算其未受污染之正常價格，再依據委託人提供之土壤污染檢測資料，考量該土壤或地下水污染之影響，並計算其地價減損額後，從正常價格中扣除之，以其餘額為該宗地之價格。」本選項正確。", "殘餘法是收益法中推算未知部分價值的技巧（教材），不是§89的程序；§89是正常價格扣地價減損額。"], correct:2, note:"【自編題，已依條文改寫】§89：未受污染之正常價格－地價減損額（依委託人提供之檢測資料）＝宗地價格。條文沒有「成本法」「整治成本」字樣。"},
{id:"VJ1_07", cat:"J1", year:"觀念題", q:"下列有關宗地分割之敘述，何者正確？", opts:["分割通常增加各分割後宗地之總價值", "分割前應確認是否違反最有效使用原則", "違反經濟合理性之分割，分割後各宗地應出具正常價格", "技術規則不規範宗地分割之估價程序"], explains:["違反經濟合理性之分割通常造成價值損失（學理說法）；§83 規定以分割為前提之估價，應考慮分割前後價格變動情形而酌量增減。", "§83 規定以分割為前提之宗地估價，應考慮分割前後價格變動；§2 第二款第（三）目規定「以違反經濟合理性之不動產分割為前提」所形成之價值為限定價格。故分割估價需先判斷分割是否合理（「最有效使用原則」為學理用語），本選項大致相符。", "與§2 不符：以違反經濟合理性之不動產分割為前提者形成限定價格（§2 第二款第（三）目），並非「出具正常價格」；且§6 後段 只有特定價格須同時估計正常價格，限定價格不須。", "§83 規範以合併或分割為前提之宗地估價，本選項有誤。"], correct:1, note:"依§83、§2 第二款(三)：違反經濟合理性之分割形成限定價格；§6 後段 只有特定價格須同時估正常價格，限定價格不須。"},
{id:"VJ1_08", cat:"J1", year:"觀念題", q:"有關設施限制宗地（§88）與污染宗地（§89）估價方式，下列比較何者正確？", opts:["兩者均採成本法估算", "設施限制採成本法；污染宗地採比較法", "兩者均先估算（未受污染之）正常價格，再扣除地價減損額，以其餘額為宗地價格", "兩者均採比較法"], explains:["§88、§89 條文均未稱「成本法」，兩者機制相同。", "§88、§89 條文均為先估正常價格再扣除地價減損額，並無「設施限制採成本法；污染採比較法」之區分。", "§88、§89機制相同：均先估算（未受污染之）正常價格，再計算地價減損額後自正常價格中扣除，以其餘額為該宗地之價格。本選項正確。", "§88、§89 條文均未稱「比較法」，兩者為正常價格減地價減損額之方式。"], correct:2, note:"【自編題，已依條文改寫正解選項】§88（設施通過受限）、§89（土壤或地下水污染）機制相同：正常價格－地價減損額。"},

{id:"VJ1_10", cat:"J1", year:"觀念題", q:"依技術規則，違章建築應如何處理於估價過程中？", opts:["違章建築部分以重建成本×50%估算，反映其法律風險", "違章建築部分一律不予評估；如委託人要求，則就合法建物及違章建築分別標示價格", "違章建築影響地價，應自土地估價中扣除拆除費用", "違章建築需取得主管機關同意後，方可估算其價值"], explains:["以重建成本×50%估算並非技術規則之規定，無此種比例折算規定。", "§103明定違建部分不予評估；但委託人要求評估時，應就合法建物及違建部分於估價報告書中分別標示各該部分之價格，本選項正確。", "§103對違章建築的處理是「違建部分不予以評估」（委託人要求時分別標示價格），沒有規定從土地估價中扣除拆除費用；要考量拆除成本的是§106「建物已不具備使用價值」得將基地視為素地估價的情形，兩者不同。", "估價師估算違章建築不需取得主管機關同意，是否估算及如何呈現由技術規則規定。"], correct:1, note:"違章建築→不予評估（原則）；委託人要求時→合法建物與違章建築分別標示，不可合併。"},

const CAT_NAMES = {"I2": "I2 土地改良物§107-113", "J1": "J1 宗地通則§83-89"};

let activeCats = new Set(Object.keys(CAT_NAMES));
let answers = {};
let errorTags = {};
let viewFilter = 'all';

const qlistEl = document.getElementById('qlist');
const chipsEl = document.getElementById('chips');

const SK_ANSWERS = 'val_prac_i2j1_v1_answers';
const SK_TAGS = 'val_prac_i2j1_v1_errortags';

async function loadData(){
  try{ const r=await window.storage.get(SK_ANSWERS); if(r&&r.value) answers=JSON.parse(r.value); }catch(e){}
  try{ const r=await window.storage.get(SK_TAGS); if(r&&r.value) errorTags=JSON.parse(r.value); }catch(e){}
}
async function saveAnswers(){
  try{ await window.storage.set(SK_ANSWERS, JSON.stringify(answers)); }catch(e){}
}
async function saveErrorTags(){
  try{ await window.storage.set(SK_TAGS, JSON.stringify(errorTags)); }catch(e){}
}

Object.keys(CAT_NAMES).forEach(cat=>{
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.textContent = CAT_NAMES[cat];
  chip.dataset.cat = cat;
  chip.addEventListener('click', ()=>{
    if(activeCats.has(cat)){
      if(activeCats.size===1) return;
      activeCats.delete(cat); chip.classList.remove('active');
    } else {
      activeCats.add(cat); chip.classList.add('active');
    }
    renderList();
  });
  chipsEl.appendChild(chip);
});

function updateStatbar(){
    let sure=0, gok=0, ng=0;
    const total = ITEMS.length;
    ITEMS.forEach(it=>{
      const a = answers[it.id];
      if(!a) return;
      if(a.correct){
        if((errorTags[it.id]||'')=== 'D') gok++; else sure++;
      } else ng++;
    });
    const done=sure+gok+ng, ok=sure+gok;
    const T = total||1;
    document.getElementById('pbS').style.width = (sure/T*100)+'%';
    document.getElementById('pbG').style.width = (gok/T*100)+'%';
    document.getElementById('pbN').style.width = (ng/T*100)+'%';
    const acc = done ? Math.round(ok/done*100) : null;
    const need = p => Math.max(0, Math.ceil(total*p/100)-ok);
    document.getElementById('ptxt').innerHTML =
      '累積 <b>'+done+'</b>/<b>'+total+'</b> 題・目前正確率 <b>'+(acc!=null?acc+'%':'—')+'</b>'+
      (done ? '（答對 '+ok+'，其中猜對 '+gok+'；答錯 '+ng+'）' : '')+
      '<div class="pgoal">及格線 60%：'+(need(60)?'還差 <b>'+need(60)+'</b> 題答對':'已達')+
      '　目標 70%：'+(need(70)?'還差 <b>'+need(70)+'</b> 題答對':'已達')+'</div>';
    let catA=0,catB=0,catC=0,catD=0,catN=0;
    ITEMS.forEach(it=>{
      const a=answers[it.id]; if(!a) return;
      const k=errorTags[it.id]||'';
      if(k==='D') catD++;
      else if(!a.correct){ if(k==='A')catA++; else if(k==='B')catB++; else if(k==='C')catC++; else catN++; }
    });
    document.getElementById('pcat').textContent =
      (ng||catD) ? '原因　A 混淆 '+catA+'・B 粗心 '+catB+'・C 不熟 '+catC+'・D 猜的 '+catD+(catN?'・未分類 '+catN:'') : '';
}

function renderList(){
  let list = ITEMS.filter(it=>activeCats.has(it.cat));
  if(viewFilter==='unanswered') list = list.filter(it=>!answers[it.id]);
  if(viewFilter==='wrong') list = list.filter(it=>answers[it.id]&&!answers[it.id].correct);
  qlistEl.innerHTML='';
  if(!list.length){ qlistEl.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;">沒有符合條件的題目</p>'; return; }
  list.forEach(it=>{ qlistEl.appendChild(buildCard(it)); });
  updateStatbar();
}

function buildCard(it){
  const ans = answers[it.id];
  const tag = errorTags[it.id];
  const div = document.createElement('div');
  div.className = 'qcard'+(ans ? (ans.correct?' answered correct':' answered wrong') : '');
  div.id = 'qcard_'+it.id;

  const catClass = it.cat==='I2'?'i2':it.cat==='J1'?'j1':'';
  div.innerHTML = `
    <div class="qhead">
      <span class="qbadge ${catClass}">${it.cat}</span>
      <span class="qyear">${it.year}</span>
    </div>
    <div class="qtext">${it.q}</div>
    <div class="opt-list">
      ${it.opts.map((o,i)=>`<button class="opt${ans?(i===it.correct?' correct-answer':(i===ans.selected&&!ans.correct?' wrong-selected':'')):''}" data-i="${i}"><b>${'ABCD'[i]}.</b>${o}</button>`).join('')}
    </div>
    ${it.note?`<div class="note-box">${it.note}</div>`:''}
    ${ans?`<div class="explain-box">
      <div class="explain-title">▸ 逐選項解析</div>
      ${it.explains.map((ex,i)=>`<div class="explain-item${i===it.correct?' right':''}">
        <span class="explain-letter">${'ABCD'[i]}${i===it.correct?' ✓':''}</span><span>${ex}</span>
      </div>`).join('')}
    </div>`:''}
    <div class="error-tag-row">
      <span class="error-tag${tag==='A'?' active-a':''}" data-type="A">A型 法條混淆</span>
      <span class="error-tag${tag==='B'?' active-b':''}" data-type="B">B型 粗心</span>
      <span class="error-tag${tag==='C'?' active-c':''}" data-type="C">C型 真不熟</span>
      <span class="error-tag${tag==='D'?' active-c':''}" data-type="D">D 猜的</span>
    </div>`;

  if(!ans){
    div.querySelectorAll('.opt').forEach(optEl=>{
      optEl.addEventListener('click', async ()=>{
        const sel = parseInt(optEl.dataset.i);
        const correct = sel === it.correct;
        answers[it.id] = {selected:sel, correct};
        await saveAnswers();
        if(typeof BXREP!=='undefined') BXREP.rec(it, sel, correct);
        renderList();
      });
    });
  }
  div.querySelectorAll('.error-tag').forEach(et=>{
    et.addEventListener('click', async ()=>{
      const t = et.dataset.type;
      if(errorTags[it.id]===t) delete errorTags[it.id];
      else errorTags[it.id]=t;
      await saveErrorTags();
      if(typeof BXREP!=='undefined') BXREP.tag(it, errorTags[it.id]||'');
      const card = document.getElementById('qcard_'+it.id);
      if(card){ card.querySelectorAll('.error-tag').forEach(e=>{
        e.className='error-tag'+(errorTags[it.id]===e.dataset.type?
          (e.dataset.type==='A'?' active-a':e.dataset.type==='B'?' active-b':' active-c'):'');
      }); }
    });
  });
  return div;
}

document.getElementById('filterAll').addEventListener('click',()=>{ viewFilter='all'; renderList(); });
document.getElementById('filterUnanswered').addEventListener('click',()=>{ viewFilter='unanswered'; renderList(); });
document.getElementById('filterWrong').addEventListener('click',()=>{ viewFilter='wrong'; renderList(); });
  // 對話框
  function modal(title, content, okLabel, onOk){
    document.getElementById('bxmt').textContent = title;
    document.getElementById('bxta').value = content;
    document.getElementById('bxmsg').textContent = '';
    const okBtn = document.getElementById('bxok');
    if(okLabel){ okBtn.style.display=''; okBtn.textContent=okLabel; okBtn._cb=onOk; }
    else okBtn.style.display='none';
    document.getElementById('bxm').classList.add('on');
  }
  document.getElementById('bxcl').addEventListener('click', ()=>{ document.getElementById('bxm').classList.remove('on'); });
  document.getElementById('bxok').addEventListener('click', function(){ if(this._cb) this._cb(); });

  document.getElementById('bRep').addEventListener('click', ()=>{
    const t = (typeof BXREP!=='undefined') ? BXREP.build() : '（bxv-use.js 未載入）';
    modal('複製練習回報', t, null, null);
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(()=>{ document.getElementById('bxmsg').textContent='✅ 已複製到剪貼簿，貼到【備考指揮中心】對話裡即可'; }).catch(()=>{});
    else document.getElementById('bxmsg').textContent='請手動選取並複製上方文字';
  });

  document.getElementById('bImp').addEventListener('click', ()=>{
    modal('匯入練習紀錄', '', '確認匯入', async ()=>{
      const txt = document.getElementById('bxta').value.trim();
      const m = txt.match(/BXDATA1:([A-Za-z0-9+/=]+)/);
      if(!m){ document.getElementById('bxmsg').textContent='❌ 找不到有效的 BXDATA1 資料'; return; }
      try{
        const obj = JSON.parse(atob(m[1]));
        const CH_KEY = ITEMS[0] && ITEMS[0].cat ? ITEMS[0].cat : '';
        const chData = obj.chapters && (obj.chapters[CH_KEY] || Object.values(obj.chapters||{})[0]);
        if(!chData){ document.getElementById('bxmsg').textContent='❌ 此回報不含本章節資料'; return; }
        let cnt=0;
        Object.entries(chData).forEach(([id,r])=>{
          const it = ITEMS.find(q=>q.id===id);
          if(!it) return;
          answers[id]={selected:r.sel,correct:r.ok===1};
          if(r.et) errorTags[id]=r.et.toUpperCase();
          cnt++;
        });
        await saveAnswers(); await saveErrorTags();
        if(typeof BXREP!=='undefined') BXREP.sync(CH_KEY,ITEMS,Object.assign({},...ITEMS.map(q=>{var a=answers[q.id];return a?{[q.id]:{selected:a.selected,ok:a.correct?1:0,et:(errorTags[q.id]||'').toLowerCase()}}:{}})),k=>k);
        updateStatbar(); renderList();
        document.getElementById('bxmsg').textContent='✅ 匯入完成，共 '+cnt+' 題';
        document.getElementById('bxm').classList.remove('on');
      }catch(e){ document.getElementById('bxmsg').textContent='❌ 解析失敗：'+e.message; }
    });
  });
document.getElementById('resetAllBtn').addEventListener('click',async()=>{
  if(!confirm('確定清除所有作答紀錄？')) return;
  answers={};
  await window.storage.set(SK_ANSWERS, '{}');
  renderList();
});
document.getElementById('resetMastery').addEventListener('click',async()=>{
  if(!confirm('確定清除所有作答與標記紀錄？')) return;
  answers={}; errorTags={};
  if(typeof BXREP!=='undefined') BXREP.drop('I2J1');
  await window.storage.set(SK_ANSWERS,'{}');
  await window.storage.set(SK_TAGS,'{}');
  renderList();
});

const themeToggle = document.getElementById('themeToggle');
let currentTheme = null;
function applyTheme(t){
  currentTheme=t;
  document.documentElement.setAttribute('data-theme',t);
  themeToggle.textContent = t==='dark'?'☀️':'🌙';
  try{ localStorage.setItem('theme_i2j1',t); }catch(e){}
}
themeToggle.addEventListener('click',()=>{ applyTheme(currentTheme==='dark'?'light':'dark'); });
try{ const s=localStorage.getItem('theme_i2j1'); if(s) applyTheme(s); }catch(e){}

loadData().then(()=>{
  if(typeof BXREP!=='undefined'){
    try{
      const _sa=JSON.parse(localStorage.getItem('bxv-st:val_prac_i2j1_v1_answers')||'{}');
      const _se=JSON.parse(localStorage.getItem('bxv-st:val_prac_i2j1_v1_errortags')||'{}');
      BXREP.sync('I2J1', ITEMS, Object.assign({}, ...ITEMS.map(q=>{var a=_sa[q.id];return a?{[q.id]:{selected:a.selected,ok:a.correct?1:0,et:_se[q.id]?_se[q.id].toLowerCase():''}}:{}})), k=>k);
    }catch(e){}
  }
  renderList();
});
