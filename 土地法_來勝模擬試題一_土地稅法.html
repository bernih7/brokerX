<script>
var D={"Q": [{"n": 1, "stem": "下列土地與其地價稅稅率之適用，正確者為何？\n①經主管機關核准設置，並按核定規劃直接使用之加油站用地：千分之十\n②都市計畫公共設施保留地，於保留期間仍為建築使用（非自用住宅用地）：千分之六\n③非都市土地之自用住宅用地，以面積未超過三公畝部分為限：千分之二\n④公有土地供公共使用者：按基本稅率千分之十\n⑤企業興建之勞工宿舍用地，自動工興建或取得土地所有權之日起：千分之二", "opts": ["①②③", "①②⑤", "②④⑤", "①③④⑤"], "ans": "B", "alt": [], "conf": "高", "ch": "E1", "notes": ["✗ 含不該選的③；漏掉⑤。", "✓ 正確組合：①②⑤。", "✗ 含不該選的④；漏掉①。", "✗ 含不該選的③④；漏掉②。"], "trap": "地價稅稅率對照：基本10‰／自用住宅2‰（都市3公畝、非都市7公畝）／公設保留地建築使用6‰／勞工宿舍等2‰／公有供公共使用＝免徵。", "low": "", "neg": false, "st": ["✓ ①加油站、停車場等經核准按規劃直接使用，稅率千分之十（土稅§18）。", "✓ ②公設保留地仍建築使用、非自用住宅：千分之六（§19）；未建築、未做任何使用才免徵。", "✗ ③非都市土地自用住宅面積上限是『7公畝』，不是3公畝（3公畝是都市）。（§17）", "✗ ④公有土地供公共使用是『免徵』地價稅（§6），不是按基本稅率。", "✓ ⑤企業興建之勞工宿舍及其附屬設施用地，自動工或取得土地所有權日起，千分之二（§17）。"]}, {"n": 2, "stem": "甲在A市有下列土地：①符合自用住宅用地其他要件之都市土地400平方公尺，並已依法申請適用自用住宅用地稅率，申報地價每平方公尺2萬元；②出租供營業使用之店面用地，申報地價總額2,000萬元。A市累進起點地價為400萬元，甲在A市別無其他土地。甲當年應納地價稅為多少元？", "opts": ["296,000元", "302,000元", "322,000元", "440,000元"], "ans": "C", "alt": [], "conf": "中", "ch": "E1", "notes": ["✗ 296,000：忘了自用住宅3公畝上限，把400㎡全部按2‰，只累進計算一般用地2,000萬。", "✗ 302,000：累進級距或自用／一般用地劃分算錯，與正確算法不符。", "✓ 322,000。計算：自用住宅限都市3公畝＝300㎡×2萬＝600萬，稅率2‰＝12,000；超過部分100㎡×2萬＝200萬，併入一般用地。一般用地合計＝200＋2,000＝2,200萬。累進起點400萬：400萬×10‰＝4萬；超過累進起點未達5倍部分（1,800萬）×15‰＝27萬；一般部分31萬＋自用1.2萬＝32.2萬＝322,000元。", "✗ 440,000：級距算法錯誤（把部分地價套到較高級距）。"], "trap": "自用住宅超過3公畝的部分，要併入『一般用地』累進計算，不是繼續2‰；累進級距看『超過累進起點的倍數』。", "low": "計算依土稅§16、§17累進級距。我另有一次算出342,000的路徑與本算法差一個級距定義；若老師解答不是322,000，請把老師的算式貼給我核對。", "neg": false, "st": null}, {"n": 3, "stem": "下列有關地價稅納稅義務人之敘述，何者正確？", "opts": ["設有典權之土地，以出典人為地價稅納稅義務人，典權人僅負代繳義務", "分別共有之土地，以共有人所推舉之代表人為地價稅納稅義務人", "信託土地於信託關係存續中，以受託人為納稅義務人，原則上與委託人在同一直轄市或縣（市）之土地合併計算地價總額", "土地所有權人申請由占有人代繳其使用部分之地價稅者，占有人代繳之稅款得抵付使用期間應付之地租或向所有權人求償"], "ans": "C", "alt": ["D"], "conf": "中", "ch": "E1", "notes": ["✗ 錯誤。典權土地，典權人才是地價稅納稅義務人（土稅§3）。", "✗ 錯誤。分別共有土地，各共有人按持分各自為納稅義務人，不是推舉代表人（代表人適用於公同共有等情形）。", "✓ 正確。土稅§3-1：信託財產於信託關係存續中，以受託人為納稅義務人，與委託人其他土地合併計算（同一直轄市或縣市）。", "✓ 亦正確。土稅§4：占有人代繳之稅款，得抵付使用期間應付之地租或向所有權人求償。"], "trap": "信託：地價稅→受託人；房屋稅→受託人；土增稅→看§5-2。", "low": "題目瑕疵：C、D 都符合土稅§3-1、§4。老師若選其一，另一項即為出題疏漏；兩者我都接受。", "neg": false, "st": null}, {"n": 4, "stem": "列有關地價稅之敘述，正確者為何？\n①地價稅課稅所屬期間為每年1月1日至12月31日，以每年8月31日土地登記簿所載之所有權人或典權人為納稅義務人\n②地價稅開徵期間為每年11月1日至11月30日；申請適用自用住宅用地稅率者，應於開徵40日前（即9月22日前）提出\n③逾期申請適用特別稅率者，自申請之當年開始適用\n④前已核定適用特別稅率而用途未變更者，以後免再申請\n⑤適用特別稅率之原因、事實消滅，未於30日內申報而逃稅者，除追補應納部分外，處短匿稅額3倍之罰鍰", "opts": ["①②④", "①③⑤", "②④⑤", "①②④⑤"], "ans": "D", "alt": ["A"], "conf": "低", "ch": "E1", "notes": ["✗ 漏掉⑤。", "✗ 含不該選的③；漏掉②④。", "✗ 漏掉①。", "✓ 正確組合：①②④⑤。"], "trap": "地價稅：8/31基準日、11/1～11/30開徵、開徵40日前申請；逾期→次年；用途未變免再申請；原因消滅要申報。", "low": "⑤『30日』我在現行條文（§41）只查到『應即申報』，補習班常以30日教學；信心低，A（①②④）亦有可能。", "neg": false, "st": ["✓ ①納稅期間1/1～12/31，以8月31日土地登記簿所載所有權人或典權人為納稅義務人（土稅§3-1、§40）。", "✓ ②11/1～11/30開徵；自用住宅申請應於開徵40日前（9月22日前）（§41）。", "✗ ③逾期申請，自『次年期』開始適用，不是當年。", "✓ ④已核定、用途未變者，以後免再申請（§41）。", "⚠️ ⑤適用特別稅率原因消滅『應即申報』，逾期短匿稅額得處三倍以下罰鍰（§54）。『30日內』是否條文原文，我未能確認。"]}, {"n": 5, "stem": "甲曾於105年出售A地，並已按自用住宅用地稅率繳納土地增值稅。甲另於104年購入B屋（都市土地面積2公畝），甲之配偶及未成年子女自104年起即設籍於B屋，甲本人則設籍於外縣市工作地。115年9月甲出售B屋，出售前5年內B屋無出租或供營業使用，出售時甲、甲之配偶及未成年子女除B屋外均無其他房屋，惟甲之成年長子名下另有房屋一棟。關於甲出售B屋土地之土地增值稅，下列敘述何者正確？", "opts": ["甲已適用過自用住宅用地稅率，且本人未於B屋設籍，應全部按一般稅率課徵", "甲之成年長子另有房屋，不符「無該自用住宅以外之房屋」要件，應全部按一般稅率課徵", "2公畝未超過3公畝，全部得按10%稅率課徵", "其中1.5公畝部分得按10%稅率課徵，超過部分按一般稅率課徵"], "ans": "D", "alt": [], "conf": "中", "ch": "E2", "notes": ["✗ 錯誤。已用過一生一次，並非全部排除：符合再次出售條件（持有6年、5年內無營業出租等）仍可就較小面積再適用10%。且設籍者可為本人、配偶或未成年子女，不要求本人。", "✗ 錯誤。成年長子不在『本人、配偶、未成年子女』範圍，其名下房屋不影響。", "✗ 錯誤。再次適用時，面積限都市1.5公畝（非都市3.5公畝），不是3公畝。", "✓ 正確。再次出售適用10%者，都市1.5公畝內按10%，超過部分按一般稅率（§34）。"], "trap": "一生一次：都市3公畝／非都市7公畝；『再次』出售：都市1.5公畝／非都市3.5公畝，另需持有6年、5年內無營業出租。", "low": "", "neg": false, "st": null}, {"n": 6, "stem": "乙於民國90年3月以申報移轉現值800萬元取得土地（非自用住宅用地），115年6月出售，經核定之申報移轉現值為3,600萬元，應適用之臺灣地區消費者物價總指數為125%，乙持有期間經核定之改良土地費用及已繳納之工程受益費合計200萬元。乙應納土地增值稅為多少元？", "opts": ["6,240,000元", "6,600,000元", "6,960,000元", "7,440,000元"], "ans": "A", "alt": [], "conf": "高", "ch": "E2", "notes": ["✓ 6,240,000。計算：原地價＝800萬×125%＝1,000萬；漲價總數額＝3,600萬−1,000萬−200萬＝2,400萬；漲價倍數2.4倍（逾200%）→稅率40%。應納稅額＝2,400萬×40%−1,000萬×0.30＝660萬。持有25年（逾20年）：就超過20%稅率部分（660萬−480萬＝180萬）減徵20%＝36萬。660萬−36萬＝624萬。", "✗ 6,600,000：忘了持有20年以上的減徵。", "✗ 6,960,000：忘了扣除改良費用200萬（漲價總數額算成2,600萬）。", "✗ 7,440,000：忘了乘物價指數125%（原地價仍以800萬計）。"], "trap": "土增稅速算：稅率40%→減0.30×原地價；持有20/30/40年減徵『超過20%稅率部分』的20/30/40%。（記得先乘物價指數）", "low": "", "neg": false, "st": null}, {"n": 7, "stem": "下列有關土地增值稅原地價認定之敘述（不考慮物價指數調整），何者正確？", "opts": ["甲於80年取得土地（前次移轉現值200萬元），105年贈與配偶乙並申請不課徵（當期公告土地現值600萬元），乙於115年出售時，應以600萬元為原地價", "丙於75年取得農業用地，89年1月28日土地稅法修正施行時仍作農業使用；其後移轉與自然人丁並申請不課徵，丁再移轉而依法應課徵時，應以丙75年取得時之前次移轉現值為原地價", "戊之土地經區段徵收領回抵價地，領回後第一次移轉時，應以戊被徵收前之原規定地價或前次移轉現值為原地價，並減徵40%", "己之父生前領回區段徵收抵價地，實際領回之地價為1,000萬元，父死亡時該土地公告現值為800萬元；己繼承後出售時，應以1,000萬元為原地價"], "ans": "D", "alt": [], "conf": "中", "ch": "E2", "notes": ["✗ 錯誤。配偶間贈與不課徵（§28-2）後，乙再移轉時，原地價是『甲』原取得時的前次移轉現值（200萬），不是贈與時的600萬。", "✗ 錯誤。農業用地取自然人、89.1.28前取得且仍作農業使用之特別時點規定（§39-2），不是逕以原取得之前次移轉現值（此項不採）。", "✗ 錯誤。區段徵收抵價地領回後第一次移轉，原地價是『實際領回之地價』（§39-1Ⅲ），並減徵40%。", "✓ 正確。繼承原地價為繼承時公告現值；但抵價地領回地價較高者，從高（§31）→1,000萬。"], "trap": "原地價三種：配偶贈與→沿用原取得；抵價地第一次移轉→實際領回地價；繼承→繼承時公告現值（抵價地從高）。", "low": "B 項（§39-2）細節我未逐字核對；D 為最確定。", "neg": false, "st": null}, {"n": 8, "stem": "下列有關土地增值稅之敘述，正確者為何？\n①主管稽徵機關應於申報土地移轉現值收件之日起7日內核定稅額並填發稅單；申請按自用住宅用地稅率課徵者，得延長為20日\n②土地所有權人先購買自用住宅用地，自完成移轉登記之日起2年內始出售原自用住宅用地者，不得申請重購退稅\n③持有期間因重新規定地價增繳之地價稅，准予抵繳應納土地增值稅，但抵繳總額以不超過應繳增值稅總額10%為限\n④自用住宅用地出售後2年內，另行購買都市土地未超過3公畝部分仍作自用住宅用地，其新購土地地價超過原出售土地地價扣除繳納土地增值稅後之餘額者，得申請退還其不足支付新購土地地價之數額\n⑤因重購退稅之土地，自完成移轉登記之日起5年內再行移轉或改作其他用途者，應追繳原退還稅款", "opts": ["①③④", "①④⑤", "②③⑤", "①②④⑤"], "ans": "B", "alt": [], "conf": "高", "ch": "E2", "notes": ["✗ 含不該選的③；漏掉⑤。", "✓ 正確組合：①④⑤。", "✗ 含不該選的②③；漏掉①④。", "✗ 含不該選的②。"], "trap": "土增稅小數字：核稅7日（自住20日）／重購退稅2年／增繳地價稅抵繳≤5%／重購後5年內不得再移轉。", "low": "", "neg": false, "st": ["✓ ①7日內核定稅額；自用住宅用地20日（§49）。", "✗ ②先購後售（買進後2年內出售原自用住宅）也可申請重購退稅（§35），並非不得申請。", "✗ ③增繳地價稅准予抵繳土增稅，但以『增繳總額』且不超過增值稅總額『5%』為限（§31Ⅲ），不是10%。", "✓ ④自用住宅用地出售後2年內另購，新購地價超過原售地價扣稅後餘額，得退還不足支付部分（§35）。", "✓ ⑤重購退稅之土地，5年內再移轉或改作他用，應追繳（§37）。"]}, {"n": 9, "stem": "下列有關土地增值稅納稅義務人及課徵時機之敘述，正確者為何？\n①已規定地價之土地設定典 立契約；乙亦於同日訂立B地買賣契約。甲於2月5日申報土地移轉現值，乙則於2月20日始申報。另丙所有C地經法院拍賣，拍定價額低於拍定日當期公告土地現值。依土地稅法規定，下列敘述何者正確？", "opts": ["甲、乙之申報移轉現值，均應以訂約日當期之公告土地現值為審核標準", "因遺贈取得土地者，其申報移轉現值以受遺贈人辦竣遺贈登記日當期之公告土地現值為準", "C地經法院拍賣，如拍定價額低於拍定日當期公告土地現值，原則上以拍定價額為申報移轉現值；如該拍定價額已先扣除設定抵押金額及其他債務，則應將該等金額併同計算", "C地依拍定價額核定土地增值稅後，如拍定價額不足扣繳應納土地增值稅，法院仍應先發給權利移轉證書，再由稽徵機關向原土地所有權人追繳不足稅額"], "ans": "C", "alt": [], "conf": "高", "ch": "E2", "notes": ["✗ 錯誤。訂約日起30日內申報者，以訂約日當期公告現值；逾30日（乙2/20申報，已逾2/9）則以『申報日』當期公告現值。", "✗ 錯誤。遺贈取得，以遺贈人『死亡日』當期之公告現值為準，不是登記日。", "✓ 正確。法院拍賣，拍定價額低於當期公告現值者，以拍定價額為準；已扣除抵押及債務者，併同計算。", "✗ 錯誤。拍賣價額不足扣繳土增稅時，須待拍定人繳清差額後，才發給權利移轉證書（§51）。"], "trap": "申報現值時點：訂約日30日內→訂約日；逾期→申報日；遺贈→死亡日；拍賣→拍定價額。", "low": "", "neg": false, "st": null}], "E": [{"t": "申論一（25分）", "q": "一、甲以其所有A地成立信託並移轉予受託人乙。試依土地稅法規定回答下列問題：㈠土地為信託財產者，於哪些信託關係人間移轉所有權，不課徵土地增值稅？㈡前述不課徵土地增值稅之信託土地，嗣後於應課徵土地增值稅時，其原地價應如何認定？（25分）", "parts": [["一、定義", "信託土地的土增稅不課徵：信託行為成立時，土地形式上由委託人移轉給受託人，但實質經濟利益並未移轉，因此土地稅法§28-3 列舉特定的信託關係人移轉，不課徵土地增值稅；待日後真正移轉而應課徵時，再回溯計算原地價（§31-1）。"], ["二、法條", "（一）土稅§28-3（不課徵）：\n①因信託行為成立，委託人與受託人間；\n②信託關係存續中受託人變更，原受託人與新受託人間；\n③信託契約明定信託財產之受益人為委託人者，信託關係消滅時，受託人與受益人間；\n④因遺囑成立之信託，信託關係消滅時，受託人與受益人間；\n⑤因信託行為不成立、無效、解除或撤銷，委託人與受託人間。\n（二）土稅§31-1（原地價）：\n①一般：以該土地『第一次不課徵土地增值稅前之原規定地價』或『最近一次課徵土地增值稅時核定之申報移轉現值』為原地價；\n②遺囑成立之信託：信託成立時，原地價為遺囑人死亡日當期之公告土地現值；\n③自有土地交付信託且受益人為委託人者，受益人於信託存續中死亡，原地價為受益人死亡日當期之公告土地現值（委託人藉信託規避稅負者不適用）。"], ["三、涵攝分析", "甲以A地成立信託並移轉予受託人乙，屬「信託行為成立，委託人與受託人間」移轉，符合§28-3第1款，不課徵土地增值稅。此時地價形式上移轉，但視為未移轉，日後若發生應課稅的移轉（例如受託人依信託本旨移轉予委託人以外之歸屬權利人，§5-2 以歸屬權利人為納稅義務人），其原地價應「承繼」甲原本的原地價——即第一次不課徵前的原規定地價，或最近一次課徵時的申報移轉現值，而非信託移轉時的公告現值。"], ["四、結論", "（一）不課徵情形共五款：委託人↔受託人（成立）、受託人↔受託人（變更）、受託人↔受益人（受益人為委託人，或遺囑信託，信託關係消滅時）、委託人↔受託人（信託不成立、無效、解除、撤銷）。（二）嗣後應課徵時，原地價依§31-1：一般＝第一次不課徵前原規定地價或最近一次課徵時申報移轉現值；遺囑信託＝遺囑人死亡日當期公告現值；委託人為受益人且死亡＝死亡日當期公告現值。"]], "warn": "原地價的條文是§31-1（不是§31）。若題目考「抵價地」或「繼承」的原地價，用的是§31、§39-1，別與信託混用。"}, {"t": "申論二（25分）", "q": "二、依房屋稅條例規定，適用自住優惠之條件為何？又房屋稅如何按年計徵，以及使用情形變更該如何申報？（25分）", "parts": [["一、定義", "房屋稅：對附著於土地之建築物及增加該房屋使用價值之附屬設備課徵，向房屋所有人（或典權人、使用權人、受託人等）按『房屋現值×稅率』每年徵收一次。自住優惠指住家用房屋符合自住要件者適用較低稅率。"], ["二、法條", "（一）自住優惠（房屋稅§5）：①供自住或公益出租人出租使用之住家用房屋，稅率為房屋現值1.2%；②本人、配偶及未成年子女於全國僅持有一戶房屋，供自住且房屋現值在一定金額以下者，稅率1%。自住房屋須辦竣戶籍登記，且無出租或供營業情形，其他要件與認定標準由財政部訂定（戶數限制依財政部訂定之自住標準）。\n（二）按年計徵（§6-1）：每年2月末日為納稅義務基準日；由主管稽徵機關按稅籍資料核定，於每年5月1日至5月31日一次徵收；課稅所屬期間為上一年7月1日至當年6月30日。\n（三）使用情形變更（§7Ⅱ）：應於每期房屋稅開徵四十日以前申報；經核定後使用情形未再變更者，免再申報；稅額減少而逾期申報者，自申報之次期開始適用；稅額增加而逾期或未申報者，自變更之次期開始適用。"], ["三、涵攝分析", "（一）自住優惠：納稅人須就房屋『住家用』、『辦竣戶籍』、『無出租或營業』三個核心條件逐一檢視，符合者適用1.2%；若再符合全國僅一戶且現值在一定金額以下，則適用1%。\n（二）按年計徵：稽徵機關以2月末日房屋現況與所有權人為準核定稅籍，5月統一開徵，所屬期間跨7/1至隔年6/30；2月末日後才移轉登記者，該期仍由原所有權人納稅。\n（三）使用變更申報：例如由自住改營業（稅額增加），應於次期開徵四十日前申報；若逾期，自變更之次期起按新用途課稅；反之由營業改自住（稅額減少）逾期申報，則自申報之次期才適用較低稅率。"], ["四、結論", "自住優惠要件＝住家用＋戶籍＋無出租營業（1.2%，全國單一自住且現值在一定金額以下為1%）；房屋稅每年2月底為基準日、5月一次徵收、所屬期間7/1～6/30；使用情形變更應於開徵40日前申報，逾期減少者自申報之次期適用、增加者自變更之次期適用。"]], "warn": "自住戶數上限（本人、配偶及未成年子女全國3戶以內）以財政部自住標準為準，我未能從條文本文逐字確認；考試答出『住家用、戶籍、無出租營業』三要件即抓住得分點。"}], "CHN": {"A1": "A1 總則", "A2": "A2 土地登記", "A3": "A3 共有／34-1", "A4": "A4 租賃／優購", "B1": "B1 區計／非都市", "B2": "B2 都市計畫", "B3": "B3 國土計畫", "C2": "C2 市地重劃", "C3": "C3 空地／照價收買", "C4": "C4 申報登錄／預售屋", "D1": "D1 徵收程序", "D2": "D2 徵收補償", "D3": "D3 區段徵收", "D4": "D4 收回權", "E1": "E1 地價稅", "E2": "E2 土地增值稅", "F1": "F1 房屋稅", "G1": "G1 契稅", "H1": "H1 房地合一", "I1": "I1 三七五減租"}, "AVG": {"A1": 1.5, "A2": 3.0, "A3": 1.38, "A4": 1.25, "A5": 0.62, "B1": 1.0, "B2": 1.88, "B3": 0.38, "C1": 0.62, "C2": 0.88, "C3": 0.88, "C4": 1.0, "D1": 0.38, "D2": 1.38, "D3": 1.12, "D4": 1.0, "E1": 1.38, "E2": 1.62, "F1": 1.0, "G1": 1.5, "H1": 1.12, "I1": 0.12}, "quality": ["【題目瑕疵】第3題：C、D 兩選項都符合土稅§3-1、§4，出題疏漏；本卷以 C 為主、D 一併接受。", "【題目瑕疵】第22題：依現行法錯誤的是①②，但選項沒有此組合；本卷暫取 C，答案信心低，請以老師解答為準。", "【計算題爭議】第2題：自用住宅超過3公畝部分併入一般累進，我算得 322,000；若老師答案不同，請貼算式核對。", "【信心低】第4題⑤『30日內申報』我在條文只查到『應即申報』；第14題A、D皆有可能。", "【整體】計算題 4 題（第2、6、12、20），佔8分；第6、12、20 題算式標準，值得熟練。房地合一（第18～23題）佔 6 題，遠高於歷屆平均（約1.1題），此卷偏重新制稅目。", "【好題】第1、8、9、16、17、18、24 題用①～⑤組合題考『辨別細節』，是 A 型（法條混淆）錯題的好來源。"], "confuse": ["地價稅稅率：基本10‰／自用住宅2‰（都市3公畝、非都市7公畝）／公設保留地建築使用6‰／勞工宿舍2‰／公有供公共使用免徵。", "一生一次：都市3公畝、非都市7公畝；『再次』出售：都市1.5公畝、非都市3.5公畝，另需持有6年、5年內無營業出租。", "土增稅小數字：核稅7日（自住20日）／重購退稅2年內／增繳地價稅抵繳≤增值稅5%／重購後5年內不得再移轉。", "原地價三種：配偶贈與沿用原取得／抵價地第一次移轉＝實際領回地價（減徵40%）／繼承＝繼承時公告現值（抵價地領回較高者從高）；信託另見§31-1。", "房屋稅：納稅義務人（典權人／使用權人／受託人／共有推定一人）；稅率（自住1.2%、其他住家2%～4.8%、營業3%～5%）；基準日2月底、5/1～5/31開徵。", "契稅稅率口訣：買6、典4、交2、贈6、分2、占6；信託成立不課徵，但受託人轉給委託人以外歸屬權利人不在此列。", "房地合一：稅率45/35/20/15；自住400萬免稅超過10%；自住範圍＝本人／配偶／未成年子女（不含直系親屬）；成本看繼承或受贈時評定現值＋公告現值；無憑證→成交價3%上限30萬。", "申報時點：土增稅現值30日內（訂約日）vs 房地合一30日（移轉登記日）vs 地價稅特別稅率開徵40日前。"], "id": "ll_b1", "paper": "土地稅法規概要"};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{errs=JSON.parse(lsGet("bx_mockerr_"+ID)||"{}")}catch(e){errs={}}
function okq(q,c){return c===q.ans||q.alt.indexOf(c)>=0}
function stats(){var a=0,c=0;D.Q.forEach(function(q){if(ans[q.n]!==undefined){a++;if(okq(q,ans[q.n]))c++}});return{a:a,c:c}}
function save(){var s=stats();lsSet("bx_mock_"+ID,JSON.stringify({a:s.a,c:s.c,n:25,t:Date.now()}))}
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function bar(){var s=stats();var t=(mode==="exam"&&!finished)?'<span id="tm">'+fmt(left)+'</span>':"";
 $("bar").innerHTML='<button id="m1" class="'+(mode==="practice"?"on":"")+'">練習</button><button id="m2" class="'+(mode==="exam"?"on":"")+'">整卷90分</button>'+t+'<span class="sp"></span><span>已答 '+s.a+'/25'+((mode==="practice"||finished)?'｜對 '+s.c+'｜'+(s.c*2)+'/50':'')+'</span>'+(mode==="exam"&&!finished?'<button id="fin">交卷</button>':'')+'<button id="rs">重做</button>';
 $("m1").onclick=function(){setMode("practice")};$("m2").onclick=function(){setMode("exam")};$("rs").onclick=reset;
 if($("fin"))$("fin").onclick=function(){if(confirm("確定交卷？"))finish()}}
function setMode(m){if(mode===m)return;mode=m;reset()}
function reset(){ans={};revealed={};finished=false;left=5400;if(tmr){clearInterval(tmr);tmr=null}
 if(mode==="exam"){tmr=setInterval(function(){left--;var e=$("tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000)}
 build();window.scrollTo(0,0)}
function finish(){if(tmr){clearInterval(tmr);tmr=null}finished=true;save();build();tab(3)}
function build(){
 var p=$("p1");p.innerHTML='<div class="bar" id="bar"></div>';
 D.Q.forEach(function(q){
  var c=document.createElement("div");c.className="card";c.id="q"+q.n;
  var show=(mode==="practice"&&revealed[q.n])||finished;if(show)c.classList.add("done");
  var tg='<span class="tag ch">'+(D.CHN[q.ch]||q.ch)+'</span>'+(q.neg?'<span class="tag">問錯誤</span>':'')+(q.conf==="低"?'<span class="tag lo">⚠️信心低</span>':q.conf==="中"?'<span class="tag me">信心中</span>':'');
  c.innerHTML='<div class="qn">第'+q.n+'題'+tg+'</div><div class="stem"></div><div class="os"></div><div class="ex"></div>';
  c.querySelector(".stem").textContent=q.stem;
  var os=c.querySelector(".os");
  q.opts.forEach(function(t,i){
   var b=document.createElement("button");b.className="opt";
   b.innerHTML='<b>('+L[i]+')</b><span class="tx"></span><div class="nt"></div>';
   b.querySelector(".tx").textContent=t;b.querySelector(".nt").textContent=q.notes[i];
   if(!show&&ans[q.n]===L[i])b.classList.add("sel");
   if(show){if(okq(q,L[i]))b.classList.add("ok");else if(ans[q.n]===L[i])b.classList.add("bad")}
   b.onclick=function(){
    if(finished||(mode==="practice"&&revealed[q.n]))return;
    ans[q.n]=L[i];
    if(mode==="practice"){revealed[q.n]=true;save();build();var e=$("q"+q.n);if(e)e.scrollIntoView({block:"nearest"})}
    else{os.querySelectorAll(".opt").forEach(function(x,j){x.classList.toggle("sel",j===i)});bar()}};
   os.appendChild(b)});
  var ex=c.querySelector(".ex"),h="";
  h+='<div class="trap">🎯 <b>正解 '+q.ans+(q.alt.length?'（亦接受 '+q.alt.join('、')+'）':'')+'</b>｜考試陷阱：'+esc(q.trap)+'</div>';
  h+=bxTax((q.ch||'').slice(0,2),q.stem+q.opts.join(''),q.stem+q.opts.join('')+q.notes.join(''));
  if(q.st)h+='<div class="sts">'+esc(q.st.join("\n"))+'</div>';
  if(q.low)h+='<div class="low">⚠️ '+esc(q.low)+'</div>';
  if(show&&!okq(q,ans[q.n])&&ans[q.n]!==undefined||show&&ans[q.n]===undefined){
   var cur=errs[q.n]||"";
   h+='<div class="err">錯題歸類：<button data-t="A" class="'+(cur==="A"?"on":"")+'">A 法條混淆</button><button data-t="B" class="'+(cur==="B"?"on":"")+'">B 粗心</button><button data-t="C" class="'+(cur==="C"?"on":"")+'">C 真的不熟</button></div>'}
  ex.innerHTML=h;
  ex.querySelectorAll(".err button").forEach(function(bt){bt.onclick=function(){errs[q.n]=bt.dataset.t;lsSet("bx_mockerr_"+ID,JSON.stringify(errs));ex.querySelectorAll(".err button").forEach(function(x){x.classList.toggle("on",x===bt)})}});
  p.appendChild(c)});
 bar();
 var e=$("p2");e.innerHTML="";
 D.E.forEach(function(x){var c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="qn"></div><div class="stem"></div><details><summary>展開四段式參考解答</summary><div class="ans"></div></details><div class="warn"></div>';
  c.querySelector(".qn").textContent=x.t;c.querySelector(".stem").textContent=x.q;
  var a=c.querySelector(".ans");x.parts.forEach(function(pp){var h=document.createElement("div");h.className="ph";h.textContent=pp[0];var b=document.createElement("div");b.className="pb";b.textContent=pp[1];a.appendChild(h);a.appendChild(b)});
  c.querySelector(".warn").textContent="⚠️ "+x.warn;e.appendChild(c)});
 var n=document.createElement("div");n.className="warn";n.textContent="申論為自行練習：目前階段只讀懂架構（定義→法條→涵攝→結論），不必手寫。";e.appendChild(n);
 anal();result()}
function esc(s){return s}
function anal(){
 var cnt={};D.Q.forEach(function(q){cnt[q.ch]=(cnt[q.ch]||0)+1});
 var h='<div class="card"><div class="qn">配題分析（本卷 vs 16年考點分析）</div><table><tr><th>章節</th><th>本卷題數</th><th>107–114年均</th></tr>';
 Object.keys(cnt).sort().forEach(function(k){h+='<tr><td>'+(D.CHN[k]||k)+'</td><td>'+cnt[k]+'</td><td>'+(D.AVG[k]!==undefined?D.AVG[k].toFixed(2):"—")+'</td></tr>'});
 h+='</table><div class="sub">歷屆均值為「全科25題」中的該章題數；本卷僅含單一科目的一部分章節，只能看相對輕重，不能逐項相減。</div></div>';
 h+='<div class="card"><div class="qn">題目品質評語</div><ul>'+D.quality.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div>';
 h+='<div class="card"><div class="qn">混淆點清單（建議抄進錯題本）</div><ul>'+D.confuse.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div>';
 var low=D.Q.filter(function(q){return q.conf==="低"||q.conf==="中"||q.alt.length}).map(function(q){return q.n+(q.conf==="低"?"⚠️":"")}).join("、");
 h+='<div class="card"><div class="qn">信心較低／有瑕疵之題</div><div>'+low+'<br><span class="sub">⚠️＝信心低。已標「亦接受」者為雙解題。請與補習班老師解答核對後回報，我會更新。</span></div></div>';
 $("p3").innerHTML=h}
function result(){
 var by={};D.Q.forEach(function(q){var o=by[q.ch]||(by[q.ch]={t:0,c:0,a:0});o.t++;if(ans[q.n]!==undefined){o.a++;if(okq(q,ans[q.n]))o.c++}});
 var s=stats(),h='<div class="card"><div class="qn">結果</div><div>已答 '+s.a+'/25，答對 '+s.c+'，單選得分 '+(s.c*2)+'/50'+(mode==="exam"&&!finished?'（交卷後顯示完整解析）':'')+'</div></div>';
 h+='<div class="card"><div class="qn">分篇答對率</div><table><tr><th>章節</th><th>答對／題數</th><th>答對率</th></tr>';
 Object.keys(by).sort().forEach(function(k){var o=by[k];h+='<tr><td>'+(D.CHN[k]||k)+'</td><td>'+o.c+'／'+o.t+'</td><td>'+(o.a?Math.round(o.c*100/o.a)+'%':'—')+'</td></tr>'});
 h+='</table></div>';
 h+='<div class="card"><div class="qn">答案總表</div><div class="key">'+D.Q.map(function(q){return'<span>'+q.n+'：'+q.ans+(q.alt.length?'/'+q.alt.join(''):'')+(q.conf==="低"?' ⚠️':'')+'</span>'}).join("")+'</div></div>';
 var w=D.Q.filter(function(q){return ans[q.n]!==undefined&&!okq(q,ans[q.n])});
 if(w.length){var t={A:0,B:0,C:0,x:0};w.forEach(function(q){t[errs[q.n]||"x"]++});
  h+='<div class="card"><div class="qn">錯題 '+w.length+' 題</div><div>錯題：'+w.map(function(q){return q.n}).join("、")+'<br>歸類 A 法條混淆 '+t.A+'｜B 粗心 '+t.B+'｜C 真的不熟 '+t.C+'｜未歸類 '+t.x+'<br><span class="sub">回「單選」分頁，答完後在每題下方點 A／B／C 歸類；把分篇答對率貼回專案對話，我來更新追蹤表。</span></div></div>'}
 $("p4").innerHTML=h}
function tab(i){["p1","p2","p3","p4"].forEach(function(p,j){$(p).style.display=(j===i)?"":"none";$("t"+(j+1)).className=(j===i)?"on":""});if(i===3)result()}
[0,1,2,3].forEach(function(i){$("t"+(i+1)).onclick=function(){tab(i)}});
build();
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/brokerX/sw.js",{scope:"/brokerX/"});</script>

<button id="theme-btn" onclick="toggleTheme()" title="切換深淺色" aria-label="切換深淺色">☀️</button>
<script>function ub(t){var b=document.getElementById("theme-btn");if(b)b.textContent=t==="dark"?"🌙":"☀️"}function toggleTheme(){var h=document.documentElement,c=h.getAttribute("data-theme")||"light",n=c==="dark"?"light":"dark";h.setAttribute("data-theme",n);ub(n);try{localStorage.setItem("bx-theme",n)}catch(e){}}ub(document.documentElement.getAttribute("data-theme")||"light");</script>
