<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 E篇（親屬繼承）107~114年 後期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;--green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;--chip-bg:#EDE7D8;--chip-text:#5C5248}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border)}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<script>
const QS=[{"year": 107, "num": 4, "ans": "B", "stem": "甲有兩個兒子乙和丙，甲死亡後，乙、丙均拋棄繼承，則乙的兒子丁可否繼承甲的遺產？", "opts": ["可以，丁代位繼承乙之應繼分", "不可以，拋棄繼承並不適用代位繼承", "可以，丁承繼乙的繼承資格", "可以，丁得繼承甲的遺產之二分之一"], "exp": ["✗A. 代位繼承（§1140）要件為被代位人「先於被繼承人死亡或受死亡宣告」，拋棄繼承不符此要件。", "✓B. §1176，繼承人拋棄繼承，其應繼分歸其他繼承人；拋棄繼承不發生代位繼承，丁不能代位乙繼承甲之遺產，正確。", "✗C. 丁並非「承繼」乙的繼承資格（代位繼承才是），拋棄後無代位，選項錯誤。", "✗D. 乙丙均拋棄，無人繼承（甲無其他繼承人），依法應選任遺產管理人，並非丁可繼承1/2，選項錯誤。"]}, {"year": 107, "num": 9, "ans": "A", "stem": "關於夫妻離婚之規定，下列敘述，何者正確？", "opts": ["兩願離婚應以書面為之，有兩人以上證人簽名，並應向戶政機關辦理登記", "離婚後如未成年子女教養及親權應歸屬產生爭議，由子女投票選擇其願意由那一方照料", "夫妻一方故意傷害他方，他方必須先向警方報案，始得提起訴訟離婚", "夫妻一方得以書面通知他方，不再維持婚姻關係，即發生離婚效力"], "exp": ["✓A. §1050，兩願離婚須以書面為之，有兩人以上見證人簽名，並辦理登記（到戶政機關）生效，正確。", "✗B. 子女親權由父母協議或法院決定（考量子女最佳利益），並非由子女投票，選項錯誤。", "✗C. 裁判離婚（§1052）不須先向警方報案，直接向法院起訴即可，選項錯誤。", "✗D. 書面通知並非離婚的法定方式，兩願離婚須雙方合意，裁判離婚須判決，選項錯誤。"]}, {"year": 108, "num": 10, "ans": "B", "stem": "甲與乙為夫妻，甲與乙在婚前均有財產，甲乙婚後均從事有薪工作，各有薪資收入。依我國現行法律之規定，下列敘述，何者正確？", "opts": ["乙之薪資收入，在婚姻存續中，由甲乙共同管理", "乙之薪資收入，在婚姻存續中，為乙之婚後財產，由乙管理", "乙之薪資收入屬乙之婚前財產", "乙之薪資收入在婚姻存續中，屬夫妻公同共有之財產"], "exp": ["✗A. 法定財產制（§1018），夫妻財產各自管理，並非共同管理，選項錯誤。", "✓B. §1017，婚姻存續中取得之財產為「婚後財產」，乙的薪資在婚後取得，屬乙之婚後財產，由乙自行管理，正確。", "✗C. 薪資為婚後取得，屬婚後財產，並非婚前財產，選項錯誤。", "✗D. 法定財產制下各自管理，並非公同共有，選項錯誤。"]}, {"year": 108, "num": 11, "ans": "A", "stem": "甲有配偶乙、子女丙丁戊三人，下列敘述，何者正確？", "opts": ["甲死後，乙、丙、丁、戊均為繼承人，各取得應繼分四分之一", "甲死後，乙、丙、丁、戊均為繼承人，乙取得應繼分二分之一，丙丁戊各取得應繼分六分之一", "甲死後，丙、丁、戊均為繼承人，乙因為是甲的配偶所以不繼承", "甲死後，乙、丙、丁、戊均為繼承人，乙取得應繼分三分之一，丙丁戊各取得應繼分九分之二"], "exp": ["✓A. §1144第1款，配偶與直系血親卑親屬（子女）共同繼承，配偶與子女「均分」（按人數）；乙丙丁戊4人，各得1/4，正確。", "✗B. 計算錯誤，並非乙1/2，丙丁戊各1/6，選項錯誤。", "✗C. 配偶（乙）為法定繼承人（§1138前段「配偶有相互繼承遺產之權」），乙會繼承，選項錯誤。", "✗D. 計算錯誤，選項錯誤。"]}, {"year": 108, "num": 20, "ans": "C", "stem": "下列有關親屬間扶養之敘述，何者正確？", "opts": ["扶養義務係以扶養人有無相當資力決定其是否有扶養義務之發生", "扶養義務之發生，不以義務人能否維持自己生活為前提", "受扶養之人，如尚有其他有扶養能力之血親，仍須先向其直系血親尊親屬請求扶養", "夫妻互負扶養義務，其扶養義務之順序，同於直系血親尊親屬"], "exp": ["✗A. 扶養義務須符合§1117（受扶養人不能維持生活）及扶養義務人有能力（§1116-1）等要件，不只看扶養人資力，選項過度簡化。", "✗B. §1117，扶養義務以「義務人能以其資力維持自己生活者」為前提，本選項說「不以維持自己生活為前提」，與法條相反，錯誤。", "✓C. §1115Ⅱ，受扶養人若有數人負扶養義務，其中有直系血親尊親屬者，應由直系血親尊親屬「先行扶養」，正確。", "✗D. §1116-1，夫妻互負扶養義務之「履行程度」（§1119）準用，但夫妻扶養義務之順序（§1115）並非「同於直系血親尊親屬」，而是配偶扶養義務居首（§1116-1特別規定），選項說法不精確。"]}, {"year": 108, "num": 22, "ans": "C", "stem": "甲有配偶乙、兄丙及父丁。甲立下遺囑，將全部遺產遺贈給其好友戊。問乙、丙、丁中誰有特留分？", "opts": ["乙、丙、丁均有特留分", "乙及丁有特留分，丙沒有特留分", "乙及丁有特留分，丙沒有特留分", "乙、丙、丁均沒有特留分"], "exp": ["✗A. 丙（兄，第三順位）在丁（父，第二順位）及乙（配偶）均存在且有繼承資格時，丙不是本案之繼承人（被第二順位排除），無特留分，選項錯誤。", "✓C. §1123以下，有特留分者為「繼承人」，本案繼承人為乙（配偶）和丁（父，第二順位，第一順位無人）；丙（兄，第三順位）被丁排除，非繼承人，無特留分。乙及丁有特留分，丙無，正確。", "✗B. 與C相同表述，均為正確分析；官方答案C，以C為準（B與C選項內容相同，可能為出題排版問題）。", "✗D. 乙和丁為繼承人，均有特留分，選項錯誤。"]}, {"year": 109, "num": 11, "ans": "A", "stem": "甲有配偶乙、父丙及子丁，甲死亡後，繼承人的組成為何？", "opts": ["乙和丁", "乙、丙和丁", "乙和丙", "乙、丙、丁及甲的兄弟"], "exp": ["✓A. 第一順位直系血親卑親屬（丁，子）存在，排除第二順位（父丙）；配偶（乙）與第一順位（丁）共同繼承，正確。", "✗B. 丙（父，第二順位）被丁（子，第一順位）排除，不繼承，選項錯誤。", "✗C. 第一順位（丁）存在，丙被排除，且應含丁，選項錯誤。", "✗D. 甲的兄弟為第三順位，被第一順位排除，選項錯誤。"]}, {"year": 109, "num": 14, "ans": "C", "stem": "甲死亡時，其配偶乙已先死亡，甲有子丙（先於甲死亡）、孫丁（丙之子），及甲之兄弟戊。下列敘述，何者正確？", "opts": ["丁不能繼承甲之遺產", "丁代位繼承甲之遺產，繼承比例與直接繼承相同", "丁代位繼承丙之應繼分，即繼承甲全部遺產", "戊與丁共同繼承甲之遺產"], "exp": ["✗A. 丙（子）先甲死，其子丁（孫）依§1140代位繼承丙之應繼分，丁可繼承，選項錯誤。", "✗B. 丁代位繼承比例等於被代位人丙的應繼分（並非「比例與直接繼承相同」這樣不清楚的描述）。", "✓C. 甲只有一個子丙（先死），乙先死，戊（兄，第三順位）被第一順位排除；丁（孫）代位丙繼承，丙之應繼分即全部遺產（無其他第一順位），丁繼承甲全部遺產，正確。", "✗D. 戊（兄弟，第三順位）被第一順位（代位後的丁）排除，不繼承，選項錯誤。"]}, {"year": 109, "num": 20, "ans": "A", "stem": "甲夫乙妻，育有子女丙丁兩人，甲死亡，依現行法律，下列敘述，何者正確？", "opts": ["乙為繼承人之一，同時享有剩餘財產分配請求權", "乙為繼承人之一，但無剩餘財產分配請求權", "乙不是繼承人，但享有剩餘財產分配請求權", "乙不是繼承人，也無剩餘財產分配請求權"], "exp": ["✓A. 乙（配偶）既是「繼承人」（§1138，配偶有繼承資格），「同時」享有§1030-1剩餘財產分配請求權（法定財產制消滅時），兩種權利可同時擁有，正確。", "✗B. 乙有剩餘財產分配請求權（§1030-1），並非無此權，選項錯誤。", "✗C. 乙是繼承人（§1138），選項前半段錯誤。", "✗D. 乙既是繼承人又有分配請求權，選項兩點均錯誤。"]}, {"year": 109, "num": 21, "ans": "B", "stem": "下列有關拋棄繼承的敘述，何者正確？", "opts": ["拋棄繼承需要被繼承人同意始得為之", "繼承人得於知悉繼承時起三個月內，以書面向法院為拋棄繼承", "繼承人拋棄繼承後，其子女可代位繼承", "繼承人如不知悉被繼承人的死亡，可在任何時候拋棄繼承"], "exp": ["✗A. 拋棄繼承無須被繼承人（已死）同意，係繼承人之單方行為（向法院聲明），選項錯誤。", "✓B. §1174，繼承人得於「知悉繼承開始後三個月內」，以「書面」向法院聲明拋棄繼承，正確。", "✗C. §1176，拋棄繼承不發生代位繼承（代位繼承要件為被代位人先死或受死亡宣告），選項錯誤。", "✗D. §1174，拋棄繼承期限為「知悉繼承後三個月內」，並非無時限，選項錯誤。"]}, {"year": 110, "num": 3, "ans": "C", "stem": "甲有配偶乙，父丙，子丁，甲的遺產為1000萬元，問乙及丁繼承之遺產各為多少？", "opts": ["乙500萬、丁250萬", "乙333萬、丁333萬", "乙500萬、丁500萬", "乙750萬、丁250萬"], "exp": ["★第一順位（丁，子）存在，丙（父，第二順位）被排除；配偶乙與丁共同繼承。", "§1144第1款：配偶與直系血親卑親屬共同繼承，按人數均分。2人（乙、丁），各得500萬。", "✗A. 乙500丁250計算方式錯誤（誤以3人計算），選項錯誤。", "✗B. 各333萬（以3人計算），丙被排除不繼承，計算基礎錯誤。", "✓C. 乙500萬、丁500萬，2人均分1000萬，正確。", "✗D. 計算比例錯誤，選項錯誤。"]}, {"year": 110, "num": 15, "ans": "D", "stem": "甲乙為夫妻，已婚20年，今甲以乙長期惡意遺棄為理由，向法院訴請離婚，下列敘述，何者正確？", "opts": ["法院得因甲之請求，准許離婚", "若乙受有精神疾病，甲不得訴請離婚", "甲與乙之婚姻得因此事由請求離婚，與兩願離婚不同", "甲乙離婚後，乙對甲若無扶養義務，甲對乙亦無扶養義務"], "exp": ["✗A. 法院准許離婚須具備§1052各款之離婚事由，惡意遺棄為§1052Ⅰ第5款，法律上可以訴請，但仍須法院審認事由是否成立，選項說「得因甲之請求即准」過於簡化。", "✗B. §1052列舉離婚事由，精神疾病並不免除惡意遺棄的法律責任，且精神疾病（§1052Ⅰ第6款）本身也可成為訴請離婚之事由，選項錯誤。", "✗C. 裁判離婚確實與兩願離婚程序不同（裁判離婚須向法院起訴，兩願離婚協議），選項C描述方向正確；但官方以D為最正確答案。", "✓D. §1116-1，夫妻互負扶養義務（在婚姻關係存續中）；離婚後，扶養義務之有無由§1057判斷，如無扶養義務，則雙方均無義務；本選項描述「乙無義務→甲亦無義務」之對等關係，符合§1116-1停止適用後之狀態，正確。"]}, {"year": 110, "num": 16, "ans": "B", "stem": "甲、乙離婚，對其11歲未成年子女丙之親權，由甲行使，有關親權行使之敘述，下列何者正確？", "opts": ["甲可任意限制乙探視丙之機會", "乙對丙有探視（會面交往）之權，甲不得無故拒絕或干涉", "乙自甲乙離婚後，不再對丙有任何義務", "乙雖有探視丙之權，但乙須每次事先取得甲之書面同意"], "exp": ["✗A. §1055-1，未行使親權之一方（乙）有「會面交往（探視）」之權利，甲不得任意限制，選項錯誤。", "✓B. §1055-1，乙（未行使親權一方）對丙有會面交往之權利，甲不得無故拒絕或妨礙，正確。", "✗C. 乙仍有對丙之扶養義務及其他父母義務（如探視），並非「不再有任何義務」，選項錯誤。", "✗D. 探視權無須每次取得書面同意（由協議或法院決定探視方式），選項條件過於嚴格，錯誤。"]}, {"year": 111, "num": 1, "ans": "A", "stem": "甲乙是夫妻，依法定財產制，甲以借貸方式向銀行貸款，為家庭生活支出500萬元，問甲乙兩人各應如何分擔此債務？", "opts": ["甲乙連帶負責", "甲乙依其財產及收入比例分擔", "甲乙各負一半責任", "依所用遺產多寡，分配比例負責"], "exp": ["✓A. §1003-1，家庭生活費用（夫妻日常家務支出），夫妻對外「連帶」負責，正確。", "✗B. 法定財產制下各自管理，但家庭生活費用對外採連帶責任，並非按比例，選項錯誤。", "✗C. 各負一半是分別責任，但家庭生活費用採連帶責任，選項錯誤。", "✗D. 此描述無法律依據，選項錯誤。"]}, {"year": 111, "num": 2, "ans": "C", "stem": "依現行民法規定，下列關於收養（養親子關係）之敘述，何者錯誤？", "opts": ["收養應以書面為之，並向法院聲請認可", "養子女與養父母之關係，除本法另有規定外，與婚生子女同", "未成年人被收養時，養子女與其原來父母之關係消滅", "收養者之年齡，應長於被收養者二十歲以上"], "exp": ["✓A. §1079Ⅰ，收養應以書面為之，並向法院聲請認可，正確。", "✓B. §1072，養子女與養父母及其親屬之關係，與婚生子女同，正確。", "✗C（本題答案）. §1077Ⅱ，養子女與其「本生父母及其親屬間之權利義務，於收養關係存續中停止」（但非「消滅」，終止收養後可回復），本選項說「消滅」與法條「停止」不符，為錯誤選項，即應選答案。", "✓D. §1073，收養者年齡應長於被收養者「20歲以上」，正確。"]}, {"year": 111, "num": 3, "ans": "D", "stem": "依現行民法之規定，下列何者非屬結婚之無效事由？", "opts": ["結婚未依法辦理登記", "結婚違反一夫一妻制", "意圖確認非婚生子女生父，而辦理結婚登記", "結婚當事人為無行為能力人"], "exp": ["✓A. §988第1款，結婚未辦理登記，婚姻「無效」，屬無效事由。", "✓B. §988第2款，違反§985（不得重婚），婚姻無效。", "✓C. §988第3款，一方或雙方無意真實結婚（虛偽結婚，如意圖確認親子關係），婚姻無效。", "✓D（應選非屬無效事由）. 無行為能力人結婚，其婚姻非「無效」，而是「得撤銷」（§989）；無行為能力人結婚的效力屬得撤銷而非無效，故本選項「非屬無效事由」，正確為應選答案。★婚姻無效（§988）vs得撤銷（§989-992）：無行為能力人結婚→得撤銷（非無效）。"]}, {"year": 111, "num": 13, "ans": "B", "stem": "甲有父乙、配偶丙、子丁三人，甲留下遺囑，將全部財產遺贈給友人戊，試問乙之特留分應為若干？", "opts": ["乙之特留分為甲遺產的六分之一", "乙之特留分為甲遺產的八分之一", "乙之特留分為甲遺產的四分之一", "乙之特留分為甲遺產的十二分之一"], "exp": ["★繼承人：丙（配偶）、丁（子，第一順位）；乙（父，第二順位）被第一順位（丁）排除，乙「不是繼承人」，無特留分。", "★但若本題設計乙為繼承人（假設無第一順位），則乙與丙共同繼承，乙特留分=應繼分×1/2。", "✓B（官方）. 依官方答案B，乙特留分為遺產1/8。推算：若繼承人為丙丁乙三人（均有份），乙應繼分可能為1/4，特留分=1/4×1/2=1/8，以官方B（1/8）為準。", "✗A/C/D. 以官方答案B（1/8）為準。"]}, {"year": 111, "num": 15, "ans": "B", "stem": "依現行民法規定，下列何者非屬得由法院裁判離婚之事由？", "opts": ["配偶有不治之惡疾", "配偶之父母對他方配偶有不堪同居之虐待", "婚姻重大事由已難以維持", "配偶有酗酒之習慣"], "exp": ["✗A. §1052Ⅰ第8款，配偶有不治之惡疾，為裁判離婚事由，屬裁判離婚事由。", "✓B（非屬）. §1052Ⅰ第3款，配偶之「直系尊親屬」對「他方配偶」不堪同居之虐待——規定的是「虐待之主體」須為配偶之直系親屬，且「配偶之父母」（直系尊親屬）確在此款範圍；但本選項說「配偶之父母」對他方的虐待，若確為§1052Ⅰ第3款規定範圍，則屬裁判離婚事由，官方以B為「非屬」裁判離婚事由，可能§1052Ⅰ第3款的主體解釋認為「配偶之父母」不在其中，以官方B為準。", "✗C. §1052Ⅱ，重大事由難以維持婚姻（概括條款），為裁判離婚事由。", "✗D. §1052Ⅰ第2款，配偶有酗酒惡習，為裁判離婚事由。"]}, {"year": 111, "num": 16, "ans": "A", "stem": "依現行民法規定，關於扶養之敘述，下列何者正確？", "opts": ["同係直系血親尊親屬及親等較近者，負扶養義務", "扶養義務人有數人時，扶養費用應平均分擔", "受扶養人對扶養義務人，可決定之", "直系血親卑親屬依親等之近遠，順序扶養直系血親尊親屬"], "exp": ["✓A. §1115，負扶養義務者有數人時，親等較近者應先扶養（親等近者優先），正確。", "✗B. §1116，扶養費用之分擔，由各義務人「協議」定之，不能協議時由法院定之；並非一律平均，選項錯誤。", "✗C. §1120，扶養之方法，由當事人協議，不能協議時由法院定之，並非受扶養人單方「決定」，選項錯誤。", "✗D. §1114，直系血親互負扶養義務，並非僅「卑親屬扶養尊親屬」，尊親屬也可能扶養卑親屬（如父母撫養未成年子女），選項描述片面，錯誤。"]}, {"year": 112, "num": 7, "ans": "D", "stem": "甲死亡，繼承人有配偶乙、子女丙丁，下列何者正確？", "opts": ["乙可取得遺產之1/2，丙丁各取得遺產之1/4，但乙另可請求剩餘財產分配", "乙可取得遺產之1/2，丙丁各取得遺產之1/4，乙另不得請求剩餘財產分配", "乙取得遺產之1/3，丙丁各取得遺產之1/3", "乙可取得遺產之1/3，丙丁各取得遺產之1/3，但乙另可請求剩餘財產分配"], "exp": ["★繼承人：乙（配偶）、丙、丁（子女，第一順位），共3人；§1144第1款，均分（各1/3）。", "★另，乙同時享有§1030-1剩餘財產分配請求權（法定財產制關係消滅），此與繼承可同時主張。", "✗A. 各1/4為誤算（2+1/2=2+1/2，不對），且乙應得1/3，選項計算錯誤。", "✗B. 計算同A錯誤，且說乙不得請求剩餘財產分配，亦有誤。", "✗C. 各1/3正確，但未說明乙另有剩餘財產分配請求權，不完整。", "✓D. 乙丙丁各1/3（3人均分），同時乙另可請求法定財產制下之剩餘財產分配（§1030-1），兩者並行，正確。"]}, {"year": 112, "num": 20, "ans": "C", "stem": "甲的遺產總額為1000萬元，其特留分為何？（甲有配偶乙和子丙）", "opts": ["乙的特留分為500萬元", "乙的特留分為250萬元，丙的特留分為500萬元", "乙的特留分為250萬元，丙的特留分為250萬元", "乙的特留分為500萬元，丙的特留分為500萬元"], "exp": ["★應繼分：乙=1/2×1000=500萬，丙=1/2×1000=500萬。特留分（§1223，各為應繼分1/2）：乙=500×1/2=250萬，丙=500×1/2=250萬。", "✗A. 乙特留分為250萬，非500萬，選項錯誤。", "✗B. 丙特留分為250萬，非500萬，選項錯誤。", "✓C. 乙250萬、丙250萬，計算正確，正確。", "✗D. 兩者合計1000萬超過遺產，且各計算有誤，選項錯誤。"]}, {"year": 112, "num": 21, "ans": "A", "stem": "下列有關遺囑的敘述，何者正確？", "opts": ["遺囑人得隨時以遺囑或其他方式撤回遺囑，且自書遺囑應由遺囑人親自書寫全文，並記明年月日及親自簽名", "成年人所書立之公證遺囑效力最高，凡遺囑都須依公證遺囑的方式書立", "口授遺囑僅能由他人記錄後由遺囑人簽名，而不得以錄音錄製", "16歲以上之未成年人不得書立遺囑"], "exp": ["✓A. §1219，遺囑人「得隨時以遺囑或其他方式撤回」遺囑（最後遺囑優先）；§1190，自書遺囑須自書全文、記明年月日、親自簽名，均正確。", "✗B. 遺囑無「效力高低」之區分（各方式依程序合法均有效），且遺囑不須均依公證方式，選項錯誤。", "✗C. §1195，口授遺囑有兩種方式：①由見證人筆記（記錄）②以錄音錄製，本選項說「不得錄音」錯誤。", "✗D. §1186Ⅱ，「滿16歲」之未成年人「得為遺囑」，並非不得書立，選項錯誤。"]}, {"year": 113, "num": 7, "ans": "A", "stem": "下列關於夫妻財產關係之敘述，何者正確？", "opts": ["配偶之一方死亡，法定財產制關係消滅，生存配偶得主張剩餘財產差額分配請求權", "法定財產制下，夫妻各自所有之全部財產，在婚姻關係消滅時，均得請求差額分配", "夫妻婚前之財產，得納入剩餘財產分配之計算", "夫或妻對共同財產，得自由處分"], "exp": ["✓A. §1030-1，法定財產制關係消滅（含一方死亡），剩餘財產較少之一方（或其繼承人）得向他方請求差額之半數，正確。", "✗B. §1030-1計算範圍限於「婚後財產」（扣除婚後債務），並非全部財產（婚前財產不計入），選項錯誤。", "✗C. 婚前財產「不計入」剩餘財產差額分配（§1030-1，只計婚後財產），選項錯誤。", "✗D. 法定財產制下夫妻財產「各自管理及處分」自己的財產（§1018），並非對「共同財產」自由處分（法定財產制無共同財產制，各自所有），選項用語混淆。"]}, {"year": 113, "num": 11, "ans": "B", "stem": "甲有配偶乙、孫女丙（其子丁已先甲死亡）、兄弟戊，下列敘述，何者正確？", "opts": ["乙與丙及戊同為繼承人", "乙與丙同為繼承人，戊不是繼承人", "乙及戊為繼承人，丙不是繼承人", "乙、丙及戊均非繼承人"], "exp": ["★丁（子）先甲死，丙（孫女，丁之子）依§1140代位繼承丁之應繼分，丙為第一順位直系血親卑親屬（代位後）；戊（兄弟，第三順位）被第一順位（丙）排除。", "✗A. 戊被排除，不繼承，選項錯誤。", "✓B. 乙（配偶）與丙（孫女，代位繼承）共同繼承；戊（第三順位）被排除，正確。", "✗C. 丙代位繼承，是繼承人，選項錯誤。", "✗D. 乙丙均為繼承人，選項錯誤。"]}, {"yea , "✗C. 計算比例有誤，選項錯誤。", "✓D. 乙特留分=1/8（應繼分1/4×1/2），正確。"]}, {"year": 114, "num": 18, "ans": "C", "stem": "甲有配偶乙，子丙、丁，孫戊（戊係丙之子，但丙尚生存），甲立遺囑，指定將全部遺產贈與其弟己。請問以下何者得對己主張特留分？", "opts": ["乙、丙、丁、戊均得主張", "乙、丙、丁得主張，戊不得主張", "乙、丙、丁得主張，戊不得主張", "乙、丙、丁、己均得主張"], "exp": ["★繼承人：乙（配偶）、丙（子，第一順位）、丁（子，第一順位）；戊為丙之子（孫），丙仍生存，戊無代位繼承（丙未死），戊非本案繼承人；己（弟，第三順位）被第一順位排除，非繼承人（且己為受遺贈人，本身不是繼承人）。", "特留分請求者須為「繼承人」：乙、丙、丁。", "✗A. 戊非繼承人（丙仍生存），無特留分，選項錯誤。", "✓C. 乙、丙、丁（繼承人）有特留分，戊（非繼承人）無特留分，正確。", "✗B. 與C相同表述，官方以C為正解。", "✗D. 己為受遺贈人（受益人），並非繼承人，無特留分，選項錯誤。"]}, {"year": 114, "num": 20, "ans": "D", "stem": "依現行民法規定，關於繼承之敘述，下列何者正確？", "opts": ["繼承人辦理遺產之繼承登記前，不得管理遺產", "繼承人對被繼承人之債務，超過繼承財產範圍之部分，仍應負連帶清償責任", "繼承人均拋棄繼承後，被繼承人之兄弟姐妹得繼承其遺產", "在遺產分割前，各繼承人對全體遺產上之財產負有保存之義務，不得個別處分其遺產之任何部分"], "exp": ["✗A. 繼承登記前，繼承人已取得繼承財產（公同共有，§1151），得管理遺產，選項錯誤。", "✗B. §1148Ⅱ，繼承人對被繼承人債務「以繼承所得遺產為限」負責（法定限定繼承），超過部分不必承擔，選項錯誤。", "✗C. §1176，全體繼承人拋棄後，依§1152選任遺產管理人，並非由兄弟姐妹繼承（兄弟姐妹之繼承須在沒有前順位繼承人時，不是全體拋棄後才能繼承），選項描述邏輯有誤。", "✓D. §1153，繼承人對於「繼承開始後、遺產分割前」，各繼承人就遺產有保存義務，不得個別處分（公同共有性質），正確。"]}];
const TOTAL=31;

function sv(){localStorage.setItem(SK,JSON.stringify(S))}
let aY='all',aF='all';
function gk(q){return q.year+'_'+q.num}

function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stats(){const done=QS.filter(q=>S[gk(q)]).length,cor=QS.filter(q=>S[gk(q)]&&S[gk(q)].ok).length;document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';document.getElementById('prog').style.width=(done/TOTAL*100)+'%'}
function buildChips(){var c=document.getElementById('chips');c.innerHTML='';var a=mk('div','chip'+(aY==='all'?' active':''));a.textContent='全部('+TOTAL+')';a.onclick=function(){aY='all';render()};c.appendChild(a);YEARS.forEach(function(y){var cnt=QS.filter(function(q){return q.year===y}).length,d=mk('div','chip'+(aY===y?' active':''));d.textContent=y+'年('+cnt+')';d.onclick=function(){aY=y;render()};c.appendChild(d)})}
function card(q){var k=gk(q),s=S[k],c=mk('div','q-card');c.id='c_'+k;var hd=mk('div','q-head');hd.appendChild(mk('span','q-year',q.year+'年'));hd.appendChild(mk('span','q-num','第'+q.num+'題'));if(s){var b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}var st=mk('div','q-stem',q.stem);var op=mk('div','opts');['A','B','C','D'].forEach(function(L,i){var o=mk('div','opt');if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}o.appendChild(mk('span','opt-lbl',L+'.'));o.appendChild(mk('span','opt-txt',q.opts[i]));if(!s)o.onclick=(function(qq,ll){return function(){choose(qq,ll)}})(q,L);op.appendChild(o)});var ex=mk('div','exp-block'+(s?' show':''));q.exp.forEach(function(ln){var d=mk('div','exp-line');var ch=ln.charAt(0);if(ch==='✓')d.classList.add('cl');else if(ch==='✗')d.classList.add('wl');else if(ch==='★'||ch==='※')d.classList.add('nl');d.textContent=ln;ex.appendChild(d)});if(s){var tr=mk('div','err-tag');var lb=mk('span',null,'錯題分類：');lb.style.cssText='font-size:11px;color:var(--gray)';tr.appendChild(lb);[['a','A法條混淆'],['b','B粗心'],['c','C真的不熟']].forEach(function(pair){var k2=pair[0],lbl=pair[1];var t=mk('span','etag',lbl);if(s.et===k2)t.classList.add(k2+'-on');t.onclick=(function(kk){return function(){s.et=(s.et===kk?null:kk);sv();rc(q)}})(k2);tr.appendChild(t)});ex.appendChild(tr)}c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);return c}
function rc(q){var old=document.getElementById('c_'+gk(q));if(old)old.parentNode.replaceChild(card(q),old)}
function choose(q,ch){S[gk(q)]={ch:ch,ok:(ch===q.ans)};sv();rc(q);var blk=document.getElementById('c_'+gk(q));if(blk){var ex=blk.querySelector('.exp-block');if(ex)ex.scrollIntoView({block:'nearest'})}stats()}
function render(){buildChips();var qs=getFilt(),m=document.getElementById('main');m.innerHTML='';stats();if(!qs.length){m.innerHTML='<div class="empty">無符合條件的題目</div>';return}qs.forEach(function(q){m.appendChild(card(q))})}
