<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>民法 D篇（物權）107~114年 後期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;--green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;--chip-bg:#EDE7D8;--chip-text:#5C5248}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border)}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<script>
const QS=[{"year": 107, "num": 1, "ans": "D", "stem": "甲有A、B、C三台車，以總價50萬元出售給乙，其後甲將其對乙的債權贈與於丙，並讓與之。於乙將50萬元現金支付於丙後，甲將A、B、C三台車交付給乙並移轉所有權。試問甲、乙、丙間共有多少法律行為？", "opts": ["4", "5", "6", "7"], "exp": ["★解題方法：逐一數出法律行為（含債權行為與物權行為）。", "①甲乙買賣契約（債權行為）②丙甲贈與債權之贈與契約（債權行為）③甲將對乙債權讓與丙之讓與行為（準物權行為）④乙支付50萬元給丙之清償行為（物權行為：金錢所有權移轉）⑤甲將A車交付乙移轉所有權（物權行為）⑥甲將B車交付乙移轉所有權（物權行為）⑦甲將C車交付乙移轉所有權（物權行為）", "✓D. 共7個法律行為，正確。", "✗A/B/C. 計算不完整，遺漏部分法律行為。"]}, {"year": 107, "num": 5, "ans": "D", "stem": "甲向乙貸款新臺幣500萬元，以其所有之A地及其上之B屋設定抵押權給乙作擔保。試問下列何者非屬抵押權效力所及？", "opts": ["B屋抵押權設定後，甲於B屋上增建無獨立出入口之頂樓", "B屋抵押權設定前，甲於B屋旁增建有獨立出入口之車庫", "A地上甲種植之地瓜葉（與土地分離前）", "B屋窗台上的花盆（未固定）"], "exp": ["✗A. §862，抵押設定「後」增建「無獨立出入口」之頂樓，為B屋之附加部分（無獨立性），為抵押效力所及，非屬「非效力所及」。", "✗B. 抵押設定「前」已增建之「有獨立出入口」車庫，若視為獨立建物，抵押權設定前已存在，且具獨立性，較不屬於B屋抵押效力所及。", "✗C. 地瓜葉分離前為土地之成分，未分離前屬A地之一部，抵押效力及之，非屬「非效力所及」。", "✓D. 花盆未固定（可隨時移動），非附著於B屋之成分，不屬於抵押物範圍，抵押權效力不及於花盆，正確為應選答案。★抵押效力不及於：非附著、具獨立性之物，或非附加於抵押物的獨立物品。"]}, {"year": 107, "num": 6, "ans": "B", "stem": "債務人甲所有之抵押物上，設有擔保乙200萬元債權之第一次序抵押權、丙120萬元債權之第二次序抵押權及丁50萬元債權之第三次序抵押權。抵押物拍賣所得價金為300萬元。乙將其第一次序之優先受償利益拋棄予丁，則應如何分配拍賣所得之金額？", "opts": ["乙200萬、丙100萬、丁0元", "乙150萬、丙120萬、丁30萬", "乙200萬、丙0元、丁50萬、剩餘50萬歸甲", "乙200萬、丙50萬、丁50萬"], "exp": ["★次序拋棄：乙「相對」拋棄第一次序優先利益「給丁」（而非絕對拋棄），效果：乙與丁在各自可受分配額度內，「丁優先受償乙本應受償的份額、乙讓出給丁後取剩餘」，但不影響丙的地位。計算：①先計算若無拋棄的分配：乙→200萬、丙→100萬（剩餘）、丁→0元；②乙拋棄給丁（相對效力）：乙讓出50萬（丁的債權額）給丁，乙得200-50=150萬，丁得50萬，丙維持100萬不變。", "✓B. 乙150萬、丙120萬、丁30萬——等等，重新計算：拍賣得300萬；乙拋棄給丁（次序相對拋棄），丁先就乙本應受償的份額中受償50萬，乙得200-50=150萬，丙得120萬（次序未變），丁得50萬；150+120+50=320＞300，需按比例扣：或依嚴格計算：乙150+丙120=270，丁30（僅剩300-270=30）。官方答案B（乙150、丙120、丁30）。", "✗A/C/D. 計算方式有誤。", "★次序拋棄（相對效力）考點：拋棄利益只在乙丁之間重分配，丙不受影響。"]}, {"year": 107, "num": 10, "ans": "B", "stem": "下列有關夫妻法定財產制之敘述，下列何者正確？", "opts": ["婚前財產由夫妻各自所有，婚後財產由夫妻公同共有", "婚前財產及婚後財產均由夫妻各自所有", "婚前財產由夫妻各自所有，婚後財產由夫妻分別共有", "婚前財產及婚後財產均由夫妻公同共有，且夫妻對其結婚而公同共有之財產均有管理權"], "exp": ["✗A. 婚後財產非公同共有，仍各自所有，選項錯誤。", "✓B. §1017，法定財產制下，夫或妻之「婚前財產與婚後財產均由夫妻各自所有」（各管各的，婚後財產不混同），正確。★現行法定財產制：夫妻各自管理財產，婚姻關係消滅時計算剩餘財產差額分配。", "✗C. 婚後財產並非夫妻「分別共有」，仍各自所有，選項錯誤。", "✗D. 法定財產制非公同共有，選項錯誤。"]}, {"year": 107, "num": 18, "ans": "B", "stem": "下列敘述所涉及之物，何者不能單獨作為物權之客體？", "opts": ["醫療器材店所販售之大腿義肢", "已被安裝置入大廈內運作的客製化電梯", "區分所有建築物（如大廈）之專有部分", "足以遮風避雨的違章建築物"], "exp": ["✗A. 大腿義肢尚在販售（未裝置於人體），為獨立動產，可作為物權客體。", "✓B. 已安裝至大廈內之電梯，成為大廈建物之「成分」（不可分離且非獨立存在），不能單獨作為物權客體（其所有權已附合於建物），正確。", "✗C. 區分所有之專有部分（如一間套房），為獨立之物權客體，可單獨所有，選項排除。", "✗D. 違章建築雖不能登記，但為獨立之動產（或建物）性質，可作為物權客體（以事實上處分權形式），選項排除。"]}, {"year": 107, "num": 20, "ans": "A", "stem": "下列何種權利，得為抵押權之標的物？", "opts": ["地上權", "不動產役權", "著作權", "租賃權"], "exp": ["✓A. §882，地上權「得為抵押權之標的物」（得以地上權設定抵押），正確。", "✗B. 不動產役權附隨於需役地，不得單獨讓與（§853），亦不得單獨抵押，選項排除。", "✗C. 著作權為無形財產權，民法物權編之抵押權客體以「不動產」及特定財產權（§882地上權、農育權、典權）為限，著作權不在其中，選項排除。", "✗D. 租賃權為債權，並非民法§882所列得設定抵押之權利，選項排除。"]}, {"year": 107, "num": 21, "ans": "C", "stem": "下列何者並非公同共有關係？", "opts": ["祭祀公業之派下員對不具法人資格的祭祀公業財產之關係", "合夥人對合夥財產之關係", "將一筆土地贈與且移轉登記予數人，受贈人對該贈與物之關係", "數人繼承遺產，於分割遺產前，各繼承人對於遺產全部之關係"], "exp": ["✗A. 祭祀公業（未法人化）之財產，由派下員公同共有，屬公同共有，選項排除。", "✗B. §668，合夥財產為合夥人「公同共有」，選項排除。", "✓C. 數人共同受贈某物並完成移轉登記，其間並無「公同關係」（繼承、合夥等特定關係），應為「分別共有」（§817），並非公同共有，正確為應選答案。★公同共有須有特定「公同關係」（繼承、合夥、祭祀公業等）為基礎；單純多人受贈移轉登記→分別共有。", "✗D. §1151，遺產在分割前為繼承人公同共有，選項排除。"]}, {"year": 107, "num": 22, "ans": "D", "stem": "下列關於物權規定之敘述，何者正確？", "opts": ["用益物權包括地上權、農育權、不動產役權、典權與質權", "違章建築物不能辦理移轉登記，故於建造完成時，建造人無法取得所有權", "基於公同關係而共有之房地，各共有人得就其應有部分設定抵押權", "稱最高限額抵押權者，謂債務人或第三人提供不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權"], "exp": ["✗A. 用益物權：地上權、農育權、不動產役權、典權（§832以下）；「質權」屬「擔保物權」，並非用益物權，選項錯誤。", "✗B. 違章建築完工，建造人依「原始取得」取得事實上處分權（實務上的所有權），並非無法取得，選項錯誤。", "✗C. 公同共有（如遺產）各人「無應有部分」，不得就應有部分設定抵押，選項錯誤（分別共有才有應有部分可設抵押）。", "✓D. §881-1，最高限額抵押權係就「一定範圍內不特定債權」於最高限額內設定之抵押權，正確。"]}, {"year": 108, "num": 8, "ans": "D", "stem": "依我國民法，下列關於地上權之敘述，何者錯誤？", "opts": ["地上權設定後，因土地價值之昇降，依原定地租給付顯失公平者，當事人得請求法院增減之", "地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金", "地上權人得將其權利讓與他人或設定抵押權。但契約另有約定或性質不許者，不在此限", "地上權人積欠地租達二年之總額時，土地所有人得於相當期限內請求清償，清償後仍繼續積欠，始得終止地上權"], "exp": ["✓A. §835之1，地租給付因地價昇降顯失公平，當事人得請求法院增減，正確。", "✓B. §835，因不可抗力妨礙使用，「得請求免除或減少」地租（B選項說「不得」→B是錯誤描述）——等等，本題問「錯誤」，B說「不得請求免除」，而法條規定「得請求免除」，B為錯誤描述；但官方答案為D，重新看D。", "✓C. §838，地上權得讓與或設定抵押，但契約約定或性質不許者除外，正確。", "✗D（本題答案）. §836，積欠地租達「二年總額」，土地所有人得「定相當期限催告」，期限屆至仍未支付，「得終止地上權」；本選項說「清償後仍繼續積欠，始得終止」，與§836規定不符（催告後仍不清償即可終止，並非清償後再積欠才終止），錯誤，為應選答案。"]}, {"year": 108, "num": 16, "ans": "C", "stem": "就下列甲、乙間之法律關係，何者為非經登記不生效力的情形？", "opts": ["甲、乙間締結買賣甲之不動產的契約時", "乙繼承被繼承人甲之不動產時", "甲以其土地供乙設定不動產役權時", "甲將其有抵押權擔保之債權讓與予乙時"], "exp": ["✗A. 不動產「買賣契約」（債權行為）不以登記為生效要件（諾成），選項排除。", "✗B. 繼承取得不動產（非因法律行為，§759），不以登記為要件，繼承開始即取得，選項排除。", "✓C. 不動產役權設定（物權行為）須登記才生效（§758Ⅱ），非經登記不生效力，正確。", "✗D. 債權讓與（§294以下）係債權行為，不以登記為要件，通知債務人即可對抗債務人，選項排除。"]}, {"year": 108, "num": 18, "ans": "D", "stem": "甲、乙分別共有A地，各有二分之一應有部分。在甲乙未有任何協議之情形下，下列敘述，何者正確？", "opts": ["甲得以其應有部分供丙設定普通地上權", "甲不得將其應有部分出賣、並移轉登記予丁", "甲僅得於其應有部分種植作物", "甲得以其應有部分供戊設定普通抵押權"], "exp": ["✗A. 以「應有部分」設定用益物權（地上權），涉及在具體土地特定位置上使用，應有部分為抽象比例，理論上無法在共有物上就應有部分單獨設定地上權（須全體同意就共有物整體設定），選項不正確。", "✗B. §819Ⅰ，各共有人得「自由處分」其應有部分（出賣、移轉登記），甲可出賣並移轉應有部分予丁，選項說「不得」錯誤。", "✗C. §818，共有人得按應有部分對共有物「全部」為使用收益，並非「僅得於應有部分」種植，選項錯誤。", "✓D. §819Ⅰ，各共有人得自由處分其應有部分，包含就應有部分設定抵押（擔保物權可設於應有部分），正確。"]}, {"year": 108, "num": 19, "ans": "A", "stem": "下列何者不得為抵押權之標的物？", "opts": ["不動產役權", "地上權", "農育權", "典權"], "exp": ["✓A. 不動產役權附隨於需役地，不能單獨讓與（§853），亦不能單獨設定抵押，「不得」為抵押標的，正確為應選答案。", "✗B. §882，地上權「得」為抵押標的，選項排除。", "✗C. §882，農育權「得」為抵押標的，選項排除。", "✗D. §882，典權「得」為抵押標的，選項排除。★記法：地上權、農育權、典權可抵押（§882）；不動產役權不可單獨抵押（附隨性）。"]}, {"year": 109, "num": 10, "ans": "C", "stem": "甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？", "opts": ["因甲已將其土地出售乙，故所有權屬於乙", "因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙", "因土地尚未完成移轉登記，故甲仍是土地所有權人", "甲因買賣契約有效，故不得再行使所有物返還請求權"], "exp": ["✗A. 買賣契約（債權行為）成立，不移轉所有權（債權行為≠物權行為），土地所有權並未因此移轉，選項錯誤。", "✗B. 勝訴判決命甲移轉登記，但所有權移轉須待「登記完成」，判決確定本身不移轉所有權，選項錯誤。", "✓C. 不動產所有權移轉須登記（§758），尚未完成登記，甲仍為登記所有人，正確。", "✗D. 甲仍是所有人，仍可行使物上請求權（但行使與否受契約義務限制），選項說「不得再行使所有物返還請求權」不完全正確。"]}, {"year": 109, "num": 13, "ans": "C", "stem": "甲乙丙共同出資購買一筆A土地，應有部分各三分之一。下列何種行為應經甲乙丙三個共有人全體同意，始為有效？", "opts": ["共有人之一將其應有部分移轉予第三人", "共有人之一將其應有部分設定抵押權予第三人", "共有人之一將A土地設定抵押權予第三人", "共有人之一將A土地之一部分出租予第三人"], "exp": ["✗A. §819Ⅰ，各共有人得自由處分其「應有部分」，不須其他共有人同意，選項排除。", "✗B. 同A，應有部分之抵押設定為各共有人自由處分範圍，不須全體同意，選項排除。", "✓C. 以「A土地全體」設定抵押權，屬對「共有物整體」之處分（§819Ⅱ），須全體共有人同意，正確，為應選答案。", "✗D. 共有物之「管理」（出租）以多數決（過半數及應有部分過半數）即可，不須全體同意（§820），選項排除。"]}, {"year": 109, "num": 15, "ans": "D", "stem": "甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以高價出售於惡意的丙，並交付之。下列敘述，何者正確？", "opts": ["甲因未滿二十歲，不得占有該木材", "乙不能取得名貴的佛像所有權", "乙將名貴的佛像讓與並交付予丙，係屬無權處分", "甲得以乙雕刻加工費用超過木材價值為由，向乙主張名貴佛像之返還"], "exp": ["✗A. 占有事實不以行為能力為要件，17歲甲得占有木材（先占取得所有權）並無問題，選項錯誤。", "✗B. §814，加工物所有權原則上歸「材料所有人」（甲），但加工費用超過材料價值時，歸加工人（乙）；本題「名貴佛像」可能加工費用超過木材，若如此則乙取得佛像所有權，並非「乙不能取得」，選項過於絕對。", "✗C. 若乙已因加工取得佛像所有權（加工費超過材料費），則乙讓與丙並非無權處分；若乙未取得，才是無權處分，題目涉及加工結果的認定，選項描述不精確。", "✓D. §816，加工費用超過材料價值時，加工人取得加工物所有權；但此時加工人（乙）應「償還材料所有人（甲）以相當之價額」；甲得主張要求乙以相當價額補償（乙不能無償取得），正確。"]}, {"year": 109, "num": 16, "ans": "C", "stem": "甲、乙共有一筆A土地，面積400坪，應有部分各為二分之一。下列敘述，何者正確？", "opts": ["甲、乙對於共有之A土地，各有一個所有權，但其權利之行使應受應有部分之限制", "甲、乙對於共有之A土地，各有200坪所有權", "應有部分各為二分之一是甲、乙對A土地的所有權之比例，甲、乙並無法對A土地作整體之使用收益", "甲、乙各有對A土地全部為使用收益之權，並依應有部分之比例負擔費用"], "exp": ["✗A. 共有是「一個所有權」由多人共同享有（非各有一個獨立所有權），選項說「各有一個所有權」概念錯誤。", "✗B. 應有部分為「抽象比例」，甲並非取得特定「200坪」，而是對整筆土地有1/2的抽象比例，選項錯誤。", "✓C→D為正確。依§818，各共有人「按其應有部分，對於共有物之全部，有使用收益之權」，甲乙均得使用全部400坪（按比例），並非「無法作整體使用收益」，C說「無法整體使用」錯誤；官方以D為正解。", "✓D. §818，各共有人得對共有物全部為使用收益，費用依應有部分比例分擔，正確。"]}, {"year": 109, "num": 17, "ans": "B", "stem": "甲、乙、丙、丁四人共有一筆A土地，應有部分各登記為四分之一，甲未經乙、丙、丁之同意，擅自占有A土地四分之三面積的土地，在其上興建一B屋。下列敘述，何者正確？", "opts": ["乙、丙、丁僅得分別請求甲返還占用A土地四分之一之土地", "乙、丙、丁得分別請求甲返還A土地全部，並拆除B屋", "乙、丙、丁僅得共同請求甲返還占用A土地全部，且不得請求甲拆除B屋", "乙、丙、丁分別共有A土地，甲侵害各人之應有部分，各人得單獨請求甲返還各自之應有部分"], "exp": ["✗A. §820、§821，各共有人得「單獨」就共有物「全部」請求返還（§821），並非僅各自四分之一，選項錯誤。", "✓B. §821，各共有人得「單獨」請求返還「共有物全部」（不限於自己應有部分），且得請求拆除無權建物（§767），乙丙丁各自均得單獨請求全部返還並拆除B屋，正確。", "✗C. 並非須「共同」請求，且可請求拆除，選項錯誤。", "✗D. 共有物返還不是各自請求「應有部分」，而是請求全部，選項錯誤。"]}, {"year": 109, "num": 18, "ans": "B", "stem": "下列關於地上權之敘述，何者正確？", "opts": ["地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金", "土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人", "地上權人須連續積欠地租達二年，土地所有人始得終止地上權", "地上權無支付地租之約定者，地上權人不得拋棄其地上權"], "exp": ["✗A. §835，因不可抗力妨礙使用，地上權人「得請求」免除或減少地租（方向正確），但法條用「得請求」並非「即得」（自動免除），還需主張，選項說「依法即得」過於絕對。", "✓B. §838-1Ⅱ，土地所有權讓與時，地上權人已預付地租「非經登記」，不得對抗受讓人（第三人），正確。", "✗C. §836，「積欠地租達二年」（不須連續積欠，合計達二年即可），土地所有人「得定期催告」，催告後仍不清償才終止，選項說「連續積欠達二年始得終止」，條件描述不夠精確。", "✗D. §835，無地租之地上權，地上權人「得隨時拋棄」（有地租者須支付三年地租後才可拋棄），選項說「不得拋棄」相反，錯誤。"]}, {"year": 109, "num": 19, "ans": "B", "stem": "以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？", "opts": ["抵押物扣押後，抵押人就抵押物所得收取之租金", "抵押之建築物存在所必要且性質上得讓與之權利", "設定抵押權後所增建附加於該建築物，而不具獨立性之部分", "抵押之建築物滅失後殘餘之鋼筋"], "exp": ["✗A. §862之1，抵押物扣押後，抵押人所得收取之租金屬抵押效力所及（用於保障抵押權），選項排除。", "✓B. 「抵押建築物存在所必要且性質上得讓與之權利」（如基地租賃權），屬建物存在之附隨權利，依§862，為抵押效力所及；「性質上得讓與」是說明範圍，並非排除，本選項說「非效力所及」——依官方答案B，此為「非抵押效力所及」者（因建物存在必要之從物性權利，其歸屬依§862有特別規定，不在一般效力所及範圍），以官方答案B為準。", "✗C. §862，設定後增建之「不具獨立性附加部分」為抵押效力所及，選項排除。", "✗D. 建築物滅失後殘餘物（鋼筋）為抵押物滅失之殘餘，依§862之1，仍在抵押效力範圍，選項排除。"]}, {"year": 109, "num": 22, "ans": "B", "stem": "下列關於夫妻法定財產制之敘述，何者正確？", "opts": ["於法定財產制下，夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "於法定財產制下，夫或妻之婚前及婚後財產，於婚姻關係存續中所生之孳息，均屬於婚後財產之範圍", "無論採何種約定財產制，其財產制之契約無須登記，即得以之對抗第三人", "於聯合財產制下，聯合財產為夫妻公同共有"], "exp": ["✗A. 法定財產制（§1017），婚後財產並非「夫妻共有」，仍各自所有，選項錯誤。", "✓B. §1017Ⅲ，婚前財產或婚後財產於婚姻關係存續中「所生孳息」，均屬「婚後財產」，正確。", "✗C. §1008，夫妻財產制契約非經登記，不得對抗第三人，選項說「無須登記即得對抗」錯誤。", "✗D. 聯合財產制為舊制（現行法無聯合財產制），且聯合財產制下財產性質並非公同共有，選項描述舊法，不正確。"]}, {"year": 110, "num": 8, "ans": "B", "stem": "關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？", "opts": ["二年", "五年", "十年", "十五年"], "exp": ["✗A. 二年非法條規定數字。", "✓B. §861，抵押權所擔保之利息，以「五年」內發生者及強制執行程序中發生者為限，可優先受償，正確。", "✗C. 十年非法條規定數字。", "✗D. 十五年非法條規定數字。★§861重點：利息五年內（聲請執行前五年）方優先受償。"]}, {"year": 110, "num": 9, "ans": "C", "stem": "依現行民法規定，下列何者須經登記始生法律效力？", "opts": ["遺產之繼承", "土地買賣契約", "設定抵押權之物權行為", "夫妻就共同財產制之約定"], "exp": ["✗A. 繼承取得不動產（非因法律行為，§759），不以登記為要件，繼承即時發生，選項排除。", "✗B. 土地買賣「契約」（債權行為）不以登記為生效要件（諾成、不要式），選項排除。", "✓C. 設定抵押權（物權行為）須登記才生效（§758Ⅱ），非經登記不生效力，正確。", "✗D. 夫妻財產制契約（§1007）以書面為要，不以「登記」為生效要件，未登記僅不能對抗第三人（§1008），並非不生效力，選項排除。"]}, {"year": 110, "num": 14, "ans": "B", "stem": "關於合夥的敘述，下列何者正確？", "opts": ["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有", "合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任", "合夥之決議，應得全體合夥人之同意"], "exp": ["✗A. §668，合夥財產為合夥人「公同共有」，非分別共有，選項錯誤。", "✓B. §679，合夥人除特別訂定外，無補充出資之義務（因損失致資本減少，無須強制補足），正確。", "✗C. §681，合夥財產不足清償時，各合夥人「連帶」負責（並非無須負責），選項錯誤。", "✗D. §670，合夥決議以「多數決」（合夥人過半數且出資額過半數，或出資額合計超過2/3）為之，並非須全體同意，選項錯誤。"]}, {"year": 110, "num": 17, "ans": "A", "stem": "地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權。下列何者正確？", "opts": ["二十年", "十五年", "十年", "五年"], "exp": ["✓A. §833-1，地上權未定期限，存續期間「逾二十年」，法院得應當事人請求定其期間或終止，正確。", "✗B. 十五年為典權相關數字（§923），非地上權未定期限之標準。", "✗C. 十年非本條規定數字。", "✗D. 五年非本條規定數字。★§833-1：未定期限地上權→逾20年，法院得介入。"]}, {"year": 111, "num": 5, "ans": "B", "stem": "依現行民法之規定，下列何者非為不動產登記前，即能取得不動產之所有權？", "opts": ["不動產所有權因繼承而取得", "不動產所有權之時效取得", "不動產所有權因徵收而取得", "不動產所有權因強制執行而取得"], "exp": ["✗A. 繼承取得（§759），「不以登記為要件」，繼承開始即取得，屬不登記即能取得，選項排除。", "✓B. 時效取得不動產所有權（§769、§770），時效完成「不」直接取得所有權，須「向地政機關聲請登記」後才取得所有權，「登記前無法取得」，正確為應選（非「不登記即能取得」），為應選答案。", "✗C. 徵收（依法律行為以外）取得，§759，不以登記為取得要件，選項排除。", "✗D. 強制執行（拍定）取得，依法院移轉命令，不以登記為取得要件（§759），選項排除。★§769時效取得須向地政機關登記→登記後才取得。其餘（繼承、徵收、強制執行）不以登記為取得要件。"]}, {"year": 111, "num": 14, "ans": "B", "stem": "關於共有不動產分管契約之敘述，下列何者正確？", "opts": ["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之", "分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之", "共有人對於分管契約無法達成協議時，各共有人得聲請法院以判決定共有物之管理", "分管契約登記後，於共有物之讓與時，受讓人自然知悉分管契約，無庸特別通知"], "exp": ["✗A. 分管契約屬共有物「管理」行為（§820），以多數決（過半數共有人及應有部分過半數，或應有部分逾2/3）決定；選項描述基本正確但「半數以上」與「過半數」有細微差別，且選項本身的描述符合§820規定，A描述並非錯誤，但官方以B為正解。", "✓B. §820Ⅵ，分管契約訂定後，因情事變更難以繼續，法院得因共有人聲請以「裁定」變更，正確。", "✗C. 無法協議時，聲請法院以「裁定」定管理（§820Ⅱ），並非判決，選項錯誤。", "✗D. 分管契約登記後，對後來受讓人有效，但並非「受讓人自然知悉」（登記公示→推定知悉），表述稍有差異，官方以B最正確。"]}, {"year": 111, "num": 17, "ans": "C", "stem": "關於夫妻法定財產制之規定，下列敘述何者正確？", "opts": ["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產", "夫或妻各自管理、使用、收益及處分其財產", "夫妻之一方依法對他方有剩餘財產差額分配請求權，其請求權消滅時效自其知悉之時起算，期間為五年"], "exp": ["✗A. 法定財產制下婚後財產各自所有（§1017Ⅰ），並非「夫妻共有」，選項錯誤。", "✗B. §1030-3，夫妻一方於法定財產制關係消滅前「五年內」所為無償行為，對他方有害及剩餘財產差額分配者，應追加計算；並非「婚姻存續中全部無償行為」均追加，選項過於擴大，錯誤。", "✓C. §1018，法定財產制下，夫妻「各自管理、使用、收益及處分其財產」，財產各自獨立，正確。", "✗D. §1030-1，剩餘財產差額分配請求權，自「法定財產制關係消滅時」起算，知悉後5年（或消滅後2年或30年）；選項說「自知悉之時起算5年」，時效起算點描述有誤，選項錯誤。"]}, {"year": 111, "num": 18, "ans": "B", "stem": "甲將其A地設定地上權予乙，乙於A土地上興建B屋一棟。其後甲為貸款擔保而將其A地設定抵押權予丙，乙亦因其貸款擔保而將B屋設定抵押權予丁。下列敘述何者正確？", "opts": ["若丁實行抵押權拍賣B屋時，A地所有權應併付拍賣之", "若丁實行抵押權拍賣B屋時，甲之A地不受影響，但B屋之買受人取得乙之地上權", "若丙實行抵押權拍賣A地時，乙之地上權消滅", "若丙實行抵押權拍賣A地時，乙之B屋亦應一併拍賣"], "exp": ["✗A. 丁對B屋（建物）實行抵押，甲的A地所有權並非抵押標的，不應「一併拍賣土地所有權」，僅地上權可能隨B屋轉讓，選項錯誤。", "✓B. 丁拍賣B屋，B屋拍定人取得B屋所有權，同時取得B屋所附隨之「地上權」（乙之地上權隨B屋移轉），甲之A地所有權不受影響，正確。", "✗C. 丙對A地實行抵押（設定在地上權之後），地上權先設定，抵押後設定，依§866，後設定之擔保物權（丙的抵押）不得對抗先設定之地上權（乙），故拍賣A地時乙之地上權「不消滅」，買受人取得有地上權負擔之A地，選項錯誤。", "✗D. 丙的抵押標的為A地，不包含B屋（B屋屬乙所有），丙不得聲請一併拍賣B屋（§877規定限於「設定抵押後在土地上建物」情形，本案地上權在前、抵押在後，情形不同），選項錯誤。"]}, {"year": 111, "num": 19, "ans": "B", "stem": "甲無權占有乙之土地種植果樹，其果實歸屬於何人？", "opts": ["果實在與果樹分離前或分離後，均屬於甲所有", "果實在與果樹分離前或分離後，均屬於乙所有", "果實在與果樹分離前屬於甲所有，分離後屬於乙所有", "果實在與果樹分離前屬於乙所有，分離後屬於甲所有"], "exp": ["✗A. 甲無權占有乙之土地，甲雖種植果樹，但在乙之土地上種植的果樹（附著於土地），原則上果實在未分離前屬土地（乙）的成分，並非甲所有，選項錯誤。", "✓B. 乙為土地所有人，果樹附著於乙的土地，果實在分離前後均屬乙所有（有收取孳息之權的人為土地所有人乙）——嚴格說，果樹可能屬甲所有（甲種植），果實分離前屬果樹之一部（屬甲的果樹？）。依官方答案B：甲無權占有，依§953，惡意占有人收取孳息應返還，且土地所有人對無權占有的植物及其果實有所有權主張，官方認定B（果實前後均屬乙）正確。", "✗C/D. 分離前後歸屬不同的說法，依官方答案不正確。"]}, {"year": 112, "num": 10, "ans": "C", "stem": "為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？", "opts": ["現實交付", "占有改定", "簡易交付", "指示交付"], "exp": ["✗A. 現實交付：讓與人將動產實際移交受讓人，本題受讓人已占有，並非現實交付。", "✗B. 占有改定：讓與人讓與後「繼續占有」（以其他法律關係），並非本題情形。", "✓C. 簡易交付（§761Ⅱ）：受讓人「已占有」動產，讓與合意時即生交付效力，無須再行移轉，正確。", "✗D. 指示交付：讓與人讓與對第三人的返還請求權，本題無第三人。"]}, {"year": 112, "num": 11, "ans": "C", "stem": "果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？", "opts": ["國家所有", "該果實為無主物，誰先占即取得所有", "為該果實之果樹所有權人所有", "由國家及果樹所有權人所共有"], "exp": ["✗A. 果實落入公有用地後，並非當然歸國家所有（此涉及天然孳息歸屬），並非直接歸國有。", "✗B. 果實並非無主物（有收取孳息之權者為果樹所有人），不適用先占，選項錯誤。", "✓C. §70Ⅰ，天然孳息於分離時，由有「收取權利之人」取得；果樹所有人有收取天然孳息（果實）之權，即使果實落入鄰地（公有用地），所有權仍屬果樹所有人，正確。", "✗D. 無共有的法律基礎，選項錯誤。"]}, {"year": 112, "num": 17, "ans": "D", "stem": "土地所有人非因故意或重大過失逾越地界建築房屋，而鄰地所有人知其越界，卻不即時提出異議者，下列何者正確？", "opts": ["鄰地所有人不為異議，即表示拋棄所有權利，不得再為主張", "土地所有人有權得請求購買越界之土地", "鄰地所有人得請求移去或變更越界建築之房屋，並請求支付償金", "鄰地所有人雖不得請求移去或變更越界之房屋，仍得請求支付償金"], "exp": ["✗A. 不即提出異議，效果僅是「不得請求移去越界房屋」，並非「拋棄所有權利」，鄰地所有人仍可請求償金，選項過於絕對，錯誤。", "✗B. §796-1，「鄰地所有人」得請求土地所有人購買越界部分，主動權在鄰地所有人，並非土地所有人有權請求，選項主客顛倒，錯誤。", "✗C. 鄰地所有人知越界而不即提出異議，「不得」請求移去或變更房屋（§796），選項說「得請求移去」錯誤。", "✓D. §796，鄰地所有人不得請求移去，但「仍得請求支付償金」（使用補償），正確。"]}, {"year": 112, "num": 18, "ans": "A", "stem": "關於民法區分所有建築物規定之敘述，下列何者錯誤？", "opts": ["專有部分與其所屬之共有部分及其基地之權利，得分離而為移轉或設定負擔", "就區分所有建築物共有部分及基地之應有部分，區分所有人得約定其比例", "專有部分得經其所有人之同意，依規約之約定供區分所有建築物之所有人共同使用", "區分所有人就區分所有建築物之共用部分及基地之應有部分，與其專有部分之所有權，一併移轉於同一人"], "exp": ["✗A（本題答案）. §799-1，「專有部分」與其「共有部分應有部分」及「基地應有部分」，「不得分離移轉」或「分離設定負擔」（應一體移轉），本選項說「得分離」與法條相反，錯誤，為應選答案。", "✓B. §799-2，共有部分及基地之應有部分，區分所有人得依規約約定其比例，正確。", "✓C. §799-3，專有部分得依規約供共同使用，正確。", "✓D. §799-1，一體移轉（專有部分與共有部分應有部分一起移轉），正確。"]}, {"year": 113, "num": 6, "ans": "B", "stem": "甲無權占有乙所有已登記之A地15年後，乙對甲提起所有物返還請求之訴訟，下列敘述，何者正確？", "opts": ["甲得對乙為消滅時效之抗辯", "乙之回復請求權不罹於消滅時效", "甲得對乙主張時效取得A地所有權", "乙之A地所有權因罹於時效而消滅"], "exp": ["✗A. 所有物返還請求權（物上請求權）對「已登記不動產」不適用消滅時效，甲不得以時效抗辯，選項錯誤。", "✓B. 已登記不動產之所有物返還請求權「不罹於消滅時效」（最高法院判例），乙可隨時請求，正確。", "✗C. §770，時效取得適用於「未登記」不動產；A地已登記，甲不能時效取得，選項錯誤。", "✗D. 已登記不動產所有權不因時效消滅（§769、§770），選項錯誤。"]}, {"year": 113, "num": 9, "ans": "A", "stem": "甲在其所有之A地上興建B屋後，將B屋出售並移轉所有權登記於乙。下列敘述，何者正確？", "opts": ["推定甲與乙在房屋得使用期限內有租賃關係", "視為甲與乙在房屋得使用期限內有租賃關係", "推定乙在房屋得使用期限內對A地有普通地上權", "視為乙在房屋得使用期限內對A地有普通地上權"], "exp": ["✓A. §425-1，土地及其上建物同屬一人，僅將建物移轉（甲將B屋賣給乙），「推定」（非視為）在房屋得使用期限內，甲乙間有租賃關係，正確。", "✗B. 應為「推定」而非「視為」（視為不可推翻，推定可以反証），選項錯誤。", "✗C. §425-1規定的是「租賃」關係，並非地上權，且為推定，選項錯誤。", "✗D. 同C，應為推定租賃，非視為地上權。★重要對比：土地房屋一般買賣分離→§425-1推定租賃；抵押拍賣分離→§877-1視為地上權。"]}, {"year": 113, "num": 13, "ans": "C", "stem": "甲與乙訂立買賣契約，向乙購買A地。下列關於甲何時取得A地所有權之敘述，何者正確？", "opts": ["買賣契約有效成立時", "甲付清買賣價金之時", "完成所有權移轉登記時", "乙將A地交付於甲之時"], "exp": ["✗A. 買賣契約（債權行為）成立，不移轉物權，甲尚未取得所有權，選項錯誤。", "✗B. 付清價金係履行契約義務，不移轉所有權，選項錯誤。", "✓C. 不動產所有權移轉，須「登記」生效（§758），完成移轉登記時甲取得A地所有權，正確。", "✗D. 不動產所有權不以「交付」移轉（動產才以交付移轉），選項錯誤。"]}, {"year": 113, "num": 14, "ans": "A", "stem": "甲乙丙丁分別共有A地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？", "opts": ["甲乙丙丁於判決確定時，各自取得分得部分之所有權", "甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權", "共有物分割之判決是確認判決，僅在確認共有物應如何分割", "共有物分割判決確定後，分割完成，此後當事人無庸再辦理任何登記"], "exp": ["✓A. 共有物分割判決（形成判決），「判決確定時」即生分割效力（各人依判決確定分得部分之所有權），無須再向地政機關聲請登記始取得所有權（因屬「因判決」取得，依§759非因法律行為取得），正確。", "✗B. 因判決取得（§759），不以登記為取得要件，判決確定即取得，選項錯誤。", "✗C. 分割判決為形成判決（使法律關係發生變動），並非確認判決，選項錯誤。", "✗D. 雖取得所有權不須再辦理登記，但辦理登記有助於確保權利（§759Ⅱ未辦登記不得處分），且「無庸辦理任何登記」說法不完全正確（仍應辦登記以利後續處分），官方以A為最正確。"]}, {"year": 113, "num": 15, "ans": "B", "stem": "甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A地上有B屋，下列敘述，何者正確？", "opts": ["甲已經取得普通地上權", "甲得請求登記為普通地上權人", "因乙之A地已辦理登記，故甲無法時效取得", "甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"], "exp": ["✗A. 時效期間滿20年，取得的是「請求登記」之權利，並非直接取得地上權（須登記後才取得），選項說「已取得」錯誤。", "✓B. §772準用§769，以行使地上權意思和平、公然、繼續於他人已登記不動產（已登記不動產可時效取得地上權，但不可取得「所有權」），20年後得「請求登記為地上權人」，正確。★區分：已登記不動產→不能時效取得所有權，但「可」時效取得地上權等用益物權。", "✗C. 已登記不動產雖不能時效取得「所有權」，但可以時效取得「地上權」（用益物權），§772準用§769，選項描述過於絕對，錯誤。", "✗D. 甲「請求登記」是向地政機關聲請，並非直接起訴請求乙同意，程序上有誤，選項錯誤。"]}, {"year": 113, "num": 17, "ans": "D", "stem": "甲向乙銀行貸款新臺幣500萬元，並以甲所有之A地為乙設定普通抵押權，雙方約定債權已屆清償期而未為清償時，A地之所有權移屬於乙。就該流押契約之效力，下列敘述，何者正確？", "opts": ["絕對無效", "相對無效", "非經登記，不生效力", "非經登記，不得對抗第三人"], "exp": ["✗A. §873-1，流押契約（約定清償期屆至未清償即將抵押物所有權移轉），效力並非絕對無效（修法後調整），選項過於絕對。", "✗B. 「相對無效」概念模糊，非精確法律術語，選項錯誤。", "✗C. 流押契約的效力問題，並非以「登記」為生效要件。", "✓D. §873-1（修正後），流押契約（約定以抵押物清償債務）本身效力如何，須視具體情況；依現行法，流押條款「非經登記，不得對抗第三人」，正確，以官方答案D為準。"]}, {"year": 113, "num": 18, "ans": "B", "stem": "甲向乙銀行借貸新臺幣1000萬元，並以甲所有之A屋為乙設定普通抵押權。嗣後，因第三人丙之過失，致A屋滅失，下列敘述，何者正確？", "opts": ["乙之抵押權因A屋滅失而消滅", "乙就甲對丙所得行使之賠償請求權有權利質權", "乙就甲對丙所得行使之賠償請求權有抵押權", "乙得就甲之損害賠償請求權，直接請求丙給付"], "exp": ["✗A. §881，抵押物滅失，抵押權不當然消滅，而是「物上代位」，乙就甲得受之賠償金有抵押權（§862之1），選項錯誤。", "✓B. §881，抵押物滅失，抵押人得受賠償金，抵押權人「就其賠償金有質權」（物上代位的形式為「質權」而非「抵押權」），正確。★§881物上代位：抵押物滅失→抵押人得受賠償金→抵押權人就賠償金有「質權」（非繼續抵押）。", "✗C. 物上代位後，對賠償金的擔保物權性質轉變為「質權」，並非繼續以「抵押權」存在，選項錯誤。", "✗D. 乙不能直接請求丙給付（乙與丙間無直接法律關係），乙須透過甲的賠償請求權（就該債權有質權）主張，選項錯誤。"]}, {"year": 114, "num": 15, "ans": "A", "stem": "依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？", "opts": ["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更", "共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，其他分得人無庸支付任何補償", "鄰地所有人對於土地所有人之相鄰土地得主張通行權者，通行地所有人無庸獲得補償", "甲乙各有相鄰土地，甲土地及位於甲土地上之甲所有建物所含之石灰岩礦，均屬甲所有"], "exp": ["✓A. §796但書，土地所有人「故意」逾越地界建築，鄰地所有人得請求移去；法院得斟酌公共利益（§796-1），在特定情形允許或限制此請求，正確。", "✗B. §824-2，共有土地分割致分得地與公路無適宜聯絡，有通行需要時，他共有人「應給予通行補償」，並非無庸補償，選項錯誤。", "✗C. §789，通行地所有人對袋地通行「應受相當補償」，並非無庸補償，選項錯誤。", "✗D. 土地所有權範圍（§773）包含地下礦藏，但「礦業法」規定礦藏（含石灰岩礦）屬國家所有，甲對礦藏無所有權，選項錯誤。"]}, {"year": 114, "num": 16, "ans": "A", "stem": "甲、乙兩人共有A地，應有部分甲為1/3、乙為2/3。下列何者錯誤？", "opts": ["若甲、乙協議20年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割", "甲得在未經乙的同意下，將其應有部分贈與及移轉給丁", "若甲商請乙分割A地未果，甲可聲請法院裁判分割", "分割共有物不一定要辦理登記，始生分割效力"], "exp": ["✗A（本題答案）. §823Ⅱ但書，不分割約定中，若有「情事變更」（如徵收、緊急需要），仍得請求分割；選項說「不論任何事由均不得分割」過於絕對，與但書規定不符，為應選之「錯誤」選項。", "✓B. §819Ⅰ，各共有人得自由處分其應有部分（含贈與），不須他人同意，正確。", "✓C. §824，共有人無法達成協議分割，得聲請法院裁判分割，正確。", "✓D. 裁判分割（§824形成判決），判決確定時生效（§759，因判決取得），不以登記為效力要件，正確。"]}, {"year": 114, "num": 17, "ans": "D", "stem": "依我國民法關於地上權之規定，下列何者正確之論述？", "opts": ["地上權未定有存續期間者，逾越30年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權", "地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付", "地上權人積欠地租達一年之總額者，土地所有人得終止其地上權", "地上權之設定，不以支付地租為必要，地上權得無償設定"], "exp": ["✗A. §833-1，未定期限地上權，逾「二十年」（非三十年），法院得應請求定期間或終止，選項年數錯誤。", "✗B. §835，因不可抗力妨礙使用，地上權人「得請求免除或減少地租」（須請求，並非直接拒絕），選項說「得拒絕支付」過強，且不須申請即自動免除，描述錯誤。", "✗C. §836，積欠地租達「二年」總額，才得終止；「一年」不夠，選項年數錯誤。", "✓D. §836，地上權可有地租（有償）或無地租（無償），法律未強制要求必須支付地租，無償地上權亦可設定，正確。"]}, {"year": 114, "num": 19, "ans": "B", "stem": "甲所有的A地與乙所有的B地相鄰。下列何者正確？", "opts": ["A地兩面環山、第三面環河，僅能經過B地通行於道路，則甲須經乙的同意，始得取得對B地的通行權", "A地一面環山、一面環河、一面接著大馬路、一面緊鄰B地，甲聽信風水師的建議，將面臨大馬路出口封閉，而主張通行B地，乙得拒絕甲之通行", "A地為袋地，甲得主張通行B地時，通行地點及方法由甲決定，乙須無條件配合", "甲得主張通行B地，此屬法定通行權（鄰地通行權），乙就甲之通行，毋庸受到任何補償"], "exp": ["✗A. 袋地通行權（§787）為法定通行權，不須鄰地所有人（乙）同意，法律直接賦予，選項說「須經乙同意」錯誤。", "✓B. §787，袋地通行以「土地周圍有與公路無適宜之聯絡」為要件；甲A地一面接著大馬路，本有通行便利，甲自行封閉出口造成袋地情形，此屬「人為製造袋地」，乙得拒絕甲之通行主張（不能以自己製造的困難要求他人配合），正確。", "✗C. §787Ⅱ，通行地點及方法，由雙方協議或由法院定之，並非由甲單方決定，選項錯誤。", "✗D. §787Ⅲ，通行地所有人（乙）應受「相當補償」，並非毋庸補償，選項錯誤。"]}];

function stats(){const done=QS.filter(q=>S[gk(q)]).length,cor=QS.filter(q=>S[gk(q)]&&S[gk(q)].ok).length;document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';document.getElementById('prog').style.width=(done/TOTAL*100)+'%'}
function buildChips(){var c=document.getElementById('chips');c.innerHTML='';var a=mk('div','chip'+(aY==='all'?' active':''));a.textContent='全部('+TOTAL+')';a.onclick=function(){aY='all';render()};c.appendChild(a);YEARS.forEach(function(y){var cnt=QS.filter(function(q){return q.year===y}).length,d=mk('div','chip'+(aY===y?' active':''));d.textContent=y+'年('+cnt+')';d.onclick=function(){aY=y;render()};c.appendChild(d)})}
function card(q){var k=gk(q),s=S[k],c=mk('div','q-card');c.id='c_'+k;var hd=mk('div','q-head');hd.appendChild(mk('span','q-year',q.year+'年'));hd.appendChild(mk('span','q-num','第'+q.num+'題'));if(s){var b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}var st=mk('div','q-stem',q.stem);var op=mk('div','opts');['A','B','C','D'].forEach(function(L,i){var o=mk('div','opt');if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}o.appendChild(mk('span','opt-lbl',L+'.'));o.appendChild(mk('span','opt-txt',q.opts[i]));if(!s)o.onclick=(function(qq,ll){return function(){choose(qq,ll)}})(q,L);op.appendChild(o)});var ex=mk('div','exp-block'+(s?' show':''));q.exp.forEach(function(ln){var d=mk('div','exp-line');var ch=ln.charAt(0);if(ch==='✓')d.classList.add('cl');else if(ch==='✗')d.classList.add('wl');else if(ch==='★'||ch==='※')d.classList.add('nl');d.textContent=ln;ex.appendChild(d)});if(s){var tr=mk('div','err-tag');var lb=mk('span',null,'錯題分類：');lb.style.cssText='font-size:11px;color:var(--gray)';tr.appendChild(lb);[['a','A法條混淆'],['b','B粗心'],['c','C真的不熟']].forEach(function(pair){var k2=pair[0],lbl=pair[1];var t=mk('span','etag',lbl);if(s.et===k2)t.classList.add(k2+'-on');t.onclick=(function(kk){return function(){s.et=(s.et===kk?null:kk);sv();rc(q)}})(k2);tr.appendChild(t)});ex.appendChild(tr)}c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);return c}
function rc(q){var old=document.getElementById('c_'+gk(q));if(old)old.parentNode.replaceChild(card(q),old)}
function choose(q,ch){S[gk(q)]={ch:ch,ok:(ch===q.ans)};sv();rc(q);var blk=document.getElementById('c_'+gk(q));if(blk){var ex=blk.querySelector('.exp-block');if(ex)ex.scrollIntoView({block:'nearest'})}stats()}
function render(){buildChips();var qs=getFilt(),m=document.getElementById('main');m.innerHTML='';stats();if(!qs.length){m.innerHTML='<div class="empty">無符合條件的題目</div>';return}qs.forEach(function(q){m.appendChild(card(q))})}
document.querySelectorAll('.fbtn').forEach(function(b){b.onclick=function(){var f=b.getAttribute('data-f');if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(function(x){x.classList.remove('active')});document.querySelector('[data-f="all"]').classList.add('active')}else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}render()}}); 
render();
</script>
</body>
</html>
