<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}

.kouf{border-left:5px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14px}.kouf b{color:var(--ok)}

.fr>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}.fr>summary::-webkit-details-marker{display:none}.fr>summary::before{content:"▸";font-size:.9em}.fr[open]>summary::before{content:"▾"}.fr[open]>summary{margin-bottom:4px}

<script>
var D={"timer": true, "Q": [], "E": [{"t": "申論題一（25分）｜A級②　不動產說明書簽章解說流程", "link": "經紀法規_備考指揮中心.html#es-fw03", "lt": "寫完對照：申論分頁 範文03（108年申論二・官方題）", "q": "甲不動產經紀業受屋主乙委託銷售房屋。說明書由甲所僱用之經紀營業員丙製作，未經甲指派之經紀人簽章；丙亦未先請乙在說明書上簽章，即持該說明書向買方丁解說。丁買受後，發現說明書漏未記載之重大瑕疵而受有損害。試依不動產經紀業管理條例說明：（一）不動產說明書應由那些人簽章？其先後順序為何？（二）解說義務人與解說對象各為何？（三）簽訂買賣契約書時，說明書應如何處置？有何法律效果？（四）丁得向何人請求損害賠償？甲、丙各應受何種處罰？", "parts": [["一、定義", "不動產說明書，係經紀業於仲介或代銷不動產時，向交易相對人揭露標的物現況、權利狀態及交易條件之法定文件，目的在使相對人於締約前取得對等之交易資訊；其應記載及不得記載事項，由中央主管機關依本條例第22條第3項公告之。"], ["二、法條", "不動產經紀業管理條例第22條第1項第5款、第3項；第23條第1項、第2項；第24條第1項、第2項；第26條第1項、第2項、第4項；第29條第1項第1款；第31條第1項第1款、第2項。"], ["三、涵攝（依四問逐一作答，每問先結論）", "【問一　簽章人與順序】結論：三階段、三種人，依時序為①經紀人②委託人③交易相對人。\n①經紀人：說明書屬第22條第1項第5款應由經紀業「指派經紀人」簽章之文件，於製作完成時簽章；經紀營業員不得代替經紀人簽章。本題丙為營業員，所製作之說明書未經經紀人簽章，已違反第22條第1項。\n②委託人：說明書於「提供解說前」應經委託人簽章（第23條第2項）。本題丙未請乙簽章即向丁解說，違反第23條第2項。\n③交易相對人：於簽訂租賃或買賣契約書時簽章（第24條第1項）。\n\n【問二　解說義務人與對象】結論：義務人為「經紀人員」，對象為「與委託人交易之相對人」。\n第23條第1項所定解說義務人為經紀人員，依第4條第5款包含經紀人與經紀營業員，故丙本身即負解說義務，不以經紀人為限（此與第22條第1項「應由經紀人簽章」不同，兩者主體不可互換）。解說對象為與委託人交易之相對人，即買方丁，不是委託人乙。\n\n【問三　締約時之處置與效果】結論：交付相對人並由其簽章，說明書視為契約書之一部分。\n雙方簽訂買賣契約書時，經紀人應將說明書交付丁，並由丁於說明書上簽章（第24條第1項）；該說明書「視為契約書之一部分」（第24條第2項）。故說明書之漏載或不實，即屬契約內容之違反，丁得本於契約關係主張權利，不以另有約定為必要。\n\n【問四　損害賠償與處罰】結論：丁得向甲、丙請求連帶賠償，不足時得請求全國聯合會代為賠償；甲受罰鍰、丙受申誡。\n①賠償：經紀業因經紀人員執行業務之故意或過失致交易當事人受損害者，經紀業與經紀人員負連帶賠償責任（第26條第2項），故丁得向甲、丙請求連帶賠償。另因可歸責於甲之事由不能履行委託契約致委託人乙受損害者，由甲負賠償責任（第26條第1項）。\n②代為賠償：丁取得執行名義、仲裁成立或基金管理委員會決議支付後，得於甲所繳存營業保證金及擔保總額內，請求全國聯合會代為賠償（第26條第4項）。\n③處罰：甲違反第22條第1項，依第29條第1項第1款處新臺幣6萬元以上30萬元以下罰鍰；丙違反第22條第1項、第23條，依第31條第1項第1款予以申誡，申誡累計3次者，另予6個月以上3年以下停止執行業務之處分（第31條第2項）。"], ["四、結論", "簽章順序為經紀人（製作完成）→委託人（解說前）→相對人（締約時），說明書並視為契約書之一部分；解說義務人為經紀人員、對象為交易相對人。本題甲、丙之流程違反第22條第1項、第23條，丁得向甲、丙請求連帶賠償，不足額時得請求全國聯合會於保證金及擔保總額內代為賠償；甲處6萬元以上30萬元以下罰鍰，丙予以申誡。"]], "warn": "自擬案例題（105年一、108年二為同一條文叢之官方題）。條文依全國法規資料庫 2026-10-02 快照逐字核對。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "說明書＝締約前資訊揭露之法定文件，§22Ⅲ授權公告。"], ["二、法條", "§22Ⅰ⑤、Ⅲ；§23Ⅰ Ⅱ；§24Ⅰ Ⅱ；§26Ⅰ Ⅱ Ⅳ；§29Ⅰ①；§31Ⅰ①。"], ["三、涵攝", "①簽章三階段：經紀人（製作完成）→委託人（解說前）→相對人（締約時）。②解說人＝經紀人員（含營業員）；對象＝交易相對人。③締約時交付＋相對人簽章→視為契約一部分。④賠償：經紀業與經紀人員連帶（§26Ⅱ）→不足時全國聯合會代賠（§26Ⅳ）；罰則：業者6–30萬（§29Ⅰ①）、人員申誡（§31Ⅰ①）。"], ["四、結論", "流程違反§22Ⅰ、§23；丁得連帶求償並請求全國聯合會代賠。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "經紀人簽章（§22Ⅰ⑤）｜委託人解說前簽章（§23Ⅱ）｜相對人締約時簽章（§24Ⅰ）｜視為契約一部分（§24Ⅱ）｜經紀人員（含營業員）解說｜連帶賠償（§26Ⅱ）｜全國聯合會代為賠償（§26Ⅳ）｜6–30萬（§29Ⅰ①）｜申誡（§31Ⅰ①）", "ok"], ["常見失分點", "① 漏寫全國聯合會代為賠償（§26Ⅳ）——歷年最常見的失分點\n② 把解說義務人寫成「限經紀人」（條文是經紀人員，含營業員）\n③ 委託人簽章時點寫成「簽約時」（應為「提供解說前」）\n④ 罰鍰寫成 3–15 萬（違反§22Ⅰ屬§29Ⅰ①，是 6–30 萬）\n⑤ 把經紀人員的處分寫成罰鍰（人員是申誡，不是罰鍰）", "bad"]]}], "m": "人（經紀人）→主（委託人）→客（相對人），簽完視為契約", "kw": ["經紀人簽章", "解說前委託人簽章", "相對人簽章", "視為契約一部分", "經紀人員", "連帶賠償", "全國聯合會", "6萬元以上30萬元以下", "申誡"]}, {"t": "申論題二（25分）｜A級④　公平交易法廣告查核分工原則", "link": "經紀法規_備考指揮中心.html#es-fw01", "lt": "寫完對照：申論分頁 範文01（103年申論二・官方題）", "q": "甲建設公司興建預售屋，委託乙不動產經紀業代銷。乙為某品牌之加盟店，於網路及傳單廣告中：（一）宣稱基地「步行3分鐘可達捷運站」，經實測須15分鐘；（二）未於廣告標明加盟店字樣。試問：（一）何謂不動產經紀業廣告？（二）不動產廣告不實案件之查核權責分工原則為何？（三）本題（一）（二）兩種情形，應分別由何機關依何種法律處理？", "parts": [["一、定義", "依不動產經紀業廣告處理原則第二點，廣告係指經紀業利用電視、廣播、影片、幻燈片、報紙、雜誌、傳單、海報、招牌、牌坊、廣告圖冊、模型、樣品屋、布條、電腦、電話傳真、電子視訊、電子語音、網際網路或其他方法，使不特定多數人知悉其宣傳內容之傳播。重點在「使不特定多數人知悉」，媒介不限。"], ["二、法條", "不動產經紀業廣告處理原則第二點、第三點、第六點、第七點；不動產經紀業管理條例第18條、第21條第1項、第2項、第29條第1項第1款、第4款；公平交易法第21條、第29條至第31條。"], ["三、涵攝（依三問逐一作答，每問先結論）", "【問一　廣告之定義】結論：以任何方法使不特定多數人知悉其宣傳內容之傳播，即為廣告。\n網路刊登、傳單散發均屬之，不以傳統平面媒體為限（廣告處理原則第二點已明文列入網際網路、模型、樣品屋）。本題乙之網路與傳單宣傳，均屬不動產經紀業廣告。\n\n【問二　查核權責分工原則】結論：依廣告處理原則第三點，分五種情形定其管轄。\n①經紀業所為之廣告案件→由主管機關（內政部、直轄市或縣市政府）依不動產經紀業管理條例處理。\n②非屬管理條例規範範疇者（如涉及事業之服務品質、企業形象、行銷策略等虛偽不實或引人錯誤之表示）→由公平交易委員會依公平交易法處理。\n③經紀業係加盟經營，未於廣告標明加盟店字樣者→由主管機關依管理條例處理。\n④建商委託經紀業從事銷售行為之不實廣告，建商與經紀業俱為廣告主時→由公平交易委員會依公平交易法處理。\n⑤其他無法依前述原則劃分管轄者→由內政部與公平交易委員會協調處理。\n分工精神：單純涉及經紀業執業規範者回歸地政主管機關；涉及市場競爭秩序之虛偽不實表徵則由公平會以競爭法觀點審查。\n\n【問三　本題之歸屬】結論：交通時間誇大歸公平會依公平法；未標明加盟歸主管機關依管理條例。\n①「步行3分鐘可達捷運站」實須15分鐘：交通狀況之時間、空間距離未經validate之敘述，屬廣告處理原則第六、七點所列之不實廣告認定標準；又本件係建商甲委託經紀業乙銷售，甲、乙俱為廣告主，核屬分工原則第④款，應由公平交易委員會依公平交易法第21條（對足以影響交易決定之事項為虛偽不實或引人錯誤之表示）處理；受害人並得依第29條請求除去侵害、第30條請求損害賠償，甲為故意者，法院得依第31條第1項酌定不超過已證明損害額3倍之賠償。\n②未標明加盟店字樣：核屬分工原則第③款，應由主管機關依管理條例處理。乙為加盟經營者，依第18條應於廣告、市招、名片等明顯處標明加盟店或加盟經營字樣；違反者依第29條第1項第4款，由主管機關令其限期改正，屆期未改正者處新臺幣3萬元以上15萬元以下罰鍰（注意：此款為「先限期改正」，非逕行處罰）。"], ["四、結論", "廣告以使不特定多數人知悉為要件；查核分工依廣告處理原則第三點分五種情形。本題交通時間誇大因建商與經紀業俱為廣告主，由公平交易委員會依公平交易法第21條處理；未標明加盟字樣則由主管機關依管理條例第18條、第29條第1項第4款，先令限期改正，屆期未改正處3萬元以上15萬元以下罰鍰。"]], "warn": "自擬案例題（103年二為官方題）。廣告處理原則為行政命令，不在全國法規資料庫，本站所載為要點整理，逐字請對內政部公告。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "廣告＝以任何方法使不特定多數人知悉宣傳內容之傳播（處理原則第二點）。"], ["二、法條", "處理原則第二、三、六、七點；條例§18、§21、§29Ⅰ④；公平法§21、§29–§31。"], ["三、涵攝", "分工五款：①經紀業廣告→管理條例②企業形象品質等→公平法③加盟未標明→管理條例④建商委託、俱為廣告主→公平法⑤無法劃分→兩機關協調。本題：交通時間誇大＝第④款→公平會、公平法§21；未標明加盟＝第③款→主管機關、條例§18，§29Ⅰ④先限期改正，屆期未改正3–15萬。"], ["四、結論", "一件廣告兩個管轄：公平會管不實內容，地政機關管加盟標示。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "不特定多數人｜處理原則第三點五款｜俱為廣告主→公平會｜加盟未標明→管理條例｜公平法§21引人錯誤｜§18加盟標明｜§29Ⅰ④先限期改正｜3萬元以上15萬元以下｜損害額3倍（故意）", "ok"], ["常見失分點", "① 只寫「廣告不實找公平會」，沒有分五款——本題核心就是分工\n② 把未標明加盟寫成公平法（那是管理條例§18）\n③ 把§29Ⅰ④寫成逕行處罰（要先令限期改正）\n④ 漏掉廣告定義的「不特定多數人」要件\n⑤ 把公平法故意賠償寫成4倍（現行為3倍以下）", "bad"]]}], "m": "經紀業自己的事找地政，市場秩序的事找公平會", "kw": ["不特定多數人", "五種分工情形", "俱為廣告主", "加盟店字樣", "公平交易法第21條", "限期改正", "3萬元以上15萬元以下"]}, {"t": "申論題三（25分）｜A級⑤　115.1.13 不動產說明書修正", "link": "經紀法規_備考指揮中心.html#es-c1", "lt": "寫完對照：申論分頁 預測 C1（預售屋說明書特別揭露・自擬）", "q": "內政部於115年1月13日以台內地字第1140267470號令修正「不動產說明書應記載及不得記載事項」，並自115年4月1日生效。試說明：（一）不動產說明書應記載及不得記載事項之法源依據與法律性質為何？（二）本次修正之內容為何？成屋與預售屋有何不同？（三）經紀業未依修正後之規定製作說明書，可能發生何種法律效果？", "parts": [["一、定義", "不動產說明書係經紀業於仲介或代銷時，使交易相對人於締約前了解標的物現況與交易條件之揭露文件。其應記載及不得記載事項，由中央主管機關依不動產經紀業管理條例第22條第3項公告，性質上為行政命令，非法律，故不在全國法規資料庫，而以內政部公告為準。"], ["二、法條", "不動產經紀業管理條例第22條第1項第5款、第3項；第24條第2項；第26條第2項；第29條第1項第1款；第31條第1項第1款。不動產說明書應記載及不得記載事項第2點（成屋）、第3點（預售屋）；內政部115年1月13日台內地字第1140267470號令，自115年4月1日生效。"], ["三、涵攝（依三問逐一作答，每問先結論）", "【問一　法源與性質】結論：依條例第22條第3項授權，由中央主管機關（內政部）以令公告，性質為行政命令。\n條例第22條第1項第5款規定不動產說明書應由經紀業指派經紀人簽章，同條第3項則授權中央主管機關訂定其應記載及不得記載事項，本次修正即依此授權而為。\n\n【問二　修正內容及成屋與預售屋之差異】結論：本次修正僅三處，口訣「光・能・氯」；其中建築能效僅成屋、氯離子僅預售屋，太陽光電則兩者皆有。\n①太陽光電發電設備（成屋第2點(一)5(18)、預售屋第3點(一)9(2)）：應記載有無設置？有設置者並應敘明其設置位置。係配合再生能源發展條例之修正。\n②建築能效情形（僅成屋第2點(一)6）：應記載有無取得建築能效標示？有者並敘明等級、核發日期及證書效期。係配合近零碳建築政策。預售屋第3點並未列入本項。\n③氯離子檢測報告名稱用字調整（僅預售屋第3點(一)10「建物瑕疵擔保」）：修正後為「交屋時有無檢附建築物混凝土氯離子含量檢測報告及施工中建築物出具無放射性污染證明？若無，應敘明原因。」修正前則為「施工中建築物新拌混凝土氯離子含量檢測報告單」及「施工中建築物出具無輻射污染證明」。修正理由為配合建築物混凝土結構設計規範修正（檢測標準改以硬固混凝土）及施工中建築物混凝土氯離子含量管理實施要點之修正。成屋第2點第7項之「有無混凝土中水溶性氯離子含量及輻射檢測？」則未在本次修正之列。\n※易錯：「最近5年內基地周邊300公尺範圍內水災淹水救助紀錄」僅預售屋「其他重要事項」有，且104年版即已列入（104年第40題、105年第8題考過），並非115年新增；成屋與土地（素地）均無此項。\n\n【問三　未依新規定製作之法律效果】結論：行政責任與民事責任併存。\n①行政責任：說明書為條例第22條第1項第5款應由經紀人簽章之文件，未依公告所定應記載事項製作者，係違反第22條第1項，經紀業依第29條第1項第1款處新臺幣6萬元以上30萬元以下罰鍰；經紀人員依第31條第1項第1款予以申誡。\n②民事責任：說明書於締約時交付相對人並經簽章後，視為契約書之一部分（第24條第2項），漏載或不實即屬契約內容之違反；因經紀人員之故意或過失致交易當事人受損害者，經紀業與經紀人員負連帶賠償責任（第26條第2項）。"], ["四、結論", "說明書之應記載及不得記載事項，係依條例第22條第3項授權公告之行政命令。115年1月13日令僅修正三處：太陽光電（成屋＋預售屋）、建築能效（僅成屋）、預售屋氯離子報告名稱用字；水災淹水救助紀錄為預售屋既有項目，非本次新增。經紀業未依新版製作說明書者，除依第29條第1項第1款處6萬元以上30萬元以下罰鍰、經紀人員受申誡外，因說明書視為契約之一部分，並可能與經紀人員負連帶損害賠償責任。"]], "warn": "自擬預擬題（本次修正無官方題）。氯離子新舊用字取自 6laws 公告頁新舊對照，建築能效僅成屋經內政部公告頁與公告全文確認；逐字仍建議考前再對內政部公告。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "說明書＝締約前揭露文件；應記載事項由§22Ⅲ授權公告，性質為行政命令。"], ["二、法條", "條例§22Ⅰ⑤、Ⅲ、§24Ⅱ、§26Ⅱ、§29Ⅰ①、§31Ⅰ①；公告第2點、第3點；115.1.13令（115.4.1生效）。"], ["三、涵攝", "三處「光・能・氯」：光電＝成屋5(18)＋預售屋9(2)，敘明位置；能效＝僅成屋6；氯離子＝僅預售屋10，用字調整（現行「建築物混凝土氯離子含量檢測報告」「無放射性污染證明」；舊字為「新拌」「輻射」）。水災300公尺／5年＝預售屋舊項目，非新增。未依規定製作→§29Ⅰ①6–30萬、§31Ⅰ①申誡；說明書視為契約一部分→§26Ⅱ連帶賠償。"], ["四、結論", "只修三處，能效僅成屋、氯離子僅預售屋；違反者行政加民事責任。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "§22Ⅲ授權（行政命令）｜光・能・氯｜太陽光電敘明設置位置｜建築能效僅成屋｜氯離子僅預售屋用字調整｜放射性污染（現行）｜水災紀錄非115新增｜6萬元以上30萬元以下｜視為契約一部分", "ok"], ["常見失分點", "① 把水災淹水救助紀錄當成115年新增（這是最容易踩的陷阱）\n② 把建築能效寫成成屋、預售屋都要（只有成屋）\n③ 把「新拌」「輻射」當成現行用語（那是修正前的舊字）\n④ 漏答第一問的法源與性質（§22Ⅲ授權之行政命令）\n⑤ 只答修正內容，漏掉第三問的法律效果（行政＋民事兩層）", "bad"]]}], "m": "光（兩者）・能（成屋）・氯（預售屋）；水災是老項目", "kw": ["第22條第3項", "行政命令", "太陽光電", "建築能效僅成屋", "氯離子用字調整", "放射性污染", "非115新增", "視為契約一部分"]}]},ID="essay1";
