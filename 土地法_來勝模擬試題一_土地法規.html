var D={"Q": [{"n": 1, "stem": "依土地法關於土地權利及公有土地之規定，下列敘述何者錯誤？", "opts": ["私有土地所有權移轉如妨害基本國策，中央地政機關得報請行政院制止之", "直轄市政府將所管公有土地為超過十年期間之租賃，原則上須經該管區內民意機關同意並經行政院核准", "各級政府機關需用公有土地時，應商同該管直轄市或縣（市）政府，層請行政院核准撥用", "外國人因繼承取得依法不得移轉於外國人之土地者，應於被繼承人死亡之日起三年內出售與本國人"], "ans": "D", "alt": [], "conf": "高", "ch": "A1", "notes": ["✓ 正確（白話：私有地一賣掉若會傷到基本國策，中央可請行政院擋下）。這是土地法總則的『移轉制止』規定。", "✓ 正確。土地法§25：公有土地租賃超過10年，要經民意機關同意＋行政院核准。", "✓ 正確。土地法§26：各級機關需用公有地，商同地方政府『層請行政院』核准撥用。", "✗ 錯誤。土地法§17：外國人『因繼承』取得不得移轉予外國人的土地，是自『登記完畢之日』起3年內出售，不是『被繼承人死亡之日』。"], "trap": "起算點陷阱：外國人繼承→『登記完畢之日』起3年（不是死亡日）。", "low": "", "neg": true, "st": null}, {"n": 2, "stem": "甲所有都市計畫公園用地尚未被政府取得，試依據相關法令，判斷下列敘述何者錯誤？", "opts": ["甲原則上不得將土地改作妨礙公園指定目的之使用", "公共設施保留地在政府取得前，得依法申請臨時建築使用，且於政府通知開闢公共設施並限期拆除時，臨時建築權利人應自行無條件拆除", "倘若將來被徵收，其地價補償則按毗鄰公共設施保留地之平均市價補償", "劃設逾二十五年未經政府取得者，得優先申請與公有非公用土地辦理交換"], "ans": "C", "alt": [], "conf": "高", "ch": "B2", "notes": ["✓ 正確。保留地在政府取得前，原則不得改作妨礙指定目的之使用（都計法§51）。", "✓ 正確。公設保留地得申請臨時建築使用（都計法§50），政府通知開闢時，須自行無條件拆除。", "✗ 錯誤。公共設施保留地被徵收時，補償是按『毗鄰「非」公共設施保留地』的平均市價（土徵§30），不是毗鄰『保留地』。少一個『非』字整句就錯。", "✓ 正確。都計法§50-2：劃設逾25年未取得者，得優先申請與公有非公用土地交換。"], "trap": "一個『非』字：補償基準是毗鄰『非』公共設施保留地平均市價。25年＝優先交換。", "low": "", "neg": true, "st": null}, {"n": 3, "stem": "依土地法及土地徵收條例有關優先購買權之規定，下列敘述何者正確？", "opts": ["出租人出典耕地時，承租人有依同樣條件優先承典之權；出租人未通知承租人而與第三人訂立典權契約者，其契約不得對抗承租人", "基地出賣時，地上權人、典權人或承租人有依同樣條件優先購買之權，其順序依地上權人、典權人、承租人之先後定之", "被徵收之私有土地經依徵收計畫使用後，依法變更原使用目的而標售時，原土地所有權人或其繼承人有依同樣條件優先購買權，區段徵收之土地亦同", "逾期未辦繼承登記之土地標售時，繼承人、合法使用人或其他共有人依序有優先購買權，但未於決標後十日內表示優先購買者，視為放棄"], "ans": "A", "alt": [], "conf": "高", "ch": "A4", "notes": ["✓ 正確。土地法§107準用§104Ⅱ：出租人出典耕地，承租人有依同樣條件優先承典之權；未通知而訂約者，契約『不得對抗』承租人（物權性質）。", "✗ 錯誤。基地出賣，優購順序不是『地上權→典權→承租人』的固定順位，而是『以登記先後定之』（土地法§104Ⅰ）。", "✗ 錯誤。區段徵收不適用土徵§59的優先買回規定（§59前段即排除區段徵收），選項說『區段徵收亦同』就錯。", "✗ 錯誤。土地法§73-1：繼承人等人行使優購須於『決標後30日內』表示，不是10日。（10日是土徵§59、§107準用§104Ⅱ的通知期限，別混。）"], "trap": "優購權期間大亂鬥：§73-1決標後30日／土徵§59決標後10日／§104Ⅱ通知後10日。", "low": "", "neg": false, "st": null}, {"n": 4, "stem": "下列有關平均地權條例之規定，何者有誤？", "opts": ["買賣案件申報登錄價格資訊不實者，處新臺幣三萬元以上十五萬元以下罰鍰；價格以外資訊不實者，應先令其限期改正，屆期未改正者，始處新臺幣六千元以上三萬元以下罰鍰", "預售屋或新建成屋收受定金之書面契據，買受人不得轉售與第三人。但配偶、直系血親或二親等內旁系血親間之轉售，不在此限", "預售屋買受人有中央主管機關公告之情形，並經直轄市、縣（市）主管機關核准者，得讓與或轉售買賣契約，但全國每二年以一戶（棟）為限", "與他人通謀或為虛偽交易，營造不動產交易活絡之表象者，處新臺幣一百萬元以上五千萬元以下罰鍰，其有不動產交易者，按交易戶（棟、筆）處罰"], "ans": "B", "alt": [], "conf": "高", "ch": "C4", "notes": ["✓ 正確。平均地權§81-2：價格不實處3～15萬；價格以外資訊不實→先限期改正，屆期不改才處6千～3萬。", "✗ 錯誤。§47-3對『定金書面契據』只規定買受人不得轉售，並沒有親屬例外。『配偶、直系血親、二親等內旁系血親』的例外是在§47-4（轉售買賣『契約』）。把§47-4的例外搬到§47-3就錯。", "✓ 正確。§47-4Ⅱ：經中央公告＋地方核准的例外讓與，『全國每二年以一戶（棟）為限』。", "✓ 正確。§81-3：虛偽交易營造交易活絡表象，處100萬～5000萬。"], "trap": "§47-3（轉售定金書面契據：無親屬例外）vs §47-4（轉售契約：有親屬例外；『每二年一戶』只套在『公告＋核准』那一類）。", "low": "", "neg": true, "st": null}, {"n": 5, "stem": "依都市計畫法有關主要計畫與細部計畫之規定，下列敘述何者正確？", "opts": ["未發布細部計畫地區，如主要計畫發布已逾二年以上，而能確定建築線或主要公共設施已照主要計畫興建完成者，得由主管建築機關指定建築線，核發建築執照", "主要計畫擬定後，應先送該管政府都市計畫委員會審議，審議完成後再於各該直轄市、縣（市）政府及鄉、鎮、縣轄市公所公開展覽三十天及舉行說明會", "第一期發展地區應於主要計畫發布實施後，最多五年完成細部計畫，並於細部計畫發布後，最多二年完成公共設施", "細部計畫圖比例尺不得小於一千二百分之一；細部計畫擬定後，除與主要計畫合併擬定者外，均由內政部核定實施"], "ans": "A", "alt": [], "conf": "高", "ch": "B2", "notes": ["✓ 正確。都計法§17：未發布細部計畫地區，主要計畫發布已逾2年，且能確定建築線或主要公共設施已興建完成者，得由主管建築機關指定建築線。", "✗ 錯誤。程序是『先』公開展覽30天＋說明會，『再』送審議（都計法§19）；選項順序顛倒。", "✗ 錯誤。數字對調：第一期發展地區，細部計畫是主要計畫發布後『2年』內、公共設施是『5年』內完成。", "✗ 錯誤。比例尺『不得小於1/1200』這半句是對的（都計法§22），但細部計畫除與主要計畫合併擬定者外，是由『縣（市）政府』核定，並非均由內政部。"], "trap": "第一期發展：細部計畫2年／公共設施5年（口訣：先快後慢，計畫2、工程5）。", "low": "", "neg": false, "st": null}, {"n": 6, "stem": "甲、乙、丙、丁、戊五人分別共有A地，登記之應有部分依序為1/2、1/6、1/6、1/12、1/12。甲、乙二人擬依土地法第34條之1規定處分A地，惟丁之住所不明，無法以書面通知。下列敘述正確者有幾項？\n①甲、乙二人之應有部分合計已達三分之二，依法人數不予計算，得依土地法第34條之1第1項規定將A地全部出售予第三人辛\n②若丙亦同意，甲、乙、丙得與相鄰B地所有人庚約定，以A地全部與B地交換所有權；因交換屬有償行為，符合同條處分以有償讓與為限之規定\n③若丙亦同意，甲、乙、丙得依同條規定將A地全部辦理信託登記予某信託業者，或逕行協議分割A地\n④甲、乙等對丁得以公告代替通知；以布告方式為之者，應由村、里長簽證後，公告於A地所在地之村、里辦公處，自布告之日起經二十日發生通知效力；以登報方式為之者，則自最後登載之日起經二十日發生通知效力\n⑤若丙亦同意，甲、乙、丙將A地全部出售予辛時，丁、戊得以出賣之同一條件，共同或單獨優先購買A地全部", "opts": ["1項", "2項", "3項", "4項"], "ans": "B", "alt": [], "conf": "高", "ch": "A3", "notes": ["✗ 錯誤。『逾』2/3人數才不計算：甲乙合計1/2+1/6＝正好2/3，不是『逾』；且人數只有2/5，不過半，不能處分。", "✗ 錯誤。執行要點第3點：處分『以有償讓與為限，不包括信 B3", "notes": ["✗ 錯誤。都計法§45：公共設施用地合計不得少於全部計畫面積『10%』，不是30%。", "✓ 正確。國土計畫法§20：城鄉發展地區第一類＝都市化程度較高、住宅或產業活動高度集中之地區。", "✗ 錯誤。非都市土地使用管制規則§11：遊憩設施開發面積達『5公頃』以上變更為特定專用區，不是10公頃。", "✗ 錯誤。國土計畫法§45：功能分區圖公告期限是『十年內』，不是六年。"], "trap": "都計公設≥10%；遊憩5公頃；功能分區圖10年內公告。", "low": "B 項我引用的是國土計畫法§20第一類的定義，題目措辭較簡略，信心中等。", "neg": false, "st": null}, {"n": 24, "stem": "下列關於區域計畫程序之敘述何者錯誤？", "opts": ["中央主管機關擬定之區域計畫，經中央區域計畫委員會審議後報行政院備案", "縣（市）主管機關擬定者，報中央主管機關核定後，擬定機關應於接到核定公文日起40天內公告實施", "計畫圖說公開展示期間不得少於15日", "區域計畫公告實施後，因應區域建設推行委員會之建議，得隨時檢討變更"], "ans": "C", "alt": [], "conf": "高", "ch": "B1", "notes": ["✓ 正確。區計法§9：中央擬定的區域計畫，經審議後報行政院備案。", "✓ 正確。核定後40天內公告實施。", "✗ 錯誤。計畫圖說公開展示期間不得少於『30日』，不是15日。", "✓ 正確。公告後得因應建設需要隨時檢討變更（§13）。"], "trap": "公開展示≥30日（不是15）；核定後40天內公告。", "low": "", "neg": true, "st": null}, {"n": 25, "stem": "甲所有A地及其上合法建築物，該建築物供甲經營商店使用；土地上另種植多年生農作物。嗣A地及其土地改良物因道路工程遭政府徵收，致甲停止營業。依土地徵收條例規定，下列敘述何者錯誤？", "opts": ["A地之地價補償，應按徵收當期之市價補償", "建築改良物之補償費，應按徵收當時該建築改良物之重建價格估定", "農作改良物被徵收時，如距其孳息成熟時期在一年以內，應按其種植及培育費用，並參酌現值估定", "該建築物原供合法營業使用，如因徵收致營業停止，其營業損失應予補償"], "ans": "C", "alt": [], "conf": "高", "ch": "D2", "notes": ["✓ 正確。土徵§30：土地補償地價，按徵收當期之市價補償。", "✓ 正確。§31：建築改良物按重建價格估定。", "✗ 錯誤。農作改良物距孳息成熟時期在1年以內者，是『按其成熟時之孳息估定』，不是種植培育費用（§31）。", "✓ 正確。§33：合法營業因徵收停業的營業損失應予補償。"], "trap": "農作改良物：成熟期1年內→按成熟時孳息；1年以上→種植培育費用。", "low": "", "neg": true, "st": null}], "E": [{"t": "申論一（25分）", "q": "一、甲股份有限公司（私法人）擬購買一戶登記用途為「住宅」之房屋，作為員工宿舍使用。試問甲公司購買該房屋前，是否有應踐行之程序？甲公司辦竣所有權登記後第三年，擬將該房屋出售予乙並辦理所有權移轉登記，是否可行？（25分）", "parts": [["一、定義", "私法人購屋許可制：為抑制私法人（公司、財團法人等）炒作、囤積住宅，平均地權條例§79-1 對「私法人買受供住宅使用之房屋」採『事前許可＋取得後限制移轉』的管制。（注意：條號是§79-1，不是§79-2。）"], ["二、法條", "①§79-1 前段：私法人買受供住宅使用之房屋，應檢具使用計畫，經中央主管機關（內政部）許可；許可文件有效期限一年；許可條件、用途、使用計畫內容、應備文件及審核程序，授權中央主管機關訂定辦法；中央主管機關公告免經許可之情形，不在此限。\n②§79-1 後段：私法人取得住宅，於登記完畢後五年內，不得辦理移轉、讓與或預告登記；但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。"], ["三、涵攝分析", "（一）購買前程序：甲為股份有限公司，屬私法人；欲購買登記用途為「住宅」之房屋作員工宿舍，屬「供住宅使用之房屋」。除非屬中央主管機關公告免許可之情形，甲公司於購買前應先檢具使用計畫（載明員工宿舍用途、使用方式等），向內政部申請許可，並於許可文件一年有效期限內完成買賣與登記。\n（二）第三年出售：甲辦竣所有權登記後僅第三年，尚未滿五年；出售予乙屬一般買賣，不是強制執行、徵收、法院判決或其他法律規定之移轉，因此不符例外，依§79-1 後段不得辦理移轉登記（亦不得辦理預告登記）。"], ["四、結論", "甲公司購買該房屋前，應先向內政部申請許可（除非屬公告免許可情形）；登記後第三年出售乙不可行，須待登記完畢滿五年，或有法定例外情形，始得辦理移轉。"]], "warn": "私法人購屋許可辦法的細節（許可事由、使用計畫內容、審核期限）以及違反的法律效果（罰則）我未逐條核對；得分核心＝事前許可＋使用計畫＋5年不得移轉＋法定例外。", "short": [["一、定義", "私法人購屋許可制：為防炒作囤積住宅，對私法人買住宅採「事前許可＋取得後限制移轉」（平均地權條例§79-1）。"], ["二、法條", "§79-1 前段：私法人買受供住宅使用之房屋，須檢具使用計畫，經內政部許可（公告免許可者除外）。\n§79-1 後段：登記完畢後5年內不得移轉、讓與或預告登記；例外：強制執行、徵收、法院判決或其他法律規定。"], ["三、涵攝分析", "甲為私法人、買登記為「住宅」之房屋→購買前須先向內政部申請許可。登記後第3年出售乙，是一般買賣，不屬四項例外，未滿5年。"], ["四、結論", "購買前須先申請許可；第3年出售不可行，須滿5年（或有法定例外）。"]], "adv": [["一、定義與立法目的", "私法人購屋管制是「許可制（買之前）＋限制移轉（買之後）」雙重管制，目的在抑制私法人炒作、囤積住宅，保障自住需求（平均地權條例§79-1）。〔條號是§79-1，不是§79-2〕"], ["二、法條", "§79-1 前段：應檢具使用計畫經內政部許可；許可文件有效期限一年；許可條件、使用計畫內容、應備文件、審核程序授權辦法訂定；公告免許可情形除外。\n§79-1 後段：登記完畢後5年內不得移轉、讓與或預告登記；但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。"], ["三、涵攝分析", "（一）主體：股份有限公司屬私法人，適用本條。\n（二）標的：登記用途為「住宅」＝供住宅使用之房屋；作員工宿舍仍是住宅使用，使用計畫須載明此用途與使用方式。\n（三）購買前：先申請許可，並在一年許可有效期內完成買賣與登記，逾期許可失效。\n（四）取得後：5年期間自「登記完畢」起算；期間內連「預告登記」也不得辦理，所以不能用先簽約、先預告登記來綁定買方。\n（五）第3年出售乙：一般買賣、不是四項例外之一，且尚餘2年才屆滿5年，故不得辦理移轉登記。"], ["四、結論與實務提醒", "甲公司購買前應先取得內政部許可（除非屬公告免許可）；第3年出售不可行，最快登記完畢滿5年後始得移轉。\n經紀人實務：受託仲介私法人買住宅，應提醒買方先取得許可；受託出售私法人持有未滿5年之住宅，應先確認是否落入限制期間。\n⚠️待核：違反的法律效果（罰則）與許可辦法細節，我未逐條核對，作答時不必寫。"]], "kw": ["許可", "使用計畫", "5年", "五年", "預告登記", "不得移轉", "不得辦理移轉"], "tch": [["一、定義", "私法人買受供住宅使用之房屋，屬平均地權條例對「私法人購買住宅」的管制：為防止藉購買住宅囤房炒作、影響一般民眾居住權益，原則須先經中央主管機關許可，且取得後五年內限制處分。"], ["二、法條", "（一）購買前程序（平均地權§79-1）：\n１.原則應經許可：私法人買受供住宅使用之房屋，應檢具使用計畫，經中央主管機關（內政部）許可。\n２.例外免經許可：屬中央主管機關公告免經許可之情形者，不在此限。\n３.審核方式：中央主管機關為審核許可案件，得遴聘（派）專家學者、民間團體及相關機關代表，以合議制方式辦理。\n（二）處分限制（§79-1）：私法人取得前項房屋後，於登記完畢後五年內，不得辦理移轉、讓與或預告登記。但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。"], ["三、涵攝分析", "（一）本題甲公司為私法人，擬買受供住宅使用之房屋，購買目的為員工宿舍，不屬中央主管機關公告免經許可之情形，故應檢具使用計畫，經中央主管機關許可；許可文件有效期限為一年。\n（二）甲公司辦竣所有權登記後僅三年，仍在法定五年限制期間內；其欲基於一般買賣將房屋移轉予乙，又無強制執行、徵收、法院判決或其他法律規定之例外情形，原則上不得辦理該房屋之所有權移轉登記。"], ["四、結論", "（一）購買前有應踐行程序：須檢具使用計畫，經中央主管機關（內政部）許可（非公告免許可情形）。（二）登記後第三年不可行：五年內不得辦理移轉、讓與或預告登記，除非符合強制執行、徵收、法院判決或其他法律規定之例外。"]], "hot": ["許可", "5年", "五年"]}, {"t": "申論二（25分）", "q": "二、甲所有A、B兩筆土地，均經政府為興建道路工程公告徵收並發給補償費。徵收前，A地設定抵押權予丙銀行；B地則出租予丁耕作，訂有耕地租約。嗣主管機關查明，A地係因作業錯誤而誤列入徵收範圍，實際上並不在道路工程用地範圍內；B地原確屬道路工程所需土地，但徵收後因工程變更設計，已不再位於工程用地範圍內。丙、丁並主張，如A、B地返還甲，其原抵押權及耕地租約亦應一併回復。試依土地徵收條例及行政法一般原則規定，說明A、B兩筆土地應如何處理、撤銷與廢止徵收之效力有何不同，以及土地發還後丙、丁之主張是否有理由。（25分）", "parts": [["一、定義", "撤銷徵收：原徵收處分自始違法，事後以行政處分消滅其效力；廢止徵收：原徵收處分合法，因事後情事變更等原因，向將來消滅其效力。兩者都規定在土地徵收條例§49。"], ["二、法條", "①土徵§49Ⅰ（應撤銷）：①因作業錯誤，致原徵收土地不在工程用地範圍內；②公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發（但以聯合開發方式開發而土地所有權人不願參與者，不在此限）。\n②土徵§49Ⅱ（應廢止）：①因工程變更設計，致不在工程用地範圍內；②依計畫開始使用前，興辦事業改變、事業計畫經註銷、開發方式或取得方式改變；③已開始使用未完成，因情事變更，致全部或一部已無徵收必要。\n③土徵§50：由需用土地人向中央主管機關申請；需用土地人未申請者，原所有權人得請求直轄市、縣（市）主管機關會同審查後處理；不服函復者，於送達30日內向中央主管機關請求。\n④土徵§51：中央核准後通知地方主管機關，應公告30日並通知原所有權人於一定期間（不得少於六個月）內繳清應繳價額（徵收補償地價＋地價加成補償＋遷移費；已依§34Ⅰ遷移者免遷移費）才發還土地；未繳清不發還，且不得再依§9申請收回。\n⑤土徵§52：撤銷或廢止後，徵收前原設定之他項權利及耕地租約「不予回復」（例外：依§42於抵價地設定之抵押權或典權准予回復）。\n⑥行政程序法§118：違法處分經撤銷後溯及既往失效；§125：合法處分經廢止後向將來失效。"], ["三、涵攝分析", "（一）A地：因作業錯誤誤列入徵收範圍，符合土徵§49Ⅰ第1款，屬「撤銷徵收」，原徵收處分自始違法，學理上溯及既往失效。\n（二）B地：原徵收合法，因工程變更設計而不在工程用地範圍內，符合§49Ⅱ第1款，屬「廢止徵收」，向將來失效，徵收之前的合法狀態不受推翻。\n（三）兩者效力差異：撤銷＝溯及既往（自始無效）；廢止＝向將來失效。但在土地發還實務上，兩者程序相同：由需用土地人申請、通知甲於期限（不少於6個月）內繳清補償地價、加成補償及遷移費，才發還土地（§50、§51）。\n（四）丙、丁主張：依§52，撤銷或廢止徵收後，徵收前原設定的他項權利（抵押權）及耕地租約不予回復；本案A、B地均非抵價地，無例外。故丙之抵押權、丁之耕地租約都不因發還而回復。"], ["四、結論", "A地為撤銷徵收、B地為廢止徵收，均由需用土地人申請，甲繳還補償費等價額後發還土地；撤銷自始失效、廢止向將來失效；丙、丁主張回復抵押權及耕地租約，依§52無理由。"]], "warn": "「撤銷／廢止的溯及效力」土徵§49未明文，須搭配行政程序法§118、§125；§49～§52 已依全國法規資料庫條文整理對照（10-15，經 LawPlayer 轉載，逐字待核）；丙之抵押權雖不回復，丙對原補償費之權利保障（§51Ⅴ：補償地價中含他項權利人、承租人原應受領價金）可作補充。", "short": [["一、定義", "撤銷徵收＝原處分自始違法而消滅；廢止徵收＝原處分合法，因事後情事變更向將來失效（土地徵收條例§49）。"], ["二、法條", "§49Ⅰ（撤銷：①作業錯誤②徵收時都市計畫已定聯合開發／市地重劃等）；§49Ⅱ（廢止：①工程變更設計②興辦事業改變、計畫註銷等③情事變更已無必要）；§50（需用土地人申請，所有權人可請求）；§51（公告30日；不少於6個月繳清補償地價＋加成補償＋遷移費；未繳清不發還）；§52（原他項權利、耕地租約不予回復；例外§42抵價地抵押權、典權）。"], ["三、涵攝分析", "A地＝撤銷（作業錯誤）；B地＝廢止（工程變更設計）。均由需用土地人申請，甲繳清補償地價、加成補償、遷移費後發還。A、B非抵價地，丙抵押權、丁耕地租約依§52不回復。"], ["四、結論", "A地撤銷（溯及既往）、B地廢止（向將來）；兩地均發還甲；丙、丁主張無理由。"]], "adv": [["一、定義與比較架構", "先立比較軸再作答：撤銷＝自始違法，溯及既往失效（行政程序法§118）；廢止＝原處分合法，自廢止時或指定日起向將來失效（行政程序法§125）。土地徵收條例§49 把兩者放在同一條，Ⅰ為撤銷、Ⅱ為廢止。"], ["二、法條", "①土徵§49Ⅰ（應撤銷）：①因作業錯誤，致原徵收土地不在工程用地範圍內；②公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發（但以聯合開發方式開發而土地所有權人不願參與者，不在此限）。\n②土徵§49Ⅱ（應廢止）：①因工程變更設計，致不在工程用地範圍內；②依計畫開始使用前，興辦事業改變、事業計畫經註銷、開發方式或取得方式改變；③已開始使用未完成，因情事變更，致全部或一部已無徵收必要。\n③土徵§50：由需用土地人向中央主管機關申請；需用土地人未申請者，原所有權人得請求直轄市、縣（市）主管機關會同審查後處理；不服函復者，於送達30日內向中央主管機關請求。\n④土徵§51：中央核准後通知地方主管機關，應公告30日並通知原所有權人於一定期間（不得少於六個月）內繳清應繳價額（徵收補償地價＋地價加成補償＋遷移費；已依§34Ⅰ遷移者免遷移費）才發還土地；未繳清不發還，且不得再依§9申請收回。\n⑤土徵§52：撤銷或廢止後，徵收前原設定之他項權利及耕地租約「不予回復」（例外：依§42於抵價地設定之抵押權或典權准予回復）。\n⑥行政程序法§118：違法處分經撤銷後溯及既往失效；§125：合法處分經廢止後向將來失效。"], ["三、涵攝分析", "（一）A地：誤列入徵收範圍＝作業錯誤，屬撤銷徵收，自始違法。\n（二）B地：徵收當時合法，後因工程變更設計不在範圍，屬廢止徵收，向將來失效，徵收到廢止前的合法狀態不被推翻。\n（三）比較表：原因（錯誤 vs 事後變更）→溯及力（有 vs 無）→發還程序（同：申請、通知、繳還、發還）→他項權利（同：不回復）。\n（四）丙、丁：A、B地均非抵價地，無§52例外，抵押權與耕地租約不回復。丙就原補償費如何受償屬徵收補償程序問題，本題不問；若要補充，須另核補償費發給與他項權利人之條文（⚠️待核）。"], ["四、結論與陷阱", "A地撤銷、B地廢止，皆經需用土地人申請、甲於期限內繳清後發還；效力差在撤銷溯及、廢止向將來；丙、丁無理由。\n作答陷阱：①§49 款項別把撤銷、廢止寫反；②§52 例外只限抵價地（§42），不是所有他項權利都能回復；③§49 未明文溯及力，須引行政程序法§118、§125。"]], "kw": ["撤銷徵收", "廢止徵收", "溯及既往", "向將來", "不予回復", "作業錯誤", "工程變更設計", "抵價地"], "tch": [["一、定義", "撤銷徵收＝原徵收處分有瑕疵（自始違法），事後消滅其效力；廢止徵收＝原處分合法，因事後情事變更等原因向將來失效（土徵§49）。"], ["二、法條", "①土徵§49Ⅰ（應撤銷）：①因作業錯誤，致原徵收土地不在工程用地範圍內；②公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發（但以聯合開發方式開發而土地所有權人不願參與者，不在此限）。\n②土徵§49Ⅱ（應廢止）：①因工程變更設計，致不在工程用地範圍內；②依計畫開始使用前，興辦事業改變、事業計畫經註銷、開發方式或取得方式改變；③已開始使用未完成，因情事變更，致全部或一部已無徵收必要。\n③土徵§50：由需用土地人向中央主管機關申請；需用土地人未申請者，原所有權人得請求直轄市、縣（市）主管機關會同審查後處理；不服函復者，於送達30日內向中央主管機關請求。\n④土徵§51：中央核准後通知地方主管機關，應公告30日並通知原所有權人於一定期間（不得少於六個月）內繳清應繳價額（徵收補償地價＋地價加成補償＋遷移費；已依§34Ⅰ遷移者免遷移費）才發還土地；未繳清不發還，且不得再依§9申請收回。\n⑤土徵§52：撤銷或廢止後，徵收前原設定之他項權利及耕地租約「不予回復」（例外：依§42於抵價地設定之抵押權或典權准予回復）。\n⑥行政程序法§118：違法處分經撤銷後溯及既往失效；§125：合法處分經廢止後向將來失效。"], ["三、涵攝分析", "（一）判斷：A地因作業錯誤誤列＝§49Ⅰ①撤銷；B地因工程變更設計不在範圍＝§49Ⅱ①廢止。\n（二）程序：需用土地人向中央主管機關申請（§50）→中央核准後地方公告30日、通知甲於不少於6個月內繳清補償地價、地價加成補償及遷移費（§51）→發還土地；未繳清不發還，也不得再依§9申請收回。\n（三）效力：撤銷溯及既往（行政程序法§118）；廢止向將來失效（§125）。\n（四）丙、丁主張：依§52，撤銷或廢止後原設定的抵押權、耕地租約不予回復；本案A、B均非§42抵價地，無例外，主張無理由。"], ["四、結論", "A撤銷、B廢止，均依§50、§51程序繳還應繳價額後發還；丙之抵押權、丁之耕地租約依§52不回復。"]], "hot": ["撤銷徵收", "廢止徵收", "不予回復"]}], "CHN": {"A1": "A1 總則", "A2": "A2 土地登記", "A3": "A3 共有／34-1", "A4": "A4 租賃／優購", "B1": "B1 區計／非都市", "B2": "B2 都市計畫", "B3": "B3 國土計畫", "C2": "C2 市地重劃", "C3": "C3 空地／照價收買", "C4": "C4 申報登錄／預售屋", "D1": "D1 徵收程序", "D2": "D2 徵收補償", "D3": "D3 區段徵收", "D4": "D4 收回權", "E1": "E1 地價稅", "E2": "E2 土地增值稅", "F1": "F1 房屋稅", "G1": "G1 契稅", "H1": "H1 房地合一", "I1": "I1 三七五減租"}, "AVG": {"A1": 1.5, "A2": 3.0, "A3": 1.38, "A4": 1.25, "A5": 0.62, "B1": 1.0, "B2": 1.88, "B3": 0.38, "C1": 0.62, "C2": 0.88, "C3": 0.88, "C4": 1.0, "D1": 0.38, "D2": 1.38, "D3": 1.12, "D4": 1.0, "E1": 1.38, "E2": 1.62, "F1": 1.0, "G1": 1.5, "H1": 1.12, "I1": 0.12}, "quality": ["【老師解答已公布（10-15）】全卷25題僅第15、19題與原答案不同，其餘23題與老師一致；第19題老師答案與現行土徵§9Ⅲ文字不同，已標⚠️待核。", "【題目瑕疵】第22題：B、C 兩個選項都符合現行土徵條例（特定農業區聽證＋抵價地比例），出題疏漏；本卷以 C 為主、B 一併接受。", "【題目瑕疵】第21題：A『保留徵收』在現行土徵條例查無條文，可能是第二個錯誤選項；答案以 D（徵用逾3年應為30日而非60日）為準。", "【已核實】第6題依內政部〈土地法第34條之1執行要點〉（112.8.22修正）原文：②交換所有權明列不含（第3點）、④公告20日（第8點(五)）、⑤同一條件共同或單獨優購（第12點）；正確為④⑤共2項，答案B（2026-10-15 已核）。", "【好題】第3、16、18題：把『起算點、期間、主體』混在一起考，屬典型陷阱題，值得做成錯題本。", "【整體】綜合型長題偏多；徵收條例（D1～D4）合計佔 8 題，超過歷屆平均（約 4～5 題），此卷偏重徵收；A2 土地登記僅 3 題，與歷屆平均（約3題）相當。"], "confuse": ["優購權期間：§73-1 決標後30日／土徵§59 決標後10日／§104Ⅱ（§107準用）通知後10日。", "預售屋：§47-3 定金契據轉售（無親屬例外）vs §47-4 契約轉售（有親屬例外；『每二年一戶』僅限公告＋核准那類）。", "徵收補償起算點：發給15日（公告期滿後）／拒領存專戶3個月／15年歸國庫（自通知送達）／差額3個月（結果確定）。", "公設保留地補償：毗鄰『非』公共設施保留地平均市價；劃設逾25年→優先交換。", "市地重劃：反對→調處修訂計畫書；負擔→受益比例；折價抵付≤45%；抵押權轉載、地上權等視為消滅。", "抵價地：50%原則、經核准不得少於40%、曾辦農地重劃≥45%；一併徵收：公告日起1年內、現金補償。", "收回權（土徵§9）：補償完竣滿3年未使用、5年停止使用；繳還6個月；區段徵收不適用。", "非都市建築用地：甲＝山坡地外農業區、乙＝鄉村區、丙＝森林／山保／風景／山坡地農業區、丁＝工業。", "區域／都市計畫數字：公開展示≥30日、核定後40日公告、縣市60日報／機關90日通知；都計公設≥10%；第一期細部2年、公設5年。", "外國人繼承：登記完畢之日起3年內出售（不是死亡日）。"], "id": "ll_a1", "paper": "土地法規概要"};

 if(mode==="exam"){tmr=setInterval(function(){left--;var e=$("tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000)}
 build();window.scrollTo(0,0)}
function finish(){if(tmr){clearInterval(tmr);tmr=null}finished=true;save();build();tab(3)}
function build(){
 var p=$("p1");p.innerHTML='<div class="bar" id="bar"></div>';
 D.Q.forEach(function(q){
  var c=document.createElement("div");c.className="card";c.id="q"+q.n;
  var show=(mode==="practice"&&revealed[q.n])||finished;if(show)c.classList.add("done");
  var tg='<span class="tag ch">'+(D.CHN[q.ch]||q.ch)+'</span>'+(q.neg?'<span class="tag">問錯誤</span>':'')+(q.conf==="低"?'<span class="tag lo">⚠️信心低</span>':q.conf==="中"?'<span class="tag me">信心中</span>':'');
  c.innerHTML='<div class="qn">第'+q.n+'題'+tg+'</div><div class="stem"></div><div class="res"></div><div class="trap top"></div><div class="hn">點每個選項可展開／收合說明；右上「全部展開」一次看完</div><div class="os"></div><div class="exa"></div><div class="ex"></div>';
  c.querySelector(".stem").textContent=q.stem;
  var os=c.querySelector(".os");

   var b=document.createElement("button");b.className="opt";
   b.innerHTML='<b>('+L[i]+')</b><span class="tx"></span><span class="bg a">正解</span><span class="bg p">你選的</span><span class="arr">▾</span><span class="vd"></span><div class="nt"></div>';

    else{os.querySelectorAll(".opt").forEach(function(x,j){x.classList.toggle("sel",j===i)});bar()}};
   os.appendChild(b)});
  if(show){var pk=ans[q.n],okk=pk!==undefined&&okq(q,pk);if(!okk)c.classList.add("wrong");
   var rs=c.querySelector(".res");rs.textContent=(pk===undefined?"未作答":(okk?"答對了":"答錯了"))+"　正解 "+q.ans+(pk===undefined||okk?"":"（你選 "+pk+"）");rs.className="res"+(okk?" ok":"");
   c.querySelector(".trap.top").textContent="🎯 考試陷阱："+q.trap;
   var ea=c.querySelector(".exa");ea.innerHTML="<h4>逐選項解析</h4>";q.opts.forEach(function(t,j){var d=document.createElement("div");d.textContent="("+L[j]+") "+q.notes[j];ea.appendChild(d)});var tt=document.createElement("div");tt.textContent="🎯 考試陷阱："+q.trap;tt.style.cssText="background:var(--tipbg);border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px";ea.appendChild(tt);
   [].forEach.call(c.querySelectorAll(".opt"),function(o,j){var ch=q.notes[j].charAt(0);o.querySelector(".vd").textContent=(ch==="❌"||ch==="✗"||ch==="×")?"❌":((ch==="✅"||ch==="✓")?"✅":"")});applyOpen(c)}
  var ex=c.querySelector(".ex"),h="";
  h+='<div class="trap">🎯 <b>正解 '+q.ans+(q.alt.length?'（亦接受 '+q.alt.join('、')+'）':'')+'</b>｜考試陷阱：'+esc(q.trap)+'</div>';
  h+=bxTax((q.ch||'').slice(0,2),q.stem+q.opts.join(''),q.stem+q.opts.join('')+q.notes.join(''));
  if(q.st)h+='<div class="sts">'+esc(q.st.join("\n"))+'</div>';
  if(q.low)h+='<div class="low">⚠️ '+esc(q.low)+'</div>';
  if(show&&!okq(q,ans[q.n])&&ans[q.n]!==undefined||show&&ans[q.n]===undefined){
   var cur=errs[q.n]||"";
   h+='<div class="err">錯題歸類：<button data-t="A" class="'+(cur==="A"?"on":"")+'">A 法條混淆</button><button data-t="B" class="'+(cur==="B"?"on":"")+'">B 粗心</button><button data-t="C" class="'+(cur==="C"?"on":"")+'">C 真的不熟</button></div>'}
  ex.innerHTML=h;
  ex.querySelectorAll(".err button").forEach(function(bt){bt.onclick=function(){errs[q.n]=bt.dataset.t;lsSet("bx_mockerr_"+ID,JSON.stringify(errs));ex.querySelectorAll(".err button").forEach(function(x){x.classList.toggle("on",x===bt)})}});
  p.appendChild(c)});
 bar();
 var e=$("p2");e.innerHTML="";
 D.E.forEach(function(x){var c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="qn"></div><div class="stem"></div><div class="vt"><button data-v="short">快寫版</button><button data-v="std" class="on">標準版</button><button data-v="adv">進階版</button><button data-v="tch">曾老師版</button></div><details><summary>展開參考解答</summary><div class="vnote"></div><div class="ans"></div></details><div class="warn"></div>';
  c.querySelector(".qn").textContent=x.t;c.querySelector(".stem").innerHTML=HL(x.q,x.kw,1);
  var a=c.querySelector(".ans"),nt=c.querySelector(".vnote");
  var NT={short:"快寫版：時間不夠或只想抓得分骨架時用，約10分鐘可寫完。",std:"標準版：四段式完整參考解答。",adv:"進階版：補立法目的、比較表、陷阱與經紀人實務，適合讀懂後加深。",tch:"曾老師版：依曾榮耀老師公布的解答要點整理（非逐字抄錄），條文已逐項對照現行法。"};
  function render(v){var parts=v==="short"?x.short:v==="adv"?x.adv:v==="tch"?(x.tch||x.parts):x.parts;a.innerHTML="";nt.innerHTML=NT[v]+' <span class="hlg"><span class="kw">紅粗體＝超級重點</span><span class="kb">綠底＝關鍵詞</span><span class="nm">金底＝數字期間</span><span class="lw">棕粗體＝條號</span></span>';parts.forEach(function(pp){var k=/定義/.test(pp[0])?"def":/法條/.test(pp[0])?"law":/涵攝/.test(pp[0])?"app":"con";var bx=document.createElement("details");bx.className="pbox "+k;var h=document.createElement("summary");h.className="ph";h.textContent=pp[0];bx.appendChild(h);
   pp[1].split("\n").forEach(function(ln){if(!ln.trim())return;var isN=/^(⚠️|經紀人實務|延伸|作答陷阱|〔)/.test(ln);ln.split(/(?<=[。；])|(?=[①②③④⑤⑥⑦⑧⑨⑩])/).forEach(function(sg,si){if(!sg.trim())return;var d=document.createElement("div");d.className="pl"+(/^[（(][一二三四五六七八九十]+[)）]|^[①②③④⑤⑥⑦⑧⑨⑩]|^[１２３４５６７８９]\./.test(sg)?" sb2":"")+(isN?" note":"");d.innerHTML=HL(sg,x.kw,0,x.hot);bx.appendChild(d)})});a.appendChild(bx)});
   var tg=document.createElement("button");tg.type="button";tg.className="tgall";tg.textContent="全部展開";tg.onclick=function(){var bs=a.querySelectorAll("details.pbox"),op=[].some.call(bs,function(z){return !z.open});[].forEach.call(bs,function(z){z.open=op});tg.textContent=op?"全部收合":"全部展開"};a.insertBefore(tg,a.firstChild);c.querySelectorAll(".vt button").forEach(function(bt){bt.classList.toggle("on",bt.dataset.v===v)})}
  c.querySelectorAll(".vt button").forEach(function(bt){bt.onclick=function(){render(bt.dataset.v);c.querySelector("details").open=true}});
  render("std");
  c.querySelector(".warn").textContent="⚠️ "+x.warn;e.appendChild(c)});
 var n=document.createElement("div");n.className="warn";n.textContent="申論為自行練習：目前階段只讀懂架構（定義→法條→涵攝→結論），不必手寫。";e.appendChild(n);
 anal();result()}
function HL(t,kws,q,hot){var s=String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");var ks=(kws||[]).concat(q?["試問","是否","如何","有何不同","有無理由","哪些","何謂"]:[]).sort(function(a,b){return b.length-a.length}).map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")});
var re=new RegExp("("+ks.join("|")+")|((?:土徵|土稅|平均地權條例|房屋稅條例|行政程序法|§)\\s*§?\\d+(?:-\\d+)?(?:[ⅠⅡⅢⅣ]|第?\\d款|[①②③④⑤⑥⑦⑧⑨⑩])*)|(§\\d+(?:-\\d+)?(?:[ⅠⅡⅢⅣ]|[①②③④⑤⑥⑦⑧⑨⑩])*)|(\\d+(?:\\.\\d+)?\\s*(?:%|年|個月|日|戶|倍|公畝|萬元|元))","g");
return s.replace(re,function(m,a,b,c,d){return a?'<span class="'+((hot||[]).indexOf(m)>=0?'kw':(q?'kw':'kb'))+'">'+m+'</span>':(b||c)?'<span class="lw">'+m+'</span>':'<span class="nm">'+m+'</span>'})}
function esc(s){return s}
function anal(){
 var cnt={};D.Q.forEach(function(q){cnt[q.ch]=(cnt[q.ch]||0)+1});
 var h='<div class="card"><div class="qn">配題分析（本卷 vs 16年考點分析）</div><table><tr><th>章節</th><th>本卷題數</th><th>107–114年均</th></tr>';
 Object.keys(cnt).sort().forEach(function(k){h+='<tr><td>'+(D.CHN[k]||k)+'</td><td>'+cnt[k]+'</td><td>'+(D.AVG[k]!==undefined?D.AVG[k].toFixed(2):"—")+'</td></tr>'});
 h+='</table><div class="sub">歷屆均值為「全科25題」中的該章題數；本卷僅含單一科目的一部分章節，只能看相對輕重，不能逐項相減。</div></div>';
 h+='<div class="card"><div class="qn">題目品質評語</div><ul>'+D.quality.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div>';
 h+='<div class="card"><div class="qn">混淆點清單（建議抄進錯題本）</div><ul>'+D.confuse.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div>';
 var low=D.Q.filter(function(q){return q.conf==="低"||q.conf==="中"||q.alt.length}).map(function(q){return q.n+(q.conf==="低"?"⚠️":"")}).join("、");
 h+='<div class="card"><div class="qn">信心較低／有瑕疵之題</div><div>'+low+'<br><span class="sub">⚠️＝信心低。已標「亦接受」者為雙解題。請與補習班老師解答核對後回報，我會更新。</span></div></div>';
 $("p3").innerHTML=h}
function result(){
 var by={};D.Q.forEach(function(q){var o=by[q.ch]||(by[q.ch]={t:0,c:0,a:0});o.t++;if(ans[q.n]!==undefined){o.a++;if(okq(q,ans[q.n]))o.c++}});
 var s=stats(),h='<div class="card"><div class="qn">結果</div><div>已答 '+s.a+'/25，答對 '+s.c+'，單選得分 '+(s.c*2)+'/50'+(mode==="exam"&&!finished?'（交卷後顯示完整解析）':'')+'</div></div>';
 h+='<div class="card"><div class="qn">分篇答對率</div><table><tr><th>章節</th><th>答對／題數</th><th>答對率</th></tr>';
 Object.keys(by).sort().forEach(function(k){var o=by[k];h+='<tr><td>'+(D.CHN[k]||k)+'</td><td>'+o.c+'／'+o.t+'</td><td>'+(o.a?Math.round(o.c*100/o.a)+'%':'—')+'</td></tr>'});
 h+='</table></div>';
 h+='<div class="card"><div class="qn">答案總表</div><div class="key">'+D.Q.map(function(q){return'<span>'+q.n+'：'+q.ans+(q.alt.length?'/'+q.alt.join(''):'')+(q.conf==="低"?' ⚠️':'')+'</span>'}).join("")+'</div></div>';
 var w=D.Q.filter(function(q){return ans[q.n]!==undefined&&!okq(q,ans[q.n])});
 if(w.length){var t={A:0,B:0,C:0,x:0};w.forEach(function(q){t[errs[q.n]||"x"]++});
  h+='<div class="card"><div class="qn">錯題 '+w.length+' 題</div><div>錯題：'+w.map(function(q){return q.n}).join("、")+'<br>歸類 A 法條混淆 '+t.A+'｜B 粗心 '+t.B+'｜C 真的不熟 '+t.C+'｜未歸類 '+t.x+'<br><span class="sub">回「單選」分頁，答完後在每題下方點 A／B／C 歸類；把分篇答對率貼回專案對話，我來更新追蹤表。</span></div></div>'}
 $("p4").innerHTML=h}
