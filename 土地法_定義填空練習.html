<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>/*bxdef*/(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土地法定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#F5F1E6;--surface2:#ECE6D4;--card:#FFFEFA;--ink:#25302C;--muted:#66706A;--line:#DDD6C0;--red:#2F5D50;--pri2:#3E7566;--blue:#3E7566;--gold:#B8782E;--key:#8A5517;--green:#35693F;--onpri:#FFFFFF;--hbg1:#2F5D50;--hbg2:#3E7566;--tint:rgba(47,93,80,.08);--tint2:rgba(47,93,80,.15);--tint3:rgba(47,93,80,.12);--oktint:rgba(53,105,63,.10);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface2:#27302B;--card:#1F2723;--ink:#E7ECE6;--muted:#9AA79F;--line:#34403A;--red:#84C2AE;--pri2:#6FAE9A;--blue:#84C2AE;--gold:#E0B070;--key:#E0B070;--green:#8FCB93;--onpri:#10201B;--hbg1:#24413A;--hbg2:#2D4F46;--tint:rgba(132,194,174,.10);--tint2:rgba(132,194,174,.18);--tint3:rgba(132,194,174,.14);--oktint:rgba(143,203,147,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161C19;--surface2:#27302B;--card:#1F2723;--ink:#E7ECE6;--muted:#9AA79F;--line:#34403A;--red:#84C2AE;--pri2:#6FAE9A;--blue:#84C2AE;--gold:#E0B070;--key:#E0B070;--green:#8FCB93;--onpri:#10201B;--hbg1:#24413A;--hbg2:#2D4F46;--tint:rgba(132,194,174,.10);--tint2:rgba(132,194,174,.18);--tint3:rgba(132,194,174,.14);--oktint:rgba(143,203,147,.12);color-scheme:dark}
:root[data-theme="light"]{--bg:#F5F1E6;--surface2:#ECE6D4;--card:#FFFEFA;--ink:#25302C;--muted:#66706A;--line:#DDD6C0;--red:#2F5D50;--pri2:#3E7566;--blue:#3E7566;--gold:#B8782E;--key:#8A5517;--green:#35693F;--onpri:#FFFFFF;--hbg1:#2F5D50;--hbg2:#3E7566;--tint:rgba(47,93,80,.08);--tint2:rgba(47,93,80,.15);--tint3:rgba(47,93,80,.12);--oktint:rgba(53,105,63,.10);color-scheme:light}
/* chapter colour by letter */
[data-g="A"]{--gc:#2F5D50}
[data-g="B"]{--gc:#1B6B73}
[data-g="C"]{--gc:#3E7D32}
[data-g="D"]{--gc:#6B7A1E}
[data-g="E"]{--gc:#1F7A4D}
[data-g="F"]{--gc:#5C8A2E}
[data-g="G"]{--gc:#3C6E5B}
[data-g="H"]{--gc:#0F5E4A}
[data-g="I"]{--gc:#7A8B3A}
[data-g="N"]{--gc:#4F6B45}
[data-g="S"]{--gc:#8A5A2B}
.esl{display:inline-block;font-size:12px;font-weight:700;color:var(--gc,#8A5A2B);background:color-mix(in srgb,var(--gc,#8A5A2B) 12%,transparent);border-radius:6px;padding:1px 7px;margin:6px 6px 2px 0}
.esl.ezj{color:#9a6b12;background:rgba(232,190,90,.22)}
.cp-sep{flex-basis:100%;font-size:12px;font-weight:700;color:#8A5A2B;margin:10px 0 2px;padding-top:8px;border-top:1px dashed currentColor}
.blank-line .esl:first-child{margin-top:0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-g="A"]{--gc:#74B1A0} :root:not([data-theme="light"]) [data-g="B"]{--gc:#5BC2CC} :root:not([data-theme="light"]) [data-g="C"]{--gc:#8DC583} :root:not([data-theme="light"]) [data-g="D"]{--gc:#BCCD64} :root:not([data-theme="light"]) [data-g="E"]{--gc:#65CD9A} :root:not([data-theme="light"]) [data-g="F"]{--gc:#A9CD84} :root:not([data-theme="light"]) [data-g="G"]{--gc:#8AB9A7} :root:not([data-theme="light"]) [data-g="H"]{--gc:#37CFA9} :root:not([data-theme="light"]) [data-g="I"]{--gc:#BFCB93} :root:not([data-theme="light"]) [data-g="N"]{--gc:#9DB594}}
:root[data-theme="dark"] [data-g="A"]{--gc:#74B1A0}
:root[data-theme="dark"] [data-g="B"]{--gc:#5BC2CC}
:root[data-theme="dark"] [data-g="C"]{--gc:#8DC583}
:root[data-theme="dark"] [data-g="D"]{--gc:#BCCD64}
:root[data-theme="dark"] [data-g="E"]{--gc:#65CD9A}
:root[data-theme="dark"] [data-g="F"]{--gc:#A9CD84}
:root[data-theme="dark"] [data-g="G"]{--gc:#8AB9A7}
:root[data-theme="dark"] [data-g="H"]{--gc:#37CFA9}
:root[data-theme="dark"] [data-g="I"]{--gc:#BFCB93}
:root[data-theme="dark"] [data-g="N"]{--gc:#9DB594}
.nav-btn[data-g],.qf-btn[data-g]{border-left:5px solid var(--gc)}
.nav-btn[data-g].on,.qf-btn[data-g].on{background:var(--gc);border-color:var(--gc);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav-btn[data-g].on,:root:not([data-theme="light"]) .qf-btn[data-g].on{color:#10201A}}
:root[data-theme="dark"] .nav-btn[data-g].on,:root[data-theme="dark"] .qf-btn[data-g].on{color:#10201A}
.chapter[data-g] .ch-title{color:var(--gc)}
.chapter[data-g] .prog-fill{background:var(--gc)}
.chapter[data-g] .card{border-left:4px solid var(--gc)}
.qc-chapter[data-g]{color:var(--gc)}
.plain{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--tint);border-left:3px solid var(--pri2);font-size:13.5px}
.plain b{margin-right:6px;color:var(--muted);font-size:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--hbg1),var(--hbg2));color:#fff;padding:24px 20px 20px;text-align:center;color:#fff}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--red);color:var(--onpri);border-color:var(--red)}

/* main */
main{max-width:720px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:0;padding-bottom:0;margin-bottom:12px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--ink);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:var(--tint);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:var(--tint2)}
.blank.revealed{
  color:var(--key);
  background:var(--tint3);
  border-bottom-color:var(--green);
}
.blank .blank-mask{display:inline}
.blank.revealed .blank-mask{display:none}
.blank .blank-val{display:none;color:var(--key)}
.blank.revealed .blank-val{display:inline}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--red);color:var(--onpri)}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:var(--onpri)}
.reveal-all-btn.done{background:var(--green);color:var(--onpri);border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.section-hint{font-size:11px;color:var(--muted);margin-bottom:14px;letter-spacing:.3px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:var(--oktint);border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:var(--key);font-weight:700}
.rtl{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--pri);text-decoration:none;border:1.5px solid var(--pri);border-radius:99px;padding:3px 12px}.rtl:hover{background:var(--tint)}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--red);color:var(--onpri);font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 模式切換 tab */
.mode-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.mode-tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px 0;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .15s}
.mode-tab.on{color:var(--red);border-bottom-color:var(--red);background:transparent}

/* 測驗模式 */
#quiz-mode{display:none;max-width:720px;margin:0 auto;padding:20px 16px 80px}
#quiz-mode.active{display:block}

/* 章節過濾 */
.quiz-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qf-btn{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.qf-btn.on{background:var(--red);color:var(--onpri);border-color:var(--red)}
.qf-all.on{background:var(--ink);border-color:var(--ink)}

/* 題卡 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px 16px;margin-bottom:16px}
.qc-meta{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px}
.qc-chapter{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qc-counter{font-size:11px;color:var(--muted)}
.qc-term{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
  color:var(--red);margin-bottom:14px;text-wrap:balance}
.qc-blank{font-size:14px;line-height:2.4;color:var(--ink);margin-bottom:14px;
  word-break:break-all}
.qc-blank .blank{
  display:inline-block;border-bottom:2px solid var(--red);
  padding:0 3px;color:transparent;background:var(--tint);
  border-radius:3px;vertical-align:bottom;cursor:pointer;user-select:none;
  transition:color .18s,background .18s;font-weight:700;font-size:13.5px}
.qc-blank .blank:hover{background:var(--tint2)}
.qc-blank .blank.revealed{color:var(--key);background:var(--tint3);
  border-bottom-color:var(--green)}
.qc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qc-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  border-radius:8px;border:1.5px solid;cursor:pointer;transition:all .15s}
.qc-btn-reveal{border-color:var(--red);color:var(--red);background:transparent}
.qc-btn-reveal:hover{background:var(--red);color:var(--onpri)}
.qc-btn-all{border-color:var(--green);color:var(--green);background:transparent}
.qc-btn-all:hover{background:var(--green);color:var(--onpri)}
.qc-btn-next{border-color:var(--blue);color:var(--blue);background:transparent}
.qc-btn-next:hover{background:var(--blue);color:var(--onpri)}
.qc-btn-prev{border-color:var(--muted);color:var(--muted);background:transparent}
.qc-btn-prev:hover{background:var(--muted);color:var(--onpri)}
.qc-btn-prev:disabled{opacity:.3;cursor:default}
.qc-btn-prev:disabled:hover{background:transparent;color:var(--muted)}
.qc-answer{display:none;margin-top:10px;padding:10px 14px;
  background:var(--oktint);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85}
.qc-answer.show{display:block}
.qc-answer .key{color:var(--key);font-weight:700}
.qc-answer .src{margin-top:6px;font-size:12px;color:var(--muted)}
.qc-exam-stat{display:none;margin-top:10px;padding:6px 12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px}
.qc-exam-stat.show{display:block}
.qc-exam-stat{text-align:left}
.es-row{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;line-height:1.7}
.es-row+.es-row{margin-top:4px}
.es-k{font-weight:700;color:var(--ink)}
.es-ex{flex-basis:100%;font-size:12.5px;opacity:.85}
.es-lk{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

.qc-exam-stat strong{color:var(--ink)}
/* 主題切換按鈕 */
#theme-btn{position:fixed;top:10px;right:10px;z-index:50;
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.quiz-progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.quiz-done-banner{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.quiz-done-banner .big{font-size:48px;margin-bottom:8px}

/* 口訣 */
.mnemo{margin-top:8px;padding:7px 12px;border-radius:8px;background:var(--tint3);border-left:3px solid var(--green);font-size:14px;color:var(--green);font-weight:700}
.mnemo .mx{color:var(--ink);font-weight:400;font-size:12.5px}
.mnemo .mt{color:var(--muted);font-weight:400;font-size:11.5px}
.tbx-wrap{margin-top:10px;overflow-x:auto}
.tbx{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5;background:var(--card,var(--bg))}
.tbx th{background:var(--tint3);color:var(--muted);font-weight:700;text-align:left;padding:6px 9px;border:1px solid var(--line);white-space:nowrap}
.tbx td{padding:6px 9px;border:1px solid var(--line);vertical-align:top}
.tbx td .key{white-space:nowrap}
.tbx-note{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.7}
.mnemo b{color:var(--muted);font-weight:400;font-size:12px;margin-right:6px}
.cp-actions{display:flex;gap:6px;width:100%;margin-bottom:2px}
.cp-actions button{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.cp-actions .done{margin-left:auto;background:var(--red);border-color:var(--red);color:var(--onpri)}
.nav-btn.on::before,.qf-btn.on::before{content:"✓ "}
.chapter+.chapter{margin-top:30px}
/* 章節收納 */
nav{padding:8px 16px;display:block}
.ch-toggle,.qf-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font:inherit;font-size:14px;font-weight:700;padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.ch-toggle .arr,.qf-toggle .arr{color:var(--red);transition:transform .2s;flex:none}
.ch-toggle[aria-expanded="true"] .arr,.qf-toggle[aria-expanded="true"] .arr{transform:rotate(180deg)}
.ch-toggle small,.qf-toggle small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.ch-panel,.quiz-filter.fold{display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);flex-wrap:wrap;gap:6px;max-height:55vh;overflow-y:auto}
.ch-panel.open,.quiz-filter.fold.open{display:flex}
.quiz-wrap{margin-bottom:14px}
.lawlk{color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-weight:600}
</style>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()" title="切換深淺色">☀️</button>
<header>
  <h1>土地法概要｜定義填空練習</h1>
  <div class="sub">章節練習 + 隨機測驗模式｜定義 194 題・25 章＋申論四段 38 題（另一分類）</div><div style="font-size:11px;opacity:.75;margin-top:6px">內容取自土地法重點筆記（已更正版）；出題次數為關鍵詞比對99–114年題目的估計值</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab on" id="tab-browse" onclick="setMode('browse')">📖 章節瀏覽</button>
  <button class="mode-tab" id="tab-quiz" onclick="setMode('quiz')">🎲 隨機測驗</button>
  <button class="mode-tab" id="tab-essay" onclick="goEssay()">📝 申論四段</button>
</div>

<nav id="nav"></nav>

<main id="main"></main>

<div id="quiz-mode">
  <div class="quiz-wrap"><button class="qf-toggle" id="qfToggle" aria-expanded="false" onclick="toggleQf()"><span><span id="qfLabel">篩選：全部章節</span><small>點開可只練單一章節</small></span><span class="arr">▾</span></button><div class="quiz-filter fold" id="quiz-filter"></div></div>
  <div class="quiz-progress" id="quiz-progress"></div>
  <div id="quiz-card-area"></div>
</div>

<!--bxfab-->
<style>
#bxfab{--fp:#2F5D50;--fs:#FFFEFA;--fo:#FFFFFF;--fl:#DDD6C0;position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:60}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #bxfab{--fp:#84C2AE;--fs:#1F2723;--fo:#10201B;--fl:#34403A}}
:root[data-theme="dark"] #bxfab{--fp:#84C2AE;--fs:#1F2723;--fo:#10201B;--fl:#34403A}
#bxfab>*{pointer-events:auto}
#bxfab .bx-up{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--fs);color:var(--fp);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;opacity:.4;transition:opacity .25s}
#bxfab .bx-up.act{opacity:1}
#bxfab .bx-up .rg{position:absolute;inset:0;width:100%;height:100%}
#bxfab .bx-up .rg circle{fill:none;stroke-width:3}
#bxfab .bx-up .rg .t{stroke:var(--fl)}#bxfab .bx-up .rg .p{stroke:var(--fp);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .1s}
#bxfab svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative}
#bxfab .bx-hub{width:40px;height:40px;border-radius:50%;background:var(--fp);color:var(--fo);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);text-decoration:none}

const LAWPC={'土地法':'D0060001','平均地權條例':'D0060009','土地徵收條例':'D0060058','三七五減租條例':'D0060008','三七五':'D0060008','都市計畫法':'D0070001','都計法':'D0070001','區域計畫法':'D0070030','區計':'D0070030','土地稅法':'G0340096','土稅':'G0340096','房屋稅條例':'G0340102','契稅條例':'G0340105','所得稅法':'G0340003','民法':'B0000001'};
const LAWKEYS=Object.keys(LAWPC).sort(function(a,b){return b.length-a.length});
function srcHtml(t){var cur=null;return String(t).replace(/([一-龥]*)§(\d+(?:-\d+)?)/g,function(m,nm,no){if(nm){cur=null;for(var i=0;i<LAWKEYS.length;i++){if(nm.slice(-LAWKEYS[i].length)===LAWKEYS[i]){cur=LAWPC[LAWKEYS[i]];break}}}
if(!cur)return m;return nm+'<a class="lawlk" target="_blank" rel="noopener" href="https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode='+cur+'&flno='+no+'">§'+no+'</a>'})}
function mnoHtml(t){return String(t).replace(/〔[^〕]*〕/g,function(x){return '<span class="mt">'+x+'</span>'}).replace(/（[^）]*）/g,function(x){return '<span class="mx">'+x+'</span>'})}
function examStat(c){

    const ex=(c.mcx&&c.mcx.length)?'<div class="es-ex">例：'+c.mcx.map(x=>{const [y,n]=x.split('-');return y+'年第'+n+'題';}).join('、')+'</div>':'';

  }
  if((c.essay||0)>0){
    const lk=(c.esx||[]).map(id=>{const [y,q]=id.split('-');return '<a class="es-lk" target="_blank" rel="noopener" href="土地法_申論題分類總覽.html#q-'+id+'">'+y+'年申論第'+q+'題 &#8599;</a>';}).join('、');
    rows.push('<div class="es-row"><span class="es-k">申論</span><span>考過 <strong>'+c.essay+'</strong> 次：'+lk+'</span></div>');
  }
  if((c.prl||[]).length){

  }
  return rows.length?rows.join(''):'尚無歷屆出題紀錄';
}


// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val">${ans}</span></span>`;
  });
  return html;
}

  // 顯示考試出題紀錄
  const bstat = document.getElementById('bstat-'+key);
  if(bstat) bstat.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  try{BXREP.fillMark(key)}catch(e){}
  const btn = document.getElementById('rb-'+key);
  if(btn){ btn.textContent='✓ 完成'; btn.classList.add('done'); }
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 更新進度
  const done = Object.keys(cardDone).filter(k=>k.startsWith(chId+'-')&&cardDone[k]).length;
  const pct = Math.round(done/total*100);
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = pct+'%';
  if(pt) pt.textContent = done+' / '+total;
}

// 載入時還原已確認的題目（bx-fill：章節瀏覽與隨機測驗共用）
(function(){
  var f={};try{f=JSON.parse(localStorage.getItem('bx-fill')||'{}')||{}}catch(e){}
  Object.keys(f).forEach(function(k){
    if(!(k in cardDone))return; cardDone[k]=true;
    var b=document.getElementById('rb-'+k);if(b){b.textContent='✓ 完成';b.classList.add('done')}
  });
  DATA.forEach(function(ch){
    var n=Object.keys(cardDone).filter(function(k){return k.indexOf(ch.id+'-')===0&&cardDone[k]}).length,t=ch.cards.length;
    var pf=document.getElementById('pf-'+ch.id),pt=document.getElementById('pt-'+ch.id);
    if(pf)pf.style.width=Math.round(n/t*100)+'%';if(pt)pt.textContent=n+' / '+t;
  });
})();

function applyCh(){
  document.querySelectorAll('.chapter').forEach(c=>c.classList.toggle('active',selCh.has(c.id.slice(3))));
  document.querySelectorAll('.nav-btn[data-id]').forEach(b=>b.classList.toggle('on',selCh.has(b.dataset.id)));
  const ids=DATA.filter(c=>selCh.has(c.id)).map(c=>c.id);
  document.getElementById('chLabel').textContent=ids.length===DATA.length?'章節：全部 '+DATA.length+' 章':(ids.length===1?'章節：'+DATA.find(c=>c.id===ids[0]).label:'章節：'+ids.join('、')+'（'+ids.length+' 章）');
}
function toggleCh(id){
  if(selCh.has(id)){if(selCh.size>1)selCh.delete(id)}else selCh.add(id);
  applyCh();
}
function goEssay(){setMode('browse');selCh.clear();DATA.forEach(c=>{if(c.id[0]==='S')selCh.add(c.id)});applyCh();document.getElementById('tab-browse').classList.remove('on');document.getElementById('tab-essay').classList.add('on')}
function selAllCh(){DATA.forEach(c=>selCh.add(c.id));applyCh()}
function selOnlyFirst(){const f=[...selCh][0];selCh.clear();selCh.add(f);applyCh()}

// ===測驗模式===
let quizPool = [];        // 所有題目扁平化
let quizQueue = [];       // 本輪隨機排列
let quizIdx = 0;
let quizFilter = 'ALL';   // 'ALL' 或 chapter id

function setMode(mode) {
  const browse = document.getElementById('main');
  const nav = document.getElementById('nav');
  const quizEl = document.getElementById('quiz-mode');
  const tabB = document.getElementById('tab-browse');
  const tabQ = document.getElementById('tab-quiz');
  if (mode === 'browse') {
    browse.style.display = ''; nav.style.display = '';
    quizEl.classList.remove('active');
    tabB.classList.add('on'); tabQ.classList.remove('on'); document.getElementById('tab-essay').classList.remove('on');
  } else {
    browse.style.display = 'none'; nav.style.display = 'none';
    quizEl.classList.add('active');
    tabB.classList.remove('on'); tabQ.classList.add('on'); document.getElementById('tab-essay').classList.remove('on');
    initQuiz();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach((c, ci) => {
        quizPool.push({ key: ch.id + '-' + ci, chId: ch.id, chLabel: ch.label, term: c.term, blank: c.blank, answer: c.answer, src: c.src, mnemonic: c.mnemonic||'', table: c.table||'', plain: c.plain||'', rate: c.rate||'', mc: c.mc||0, essay: c.essay||0, mcx: c.mcx||[], esx: c.esx||[], prl: c.prl||[] });
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const acts=document.createElement('div');acts.className='cp-actions';
    acts.innerHTML='<button type="button" onclick="qfAll()">全部章節</button><button type="button" class="done" onclick="toggleQf()">完成 ✓</button>';
    filterEl.appendChild(acts);
    DATA.forEach(ch => {
      if(ch.id==='S1'){const sp=document.createElement('div');sp.className='cp-sep';sp.textContent='📝 申論四段填空（「全部章節」不含，需另選）';filterEl.appendChild(sp)}
      const btn = document.createElement('button');
      btn.className = 'qf-btn'; btn.dataset.g = ch.id[0];
      btn.dataset.id = ch.id;
      btn.textContent = ch.label;
      btn.onclick = () => toggleQfCh(ch.id);
      filterEl.appendChild(btn);
    });
  }
  startQuizRound();
}

const selQ = new Set(); // 空＝全部章節
function qfLabelUpdate(){
  const ids=DATA.filter(c=>selQ.has(c.id)).map(c=>c.id);
  document.getElementById('qfLabel').textContent=ids.length?'篩選：'+(ids.length===1?DATA.find(c=>c.id===ids[0]).label:ids.join('、')+'（'+ids.length+' 章）'):'篩選：全部章節';
  document.querySelectorAll('.qf-btn').forEach(b=>b.classList.toggle('on',selQ.has(b.dataset.id)));
}
function toggleQf(){const f=document.getElementById('quiz-filter');const o=f.classList.toggle('open');document.getElementById('qfToggle').setAttribute('aria-expanded',o?'true':'false')}
function toggleQfCh(id){selQ.has(id)?selQ.delete(id):selQ.add(id);qfLabelUpdate();startQuizRound()}
function qfAll(){selQ.clear();qfLabelUpdate();startQuizRound()}

function startQuizRound() {
  const pool = selQ.size ? quizPool.filter(c => selQ.has(c.chId)) : quizPool.filter(c => c.chId[0] !== 'S');
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

let kbHint = true; try { kbHint = localStorage.getItem('bx-fill-kb') !== '1'; } catch (e) {}
function hideKb() { kbHint = false; try { localStorage.setItem('bx-fill-kb', '1'); } catch (e) {} document.querySelectorAll('.qc-kb').forEach(e => e.remove()); }

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    area.innerHTML = `<div class="quiz-done-banner"><div class="big">🎉</div>本輪 ${quizQueue.length} 題全部完成！<br><br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(c.answer)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  const qid = 'q' + quizIdx;
  const builtBlank = c.blank.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const plainAns = ans.replace(/<[^>]+>/g, '');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    const idx = ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-qid="${qid}" onclick="toggleQBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span></span>`;
  });

  const statHtml = examStat(c);

  area.innerHTML = `
    <div class="quiz-card">
      <div class="qc-meta">
        <span class="qc-chapter" data-g="${c.chId[0]}">${c.chLabel}</span>
        <span class="qc-counter">${quizIdx + 1} / ${quizQueue.length}</span>
      </div>
      <div class="qc-term">${c.term}</div>
      <div class="qc-blank" id="qblank-${qid}">${builtBlank}</div>
      ${kbHint ? '<div class="qc-kb" style="font-size:12px;color:var(--muted,#888);text-align:center;margin:6px 0">⌨ 空白／Enter 顯示｜← → 換題 <a href="#" onclick="hideKb();return false" style="margin-left:6px">知道了</a></div>' : ''}
      <div class="qc-btns">
        <button class="qc-btn qc-btn-prev" id="qbtn-prev-${qid}" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled' : ''}>← 上一題</button>
        <button class="qc-btn qc-btn-reveal" id="qbtn-reveal-${qid}" onclick="revealOneQuizBlank('${qid}')">顯示一個 ▶</button>
        <button class="qc-btn qc-btn-all" onclick="revealAllQuizBlanks('${qid}')">全部顯示</button>
        <button class="qc-btn qc-btn-next" onclick="nextQuiz()">下一題 →</button>
      </div>
      <div class="qc-answer" id="qans-${qid}">
        ${ansExtra(c)?`<div>${c.answer}</div>`:''}
        ${c.mnemonic?`<div class="mnemo"><b>口訣</b>${mnoHtml(c.mnemonic)}</div>`:''}
        ${c.plain?`<div class="plain"><b>💡 白話</b>${c.plain}</div>`:''}
        ${c.table||''}
        ${c.rate?`<a class="rtl" target="_blank" rel="noopener" href="土地法_稅率總表.html#${c.rate}">💰 看稅務總表（${RATE_LBL[c.rate]}）→</a>`:''}
        <div class="src">📌 ${srcHtml(c.src)}</div>
      </div>
      <div class="qc-exam-stat" id="qstat-${qid}">${statHtml}</div>
    </div>`;
}

function toggleQBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val = el.querySelector('.blank-val');
  if (val.style.display !== 'none') {
    val.style.display = 'none'; mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = ''; mask.style.display = 'none';
    el.classList.add('revealed');
    if (!document.querySelector('#quiz-card-area .blank:not(.revealed)')) quizMarkDone();
  }
}

function revealOneQuizBlank(qid) {
  const blanks = document.querySelectorAll(`#qblank-${qid} .blank`);
  for (const b of blanks) {
    if (!b.classList.contains('revealed')) {
      b.querySelector('.blank-mask').style.display = 'none';
      b.querySelector('.blank-val').style.display = '';
      b.classList.add('revealed');
      break;
    }
  }
  // 如果顯示完最後一個，自動全顯示並改按鈕
  const remaining = document.querySelectorAll(`#qblank-${qid} .blank:not(.revealed)`);
  if (remaining.length === 0) {
    revealAllQuizBlanks(qid);
    const revBtn = document.getElementById('qbtn-reveal-' + qid);
    if (revBtn) {
      revBtn.textContent = '下一題 →';
      revBtn.className = 'qc-btn qc-btn-next';
      revBtn.onclick = () => nextQuiz();
    }
  }
}

function revealAllQuizBlanks(qid) {
  document.querySelectorAll(`#qblank-${qid} .blank`).forEach(b => {
    b.querySelector('.blank-mask').style.display = 'none';
    b.querySelector('.blank-val').style.display = '';
    b.classList.add('revealed');
  });
  quizMarkDone();
  const ans = document.getElementById('qans-' + qid);
  if (ans) ans.classList.add('show');
  const stat = document.getElementById('qstat-' + qid);
  if (stat) stat.classList.add('show');
}

// 隨機測驗：這題的空格全部顯示過＝記為「已確認」（與章節瀏覽共用 bx-fill 紀錄，進度頁的 x/183 會一起更新）
function quizMarkDone() {
  const c = quizQueue[quizIdx];
  if (!c || !c.key) return;
  try { BXREP.fillMark(c.key); } catch (e) {}
  if (!cardDone[c.key]) {
    cardDone[c.key] = true;
    const total = DATA.find(x => x.id === c.chId).cards.length;
    const done = Object.keys(cardDone).filter(k => k.startsWith(c.chId + '-') && cardDone[k]).length;
    const pf = document.getElementById('pf-' + c.chId), pt = document.getElementById('pt-' + c.chId);
    if (pf) pf.style.width = Math.round(done / total * 100) + '%';
    if (pt) pt.textContent = done + ' / ' + total;
    const btn = document.getElementById('rb-' + c.key);
    if (btn) { btn.textContent = '✓ 完成'; btn.classList.add('done'); }
  }
}

function nextQuiz() {
  quizIdx++;
  renderQuizCard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function prevQuiz() {
  if (quizIdx > 0) {
    quizIdx--;
    renderQuizCard();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}


// ===隨機測驗鍵盤操作：空白鍵／Enter＝顯示一個（全部顯示後＝下一題）、← 上一題、→ 下一題 ===
(function(){
  function active(){var q=document.getElementById('quiz-mode');return q&&q.classList.contains('active')}
  function onKey(e,up){
    if(!active()||e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key,t=e.target,tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    if(k!==' '&&k!=='Enter'&&k!=='ArrowLeft'&&k!=='ArrowRight')return;
    e.preventDefault();
    if(up||e.repeat)return;
    if(document.activeElement&&document.activeElement!==document.body&&document.activeElement.blur)document.activeElement.blur();
    if(k==='ArrowLeft'){prevQuiz();return}
    if(k==='ArrowRight'){if(quizIdx<quizQueue.length)nextQuiz();return}
    if(quizIdx>=quizQueue.length){startQuizRound();return}
    var qid='q'+quizIdx;
    if(document.querySelectorAll('#qblank-'+qid+' .blank:not(.revealed)').length===0)nextQuiz();
    else revealOneQuizBlank(qid);
  }
  document.addEventListener('keydown',function(e){onKey(e,false)});
  document.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')onKey(e,true)});
})();

// ===主題切換===
function updateThemeBtn(theme) {
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  updateThemeBtn(next);
  try { localStorage.setItem('bx-theme', next); } catch(e) {}
}
(function(){
  try {
    const saved = localStorage.getItem('bx-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    updateThemeBtn(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch(e) {}
})();
</script>
