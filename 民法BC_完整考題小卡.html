<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民法概要｜歷屆考題小卡（B+C・債編完整版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F8F3E9;--paper-deep:#EFE6D5;--ink:#2A2722;--ink-soft:#7A7165;--rule:#DED1B9;--stamp:#A8402B;--gold:#BC8A2E;--green:#5C7A4A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:radial-gradient(circle at 12% 8%,rgba(188,138,46,.06),transparent 40%),radial-gradient(circle at 90% 95%,rgba(168,64,43,.05),transparent 45%),var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;}
.wrap{width:100%;max-width:560px;}
header{text-align:center;margin-bottom:14px;}
.case-tag{display:inline-flex;align-items:center;gap:6px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--stamp);border:1px solid var(--stamp);border-radius:999px;padding:3px 12px;margin-bottom:10px;}
h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;letter-spacing:.04em;line-height:1.5;}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:.06em;margin-top:4px;font-family:'Noto Sans TC',sans-serif;}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 6px;}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft);cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;}
.chip.active{color:#fff;border-color:transparent;}
.filter-row{display:flex;justify-content:center;margin-bottom:8px;}
.filter-row .chip{border-color:var(--ink);color:var(--ink);font-weight:700;font-size:12px;padding:5px 12px;}
.filter-row .chip.active{background:var(--ink);color:#fff;}
.progress{text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px;}
.progress b{color:var(--ink);font-size:15px;}
.progress-bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 auto 18px;max-width:200px;}
.progress-fill{height:100%;background:var(--stamp);transition:width .25s ease;}
.scene{perspective:1800px;width:100%;}
.card{position:relative;width:100%;min-height:540px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--rule);background:#fff;display:flex;flex-direction:column;padding:20px;box-shadow:0 4px 18px rgba(42,39,34,.07);overflow-y:auto;}
.face.back{transform:rotateY(180deg);background:var(--paper-deep);}
.face.back{border-left:6px solid var(--cat-color,var(--stamp));}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.cat-badge{font-size:11px;font-weight:700;color:#fff;padding:4px 12px;border-radius:999px;letter-spacing:.06em;font-family:'Noto Serif TC',serif;}
.year-badge{font-size:11px;font-weight:700;color:var(--ink-soft);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-family:'Noto Serif TC',serif;}
.mastery-badge{font-size:18px;line-height:1;}
.q-text{font-size:14px;line-height:1.8;margin-bottom:14px;font-weight:500;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;gap:8px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--rule);background:#fff;font-size:13px;line-height:1.6;cursor:pointer;transition:all .15s ease;}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--stamp);background:#FBEAE6;}
.opt .letter{font-family:'Noto Serif TC',serif;font-weight:900;flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;}
.hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;letter-spacing:.1em;font-family:'Noto Serif TC',serif;}
.answer-banner{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Noto Serif TC',serif;font-weight:900;font-size:15px;padding:10px;border-radius:8px;margin-bottom:12px;}
.answer-banner.correct{background:#EFF4EC;color:var(--green);border:1.5px solid var(--green);}
.answer-banner.wrong{background:#FBEAE6;color:var(--stamp);border:1.5px solid var(--stamp);}
.exp-list{display:flex;flex-direction:column;gap:8px;}
.exp-item{padding:9px 10px;border-radius:8px;font-size:12.5px;line-height:1.75;border:1.5px solid var(--rule);background:#fff;}
.exp-item.right{border-color:var(--green);background:#EFF4EC;}
.exp-item .exp-head{font-weight:900;font-family:'Noto Serif TC',serif;margin-bottom:3px;}
.exp-item.right .exp-head{color:var(--green);}
.exp-item:not(.right) .exp-head{color:var(--stamp);}
.extra-box{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.75;}
.trap-box{background:#FBF1E6;border:1.5px solid var(--gold);}
.trap-box .extra-head{color:var(--gold);font-weight:900;font-family:'Noto Serif TC',serif;margin-bottom:3px;}
.related-box{background:#EEF1F7;border:1.5px solid #5B7A99;}
.related-box .extra-head{color:#5B7A99;font-weight:900;font-family:'Noto Serif TC',serif;margin-bottom:3px;}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;transition:all .15s ease;}
.btn:hover{background:var(--ink);color:#fff;}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.btn.primary:hover{background:#8c3322;}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:#fff;}
.btn.icon{padding:10px 14px;}
.quiz-stats{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
.quiz-stats b{font-family:'Noto Serif TC',serif;}
.quiz-stats .ok{color:var(--green);}
.quiz-stats .ng{color:var(--stamp);}
footer{margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.12em;line-height:2;}
footer .reset{text-decoration:underline;cursor:pointer;color:var(--ink-soft);background:none;border:none;font-size:11px;letter-spacing:.12em;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="case-tag">案號 B+C・債編完整版</div>
    <h1>民法概要 考題小卡
      <span class="sub">99-114年不動產經紀人考題・共 162 題（B1-B6債編總則＋C1-C5各種之債）</span>
    </h1>
  </header>
  <div class="filter-row"><div class="chip active" id="resetBtn">全部分類</div></div>
  <div class="chips" id="chips"></div>
  <div class="progress"><b id="curNum">1</b> / <span id="totalNum">162</span>　<span id="catName"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="top-row">
          <span class="cat-badge" id="badgeFront"></span>
          <span class="year-badge" id="yearFront"></span>
          <span class="mastery-badge" id="badgeMasteryFront"></span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="opt-list" id="optList"></div>
        <div class="hint">點選一個選項　看詳解 ▸</div>
      </div>
      <div class="face back">
        <div class="top-row">
          <span class="cat-badge" id="badgeBack"></span>
          <span class="year-badge" id="yearBack"></span>
          <span class="mastery-badge" id="badgeMasteryBack"></span>
        </div>
        <div class="answer-banner" id="answerBanner"></div>
        <div class="exp-list" id="expList"></div>
        <div class="extra-box trap-box"><div class="extra-head">⚠️ 考試陷阱</div><div id="trapText"></div></div>
        <div class="extra-box related-box"><div class="extra-head">🔗 關聯題目</div><div id="relatedText"></div></div>
        <div class="hint">◂ 點擊卡片　回題目</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn icon" id="markReview">🔄 待複習</button>
    <button class="btn green icon" id="markMastered">✅ 已掌握</button>
  </div>
  <div class="controls">
    <button class="btn icon" id="prevBtn">◂ 上一題</button>
    <button class="btn primary" id="shuffleBtn">🔀 隨機</button>
    <button class="btn icon" id="nextBtn">下一題 ▸</button>
  </div>
  <div class="quiz-stats">
    <span>本輪：<b class="ok" id="quizOk">0</b> 對　<b class="ng" id="quizNg">0</b> 錯</span>
    <span style="cursor:pointer;text-decoration:underline;" id="resetQuiz">重新測驗</span>
  </div>
  <div class="quiz-stats">
    <span>累積：已作答 <b id="totalAttempts">0</b> 題次・正確率 <b id="overallAcc">—</b>・已掌握 <b id="masteredCount">0</b>/<b id="totalCards">0</b></span>
  </div>
  <footer>不動產經紀人考試・民法概要｜每題附A-D逐選項詳解＋考試陷阱提醒＋關聯題目<br>
    v1.0　2026-06-22　B+C 債編完整版 119 題<br>
    <button class="reset" id="resetMastery">清除所有「已掌握」標記</button>
  </footer>
</div>
<script>
const CARDS=[{"id": "BC99-6", "cat": "B2債務不履行", "year": "99年第6題", "q": "甲醫師對於急症患者拒絕醫療，違反契約法上的何種義務？", "opts": ["次給付義務", "強制締約義務", "附隨義務", "從給付義務"], "correct": 1, "exps": ["次給付義務是原給付不能、遲延等時之替代或補充義務。", "醫師不得無故拒絕急救，醫師法§21 課以救治義務，屬法定強制締約義務，違反即違反強制締約義務。", "附隨義務（§148Ⅱ 誠信）是契約成立後之保護、通知等義務。", "從給付義務是為使主給付完全實現所附之輔助義務。"], "trap": "契約尚未成立就先有義務：強制締約（醫師、公用事業）；契約已成立才談附隨、從給付。", "related": ""}, {"id": "BC99-9", "cat": "B1債之發生與消滅", "year": "99年第9題", "q": "下列何種情形，係行使形成權之行為？", "opts": ["贈與人交付贈與物", "共有人出賣應有部分", "受僱人依法提出辭呈", "買賣雙方合意解除契約"], "correct": 2, "exps": ["交付贈與物係履行契約的「事實行為」，不是形成權行使（形成權是單方意思表示使法律關係產生/變更/消滅）。", "共有人出賣應有部分屬正常財產處分行為（契約），並非單方形成法律關係。", "受僱人提出辭呈是「單方意思表示使勞動契約消滅」，典型形成權行使，正確。形成權例：撤銷、解除、辭職、終止、抵銷。", "合意解除需雙方同意，屬雙方行為（合意契約），非單方形成權。"], "trap": "", "related": ""}, {"id": "BC99-11", "cat": "C1買賣", "year": "99年第11題", "q": "甲欲購買乙所有房屋 1 棟，經數次與乙磋商之後，雙方同意該屋以 500 萬元成交，並詳細約定付款及交屋、移轉所有權方式，為求慎重並由丙丁 2 人擔任見證人，且言明為免日後爭議，應將約定內容寫成契約書。嗣後因乙反悔，結果連契約書都無法完成。則下列敘述何者正確？", "opts": ["因為無法完成契約書，因此甲乙之契約不成立", "甲如果已經給付部分價金，應以不當得利請求返還", "甲如能證明與乙已有訂立契約之合意，仍得請求乙履行", "甲為了使乙履行契約，應先請求乙完成契約書"], "correct": 2, "exps": ["§166 約定須用書面者，未完成前僅推定契約不成立，並非當然不成立。", "甲能證明契約已成立，則價金給付有債之原因，不是不當得利。", "§166 推定可被推翻，甲如證明雙方已達成合意，仍得請求履行。", "買賣為諾成契約（§345），無須先完成契約書才可請求履行。"], "trap": "§166：約定方式→推定未成立，可舉反證推翻。陷阱：把「推定」當成「確定」。", "related": ""}, {"id": "BC99-13", "cat": "C4其他各種之債", "year": "99年第13題", "q": "甲男與乙女為男女朋友關係，甲同意將其名下之豪宅贈與乙，以下之敘述何者錯誤？", "opts": ["甲在未移轉該屋之所有權給乙之前，隨時可以向乙表示反悔，撤銷贈與", "贈與為單獨行為", "甲在未移轉房屋所有權給乙之前，因為電線走火將該屋燒毀時，除非甲有故意重大過失，否則無庸負給付不能之責任", "甲移轉該屋之所有權給乙，乙搬入該屋之後，即使發現該屋漏水嚴重，原則上亦無法請求甲修繕"], "correct": 1, "exps": ["§408 I：贈與物權利未移轉前贈與人得撤銷，但立有字據或履行道德義務者不得撤銷，本題未見字據，情境成立。", "贈與須一方無償給與、他方允受（§406），為契約（雙方行為），不是單獨行為。", "§410：贈與人僅就故意或重大過失對受贈人負給付不能責任，電線走火非故意重大過失者無須負責。", "§411：贈與物有瑕疵贈與人原則上不負擔保責任（故意不告知或保證無瑕疵例外），故乙原則上無法請求修繕。"], "trap": "白話：贈與是『你情我願』的契約，不是甲一人說了算。贈與人責任被大幅減輕（故意重大過失才負責）。陷阱：把贈與誤認為單獨行為。", "related": ""}, {"id": "BC99-14", "cat": "B6侵權行為", "year": "99年第14題", "q": "甲受僱於乙客運公司擔任公車司機，某日在依照路線載客途中，因過失撞傷路人丙。下列敘述何者錯誤？", "opts": ["丙可以只向甲請求賠償", "丙可以只向乙請求賠償", "乙賠償之後，原則上可以向甲主張求償", "甲乙對丙負不真正連帶債務之關係"], "correct": 3, "exps": ["受害人丙得依§184Ⅰ 單獨請求甲賠償。", "§188Ⅰ 僱用人乙與受僱人甲連帶負責，丙得單向乙請求（§273）。", "§188Ⅲ 僱用人賠償後對受僱人有求償權。", "§188Ⅰ 明文規定僱用人與行為人「連帶」負賠償責任，為連帶債務，非不真正連帶。"], "trap": "僱用人責任（§188）：連帶；賠償後可向受僱人求償（§188Ⅲ）。陷阱：看到僱用人責任就想到「不真正連帶」。", "related": ""}, {"id": "BC99-15", "cat": "B2債務不履行", "year": "99年第15題", "q": "甲至乙家具行購買 1 組展示中之沙發，約定於隔日由乙送貨至甲指定之處所。乙之員工丙送貨途中，因精神不濟發生翻車事故，沙發全毀，以下敘述何者錯誤？", "opts": ["雖然沙發係因丙之過失而毀損，乙仍須負債務不履行之責任", "因為尚有另外 1 組圖案類似之沙發，甲可請求乙交付該組沙發替代", "乙可以向丙主張沙發毀損之損害賠償", "甲必須解除契約之後，才能免除給付價金之債務"], "correct": 1, "exps": ["§224 債務人之使用人（丙）之過失視為債務人之過失，乙須負債務不履行責任。", "展示中的特定沙發為特定物買賣，標的毀損則給付不能，不得請求交付另一組類似沙發替代。", "沙發尚未交付，所有權屬乙，乙得對丙依侵權或僱傭契約請求賠償。", "給付不能可歸責於債務人，甲之價金債務不當然消滅，須依§256 解除契約後才免付價金（§259 回復原狀）。"], "trap": "特定物毀損＝給付不能；種類物才可以替代。§224：使用人過失＝自己的過失。陷阱：「類似的另一組」不是同一個特定物。", "related": ""}, {"id": "BC99-16", "cat": "C5債權讓與", "year": "99年第16題", "q": "甲使用乙銀行發行之信用卡消費後，共計有 15 萬元卡債無法返還，乙銀行在未知會甲之情形下，將該筆債權出售給丙。下列敘述何者錯誤？", "opts": ["因為甲未受到任何通知，故乙丙之讓與行為無效", "甲乙之間如果有設定擔保，該擔保亦隨同由丙取得", "甲乙之間如果有特約約定該筆債權不得讓與，丙公司如屬善意時，其讓與仍然有效", "甲欲清償債務時，經第 3 人告知，才知乙已將債權讓與丙，乃主動向丙清償債務，此屬有效之行為"], "correct": 0, "exps": ["債權讓與契約不須債務人同意或通知（§294Ⅰ）；通知只影響對債務人之效力（§297）。", "§295Ⅰ 債權讓與時其擔保及其他從屬權利隨同移轉。", "§294Ⅱ 不得讓與之特約不得對抗善意第三人，丙善意，讓與有效。", "債務人知悉讓與後自行向受讓人清償，是承認讓與，有效。"], "trap": "債權讓與：契約有效，通知只是「對債務人生效」要件（§297）。陷阱：「未通知＝讓與無效」。", "related": ""}, {"id": "BC99-17", "cat": "C2租賃", "year": "99年第17題", "q": "以下有關租賃關係之敘述何者正確？", "opts": ["租賃物如有修繕之必要，基於使用者付費之原則，應由承租人負擔修繕之費用", "承租人有使用收益租賃物之權利，所以可以自行將房間分租，當二房東", "甲將其房屋出租與乙，言明租期 3 年，有訂立契約書但未公證。至第 2 年時甲將房屋所有權讓與丙，乙得向丙主張該租賃契約仍存在", "租賃之房屋因電線走火發生火災，房屋因而受損時，因承租人未盡善良管理人之責，應負損害賠償責任"], "correct": 2, "exps": ["§429 I：租賃物修繕除契約另有訂定或習慣外，由出租人負擔。", "§443 I：轉租原則上須經出租人承諾，僅房屋一部分轉租且無反對約定才例外；選項未附條件而概括認為可自行分租，故不成立。", "§425 I：租賃物交付後所有權讓與第三人，租賃契約對受讓人繼續存在；本題期限3年，未逾§425 II 之5年限制，雖未公證仍適用。", "§434：承租人失火僅就重大過失負賠償責任，單純未盡善良管理人注意不足以負責。"], "trap": "白話：買賣不破租賃——房子換主人，租約照舊，但未公證且逾5年或不定期者例外（§425 II）。陷阱：失火責任限重大過失。", "related": ""}, {"id": "BC99-18", "cat": "B2債務不履行", "year": "99年第18題", "q": "銀行對於肉眼顯能辨識之票據印文真偽，而未為辨識，其責任係屬何種性質之責任？", "opts": ["屬重大過失之責任", "屬抽象輕過失之責任", "屬具體輕過失之責任", "無過失責任"], "correct": 0, "exps": ["肉眼顯能辨識而未辨識，顯然欠缺普通人之注意，屬重大過失。", "抽象輕過失指欠缺善良管理人注意（§220），本題程度更重。", "具體輕過失指欠缺與處理自己事務同一之注意，本題非此類。", "無過失責任須法律明文規定，本題為過失責任。"], "trap": "過失三級：重大過失（顯然欠缺普通人注意）＞抽象輕過失（善良管理人）＞具體輕過失（與處理自己事務同）。", "related": ""}, {"id": "BC99-19", "cat": "B4不當得利", "year": "99年第19題", "q": "基於下列何種原因而取得利益，應依關於不當得利之規定，返還其所受利益？", "opts": ["因確定判決取得利益", "因添附取得利益", "因消滅時效取得利益", "因取得時效取得利益"], "correct": 1, "exps": ["確定判決具既判力，取得利益有法律上原因，不成立不當得利。", "§816 因添附（§811至§815）喪失權利而受損害者，得依不當得利規定請求償金。", "§144Ⅰ 時效完成僅生拒絕給付抗辯權，債務人所受利益有法律上原因。", "取得時效完成取得權利，屬原始取得（§768），有法律上原因，非不當得利。"], "trap": "不當得利要件：無法律上原因。添附之後的償金是§816 明文轉引不當得利；時效、判決則有法律上原因。", "related": ""}, {"id": "BC99-29", "cat": "B1債之發生與消滅", "year": "99年第29題", "q": "債務人甲在其 3000 萬元之抵押土地上，有乙、丙、丁第一、第二及第三順位依次序為 1000 萬元、2000萬元及 800 萬元之普通抵押權，乙為丁抵押權人之利益，而將其第一順位讓與丁。此稱之為：", "opts": ["次序之絕對拋棄", "次序之相對拋棄", "次序之讓與", "次序之互易"], "correct": 2, "exps": ["絕對拋棄無須指定特定人，後次序依序遞升，與「為丁之利益」不同。", "相對拋棄是乙與丁同順位，按債權額比例分配，非丁取得第一順位。", "次序之讓與：先次序抵押權人（乙）為後次序（丁）之利益，讓與優先受償之地位，丁在乙債權額範圍內優先受償。", "互易是兩個抵押權人相互對調次序，本題為單向讓與。"], "trap": "次序變動四型：絕對拋棄（遞升）、相對拋棄（同順位按比例）、讓與（單向，優先範圍以讓與人債權額）、互易（兩者對調）。", "related": ""}, {"id": "BC100-1", "cat": "C1買賣", "year": "100年第1題", "q": "下列關於贈與契約之敘述何者正確？", "opts": ["贈與契約之贈與人對其贈與之物，有瑕疵時，原則上贈與人應負物之瑕疵擔保責任", "贈與契約為無償契約，所以贈與人均可撤銷其贈與", "定期給付之贈與，不因贈與人死亡而失其效力", "贈與人僅就其故意或重大過失，對於受贈人負給付不能之責任"], "correct": 3, "exps": ["贈與人原則上不負物之瑕疵擔保責任（§411 本文）；僅贈與人故意不告知瑕疵或保證無瑕疵時，才對受贈人因瑕疵所生損害負賠償義務（§411 但書）。", "贈與人並非『均可』撤銷：§408 Ⅰ 僅限於贈與物之權利『未移轉前』得撤銷，已移轉者不得任意撤銷；Ⅱ 經公證之贈與或為履行道德上義務而為贈與者，亦不得任意撤銷。（§416 是受贈人忘恩時贈與人的法定撤銷權，另為一事。）", "定期給付之贈與，依§415，因贈與人或受贈人之死亡而失其效力（但贈與人有反對意思表示者除外）；本選項說『不因贈與人死亡而失效』與條文相反。", "依§410，贈與人僅就其故意或重大過失，對於受贈人負給付不能之責任（無償契約，責任從輕），正確。"], "trap": "", "related": ""}, {"id": "BC100-2", "cat": "C2租賃", "year": "100年第2題", "q": "關於租賃契約，下列何者錯誤？", "opts": ["出租人不以所有權人為限", "未立字據之租約無效", "租賃契約之承租人為租賃物之直接占有人，出租人為間接占有人", "租賃契約為有償契約"], "correct": 1, "exps": ["出租人不以所有人為限，有占有使用權即可出租（如二房東），正確。", "租賃契約為「不要式契約」，不以書面為成立要件；口頭租約有效，只是不動產租賃逾一年者應以書面訂立，未以書面者「視為不定期限」（§422），並非無效，「未立字據→無效」之描述錯誤。", "承租人直接使用租賃物，為直接占有人；出租人透過承租人間接占有，為間接占有人，正確。", "租賃為有償雙務契約（租金對待給付），正確。"], "trap": "", "related": ""}, {"id": "BC100-3", "cat": "C3居間承攬委任", "year": "100年第3題", "q": "下列何種契約之屬性為無償契約？", "opts": ["使用借貸", "僱傭契約", "承攬契約", "居間契約"], "correct": 0, "exps": ["使用借貸（§464）：借用人「無償」使用後返還，為無償契約，正確。", "僱傭契約以給付報酬為要件（§482），為有償雙務契約。", "承攬契約定作人須給付報酬（§490），為有償契約。", "居間人促成契約後得請求報酬（§565），為有償契約。"], "trap": "", "related": ""}, {"id": "BC100-4", "cat": "C2租賃", "year": "100年第4題", "q": "下列何者，非民法所規定關於出租人之義務？", "opts": ["租賃物之交付義務", "對租賃物之修繕義務", "租賃物為動物時，其飼料費之支出", "租賃物為房屋時，該房屋所應繳納之稅金"], "correct": 2, "exps": ["出租人應以合於約定使用收益之租賃物交付承租人，並於租賃關係存續中保持其合於約定使用、收益之狀態（§423），屬出租人義務。", "租賃物之修繕，除契約另有訂定或習慣外，由出租人負擔（§429 Ⅰ），屬出租人義務。", "§428：租賃物為動物者，其飼養費由『承租人』負擔，不是出租人義務，故『飼料費由出租人支出』不屬民法所規定之出租人義務，為應選答案。", "§427：就租賃物應納之一切稅捐（如房屋稅），由出租人負擔，屬民法所規定之出租人義務。"], "trap": "", "related": ""}, {"id": "BC100-5", "cat": "C4其他各種之債", "year": "100年第5題", "q": "甲向乙借了 50 萬，約定利息為週年利率百分之 30 計算，下列敘述何者正確？", "opts": ["約定之利率過高，該消費借貸無效", "約定之利率過高，超過法定週年利率 20%部分之利息無效", "約定之利率過高，超過法定週年利率 20%部分之利息，乙無請求權", "依契約自由原則，該利率之約定有效，乙得向甲請求利息之支付"], "correct": 2, "exps": ["利率過高不影響消費借貸（§474）效力，不會導致借貸無效。", "考試當年§205 效果為「債權人對超過部分無請求權」，非「利息無效」。", "考試當年§205 約定利率超過週年20%者，債權人對超過部分之利息無請求權。", "契約自由受§205 限制，超過上限部分無請求權，並非全部有效。"], "trap": "現行法差異：§205 已修正，上限由年利率20%降為16%，效果改為「超過部分之約定無效」；現行法下30%仍超限，但條文數字與效果與選項敘述不同。", "related": ""}, {"id": "BC100-6", "cat": "C1買賣", "year": "100年第6題", "q": "甲向乙買一台液晶電視，約定一手交錢一手交貨，於乙未交付液晶電視前，當乙向甲請求價金之支付時，甲得主張：", "opts": ["撤銷權", "解除權", "不安抗辯權", "同時履行抗辯權"], "correct": 3, "exps": ["撤銷權須有意思表示瑕疵等事由，本題無。", "解除權須有法定或約定解除事由，本題無。", "不安抗辯權（§265）適用於有先為給付義務者，本題為同時交換。", "§264Ⅰ 因契約互負債務者，於他方未為對待給付前得拒絕自己之給付。"], "trap": "同時履行（§264）＝一手交錢一手交貨；不安抗辯（§265）＝有先給付義務、對方財產顯形減少。", "related": ""}, {"id": "BC100-7", "cat": "B1債之發生與消滅", "year": "100年第7題", "q": "甲向大大車行買一台中古 A 車給其子乙，並約定其子乙得直接向該車行請求交付 A 車，則甲與大大車行間之契約屬於：", "opts": ["附負擔之法律行為", "第三人利益契約", "債權讓與行為", "第三人保證契約"], "correct": 1, "exps": ["附負擔是在法律行為（如贈與）中附加受益人須履行某義務，本題並無對乙的附加義務要求。", "第三人利益契約（§269）：契約約定向第三人（乙）為給付者，第三人得直接請求債務人履行，本題完全符合，甲（要約人）、車行（承諾人/債務人）、乙（受益第三人），正確。", "債權讓與是甲將既有債權移轉給乙，本題甲是新設第三人受益條款，並非讓與既有債權。", "保證是保證人擔保他人債務，此處乙並非在保證甲的債務，選項性質不符。"], "trap": "", "related": ""}, {"id": "BC100-9", "cat": "C1買賣", "year": "100年第9題", "q": "甲出售土地給乙，交付土地後乙發現實際坪數比契約書所載坪數少 5%。下列敘述，何者錯誤？", "opts": ["若無顯失公平之情形，乙可以請求減少價金或解除契約", "瑕疵擔保責任自土地交付時起經過三年而消滅", "此瑕疵若乙於契約成立時知悉而甲不知，甲不負擔保之責", "乙若不通知甲坪數短少，視為承認其所受領之物"], "correct": 1, "exps": ["§359：物有瑕疵得解除或減少價金，但解除顯失公平者僅得請求減少價金。", "§365 I：不動產瑕疵之解除權或減價請求權，自物交付後經過五年而消滅，並非三年。", "§355 I：買受人於契約成立時知其物有瑕疵者，出賣人不負擔保責任。", "§356：買受人應從速檢查並通知出賣人，怠於通知者視為承認所受領之物。"], "trap": "白話：買到有瑕疵的房子要趕快檢查通知；不動產權利消滅期間5年、動產6個月（§365）。陷阱：期間數字混淆。", "related": ""}, {"id": "BC100-11", "cat": "B1債之發生與消滅", "year": "100年第11題", "q": "下列敘述，何者正確？", "opts": ["契約之要約人，因要約而受拘束，不可預先聲明不受拘束", "貨物標定賣價陳列者，視為要約之引誘", "對話為要約者，非立時承諾，即失其拘束力，因此不得定承諾期限", "將要約變更而承諾者，視為拒絕原要約而為新要約"], "correct": 3, "exps": ["§154Ⅰ但書：要約當時預先聲明不受拘束者，不受要約拘束，故要約人「可以」預先聲明不受拘束；選項說「不可」，錯誤。", "依§154Ⅱ，貨物標定賣價陳列者「視為要約」（非要約引誘），此為考試常見混淆點。", "§156：對話為要約者，非立時承諾，即失其拘束力；這是未另定承諾期限時的規則，並未禁止當事人另定承諾期限，選項說「不得定承諾期限」，錯誤。", "§160Ⅱ：將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約，正確，此為「非正式承諾→反要約」之考點。"], "trap": "", "related": ""}, {"id": "BC100-12", "cat": "C2租賃", "year": "100年第12題", "q": "乙承租甲所有之土地種植果樹，約定租期二年，未訂立字據。關於此案例，下列敘述何者正確？", "opts": ["此為定期租賃契約", "乙於契約成立後，得請求甲為地上權之登記", "若甲於土地交給乙占有後，將土地所有權移轉給丙，乙仍可主張租賃契約對丙成立", "就租賃物應納之一切稅捐，由出租人甲負擔"], "correct": 3, "exps": ["§422：不動產租賃期限逾1年而未以字據訂立者視為不定期租賃，本題兩年未立字據，並非定期租賃。", "§422-1 地上權登記請求限於租用基地建築房屋，本題為種植果樹，不適用。", "本題視為不定期租賃，依§425 II 未公證之不定期租賃不適用買賣不破租賃，乙不得向受讓人丙主張。", "§427：就租賃物應納之一切稅捐，由出租人負擔。"], "trap": "白話：租屋稅金房東付。口頭約定超過一年的不動產租約，法律視為不定期，連帶影響買賣不破租賃的保護。", "related": ""}, {"id": "BC100-13", "cat": "B4不當得利", "year": "100年第13題", "q": "下列關於不當得利之敘述，何者正確？", "opts": ["無法律上之原因而受利益，致他人受損害者，應返還其利益", "因清償債務而為給付，於給付時明知無給付之義務者，得請求返還", "不當得利之受領人，只須返還其所受之利益，如本於該利益更有所取得者，無須返還", "不當得利之受領人，不知無法律上之原因，縱其所受之利益已不存在者，仍應負返還之責任"], "correct": 0, "exps": ["§179 無法律上之原因而受利益致他人受損害者，應返還其利益。", "§180① 給付時明知無給付義務者，不得請求返還。", "§181 受領人除返還所受利益外，本於該利益更有所取得者並應返還。", "§182Ⅰ 受領人不知無法律上原因，所受利益已不存在者，免負返還責任。"], "trap": "不當得利返還範圍：善意＝現存利益（§182Ⅰ），惡意＝全部加利息（§182Ⅱ）。§180 四款不得請求返還：明知無義務、履行道德義務、期限前清償、不法原因。", "related": ""}, {"id": "BC100-18", "cat": "B4不當得利", "year": "100年第18題", "q": "甲到乙所開設之賭場賭博，賭輸了 10 萬元，下列敘述何者正確？", "opts": ["賭博為甲乙間債務發生之原因關係，所以甲應支付乙 10 萬", "如甲已經付款給乙，則甲得主張賭博行為違反公序良俗無效，依不當得利向乙請求返還", "如甲已經付款給乙，雖甲得主張賭博行為違反公序良俗無效，但甲之給付為出於不法原因之給付，所以不得向乙請求返還", "如甲已經付款給乙，甲得主張侵權行為，向乙請求損害賠償"], "correct": 2, "exps": ["賭博行為違反公序良俗而無效（§72），賭債無請求權。", "雖賭博無效，給付人若為不法原因給付，不得依不當得利請求返還（§180④）。", "§180④ 因不法原因而為給付者不得請求返還，賭債已付不能請求返還。", "甲自願賭博並給付，不構成乙之侵權行為；亦不應迂迴規避§180④。"], "trap": "公序良俗無效＋不法原因給付不得返還＝「雙重不保護」。陷阱：以為無效就一定能要回。", "related": ""}, {"id": "BC101-3", "cat": "C1買賣", "year": "101年第3題", "q": "甲當面向乙表示願以一千萬元出售甲所有之 A 房屋予乙，乙當場未置可否，經三日後乙回覆甲願以一千萬元購買 A 屋。就甲、乙各自之意思表示，下列敘述何者最正確？", "opts": ["甲之意思表示為要約，乙之意思表示為承諾", "甲之意思表示為要約引誘，乙之意思表示為要約", "甲之意思表示為要約，乙之意思表示為要約引誘", "甲之意思表示為要約，乙之意思表示為新要約"], "correct": 3, "exps": ["乙三日後才回覆，已逾對話要約應即時承諾之期間（§156），不是有效承諾。", "甲所為特定價格與標的之表示是要約，並非要約引誘。", "乙之回覆不是要約引誘，而是遲到之承諾，視為新要約。", "§156 對話要約須立時承諾，否則失效；§160Ⅰ 遲到之承諾視為新要約。"], "trap": "對話要約→當場不承諾即失效；遲到的承諾＝新要約（§160Ⅰ）。陷阱：誤把遲到承諾當有效承諾。", "related": ""}, {"id": "BC101-4", "cat": "B2債務不履行", "year": "101年第4題", "q": "下列有關加害人應負損害賠償責任之敘述，何者最正確？", "opts": ["受僱人甲因執行職務不法侵害第三人乙之權利時，原則上僅由甲對乙負損害賠償責任", "限制行為能力人甲不法侵害第三人乙之權利時，即使甲於行為時有識別能力，原則上由甲及其法定代理人對乙連帶負損害賠償責任", "法人甲之董事丙因執行職務對第三人乙造成損害時，因甲無實體存在，故僅由丙單獨對乙負損害賠償責任", "甲、丙、丁三人共謀聯手圍毆乙，實際下手時，如丁僅在一旁叫囂助陣，則丁不須對乙因被毆所生損害負賠償責任"], "correct": 1, "exps": ["§188Ⅰ 僱用人與受僱人連帶負責，並非原則上僅受僱人負責。", "§187Ⅰ 限制行為能力人行為時有識別能力者，與其法定代理人連帶負損害賠償責任。", "§28 法人與董事連帶負責，並非僅董事單獨負責。", "§185Ⅱ 幫助人視為共同行為人，丁叫囂助陣屬幫助，仍須連帶負責。"], "trap": "侵權連帶口訣：法人董事（§28）、僱用人（§188）、法定代理人（§187）、共同行為人（§185）。", "related": ""}, {"id": "BC101-5", "cat": "C4其他各種之債", "year": "101年第5題", "q": "甲、乙、丙三人締結合夥契約，並以每月三萬元租金租用甲所有之房屋為共同經營事業之場所。惟因合夥事業經營不順致合夥解散，解散後已無合夥財產清償累計三個月未支付之租金。就積欠之九萬元租金，出租人甲得向乙、丙為如何之主張？", "opts": ["甲僅得分別向乙、丙請求各應支付三萬元", "甲僅得分別向乙、丙請求各應支付四萬五千元", "甲僅得向乙或丙請求應支付六萬元", "甲僅得向乙或丙請求應支付九萬元"], "correct": 0, "exps": ["甲本身也是合夥人，須自負應分擔之一份；九萬三人均分，甲僅得向乙、丙各請求其分擔額三萬元（§681、§677）。", "若乙、丙各負四萬五千元，等於甲不分擔，與合夥人亦應分擔損失之內部關係不符。", "甲不得向乙或丙就六萬元全額請求，因甲自己亦為債務人之一，請求範圍限於他人應分擔額。", "§681 之連帶責任是對外保護第三債權人；甲兼為合夥人，不能請求九萬全額。"], "trap": "白話：房東同時是合夥人，自己也要吃一份虧。陷阱：套用 §681 連帶責任而忽略債權人本身也是合夥人。", "related": ""}, {"id": "BC101-6", "cat": "C1買賣", "year": "101年第6題", "q": "甲與乙締結將甲所有 A 屋出售予乙之買賣契約後，A 屋於甲依約交付予乙前因火災燒毀致不能給付。下列敘述何者最正確？", "opts": ["如 A 屋之燒毀係可歸責於甲之事由所致，乙僅須支付二分之一之價金", "如 A 屋之燒毀係可歸責於乙之事由所致，甲僅得請求支付二分之一之價金", "如 A 屋之燒毀係可歸責於甲之事由所致，乙得解除契約", "如 A 屋之燒毀係可歸責於第三人丙之事由所致，乙仍須支付二分之一之價金"], "correct": 2, "exps": ["可歸責甲致給付不能，乙得依§226 I 請求損害賠償或§256 解除契約，法律無『價金減半』之規定。", "§267：因可歸責債權人之事由致給付不能，債務人得請求全部對待給付（扣除所免費用與取得利益），並非二分之一。", "§226 I、§256：可歸責債務人之事由致給付不能，債權人得解除契約並請求損害賠償。", "可歸責於第三人而不可歸責雙方者，§225 I 免給付義務、§266 I 乙免為對待給付，並非支付一半。"], "trap": "白話：誰的錯誰承擔——債務人的錯，買方可解約求償；買方的錯，賣方照收錢；雙方都沒錯，風險因不可歸責而互免。", "related": ""}, {"id": "BC101-7", "cat": "C5債權讓與", "year": "101年第7題", "q": "甲與乙約定，甲不得將其對乙之非不得讓與的 A 金錢債權讓與予第三人。事後，甲卻違反與乙之約定，將 A 債權讓與予丙。就此情形，下列敘述何者最正確？", "opts": ["甲、乙之約定違反誠信原則，無效。甲、丙間之讓與契約有效", "甲、乙之約定有效。但如丙為善意第三人，甲、乙之約定不得對抗丙", "無論債權人如何變動，債務人乙皆須清償，故甲、乙間之約定無效", "甲、乙之約定效力未定。甲、丙之讓與契約無效"], "correct": 1, "exps": ["債權禁止讓與之特約依契約自由有效，不因違反誠信原則而無效。", "§294Ⅰ③、Ⅱ 禁止讓與特約有效，但不得對抗善意第三人，丙善意則讓與有效。", "債權之讓與禁止約定有效，不可因債務人最終都要清償就否定其效力。", "約定並非效力未定，且丙善意時讓與契約有效。"], "trap": "禁止讓與特約：債權人與債務人間有效，但不能對抗善意第三人。陷阱：以為約定違反就當然無效。", "related": ""}, {"id": "BC101-9", "cat": "B1債之發生與消滅", "year": "101年第9題", "q": "甲借款十萬元予乙，約定於半年後清償。下列敘述何者最正確？", "opts": ["對於乙之期前清償，甲不得為反對之意思表示", "甲請求乙為期前清償時，乙不得拒絕", "乙之期前清償縱經甲受領，乙仍得以其期限利益受損，向甲主張不當得利返還請求權", "乙之期前清償如經甲受領，則乙不得再向甲主張不當得利返還請求權"], "correct": 3, "exps": ["§316：期前清償須「無反對之意思表示」，甲可有反對（如約定不得期前清償），並非不得為反對表示。", "§316：定有清償期者，債權人不得於期前請求清償，乙得拒絕。", "§180(2)：債務人於未到期之債務因清償而為給付者，不得請求返還；期限利益屬債務人，提前清償即視為拋棄，不能主張利益受損而請求不當得利。", "§180(2)：未到期債務因清償而為給付，債權人受領後，債務人不得再依不當得利請求返還。"], "trap": "期限利益屬債務人，他可提前還，但還了就收不回；債權人不能反過來要求提前還。陷阱：§180 的不得請求返還類型（道德義務、未到期清償、明知無義務、不法原因）要分清楚。", "related": ""}, {"id": "BC101-10", "cat": "B1債之發生與消滅", "year": "101年第10題", "q": "甲對乙有於今年（下同）5 月 31 日到期之買賣價金金錢債權，乙對甲有於 6 月 30 日到期之消費借貸金錢債權。甲於 7 月 1 日主張抵銷，乙於 7 月 5 日回覆同意甲之抵銷的主張。試問：因甲主張抵銷而消滅之債之關係，於何時發生效力？", "opts": ["5 月 31 日", "6 月 30 日", "7 月 1 日", "7 月 5 日"], "correct": 1, "exps": ["5/31 只是甲之債權屆期，但乙之債權（甲之債務）至6/30始屆期，尚未達雙方均可抵銷。", "§335 II：抵銷溯及至得為抵銷之時；依通說須兩債務均屆清償期，即6/30，甲7/1單方意思表示（§335 I）即生抵銷。", "7/1 為甲為意思表示之日，但抵銷效力依§335 II 溯及得為抵銷之時。", "抵銷為單方行為，不需乙同意（§335 I），乙7/5之回覆不影響效力時點。"], "trap": "白話：抵銷一說出口就生效，且倒回到雙方都到期的那天。陷阱：誤以為須對方同意或自表示日起生效。", "related": ""}, {"id": "BC101-11", "cat": "C3居間承攬委任", "year": "101年第11題", "q": "甲、乙間約定由甲幫乙為訂約之媒介，並由乙給付報酬予甲。甲、乙所定契約之名稱為下列何者？", "opts": ["承攬契約", "代辦契約", "僱傭契約", "居間契約"], "correct": 3, "exps": ["承攬（§490）：一方為他方完成一定之工作，他方俟工作完成給付報酬；重在完成「工作結果」，而非替人報告訂約機會或媒介訂約，故非本題契約。", "「代辦」指代辦商（§558 Ⅰ）：非經理人而受商號之委託，在一定處所或區域內，以該商號之名義辦理其事務之全部或一部之人；重在以商號名義辦理事務，並非為他人報告訂約機會或媒介訂約，故不是本題。", "僱傭（§482）：一方於一定或不定期限內為他方服勞務，他方給付報酬；重在提供勞務本身，與居間「促成他人訂約」不同。", "居間（§565）：一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約；本題甲為乙媒介訂約、乙給付報酬，正是居間契約，正確。"], "trap": "", "related": ""}, {"id": "BC101-13", "cat": "C2租賃", "year": "101年第13題", "q": "甲將其所有土地出租予乙建築房屋。下列敘述何者錯誤？", "opts": ["契約成立後，乙得請求甲為地上權之登記", "乙將房屋所有權移轉予丙時，原基地租賃契約對於丙仍繼續存在", "乙出賣房屋時，甲無依同樣條件優先承買之權利", "甲、乙得約定由乙負擔就土地應納之一切稅捐"], "correct": 2, "exps": ["§422-1：租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記，正確。", "§426-1：租用基地建築房屋，承租人房屋所有權移轉時，其基地租賃契約對於房屋受讓人仍繼續存在，正確。", "§426-2 Ⅰ：承租人出賣房屋時，基地所有人有依同樣條件優先承買之權；甲（基地所有人）有優先承買權，選項說『無』，與條文相反，錯誤，為應選答案。", "§427 規定租賃物應納之一切稅捐由出租人負擔，但該條並無禁止另約之規定，當事人得依契約自由約定由承租人負擔，正確。"], "trap": "", "related": ""}, {"id": "BC101-19", "cat": "C5債權讓與", "year": "101年第19題", "q": "甲以其對乙尚未屆清償期之金錢債權設定權利質權於丙，以擔保丙對甲之金錢債權，並於設定時即通知乙。下列敘述何者最正確？", "opts": ["該權利質權之設定，未得乙之同意，無效", "乙得以於受通知後始對甲取得之金錢債權，對丙主張抵銷", "乙得以於受通知時對甲之已屆清償期之金錢債權，對丙主張抵銷", "該權利質權之設定，須由甲、丙共同通知乙，始對乙生效力"], "correct": 2, "exps": ["權利質權設定準用債權讓與規定（§902），讓與債權無須債務人同意，只需通知（§297），故設定並非無效。", "§299 II：只有債務人「受通知時」已對讓與人取得之債權才可抵銷，受通知後才取得者不得主張。", "§902、§299 II：乙受通知時對甲已有債權，且其清償期先於或同時於被質押債權屆至，得對質權人丙主張抵銷。", "§297 I：通知由讓與人或受讓人任一方為之即可（§902 準用），不必甲、丙共同通知。"], "trap": "債權質權借用債權讓與的規則：通知債務人才對他生效；債務人的抵銷抗辯以「受通知時已存在」且清償期不晚於被讓與債權者為限。陷阱：通知後才取得的債權不能抵銷。", "related": ""}, {"id": "BC101-23", "cat": "B6侵權行為", "year": "101年第23題", "q": "甲被酒醉駕車之乙撞傷住院，甲所駕駛之汽車亦因此受損，下列敘述何者最正確？", "opts": ["甲對於汽車所受之損害，僅得請求乙將汽車修復原狀，不得主張修復原狀所必要之費用以代替回復原狀", "甲受傷住院，得因人格權受侵害對乙請求非財產上之損害賠償，其請求之數額限於甲實際所受之損害", "甲對於汽車所受之損害，得對加害人乙請求汽車因毀損所減少之數額", "被害人甲若對第三人負有法定扶養義務者，加害人乙對該第三人亦應負損害賠償責任"], "correct": 2, "exps": ["§213 III：負損害賠償責任者，債權人得請求支付回復原狀所必要之費用以代回復原狀，不限於請求修復原狀。", "§195 I：非財產上損害（慰撫金）依被害人身分地位、痛苦程度等酌定相當金額，並非限於實際所受損害數額。", "§196：不法毀損他人之物者，被害人得請求賠償其物因毀損所減少之價額。", "§192 II：對第三人負法定扶養義務者，加害人對該第三人負賠償責任，限於被害人「致死」之情形；本題甲僅受傷。"], "trap": "物被毀損：可請求減少價額（§196）或修復費用代回復原狀（§213 III）。陷阱：§192 II 扶養損害只有被害人死亡才適用，受傷不算。", "related": ""}, {"id": "BC101-25", "cat": "C2租賃", "year": "101年第25題", "q": "甲出租房屋給乙，三天後乙搬入居住，並依約繳交房租，下列敘述何者最正確？", "opts": ["關於房屋租金之請求權，其消滅時效期間為兩年", "租賃期間若甲將房屋出賣給丙，甲與乙之租賃關係即消滅", "甲若將房屋贈與丁，並移轉房屋所有權給丁，則乙之租賃契約對丁繼續存在", "甲若先後將房屋出賣給戊與辛，則基於優先性之考量，僅甲與戊之買賣契約生效"], "correct": 2, "exps": ["§126：租金請求權之消滅時效為5年，非2年。", "買賣不破租賃（§425 I），出賣後租賃關係不因此消滅。", "§425 I：租賃物交付後，承租人占有中，所有權因贈與讓與第三人，租賃契約對受讓人仍繼續存在。", "一物二賣兩買賣契約均有效，並非僅先訂之契約生效。"], "trap": "白話：房子被賣被送都不影響房客，但前提是已交付、占有中。短期時效§126：租金5年。", "related": ""}, {"id": "BC101-27", "cat": "C1買賣", "year": "101年第27題", "q": "甲委任乙處理 A 土地買賣相關事宜，下列敘述何者最正確？", "opts": ["委任人甲得將對乙之處理委任事務請求權讓與第三人", "受任人乙若受有報酬，委任人甲無須因受任人之請求，預付處理委任事務之必要費用", "受任人乙因不可歸責於自己之事由，不得已須在不利於委任人之時期終止契約者，對於委任人甲因此所受之損害無須付賠償責任", "以上皆為正確"], "correct": 2, "exps": ["委任以信任為基礎，委任事務請求權依債之性質不得讓與（§294 I①），不得任意讓與第三人。", "§546 I：受任人得請求委任人預付處理委任事務之必要費用，與有無報酬無關。", "§549 II 但書：因非可歸責於該當事人之事由致不得不終止契約者，不負損害賠償責任。", "A、B 選項不正確，故『以上皆正確』不成立。"], "trap": "白話：委任是信任關係，隨時可終止（§549 I），但不利時機終止要賠，除非不可歸責。費用預付不問報酬有無。", "related": ""}, {"id": "BC101-28", "cat": "C5債權讓與", "year": "101年第28題", "q": "甲將其對乙之債權讓與給丙，下列敘述何者最正確？", "opts": ["甲若未將債權讓與之事由通知乙，則甲與丙間之債權讓與無效", "甲應將證明債權之文件，交付受讓人丙", "債權讓與為負擔行為", "債權讓與時，該債權擔保之最高限額抵押權亦隨同移轉"], "correct": 1, "exps": ["§297 通知僅為對債務人生效之要件，讓與人與受讓人間讓與合意即生效力，未通知並非無效。", "§296：讓與人應將證明債權之文件交付受讓人，並應告以主張該債權所必要之一切情形。", "債權讓與使債權移轉，直接變動權利，為處分行為（準物權行為），並非負擔行為。", "§295 雖規定從屬權利隨同移轉，但最高限額抵押權於原債權確定前，擔保債權之讓與不隨同移轉（§881-6）。"], "trap": "債權讓與＝處分行為，合意即生效；通知只是對債務人的對抗要件。陷阱：最高限額抵押權在確定前不隨債權移轉，與普通抵押權不同。", "related": ""}, {"id": "BC101-29", "cat": "C2租賃", "year": "101年第29題", "q": "甲將位於忠孝路的一間公寓出租給乙，租期三年，下列敘述何者最正確？", "opts": ["乙若遲繳租金，甲應在兩年內請求乙繳納，否則租金請求權將罹於消滅時效", "甲與乙之租賃契約若未經公證，在乙搬入租賃房屋後，縱使甲將租賃物所有權讓與第三人，甲與乙之租賃契約對於第三人不生效力", "乙搬入租賃房屋居住後，縱使甲將租賃物所有權基於贈與之原因讓與第三人丙，租賃契約對於丙不生效力，丙得請求乙搬離租屋處並返還房屋", "租賃物之修繕，得因雙方當事人之約定，由承租人負責"], "correct": 3, "exps": ["§126：租金請求權時效為5年，不是2年。", "§425 I：租期3年，雖未公證，因交付且占有中，所有權移轉後租約仍對受讓人繼續存在。", "贈與讓與所有權亦適用§425 I，租賃契約對丙繼續存在，丙不得請求乙搬離。", "§429 I：租賃物修繕除契約另有訂定外由出租人負擔，故當事人得約定由承租人修繕。"], "trap": "白話：修繕義務是任意規定，約定可變更。陷阱：租金時效是5年。", "related": ""}, {"id": "BC101-30", "cat": "C4其他各種之債", "year": "101年第30題", "q": "乙家中的寵物飼料已吃完，向鄰居甲借用一包飼料供家中寵物食用，並約定隔日還給甲一包相同的新飼料，下列敘述何者最正確？", "opts": ["甲與乙之間成立使用借貸", "甲與乙之借貸契約於雙方意思合致時即為成立", "甲與乙之契約如未約定報償，貸與人甲對於借用物之瑕疵，非因故意而未告知時，對於借用人乙因此所受之損害無須負損害賠償責任", "借用人不能以種類、品質、數量相同之物返還時，應以借用時，借用地之價值償還"], "correct": 2, "exps": ["約定返還「相同種類、品質、數量之物」，是消費借貸（§474），非使用借貸（返還原物）。", "消費借貸為要物契約，須金錢或其他代替物之所有權移轉於借用人才生效力（§475），非意思合致即成立。", "§476 II：無報償之消費借貸，貸與人非故意不告知瑕疵者，不負損害賠償責任（借用人僅得以瑕疵原物之價值返還）。", "§479：借用人不能以種類、品質、數量相同之物返還時，原則以返還時、返還地之價值償還，非借用時、借用地。"], "trap": "借飼料、借米、借錢都是「用完還同類」＝消費借貸；借腳踏車還原車＝使用借貸。陷阱：消費借貸是要物契約，交付物才成立。", "related": ""}, {"id": "BC101-32", "cat": "B2債務不履行", "year": "101年第32題", "q": "甲向乙提出給付，但給付遲延，下列敘述何者最正確？", "opts": ["乙得向甲主張遲延之損害賠償以代替原定給付", "甲在遲延中，對於因不可抗力而生之損害，原則上毋須負責", "遲延之債務，以支付金錢為標的者，債權人乙得向債務人甲請求以法定利率計算之遲延利息", "對於甲之遲延給付，不論是否可歸責於甲，甲皆應負遲延之賠償責任"], "correct": 2, "exps": ["§232：遲延後債權人得請求賠償不履行損害以代原給付，須以遲延後之給付對債權人無利益並拒絕給付為前提，非當然得請求。", "§231 II：債務人在遲延中，對於不可抗力所生之損害亦應負責，除非證明縱不遲延仍不免發生損害。", "§233 I：金錢債務遲延，債權人得請求依法定利率（§203 週年5%）計算之遲延利息。", "§230：因不可歸責於債務人之事由致未為給付者，債務人不負遲延責任。"], "trap": "遲延＝可歸責才成立；遲延中連不可抗力都要負責（§231 II）；金錢債務遲延利息（§233）最基本。陷阱：以遲延賠償代替原給付須符合 §232 要件。", "related": ""}, {"id": "BC101-33", "cat": "C4其他各種之債", "year": "101年第33題", "q": "甲向乙訂購珍珠項鍊一條，甲與乙並約定由乙直接向第三人丙提出給付，丙對乙有直接請求權，下列敘述何者最正確？", "opts": ["在丙表示享受其利益之意思後，甲與乙仍得隨時撤銷丙所取得之利益", "在丙表示享受其利益之意思後，丙得請求乙向自己提出給付，但乙得以由契約所生之一切抗辯對抗丙", "在丙表示享受其利益之意思後，乙得向丙請求給付項鍊之價金", "甲與乙所締結之買賣契約為負擔契約，對第三人丙不生效力，丙不得對乙直接請求給付"], "correct": 1, "exps": ["§269 II：第三人未表示享受利益意思前，當事人得變更或撤銷；表示後即不得再撤銷。", "§269 I、§270：第三人有直接請求給付權，債務人得以由契約所生之一切抗辯對抗受益之第三人。", "價金係要約人甲依買賣契約應給付予乙，乙不得向第三人丙請求價金；丙僅享受受領項鍊之利益。", "§269 I：利益第三人契約有效，第三人丙對債務人乙有直接請求給付之權。"], "trap": "利益第三人契約：第三人表示享受後權利確定，但債務人仍可用契約抗辯（如買賣瑕疵、未付價金）對抗他。陷阱：第三人不是契約當事人，不負價金義務。", "related": ""}, {"id": "BC101-36", "cat": "B4不當得利", "year": "101年第36題", "q": "甲將自己之汽車停在乙的停車格內多日，乙自己沒有汽車，停車格也未出租給他人使用，甲在乙的要求下將汽車開走，下列敘述何者最正確？", "opts": ["乙仍得對甲主張無因管理，請求必要費用之返還", "乙仍得對甲主張債務不履行之損害賠償責任", "乙仍得對甲主張不當得利，請求甲返還利益", "乙仍得對甲主張無權代理之損害賠償責任"], "correct": 2, "exps": ["無因管理須有為他人管理之意思（§172），乙並未管理甲之事務，反而是甲占用乙之停車格。", "甲乙之間並無契約關係，不生債務不履行責任。", "§179：無法律上原因而受利益致他人受損害者，應返還。甲無權占用停車格取得使用利益，乙即使未使用，仍得依不當得利請求返還使用利益。", "甲未以乙名義為法律行為，與無權代理無關。"], "trap": "白話：白佔別人的車位，等於白用了別人的東西，要把使用利益吐出來。陷阱：乙自己沒車所以沒損失？不當得利重在甲取得利益。", "related": ""}, {"id": "BC101-37", "cat": "B1債之發生與消滅", "year": "101年第37題", "q": "甲向乙借一套百科全書，下列敘述何者最正確？", "opts": ["在乙承諾將百科全書借給甲後，甲與乙之借貸契約即成立", "甲與乙之借貸契約為諾成契約", "甲與乙之借貸契約為消費借貸契約", "甲與乙之借貸契約為要物契約，以物之交付作為契約之成立要件"], "correct": 3, "exps": ["使用借貸（§464）為「以物交付他方」而約定無償使用後返還之契約，屬要物契約，須物已交付才成立；乙僅承諾借出、尚未交付，契約尚未成立。", "使用借貸不是合意即成立的諾成契約：§464 以「以物交付他方」為契約要素，未交付百科全書前，雙方縱有合意，借貸契約仍未成立，故「諾成契約」之說錯誤。", "消費借貸（§474）是移轉金錢或其他代替物「所有權」，約定以種類、品質、數量相同之物返還；本題借的是特定一套百科全書，使用後須返還原物，屬使用借貸（§464），不是消費借貸。", "使用借貸（§464）為要物契約，須以「物之交付」作為成立要件，正確。（消費借貸§474 亦為要物契約，但本題標的是返還原物，屬使用借貸。）"], "trap": "", "related": ""}, {"id": "BC101-38", "cat": "C1買賣", "year": "101年第38題", "q": "甲與乙締結 A 畫的買賣契約，約定由出賣人甲在兩天內將 A 畫送至乙處；甲將 A 畫交由店員丙送至乙處，因丙之過失，A 畫滅失。下列敘述何者最正確？", "opts": ["甲免給付義務", "乙得向丙主張侵害所有權之損害賠償責任", "甲應對乙負擔給付不能之損害賠償責任", "丙應對乙負擔給付不能之損害賠償責任"], "correct": 2, "exps": ["§224：債務人之履行輔助人之故意過失，債務人與自己之故意過失負同一責任，甲不得免責。", "A 畫尚未交付，所有權仍屬甲（§761 I），乙非所有權人，無所有權受侵害可言。", "丙為甲之履行輔助人，依§224 甲須負責，甲因可歸責事由致給付不能，依§226 I 對乙負損害賠償責任。", "丙與乙無債之關係，給付不能責任由甲負擔，丙不對乙負給付不能損害賠償責任。"], "trap": "白話：派人送貨，送壞了算賣家的帳。陷阱：誤以為所有權在買賣成立時就移轉。", "related": ""}, {"id": "BC102-1", "cat": "B2債務不履行", "year": "102年第1題", "q": "甲向乙建設公司購買預售屋一戶，約定甲應依已完成之工程進度所定付款明細表之規定於工程完工後繳款，半年後乙建設公司資金週轉不靈，財產遭法院查封，甲是否應繼續繳納約定的工程款？", "opts": ["資金週轉不靈，屬可歸責於乙建設公司之事由，甲可拒絕繳納已完工的工程款", "因甲無過失，可免給付之義務，甲可拒絕繳納已完工的工程款", "基於買賣契約，甲得向乙建設公司主張同時履行抗辯，拒絕繳納已完工的工程款", "甲可主張在乙建設公司未繼續進行工程或提出擔保前，得拒絕繳納已完工的工程款"], "correct": 3, "exps": ["乙週轉不靈並非給付不能，乙之債務尚在；甲不得僅因此拒絕繳款，而須依 §265 主張不安抗辯。", "§225 免給付義務須因給付不能且不可歸責；甲之給付（付款）並未不能，不能以無過失免除。", "§264 I 但書：甲依約有先為給付之義務，不得主張同時履行抗辯。", "§265：應先為給付者，若他方財產於訂約後顯形減少而有難為對待給付之虞，他方未為對待給付或提出擔保前，得拒絕自己之給付。"], "trap": "先給付義務人的保護工具是 §265 不安抗辯，不是 §264 同時履行。陷阱：同時履行要「雙方同時」，先給付義務就不適用。", "related": ""}, {"id": "BC102-2", "cat": "C1買賣", "year": "102年第2題", "q": "甲將其所有 A 屋委託乙仲介公司銷售，定價新臺幣 980 萬元，丙經乙仲介公司銷售人員帶看之後，對 A 屋甚是滿意，但是希望價格能降為新臺幣 950 萬元，乃給付新臺幣 20 萬元斡旋金予乙仲介公司作為與屋主斡旋差價之用。下列敘述何者正確？", "opts": ["丙交付新臺幣 20 萬元斡旋金，為定金之給付，推定該買賣契約成立", "丙交付新臺幣 20 萬元斡旋金，為要約之引誘，買賣契約尚未成立", "丙交付新臺幣 20 萬元斡旋金，為新要約，買賣契約尚未成立", "丙交付新臺幣 20 萬元斡旋金，為要約之承諾，買賣契約成立"], "correct": 2, "exps": ["斡旋金並非§248 定金，賣方尚未同意，不能推定契約成立。", "屋主定價是要約之引誘，丙以較低價格並交付斡旋金，已表示購買意思，屬要約而非要約之引誘。", "丙欲降價購買，對屋主定價為變更，§160 II 視為拒絕原要約而為新要約；屋主尚未承諾，買賣契約未成立。", "屋主定價本屬要約之引誘，丙無承諾可言，且變更價格依§160 II 亦非承諾。"], "trap": "白話：斡旋金不是定金，買賣還沒成立，是買方的新開價。陷阱：誤以為付了錢就等於成交。", "related": ""}, {"id": "BC102-3", "cat": "C1買賣", "year": "102年第3題", "q": "甲經由乙仲介向丙購得 A 屋，甲於交屋遷入後始得知 A 屋曾發生非自然死亡事件。關於當事人間的權利義務，下列敘述何者正確？", "opts": ["凶宅為不完全給付，甲得向丙請求損害賠償，但不得要求解除契約", "A 屋並無滅失或減少其通常效用，甲不得向乙主張物之瑕疵擔保責任", "A 屋若符合凶宅之客觀判斷標準，甲得向乙主張 A 屋之價值瑕疵擔保責任，要求解除契約或減少價金", "A 屋若符合凶宅之客觀判斷標準，甲得向乙主張權利瑕疵擔保責任，要求解除契約或減少價金"], "correct": 0, "exps": ["凶宅可構成物之瑕疵（價值瑕疵），買受人依 §359 得解除契約或請求減少價金，並非不得解除。", "凶宅實務上常認屬減少物之價值之瑕疵（§354 I），前提不成立；且瑕疵擔保責任之相對人為出賣人丙，乙為仲介，並非出賣人。", "瑕疵擔保責任之義務人為出賣人，甲應向丙而非仲介乙主張價值瑕疵（§354、§359）。", "權利瑕疵（§349）指第三人對標的物有權利，凶宅屬物之價值瑕疵，並非權利瑕疵。"], "trap": "本題一律給分：選項對責任主體（出賣人丙或仲介乙）與瑕疵類型的表述有爭議。實力重點：凶宅＝價值瑕疵、向出賣人主張；仲介另負說明義務之責任。｜本題依考選部公告一律給分", "related": ""}, {"id": "BC102-4", "cat": "C1買賣", "year": "102年第4題", "q": "甲以新臺幣 1000 萬元向乙購買某特定房屋，買賣契約何時成立？", "opts": ["甲交付新臺幣 1000 萬元於乙時", "乙將該特定房屋交付於甲時", "甲、乙完成交屋及付清價金時", "甲、乙就房屋及價金互相同意時"], "correct": 3, "exps": ["交付價金是「履行」契約的行為，並非契約「成立」時點，成立不需先交付。", "交付房屋同樣是履行行為，非契約成立要件。", "買賣契約不以「完成交屋及付清價金」為成立要件，成立遠早於此。", "依§345Ⅱ，當事人就「標的物」及「價金」互相同意時，買賣契約即為成立（諾成契約），正確。買賣是最典型的諾成契約：意思合致→成立→各負交付義務。"], "trap": "", "related": ""}, {"id": "BC102-5", "cat": "C2租賃", "year": "102年第5題", "q": "甲與乙訂立租賃契約，向乙承租房屋，雙方約定租賃期限為二年，未以書面為之，且甲亦未交付押金。下列敘述何者正確？", "opts": ["租賃契約於甲交付押金後始成立", "租賃契約於甲交付押金後始生效", "租賃契約未以書面為之，視為不定期限之租賃", "租賃契約未以書面為之，出租人得撤銷租賃契約"], "correct": 2, "exps": ["租賃為諾成契約（§421 I），當事人意思一致即成立，押金交付非成立要件。", "押金不影響租賃契約之生效。", "§422：不動產租賃期限逾1年而未以字據訂立者，視為不定期租賃。", "未以書面訂立並無撤銷權規定，只是視為不定期。"], "trap": "白話：口頭約兩年租屋，法律視為不定期，不是無效也不能撤銷。", "related": ""}, {"id": "BC102-13", "cat": "B3連帶債務與保證", "year": "102年第13題", "q": "甲於民國 102 年 1 月 1 日向乙借新臺幣 10 萬元，約定同年 6 月 30 日清償，並由丙於其期限內擔任保證人。下列敘述何者正確？", "opts": ["清償期屆滿，乙允許甲延期清償時，應得丙之同意，否則丙不負保證責任", "丙得隨時通知乙終止保證契約，並於通知到達乙後，不負保證責任", "清償期屆滿後，丙應定一個月以上之期限催告乙向甲請求，丙始能免責", "丙得隨時通知甲終止保證契約，並於通知到達甲後，不負保證責任"], "correct": 0, "exps": ["§755 I：定有期限之債務，債權人允許主債務人延期，除保證人已同意外，保證人不負保證責任。", "§754 I 隨時終止僅適用連續發生之債務且未定期間者，單一借款且定有期限不適用。", "民法並無須催告債權人始能免責之規定；保證人免責事由例如§755 延期未經同意。", "終止保證之通知對象為債權人而非主債務人，且本題非連續債務，不適用§754。"], "trap": "白話：債權人擅自放寬還款時間，保證人若沒同意就不負責。隨時終止保證僅限連續債務。", "related": ""}, {"id": "BC102-15", "cat": "C3居間承攬委任", "year": "102年第15題", "q": "甲承攬乙建設公司之營造工程，在執行承攬事項時，因過失致路人丙受到傷害。下列敘述何者正確？", "opts": ["乙建設公司如非於定作或指示有過失，即不負損害賠償責任", "乙建設公司雖非於定作或指示有過失，但應與甲連帶負損害賠償責任", "乙建設公司賠償丙之損害後，對甲有內部求償權", "乙建設公司應單獨對丙負損害賠償責任，對甲無內部求償權"], "correct": 0, "exps": ["§189：承攬人執行承攬事項不法侵害他人，定作人原則上不負賠償責任，除非定作或指示有過失。", "定作人無過失時不與承攬人連帶，只有定作或指示有過失才可能共同負責。", "乙原則上無須賠償，亦無代甲負責之內部求償問題；§188 III 求償規定適用於僱傭而非承攬。", "乙非單獨負責；無過失時不負責任，有過失時也是與承攬人共同負責。"], "trap": "白話：請人蓋房，工人傷到路人，業主原則上不用賠，除非業主指示有錯。陷阱：與僱用人責任（§188）區別。", "related": ""}, {"id": "BC102-17", "cat": "C2租賃", "year": "102年第17題", "q": "甲房東將其所有 A 屋出租給乙房客，嗣後甲因財務問題將 A 屋出售與丙。下列敘述何者正確？", "opts": ["丙擁有 A 屋的所有權，所以丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約未經公證且超過 5 年者，丙可以要求乙房客搬遷", "若甲、乙之間的房屋租賃契約未定期限者，丙可主張隨時終止租賃契約，要求乙房客搬遷", "租期屆滿後，乙得向丙主張返還二個月的押租金"], "correct": 1, "exps": ["§425 I：租賃物所有權讓與時租約對受讓人繼續存在，丙不得逕要求乙搬遷。", "§425 II：未經公證之不動產租賃，期限逾5年者不適用買賣不破租賃，故丙可要求乙搬遷。", "不定期租賃終止須依§450 II、III 先期通知，並非可隨時終止要求搬遷。", "題幹未載押租金之約定與交付，且是否由丙承受須視租約是否對受讓人繼續存在，故選項不能成立。"], "trap": "白話：買賣不破租賃的例外：未公證且逾5年或不定期。", "related": ""}, {"id": "BC102-20", "cat": "B2債務不履行", "year": "102年第20題", "q": "18 歲的甲騎機車上學途中撞傷騎腳踏車的乙。下列敘述何者正確？", "opts": ["甲未成年，所以不須負損害賠償之責", "由甲的法定代理人負損害賠償之責", "以甲行為時有意思能力為限，與其法定代理人連帶負損害賠償責任", "法定代理人如其監督並未疏懈，或縱加以相當之監督，而仍不免發生損害者，得主張免責"], "correct": 3, "exps": ["§187 I：未成年人有識別能力時須負責，並與法定代理人連帶，未成年不當然免責。", "有識別能力時由行為人與法定代理人連帶負責；僅無識別能力才由法定代理人單獨負責（§187 I）。", "§187 I 之要件為行為時「識別能力」，並非意思能力。", "§187 II：法定代理人監督並未疏懈，或縱加相當監督仍不免發生損害者，不負賠償責任。"], "trap": "現行法差異：112.1.1起成年年齡降為18歲（§12），現行法下18歲之甲已成年，不再適用 §187 法定代理人責任，甲須自負侵權責任；D選項之§187 II免責規定仍存在。", "related": ""}, {"id": "BC102-23", "cat": "C2租賃", "year": "102年第23題", "q": "甲向乙承租 A 地種植柚子樹，後來政府公告將徵收 A 地。下列敘述何者錯誤？", "opts": ["柚子樹為不動產之出產物，屬於乙所有", "柚子為天然孳息，天然孳息的收取權為土地所有權人乙", "政府徵收乙所有的 A 地，範圍包括甲在 A 地上種植的柚子樹", "政府徵收 A 地之補償金歸屬於乙"], "correct": 1, "exps": ["§66 II：不動產出產物尚未分離者為該不動產之部分，柚子樹屬土地之構成部分，歸土地所有人乙。", "§70 I：有收取天然孳息權利之人於權利存續期間內取得孳息，承租人甲於租期內有使用收益權（§421 I），收取權人是甲而非乙。", "徵收標的為土地及其定著物，土地上之樹木屬土地部分，包括在徵收範圍內。", "土地徵收補償金歸土地所有權人乙。"], "trap": "白話：孳息歸『有收取權的人』，不一定是所有人。承租人在租期內可收果實。", "related": ""}, {"id": "BC102-29", "cat": "B2債務不履行", "year": "102年第29題", "q": "甲向乙承租房屋居住，因火災致房屋毀損滅失，乙請求甲損害賠償。下列敘述何者正確？", "opts": ["甲因火災致乙之房屋毀損滅失，構成侵權行為，應負抽象輕過失責任", "甲因火災致乙之房屋毀損滅失，構成侵權行為，應負具體輕過失責任", "甲因火災致乙之房屋毀損滅失，承租人甲僅負重大過失責任", "甲因火災致乙之房屋毀損滅失，承租人甲僅負故意責任"], "correct": 2, "exps": ["§434：承租人失火責任限於重大過失，並非抽象輕過失。", "承租人失火不負具體輕過失責任。", "§434：租賃物因承租人失火而毀損滅失，承租人僅就重大過失負賠償責任。", "承租人重大過失即須負責，並非僅限故意。"], "trap": "白話：租客失火，只有『重大過失』才賠，輕微疏忽不賠。", "related": ""}, {"id": "BC103-9", "cat": "B2債務不履行", "year": "103年第9題", "q": "甲與乙於民國（下同）103 年 10 月 1 日簽訂買賣契約將自有古董錶以新臺幣（下同）20 萬元出售予乙，約定同年 11 月 1 日交付該錶予乙。但同年 10 月 5 日不知情的丙向甲表示願以 25 萬元之價格購買該古董錶，甲同意出售，並當場銀貨兩訖。關於乙如何主張其權利，下列敘述何者正確？", "opts": ["乙基於買賣契約所生之債權得向甲請求交付該錶，並移轉該錶所有權。甲對乙須負可歸責給付不能之損害賠償責任", "乙基於買賣契約所生之債權得向丙請求交付該錶，並移轉該錶所有權。甲對丙須負可歸責給付不能之損害賠償責任", "乙基於所有權得向甲請求交付該錶。甲對乙須負侵權行為之損害賠償責任", "乙基於所有權得向丙請求交付該錶。甲對丙須負侵權行為之損害賠償責任"], "correct": 0, "exps": ["乙對甲有債權（§348），甲將標的物另賣並交付丙致不能履行，為可歸責之給付不能，甲對乙負損害賠償（§226 I）。", "債權具相對性，乙不得向第三人丙請求交付；丙取得所有權並無違法。", "乙未受交付，尚未取得所有權（§761），不能主張所有權；甲之責任為債務不履行，非當然構成侵權行為。", "乙非所有人，不得對丙主張所有物返還；且丙善意買受並受交付，已取得所有權。"], "trap": "一物二賣兩契約都有效，誰先「交付／登記」誰取得所有權；落選買受人只能向出賣人主張債務不履行。陷阱：債權不能對抗第三人。", "related": ""}, {"id": "BC103-11", "cat": "B6侵權行為", "year": "103年第11題", "q": "甲糕餅業者向乙原料供應商購買食用油，用以添加於糕餅之製造，但該油之品質發生問題，經查該油係製油業者丙所生產，丙就其產品應對甲負何種責任？", "opts": ["無過失責任", "故意責任", "中間責任", "不須負責"], "correct": 2, "exps": ["消費者保護法之無過失責任係對「消費者」；甲為業者以之作糕餅製造原料，並非消費者，不適用，且 §191-1 亦非無過失責任。", "§191-1 並非以故意為要件。", "丙為商品製造人，依 §191-1 就其商品之通常使用所致損害負責，但能證明生產無欠缺或已盡相當注意者免責，即舉證責任倒置之中間責任。", "丙為商品製造人，依 §191-1 仍須負責，非不須負責。"], "trap": "中間責任＝推定過失，由加害人舉證自己沒過失；比一般侵權重、比無過失輕。陷阱：消保法的無過失責任只保護「消費者」。", "related": ""}, {"id": "BC103-13", "cat": "B2債務不履行", "year": "103年第13題", "q": "甲將房屋出賣於乙並交付之，但尚未完成移轉登記，乙已支付一半價金，其後該屋因地震而全毀。下列敘述，何者正確？", "opts": ["乙仍應支付全部買賣價金", "甲應承擔一半損失", "乙得解除買賣契約", "甲得主張重建後再交屋"], "correct": 0, "exps": ["本題關鍵：房屋已「交付」乙（§373，危險自交付時移轉買受人），地震為不可抗力，危險由乙承擔，乙仍須支付全部價金（§373，物之危險自交付時起由買受人負擔），正確。", "危險已於交付時移轉乙，甲不須分擔損失。", "危險由乙負擔，乙無從解除（危險負擔原則下，乙仍負對待給付義務）。", "特定物（房屋）滅失後已無從重建返還相同之物，且危險已移轉乙，甲無義務重建。"], "trap": "", "related": ""}, {"id": "BC103-15", "cat": "B6侵權行為", "year": "103年第15題", "q": "甲駕駛機車載乙，與丙發生車禍，致乙跌落機車，身體多處受傷，經查甲、丙均有過失。下列敘述，何者錯誤？", "opts": ["乙得向丙請求損害賠償", "丙不得主張乙應承擔甲之過失", "乙得向甲請求損害賠償", "甲丙為共同侵權行為人"], "correct": 1, "exps": ["丙有過失致乙受傷，乙得依§184 Ⅰ（因故意或過失不法侵害他人權利者，負損害賠償責任）向丙請求賠償，敘述正確。", "官方標準答案為B（即此敘述被評為錯誤）。須留意：§217 Ⅲ 規定與有過失於被害人之「代理人或使用人」準用；題幹甲只是駕駛人、乙為乘客，依文義甲並非乙之代理人或使用人，此答案與條文文義有落差（本題疑有爭議，建議回原卷／考選部公告核對）；考試仍依官方答案B作答。", "甲有過失致乙受傷，乙亦得依§184 Ⅰ向甲請求損害賠償，敘述正確。", "甲、丙之過失共同造成乙之傷害，數人共同不法侵害他人權利者，連帶負損害賠償責任（§185 Ⅰ），可認為共同侵權行為人，敘述正確。"], "trap": "官方答案B。依§217 Ⅲ 文義（與有過失準用於被害人之代理人或使用人），甲非乙之代理人或使用人，B 敘述似屬正確；本題答案與條文有落差，建議回原卷／考選部公告核對，考試以官方答案B為準。", "related": ""}, {"id": "BC103-17", "cat": "C3居間承攬委任", "year": "103年第17題", "q": "關於居間人之報酬及支出費用，下列敘述何者正確？", "opts": ["契約附有解除條件者，於該條件成就前，居間人不得請求報酬", "居間人因媒介應得之報酬，除契約另有訂定或另有習慣外，應由契約當事人雙方平均負擔", "約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，報酬給付義務人得以意思表示請求酌減之", "居間人違反其對於委託人之義務，而為利於委託人之相對人之行為，或違反誠實及信用方法，由相對人收受利益者，不得向委託人請求報酬，僅得請求償還其支出之必要費用"], "correct": 1, "exps": ["§568 II：契約附停止條件者，條件成就前居間人不得請求報酬；解除條件則契約已生效，居間人得請求報酬。", "§569 I：居間人因媒介應得報酬，除契約另有訂定或習慣外，由契約當事人雙方平均負擔。", "§572：報酬過鉅失公平者，須由法院因給付義務人請求酌減，並非自行以意思表示酌減。", "§571：居間人違反義務而收受相對人利益者，不得向委託人請求報酬及償還費用，並非僅能請求費用。"], "trap": "白話：仲介報酬雙方各付一半；報酬過高要找法院酌減。陷阱：停止條件與解除條件的差別。", "related": ""}, {"id": "BC103-18", "cat": "C2租賃", "year": "103年第18題", "q": "甲乙係多年好友，甲長年於國外經商，遂概括委任乙代為管理 A 屋，約定乙就 A 屋得為甲為一切行為。但民法規定，不動產之租賃其期限逾多久者，乙仍須有特別授權？", "opts": ["二年", "一年半", "一年", "半年"], "correct": 0, "exps": ["§534 但書第2款：受概括委任者，不動產之租賃其期限逾『二年』者，須有特別授權；其他須特別授權者尚有不動產出賣或設定負擔（第1款）、贈與（第3款）、和解、起訴、提付仲裁，正確。", "一年半於§534 並無規定，期限門檻是二年。", "『一年』是§422 的門檻：不動產租賃期限逾一年者應以字據訂立，與委任特別授權的二年門檻不同，勿混淆。", "半年於§534 並無規定，期限門檻是二年。"], "trap": "", "related": ""}, {"id": "BC103-19", "cat": "C4其他各種之債", "year": "103年第19題", "q": "關於合夥人出資及合夥財產，下列敘述何者正確？", "opts": ["合夥人之出資，得為金錢，其他財產權或勞務，但不得以信用代之", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任", "合夥人之出資及其他合夥財產，為合夥人全體分別共有之集合財產", "合夥因損失而至資本減少時，除合夥契約有特別訂定外，合夥人有補充之義務"], "correct": 1, "exps": ["§667 II：合夥出資得為金錢、其他財產權，或以勞務、信用或其他利益代之，信用亦可出資。", "§681：合夥財產不足清償合夥債務時，各合夥人對不足額連帶負責。", "§668：合夥人出資及其他合夥財產為合夥人全體之公同共有，並非分別共有。", "§669：合夥因損失致資本減少，除契約特別訂定外，合夥人無補充義務。"], "trap": "白話：合夥財產是『大家一起公同共有』，不夠還債時合夥人連帶補足。陷阱：公同共有與分別共有。", "related": ""}, {"id": "BC103-21", "cat": "B1債之發生與消滅", "year": "103年第21題", "q": "甲、乙、丙共同竊取丁之財物，丁損失共計新臺幣 30 萬元，丁僅原諒其子甲之行為，而免除其債務。下列敘述，何者正確？", "opts": ["乙若全額清償後，得向甲、丙各求償新臺幣 10 萬元", "乙若全額清償後，僅得向丙求償新臺幣 10 萬元", "乙若全額清償後，僅得向丙求償新臺幣 15 萬元", "丁免除甲之債務，乙、丙之債務亦應同生免除效力"], "correct": 1, "exps": ["§276 I：免除甲之債務，只免甲應分擔部分，甲應分擔之部分由債權人丁自負，乙不得向甲求償。", "乙、丙各分擔10萬；丁免除甲之債務後，乙、丙共欠20萬，乙清償後依 §281 I 僅得向丙求償其分擔額10萬。", "丙之分擔額為10萬（§280 平均分擔），甲之分擔部分不轉由乙、丙承擔，故非15萬。", "§276 I：免除僅就該債務人應分擔之部分，他債務人同免責任，其餘部分仍須負責，並非全部免除。"], "trap": "免除連帶債務人之一：只扣掉他的分擔額，其他人還欠剩下的，也不會多負擔他的份。陷阱：「同免責任」只及於應分擔部分。", "related": ""}, {"id": "BC104-6", "cat": "C4其他各種之債", "year": "104年第6題", "q": "乙與甲約定，於甲大學畢業時，乙將贈與甲汽車一輛。此項贈與契約所附約款之性質如何？", "opts": ["終期", "始期", "停止條件", "解除條件"], "correct": 2, "exps": ["終期是指到某一確定期日後法律行為「失效」，本題是到畢業時開始生效，非失效，並非終期。", "始期是指到確定期日後法律行為開始生效；「大學畢業」是否發生並不確定（可能退學、休學、未能畢業），故非「確定」到來的期日，非始期。", "「大學畢業」為「不確定是否會發生」之事實，符合條件之定義；其成就時使贈與「開始生效」，故為停止條件（§99Ⅰ），正確。", "解除條件是條件成就時使「已生效之法律行為失效」；本題是條件成就才生效，非失效，非解除條件。"], "trap": "", "related": ""}, {"id": "BC104-7", "cat": "B2債務不履行", "year": "104年第7題", "q": "債權人甲不得代位其債務人乙，行使乙對第三人丙之何項權利？", "opts": ["不動產登記請求權", "扶養請求權", "實行抵押權", "提起訴訟之權利"], "correct": 1, "exps": ["不動產登記請求權具有財產性，可代位行使，A可代位。", "扶養請求權屬「一身專屬權」（§242但書），甲不得代位乙行使對丙之扶養請求，正確，為應選答案。", "抵押權之實行係財產性權利，可代位行使，C可代位。", "訴訟行為（如起訴請求）係保全財產之行為，原則上可代位行使，D可代位。★一身專屬權不得代位（§242但書）：扶養請求、離婚請求、撤銷婚姻等身分權。"], "trap": "", "related": ""}, {"id": "BC104-8", "cat": "B2債務不履行", "year": "104年第8題", "q": "下列關於因債務不履行而解除契約之敘述，何者正確？", "opts": ["債權人解除契約者，即不得再向債務人請求損害賠償", "因債務人給付不能而為解除時，債權人仍須對債務人為履行之催告始得解除", "如債權人為履行之催告時未定期間，催告後經相當期間，仍得逕為解除", "因解除而互負回復原狀義務時，債務人不得主張同時履行抗辯權"], "correct": 2, "exps": ["§260：解除權之行使，不妨礙損害賠償之請求。", "§256：給付不能時，債權人得逕行解除，無須催告。", "§254 催告未定期限者，催告後經相當期間仍不履行，債權人得解除契約（實務見解）。", "§261：解除後回復原狀準用同時履行規定（§264），債務人得主張同時履行抗辯。"], "trap": "解除契約：給付遲延→先催告再解除（§254）；給付不能→直接解除（§256）；解除不影響賠償（§260）。陷阱：解除後回復原狀也是同時履行。", "related": ""}, {"id": "BC104-10", "cat": "B2債務不履行", "year": "104年第10題", "q": "甲、乙締結由甲出售 10 打市面上普遍流通之紅酒予乙之買賣契約，甲依約於約定期日將標的物運送至乙之住所地時，乙以自己尚未備妥儲藏場所為由拒絕受領。甲不得已乃將物品運回繼續保管，卻於保管期間中該等紅酒全數破裂。下列敘述，何者正確？", "opts": ["即使紅酒之破裂係因甲之重大過失所致，乙亦不得向甲主張損害賠償", "如紅酒之破裂係因不可抗力所致，乙之價金債務消滅", "甲之種類債務尚未特定", "甲之債務成為給付不能"], "correct": 3, "exps": ["§237：債權人受領遲延中，債務人僅就故意或重大過失負責；破裂若因甲重大過失，乙仍得請求賠償。", "受領遲延中危險已移轉債權人負擔，不可抗力致標的物滅失，乙之價金債務並不消滅。", "甲已將紅酒運至乙住所為現實提出（§235），必要行為完成，依 §200 II 種類之債已特定。", "種類之債已特定為該10打紅酒，全數破裂致標的物滅失，甲之債務成為給付不能。"], "trap": "種類之債特定後變成特定之債，標的物滅失就是給付不能；債權人受領遲延時，債務人責任減為故意或重大過失（§237）。陷阱：債權人遲延，風險歸債權人。", "related": ""}, {"id": "BC104-12", "cat": "C5債權讓與", "year": "104年第12題", "q": "甲將其對乙之債權讓與予丙。下列何者會使此債權讓與無效？", "opts": ["甲乙間有不得讓與之特約，但丙為善意之情形", "甲未將證明債權之文件交付予丙", "乙不同意甲丙間之債權移轉行為", "該債權係甲為維持生活所必須之債權"], "correct": 3, "exps": ["§294 II：不得讓與之特約不得對抗善意第三人，丙善意，讓與有效。", "§296 交付證明文件為讓與人義務，未交付不影響讓與效力。", "§297：債權讓與無須債務人同意，只需通知，乙不同意不影響效力。", "§294 I(3)：禁止扣押之債權不得讓與，維持生活所必須之債權屬之，讓與無效。"], "trap": "不得讓與三類：性質上、特約（不得對抗善意第三人）、禁止扣押之債權（§294 I）。陷阱：特約不得讓與遇善意第三人仍有效。", "related": ""}, {"id": "BC104-13", "cat": "B3連帶債務與保證", "year": "104年第13題", "q": "甲、乙、丙三人對丁負有各自分擔比例為三分之一之 300 萬元連帶債務。下列敘述，何者正確？", "opts": ["連帶債務罹於消滅時效後，甲對丁為債務之承認時，該中斷時效之效力及於乙、丙", "甲以時價 300 萬元之珠寶對丁為代物清償時，如事前未得乙、丙同意，甲不得向乙、丙求償", "甲對丁清償 300 萬元時，如乙無資力，則甲得對丙求償 200 萬元", "甲對丁先清償 90 萬元時，甲得對乙、丙分別求償 30 萬元"], "correct": 3, "exps": ["§279：承認非絕對效力事項，連帶債務人之一承認僅對該人生效，不及於乙、丙。", "代物清償為 §274 絕對效力事由，甲清償後依 §281 I 即得向乙、丙求償，無須事前同意。", "§282 I：乙無資力之100萬由甲、丙平均分擔，甲得向丙求償100萬加50萬＝150萬，非200萬。", "§280、§281 I：甲清償之90萬依平均分擔比例（各1/3），得向乙、丙各求償30萬。"], "trap": "連帶債務求償＝依分擔額；有人無資力，缺額由「求償人與其他人按比例分擔」（§282）。陷阱：承認、時效中斷等多為相對效力，只有 §274-§278 事由才絕對。", "related": ""}, {"id": "BC104-14", "cat": "B2債務不履行", "year": "104年第14題", "q": "甲賣 A 屋給乙，尚未移轉交付，嗣後 A 屋因可歸責於丙之事由失火滅失，然甲對 A 屋投有火災保險。下列敘述，何者錯誤？", "opts": ["甲得主張免給付義務，乙亦得主張免對待給付", "此為給付不能，甲、乙間之買賣契約無效", "乙得履行對待給付後，請求甲讓與對失火肇事者丙之損害賠償請求權", "乙得依民法第 225 條第 2 項請求甲交付保險金"], "correct": 1, "exps": ["§225 I：因不可歸責於債務人之事由致給付不能，債務人免給付義務；乙依 §266 I 亦免對待給付。", "給付不能為嗣後不能，契約原本有效，僅債務人免給付義務；§246 契約無效指訂約時即不能。", "§225 II：債務人對第三人有損害賠償請求權者，債權人得請求讓與，乙須履行對待給付。", "§225 II：債權人得請求交付債務人所受領之賠償物，本題以保險金屬代償利益作答（學說對保險金是否屬之有爭議）。"], "trap": "嗣後給付不能＝免給付義務＋代償請求權（§225 II），契約不是無效。陷阱：自始不能（§246）才無效，嗣後不能不是。", "related": ""}, {"id": "BC104-15", "cat": "B6侵權行為", "year": "104年第15題", "q": "甲有 A 車一輛借乙使用，乙因滑手機未注意車前狀況，而與丙酒駕闖紅燈之 B 車相撞，乙重傷，A 車全毀。下列敘述，何者正確？", "opts": ["甲若向丙請求 A 車之損害賠償，丙不得主張甲就 A 車投有保險，應扣除保險金", "乙及丙對 A 車之損害，應負連帶賠償責任", "乙母可向丙請求精神慰藉金", "乙向丙請求賠償時，丙不得主張因乙與有過失，應減輕賠償金額"], "correct": 0, "exps": ["保險金為保險契約對價所得，不屬損益相抵之利益，加害人丙不得以甲投保為由扣除。", "乙之過失與丙之過失均為A車全毀之原因，構成共同加害（§185 I），應連帶賠償。", "乙母非被害人，僅於身分法益被侵害且情節重大時方得依 §195 III 請求；乙僅重傷，並非當然得請求。", "§217 I：被害人與有過失，法院得減輕賠償金額或免除，丙得主張乙與有過失（乙滑手機未注意）。"], "trap": "本題多重給分（A或B）。保險金不扣除、客觀共同侵權連帶，是常考觀念。陷阱：與有過失（§217）可減輕賠償。｜本題依考選部公告多重給分：答 A或B 者均給分", "related": ""}, {"id": "BC104-16", "cat": "C4其他各種之債", "year": "104年第16題", "q": "甲因長期出國，將其所有名貴青花瓷一只交由乙代為保管。乙向丙偽稱該瓷為己有，欲以該瓷與丙所有之名車互易，雙方達成讓與合意並互相交付完畢。下列敘述，何者錯誤？", "opts": ["該互易契約有效", "丙得主張因善意受讓而取得該只青花瓷之所有權", "丙移轉名車所有權之行為於甲承認之前為效力未定", "甲得向乙請求損害賠償"], "correct": 2, "exps": ["互易準用買賣（§398），負擔行為不以處分權限為要件，契約有效。", "乙無處分權，丙善意受讓，並受交付，依 §948 善意取得所有權（甲係自願交付，無 §949 例外）。", "丙處分的是自己所有之名車，為有權處分，生效不須他人承認；效力未定者是無權處分（乙之處分）。", "乙無權處分致甲喪失所有權，甲得依 §184 I 前段或 §179 向乙請求損害賠償或返還利益。"], "trap": "無權處分＋善意受讓：負擔行為有效，處分行為因善意取得而有效；原所有人向無權處分人求償。陷阱：效力未定的是無權處分，不是丙的有權處分。", "related": ""}, {"id": "BC104-17", "cat": "B1債之發生與消滅", "year": "104年第17題", "q": "下列關於抵銷之敘述，何者正確？", "opts": ["甲對乙有金錢債權、乙對甲有因侵權行為而生之損害賠償請求權時，乙不得對甲主張抵銷", "甲對乙有金錢債權、乙對甲有禁止扣押之金錢債權時，甲不得對乙主張抵銷", "甲對乙之金錢債權及乙對甲之金錢債權的履行地不同時，乙不得對甲主張抵銷", "甲對乙之金錢債權及乙對甲之金錢債權的履行地不同時，甲不得對乙主張抵銷"], "correct": 1, "exps": ["§339 禁止抵銷的是「故意侵權行為之債務人」，本題乙為債權人，乙得主張抵銷。", "§338：禁止扣押之債，其債務人不得主張抵銷；甲為禁止扣押債權之債務人，不得抵銷。", "§336：清償地不同亦得抵銷，僅主張人應賠償他方因此所生之損害。", "§336：清償地不同亦得抵銷，甲可主張抵銷但應賠償損害。"], "trap": "禁止抵銷看「誰是債務人」：禁止扣押之債（§338）、故意侵權之債（§339）、約定不得抵銷、性質不許，其債務人不能抵。陷阱：被禁止的是債務人，債權人想抵銷是可以的。", "related": ""}, {"id": "BC104-18", "cat": "C4其他各種之債", "year": "104年第18題", "q": "下列關於民法規定之贈與契約的敘述，何者正確？", "opts": ["為履行道德上之義務的贈與契約，不得撤銷", "為確認贈與意思，贈與契約須以書面定之", "贈與契約為無償契約，贈與人不負瑕疵擔保責任", "贈與人就其重大過失，對於受贈人不負給付不能之責任"], "correct": 0, "exps": ["§408 II：為履行道德上義務之贈與，不得撤銷。", "贈與為不要式契約，口頭即可成立（§406）；書面僅影響撤銷權（§408 II 立有字據不得撤銷）。", "§411：贈與人原則上不負瑕疵擔保責任，但故意不告知或保證無瑕疵者例外，選項說法絕對化。", "§410：贈與人就故意或重大過失仍須負給付不能責任。"], "trap": "白話：贈與人責任輕，但故意或重大過失仍要負責。道德義務之贈與不能反悔。", "related": ""}, {"id": "BC104-19", "cat": "C2租賃", "year": "104年第19題", "q": "下列關於租賃之敘述，何者錯誤？", "opts": ["租金，得以金錢或租賃物之孳息充之", "不動產之租賃契約，其期限逾一年者，應以字據訂立之", "未以字據訂立之不動產之租賃契約，無效", "租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "correct": 2, "exps": ["§421 Ⅱ：租金得以金錢或租賃物之孳息充之，正確。", "§422：不動產之租賃契約，其期限逾一年者，應以字據訂立之，正確。", "§422：未以字據訂立者，『視為不定期限之租賃』，契約仍有效而非無效；本選項說『無效』與條文不符，錯誤，為應選答案。", "§422-1：租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記，正確。"], "trap": "", "related": ""}, {"id": "BC104-20", "cat": "C2租賃", "year": "104年第20題", "q": "甲出租 A 屋給乙。下列敘述，何者正確？", "opts": ["租賃期間內，甲不願修繕 A 屋漏水之水管，乙得不經催告，逕行終止契約", "A 屋因乙未盡善良管理人之注意致失火燒毀，乙應負損害賠償責任", "若 A 屋是輻射屋，乙雖明知仍承租之，其後乙仍得以其危及健康而終止契約", "依民法第 347 條，租賃契約準用買賣契約「物之瑕疵擔保」規定，故甲依法僅擔保 A 屋於交付時無瑕疵即可"], "correct": 2, "exps": ["§430：出租人未修繕，承租人須定相當期限催告，逾期仍不修繕才得終止契約，不得逕行終止。", "§434：承租人失火僅就重大過失負責，未盡善良管理人注意尚不足以負責。", "§424：租賃物有危及承租人健康之瑕疵者，承租人雖於訂約時已知，仍得終止契約。", "§423：出租人須於租賃關係存續中保持租賃物合於約定使用收益之狀態，並非僅擔保交付時無瑕疵。"], "trap": "白話：危害健康的房子，即使租客明知也能退租（§424）。陷阱：失火責任只負重大過失。", "related": ""}, {"id": "BC104-21", "cat": "B3連帶債務與保證", "year": "104年第21題", "q": "關於民法規定之保證契約。下列敘述，何者正確？", "opts": ["債權人第一次請求清償時，僅得向主債務人請求", "保證人不得僅保證主債務人之債務的一部分", "保證契約由債權人及保證人口頭約定即可成立", "主債務人所有之抗辯，非經其同意，保證人不得主張"], "correct": 2, "exps": ["債權人可依§745 直接向保證人請求，僅保證人得主張先訴抗辯，非僅得向主債務人請求。", "保證人可僅就主債務一部分為保證，保證債務不得重於主債務（§741）。", "保證契約為不要式契約，口頭即可成立（最高限額保證另有書面要求，§756-1）。", "§742 I：主債務人所有之抗辯，保證人得主張之，無須主債務人同意。"], "trap": "白話：保證可口頭約定，保證人也可援用主債務人的抗辯。", "related": ""}, {"id": "BC104-31", "cat": "C2租賃", "year": "104年第31題", "q": "乙所有 A 地及建造於 A 地上之 B 屋。甲因其對乙之債權屆期未獲清償，乃向法院聲請拍賣 A 地，並由丙拍定。乙之 B 屋與丙取得之 A 地間的法律關係如何？", "opts": ["視為已有地上權之設定", "視為在 B 屋得使用期限內，有租賃關係", "推定在 B 屋得使用期限內，有租賃關係", "丙得請求乙拆除 B 屋"], "correct": 0, "exps": ["§838-1：土地與建物同屬一人，因強制執行拍賣使土地、建物拍定人各異時，視為已有地上權之設定。", "拍賣情形依 §838-1 為地上權而非租賃；§425-1 租賃推定適用於讓與情形。", "拍賣時為「視為」地上權，並非「推定」租賃。", "因已視為有地上權，丙不得請求拆屋。"], "trap": "同屬一人的土地、房屋：讓與→推定租賃（§425-1）；抵押／強制執行拍賣→視為地上權（§876、§838-1）。陷阱：兩條規定不要混。", "related": ""}, {"id": "BC104-36", "cat": "C4其他各種之債", "year": "104年第36題", "q": "年甫 16 歲之乙受第三人甲贈與房屋一間，乙之父母丙、丁均健在。下列敘述，何者正確？", "opts": ["丙、丁各得單獨管理該房屋", "非得乙之同意，丙、丁不得使用該房屋", "丙、丁得共同將該房屋出租收取租金", "丙為清償自身之債務，得將該房屋出售並移轉所有權"], "correct": 2, "exps": ["未成年子女之特有財產，由父母『共同』管理（§1088 Ⅰ），並非各得單獨管理。", "父母對未成年子女之特有財產有使用、收益之權（§1088 Ⅱ 本文），無須子女同意；選項說『非得乙之同意不得使用』錯誤。", "父母共同管理子女財產（§1088 Ⅰ），將房屋出租收取租金屬管理、收益行為，由丙、丁共同為之，正確。", "§1088 Ⅱ 但書：非為子女之利益，不得處分其特有財產；丙為清償自己債務出售乙之房屋，並非為子女利益，不得為之。"], "trap": "", "related": ""}, {"id": "BC105-3", "cat": "B1債之發生與消滅", "year": "105年第3題", "q": "有關財產權之描述，下列敘述何者正確？", "opts": ["債權是請求權，所以只能約定由特定人請求另一特定人為一定作為，但不能約定不作為", "債權具有相對性，所以當出賣人一屋先後兩賣時，前後買賣契約皆為有效", "基於契約自由原則，當事人可以自由創設物權種類，不受限制", "債權給付之內容，以有財產價格者為限"], "correct": 1, "exps": ["債權不限於作為，不作為（如競業禁止）亦可約定（§199 II）。", "債權具相對性，一屋二賣兩買賣契約皆有效，買受人均得向出賣人請求履行。", "物權法定（§757），當事人不得任意創設物權種類。", "§199 II：債之給付，不以有財產價格者為限。"], "trap": "物權法定、債權自由；債權有相對性，兩個買賣都有效，但只有一人能取得所有權。陷阱：給付不必有財產價格。", "related": ""}, {"id": "BC105-7", "cat": "C1買賣", "year": "105年第7題", "q": "有關法律行為之標的，下列敘述何者正確？", "opts": ["甲乙約定以火星上岩石為贈與標的物，該契約有效", "甲乙約定故宮翠玉白菜為買賣標的物，該契約有效", "甲乙約定甲需於 1 日內完成環島健走行程，該契約有效", "甲乙婚前協議約定，婚後任一方若有出軌行為，必須支付對方新臺幣 100 萬元賠償費，該契約有效"], "correct": 3, "exps": ["火星岩石為自始客觀不能之給付，依 §246 I 契約無效。", "翠玉白菜為國有國寶級文物，其轉讓受法令禁止或限制（§71），買賣契約不能有效成立。", "1日內完成環島行程為自始客觀不能，契約無效（§246 I）。", "婚前協議約定違約金屬契約自由（§153），法院得依 §252 酌減，約定本身不當然違法無效。"], "trap": "標的要可能、確定、適法（§71、§72、§246）。陷阱：客觀不能無效，主觀不能（如出賣他人物）有效。", "related": ""}, {"id": "BC105-9", "cat": "C4其他各種之債", "year": "105年第9題", "q": "甲告知乙，若乙願意出國比賽，不管有無得名次，即贈與乙 200 萬元。試問甲乙間之贈與契約的附款為何？", "opts": ["期限", "條件", "負擔", "約款"], "correct": 1, "exps": ["期限是將來必定到來之事實，出國比賽成否不確定，不屬期限。", "出國比賽為將來客觀不確定事實，贈與以之為生效前提，屬停止條件（§99 I）。", "§412 之負擔是使受贈人負一定給付義務，本題出國比賽為贈與生效之前提，並非受贈人之給付義務。", "『約款』並非民法所定附款類型，附款為條件、期限、負擔。"], "trap": "白話：『如果…才給』是條件；『受贈後要做…』是負擔。", "related": ""}, {"id": "BC105-10", "cat": "B5無因管理", "year": "105年第10題", "q": "甲於出國遊玩期間，適逢颱風來襲，甲家的大門因此破損，門戶洞開。鄰居乙擔心甲家遭遇盜賊，乃好心召來工匠為其修繕，支出 8 千元。試問乙得依下列何種法律關係向甲請求返還 8 千元？", "opts": ["無因管理", "侵權行為", "不當得利", "債務不履行"], "correct": 0, "exps": ["無因管理（§172）：未受委任、並無義務而為他人管理事務；乙為出國之甲修繕破損大門，符合本人利益，依§176 Ⅰ（管理事務利於本人且不違反本人意思者，得請求償還必要或有益費用及自支出時起之利息），乙得請求返還8千元，正確。", "侵權行為（§184）是因故意或過失不法侵害他人權利而負賠償責任；乙是為甲之利益出資修繕，並未侵害甲，無從成立。", "不當得利（§179）要件為「無法律上之原因」而受利益致他人受損害；甲雖因修繕受利益，但此利益有無因管理（§172、§176）作為法律上原因，欠缺「無法律上之原因」，乙應依無因管理請求償還費用，而非不當得利。", "債務不履行以當事人間有債之關係（如契約）為前提；乙與甲間並無契約或約定義務，無從主張債務不履行。"], "trap": "", "related": ""}, {"id": "BC105-11", "cat": "B1債之發生與消滅", "year": "105年第11題", "q": "有關契約之敘述，下列何者正確？", "opts": ["契約為事實行為的一種", "契約得因要約交錯之方式成立", "契約皆須以書面方式為之，方得以成立", "基於契約自由原則，醫生得拒絕醫治病情危急的情敵"], "correct": 1, "exps": ["契約屬「法律行為」（需意思表示），非事實行為（事實行為不以意思表示為要素，如占有、無因管理）。", "依§153，要約交錯：雙方各自獨立發出的要約，在不知對方要約之情況下，若內容一致，可構成契約成立，正確。", "契約原則上為不要式，除法律明定書面要式者外，口頭即可成立，選項過於絕對，錯誤。", "醫師有緊急醫療義務（醫師法等公法），不得以個人好惡拒絕急救，本選項以「契約自由」主張可拒絕，忽略公法義務的限制，錯誤。"], "trap": "", "related": ""}, {"id": "BC105-12", "cat": "C1買賣", "year": "105年第12題", "q": "依現行民法規定，有關違反法定要式規定之法律行為效力，下列何者應為無效？", "opts": ["會員已交付首期會款，但未訂立會單", "不動產買賣之債權契約，未經書面公證", "不動產租賃契約期限約定 2 年，且未以書面簽訂", "人事保證契約未以書面簽訂"], "correct": 3, "exps": ["合會（§709-3）：合會應訂立會單，但Ⅲ規定「會員已交付首期會款者，雖未依規定訂立會單，其合會契約視為已成立」；本選項已交付首期會款，合會契約視為成立，並非無效。", "不動產買賣債權契約：§166-1 雖規定以負擔不動產物權移轉義務為標的之契約應由公證人作成公證書，但該條施行日期由行政院會同司法院另定、迄未施行，現行法下不公證並不影響債權契約效力（且該條Ⅱ亦規定已合意並完成登記者仍為有效），故非無效。", "不動產租賃（§422）：期限逾一年者應以字據訂立，未以字據訂立者「視為不定期限之租賃」；本選項期限2年未書面，法律效果是視為不定期限租賃，契約仍然有效，並非無效。", "人事保證（§756-1 Ⅱ）：人事保證契約應以書面為之；依§73，法律行為不依法定方式者無效（但法律另有規定者除外），本條並無例外規定，故未以書面簽訂即為無效，正確。"], "trap": "", "related": ""}, {"id": "BC105-13", "cat": "B4不當得利", "year": "105年第13題", "q": "有關不當得利所應返還之客體，下列何者錯誤？", "opts": ["原物所生之孳息", "受領之原物或原權利", "原物因受領人特殊能力導致之增值", "原物毀損後，受益時之價額"], "correct": 2, "exps": ["§181：受領人除返還所受利益，本於該利益更有所取得者並應返還，孳息屬之。", "§181：原物仍存在者，應返還原物或原權利。", "§181 所指返還者為「本於該利益」所取得，受領人以特殊能力使原物增值，通說不屬應返還之客體。", "§181 但書：依利益性質不能返還者，應償還其價額，價額以受益時為準。"], "trap": "不當得利返還：原物、孳息、代位物，不能返還才償還價額；受領人自己的努力成果不用還。", "related": ""}, {"id": "BC105-14", "cat": "C2租賃", "year": "105年第14題", "q": "甲欲向乙租屋 3 年，雙方僅用通訊軟體 Line 互相協商，乙已於對話中允諾，但後來丙出更高租金，於是乙改將該屋出租給丙並交付之，後來丙得乙之同意將該屋再出租給丁，某日丁因大意未關爐火將該屋燒毀，下列敘述何者正確？", "opts": ["乙可以向丁主張侵權行為責任", "甲可主張乙丙之租賃契約未以書面簽訂，因此無效", "丙可以向丁主張侵權行為責任", "甲可以向丙主張有優先締約權，因此乙丙之租賃契約對甲係屬無效"], "correct": 0, "exps": ["乙為房屋所有人，丁過失失火燒毀房屋侵害所有權，乙得依§184 I 前段向丁請求侵權行為責任。", "§422：未以書面訂立僅視為不定期租賃，並非無效，且甲非乙丙租約之當事人。", "丙非所有人，其與丁間之損害主要屬轉租契約責任，不能逕以§184 I 前段主張。", "租賃無優先締約權，甲不得主張乙丙租約無效。"], "trap": "白話：房子被燒，所有人（乙）可向直接侵害人求償。陷阱：未書面租約不是無效。", "related": ""}, {"id": "BC105-15", "cat": "B2債務不履行", "year": "105年第15題", "q": "依侵權行為請求損害賠償之說明，下列敘述何者正確？", "opts": ["純粹經濟上之損失亦屬於一種損害，與權利受損一樣，得依民法第 184 條第 1 項前段主張之", "債權亦屬於一種財產權，被侵害時，祗得依民法第 184 條第 1 項前段主張，而不得依同條項後段主張之", "我國侵權行為之保護客體僅限於權利，未及於利益", "故意以背於善良風俗之方法加損害於他人之利益，受害人亦得依侵權行為主張之"], "correct": 3, "exps": ["純粹經濟上損失並非權利受損，不能直接依 §184 I 前段主張，須依後段或 §184 II。", "債權被侵害，無論故意或過失，可依前段；若故意以背於善良風俗之方法為之，亦可依後段。", "§184 I 後段、II 已保護利益。", "§184 I 後段：故意以背於善良風俗之方法加損害於他人者，亦負賠償責任，利益亦受保護。"], "trap": "§184 三層：前段保護權利、後段保護利益（要故意悖俗）、II 違反保護他人法律。陷阱：純粹經濟損失原則上不賠。", "related": ""}, {"id": "BC105-16", "cat": "B2債務不履行", "year": "105年第16題", "q": "有關民法第 250 條規定之違約金類型有「損害賠償總額預定違約金」與「懲罰性違約金」兩種，下列敘述何者正確？", "opts": ["「損害賠償總額預定違約金」，倘若債務人有債務不履行發生，惟債權人所受實際損害遠低於約定之額度時，債權人即不得請求此一違約金金額", "「懲罰性違約金」，只要債務人有債務不履行發生時，即便債權人未因此而受損害，債權人仍得請求此一違約金金額", "「損害賠償總額預定違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，亦得請求其他損害賠償金額", "「懲罰性違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，不得請求其他損害賠償金額"], "correct": 1, "exps": ["賠償總額預定性違約金，債權人不必證明實際損害即可請求，法院僅得依 §252 酌減。", "懲罰性違約金（§250 II 後段）：債務不履行即得請求違約金，不須證明損害，並得另請求損害賠償。", "§250 II 前段：賠償總額預定性違約金，視為損害賠償總額，不得另請求損害賠償。", "懲罰性違約金的特色就是違約金外還可請求損害賠償。"], "trap": "預定賠償總額＝違約金取代賠償；懲罰性＝違約金外還能另請求；酌減（§252）兩者都可能適用。", "related": ""}, {"id": "BC105-17", "cat": "B2債務不履行", "year": "105年第17題", "q": "若買賣標的物為特定物時，買受人不得請求下列那一種物的瑕疵擔保之法定效果？", "opts": ["減價", "解約", "損害賠償", "另行交付他物"], "correct": 3, "exps": ["物之瑕疵擔保，買受人得請求「減少價金」（§359），正確（可請求）。", "買受人得解除契約（§359），正確（可請求）。", "若出賣人故意不告知瑕疵，買受人得請求損害賠償（§360），正確（可請求）。", "特定物買賣，標的是「該特定物」，買受人不得請求另行交付「他物」（他物是不同的特定物或種類物，特定物買賣本就以該特定物為標的，不能要求替換他物）；只有「種類物」買賣才有請求另行交付無瑕疵之物（§364）的選項，正確。"], "trap": "", "related": ""}, {"id": "BC105-18", "cat": "B2債務不履行", "year": "105年第18題", "q": "甲將透天厝（不含基地）立約賣給乙後，尚未交付予乙前，即逢超級強烈颱風來襲，致透天厝完全倒塌。下列敘述何者正確？", "opts": ["乙免給付價金予甲", "甲仍負有交屋之義務", "甲仍得請求乙支付價金", "乙得向甲主張侵權行為"], "correct": 0, "exps": ["颱風為不可歸責雙方之事由（危險負擔，§266），房屋未交付前滅失，出賣人（甲）免給付義務，買受人（乙）亦免給付對待給付（價金），乙免付，正確。", "特定物已滅失（颱風倒塌），甲無從再交屋，給付客觀不能，甲之交付義務消滅，並非「仍負有交屋義務」。", "依§266，不可歸責雙方的危險負擔，甲乙雙方互免，甲不得再請求乙支付價金，選項錯誤。", "颱風倒塌不可歸責於甲，甲並無過失或故意，乙無從主張甲的侵權行為。"], "trap": "", "related": ""}, {"id": "BC105-19", "cat": "C4其他各種之債", "year": "105年第19題", "q": "有關贈與契約之敘述，下列何者正確？", "opts": ["贈與契約一旦成立後，贈與人不得任意撤銷之", "贈與契約為要式契約，因此必須作成贈與契約書", "贈與屬於恩惠行為，故成立贈與契約無須受贈人之同意", "因贈與契約為無償契約，故原則上贈與人不負瑕疵擔保責任"], "correct": 3, "exps": ["§408 Ⅰ：贈與物之權利『未移轉前』，贈與人得撤銷其贈與；故成立後尚可任意撤銷，僅§408 Ⅱ 所列經公證之贈與、或為履行道德上義務而為之贈與例外（不是『書面』），選項說『不得任意撤銷』錯誤。", "贈與為不要式契約，口頭即可成立，不必作成書面，選項錯誤。", "贈與（§406）須『一方以自己財產無償給與他方，他方允受之』，需受贈人允受，雙方意思一致才成立，並非無須受贈人同意。", "§411：贈與之物或權利如有瑕疵，贈與人不負擔保責任（無償，責任從輕），但故意不告知瑕疵或保證無瑕疵者，須賠償受贈人因瑕疵所生之損害，正確。"], "trap": "", "related": ""}, {"id": "BC105-20", "cat": "B2債務不履行", "year": "105年第20題", "q": "依民法之規定，承租人因下列何種情形致失火而使租賃物毀損、滅失者，應對出租人負損害賠償責任？", "opts": ["重大過失", "不可抗力", "具體輕過失", "抽象輕過失"], "correct": 0, "exps": ["§434：承租人因重大過失致失火而使租賃物毀損滅失，應對出租人負賠償責任。", "不可抗力係不可歸責，承租人不負責任。", "§434 限於重大過失，具體輕過失不負責。", "§434 限於重大過失，抽象輕過失不負責。"], "trap": "白話：租客失火，只賠重大過失。", "related": ""}, {"id": "BC106-1", "cat": "C1買賣", "year": "106年第1題", "q": "下列有關不動產買賣之敘述，何者錯誤？", "opts": ["不動產仲介公司用與不特定之消費者簽定同類委託銷售不動產而先予擬定之契約，屬於定型化契約", "不動產買賣除標的物及價金外，該房地之交付時間、所有權移轉登記時期、價金之給付方式等，通常亦為契約成立之必要之點", "居間人已為報告或媒介而契約不成立者，居間人支出之費用均得請求償還", "約定之違約金是否過高，可斟酌當事人所受損害情形，及債務人如能依約履行時債權人可享受之一切利益"], "correct": 2, "exps": ["消保法§2 ⑦：企業經營者為與不特定消費者訂立同類契約所提出之契約條款，屬定型化契約，仲介公司先予擬定之委託契約屬之。", "依§153 I 當事人就必要之點意思一致契約成立；實務上不動產買賣之交付時間、移轉登記時期、價金給付方式等常被認為必要之點。", "§569 II：居間人所支出之費用，非經約定不得請求償還，契約不成立時亦同，並非『均得』請求。", "§252：違約金過高者，法院得減至相當數額，並斟酌債務人如能依約履行時債權人可享受之一切利益。"], "trap": "白話：仲介花的錢，除非先約定，否則不能報銷。陷阱：『均得請求』太絕對。", "related": ""}, {"id": "BC106-3", "cat": "C4其他各種之債", "year": "106年第3題", "q": "甲乙是大四同班同學，甲平常騎乘其父丙所贈與之電動機車作為交通工具。某日乙向甲借用該部電動機車，以接送其高中同學到學校所在地之風景名勝地區遊玩。下列有關甲乙間之契約關係的敘述何者錯誤？", "opts": ["甲乙間所訂立之契約為單務契約，乙之返還義務與甲之容忍使用義務間，無同時履行抗辯權之適用", "甲乙間所訂立之契約為要物契約，以物之交付為契約成立之特別要件，必待借用物之交付，契約始得成立", "甲乙間所訂立之契約為使用借貸契約，乙非經甲之同意，不得允許第三人使用該借用物，否則甲得終止契約", "甲乙間所訂立之契約為使用借貸契約，甲對乙不以故意不告知借用物之瑕疵為限，承擔瑕疵擔保的責任，乙因此瑕疵所受之損害，得向甲請求賠償"], "correct": 3, "exps": ["使用借貸為無償單務契約，借用人返還義務與貸與人容忍使用義務無對價關係，無§264 同時履行抗辯。", "§464：使用借貸為要物契約，須交付借用物始成立。", "§467 II：借用人非經貸與人同意不得允許第三人使用借用物，違反時貸與人得依§472 終止契約。", "§466：貸與人僅就故意不告知借用物瑕疵致借用人受損害者負賠償責任，並非不以故意為限。"], "trap": "白話：免費借東西，貸與人只在『故意隱瞞瑕疵』時才賠。陷阱：借貸是要物契約。", "related": ""}, {"id": "BC106-8", "cat": "C1買賣", "year": "106年第8題", "q": "依民法規定，關於不動產買賣，下列敘述何者正確？", "opts": ["應作成公證書", "非經登記，不生效力", "非經交付買賣之不動產，不生效力", "因當事人就標的物及其價金互相同意而成立"], "correct": 3, "exps": ["一般不動產買賣契約（債權行為）不須公證，選項錯誤。", "「非經登記不生效力」適用於不動產「物權」變動（§758），而非「買賣契約」（債權行為）本身；買賣契約不以登記為生效要件，選項混淆債權行為與物權行為。", "買賣契約為諾成契約，不以交付為成立或生效要件，選項錯誤。", "依§345Ⅱ，買賣契約於當事人就標的物及價金互相同意時成立（諾成契約），正確。"], "trap": "", "related": ""}, {"id": "BC106-9", "cat": "C4其他各種之債", "year": "106年第9題", "q": "甲有 A 屋，登記為 A 屋所有人。甲將 A 屋贈與乙女。試問，下列敘述何者正確？", "opts": ["非經交付 A 屋，該贈與不生效力", "該贈與應以書面為之", "甲移轉 A 屋所有權予乙前，得撤銷該贈與", "甲遲延交付 A 屋予乙時，乙得請求遲延損害賠償"], "correct": 2, "exps": ["依§406，贈與是當事人約定一方無償給與財產、他方允受之契約，意思表示合致即成立生效（諾成契約），不以交付為生效要件，選項錯誤。", "§406 只要求雙方約定「無償給與」並「允受」，並未規定贈與須以書面為之；書面與否也不是§408 撤銷權的判準（現行例外只有公證或履行道德義務），選項錯誤。", "依§408Ⅰ，贈與物之權利未移轉前，贈與人得撤銷其贈與；本題A屋所有權尚未移轉給乙，甲得撤銷，正確。（例外：依§408Ⅱ，經公證之贈與或為履行道德上義務而為之贈與，不得撤銷。）", "依§409Ⅱ，贈與人給付遲延時，受贈人只能請求交付贈與物，「不得請求遲延利息或其他不履行之損害賠償」（贈與是無償契約，責任從輕；§410 另規定贈與人僅就故意或重大過失負給付不能之責），所以乙不能請求遲延損害賠償，選項錯誤。"], "trap": "", "related": ""}, {"id": "BC106-10", "cat": "C3居間承攬委任", "year": "106年第10題", "q": "依民法規定，關於受任人之權利及義務，下列敘述何者正確？", "opts": ["受任人受有報酬者，應以善良管理人之注意，處理委任事務", "受任人未處理委任事務前，不得向委任人請求預付處理委任事務之必要費用", "受任人必有代理權", "受任人不得隨時終止委任契約"], "correct": 0, "exps": ["§535：受任人受有報酬者，應以善良管理人之注意處理委任事務；無報酬者僅負與處理自己事務同一之注意。", "§545：受任人因處理委任事務，得請求委任人預付必要費用，不必等到處理後才請求。", "§167：代理權授與是另一個行為，委任契約本身不當然伴隨代理權，委任人可只委託事實行為而不授與代理權。", "§549 I：當事人任何一方得隨時終止委任契約，受任人也不例外（但於不利委任人之時期終止須賠償，§549 II）。"], "trap": "委任是處理事務的債權契約，代理是對外效力的授權，兩者要分開想。陷阱：有償無償決定注意義務高低；§549 雙方都能隨時終止。", "related": ""}, {"id": "BC106-12", "cat": "B6侵權行為", "year": "106年第12題", "q": "甲有 A 地，登記為 A 地所有人。甲與乙成立承攬契約，由乙承攬 A 地之整地工作。乙不僅整地有瑕疵，而且還趁整地之餘，將有毒廢棄物掩埋於 A 地之下。試問，下列敘述何者錯誤？", "opts": ["甲得請求乙修補瑕疵", "甲依侵權行為法之規定（民法第 184 條第 1 項前半段），得請求乙回復原狀，移除掩埋在 A 地下之有毒廢棄物", "甲得以掩埋有毒廢棄物乃違反保護義務為由，解除契約", "甲得依民法第 495 條第 1 項規定，請求乙賠償 A 地因掩埋有毒廢棄物所減損之價額"], "correct": 3, "exps": ["§493 I：承攬人完成之工作有瑕疵，定作人得定相當期限請求修補。", "掩埋毒物侵害甲之 A 地所有權，成立§184 I 前段侵權行為，依§213 I 得請求回復原狀（移除廢棄物）。", "乙違反保護甲財產之附隨義務，屬不完全給付之加害給付（§227），債權人得依法解除契約。", "§495 I 賠償的是「瑕疵本身」（整地瑕疵）所生損害；掩埋毒物致 A 地減損屬瑕疵以外的加害損害，應依§227 II 或侵權行為請求，非§495 I。"], "trap": "承攬瑕疵損害（§495）只管工作物自己的瑕疵；瑕疵之外另外造成的損害屬加害給付。陷阱：看到「承攬+損害賠償」就選§495。", "related": ""}, {"id": "BC106-14", "cat": "B3連帶債務與保證", "year": "106年第14題", "q": "甲對乙負有 1,000 萬元借款債務，丙為甲對乙所負該債務之連帶保證人。試問，下列敘述何者正確？", "opts": ["乙得直接請求丙履行 1,000 萬元保證債務", "乙僅得同時請求甲與丙履行債務", "丙連帶責任之約定無效", "丙負最終責任"], "correct": 0, "exps": ["連帶保證人與主債務人負連帶責任（§272、§273），且不得主張先訴抗辯（§745、§746①），債權人得直接請求丙履行全部保證債務。", "§273 I：債權人得對連帶債務人之一人或數人或全體，同時或先後請求全部或一部給付，並非只能同時請求。", "連帶責任可由當事人明示約定而成立（§272 II），該約定有效。", "主債務人甲才是終局責任人；丙清償後依§749 取得債權人對甲之權利，可向甲求償。"], "trap": "連帶保證＝保證人放棄先訴抗辯，債權人可直接找保證人。陷阱：保證人付錢後是向主債務人求償，不是最終負責的人。", "related": ""}, {"id": "BC106-15", "cat": "C4其他各種之債", "year": "106年第15題", "q": "關於合會，下列敘述何者正確？", "opts": ["法人亦得為合會會員", "會首得兼為同一合會之會員", "限制行為能力人亦得為會員", "自然人不得同時為數合會之會首"], "correct": 2, "exps": ["§709-2 I：會首及會員限於自然人，法人不得為合會會員。", "§709-2 III：會首不得兼為同一合會之會員。", "§709-2 II：無行為能力人及限制行為能力人不得為會首，但得為會員，故限制行為能力人可為會員。", "民法未禁止自然人同時擔任數個合會之會首，此敘述為民法所無之限制。"], "trap": "合會只有自然人，會首要完全行為能力。陷阱：限制行為能力人「能當會員、不能當會首」；會首不能兼會員。", "related": ""}, {"id": "BC106-30", "cat": "B6侵權行為", "year": "106年第30題", "q": "19 歲之甲經父母同意受僱於乙公司。某日甲受乙公司之吩咐，將貨物送到客戶手中。途中行經十字路口，甲闖紅燈致丙在綠燈穿越時受傷，經該地區行車事故鑑定委員會認定，認定甲應負全部之肇事責任。就此情形，下列敘述何者錯誤？", "opts": ["甲是未成年人，對於丙之損害，無須負賠償責任", "丙得主張乙與甲負連帶損害賠償責任", "丙得主張甲及其父母負連帶損害賠償責任", "乙賠償丙之損害後，得向甲求償"], "correct": 0, "exps": ["甲雖未成年，仍須就自己的侵權行為負責，有識別能力時與法定代理人連帶負責（§184、§187 I），並非無須賠償。", "§188 I：受僱人因執行職務不法侵害他人，僱用人與行為人連帶負賠償責任。", "§187 I：未成年甲有識別能力，與法定代理人連帶負責，丙得主張。", "§188 III：僱用人賠償後，對為侵權行為之受僱人有求償權。"], "trap": "現行法差異：112.1.1起成年年齡降為18歲，現行法下19歲之甲已成年，丙不得依 §187 向其父母求償（C選項情形不成立）；A選項仍為錯誤敘述，本題答案不變。", "related": ""}, {"id": "BC106-31", "cat": "B2債務不履行", "year": "106年第31題", "q": "就賣方甲與買方乙間訂立之買賣契約，下列敘述何者錯誤？", "opts": ["該買賣標的物因可歸責於甲之事由而滅失，致給付不能者，乙得解除契約並請求損害賠償", "該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，甲得免除該物之給付義務", "該買賣標的物因不可歸責甲乙之事由而滅失，致給付不能者，乙得免除價金支付之義務", "該買賣標的物因可歸責乙之事由而滅失，致給付不能者，甲不得向乙請求價金之支付"], "correct": 3, "exps": ["（敘述正確，非答案）. 標的物因可歸責於出賣人甲而滅失，屬§226Ⅰ可歸責於債務人之給付不能，乙得請求賠償損害；依§256，債權人於有§226 情形時並得解除契約（法條未要求先催告），此敘述正確，不是答案。", "（敘述正確，非答案）. 因不可歸責於雙方之事由致給付不能，依§225Ⅰ債務人（甲）免給付義務，此敘述正確，不是答案。", "（敘述正確，非答案）. 因不可歸責於雙方之事由致一方給付全部不能，依§266Ⅰ他方（乙）免為對待給付義務（即免付價金），此敘述正確，不是答案。", "標的物因可歸責於買受人乙之事由而滅失，依§267 甲（給付不能之一方）仍得請求對待給付（價金），但應扣除其因免給付義務所得之利益；選項說「甲不得向乙請求價金」與§267 相反，敘述錯誤，故為應選答案。"], "trap": "", "related": ""}, {"id": "BC106-36", "cat": "C2租賃", "year": "106年第36題", "q": "下列有關租賃契約之敘述，何者錯誤？", "opts": ["租賃關係存續中，出租人未使租賃物合於約定使用收益狀態，致承租人未達租賃目的者，承租人得拒絕給付租金", "出租人將已交付承租人之租賃物的所有權讓與他人，承租人與受讓人間仍須另立租賃契約始發生租賃關係", "定有期限之租賃契約，當事人約定得提前終止者，於終止契約前應先期通知", "租賃契約經公證並附有逕受強制執行條款者，當承租人有不付租金、租期屆滿拒不搬遷，或房東不返還押租金時，當事人可直接申請強制執行"], "correct": 1, "exps": ["§423：出租人應保持租賃物合於約定使用收益之狀態；出租人未履行致承租人未達租賃目的，承租人得拒絕給付租金（同時履行抗辯，§264）。", "§425 I：出租人於租賃物交付後將所有權讓與第三人者，租賃契約對受讓人仍繼續存在（買賣不破租賃），無須另訂契約。", "§453：定有期限之租賃，約定得提前終止者，終止契約應依§450 III 先期通知。", "公證書載明逕受強制執行者，得為執行名義（公證法§13、強制執行法§4 I④）；不付租金、拒不遷讓、不返還押租金均屬可載明事項。"], "trap": "買賣不破租賃是法律效果，不須新訂契約，受讓人當然承受。陷阱：§425 要求「交付後」才適用。", "related": ""}, {"id": "BC106-38", "cat": "B2債務不履行", "year": "106年第38題", "q": "下列有關契約解除之敘述，何者錯誤？", "opts": ["契約解除時，當事人雙方負回復原狀之義務", "解除權之行使，不妨礙損害賠償之請求", "房屋買賣契約解除時，原買受人已支出之裝潢費用均得請求出賣人返還", "解除權之行使，得以送達訴狀繕本予他方當事人之方法為之"], "correct": 2, "exps": ["§259：契約解除時，當事人雙方負回復原狀之義務（如返還受領之給付物、金錢附加利息等），正確。", "§260：解除權之行使，不妨礙損害賠償之請求，兩者可併行主張，正確。", "買受人所支出之費用能否請求，依§259 ⑤：就返還之物已支出必要或有益之費用，得於他方受返還時「所得利益之限度內」請求返還；故僅限「必要或有益」費用，且以出賣人受返還所得利益為限，並非支出之裝潢費用「均得」請求返還，本選項過於絕對，錯誤，為應選答案。", "解除權之行使，應向他方當事人以意思表示為之（§258 Ⅰ）；實務上認為以訴狀送達他方亦可視為已為解除之意思表示（此點為實務見解，非條文明文），正確。"], "trap": "", "related": ""}, {"id": "BC107-4", "cat": "B1債之發生與消滅", "year": "107年第4題", "q": "種類之債係以不特定物之給付為標的，為使債之實現，於履行前應為特定。下列有關種類之債特定之方法，何者正確？", "opts": ["種類之債只能依法定方法為特定", "往取之債於債務人具體指定給付物，並將準備給付之情事，通知債權人時，種類之債即為特定", "送赴之債於債務人將給付物送至債權人住所地，使債權人處於得隨時受領之狀態時，種類之債即為特定", "赴償之債於債務人交付其物於運送之人時，種類之債即為特定"], "correct": 1, "exps": ["特定方法不限法定，經債權人同意指定其物者亦可（§200 II）。", "往取之債，債務人具體指定給付物並通知債權人準備給付（§235 但書），必要行為完成，種類之債即特定。", "送赴之債須在債權人住所地現實提出給付（§235 本文）；僅使債權人處於得受領之狀態，是往取之債準備給付通知之情形。", "交付運送人屬寄送之債，並非赴償之債。"], "trap": "三種：往取（指定＋通知）、送赴（現實提出）、寄送（交付運送人）。陷阱：特定時點以債務人必要行為完成為準。", "related": ""}, {"id": "BC107-11", "cat": "B6侵權行為", "year": "107年第11題", "q": "16 歲之甲於騎車上學時，與正在送貨之某公司送貨員乙（30 歲）擦撞，並導致路人丙受傷。若甲與乙均為違規駕駛，下列敘述何者正確？", "opts": ["丙僅得請求財產上之損害賠償，不得主張非財產上損害賠償", "甲為有識別能力人，故丙僅得向甲單獨請求損害賠償，不得向甲之父母求償", "我國並無僱傭人責任之規範，僱傭乙之公司不必負損害賠償責任", "甲與乙對丙構成共同侵權行為，均須對丙負連帶損害賠償責任"], "correct": 3, "exps": ["§195 I：身體、健康受侵害，得請求非財產上損害賠償。", "§187 I：甲有識別能力，與其法定代理人連帶負責，丙得向其父母求償（父母可依 §187 II 舉證免責）。", "§188 I：民法規定僱用人責任，公司須與受僱人連帶負責。", "§185 I：數人共同不法侵害他人權利，連帶負損害賠償責任，甲、乙共同造成丙受傷。"], "trap": "共同侵權（§185）＝連帶；未成年人有識別能力要負責並連帶法定代理人；僱用人亦連帶（§188）。", "related": ""}, {"id": "BC107-14", "cat": "C4其他各種之債", "year": "107年第14題", "q": "下列有關贈與之敘述，何者正確？", "opts": ["贈與係單獨行為", "贈與以物之交付為要件，於物之交付後，贈與行為才為生效", "經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與", "贈與得附有負擔"], "correct": 3, "exps": ["依§406，贈與是當事人約定一方無償給與財產、他方允受之契約，須雙方意思表示合致（受贈人須允受），不是單獨行為，選項錯誤。", "依§406，贈與於雙方約定「無償給與」並經允受時即成立生效（諾成契約），不以物之交付為要件，選項錯誤。", "依§408Ⅱ，經公證之贈與（或為履行道德上義務而為之贈與），不適用§408Ⅰ 的任意撤銷，贈與人不得在權利移轉前隨時撤銷；選項說「得隨時撤銷」正好相反，錯誤。", "依§412Ⅰ，贈與可以附有負擔；若贈與人已為給付而受贈人不履行其負擔，贈與人得請求受贈人履行負擔，或撤銷贈與，正確。"], "trap": "", "related": ""}, {"id": "BC107-16", "cat": "B6侵權行為", "year": "107年第16題", "q": "關於人格權保護，下列敘述，何者錯誤？", "opts": ["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之", "名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲", "債務人因債務不履行，致債權人之人格權受侵害者，不得請求損害賠償", "生命權受侵害時，配偶得請求損害賠償與慰撫金"], "correct": 2, "exps": ["§18 I：人格權受侵害，得請求法院除去其侵害；有受侵害之虞時，得請求防止之。", "釋字第656號：命加害人公開道歉，如未涉及自我羞辱等損及人性尊嚴者，不違憲。", "§227-1：債務不履行致人格權受侵害，準用 §192-§195、§197，債權人得請求賠償，包括慰撫金。", "§194：不法侵害他人致死者，配偶等得請求非財產上損害賠償相當金額。"], "trap": "人格權：§18（排除妨害）、§195（慰撫金）、§227-1（債務不履行人格權）。陷阱：契約責任也可能請求慰撫金。", "related": ""}, {"id": "BC107-17", "cat": "C4其他各種之債", "year": "107年第17題", "q": "關於僱傭契約，下列敘述，何者錯誤？", "opts": ["僱傭契約之專屬性較低，故僱用人得將其勞務請求權讓與第三人，無需受僱人同意", "受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償", "定期之僱傭契約，若當事人之一方遇有重大事由，仍得於期限屆至前終止契約", "受僱人因執行職務，不法侵害他人之權利者，原則上係由僱用人與受僱人連帶負損害賠償責任"], "correct": 0, "exps": ["§484 I：僱用人非經受僱人同意，不得將其勞務請求權讓與第三人，故需受僱人同意。", "§487-1 I：受僱人服勞務，因非可歸責於自己之事由致受損害者，得向僱用人請求賠償。", "§489 I：當事人之一方遇有重大事由，其僱傭契約縱定有期限，仍得於期限屆滿前終止。", "§188 I：受僱人因執行職務不法侵害他人權利，僱用人與行為人連帶負賠償責任（僱用人能證明選任監督無過失者可免責）。"], "trap": "僱傭具高度屬人性，勞務請求權讓與與勞務之使用均須對方同意（§484）。陷阱：別因「權利可讓與」就忽略§484 的特別規定。", "related": ""}, {"id": "BC108-9", "cat": "C2租賃", "year": "108年第9題", "q": "依我國民法之規定，下列關於租賃契約之敘述何者正確？", "opts": ["甲將自己所有之 A 屋租予乙後，又將 A 屋租予丙並交付占有予丙，乙得知後可向丙主張交付A 屋", "甲將自己所有之 A 屋租予乙，並交付占有予乙後，A 屋竟遭丙無權占有。此時，乙可對丙主張占有物返還請求權", "甲將自己所有之 A 屋租予乙供居住之用，乙雖於訂約時已知 A 屋為輻射屋，但因輻射屋會危及乙的健康，故乙仍得主張減少價金", "甲將自己所有之 A 屋租予乙，約定由甲負修繕義務。按民法規定，乙得自行修繕再請求出租人償還費用"], "correct": 1, "exps": ["一物二租，兩租賃契約均有效；丙已取得占有，乙不得向丙請求交付，只能向甲主張債務不履行責任。", "承租人乙為直接占有人（§941），租賃物被丙無權占有（侵奪）時，乙得依§962 行使占有物返還請求權。", "§424：租賃物危及承租人健康或安全者，承租人雖訂約時已知其瑕疵，仍得終止契約；法律效果是終止，不是減少價金。", "§430：出租人負修繕義務而延不修繕時，承租人須先定期催告，逾期仍不修繕，才得自行修繕並請求償還費用；不得未經催告逕自修繕。"], "trap": "承租人有占有就有占有保護請求權，不必是所有人。陷阱：自行修繕要「先催告」；輻射屋給的是終止權。", "related": ""}, {"id": "BC108-11", "cat": "C3居間承攬委任", "year": "108年第11題", "q": "依我國民法之規定，下列關於居間契約之敘述何者錯誤？", "opts": ["稱居間者，謂當事人約定，一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約", "約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，法院得因報酬給付義務人之請求酌減之。報酬已給付者，得請求返還", "因婚姻居間而約定報酬者，就其報酬無請求權", "居間人就其媒介所成立之契約，無為當事人給付或受領給付之權"], "correct": 1, "exps": ["§565：居間為當事人約定，一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約。", "§572：報酬過鉅失公平，法院得因給付義務人之請求酌減，但報酬已給付者，不得請求返還。", "§573：因婚姻居間而約定報酬者，其約定無效，居間人就報酬無請求權。", "§567 I：居間人就其媒介所成立之契約，無為當事人給付或受領給付之權。"], "trap": "居間報酬可酌減，但付了就不能要回。陷阱：與§252 違約金酌減不同，這裡「已給付者不得請求返還」。", "related": ""}, {"id": "BC108-12", "cat": "B6侵權行為", "year": "108年第12題", "q": "10 歲的男童 A 去同學 B 家中一起打電動遊戲時，因一言不合吵起來，一氣之下摔壞 B 父甲新購買的筆電。請問下列敘述何者錯誤？", "opts": ["若摔壞筆電時 A 有識別能力，則由 A 單獨負責，甲不可向 A 之法定代理人乙求償", "若摔壞筆電時 A 有識別能力，則 A 和其法定代理人乙必須連帶負賠償責任", "若摔壞筆電時 A 無識別能力，則 A 無須負責", "若摔壞筆電時 A 無識別能力，則由其法定代理人乙單獨負責，但乙可舉證免責"], "correct": 0, "exps": ["§187 I：A有識別能力，與法定代理人乙連帶負責，甲可向乙求償。", "§187 I：有識別能力時，行為人與法定代理人連帶負責。", "§187 I：行為時無識別能力者，原則由法定代理人負責，A本人無須負責（§187 III 為衡平責任）。", "§187 I 後段、II：無識別能力時由法定代理人單獨負責，乙得舉證監督無疏懈而免責。"], "trap": "§187 一圖記：有識別能力＝連帶；無識別能力＝法定代理人單獨；監督無疏懈可免責。", "related": ""}, {"id": "BC108-15", "cat": "B2債務不履行", "year": "108年第15題", "q": "甲、乙締結買賣甲所有之 A 屋的契約，乙並先為部分價金之給付。其後，乙未依約定期限給付剩餘價金。就甲以乙履行遲延而解除 A 屋買賣契約之情形，下列敘述，何者正確？", "opts": ["經甲定期間催告乙履行，甲得於經相當期限後，不須再為催告，即得解除契約", "甲僅限於法律規定之事由始得解除，不得與乙約定合意解除之事由", "契約經解除後，甲、乙互負回復原狀的義務，甲不得向乙請求損害賠償", "契約經解除後，因乙有可歸責事由，甲返還乙已給付之價金時，不須附加利息"], "correct": 0, "exps": ["§254：定期間催告而債務人仍不履行，期限屆滿後得解除，不須再催告。", "解除權除法定（如§254～§256）外，當事人亦得依契約自由約定（約定解除權），並非僅限法定事由。", "§260：解除不妨礙損害賠償之請求。", "§259 (2)：返還金錢者，應附加自受領時起之利息。"], "trap": "解除三要件：法定或約定解除權、催告（遲延時）、解除不妨礙賠償；回復原狀時返還金錢要加利息（§259）。", "related": ""}, {"id": "BC108-17", "cat": "B3連帶債務與保證", "year": "108年第17題", "q": "就甲、乙、丙三人對丁負有平均分擔之 300 萬元連帶債務的情形，下列敘述，何者正確？", "opts": ["甲對丁為債務之承認而中斷時效時，其效力亦及於乙、丙之債務", "丁請求甲支付全額獲勝訴判決後，仍未能自甲受償時，得再請求乙支付全額", "甲清償全額後，如乙不能償還其分擔額，甲亦僅能向丙求償 100 萬元", "甲對丁清償 100 萬元後，丁即不得再次向甲請求支付剩餘之 200 萬元"], "correct": 1, "exps": ["§279：債務承認為相對效力事由，僅對甲生效。", "§273：債權人得對連帶債務人中之一人或數人或全體，同時或先後請求全部或一部給付。", "§282 I：乙不能償還之100萬由甲、丙平均分擔，甲得向丙求償150萬，並非100萬。", "§273 II：連帶債務未全部履行前，全體債務人仍負連帶責任，丁仍得向甲請求剩餘200萬。"], "trap": "連帶債務對外各負全部責任，債權人可擇一請求；內部分擔與求償依 §280-§282。", "related": ""}, {"id": "BC108-21", "cat": "C2租賃", "year": "108年第21題", "q": "甲將其所有之 A 土地上之 B 建物讓與乙時，在房屋得使用期限內，乙與甲間有何法律關係？", "opts": ["推定有租賃關係", "視為有租賃關係", "推定有普通地上權關係", "視為有普通地上權關係"], "correct": 0, "exps": ["§425-1，土地及其上之房屋同屬一人，而僅將房屋讓與他人（未讓與土地），在房屋使用期限內，「推定」（非「視為」）土地與房屋間有租賃關係，正確。★關鍵區分：一般買賣分離→推定租賃（§425-1）；抵押拍賣分離→視為地上權（§876），務必分清。", "應為「推定」而非「視為」，兩者重要差別：「推定」可被反証推翻；「視為」法律擬制，不可推翻，本選項說「視為」錯誤。", "地上權適用於抵押拍賣場合（§876），一般買賣分離適用租賃（§425-1），選項適用規定錯誤。", "同C，且「視為」二字亦不正確。"], "trap": "", "related": ""}, {"id": "BC109-3", "cat": "C1買賣", "year": "109年第3題", "q": "甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？", "opts": ["於甲與乙簽訂汽車買賣契約時起，由乙承受", "自該車辦理過戶登記於乙時，由乙承受", "自該車交付於乙時起，由乙承受", "於乙支付價金完畢時，由乙承受"], "correct": 2, "exps": ["買賣契約成立時，危險尚未移轉（交付前仍在甲），成立時由甲承受。", "動產危險移轉以「交付」為準（§373），並非以登記（過戶）為準；不動產所有權移轉以登記，但危險移轉仍以「交付」為準，選項錯誤。", "§373，買賣標的物之利益及危險，自「交付」時起由買受人（乙）承受，無特別約定時以交付為準，正確。", "價金支付非危險移轉的依據，依法以交付為準，選項錯誤。"], "trap": "", "related": ""}, {"id": "BC109-4", "cat": "B1債之發生與消滅", "year": "109年第4題", "q": "下列有關契約成立之敘述，何者錯誤？", "opts": ["契約得以要約與承諾之意思表示合致而成立", "契約得以要約交錯之方式而成立", "契約得以承諾交錯之方式而成立", "契約得以要約與意思實現方式而成立"], "correct": 2, "exps": ["契約由要約與承諾之意思表示一致而成立（§153 Ⅰ：當事人互相表示意思一致者，無論明示或默示，契約即成立；§154 起規範要約之拘束力、承諾等），為最基本的成立方式，正確。", "要約交錯：雙方各自獨立向對方為內容一致之要約，構成「互相表示意思一致」，依§153 Ⅰ契約成立（通說），正確。", "承諾必須針對對方已發出之要約而為，民法並無「承諾交錯」這種契約成立方式；民法承認的是要約交錯（§153）與意思實現（§161），本選項描述不存在的成立方式，錯誤，為應選答案。", "意思實現（§161 Ⅰ）：依習慣或依事件之性質，承諾無須通知者，在相當時期內有可認為承諾之事實時，契約即為成立（如逕行履行），正確。"], "trap": "", "related": ""}, {"id": "BC109-5", "cat": "B1債之發生與消滅", "year": "109年第5題", "q": "下列關於利息之敘述，何者正確？", "opts": ["應付利息之債務，其利率未經約定亦無法律可據者，原則上以週年利率為百分之六計算", "約定利率逾週年百分之十二者，經一年後，債務人得隨時清償原本。但須於一個月前預告債權人", "約定利率，超過週年百分之二十者，其約定當然無效，此時應以法定利率計算應給付之利息", "債權人受領超過最高利率之利息，對於超過部分之利息係不當得利，應返還債務人"], "correct": 1, "exps": ["§203：未約定利率亦無法律可據者，週年利率為5%，不是6%。", "§204 I：約定利率逾週年12%者，經一年後債務人得隨時清償原本，但須於一個月前預告債權人。", "§205：超過上限部分之約定無效，並非整個利息約定當然無效而改依法定利率。", "超過部分約定無效（§205），惟債務人給付時若明知無給付義務，依 §180(3) 不得請求返還，故不能一概說都須返還。"], "trap": "現行法差異：§205 嗣後修正，週年利率上限由20%降為16%；選項C之「20%」為當時規定，但「約定當然無效」之說法於新舊法下均不成立（僅超過部分無效），答案不變。", "related": ""}, {"id": "BC109-6", "cat": "C1買賣", "year": "109年第6題", "q": "下列有關定金之敘述，何者正確？", "opts": ["訂約當事人之一方，由他方受有定金時，其契約視為成立", "定金為諾成契約，於當事人約定時即成立", "契約因可歸責於付定金當事人之事由，致不能履行時，定金不得請求返還", "契約因不可歸責於雙方當事人之事由，致不能履行時，定金視為債務不履行損害賠償之總額"], "correct": 2, "exps": ["§248：由他方受有定金時，是「推定」契約成立，並非視為成立。", "定金契約為要物契約，須交付定金才成立，並非諾成。", "§249 (2)：契約因可歸責於付定金當事人之事由致不能履行時，定金不得請求返還。", "§249 (4)：契約因不可歸責於雙方之事由致不能履行時，定金應返還。"], "trap": "定金四種：成立推定（§248）；付定金方可歸責→沒收；受定金方可歸責→加倍返還；雙方不可歸責→返還（§249）。", "related": ""}, {"id": "BC109-7", "cat": "B1債之發生與消滅", "year": "109年第7題", "q": "甲借給乙 100 萬元，借期屆至，甲請求乙返還 100 萬元借款，乙因此開立 100 萬元之本票交由甲受領。下列敘述，何者正確？", "opts": ["甲所受領乙開立的 100 萬元本票，是債之內容更改", "甲所受領乙開立的 100 萬元本票，是抵銷", "甲所受領乙開立的 100 萬元本票，是代物清償", "甲所受領乙開立的 100 萬元本票，是新債清償"], "correct": 3, "exps": ["債之更改是以新債務取代舊債務、使舊債務消滅；但依§320，因清償債務而對債權人負擔新債務者，除當事人另有意思表示外，舊債務並不消滅，本題無使舊債務消滅之意思表示，不能認為更改。", "抵銷（§334）須二人互負債務、給付種類相同且均屆清償期；本題只有乙對甲負借款債務，甲對乙並無相對債務，無從抵銷。", "代物清償（§319）是債權人受領「他種給付」以代原定給付，債之關係 求權", "違章建築遭拍賣，拍定人自取得法院權利移轉證書之日起，取得該違章建築之權利", "甲、乙買賣違章建築，所讓與的是事實上之處分權"], "correct": 1, "exps": ["實務認為違章建築與土地原屬同一人，其後分別讓與不同人時，類推適用§425-1 推定租賃關係。", "違章建築（未辦保存登記）買受人僅取得事實上處分權，並非所有權人，不得行使§767 物上請求權。", "實務見解：拍賣違章建築，拍定人自取得權利移轉證書之日起取得其權利（事實上處分權）。", "違章建築買賣所讓與者為事實上處分權，非所有權移轉。"], "trap": "違建買賣的標的是「事實上處分權」，因此買受人沒有§767 的所有物請求權。陷阱：§425-1 靠實務類推適用違建。", "related": ""}, {"id": "BC110-1", "cat": "C1買賣", "year": "110年第1題", "q": "甲與乙訂立買賣契約，契約條款記載「...價金新臺幣陸拾捌萬元整(NT$860,000)。前揭捌拾陸萬元價金應於訂約後 10 日內支付。」 若嗣後雙方就價金金額爭訟時，法院應如何決定價金？", "opts": ["應認為價金為最後書寫之文字：捌拾陸萬元", "應先探求當事人原意", "應認為價金為兩項金額之平均值：柒拾柒萬元", "如法院不能決定當事人原意，應以數字為準：NT$860,000"], "correct": 1, "exps": ["契約解釋不是以最後書寫之文字為準，法無此規定。", "§98：解釋意思表示，應探求當事人之真意，不得拘泥於所用之辭句；文字與數字不符時，應先探求真意。", "法無「取平均值」之解釋規則，亦非探求真意之方法。", "依民法§4，文字與號碼不符、法院不能決定當事人原意時，應以「文字」為準，不是以數字為準，本選項錯誤。"], "trap": "契約解釋第一原則是探求真意（§98）。陷阱：一般契約適用民法§4（不能決定原意→以文字為準）；§5 是「數次表示不符」才以最低額為準，別混。", "related": ""}, {"id": "BC110-11", "cat": "B3連帶債務與保證", "year": "110年第11題", "q": "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？", "opts": ["同時履行抗辯", "撤銷訴權", "追索權抗辯", "先訴抗辯"], "correct": 3, "exps": ["同時履行抗辯（§264）：雙務契約一方未提出履行，他方得拒絕己方給付，與保證無關。", "撤銷訴權（§244）：債權人撤銷債務人詐害行為之權利，與保證抗辯無關。", "追索權見於票據法（票據不獲付款後向前手追索），與民法保證無關。", "§745「先訴抗辯」（或稱「先訴利益」）：保證人於債權人未先就主債務人財產強制執行無效果前，得拒絕清償，此即先訴抗辯，正確。"], "trap": "", "related": ""}, {"id": "BC110-12", "cat": "B3連帶債務與保證", "year": "110年第12題", "q": "關於連帶債務的敘述，下列何者正確？", "opts": ["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務", "連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息", "連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之", "連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"], "correct": 2, "exps": ["§280 但書：因債務人中之一人應單獨負責之事由所致損害及費用，由該債務人負擔，並非平均分擔。", "§281 I：求償得包括自免責時起之利息。", "§282 I：連帶債務人中之一人不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按比例分擔。", "§282 II：他債務人中之一人應分擔部分已免責者，仍應按比例分擔。"], "trap": "連帶債務內部關係：平均分擔（§280）、求償含利息（§281）、不能償還風險共同分擔（§282）。", "related": ""}, {"id": "BC110-14", "cat": "C4其他各種之債", "year": "110年第14題", "q": "關於合夥的敘述，下列何者正確？", "opts": ["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有", "合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任", "合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"], "correct": 1, "exps": ["§668：合夥人之出資及其他合夥財產，為合夥人全體之公同共有，非分別共有。", "§669：除有特別訂定外，合夥人無於約定出資外增加出資之義務；因損失致資本減少者，亦無補充義務。", "§681：合夥財產不足清償合夥債務時，各合夥人對不足之額連帶負責。", "§690：合夥人退夥後，對於其退夥前合夥所負之債務，仍應負責。"], "trap": "合夥財產是公同共有，債務是連帶責任。陷阱：退夥後對退夥前債務仍須負責。", "related": ""}, {"id": "BC110-15", "cat": "C1買賣", "year": "110年第15題", "q": "關於買賣瑕疵擔保的敘述，下列何者正確？", "opts": ["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責", "從物有瑕疵者，買受人得就主物併同從物，解除全部契約", "為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約", "買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"], "correct": 2, "exps": ["§358（買受人保管義務）：由他地送到之物，買受人主張瑕疵不願受領時，如出賣人於受領地無代理人，買受人有暫為保管之責。", "§362：因主物有瑕疵而解除者效力及於從物；從物有瑕疵者，買受人僅得就從物為解除，不得解除主物或全部契約。", "§363：數物買賣中一物有瑕疵者，僅就瑕疵物解除；但因瑕疵物與他物分離而顯受損害者，當事人任何一方得解除全部契約。", "§364 II：另行交付之物，出賣人仍負擔保責任，並非免責。"], "trap": "瑕疵解除原則「就瑕疵物」，例外為分離顯受損害才得全部解除（§363）。陷阱：從物瑕疵只能解除從物。", "related": ""}, {"id": "BC110-20", "cat": "B1債之發生與消滅", "year": "110年第20題", "q": "分別財產制有關夫妻債務的敘述，下列何者正確？", "opts": ["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "夫妻各自對其債務負清償之責"], "correct": 3, "exps": ["A所述為法定財產制剩餘財產分配之撤銷規定（§1020-1），並非分別財產制。", "B所述剩餘財產差額平均分配為法定財產制規則（§1030-1），分別財產制無此制度。", "C所述婚姻存續中不得請求償還、消滅時納入計算，為法定財產制之規則，非分別財產制。", "分別財產制章（§1044以下）：夫妻各自對其債務負清償之責。"], "trap": "分別財產制＝各自財產各自債務、無剩餘財產分配；法定財產制才有剩餘財產差額分配。", "related": ""}, {"id": "BC110-21", "cat": "B1債之發生與消滅", "year": "110年第21題", "q": "關於共同財產所負之債務，而以共同財產清償者，下列何者正確？", "opts": ["不生補償請求權", "不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "有補償請求權，但於婚姻關係存續中，不得請求", "有補償請求權，雖於婚姻關係存續中，亦得請求"], "correct": 0, "exps": ["共同財產所負之債務以共同財產清償，債務與清償財源同屬一個財產池，只是左手還右手，不生補償請求權。", "選項所述『關係消滅時分別納入現存婚後財產或所負債務計算』是法定財產制§1030-3（婚前／婚後財產互相清償債務）的規定，與共同財產清償共同財產債務無關。", "共同財產清償共同財產債務根本不發生補償請求權，無所謂『婚姻關係存續中不得請求』。", "補償請求權只發生於共同財產與特有財產互相清償對方債務之情形（§1038），同為共同財產則無，婚姻存續中亦不能請求。"], "trap": "白話：同一個口袋付同一個口袋的帳，不必互相補償；要補償必須是『共同財產↔特有財產』跨口袋。陷阱：B 借用法定財產制§1030-3 的用語混淆。", "related": ""}, {"id": "BC111-4", "cat": "C1買賣", "year": "111年第4題", "q": "下列敘述，何者錯誤？", "opts": ["使用借貸契約必須是無償的契約", "借用人得主張買賣不破使用借貸之抗辯", "借用物為動物時，飼養費原則上應由借用人承擔", "借用人對於借用物原則上並無轉租收益之權限"], "correct": 1, "exps": ["使用借貸（§464）本質為無償（若有償則為租賃），正確。", "「買賣不破使用借貸」並無民法明文規定（§425買賣不破租賃適用於租賃，不及於使用借貸），使用借貸為無償，無類推適用§425之保護，故借用人不能主張買賣不破使用借貸，本選項說「得主張」錯誤，為應選答案。", "使用借貸，借用物之管理費用（如飼養費）由借用人負擔（§469），正確。", "使用借貸原則上借用人得自行使用，但不得擅自轉租（因屬無償借用，更不應從中謀利），正確。"], "trap": "", "related": ""}, {"id": "BC111-6", "cat": "B1債之發生與消滅", "year": "111年第6題", "q": "下列何種情形，債務人之原有債務不會發生消滅之效果？", "opts": ["債權人受領債務人以代物清償方式清償原有之債務", "債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務", "債權與其債務發生混同之情形", "債務人以間接給付之方式清償原有之債務"], "correct": 3, "exps": ["代物清償（§319）：經債權人同意以他種給付代原定給付，經受領後原債務即消滅。", "抵銷（§334 I）：二人互負債務、種類相同且均屆清償期，經意思表示即各按債務額同時消滅。", "混同（§344）：債權與其債務同歸一人，債之關係消滅（但法律另有規定或債權為他人權利標的者例外）。", "間接給付（§320）：因清償舊債而負擔新債，除另有意思表示外，新債務不履行時舊債務仍不消滅；新債務履行後舊債務才隨之消滅，故不會因『約定』當下消滅。"], "trap": "白話：開支票還錢只是『約定換個方式還』，支票沒兌現，原本債務還在。陷阱：間接給付與代物清償（有『受領』即消滅）易混。", "related": ""}, {"id": "BC111-7", "cat": "B5無因管理", "year": "111年第7題", "q": "在無因管理之規定中，若管理人管理事務時，利於本人，且不違反本人明示或可得推知之意思者，管理人不得向本人主張下列那種請求權？", "opts": ["管理人管理本人事務之有益費用支出償還請求權", "清償管理人因管理事務所負債務之請求權", "管理人因管理事務所受損害之賠償請求權", "管理人管理本人事務之報酬請求權"], "correct": 3, "exps": ["§176 I：管理事務利於本人且不違反其明示或可得推知之意思者，管理人得請求償還支出之有益費用及利息。", "§176 I：管理人得請求本人清償其因管理事務所負擔之債務。", "§176 I：管理人因管理事務所受之損害，得請求本人賠償。", "無因管理規定中無報酬請求權之明文，管理人僅能請求費用、債務清償及損害賠償，不得請求報酬。"], "trap": "白話：多管閒事可以報銷成本與損失，但不能收『工錢』。陷阱：與委任（有約定報酬§547）區分。", "related": ""}, {"id": "BC111-12", "cat": "B3連帶債務與保證", "year": "111年第12題", "q": "下列何者非法律明文規定屬於連帶債務之性質？", "opts": ["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務", "數人共同不法侵害他人權利所生之損害賠償債務", "共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務", "共有人對於他共有人因分割而得之物，所負之擔保責任債務"], "correct": 3, "exps": ["§681：合夥財產不足清償合夥債務時，各合夥人對不足額連帶負責，屬法律明文之連帶債務。", "§185 I：數人共同不法侵害他人權利者，連帶負損害賠償責任。", "§1153 I：繼承人對被繼承人之債務，以因繼承
