賠償責任", "租賃物應納之一切稅捐，由出租人負擔"], "correct": 0, "exps": ["§430：租賃物有修繕必要時，承租人須先定期催告出租人修繕，逾期仍不修繕才得自行修繕並請求償還；非原則上得直接自行修繕。", "§443 I 但書：租賃物為房屋者，除有反對約定外，承租人得將其一部分轉租。", "§434：租賃物因承租人重大過失致失火而毀損滅失者，承租人負損害賠償責任，輕過失不負責。", "§427：就租賃物應納之一切稅捐，由出租人負擔。"], "trap": "修繕權要「先催告」。陷阱：失火責任限於「重大過失」；稅捐歸出租人。", "related": ""}, {"id": "BC112-15", "cat": "C2租賃", "year": "112年第15題", "q": "甲於民國（下同）107 年 9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣 3 萬元，乙於 108 年 9 月催告後甲仍不為給付，乙便於 109 年 8 月訴請甲給付租金，於 110 年 9 月獲勝訴判決確定。下列何者正確？", "opts": ["乙租車公司的租金請求權時效本為 5 年", "乙於 108 年 9 月催告後 6 個月內未起訴，仍生中斷時效之效力", "乙於 109 年 8 月訴請甲給付租金時，時效不完成", "判決確定後，時效重新起算 5 年"], "correct": 3, "exps": ["以租賃動產為營業者之租價，請求權時效為二年（§127③），並非五年。", "§130：時效因請求而中斷者，若於請求後六個月內不起訴，視為不中斷；故催告後未於六個月內起訴，不生中斷效力。", "§129 I③：起訴為時效中斷事由，並非時效不完成。", "§137 I、II：時效因起訴中斷，確定判決後重行起算；原期間不滿五年者，重行起算之期間為五年。"], "trap": "短期時效經判決確定後一律延為五年（§137 II）。陷阱：催告六個月不起訴視為不中斷；起訴是「中斷」不是「不完成」。", "related": ""}, {"id": "BC112-16", "cat": "C3居間承攬委任", "year": "112年第16題", "q": "甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣 10 萬元。關於婚姻居間契約，下列何者正確？", "opts": ["甲乙間的契約，無效", "乙得對甲請求給付報酬", "乙對甲無報酬請求權", "婚姻居間契約不得約定報酬"], "correct": 2, "exps": ["依§573，婚姻居間契約約定報酬者，法律只是規定居間人「就其報酬無請求權」，並未規定契約無效；選項說契約無效，與條文不符。", "依§573，因婚姻居間而約定報酬者，就其報酬無請求權；甲雖承諾事成給付10萬元，乙也不得向甲請求給付，選項說「乙得請求」與條文相反，錯誤。", "依§573，婚姻居間約定報酬者，居間人就其報酬無請求權，所以乙對甲沒有10萬元報酬請求權，正確。", "§573 的文字是「因婚姻居間而約定報酬者，就其報酬無請求權」，可見法律承認當事人可以「約定」報酬，只是居間人不能請求；選項說「不得約定報酬」錯誤。"], "trap": "", "related": ""}, {"id": "BC112-19", "cat": "C1買賣", "year": "112年第19題", "q": "甲在其所有 A 地上興建 B 屋，但 B 屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙訂立 A 地與 B 屋的買賣契約，下列何者錯誤？", "opts": ["B 屋雖為違章建築亦為融通物，得為交易之客體", "甲應將 A 地所有權辦妥移轉登記給乙，乙始取得 A 地所有權", "興建 B 屋時因未為建物所有權保存登記，故甲未取得 B 屋所有權", "甲將B屋讓與乙，乙僅取得對B屋之事實上處分權"], "correct": 2, "exps": ["違章建築仍為有體物，得為交易客體，屬融通物。", "§758 I：不動產物權依法律行為而取得者，非經登記不生效力；故A地所有權於移轉登記時取得。", "建物於起造完成時，起造人原始取得（事實行為，§759 之反面），不以保存登記為要件，故甲取得B屋所有權（僅無法處分登記）。", "違章建築未能辦理移轉登記，買受人僅取得事實上處分權，非所有權。"], "trap": "事實行為原始取得所有權不需登記，登記只影響「處分」。陷阱：別把「未登記」等同「無所有權」。", "related": ""}, {"id": "BC113-1", "cat": "C1買賣", "year": "113年第1題", "q": "甲就其所有之 A 地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關於二個買賣契約之效力，下列敘述，何者正確？", "opts": ["前契約有效，後契約無效", "前契約無效，後契約有效", "前契約有效，後契約有效", "前契約無效，後契約無效"], "correct": 2, "exps": ["買賣契約為債權契約，負擔行為不以有處分權為要件，後契約不會使前契約失效。", "同理，前契約不因後契約而無效，也不因未登記而無效。", "一物二賣，債權契約均有效；買賣為債權行為，並無排他性，只是出賣人僅能移轉所有權予一人，另一契約出賣人須負債務不履行責任（§226）。", "兩契約皆為有效債權契約，未登記不影響契約效力，僅影響物權變動（§758）。"], "trap": "白話：『簽約』與『過戶』是兩件事。一屋兩賣兩個合約都有效，先登記者取得所有權，另一方請求賠償。陷阱：先簽先贏或後約無效的直覺。", "related": ""}, {"id": "BC113-3", "cat": "C1買賣", "year": "113年第3題", "q": "甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？", "opts": ["丙善意取得名畫之所有權", "丙得請求乙損害賠償", "乙與丙之買賣契約有效", "乙與丙之物權契約有效"], "correct": 1, "exps": ["乙以甲之名義（無代理權）出賣，乙非以自己名義處分，且非有處分權人，丙不能依善意取得（§801、§948）取得所有權。", "§110：無代理權人以他人代理人名義所為法律行為，對善意相對人負損害賠償責任。", "無權代理之買賣契約對本人效力未定（§170 I），經本人拒絕後確定不生效力。", "物權契約同為無權代理行為，本人甲不承認故對甲不生效力。"], "trap": "無權代理人責任＝§110 損害賠償。陷阱：善意取得需讓與人以自己名義處分，且本題未發生。", "related": ""}, {"id": "BC113-4", "cat": "C5債權讓與", "year": "113年第4題", "q": "甲對乙有新臺幣（下同）100 萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償 100 萬元，經甲受領，下列敘述，何者正確？", "opts": ["甲與丙之債權讓與無效", "乙之債務因清償而消滅", "應經丙承認，乙之債務始消滅", "甲與丙之債權讓與應經乙承認始生效"], "correct": 1, "exps": ["債權讓與為準物權行為，只要讓與人與受讓人合意即生效（§294 I），不因未通知而無效。", "§297 I：未經通知對債務人不生效力，債務人仍得向讓與人清償，乙善意對甲清償，債務因清償而消滅。", "清償效力不須丙承認；§297 的保護對象是債務人，乙清償即生消滅效果。", "債權讓與無須債務人同意或承認，§297 只是通知對債務人之對抗要件。"], "trap": "白話：沒通知債務人，債務人不知情付給舊債權人就算付對了；新債權人只能找舊債權人（不當得利）。陷阱：誤以為讓與要債務人同意。", "related": ""}, {"id": "BC113-5", "cat": "B4不當得利", "year": "113年第5題", "q": "甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙 100 萬元後，乙須幫助甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還 100 萬元？", "opts": ["可以，依據不當得利", "不可，100 萬元為不法原因之給付", "可以，100 萬為違背公序良俗之給付", "可以，依據無因管理"], "correct": 1, "exps": ["丙雖受領給付，但§180④ 排除不當得利返還請求權。", "§180④：因不法原因而為給付者，不得請求返還，但不法原因僅於受領人一方存在時不在此限；本題雙方均有不法，不得請求返還。", "契約雖因違反公序良俗而無效（§72），但給付之返還仍受§180④ 限制。", "丙受領贈與並非為甲管理事務，不成立無因管理（§172）。"], "trap": "§180④ 是不當得利之「例外封鎖」。陷阱：契約無效不等於可以要回錢。", "related": ""}, {"id": "BC113-7", "cat": "C2租賃", "year": "113年第7題", "q": "甲與乙訂立租賃契約，將丙所有之 A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？", "opts": ["甲與乙訂立之租賃契約無效", "甲與乙訂立之租賃契約得撤銷", "乙得終止與甲訂立之租賃契約", "乙得以與甲之租賃契約對抗丙"], "correct": 2, "exps": ["租賃為負擔行為，出租人無處分權亦不影響租賃契約之有效性。", "本題無錯誤、詐欺等撤銷原因。", "第三人丙起訴請求返還致乙不能使用收益，依§436 準用§349 至§353 關於權利瑕疵擔保及債務不履行規定，乙得終止契約。", "租賃權為債權，僅相對效力，不得對抗所有權人丙。"], "trap": "出租他人之物契約有效，只是出租人要負權利瑕疵擔保。陷阱：債權不能對抗所有人。", "related": ""}, {"id": "BC113-8", "cat": "C2租賃", "year": "113年第8題", "q": "甲將其所有之 A 屋出租於乙，乙未經甲之同意，將 A 屋全部轉租於丙。下列敘述，何者正確？", "opts": ["乙與丙訂立之租賃契約無效", "甲與乙訂立之租賃契約無效", "乙得終止乙與丙之租賃契約", "甲得終止甲與乙之租賃契約"], "correct": 3, "exps": ["乙擅自轉租，違反的是§443Ⅰ（非經出租人承諾不得轉租）所生對甲的義務，法律效果是§443Ⅱ 賦予甲終止權，並未規定乙丙間的轉租契約無效；乙丙租賃契約仍有效，選項錯誤。", "甲乙間租賃契約並不因乙擅自轉租而無效，法律效果僅是甲得終止（§443Ⅱ），選項錯誤。", "§443Ⅱ 賦予「出租人」（甲）終止權，乙擅自轉租並未使乙取得終止乙丙租約的法定權利；乙丙間若要終止須依其契約或租賃一般規定，選項錯誤。", "依§443Ⅱ，承租人違反§443Ⅰ 規定（未經出租人承諾，將租賃物轉租於他人），出租人得終止契約；本題乙未經甲同意將A屋全部轉租於丙，甲得終止甲乙租約，正確。"], "trap": "", "related": ""}, {"id": "BC113-11", "cat": "C4其他各種之債", "year": "113年第11題", "q": "甲與其 20 歲之兒子乙訂立贈與契約，將甲所有之 A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？", "opts": ["甲得解除贈與契約", "甲得終止贈與契約", "甲得撤銷贈與契約", "甲得撤回贈與契約"], "correct": 2, "exps": ["贈與契約之救濟為撤銷，非解除。", "終止適用於繼續性契約向將來失效，贈與非此類。", "§416 I②：受贈人對贈與人有扶養義務而不履行者，贈與人得撤銷贈與；已完成登記不影響此撤銷權。", "§408 之任意撤銷限於「贈與物權利未移轉前」，本題已登記移轉，且民法亦無「撤回」贈與之規定。"], "trap": "贈與撤銷有兩類：移轉前任意撤銷（§408）、移轉後法定撤銷（§416）。陷阱：已移轉後只能用法定原因撤銷。", "related": ""}, {"id": "BC113-12", "cat": "C2租賃", "year": "113年第12題", "q": "甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？", "opts": ["丙可以請求丁拆屋還地", "丁必須承租丙之土地", "視為丁於土地上有地上權", "推定丙與丁間有使用借貸契約"], "correct": 2, "exps": ["依§876（視為已有地上權設定），房屋拍定人丁取得地上權，有權使用土地，丙不得請求丁拆屋還地。", "丁與丙之間不是租賃（§425-1 是『推定』租賃，適用於房地分別讓與之情形）；此處依§876 為法律『視為』已設定地上權，丁並非必須向丙承租。", "§876 Ⅱ：土地及其土地上之建築物同屬一人所有，而以土地及建築物為抵押，如經拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定（地租、期間及範圍由當事人協議，不能協議得聲請法院判決）；丁於土地上有地上權，正確。", "法律規定的效果是『視為已有地上權之設定』（§876），而非『推定使用借貸』；使用借貸（§464）須以物交付他方並約定無償使用，與本題無關。"], "trap": "題幹僅稱土地、房屋遭『查封拍賣』，未明載已設定抵押；官方答案採§876「視為已有地上權設定」之結論，解析以§876 為準。強制執行程序之相關條文本次未核實。", "related": ""}, {"id": "BC114-8", "cat": "B5無因管理", "year": "114年 function rebuildDeck(){deck=CARDS.filter(c=>activeCats.has(c.cat));idx=0;render();}
function render(){const c=deck[idx];const color=CAT_COLORS[c.cat];flipped=false;cardEl.classList.remove('flipped');qText.textContent=c.q;badgeFront.textContent=c.cat;badgeFront.style.background=color;badgeBack.textContent=c.cat;badgeBack.style.background=color;yearFront.textContent=c.year;yearBack.textContent=c.year;document.querySelector('.face.back').style.borderLeftColor=color;const stat=getStat(c.id);const icon=masteryIcon(stat);badgeMasteryFront.textContent=icon;badgeMasteryBack.textContent=icon;curNum.textContent=idx+1;totalNum.textContent=deck.length;catName.textContent='・'+c.cat;progFill.style.width=((idx+1)/deck.length*100)+'%';optList.innerHTML='';const letters=['A','B','C','D'];c.opts.forEach((opt,i)=>{const div=document.createElement('div');div.className='opt';div.innerHTML=`<span class="letter">${letters[i]}</span><span>${opt}</span>`;div.addEventListener('click',()=>selectOption(i));optList.appendChild(div);});}
function selectOption(i){if(flipped)return;const c=deck[idx];const correct=(i===c.correct);document.querySelectorAll('.opt')[i].classList.add('selected');answerBanner.className='answer-banner '+(correct?'correct':'wrong');const letters=['A','B','C','D'];answerBanner.textContent=correct?`✅ 答對！正解是 ${letters[c.correct]}`:`❌ 答錯了，你選 ${letters[i]}，正解是 ${letters[c.correct]}`;expList.innerHTML='';c.exps.forEach((exp,j)=>{const div=document.createElement('div');div.className='exp-item'+(j===c.correct?' right':'');const mark=j===c.correct?'✓ 正解':'✗';div.innerHTML=`<div class="exp-head">${letters[j]}. ${mark}</div><div>${exp}</div>`;expList.appendChild(div);});trapText.textContent=c.trap||'';relatedText.textContent=c.related||'';if(correct)quizStats.ok++;else quizStats.ng++;const stat=getStat(c.id);stat.attempts+=1;if(correct)stat.correct+=1;stat.status=correct?'mastered':'review';mastery[c.id]=stat;saveMastery();quizOk.textContent=quizStats.ok;quizNg.textContent=quizStats.ng;updateOverallStats();setTimeout(()=>{flipped=true;cardEl.classList.add('flipped');},150);const icon=masteryIcon(stat);badgeMasteryFront.textContent=icon;badgeMasteryBack.textContent=icon;}
cardEl.addEventListener('click',()=>{if(flipped){flipped=false;cardEl.classList.remove('flipped');}});
function goNext(){idx=(idx+1)%deck.length;render();}
function goPrev(){idx=(idx-1+deck.length)%deck.length;render();}
document.getElementById('nextBtn').addEventListener('click',goNext);
document.getElementById('prevBtn').addEventListener('click',goPrev);
document.getElementById('shuffleBtn').addEventListener('click',()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}idx=0;render();});
document.addEventListener('keydown',(e)=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev();});
document.getElementById('markMastered').addEventListener('click',()=>{const c=deck[idx];const stat=getStat(c.id);stat.status='mastered';mastery[c.id]=stat;saveMastery();const icon=masteryIcon(stat);badgeMasteryFront.textContent=icon;badgeMasteryBack.textContent=icon;updateOverallStats();});
document.getElementById('markReview').addEventListener('click',()=>{const c=deck[idx];const stat=getStat(c.id);stat.status='review';mastery[c.id]=stat;saveMastery();const icon=masteryIcon(stat);badgeMasteryFront.textContent=icon;badgeMasteryBack.textContent=icon;updateOverallStats();});
document.getElementById('resetQuiz').addEventListener('click',()=>{quizStats={ok:0,ng:0};quizOk.textContent=0;quizNg.textContent=0;});
document.getElementById('resetMastery').addEventListener('click',async()=>{if(!confirm('確定要清除所有學習記錄？此動作無法復原。'))return;mastery={};await saveMastery();render();updateOverallStats();});
(async function init(){await loadMastery();rebuildDeck();updateOverallStats();})();
</script>
