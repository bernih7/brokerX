<!DOCTYPE html><html lang="zh-Hant"><head>
<script>(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}document.documentElement.setAttribute('data-theme',s||'light')})();</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>來勝115模擬試題(一)｜不動產估價概要</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#2F5D50;--key:#8A5517;--onpri:#FFFFFF;--bg:#F5F1E6;--ink:#25302C;--red:#A8402B;--gold:#B8782E;--green:#35693F;--card:#FFFEFA;--line:#DDD6C0;--sub:#5F6B63;--opt:#fff;--okbg:#E0EFE0;--badbg:#F8E4DD;--tipbg:#FBF1D9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b17;--ink:#ece6d8;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;--card:#272420;--line:#3d3830;--sub:#a79f8c;--opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220}}
:root[data-theme="dark"]{--bg:#1d1b17;--ink:#ece6d8;--red:#e0806a;--gold:#d9b058;--green:#8fb67c;--card:#272420;--line:#3d3830;--sub:#a79f8c;--opt:#2f2b26;--okbg:#26382a;--badbg:#42261f;--tipbg:#3a3220}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.7;padding-bottom:90px}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{font-family:'Noto Serif TC',serif;font-size:20px;margin:0;color:var(--pri)}
.sub{font-size:13px;color:var(--sub);margin-top:4px}
.wrap{max-width:760px;margin:auto;padding:0 16px}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:6}
.tabs button{flex:1;padding:8px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.done.ok{border-left:5px solid var(--green)}.card.done.ng{border-left:5px solid var(--red)}
.qn{font-family:'Noto Serif TC',serif;color:var(--pri);font-weight:700;font-size:15px}
.stem{margin:6px 0 12px;word-break:break-word;font-size:15px;line-height:1.8}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--opt);color:var(--ink);border-radius:10px;padding:9px 12px;margin:6px 0;font-family:inherit;font-size:14px;cursor:pointer;word-break:break-word;transition:border-color .15s,background .15s}
.opt b{color:var(--key);margin-right:4px}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg)}
.res{display:none;padding:8px 12px;border-radius:8px;font-weight:700;margin:8px 0;font-size:14px}
.done .res{display:block;background:var(--badbg);color:var(--red)}
.done .res.ok{background:var(--okbg);color:var(--green)}
.explain{display:none;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8}
.done .explain{display:block}
.explain h4{margin:0 0 6px;font-size:13px;color:var(--pri);font-family:'Noto Serif TC',serif;font-weight:700}
.explain .opt-ex{padding:5px 0;border-bottom:1px solid var(--line)}
.explain .opt-ex:last-child{border:0}
.explain .opt-ex.right{color:var(--green);font-weight:700}
.trap{margin-top:8px;padding:8px 10px;background:var(--tipbg);border-left:4px solid var(--gold);border-radius:6px;font-size:13px;line-height:1.7}
.trap b{color:var(--gold)}
.err{margin-top:10px;font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.err span{color:var(--sub)}
.err button{border:1.5px solid var(--line);background:var(--opt);color:var(--ink);border-radius:99px;padding:3px 11px;font-family:inherit;cursor:pointer;font-size:13px}
.err button.on-a{background:var(--red);color:#fff;border-color:var(--red)}
.err button.on-b{background:var(--gold);color:#fff;border-color:var(--gold)}
.err button.on-c{background:var(--pri);color:#fff;border-color:var(--pri)}
.err button.on-d{background:var(--sub);color:#fff;border-color:var(--sub)}
.bar{position:sticky;top:48px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.bar button{border:1px solid var(--line);background:var(--opt);color:var(--ink);border-radius:8px;padding:4px 10px;font-family:inherit;cursor:pointer;font-size:13px}
.bar button.on{background:var(--green);color:#fff;border-color:var(--green)}
.bar .sp{flex:1}#tm{font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums}
/* 申論頁 */
.essay-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px;margin:12px 0}
.essay-q{font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;color:var(--pri);margin-bottom:12px;line-height:1.7}
.essay-score{display:inline-block;background:var(--red);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px;margin-left:8px;font-weight:700;vertical-align:middle}
details{margin-top:10px}
summary{cursor:pointer;color:var(--pri);font-weight:700;font-family:'Noto Serif TC',serif;font-size:15px;padding:6px 0;list-style:none}
summary::before{content:'▶ ';font-size:12px}
details[open] summary::before{content:'▼ '}
.ans-block{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:8px;font-size:14px;line-height:1.9}
.ans-block h4{font-family:'Noto Serif TC',serif;color:var(--pri);margin:12px 0 4px;font-size:14px}
.ans-block h4:first-child{margin-top:0}
.ans-block p{margin:4px 0}
.calc-box{background:var(--tipbg);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:13.5px;font-family:monospace}
/* 分析頁 */
.ana-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.ana-card h3{font-family:'Noto Serif TC',serif;color:var(--pri);font-size:16px;margin:0 0 10px}
.dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.dist-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.dist-item b{display:block;font-size:18px;color:var(--pri);font-family:'Noto Serif TC',serif}
/* 結果頁 */
.result-box{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px;margin:12px 0;text-align:center}
.big-score{font-family:'Noto Serif TC',serif;font-size:48px;font-weight:700;color:var(--pri)}
.score-sub{font-size:14px;color:var(--sub);margin-top:4px}
.copy-btn{margin-top:16px;background:var(--pri);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-family:inherit;font-size:14px;cursor:pointer;font-weight:700}
/* FAB */
#bxfab{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 14px;display:flex;justify-content:flex-end;pointer-events:none;z-index:60}
#bxfab>*{pointer-events:auto}
#bxfab .bx-hub{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.25);text-decoration:none}
#bxfab .bx-hub svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-btn{position:fixed;top:14px;right:14px;z-index:99;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style></head><body>
<button class="theme-btn" onclick="toggleTheme()" title="切換深淺色">🌗</button>
<header>
  <h1>來勝115年模擬試題（一）｜不動產估價概要</h1>
  <div class="sub">出題：許文昌（高點・永慶）｜90分鐘：申論2題×25分＋單選25題×2分<br>⚠️ 補習班模擬題，非考選部官方試題。解答為 Claude 依技術規則推導，請與老師公布之解答核對。</div>
</header>
<div class="wrap">

  <button id="t1" class="on" onclick="showTab(1)">單選25題</button>

  <button id="t3" onclick="showTab(3)">題型分析</button>
  <button id="t4" onclick="showTab(4)">練習結果</button>
</div>

<div id="p3" style="display:none"></div>

<div id="bxfab"><a class="bx-hub" href="估價備考指揮中心.html" title="回備考指揮中心"><svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg></a></div>

<script src="/bxv-use.js"></script>
<script>
// ── 題目資料 ──────────────────────────────────────────
const ITEMS = [
  {id:'v_hs1_q01',ch:'估價原則',q:'不動產估價技術規則第59條規定，資金中自有資金之計息利率應不高於一年期定期存利率且不低於活存利率。試問此一規定，屬於不動產估價之何種原則？',
   opts:['均衡原則','適合原則','貢獻原則','機會成本原則'],correct:3,
   explains:['均衡原則：各生產要素組合最佳狀態時，不動產效用最大——本題無關。','適合原則：不動產用途應與周圍環境相稱——本題無關。','貢獻原則：各生產要素對整體價值之貢獻程度——本題無關。','✓ 機會成本原則：自有資金如不投入此項目，可存款獲取利息，此即機會成本。技術規則以定存上限、活存下限框定計息範圍，正是機會成本概念。'],
   trap:'考試陷阱：「計息利率」＝機會成本；不要誤選「均衡原則」（那是組合最佳化概念）。'},

  {id:'v_hs1_q02',ch:'估價通則',q:'附有違章建築之房地估價，其違建部分之評估，下列何者錯誤？',
   opts:['若委託人無要求評估，則違建部分不予以評估','若委託人要求評估，則違建部分得予以評估','若委託人要求評估，合法建物及違建部分分開評估，合併標示','若委託人要求評估，合法建物及違建部分分開評估，分別標示。'],correct:2,
   explains:['委託人未要求 → 違建不評，正確。','委託人要求 → 違建可評，正確。','✗ 錯誤：應「分別標示」，不是「合併標示」。合法與違建必須分開標示，避免混淆。','委託人要求 → 分開評估、分別標示，正確。'],
   trap:'「合併標示」vs「分別標示」——違建一定要「分別」標示，才能讓閱覽者清楚區分合法與違建價值。'},

  {id:'v_hs1_q03',ch:'租金估計',q:'不動產估價之租金種類有二種，其中一種為正常租金，另一種為何？',
   opts:['限定租金','特定租金','特殊租金','有效租金'],correct:0,
   explains:['✓ 限定租金：基於續訂租約或不動產合併為目的所形成之租賃價值（技術規則§2）。§6Ⅰ：租金種類只有正常租金、限定租金兩種。','特定租金：非技術規則用語。','特殊租金：非正確術語。','有效租金：收益法用語（EGI），非租金種類分類。'],
   trap:'租金種類只有兩種：正常租金、限定租金。不要把「有效總收入（EGI）」混入。'},

  {id:'v_hs1_q04',ch:'土地開發分析法',q:'土地開發分析法之精神，下列何者正確？',
   opts:['造價推求房價','房價推求造價','地價推求房價','房價推求地價'],correct:3,
   explains:['造價→房價：成本法的方向，非土開法。','房價→造價：無此說法。','地價→房價：與土開法方向相反。','✓ 房價推求地價：已知開發完成後房價，扣除各項成本後，倒推土地價格。此為土地開發分析法核心精神。'],
   trap:'口訣：土開法 = 由果推因 = 房價推求地價。'},

  {id:'v_hs1_q05',ch:'地價種類',q:'有關土地分割及土地合併，下列何者正確？',
   opts:['土地分割之價格種類為限定價格','土地分割之租金種類為限定租金','土地合併之價格種類為特定價格','土地合併之租金種類為限定租金'],correct:3,
   explains:['僅「違反經濟合理性之不動產分割」才屬限定價格（§2），單說「土地分割」過於籠統，不是最正確選項。','限定租金只有「續訂租約」與「不動產合併」兩種原因（§2），分割不在其中，錯誤。','錯誤：以不動產合併為目的所形成之價值，價格種類是「限定價格」（§2 限定條件之二），不是特定價格。','✓ 正確：限定租金指基於續訂租約或不動產合併為目的所形成之租賃價值（§2）。'],
   trap:'合併→價格是「限定價格」、租金是「限定租金」；違反經濟合理性之分割→限定價格。特定價格是「基於特定條件」，與合併無關。'},

  {id:'v_hs1_q06',ch:'價格種類定義',q:'不動產估價技術規則有關「正常價格」之定義，下列何項錯誤？',
   opts:['具有市場性之不動產','不受任何脅迫','經適當當市場行銷','正常特定條件'],correct:3,
   explains:['正常價格定義包含「具市場性」，正確，本選項無誤。','「不受任何脅迫」為正常價格要件，正確。','「經適當市場行銷」為正常價格要件，正確。','✗ 錯誤：正常價格是「無特殊條件」下之市場價格，「特定條件」是特定價格的要素，不屬於正常價格定義。'],
   trap:'正常價格的4要件：①市場性、②不受脅迫、③充分行銷、④無特殊條件。「特定條件」一出現就是特定價格，選「錯誤項」時直接選它。'},

  {id:'v_hs1_q07',ch:'最有效使用',q:'不動產估價技術規則有關「最有效使用」之定義，下列何項錯誤？',
   opts:['主觀上具有良好意識及通常之使用能力者','合法使用','正當合理使用','財務可行'],correct:0,
   explains:['✗ 錯誤：最有效使用強調「客觀上」合理使用能力者，而非「主觀上」。此為考試常見陷阱字眼。','合法使用：最有效使用要件之一，正確。','正當合理使用：最有效使用要件之一，正確。','財務可行（財務可行性）：最有效使用要件之一，正確。'],
   trap:'最有效使用四要件：①合法、②合理（客觀）、③最高效益、④財務可行。「主觀」→「客觀」，這個字眼每次必考。'},

  {id:'v_hs1_q08',ch:'成本法折舊計算',q:'建物總成本1,000萬元，經濟耐用年數30年，殘餘價格率5%，經歷年數15年，則以定額法計算累積折舊額為多少？',
   opts:['425萬元','450萬元','475萬元','495萬元'],correct:2,
   explains:['425萬：計算錯誤。','450萬：計算錯誤（忽略殘值）。','✓ 475萬元。定額法：每年折舊=(1000-1000×5%)÷30=950÷30≈31.67萬。累積15年=31.67×15=475萬。','495萬：計算錯誤。'],
   trap:'定額法公式：年折舊額 ＝ (建物成本 ─ 殘值) ÷ 耐用年數。殘值 = 總成本 × 殘餘價格率。別忘了扣殘值！'},

  {id:'v_hs1_q09',ch:'比較法',q:'比較標的為公有土地標售，標售價格高於一般市場行情，則運用比較法時，應進行何項調整？',
   opts:['情況調整','價格日期調整','區域因素調整','個別因素調整'],correct:0,
   explains:['✓ 情況調整（事情調整）：公有土地標售屬於非正常市場交易（受競標、政策影響價格偏高），須先進行情況調整，將其修正為正常市場價格，才能作為比較基準。','價格日期調整：用於時間點不同的修正，本題強調的是「非正常交易」而非時間差，非首要調整。','區域因素調整：用於不同區域間的差異修正。','個別因素調整：用於個別條件差異修正。'],
   trap:'口訣：比較法調整順序 = ①情況調整（先正常化）→ ②價格日期 → ③區域因素 → ④個別因素。公有地標售=非正常=先情況調整。'},

  {id:'v_hs1_q10',ch:'估價通則',q:'不動產估價，應切合下列何項日期當時之價值？',
   opts:['委託日期','勘查日期','價格日期','出報告日期'],correct:2,
   explains:['委託日期：非估價基準日期。','勘查日期：係實地查看的時間，不等於估價基準。','✓ 價格日期：§6Ⅰ「不動產估價，應切合價格日期當時之價值」。','出報告日期：報告完成時間，非估價基準日。'],
   trap:'估價三個日期：委託日 / 勘查日 / 價格日 / 出報日。「估價金額」只對應「價格日期」，其餘只是程序日期。'},

  {id:'v_hs1_q11',ch:'收益法名詞',q:'收益法之下列名詞之數值大小關係？',
   opts:['有效總收入>總收入>淨收益','總收入>淨收益>有效總收入','總收入>有效總收入>淨收益','淨收益>總收入>有效總收入'],correct:2,
   explains:['有效總收入不可能大於總收入，錯誤。','淨收益不可能大於有效總收入，錯誤。','✓ 總收入(PGI) > 有效總收入(EGI) > 淨收益(NOI)。關係：EGI = PGI ─ 空租損失；NOI = EGI ─ 營運費用。','淨收益最小，不可能排第一，錯誤。'],
   trap:'收益法三層樓：PGI（總收入）→扣空租損失→EGI（有效總收入）→扣營運費用→NOI（淨收益）。由大到小。'},

const SK = 'v_hs1_answers';
const TK = 'v_hs1_etag';
let answers = {};
let etags = {};
try{ answers = JSON.parse(localStorage.getItem(SK)||'{}'); }catch(e){}
try{ etags = JSON.parse(localStorage.getItem(TK)||'{}'); }catch(e){}

function saveAnswers(){ try{localStorage.setItem(SK,JSON.stringify(answers));}catch(e){} }
function saveEtags(){ try{localStorage.setItem(TK,JSON.stringify(etags));}catch(e){} }

// ── 渲染選擇題 ──
function renderMC(){
  const el = document.getElementById('p1');
  const filt = document.querySelector('.bar button.on')?.dataset.f||'all';
  let html = `<div class="bar">
    <button data-f="all" class="${filt==='all'?'on':''}" onclick="setFilter('all')">全部</button>
    <button data-f="wrong" class="${filt==='wrong'?'on':''}" onclick="setFilter('wrong')">❌錯題</button>
    <button data-f="un" class="${filt==='un'?'on':''}" onclick="setFilter('un')">未作答</button>
    <div class="sp"></div>
    <span id="tm">${answeredCount()}/${ITEMS.length}</span>
  </div>`;

  ITEMS.forEach((item,idx)=>{
    const ans = answers[item.id];
    const done = ans !== undefined;
    const ok = done && ans === item.correct;

    if(filt==='wrong' && (!done || ok)) return;
    if(filt==='un' && done) return;

    let optHtml = '';
    ['A','B','C','D'].forEach((L,i)=>{
      let cls = 'opt';
      if(done){
        if(i===item.correct) cls+=' ok';
        else if(i===ans) cls+=' bad';
      }
      optHtml += `<button class="${cls}" onclick="pick('${item.id}',${i})" ${done?'disabled':''}><b>${L}.</b>${item.opts[i]}</button>`;
    });

    let exHtml = '';
    if(done){
      exHtml = `<div class="explain"><h4>▸ 逐選項解析</h4>`;
      item.explains.forEach((ex,i)=>{
        exHtml += `<div class="opt-ex${i===item.correct?' right':''}">${ex}</div>`;
      });
      exHtml += `</div>`;
      if(item.trap) exHtml += `<div class="trap"><b>⚠️ 考試陷阱：</b>${item.trap}</div>`;
    }

    const errTag = etags[item.id]||'';
    let errHtml = `<div class="err"><span>錯題分類：</span>
      <button onclick="tagErr('${item.id}','A')" class="${errTag==='A'?'on-a':''}">A 法條混淆</button>
      <button onclick="tagErr('${item.id}','B')" class="${errTag==='B'?'on-b':''}">B 粗心</button>
      <button onclick="tagErr('${item.id}','C')" class="${errTag==='C'?'on-c':''}">C 不熟</button>
      <button onclick="tagErr('${item.id}','D')" class="${errTag==='D'?'on-d':''}">D 猜的</button>
    </div>`;

    html += `<div class="card${done?(ok?' done ok':' done ng'):''}">
      <div class="qn">第${idx+1}題 <span style="font-size:12px;color:var(--sub);font-family:'Noto Sans TC'">[${item.ch}]</span></div>
      <div class="stem">${item.q}</div>
      <div>${optHtml}</div>
      <div class="res${ok?' ok':''}">${done?(ok?'✓ 答對了！':'✗ 答錯了，正確答案是 '+(item.correct===0?'A':item.correct===1?'B':item.correct===2?'C':'D')):''}</div>
      ${exHtml}
      ${done&&!ok?errHtml:''}
    </div>`;
  });

  el.innerHTML = html;
}

function pick(id, idx){
  if(answers[id]!==undefined) return;
  answers[id] = idx;
  saveAnswers();
  // bxv-use.js 回報
  if(typeof BXREP !== 'undefined'){
    const item = ITEMS.find(x=>x.id===id);
    if(item) BXREP.rec('v_hs1', id, idx===item.correct);
  }
  renderMC();
  updateResult();
}

function tagErr(id, tag){
  if(etags[id]===tag){ delete etags[id]; }
  else { etags[id]=tag; }
  saveEtags();
  if(typeof BXREP!=='undefined') BXREP.tag('v_hs1', id, etags[id]||'');
  renderMC();
}

function setFilter(f){
  renderMC();
  document.querySelectorAll('.bar button').forEach(b=>{
    b.classList.toggle('on', b.dataset.f===f);
  });
  const el = document.getElementById('p1');
  const bar = el.querySelector('.bar');
  if(bar){ bar.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on', b.dataset.f===f); }); }
  renderMC();
}

function answeredCount(){ return Object.keys(answers).length; }

        <h4>（三）公式</h4>
        <div class="calc-box">V ＝ S ÷（1＋R）÷（1＋i）－（C＋M）　（§81）
V：開發前土地價值　S：開發完成後總銷售金額
R：適當利潤率　i：資本利息綜合利率
C：直接成本（營造施工費等）　M：間接成本（規劃設計費、廣告銷售費、管理費、稅捐等，§76）
資本利息綜合利率 i ＝ 年利率 ×（土地比率 ＋ 建物比率 × ½）× 開發年數（§79）</div>

        <h4>（四）估價程序</h4>
        <p>① 確定開發計畫（依法定用途與使用強度）及預期開發時間（§71）</p>
        <p>② 調查成本及相關費用，蒐集市場資料</p>
        <p>③ 勘察勘估標的，並分析周邊環境之開發程度</p>
        <p>④ 估算開發後可銷售之土地或建物面積（§74）</p>
        <p>⑤ 估算開發完成後總銷售金額（§75）</p>
        <p>⑥ 估算各項成本及相關費用（§76、§77）</p>
        <p>⑦ 選擇適當之利潤率及資本利息綜合利率（§78～§80）</p>
        <p>⑧ 計算土地開發分析價格（§81）</p>
      </div>
    </details>
    <details style="margin-top:8px">
      <summary>考試重點提示</summary>
      <div class="ans-block">
        <p>🎯 <b>必背公式：</b>V＝S÷（1＋R）÷（1＋i）－（C＋M）（§81）——利潤、利息是「除」不是「減」。</p>
        <p>🎯 <b>資本利息：</b>先依借貸、自有資金比例加權成年利率（預售收入不計息，§59），再乘（土地比率＋建物比率×½）與開發年數（§79）。</p>
        <p>🎯 <b>應用時機：</b>著重「開發潛力土地」，一般農地或已建築土地不適用。</p>
      </div>
    </details>
  </div>

  <div class="essay-card">
    <div class="essay-q">二、試述折現現金流量分析法之意義、應用時機、公式及估價程序？<span class="essay-score">25分</span></div>
    <details>
      <summary>查看擬答架構</summary>
      <div class="ans-block">
        <h4>（一）意義</h4>
        <p>折現現金流量分析法（DCF法）係預測勘估標的未來各期淨收益及期末處分（復歸）價值，再以適當折現率折現加總，求取勘估標的收益價格之估價方法。</p>

        <h4>（二）應用時機（實務歸納；定義見技術規則§28、§31）</h4>
        <p>1. 勘估標的收益有明確逐期變動趨勢者（如租金逐年調升）。</p>
        <p>2. 各期淨收益不穩定，直接資本化法不易適用時。</p>
        <p>3. 需反映持有期間內各期收益現值者。</p>

        <h4>（三）公式</h4>
        <div class="calc-box">收益價格（V）＝ Σ [NOIₜ ÷ (1+r)ᵗ] ＋ Pₙ ÷ (1+r)ⁿ

其中：
  NOIₜ = 第t期淨收益
  r    = 折現率
  Pₙ   = 第n期末處分（復歸）價值
  n    = 分析年期（持有期間）</div>

        <h4>（四）估價程序</h4>
        <p>① 決定分析年期（持有期間n）</p>
        <p>② 預測各期有效總收入（EGI）</p>
        <p>③ 估算各期營運費用，求各期淨收益（NOI = EGI ─ 費用）</p>
        <p>④ 預測期末復歸價值（Pₙ）：以第n+1期NOI除以末期資本化率求得</p>
        <p>⑤ 選定適當折現率（反映市場報酬率與風險）</p>
        <p>⑥ 將各期NOI及期末復歸值分別折現加總，求得收益價格</p>
      </div>
    </details>
    <details style="margin-top:8px">
      <summary>考試重點提示</summary>
      <div class="ans-block">
        <p>🎯 <b>DCF vs 直接資本化：</b>直資法用「現在穩定」淨收益÷資本化率；DCF用「未來各期」淨收益折現累加。</p>
        <p>🎯 <b>期末復歸值：</b>Pₙ ＝ NOI(n+1) ÷ 末期資本化率，不是NOIₙ。</p>
        <p>🎯 <b>折現率 vs 資本化率：</b>折現率用於DCF各期折現；資本化率用於直接資本化或求期末值。</p>
      </div>
    </details>
  </div>`;
}

// ── 題型分析 ──
function renderAnalysis(){
  const chapters = {};
  ITEMS.forEach(item=>{
    if(!chapters[item.ch]) chapters[item.ch]={total:0,done:0,correct:0};
    chapters[item.ch].total++;
    if(answers[item.id]!==undefined){
      chapters[item.ch].done++;
      if(answers[item.id]===item.correct) chapters[item.ch].correct++;
    }
  });

  let distHtml = '<div class="dist">';
  Object.entries(chapters).forEach(([ch,s])=>{
    const pct = s.done?Math.round(s.correct/s.done*100):null;
    distHtml += `<div class="dist-item"><b>${s.correct}/${s.total}</b>${ch}${pct!==null?`<br><span style="font-size:12px;color:var(--sub)">${pct}%正確率</span>`:'<br><span style="font-size:12px;color:var(--sub)">未作答</span>'}</div>`;
  });
  distHtml += '</div>';

  document.getElementById('p3').innerHTML = `
  <div class="ana-card">
    <h3>📊 各章節得分分佈</h3>
    ${distHtml}
  </div>
  <div class="ana-card">
    <h3>📌 本卷章節考點</h3>
    <table>
      <tr><th>章節</th><th>題數</th><th>重點</th></tr>
      <tr><td>估價原則</td><td>1</td><td>機會成本原則（§59）</td></tr>
      <tr><td>估價通則</td><td>3</td><td>違建評估、價格日期、超容積</td></tr>
      <tr><td>價格種類</td><td>3</td><td>正常/特定/特殊/限定</td></tr>
      <tr><td>成本法</td><td>3</td><td>定額折舊、等速提存率、耐用年數</td></tr>
      <tr><td>收益法</td><td>5</td><td>名詞大小、DCF計算、直資法、資本化率</td></tr>
      <tr><td>比較法</td><td>2</td><td>情況調整、區域因素</td></tr>
      <tr><td>土地開發分析法</td><td>2</td><td>精神、資金成本計算</td></tr>
      <tr><td>租金估計</td><td>2</td><td>差額分配法、租金種類</td></tr>
      <tr><td>地價種類</td><td>1</td><td>合併→特定、分割→限定</td></tr>
      <tr><td>最有效使用</td><td>1</td><td>客觀 vs 主觀</td></tr>
      <tr><td>公共設施保留地</td><td>1</td><td>比較法為原則</td></tr>
      <tr><td>權利估價</td><td>1</td><td>裡地價值</td></tr>
    </table>
  </div>`;
}

// ── 練習結果 ──
function updateResult(){
  const total = ITEMS.length;
  const done = Object.keys(answers).length;
  const correct = ITEMS.filter(item=>answers[item.id]===item.correct).length;
  const score = correct * 2;

  const errA = ITEMS.filter(x=>etags[x.id]==='A').length;
  const errB = ITEMS.filter(x=>etags[x.id]==='B').length;
  const errC = ITEMS.filter(x=>etags[x.id]==='C').length;
  const errD = ITEMS.filter(x=>etags[x.id]==='D').length;

  document.getElementById('p4').innerHTML = `
  <div class="result-box">
    <div class="big-score">${score}<span style="font-size:20px">分</span></div>
    <div class="score-sub">選擇題得分（${correct}/${total} 題答對，每題2分）</div>
    <div style="margin-top:16px;font-size:14px;color:var(--sub)">${done}/${total} 題已作答</div>
  </div>
  <div class="ana-card">
    <h3>錯題分類統計</h3>
    <div class="dist">
      <div class="dist-item"><b style="color:var(--red)">${errA}</b>A 法條混淆</div>
      <div class="dist-item"><b style="color:var(--gold)">${errB}</b>B 粗心</div>
      <div class="dist-item"><b style="color:var(--pri)">${errC}</b>C 不熟</div>
      <div class="dist-item"><b style="color:var(--sub)">${errD}</b>D 猜的</div>
    </div>
  </div>
  <div class="ana-card">
    <h3>複製練習回報</h3>
    <div style="font-size:13px;color:var(--sub);margin-bottom:10px">貼到總控對話，讓 Claude 幫你分析弱點</div>
    <button class="copy-btn" onclick="copyReport()">📋 複製練習回報</button>
  </div>`;
}

function copyReport(){
  const total = ITEMS.length;
  const done = Object.keys(answers).length;
  const correct = ITEMS.filter(item=>answers[item.id]===item.correct).length;
  const score = correct * 2;

  const wrongItems = ITEMS.filter(item=>answers[item.id]!==undefined && answers[item.id]!==item.correct);
  let wrongList = wrongItems.map(item=>{
    const tag = etags[item.id]||'未分類';
    const myAns = ['A','B','C','D'][answers[item.id]];
    const right = ['A','B','C','D'][item.correct];
    return `  Q${ITEMS.indexOf(item)+1} [${item.ch}] 我選${myAns}→正確${right} (${tag})`;
  }).join('\n');

  const text = `【估價練習回報】來勝115模擬試題(一) 許文昌
選擇題：${correct}/${total} 題 = ${score}分
作答進度：${done}/${total}

錯題清單：
${wrongList||'（本次全對！）'}

錯題分類：A法條混淆${Object.values(etags).filter(v=>v==='A').length}題 / B粗心${Object.values(etags).filter(v=>v==='B').length}題 / C不熟${Object.values(etags).filter(v=>v==='C').length}題 / D猜的${Object.values(etags).filter(v=>v==='D').length}題`;

  navigator.clipboard.writeText(text).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  alert('已複製到剪貼簿！');
}

// ── tab 切換 ──
function showTab(n){
  [1,2,3,4].forEach(i=>{
    document.getElementById('p'+i).style.display = i===n?'':'none';
    document.getElementById('t'+i).classList.toggle('on', i===n);
  });
  if(n===1) renderMC();
  if(n===2) renderEssay();
  if(n===3) renderAnalysis();
  if(n===4) updateResult();
}

// ── 深淺色切換 ──
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')||'light';
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('bx-theme',next);}catch(e){}
}

// ── 初始化 ──
renderMC();
updateResult();
