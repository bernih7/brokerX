<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}document.documentElement.setAttribute("data-theme",s||"light")})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規刷題練習｜A4業務及責任</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65;padding-bottom:84px}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg);}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;margin:0;color:var(--pri);flex:1;min-width:0}
.th{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;flex:none}
.sub{font-size:.76rem;color:var(--sub);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.76rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--sub)}
.stat b{color:var(--pri)}
.controls{max-width:760px;margin:12px auto 0;padding:0 16px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:.82rem;cursor:pointer;font-family:inherit}
.fbtn.active{background:var(--pri);color:var(--on);border-color:var(--pri)}
.fbtn.danger{border-color:var(--bad);color:var(--bad)}
.fbtn.danger.active{background:var(--bad);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);padding:4px 11px;border-radius:14px;font-size:.75rem;cursor:pointer}
.chip.active{background:var(--pri-soft);color:var(--pri);border-color:var(--pri);font-weight:700}
.ords,.exs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:6px 0}
.ords button,.exs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:.78rem;cursor:pointer}
.ords button.on,.exs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.ords .sh{margin-left:auto}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}
main{max-width:760px;margin:0 auto;padding:6px 16px 40px}
.yr-header,.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.92rem;color:var(--pri);padding:10px 0 6px;border-bottom:2px solid var(--pri);margin:16px 0 10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.qcard.answered-ok{border-left:4px solid var(--ok)}
.qcard.answered-ng{border-left:4px solid var(--bad)}
.qmeta{font-size:.72rem;color:var(--sub);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.wrong{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.stem{font-family:"Noto Serif TC",serif;font-size:.98rem;font-weight:500;margin:4px 0 10px;line-height:1.75}
.res{display:none}
.done .res{display:block;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.86rem;margin:0 0 8px;background:var(--bad-soft);color:var(--bad)}
.done .res.ok{background:var(--ok-soft);color:var(--ok)}
.hn{display:none;font-size:.72rem;color:var(--sub);margin:-4px 0 8px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.55}
.opt:hover{border-color:var(--pri)}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.76rem}
.ob{flex:1;min-width:0}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.disabled{cursor:default}
.bg{display:none;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.opt.correct .bg.a{display:inline-block;background:var(--ok)}
.opt.chosen-wrong .bg.p{display:inline-block;background:var(--bad)}
.nt{display:none;font-size:.8rem;line-height:1.6;margin-top:5px;border-top:1px dashed var(--line);padding-top:4px;color:var(--ink);font-weight:400}
.arr{display:none;float:right;margin-left:6px;color:var(--sub);transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.explain-box{display:none;margin-top:10px;padding:10px 12px;background:var(--pri-soft);border:1px solid var(--line);border-radius:8px;font-size:.82rem}
body[data-ex="B"] .done .explain-box{display:block}
.ei{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.6}
.ei:last-child{border-bottom:none}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;color:#fff}
.el.ok{background:var(--ok)}.el.no{background:var(--sub)}.el.ng{background:var(--bad)}
.ref{margin-top:8px;font-size:.76rem;color:var(--sub)}
.errtag-row{margin-top:10px;display:none;gap:6px;flex-wrap:wrap}
.errtag-row.show{display:flex}
.etag{font-size:.72rem;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--sub)}
.etag.on-A{background:var(--bad);color:#fff;border-color:var(--bad)}
.etag.on-B{background:var(--acc);color:#fff;border-color:var(--acc)}
.etag.on-C{background:var(--pri);color:var(--on);border-color:var(--pri)}
footer{text-align:center;font-size:.7rem;color:var(--sub);padding:20px 10px 10px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

</head>

<script>
const QUESTIONS = [{"year": 99, "qnum": 2, "stem": "經紀業者於製作不動產說明書時，下列何者非成屋之應記載事項？", "options": ["建築改良物標示", "重要交易條件", "主要建材", "權利種類"], "answer": "C", "explains": {"A": "建築改良物標示為成屋說明書應記載事項之一，非本題答案。", "B": "重要交易條件（如價格、付款方式等）屬應記載事項，非本題答案。", "C": "「主要建材」非成屋說明書法定應記載事項欄目（此為建材設備概況之細節，非獨立分類項），故本題選此為錯誤選項的答案。", "D": "權利種類（如所有權、他項權利）屬應記載事項，非本題答案。"}, "ref": "不動產說明書應記載及不得記載事項（內政部公告）", "id": 1, "chapter": "A4"}, {"year": 99, "qnum": 31, "stem": "經紀業經營國外不動產仲介或代銷業務者，應如何登記？", "options": ["應以公司型態組織依法辦理登記為限", "應以商業型態組織依法辦理登記為限", "應以商號向內政部或縣（市）政府依法辦理登記為限", "應以公司或商業型態組織依法辦理登記為限"], "answer": "A", "explains": {"A": "正確。條例明定經營國外不動產仲介或代銷業務者，應以「公司型態」組織依法辦理登記，商號不可經營國外不動產業務，風險控管要求較高。", "B": "商業型態（商號）不得經營國外不動產業務，僅限公司型態。", "C": "商號不得經營國外不動產業務。", "D": "「公司或商業型態」擇一並不正確，僅限公司型態，不含商業（商號）。"}, "ref": "不動產經紀業管理條例第7條", "id": 2, "chapter": "A4"}, {"year": 99, "qnum": 32, "stem": "下列那些相關文件，經紀業者可不必揭示於營業處所明顯之處？", "options": ["不動產經紀人考試及格證書", "代銷相關證照", "同業公會會員證書", "經紀業許可文件"], "answer": "A", "explains": {"A": "正確答案。應揭示者為「不動產經紀人證書」（充任證書），而非「考試及格證書」本身，兩者不同，考試及格證書不是法定揭示文件。", "B": "代銷相關證照屬應揭示之仲介或代銷相關證照及許可文件，須揭示。", "C": "同業公會會員證書屬應揭示文件之一，須揭示。", "D": "經紀業許可文件為法定應揭示文件，須揭示。"}, "ref": "不動產經紀業管理條例第18條", "id": 3, "chapter": "A4"}, {"year": 100, "qnum": 17, "stem": "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列文件何者不須由經紀業指派經紀人簽章？", "options": ["工程契約書", "不動產租賃、買賣契約書", "定金收據", "不動產廣告稿"], "answer": "A", "explains": {"A": "正確答案。工程契約書非第22條所列六類文件之一，與仲介代銷業務無直接關係，不須經紀人簽章。", "B": "不動產租賃、買賣契約書為六類法定應簽章文件之一。", "C": "定金收據為六類法定應簽章文件之一。", "D": "不動產廣告稿為六類法定應簽章文件之一。"}, "ref": "不動產經紀業管理條例第22條第1項", "id": 4, "chapter": "A4"}, {"year": 100, "qnum": 20, "stem": "依不動產經紀業管理條例之規定，下列有關不動產經紀人員的義務與責任之敘述，何者不正確？", "options": ["揭示不動產經紀人證書之義務", "不得收取差價或其他報酬之義務", "保守因執行業務而知悉或持有之他人秘密之義務", "應以不動產說明書向與委託人交易之相對人解說"], "answer": "A", "explains": {"A": "正確答案（不正確之敘述）。揭示經紀人證書等文件是「經紀業」之義務（第18條），並非個別「經紀人員」之義務，主體混淆。", "B": "不得收取差價或其他報酬確為經紀人員（及經紀業）之義務，敘述正確。", "C": "保密義務為經紀人員之義務（第25條），敘述正確。", "D": "以說明書向相對人解說為經紀人員之義務（第23條），敘述正確。"}, "ref": "不動產經紀業管理條例第18條、第19條、第23條、第25條", "id": 5, "chapter": "A4"}, {"year": 100, "qnum": 21, "stem": "依不動產經紀業管理條例規定，因可歸責於不動產經紀業之事由不能履行委託契約，致委託者受有損害時，該損害賠償責任應由誰負擔？", "options": ["不動產經紀人與經紀業各負擔一半責任", "不動產經紀業", "不動產經紀業與經紀人負連帶賠償責任", "不動產經紀人"], "answer": "B", "explains": {"A": "法律未規定各負一半責任，此情形是經紀業單獨負責。", "B": "正確。因可歸責於「經紀業」之事由不能履行委託契約，由經紀業單獨負損害賠償責任（此與「經紀人員執行業務故意過失致損害」須連帶賠償的情形不同，須注意區辨★陷阱）。", "C": "連帶賠償責任適用於「經紀人員執行業務之故意或過失致交易當事人受損害」的情形，本題是「不能履行委託契約」情形，僅經紀業負責。", "D": "委託契約之當事人是經紀業而非經紀人個人，經紀人不負此賠償責任。"}, "ref": "不動產經紀業管理條例第26條第1項", "id": 6, "chapter": "A4"}, {"year": 100, "qnum": 22, "stem": "依不動產經紀業管理條例規定，下列關於經紀業之敘述，何者正確？", "options": ["主管機關檢查經紀業之業務時，經紀業得以商業機密之理由拒絕檢查", "經紀業取得主管機關許可，依法辦理公司或商業登記後，即可開始營業", "不動產銷售廣告稿必須經主管機關審查，再由不動產經紀業簽章後刊行", "經營國外不動產仲介業務者，以依法辦理登記之公司型態組織為限"], "answer": "D", "explains": {"A": "經紀業不得以商業機密為由拒絕主管機關業務檢查，此為錯誤敘述。", "B": "辦妥公司或商業登記後，尚須加入登記所在地同業公會，始得開始營業，非登記後即可開始營業。", "C": "廣告稿由經紀業指派經紀人簽章即可刊行，法律並未要求主管機關事前審查。", "D": "正確。經營國外不動產仲介或代銷業務者，以公司型態組織依法辦理登記為限（商號不可）。"}, "ref": "不動產經紀業管理條例第7條", "id": 7, "chapter": "A4"}, {"year": 101, "qnum": 27, "stem": "下列敘述何者為錯誤？", "options": ["經紀業應將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處；其為加盟經營者，應併標明之", "經營仲介業務者應揭示報酬標準及收取方式於營業處所明顯之處", "經紀業或經紀人員不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金按中央主管機關規定之報酬標準計收", "違反收取差價或其他報酬禁止規定者，其已收取之差價或其他報酬，應全額加計利息後返還支付人"], "answer": "D", "explains": {"A": "揭示證照許可文件、加盟應標明，敘述正確，非本題答案。", "B": "仲介業務者應揭示報酬標準及收取方式，敘述正確，非本題答案。", "C": "依實際成交價金/租金按規定報酬標準計收，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。違反者應「加計利息後加倍返還」支付人，而非僅「加計利息後返還」，漏了「加倍」二字，屬常見數字/程度陷阱。"}, "ref": "不動產經紀業管理條例第18條、第20條、第19條", "id": 8, "chapter": "A4"}, {"year": 101, "qnum": 29, "stem": "下列有關申報登錄實際資訊之規定，何者為最正確？", "options": ["經營代銷業務者，對於起造人或建築業委託代銷之案件，應於委託代銷契約屆滿或終止十日內，向主管機關申報登錄成交案件實際資訊", "已登錄之不動產交易價格資訊，得為課稅依據", "經營仲介業務者，對於買賣或租賃委託案件，應於簽訂買賣契約書並辦竣所有權移轉登記或簽訂租賃契約書後十日內，向主管機關申報登錄成交案件實際資訊", "登錄之資訊，除涉及個人資料外，得供政府機關利用並以區段化、去識別化方式提供查詢"], "answer": "D", "explains": {"A": "代銷業務申報登錄期限為委託代銷契約屆滿或終止「30日內」，非十日內。", "B": "申報登錄之交易價格資訊依規定「不得作為課稅依據」，此為重要陷阱觀念。", "C": "仲介業務買賣/租賃案件申報登錄期限為「30日內」，非十日內。", "D": "正確。登錄資訊除涉個資外，得供政府機關利用，並以區段化、去識別化方式提供查詢（第24條之1）。"}, "ref": "不動產經紀業管理條例第24條之1（101年舊制申報期限規範；現行§24-1僅規範仲介租賃（簽訂租賃契約書之日起30日）與代銷預售屋，已無仲介買賣案件）。現行仲介買賣申報：依平均地權條例 §47Ⅱ 逐字——「權利人及義務人應於『買賣案件申請所有權移轉登記時』，檢附申報書『共同』向直轄市、縣（市）主管機關申報登錄土地及建物成交案件實際資訊」，沒有「幾日內」的起算點，也「不是由經紀業申報」（經紀業只在 §47Ⅵ 被列為查核時得要求說明的對象，且不得規避、妨礙或拒絕）；違反的罰則在 §81-2Ⅰ：先令限期申報，屆期未申報而買賣案件已辦竣移轉登記者處 3–15 萬並令限期改正，屆期未改正按次處罰，經處罰二次仍未改正者按次處 30–100 萬，含建物者按戶（棟）處罰。（2026-10-29 依使用者提供之 §47 逐字全文核實）", "id": 9, "chapter": "A4"}, {"year": 101, "qnum": 31, "stem": "經營仲介業務者同時接受買賣或租賃雙方之委託，下列敘述何者為錯誤？", "options": ["應公平提供雙方當事人類似不動產之交易價格", "應公平提供雙方當事人有關契約內容規範之說明", "應經買賣或租賃雙方當事人之口頭或書面同意", "應告知買受人或承租人依仲介專業應查知之不動產瑕疵"], "answer": "C", "explains": {"A": "雙方代理應公平提供類似不動產交易價格，屬法定義務，敘述正確。", "B": "雙方代理應公平提供契約內容規範說明，屬法定義務，敘述正確。", "C": "正確答案（錯誤敘述）。雙方代理須經買賣或租賃雙方當事人之「書面」同意，並非「口頭或書面」皆可，法律要求以書面為要件，此為★陷阱。", "D": "應告知應查知之瑕疵，屬法定義務，敘述正確。"}, "ref": "不動產經紀業管理條例第24條之2", "id": 10, "chapter": "A4"}, {"year": 101, "qnum": 36, "stem": "依不動產經紀業管理條例規定，經紀業因經紀人員執行仲介業務之故意或過失致交易當事人受損害者，原則上由下列何者負賠償責任？", "options": ["由經紀業單獨負賠償責任", "由經紀人員單獨負賠償責任", "由經紀業與經紀人員負連帶賠償責任", "由中華民國不動產仲介經紀業同業公會負賠償責任"], "answer": "C", "explains": {"A": "經紀人員執行業務故意過失致損害，非僅由經紀業單獨負責，而是連帶。", "B": "非僅經紀人員單獨負責，而是連帶。", "C": "正確。經紀人員執行業務故意或過失致交易當事人受損害者，經紀業與經紀人員負「連帶」賠償責任，與「不能履行委託契約」情形（僅經紀業負責）不同，須區辨。", "D": "同業公會全國聯合會僅於受害人取得執行名義未能受償時，得以營業保證基金代為賠償，並非原則上之賠償主體。"}, "ref": "不動產經紀業管理條例第26條第2項", "id": 11, "chapter": "A4"}, {"year": 101, "qnum": 38, "stem": "依不動產經紀業管理條例有關用辭定義之規定，下列敘述何者錯誤？", "options": ["經紀人員係指經紀人或經紀營業員", "代銷業務係指從事不動產買賣、互易、租賃之居間或代理業務", "差價係指實際買賣交易價格與委託銷售價格之差額", "預售屋係指領有建造執照尚未建造完成而以將來完成之建築物為交易標的之物"], "answer": "B", "explains": {"A": "經紀人員＝經紀人＋經紀營業員，定義正確，非本題答案。", "B": "正確答案（錯誤敘述）。「從事不動產買賣、互易、租賃之居間或代理業務」是「仲介業務」的定義，「代銷業務」則是「受起造人或建築業之委託，負責企劃並代理銷售不動產之業務」，兩者定義互換，屬★陷阱。", "C": "差價＝實際買賣交易價格與委託銷售價格之差額，定義正確（注意不是與行情價之差額）。", "D": "預售屋定義正確，非本題答案。"}, "ref": "不動產經紀業管理條例第4條", "id": 12, "chapter": "A4"}, {"year": 102, "qnum": 4, "stem": "代銷經紀業不須於營業處所揭示下列何種文件？", "options": ["經紀業許可文件", "同業公會會員證書", "不動產經紀人證書", "報酬標準及收取方式"], "answer": "D", "explains": {"A": "經紀業許可文件為應揭示文件，非本題答案。", "B": "同業公會會員證書為應揭示文件，非本題答案。", "C": "不動產經紀人證書為應揭示文件，非本題答案。", "D": "正確答案。代銷業之報酬由起造人／建築業支付而非向一般消費者收取固定比例報酬，法律未要求代銷業揭示報酬標準及收取方式（此為仲介業務者才須揭示之義務，★陷阱）。"}, "ref": "不動產經紀業管理條例第20條、第22條第2項", "id": 13, "chapter": "A4"}, {"year": 102, "qnum": 8, "stem": "關於不動產經紀業管理條例立法目的之敘述，以下何者錯誤？", "options": ["管理不動產經紀業", "限制交易者權益", "建立不動產交易秩序", "促進不動產交易市場健全發展"], "answer": "B", "explains": {"A": "管理不動產經紀業為立法目的之一，非本題答案。", "B": "正確答案（錯誤敘述）。條例第1條立法目的是「保障交易者權益」，而非「限制交易者權益」，文字方向相反，屬明顯陷阱。", "C": "建立不動產交易秩序為立法目的之一，非本題答案。", "D": "促進不動產交易市場健全發展為立法目的之一，非本題答案。"}, "ref": "不動產經紀業管理條例第1條", "id": 14, "chapter": "A4"}, {"year": 102, "qnum": 9, "stem": "不動產經紀業管理條例第 4 條第 5 款關於仲介業務內容規定之敘述，以下何者錯誤？", "options": ["從事不動產買賣之居間或代理業務", "從事不動產互易之居間或代理業務", "從事不動產租賃之居間或代理業務", "從事不動產管理之居間或代理業務"], "answer": "D", "explains": {"A": "買賣之居間或代理，屬仲介業務範圍，非本題答案。", "B": "互易之居間或代理，屬仲介業務範圍，非本題答案。", "C": "租賃之居間或代理，屬仲介業務範圍，非本題答案。", "D": "正確答案（錯誤敘述）。仲介業務僅限「買賣、互易、租賃」之居間或代理，不含「不動產管理」業務，此為易加碼混淆的陷阱選項。"}, "ref": "不動產經紀業管理條例第4條第5款", "id": 15, "chapter": "A4"}, {"year": 102, "qnum": 10, "stem": "依不動產經紀業管理條例第 4 條第 2 款之規定，所謂成屋，除於實施建築管理前建造完成之建築物外，係指以下何種建築物？", "options": ["領有建造執照之建築物", "領有使用執照之建築物", "完成保存登記之建築物", "完成門牌登記之建築物"], "answer": "B", "explains": {"A": "建造執照僅代表可以開工興建，與是否完工無關，非成屋定義要件。", "B": "正確。成屋係指「領有使用執照」，或於實施建築管理前建造完成之建築物，使用執照代表建築物已完工並經勘驗合格。", "C": "保存登記是產權登記程序，非成屋之法定定義要件。", "D": "門牌登記與成屋定義無關。"}, "ref": "不動產經紀業管理條例第4條第2款", "id": 16, "chapter": "A4"}, {"year": 102, "qnum": 12, "stem": "關於不動產經紀業或經紀人員之業務與責任之敘述，以下何者錯誤？", "options": ["經紀業與委託人以言詞或書面約定委託銷售後，方得刊登廣告及銷售", "經營仲介業務者經買賣或租賃雙方當事人之書面同意，得同時接受雙方之委託", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "經紀業或經紀人員不得收取差價或其他報酬，違反者其已收取之差價或其他報酬，應於加計利息後加倍返還支付人"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。須「簽訂委託契約書」（書面要式）後，方得刊登廣告及銷售，不能僅以「言詞」約定，此為★陷阱：委託契約書須以書面為之。", "B": "雙方代理須經雙方書面同意，敘述正確，非本題答案。", "C": "以說明書向相對人解說，屬經紀人員法定義務，敘述正確，非本題答案。", "D": "違反收費禁止規定應加計利息後加倍返還，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第21條、第25條", "id": 17, "chapter": "A4"}, {"year": 103, "qnum": 2, "stem": "甲經紀營業員任職於乙經紀業，於執行業務過程中，甲有無以不動產說明書向與委託人交易之相對人丙解說的義務？甲有無在不動產說明書上簽章的義務？", "options": ["有解說義務，亦有簽章義務", "有解說義務，但無簽章義務", "無解說義務，但有簽章義務", "無解說義務，亦無簽章義務"], "answer": "B", "explains": {"A": "經紀營業員無須在說明書上簽章，簽章者為「經紀人」（第22條），非經紀營業員，本選項錯誤。", "B": "正確。經紀人員（含經紀營業員）在執行業務過程中負有向相對人解說說明書之義務（第23條）；但說明書之簽章義務僅限「經紀人」（第22條），經紀營業員不須簽章，兩者主體不同，須區辨★陷阱。", "C": "經紀營業員有解說義務，本選項「無解說義務」錯誤。", "D": "經紀營業員有解說義務，本選項錯誤。"}, "ref": "不動產經紀業管理條例第22條、第23條", "id": 18, "chapter": "A4"}, {"year": 103, "qnum": 3, "stem": "甲經紀營業員任職於乙經紀業，但乙經紀業同意甲為丙經紀業執行業務，是否符合法律規定？", "options": ["符合法律規定，因為乙已同意", "不符合法律規定，因為甲有專任義務", "不符合法律規定，因為會有利益衝突", "不符合法律規定，因為此為雙方代理"], "answer": "A", "explains": {"A": "正確。經紀人員原則應專任一經紀業，但經「所屬經紀業同意」為他經紀業執行業務者，不在此限，故甲之情形符合法律規定，此為★陷阱：專任義務並非絕對禁止兼職。", "B": "雖有專任義務，但已取得所屬經紀業乙之同意，屬例外允許之情形，故本選項結論錯誤。", "C": "法律並未以「利益衝突」為由禁止此情形，經同意即為合法。", "D": "本題情形與「雙方代理」（同時受託買賣或租賃雙方）無關，是不同的法律概念。"}, "ref": "不動產經紀業管理條例第16條", "id": 19, "chapter": "A4"}, {"year": 103, "qnum": 6, "stem": "依不動產經紀業管理條例規定，受感訓處分之裁定確定者，可否充任不動產經紀人員？下列敍述何者正確？", "options": ["永遠不得充任", "執行完畢後，即得充任", "執行完畢後滿一年者，始得充任", "尚未執行完畢者，不得充任"], "answer": "D", "explains": {"A": "並非永遠不得充任，執行完畢後滿3年即可充任，非永久禁止。", "B": "執行完畢後尚須滿3年始得充任，非「執行完畢後即得充任」。", "C": "應為執行完畢後滿「3年」，非「1年」，數字錯誤。", "D": "正確。受感訓處分裁定確定，尚未執行完畢者，不得充任經紀人員；執行完畢後未滿3年者亦不得充任。本題敘述「尚未執行完畢者，不得充任」正確。"}, "ref": "不動產經紀業管理條例第6條", "id": 20, "chapter": "A4"}, {"year": 103, "qnum": 7, "stem": "依不動產經紀業管理條例規定，下列有關不動產說明書之相關敍述，何者錯誤？", "options": ["不動產說明書應由經紀業指派經紀人簽章", "不動產說明書於提供解說前，應經委託人簽章", "以不動產說明書向委託人交易之相對人解說前，應由相對人在不動產說明書上簽章", "經買賣雙方簽章之不動產說明書視為買賣契約書之一部分"], "answer": "C", "explains": {"A": "說明書應由經紀業指派經紀人簽章，敘述正確，非本題答案。", "B": "說明書提供解說「前」，應經「委託人」先簽章確認內容無誤，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。正確流程應為：解說前經委託人簽章→向相對人解說→締約時交付相對人並由「相對人」簽章。本選項誤將「相對人簽章」時點提前至「解說前」，且簽章人也搞混（應為委託人先簽而非相對人），為★極高頻陷阱。", "D": "經雙方簽章之說明書視為買賣契約書之一部分，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第23條、第24條", "id": 21, "chapter": "A4"}, {"year": 103, "qnum": 10, "stem": "甲將其 A 屋出賣給乙，上開案件委由丙地政士與丁仲介業處理。請問應由誰向主管機關申報登錄實價？", "options": ["甲", "乙", "丙", "丁"], "answer": "C", "explains": {"A": "買賣雙方本人並非法定申報登錄義務人。", "B": "買賣雙方本人並非法定申報登錄義務人。", "C": "正確。依規定，同時委託地政士辦理所有權移轉登記者，應優先由「地政士」辦理實價申報登錄，非由仲介業辦理，此為與登記業務連動之★陷阱規定。", "D": "若無委託地政士辦理登記，方由仲介業（丁）辦理申報登錄；本題已委託地政士丙，應由丙辦理。"}, "ref": "不動產經紀業管理條例第24條之1、地政士法相關規定", "id": 22, "chapter": "A4"}, {"year": 104, "qnum": 3, "stem": "不動產經紀人員執行業務，下列敘述何者錯誤？", "options": ["不動產說明書應經經紀人簽章", "以不動產說明書，向與委託人交易之相對人解說", "不動產說明書於提供解說後，應經委託人簽章", "不動產說明書視為買賣契約書之一部分"], "answer": "C", "explains": {"A": "說明書應經經紀人簽章，敘述正確，非本題答案。", "B": "以說明書向相對人解說，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應為「提供解說『前』，應經委託人簽章」，而非「解說後」，時點顛倒，此為★極高頻陷阱（與103年-7題同類型）。", "D": "經雙方簽章之說明書視為契約書之一部分，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第23條", "id": 23, "chapter": "A4"}, {"year": 104, "qnum": 23, "stem": "依不動產經紀業管理條例之規定，經紀人員不得收取差價。此「差價」係指下列何者？", "options": ["實際買賣交易價格與課稅評定價格之差額", "實際買賣交易價格與委託銷售價格之差額", "買賣契約價格與委託銷售價格之差額", "買賣契約價格與實價登錄價格之差額"], "answer": "B", "explains": {"A": "差價非與課稅評定價格比較，此為干擾選項。", "B": "正確。差價係指「實際買賣交易價格」與「委託銷售價格」之差額，此為法定定義，須牢記非與行情價或課稅價比較（★陷阱）。", "C": "「買賣契約價格」用語不精確，法定定義用語為「實際買賣交易價格」。", "D": "差價非與實價登錄價格比較，此為干擾選項。"}, "ref": "不動產經紀業管理條例第4條第9款", "id": 24, "chapter": "A4"}, {"year": 104, "qnum": 24, "stem": "依不動產經紀業管理條例之規定，有關經紀業之賠償責任，下列敘述何者錯誤？", "options": ["經紀業因經紀人員執行業務之故意致交易當事人受損害者，該經紀業與經紀人負連帶賠償責任", "經紀業因經紀人員執行業務之過失致交易當事人受損害者，該經紀業與經紀人負連帶賠償責任", "因不可歸責於委託人之事由不能履行委託契約，致委託人受損害時，由該經紀業負損害賠償責任", "因可歸責於經紀業之事由不能履行委託契約，致委託人受損害時，由該經紀業負損害賠償責任"], "answer": "C", "explains": {"A": "經紀人員執行業務故意致損害，經紀業與經紀人連帶賠償，敘述正確，非本題答案。", "B": "經紀人員執行業務過失致損害，經紀業與經紀人連帶賠償，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。法條規範的是「因『可歸責於經紀業』之事由不能履行委託契約」，而非「不可歸責於委託人」，主詞與歸責對象被替換，屬用語混淆★陷阱；且此情形本即應由經紀業負責，敘述看似正確但法條要件被偷換，須小心辨識。", "D": "因可歸責於經紀業之事由不能履行委託契約，由經紀業負賠償責任，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第26條", "id": 25, "chapter": "A4"}, {"year": 105, "qnum": 4, "stem": "依不動產經紀業管理條例規定，關於不動產經紀業者之行為規範，下列敘述何者錯誤？", "options": ["經營仲介業務者依民法禁止雙方代理原則，不得同時接受雙方之委託進行不動產買賣", "經營代銷業務者，對於起造人或建築業委託代銷之案件，應於委託代銷契約屆滿或終止30日內，向主管機關申報登錄成交案件實際資訊", "經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "經紀業不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金按中央主管機關規定之報酬標準計收"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。不動產經紀業管理條例第25條係「排除」民法禁止雙方代理原則之適用，經買賣或租賃雙方當事人書面同意，即得同時接受雙方委託，並非仍受民法禁止雙方代理原則拘束，此為★極高頻觀念陷阱。", "B": "代銷業務申報登錄期限為委託代銷契約屆滿或終止30日內，敘述正確，非本題答案。", "C": "須先簽訂委託契約書，方得刊登廣告及銷售，敘述正確，非本題答案。", "D": "不得收取差價或其他報酬，並依規定報酬標準計收，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第25條", "id": 26, "chapter": "A4"}, {"year": 105, "qnum": 6, "stem": "依不動產經紀業管理條例第 19 條規定，經紀業或經紀人員不得收取差價或其他報酬，違反規定者之處理，下列敘述何者正確？", "options": ["其已收取之差價或其他報酬，應返還支付人", "其已收取之差價或其他報酬，應加倍返還支付人", "其已收取之差價或其他報酬，應於加計利息後返還支付人", "其已收取之差價或其他報酬，應於加計利息後加倍返還支付人"], "answer": "D", "explains": {"A": "僅返還不足，法律要求加計利息並加倍返還，程度不足。", "B": "僅加倍返還而漏未加計利息，仍不完整。", "C": "僅加計利息返還而漏未加倍，仍不完整。", "D": "正確。違反收取差價或報酬禁止規定者，已收取之差價或報酬應「加計利息後加倍返還」支付人，四要素缺一不可（★高頻，常考單一要素被刪減之陷阱）。"}, "ref": "不動產經紀業管理條例第19條", "id": 27, "chapter": "A4"}, {"year": 105, "qnum": 20, "stem": "關於不動產經紀業者之行為，下列何者係法律所允許？", "options": ["於受託房屋之廣告虛增房屋總坪數", "未檢附具公信力之銷售數字、客戶調查等客觀數據，即於廣告上宣稱每年委託成交案量為全國第一", "為招攬客戶，推出委託成交之抽獎活動，頭獎為價值15000元之平板電腦一台（名額3名）", "與另一業者共同協議拒絕競爭對手參與聯賣"], "answer": "C", "explains": {"A": "廣告虛增坪數屬廣告內容與事實不符，違反第21條及公平交易法不實廣告規定，法律不允許。", "B": "未經客觀數據佐證即宣稱「全國第一」，屬不實或引人錯誤之廣告，違反公平交易法，法律不允許。", "C": "正確答案。合法之促銷抽獎活動（金額合理、據實舉辦）並未違反經紀業管理條例或公平交易法，屬法律所允許之招攬手法。", "D": "與其他業者協議拒絕競爭對手參與聯賣，屬公平交易法禁止之聯合行為／杯葛行為，法律不允許。"}, "ref": "不動產經紀業管理條例第21條、公平交易法相關規定", "id": 28, "chapter": "A4"}, {"year": 106, "qnum": 2, "stem": "下列有關不動產經紀人員經紀業之敘述，何者錯誤？", "options": ["經紀業因業務需要，必要時得以在其公司工作多年，表現良好，但未具備經紀人資格者，從事仲介或代銷業務", "經營仲介業務者，應揭示報酬標準及收取方式，於營業處所明顯之處", "經紀業刊登廣告與銷售內容時，應與事實相符，並註明經紀業名稱", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。經紀業不得僱用「未具經紀人員資格者」從事仲介或代銷業務，不因工作年資或表現良好而例外，此為強制規定★陷阱。", "B": "仲介業務者應揭示報酬標準及收取方式，敘述正確，非本題答案。", "C": "廣告銷售內容應與事實相符並註明經紀業名稱，敘述正確，非本題答案。", "D": "經紀人員應以說明書向相對人解說，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第17條", "id": 29, "chapter": "A4"}, {"year": 106, "qnum": 6, "stem": "不動產買賣交易實價資訊之登錄，應於不動產簽訂買賣契約辦竣所有權移轉登記後，何時向主管機關申報登錄成交案件實際資訊？", "options": ["30日內", "20日內", "10日內", "即時"], "answer": "A", "explains": {"A": "正確（依106年當時法條）。仲介業務買賣案件應於簽訂買賣契約書並辦竣所有權移轉登記後「30日內」申報登錄，此為106年出題當時之規則。⚠️請留意：現行《管理條例》§24-1 只規範仲介租賃案件（簽約日起30日內申報）與代銷預售屋，已不含仲介買賣案件；仲介買賣申報改依《平均地權條例》：依《平均地權條例》§47Ⅱ：由買賣雙方（權利人及義務人）於「申請所有權移轉登記時」檢附申報書共同申報，沒有「幾日內」的起算點，也不是由經紀業申報（2026-10-29 逐字核實）。本題僅適用出題當年的舊制情境。", "B": "非20日，數字錯誤。", "C": "非10日，數字錯誤。", "D": "非即時申報，仍有30日之法定期限。"}, "ref": "不動產經紀業管理條例第24條之1（106年舊制；現行§24-1僅規範仲介租賃（簽訂租賃契約書之日起30日）與代銷預售屋，已無仲介買賣案件）。現行仲介買賣申報：依平均地權條例 §47Ⅱ 逐字——「權利人及義務人應於『買賣案件申請所有權移轉登記時』，檢附申報書『共同』向直轄市、縣（市）主管機關申報登錄土地及建物成交案件實際資訊」，沒有「幾日內」的起算點，也「不是由經紀業申報」（經紀業只在 §47Ⅵ 被列為查核時得要求說明的對象，且不得規避、妨礙或拒絕）；違反的罰則在 §81-2Ⅰ：先令限期申報，屆期未申報而買賣案件已辦竣移轉登記者處 3–15 萬並令限期改正，屆期未改正按次處罰，經處罰二次仍未改正者按次處 30–100 萬，含建物者按戶（棟）處罰。（2026-10-29 依使用者提供之 §47 逐字全文核實）", "id": 30, "chapter": "A4"}, {"year": 106, "qnum": 11, "stem": "依不動產經紀業管理條例規定，經紀業或經紀人員不得收取差價或其他報酬。若有違反，則應如何處置？", "options": ["返還支付人已收取之差價或其他報酬", "加計利息後返還支付人已收取之差價或其他報酬", "加計利息後加倍返還支付人已收取之差價或其他報酬", "加計利息後加倍返還支付人已收取之差價或其他報酬，並負損害賠償責任"], "answer": "C", "explains": {"A": "僅返還不足，缺加計利息與加倍要件。", "B": "缺「加倍」要件，仍不完整。", "C": "正確。應「加計利息後加倍返還」支付人，此為法條明文規定之完整處置方式。", "D": "法條並未另外規定須負「損害賠償責任」，此為選項加碼延伸，超出法條規定範圍。"}, "ref": "不動產經紀業管理條例第19條", "id": 31, "chapter": "A4"}, {"year": 106, "qnum": 12, "stem": "不動產經紀人員執行仲介或代銷業務時，因過失致交易當事人受損害者，不動產經紀業者其賠償責任，下列敘述何者正確？", "options": ["由不動產經紀人員單獨負賠償責任", "由不動產經紀業單獨負賠償責任", "由不動產經紀業與經紀人員負連帶賠償責任", "不動產經紀業以有可歸責事由為限，始負連帶賠償責任"], "answer": "C", "explains": {"A": "非僅經紀人員單獨負責。", "B": "非僅經紀業單獨負責。", "C": "正確。經紀人員執行業務因過失（或故意）致交易當事人受損害者，經紀業應與經紀人員負「連帶」賠償責任，不以經紀業另有可歸責事由為限（此為僱用人連帶責任性質）。", "D": "連帶賠償責任並不以經紀業「另有可歸責事由」為限，此為錯誤限縮條件之陷阱。"}, "ref": "不動產經紀業管理條例第26條第2項", "id": 32, "chapter": "A4"}, {"year": 107, "qnum": 2, "stem": "何種情況之受害人，得向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會請求代為賠償？", "options": ["不可歸責於經紀業之事由不能履行委託契約，致委託人受損害者", "經營仲介業務者並未揭示報酬標準及收取方式於營業處所明顯之處，致受託人受損害者", "經紀業因經紀人員執行仲介或代銷業務之故意或過失致交易當事人受損害者", "非經紀業而經營仲介或代銷業務，致當事人受損害者"], "answer": "C", "explains": {"A": "不可歸責於經紀業之事由，經紀業本不負賠償責任，自無由全國聯合會代為賠償之問題。", "B": "未揭示文件屬行政違規，非本條所定得申請全國聯合會代為賠償之損害類型。", "C": "正確。經紀業因經紀人員執行業務故意或過失致交易當事人受損害，受害人取得執行名義後未能受償者，得向全國聯合會申請動支營業保證基金代為賠償（第26條第4項）。", "D": "非法經營經紀業務（無照經營）者不適用營業保證金制度，其設置係為合法登記經紀業之受害人設計的保障。"}, "ref": "不動產經紀業管理條例第26條第4項", "id": 33, "chapter": "A4"}, {"year": 107, "qnum": 7, "stem": "依不動產經紀業管理條例之規定，關於不動產經紀人證書之敘述，何者正確？", "options": ["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書", "中華民國之國民，經不動產經紀人考試及格，並依不動產經紀業管理條例領有不動產經紀人證書者，得充不動產經紀人", "經紀人證書有效期限為四年，期滿時，經紀人應檢附其於三年內在中央主管機關認可之機構、團體完成專業訓練三十個小時以上之證明文件，向直轄市或縣（市）政府辦理換證", "經紀業應將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處。其為加盟經營者，得免揭示"], "answer": "B", "explains": {"A": "應具備「1年以上」經紀營業員經驗，非「半年以上」，數字錯誤。", "B": "正確。國民經考試及格並依法領有經紀人證書者，得充不動產經紀人，敘述完整正確。", "C": "應檢附「4年內」完成30小時以上訓練證明，非「3年內」，數字錯誤（證書效期與訓練回溯期間皆為4年）。", "D": "加盟經營者「應併標明」，而非「得免揭示」，此為方向相反之陷阱。"}, "ref": "不動產經紀業管理條例第13條、第14條、第18條", "id": 34, "chapter": "A4"}, {"year": 107, "qnum": 23, "stem": "下列有關經紀業及經紀人員業務及責任之敘述，何者正確？", "options": ["不動產說明書應由經紀業指派經紀人員簽章", "經營仲介業務者，應依實際成交價金按中華民國不動產仲介經紀業同業公會全國聯合會規定之報酬標準計收", "不動產廣告及銷售內容，應與事實相符，並註明經紀業及經紀人員名稱", "經營仲介業務者經買賣雙方當事人之書面同意，得同時接受雙方之委託，並提供買受人關於不動產必要之資訊"], "answer": "D", "explains": {"A": "應由經紀業指派「經紀人」簽章，而非「經紀人員」（經紀人員含經紀營業員，範圍較廣但簽章權限僅限經紀人），用詞範圍擴大之陷阱。", "B": "報酬標準應依「中央主管機關」規定，而非「同業公會全國聯合會」規定，訂定機關錯誤。", "C": "廣告及銷售內容應與事實相符，並「註明經紀業名稱」即可，法條未要求同時註明經紀人員個人名稱。", "D": "正確。經雙方書面同意得同時受託（雙方代理），並應提供買受人必要資訊，敘述完整正確。"}, "ref": "不動產經紀業管理條例第21條、第22條、第25條", "id": 35, "chapter": "A4"}, {"year": 108, "qnum": 4, "stem": "不動產經紀業管理條例關於經紀業經營仲介與代銷業務之規範，下列敘述何者正確？", "options": ["受起造人或建築業之委託，負責企劃並代理銷售不動產之業務為仲介業務；從事不動產買賣、互易、租賃之居間或代理業務為代銷業務", "經營仲介業務者，應將報酬標準及收取方式於營業處所明顯處揭示；經營代銷業務者，則不須揭示之", "經營仲介業務者，應僱用具備經紀人員資格者從事業務；經營代銷業務者，則無此限制", "經營仲介業務者，有向主管機關申報登錄成交案件實際資訊之義務；經營代銷業務者，則無此義務"], "answer": "B", "explains": {"A": "仲介業務與代銷業務定義互換，敘述錯誤（受託企劃代理銷售為代銷業務；買賣互易租賃居間代理為仲介業務）。", "B": "正確。仲介業務者須揭示報酬標準及收取方式；代銷業務者因報酬來自起造人／建商，法律未要求揭示，敘述正確。", "C": "經紀業不論仲介或代銷業務，均不得僱用未具經紀人員資格者，並無「代銷業務則無此限制」之例外。", "D": "代銷業務同樣有申報登錄成交案件實際資訊之義務（僅期限起算點與仲介業務不同），並非無此義務。"}, "ref": "不動產經紀業管理條例第4條、第20條、第17條、第24條之1", "id": 36, "chapter": "A4"}, {"year": 108, "qnum": 7, "stem": "甲公司接受乙建築公司之委託，簽訂委託契約書後，負責企劃並代理銷售乙公司新推出之公寓大廈預售屋。下列敘述何者正確？", "options": ["雙方應簽訂委託銷售契約書，並由乙公司指派經紀人於契約書簽章", "甲公司於簽訂委託銷售契約書前，即得刊登廣告並開始銷售", "甲公司應將報酬標準及收取方式揭示於營業處所明顯之處", "乙公司之不動產廣告及銷售內容，應與事實相符，並註明甲公司名稱"], "answer": "D", "explains": {"A": "應由「甲公司」（經紀業）指派經紀人簽章，而非委託人乙公司指派，簽章義務主體錯誤。", "B": "須先簽訂委託契約書，方得刊登廣告及銷售，不得於簽約前即開始銷售。", "C": "甲公司為代銷經紀業，代銷業務者依法不須揭示報酬標準及收取方式（此義務僅限仲介業務者）。", "D": "正確。廣告及銷售內容應與事實相符，並註明「經紀業（甲公司）名稱」，敘述正確。"}, "ref": "不動產經紀業管理條例第20條、第21條", "id": 37, "chapter": "A4"}, {"year": 109, "qnum": 1, "stem": "關於不動產經紀業管理條例立法目的之敘述，下列何者正確？", "options": ["加強公寓大廈之管理維護", "發展租賃住宅服務業", "保障國民消費生活安全", "促進不動產交易市場健全發展"], "answer": "D", "explains": {"A": "公寓大廈管理維護為公寓大廈管理條例之立法目的，非本條例。", "B": "發展租賃住宅服務業為租賃住宅市場發展及管理條例之立法目的，非本條例。", "C": "保障國民消費生活安全為消費者保護法之立法目的，非本條例。", "D": "正確。本條例立法目的為管理不動產經紀業、建立不動產交易秩序、保障交易者權益、促進不動產交易市場健全發展。"}, "ref": "不動產經紀業管理條例第1條", "id": 38, "chapter": "A4"}, {"year": 109, "qnum": 14, "stem": "不動產經紀業應依不動產經紀業管理條例之規定，於營業處所明顯之處，揭示一定之文件。請問下列選項何者並非應於營業處所明顯之處揭示的文件？", "options": ["經紀業許可文件", "不動產說明書", "不動產經紀人證書", "報酬標準及收取方式"], "answer": "B", "explains": {"A": "經紀業許可文件為法定應揭示文件，非本題答案。", "B": "正確答案。不動產說明書是「個別交易案件」之文件，須於解說、締約時交付相對人簽章，並非須「常態揭示於營業處所」之文件，兩者性質不同，屬★陷阱。", "C": "不動產經紀人證書為法定應揭示文件，非本題答案。", "D": "報酬標準及收取方式為法定應揭示文件（仲介業務者），非本題答案。"}, "ref": "不動產經紀業管理條例第18條、第20條", "id": 39, "chapter": "A4"}, {"year": 110, "qnum": 8, "stem": "依不動產經紀業管理條例規定，對經營仲介業務者申報登錄資訊之敘述，下列何者錯誤？", "options": ["經營仲介業務者對於仲介成交買賣案件之申報登錄案件，應於簽訂買賣契約書並辦竣所有權移轉登記後三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "經營仲介業務者對於經手所成交之租賃案件，應於簽訂租賃契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得向經營仲介業者要求查詢、取閱有關文件或提出說明", "直轄市、縣（市）主管機關為查核經營仲介業務者申報登錄資訊，得委任所屬機關辦理"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。官方答案為A（此敘述錯誤）。本選項描述的是舊制規則（仲介買賣案件於簽約並辦竣移轉登記後30日內申報），現行《管理條例》§24-1 已不含仲介買賣案件，故此敘述與現行法不符。仲介買賣的申報改依《平均地權條例》：依《平均地權條例》§47Ⅱ：由買賣雙方（權利人及義務人）於「申請所有權移轉登記時」檢附申報書共同申報，沒有「幾日內」的起算點，也不是由經紀業申報（2026-10-29 依使用者提供之 §47 逐字全文核實）。先前寫的「新制改為簽約日起算」查無依據，已更正。", "B": "租賃案件應於簽訂租賃契約書之日起30日內申報登錄，敘述正確。", "C": "主管機關得要求查詢取閱文件或提出說明，屬查核權限，敘述正確。", "D": "主管機關得委任所屬機關辦理查核，敘述正確。"}, "ref": "不動產經紀業管理條例第24條之1（110年題；現行§24-1 已不含仲介買賣案件）。現行仲介買賣申報：依平均地權條例 §47Ⅱ 逐字——「權利人及義務人應於『買賣案件申請所有權移轉登記時』，檢附申報書『共同』向直轄市、縣（市）主管機關申報登錄土地及建物成交案件實際資訊」，沒有「幾日內」的起算點，也「不是由經紀業申報」（經紀業只在 §47Ⅵ 被列為查核時得要求說明的對象，且不得規避、妨礙或拒絕）；違反的罰則在 §81-2Ⅰ：先令限期申報，屆期未申報而買賣案件已辦竣移轉登記者處 3–15 萬並令限期改正，屆期未改正按次處罰，經處罰二次仍未改正者按次處 30–100 萬，含建物者按戶（棟）處罰。（2026-10-29 依使用者提供之 §47 逐字全文核實）", "id": 40, "chapter": "A4"}, {"year": 110, "qnum": 12, "stem": "甲要委託 A 房仲介公司不動產經紀營業員乙銷售自己的一戶房子。依不動產經紀業管理條例，下列敘述何者正確？", "options": ["甲與乙一定要先口頭定約定委託銷售之事宜", "甲與A房仲介公司必須簽訂委託銷售契約書", "乙刊登廣告及銷售內容，應與事實大致相符", "乙刊登銷售房子廣告要註明營業員乙的名稱"], "answer": "B", "explains": {"A": "委託銷售須以「書面」委託契約書為之，非僅口頭約定即可。", "B": "正確。經紀業（甲與A房仲介公司）須先簽訂委託契約書，方得刊登廣告及銷售，此為要式行為。", "C": "廣告及銷售內容應與事實「完全相符」，並非「大致相符」，程度用語錯誤。", "D": "廣告應註明「經紀業名稱」，而非個別營業員之名稱。"}, "ref": "不動產經紀業管理條例第21條", "id": 41, "chapter": "A4"}, {"year": 110, "qnum": 23, "stem": "經營代銷業務者，依不動產經紀業管理條例之規定，應指派不動產經紀人簽章之文件，下列何者錯誤？", "options": ["不動產廣告稿", "不動產出租、出售委託契約書", "不動產租賃、買賣契約書", "不動產說明書"], "answer": "B", "explains": {"A": "廣告稿仍為代銷業務應簽章之文件，非本題答案。", "B": "正確答案。「委託契約書」（第22條第1款）於經營「代銷業務」者不適用，因代銷業之委託關係存在於起造人／建商與代銷業者之間，並非與一般購屋人簽訂委託契約書，此為★高頻陷阱。", "C": "租賃、買賣契約書仍為代銷業務應簽章之文件，非本題答案。", "D": "不動產說明書仍為代銷業務應簽章之文件，非本題答案。"}, "ref": "不動產經紀業管理條例第22條第2項", "id": 42, "chapter": "A4"}, {"year": 111, "qnum": 3, "stem": "依不動產經紀業管理條例之規定，經營仲介業務者應揭示於營業處所明顯之處的文件，不包含那一項？", "options": ["不動產經紀人員之經歷與獲獎資料", "不動產經紀人證書", "報酬標準及收取方式", "仲介相關證照及許可文件"], "answer": "A", "explains": {"A": "正確答案。經紀人員個人之經歷與獲獎資料非法定應揭示文件，僅屬業者自行宣傳資料，法律未強制揭示。", "B": "不動產經紀人證書為法定應揭示文件，非本題答案。", "C": "報酬標準及收取方式為法定應揭示文件（仲介業務），非本題答案。", "D": "仲介相關證照及許可文件為法定應揭示文件，非本題答案。"}, "ref": "不動產經紀業管理條例第18條、第20條", "id": 43, "chapter": "A4"}, {"year": 111, "qnum": 4, "stem": "依不動產經紀業管理條例之規定，雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由何人在不動產說明書上簽章？", "options": ["不動產經紀人", "相對人", "地政士", "公司代表人"], "answer": "B", "explains": {"A": "經紀人已於製作說明書時簽章，此階段須簽章者為相對人。", "B": "正確。締約時，經紀人應將說明書交付相對人，並由「相對人」在說明書上簽章，此為解說流程的最後一步（第24條）。", "C": "地政士非本條例規範之簽章主體。", "D": "公司代表人非本條例規範之簽章主體。"}, "ref": "不動產經紀業管理條例第24條", "id": 44, "chapter": "A4"}, {"year": 112, "qnum": 3, "stem": "經營代銷業務者，下列何種文件不適用經紀業指派經紀人簽章規定？", "options": ["不動產說明書", "不動產廣告稿", "不動產租賃、買賣契約書", "不動產出租、出售委託契約書"], "answer": "D", "explains": {"A": "不動產說明書仍適用簽章規定，非本題答案。", "B": "不動產廣告稿仍適用簽章規定，非本題答案。", "C": "租賃、買賣契約書仍適用簽章規定，非本題答案。", "D": "正確答案。委託契約書（連同要約書）於代銷業務不適用，因代銷業之委託人為起造人／建商，與一般消費者間無委託契約書關係，★高頻重複命題陷阱。"}, "ref": "不動產經紀業管理條例第22條第2項", "id": 45, "chapter": "A4"}, {"year": 112, "qnum": 5, "stem": "根據不動產經紀業管理條例第 24 條之 1 之現行規定，下列何者正確？", "options": ["中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，維持以區段化、去識別化方式，提供查詢", "中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，應依同條第三項規定，除涉及個人資料外，重新提供查詢", "經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂買賣契約之日起三十日內，將委託代銷契約及買賣契約相關書件報請所在地直轄市、縣（市）主管機關備查", "經營仲介業務者，對於居間或代理成交之租賃案件，應於租賃物交付後，承租人占有中之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊"], "answer": "B", "explains": {"A": "修正施行後應「重新」依規定提供查詢，而非「維持」修正前之提供方式，敘述方向錯誤。", "B": "正確。109年12月30日修正條文施行前之申報登錄資訊，於施行後應依修正後規定（除涉個資外）重新提供查詢，符合法規過渡條款設計。", "C": "代銷業務應於「委託代銷契約屆滿或終止」起30日內辦理，而非「簽訂買賣契約之日起」，起算點錯誤。", "D": "租賃案件應於「簽訂租賃契約書之日起」30日內申報登錄，而非「租賃物交付後占有中之日起」，起算點錯誤。"}, "ref": "不動產經紀業管理條例第24條之1", "id": 46, "chapter": "A4"}, {"year": 113, "qnum": 1, "stem": "不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何者與不動產經紀業管理條例之規定不符？", "options": ["不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章", "經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "經紀人員於提供解說後，應將不動產說明書交由委託人簽章", "雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"], "answer": "C", "explains": {"A": "代銷業務亦適用說明書簽章規定（此為第22條第2項排除之委託契約書、要約書以外之文件），敘述符合規定，非本題答案。", "B": "經紀人員應以說明書向相對人解說，敘述符合規定，非本題答案。", "C": "正確答案（不符規定之敘述）。應為「解說『前』，經委託人簽章」，而非「解說後」；且解說後應由「相對人」簽章，並非再由「委託人」簽章，時序及簽章人皆錯誤，★極高頻重複命題陷阱。", "D": "經雙方簽章之說明書視為買賣契約書之一部分，敘述符合規定，非本題答案。"}, "ref": "不動產經紀業管理條例第23條、第24條", "id": 47, "chapter": "A4"}, {"year": 113, "qnum": 15, "stem": "有關不動產經紀業廣告，下列敘述何者正確？", "options": ["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章", "主打買地送屋，實際卻沒有房屋處分權", "廣告及相關銷售文宣註明不動產經紀業名稱", "廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"], "answer": "C", "explains": {"A": "僅標示加盟品牌名稱而未註明「本身經紀業名稱」不符第21條規定，屬違規廣告。", "B": "廣告內容誇大不實（無處分權卻主打送屋），違反廣告應與事實相符之規定。", "C": "正確。廣告及銷售文宣註明不動產經紀業名稱，符合第21條「應與事實相符，並註明經紀業名稱」之規定。", "D": "使用未經明確定義之面積名詞易使消費者混淆坪數計算方式，屬易生誤導之不當廣告用語，非法律所允許之作法。"}, "ref": "不動產經紀業管理條例第21條", "id": 48, "chapter": "A4"}, {"year": 113, "qnum": 19, "stem": "不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載「已確實攜回本契約書審閱 5 日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須 5 日以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？", "options": ["有效", "無效", "效力未定", "部分有效，部分無效"], "answer": "B", "explains": {"A": "此排除審閱期之條款違反消費者保護法對定型化契約審閱期之強制規定，非屬有效。", "B": "正確。以定型化契約條款排除消費者法定審閱期（不得低於5日），並以「確認即生效力」文字迫使消費者放棄審閱期權利，違反消費者保護法強制規定，該條款「無效」。", "C": "此非效力未定（效力未定通常涉及限制行為能力人或無權處分等情形），本題係違反強制規定，應直接認定無效。", "D": "整個排除審閱期之條款應認定為無效，非部分有效部分無效。"}, "ref": "消費者保護法第11條之1、不動產經紀業管理條例相關廣告及契約規範", "id": 49, "chapter": "A4"}, {"year": 114, "qnum": 22, "stem": "依不動產經紀業管理條例之規定，下列那一項關於簽章之敘述錯誤？", "options": ["經紀人員在執行業務過程中，不動產說明書於提供解說前，應經委託人簽章", "雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章", "委由經紀業仲介或代銷者，不動產租賃、買賣契約書文件應由經紀業指派經紀人簽章", "經營經紀業者，向主管機關申請許可之應備文件應由經紀業指派經紀人簽章"], "answer": "D", "explains": {"A": "解說前應經委託人簽章，敘述正確，非本題答案。", "B": "締約時交付相對人並由相對人簽章，敘述正確，非本題答案。", "C": "租賃、買賣契約書應由經紀業指派經紀人簽章，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。第22條所定應簽章之六類文件為交易過程文件（委託契約書、要約書、定金收據、廣告稿、說明書、租售契約書），並不包含「向主管機關申請許可之應備文件」，此類申設文件非交易文件，不適用第22條簽章規定，屬混淆範圍之陷阱。"}, "ref": "不動產經紀業管理條例第22條", "id": 50, "chapter": "A4"}, {"year": 114, "qnum": 23, "stem": "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，依不動產經紀業管理條例之規定，相關文件應由經紀業指派經紀人簽章。下列何者於經營代銷業務者不適用之？", "options": ["不動產出租、出售委託契約書", "定金收據", "不動產廣告稿", "不動產說明書"], "answer": "A", "explains": {"A": "正確。委託契約書（及要約書）於代銷業務不適用，因代銷業之委託關係存在於起造人／建商，非與一般消費者，此為本科目16年重複命題率最高的觀念之一，務必牢記。", "B": "定金收據仍適用於代銷業務，非本題答案。", "C": "不動產廣告稿仍適用於代銷業務，非本題答案。", "D": "不動產說明書仍適用於代銷業務，非本題答案。"}, "ref": "不動產經紀業管理條例第22條第2項", "id": 51, "chapter": "A4"}];
