<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LandLaw FGHI quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--paper:#F8F3E9;--ink:#2A2722;--stamp:#A8402B;--gold:#BC8A2E;--green:#4C7A52;--blue:#3A5A7A;--line:#D8CDB8;--expbg:#EDF3F8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;}
.app{max-width:760px;margin:0 auto;padding:14px 14px 60px;}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.25rem;text-align:center;margin:10px 0 2px;}
.sub{text-align:center;font-size:.75rem;color:#6b6354;margin-bottom:12px;}
.badge{background:var(--gold);color:#fff;font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
.filter-bar{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.filter-label{font-weight:700;font-size:.8rem;margin-bottom:8px;}
.ch-pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{font-size:.74rem;padding:5px 12px;border:1.5px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;color:var(--ink);}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.filter-actions{display:flex;gap:8px;margin-top:10px;}
.btn-sm{font-size:.78rem;padding:6px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.btn-sm.red{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.progress-panel{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;font-size:.78rem;color:#6b6354;}
.prog-wrap{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--gold);transition:width .3s;}
.prog-text{white-space:nowrap;font-weight:700;color:var(--ink);}
.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.9rem;color:var(--blue);padding:10px 0 6px;border-bottom:2px solid var(--blue);margin-bottom:10px;margin-top:16px;}
.qcard{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
.qcard.answered-ok{border-left:4px solid var(--green);}
.qcard.answered-ng{border-left:4px solid var(--stamp);}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:#8a7f72;margin-bottom:8px;}
.qtag{background:var(--blue);color:#fff;font-size:.64rem;padding:2px 7px;border-radius:8px;}
.qtext{font-family:"Noto Serif TC",serif;font-size:.96rem;line-height:1.75;margin-bottom:12px;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;width:100%;font-size:.88rem;line-height:1.5;color:var(--ink);}
.opt:disabled{cursor:default;}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:.76rem;}
.opt.ok{border-color:var(--green);background:#eef6ef;}
.opt.ok .ltr{background:var(--green);color:#fff;border-color:var(--green);}
.opt.ng{border-color:var(--stamp);background:#fbeeec;}
.opt.ng .ltr{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.opt.show-correct{border-color:var(--green);background:#eef6ef;}
.opt.show-correct .ltr{background:var(--green);color:#fff;border-color:var(--green);}
.expbox{display:none;margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--blue);}
.expbox.show{display:block;}
.exph{background:var(--blue);color:#fff;font-size:.73rem;font-weight:700;padding:6px 12px;}
.expb{background:var(--expbg);padding:10px 12px;}
.ei{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-bottom:1px solid #d0dae6;font-size:.81rem;line-height:1.6;}
.ei:last-child{border-bottom:none;}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;}
.el.ok{background:var(--green);color:#fff;}.el.no{background:#b0b8c4;color:#fff;}.el.ng{background:var(--stamp);color:#fff;}
.verdict{font-family:"Noto Serif TC",serif;font-weight:900;font-size:.82rem;padding:3px 12px;border-radius:6px;margin-bottom:7px;display:inline-block;transform:rotate(-2deg);}
.verdict.ok{border:2px solid var(--green);color:var(--green);}.verdict.ng{border:2px solid var(--stamp);color:var(--stamp);}</style>
</head>
<body>
<div class="app">
<h1>土地法 F+G+H+I篇 考題解析 <span class="badge">可自由瀏覽</span></h1>
<div class="sub">F1房屋稅 ／ G1契稅 ／ H1房地合一所得稅 ／ I1耕地三七五減租｜共 79 題</div>
<div class="filter-bar">
  <div class="filter-label">顯示章節</div>
  <div class="ch-pills" id="pills"></div>
  <div class="filter-actions">
    <button class="btn-sm" onclick="selAll()">全選</button>
    <button class="btn-sm" onclick="selNone()">清空</button>
    <button class="btn-sm red" onclick="resetAll()">重置作答</button>
  </div>
</div>
<div class="progress-panel">
  <div class="prog-wrap"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  <div class="prog-text"><span id="pd">0</span>/<span id="pt">0</span> 已答・正確率 <span id="pr">-</span></div>
</div>
<div id="list"></div>
</div>
<script>const CARDS=[{"ch": "F1 房屋稅", "year": "99", "num": 31, "q": "依房屋稅條例之規定，住家用房屋稅率最低不得少於其房屋現值百分之一點二，最高不得超過百分之二。但自住房屋為其房屋現值多少？", "opts": ["百分之一", "百分之一點二", "百分之一點五", "百分之三"], "ans": 1, "exps": ["❌ 1%是舊條文公益出租人出租使用的稅率（現行已併入1.2%），不是自住房屋的稅率。", "✓ 房屋稅條例§5：供自住的住家用房屋，稅率為1.2%（本題題幹為舊條文）。⚠️現行法：自住1.2%（本人、配偶、未成年子女全國3戶以內），其他住家用2%～4.8%。", "❌ 1.5%不是自住稅率；1.5%～2.5%是私人醫院、診所等非營業用的區間。", "❌ 3%不是自住稅率；3%～5%是非住家營業用的區間。"]}, {"ch": "F1 房屋稅", "year": "99", "num": 33, "q": "依房屋稅條例之規定，房屋標準價格，由不動產評價委員會依規定評定之，並由直轄市、縣（市）政府公告，且須多久重行評定一次？", "opts": ["每一年", "每二年", "每三年", "每四年"], "ans": 2, "exps": ["❌ 1年週期過短，不是法定重行評定頻率。", "❌ 2年不是法定重行評定頻率。", "✓ 房屋稅條例第11條：房屋標準價格由不動產評價委員會評定，直轄市縣市政府公告，每「3年」重行評定一次。3年是F1最基本的固定數字考點。", "❌ 4年不是法定重行評定頻率。"]}, {"ch": "F1 房屋稅", "year": "100", "num": 10, "q": "依房屋稅條例規定，私有房屋有下列何種情形，免徵房屋稅？", "opts": ["政府平價配售之平民住宅", "司法保護事業所有之房屋", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積佔整棟面積三成以上不及五成之房屋"], "ans": 1, "exps": ["❌ 平民住宅是「減半徵收」（非免徵），本選項與正確法律效果不符。", "✓ 本題官方答案：司法保護事業所有之房屋為法定「免徵」房屋稅之情形之一。注意這個與101-34、101-32題不同年度的考法常互相對照，務必記住司法保護事業房屋屬於免徵清單。", "❌ 工廠供直接生產使用之自有房屋是「減半徵收」（非免徵），依104-40題確認答案，與本選項描述的法律效果不符。", "❌ 毀損30%以上未達50%是「減半徵收」（非免徵），免徵的門檻是毀損達50%以上且須修復始能使用。"]}, {"ch": "F1 房屋稅", "year": "100", "num": 31, "q": "依房屋稅條例規定，主管稽徵機關應依據不動產評價委員會評定之標準，核計房屋現值。依前項規定核計之房屋現值，主管稽徵機關應通知納稅義務人。納稅義務人如有異議，得於接到通知書之日起幾日內，檢附證件，申請重行核計？", "opts": ["五日", "十日", "十五日", "三十日"], "ans": 3, "exps": ["❌ 5日過短，不是法定異議申請期限。", "❌ 10日不是法定期限。", "❌ 15日不是法定期限。", "✓ 房屋稅條例第10條：納稅義務人對主管稽徵機關核計之房屋現值如有異議，得於接到通知書之日起「30日」內，檢附證件申請重行核計。30日是F1標準的異議申請期限。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 22, "q": "依房屋稅條例之規定，房屋稅之徵收率由何者規定？", "opts": ["財政部", "立法院", "直轄市及縣（市）政府", "當地民意機關"], "ans": 2, "exps": ["❌ 財政部是中央主管機關，但不是房屋稅徵收率的擬定機關。", "❌ 立法院是中央立法機關，不是房屋稅徵收率的擬定機關。", "✓ 房屋稅條例第5條：房屋稅徵收率由直轄市及縣市政府於法定範圍內擬定，提經當地民意機關通過後實施。是「地方政府擬定＋地方議會通過」的二階段程序，本題只問「由何者規定」，答案是直轄市縣市政府（擬定主體）。", "❌ 民意機關是「通過」徵收率的審議機關，不是「擬定」徵收率的提案機關，兩者角色不同，本題問的是擬定主體。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 32, "q": "依照規定，下列房屋，何者免徵房屋稅？", "opts": ["政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之房屋", "受重大災害，毀損面積佔整棟面積三成以上不及五成之房屋"], "ans": 2, "exps": ["❌ 平民住宅是「減半徵收」，不是免徵，本選項法律效果不符。", "❌ 此為「減半徵收」（非免徵），不符題目所問的免徵情形。", "✓ 房屋稅條例第15條：受重大災害，毀損面積占整棟面積「50%以上」，必須修復始能使用之房屋，「免徵」房屋稅。50%是免徵的門檻（區別於30%~未達50%的減半徵收門檻）。", "❌ 毀損30%以上未達50%是「減半徵收」，不是免徵，未達免徵的50%門檻。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 33, "q": "李先生擁有面積300平方公尺的房屋1幢，同時供住家及非住家使用。依現行房屋稅條例之規定，其適用非住家用稅率課徵房屋稅之面積，最低不得少於多少平方公尺？", "opts": ["30", "50", "60", "150"], "ans": 1, "exps": ["❌ 30平方公尺不足全部面積300的六分之一（50），不是最低面積。", "✓ 房屋同時供住家及非住家使用，非住家用稅率的面積最低不得少於全部面積六分之一。300÷6＝50平方公尺。", "❌ 60平方公尺不是300平方公尺的六分之一，不符法定比例。", "❌ 150平方公尺是全部面積的二分之一，並非法定最低比例。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 34, "q": "依房屋稅條例規定，私有房屋有下列情形之一者，其房屋稅減半徵收？", "opts": ["完成財團法人登記且經立案之私立學校辦公使用之自有房屋", "無償供政府機關公用或供軍用之房屋", "受重大災害，毀損面積佔整棟面積三成以上不及五成之房屋", "農會所有之倉庫，專供糧政機關儲存公糧，經主管機關證明者"], "ans": 2, "exps": ["❌ 完成財團法人登記且立案之私立學校辦公自有房屋，是免徵（§15 Ⅰ），不是減半。", "❌ 無償供政府機關公用或軍用之房屋，是免徵房屋稅（§15 Ⅰ），不是減半。", "✓ 房屋稅條例§15 Ⅱ：受重大災害，毀損面積占整棟30%以上未達50%，減半徵收。毀損50%以上且須修復始能使用才免徵。", "❌ 農會專供糧政機關儲存公糧之倉庫（經主管機關證明）是免徵（§15 Ⅰ）；農會自用倉庫及檢驗場才減半。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 35, "q": "非住家用房屋稅，下列規定何者最正確？", "opts": ["其為營業用者，最低不得少於其房屋現值百分之一，最高不得超過百分之三。其為私人醫院、診所、自由職業事務所及人民團體等非營業用者，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點五", "其為營業用者，最低不得少於其房屋現值百分之一，最高不得超過百分之三。其為私人醫院、診所、自由職業事務所及人民團體等非營業用者，最低不得少於其房屋現值百分之二點五，最高不得超過百分之三點五", "其為營業用者，最低不得少於其房屋現值百分之三，最高不得超過百分之五。其為私人醫院、診所、自由職業事務所及人民團體等非營業用者，最低不得少於其房屋現值百分之二點五，最高不得超過百分之三點五", "其為營業用者，最低不得少於其房屋現值百分之三，最高不得超過百分之五。其為私人醫院、診所、自由職業事務所及人民團體等非營業用者，最低不得少於其房屋現值百分之一點五，最高不得超過百分之二點五"], "ans": 3, "exps": ["❌ 營業用稅率區間錯誤（應為3%~5%，不是1%~3%）。", "❌ 兩個區間都錯誤，營業用應為3%~5%，非營業用應為1.5%~2.5%。", "❌ 營業用區間正確（3%~5%），但非營業用區間錯誤（應為1.5%~2.5%，不是2.5%~3.5%）。", "✓ 房屋稅條例第5條：營業用稅率區間3%~5%；私人醫院診所自由職業事務所人民團體等非營業用稅率區間1.5%~2.5%。兩個區間都正確對應，本選項完全正確。⚠️現行法（2026-10-08核對）：私人醫院、診所、自由職業事務所已併入營業用3%～5%，僅人民團體等非營業用為1.5%～2.5%；本題以考試當年條文為準。"]}, {"ch": "F1 房屋稅", "year": "101", "num": 36, "q": "房屋稅納稅義務人應於房屋移轉完成之日起多少日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形？", "opts": ["七日", "十日", "二十日", "三十日"], "ans": 3, "exps": ["❌ 7日不是法定申報期限。", "❌ 10日不是法定申報期限。", "❌ 20日不是法定申報期限。", "✓ 房屋稅條例規定，房屋稅籍變更（含房屋移轉完成）應於變更之日起「30日」內向主管稽徵機關申報。30日是房屋稅各項申報期限的統一標準，與房屋現值異議申請期限（同樣30日）一致。"]}, {"ch": "F1 房屋稅", "year": "102", "num": 20, "q": "依房屋稅條例規定，私有房屋有下列何種情形，其房屋稅減半徵收？", "opts": ["政府平價配售之平民住宅", "司法保護事業所有之房屋", "無償供政府機構公用之房屋", "政府配供貧民居住之房屋"], "ans": 0, "exps": ["✓ 房屋稅條例§15 Ⅱ：政府平價配售之平民住宅，房屋稅減半徵收，不是免徵。", "❌ 司法保護事業所有之房屋是免徵（§15 Ⅰ），不是減半徵收。", "❌ 無償供政府機關公用之房屋是免徵（§15 Ⅰ），不是減半徵收。", "❌ 減半徵收的是政府平價配售之平民住宅；本項「配供貧民居住之房屋」不是減半情形。"]}, {"ch": "F1 房屋稅", "year": "102", "num": 21, "q": "依房屋稅條例規定，房屋稅每年徵收一次。對新建、增建或改建之房屋，於當期建造完成者，應如何計課？", "opts": ["免予計課", "一律按年減半徵收之", "按月比例計課，未滿一個月者不計", "按週比例計課，未滿一週者不計"], "ans": 2, "exps": ["❌ 新建增建改建房屋當期建造完成，不是免予計課，而是按比例計課。", "❌ 不是「一律減半」，而是按實際使用月數比例計課。", "✓ 房屋稅條例第7條：新建、增建或改建之房屋，於當期建造完成者，「按月比例計課」，未滿1個月者不計。這是按實際使用時間合理課稅的設計，避免年度中途完工的房屋被全年課稅或完全免課。", "❌ 法定單位是「月」，不是「週」，計算單位錯誤。"]}, {"ch": "F1 房屋稅", "year": "103", "num": 4, "q": "下列有關房屋稅補稅、罰鍰與滯納金之敘述何者正確？", "opts": ["納稅義務人未依規定期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處以三倍罰鍰", "納稅義務人未依規定期限申報，因而發生漏稅者，除責令補繳應納稅額外，並按所漏稅額處以五倍罰鍰", "納稅義務人未於稅單所載限繳日期內繳清應納稅款者，每逾二日按滯納數額加徵百分之一滯納金", "納稅義務人未於稅單所載限繳日期內繳清應納稅款者，每逾二日按滯納數額加徵百分之三滯納金"], "ans": 2, "exps": ["❌ 罰鍰倍數應為「2倍以下」（非3倍），本選項數字過高且未加「以下」的限定詞。", "❌ 5倍遠超法定罰鍰倍數，數字錯誤。", "✓ 房屋稅條例：逾期繳納稅款，每逾2日加徵滯納數額1%滯納金。這個「2日、1%」的組合是房屋稅滯納金計算的固定考點，與契稅的滯納金計算方式相同。", "❌ 滯納金比率是1%（非3%），數字錯誤。"]}, {"ch": "F1 房屋稅", "year": "103", "num": 5, "q": "下列有關房屋稅稅率課徵之敘述何者正確？", "opts": ["供自住或公益出租人出租使用者，為其房屋現值百分之一", "其他供住家用者，最低不得少於其房屋現值百分之一，最高不得超過百分之三", "供人民團體等非營業使用者，最低不得少於其房屋現值百分之一，最高不得超過百分之三", "供營業、私人醫院、診所或自由職業事務所使用者，最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "ans": 3, "exps": ["❌ 自住稅率是1.2%，不是1%；1%是舊條文公益出租人出租使用的稅率（現行已與自住併列1.2%）。", "❌ 其他供住家用（非自住）的稅率區間是2%～4.8%，不是1%～3%。", "❌ 人民團體等非營業用的稅率區間是1.5%～2.5%，不是1%～3%。", "✓ 房屋稅條例§5：供營業及私人醫院、診所、自由職業事務所使用者，稅率3%～5%（依本題條文）。⚠️現行法：1.5%～2.5%現僅適用人民團體等非營業用。"]}, {"ch": "F1 房屋稅", "year": "103", "num": 11, "q": "某甲於民國102年3月1日購買房地產A，並於同年4月1日完成登記，購買房地產後因小孩在外縣市就學，某甲夫妻及未成年子女戶籍皆未設籍於該房地產，但某甲將父親戶籍設於該房地產，若某甲僅有房地產A，妻及未成年子女名下亦無房地產，民國103年3月5日將該房地產以1,000萬元簽約出售，持有期間並未供營業或出租，依特種貨物及勞務稅、地價稅、房屋稅之相關課徵規定，下列何者正確？", "opts": ["某甲出售房地產A無須課徵特種貨物及勞務稅", "某甲持有房地產A期間，符合申請地價稅自用住宅稅率之條件", "某甲出售房地產A須課徵特種貨物及勞務稅，其稅率為百分之十", "某甲持有房地產A期間，不符合房屋稅住家用自用稅率"], "ans": 1, "exps": ["❌ 持有未滿2年，且本人、配偶、未成年子女均未設籍，不符自住排除，仍須課特銷稅。", "✓ 土地稅法§17：自用住宅用地要件為所有權人或其配偶、直系親屬辦竣戶籍。父親是直系親屬且已設籍，符合地價稅自用住宅稅率。", "❌ 特銷稅持有期間自登記日（102.4.1）算到出售日（103.3.5），約11個月，稅率15%而非10%。", "❌ 房屋稅自住也是本人、配偶或直系親屬居住，父親是直系親屬，所以符合自住稅率。"]}, {"ch": "F1 房屋稅", "year": "104", "num": 38, "q": "依現行房屋稅條例規定，房屋標準價格依法定事項分別評定，下列何者不屬之？", "opts": ["房屋建造材料", "房屋耐用年數及折舊標準", "房屋所在不同地段之地價水準", "房屋所處街道村里之地段調整率"], "ans": 2, "exps": ["❌ 此為法定評定房屋標準價格的因素之一，屬之。", "❌ 此為法定評定因素之一，屬之。", "✓ 房屋標準價格的法定評定因素為：房屋建造材料、房屋耐用年數及折舊標準、房屋所處街道村里之地段調整率三項。本選項說的是「地段之地價水準」，這是地價的概念（屬於地價稅、土地增值稅的範疇），房屋稅課的是房屋本身的價值（建材、年限、地段調整率），不直接以土地地價水準作為評定因素，這是F1的重要陷阱。", "❌ 此為法定評定因素之一（注意與C選項的「地價水準」不同，「地段調整率」是法定因素，「地價水準」不是），屬之。"]}, {"ch": "F1 房屋稅", "year": "104", "num": 39, "q": "有關房屋稅之課徵，下列敘述，何者錯誤？", "opts": ["房屋設有典權者，房屋稅向典權人徵收之", "無建造執照之房屋，免徵收房屋稅", "房屋稅每年之開徵日期，由省（市）政府定之", "政府平價配售之平民住宅，房屋稅減半徵收"], "ans": 1, "exps": ["❌ 本選項描述正確，典權房屋的房屋稅納稅義務人是典權人，非錯誤。", "✓ 本選項為錯誤敘述：無建造執照的房屋（違章建築）並非「免徵房屋稅」，房屋稅的課徵與建物是否合法（有無建照）無關，違章建築一樣要課房屋稅（這是稅法上「實質課稅」的精神，不因建物違法就免除稅捐義務）。", "❌ 本選項描述正確（依當時法制設計，省市政府訂定開徵日期），非錯誤。", "❌ 本選項描述正確，符合減半徵收規定（同102-20題），非錯誤。"]}, {"ch": "F1 房屋稅", "year": "104", "num": 40, "q": "關於合法登記之工廠，提供直接生產使用之自有房屋，其房屋稅之徵收，下列何者正確？", "opts": ["減半", "免徵", "按房屋現值百分之三", "按房屋現值百分之一點二"], "ans": 0, "exps": ["✓ 房屋稅條例§15 Ⅱ：合法登記工廠供直接生產使用之自有房屋，減半徵收。同屬減半的還有平價配售之平民住宅、農會自用倉庫及檢驗場。", "❌ 工廠供直接生產使用之自有房屋是減半徵收，不是免徵，這是常見混淆點。", "❌ 3%不是工廠房屋的課徵方式；優惠是按原稅額減半。", "❌ 1.2%是自住住家用的稅率，與工廠房屋的減半規定無關。"]}, {"ch": "F1 房屋稅", "year": "105", "num": 5, "q": "依房屋稅條例規定，房屋標準價格由下列何委員會負責？", "opts": ["地價評議委員會", "不動產仲裁委員會", "不動產評議委員會", "不動產評價委員會"], "ans": 3, "exps": ["❌ 地價評議委員會負責的是地價稅的累進起點地價及地價評定，不是房屋標準價格。", "❌ 此委員會為虛構名稱，房屋稅條例無此機構。", "❌ 名稱接近但不正確，正確名稱是「不動產評價委員會」（評議vs評價，一字之差是常見陷阱）。", "✓ 房屋稅條例第9條：房屋標準價格由「不動產評價委員會」評定，並由直轄市縣市政府公告。「評價」（非評議、非仲裁）委員會是F1的固定機關名稱考點。"]}, {"ch": "F1 房屋稅", "year": "105", "num": 6, "q": "依據房屋稅條例規定，房屋稅之納稅義務人不包括下列何者？", "opts": ["所有權人", "債權人", "典權人", "信託受託人"], "ans": 1, "exps": ["❌ 所有權人是房屋稅最基本的納稅義務人，屬之。", "✓ 房屋稅的納稅義務人清單包括：所有權人、典權人、共有人推定一人、信託受託人、使用執照所載起造人（未辦保存登記情形）等，但「債權人」不在此清單內。一般債權人（例如借款給屋主的人）對房屋沒有使用收益的物權關係，不負擔房屋稅義務。", "❌ 典權人是法定納稅義務人之一，屬之。", "❌ 信託房屋於信託關係存續中，受託人是法定納稅義務人，屬之。"]}, {"ch": "F1 房屋稅", "year": "106", "num": 17, "q": "下列何者非申請自住房屋稅稅率之要件？", "opts": ["土地所有權人或其配偶、直系親屬於房屋所在地辦竣戶籍登記", "房屋無出租使用", "供本人、配偶或直系親屬實際居住使用", "本人、配偶及未成年子女全國合計3戶以內"], "ans": 0, "exps": ["✓ 本選項為本題「非屬」自住房屋稅要件的答案：本選項用詞是「土地所有權人」，但本題自住房屋稅率的要件對象應是「房屋所有人」（本人）或其配偶、直系親屬辦竣戶籍登記，「土地所有權人」的措辭混淆了房屋稅（針對房屋）與地價稅（針對土地）的權利主體，故本選項的描述不精確，非自住房屋稅要件的正確表述。", "❌ 房屋無出租是自住房屋稅率的要件之一，屬之。", "❌ 實際居住使用是自住房屋稅率的要件之一，屬之。", "❌ 全國合計3戶以內是自住房屋稅率的要件之一，屬之。"]}, {"ch": "F1 房屋稅", "year": "107", "num": 24, "q": "依房屋稅條例規定，私有房屋受重大災害時，有關房屋稅之減免，下列敘述何者正確？", "opts": ["毀損面積佔整棟面積三成以上，不及五成之房屋，免徵房屋稅", "毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，免徵房屋稅", "毀損面積佔整棟面積五成以上，其房屋稅減半徵收", "毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，其房屋稅減半徵收"], "ans": 1, "exps": ["❌ 30%以上未達50%是「減半徵收」，不是「免徵」，本選項法律效果錯誤。", "✓ 同101-32，毀損50%以上且必須修復始能使用，房屋稅「免徵」。50%是免徵與減半的分界門檻。", "❌ 50%以上應是「免徵」（非減半），且本選項漏掉「必須修復始能使用」這個重要前提要件。", "❌ 描述了正確的要件（50%以上且須修復），但法律效果應是「免徵」，不是「減半徵收」，本選項把效果說錯了。"]}, {"ch": "F1 房屋稅", "year": "109", "num": 1, "q": "依房屋稅條例規定，下列敘述何者錯誤？", "opts": ["合法登記之工廠供直接生產使用之自有房屋，免徵房屋稅", "受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之私有房屋，免徵房屋稅", "房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格", "各級政府機關及地方自治機關之公有辦公房屋及其員工宿舍，免徵房屋稅"], "ans": 0, "exps": ["✓ 本選項為錯誤敘述：合法登記工廠供直接生產使用之自有房屋是「減半徵收」（同104-40），不是「免徵」，本選項法律效果錯誤，為本題答案。", "❌ 本選項描述正確，符合法定免徵情形（同101-32），非錯誤。", "❌ 本選項描述正確，3年重行評定週期及按年折舊符合法條規定，非錯誤。", "❌ 本選項描述正確，公有機關辦公房屋免徵房屋稅，非錯誤。"]}, {"ch": "F1 房屋稅", "year": "109", "num": 19, "q": "依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，下列何者為房屋稅之納稅義務人？", "opts": ["委託人", "受託人", "受益人", "監察人"], "ans": 1, "exps": ["❌ 一般情形委託人不是房屋稅的法定納稅義務人。", "✓ 房屋稅條例：房屋為信託財產者，於信託關係存續中，以「受託人」為房屋稅之納稅義務人。與地價稅的信託土地規定一致（受託人是名義持有人，負責管理使用，故由其負擔稅捐）。", "❌ 受益人享有信託利益，但不是法定納稅義務人。", "❌ 信託監察人是監督角色，不是納稅義務人。"]}, {"ch": "F1 房屋稅", "year": "111", "num": 4, "q": "依房屋稅條例之規定，下列有關房屋稅納稅義務人之敘述，何者錯誤？", "opts": ["原則上向房屋所有人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，向使用執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照者，向建造執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照、亦無建造執照者，暫不徵收之"], "ans": 3, "exps": ["❌ 本選項描述正確，房屋所有人是房屋稅基本的納稅義務人，非錯誤。", "❌ 本選項描述正確，符合法定順位規定（有使用執照者向起造人徵收），非錯誤。", "❌ 本選項描述正確，無使用執照但有建造執照者，向建造執照起造人徵收，符合法定順位，非錯誤。", "✓ 本選項為錯誤敘述：無使用執照、亦無建造執照的房屋（完全無證照的違建），房屋稅應「向現住人或管理人徵收」，不是「暫不徵收」。「暫不徵收」違反房屋稅的實質課稅原則，本選項描述錯誤。"]}, {"ch": "F1 房屋稅", "year": "113", "num": 19, "q": "依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？", "opts": ["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四", "最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "ans": 1, "exps": ["❌ 此區間不符合待銷售住家用房屋的特殊稅率規定。", "✓ 房屋稅條例：起造人持有使用執照所載用途為住家用之「待銷售」房屋，於起課房屋稅「2年內」，按「2%~3.6%」之特殊稅率課徵（比一般自住的1.2%高，但比非自住住家用的最高4.8%低，反映建商待售房屋的特殊性質）。2年內、2%~3.6%是固定組合考點。", "❌ 上限應為3.6%，不是4.8%（4.8%是非自住住家用一般房屋的最高稅率）。", "❌ 此區間是營業用房屋的稅率，不是待銷售住家用房屋的稅率。"]}, {"ch": "F1 房屋稅", "year": "113", "num": 24, "q": "依房屋稅條例規定，下列有關自住使用之住家用房屋適用1.2%計徵房屋稅之要件，何者錯誤？", "opts": ["無出租或供營業情形", "房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記", "房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下", "房屋所有人本人、配偶或直系親屬實際居住使用"], "ans": 2, "exps": ["❌ 本選項描述正確，無出租無營業是自住稅率的要件之一，非錯誤。", "❌ 本選項描述正確，戶籍登記是要件之一，非錯誤。", "✓ 本選項為錯誤敘述：1.2%自住稅率的要件是「本人配偶未成年子女全國合計3戶以內」（不是「僅持有一戶」），且法條也沒有「房屋現值在一定金額以下」這個額外限制。本選項把「3戶以內」誤植為「僅一戶」，並增加了不存在的金額限制，為本題答案。", "❌ 本選項描述正確，實際居住使用是要件之一，非錯誤。"]}, {"ch": "F1 房屋稅", "year": "114", "num": 5, "q": "下列關於房屋稅納稅義務人的認定，何者錯誤？", "opts": ["以土地設定地上權之使用權房屋，為該使用權人", "共有房屋向共有人徵收，並由共有人推定一人繳納", "未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收", "房屋為信託財產，在信託關係存續中，為受託人"], "ans": 2, "exps": ["❌ 本選項描述正確，使用權房屋的納稅義務人是使用權人，非錯誤。", "❌ 本選項描述正確，共有房屋的納稅安排符合法條規定，非錯誤。", "✓ 本選項為錯誤敘述：法定優先順位是「先向使用執照所載起造人徵收，無使用執照者才向建造執照所載起造人徵收」，本選項說「優先向建造執照所載起造人徵收」，跳過了使用執照優先的順位，順序錯誤，為本題答案。", "❌ 本選項描述正確，受託人是法定納稅義務人，非錯誤。"]}, {"ch": "F1 房屋稅", "year": "114", "num": 15, "q": "依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？", "opts": ["無償供政府機關公用或供軍用之房屋", "政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"], "ans": 0, "exps": ["✓ 房屋稅條例§15 Ⅰ：無償供政府機關公用或供軍用之私有房屋，免徵房屋稅。", "❌ 政府平價配售之平民住宅是減半徵收（§15 Ⅱ），不是免徵。", "❌ 合法登記工廠供直接生產使用之自有房屋是減半徵收，不是免徵。", "❌ 毀損30%以上未達50%是減半徵收；免徵門檻是毀損50%以上且須修復始能使用。"]}, {"ch": "G1 契稅", "year": "100", "num": 9, "q": "依契稅條例規定，占有契稅為其契價多少百分比？", "opts": ["百分之二", "百分之四", "百分之六", "百分之八"], "ans": 2, "exps": ["❌ 2%是交換或分割契稅的稅率，不是占有契稅的稅率。", "❌ 4%是典權契稅的稅率，不是占有契稅的稅率。", "✓ 契稅條例第3條：占有契稅稅率為契價的「6%」，與買賣、贈與契稅相同。占有是指以時效取得等方式取得不動產所有權，因取得方式特殊，稅率與買賣等同視之，採較高稅率6%。", "❌ 8%不是任何契稅類型的法定稅率。"]}, {"ch": "G1 契稅", "year": "101", "num": 30, "q": "依契稅條例規定，甲將不動產信託與乙，嗣後受託人乙依信託本旨將該不動產移轉與歸屬權利人丙，歸屬權利人丙應申報繳納何種契稅？", "opts": ["買賣契稅", "交換契稅", "贈與契稅", "占有契稅"], "ans": 2, "exps": ["❌ 受託人依信託本旨移轉財產給歸屬權利人，不是買賣行為，不適用買賣契稅。", "❌ 此非交換行為，不適用交換契稅。", "✓ 契稅條例規定，受託人依信託本旨將信託財產移轉與「委託人以外之歸屬權利人」時，性質上視同贈與（無償移轉），應申報繳納「贈與契稅」（稅率6%）。歸屬權利人丙是無償取得財產，故依贈與契稅課徵。", "❌ 此非占有行為（非時效取得），不適用占有契稅。"]}, {"ch": "G1 契稅", "year": "101", "num": 31, "q": "下列關於契稅稅率的規定，何者最正確？", "opts": ["買賣契稅為其契價百分之六", "典權契稅為其契價百分之六", "交換契稅為其契價百分之六", "分割契稅為其契價百分之六"], "ans": 0, "exps": ["✓ 契稅條例第3條：買賣契稅稅率為契價的6%。本選項正確對應買賣的稅率。", "❌ 典權契稅的稅率是「4%」，不是6%，這是契稅條例六種類型中唯一稅率不是6%（除交換、分割2%外）的特殊類型。", "❌ 交換契稅稅率是「2%」，不是6%。", "❌ 分割契稅稅率是「2%」，不是6%。"]}, {"ch": "G1 契稅", "year": "101", "num": 37, "q": "依契稅條例規定，關於契稅之課徵，下列敘述何者錯誤？", "opts": ["稽徵機關收到申報案件後，應於十五日內查定應納稅額", "不依規定期限申報契稅者，每逾二日加徵百分之一滯納金", "應納契稅，匿報或短報，經主管稽徵機關查得，除應補繳稅額外，並加處以應納稅額一倍以上三倍以下之罰鍰", "檢舉逃漏契稅之獎金為罰鍰之百分之二十"], "ans": 1, "exps": ["❌ 稽徵機關收到申報案件後，應於15日內查定應納稅額，本項正確。", "✓ 逾期申報加徵的是怠報金，每逾3日加徵應納稅額1%（最高不超過應納稅額及1.5萬元，§24）。「每逾2日1%」是逾期繳納的滯納金，故本項錯誤。", "❌ 匿報或短報經查獲，除補稅外處應納稅額1倍以上3倍以下罰鍰，本項正確。", "❌ 檢舉逃漏契稅之獎金為罰鍰的20%，本項正確。"]}, {"ch": "G1 契稅", "year": "102", "num": 22, "q": "依契稅條例規定，凡以抵押、借貸等變相方式代替設典，取得不動產使用權者，應以何項契稅申報繳納？", "opts": ["買賣", "典權", "交換", "設定"], "ans": 1, "exps": ["❌ 抵押借貸代替設典不是買賣行為。", "✓ 契稅條例：凡以「抵押、借貸等變相方式」代替設典，取得不動產使用權者，應以「典權」契稅申報納稅。法律不允許以變相方式規避典權契稅的稅捐義務，採取實質課稅原則認定此類安排視同設典。", "❌ 此非交換行為。", "❌ 「設定」契稅非法定類型（契稅條例的六種類型為買賣、贈與、交換、分割、典權、占有）。"]}, {"ch": "G1 契稅", "year": "103", "num": 3, "q": "依契稅條例之規定，告發或檢舉納稅義務人逃漏、匿報、短報或以其他不正當之行為逃稅者，稽徵機關得獎勵舉發人，並為舉發人絕對保守秘密，下列何者係該條例之獎勵內容？", "opts": ["得頒發國光獎章給舉發人", "得頒發地政貢獻獎給舉發人", "得以罰鍰百分之二十獎給舉發人", "得以罰鍰百分之三十獎給舉發人"], "ans": 2, "exps": ["❌ 國光獎章是國家榮譽勳獎，不是契稅條例的檢舉獎勵內容。", "❌ 地政貢獻獎不是契稅條例規定的獎勵內容。", "✓ 契稅條例規定，檢舉逃漏契稅者，得以罰鍰的20%獎給舉發人，並為其保守秘密。", "❌ 30%不是法定比例，檢舉獎金為罰鍰的20%。"]}, {"ch": "G1 契稅", "year": "104", "num": 36, "q": "有關契稅之課徵，下列敘述，何者錯誤？", "opts": ["在開徵土地增值稅區域之土地，免徵契稅", "占有契稅之稅率，為其契價之百分之六", "典權契稅，應由出典人申報納稅", "契稅由直轄市及縣（市）稅捐稽徵處（地方稅務局）徵收或鄉、鎮、市、區公所代徵之"], "ans": 2, "exps": ["❌ 本選項描述正確，符合契稅條例規定（已開徵土增稅的土地免徵契稅），非錯誤。", "❌ 本選項描述正確，占有契稅稅率6%，非錯誤。", "✓ 本選項為錯誤敘述：典權契稅的納稅義務人是「典權人」（不是出典人），與101年第31題稅率一樣，這是契稅條例「納稅義務人」表中最容易與直覺相反的考點——出典人是把不動產出典出去的人，典權人是付出典價取得使用收益權的人，課稅對象是「取得權利的人」（典權人）。", "❌ 本選項描述正確，符合契稅徵收機關規定，非錯誤。"]}, {"ch": "G1 契稅", "year": "104", "num": 37, "q": "依契稅條例之規定，不動產移轉發生糾紛時，其申報契稅之起算日期，以下列何者為準？", "opts": ["應由雙方當事人會同申報日", "以政府核發使用執照之日", "以法院判決確定日", "以法院發給權利移轉證明書之日"], "ans": 2, "exps": ["❌ 雙方會同申報日不是起算日；糾紛時雙方通常無法會同申報。", "❌ 核發使用執照之日，是建造完成前因買賣、交換、贈與、分割變更起造人名義的起算日。", "✓ 契稅條例：不動產移轉發生糾紛時，申報契稅的起算日是法院判決確定之日。⚠️土地增值稅依法院判決移轉者，則以向法院起訴日的公告現值為準，兩者不同。", "❌ 法院發給權利移轉證明書之日，是向法院標購拍賣不動產的起算日，不是糾紛情形。"]}, {"ch": "G1 契稅", "year": "105", "num": 2, "q": "依契稅條例規定，下列何種情形得免徵契稅？", "opts": ["向法院標購所得之拍賣不動產者", "政府因公務需要，以公有不動產交換取得不動產所有權者", "依法標購公產者", "先典後賣取得不動產者"], "ans": 1, "exps": ["❌ 向法院標購拍賣之不動產不免徵契稅，仍須申報（§11）；起算日是法院發給權利移轉證明書之日。", "✓ 契稅條例§14：政府機關因公務需要，以公有不動產交換取得不動產所有權者，免徵契稅。", "❌ 依法領買或標購公產不免徵契稅，仍須申報（§11）；起算日是核發產權移轉證明書之日。", "❌ 先典後賣是兩次移轉，典權及買賣各依規定課契稅，不在免徵之列。"]}, {"ch": "G1 契稅", "year": "105", "num": 14, "q": "甲、乙、丙等三人公同共有A屋，甲與乙擅自於105年8月8日將A屋出賣於丁。下列敘述何者錯誤？", "opts": ["如採處分權說，且甲與乙債務不履行，則丙亦應負損害賠償責任", "如採代理權說，則丙應負擔法律關係上出賣人的義務與責任", "就契稅而言，甲、乙、丙均無庸申報納稅", "甲、乙、丙、丁均無庸繳納特種貨物及勞務稅"], "ans": 0, "exps": ["✓ （本題問錯誤者）處分權說下出賣人僅甲、乙，丙不是契約當事人，不負債務不履行賠償責任。", "❌ 此敘述正確：代理權說認為甲乙係代表全體共有人出賣，丙亦為出賣人，須負出賣人義務。", "❌ 此敘述正確：買賣契稅由買受人丁申報納稅，出賣人甲、乙、丙無庸申報。", "❌ 依官方答案此敘述視為正確：題幹未載取得時點，無法認定須課特銷稅，且買受人丁非納稅義務人。"]}, {"ch": "G1 契稅", "year": "105", "num": 24, "q": "甲於105年9月1日將其A屋和其坐落的B地出售於乙。在未有特約的情形，下列敘述何者正確？", "opts": ["乙就 A 屋和 B 地應繳納奢侈稅", "乙就 B 地應繳納契稅", "乙就 B 地應繳納土地增值稅", "乙應繳納印花稅"], "ans": 3, "exps": ["❌ 奢侈稅（特種貨物及勞務稅）的納稅義務人是銷售者（賣方），買方乙無此義務。", "❌ B地已開徵土地增值稅，土地部分免徵契稅，乙無須就B地繳契稅。", "❌ 土地增值稅的納稅義務人是原所有權人甲，不是買受人乙。", "✓ 本題官方答案：乙就買賣契約書應繳納印花稅（印花稅法，由立約人貼用印花）。"]}, {"ch": "G1 契稅", "year": "105", "num": 37, "q": "甲未依法繳納契稅，請問目前應移送何處強制執行？", "opts": ["普通法院", "行政法院", "法務部行政執行署所屬行政執行分署", "財政部國有財產署"], "ans": 2, "exps": ["❌ 普通法院負責民刑事訴訟，不是稅捐強制執行的機關。", "❌ 行政法院負責行政訴訟，不是強制執行機關。", "✓ 未依法繳納契稅（欠稅）的強制執行，依法移送「法務部行政執行署所屬行政執行分署」辦理。這是所有稅捐（含契稅、地價稅、房屋稅等）欠稅強制執行的共通機關，是稅法體系常見的固定考點。", "❌ 國有財產署管理國有財產，不是稅捐強制執行的機關。"]}, {"ch": "G1 契稅", "year": "106", "num": 5, "q": "建築物於建造完成前，因何種原因而變更起造人名義，並取得使用執照者，應申報繳納契稅？", "opts": ["繼承", "贈與", "設典", "分割"], "ans": 1, "exps": ["❌ 建造完成前因繼承變更起造人名義，免徵契稅，不屬應申報情形。", "✓ 契稅條例：建築物建造完成前，因贈與變更起造人名義並取得使用執照者，應申報納稅（贈與契稅6%）。繼承則免徵。", "❌ 設典是另一種契稅類型，與建造完成前變更起造人名義無關，非本題情形。", "❌ 官方答案未取本項。⚠️現行法：建造完成前因分割變更起造人名義並取得使用執照者，同樣應申報契稅，與官方答案有出入。"]}, {"ch": "G1 契稅", "year": "106", "num": 11, "q": "下列何種情形免徵契稅？", "opts": ["以遷移、補償等變相方式支付產價，取得不動產所有權者", "依法領買或標購公產及向法院標購拍賣之不動產者", "開徵土地增值稅區域之土地", "以不動產為信託財產，受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時"], "ans": 2, "exps": ["❌ 以遷移、補償等變相方式支付產價取得不動產，視同買賣，仍應課徵契稅。", "❌ 依法領買或標購公產、向法院標購拍賣不動產，不免徵契稅，仍須申報（§11）。", "✓ 契稅條例：開徵土地增值稅區域之土地免徵契稅，避免重複課稅；房屋部分仍須課契稅。", "❌ 受託人移轉信託財產與委託人以外的歸屬權利人，應課契稅，由歸屬權利人申報。"]}, {"ch": "G1 契稅", "year": "106", "num": 16, "q": "下列有關契稅之申報起算日規定，何者錯誤？", "opts": ["不動產移轉發生糾紛時，其申報契稅之起算日期，應以法院判決確定日為準", "向政府機關標購或領買公產，以政府機關核發產權移轉證明書之日為申報起算日", "向法院標購拍賣之不動產，以法院發給權利移轉證明書之日為申報起算日", "不動產分割時，以其完成移轉登記之日為申報起算日"], "ans": 3, "exps": ["❌ 本選項描述正確，符合契稅條例規定（同104-37），非錯誤。", "❌ 本選項描述正確，符合規定，非錯誤。", "❌ 本選項描述正確，符合規定，非錯誤。", "✓ 本選項為錯誤敘述：不動產分割的契稅申報起算日，應以「訂立分割契約之日」（與一般買賣相同，採訂約日原則）為準，不是「完成移轉登記之日」。本選項把分割申報起算日的時點說錯了。"]}, {"ch": "G1 契稅", "year": "106", "num": 19, "q": "甲之土地、房屋於106年7月1日設定典權並完成移轉登記予乙。下列有關納稅義務人之規定，何者錯誤？", "opts": ["當年度地價稅之納稅義務人為甲", "107年期房屋稅之納稅義務人為乙", "典權契稅之納稅義務人為乙", "土地增值稅之納稅義務人為甲"], "ans": 0, "exps": ["✓ 本選項為本題「錯誤」的答案：106年7月1日設定典權並完成移轉登記予乙後，地價稅的納稅義務人應改為「典權人乙」（典權人是地價稅法定納稅義務人，不是出典人甲），故說「當年度地價稅之納稅義務人為甲」是錯誤的，本題答案以「典權設定後是典權人負擔地價稅」的原則為核心考點。", "❌ 本選項描述正確：典權人乙是房屋稅的法定納稅義務人（同地價稅原則，典權人取得使用收益權），107年期（次年度）房屋稅自應由乙負擔，非錯誤。", "❌ 本選項描述正確：典權契稅的納稅義務人是典權人（乙），符合契稅條例規定（同104-36題），非錯誤。", "❌ 本選項描述正確：設定典權時的土地增值稅納稅義務人是「出典人」（甲，預繳），非錯誤。"]}, {"ch": "G1 契稅", "year": "106", "num": 32, "q": "依契稅條例之規定，契稅之課稅基礎是？", "opts": ["實價", "市價", "房價", "契價"], "ans": 3, "exps": ["❌ 契稅的課稅基礎不是實際買賣價格，而是評定的契價。", "❌ 契稅課稅基礎不是市場價格，避免市價波動造成課稅爭議。", "❌ 「房價」非法定用語。", "✓ 契稅條例：契稅之課稅基礎是「契價」，即以當地不動產評價委員會評定之標準價格為準（非市價、非實際買賣價格）。契價是G1最核心的基本概念，須與土地增值稅的「漲價總數額」、地價稅的「申報地價」區分清楚。"]}, {"ch": "G1 契稅", "year": "107", "num": 23, "q": "買賣契稅之稅率，為其契價百分之六。所稱契價，以何者為準？", "opts": ["以實際買賣價格為準", "以當地不動產評價委員會評定之標準價格為準", "以當地地價及標準地價評議委員會評定之標準價格為準", "以當地建築主管機關公告之房屋造價為準"], "ans": 1, "exps": ["❌ 契價不是以實際買賣價格為準，避免市場交易價格波動造成課稅困難，且容易誤導以為與不動產買賣中實際成交價有關。", "✓ 同106-32，契稅課稅基礎「契價」是以「當地不動產評價委員會評定之標準價格」為準。不動產評價委員會（與房屋稅的房屋標準價格評定機關相同）是契稅契價評定的法定機關。", "❌ 地價及標準地價評議委員會是負責「地價稅」累進起點地價及公告地價評定的機關，不是契稅契價的評定機關，兩者機關不同，這是常見的混淆陷阱。", "❌ 建築主管機關公告的房屋造價不是契稅契價的評定依據，契價評定機關是不動產評價委員會。"]}, {"ch": "G1 契稅", "year": "109", "num": 2, "q": "關於契稅稅率依契稅條例之規定，下列敘述何者錯誤？", "opts": ["買賣契稅為其契價百分之六", "贈與契稅為其契價百分之六", "占有契稅為其契價百分之六", "典權契稅為其契價百分之六"], "ans": 3, "exps": ["❌ 本選項描述正確，6%是買賣契稅稅率，非錯誤。", "❌ 本選項描述正確，6%是贈與契稅稅率，非錯誤。", "❌ 本選項描述正確，6%是占有契稅稅率，非錯誤。", "✓ 本選項為錯誤敘述：典權契稅稅率是「4%」，不是6%，這是契稅六種類型中與買賣贈與占有（同為6%）不同的特殊稅率（交換分割是2%，典權是4%，買賣贈與占有是6%）。"]}, {"ch": "G1 契稅", "year": "109", "num": 18, "q": "依契稅條例規定，買賣契稅，應由下列何者申報納稅？", "opts": ["銀行", "出賣人", "買受人", "不動產仲介公司"], "ans": 2, "exps": ["❌ 銀行不是契稅的法定納稅義務人，除非銀行本身為不動產買受人。", "❌ 買賣契稅的納稅義務人是「買受人」（取得所有權人），不是出賣人，這是契稅最重要的反直覺考點。", "✓ 契稅條例第4條：買賣契稅應由「買受人」（取得不動產所有權之人）申報納稅，與一般人直覺「賣方收錢，賣方繳稅」的想法相反，是G1最核心的固定考點。", "❌ 不動產仲介公司是居間或代理服務的提供者，不是契稅的法定納稅義務人。"]}, {"ch": "G1 契稅", "year": "110", "num": 22, "q": "依契稅條例規定，以不動產為信託財產，受託人乙依信託本旨移轉信託財產與委託人甲以外之歸屬權利人丙時，應由何人估價立契，在規定之期限申報契稅？又其契稅稅率為何？", "opts": ["由乙申報契稅，稅率為6%", "由乙申報契稅，稅率為2%", "由丙申報契稅，稅率為6%", "由甲申報契稅，稅率為2%"], "ans": 2, "exps": ["❌ 申報主體應是丙（歸屬權利人），不是乙（受託人），主體錯誤。", "❌ 申報主體錯誤（應為丙），稅率也錯誤（信託歸屬視同贈與，稅率應為6%，不是2%）。", "✓ 同101-30的考點：受託人乙依信託本旨將信託財產移轉與「委託人以外的歸屬權利人丙」時，視同贈與，由「歸屬權利人丙」申報契稅，稅率為「贈與契稅6%」。本選項正確描述了申報主體（丙）和稅率（6%）。", "❌ 申報主體和稅率都錯誤，甲是委託人，不是本次移轉的申報義務人。"]}, {"ch": "G1 契稅", "year": "111", "num": 5, "q": "依契稅條例之規定，下列敘述何者錯誤？", "opts": ["買賣契稅，應由出賣人申報納稅", "典權契稅，應由典權人申報納稅", "買賣契稅之稅率為其契價百分之六", "分割契稅之稅率為其契價百分之二"], "ans": 0, "exps": ["✓ 本選項為錯誤敘述：買賣契稅應由「買受人」申報納稅，不是出賣人，本題以此核心考點作為「何者錯誤」的答案。", "❌ 本選項描述正確，典權人是典權契稅的法定納稅義務人（同104-36題），非錯誤。", "❌ 本選項描述正確，6%是買賣契稅稅率，非錯誤。", "❌ 本選項描述正確，2%是分割契稅稅率，非錯誤。"]}, {"ch": "G1 契稅", "year": "111", "num": 6, "q": "依契稅條例之規定，以不動產為信託財產時，在信託關係人間移轉所有權時，何種情形須課徵契稅？", "opts": ["因信託行為成立，委託人與受託人間", "信託契約明定信託財產之歸屬人為第三人者，信託關係消滅時，委託人與歸屬人間", "因信託行為不成立，委託人與受託人間", "信託關係存續中受託人變更時，原受託人與新受託人間"], "ans": 1, "exps": ["❌ 信託成立時的移轉，依契稅條例規定免徵契稅（同信託土地增值稅免課的精神），不是須課徵的情形。", "✓ 本選項依官方答案，是須課徵契稅的情形——當信託契約明定信託財產的歸屬人是「第三人」（非委託人本人），信託關係消滅時，財產從受託人移轉給該第三人歸屬人，這個移轉涉及「委託人」對「第三人」的實質贈與性質移轉，依規定須課徵契稅（贈與性質）。本題情境略不同於101-30、110-22（受託人移轉給歸屬人），本題是描述信託架構下「委託人與歸屬人」之間關係消滅時的課稅情形，依官方答案此情形應課契稅。", "❌ 信託行為「不成立」，財產根本沒有發生信託移轉，自然不涉及課稅問題，此選項描述邏輯矛盾。", "❌ 受託人變更（原受託人到新受託人）是信託財產的形式性轉移，不課徵契稅（性質與不課徵土地增值稅的情形相同）。"]}, {"ch": "G1 契稅", "year": "111", "num": 7, "q": "依契稅條例之規定，下列何種契約的契稅稅率最低？", "opts": ["買賣契約", "典權契約", "分割契約", "贈與契約"], "ans": 2, "exps": ["❌ 買賣契稅稅率6%，不是最低。", "❌ 典權契稅稅率4%，不是最低。", "✓ 契稅條例六種契稅類型中，稅率最低的是「交換」和「分割」，均為2%，本選項列出分割（2%），是六種類型中最低稅率，符合本題「何者稅率最低」的提問。", "❌ 贈與契稅稅率6%，不是最低。"]}, {"ch": "G1 契稅", "year": "112", "num": 12, "q": "以下關於契稅之敘述，何者正確？", "opts": ["買賣契稅應由出賣人申報納稅", "贈與契稅應由贈與人估價立契，申報納稅", "典權契稅，應由典權人申報納稅", "占有契稅稅率為其契價百分之二"], "ans": 2, "exps": ["❌ 買賣契稅應由「買受人」申報納稅，不是出賣人，描述錯誤。", "❌ 贈與契稅應由「受贈人」申報納稅，不是贈與人，描述錯誤。", "✓ 同104-36、111-5，典權契稅的納稅義務人是典權人，本選項正確描述。", "❌ 占有契稅稅率是6%（同100-9題），不是2%，數字錯誤。"]}, {"ch": "G1 契稅", "year": "113", "num": 20, "q": "依契稅條例規定，有關申報契稅之起算日期，下列何者正確？", "opts": ["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日", "不動產移轉發生糾紛時，以法院判決確定之日為申報起算日", "向法院標購拍賣之不動產，以承買人拍定之日為申報起算日", "建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執照之日為申報起算日"], "ans": 1, "exps": ["❌ 標購公產的起算日是核發產權移轉證明書之日，不是核准產權移轉之日。", "✓ 契稅條例：不動產移轉發生糾紛時，申報契稅的起算日是法院判決確定之日。", "❌ 向法院標購拍賣不動產，起算日是法院發給權利移轉證明書之日，不是拍定日。", "❌ 建造完成前因交換變更起造人名義，起算日是核發使用執照之日；本項改稱「原始起造人」，情形不同，非本題答案。"]}, {"ch": "G1 契稅", "year": "113", "num": 23, "q": "下列有關契稅納稅義務人之敘述，何者正確？", "opts": ["受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅", "買賣契稅，應由出賣人申報納稅", "典權契稅，應由出典人申報納稅", "交換有給付差額價款者，其差額價款，應由出賣人申報納稅"], "ans": 0, "exps": ["✓ 同101-30、110-22，受託人移轉給委託人以外的歸屬權利人，由歸屬權利人申報納稅（贈與契稅），本選項正確描述了申報義務人。", "❌ 應由買受人申報納稅，不是出賣人，描述錯誤。", "❌ 應由典權人申報納稅，不是出典人，描述錯誤（同104-36題）。", "❌ 交換契稅的申報義務人通常是雙方互負義務，差額價款部分的申報義務人並非「出賣人」這個表述（交換沒有買賣雙方的「出賣人」概念，僅有交換雙方），本選項用語錯誤。"]}, {"ch": "G1 契稅", "year": "114", "num": 14, "q": "在不動產贈與的情形下，有關契稅稅率，下列何者為是？", "opts": ["百分之四", "百分之六", "百分之二", "百分之五"], "ans": 1, "exps": ["❌ 4%是典權契稅稅率，不是贈與契稅稅率。", "✓ 同契稅基本稅率規定，贈與契稅稅率為契價的「6%」，與買賣、占有相同。", "❌ 2%是交換或分割契稅稅率，不是贈與。", "❌ 5%不是任何契稅類型的法定稅率。"]}, {"ch": "G1 契稅", "year": "114", "num": 16, "q": "依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？", "opts": ["納稅義務人應於稽徵機關核定繳款書送達後30日內繳納", "納稅義務人不依規定期限申報者，每逾2日，加徵應納稅額百分之二之怠報金", "納稅義務人不依規定期限繳納稅款者，每逾3日，加徵應納稅額百分之二之滯納金", "納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"], "ans": 0, "exps": ["✓ 契稅條例：納稅義務人應於稽徵機關核定繳款書送達後30日內繳納契稅。", "❌ 逾期申報的怠報金是每逾3日加徵應納稅額1%（§24），最高不超過應納稅額及1.5萬元；「每逾2日2%」錯誤。", "❌ 逾期繳納的滯納金是每逾2日加徵滯納數額1%，不是每逾3日2%。", "❌ 匿報或短報的罰鍰是應納稅額1倍以上3倍以下，不是1倍以上2倍以下。"]}, {"ch": "H1 房地合一所得稅", "year": "105", "num": 26, "q": "依所得稅法之規定，下列關於土地房屋交易所得稅之敘述，何者正確？", "opts": ["交易之房屋、土地係於103年1月1日之次日以後取得，並持有期間少於2年者，應予課徵所得稅", "於103年1月1日之次日後取得依農業發展條例申請興建之農舍，應予課徵所得稅", "交易前無出租、供營業或執行業務使用者，應免納所得稅", "被徵收前先行協議價購之土地及其改良物，應予課徵所得稅"], "ans": 0, "exps": ["✓ 所得稅法§4-4：103年1月1日之次日以後取得、交易時持有期間2年以內的房屋、土地，也屬房地合一課稅範圍。105年1月1日以後取得者則一律適用。", "❌ 依農業發展條例申請興建的農舍，不適用房地合一，僅就房屋部分課所得稅。", "❌ 無出租、營業或執行業務使用只是自住優惠要件之一，且優惠是400萬元以下免稅，並非全免。", "❌ 被徵收或徵收前先行協議價購之房地，免納所得稅，並非應予課徵。"]}, {"ch": "H1 房地合一所得稅", "year": "106", "num": 7, "q": "依105年1月1日起實施的房地合一所得稅制規定，因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在2年以下之房屋、土地者，其稅率為何？", "opts": ["45%", "35%", "20%", "15%"], "ans": 2, "exps": ["❌ 45%是一般稅率（舊制1年內、現行2年內），非自願因素另適用優惠稅率。", "❌ 35%是一般稅率（舊制逾1年未逾2年、現行逾2年未逾5年），不是優惠稅率。", "✓ 所得稅法§4-5：因財政部公告之調職、非自願離職等非自願因素，稅率20%。⚠️現行法：持有期間放寬為5年以下。", "❌ 15%是持有逾10年的稅率，不是非自願因素的優惠稅率。"]}, {"ch": "H1 房地合一所得稅", "year": "106", "num": 15, "q": "個人及營利事業出售依農業發展條例申請興建的農舍，應如何計徵所得稅？", "opts": ["依104年12月31日前實施之舊制，僅就土地部分計算財產交易所得，課徵綜合所得稅", "依104年12月31日前實施之舊制，僅就房屋部分計算財產交易所得，課徵綜合所得稅", "依105年1月1日起實施之新制，房屋、土地均應按實價計算交易所得課稅", "不論新、舊制，均免徵所得稅"], "ans": 1, "exps": ["❌ 舊制下農舍的計算方式不是僅就「土地部分」，而是僅就「房屋部分」計算（土地部分依土地稅法課土地增值稅，不再併入財產交易所得計算所得稅），本選項弄反了。", "✓ 依農業發展條例申請興建的農舍（屬於舊制下的特殊房屋類型），出售時依104年12月31日前的舊制規定，「僅就房屋部分」計算財產交易所得，課徵綜合所得稅（土地部分依土地稅法課徵土地增值稅，不再計入此處的財產交易所得）。這是農舍課稅的特殊延續規定，不適用105年後的房地合一新制。", "❌ 農舍依規定不適用105年新制（房地合一稅），而是延續舊制（僅房屋部分課稅），本選項描述錯誤。", "❌ 農舍出售並非完全免稅，房屋部分仍應課徵財產交易所得稅（舊制），本選項描述錯誤。"]}, {"ch": "H1 房地合一所得稅", "year": "106", "num": 31, "q": "關於房地交易課徵所得稅之稅率規定，下列敘述何者錯誤？", "opts": ["個人持有房屋、土地之期間在1年以內者，稅率為45%", "個人持有房屋、土地之期間超過1年，未逾2年者，稅率為35%", "個人持有房屋、土地之期間超過2年，未逾10年者，稅率為25%", "個人持有房屋、土地之期間超過10年者，稅率為15%"], "ans": 2, "exps": ["❌ 舊制持有1年以內為45%，本項敘述正確。⚠️現行2.0：2年以內皆為45%。", "❌ 舊制逾1年未逾2年為35%，本項敘述正確。⚠️現行2.0：此級距已改為45%。", "✓ 舊制逾2年未逾10年為20%，沒有25%這一級，本項錯誤。⚠️現行2.0：逾2年未逾5年35%，逾5年未逾10年20%。", "❌ 持有逾10年為15%，本項敘述正確（舊制與現行2.0皆同）。"]}, {"ch": "H1 房地合一所得稅", "year": "106", "num": 40, "q": "甲105年6月買入A房地，購入成本1,300萬元，於106年2月以2,000萬元出售A房地時，繳納土地增值稅10萬元（土地漲價總數額為100萬元），因取得、改良及移轉而支付的費用50萬元，其應納交易所得稅若干？", "opts": ["1,925,000元", "2,240,000元", "2,475,000元", "2,880,000元"], "ans": 2, "exps": ["❌ 1,925,000＝550萬×35%，是稅率誤用35%；本題持有未滿1年，應為45%。", "❌ 2,240,000＝640萬×35%，同時誤扣土增稅10萬且誤用35%稅率。", "✓ 所得額＝2,000萬－1,300萬－50萬－土地漲價總數額100萬＝550萬。持有8個月，稅率45%，稅額247.5萬元。", "❌ 2,880,000＝640萬×45%，誤扣已繳土增稅10萬；應扣除土地漲價總數額100萬。"]}, {"ch": "H1 房地合一所得稅", "year": "107", "num": 25, "q": "依所得稅法規定，有關出售自住房屋，其房地交易所得稅之優惠，下列敘述，何者錯誤？", "opts": ["免稅所得額，以按該法第14條之4第3項規定計算之餘額不超過四百萬元為限", "個人或其配偶、直系親屬辦竣戶籍登記、持有並居住於該房屋連續滿六年", "交易前六年內，無出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易前六年內未曾適用該法第4條之5第1項第1款規定"], "ans": 1, "exps": ["❌ 自住優惠的免稅額，以公式餘額不超過400萬元為限，本項正確。", "✓ 所得稅法§14-5：自住優惠要件是個人、配偶或未成年子女辦竣戶籍登記，不含直系親屬，故本項錯誤。", "❌ 交易前6年內無出租、供營業或執行業務使用，是法定要件，本項正確。", "❌ 個人與配偶及未成年子女交易前6年內未曾適用本優惠，是法定要件，本項正確。"]}, {"ch": "H1 房地合一所得稅", "year": "108", "num": 10, "q": "下列敘述何者正確？", "opts": ["個人房屋、土地交易損失，得自交易日以後五年內之房屋、土地交易所得減除之", "個人房屋、土地交易損失，得自交易日以後七年內之房屋、土地交易所得減除之", "重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額", "重購之自住房屋、土地，於重購後七年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額"], "ans": 2, "exps": ["❌ 法定扣除期限是「3年內」（不是5年），數字錯誤。", "❌ 7年遠超法定的3年期限，數字錯誤。", "✓ 所得稅法：重購自住房屋土地享有重購退稅優惠後，於重購後「5年內」改作其他用途或再行移轉者，應追繳原扣抵或退還稅額。5年是房地合一稅重購退稅後的監管期間，與土地增值稅重購退稅後的5年監管期間（土地稅法第35條）邏輯一致。", "❌ 法定期限是5年（不是7年），數字錯誤。"]}, {"ch": "H1 房地合一所得稅", "year": "109", "num": 3, "q": "土地所有權人於出售土地後，依土地稅法規定，下列何種情形得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額？", "opts": ["土地所有權人於先購買土地後，自完成移轉登記之日起二年後，始行出售土地者", "其新購土地地價超過原出售土地地價，扣除繳納房地交易所得稅後之餘額者", "自耕之農業用地出售後，於二年內另行購買仍供自耕之農業用地者", "土地出售前一年內，曾供營業使用或出租者"], "ans": 2, "exps": ["❌ 重購退稅的法定流程應是「先出售後重購」，且重購應在出售後「2年內」完成（不是「先購買後2年後再出售」這種顛倒時序），本選項時序錯誤。", "❌ 此選項涉及的扣除項目是「房地交易所得稅」，但土地增值稅重購退稅的比較基準應是「原出售土地地價」（扣除土地增值稅後的餘額），與房地交易所得稅無關，混淆了兩種不同稅目的退稅規則。", "✓ 土地稅法規定，自耕之農業用地出售後，於「2年內」另行購買仍供自耕之農業用地者，得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額。這是農地重購退稅的特殊規定，2年是法定的重購期限。", "❌ 重購退稅的要件之一是出售前「無」供營業使用或出租（符合自用住宅或自耕農地的要件），本選項說「曾供營業使用或出租」恰好與要件相反，不符合退稅條件。"]}, {"ch": "H1 房地合一所得稅", "year": "110", "num": 23, "q": "有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，其稅率計算下列何者正確？", "opts": ["持有房屋、土地之期間在三年以內者，稅率為百分之四十五", "持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五", "持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十", "持有房屋、土地之期間超過十年者，稅率為百分之十五"], "ans": 3, "exps": ["❌ 現行2.0：45%的級距是持有2年以內，不是3年以內。", "❌ 現行2.0：35%的級距是逾2年未逾5年，不是逾3年未逾5年。", "❌ 逾5年未逾10年稅率為20%，沒有30%這一級。", "✓ 所得稅法§4-5：持有逾10年稅率15%。其餘為2年內45%、逾2年未逾5年35%、逾5年未逾10年20%。"]}, {"ch": "H1 房地合一所得稅", "year": "110", "num": 24, "q": "依所得稅法規定，個人出售自住房屋、土地，依規定繳納之稅額，申請房地合一所得稅重購退稅之敘述，下列何者錯誤？", "opts": ["需自完成移轉登記之日起算二年內，重購自住房屋、土地者", "得於重購自住房屋、土地完成移轉登記次日起算二年內，申請退稅", "申請按重購價額占出售價額之比率，自所繳納稅額計算退還", "重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原退還稅額"], "ans": 1, "exps": ["❌ 出售後2年內重購自住房屋、土地，是退稅基本要件，本項正確。", "✓ 所得稅法§14-8：退稅申請期限是重購移轉登記次日起5年內，不是2年；2年是重購期限。", "❌ 按重購價額占出售價額的比率，自所繳稅額計算退還，本項正確。", "❌ 重購後5年內改作其他用途或再行移轉，應追繳原退還稅額，本項正確。"]}, {"ch": "H1 房地合一所得稅", "year": "110", "num": 25, "q": "依所得稅法規定，陳先生在110年10月以900萬元出售其於107年以700萬元購入之房地產，110年當期土地之公告現值為800萬元，陳先生個人未提示因取得、改良及移轉而支付之費用時，稽徵機關得以多少元計算其費用？", "opts": ["24萬元", "27萬元", "30萬元", "45萬元"], "ans": 1, "exps": ["❌ 24萬是以公告現值800萬×3%誤算；應以成交價額計算。", "✓ 所得稅法§14-6：未提示費用證明者，得按成交價額3%計算。900萬×3%＝27萬元。", "❌ 30萬是費用認定上限；本題900萬×3%＝27萬，未達上限。", "❌ 45萬是900萬×5%，法定比率是3%。"]}, {"ch": "H1 房地合一所得稅", "year": "112", "num": 23, "q": "依所得稅法之規定，個人依第14條之4前2項規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？", "opts": ["持有房屋、土地之期間在二年以內者，稅率為百分之三十五", "持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五", "因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為百分之二十", "個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，稅率為百分之二十五"], "ans": 2, "exps": ["❌ 現行2.0：持有2年以內稅率一律為45%，不是35%。", "❌ 逾2年未逾5年稅率為35%，不是25%。", "✓ 所得稅法§4-5：因調職、非自願離職等非自願因素，持有5年以下者，稅率20%。", "❌ 個人以自有土地與營利事業合作興建房屋，5年內完成並銷售者稅率為20%，不是25%。"]}, {"ch": "H1 房地合一所得稅", "year": "113", "num": 25, "q": "依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，其所得稅稅率為何？", "opts": ["百分之十", "百分之十五", "百分之二十", "百分之二十五"], "ans": 2, "exps": ["❌ 10%不是合作興建房屋的優惠稅率。", "❌ 15%是持有逾10年的稅率，不是合作興建房屋的優惠稅率。", "✓ 所得稅法§4-5：個人以自有土地與營利事業合作興建房屋，自土地取得日起5年內完成並銷售者，稅率20%。", "❌ 25%不是法定稅率，正確為20%。"]}, {"ch": "I1 耕地三七五減租", "year": "101", "num": 3, "q": "依土地法規定，下列何者情形無優先購買權之適用？", "opts": ["共有人出賣其應有部分時，其他共有人得以同一價格優先承購", "出租人出賣耕地時，耕地承租人有依同樣條件優先承買之權", "基地出賣時，承租人有依同樣條件優先購買之權", "房屋出賣時，承租人有依同樣條件優先購買之權"], "ans": 3, "exps": ["❌ 此為土地法第34條之1規定的優先購買權，確實有適用，不是「無優先購買權」的情形。", "❌ 此為耕地三七五減租條例第15條規定（或土地法第107條）的優先承買權，確實有適用，不是「無優先購買權」的情形。", "❌ 此為土地法第104條規定的優先購買權，確實有適用，不是「無優先購買權」的情形。", "✓ 土地法第104條規定的是「基地」出賣時承租人有優先購買權，而非「房屋」出賣時承租人有優先購買權。房屋承租人對於其承租的房屋本身被出賣，並無土地法明文的優先購買權規定，這是A3/A4/I1常見的混淆陷阱——優先購買權是針對「基地」（土地），不是房屋本身。"]}, {"ch": "I1 耕地三七五減租", "year": "101", "num": 5, "q": "依土地法規定，不定期耕地租約得以終止之情形，並不包含下列何者？", "opts": ["耕地依法變更其使用時", "承租人將一部分耕地轉租於他人", "承租人非因不可抗力繼續一年不為耕作者", "地租積欠達一年之總額時"], "ans": 3, "exps": ["❌ 此為土地法（或耕地三七五減租條例）規定不定期限耕地租約得終止之事由之一，屬之。", "❌ 承租人擅自轉租耕地，是法定終止租約的事由之一，屬之。", "❌ 此為法定終止事由之一，屬之。", "✓ 本題問「不包含」的情形。耕地三七五減租條例第17條：地租積欠達「兩年」之總額時，出租人才得終止租約（不是一年）。本選項說「達一年之總額」，與正確的「兩年」門檻不符，故「不包含」在法定終止事由內（門檻未達）。注意：此處的「兩年」與一般土地法第103條基地租約收回（積欠租金達2年總額）的標準一致，但與房屋租賃（積欠2個月以上）不同，務必區分清楚。"]}, {"ch": "I1 耕地三七五減租", "year": "104", "num": 5, "q": "不動產優先購買權，有債權效力與物權效力之分，下列何者屬債權效力之優先購買權？", "opts": ["土地法第34條之1規定共有人之優先購買權", "土地法第104條規定承租人等之優先購買權", "土地法第107條規定耕地承租人之優先購買權", "耕地三七五減租條例第15條規定耕地承租人之優先購買權"], "ans": 0, "exps": ["✓ 土地法§34-1他共有人優先購買權屬債權效力：未通知而出賣，不得請求塗銷登記，只能請求損害賠償。", "❌ 官方答案未取本項。⚠️土地法§104優先購買權亦屬債權效力，與官方答案僅取§34-1不一致，題目可疑。", "❌ 官方答案未取本項。⚠️土地法§107耕地承租人優先承買權亦屬債權效力，與官方答案不一致，題目可疑。", "❌ 耕地三七五減租條例§15的優先承買權具物權效力，承租人可請求塗銷登記，與本題債權效力相反。"]}, {"ch": "I1 耕地三七五減租", "year": "104", "num": 29, "q": "公有出租耕地，經依法辦理無償撥用時，其應補償耕地承租人之費用，依平均地權條例規定，應由下列何者負擔？", "opts": ["出租機關", "耕地原管理機關", "需地機關", "耕地原主管機關"], "ans": 2, "exps": ["❌ 出租機關只是出租行為的執行單位，不是補償耕地承租人費用的負擔主體。", "❌ 原管理機關在撥用後已不再管理該土地，不是補償費用的負擔主體。", "✓ 平均地權條例規定，公有出租耕地經依法辦理無償撥用時，其應補償耕地承租人之費用，應由「需地機關」（取得並使用該土地的機關）負擔。誰使用土地、誰受益，誰就負擔補償承租人權益受損的費用，符合「使用者付費」的精神。", "❌ 原主管機關（地政機關等）不是補償費用的負擔主體，負擔主體是實際取得使用權的需地機關。"]}, {"ch": "I1 耕地三七五減租", "year": "104", "num": 30, "q": "依耕地三七五減租條例規定，有關租佃爭議處理之敘述，下列何者錯誤？", "opts": ["耕地租佃爭議，先後由鄉（鎮、市、區）公所耕地租佃委員會調處及直轄市或縣（市）政府耕地租佃委員會調解", "非經調解、調處，不得起訴", "租佃爭議之訴訟，免收裁判費", "調解、調處成立者，當事人一方不履行其義務時，他造當事人得逕向該管司法機關聲請強制執行"], "ans": 0, "exps": ["✓ 本選項為錯誤敘述：正確的程序順序應是「先由鄉鎮市區公所耕地租佃委員會『調解』，調解不成才由直轄市或縣市政府耕地租佃委員會『調處』」（即基層先「調解」、上級才「調處」），本選項把「調解」和「調處」的順序及機關層級互換了，描述錯誤。", "❌ 本選項描述正確，租佃爭議須先經調解調處程序才能起訴（訴訟先行程序），非錯誤。", "❌ 本選項描述正確，租佃訴訟免收裁判費以減輕承租人訴訟負擔，非錯誤。", "❌ 本選項描述正確，調解調處成立有強制執行力，非錯誤。"]}, {"ch": "I1 耕地三七五減租", "year": "105", "num": 22, "q": "甲向乙承租A地耕作，租約未經公證，租期自99年1月28日起至106年1月27日止，而乙於租期內將系爭A地以60萬元出售予丙，並於101年移轉予丙。乙雖未以書面通知甲行使先買權，然其確曾以口頭通知甲，而為甲所明確知悉，甲卻故意壓低價格，明示不願以60萬元購買，僅欲以50萬元買受，未行使先買權，並經證人證實上開情事。甲已知悉系爭買賣條件，待系爭A地價格上漲3倍餘後，以數年前之價格主張優先承購，有無理由？", "opts": ["有理由，因乙違背土地法書面通知先買權的義務在先，故甲仍得主張先買權", "有理由，因乙違背民法書面通知先買權的義務在先，故甲仍得主張先買權", "有理由，因乙違背耕地三七五減租條例書面通知先買權的義務在先，故甲仍得主張先買權", "無理由，因有其他證據證明通知，且縱認通知不生效力，甲如已主張讓與不破租賃，並持續付租金給丙，則甲先買權的主張已屬權利失效"], "ans": 3, "exps": ["❌ 耕地承租人先買權依三七五減租條例§15，不是土地法；且甲已知悉條件並拒買，主張無理由。", "❌ 民法沒有耕地承租人書面通知先買權之規定；甲已知悉並拒買，主張無理由。", "❌ 縱乙未書面通知（§15），甲已實際知悉條件仍拒買，漲價後才主張，違反誠信，仍無理由。", "✓ 乙雖未書面通知，但已口頭通知且甲明知條件，並明示不購買。甲事後漲價才主張先買權，違反誠信，屬權利失效，無理由。"]}, {"ch": "I1 耕地三七五減租", "year": "105", "num": 31, "q": "甲於101年5月20日將其A耕地出租於乙。下列敘述何者正確？", "opts": ["甲與乙約定該租賃契約租期 7 年，如未訂立書面契約，則視為不定期限租賃", "租期屆滿後，如乙仍為 A 地之使用收益，而甲不即表示反對之意思，則視為不定期限繼續契約", "在租賃期間，甲如自願出賣 A 地於丙，對乙有先買權通知的不真正義務（對己義務、間接義務）", "在租賃期間，法院如拍賣 A 地而由丙拍定，實務上認為法院對乙有先買權的通知義務，待乙放棄先買 權後，法院始通知丙繳價金"], "ans": 3, "exps": ["❌ 耕地租期不得少於6年，7年有效；實務上耕地租約未書面不影響約定期限，不當然變成不定期。", "❌ 租期屆滿續耕且出租人未即反對，應是視為續訂租約，不是不定期限繼續（與民法§451不同）。", "❌ 375減租§15優先承買權有物權效力，出租人有通知義務，違反者承租人得請求塗銷登記，非不真正義務。", "✓ 實務認為法院拍賣耕地時，應先通知承租人行使優先承買權，其放棄後才通知拍定人繳價金。"]}, {"ch": "I1 耕地三七五減租", "year": "110", "num": 6, "q": "依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經何機關同意？", "opts": ["行政院", "財政部", "民意機關", "農業發展委員會"], "ans": 2, "exps": ["❌ 荒歉減租免租由縣市政府決定，不須行政院同意。", "❌ 不需財政部同意；該事項屬地方政府職權。", "✓ 縣市政府依當地當年收穫實況決定減租或免租，但應經民意機關同意（土地法荒歉減租規定）。", "❌ 法條規定的同意機關是民意機關，不是農業發展委員會。"]}];
const CHS=[...new Set(CARDS.map(c=>c.ch))];
let sel=Object.fromEntries(CHS.map(c=>[c,1]));
let ans={};
const g=id=>document.getElementById(id);
function renderPills(){
  const p=g('pills');p.innerHTML='';
  CHS.forEach(ch=>{
    const b=document.createElement('button');
    b.className='pill'+(sel[ch]?' on':'');
    b.textContent=ch;
    b.onclick=()=>{sel[ch]=sel[ch]?0:1;renderPills();renderList();};
    p.appendChild(b);
  });
}
function selAll(){Object.keys(sel).forEach(k=>sel[k]=1);renderPills();renderList();}
function selNone(){Object.keys(sel).forEach(k=>sel[k]=0);renderPills();renderList();}
function resetAll(){if(!confirm('確定要清除所有作答記錄？'))return;ans={};renderList();updateProg();}
function renderList(){
  const list=g('list');list.innerHTML='';
  const vis=CARDS.filter(c=>sel[c.ch]);
  let lastCh='';
  vis.forEach(card=>{
    const idx=CARDS.indexOf(card);
    if(card.ch!==lastCh){
      const h=document.createElement('div');h.className='ch-header';h.textContent=card.ch;list.appendChild(h);lastCh=card.ch;
    }
    list.appendChild(makeCard(card,idx));
  });
  updateProg();
}
function makeCard(card,idx){
  const a=ans[idx];
  const div=document.createElement('div');
  div.className='qcard'+(a?(a.ok?' answered-ok':' answered-ng'):'');
  div.id='c'+idx;
  div.innerHTML='<div class="qmeta"><span>【'+card.year+'年第'+card.num+'題】</span><span class="qtag">'+card.ch+'</span></div><div class="qtext">'+card.q+'</div>';
  const opts=document.createElement('div');opts.className='opts';
  ['A','B','C','D'].forEach((l,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="ltr">'+l+'</span><span>'+card.opts[i]+'</span>';
    if(a){b.disabled=true;if(i===card.ans)b.classList.add('show-correct');if(i===a.chosen&&!a.ok)b.classList.add('ng');}
    else b.onclick=(i=>()=>pick(idx,i))(i);
    opts.appendChild(b);
  });
  div.appendChild(opts);
  const eb=document.createElement('div');eb.className='expbox'+(a?' show':'');eb.id='e'+idx;
  eb.innerHTML='<div class="exph">&#128218; 逐選項解析</div><div class="expb" id="eb'+idx+'">'+(a?buildExp(card,a.chosen,a.ok):'')+'</div>';
  div.appendChild(eb);
  return div;
}
function buildExp(card,chosen,ok){
  let h='<div style="margin-bottom:7px;"><span class="verdict '+(ok?'ok':'ng')+'">'+(ok?'答對了':'答錯了')+'</span></div>';
  ['A','B','C','D'].forEach((l,i)=>{
    const ec=i===card.ans?'ok':(i===chosen&&!ok?'ng':'no');
    h+='<div class="ei"><span class="el '+ec+'">'+l+'</span><span>'+(card.exps[i]||'')+'</span></div>';
  });
  return h;
}
function pick(idx,chosen){
  const card=CARDS[idx];const ok=(chosen===card.ans);
  ans[idx]={chosen,ok};
  const div=g('c'+idx);
  div.className='qcard'+(ok?' answered-ok':' answered-ng');
  div.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;b.onclick=null;
    if(i===card.ans)b.classList.add('show-correct');
    if(i===chosen&&!ok)b.classList.add('ng');
  });
  g('eb'+idx).innerHTML=buildExp(card,chosen,ok);
  g('e'+idx).classList.add('show');
  updateProg();
}
function updateProg(){
  const vis=CARDS.filter(c=>sel[c.ch]);
  const tot=vis.length,done=vis.filter(c=>ans[CARDS.indexOf(c)]!==undefined).length;
  const cor=vis.filter(c=>{const a=ans[CARDS.indexOf(c)];return a&&a.ok;}).length;
  g('pd').textContent=done;g('pt').textContent=tot;
  g('pr').textContent=done?Math.round(cor/done*100)+'%':'-';
  g('pf').style.width=tot?done/tot*100+'%':'0%';
}
renderPills();renderList();</script>
