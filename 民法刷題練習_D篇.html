<title>民法 D篇 物權 官方歷屆題 99–114</title>

<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.ainote{font-size:10.5px;color:#A8A39B;font-style:normal;font-weight:400;padding:0 0 4px;line-height:1.5}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<script>
const QS=[{"year": 99, "num": 20, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲將其所有機車 1 部，寄託於乙處，乙擅自將之以價金新臺幣 3 萬元讓售給知情的丙，並將該車交付給丙。下列有關乙丙間法律關係之敘述，何者正確？", "opts": ["債權行為有效，物權行為無效", "債權行為無效，物權行為有效", "債權行為效力未定，物權行為無效", "債權行為有效，物權行為效力未定"], "exp": ["✗A. 乙就機車無處分權，但債權行為（買賣）仍有效。", "✗B. 債權行為有效；物權行為依§118 I 效力未定，並非有效。", "✗C. 債權行為不因欠缺處分權而效力未定。", "✓D（本題答案）. 債權行為有效；乙為無權處分，物權行為依§118 I 效力未定，經甲承認始生效力，且丙知情不得善意取得（§948）。", "★負擔行為有效、處分行為效力未定（§118）。陷阱：丙明知，故不能善意取得。"]}, {"year": 99, "num": 21, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列有關公同共有之情形，何者不能準用分別共有之規定？", "opts": ["公同共有物之分割", "公同共有人應有部分之自由處分", "公同共有物之管理", "公同共有物分割後之權利義務關係"], "exp": ["✗A. 依§830Ⅱ，公同共有物之分割，除法律另有規定外，準用關於共有物分割之規定，可準用，不是答案。", "✓B. 分別共有人各有應有部分，依§819Ⅰ 得自由處分；公同共有人則無各自獨立的應有部分，依§828Ⅲ，公同共有物之處分及其他權利行使，除法律另有規定外，須得公同共有人全體同意。因此「應有部分之自由處分」不能準用，為應選答案。", "✗C. 依§828Ⅱ，§820（共有物之管理）、§821 等規定於公同共有準用，可準用，不是答案。", "✗D. 公同共有物分割後，依§830Ⅱ 準用共有物分割之規定（包括§825：各共有人對他共有人因分割所得之物，按其應有部分負與出賣人同一之擔保責任），可準用，不是答案。"]}, {"year": 99, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲乙丙 3 人因繼承而共有祖傳土地 1 筆，應有部分各為三分之一，以下關於共有之敘述何者正確？", "opts": ["3 人為維持祖傳土地之完整性，乃訂立禁止永世不得分割之契約，該契約如經登記，即可有效", "甲如欲以該筆土地設定抵押權，只要再得到乙丙其中 1 人同意即可", "乙欲出賣其應有部分時，應得甲及丙之同意", "即使甲反對，只要乙丙同意時，即可針對該筆共有土地訂立分管契約"], "exp": ["✗A. §823 II：禁止分割之約定不得逾五年，逾五年者縮短為五年，不得約定永不分割。", "✗B. §819 II：共有物之處分、變更及設定負擔，應得共有人全體同意，不是只要再取得一人同意。", "✗C. §819 I：各共有人得自由讓與其應有部分，不需其他共有人同意。", "✓D（本題答案）. §820 I：共有物管理（含分管）得由共有人過半數且應有部分合計過半數同意（乙丙合計 2/3），甲反對不影響。", "★共有物處分需全體；管理多數決；應有部分自由讓與。陷阱：禁止分割期限最長五年。"]}, {"year": 99, "num": 23, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲乙丙丁共有土地 1 筆，應有部分各為四分之一，以下關於分管契約之敘述何者錯誤？", "opts": ["分管契約乃約定特定部分之共有物專歸特定共有人使用之契約，故其成立須得全體共有人同意始可", "不動產之分管契約如經登記，可以對抗應有部分之受讓人", "分管契約為債權契約", "分管契約成立後，因情勢變更難以繼續時，任何共有人均得聲請法院以裁定變更之"], "exp": ["✗A（本題答案）. 共有物之管理（含使用分管）依§820 I 得以多數決行之，分管契約不以全體共有人同意為必要。", "✓B. §826-1 I：不動產共有人間關於共有物使用、管理等約定，經登記後，對應有部分受讓人或取得物權之人有效力。", "✓C. 分管契約僅有債權效力，登記後才對特定繼受人生效。", "✓D. §820 III：管理因情事變更難以繼續時，法院得因任何共有人聲請，以裁定變更之。", "★分管＝管理方式之一，多數決也能成立。陷阱：不要誤以為一定要全體同意。"]}, {"year": 99, "num": 24, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "XYZ 3 人共有土地 1 筆，各有應有部分三分之一，三人協議分割該筆土地，於 6 月 2 日達成協議，8 月20 日完成登記。以下敘述何者錯誤？", "opts": ["在無法令或約定禁止分割之情形下，任何共有人均得隨時請求分割共有物", "當事人間於 6 月 2 日即取得各該分得部分之單獨所有權", "分割共有物之協議屬債權契約", "由於該筆土地面積遼闊，XYZ 3 人得約定僅分割其中一半，其餘一半仍繼續共有"], "exp": ["✓A. §823 I：無法令或約定禁止分割時，各共有人得隨時請求分割共有物。", "✗B（本題答案）. 協議分割為債權契約，不動產須依§758 I 登記才生物權變動，故 6 月 2 日尚未取得單獨所有權，8 月 20 日登記後才取得。", "✓C. 分割協議為債權契約。", "✓D. 分割方法由共有人協議決定，得僅就部分土地分割，其餘部分仍維持共有。", "★不動產物權變動以登記為生效要件（§758）。陷阱：協議時只有債權關係。"]}, {"year": 99, "num": 25, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "以下關於地上權之敘述何者錯誤？", "opts": ["地上權可以訂有期限，或為未定期限之地上權", "地上權可以為有償，亦可為無償", "以在他人土地上下之一定空間範圍內設定之地上權稱為區分地上權", "地上權如有支付地租之約定時，地上權人仍可以隨時拋棄其權利"], "exp": ["✓A. 地上權得定期限或不定期限，兩者皆可（§833-1、§834）。", "✓B. 地上權得有償或無償，是否支付地租依約定（§834、§835）。", "✓C. §841-1：區分地上權為在他人土地上下一定空間範圍內設定之地上權。", "✗D（本題答案）. §835：有支付地租約定者，地上權人拋棄權利時，應於一年前通知土地所有人，或支付未到期之一年分地租，不得隨時拋棄；無地租者才可隨時拋棄（§834）。", "★地上權拋棄分有償、無償兩套：無償隨時，有償需先期通知或補付。陷阱：「有地租仍可隨時拋棄」錯。"]}, {"year": 99, "num": 26, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "以下關於占有之敘述何者錯誤？", "opts": ["寵物店之店員甲照顧顧客乙寄放之寵物狗，帶該隻寵物狗出外散步時，咬傷在公園遊玩之幼童，此時甲應負損害賠償責任", "動產善意受讓人必須善意且無重大過失始可", "占有人由拍賣或公共市場以善意買得盜贓遺失物時，真正權利人得於 2 年內，償還支出之價金後，請求回復其物", "占有人之占有被侵奪者，占有人之返還請求權自侵奪時起，1 年間不行使而消滅"], "exp": ["✗A（本題答案）. 依§190 I 動物致人損害，由占有人負責；店員受僱於店並受其指示管領寵物，屬占有輔助人（§942），占有人為寵物店，甲不依§190 負責。", "✓B. §948：善意受讓動產占有者受保護，但受讓人明知或因重大過失不知讓與人無權處分者，不在此限。", "✓C. §949、§950：向拍賣或公共市場以善意買得盜贓遺失物者，被害人須於二年內償還價金才得回復其物。", "✓D. §963：占有被侵奪者，其返還請求權自侵奪時起一年間不行使而消滅。", "★動物責任主體是「占有人」，輔助人不是。陷阱：區分占有人（店）與占有輔助人（店員）。"]}, {"year": 99, "num": 27, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "以下關於不動產所有權之敘述何者正確？", "opts": ["甲於 6 月 15 日因其父過世而繼承土地 1 筆，至 10 月 5 日始辦畢繼承登記，則甲於 10 月 5 日取得該筆土地之所有權", "甲於自己所有土地上興建房屋，因與鄰地之境界不明，以致圍牆部分逾越疆界坐落於乙所有鄰地上，乙雖於興建中即已查知該事，卻待 2 年後整棟房屋完工後，始請求甲返還土地。此時甲可以拒絕，並請求以相當價額購買越界部分土地", "區分所有建築物專有部分之所有權人出賣其所有權時，可以保留基地之權利，另為適當之處置", "因土地之讓與或一部分割，而形成袋地時，袋地所有權人僅得通行讓與人或他分割人之所有地，且無須支付償金"], "exp": ["✗A. §759、§1147：因繼承於繼承開始時即取得，登記只是處分前提；甲在 6 月 15 日已取得所有權，並非 10 月 5 日。", "✗B. §796 I：鄰地所有人知越界而未異議，得請求購買越界土地者是鄰地所有人，不是越界建築人甲；甲不得主張。", "✗C. 區分所有建築物專有部分與所屬共有部分及其基地權利不得分離而為移轉或設定負擔（§799），不得保留基地權利。", "✓D（本題答案）. §789：因土地讓與或分割形成袋地時，僅得通行受讓人、讓與人或他分割人土地，且無須支付償金。", "★繼承取得不待登記；讓與形成袋地只能通行對方且免償金。陷阱：越界建築的購買請求權屬鄰地所有人。"]}, {"year": 99, "num": 28, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "約定於債權已屆清償期而未為清償時，抵押物之所有權移屬於抵押權人者，此一約定之效力為何？", "opts": ["非經登記，不得對抗第三人", "非經登記，不生效力", "效力未定", "得撤銷"], "exp": ["✓A（本題答案）. §873-1 I：流抵約定，非經登記，不得對抗第三人。", "✗B. 流抵約定未登記，在當事人間仍有效，只是不得對抗第三人，並非不生效力。", "✗C. 約定效力不屬於效力未定。", "✗D. 約定無得撤銷之特別規定。", "★流抵契約合法，但要登記才能對抗第三人。陷阱：不是「不生效力」。"]}, {"year": 99, "num": 30, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "以下關於最高限額抵押權之敘述何者正確？", "opts": ["最高限額抵押權所擔保之債權，包含因一定關係所生之不特定債權或基於票據所生之權利", "我國最高限額抵押權係採本金最高限額", "基於抵押權之從屬性，最高限額抵押權所擔保之任何 1 筆債權一旦讓與他人，最高限額抵押權亦隨之移轉", "最高限額抵押權僅對原債權有擔保之效力"], "exp": ["✓A（本題答案）. §881-1 II：最高限額抵押權所擔保之債權，包含基於一定法律關係所生之不特定債權及基於票據所生之權利。", "✗B. §881-2：最高限額抵押權人就原債權、利息、遲延利息及違約金等，於最高限額範圍內行使權利，採債權（全部）最高限額，非本金最高限額。", "✗C. §881-6：原債權確定前，債權讓與他人者，最高限額抵押權不隨同移轉。", "✗D. §881-2 範圍不限於原債權，尚包括利息、遲延利息、違約金。", "★最高限額抵押權＝不特定債權，隨時擔保；確定前不具隨從性。陷阱：我國採「債權最高限額」。"]}, {"year": 100, "num": 10, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲為定作人，與乙訂立承攬契約，由乙為甲建一房屋。關於此案例，下列敘述何者正確？", "opts": ["乙得就承攬之報酬額，對於將來完成之甲之房屋，請求預為抵押權之登記", "工作未完成前，定作人甲不得隨時終止契約", "定作人甲所供給之材料，因不可抗力而毀損者，承攬人須負其責", "如乙所蓋房屋有瑕疵，甲於房屋交付後二年始發見者，不得請求乙修補"], "exp": ["✓A（本題答案）. §513：承攬之工作為建築物等，承攬人得就報酬額，對於將來完成之定作人不動產，請求預為抵押權之登記（開始工作前亦得為之）。", "✗B. §511：工作未完成前，定作人得隨時終止契約，但應賠償承攬人因契約終止而生之損害。", "✗C. §508 II：定作人所供給之材料，因不可抗力而毀損滅失者，承攬人不負其責。", "✗D. 建築物瑕疵發見期間延長為五年（§499），交付後二年發見仍得依§493 請求修補。", "★承攬人是「工作完成才領錢」，所以給預為抵押權登記保障。陷阱：定作人可隨時終止，但要賠償。"]}, {"year": 100, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何者，非基於所有權而發生之請求權？", "opts": ["所有物返還請求權", "所有權之妨害除去請求權", "所有權之妨害預防請求權", "占有物之返還請求權"], "exp": ["✗A. 所有物返還請求權（§767Ⅰ 前段：所有人對無權占有或侵奪其所有物者，得請求返還），基於所有權而發生，屬物上請求權。", "✗B. 妨害除去請求權（§767Ⅰ 中段：對妨害其所有權者，得請求除去），基於所有權而發生。", "✗C. 妨害預防請求權（§767Ⅰ 後段：有妨害其所有權之虞者，得請求防止），基於所有權而發生。", "✓D. 占有物返還請求權（§962：占有人占有被侵奪者，得請求返還其占有物）是基於「占有」而生，不是基於所有權；占有人不必是所有人也能行使，故為應選答案。★物上請求權（§767）基於所有權；占有保護請求權（§962）基於占有，兩者分清。（§960 則是占有人的自力救濟。）"]}, {"year": 100, "num": 23, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於普通抵押權之敘述，下列何者錯誤？", "opts": ["抵押權之設定須以書面為之，並辦理登記", "抵押人設定抵押權時，對於抵押物須有所有權及處分權", "以抵押權所擔保之債權，經讓與其一部者，抵押權仍不受影響", "於抵押權所擔保之債權全部被清償時，抵押權仍不消滅"], "exp": ["✓A（敘述正確，非答案）. 依§758Ⅰ，不動產物權依法律行為設定，非經登記不生效力；依§758Ⅱ 並應以書面為之，抵押權設定亦同，敘述正確。", "✓B（敘述正確，非答案）. 設定抵押權是處分行為，抵押人須對抵押物有所有權及處分權，敘述正確。", "✓C（敘述正確，非答案）. 依§869Ⅰ，以抵押權擔保之債權如經分割或讓與其一部者，其抵押權不因此而受影響，敘述正確。", "✗D（本題答案）. 抵押權從屬於所擔保的債權；依§307，債之關係消滅者，其債權之擔保及其他從屬之權利亦同時消滅，所以擔保債權全部清償後抵押權即消滅；選項說「仍不消滅」錯誤，故為應選答案。"]}, {"year": 100, "num": 24, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於地上權之敘述，何者正確？", "opts": ["稱普通地上權者，謂以在他人土地之上下有建築物或種植竹木為目的而使用其土地之權", "地上權不因建築物或其他工作物之滅失而消滅", "地上權人均得隨時拋棄其權利", "土地所有權讓與時，已預付之地租，均不得對抗第三人"], "exp": ["✗A. §832：普通地上權為在他人土地上下有建築物或其他工作物為目的而使用其土地之權；種植竹木屬農育權（§850-1）。", "✓B（本題答案）. §841：地上權不因建築物或其他工作物之滅失而消滅。", "✗C. §835 I：有地租約定者，不能隨時拋棄，須先期通知或補付地租。", "✗D. §836-1：土地所有權讓與時，已預付之地租，經登記者可對抗受讓人；並非均不得對抗。", "★地上權標的限於建築物與其他工作物，竹木已劃歸農育權。陷阱：「均」「任意」等絕對用語要警覺。"]}, {"year": 100, "num": 25, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲有 A、B 二地，因出賣 A 地給乙，致 B 地與公路無適宜之連絡，不能為通常之使用。下列敘述何者正確？", "opts": ["甲可以任擇 A 地或其他相鄰之地而通行之", "甲通行鄰地已造成鄰地負擔，不得再主張開設道路", "甲通行鄰地時，為求便利，可任意選擇通行之處所", "若甲不主張開設道路而通行 A 地，無須支付乙償金"], "exp": ["✗A. §789 I：因土地讓與形成袋地者，僅得通行受讓人之土地，不得任選他人土地。", "✗B. §788 I：有通行權人於必要時得開設道路，但應對鄰地所受損害支付償金；並非不得主張開設道路。", "✗C. §787 II：通行處所及方法應擇對鄰地損害最少者，不得任意選擇。", "✓D（本題答案）. §789 II：因土地讓與而通行者，無須支付償金。", "★一般袋地需償金；因讓與分割形成者通行無償且僅能通行對方土地。陷阱：這是§789 與§787 的差異。"]}, {"year": 100, "num": 26, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲死亡，遺留房屋一棟，有乙、丙二位繼承人。下列敘述何者正確？", "opts": ["未分割前，該屋為乙、丙分別共有", "移轉登記前，乙、丙即取得該屋所有權，然而應經登記，始得處分之", "若該屋被無權占有，乙、丙須共同向無權占有人起訴請求返還", "若乙、丙於繼承前於該屋上有抵押權，該抵押權不因繼承而受影響"], "exp": ["✗A. 依§1151，繼承人有數人時，在分割遺產前各繼承人對遺產全部為公同共有，不是分別共有，選項錯誤。", "✓B. 依§1148Ⅰ，繼承人自繼承開始時承受被繼承人財產上之權利，且依§759，因繼承於登記前已取得不動產物權者，應經登記始得處分其物權；故乙丙在登記前已取得所有權，但須登記後才能處分，正確。", "✗C. 遺產為公同共有（§1151），依§828Ⅱ 準用§821，各共有人對第三人得就共有物之全部為本於所有權之請求（但回復共有物之請求，僅得為共有人全體之利益為之）；因此乙或丙可單獨起訴請求返還，不須共同起訴，選項錯誤。", "✗D. 若乙丙原為該屋之抵押權人，繼承後該屋所有權歸乙丙，抵押權與所有權同歸一人，依§762 其他物權因混同而消滅（除非其存續於所有人或第三人有法律上利益）；所以不能一概說抵押權「不因繼承而受影響」，選項錯誤。"]}, {"year": 100, "num": 27, "ans": "", "acc": "AD", "note": "本題依考選部公告多重給分：答 A或D 者均給分", "src": "ai", "stem": "下列關於動產之敘述，何者錯誤？", "opts": ["甲以占有之意思，占有被遺棄之流浪狗，甲取得該狗之所有權", "公園管理員在所管理之公園內拾得遺失物者，對遺失人不得請求報酬", "甲乙各有一桶白油漆，不慎混合在一起，二人應按其混合時之價值，共有混合後之油漆", "加工於他人之動產者，其加工物之所有權，原則上屬於加工人"], "exp": ["✗A. 先占須「以所有之意思」占有無主動產（§802）；題述僅「占有之意思」，要件不符，且是否取得所有權不能僅憑占有意思認定。", "✓B. 拾得人在公眾得出入之場所，若為該場所之管理人或受僱人，依§805-1不得請求報酬；公園管理員屬之。", "✓C. 動產混合不能識別或識別需費過鉅者，準用附合規定（§813、§812 I），各所有人按混合時價值共有合成物。", "✗D. 加工於他人動產，加工物原則上屬材料所有人，僅加工增價顯逾材料價值時才屬加工人（§814）。", "★加工原則歸「材料主」、例外才歸加工人，別記反；先占的主觀要件是「所有意思」不是單純占有。本題考選部公告A或D均給分。"]}, {"year": 100, "num": 28, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將其所有之 A 車借給乙，不久卻將 A 車贈與給乙，則甲對乙得以何種方式交付 A 車？", "opts": ["現實交付", "簡易交付", "占有改定", "指示交付"], "exp": ["✗A. 現實交付（§761Ⅰ 前段：動產物權之讓與，非將動產交付不生效力）：須將動產實際移轉占有給受讓人；本題乙已在占有A車，不需再現實交付。", "✓B. 簡易交付（§761Ⅰ 但書）：受讓人已占有動產者，於讓與合意時即生效力；乙原已借用占有A車，甲、乙只要就贈與（讓與）達成合意即完成交付，正確。", "✗C. 占有改定（§761Ⅱ）：讓與人讓與後仍繼續占有動產，雙方訂立契約使受讓人取得間接占有以代交付；本題甲讓與後不再占有，並非此情形。", "✗D. 指示交付（§761Ⅲ）：動產由第三人占有時，讓與人以對第三人的返還請求權讓與受讓人以代交付；本題車在乙手上，無第三人，並非此情形。★交付四種：現實（§761Ⅰ前）、簡易（§761Ⅰ但書，受讓人已占有）、占有改定（§761Ⅱ，讓與人繼續占有）、指示（§761Ⅲ，讓與對第三人之返還請求權）。"]}, {"year": 100, "num": 29, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲將 A 屋設定普通抵押權給乙銀行後，甲又將該 A 屋出租給丙，下列敘述何者為正確？", "opts": ["甲乙間之抵押權無效", "甲丙間之租約無效", "甲乙間之抵押權不因此而受影響，但 A 屋之租金由乙收取之", "甲乙間之抵押權不因此而受影響，A 屋之租金仍由甲收取之"], "exp": ["✗A. 抵押權不移轉占有（§860），設定後抵押人仍可使用，抵押權有效。", "✗B. 抵押權設定後，所有人仍得成立租賃關係（§866 I），租約有效。", "✗C. 抵押權效力及於法定孳息（租金）須經扣押，且抵押權人須通知義務人（§864），未扣押前租金歸抵押人收取。", "✓D（本題答案）. 設定抵押後出租，抵押權不受影響（§866 I）；抵押物未經扣押前，租金仍由出租人甲收取（§864反面）。", "★抵押權「不占有、不收租」：扣押之後抵押權人才能收法定孳息（租金），天然孳息（§863）也是扣押後分離者才及於。陷阱：誤以為抵押後租金歸抵押權人。"]}, {"year": 101, "num": 12, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "出賣人甲依其與買受人乙間之動產買賣契約，於約定之日合法提出給付，卻遭乙拒絕受領。依實務見解，就乙拒絕受領之法律效果，下列敘述何者最正確？", "opts": ["甲得解除契約", "甲不得向乙請求繼續保管給付物之必要費用", "甲得拋棄對該動產之占有", "甲對標的物之保管，僅就故意負其責任"], "exp": ["✓A（本題答案）. 買受人有受領標的物義務（§367），實務肯認其受領義務屬債務，經催告仍拒絕受領者，出賣人得依§254解除契約。", "✗B. 債權人遲延時，債務人得請求賠償提出及保管給付物之必要費用（§240），故甲得請求。", "✗C. 得拋棄占有者限於有交付不動產義務之債務人（§241 I）；本題為動產，不適用。", "✗D. 債權人受領遲延期間，債務人僅就故意或重大過失負責（§237），非僅故意。", "★受領遲延三件套：責任減輕（故意重大過失，§237）、費用可求償（§240）、不動產可拋棄占有（§241）。陷阱：把§237的「重大過失」漏掉。"]}, {"year": 101, "num": 14, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙三人分別共有一筆 A 土地。三人就 A 地約定各自得使用之特定部分，且於二十年內不得請求分割。下列敘述何者最正確？", "opts": ["如甲使用部分在約定不得請求分割期間內被徵收，甲仍得隨時請求分割", "不得分割之約定逾五年，無效。三人應重新約定", "不得分割之約定逾五年，應縮短為五年", "於約定不得請求分割期間內，任一共有人皆不得處分其應有部分"], "exp": ["✓A（本題答案）. 約定不分割期間內若有重大事由，共有人仍得隨時請求分割（§823 III）；使用部分被徵收使約定管理基礎喪失，屬重大事由。", "✗B. 不分割約定逾五年並非無效，而是縮短（§823 II）；且不動產訂有管理約定者上限為三十年。", "✗C. 共有不動產訂有管理之約定時，不分割期限上限為三十年（§823 II但書），二十年未逾限，不須縮短。", "✗D. 各共有人得自由處分其應有部分（§819 I），不分割約定不限制應有部分之處分。", "★不分割期限：動產／一般5年，有管理約定之不動產30年，逾限「縮短」不是「無效」；有重大事由可隨時請求分割。陷阱：混淆五年與三十年。"]}, {"year": 101, "num": 15, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲以其土地設定地上權於乙後，乙以該地上權設定抵押權於丙。下列敘述何者最正確？", "opts": ["原則上如乙未得甲之同意，丙所設定之抵押權無效", "如乙繼承甲之土地，地上權因混同而消滅", "非得丙之同意，乙不得拋棄其地上權", "甲不須乙、丙同意，得自由拋棄其土地所有權"], "exp": ["✗A. 依§882，地上權得為抵押權之標的；且§838Ⅰ 規定地上權人得將其權利讓與他人或設定抵押權（除非契約另有約定或習慣），不須土地所有人甲同意，丙之抵押權有效，選項錯誤。", "✗B. 乙繼承甲之土地，地上權與土地所有權同歸一人，依§762 本文其他物權因混同而消滅；但書規定其他物權之存續於所有人或第三人有法律上利益者不消滅，本題丙對地上權有抵押權，地上權存續於丙有法律上利益，故不因混同而消滅，選項錯誤。", "✓C. 依§764Ⅱ，物權之拋棄，如第三人有以該物權為標的物之其他物權者，非經該第三人同意，不得為之；丙以乙的地上權為標的設有抵押權，乙非得丙同意不得拋棄地上權，正確。", "✗D. 甲拋棄土地所有權，同樣受§764Ⅱ 限制：乙就該土地有地上權（以土地所有權為基礎的其他物權），非經第三人同意不得拋棄，所以甲並非「不須同意得自由拋棄」，選項錯誤。"]}, {"year": 101, "num": 16, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲以其土地設定地上權於乙。下列敘述何者最正確？", "opts": ["定有期限之地上權原則上不因建築物於所定期限內滅失而消滅", "甲、乙間不得設定未定有期限之地上權", "甲、乙間不得設定未定有地租之地上權", "因不可抗力致妨礙土地之使用時，乙得請求減免租金"], "exp": ["✓A（本題答案）. 地上權不因建築物或其他工作物之滅失而消滅（§841）。", "✗B. 地上權得不定期限（§833-1、§834、§835），當事人可約定未定期限。", "✗C. 地上權得為無償，不以有地租為必要（§835-1 II規範無償地上權之酌定地租），故可設定無地租之地上權。", "✗D. 地上權人不得因不可抗力妨礙土地使用而請求免除或減少地租（§837）。", "★地上權三個「不」：工作物滅失不消滅（§841）、不可抗力不減租（§837）、不一定要有地租。陷阱：§837容易被當成可減租（與租賃§435混淆）。"]}, {"year": 101, "num": 18, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲分別於乙、丙所有之不動產設定普通抵押權，以擔保甲對乙之債權。下列敘述何者最正確？", "opts": ["甲向丙請求清償債務時，丙得主張先訴抗辯權", "即使甲對乙之債權已因時效而消滅，甲仍得於消滅時效完成後五年內實行對丙之抵押權", "甲僅得先對乙之不動產實行抵押權", "甲實行對丙之抵押權後，丙不得向乙求償"], "exp": ["✗A. 物上保證人丙不享有先訴抗辯權，抵押權人得就其抵押物直接實行（先訴抗辯屬保證§745）。", "✓B（本題答案）. 債權時效完成後，抵押權人於五年內未實行抵押權者，抵押權始消滅（§880）；五年內仍得實行，物上保證人之抵押物亦同（§145 II）。", "✗C. 抵押權人對債務人與物上保證人之不動產，得任擇其一或同時實行，無先後次序。", "✗D. 物上保證人因抵押權實行失去抵押物所有權時，依保證規定對債務人有求償權（§879）。", "★物上保證人：沒有先訴抗辯，但實行後可向債務人求償（§879）；時效完成後5年內抵押權仍可實行（§880）。陷阱：把物上保證人當成保證人。"]}, {"year": 101, "num": 35, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲向乙借款 500 萬元，並將所有之 A 地設定普通抵押權給乙，下列敘述何者最正確？", "opts": ["乙就 A 地賣得之價金有優先受償之權", "乙得僅將抵押權讓與給第三人丙，而保留對甲之借款返還債權", "抵押權不因登記之先後定其次序，具有平等性", "甲若將 A 地讓與給丁，則乙之抵押權消滅"], "exp": ["✓A. §860，抵押權人就抵押物賣得之價金，有優先於其他債權人受清償之權，正確。", "✗B. §870，抵押權隨同債權移轉，不得與債權分離而單獨讓與（從屬性），乙不得僅讓與抵押權而保留債權，選項錯誤。", "✗C. §865，同一不動產上有數個抵押權時，依其登記先後定其次序（先登記者次序在先），並非「平等」，選項錯誤。", "✗D. §867，抵押人（甲）得讓與不動產（A地）所有權（讓與所有權不消滅抵押權），抵押權隨物存在（對物之權，而非對人之權），讓與後抵押權仍存在，選項說「抵押權隨即消滅」錯誤。"]}, {"year": 101, "num": 39, "ans": "", "acc": "B", "note": "本題依考選部公告多重給分：答 B 者均給分", "src": "ai", "stem": "甲在自己之院子栽種梨樹一棵，結滿果實，一陣大風吹過，將部分果實吹落到鄰居之 A 庭院中；乙為 A庭院之承租人，丙為 A 庭院之所有權人。問：誰取得吹落到 A 庭院果實之所有權？", "opts": ["甲", "乙", "丙", "乙與丙共同取得"], "exp": ["✗A. 果實自落於鄰地者，視為屬於鄰地所有人（§798），甲非所有人。", "✗B. §798文義歸鄰地「所有人」丙；惟乙為承租人，依租賃就該庭院有使用收益權，故考選部公告答B亦給分。", "✓C. 果實自落於鄰地，視為屬於鄰地所有人（§798），A庭院所有人為丙；但鄰地為公共用地者除外。", "✗D. 法律僅規定歸鄰地所有人，並未規定由承租人與所有人共同取得。", "★§798：落果「視為」歸鄰地所有人，是法律擬制；考生易誤選承租人（有收益權）。本題考選部公告答B者給分，建議仍以§798文義（丙）記憶。"]}, {"year": 101, "num": 40, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲有 A 地一筆，設定地上權於乙，下列敘述何者最正確？", "opts": ["若乙積欠地租達一年之總額時，甲得不經催告終止地上權", "乙原則上不得將地上權讓與第三人丙，但地上權之期限逾二十年者，不在此限", "因不可抗力而妨礙 A 地之使用時，乙不得請求甲減少地租", "地上權因建築物或其他工作物之滅失而消滅"], "exp": ["✗A. 地租積欠達二年總額，須定相當期限催告，逾期未付才得終止（§836 I），非一年且須催告。", "✗B. 地上權人原則上得讓與其權利（§838 I），契約另有約定或習慣者除外，與期限是否逾二十年無關。", "✓C（本題答案）. 地上權人不得因不可抗力妨礙土地使用，而請求減免地租（§837）。", "✗D. 地上權不因建築物或其他工作物滅失而消滅（§841）。", "★地租積欠：二年＋催告＋逾期未付才可終止；§837不可抗力不減租；§841工作物滅失不消滅。陷阱：數字一年／二年、是否須催告。"]}, {"year": 102, "num": 7, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲為 A 地的所有權人，乙為 A 地的抵押權人，丙為 A 地的地上權人。關於當事人間的權利義務，下列敘述何者錯誤？", "opts": ["乙的抵押權設定後，甲仍得將 A 地設定地上權給丙", "若乙的抵押權設定在地上權之後，日後乙實行抵押權受有影響時，法院得除去丙的地上權後拍賣 A 地", "若乙的抵押權設定後，甲在 A 地上蓋造 B 屋，日後乙實行抵押權受有影響時，得聲請法院將 B 屋與 A 地併付拍賣", "乙的抵押權設定後，擔保債權未受清償前，甲得將 A 地售予丁"], "exp": ["✓A. 抵押權設定後，所有人仍得於同一不動產設定地上權（§866 I），抵押權不受影響。", "✗B（本題答案）. 法院得除去者限於抵押權「設定後」才成立之用益物權（§866 II）；地上權在先者，抵押權人不得請求除去。", "✓C. 抵押權設定後於抵押地上營造建築物者，抵押權人得聲請併付拍賣，但對建築物價金無優先受償權（§877）。", "✓D. 抵押權設定後，所有人仍得將不動產讓與他人，抵押權不因此受影響（§867）。", "★誰先誰後：先有用益物權、後有抵押權，抵押權不能除去它；後設定的用益物權在受影響時才可除去（§866 II）。陷阱：把先後順序弄反。"]}, {"year": 102, "num": 8, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲所有的 A 地與乙所有的 B 地相鄰，甲在 A 地上建築房屋及圍牆，其中圍牆有一部分越界建築在 B 地上。下列敘述何者正確？", "opts": ["乙如果知道甲有越界建築之情事而不即提出異議者，不得請求甲拆除越界的圍牆", "甲對於乙所受之損害，應支付償金，但得不拆除越界的圍牆", "乙得請求甲以相當之價額購買越界部分的土地，不得請求甲拆除越界的圍牆", "乙得請求甲拆除越界的圍牆，返還被占用的土地"], "exp": ["✗A. 免除拆除須土地所有人「非因故意或重大過失」越界（§796 I，圍牆經§796-2準用），題目並未交代無故意重過失，不能一概不得拆除。", "✗B. 償金係於鄰地所有人不得請求拆除之情形，鄰地所有人得請求之補償（§796 I但書），非無條件得不拆除。", "✗C. 不得請求拆除時，鄰地所有人是「得」請求以相當價額購買越界土地，而非不得請求拆除；本題前提亦不成立。", "✓D（本題答案）. 未具備§796免拆要件時，鄰地所有人為所有人，得依§767 I請求拆除越界部分並返還土地。", "★越界建築：必須同時「非故意重大過失」＋「知悉不即異議」才不得請求拆除；題目沒給條件時，回到§767所有物返還與除去妨害。"]}, {"year": 102, "num": 10, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲有一宗土地，與乙訂立買賣契約，將該宗土地賣給乙。雙方訂立買賣契約後，因土地飆漲，甲藉故不願履行契約上之義務。乙起訴請求甲移轉買賣標的物之所有權，法院判決乙勝訴確定。下列敘述何者正確？", "opts": ["乙因法院之判決，取得不動產物權，故於判決確定時，即已取得該土地之所有權", "乙必須根據確定判決，辦畢所有權移轉登記後，始能取得該土地之所有權", "甲依法院之確定判決，將土地交付於乙時，乙即取得該土地之所有權", "甲依法院之確定判決，將土地之所有權狀交付於乙時，乙即取得該土地之所有權"], "exp": ["✗A. 判決確定即取得物權者限於形成判決（§759），本題請求移轉所有權屬給付判決，須辦理登記。", "✓B（本題答案）. 給付判決僅使乙取得請求移轉登記之執行名義，須辦畢所有權移轉登記才取得所有權（§758）。", "✗C. 不動產物權變動以登記為生效要件（§758），交付不生所有權移轉效力。", "✗D. 交付所有權狀不生物權變動效力，仍須登記（§758）。", "★§759：形成判決（如裁判分割）確定即取得，但處分仍須登記；給付判決（命移轉）仍須登記才取得。陷阱：把給付判決當形成判決。"]}, {"year": 102, "num": 11, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲有一棟房屋，與乙訂立買賣契約，將該房屋賣給乙。下列敘述何者正確？", "opts": ["買賣契約有效成立時，立刻使乙取得房屋之所有權", "甲將房屋交付給乙時，立刻使乙取得房屋之所有權", "甲將房屋所有權狀交付給乙前，乙無法取得房屋之所有權", "甲將房屋所有權移轉登記給乙前，乙無法取得房屋之所有權"], "exp": ["✗A. 買賣契約（債權行為）依§345Ⅱ 於標的物及價金互相同意時成立，但僅生債之關係，並不使乙立即取得所有權，選項錯誤。", "✗B. 不動產（房屋）所有權依法律行為取得，依§758Ⅰ 非經登記不生效力，僅交付占有並不移轉所有權（交付才生效力的是動產，§761Ⅰ），選項錯誤。", "✗C. 所有權狀只是行政上的證明文件，交付所有權狀不等於辦理登記，不是取得不動產所有權的要件，選項錯誤。", "✓D. 依§758Ⅰ，不動產物權依法律行為而取得，非經登記不生效力；甲將房屋移轉登記給乙之前，乙無法取得所有權，正確。"]}, {"year": 102, "num": 12, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲死亡時，遺有子女乙、丙二人為繼承人，及房屋一棟。下列敘述何者正確？", "opts": ["甲對房屋之所有權，並不因甲死亡，而發生所有權之移轉", "房屋為不動產，乙丙二人非經登記，無法取得房屋所有權", "乙丙二人縱使未辦理登記，仍然因繼承而取得房屋所有權", "乙丙二人縱使未辦理登記，仍因繼承而得處分房屋所有權"], "exp": ["✗A. 依§1147、§1148Ⅰ，繼承因被繼承人死亡而開始，繼承人自繼承開始時承受被繼承人財產上之一切權利義務，房屋所有權因繼承而移轉，選項說「不發生移轉」錯誤。", "✗B. 依§759，因繼承、強制執行、徵收、法院判決等非因法律行為而取得不動產物權者，於登記前即已取得（§758 的登記生效要件只適用於法律行為），選項說「非經登記無法取得」錯誤。", "✓C. 繼承是非因法律行為而取得不動產物權（§759），乙丙縱未辦理登記，仍因繼承而取得房屋所有權，正確。", "✗D. 依§759，繼承人於登記前雖已取得不動產物權，但「應經登記，始得處分其物權」，未登記前不得處分，選項錯誤。"]}, {"year": 102, "num": 14, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙三人共有一筆 A 地，應有部分各三分之一。下列敘述何者錯誤？", "opts": ["甲、乙二人得在未經丙同意的情況下，將 A 地出售與丁建設公司", "甲、乙二人得在未經丙同意的情況下，將 A 地出租與戊使用", "甲得在未經乙、丙同意的情況下，將其 A 地的應有部分設定抵押權與庚銀行", "甲、乙、丙三人經裁判分割 A 地時，須待分割登記完成時，才各自取得單獨所有權"], "exp": ["✓A. 僅就買賣之債權契約而言，出賣人不以有處分權為必要即可訂立；惟履行時移轉所有權之處分行為依§819 II須全體共有人同意。", "✓B. 出租屬管理行為，得依§820 I以共有人過半數及應有部分合計過半數決定，甲乙合計三分之二已足。", "✓C. 共有人得自由處分其應有部分，包括設定抵押權（§819 I）。", "✗D（本題答案）. 裁判分割為形成判決，分割判決確定時即生物權變動效力，不待登記（§759）。", "★共有三層次：應有部分自由處分（§819 I）、共有物處分需全體同意（§819 II）、管理多數決（§820 I）。陷阱：「出售」要分債權契約與處分行為。"]}, {"year": 102, "num": 18, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲有一幅臺灣著名畫家之名畫，市值新臺幣 500 萬元，借給乙在畫展中展覽，並未委託乙出售。丙觀賞該名畫，愛不釋手，不知該畫是乙向甲借的，於是向乙表示願出新臺幣 700 萬元請乙割愛，乙就以新臺幣 700 萬元將該畫賣給丙，並以移轉所有權之意思交付給丙。下列敘述何者正確？", "opts": ["甲得請求丙返 : 28, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲所有的 A 地因通行之需在乙的 B 地上設定不動產役權。下列敘述何者錯誤？", "opts": ["甲得將 A 地設定抵押權與丙銀行", "甲得將 B 地上的不動產役權單獨讓與給丁", "嗣後 A 地分割並讓與，為戊、己所有，戊、己皆享有 B 地上的不動產役權", "嗣後 B 地分割並讓與，為庚、辛所有，甲的不動產役權仍存在庚、辛受讓的 B 地上"], "exp": ["✓A. 需役不動產之所有人仍得就需役地設定抵押權，不受不動產役權之限制。", "✗B（本題答案）. 不動產役權不得由需役不動產分離而為讓與，或為其他權利之標的物（§853）。", "✓C. 需役不動產經分割者，不動產役權為各部分之利益仍存續（§856）。", "✓D. 供役不動產經分割者，不動產役權就其各部分仍存續（§857）。", "★不動產役權「跟著地走」：不能單獨讓與（§853），分割後需役、供役兩邊仍存續（§856、§857）。陷阱：把役權當成可單獨買賣的權利。"]}, {"year": 102, "num": 36, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "關於不動產所有權取得時效，下列敘述何者錯誤？", "opts": ["應以所有之意思", "應和平公然繼續占有", "應占有他人未登記之不動產", "時效完成即取得不動產所有權"], "exp": ["✓A. §769，以「所有之意思」和平公然繼續占有，為時效取得不動產要件，正確。", "✓B. 和平（無暴力）、公然（公開）、繼續占有，均為必要條件，正確。", "✓C. 時效取得不動產，限於「他人未登記之不動產」，已登記不動產不能時效取得（§770），正確。", "✗D（本題答案）. 時效取得不動產，時效完成後，僅取得「請求登記為所有人」之權利，須「向地政機關聲請登記」後才取得所有權（§769），並非「時效完成即取得」，選項錯誤，為應選答案。"]}, {"year": 103, "num": 3, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列何種權利屬於準物權？", "opts": ["農育權", "商標權", "漁業權", "典權"], "exp": ["✗A. 農育權屬於民法物權編明文之「用益物權」，並非準物權。", "✗B. 商標權屬「智慧財產權」（無形財產權），性質上非物權亦非準物權。", "✓C. 漁業權依漁業法規定設立，性質上準用物權規定（具有排他性、可讓與等物權特性），屬「準物權」，正確。★準物權：礦業權、漁業權、水權等，依特別法準用物權規定。", "✗D. 典權為民法物權編明文規定之物權（§911以下），屬真正物權，而非準物權。"]}, {"year": 103, "num": 16, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於共有物分割，下列敘述何者正確？", "opts": ["共有物依共有人協議分割時，並不適用多數決原則", "共有人以契約訂有不分割之期限者不得逾十年；逾十年者，縮短為十年", "共有之不動產，其契約訂有管理之約定時，約定不分割之期限，不得逾五十年；逾五十年者，縮短為五十年", "不動產共有人間關於共有物分割或禁止分割之約定，對於應有部分之受讓人或取得物權之人，以受讓或取得時知悉其情事或可得而知者為限，亦具有效力"], "exp": ["✓A（本題答案）. 協議分割須全體共有人同意，不適用多數決，多數決僅用於管理（§820 I）。", "✗B. 不分割期限一般不得逾五年，逾五年者縮短為五年（§823 II）。", "✗C. 共有不動產訂有管理約定者，不分割期限上限為三十年，逾三十年縮短為三十年，非五十年（§823 II但書）。", "✗D. 不動產共有人間之約定須經登記後才對受讓人具有效力（§826-1 I）；「知悉或可得而知」之規定適用於動產（§826-1 II）。", "★分割協議＝全體同意；不分割期限5年／30年；不動產約定要「登記」才有對抗力，動產看「知悉或可得而知」。陷阱：動產與不動產規定互換。"]}, {"year": 103, "num": 20, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲自行出資建造違章建築房屋一幢，將之出售予乙，並已交付乙占有。但事後甲對乙主張其為所有權人，請求乙返還房屋。下列敘述何者正確？", "opts": ["甲之請求為無理由。因為違章建築是違法行為，甲無法取得該屋所有權", "甲之請求為有理由。因為違章建築買賣是違法行為，買賣契約無效，甲得請求回復原狀", "甲之請求為有理由。甲可根據民法第 767 條第 1 項前段，所有人對於無權占有或侵奪其所有物者，得請求返還之", "甲之請求為無理由。縱甲根據民法第 767 條第 1 項前段，所有人對於無權占有或侵奪其所有物者，得請求返還之。乙基於買賣契約非無權占有該屋，故無須返還"], "exp": ["✗A. 違章建築雖違法，原始建造人對建物仍得取得權利（實務稱事實上處分權），並非因違法而一概不能取得。", "✗B. 違章建築之買賣契約仍有效，並不因建物違章而無效，甲不得請求回復原狀。", "✗C. 乙持有買賣契約占有，並非無權占有，甲不能依§767 I前段請求返還。", "✓D（本題答案）. 乙基於有效買賣契約占有，有占有本權，甲縱主張§767 I前段，乙亦得以買賣契約抗辯而無須返還。", "★§767請求返還的前提是對方「無權占有」；賣方已出賣並交付，買方有債權上的占有權源。陷阱：把違章建築買賣誤認為無效契約。"]}, {"year": 103, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於越界建築之處理，下列敘述何者正確？", "opts": ["土地所有人建築圍牆時因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其圍牆", "土地所有人建築圍牆時非因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其圍牆", "土地所有人建築房屋時因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋", "土地所有人建築房屋時非因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋"], "exp": ["✗A. 因重大過失越界者，不得適用§796的免拆保護；且§796要件為非因故意或重大過失，題述與要件相反。", "✗B. §796直接規範者為「房屋」；圍牆屬其他工作物，須依§796-2準用，非本題所指之典型直接適用情形。", "✗C. 因重大過失越界建築房屋，不符§796「非因故意或重大過失」之要件，鄰地所有人仍得請求移去。", "✓D（本題答案）. 土地所有人建築房屋非因（故意或）重大過失越界，鄰地所有人知其越界而不即提出異議者，不得請求移去或變更其房屋（§796 I）。", "★越界建築三要件：主觀無故意重過失、鄰地所有人知悉未即異議、客體為房屋（工作物準用§796-2）。陷阱：把「重大過失」的有無弄反。"]}, {"year": 103, "num": 23, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲在其土地上為乙設定眺望不動產役權，其後甲未獲得乙之同意又為丙設定地上權，丙預備在該地上建築房屋，若該房屋建成，乙之眺望權將因而受到影響，下列敘述，何者正確？", "opts": ["應不許丙設定地上權", "縱然設定地上權，亦屬無效", "地上權人不許在該地上建築房屋", "設定地上權後，不動產役權消滅"], "exp": ["✗A. 已設定不動產役權，並不禁止所有人再設定地上權，地上權仍得設定。", "✗B. 地上權有效成立，但其行使受先成立之不動產役權限制，並非無效。", "✓C（本題答案）. 先成立之眺望不動產役權有優先效力，地上權人不得為妨害眺望之行為，故不許在該地上建築妨礙眺望之房屋。", "✗D. 後設定地上權不會使先成立之不動產役權消滅。", "★物權優先：先成立的不動產役權（眺望）拘束後取得權利的人；後者不是無效，而是行使受限制。陷阱：以為設定行為無效或役權消滅。"]}, {"year": 103, "num": 24, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於地上權，下列敘述何者正確？", "opts": ["普通地上權乃以在他人土地上下之一定空間範圍內有建築物或其他工作物為目的而使用其土地之權", "地上權定有期限，而有支付地租之約定者，地上權人得支付未到期之三年分地租後，拋棄其權利", "地上權人得將其權利設定權利質權。但契約另有約定或另有習慣者，不在此限", "地上權人，因不可抗力，妨礙其土地之使用，得請求免除或減少租金"], "exp": ["✗A. 普通地上權是在他人土地上下有建築物、工作物或竹木為目的而使用土地之權（§832）；限定上下一定空間範圍者為區分地上權（§841-1）。", "✓B（本題答案）. 定有期限而有地租者，地上權人得支付未到期之三年分地租後拋棄其權利（§835 I）。", "✗C. 地上權為不動產物權，得設定抵押權（§882、§838 I），非權利質權之標的。", "✗D. 地上權人不得因不可抗力妨礙土地使用而請求免除或減少地租（§837）。", "★拋棄地上權：有期限且有地租→付未到期三年地租；未定期限有地租→一年前通知或付一年地租（§835）。陷阱：與區分地上權定義混淆。"]}, {"year": 103, "num": 25, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將土地為乙設定典權並交付之，其後甲將該地出賣與丙，乙主張有權以相同條件購買，此權利稱為：", "opts": ["找貼權", "留買權", "回贖權", "絕賣權"], "exp": ["✗A. 找貼權（§926）：出典人於典權存續中表示讓與典物所有權予典權人時，典權人得按時價找貼，取得典物所有權（以一次為限）；與本題「出典人賣給第三人丙，典權人以相同條件購買」不同。", "✓B. 依§919Ⅰ，出典人將典物出賣於他人時，典權人有以相同條件留買之權，此即留買權；本題甲將土地出賣給丙，乙主張以相同條件購買，正確。", "✗C. 回贖權（§923Ⅰ）：典權定有期限者，期限屆滿後出典人得以原典價贖回典物，是出典人的權利，與本題不同。", "✗D. 絕賣：典權附有絕賣條款（§913），或典期屆滿後經過二年出典人不以原典價回贖（§923Ⅱ），典權人即取得典物所有權；與本題情形不同。"]}, {"year": 103, "num": 27, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "下列何者不屬於直接占有人？", "opts": ["房屋承租人", "土地之典權人", "汽車之受委託保管人", "為雇主駕駛汽車之司機"], "exp": ["✗A. 承租人直接使用、占有租賃物，為直接占有人，正確（屬直接占有）。", "✗B. 典權人支付典價取得不動產使用收益，為直接占有人（對典物有直接管領力），正確（屬直接占有）。", "✗C. 受委託保管汽車者對汽車有直接管領，為直接占有人，正確（屬直接占有）。", "✓D. 司機為雇主駕駛汽車，係「輔助占有人」（§942，占有輔助人），司機僅依雇主指示駕駛，無獨立占有意思，其管領的利益歸屬於雇主（雇主為直接占有人），司機本身「不屬於」直接占有人，正確為應選答案。★輔助占有（§942）：在從屬關係下為他人管領者，不具有獨立占有地位。"]}, {"year": 103, "num": 28, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "下列何種權利，不得單獨成為抵押權之標的物？", "opts": ["地上權", "不動產役權", "農育權", "典權"], "exp": ["✗A. §882，地上權「得為」抵押權之標的（得以地上權設定抵押），A可以，選項排除。", "✓B. 不動產役權（§851以下）係附隨於需役地而存在，不得與需役地分離（§853），故「不得單獨」成為抵押權標的物，正確，為應選答案。", "✗C. §882，農育權「得為」抵押權標的，C可以，選項排除。", "✗D. §882，典權「得為」抵押權標的，D可以，選項排除。★記法：地上權、農育權、典權均可單獨抵押（§882）；不動產役權因附隨性不得單獨抵押。"]}, {"year": 103, "num": 30, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列關於最高限額抵押權之敘述，何者正確？", "opts": ["得有效約定最高限額係指本金最高限額", "得約定凡是書面契約所生之債權，均屬擔保範圍", "得約定凡是新臺幣 100 萬元以下之債權，均屬擔保範圍", "得經抵押人之同意，將最高限額抵押權讓與他人"], "exp": ["✗A. 依§881-1Ⅰ，最高限額抵押權係就債權人對債務人一定範圍內之不特定債權，「在最高限額內」設定；且§881-2Ⅱ 規定利息、遲延利息、違約金與原債權合計不逾最高限額範圍者，亦得行使，可知是「債權最高限額」，並非僅限本金，選項錯誤。", "✗B. 依§881-1Ⅱ，最高限額抵押權所擔保之債權，以由「一定法律關係」所生之債權或基於票據所生之權利為限；「凡書面契約所生之債權」範圍過於不特定，不符，選項錯誤。", "✗C. 同§881-1Ⅱ，擔保範圍須限於一定法律關係或票據所生之債權，僅以金額「100萬元以下」劃定範圍，缺乏法律關係的限定，選項錯誤。", "✓D. 依§881-8Ⅰ，原債權確定前，抵押權人經抵押人之同意，得將最高限額抵押權之全部或分割其一部讓與他人，正確。"]}, {"year": 103, "num": 32, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "設定抵押權時，土地及其土地上之建築物，同屬於一人所有，而以土地及建築物為抵押者，如經拍賣，其土地與建築物之拍定人各異時，關於拍定人間之關係，下列敘述何者正確：", "opts": ["視為已有不動產役權之設定", "視為已有地上權之設定", "視為取得使用借貸權", "視為取得租賃權"], "exp": ["✗A. 不動產役權是需役地與供役地之間的關係，本題為土地與建物拍賣後之關係，性質不同。", "✓B. §876，土地及其上建物同屬一人，以土地及建物為抵押，拍賣後由不同人拍得，「視為」已設定地上權（保護建物所有人使用土地之權益），正確。★§876「視為已有地上權之設定」。", "✗C. 使用借貸為債之關係，而§876明定「視為已有地上權之設定」（物權），選項錯誤。", "✗D. 租賃關係適用於§425-1（買賣分離情形，且為「推定」），本題為抵押拍賣，適用§876（「視為」地上權），選項法律關係錯誤。"]}, {"year": 104, "num": 2, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "承上題，嗣後丙將 A 地又賣給丁，並完成移轉登記。A 地之所有權應屬何人？", "opts": ["甲", "乙", "丙", "丁"], "exp": ["✗A. 甲已將A地以登記為生效要件之方式處分，物權變動依§758 I以登記為準，登記後甲不再是所有人。", "✗B. 乙若僅取得買賣之債權，未經登記不生物權變動（§758 I），不能取得所有權。", "✗C. 丙已將A地移轉登記予丁，丙因登記移轉而喪失所有權。", "✓D（本題答案）. 不動產物權依法律行為變動須經登記始生效力（§758 I）；丁已完成移轉登記，取得A地所有權。", "★不動產看登記：買賣契約只是債權，誰完成登記誰是所有人。陷阱：先買先贏的直覺在不動產不成立。（本題承上題，以登記公示為判斷）"]}, {"year": 104, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲有名筆一枝，其子乙將甲之筆賣給知情之丙，乙、丙於民國 104 年 9 月 28 日簽訂買賣契約，惟尚未交付。嗣後，乙又於 104 年 10 月 10 日將甲之筆賣給不知情之丁並交付之。甲於 104 年 11 月 1 日死亡，乙是甲之唯一繼承人。試問何人取得該筆之所有權？", "opts": ["甲", "乙", "丙", "丁"], "exp": ["✗A. 乙無處分權出賣，丁善意受讓並受交付，依§948取得所有權，甲因而喪失所有權。", "✗B. 乙自己並非所有人，其處分因丁善意取得而生效，乙繼承甲前丁已取得所有權，乙不能取得所有權。", "✗C. 丙僅與乙訂有買賣之債權契約，筆尚未交付，不取得所有權（§761）。", "✓D（本題答案）. 丁不知情且受現實交付，依善意受讓規定（§801、§948）取得該筆所有權。", "★動產雙重買賣：看誰先「交付」且善意；買賣契約不等於取得所有權。陷阱：繼承並不會使先前已被善意取得的所有權回到乙手上。"]}, {"year": 104, "num": 23, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲遺失價值拾萬元之金戒指一只，被大學生乙拾得並依法招領。下列敘述，何者錯誤？", "opts": ["自通知或最後招領之日起逾六個月，若甲未認領者，由乙取得該戒指所有權", "乙於受領取通知或公告後六個月內未領取者，該戒指歸屬於保管地之地方自治團體", "甲認領該戒指時，乙可向甲請求壹萬元報酬", "乙對甲之報酬請求權，因六個月間不行使而消滅"], "exp": ["✓A. 自通知或最後招領之日起逾六個月，遺失人未認領者，拾得人取得所有權（§807 I）。", "✗B（本題答案）. 歸屬保管地地方自治團體者，是拾得人於受通知或公告後三個月內未領取之情形，並非六個月（§807 II）。", "✓C. 遺失人認領時，拾得人得請求拾得物價值十分之一之報酬（§805 II），價值十萬元則為一萬元。", "✓D. 拾得人之報酬請求權，因六個月間不行使而消滅（§805 IV）。", "★拾得遺失物時間表：招領後6個月無人認領歸拾得人；拾得人3個月內不領取歸地方自治團體；報酬請求權6個月。陷阱：6個月與3個月顛倒。"]}, {"year": 104, "num": 24, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "承上題，下列何種情形，乙不得向甲請求報酬？", "opts": ["甲為退休教師，依法請領退休金度日", "乙在捷運車廂內座椅上撿到甲的戒指", "乙在公園座椅上撿到甲的戒指", "乙未於七日內通知、報告或交存拾得物"], "exp": ["✗A. 領取退休金不屬§805-1所列不得請求報酬之情形，乙仍得請求。", "✗B. 乙為一般人，非場所管理人或受僱人，在捷運車廂拾得仍得請求報酬（§805-1 I僅限管理人或受僱人）。", "✗C. 乙在公園拾得，亦非管理人或受僱人，並非不得請求報酬之人。", "✓D（本題答案）. 拾得人未於七日內通知、報告或交存拾得物者，不得請求報酬（§805-1 II）。", "★不得請報酬：公眾場所「管理人、受僱人」拾得、7日內未通知報告交存或有據為己有意圖。陷阱：以為在公共場所撿到就一律無報酬。"]}, {"year": 104, "num": 25, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於添附，下列敘述，何者正確？", "opts": ["動產因附合而為不動產之重要成分者，動產及不動產所有人，共有該動產所有權", "動產與他人之動產附合，非毀損不能分離，或分離需費過鉅者，各動產所有人，按其動產附合時之比例，比例高者取得合成物之所有權", "動產與他人之動產混合，不能識別，或識別需費過鉅者，拍賣之", "附合之動產，有可視為主物者，該主物所有人，取得合成物之所有權"], "exp": ["✗A. 動產因附合成為不動產重要成分者，不動產所有人取得動產所有權（§811），非共有。", "✗B. 動產附合不能分離者，各所有人按附合時之價值共有合成物（§812 I），不是比例高者取得。", "✗C. 動產混合不能識別者，準用附合規定，由各所有人按價值共有（§813、§812 I），並非拍賣。", "✓D（本題答案）. 附合之動產有可視為主物者，主物所有人取得合成物之所有權（§812 II）。", "★添附口訣：動產附不動產→歸不動產所有人；動產附動產→有主物歸主物，無主物按價值共有。陷阱：共有是按「價值」而非「數量」。"]}, {"year": 104, "num": 26, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將其單獨所有之土地的特定部分出售予乙後，如該土地無不可分割之限制時，乙得如何請求甲履行其移轉所有權之義務？", "opts": ["請求甲移轉登記按該特定部分計算之土地應有部分，與甲共有該土地", "請求甲將該特定部分分割後移轉登記與乙", "乙得選擇請求甲為上述(A)或(B)之任一種移轉登記方式", "本買賣契約欠缺確定性與可能性而無效，乙不得請求甲為移轉登記"], "exp": ["✗A. 買賣標的為特定部分，並非移轉應有部分；單獨所有人不能以應有部分移轉代替履行。", "✓B（本題答案）. 買賣標的特定部分之土地，契約有效；甲須先辦理分割，再將該特定部分移轉登記予乙（§348 I、§758）。", "✗C. 甲不須讓乙選擇履行方式，應依標的特定部分之買賣履行，須先分割。", "✗D. 特定部分之範圍可得確定，契約並非不確定而無效。", "★土地一部出售：先分割、再移轉登記，契約仍有效。陷阱：以為只能移轉應有部分（變成共有）。"]}, {"year": 104, "num": 27, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙三人各有應有部分三分之一分別共有 A 地。下列敘述，何者正確？", "opts": ["甲得以其應有部分供第三人丁設定不動產役權", "三人協議分割達成合意之履行請求權，有消滅時效之適用", "甲須以共有人過半數及應有部分合計過半數之同意，始得請求分割", "甲得以共有人過半數及應有部分合計過半數之同意，以 A 地供丁設定抵押權"], "exp": ["✗A. 設定不動產役權屬處分共有物負擔，須全體共有人同意（§819 II），甲不得單以應有部分設定。", "✓B（本題答案）. 協議分割所生之履行請求權屬請求權，適用十五年消滅時效（§125）。", "✗C. 各共有人得隨時請求分割（§823 I），無須共有人過半數同意。", "✗D. 以共有物設定抵押權屬設定負擔，須得全體共有人同意（§819 II），非多數決事項。", "★共有三層次：應有部分自由（§819 I）、共有物處分設負擔全體同意（§819 II）、管理多數決（§820）；分割請求權可隨時行使（§823）。"]}, {"year": 104, "num": 28, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於區分所有建築物，下列敘述，何者錯誤？", "opts": ["稱區分所有建築物者，謂數人區分一建築物而各專有其一部，就專有部分有單獨所有權，並就該建築物及其附屬物之共同部分共有之建築物", "區分所有建築物共有部分，指區分所有建築物專有部分以外之其他部分及不屬於專有部分之附屬物", "區分所有建築物共有部分除法律另有規定外，不得經規約之約定，供區分所有建築物之特定所有人使用", "區分所有建築物專有部分得經其所有人之同意，依規約之約定，供區分所有建築物之所有人共同使用"], "exp": ["✓A. 區分所有建築物之定義如此規定（§799 I）。", "✓B. 共有部分指專有部分以外之其他部分及不屬於專有部分之附屬物（§799 III）。", "✗C（本題答案）. 共有部分除法律另有規定外，得經規約約定供特定所有人使用（§799-1 IV），並非不得。", "✓D. 專有部分得經所有人同意，依規約之約定供共同使用（§799-1 III）。", "★規約可以約定共有部分給特定人用（如專用停車位），專有部分也可約定共用。陷阱：把「得」看成「不得」。"]}, {"year": 104, "num": 29, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "甲以其土地設定不動產役權於乙後，復以同一土地之一部分設定普通地上權於丙。丙之普通地上權的效力如何？", "opts": ["當然無效", "當然有效、且其效力優先於乙之不動產役權", "無妨害乙之不動產役權時，當然有效", "乙、丙各自之用益物權的優先效力，由所有權人甲決定之"], "exp": ["✗A. 後設定地上權並非無效（物權不衝突即並存），選項過於絕對，錯誤。", "✗B. 依物權「先設定者優先」原則，不動產役權（先設定）優先於地上權（後設定），並非地上權效力優先，選項錯誤。", "✓C. 後設定之地上權，「無妨害已設定不動產役權時」，地上權有效；若行使地上權會妨礙不動產役權，則地上權之行使受限，正確。", "✗D. 物權效力依法律規定（先設定優先），並非由所有人甲決定，選項錯誤。"]}, {"year": 104, "num": 30, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲以 A 地設定抵押權於乙，擔保其對乙所負債務後，復將 A 地設定地上權於丙，由丙於 A 地上建築房屋。甲屆期無力清償債務，乙實行對 A 地之抵押權時，抵押權人實行抵押權受有影響者。下列敘述，何者正確？", "opts": ["法院得除去丙之地上權，乙於必要時並得聲請法院將建築物與土地併付拍賣", "法院得除去丙之地上權，但乙僅得聲請法院拍賣土地", "法院不得除去丙之地上權，但乙於必要時，得聲請法院將地上權及建築物與土地併付拍賣", "法院不得除去丙之地上權，乙僅得聲請法院拍賣土地"], "exp": ["✓A（本題答案）. 抵押權設定後才成立之地上權，抵押權人實行受影響者，法院得除去之（§866 II），並得於必要時併付拍賣建築物（§877）。", "✗B. 乙於必要時亦得聲請將建築物與土地併付拍賣（§877），不限於拍賣土地。", "✗C. 設定在後之地上權，法院得除去（§866 II）。", "✗D. 法院得除去丙之地上權，且乙得聲請併付拍賣建築物。", "★抵押後才設定的用益物權：影響受償→可除去；上面蓋了房子→可併付拍賣（但建物價金無優先權）。陷阱：只記得除去，忘了併付拍賣。"]}, {"year": 104, "num": 32, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於最高限額抵押權之敘述，何者正確？", "opts": ["為避免法律關係複雜，最高限額抵押權不得共有", "原債權確定前，抵押權人與抵押人得約定變更其債務人", "最高限額抵押權人得讓與其抵押權次序與後次序抵押權人", "原債權確定前，抵押權人得任意分割最高限額抵押權之一部與他人"], "exp": ["✗A. 依§881-9Ⅰ，最高限額抵押權得為數人共有（各共有人按債權額比例分配其得優先受償之價金），選項說「不得共有」錯誤。", "✓B. 依§881-3Ⅰ，原債權確定前，抵押權人與抵押人得約定變更§881-1Ⅱ 所定債權之範圍或其債務人，正確。", "✗C. 抵押權次序之讓與規定在§870-1（普通抵押權）；但§881-17 準用普通抵押權規定時，明文排除§870-1，所以最高限額抵押權人不得依該條讓與次序給後次序抵押權人，選項錯誤。", "✗D. 依§881-8Ⅰ，原債權確定前，抵押權人須「經抵押人之同意」，才能將最高限額抵押權之全部或分割其一部讓與他人，並非可任意為之，選項錯誤。"]}, {"year": 105, "num": 21, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關物權之優先性，在同一標的物下，下列敘述何者正確？", "opts": ["當所有權與定限物權併存時，所有權之效力依舊優先於定限物權", "當內容或性質相衝突之物權併存時，二者效力均等", "先成立用益物權，再設定擔保物權時，該擔保物權不得對抗該已成立之用益物權", "先成立擔保物權，再設定用益物權時，該擔保物權人無論如何皆可主張塗銷該用益物權"], "exp": ["✗A. 定限物權對所有權有限制作用，所有權於定限物權存在時受其限制，效力並非優先。", "✗B. 內容或性質相衝突之物權併存時，先成立者優先，非效力均等。", "✓C（本題答案）. 先成立之用益物權，後設擔保物權時，擔保物權不得對抗該用益物權（實行時不得除去之）。", "✗D. 先成立擔保物權、再設用益物權者，須實行受影響時才得除去（§866 II），並非無論如何皆得塗銷。", "★物權優先性：時間在先者強；先用益後擔保→擔保打不過；先擔保後用益→擔保受影響時才能除去。"]}, {"year": 105, "num": 22, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "民法第 796 條規定，土地所有人建築房屋非因故意或重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋。假設甲僅有抽象輕過失，且乙知其越界未即提出異議，下列敘述何者正確？", "opts": ["甲將自己之廚廁建於鄰地所有人乙之部分土地上，甲可以主張廚廁亦屬於該條之「建築房屋」，不得拆除", "甲將房屋之全部建築在鄰地所有人乙之土地上，甲可以主張此符合「越界建築」之規定，不得拆除", "甲之立體停車場越界建築在鄰地所有人乙之土地上，則鄰地所有人乙，可以主張停車場並非是該條之「建築房屋」而請求拆除", "甲所建房屋整體之外，越界加建房屋，則鄰地所有人乙，可以請求拆除該加建之房屋"], "exp": ["✗A. §796以自己土地上建築物「逾越」地界為前提；將廚廁建在鄰地部分土地上，非自己土地上建物越界，不能援引免拆保護。", "✗B. 房屋全部建在乙地上，並非「越界」，不適用§796。", "✗C. 立體停車場屬其他工作物，依§796-2準用§796，乙不能以非房屋為由請求拆除。", "✓D（本題答案）. 越界加建房屋屬另一越界行為，不受§796保護，鄰地所有人得請求拆除。", "★越界建築保護範圍小：要「自己地上建物逾越地界」，且僅限已存在部分，另行加建不受保護；工作物則準用（§796-2）。"]}, {"year": 105, "num": 23, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有關地上權之敘述，下列何者正確？", "opts": ["地上權乃為債權", "地上權人必須支付地租", "地上權之存續期間，有法定最長 20 年之限制", "地上權人原則上得將其權利讓與他人或設定抵押權"], "exp": ["✗A. 依§832，普通地上權是以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權，屬物權（用益物權），不是債權，選項錯誤。", "✗B. 地租是否支付由當事人約定：§834 規定「無支付地租之約定」的地上權人得隨時拋棄權利，§835 則規範「有地租約定」的情形，可知地上權可為無償，並非必須支付地租，選項錯誤。", "✗C. 租賃契約期限不得逾20年（§449Ⅰ），且租用基地建築房屋者不適用（§449Ⅲ）；地上權並無最長20年的法定限制，選項錯誤。", "✓D. 依§838Ⅰ，地上權人得將其權利讓與他人或設定抵押權，但契約另有約定或另有習慣者不在此限，故原則上可讓與及抵押，正確。"]}, {"year": 105, "num": 24, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "民法規定，區分地上權人得與其設定之土地上下有使用、收益權利之人，約定相互間使用收益之限制。其約定未經土地所有人同意者，於使用收益權消滅時，土地所有人不受該約定之拘束。此之「其設定之土地上下有使用、收益權利之人」不包含下列何種？", "opts": ["普通地上權人", "不動產役權人", "農育權人", "典權人"], "exp": ["✓A. 普通地上權人為於同一土地上下有使用收益權利之人，得與區分地上權人約定相互限制（§841-2）。", "✓B. 不動產役權人同為使用土地之用益物權人，屬該條範圍。", "✓C. 農育權人使用收益他人土地，屬該條範圍。", "✗D（本題答案）. 典權人與區分地上權人約定使用收益之限制，不在該條所稱範圍，本題以典權人不屬該條所稱之人。", "★§841-2：區分地上權人可與同一土地上下的其他用益權人約定彼此限制；題目以典權人為「不包含」者。陷阱：把典權也當成可約定對象。"]}, {"year": 105, "num": 25, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "以他人不動產供自己不動產通行、汲水、採光、眺望、電信或以其他特定便宜之用者，稱為：", "opts": ["農育權", "抵押權", "不動產役權", "土地租賃權"], "exp": ["✗A. 農育權（§850-1）：以農作、牧畜、養殖、造林等為目的之用益物權，非本題情形。", "✗B. 抵押權：擔保物權，非用益物權，與本題使用他人不動產性質不同。", "✓C. §851，「不動產役權」：以他人不動產（供役地）供自己不動產（需役地）通行、汲水、採光、眺望、電信等便宜之用，正確。", "✗D. 土地租賃權：以支付租金為對價使用土地，不具物權性質，且與本題「供他人不動產使用」之役權結構不同。"]}, {"year": 105, "num": 26, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有關抵押權之特性，下列敘述何者錯誤？", "opts": ["當不動產所有人設定抵押權後，其抵押權不因該不動產之物權讓與而受影響", "抵押之不動產如經分割，其抵押權不因該不動產經分割或讓與一部而受影響", "以抵押權擔保之債權，其抵押權不因該債權經分割或讓與一部而受影響", "抵押權之獨立性在於其得由債權分離而為讓與，或為其他債權之擔保"], "exp": ["✓A. 不動產所有人設定抵押權後讓與不動產，抵押權不受影響（§867）。", "✓B. 抵押不動產經分割或讓與一部，抵押權不受影響（§868）。", "✓C. 抵押債權經分割或讓與一部，抵押權不受影響（§869 I）。", "✗D（本題答案）. 抵押權不得由債權分離而為讓與，或為其他債權之擔保（§870），故不具獨立性，而具從屬性。", "★抵押權＝不可分性（§868、§869）＋從屬性（§870）。陷阱：用「獨立性」誤導，其實抵押權不能離開債權單獨流通。"]}, {"year": 105, "num": 27, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "有關抵押權之實行，下列敘述何者正確？", "opts": ["土地所有人於設定抵押權後，在抵押之土地上營造建築物者，抵押權人於必要時，得於強制執行程序中聲請法院將其建築物與土地併付拍賣，對於建築物之價金，無優先受清償之權", "以建築物設定抵押權者，於法院拍賣抵押物時，其抵押物存在所必要之權利得讓與者，應併付拍賣。但抵押權人對於該權利賣得之價金，有優先受清償之權", "設定抵押權時，土地及其土地上之建築物，同屬一人所有，而僅以土地為抵押者，於抵押物拍賣時，得聲請併付拍賣，就土地賣得之價金，有優先受清償之權", "設定抵押權時，土地及其土地上之建築物，同屬一人所有，而以土地及建築物為抵押者，如經拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定，其地租法院須逕以判決定之"], "exp": ["✓A（本題答案）. 設定抵押權後營造建築物者，抵押權人得聲請併付拍賣，但對建築物價金無優先受償權（§877）。", "✗B. 以建築物設定抵押權者，併付拍賣之權利價金，抵押權人無優先受償權（§877-1）。", "✗C. 設定時建物已存在而僅抵押土地，不屬§877；就其拍定人各異時，另有法定地上權問題（§838-1）。", "✗D. 土地與建築物同屬一人而拍定人各異，視為已有地上權，地租先由當事人協議，協議不成再聲請法院定之（§838-1），非逕以判決定。", "★併付拍賣有三種：§877（後蓋）、§877-1（權利）、§838-1（法定地上權）；共同點：併付者對「建築物或權利價金」無優先權。"]}, {"year": 105, "num": 28, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "乙將其所有汽車為甲設定動產質權，以為其對甲借款債務之擔保。該車並已交付甲之占有。下列那種情形，甲之動產質權並不消滅？", "opts": ["丙仗義相助幫乙清償該債務", "甲將該車返還給乙", "甲喪失對該車之占有，於第 3 年始請求返還", "該車被盜後，隔年再讓與給善意第三人，甲對該第三人行使回復請求權時"], "exp": ["✗A. 債務經第三人清償而消滅，質權因從屬性亦消滅。", "✗B. 質權人返還質物於出質人，動產質權消滅（§897）。", "✗C. 質權人喪失占有，須於二年內請求返還（§898）；第三年才請求，質權已消滅。", "✓D（本題答案）. 質物被盜後，一年內質權人行使回復請求權，尚在二年期間內（§898），質權不消滅。", "★動產質權靠「占有」：返還給出質人就消滅（§897），喪失占有2年內不請求返還也消滅（§898）。陷阱：記成一年或三年。"]}, {"year": 105, "num": 29, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關惡意占有人與善意占有人，在損害賠償請求方面，下列敘述何者正確？", "opts": ["善意占有人就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人僅以滅失或毀損所受之利益為限，負賠償之責", "惡意占有人或無所有意思之占有人，就占有物之滅失或毀損，如係不可歸責於自己之事由所致者，對於回復請求人，負賠償之責", "善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還。但已就占有物取得孳息者，不得請求償還通常必要費用", "惡意占有人，因保存占有物所支出之必要費用，對於回復請求人，得依關於不當得利之規定，請求償還"], "exp": ["✗A. 善意占有人就滅失毀損，僅於可歸責於己時，才以所受利益為限賠償（§953）；不可歸責時無須賠償。", "✗B. 惡意占有人或無所有意思占有人，須因可歸責於己才負賠償責任（§954）；不可歸責時不負責。", "✓C（本題答案）. 善意占有人因保存占有物支出之必要費用得請求償還，但已取得孳息者不得請求通常必要費用（§955）。", "✗D. 惡意占有人因保存占有物之必要費用，依無因管理規定請求償還（§957），非不當得利。", "★占有人責任：善意＝可歸責才賠、賠現存利益（§953）；惡意＝可歸責才賠全額（§954）；惡意求償費用走無因管理（§957）。"]}, {"year": 105, "num": 30, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有關動產善意受讓要件之說明，下列敘述何者正確？", "opts": ["讓與人與受讓人須完成讓與動產之交付行為，此之交付不包含觀念交付", "受讓人出於善意且有抽象輕過失者，不受占有之保護", "讓與人必須是無權代理", "盜贓物為金錢時，被害人不得向善意占有人請求回復"], "exp": ["✗A. 交付包括簡易交付、指示交付等觀念交付，僅占有改定不可（§761、§948 II）。", "✗B. 受讓人只有明知或因重大過失不知無權時，才不受保護（§948 I但書）；抽象輕過失仍受保護。", "✗C. 善意受讓之讓與人須為無處分權人，不限無權代理。", "✓D（本題答案）. 盜贓或遺失物為金錢或無記名證券者，不得向善意占有人請求回復（§949 II）。", "★善意受讓：善意（無重大過失）＋受現實或觀念交付（非占有改定）＋讓與人為無權。例外：盜贓遺失物二年內可回復，金錢及無記名證券不可。"]}, {"year": 106, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於物權法定主義，下列敘述何者正確？", "opts": ["僅得依制定法創設物權", "僅得依特別法創設物權", "得依習慣法創設物權", "得依法理創設物權"], "exp": ["✗A. 物權不限於依「法律」創設，習慣亦得創設（§757）。", "✗B. 物權之創設不限特別法，亦非僅依特別法。", "✓C（本題答案）. 物權除依法律或習慣外，不得創設（§757）；故得依習慣創設物權。", "✗D. 法理非§757所定物權創設之依據。", "★§757：「法律」或「習慣」，缺一不可也不能多；法理、契約都不能創設物權。陷阱：誤以為法理可補充。"]}, {"year": 106, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於區分所有建築物，下列敘述何者正確？", "opts": ["全體專有部分所有人公同共有區分所有建築物之基地", "專有部分可共有或單獨所有", "全體專有部分所有人公同共有區分所有建築物之公同部分", "頂樓之專有部分所有人得占有區分所有建築物之屋頂，並為使用收益"], "exp": ["✗A. §799Ⅳ：區分所有人就共有部分及基地之「應有部分」依專有部分面積比例定之，既有應有部分比例即為「分別共有」，非公同共有（公同共有無應有部分）；§799Ⅴ另規定專有部分與其基地權利不得分離而移轉。", "✓B. §799Ⅰ、Ⅱ：專有部分在構造上及使用上可獨立、且得單獨為所有權之標的，區分所有人就專有部分有單獨所有權；既為所有權之客體，可由一人單獨所有，亦可依§817由數人按應有部分共有，故敘述正確。", "✗C. §799Ⅰ、Ⅱ、Ⅳ：共有部分指專有部分以外之其他部分及不屬於專有部分之附屬物，由區分所有人「共有」並依面積比例定應有部分，屬分別共有而非公同共有，選項說「公同共有」錯誤。", "✗D. §799Ⅱ、Ⅲ：屋頂若非專有部分，即屬共有部分，須「經規約之約定」才得供特定所有人使用（法律另有規定者除外）；頂樓所有人不能當然占有並使用收益屋頂，選項過於絕對，錯誤。"]}, {"year": 106, "num": 20, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙與丙 3 人共有 A 車，應有部分各 3 分之 1，約定 A 車由丙占有、使用及收益（分管契約）。占有 A 車之丙未經甲與乙同意，出賣 A 車於丁。試問，下列敘述何者正確？", "opts": ["丁若不知丙非單獨所有人，且就其不知無過失，則善意取得 A 車所有權", "丁若明知甲、乙與丙間之 A 車分管契約，則得占有使用收益 A 車", "甲與乙若未同意，丙與丁間之 A 車的買賣，效力未定", "丁對甲與乙乃有權占有"], "exp": ["✗A. 善意取得（§801、§948）須受讓人受讓動產之占有；本題丙僅「出賣」於丁，只有債權行為，題幹並未交付，丁尚不能取得所有權。", "✗B. §826-1 I 準用共有物分管約定之拘束力：明知分管契約者，反而受該約定拘束，不得因此取得逾越丙分管範圍的占有使用收益之權。", "✗C. 買賣契約屬債權行為，出賣他人（或他共有人）之物，契約仍有效（§348 I，出賣人負移轉義務）；效力未定（§118）僅限處分行為。", "✓D（本題答案）. 丙依分管契約對甲、乙為有權占有，丁自丙受讓占有並繼受分管契約之拘束（§826-1），故對甲、乙非無權占有。", "★買賣（債權行為）與處分（物權行為）要分開：出賣他人之物契約有效，無權處分才效力未定；動產善意取得一定要有「交付」。"]}, {"year": 106, "num": 21, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於地上權，下列敘述何者正確？", "opts": ["以公共建設為目的而成立之地上權，不得定有期限", "經設定地上權之土地，不得再設定抵押權", "同一土地上，得設定數則內容相同之地上權", "地上權亦得為時效取得之客體"], "exp": ["✗A. §833-1以「地上權未定有期限」為前提，可知地上權得定期、亦得不定期；本選項所稱「公共建設目的之地上權不得定期限」查無對應條文，錯誤。（§841-1為區分地上權＝在他人土地上下之一定空間範圍設定之地上權，與期限無關。）", "✗B. §860抵押權以不動產（土地）為標的，土地設有地上權後所有人仍可再設定抵押權；§866Ⅰ亦肯定同一不動產上抵押權與地上權得並存（先抵押後設地上權，抵押權不受影響），選項說「不得再設定抵押權」錯誤。", "✗C. 地上權為排他的用益物權，同一土地同一空間範圍不能同時存在內容相同、互相衝突的數個地上權；僅不同空間範圍（如區分地上權，§841-1）才可能並存，選項錯誤。", "✓D. §772：取得時效之規定（§769、§770）於所有權以外財產權之取得「準用」之，於已登記之不動產亦同；故地上權得為時效取得之客體（須以行使地上權之意思占有，並請求登記），正確。"]}, {"year": 106, "num": 22, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於公同共有，下列敘述何者正確？", "opts": ["公同關係存續中，各公同共有人，不得請求分割其公同共有物", "各公同共有人，得自由處分其應有部分", "公同關係，不以法律規定或習慣者為限", "各公同共有人之權利，僅及於公同共有物之應有部分"], "exp": ["✓A. §829：公同關係存續中，各公同共有人不得請求分割公同共有物（須公同關係消滅後才可分割），正確。", "✗B. §827Ⅲ：公同共有人之權利及於公同共有物之全部，並無「應有部分」可言；公同共有物之處分須經全體同意（§828Ⅲ），故不得自由處分應有部分，選項錯誤。", "✗C. §827Ⅱ：依法律行為成立之公同關係，以有法律規定或習慣者為限（如合夥§668、繼承§1151）；選項稱「不以法律規定或習慣為限」與條文相反，錯誤。", "✗D. §827Ⅲ：各公同共有人之權利，及於公同共有物之「全部」，而非僅及於應有部分，選項錯誤。"]}, {"year": 106, "num": 23, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於最高限額抵押權，下列敘述何者正確？", "opts": ["當事人得約定其所擔保原債權之應確定之期日", "最高限額抵押權所擔保之債權，不以由一定法律關係所生之權利為限", "最高限額抵押權所擔保之債權，不得將其分離而為讓與", "同一不動產上，僅得設定一項最高限額抵押權"], "exp": ["✓A. §881-4Ⅰ：最高限額抵押權得約定其所擔保原債權應確定之期日，並得於期日前約定變更（期日自設定時起不得逾三十年，§881-4Ⅱ），正確。", "✗B. §881-1Ⅱ：最高限額抵押權所擔保之債權，以由一定法律關係所生之債權或基於票據所生之權利為限；選項說「不以…為限」與條文相反，錯誤。", "✗C. §881-6Ⅰ：所擔保之債權於原債權確定前讓與他人者，最高限額抵押權不隨同移轉，可見債權可與抵押權分離而讓與（普通抵押權的§870不得分離，於最高限額抵押權不準用，§881-17），選項說「不得分離而為讓與」錯誤。", "✗D. §865：同一不動產設定數抵押權，其次序依登記先後定之；最高限額抵押權依§881-17準用普通抵押權規定（§865不在排除之列），故同一不動產可設定多項，選項錯誤。"]}, {"year": 106, "num": 24, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "關於占有之推定，下列敘述何者正確？", "opts": ["占有已登記之不動產而行使物權者，推定有該物權", "行使所有權以外之權利者，對使其占有之人，推定有該權利", "占有人推定其為他主占有", "占有人推定其為無過失占有"], "exp": ["✗A. §943 II：占有已登記之不動產而行使物權者，不適用占有權利推定，須以登記為準。", "✗B. §943 II：行使所有權以外之權利者，對使其占有之人，不適用權利推定（例如承租人對出租人不能推定有租賃權）。", "✗C. §944 I：占有人推定其為以所有之意思占有，而非他主占有。", "✓D（本題答案）. §944 I：占有人推定其為以所有之意思，善意、和平、公然及無過失占有。", "★§944 I 一口氣推定五件事：所有意思、善意、和平、公然、無過失；§943 的兩個例外（登記不動產、對讓與占有之人）是常考陷阱。"]}, {"year": 106, "num": 28, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "依民法規定，無權占有人返還占有物於回復請求人時，其得向回復請求人主張之權利及應負擔之義務，下列敘述何者正確？", "opts": ["善意占有人對於占有物支出之必要費用，於扣除其所收取孳息之餘額，皆得請求償還", "善意占有人對於占有物因改良占有物支出之有益費用，於扣除其所收取孳息之餘額，皆得請求償還", "惡意占有人對於占有物孳息之收取，推定其適法有此權利，無須返還", "惡意占有人，就占有物之滅失或毀損，縱使非因可歸責於自己之事由所致者，負損害賠償之責任"], "exp": ["✓A（本題答案）. §954：善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還；已就占有物取得孳息者，僅不得請求償還通常必要費用。", "✗B. §955：善意占有人因改良占有物所支出之有益費用，僅得於占有物現存之增加價值限度內請求償還，並非「皆得」請求。", "✗C. §958：惡意占有人負返還孳息之義務，其已消費者並負償還價金之義務，不得主張有收取權。", "✗D. §956：惡意占有人就占有物之滅失毀損，以因可歸責於自己之事由所致者，才負損害賠償責任，非因可歸責則不負責。", "★占有人費用口訣：必要費用（善意§954、惡意§957依無因管理）；有益費用只限現存增價額（§955）。損害賠償善意只負現存利益、惡意須有可歸責事由才賠（§956）。"]}, {"year": 106, "num": 29, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "依民法之規定，稱典權者，謂支付典價在他人之不動產為使用、收益，於他人不回贖時，取得該不動產所有權之權。下列關於典權之敘述，何者錯誤？", "opts": ["典權人對於典物因轉典所受之損害，負賠償責任", "典權之約定期限超過 15 年時，當事人間得附有到期不贖即作絕賣之條款", "典權人為典物支出有益費用，使典物增加價值，不論該增益之價值是否仍然存在，得請求出典人償還", "未定期限之典權，出典人得隨時以原典價回贖典物。但自出典後經過 30 年不回贖者，典權人即取得典物所有權"], "exp": ["✓A. §915 II：典權人對於典物因轉典或出租所受之損害，負賠償責任；但因不可抗力所致者不在此限。", "✓B. §913 II：典權約定期限不滿15年者，不得附有到期不贖即作絕賣之條款；超過15年者可以約定。", "✗C（本題答案）. §927 III：典權人支出有益費用使典物價值增加，出典人回贖時僅以「現存之增價額」為限償還，增益價值已不存在則不得請求。", "✓D. §924：未定期限之典權，出典人得隨時以原典價回贖；但出典後經過30年不回贖者，典權人取得典物所有權。", "★典權數字：期限上限30年（§912）、15年門檻（絕賣條款，§913）、未定期限典權出典後30年不回贖→典權人取得所有權（§924）；有益費用「現存增價額」是共通模式，不論「是否仍存在」就是陷阱。"]}, {"year": 106, "num": 37, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列有關抵押權之敘述，何者正確？", "opts": ["以抵押權擔保之債權請求權，雖經時效消滅，債權人仍得於時效完成後 5 年內實行抵押權", "以建築物為抵押者，其附加部分亦為抵押權效力所及，應一律併付拍賣", "抵押權人聲請查封抵押物，惟該執行名義嗣後經抗告法院裁定予以廢棄確定時，抵押人可依法請求財產上及非財產上損害賠償", "抵押權人於債權清償期屆滿後，為受清償，不得訂立契約取得抵押物之所有權"], "exp": ["✓A（本題答案）. §880：擔保債權之請求權雖因時效消滅，抵押權人於消滅時效完成後5年間不實行抵押權，抵押權才消滅，故5年內仍得實行。", "✗B. §862 III：附加於建築物而不具獨立性之部分，為效力所及；但附加部分為獨立之物且設定後附加者，僅準用§877「得」併付拍賣，並非一律併付。", "✗C. 抵押權章並無「執行名義被廢棄即當然可請求財產上及非財產上損害賠償」之規定；損害賠償須另有請求權基礎，非財產上損害尤須有特別規定。", "✗D. §873-1 I：債權清償期屆滿後，抵押權人與抵押人得訂立契約約定抵押物所有權移屬於抵押權人（清償期前之流抵約定則須登記始得對抗第三人）。", "★抵押權時效是「債權時效完成後再5年」；附加物要分成「有無獨立性」「設定前後」，併付拍賣是「得」不是「應」。"]}, {"year": 106, "num": 39, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列有關相鄰關係之敘述，何者錯誤？", "opts": ["聲響之侵入係偶發、輕微或依地方習慣認為相當者，彼此仍應於合理程度範圍內忍受，不得請求損害賠償", "相鄰關係重在不動產利用人間權利義務關係之調和，不以各該不動產相互緊鄰為必要", "土地所有人拆除舊建物時，致相鄰樓房發生傾斜、龜裂等，應依民法第 184 條第 2 項負損害賠償責任", "土地所有人非因故意或重大過失建築房屋逾越疆界者，鄰地所有人無論何時均得提出異議，請求移去或變更其建築物"], "exp": ["✓A. §793：氣響、振動等侵入，若屬輕微或按地方習慣認為相當者，鄰地所有人須忍受，無從禁止。", "✓B. 相鄰關係重在不動產利用之調和，不以不動產直接緊鄰為必要（實務見解）。", "✓C. §794：土地所有人開掘土地或為建築，不得使鄰地地基動搖或發生危險；違反屬保護他人之法律，依§184 II 負賠償責任。", "✗D（本題答案）. §796 I：非因故意或重大過失越界建築，鄰地所有人若知其越界而不即提出異議，就不得請求移去或變更；並非「無論何時」均得提出。", "★越界建築關鍵詞是「知悉越界、不即異議」；異議權是會喪失的，答案中出現「無論何時」多半是陷阱。"]}, {"year": 107, "num": 1, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲有 A、B、C 三台車，以總價 50 萬元出售給乙，其後甲將其對乙的債權贈與於丙，並讓與之。於乙將 50 萬元現金支付於丙後，甲將 A、B、C 三台車交付給乙並移轉所有權。試問甲、乙、丙間共有多少法律行為？", "opts": ["4", "5", "6", "7"], "exp": ["✗A. 只計4個漏算多項：買賣、債權贈與、債權讓與、現金給付、三車之物權移轉都各是法律行為。", "✗B. 5個仍不足，三台車各為獨立物，所有權移轉須各別讓與合意與交付。", "✗C. 6個仍少算一個，須逐項列舉（見D）。", "✓D（本題答案）. 買賣契約1＋贈與契約1＋債權讓與（準物權行為）1＋乙交付現金移轉所有權1＋A、B、C三車所有權移轉各1＝7個。", "★算法律行為：債權行為與物權（準物權）行為分開算，「一物一權」所以三台車的物權行為要算三個。"]}, {"year": 107, "num": 5, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲向乙貸款新臺幣 500 萬元，以其所有之 A 地及其上之 B 屋設定抵押權給乙作擔保。試問下列何者非屬抵押權效力所及？", "opts": ["B 屋抵押權設定後，甲於 B 屋上增建無獨立出入口之頂樓", "B 屋抵押權設定前，甲於 B 屋旁增建有獨立出入口之車庫", "A 地抵押權設定前，甲於 A 地栽種之果樹", "A 地扣押前，自甲於 A 地栽種果樹所分離之果實"], "exp": ["✗A. 屬效力所及，不是答案：§862 III，附加於建築物而不具獨立性之部分，為抵押權效力所及。", "✗B. 屬效力所及，不是答案：增建於設定當時已存在，隨設定時現狀成為抵押標的範圍；§862 III 之但書僅規範「設定後」附加之獨立物。", "✗C. 屬效力所及，不是答案：未分離之果樹為土地之成分，隨土地為抵押標的。", "✓D（本題答案）. §863：抵押權效力僅及扣押後抵押人就抵押物得收取之天然孳息；扣押前已分離之果實為獨立動產，不屬效力所及。", "★孳息的界線是「扣押」：扣押後的天然、法定孳息才受抵押權效力所及（§863、§864）；扣押前已分離的孳息不在內。"]}, {"year": 107, "num": 7, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關農育權之敘述，何者錯誤？", "opts": ["農育權係用益物權之一種", "農育權有支付地租約定者，農育權人因不可抗力致收益減少，得請求減免其地租", "農育權原則上係不定期限", "農育權人原則上得將其農育權讓與他人"], "exp": ["✓A. §850-1：農育權為以農作、森林、養殖、畜牧、種植竹木或保育為目的之用益物權。", "✓B. §850-4：有支付地租約定者，農育權人因不可抗力致收益減少或全無時，得請求減免地租。", "✗C（本題答案）. §850-1 Ⅱ：農育權期限不得逾20年，逾20年者縮短為20年（但以造林、保育為目的或法令另有規定者，不在此限），原則上是定有期限，並非原則上不定期限。（§850-2 只處理「未定期限」：除造林、保育目的外得隨時終止，應於6個月前通知。）", "✓D. §850-3：農育權人得將其權利讓與他人；但契約另有約定或另有習慣者，不在此限。", "★農育權是取代舊「永佃權」的用益物權，記得「有期限上限、可讓與、不可抗力得減免地租」三個特色。"]}, {"year": 107, "num": 8, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲乙丙丁共有 A 地，各有應有部分四分之一，甲乙丙三人未經丁之同意即將 A 地出賣給戊並為移轉登記，請問此物權移轉行為之效力為何？", "opts": ["有效", "無效", "未得共有人全體同意，係屬無權處分效力未定", "債權行為效力未定，物權移轉行為亦受其影響而效力未定"], "exp": ["✓A（本題答案）. 甲乙丙就各自應有部分有處分權（§819 I），其移轉登記就該部分有效，戊取得其應有部分；整體處分並非當然全部無效。", "✗B. 甲乙丙對自己之應有部分有處分權，故不能說移轉行為全部無效。", "✗C. 債權之買賣有效；其中就丁應有部分是否效力未定另論（見law_change），不能直接說整個移轉效力未定。", "✗D. 買賣為債權行為，不因出賣人無處分權而受影響（§348）；物權行為獨立有因，也不使債權行為效力未定。", "★現行法差異：通說與實務認為甲乙丙就丁之應有部分，因未得丁同意，依§819 II、§118屬無權處分效力未定（丁得承認）；本題官方答案採「有效」，應試以官方答案為準，實務見解可作補充。", "★共有分兩層：自己的應有部分可自由處分（§819 I），共有物全部的處分須全體同意（§819 II）。"]}, {"year": 107, "num": 18, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列敘述所涉及之物，何者不能單獨作為物權之客體？", "opts": ["醫療器材店所販售之大腿義肢", "已被安裝置入大廈內運作的客製化電梯", "區分所有建築物（如大廈）之專有部分", "足以遮風避雨的違章建築物"], "exp": ["✗A. 大腿義肢在店內販售、尚未裝置於人體時，為獨立之動產，可單獨作為物權客體。", "✓B. §811：動產因附合而為不動產之重要成分者，不動產所有人取得動產所有權；電梯裝入大廈後成為建物之重要成分，已喪失獨立性，不能單獨作為物權客體，正確。", "✗C. §799Ⅰ、Ⅱ：專有部分在構造上及使用上可獨立、且得單獨為所有權之標的，可單獨作為物權客體，選項排除。", "✗D. §66Ⅰ：土地及其定著物為不動產；違章建築足以遮風避雨，屬獨立之定著物（不動產），可為物權客體，僅因無法辦理保存登記，實務上另以「事實上處分權」處理（依實務見解），並非「動產」，選項排除。"]}, {"year": 107, "num": 19, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲於颱風過後翌日在河邊拾得從國家森林區漂流而下之珍貴紅檜木，乙自甲處竊取之，並將之以低價出售予不知情之丙。下列敘述，何者正確？", "opts": ["甲拾得珍貴漂流木，依民法第 802 條無主物先占規定，原始取得其所有權", "甲拾得珍貴漂流木，依民法第 810 條適用關於拾得遺失物規定，負通知及交存該物之義務，無法立即取得該物所有權", "因天災致國有珍貴林木漂流至國有林區外時，甲得自由撿拾取得所有權，不受民法關於拾得遺失物規定之限制", "甲因丙取得漂流木所有權而受損害時，得依關於不當得利之規定請求償還價額"], "exp": ["✗A. 漂流木來自國家森林，所有人（國家）可得確定，非無主物，不能依§802先占取得。", "✓B（本題答案）. §810：拾得漂流物或沉沒物者，適用關於拾得遺失物之規定，須通知、交存並待招領，不能立即取得所有權。", "✗C. §810 對漂流物並無國有林木之例外，故仍受遺失物拾得規定之限制。", "✗D. 甲非所有人，僅為拾得人，丙取得與否不致使甲受有喪失權利之損害，不具§816「因他人取得所有權而受損害」之要件。", "★漂流物、沉沒物＝準用遺失物（§810）；無主物先占只限「無人所有」，所有人明確（國家）者不適用。"]}, {"year": 107, "num": 20, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "下列何種權利，得為抵押權之標的物？", "opts": ["地上權", "不動產役權", "著作權", "租賃權"], "exp": ["✓A. §882，地上權「得為抵押權之標的物」（得以地上權設定抵押），正確。", "✗B. 不動產役權附隨於需役地，不得單獨讓與（§853），亦不得單獨抵押，選項排除。", "✗C. 著作權為無形財產權，民法物權編之抵押權客體以「不動產」及特定財產權（§882地上權、農育權、典權）為限，著作權不在其中，選項排除。", "✗D. 租賃權為債權，並非民法§882所列得設定抵押之權利，選項排除。"]}, {"year": 107, "num": 21, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列何者並非公同共有關係？", "opts": ["祭祀公業之派下員對不具法人資格的祭祀公業財產之關係", "合夥人對合夥財產之關係", "將一筆土地贈與且移轉登記予數人，受贈人對該贈與物之關係", "數人繼承遺產，於分割遺產前，各繼承人對於遺產全部之關係"], "exp": ["✗A. 祭祀公業（未法人化）之財產，由派下員公同共有，屬公同共有，選項排除。", "✗B. §668，合夥財產為合夥人全體公同共有，選項排除。", "✓C. 數人共同受贈某物並完成移轉登記，彼此之間並無公同關係（§827Ⅰ：公同共有須依法律規定、習慣或法律行為成立公同關係，如繼承、合夥）；依§817數人按其應有部分對一物有所有權者為共有人，故為「分別共有」，並非公同共有，正確為應選答案。★公同共有須有特定「公同關係」（繼承、合夥、祭祀公業等）為基礎；單純多人受贈移轉登記→分別共有。", "✗D. §1151，繼承人有數人時，在分割遺產前，各繼承人對遺產全部為公同共有，選項排除。"]}, {"year": 107, "num": 22, "ans": "D", "acc": "", "note": "", "src": "old", "stem": "下列關於物權規定之敘述，何者正確？", "opts": ["用益物權包括地上權、農育權、不動產役權、典權與質權", "違章建築物不能辦理移轉登記，故於建造完成時，建造人無法取得所有權", "基於公同關係而共有之房地，各共有人得就其應有部分設定抵押權", "稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權"], "exp": ["✗A. 用益物權：地上權、農育權、不動產役權、典權（§832以下）；「質權」屬「擔保物權」，並非用益物權，選項錯誤。", "✗B. 違章建築完工，建造人依「原始取得」取得事實上處分權（實務上的所有權），並非無法取得，選項錯誤。", "✗C. 公同共有（如遺產）各人「無應有部分」，不得就應有部分設定抵押，選項錯誤（分別共有才有應有部分可設抵押）。", "✓D. §881-1，最高限額抵押權係就「一定範圍內不特定債權」於最高限額內設定之抵押權，正確。"]}, {"year": 107, "num": 24, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於相鄰地必要通行權，下列敘述何者錯誤？", "opts": ["通行權人必須為土地所有人", "土地因與公路無適宜聯絡即可，無須毫無聯絡方法", "通行權人有必要時可以開設道路", "通行權人對於通行地因此所受之損害，應支付償金"], "exp": ["✗A（本題答案）. §800-1：必要通行權之規定，於地上權人、典權人、農育權人、不動產役權人、承租人等土地使用人準用，非限於所有人。", "✓B. §787 I：土地因與公路「無適宜之聯絡」致不能為通常使用即可，不須完全無通路。", "✓C. §788 I：有通行權人於必要時，得開設道路。", "✓D. §787 III、§788 I：通行權人對通行地所受損害，應支付償金。", "★必要通行權：重點是「無適宜聯絡」、損害最少處所、須支付償金；例外是因分割讓與造成不通時（§789）無須償金。"]}, {"year": 108, "num": 4, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依我國民法的規定，下列關於最高限額抵押權之敘述，何者錯誤？", "opts": ["稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權", "最高限額抵押權人就已確定之原債權，僅得於其約定之最高限額範圍內，行使其權利", "最高限額抵押權所擔保之原債權，未約定確定之期日者，抵押人或抵押權人得隨時請求確定其所擔保之原債權", "最高限額抵押權得約定其所擔保原債權應確定之期日，並得於確定之期日後，不待變更登記即變更之"], "exp": ["✓A. §881-1 I：最高限額抵押權為就一定範圍內之不特定債權，在最高限額內設定之抵押權。", "✓B. §881-2 I：就已確定之原債權，僅得於約定最高限額範圍內行使抵押權。", "✓C. §881-5 I：未約定確定期日者，抵押人或抵押權人得隨時請求確定原債權。", "✗D（本題答案）. §881-4 I：確定期日係得於「確定期日前」約定變更；期日屆至後原債權即確定，不得事後再變更，D所述順序顛倒。", "★最高限額抵押權的「確定」：期日可事前約定、事前變更（上限30年，§881-4）；沒約定期日則隨時請求確定（§881-5）。"]}, {"year": 108, "num": 7, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "依我國民法的規定，下列關於抵押權之敘述，何者錯誤？", "opts": ["稱普通抵押權者，謂債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權", "抵押權所擔保者為原債權、利息、遲延利息、違約金及實行抵押權之費用。但契約另有約定者，不在此限", "抵押權之效力，及於抵押物之從物而不及於從權利", "不動產所有人設定抵押權後，得將不動產讓與他人。但其抵押權不因此而受影響"], "exp": ["✓A. §860：普通抵押權為不移轉占有而就供擔保之不動產賣得價金優先受償之權。", "✓B. §861 I：擔保範圍含原債權、利息、遲延利息、違約金及實行費用，契約另有約定從其約定。", "✗C（本題答案）. §862 I：抵押權效力及於抵押物之從物與從權利，並非「不及從權利」。", "✓D. §867：設定抵押權後仍得讓與不動產，抵押權不受影響（追及效力）。", "★抵押權效力範圍：從物與從權利都及（§862 I），但設定前第三人就從物取得之權利不受影響（§862 II）。"]}, {"year": 108, "num": 8, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依我國民法，下列關於地上權之敘述，何者錯誤？", "opts": ["地上權設定後，因土地價值之昇降，依原定地租給付顯失公平者，當事人得請求法院增減之", "地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金", "地上權人得將其權利讓與他人或設定抵押權。但契約另有約定或另有習慣者，不在此限", "地上權人積欠地租達一年之總額，除另有習慣外，土地所有人得定相當期限催告地上權人支付地租"], "exp": ["✓A. §835-1 I：地上權設定後因土地價值昇降，依原定地租給付顯失公平者，當事人得請求法院增減之。", "✓B. §837：地上權人縱因不可抗力妨礙土地使用，不得請求免除或減少租金。", "✓C. §838 I：地上權人得讓與其權利或設定抵押權，但契約另有約定或習慣者不在此限。", "✗D（本題答案）. §836 I：積欠地租須「達二年之總額」，非一年；土地所有人並須先定相當期限催告，逾期不付始得終止。", "★地上權地租：二年總額＋定期催告才能終止；不可抗力不得減租（與農育權剛好相反）。"]}, {"year": 108, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "就下列甲、乙間之法律關係，何者為非經登記不生效力的情形？", "opts": ["甲、乙間締結買賣甲之不動產的契約時", "乙繼承被繼承人甲之不動產時", "甲以其土地供乙設定不動產役權時", "甲將其有抵押權擔保之債權讓與予乙時"], "exp": ["✗A. §345：當事人就標的物及價金互相同意，買賣契約即成立；不動產買賣之債權契約不以登記為生效要件（登記是物權變動的要件），選項排除。", "✗B. §1147、§759：繼承因被繼承人死亡而開始，繼承人於登記前即已取得不動產物權，僅處分時須先登記，故繼承不屬「非經登記不生效力」，選項排除。", "✓C. §851、§758Ⅰ：設定不動產役權是依法律行為設定不動產物權，非經登記不生效力（§758Ⅱ另要求應以書面為之），正確。", "✗D. §294、§297：債權讓與經通知債務人即對債務人生效，不以登記為要件；§295Ⅰ、§870規定從屬之抵押權隨債權移轉，是法律規定之當然移轉，不屬§758「依法律行為而取得」之登記生效要件，選項排除。"]}, {"year": 108, "num": 18, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙分別共有 A 地，各有二分之一應有部分。在甲乙未有任何協議之情形下，下列敘述，何者正確？", "opts": ["甲得以其應有部分供丙設定普通地上權", "甲不得將其應有部分出賣、並移轉登記予丁", "甲僅得於其應有部分種植作物", "甲得以其應有部分供戊設定普通抵押權"], "exp": ["✗A. §819Ⅰ只許共有人自由處分「應有部分」；地上權以使用土地本身為內容，是對共有物設定負擔，依§819Ⅱ須經共有人全體同意，甲、乙未有協議，甲不能單獨為之，選項錯誤。", "✗B. §819Ⅰ：各共有人得自由處分其應有部分，甲可將應有部分出賣並移轉登記予丁，選項說「不得」錯誤。", "✗C. §818：各共有人除契約另有約定外，按其應有部分對共有物之「全部」有使用收益之權，並非僅得於應有部分種植，選項錯誤。", "✓D. §819Ⅰ：各共有人得自由處分其應有部分，包含以應有部分設定抵押權，無須經他共有人同意，正確。"]}, {"year": 108, "num": 19, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "下列何者不得為抵押權之標的物？", "opts": ["不動產役權", "地上權", "農育權", "典權"], "exp": ["✓A. 不動產役權附隨於需役地，不能單獨讓與（§853），亦不能單獨設定抵押，「不得」為抵押標的，正確為應選答案。", "✗B. §882，地上權「得」為抵押標的，選項排除。", "✗C. §882，農育權「得」為抵押標的，選項排除。", "✗D. §882，典權「得」為抵押標的，選項排除。★記法：地上權、農育權、典權可抵押（§882）；不動產役權不可單獨抵押（附隨性）。"]}, {"year": 109, "num": 10, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？", "opts": ["因甲已將其土地出售乙，故所有權屬於乙", "因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙", "因甲尚未辦理土地所有權移轉登記於乙，故所有權仍屬於甲", "因該地尚未交付予乙占有，故所有權仍屬於甲"], "exp": ["✗A. 買賣僅生債權債務關係，不動產所有權變動須登記（§758 I）。", "✗B. 勝訴判決確認的是給付請求權，並非所有權移轉；須履行或強制執行辦理登記。", "✓C（本題答案）. §758 I：依法律行為取得不動產物權，非經登記不生效力；未登記所有權仍屬甲。", "✗D. 不動產物權之變動以登記為要件，與是否交付占有無關。", "★動產看交付（§761）、不動產看登記（§758）；買賣、判決命給付都不等於取得所有權。"]}, {"year": 109, "num": 13, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲乙丙共同出資購買一筆 A 土地，應有部分各三分之一。下列何種行為應經甲乙丙三個共有人全體同意，始為有效？", "opts": ["共有人之一將其應有部分移轉予第三人", "共有人之一將其應有部分設定抵押權予第三人", "共有人之一將 A 土地設定抵押權予第三人", "共有人之一將 A 土地設定有償之地上權予第三人"], "exp": ["✗A. §819 I：共有人得自由處分其應有部分，不須他共有人同意。", "✗B. 應有部分之設定抵押屬處分自己權利，§819 I 得自由為之。", "✓C（本題答案）. §819 II：共有物之處分、變更及設定負擔，應得共有人全體同意；將土地全部設定抵押權屬設定負擔。", "✗D. 本題官方未列為須全體同意之選項；惟設定地上權於學說上亦常視為設定負擔，見law_change。", "★現行法差異：設定地上權於通說多認屬§819 II 設定負擔，亦須全體同意；本題官方答案僅採C，應試以C為準。", "★記憶：「應有部分自由處分，共有物全部須全體同意」；管理行為多數決（§820）。"]}, {"year": 109, "num": 14, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列何者非屬公同共有之性質？", "opts": ["繼承人有數人時，其繼承取得之遺產", "合夥人之合夥財產", "屬於社團法人名下之財產", "屬於夫妻共同財產制下之財產"], "exp": ["✓A. 繼承人有數人時，遺產為繼承人公同共有（§1151）。", "✓B. 合夥財產為合夥人公同共有（§668）。", "✗C（本題答案）. 社團法人具有權利能力，財產為法人單獨所有，非公同共有。", "✓D. 夫妻共同財產制下之共同財產，屬夫妻公同共有（§1031）。", "★公同共有的來源是「法律規定或契約」的共同關係：繼承、合夥、共同財產制；法人是獨立主體，財產屬法人自己。"]}, {"year": 109, "num": 15, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以高價出售於惡意的丙，並交付之。下列敘述，何者正確？", "opts": ["甲因未滿二十歲，不得占有該木材", "乙不能取得名貴的佛像所有權", "乙將名貴的佛像讓與並交付予丙，係屬無權處分", "甲得向乙請求償還該木材的價額"], "exp": ["✗A. 占有為事實，未成年人亦得占有（§940 以事實上管領力為要件），不因年齡而不能占有。", "✗B. 乙加工後，加工價值顯逾材料價值時，加工物所有權歸加工人（§814），乙可取得佛像所有權。", "✗C. 乙已取得佛像所有權，其讓與並交付為有權處分，並非無權處分。", "✓D（本題答案）. 甲因乙加工而喪失材料所有權，得依§816、§179準用不當得利規定請求償還價額。", "★現行法差異：112.1.1起成年為18歲，題中「未滿二十歲」之敘述已不同；甲17歲仍未成年，且占有不以行為能力為要件，結論不變。", "★加工口訣：原則歸材料所有人，加工價值顯逾材料價值則歸加工人（§814），原所有人只剩償金請求（§816）。"]}, {"year": 109, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲、乙共有一筆 A 土地，面積 400 坪，應有部分各為二分之一。下列敘述，何者正確？", "opts": ["甲、乙對於共有之 A 土地，各有一個所有權，但其權利之行使應受應有部分之限制", "甲、乙對於共有之 A 土地，各有 200 坪所有權", "應有部分各為二分之一是甲、乙對於共有土地所有權之比例", "對於共有之 A 土地，甲、乙分別享有處分權及管理權"], "exp": ["✗A. 一物之上僅有一個所有權，共有是數人分享該所有權，並非各有一個所有權。", "✗B. 共有採分別共有，不是將土地實際切成各200坪；應有部分是比例，非特定面積。", "✓C（本題答案）. 應有部分是各共有人對於共有物所有權之比例（§817 I）。", "✗D. 處分權與管理權須依§819、§820分別以全體或多數決行使，並非各人分享不同權能。", "★應有部分＝抽象的「比例」，不是具體的「坪數」；各人對共有物全部有使用收益權（§818）。"]}, {"year": 109, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙、丁四人共有一筆 A 土地，應有部分各登記為四分之一，甲未經乙、丙、丁之同意，擅自占有 A 土地四分之三面積的土地，在其上興建一 B 屋。下列敘述，何者正確？", "opts": ["乙、丙、丁僅得分別請求甲返還占用 A 土地四分之一之土地", "乙、丙、丁得分別請求甲返還所占用 A 土地四分之三之土地", "乙、丙、丁應共同請求甲返還所占用 A 土地四分之一之土地", "乙、丙、丁應共同請求甲返還所占用 A 土地四分之三之土地"], "exp": ["✗A. §821：各共有人得就共有物之全部為本於所有權之請求，不以其應有部分為限。", "✓B（本題答案）. §821：回復共有物之請求，各共有人得為全體利益請求，故乙丙丁得分別請求甲返還所占用之四分之三。", "✗C. 各共有人得單獨請求，並不必共同為之。", "✗D. 同上，不須共同，且範圍為被占用之全部，不限於四分之一。", "★共有人對第三人或超額占有人：單獨即可請求，但返還須為共有人全體利益；回復共有物不用全體一起起訴。"]}, {"year": 109, "num": 18, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於地上權之敘述，何者正確？", "opts": ["地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金", "土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人", "地上權人須連續積欠地租達二年，土地所有人始得終止地上權", "地上權無支付地租之約定者，地上權人應於一年前通知土地所有人，始得拋棄其權利"], "exp": ["✗A. §837：不可抗力妨礙使用，地上權人仍不得請求免除或減少租金。", "✓B（本題答案）. §836-1：土地所有權讓與時，已預付之地租，非經登記不得對抗第三人。", "✗C. §836 I：積欠地租達二年之總額即得催告，並非須「連續」積欠；並須定期催告，不付才得終止。", "✗D. §834：無支付地租約定者，地上權人得隨時拋棄；有地租約定且定有期限才須一年前通知或支付未到期地租（§835）。", "★地上權：預付地租要登記才能對抗受讓人；無地租可隨時拋棄、有地租拋棄要事先通知或補付。"]}, {"year": 109, "num": 19, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？", "opts": ["抵押物扣押後，抵押人就抵押物所得收取之租金", "抵押之建築物存在所必要且性質上得讓與之權利", "設定抵押權後所增建附加於該建築物，而不具獨立性之部分", "抵押之建築物滅失後殘餘之鋼筋"], "exp": ["✗A. 屬效力所及：§863、§864，抵押物扣押後抵押人就抵押物得收取之法定孳息（租金），為抵押權效力所及。", "✓B（本題答案）. §877-1：建築物拍賣時，存在所必要且性質上得讓與之權利應併付拍賣，但抵押權人就該權利價金無優先受償權，故非抵押權效力所及。", "✗C. 屬效力所及：§862 III，附加於建築物而不具獨立性之部分，為效力所及。", "✗D. 屬效力所及：抵押物滅失後之殘餘物仍屬原抵押標的，抵押權不因而消滅（§881）。", "★併付拍賣不等於效力所及：§877（地上建物）與§877-1（建物所必要權利）都是「併付拍賣、但無優先受償」。"]}, {"year": 110, "num": 8, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？", "opts": ["二年", "五年", "十年", "十五年"], "exp": ["✗A. §861Ⅱ得優先受償之利息等以聲請執行前「五年」內發生者為限，並非二年（§861Ⅱ中「一年」是指違約金限一年或不及一年之定期給付，勿與利息期間混淆）。", "✓B. §861Ⅱ：得優先受償之利息、遲延利息、一年或不及一年定期給付之違約金債權，以抵押權人實行抵押權聲請強制執行前「五年」內發生及於強制執行程序中發生者為限，正確。", "✗C. 十年是§770善意無過失占有他人未登記不動產之取得時效期間，與抵押權利息優先受償期間無關。", "✗D. 十五年是§913典權絕賣條款之門檻（約定期限不滿十五年者不得附到期不贖即作絕賣之條款）與§125請求權時效期間，與§861Ⅱ無關。★§861Ⅱ重點：利息五年內（聲請執行前五年）方優先受償。"]}, {"year": 110, "num": 9, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "依現行民法規定，下列何者須經登記始生法律效力？", "opts": ["遺產之繼承", "土地買賣契約", "設定抵押權之物權行為", "夫妻就共同財產制之約定"], "exp": ["✗A. §759：繼承於登記前即已取得不動產物權，僅處分時須先登記，不以登記為取得要件，選項排除。", "✗B. §345：土地買賣「契約」為債權行為，當事人就標的物及價金互相同意即成立，不以登記為生效要件，選項排除。", "✓C. §758Ⅰ：不動產物權依法律行為而取得、設定、喪失及變更者，非經登記不生效力；設定抵押權之物權行為屬之，正確。", "✗D. §1007：夫妻財產制契約應以書面為之；§1008Ⅰ：非經登記不得對抗第三人，登記僅關乎對抗第三人，並非契約生效要件，選項排除。"]}, {"year": 110, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於果實自落於鄰地，而鄰地非為公用地者，下列何者正確？", "opts": ["視為遺失物", "視為無主物", "視為屬於鄰地所有人", "視為屬於原土地所有人"], "exp": ["✗A. 果實自落鄰地係法律擬制取得，非遺失物。", "✗B. 果實有所有人，非無主物。", "✓C（本題答案）. §798：果實自落於鄰地者，視為屬於鄰地所有人；但鄰地為公用地者，不在此限。", "✗D. 鄰地非公用地時不歸原土地所有人，而是擬制歸鄰地所有人。", "★自落的果實歸鄰地，這是「視為」，不能舉反證推翻；公用地是例外。"]}, {"year": 110, "num": 17, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權。下列何者正確？", "opts": ["二十年", "十五年", "十年", "五年"], "exp": ["✓A. §833-1：地上權未定有期限者，存續期間逾二十年或地上權成立之目的已不存在時，法院得因當事人之請求，斟酌各種情形定其存續期間或終止其地上權，正確。", "✗B. 十五年是§913典權絕賣條款之門檻（約定期限不滿十五年者，不得附有到期不贖即作絕賣之條款），與地上權無關。", "✗C. 十年是§770善意無過失占有他人未登記不動產之取得時效期間，非§833-1所定數字。", "✗D. 五年是§861Ⅱ抵押權利息優先受償之期間（聲請執行前五年內），非§833-1所定數字。★§833-1：未定期限地上權→逾20年，法院得介入。"]}, {"year": 110, "num": 18, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依民法第 880 條規定，實行抵押權期間以抵押權擔保之債權，其請求權已因時效而消滅，如抵押權人，於消滅時效完成後，幾年間不實行其抵押權者，其抵押權消滅？", "opts": ["一", "二", "三", "五"], "exp": ["✗A. §880 規定為5年，而非1年。", "✗B. §880 規定為5年，而非2年。", "✗C. §880 規定為5年，而非3年。", "✓D（本題答案）. §880：消滅時效完成後5年間不實行抵押權，抵押權消滅。", "★數字題：抵押權除斥期間「時效完成後5年」；別與請求權15年一般時效混淆。"]}, {"year": 111, "num": 5, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依現行民法之規定，下列何者非為不動產登記前，即能取得不動產之所有權？", "opts": ["不動產所有權因繼承而取得", "不動產所有權之時效取得", "不動產所有權因徵收而取得", "不動產所有權因強制執行而取得"], "exp": ["✗A. §759：因繼承於登記前已取得不動產物權（僅處分時須先登記），屬不登記即能取得，選項排除。", "✓B. §769、§770：占有人經二十年（或善意無過失十年）和平、公然、繼續占有未登記不動產，只是「得請求登記為所有人」，須登記後才取得所有權，故非「登記前即能取得」，為應選答案。", "✗C. §759：因徵收於登記前已取得不動產物權（處分時須先登記），屬不登記即能取得，選項排除。", "✗D. §759：因強制執行於登記前已取得不動產物權（處分時須先登記），屬不登記即能取得，選項排除。★§759列舉：繼承、強制執行、徵收、法院判決等非因法律行為取得，登記前已取得；時效取得則須先登記（§769、§770）。"]}, {"year": 111, "num": 14, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "關於共有不動產分管契約之敘述，下列何者正確？", "opts": ["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之", "分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之", "共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式", "分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"], "exp": ["✗A. 所列多數決為§820 I 管理決定之標準；分管契約屬共有人間之協議，須當事人合意，並非依此多數決訂定。", "✓B（本題答案）. §820 III：共有物管理因情事變更難以繼續時，法院得因任何共有人之聲請以裁定變更之。", "✗C. 分管無法達成協議時，法院無從替當事人訂立分管契約；欲終止共有關係須依§824 請求分割。", "✗D. §826-1 I：不動產分管約定須經登記，對受讓人才有效力；單純知悉不足，「知悉或可得而知」者限於動產共有。", "★分管契約是合意（要全體同意）、不動產須登記才拘束受讓人（§826-1）；法院只能裁定變更管理，不能代為訂約。"]}, {"year": 111, "num": 18, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將其 A 地設定地上權予乙，乙於 A 土地上興建 B 屋一棟。其後甲為貸款擔保而將其 A 地設定抵押權予丙，乙亦因其貸款擔保而將 B 屋設定抵押權予丁。下列敘述何者正確？", "opts": ["若丁實行抵押權拍賣 B 屋時，A 地所有權應併付拍賣之", "若丁實行抵押權拍賣 B 屋時，地上權應併付拍賣之", "若丙實行抵押權拍賣 A 地所有權時，B 屋應併付拍賣之", "若丙實行抵押權拍賣 A 地所有權時，地上權應併付拍賣之"], "exp": ["✗A. 地上權人乙拍賣B屋，A地所有權屬甲而非債務人，不會併付拍賣。", "✓B（本題答案）. §877-1：以建築物設定抵押權者，其存在所必要之地上權（得讓與者）應併付拍賣，但無優先受償權。", "✗C. §877 I 限於土地所有人於設定抵押後營造建物；B屋由地上權人乙營造且地上權在先，不適用。", "✗D. 地上權設定在抵押權之前，不受抵押權影響，拍賣A地所有權時地上權仍存在，不併付拍賣。", "★§877 是「土地抵押、同一所有人蓋屋」；§877-1 是「建物抵押、連同基地利用權」，主體不同勿混。"]}, {"year": 111, "num": 19, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲無權占有乙之土地種植果樹，其果實歸屬於何人？", "opts": ["果實在與果樹分離前或分離後，均屬於甲所有", "果實在與果樹分離前或分離後，均屬於乙所有", "果實在與果樹分離前屬於甲所有，分離後屬於乙所有", "果實在與果樹分離前屬於乙所有，分離後屬於甲所有"], "exp": ["✗A. 果樹栽種於乙之土地附合於土地（§811），不屬甲，分離前後都不屬甲。", "✓B（本題答案）. 果樹附合於土地屬乙（§811），果實分離前為原物之部分（§69 II），分離後由有收取權之乙取得（§70 I）。", "✗C. 分離前亦屬乙，非屬甲。", "✗D. 分離後亦由乙取得，非由甲取得。", "★無權占有人原則上沒有收取孳息權；惡意占有人還要返還孳息（§958）。"]}, {"year": 112, "num": 10, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？", "opts": ["現實交付", "占有改定", "簡易交付", "指示交付"], "exp": ["✗A. 現實交付（§761Ⅰ本文）：動產物權讓與須將動產交付，指實際移轉占有；本題受讓人已先占有動產，無須再實際交付。", "✗B. 占有改定（§761Ⅱ）：讓與人仍繼續占有動產，雙方訂契約使受讓人取得間接占有以代交付；本題是受讓人已占有，非讓與人繼續占有。", "✓C. 簡易交付（§761Ⅰ但書）：受讓人已占有動產者，於讓與合意時即生效力，無須再行交付，正確。", "✗D. 指示交付（§761Ⅲ）：動產由第三人占有時，讓與人以對第三人之返還請求權讓與受讓人以代交付；本題動產由受讓人自己占有，無第三人。"]}, {"year": 112, "num": 11, "ans": "C", "acc": "", "note": "§798但書文字為「公用地」，本題稱「公有用地」，依官方答案C按§798但書之公用地情形處理。", "src": "ai", "stem": "果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？", "opts": ["國家所有", "該果實為無主物，誰先占即取得所有", "為該果實之果樹所有權人所有", "由國家及果樹所有權人所共有"], "exp": ["✗A. §798但書：鄰地為公用地者，不適用「視為屬於鄰地所有人」之規定，但這只是排除例外，並未規定改歸國家所有；果實仍依一般規則歸收取權人，選項錯誤。", "✗B. 果實並非無主物：§70Ⅰ有收取天然孳息權利之人，取得與原物分離之孳息，果樹所有人即為收取權人，不適用先占，選項錯誤。", "✓C. §798本文：果實自落於鄰地者，視為屬於鄰地所有人，但書排除鄰地為公用地之情形；於公用地時回歸§70Ⅰ，由有收取天然孳息權利之人（果樹所有人）取得與原物分離之孳息，正確。", "✗D. 國家與果樹所有人之間並無共有之法律基礎，果實全部歸果樹所有人，選項錯誤。"]}, {"year": 112, "num": 12, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關遺失物拾得之敘述，下列何者錯誤？", "opts": ["遺失物自通知或最後招領日起逾 6 個月，未有受領人認領者，由拾得人取得遺失物之所有權", "受領權人認領遺失物時，拾得人原則上可以請求報酬，但不得超過遺失物價值之十分之三", "拾得人之報酬請求權因 6 個月不行使而消滅", "倘受領權人為低收入戶時，依法可以拒絕拾得人之報酬請求"], "exp": ["✓A. §807 I：遺失物自通知或最後招領之日起逾6個月未認領者，由拾得人取得所有權。", "✗B（本題答案）. §805 Ⅱ：拾得人得請求報酬，但不得超過其物財產上價值之十分之一（不是十分之三），故本選項錯誤。", "✓C. §805 IV：拾得人之報酬請求權，因6個月間不行使而消滅。", "✓D. §805-1：受領權人為低收入戶等法定情形時，得拒絕拾得人之報酬請求。", "★拾得遺失物：6個月、報酬上限十分之一、請求權6個月消滅，數字都是考點，「不得超過」之類的上限寫法可能暗藏陷阱。"]}, {"year": 112, "num": 13, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "抵押權人僅就土地設定抵押權，因債權已屆清償期而未清償而實行抵押權，下列何者錯誤？", "opts": ["於設定抵押權時，該土地上已存在房屋，實行抵押權之範圍僅限於土地本身，不得就房屋併付拍賣", "於設定抵押權時，土地上並無房屋，於實行抵押權時土地所有人已營造房屋，抵押權人必要時得聲請併付拍賣", "抵押權人聲請併付拍賣時，如房屋有存在他人之租賃權，抵押權人得聲請法院除去房屋之租賃權後再執行拍賣", "抵押權人將土地與房屋併付拍賣後，對於土地及房屋賣得之價金，抵押權人均有優先受償之權利"], "exp": ["✓A. §877 僅適用設定抵押權「後」營造之建築物；設定時已存在之房屋不得併付拍賣。", "✓B. §877 I：設定抵押權後營造房屋者，抵押權人於必要時得聲請併付拍賣。", "✓C. §877 II 準用§866 II：併付拍賣之房屋若有影響抵押權實行之租賃權，法院得除去之後再拍賣。", "✗D（本題答案）. §877 I 但書：對房屋價金無優先受償權，僅就土地賣得價金優先受償。", "★併付拍賣的陷阱：土地賣得價金優先，房屋價金沒有優先受償權（只能「附帶」賣）。"]}, {"year": 112, "num": 17, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "土地所有人非因故意或重大過失逾越地界建築房屋，而鄰地所有人知其越界，卻不即時提出異議者，下列何者正確？", "opts": ["鄰地所有人不為異議，即表示拋棄所有權利，不得再為主張", "土地所有人有權得請求購買越界之土地", "鄰地所有人得請求移去或變更越界建築之房屋，並請求支付償金", "鄰地所有人不得請求移去或變更越界建築之房屋，但得請求所受損害之償金"], "exp": ["✗A. §796Ⅰ：鄰地所有人知其越界而不即提出異議，效果僅是不得請求移去或變更房屋，並非拋棄一切權利；仍得請求償金（§796Ⅰ但書）及請求購買越界部分（§796Ⅱ），選項過於絕對，錯誤。", "✗B. §796Ⅱ：得請求以相當價額購買越界部分土地及因此形成之畸零地者，是「鄰地所有人」請求「土地所有人」，並非土地所有人有權請求，主體顛倒，錯誤。", "✗C. §796Ⅰ本文：鄰地所有人知其越界而不即提出異議，不得請求移去或變更其房屋，選項說「得請求移去或變更」錯誤。", "✓D. §796Ⅰ：鄰地所有人不得請求移去或變更房屋，但土地所有人對鄰地因此所受之損害應支付償金，故得請求所受損害之償金，正確。"]}, {"year": 112, "num": 18, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於民法區分所有建築物規定之敘述，下列何者錯誤？", "opts": ["專有部分與其所屬之共有部分及其基地之權利，得分離而為移轉或設定負擔", "就區分所有建築物共有部分及基地之應有部分，區分所有人得約定其比例", "專有部分得經其所有人之同意，依規約之約定供區分所有建築物之所有人共同使用", "共有部分除法律另有規定外，得經規約之約定供區分所有建築物之特定所有人使用"], "exp": ["✗A（本題答案）. §799 IV：專有部分與其所屬之共有部分及基地之權利，不得分離而為移轉或設定負擔。", "✓B. §799 II：共有部分及基地之應有部分，依專有部分面積比例，但另有約定者從其約定。", "✓C. §799-1：專有部分經所有人之同意，得依規約約定供區分所有建築物之所有人共同使用。", "✓D. §799-1：共有部分除法律另有規定外，得經規約約定供特定所有人使用。", "★區分所有最重要原則：專有、共有、基地「三位一體」，不可分離移轉。"]}, {"year": 112, "num": 20, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於善意占有人之敘述，下列何者錯誤？", "opts": ["善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人", "善意占有人自確知其無占有本權時     d.textContent=y+'年 ('+cnt+')';

  });
}

  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(isOK(q,L))o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  if(q.src==='ai'){ex.appendChild(mk('div','exp-line ainote','AI解析・條號已核對現行條文，考前以紙本六法為準'));}
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:isOK(q,ch)};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
