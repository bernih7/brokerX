<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>民法 B篇 債編總論 官方歷屆題 99–114</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;
  --green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;
  --chip-bg:#EDE7D8;--chip-text:#5C5248;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border);white-space:pre-wrap}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.selected{border-color:var(--blue);background:#EBF0F8}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.selected .opt-lbl{color:var(--blue)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0;color:#3A3430}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.ainote{font-size:10.5px;color:#A8A39B;font-style:normal;font-weight:400;padding:0 0 4px;line-height:1.5}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

const QS=[{"year": 99, "num": 6, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲醫師對於急症患者拒絕醫療，違反契約法上的何種義務？", "opts": ["次給付義務", "強制締約義務", "附隨義務", "從給付義務"], "exp": ["✗A. 次給付義務是原給付不能、遲延等時之替代或補充義務。", "✓B（本題答案）. 醫師不得無故拒絕急救，醫師法§21 課以救治義務，屬法定強制締約義務，違反即違反強制締約義務。", "✗C. 附隨義務（§148Ⅱ 誠信）是契約成立後之保護、通知等義務。", "✗D. 從給付義務是為使主給付完全實現所附之輔助義務。", "★ 契約尚未成立就先有義務：強制締約（醫師、公用事業）；契約已成立才談附隨、從給付。"]}, {"year": 99, "num": 9, "ans": "C", "acc": "", "note": "", "src": "old", "stem": "下列何種情形，係行使形成權之行為？", "opts": ["贈與人交付贈與物", "共有人出賣應有部分", "受僱人依法提出辭呈", "買賣雙方合意解除契約"], "exp": ["✗A. 交付贈與物係履行契約的「事實行為」，不是形成權行使（形成權是單方意思表示使法律關係產生/變更/消滅）。", "✗B. 共有人出賣應有部分屬正常財產處分行為（契約），並非單方形成法律關係。", "✓C. 受僱人提出辭呈是「單方意思表示使勞動契約消滅」，典型形成權行使，正確。形成權例：撤銷、解除、辭職、終止、抵銷。", "✗D. 合意解除需雙方同意，屬雙方行為（合意契約），非單方形成權。"]}, {"year": 99, "num": 11, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲欲購買乙所有房屋 1 棟，經數次與乙磋商之後，雙方同意該屋以 500 萬元成交，並詳細約定付款及交屋、移轉所有權方式，為求慎重並由丙丁 2 人擔任見證人，且言明為免日後爭議，應將約定內容寫成契約書。嗣後因乙反悔，結果連契約書都無法完成。則下列敘述何者正確？", "opts": ["因為無法完成契約書，因此甲乙之契約不成立", "甲如果已經給付部分價金，應以不當得利請求返還", "甲如能證明與乙已有訂立契約之合意，仍得請求乙履行", "甲為了使乙履行契約，應先請求乙完成契約書"], "exp": ["✗A. §166 約定須用書面者，未完成前僅推定契約不成立，並非當然不成立。", "✗B. 甲能證明契約已成立，則價金給付有債之原因，不是不當得利。", "✓C（本題答案）. §166 推定可被推翻，甲如證明雙方已達成合意，仍得請求履行。", "✗D. 買賣為諾成契約（§345），無須先完成契約書才可請求履行。", "★ §166：約定方式→推定未成立，可舉反證推翻。陷阱：把「推定」當成「確定」。"]}, {"year": 99, "num": 14, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲受僱於乙客運公司擔任公車司機，某日在依照路線載客途中，因過失撞傷路人丙。下列敘述何者錯誤？", "opts": ["丙可以只向甲請求賠償", "丙可以只向乙請求賠償", "乙賠償之後，原則上可以向甲主張求償", "甲乙對丙負不真正連帶債務之關係"], "exp": ["✓A. 受害人丙得依§184Ⅰ 單獨請求甲賠償。", "✓B. §188Ⅰ 僱用人乙與受僱人甲連帶負責，丙得單向乙請求（§273）。", "✓C. §188Ⅲ 僱用人賠償後對受僱人有求償權。", "✗D（本題答案）. §188Ⅰ 明文規定僱用人與行為人「連帶」負賠償責任，為連帶債務，非不真正連帶。", "★ 僱用人責任（§188）：連帶；賠償後可向受僱人求償（§188Ⅲ）。陷阱：看到僱用人責任就想到「不真正連帶」。"]}, {"year": 99, "num": 15, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲至乙家具行購買 1 組展示中之沙發，約定於隔日由乙送貨至甲指定之處所。乙之員工丙送貨途中，因精神不濟發生翻車事故，沙發全毀，以下敘述何者錯誤？", "opts": ["雖然沙發係因丙之過失而毀損，乙仍須負債務不履行之責任", "因為尚有另外 1 組圖案類似之沙發，甲可請求乙交付該組沙發替代", "乙可以向丙主張沙發毀損之損害賠償", "甲必須解除契約之後，才能免除給付價金之債務"], "exp": ["✓A. §224 債務人之使用人（丙）之過失視為債務人之過失，乙須負債務不履行責任。", "✗B（本題答案）. 展示中的特定沙發為特定物買賣，標的毀損則給付不能，不得請求交付另一組類似沙發替代。", "✓C. 沙發尚未交付，所有權屬乙，乙得對丙依侵權或僱傭契約請求賠償。", "✓D. 給付不能可歸責於債務人，甲之價金債務不當然消滅，須依§256 解除契約後才免付價金（§259 回復原狀）。", "★ 特定物毀損＝給付不能；種類物才可以替代。§224：使用人過失＝自己的過失。陷阱：「類似的另一組」不是同一個特定物。"]}, {"year": 99, "num": 16, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲使用乙銀行發行之信用卡消費後，共計有 15 萬元卡債無法返還，乙銀行在未知會甲之情形下，將該筆債權出售給丙。下列敘述何者錯誤？", "opts": ["因為甲未受到任何通知，故乙丙之讓與行為無效", "甲乙之間如果有設定擔保，該擔保亦隨同由丙取得", "甲乙之間如果有特約約定該筆債權不得讓與，丙公司如屬善意時，其讓與仍然有效", "甲欲清償債務時，經第 3 人告知，才知乙已將債權讓與丙，乃主動向丙清償債務，此屬有效之行為"], "exp": ["✗A（本題答案）. 債權讓與契約不須債務人同意或通知（§294Ⅰ）；通知只影響對債務人之效力（§297）。", "✓B. §295Ⅰ 債權讓與時其擔保及其他從屬權利隨同移轉。", "✓C. §294Ⅱ 不得讓與之特約不得對抗善意第三人，丙善意，讓與有效。", "✓D. 債務人知悉讓與後自行向受讓人清償，是承認讓與，有效。", "★ 債權讓與：契約有效，通知只是「對債務人生效」要件（§297）。陷阱：「未通知＝讓與無效」。"]}, {"year": 99, "num": 18, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "銀行對於肉眼顯能辨識之票據印文真偽，而未為辨識，其責任係屬何種性質之責任？", "opts": ["屬重大過失之責任", "屬抽象輕過失之責任", "屬具體輕過失之責任", "無過失責任"], "exp": ["✓A（本題答案）. 肉眼顯能辨識而未辨識，顯然欠缺普通人之注意，屬重大過失。", "✗B. 抽象輕過失指欠缺善良管理人注意（§220），本題程度更重。", "✗C. 具體輕過失指欠缺與處理自己事務同一之注意，本題非此類。", "✗D. 無過失責任須法律明文規定，本題為過失責任。", "★ 過失三級：重大過失（顯然欠缺普通人注意）＞抽象輕過失（善良管理人）＞具體輕過失（與處理自己事務同）。"]}, {"year": 99, "num": 19, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "基於下列何種原因而取得利益，應依關於不當得利之規定，返還其所受利益？", "opts": ["因確定判決取得利益", "因添附取得利益", "因消滅時效取得利益", "因取得時效取得利益"], "exp": ["✗A. 確定判決具既判力，取得利益有法律上原因，不成立不當得利。", "✓B（本題答案）. §816 因添附（§811至§815）喪失權利而受損害者，得依不當得利規定請求償金。", "✗C. §144Ⅰ 時效完成僅生拒絕給付抗辯權，債務人所受利益有法律上原因。", "✗D. 取得時效完成取得權利，屬原始取得（§768），有法律上原因，非不當得利。", "★ 不當得利要件：無法律上原因。添附之後的償金是§816 明文轉引不當得利；時效、判決則有法律上原因。"]}, {"year": 99, "num": 29, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "債務人甲在其 3000 萬元之抵押土地上，有乙、丙、丁第一、第二及第三順位依次序為 1000 萬元、2000萬元及 800 萬元之普通抵押權，乙為丁抵押權人之利益，而將其第一順位讓與丁。此稱之為：", "opts": ["次序之絕對拋棄", "次序之相對拋棄", "次序之讓與", "次序之互易"], "exp": ["✗A. 絕對拋棄無須指定特定人，後次序依序遞升，與「為丁之利益」不同。", "✗B. 相對拋棄是乙與丁同順位，按債權額比例分配，非丁取得第一順位。", "✓C（本題答案）. 次序之讓與：先次序抵押權人（乙）為後次序（丁）之利益，讓與優先受償之地位，丁在乙債權額範圍內優先受償。", "✗D. 互易是兩個抵押權人相互對調次序，本題為單向讓與。", "★ 次序變動四型：絕對拋棄（遞升）、相對拋棄（同順位按比例）、讓與（單向，優先範圍以讓與人債權額）、互易（兩者對調）。"]}, {"year": 100, "num": 3, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "下列何種契約之屬性為無償契約？", "opts": ["使用借貸", "僱傭契約", "承攬契約", "居間契約"], "exp": ["✓A. 使用借貸（§464）：借用人「無償」使用後返還，為無償契約，正確。", "✗B. 僱傭契約以給付報酬為要件（§482），為有償雙務契約。", "✗C. 承攬契約定作人須給付報酬（§490），為有償契約。", "✗D. 居間人促成契約後得請求報酬（§565），為有償契約。"]}, {"year": 100, "num": 5, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲向乙借了 50 萬，約定利息為週年利率百分之 30 計算，下列敘述何者正確？", "opts": ["約定之利率過高，該消費借貸無效", "約定之利率過高，超過法定週年利率 20%部分之利息無效", "約定之利率過高，超過法定週年利率 20%部分之利息，乙無請求權", "依契約自由原則，該利率之約定有效，乙得向甲請求利息之支付"], "exp": ["✗A. 利率過高不影響消費借貸（§474）效力，不會導致借貸無效。", "✗B. 考試當年§205 效果為「債權人對超過部分無請求權」，非「利息無效」。", "✓C（本題答案）. 考試當年§205 約定利率超過週年20%者，債權人對超過部分之利息無請求權。", "✗D. 契約自由受§205 限制，超過上限部分無請求權，並非全部有效。", "★現行法差異：§205 已修正，上限由年利率20%降為16%，效果改為「超過部分之約定無效」；現行法下30%仍超限，但條文數字與效果與選項敘述不同。", "★ §205 利息上限＋效果要記好：上限數字與效果（無請求權 vs 無效）各有版本，依現行法務必改以最新條文為準。"]}, {"year": 100, "num": 6, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲向乙買一台液晶電視，約定一手交錢一手交貨，於乙未交付液晶電視前，當乙向甲請求價金之支付時，甲得主張：", "opts": ["撤銷權", "解除權", "不安抗辯權", "同時履行抗辯權"], "exp": ["✗A. 撤銷權須有意思表示瑕疵等事由，本題無。", "✗B. 解除權須有法定或約定解除事由，本題無。", "✗C. 不安抗辯權（§265）適用於有先為給付義務者，本題為同時交換。", "✓D（本題答案）. §264Ⅰ 因契約互負債務者，於他方未為對待給付前得拒絕自己之給付。", "★ 同時履行（§264）＝一手交錢一手交貨；不安抗辯（§265）＝有先給付義務、對方財產顯形減少。"]}, {"year": 100, "num": 7, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "甲向大大車行買一台中古 A 車給其子乙，並約定其子乙得直接向該車行請求交付 A 車，則甲與大大車行間之契約屬於：", "opts": ["附負擔之法律行為", "第三人利益契約", "債權讓與行為", "第三人保證契約"], "exp": ["✗A. 附負擔是在法律行為（如贈與）中附加受益人須履行某義務，本題並無對乙的附加義務要求。", "✓B. 第三人利益契約（§269）：契約約定向第三人（乙）為給付者，第三人得直接請求債務人履行，本題完全符合，甲（要約人）、車行（承諾人/債務人）、乙（受益第三人），正確。", "✗C. 債權讓與是甲將既有債權移轉給乙，本題甲是新設第三人受益條款，並非讓與既有債權。", "✗D. 保證是保證人擔保他人債務，此處乙並非在保證甲的債務，選項性質不符。"]}, {"year": 100, "num": 11, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列敘述，何者正確？", "opts": ["契約之要約人，因要約而受拘束，不可預先聲明不受拘束", "貨物標定賣價陳列者，視為要約之引誘", "對話為要約者，非立時承諾，即失其拘束力，因此不得定承諾期限", "將要約變更而承諾者，視為拒絕原要約而為新要約"], "exp": ["✗A. §154Ⅰ但書：要約當時預先聲明不受拘束者，不受要約拘束，故要約人「可以」預先聲明不受拘束；選項說「不可」，錯誤。", "✗B. 依§154Ⅱ，貨物標定賣價陳列者「視為要約」（非要約引誘），此為考試常見混淆點。", "✗C. §156：對話為要約者，非立時承諾，即失其拘束力；這是未另定承諾期限時的規則，並未禁止當事人另定承諾期限，選項說「不得定承諾期限」，錯誤。", "✓D. §160Ⅱ：將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約，正確，此為「非正式承諾→反要約」之考點。"]}, {"year": 100, "num": 13, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "下列關於不當得利之敘述，何者正確？", "opts": ["無法律上之原因而受利益，致他人受損害者，應返還其利益", "因清償債務而為給付，於給付時明知無給付之義務者，得請求返還", "不當得利之受領人，只須返還其所受之利益，如本於該利益更有所取得者，無須返還", "不當得利之受領人，不知無法律上之原因，縱其所受之利益已不存在者，仍應負返還之責任"], "exp": ["✓A（本題答案）. §179 無法律上之原因而受利益致他人受損害者，應返還其利益。", "✗B. §180① 給付時明知無給付義務者，不得請求返還。", "✗C. §181 受領人除返還所受利益外，本於該利益更有所取得者並應返還。", "✗D. §182Ⅰ 受領人不知無法律上原因，所受利益已不存在者，免負返還責任。", "★ 不當得利返還範圍：善意＝現存利益（§182Ⅰ），惡意＝全部加利息（§182Ⅱ）。§180 四款不得請求返還：明知無義務、履行道德義務、期限前清償、不法原因。"]}, {"year": 100, "num": 18, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲到乙所開設之賭場賭博，賭輸了 10 萬元，下列敘述何者正確？", "opts": ["賭博為甲乙間債務發生之原因關係，所以甲應支付乙 10 萬", "如甲已經付款給乙，則甲得主張賭博行為違反公序良俗無效，依不當得利向乙請求返還", "如甲已經付款給乙，雖甲得主張賭博行為違反公序良俗無效，但甲之給付為出於不法原因之給付，所以不得向乙請求返還", "如甲已經付款給乙，甲得主張侵權行為，向乙請求損害賠償"], "exp": ["✗A. 賭博行為違反公序良俗而無效（§72），賭債無請求權。", "✗B. 雖賭博無效，給付人若為不法原因給付，不得依不當得利請求返還（§180④）。", "✓C（本題答案）. §180④ 因不法原因而為給付者不得請求返還，賭債已付不能請求返還。", "✗D. 甲自願賭博並給付，不構成乙之侵權行為；亦不應迂迴規避§180④。", "★ 公序良俗無效＋不法原因給付不得返還＝「雙重不保護」。陷阱：以為無效就一定能要回。"]}, {"year": 101, "num": 3, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲當面向乙表示願以一千萬元出售甲所有之 A 房屋予乙，乙當場未置可否，經三日後乙回覆甲願以一千萬元購買 A 屋。就甲、乙各自之意思表示，下列敘述何者最正確？", "opts": ["甲之意思表示為要約，乙之意思表示為承諾", "甲之意思表示為要約引誘，乙之意思表示為要約", "甲之意思表示為要約，乙之意思表示為要約引誘", "甲之意思表示為要約，乙之意思表示為新要約"], "exp": ["✗A. 乙三日後才回覆，已逾對話要約應即時承諾之期間（§156），不是有效承諾。", "✗B. 甲所為特定價格與標的之表示是要約，並非要約引誘。", "✗C. 乙之回覆不是要約引誘，而是遲到之承諾，視為新要約。", "✓D（本題答案）. §156 對話要約須立時承諾，否則失效；§160Ⅰ 遲到之承諾視為新要約。", "★ 對話要約→當場不承諾即失效；遲到的承諾＝新要約（§160Ⅰ）。陷阱：誤把遲到承諾當有效承諾。"]}, {"year": 101, "num": 4, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列有關加害人應負損害賠償責任之敘述，何者最正確？", "opts": ["受僱人甲因執行職務不法侵害第三人乙之權利時，原則上僅由甲對乙負損害賠償責任", "限制行為能力人甲不法侵害第三人乙之權利時，即使甲於行為時有識別能力，原則上由甲及其法定代理人對乙連帶負損害賠償責任", "法人甲之董事丙因執行職務對第三人乙造成損害時，因甲無實體存在，故僅由丙單獨對乙負損害賠償責任", "甲、丙、丁三人共謀聯手圍毆乙，實際下手時，如丁僅在一旁叫囂助陣，則丁不須對乙因被毆所生損害負賠償責任"], "exp": ["✗A. §188Ⅰ 僱用人與受僱人連帶負責，並非原則上僅受僱人負責。", "✓B（本題答案）. §187Ⅰ 限制行為能力人行為時有識別能力者，與其法定代理人連帶負損害賠償責任。", "✗C. §28 法人與董事連帶負責，並非僅董事單獨負責。", "✗D. §185Ⅱ 幫助人視為共同行為人，丁叫囂助陣屬幫助，仍須連帶負責。", "★ 侵權連帶口訣：法人董事（§28）、僱用人（§188）、法定代理人（§187）、共同行為人（§185）。"]}, {"year": 101, "num": 7, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲與乙約定，甲不得將其對乙之非不得讓與的 A 金錢債權讓與予第三人。事後，甲卻違反與乙之約定，將 A 債權讓與予丙。就此情形，下列敘述何者最正確？", "opts": ["甲、乙之約定違反誠信原則，無效。甲、丙間之讓與契約有效", "甲、乙之約定有效。但如丙為善意第三人，甲、乙之約定不得對抗丙", "無論債權人如何變動，債務人乙皆須清償，故甲、乙間之約定無效", "甲、乙之約定效力未定。甲、丙之讓與契約無效"], "exp": ["✗A. 債權禁止讓與之特約依契約自由有效，不因違反誠信原則而無效。", "✓B（本題答案）. §294Ⅰ③、Ⅱ 禁止讓與特約有效，但不得對抗善意第三人，丙善意則讓與有效。", "✗C. 債權之讓與禁止約定有效，不可因債務人最終都要清償就否定其效力。", "✗D. 約定並非效力未定，且丙善意時讓與契約有效。", "★ 禁止讓與特約：債權人與債務人間有效，但不能對抗善意第三人。陷阱：以為約定違反就當然無效。"]}, {"year": 101, "num": 9, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲借款十萬元予乙，約定於半年後清償。下列敘述何者最正確？", "opts": ["對於乙之期前清償，甲不得為反對之意思表示", "甲請求乙為期前清償時，乙不得拒絕", "乙之期前清償縱經甲受領，乙仍得以其期限利益受損，向甲主張不當得利返還請求權", "乙之期前清償如經甲受領，則乙不得再向甲主張不當得利返還請求權"], "exp": ["✗A. §316：期前清償須「無反對之意思表示」，甲可有反對（如約定不得期前清償），並非不得為反對表示。", "✗B. §316：定有清償期者，債權人不得於期前請求清償，乙得拒絕。", "✗C. §180(2)：債務人於未到期之債務因清償而為給付者，不得請求返還；期限利益屬債務人，提前清償即視為拋棄，不能主張利益受損而請求不當得利。", "✓D（本題答案）. §180(2)：未到期債務因清償而為給付，債權人受領後，債務人不得再依不當得利請求返還。", "★ 期限利益屬債務人，他可提前還，但還了就收不回；債權人不能反過來要求提前還。陷阱：§180 的不得請求返還類型（道德義務、未到期清償、明知無義務、不法原因）要分清楚。"]}, {"year": 101, "num": 11, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙間約定由甲幫乙為訂約之媒介，並由乙給付報酬予甲。甲、乙所定契約之名稱為下列何者？", "opts": ["承攬契約", "代辦契約", "僱傭契約", "居間契約"], "exp": ["✗A. 承攬（§490）：一方為他方完成一定之工作，他方俟工作完成給付報酬；重在完成「工作結果」，而非替人報告訂約機會或媒介訂約，故非本題契約。", "✗B. 「代辦」指代辦商（§558 Ⅰ）：非經理人而受商號之委託，在一定處所或區域內，以該商號之名義辦理其事務之全部或一部之人；重在以商號名義辦理事務，並非為他人報告訂約機會或媒介訂約，故不是本題。", "✗C. 僱傭（§482）：一方於一定或不定期限內為他方服勞務，他方給付報酬；重在提供勞務本身，與居間「促成他人訂約」不同。", "✓D. 居間（§565）：一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約；本題甲為乙媒介訂約、乙給付報酬，正是居間契約，正確。"]}, {"year": 101, "num": 19, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲以其對乙尚未屆清償期之金錢債權設定權利質權於丙，以擔保丙對甲之金錢債權，並於設定時即通知乙。下列敘述何者最正確？", "opts": ["該權利質權之設定，未得乙之同意，無效", "乙得以於受通知後始對甲取得之金錢債權，對丙主張抵銷", "乙得以於受通知時對甲之已屆清償期之金錢債權，對丙主張抵銷", "該權利質權之設定，須由甲、丙共同通知乙，始對乙生效力"], "exp": ["✗A. 權利質權設定準用債權讓與規定（§902），讓與債權無須債務人同意，只需通知（§297），故設定並非無效。", "✗B. §299 II：只有債務人「受通知時」已對讓與人取得之債權才可抵銷，受通知後才取得者不得主張。", "✓C（本題答案）. §902、§299 II：乙受通知時對甲已有債權，且其清償期先於或同時於被質押債權屆至，得對質權人丙主張抵銷。", "✗D. §297 I：通知由讓與人或受讓人任一方為之即可（§902 準用），不必甲、丙共同通知。", "★ 債權質權借用債權讓與的規則：通知債務人才對他生效；債務人的抵銷抗辯以「受通知時已存在」且清償期不晚於被讓與債權者為限。陷阱：通知後才取得的債權不能抵銷。"]}, {"year": 101, "num": 23, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲被酒醉駕車之乙撞傷住院，甲所駕駛之汽車亦因此受損，下列敘述何者最正確？", "opts": ["甲對於汽車所受之損害，僅得請求乙將汽車修復原狀，不得主張修復原狀所必要之費用以代替回復原狀", "甲受傷住院，得因人格權受侵害對乙請求非財產上之損害賠償，其請求之數額限於甲實際所受之損害", "甲對於汽車所受之損害，得對加害人乙請求汽車因毀損所減少之數額", "被害人甲若對第三人負有法定扶養義務者，加害人乙對該第三人亦應負損害賠償責任"], "exp": ["✗A. §213 III：負損害賠償責任者，債權人得請求支付回復原狀所必要之費用以代回復原狀，不限於請求修復原狀。", "✗B. §195 I：非財產上損害（慰撫金）依被害人身分地位、痛苦程度等酌定相當金額，並非限於實際所受損害數額。", "✓C（本題答案）. §196：不法毀損他人之物者，被害人得請求賠償其物因毀損所減少之價額。", "✗D. §192 II：對第三人負法定扶養義務者，加害人對該第三人負賠償責任，限於被害人「致死」之情形；本題甲僅受傷。", "★ 物被毀損：可請求減少價額（§196）或修復費用代回復原狀（§213 III）。陷阱：§192 II 扶養損害只有被害人死亡才適用，受傷不算。"]}, {"year": 101, "num": 28, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將其對乙之債權讓與給丙，下列敘述何者最正確？", "opts": ["甲若未將債權讓與之事由通知乙，則甲與丙間之債權讓與無效", "甲應將證明債權之文件，交付受讓人丙", "債權讓與為負擔行為", "債權讓與時，該債權擔保之最高限額抵押權亦隨同移轉"], "exp": ["✗A. §297 通知僅為對債務人生效之要件，讓與人與受讓人間讓與合意即生效力，未通知並非無效。", "✓B（本題答案）. §296：讓與人應將證明債權之文件交付受讓人，並應告以主張該債權所必要之一切情形。", "✗C. 債權讓與使債權移轉，直接變動權利，為處分行為（準物權行為），並非負擔行為。", "✗D. §295 雖規定從屬權利隨同移轉，但最高限額抵押權於原債權確定前，擔保債權之讓與不隨同移轉（§881-6）。", "★ 債權讓與＝處分行為，合意即生效；通知只是對債務人的對抗要件。陷阱：最高限額抵押權在確定前不隨債權移轉，與普通抵押權不同。"]}, {"year": 101, "num": 30, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "乙家中的寵物飼料已吃完，向鄰居甲借用一包飼料供家中寵物食用，並約定隔日還給甲一包相同的新飼料，下列敘述何者最正確？", "opts": ["甲與乙之間成立使用借貸", "甲與乙之借貸契約於雙方意思合致時即為成立", "甲與乙之契約如未約定報償，貸與人甲對於借用物之瑕疵，非因故意而未告知時，對於借用人乙因此所受之損害無須負損害賠償責任", "借用人不能以種類、品質、數量相同之物返還時，應以借用時，借用地之價值償還"], "exp": ["✗A. 約定返還「相同種類、品質、數量之物」，是消費借貸（§474），非使用借貸（返還原物）。", "✗B. 消費借貸為要物契約，須金錢或其他代替物之所有權移轉於借用人才生效力（§475），非意思合致即成立。", "✓C（本題答案）. §476 II：無報償之消費借貸，貸與人非故意不告知瑕疵者，不負損害賠償責任（借用人僅得以瑕疵原物之價值返還）。", "✗D. §479：借用人不能以種類、品質、數量相同之物返還時，原則以返還時、返還地之價值償還，非借用時、借用地。", "★ 借飼料、借米、借錢都是「用完還同類」＝消費借貸；借腳踏車還原車＝使用借貸。陷阱：消費借貸是要物契約，交付物才成立。"]}, {"year": 101, "num": 32, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲向乙提出給付，但給付遲延，下列敘述何者最正確？", "opts": ["乙得向甲主張遲延之損害賠償以代替原定給付", "甲在遲延中，對於因不可抗力而生之損害，原則上毋須負責", "遲延之債務，以支付金錢為標的者，債權人乙得向債務人甲請求以法定利率計算之遲延利息", "對於甲之遲延給付，不論是否可歸責於甲，甲皆應負遲延之賠償責任"], "exp": ["✗A. §232：遲延後債權人得請求賠償不履行損害以代原給付，須以遲延後之給付對債權人無利益並拒絕給付為前提，非當然得請求。", "✗B. §231 II：債務人在遲延中，對於不可抗力所生之損害亦應負責，除非證明縱不遲延仍不免發生損害。", "✓C（本題答案）. §233 I：金錢債務遲延，債權人得請求依法定利率（§203 週年5%）計算之遲延利息。", "✗D. §230：因不可歸責於債務人之事由致未為給付者，債務人不負遲延責任。", "★ 遲延＝可歸責才成立；遲延中連不可抗力都要負責（§231 II）；金錢債務遲延利息（§233）最基本。陷阱：以遲延賠償代替原給付須符合 §232 要件。"]}, {"year": 101, "num": 33, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲向乙訂購珍珠項鍊一條，甲與乙並約定由乙直接向第三人丙提出給付，丙對乙有直接請求權，下列敘述何者最正確？", "opts": ["在丙表示享受其利益之意思後，甲與乙仍得隨時撤銷丙所取得之利益", "在丙表示享受其利益之意思後，丙得請求乙向自己提出給付，但乙得以由契約所生之一切抗辯對抗丙", "在丙表示享受其利益之意思後，乙得向丙請求給付項鍊之價金", "甲與乙所締結之買賣契約為負擔契約，對第三人丙不生效力，丙不得對乙直接請求給付"], "exp": ["✗A. §269 II：第三人未表示享受利益意思前，當事人得變更或撤銷；表示後即不得再撤銷。", "✓B（本題答案）. §269 I、§270：第三人有直接請求給付權，債務人得以由契約所生之一切抗辯對抗受益之第三人。", "✗C. 價金係要約人甲依買賣契約應給付予乙，乙不得向第三人丙請求價金；丙僅享受受領項鍊之利益。", "✗D. §269 I：利益第三人契約有效，第三人丙對債務人乙有直接請求給付之權。", "★ 利益第三人契約：第三人表示享受後權利確定，但債務人仍可用契約抗辯（如買賣瑕疵、未付價金）對抗他。陷阱：第三人不是契約當事人，不負價金義務。"]}, {"year": 101, "num": 37, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲向乙借一套百科全書，下列敘述何者最正確？", "opts": ["在乙承諾將百科全書借給甲後，甲與乙之借貸契約即成立", "甲與乙之借貸契約為諾成契約", "甲與乙之借貸契約為消費借貸契約", "甲與乙之借貸契約為要物契約，以物之交付作為契約之成立要件"], "exp": ["✗A. 使用借貸（§464）為「以物交付他方」而約定無償使用後返還之契約，屬要物契約，須物已交付才成立；乙僅承諾借出、尚未交付，契約尚未成立。", "✗B. 使用借貸不是合意即成立的諾成契約：§464 以「以物交付他方」為契約要素，未交付百科全書前，雙方縱有合意，借貸契約仍未成立，故「諾成契約」之說錯誤。", "✗C. 消費借貸（§474）是移轉金錢或其他代替物「所有權」，約定以種類、品質、數量相同之物返還；本題借的是特定一套百科全書，使用後須返還原物，屬使用借貸（§464），不是消費借貸。", "✓D. 使用借貸（§464）為要物契約，須以「物之交付」作為成立要件，正確。（消費借貸§474 亦為要物契約，但本題標的是返還原物，屬使用借貸。）"]}, {"year": 102, "num": 1, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲向乙建設公司購買預售屋一戶，約定甲應依已完成之工程進度所定付款明細表之規定於工程完工後繳款，半年後乙建設公司資金週轉不靈，財產遭法院查封，甲是否應繼續繳納約定的工程款？", "opts": ["資金週轉不靈，屬可歸責於乙建設公司之事由，甲可拒絕繳納已完工的工程款", "因甲無過失，可免給付之義務，甲可拒絕繳納已完工的工程款", "基於買賣契約，甲得向乙建設公司主張同時履行抗辯，拒絕繳納已完工的工程款", "甲可主張在乙建設公司未繼續進行工程或提出擔保前，得拒絕繳納已完工的工程款"], "exp": ["✗A. 乙週轉不靈並非給付不能，乙之債務尚在；甲不得僅因此拒絕繳款，而須依 §265 主張不安抗辯。", "✗B. §225 免給付義務須因給付不能且不可歸責；甲之給付（付款）並未不能，不能以無過失免除。", "✗C. §264 I 但書：甲依約有先為給付之義務，不得主張同時履行抗辯。", "✓D（本題答案）. §265：應先為給付者，若他方財產於訂約後顯形減少而有難為對待給付之虞，他方未為對待給付或提出擔保前，得拒絕自己之給付。", "★ 先給付義務人的保護工具是 §265 不安抗辯，不是 §264 同時履行。陷阱：同時履行要「雙方同時」，先給付義務就不適用。"]}, {"year": 102, "num": 3, "ans": "", "acc": "", "note": "本題依考選部公告一律給分", "src": "ai", "stem": "甲經由乙仲介向丙購得 A 屋，甲於交屋遷入後始得知 A 屋曾發生非自然死亡事件。關於當事人間的權利義務，下列敘述何者正確？", "opts": ["凶宅為不完全給付，甲得向丙請求損害賠償，但不得要求解除契約", "A 屋並無滅失或減少其通常效用，甲不得向乙主張物之瑕疵擔保責任", "A 屋若符合凶宅之客觀判斷標準，甲得向乙主張 A 屋之價值瑕疵擔保責任，要求解除契約或減少價金", "A 屋若符合凶宅之客觀判斷標準，甲得向乙主張權利瑕疵擔保責任，要求解除契約或減少價金"], "exp": ["✗A. 凶宅可構成物之瑕疵（價值瑕疵），買受人依 §359 得解除契約或請求減少價金，並非不得解除。", "✗B. 凶宅實務上常認屬減少物之價值之瑕疵（§354 I），前提不成立；且瑕疵擔保責任之相對人為出賣人丙，乙為仲介，並非出賣人。", "✗C. 瑕疵擔保責任之義務人為出賣人，甲應向丙而非仲介乙主張價值瑕疵（§354、§359）。", "✗D. 權利瑕疵（§349）指第三人對標的物有權利，凶宅屬物之價值瑕疵，並非權利瑕疵。", "★ 本題一律給分：選項對責任主體（出賣人丙或仲介乙）與瑕疵類型的表述有爭議。實力重點：凶宅＝價值瑕疵、向出賣人主張；仲介另負說明義務之責任。"]}, {"year": 102, "num": 20, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "18 歲的甲騎機車上學途中撞傷騎腳踏車的乙。下列敘述何者正確？", "opts": ["甲未成年，所以不須負損害賠償之責", "由甲的法定代理人負損害賠償之責", "以甲行為時有意思能力為限，與其法定代理人連帶負損害賠償責任", "法定代理人如其監督並未疏懈，或縱加以相當之監督，而仍不免發生損害者，得主張免責"], "exp": ["✗A. §187 I：未成年人有識別能力時須負責，並與法定代理人連帶，未成年不當然免責。", "✗B. 有識別能力時由行為人與法定代理人連帶負責；僅無識別能力才由法定代理人單獨負責（§187 I）。", "✗C. §187 I 之要件為行為時「識別能力」，並非意思能力。", "✓D（本題答案）. §187 II：法定代理人監督並未疏懈，或縱加相當監督仍不免發生損害者，不負賠償責任。", "★現行法差異：112.1.1起成年年齡降為18歲（§12），現行法下18歲之甲已成年，不再適用 §187 法定代理人責任，甲須自負侵權責任；D選項之§187 II免責規定仍存在。", "★ §187：有識別能力→本人＋法定代理人連帶；無識別能力→法定代理人單獨；法定代理人可舉證免責。陷阱：免責的是「法定代理人」，不是行為人。"]}, {"year": 103, "num": 9, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲與乙於民國（下同）103 年 10 月 1 日簽訂買賣契約將自有古董錶以新臺幣（下同）20 萬元出售予乙，約定同年 11 月 1 日交付該錶予乙。但同年 10 月 5 日不知情的丙向甲表示願以 25 萬元之價格購買該古董錶，甲同意出售，並當場 ✗C. 丙之分擔額為10萬（§280 平均分擔），甲之分擔部分不轉由乙、丙承擔，故非15萬。", "✗D. §276 I：免除僅就該債務人應分擔之部分，他債務人同免責任，其餘部分仍須負責，並非全部免除。", "★ 免除連帶債務人之一：只扣掉他的分擔額，其他人還欠剩下的，也不會多負擔他的份。陷阱：「同免責任」只及於應分擔部分。"]}, {"year": 104, "num": 7, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "債權人甲不得代位其債務人乙，行使乙對第三人丙之何項權利？", "opts": ["不動產登記請求權", "扶養請求權", "實行抵押權", "提起訴訟之權利"], "exp": ["✗A. 不動產登記請求權具有財產性，可代位行使，A可代位。", "✓B. 扶養請求權屬「一身專屬權」（§242但書），甲不得代位乙行使對丙之扶養請求，正確，為應選答案。", "✗C. 抵押權之實行係財產性權利，可代位行使，C可代位。", "✗D. 訴訟行為（如起訴請求）係保全財產之行為，原則上可代位行使，D可代位。★一身專屬權不得代位（§242但書）：扶養請求、離婚請求、撤銷婚姻等身分權。"]}, {"year": 104, "num": 8, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列關於因債務不履行而解除契約之敘述，何者正確？", "opts": ["債權人解除契約者，即不得再向債務人請求損害賠償", "因債務人給付不能而為解除時，債權人仍須對債務人為履行之催告始得解除", "如債權人為履行之催告時未定期間，催告後經相當期間，仍得逕為解除", "因解除而互負回復原狀義務時，債務人不得主張同時履行抗辯權"], "exp": ["✗A. §260：解除權之行使，不妨礙損害賠償之請求。", "✗B. §256：給付不能時，債權人得逕行解除，無須催告。", "✓C（本題答案）. §254 催告未定期限者，催告後經相當期間仍不履行，債權人得解除契約（實務見解）。", "✗D. §261：解除後回復原狀準用同時履行規定（§264），債務人得主張同時履行抗辯。", "★ 解除契約：給付遲延→先催告再解除（§254）；給付不能→直接解除（§256）；解除不影響賠償（§260）。陷阱：解除後回復原狀也是同時履行。"]}, {"year": 104, "num": 10, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙締結由甲出售 10 打市面上普遍流通之紅酒予乙之買賣契約，甲依約於約定期日將標的物運送至乙之住所地時，乙以自己尚未備妥儲藏場所為由拒絕受領。甲不得已乃將物品運回繼續保管，卻於保管期間中該等紅酒全數破裂。下列敘述，何者正確？", "opts": ["即使紅酒之破裂係因甲之重大過失所致，乙亦不得向甲主張損害賠償", "如紅酒之破裂係因不可抗力所致，乙之價金債務消滅", "甲之種類債務尚未特定", "甲之債務成為給付不能"], "exp": ["✗A. §237：債權人受領遲延中，債務人僅就故意或重大過失負責；破裂若因甲重大過失，乙仍得請求賠償。", "✗B. 受領遲延中危險已移轉債權人負擔，不可抗力致標的物滅失，乙之價金債務並不消滅。", "✗C. 甲已將紅酒運至乙住所為現實提出（§235），必要行為完成，依 §200 II 種類之債已特定。", "✓D（本題答案）. 種類之債已特定為該10打紅酒，全數破裂致標的物滅失，甲之債務成為給付不能。", "★ 種類之債特定後變成特定之債，標的物滅失就是給付不能；債權人受領遲延時，債務人責任減為故意或重大過失（§237）。陷阱：債權人遲延，風險歸債權人。"]}, {"year": 104, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲將其對乙之債權讓與予丙。下列何者會使此債權讓與無效？", "opts": ["甲乙間有不得讓與之特約，但丙為善意之情形", "甲未將證明債權之文件交付予丙", "乙不同意甲丙間之債權移轉行為", "該債權係甲為維持生活所必須之債權"], "exp": ["✗A. §294 II：不得讓與之特約不得對抗善意第三人，丙善意，讓與有效。", "✗B. §296 交付證明文件為讓與人義務，未交付不影響讓與效力。", "✗C. §297：債權讓與無須債務人同意，只需通知，乙不同意不影響效力。", "✓D（本題答案）. §294 I(3)：禁止扣押之債權不得讓與，維持生活所必須之債權屬之，讓與無效。", "★ 不得讓與三類：性質上、特約（不得對抗善意第三人）、禁止扣押之債權（§294 I）。陷阱：特約不得讓與遇善意第三人仍有效。"]}, {"year": 104, "num": 13, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲、乙、丙三人對丁負有各自分擔比例為三分之一之 300 萬元連帶債務。下列敘述，何者正確？", "opts": ["連帶債務罹於消滅時效後，甲對丁為債務之承認時，該中斷時效之效力及於乙、丙", "甲以時價 300 萬元之珠寶對丁為代物清償時，如事前未得乙、丙同意，甲不得向乙、丙求償", "甲對丁清償 300 萬元時，如乙無資力，則甲得對丙求償 200 萬元", "甲對丁先清償 90 萬元時，甲得對乙、丙分別求償 30 萬元"], "exp": ["✗A. §279：承認非絕對效力事項，連帶債務人之一承認僅對該人生效，不及於乙、丙。", "✗B. 代物清償為 §274 絕對效力事由，甲清償後依 §281 I 即得向乙、丙求償，無須事前同意。", "✗C. §282 I：乙無資力之100萬由甲、丙平均分擔，甲得向丙求償100萬加50萬＝150萬，非200萬。", "✓D（本題答案）. §280、§281 I：甲清償之90萬依平均分擔比例（各1/3），得向乙、丙各求償30萬。", "★ 連帶債務求償＝依分擔額；有人無資力，缺額由「求償人與其他人按比例分擔」（§282）。陷阱：承認、時效中斷等多為相對效力，只有 §274-§278 事由才絕對。"]}, {"year": 104, "num": 14, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲賣 A 屋給乙，尚未移轉交付，嗣後 A 屋因可歸責於丙之事由失火滅失，然甲對 A 屋投有火災保險。下列敘述，何者錯誤？", "opts": ["甲得主張免給付義務，乙亦得主張免對待給付", "此為給付不能，甲、乙間之買賣契約無效", "乙得履行對待給付後，請求甲讓與對失火肇事者丙之損害賠償請求權", "乙得依民法第 225 條第 2 項請求甲交付保險金"], "exp": ["✓A. §225 I：因不可歸責於債務人之事由致給付不能，債務人免給付義務；乙依 §266 I 亦免對待給付。", "✗B（本題答案）. 給付不能為嗣後不能，契約原本有效，僅債務人免給付義務；§246 契約無效指訂約時即不能。", "✓C. §225 II：債務人對第三人有損害賠償請求權者，債權人得請求讓與，乙須履行對待給付。", "✓D. §225 II：債權人得請求交付債務人所受領之賠償物，本題以保險金屬代償利益作答（學說對保險金是否屬之有爭議）。", "★ 嗣後給付不能＝免給付義務＋代償請求權（§225 II），契約不是無效。陷阱：自始不能（§246）才無效，嗣後不能不是。"]}, {"year": 104, "num": 15, "ans": "", "acc": "AB", "note": "本題依考選部公告多重給分：答 A或B 者均給分", "src": "ai", "stem": "甲有 A 車一輛借乙使用，乙因滑手機未注意車前狀況，而與丙酒駕闖紅燈之 B 車相撞，乙重傷，A 車全毀。下列敘述，何者正確？", "opts": ["甲若向丙請求 A 車之損害賠償，丙不得主張甲就 A 車投有保險，應扣除保險金", "乙及丙對 A 車之損害，應負連帶賠償責任", "乙母可向丙請求精神慰藉金", "乙向丙請求賠償時，丙不得主張因乙與有過失，應減輕賠償金額"], "exp": ["✓A（本題答案）. 保險金為保險契約對價所得，不屬損益相抵之利益，加害人丙不得以甲投保為由扣除。", "✓B（本題答案）. 乙之過失與丙之過失均為A車全毀之原因，構成共同加害（§185 I），應連帶賠償。", "✗C. 乙母非被害人，僅於身分法益被侵害且情節重大時方得依 §195 III 請求；乙僅重傷，並非當然得請求。", "✗D. §217 I：被害人與有過失，法院得減輕賠償金額或免除，丙得主張乙與有過失（乙滑手機未注意）。", "★ 本題多重給分（A或B）。保險金不扣除、客觀共同侵權連帶，是常考觀念。陷阱：與有過失（§217）可減輕賠償。"]}, {"year": 104, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲因長期出國，將其所有名貴青花瓷一只交由乙代為保管。乙向丙偽稱該瓷為己有，欲以該瓷與丙所有之名車互易，雙方達成讓與合意並互相交付完畢。下列敘述，何者錯誤？", "opts": ["該互易契約有效", "丙得主張因善意受讓而取得該只青花瓷之所有權", "丙移轉名車所有權之行為於甲承認之前為效力未定", "甲得向乙請求損害賠償"], "exp": ["✓A. 互易準用買賣（§398），負擔行為不以處分權限為要件，契約有效。", "✓B. 乙無處分權，丙善意受讓，並受交付，依 §948 善意取得所有權（甲係自願交付，無 §949 例外）。", "✗C（本題答案）. 丙處分的是自己所有之名車，為有權處分，生效不須他人承認；效力未定者是無權處分（乙之處分）。", "✓D. 乙無權處分致甲喪失所有權，甲得依 §184 I 前段或 §179 向乙請求損害賠償或返還利益。", "★ 無權處分＋善意受讓：負擔行為有效，處分行為因善意取得而有效；原所有人向無權處分人求償。陷阱：效力未定的是無權處分，不是丙的有權處分。"]}, {"year": 104, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於抵銷之敘述，何者正確？", "opts": ["甲對乙有金錢債權、乙對甲有因侵權行為而生之損害賠償請求權時，乙不得對甲主張抵銷", "甲對乙有金錢債權、乙對甲有禁止扣押之金錢債權時，甲不得對乙主張抵銷", "甲對乙之金錢債權及乙對甲之金錢債權的履行地不同時，乙不得對甲主張抵銷", "甲對乙之金錢債權及乙對甲之金錢債權的履行地不同時，甲不得對乙主張抵銷"], "exp": ["✗A. §339 禁止抵銷的是「故意侵權行為之債務人」，本題乙為債權人，乙得主張抵銷。", "✓B（本題答案）. §338：禁止扣押之債，其債務人不得主張抵銷；甲為禁止扣押債權之債務人，不得抵銷。", "✗C. §336：清償地不同亦得抵銷，僅主張人應賠償他方因此所生之損害。", "✗D. §336：清償地不同亦得抵銷，甲可主張抵銷但應賠償損害。", "★ 禁止抵銷看「誰是債務人」：禁止扣押之債（§338）、故意侵權之債（§339）、約定不得抵銷、性質不許，其債務人不能抵。陷阱：被禁止的是債務人，債權人想抵銷是可以的。"]}, {"year": 104, "num": 31, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "乙所有 A 地及建造於 A 地上之 B 屋。甲因其對乙之債權屆期未獲清償，乃向法院聲請拍賣 A 地，並由丙拍定。乙之 B 屋與丙取得之 A 地間的法律關係如何？", "opts": ["視為已有地上權之設定", "視為在 B 屋得使用期限內，有租賃關係", "推定在 B 屋得使用期限內，有租賃關係", "丙得請求乙拆除 B 屋"], "exp": ["✓A（本題答案）. §838-1：土地與建物同屬一人，因強制執行拍賣使土地、建物拍定人各異時，視為已有地上權之設定。", "✗B. 拍賣情形依 §838-1 為地上權而非租賃；§425-1 租賃推定適用於讓與情形。", "✗C. 拍賣時為「視為」地上權，並非「推定」租賃。", "✗D. 因已視為有地上權，丙不得請求拆屋。", "★ 同屬一人的土地、房屋：讓與→推定租賃（§425-1）；抵押／強制執行拍賣→視為地上權（§876、§838-1）。陷阱：兩條規定不要混。"]}, {"year": 105, "num": 3, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關財產權之描述，下列敘述何者正確？", "opts": ["債權是請求權，所以只能約定由特定人請求另一特定人為一定作為，但不能約定不作為", "債權具有相對性，所以當出賣人一屋先後兩賣時，前後買賣契約皆為有效", "基於契約自由原則，當事人可以自由創設物權種類，不受限制", "債權給付之內容，以有財產價格者為限"], "exp": ["✗A. 債權不限於作為，不作為（如競業禁止）亦可約定（§199 II）。", "✓B（本題答案）. 債權具相對性，一屋二賣兩買賣契約皆有效，買受人均得向出賣人請求履行。", "✗C. 物權法定（§757），當事人不得任意創設物權種類。", "✗D. §199 II：債之給付，不以有財產價格者為限。", "★ 物權法定、債權自由；債權有相對性，兩個買賣都有效，但只有一人能取得所有權。陷阱：給付不必有財產價格。"]}, {"year": 105, "num": 7, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "有關法律行為之標的，下列敘述何者正確？", "opts": ["甲乙約定以火星上岩石為贈與標的物，該契約有效", "甲乙約定故宮翠玉白菜為買賣標的物，該契約有效", "甲乙約定甲需於 1 日內完成環島健走行程，該契約有效", "甲乙婚前協議約定，婚後任一方若有出軌行為，必須支付對方新臺幣 100 萬元賠償費，該契約有效"], "exp": ["✗A. 火星岩石為自始客觀不能之給付，依 §246 I 契約無效。", "✗B. 翠玉白菜為國有國寶級文物，其轉讓受法令禁止或限制（§71），買賣契約不能有效成立。", "✗C. 1日內完成環島行程為自始客觀不能，契約無效（§246 I）。", "✓D（本題答案）. 婚前協議約定違約金屬契約自由（§153），法院得依 §252 酌減，約定本身不當然違法無效。", "★ 標的要可能、確定、適法（§71、§72、§246）。陷阱：客觀不能無效，主觀不能（如出賣他人物）有效。"]}, {"year": 105, "num": 10, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲於出國遊玩期間，適逢颱風來襲，甲家的大門因此破損，門戶洞開。鄰居乙擔心甲家遭遇盜賊，乃好心召來工匠為其修繕，支出 8 千元。試問乙得依下列何種法律關係向甲請求返還 8 千元？", "opts": ["無因管理", "侵權行為", "不當得利", "債務不履行"], "exp": ["✓A. 無因管理（§172）：未受委任、並無義務而為他人管理事務；乙為出國之甲修繕破損大門，符合本人利益，依§176 Ⅰ（管理事務利於本人且不違反本人意思者，得請求償還必要或有益費用及自支出時起之利息），乙得請求返還8千元，正確。", "✗B. 侵權行為（§184）是因故意或過失不法侵害他人權利而負賠償責任；乙是為甲之利益出資修繕，並未侵害甲，無從成立。", "✗C. 不當得利（§179）要件為「無法律上之原因」而受利益致他人受損害；甲雖因修繕受利益，但此利益有無因管理（§172、§176）作為法律上原因，欠缺「無法律上之原因」，乙應依無因管理請求償還費用，而非不當得利。", "✗D. 債務不履行以當事人間有債之關係（如契約）為前提；乙與甲間並無契約或約定義務，無從主張債務不履行。"]}, {"year": 105, "num": 11, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "有關契約之敘述，下列何者正確？", "opts": ["契約為事實行為的一種", "契約得因要約交錯之方式成立", "契約皆須以書面方式為之，方得以成立", "基於契約自由原則，醫生得拒絕醫治病情危急的情敵"], "exp": ["✗A. 契約屬「法律行為」（需意思表示），非事實行為（事實行為不以意思表示為要素，如占有、無因管理）。", "✓B. 依§153，要約交錯：雙方各自獨立發出的要約，在不知對方要約之情況下，若內容一致，可構成契約成立，正確。", "✗C. 契約原則上為不要式，除法律明定書面要式者外，口頭即可成立，選項過於絕對，錯誤。", "✗D. 醫師有緊急醫療義務（醫師法等公法），不得以個人好惡拒絕急救，本選項以「契約自由」主張可拒絕，忽略公法義務的限制，錯誤。"]}, {"year": 105, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依現行民法規定，有關違反法定要式規定之法律行為效力，下列何者應為無效？", "opts": ["會員已交付首期會款，但未訂立會單", "不動產買賣之債權契約，未經書面公證", "不動產租賃契約期限約定 2 年，且未以書面簽訂", "人事保證契約未以書面簽訂"], "exp": ["✗A. 合會（§709-3）：合會應訂立會單，但Ⅲ規定「會員已交付首期會款者，雖未依規定訂立會單，其合會契約視為已成立」；本選項已交付首期會款，合會契約視為成立，並非無效。", "✗B. 不動產買賣債權契約：§166-1 雖規定以負擔不動產物權移轉義務為標的之契約應由公證人作成公證書，但該條施行日期由行政院會同司法院另定、迄未施行，現行法下不公證並不影響債權契約效力（且該條Ⅱ亦規定已合意並完成登記者仍為有效），故非無效。", "✗C. 不動產租賃（§422）：期限逾一年者應以字據訂立，未以字據訂立者「視為不定期限之租賃」；本選項期限2年未書面，法律效果是視為不定期限租賃，契約仍然有效，並非無效。", "✓D. 人事保證（§756-1 Ⅱ）：人事保證契約應以書面為之；依§73，法律行為不依法定方式者無效（但法律另有規定者除外），本條並無例外規定，故未以書面簽訂即為無效，正確。"]}, {"year": 105, "num": 13, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "有關不當得利所應返還之客體，下列何者錯誤？", "opts": ["原物所生之孳息", "受領之原物或原權利", "原物因受領人特殊能力導致之增值", "原物毀損後，受益時之價額"], "exp": ["✓A. §181：受領人除返還所受利益，本於該利益更有所取得者並應返還，孳息屬之。", "✓B. §181：原物仍存在者，應返還原物或原權利。", "✗C（本題答案）. §181 所指返還者為「本於該利益」所取得，受領人以特殊能力使原物增值，通說不屬應返還之客體。", "✓D. §181 但書：依利益性質不能返還者，應償還其價額，價額以受益時為準。", "★ 不當得利返還：原物、孳息、代位物，不能返還才償還價額；受領人自己的努力成果不用還。"]}, {"year": 105, "num": 15, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "依侵權行為請求損害賠償之說明，下列敘述何者正確？", "opts": ["純粹經濟上之損失亦屬於一種損害，與權利受損一樣，得依民法第 184 條第 1 項前段主張之", "債權亦屬於一種財產權，被侵害時，祗得依民法第 184 條第 1 項前段主張，而不得依同條項後段主張之", "我國侵權行為之保護客體僅限於權利，未及於利益", "故意以背於善良風俗之方法加損害於他人之利益，受害人亦得依侵權行為主張之"], "exp": ["✗A. 純粹經濟上損失並非權利受損，不能直接依 §184 I 前段主張，須依後段或 §184 II。", "✗B. 債權被侵害，無論故意或過失，可依前段；若故意以背於善良風俗之方法為之，亦可依後段。", "✗C. §184 I 後段、II 已保護利益。", "✓D（本題答案）. §184 I 後段：故意以背於善良風俗之方法加損害於他人者，亦負賠償責任，利益亦受保護。", "★ §184 三層：前段保護權利、後段保護利益（要故意悖俗）、II 違反保護他人法律。陷阱：純粹經濟損失原則上不賠。"]}, {"year": 105, "num": 16, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "有關民法第 250 條規定之違約金類型有「損害賠償總額預定違約金」與「懲罰性違約金」兩種，下列敘述何者正確？", "opts": ["「損害賠償總額預定違約金」，倘若債務人有債務不履行發生，惟債權人所受實際損害遠低於約定之額度時，債權人即不得請求此一違約金金額", "「懲罰性違約金」，只要債務人有債務不履行發生時，即便債權人未因此而受損害，債權人仍得請求此一違約金金額", "「損害賠償總額預定違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，亦得請求其他損害賠償金額", "「懲罰性違約金」，債務人有債務不履行發生，導致債權人受損害時，債權人除此一違約金外，不得請求其他損害賠償金額"], "exp": ["✗A. 賠償總額預定性違約金，債權人不必證明實際損害即可請求，法院僅得依 §252 酌減。", "✓B（本題答案）. 懲罰性違約金（§250 II 後段）：債務不履行即得請求違約金，不須證明損害，並得另請求損害賠償。", "✗C. §250 II 前段：賠償總額預定性違約金，視為損害賠償總額，不得另請求損害賠償。", "✗D. 懲罰性違約金的特色就是違約金外還可請求損害賠償。", "★ 預定賠償總額＝違約金取代賠償；懲罰性＝違約金外還能另請求；酌減（§252）兩者都可能適用。"]}, {"year": 105, "num": 18, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲將透天厝（不含基地）立約賣給乙後，尚未交付予乙前，即逢超級強烈颱風來襲，致透天厝完全倒塌。下列敘述何者正確？", "opts": ["乙免給付價金予甲", "甲仍負有交屋之義務", "甲仍得請求乙支付價金", "乙得向甲主張侵權行為"], "exp": ["✓A. 颱風為不可歸責雙方之事由（危險負擔，§266），房屋未交付前滅失，出賣人（甲）免給付義務，買受人（乙）亦免給付對待給付（價金），乙免付，正確。", "✗B. 特定物已滅失（颱風倒塌），甲無從再交屋，給付客觀不能，甲之交付義務消滅，並非「仍負有交屋義務」。", "✗C. 依§266，不可歸責雙方的危險負擔，甲乙雙方互免，甲不得再請求乙支付價金，選項錯誤。", "✗D. 颱風倒塌不可歸責於甲，甲並無過失或故意，乙無從主張甲的侵權行為。"]}, {"year": 106, "num": 30, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "19 歲之甲經父母同意受僱於乙公司。某日甲受乙公司之吩咐，將貨物送到客戶手中。途中行經十字路口，甲闖紅燈致丙在綠燈穿越時受傷，經該地區行車事故鑑定委員會認定，認定甲應負全部之肇事責任。就此情形，下列敘述何者錯誤？", "opts": ["甲是未成年人，對於丙之損害，無須負賠償責任", "丙得主張乙與甲負連帶損害賠償責任", "丙得主張甲及其父母負連帶損害賠償責任", "乙賠償丙之損害後，得向甲求償"], "exp": ["✗A（本題答案）. 甲雖未成年，仍須就自己的侵權行為負責，有識別能力時與法定代理人連帶負責（§184、§187 I），並非無須賠償。", "✓B. §188 I：受僱人因執行職務不法侵害他人，僱用人與行為人連帶負賠償責任。", "✓C. §187 I：未成年甲有識別能力，與法定代理人連帶負責，丙得主張。", "✓D. §188 III：僱用人賠償後，對為侵權行為之受僱人有求償權。", "★現行法差異：112.1.1起成年年齡降為18歲，現行法下19歲之甲已成年，丙不得依 §187 向其父母求償（C選項情形不成立）；A選項仍為錯誤敘述，本題答案不變。", "★ 受僱人侵權＝僱用人連帶（§188）；賠償後可求償受僱人。陷阱：未成年人有識別能力仍須負責。"]}, {"year": 106, "num": 38, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關契約解除之敘述，何者錯誤？", "opts": ["契約解除時，當事人雙方負回復原狀之義務", "解除權之行使，不妨礙損害賠償之請求", "房屋買賣契約解除時，原買受人已支出之裝潢費用均得請求出賣人返還", "解除權之行使，得以送達訴狀繕本予他方當事人之方法為之"], "exp": ["✓A. §259：契約解除時，當事人雙方負回復原狀之義務（如返還受領之給付物、金錢附加利息等），正確。", "✓B. §260：解除權之行使，不妨礙損害賠償之請求，兩者可併行主張，正確。", "✗C（本題答案）. 買受人所支出之費用能否請求，依§259 ⑤：就返還之物已支出必要或有益之費用，得於他方受返還時「所得利益之限度內」請求返還；故僅限「必要或有益」費用，且以出賣人受返還所得利益為限，並非支出之裝潢費用「均得」請求返還，本選項過於絕對，錯誤，為應選答案。", "✓D. 解除權之行使，應向他方當事人以意思表示為之（§258 Ⅰ）；實務上認為以訴狀送達他方亦可視為已為解除之意思表示（此點為實務見解，非條文明文），正確。"]}, {"year": 107, "num": 4, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "種類之債係以不特定物之給付為標的，為使債之實現，於履行前應為特定。下列有關種類之債特定之方法，何者正確？", "opts": ["種類之債只能依法定方法為特定", "往取之債於債務人具體指定給付物，並將準備給付之情事，通知債權人時，種類之債即為特定", "送赴之債於債務人將給付物送至債權人住所地，使債權人處於得隨時受領之狀態時，種類之債即為特定", "赴償之債於債務人交付其物於運送之人時，種類之債即為特定"], "exp": ["✗A. 特定方法不限法定，經債權人同意指定其物者亦可（§200 II）。", "✓B（本題答案）. 往取之債，債務人具體指定給付物並通知債權人準備給付（§235 但書），必要行為完成，種類之債即特定。", "✗C. 送赴之債須在債權人住所地現實提出給付（§235 本文）；僅使債權人處於得受領之狀態，是往取之債準備給付通知之情形。", "✗D. 交付運送人屬寄送之債，並非赴償之債。", "★ 三種：往取（指定＋通知）、送赴（現實提出）、寄送（交付運送人）。陷阱：特定時點以債務人必要行為完成為準。"]}, {"year": 107, "num": 11, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "16 歲之甲於騎車上學時，與正在送貨之某公司送貨員乙（30 歲）擦撞，並導致路人丙受傷。若甲與乙均為違規駕駛，下列敘述何者正確？", "opts": ["丙僅得請求財產上之損害賠償，不得主張非財產上損害賠償", "甲為有識別能力人，故丙僅得向甲單獨請求損害賠償，不得向甲之父母求償", "我國並無僱傭人責任之規範，僱傭乙之公司不必負損害賠償責任", "甲與乙對丙構成共同侵權行為，均須對丙負連帶損害賠償責任"], "exp": ["✗A. §195 I：身體、健康受侵害，得請求非財產上損害賠償。", "✗B. §187 I：甲有識別能力，與其法定代理人連帶負責，丙得向其父母求償（父母可依 §187 II 舉證免責）。", "✗C. §188 I：民法規定僱用人責任，公司須與受僱人連帶負責。", "✓D（本題答案）. §185 I：數人共同不法侵害他人權利，連帶負損害賠償責任，甲、乙共同造成丙受傷。", "★ 共同侵權（§185）＝連帶；未成年人有識別能力要負責並連帶法定代理人；僱用人亦連帶（§188）。"]}, {"year": 107, "num": 16, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於人格權保護，下列敘述，何者錯誤？", "opts": ["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之", "名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲", "債務人因債務不履行，致債權人之人格權受侵害者，不得請求損害賠償", "生命權受侵害時，配偶得請求損害賠償與慰撫金"], "exp": ["✓A. §18 I：人格權受侵害，得請求法院除去其侵害；有受侵害之虞時，得請求防止之。", "✓B. 釋字第656號：命加害人公開道歉，如未涉及自我羞辱等損及人性尊嚴者，不違憲。", "✗C（本題答案）. §227-1：債務不履行致人格權受侵害，準用 §192-§195、§197，債權人得請求賠償，包括慰撫金。", "✓D. §194：不法侵害他人致死者，配偶等得請求非財產上損害賠償相當金額。", "★ 人格權：§18（排除妨害）、§195（慰撫金）、§227-1（債務不履行人格權）。陷阱：契約責任也可能請求慰撫金。"]}, {"year": 108, "num": 12, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "10 歲的男童 A 去同學 B 家中一起打電動遊戲時，因一言不合吵起來，一氣之下摔壞 B 父甲新購買的筆電。請問下列敘述何者錯誤？", "opts": ["若摔壞筆電時 A 有識別能力，則由 A 單獨負責，甲不可向 A 之法定代理人乙求償", "若摔壞筆電時 A 有識別能力，則 A 和其法定代理人乙必須連帶負賠償責任", "若摔壞筆電時 A 無識別能力，則 A 無須負責", "若摔壞筆電時 A 無識別能力，則由其法定代理人乙單獨負責，但乙可舉證免責"], "exp": ["✗A（本題答案）. §187 I：A有識別能力，與法定代理人乙連帶負責，甲可向乙求償。", "✓B. §187 I：有識別能力時，行為人與法定代理人連帶負責。", "✓C. §187 I：行為時無識別能力者，原則由法定代理人負責，A本人無須負責（§187 III 為衡平責任）。", "✓D. §187 I 後段、II：無識別能力時由法定代理人單獨負責，乙得舉證監督無疏懈而免責。", "★ §187 一圖記：有識別能力＝連帶；無識別能力＝法定代理人單獨；監督無疏懈可免責。"]}, {"year": 108, "num": 15, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "甲、乙締結買賣甲所有之 A 屋的契約，乙並先為部分價金之給付。其後，乙未依約定期限給付剩餘價金。就甲以乙履行遲延而解除 A 屋買賣契約之情形，下列敘述，何者正確？", "opts": ["經甲定期間催告乙履行，甲得於經相當期限後，不須再為催告，即得解除契約", "甲僅限於法律規定之事由始得解除，不得與乙約定合意解除之事由", "契約經解除後，甲、乙互負回復原狀的義務，甲不得向乙請求損害賠償", "契約經解除後，因乙有可歸責事由，甲返還乙已給付之價金時，不須附加利息"], "exp": ["✓A（本題答案）. §254：定期間催告而債務人仍不履行，期限屆滿後得解除，不須再催告。", "✗B. 解除權除法定（如§254～§256）外，當事人亦得依契約自由約定（約定解除權），並非僅限法定事由。", "✗C. §260：解除不妨礙損害賠償之請求。", "✗D. §259 (2)：返還金錢者，應附加自受領時起之利息。", "★ 解除三要件：法定或約定解除權、催告（遲延時）、解除不妨礙賠償；回復原狀時返還金錢要加利息（§259）。"]}, {"year": 108, "num": 17, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "就甲、乙、丙三人對丁負有平均分擔之 300 萬元連帶債務的情形，下列敘述，何者正確？", "opts": ["甲對丁為債務之承認而中斷時效時，其效力亦及於乙、丙之債務", "丁請求甲支付全額獲勝訴判決後，仍未能自甲受償時，得再請求乙支付全額", "甲清償全額後，如乙不能償還其分擔額，甲亦僅能向丙求償 100 萬元", "甲對丁清償 100 萬元後，丁即不得再次向甲請求支付剩餘之 200 萬元"], "exp": ["✗A. §279：債務承認為相對效力事由，僅對甲生效。", "✓B（本題答案）. §273：債權人得對連帶債務人中之一人或數人或全體，同時或先後請求全部或一部給付。", "✗C. §282 I：乙不能償還之100萬由甲、丙平均分擔，甲得向丙求償150萬，並非100萬。", "✗D. §273 II：連帶債務未全部履行前，全體債務人仍負連帶責任，丁仍得向甲請求剩餘200萬。", "★ 連帶債務對外各負全部責任，債權人可擇一請求；內部分擔與求償依 §280-§282。"]}, {"year": 108, "num": 21, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "甲將其所有之 A 土地上之 B 建物讓與乙時，在房屋得使用期限內，乙與甲間有何法律關係？", "opts": ["推定有租賃關係", "視為有租賃關係", "推定有普通地上權關係", "視為有普通地上權關係"], "exp": ["✓A. §425-1，土地及其上之房屋同屬一人，而僅將房屋讓與他人（未讓與土地），在房屋使用期限內，「推定」（非「視為」）土地與房屋間有租賃關係，正確。★關鍵區分：一般買賣分離→推定租賃（§425-1）；抵押拍賣分離→視為地上權（§876），務必分清。", "✗B. 應為「推定」而非「視為」，兩者重要差別：「推定」可被反証推翻；「視為」法律擬制，不可推翻，本選項說「視為」錯誤。", "✗C. 地上權適用於抵押拍賣場合（§876），一般買賣分離適用租賃（§425-1），選項適用規定錯誤。", "✗D. 同C，且「視為」二字亦不正確。"]}, {"year": 109, "num": 4, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關契約成立之敘述，何者錯誤？", "opts": ["契約得以要約與承諾之意思表示合致而成立", "契約得以要約交錯之方式而成立", "契約得以承諾交錯之方式而成立", "契約得以要約與意思實現方式而成立"], "exp": ["✓A. 契約由要約與承諾之意思表示一致而成立（§153 Ⅰ：當事人互相表示意思一致者，無論明示或默示，契約即成立；§154 起規範要約之拘束力、承諾等），為最基本的成立方式，正確。", "✓B. 要約交錯：雙方各自獨立向對方為內容一致之要約，構成「互相表示意思一致」，依§153 Ⅰ契約成立（通說），正確。", "✗C（本題答案）. 承諾必須針對對方已發出之要約而為，民法並無「承諾交錯」這種契約成立方式；民法承認的是要約交錯（§153）與意思實現（§161），本選項描述不存在的成立方式，錯誤，為應選答案。", "✓D. 意思實現（§161 Ⅰ）：依習慣或依事件之性質，承諾無須通知者，在相當時期內有可認為承諾之事實時，契約即為成立（如逕行履行），正確。"]}, {"year": 109, "num": 5, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "下列關於利息之敘述，何者正確？", "opts": ["應付利息之債務，其利率未經約定亦無法律可據者，原則上以週年利率為百分之六計算", "約定利率逾週年百分之十二者，經一年後，債務人得隨時清償原本。但須於一個月前預告債權人", "約定利率，超過週年百分之二十者，其約定當然無效，此時應以法定利率計算應給付之利息", "債權人受領超過最高利率之利息，對於超過部分之利息係不當得利，應返還債務人"], "exp": ["✗A. §203：未約定利率亦無法律可據者，週年利率為5%，不是6%。", "✓B（本題答案）. §204 I：約定利率逾週年12%者，經一年後債務人得隨時清償原本，但須於一個月前預告債權人。", "✗C. §205：超過上限部分之約定無效，並非整個利息約定當然無效而改依法定利率。", "✗D. 超過部分約定無效（§205），惟債務人給付時若明知無給付義務，依 §180(3) 不得請求返還，故不能一概說都須返還。", "★現行法差異：§205 嗣後修正，週年利率上限由20%降為16%；選項C之「20%」為當時規定，但「約定當然無效」之說法於新舊法下均不成立（僅超過部分無效），答案不變。", "★ 利息三數字：法定5%（§203）、12%後可提前還（§204）、上限（§205）。陷阱：超過上限者僅超過部分無效。"]}, {"year": 109, "num": 6, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下列有關定金之敘述，何者正確？", "opts": ["訂約當事人之一方，由他方受有定金時，其契約視為成立", "定金為諾成契約，於當事人約定時即成立", "契約因可歸責於付定金當事人之事由，致不能履行時，定金不得請求返還", "契約因不可歸責於雙方當事人之事由，致不能履行時，定金視為債務不履行損害賠償之總額"], "exp": ["✗A. §248：由他方受有定金時，是「推定」契約成立，並非視為成立。", "✗B. 定金契約為要物契約，須交付定金才成立，並非諾成。", "✓C（本題答案）. §249 (2)：契約因可歸責於付定金當事人之事由致不能履行時，定金不得請求返還。", "✗D. §249 (4)：契約因不可歸責於雙方之事由致不能履行時，定金應返還。", "★ 定金四種：成立推定（§248）；付定金方可歸責→沒收；受定金方可歸責→加倍返還；雙方不可歸責→返還（§249）。"]}, {"year": 109, "num": 7, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲借給乙 100 萬元，借期屆至，甲請求乙返還 100 萬元借款，乙因此開立 100 萬元之本票交由甲受領。下列敘述，何者正確？", "opts": ["甲所受領乙開立的 100 萬元本票，是債之內容更改", "甲所受領乙開立的 100 萬元本票，是抵銷", "甲所受領乙開立的 100 萬元本票，是代物清償", "甲所受領乙開立的 100 萬元本票，是新債清償"], "exp": ["✗A. 債之更改是以新債務取代舊債務、使舊債務消滅；但依§320，因清償債務而對債權人負擔新債務者，除當事人另有意思表示外，舊債務並不消滅，本題無使舊債務消滅之意思表示，不能認為更改。", "✗B. 抵銷（§334）須二人互負債務、給付種類相同且均屆清償期；本題只有乙對甲負借款債務，甲對乙並無相對債務，無從抵銷。", "✗C. 代物清償（§319）是債權人受領「他種給付」以代原定給付，債之關係即消滅；本題乙只是開立本票（負擔新債務），並非已以他種給付取代借款，且本票若不獲兌現，借款仍在，故非代物清償。", "✓D. 新債清償（§320）：因清償債務而對債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，舊債務仍不消滅；乙為清償100萬元借款而開立100萬元本票，即屬此類，正確。"]}, {"year": 109, "num": 9, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "甲將其名下之房屋出售並交付乙占有，惟尚未辦理所有權登記之前，甲又出售該屋於善意之丙且辦理所有權登記完畢。則乙對丙之主張，下列何者正確？", "opts": ["乙得依據其與甲所訂立之買賣契約而請求丙塗銷房屋所有權登記", "乙得向丙主張不當得利而請求丙塗銷房屋所有權登記", "乙得向丙主張撤銷權而請求丙塗銷房屋所有權登記", "乙無法請求丙塗銷房屋所有權登記，只得向甲請求債務不履行之損害賠償"], "exp": ["✗A. 乙之債權只能對甲主張，債權相對性，不能請求丙塗銷登記。", "✗B. 丙善意取得所有權並辦理登記，有法律上原因，無不當得利。", "✗C. 丙為善意，§244 撤銷權須受益人惡意（有償行為）且害及債權，乙不得撤銷。", "✓D（本題答案）. 乙無法請求丙塗銷登記，只能向甲請求債務不履行（給付不能）之損害賠償（§226）。", "★ 一屋二賣，先登記者取得所有權；落選者不能追回，只能向出賣人求償。陷阱：占有不等於物權。"]}, {"year": 110, "num": 12, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於連帶債務的敘述，下列何者正確？", "opts": ["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務", "連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息", "連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之", "連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"], "exp": ["✗A. §280 但書：因債務人中之一人應單獨負責之事由所致損害及費用，由該債務人負擔，並非平均分擔。", "✗B. §281 I：求償得包括自免責時起之利息。", "✓C（本題答案）. §282 I：連帶債務人中之一人不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按比例分擔。", "✗D. §282 II：他債務人中之一人應分擔部分已免責者，仍應按比例分擔。", "★ 連帶債務內部關係：平均分擔（§280）、求償含利息（§281）、不能償還風險共同分擔（§282）。"]}, {"year": 110, "num": 20, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "分別財產制有關夫妻債務的敘述，下列何者正確？", "opts": ["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配", "夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "夫妻各自對其債務負清償之責"], "exp": ["✗A. A所述為法定財產制剩餘財產分配之撤銷規定（§1020-1），並非分別財產制。", "✗B. B所述剩餘財產差額平均分配為法定財產制規則（§1030-1），分別財產制無此制度。", "✗C. C所述婚姻存續中不得請求償還、消滅時納入計算，為法定財產制之規則，非分別財產制。", "✓D（本題答案）. 分別財產制章（§1044以下）：夫妻各自對其債務負清償之責。", "★ 分別財產制＝各自財產各自債務、無剩餘財產分配；法定財產制才有剩餘財產差額分配。"]}, {"year": 110, "num": 21, "ans": "A", "acc": "", "note": "", "src": "ai", "stem": "關於共同財產所負之債務，而以共同財產清償者，下列何者正確？", "opts": ["不生補償請求權", "不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算", "有補償請求權，但於婚姻關係存續中，不得請求", "有補償請求權，雖於婚姻關係存續中，亦得請求"], "exp": ["✓A（本題答案）. 共同財產所負之債務以共同財產清償，債務與清償財源同屬一個財產池，只是左手還右手，不生補償請求權。", "✗B. 選項所述『關係消滅時分別納入現存婚後財產或所負債務計算』是法定財產制§1030-3（婚前／婚後財產互相清償債務）的規定，與共同財產清償共同財產債務無關。", "✗C. 共同財產清償共同財產債務根本不發生補償請求權，無所謂『婚姻關係存續中不得請求』。", "✗D. 補償請求權只發生於共同財產與特有財產互相清償對方債務之情形（§1038），同為共同財產則無，婚姻存續中亦不能請求。", "★白話：同一個口袋付同一個口袋的帳，不必互相補償；要補償必須是『共同財產↔特有財產』跨口袋。陷阱：B 借用法定財產制§1030-3 的用語混淆。"]}, {"year": 111, "num": 4, "ans": "B", "acc": "", "note": "", "src": "old", "stem": "下列敘述，何者錯誤？", "opts": ["使用借貸契約必須是無償的契約", "借用人得主張買賣不破使用借貸之抗辯", "借用物為動物時，飼養費原則上應由借用人承擔", "借用人對於借用物原則上並無轉租收益之權限"], "exp": ["✓A. 使用借貸（§464）本質為無償（若有償則為租賃），正確。", "✗B（本題答案）. 「買賣不破使用借貸」並無民法明文規定（§425買賣不破租賃適用於租賃，不及於使用借貸），使用借貸為無償，無類推適用§425之保護，故借用人不能主張買賣不破使用借貸，本選項說「得主張」錯誤，為應選答案。", "✓C. 使用借貸，借用物之管理費用（如飼養費）由借用人負擔（§469），正確。", "✓D. 使用借貸原則上借用人得自行使用，但不得擅自轉租（因屬無償借用，更不應從中謀利），正確。"]}, {"year": 111, "num": 6, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何種情形，債務人之原有債務不會發生消滅之效果？", "opts": ["債權人受領債務人以代物清償方式清償原有之債務", "債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務", "債權與其債務發生混同之情形", "債務人以間接給付之方式清償原有之債務"], "exp": ["✗A. 代物清償（§319）：經債權人同意以他種給付代原定給付，經受領後原債務即消滅。", "✗B. 抵銷（§334 I）：二人互負債務、種類相同且均屆清償期，經意思表示即各按債務額同時消滅。", "✗C. 混同（§344）：債權與其債務同歸一人，債之關係消滅（但法律另有規定或債權為他人權利標的者例外）。", "✓D（本題答案）. 間接給付（§320）：因清償舊債而負擔新債，除另有意思表示外，新債務不履行時舊債務仍不消滅；新債務履行後舊債務才隨之消滅，故不會因『約定』當下消滅。", "★白話：開支票還錢只是『約定換個方式還』，支票沒兌現，原本債務還在。陷阱：間接給付與代物清償（有『受領』即消滅）易混。"]}, {"year": 111, "num": 7, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "在無因管理之規定中，若管理人管理事務時，利於本人，且不違反本人明示或可得推知之意思者，管理人不得向本人主張下列那種請求權？", "opts": ["管理人管理本人事務之有益費用支出償還請求權", "清償管理人因管理事務所負債務之請求權", "管理人因管理事務所受損害之賠償請求權", "管理人管理本人事務之報酬請求權"], "exp": ["✓A. §176 I：管理事務利於本人且不違反其明示或可得推知之意思者，管理人得請求償還支出之有益費用及利息。", "✓B. §176 I：管理人得請求本人清償其因管理事務所負擔之債務。", "✓C. §176 I：管理人因管理事務所受之損害，得請求本人賠償。", "✗D（本題答案）. 無因管理規定中無報酬請求權之明文，管理人僅能請求費用、債務清償及損害賠償，不得請求報酬。", "★白話：多管閒事可以報銷成本與損失，但不能收『工錢』。陷阱：與委任（有約定報酬§547）區分。"]}, {"year": 111, "num": 12, "ans": "D", "acc": "", "note": "", "src": "ai", "stem": "下列何者非法律明文規定屬於連帶債務之性質？", "opts": ["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務", "數人共同不法侵害他人權利所生之損害賠償債務", "共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務", "共有人對於他共有人因分割而得之物，所負之擔保責任債務"], "exp": ["✓A. §681：合夥財產不足清償合夥債務時，各合夥人對不足額連帶負責，屬法律明文之連帶債務。", "✓B. §185 I：數人共同不法侵害他人權利者，連帶負損害賠償責任。", "✓C. §1153 I：繼承人對被繼承人之債務，以因繼承所得遺產為限，負連帶責任。", "✗D（本題答案）. §825：各共有人對他共有人因分割所得之物，按其應有部分負與出賣人相同之擔保責任，是分擔而非連帶。", "★白話：連帶債務須有明文或約定（§272）。分割後的擔保責任是『按應有部分各自負責』，不是連帶。"]}, {"year": 111, "num": 22, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？", "opts": ["抵銷", "抵充", "免除", "混同"], "exp": ["✓A. §334，雙方互負同種類債務（如均為金錢債務）且均屆清償期，得主張「抵銷」，在抵銷數額內同時消滅，正確。", "✗B. 抵充（§321以下）：同一債務人對同一債權人有數個債務，清償時指定以何者抵充（清償抵充），與本題雙方互負不同，概念不符。", "✗C. 免除（§343）：債權人向債務人表示免除其債務，單方意思表示，與本題互相抵銷不同。", "✗D. 混同（§344）：同一人同時為債權人及債務人，債權因混同而消滅，與本題兩人各有債務不同。"]}, {"year": 112, "num": 5, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲向乙推銷一只古董錶，甲出價新臺幣（下同）10 萬元問乙要不要買，乙答覆說：「如果 8 萬元我就買」，請問乙的答覆性質上為何？", "opts": ["要約之引誘", "承諾", "要約", "意思實現"], "exp": ["✗A. 要約引誘是邀請他人向自己為要約（如價目表寄送、一般廣告，§154 Ⅱ），本題乙已明確表示「8萬元我就買」，內容具體、可一經承諾即成立契約，不是單純邀請。", "✗B. 承諾須對原要約為完全同意；乙將價金由10萬元改為8萬元，已變更要約內容，依§160 Ⅱ不是承諾。", "✓C. 依§160 Ⅱ：將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約；乙把10萬元改為8萬元，即為（反）要約，正確。", "✗D. 意思實現（§161 Ⅰ）：依習慣或事件性質承諾無須通知者，在相當時期內有可認為承諾之事實時，契約即成立（如逕行履行）；本題乙只是以言語表示「8萬元就買」，並非以履行等事實承諾，不是意思實現。"]}, {"year": 112, "num": 7, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？", "opts": ["12", "16", "20", "25"], "exp": ["✗A. 12% 未達法定上限，§205 的上限不是 12%。", "✓B（本題答案）. §205：約定利率超過週年16%者，超過部分之約定無效。", "✗C. 20% 為修正前舊上限，現行§205 為16%。", "✗D. 25% 與民法§205 規定不符。", "★白話：民法利息上限16%，超過部分無效（本金與16%內仍有效）。陷阱：舊法20%；另注意無效的是『超過部分』而非整個約定。"]}, {"year": 112, "num": 8, "ans": "A", "acc": "", "note": "", "src": "old", "stem": "下列何種契約性質上屬於要物契約？", "opts": ["消費借貸契約", "房屋租賃契約", "贈與契約", "合會契約"], "exp": ["✓A. 消費借貸（§474），須「物之交付」才成立，屬要物契約，正確。", "✗B. 房屋租賃為諾成契約，雙方合意即成立，不以交付為成立要件。", "✗C. 贈與為諾成契約（合意即成立，但交付前可撤銷），並非要物契約。", "✗D. 合會（§709-3以下）為諾成性質，依法成立後各方依約履行，不以物之交付為成立要件。★要物契約記法：使用借貸（§464）、消費借貸（§474）均為要物契約；定金（§248）亦是要物性質。"]}, {"year": 113, "num": 1, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "甲就其所有之 A 地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關於二個買賣契約之效力，下列敘述，何者正確？", "opts": ["前契約有效，後契約無效", "前契約無效，後契約有效", "前契約有效，後契約有效", "前契約無效，後契約無效"], "exp": ["✗A. 買賣契約為債權契約，負擔行為不以有處分權為要件，後契約不會使前契約失效。", "✗B. 同理，前契約不因後契約而無效，也不因未登記而無效。", "✓C（本題答案）. 一物二賣，債權契約均有效；買賣為債權行為，並無排他性，只是出賣人僅能移轉所有權予一人，另一契約出賣人須負債務不履行責任（§226）。", "✗D. 兩契約皆為有效債權契約，未登記不影響契約效力，僅影響物權變動（§758）。", "★白話：『簽約』與『過戶』是兩件事。一屋兩賣兩個合約都有效，先登記者取得所有權，另一方請求賠償。陷阱：先簽先贏或後約無效的直覺。"]}, {"year": 113, "num": 4, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲對乙有新臺幣（下同）100 萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。嗣後，乙因不知債權讓與之事情，對甲清償 100 萬元，經甲受領，下列敘述，何者正確？", "opts": ["甲與丙之債權讓與無效", "乙之債務因清償而消滅", "應經丙承認，乙之債務始消滅", "甲與丙之債權讓與應經乙承認始生效"], "exp": ["✗A. 債權讓與為準物權行為，只要讓與人與受讓人合意即生效（§294 I），不因未通知而無效。", "✓B（本題答案）. §297 I：未經通知對債務人不生效力，債務人仍得向讓與人清償，乙善意對甲清償，債務因清償而消滅。", "✗C. 清償效力不須丙承認；§297 的保護對象是債務人，乙清償即生消滅效果。", "✗D. 債權讓與無須債務人同意或承認，§297 只是通知對債務人之對抗要件。", "★白話：沒通知債務人，債務人不知情付給舊債權人就算付對了；新債權人只能找舊債權人（不當得利）。陷阱：誤以為讓與要債務人同意。"]}, {"year": 113, "num": 12, "ans": "C", "acc": "", "note": "題幹僅稱土地、房屋遭『查封拍賣』，未明載已設定抵押；官方答案採§876「視為已有地上權設定」之結論，解析以§876 為準。強制執行程序之相關條文本次未核實。", "src": "ai", "stem": "甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？", "opts": ["丙可以請求丁拆屋還地", "丁必須承租丙之土地", "視為丁於土地上有地上權", "推定丙與丁間有使用借貸契約"], "exp": ["✗A. 依§876（視為已有地上權設定），房屋拍定人丁取得地上權，有權使用土地，丙不得請求丁拆屋還地。", "✗B. 丁與丙之間不是租賃（§425-1 是『推定』租賃，適用於房地分別讓與之情形）；此處依§876 為法律『視為』已設定地上權，丁並非必須向丙承租。", "✓C. §876 Ⅱ：土地及其土地上之建築物同屬一人所有，而以土地及建築物為抵押，如經拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定（地租、期間及範圍由當事人協議，不能協議得聲請法院判決）；丁於土地上有地上權，正確。", "✗D. 法律規定的效果是『視為已有地上權之設定』（§876），而非『推定使用借貸』；使用借貸（§464）須以物交付他方並約定無償使用，與本題無關。"]}, {"year": 114, "num": 8, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "關於無因管理之制度，下列何者非屬我國民法相關規範之內容？", "opts": ["無因管理人誤將客觀上屬於自己事務當作他人之事務，而為事務之管理者，不成立民法之無因管理", "無因管理人違反本人明示或可得推知之意思，代本人繳納贈與稅捐，得依民法第 176 條之規定，請求本人返還", "管理人為免除本人生命之急迫危險，因重大過失造成本人財產上之損害，亦無須負損害賠償的責任", "管理人明知為他人事務，卻違反本人明示或可得推知之意思或僅為自己利益，而為他人事務之管理者，本人主張管理事務之利益時，對管理人負第 176 條第 1 項之義務，以其所得利益為限"], "exp": ["✓A. 管理他人事務須有為他人管理之意思（§172），客觀上屬自己的事務並非『他人事務』，不成立無因管理。", "✓B. 代繳贈與稅屬為本人盡公益上義務，§174 II 不適用違反本人意思之規定，管理人依§176 II 仍得依§176 I 請求返還。", "✗C（本題答案）. §175：為免除本人生命、身體或財產上急迫危險而管理者，僅就惡意或重大過失負賠償責任，重大過失仍須負責。", "✓D. §177：管理不合§174時本人仍得享有利益，其義務以所得利益為限；明知為他人事務而為自己利益管理者準用之。", "★白話：救急可以減輕責任，但只減到『惡意或重大過失』才負責。陷阱：§175 免責的是輕過失，重大過失仍賠。"]}, {"year": 114, "num": 10, "ans": "C", "acc": "", "note": "", "src": "ai", "stem": "下述情形，何者不符合我國民法侵權行為之規定？", "opts": ["加害人因過失致直接被害人死亡，因直接被害人已喪失權利能力，無須對直接被害人負非財產上之損害賠償", "承攬人於執行承攬事務不法侵害他人之權利，除定作人於定作或指示有過失者，原則上定作人無須負損害賠償責任", "限制行為能力人不法侵害他人權利，且於行為時無識別能力，其法定代理人對被害人亦無須負擔賠償責任", "受僱人執行職務，因過失不法侵害他人之權利，如僱用人對於受僱人已盡選任、監督相當之注意義務，僱用人不負賠償責任"], "exp": ["✓A. 被害人本人死亡後已無權利能力，無從向其賠償非財產損害；§194 的慰撫金是賠給特定親屬。", "✓B. §189：承攬人執行承攬事項不法侵害他人，定作人原則上不負賠償責任，但定作或指示有過失者不在此限。", "✗C（本題答案）. §187 I：限制行為能力人行為時無識別能力者，由其法定代理人負損害賠償責任，並非免責。", "✓D. §188 I 但書：僱用人證明選任受僱人及監督其職務之執行已盡相當注意者，不負賠償責任。", "★白話：沒有識別能力的孩子惹禍，由爸媽賠；有識別能力則爸媽與孩子連帶賠（§187 I）。陷阱：誤以為無識別能力就沒人賠。"]}, {"year": 114, "num": 12, "ans": "B", "acc": "", "note": "", "src": "ai", "stem": "甲將房屋租給乙。下列何者正確？", "opts": ["租期若超過 1 年，且未寫書面契約，則租賃契約無效", "若未特別約定，則乙有權將其中的房間分租給丙", "若未特別約定，則乙有權將承租人的地位債權讓與給丙", "若雙方約定租期 3 年，3 年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"], "exp": ["✗A. §422：不動產租賃期限逾1年而未以字據訂立者，視為不定期租賃，並非無效。", "✓B（本題答案）. §443 I 但書：租賃物為房屋者，除有反對約定外，承租人得將其一部分轉租。", "✗C. 承租人地位屬契約承擔，須經出租人同意；單純債權讓與只能讓與租賃債權，不能讓與承租人整體地位。", "✗D. §451：租期屆滿後承租人仍使用收益，出租人不即表示反對者，視為以不定期限繼續契約，故得主張默示更新。", "★白話：房子可以分租『一部分』（除非約定禁止），整間轉租則須房東同意。陷阱：口頭租1年以上不是無效，是變不定期。"]}];
const TOTAL=85;
const SK='civlaw_official_b_v2';
let S={};
try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
const YEARS=[...new Set(QS.map(q=>q.year))].sort((a,b)=>a-b);
let aY='all',aF='all';
function isOK(q,L){return q.ans?L===q.ans:(q.acc?q.acc.includes(L):true)}
function gk(q){return q.year+'_'+q.num}
function getFilt(){
  return QS.filter(q=>{
    const k=gk(q),s=S[k];
    if(aY!=='all'&&q.year!==aY)return false;
    if(aF==='un')return!s;
    if(aF==='wrong')return s&&!s.ok;
    return true;
  });
}
function chips(){
  const c=document.getElementById('chips');c.innerHTML='';
  const all=mk('div','chip'+(aY==='all'?' active':''));
  all.textContent='全部 ('+TOTAL+')';
  all.onclick=()=>{aY='all';render()};
  c.appendChild(all);
  YEARS.forEach(y=>{
    const cnt=QS.filter(q=>q.year===y).length;
    const d=mk('div','chip'+(aY===y?' active':''));
    d.textContent=y+'年 ('+cnt+')';
    d.onclick=()=>{aY=y;render()};
    c.appendChild(d);
  });
}
function stats(){
  const done=QS.filter(q=>S[gk(q)]).length;
  const cor=QS.filter(q=>S[gk(q)]?.ok).length;
  document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function card(q){
  const k=gk(q),s=S[k];
  const c=mk('div','q-card');c.id='c_'+k;
  const hd=mk('div','q-head');
  hd.appendChild(mk('span','q-year',q.year+'年'));
  hd.appendChild(mk('span','q-num','第'+q.num+'題'));
  if(s){const b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}
  const st=mk('div','q-stem',q.stem);
  if(q.note){st.appendChild(mk('div','nl',q.note));}
  const op=mk('div','opts');
  ['A','B','C','D'].forEach((L,i)=>{
    const o=mk('div','opt');
    if(s){if(isOK(q,L))o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}
    o.appendChild(mk('span','opt-lbl',L+'.'));
    o.appendChild(mk('span','opt-txt',q.opts[i]));
    if(!s)o.onclick=()=>choose(q,L);
    op.appendChild(o);
  });
  const ex=mk('div','exp-block'+(s?' show':''));
  if(q.src==='ai'){ex.appendChild(mk('div','exp-line ainote','AI解析・條號已核對現行條文，考前以紙本六法為準'));}
  q.exp.forEach(ln=>{
    const d=mk('div','exp-line');
    if(ln.startsWith('✓'))d.classList.add('cl');
    else if(ln.startsWith('✗'))d.classList.add('wl');
    else if(ln[0]==='★'||ln[0]==='※')d.classList.add('nl');
    d.textContent=ln;ex.appendChild(d);
  });
  if(s){
    const tr=mk('div','err-tag');
    tr.appendChild(mk('span',null,'錯題分類：'));
    Object.assign(tr.lastChild.style,{fontSize:'11px',color:'var(--gray)'});
    [['a','A 法條混淆'],['b','B 粗心'],['c','C 真的不熟']].forEach(([k2,lbl])=>{
      const t=mk('span','etag',lbl);
      if(s.et===k2)t.classList.add(k2+'-on');
      t.onclick=()=>{s.et=(s.et===k2?null:k2);sv();renderCard(q)};
      tr.appendChild(t);
    });
    ex.appendChild(tr);
  }
  c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);
  return c;
}
function renderCard(q){
  const old=document.getElementById('c_'+gk(q));
  if(old)old.replaceWith(card(q));
}
function choose(q,ch){
  const k=gk(q);
  S[k]={ch,ok:isOK(q,ch)};sv();
  renderCard(q);
  document.getElementById('c_'+k)?.querySelector('.exp-block')?.scrollIntoView({block:'nearest'});
  stats();
}
function render(){
  chips();
  const qs=getFilt();
  const m=document.getElementById('main');
  m.innerHTML='';
  stats();
  if(!qs.length){m.innerHTML='<div class="empty">目前沒有符合條件的題目<br>請切換篩選條件或清除紀錄</div>';return}
  qs.forEach(q=>m.appendChild(card(q)));
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{
    const f=b.dataset.f;
    if(f==='clear'){if(!confirm('確定清除所有作答紀錄？'))return;S={};sv();aF='all';document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));document.querySelector('[data-f="all"]').classList.add('active')}
    else{aF=f;document.querySelectorAll('.fbtn:not(.danger)').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    render();
  };
});
render();
