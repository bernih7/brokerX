<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>民法 D篇（物權）99~106年 前期</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3E9;--card:#FFFDF7;--ink:#2A2722;--red:#A8402B;--gold:#BC8A2E;--green:#3A7D44;--blue:#2B5797;--gray:#8C8077;--border:#D9CEBD;--chip-bg:#EDE7D8;--chip-text:#5C5248}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.7}
header{background:var(--ink);color:#F8F3E9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700}
.ts{font-size:11px;color:#BBA99A}
.bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.fbtn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.fbtn.active{background:var(--ink);color:#F8F3E9;border-color:var(--ink)}
.fbtn.danger{border-color:var(--red);color:var(--red)}
.fbtn.danger:hover{background:var(--red);color:#fff}
.stat{margin-left:auto;font-size:12px;color:var(--gray);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.chip{padding:3px 10px;border-radius:12px;background:var(--chip-bg);color:var(--chip-text);font-size:12px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.chip.active{background:var(--ink);color:#F8F3E9}
.pbar-wrap{padding:0 16px 4px;background:var(--bg)}
.pbar{height:4px;background:var(--border);border-radius:2px}
.pbar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
main{padding:12px 16px;max-width:860px;margin:0 auto}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.q-year{font-size:11px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.q-num{font-size:11px;color:var(--gray)}
.q-stem{padding:12px 14px;font-size:14.5px;line-height:1.8;border-bottom:1px solid var(--border)}
.opts{padding:8px 14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent;transition:all .12s}
.opt:hover{background:#F0EAD9}
.opt.correct{border-color:var(--green);background:#EAF4EC}
.opt.wrong{border-color:var(--red);background:#F9EDED}
.opt-lbl{font-weight:700;min-width:22px;font-size:14px;color:var(--gray)}
.opt.correct .opt-lbl{color:var(--green)}
.opt.wrong .opt-lbl{color:var(--red)}
.opt-txt{font-size:14px;line-height:1.65}
.exp-block{padding:10px 14px 14px;border-top:1px solid var(--border);display:none}
.exp-block.show{display:block}
.exp-line{font-size:13px;line-height:1.75;padding:3px 0}
.exp-line.cl{color:var(--green);font-weight:500}
.exp-line.wl{color:var(--red)}
.exp-line.nl{color:var(--blue);font-style:italic;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px}
.err-tag{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.etag{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--gray);background:var(--chip-bg);transition:all .12s}
.etag.a-on{background:#8B4513;color:#fff;border-color:#8B4513}
.etag.b-on{background:var(--blue);color:#fff;border-color:var(--blue)}
.etag.c-on{background:var(--green);color:#fff;border-color:var(--green)}
.rbadge{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:auto}
.rbadge.ok{background:#EAF4EC;color:var(--green)}
.rbadge.ng{background:#F9EDED;color:var(--red)}
.empty{text-align:center;padding:48px 16px;color:var(--gray);font-size:14px}
footer{text-align:center;font-size:11px;color:var(--gray);padding:20px 16px;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>

<script>
const QS=[{"year": 99, "num": 11, "ans": "C", "stem": "甲欲購買乙所有房屋1棟，經數次磋商後，雙方同意以500萬元成交，並詳細約定付款及交屋、移轉所有權方式，由丙丁2人擔任見證人，且言明為免日後爭議應將約定內容寫成契約書。嗣後因乙反悔，結果連契約書都無法完成。則下列敘述何者正確？", "opts": ["甲乙買賣契約已成立，乙違反契約義務", "買賣房屋須以書面為之，否則不生效力，甲乙買賣契約無效", "雙方言明將約定寫成契約書，故須契約書完成後，買賣契約始成立", "甲乙已達口頭合意，買賣契約成立，並可直接辦理過戶"], "exp": ["✗A. 依題意，雙方言明「為免爭議應寫成契約書」，顯示以完成書面為契約成立要件，口頭合意尚非完整成立。", "✗B. 不動產買賣之「債權契約」並無法定書面要件（不要式），但本案另有問題。", "✓C. 當事人言明「以書面為契約成立要件」（§153Ⅱ），則契約書未完成前，買賣契約尚未成立，乙反悔使契約書無法完成，雙方買賣契約不成立，正確。★關鍵：當事人自行約定以書面為成立要件（「意定要式」），則書面完成前契約不成立。", "✗D. 雙方既言明以書面為要，口頭合意尚不足以成立契約，更無從直接辦理過戶。"]}, {"year": 99, "num": 21, "ans": "B", "stem": "下列有關公同共有之情形，何者不能準用分別共有之規定？", "opts": ["公同共有物之分割", "公同共有人應有部分之自由處分", "公同共有物之管理", "公同共有物分割後之權利義務關係"], "exp": ["✗A. 公同共有物分割，可準用分別共有分割規定（§831），A可準用。", "✓B. 公同共有人「並無應有部分」（此為與分別共有最根本的差異），無從「自由處分應有部分」，此點性質上無法準用，為正確答案。公同共有人對公同共有物之處分須全體同意，並無各自可自由處置的「應有部分」概念。", "✗C. 公同共有物之管理，可準用§820分別共有管理規定（§831），C可準用。", "✗D. 分割後各自取得獨立所有權，相關權利義務可準用，D可準用。"]}, {"year": 99, "num": 22, "ans": "D", "stem": "甲乙丙3人因繼承而共有祖傳土地1筆，應有部分各為三分之一，以下關於共有之敘述何者正確？", "opts": ["3人訂立禁止永世不得分割之契約，該契約如經登記，即可有效", "甲如欲以該筆土地設定抵押權，只要再得到乙丙其中1人同意即可", "乙可以在甲丙不知情下，將乙之應有部分出售並移轉登記與丁", "丙可以在甲乙不知情下，拋棄其應有部分"], "exp": ["✗A. §823Ⅱ，不分割之約定不得逾5年（約定管理逾30年亦有限制），「永世不得分割」超過法定上限，逾5年部分無效（縮短為5年），無論登記與否。", "✗B. 以「共有土地全體」設定抵押權（處分），須全體共有人同意（§819Ⅱ），並非過半數同意，本選項描述錯誤。", "✗C. 乙可以出售「自己的應有部分」（§819Ⅰ，各共有人得自由處分其應有部分），但移轉登記前須先符合通知手續；本選項描述「不知情下」出售應有部分，方向正確但「移轉登記」是否需通知有爭議，且考量其他共有人有優先購買權（§824-1），本選項不夠完整。", "✓D. 各共有人得「拋棄」其應有部分，不須其他共有人同意（§819Ⅰ），丙可在甲乙不知情下拋棄，正確。"]}, {"year": 99, "num": 23, "ans": "A", "stem": "甲乙丙丁共有土地1筆，應有部分各為四分之一，以下關於分管契約之敘述何者錯誤？", "opts": ["分管契約乃約定特定部分之共有物專歸特定共有人使用之契約，故其成立須得全體共有人同意始可", "不動產之分管契約如經登記，可以對抗應有部分之受讓人", "分管契約為債權契約", "分管契約除非另有約定，原則上隨同共有物之讓與而繼續"], "exp": ["✗A（本題答案）. 分管契約依§820共有物管理規定，須「共有人過半數及應有部分合計過半數」同意，或「應有部分合計逾2/3」同意即可，並非「全體」同意；本選項說「全體同意始可」，過度限縮，與§820規定不符，為錯誤選項，即應選答案。", "✓B. 不動產分管契約經登記，可對抗後來受讓之第三人，正確。", "✓C. 分管契約為債權契約（具體分配使用範圍），並非物權，正確。", "✓D. 分管契約隨共有物讓與而繼續（買受人知悉分管契約時受拘束），正確。"]}, {"year": 99, "num": 24, "ans": "B", "stem": "XYZ 3人共有土地1筆，各有應有部分三分之一，三人協議分割該筆土地，於6月2日達成協議，8月20日完成登記。以下敘述何者錯誤？", "opts": ["在無法令或約定禁止分割之情形下，任何共有人均得隨時請求分割共有物", "當事人間於6月2日即取得各自分得部分之所有權", "協議分割須登記，始生物權效力", "達成分割協議前，各共有人均有使用共有物全部之權利"], "exp": ["✓A. §823Ⅰ，各共有人得隨時請求分割（無法令或約定禁止時），正確。", "✗B（本題答案）. 協議分割不動產，須完成「登記」才生物權效力（§758），並非於協議達成日（6月2日）即取得各自所有權；須至8月20日登記完成才生效，本選項說「6月2日即取得所有權」錯誤，為應選答案。", "✓C. 不動產物權依法律行為取得，須「書面」且「登記」（§758Ⅱ），正確。", "✓D. 分割前各共有人可使用共有物全部（§818），正確。"]}, {"year": 99, "num": 27, "ans": "D", "stem": "以下關於不動產所有權之敘述何者正確？", "opts": ["甲於6月15日因其父過世而繼承土地，至10月5日始辦畢繼承登記，則甲於10月5日取得該筆土地之所有權", "甲於自己所有土地上興建房屋，因與鄰地之境界不明，以致圍牆部分逾越疆界坐落於乙所有之土地上，甲一律不需要拆除越界之圍牆", "不動產所有人對於無權占有或侵奪其不動產者，得請求返還之；對於妨害其所有權者，得請求除去之；有妨害其所有權之虞者，不得請求防止之", "時效取得不動產所有權，應向地政機關聲請登記"], "exp": ["✗A. 繼承取得不動產所有權，「因繼承」（非因法律行為，§759）取得，不以登記為要件；甲於6月15日父過世時即取得所有權，非至登記日10月5日，選項說10月5日取得錯誤。", "✗B. 越界建築（§796），若土地所有人係「非因故意或重大過失」逾越疆界，且鄰地所有人知其越界而不即時提出異議，才不得請求移去；並非「一律不需要拆除」，故意或重大過失越界時仍須拆除。", "✗C. §767物上請求權，不動產所有人對「有妨害之虞」者，「得請求防止之」，本選項說「不得請求防止」相反，錯誤。", "✓D. §769（現行規定），時效取得不動產所有權，應向地政機關聲請登記（非直接取得），正確。"]}, {"year": 99, "num": 30, "ans": "A", "stem": "以下關於最高限額抵押權之敘述何者正確？", "opts": ["最高限額抵押權所擔保之債權，包含因一定關係所生之不特定債權或基於票據所生之權利", "我國最高限額抵押權係採本金最高限額", "基於抵押權之從屬性，最高限額抵押權所擔保之任何1筆債權一旦讓與他人，最高限額抵押權亦隨之移轉", "最高限額抵押權所擔保之債權確定後，抵押人仍得繼續使用抵押物"], "exp": ["✓A. §881-1，最高限額抵押權所擔保之債權，以因「一定法律關係」所生之債權或「基於票據所生之權利」為限，正確。", "✗B. 我國最高限額抵押權採「債權最高限額」（包含本金、利息、違約金等），並非單純「本金最高限額」，選項描述錯誤。", "✗C. 最高限額抵押權所擔保債權原則上不得單獨讓與（§881-7，原債權確定前，抵押人與抵押權人一定條件下得讓與，但一般個別債權讓與並不當然帶走最高限額抵押權），選項描述過於絕對且方向有誤。", "✗D. 債權確定後與一般抵押權相同，此時抵押人仍可繼續使用抵押物（抵押不妨礙使用收益），此點本身正確；但相比A，A更精確說明最高限額抵押權擔保範圍之特殊性，官方以A為正解。"]}, {"year": 99, "num": 38, "ans": "C", "stem": "關於夫妻財產制之敘述何者錯誤？", "opts": ["除法定財產制外，夫妻可以約定為共同財產制或分別財產制", "夫妻約定財產制時，應以書面為之", "夫妻約定財產制不須登記可以對抗第三人", "共同財產制之下，除夫妻特有財產以外之財產合併為共同財產，屬夫妻公同共有"], "exp": ["✓A. §1005，夫妻得約定共同財產制或分別財產制，正確。", "✓B. §1007，夫妻財產制契約之訂立、變更或廢止，應以書面為之，正確。", "✗C（本題答案）. §1008，夫妻財產制契約之訂立等，「非經登記，不得對抗第三人」，未登記不得對抗第三人，本選項說「不須登記可以對抗」，與法條相反，錯誤，為應選答案。", "✓D. §1031，共同財產制下，除特有財產外，夫妻財產合併為共同財產，為夫妻公同共有，正確。"]}, {"year": 99, "num": 39, "ans": "D", "stem": "甲死亡，留有總計5000萬元之現金存款，但同時積欠銀行7000萬元債務未清償，其妻早已死亡，子女有乙丙丁戊4人。以下敘述何者正確？", "opts": ["在一般情形，因為遺產不足清償債務，不足之2000萬元應由乙丙丁戊4人平均分攤", "乙如欲拋棄繼承，應於知悉繼承後3個月內，向法院以書面為之", "在一般情形，乙丙丁戊4人繼承後，各自取得1250萬元之財產", "在一般情形，乙丙丁戊4人僅以繼承所得之遺產（5000萬元）負清償責任"], "exp": ["✗A. 現行民法採「限定繼承」（§1148Ⅱ），繼承人對被繼承人債務，以繼承所得遺產為限負責，不足部分由繼承人自己承擔（舊法才有全面繼承債務的問題），選項說「應分攤不足2000萬元」與現行法不符。", "✗B. §1174，拋棄繼承應「知悉繼承後3個月內向法院為之」——「知悉」非「被繼承人死亡後」，且應以「書面」為之，選項說「知悉後3個月」正確，但現行修法須注意細節；官方以D為最正確。", "✗C. 遺產僅5000萬元，須先清償7000萬債務，在清償後若有剩餘才分配，淨值為負，各繼承人「得不到財產」，選項「各取1250萬元」錯誤。", "✓D. §1148Ⅱ，繼承人對被繼承人之債務，以因繼承所得遺產為限負清償責任（法定限定繼承），乙丙丁戊4人合計最多以5000萬元遺產清償，超過部分不須自負，正確。"]}, {"year": 100, "num": 10, "ans": "A", "stem": "甲為定作人，與乙訂立承攬契約，由乙為甲建一房屋。關於此案例，下列敘述何者正確？", "opts": ["乙得就承攬之報酬額，對於將來完成之甲之房屋，請求預為抵押權之登記", "工作未完成前，定作人甲不得隨時終止契約", "定作人甲所供給之材料，因不可抗力而毀損者，承攬人乙須負其責", "如果工作完成後有瑕疵，甲只能請求乙修繕，而不能請求損害賠償"], "exp": ["✓A. §513，承攬人得就承攬報酬對於工作物「請求預為抵押權登記」（不動產工程承攬特別保護），正確。", "✗B. §511，工作未完成前，定作人「得隨時終止契約」（但須賠償承攬人損害），本選項說「不得」錯誤。", "✗C. 定作人供給之材料因不可抗力毀損，除非因承攬人特殊保管義務，否則由定作人（材料所有人）承受風險，並非承攬人負責，選項錯誤。", "✗D. 瑕疵擔保除修繕外，依§495，還可請求損害賠償（如瑕疵不能修繕或承攬人拒絕修繕），選項「只能請求修繕」過度限縮，錯誤。"]}, {"year": 100, "num": 22, "ans": "D", "stem": "下列何者，非基於所有權而發生之請求權？", "opts": ["所有物返還請求權", "所有權之妨害除去請求權", "所有權之妨害預防請求權", "占有物之返還請求權"], "exp": ["✗A. 所有物返還請求權（§767Ⅰ前段），基於所有權發生，屬所有人之物上請求權。", "✗B. 妨害除去請求權（§767Ⅰ中段），基於所有權發生，屬物上請求權。", "✗C. 妨害預防請求權（§767Ⅰ後段），基於所有權發生，屬物上請求權。", "✓D. 占有物返還請求權（§960）係基於「占有」而生，並非基於所有權，占有人不必然是所有人亦得行使此權，正確。★物上請求權（§767）基於所有權；占有保護（§960）基於占有——兩者分清。"]}, {"year": 100, "num": 23, "ans": "D", "stem": "關於普通抵押權之敘述，下列何者錯誤？", "opts": ["抵押權之設定須以書面為之，並辦理登記", "抵押人設定抵押權時，對於抵押物須有所有權及處分權", "以抵押權所擔保之債權，經讓與其一部者，抵押權仍不受影響", "於抵押權所擔保之債權全部被清償時，抵押權仍不消滅"], "exp": ["✓A. §758Ⅱ，不動產物權之取得（含抵押權設定）應以書面登記，正確。", "✓B. 設定抵押權屬處分行為，須有所有權及處分權，正確。", "✓C. 債權讓與一部，抵押權仍擔保剩餘部分，不受影響（§870），正確。", "✗D（本題答案）. 抵押權從屬於擔保債權，擔保債權「全部清償消滅」，抵押權因從屬性隨之消滅（無本之末），選項說「仍不消滅」與從屬性原則相反，錯誤，為應選答案。"]}, {"year": 100, "num": 24, "ans": "B", "stem": "下列關於地上權之敘述，何者正確？", "opts": ["稱普通地上權者，謂以在他人土地之上下有建築物或種植竹木為目的而使用其土地之權", "地上權不因建築物或其他工作物之滅失而消滅", "地上權人均得隨時拋棄其權利", "土地所有權讓與時，已預付之地租，均不得對抗第三人"], "exp": ["✗A. §832，普通地上權是「在他人土地之上下有建築物或工作物或種植竹木」為目的，選項說「或種植竹木」本身正確，但選項省略「工作物」，不夠完整；另地上權包含「土地上下」空間，選項表述有不夠精確之處，官方以B為正解。", "✓B. §841，地上權「不因建築物或其他工作物之滅失而消滅」，地上權是獨立物權，存否取決於設定及消滅事由，而非建物是否存在，正確。", "✗C. §835Ⅱ，地上權「有支付地租之約定」者，若欲拋棄須支付未到期3年分地租；並非均得隨時拋棄，本選項過於絕對。", "✗D. §838-1，土地所有權讓與時，地上權人已「預付之地租」，「非經登記」不得對抗受讓人，並非「均不得對抗」（登記後可對抗），選項過於絕對，錯誤。"]}, {"year": 100, "num": 26, "ans": "B", "stem": "甲死亡，遺留房屋一棟，有乙、丙二位繼承人。下列敘述何者正確？", "opts": ["未分割前，該屋為乙、丙分別共有", "移轉登記前，乙、丙即取得該屋所有權，然而應經登記，始得處分之", "若該屋被無權占有，乙、丙須共同向無權占有人起訴請求返還", "若乙、丙於繼承前於該屋上有抵押權，該抵押權因混同而當然消滅"], "exp": ["✗A. 繼承所得遺產在分割前，繼承人為「公同共有」（§1151），並非分別共有。", "✓B. §759，因繼承取得不動產，不以登記為要件，即繼承發生時乙丙即取得所有權；但§759Ⅱ，未辦理登記前「不得處分」，正確。", "✗C. 公同共有物被無權占有，公同共有人「各得單獨」請求返還（§821，各共有人得單獨訴請返還全部），無須共同起訴，選項說「須共同起訴」錯誤。", "✗D. 混同（§344）：同一人同時為債權人及債務人；若繼承人（如乙）「本人」是抵押權人，繼承後兼為所有人，才會混同；本選項說乙丙「繼承前於該屋上有抵押權」繼承後是否混同，視抵押權人與繼承人是否同一人，未必當然混同，且公同共有情形更複雜，選項描述過於絕對。"]}, {"year": 100, "num": 27, "ans": "B", "stem": "下列關於動產之敘述，何者錯誤？", "opts": ["甲以占有之意思，占有被遺棄之流浪狗，甲取得該狗之所有權", "公園管理員在所管理之公園內拾得遺失物者，對遺失人不得請求報酬", "甲乙各有一桶白油漆，不慎混合在一起，二人應按其混合時之價值，共有混合後之油漆", "加工於他人之動產者，其加工物之所有權，原則上屬於材料所有人"], "exp": ["✓A. §802，以所有意思占有無主動產（遺棄物），取得其所有權（先占），流浪狗若屬無主物，甲取得所有權，正確。", "✗B（本題答案）. §807-1，「公園管理員」（機關人員）在其管理之公有地拾得遺失物，「不得請求報酬」——本選項說「不得請求報酬」，此描述與法條一致應為正確，但官方答案為B；可能本題設計上B選項有特定細節爭議。以官方答案B為準，備考注意「拾得人」之報酬請求權相關規定（§807-1、§805-1），機關人員在執行職務中拾得，不得請求報酬。", "✓C. §813，動產混合，各所有人按其混合時價值比例共有，正確。", "✓D. §814，加工原則上加工物所有權歸材料所有人（加工人取得加工物所有權僅為例外），正確。"]}, {"year": 100, "num": 28, "ans": "B", "stem": "甲將其所有之A車借給乙，不久卻將A車贈與給乙，則甲對乙得以何種方式交付A車？", "opts": ["現實交付", "簡易交付", "占有改定", "指示交付"], "exp": ["✗A. 現實交付（§946Ⅰ）：讓與人將動產直接移轉給受讓人，須將物實際交付，此處乙已占有A車，並非現實交付。", "✓B. 簡易交付（§761Ⅱ）：受讓人（乙）「已占有」該動產時，由當事人「意思表示」即生交付效力，不需再為現實移轉，本題甲已借車給乙占有，現改為贈與，只需意思表示即完成交付，正確。", "✗C. 占有改定（§761Ⅱ後段）：讓與人讓與後繼續占有（以其他法律關係為由占有），本題甲讓與後不再占有，並非此情形。", "✗D. 指示交付：讓與人對「第三人」有返還請求權，讓與該請求權給受讓人，本題無第三人介入。★交付四種：現實、簡易（受讓人已占有）、占有改定（讓與人繼續占有）、指示（讓與對第三人之返還請求權）。"]}, {"year": 101, "num": 12, "ans": "A", "stem": "出賣人甲依其與買受人乙間之動產買賣契約，於約定之日合法提出給付，卻遭乙拒絕受領。依實務見解，就乙拒絕受領之法律效果，下列敘述何者最正確？", "opts": ["甲得解除契約", "甲不得向乙請求繼續保管給付物之必要費用", "甲得拋棄對該動產之占有", "甲對標的物之保管，僅就故意負責"], "exp": ["✓A. 乙受領遲延後，甲得依§241定期催告後解除契約，正確（買受人拒絕受領→受領遲延→出賣人得解除）。", "✗B. §240，受領遲延後，甲因保管標的物所支出之必要費用，「得向乙請求」，本選項說「不得請求」錯誤。", "✗C. 甲雖可拋棄對動產之占有（§767以下），但拋棄占有不代表解除義務，且動產拋棄後所有權消滅，此方式未必有利，且此非受領遲延的標準法律效果；官方以A為最正確答案。", "✗D. §241，受領遲延後甲之責任減輕為「故意或重大過失」才負責（非僅故意），選項「僅就故意負責」描述不夠完整。"]}, {"year": 101, "num": 14, "ans": "A", "stem": "甲、乙、丙三人分別共有一筆A土地，三人就A地約定各自得使用之特定部分，且於二十年內不得請求分割。下列敘述何者最正確？", "opts": ["如甲使用部分在約定不得請求分割期間內被徵收，甲仍得隨時請求分割", "不得分割之約定逾五年，無效，三人應重新約定", "不得分割之約定須經登記，對於後來受讓應有部分之人始生效力", "甲乙丙若有一人死亡，不得分割之約定失效"], "exp": ["✓A. §823Ⅱ但書，約定不分割，但因情事變更（如徵收），共有人仍得隨時請求分割，正確。", "✗B. §823Ⅱ，約定不分割，期限不得逾「五年」（一般土地），逾五年者「縮短為五年」，並非全部無效（僅超過部分縮短），且不需重新約定，選項說「無效、應重新約定」不正確。", "✗C. 不動產分管/不分割約定，依§826-1，經登記後對後來之應有部分受讓人有效；本選項說「須登記對受讓人才生效」，描述方向正確但官方以A為最正確答案。", "✗D. 一人死亡，其應有部分由繼承人繼承，不分割約定隨之繼承，並不失效，選項錯誤。"]}, {"year": 101, "num": 15, "ans": "C", "stem": "甲以其土地設定地上權於乙後，乙以該地上權設定抵押權於丙。下列敘述何者最正確？", "opts": ["原則上如乙未得甲之同意，丙所設定之抵押權無效", "如乙繼承甲之土地，地上權因混同而消滅", "非得丙之同意，乙不得拋棄其地上權", "甲不須乙、丙同意，得自由拋棄其土地所有權"], "exp": ["✗A. 地上權人（乙）得以地上權設定抵押權（§882），不須得土地所有人（甲）同意，丙之抵押權有效，選項錯誤。", "✗B. 乙繼承甲之土地，地上權與土地所有權同歸乙，一般會發生混同（地上權消滅）；但有第三人（丙）就地上權有抵押權，為保護丙之利益，依§762但書，地上權「不消滅」，選項說「因混同消滅」錯誤。", "✓C. 地上權上設有抵押權時，地上權人（乙）拋棄地上權，將損害抵押權人（丙）之利益，故「非得丙之同意，乙不得拋棄地上權」（§835-1），正確。", "✗D. 甲（土地所有人）拋棄土地所有權，亦可能損害地上權人乙及抵押權人丙，且所有人拋棄所有權本身有諸多限制，選項說「不須同意得自由拋棄」過於絕對，不正確。"]}, {"year": 101, "num": 16, "ans": "A", "stem": "甲以其土地設定地上權於乙。下列敘述何者最正確？", "opts": ["定有期限之地上權原則上不因建築物於所定期限內滅失而消滅", "甲、乙間不得設定未定有期限之地上權", "甲、乙間不得設定未定有地租之地上權", "因不可抗力致妨礙土地之使用時，乙得請求減免租金"], "exp": ["✓A. §841，地上權不因建築物或其他工作物之滅失而消滅（地上權存否取決於設定與法定消滅事由，而非工作物存否），正確。", "✗B. 地上權可以設定「未定期限」（§833-1規定未定期限時如何處理），民法並未禁止，選項錯誤。", "✗C. 地上權可以不約定地租（有無地租均可），選項說「不得設定未定有地租之地上權」錯誤。", "✗D. §835，因不可抗力妨礙土地使用，地上權人「得請求免除或減少地租」（前提是有地租約定），選項說「減免租金」方向正確但表述為「減免」，官方以A為最正確；另外需注意是「免除或減少」，選項D說「減免」近似正確，但不如A精確。"]}, {"year": 101, "num": 35, "ans": "A", "stem": "甲向乙借款500萬元，並將所有之A地設定普通抵押權給乙，下列敘述何者最正確？", "opts": ["乙就A地賣得之價金有優先受償之權", "乙得僅將抵押權讓與給第三人丙，而保留對甲之借款返還債權", "抵押權不因登記之先後定其次序，具有平等性", "甲若將A地讓與給丁，抵押權隨即消滅"], "exp": ["✓A. §860，抵押權人就抵押物賣得之價金，有優先於其他債權人受清償之權，正確。", "✗B. §870，抵押權隨同債權移轉，不得與債權分離而單獨讓與（從屬性），乙不得僅讓與抵押權而保留債權，選項錯誤。", "✗C. §865，同一不動產上有數個抵押權時，依其登記先後定其次序（先登記者次序在先），並非「平等」，選項錯誤。", "✗D. §867，抵押人（甲）得讓與不動產（A地）所有權（讓與所有權不消滅抵押權），抵押權隨物存在（對物之權，而非對人之權），讓與後抵押權仍存在，選項說「抵押權隨即消滅」錯誤。"]}, {"year": 101, "num": 39, "ans": "A", "stem": "甲在自己之院子栽種梨樹一棵，結滿果實，一陣大風吹過，將部分果實吹落到鄰居之A庭院中；乙為A庭院之承租人，丙為A庭院之所有權人。問：誰取得吹落到A庭院果實之所有權？", "opts": ["甲", "乙", "丙", "乙與丙共同取得"], "exp": ["✓A. 果實屬天然孳息，依§70Ⅰ，天然孳息於「分離」時，由「有收取權利之人」取得所有權；梨樹屬甲，甲有收取孳息之權，果實分離（落地）時歸甲所有——即使偶然落入他人庭院，所有權仍屬梨樹所有人甲（不因落在哪裡就改變所有權），正確。", "✗B. 乙為承租人，無收取天然孳息之權（除非出租人特別授權），不取得所有權。", "✗C. 丙為A庭院所有人，但庭院並非梨樹之地，丙無天然孳息收取權。", "✗D. 無論是乙或丙，均非梨樹有收取孳息之人，均不取得所有權。★關鍵：天然孳息→由有「收取權」之人取得（通常是原物所有人），與孳息落在哪裡無關。"]}, {"year": 101, "num": 40, "ans": "C", "stem": "甲有A地一筆，設定地上權於乙，下列敘述何者最正確？", "opts": ["若乙積欠地租達一年之總額時，甲得不經催告終止地上權", "乙原則上不得將地上權讓與第三人丙，但地上權之期限逾二十年者，不在此限", "因不可抗力而妨礙A地之使用時，乙不得請求甲減少地租", "地上權因建築物之滅失而消滅"], "exp": ["✗A. §836Ⅰ，積欠地租「達二年之總額」（非一年），甲才得終止地上權（且須催告後仍不支付），選項「一年」及「不經催告」均有誤。", "✗B. §838，地上權人「得將其權利讓與他人」（原則可讓與），除非契約另有約定，並無「逾20年才可讓與」的限制，選項描述錯誤。", "✓C. §835，「因不可抗力致妨礙土地之使用時」，地上權人得「請求免除或減少地租」；但本選項說「不得請求」，與法條相反，故C為「錯誤」描述——等等，本題問的是「最正確」不是「錯誤」……依官方答案C為正解，重新審視：§835原文，因不可抗力致妨礙土地使用，地上權人「得請求免除或減少租金」——這和選項C說「不得請求甲減少地租」剛好相反，C是「錯誤」陳述；但若本題問的是「最正確」，C似為應選之正確選項……以官方答案C為準，備考請記§835：不可抗力→得請求減免（C說「不得請求」→C是錯的，但官方選C，可能題目問「最正確/錯誤」有特定設計，以官方C為準）。★以官方標準答案C為準。", "✗D. §841，地上權不因建築物之滅失而消滅，選項錯誤。"]}, {"year": 102, "num": 7, "ans": "B", "stem": "甲為A地的所有權人，乙為A地的抵押權人，丙為A地的地上權人。關於當事人間的權利義務，下列敘述何者錯誤？", "opts": ["乙的抵押權設定後，甲仍得將A地設定地上權給丙", "若乙的抵押權設定在地上權之後，日後乙實行抵押權受有影響時，法院得除去丙的地上權後拍賣", "乙實行抵押權時，就甲所分得之價金有優先受償之權", "丙的地上權得為乙的抵押權所及"], "exp": ["✓A. 抵押人（甲）設定抵押權後，仍可繼續處分抵押物（§867），包含設定地上權給丙，正確（但抵押人的處分不能對抗抵押權）。", "✗B（本題答案）. §866Ⅱ，抵押權「設定在後」之用益物權（地上權等），若其存在使抵押權人受影響，法院得除去之——但本選項說「乙的抵押權設定在地上權之後」，即地上權在前、抵押權在後，應反過來：此時抵押權不能除去先成立的地上權（先成立者優先），不符合§866Ⅱ除去條件，本選項描述錯誤，為應選答案。", "✓C. 抵押權實行，乙就拍賣所得（扣除費用後）有優先受償，正確。", "✓D. 地上權設定在後（若在抵押權之後），屬抵押物處分，可能受抵押權影響，地上權得為抵押權效力所及（§862），正確。"]}, {"year": 102, "num": 8, "ans": "D", "stem": "甲所有的A地與乙所有的B地相鄰，甲在A地上建築房屋及圍牆，其中圍牆有一部分越界建築在B地上。下列敘述何者正確？", "opts": ["乙如果知道甲有越界建築之情事而不即提出異議者，不得請求甲拆除越界的圍牆", "甲對於乙所受之損害，應支付償金，但得不拆除越界的圍牆", "乙可以請求甲拆除越界的圍牆，無論甲是否出於故意或重大過失", "越界建築時，乙可以請求甲購買越界部分之B地"], "exp": ["✗A. §796，「非因故意或重大過失」越界建築，鄰地所有人「知其越界而不即提出異議」，才不得請求拆除；若甲係「故意」越界，A選項的保護不適用，乙仍得要求拆除，本選項說不加限制的「不得請求拆除」過於絕對，錯誤。", "✗B. §796，非故意非重大過失越界，鄰地所有人不即提出異議者，不得請求拆除；甲應支付償金（使用B地的對價），但本選項說「得不拆除」，須有不提出異議的前提，不是所有情形都可不拆，且應由「法院斟酌」決定（§796-1），選項過度簡化。", "✗C. §796，「故意或重大過失」越界建築，乙得請求拆除；「非因故意或重大過失」且乙不即提出異議，才不得請求拆除，本選項說「無論過失與否都可拆」錯誤。", "✓D. §796-1，甲（非故意非重大過失）越界建築，乙可以要求甲購買越界部分之土地，正確。"]}, {"year": 102, "num": 10, "ans": "B", "stem": "甲有一宗土地，與乙訂立買賣契約，將該宗土地賣給乙。雙方訂立買賣契約後，因土地飆漲，甲藉故不願履行契約上之義務。乙起訴請求甲移轉買賣標的物之所有權，法院判決乙勝訴確定。下列敘述何者正確？", "opts": ["乙因法院之判決，取得不動產物權，故於判決確定時，即已取得該土地之所有權", "乙雖獲得勝訴之判決，仍須向地政機關辦理不動產登記後，始能取得該土地之所有權", "乙依法院之判決，無須甲之配合，即可直接辦理不動產之登記", "乙持判決書，自得直接在交易市場上出賣該土地"], "exp": ["✗A. §758Ⅱ，不動產物權之得喪變更，非經登記不生效力；判決（即使確定）本身並非「因法律行為」取得，但判決請求移轉登記的情形，並非§759規定的「因判決」直接取得，乙須辦理登記後才取得所有權，A說「判決確定即取得」錯誤。", "✓B. 乙雖獲勝訴（命甲辦理移轉登記），仍須向地政機關辦理登記，始取得所有權，正確。", "✗C. 依判決辦理登記，須持判決書向地政機關申請，地政機關仍須審核，並非「無須甲配合直接辦理」——但實務上持確定判決可單方聲請，此選項需分辨：持勝訴確定判決，乙「可單方」聲請登記，但仍須向地政機關辦理，並非跳過登記程序。", "✗D. 乙未完成登記前尚未取得所有權，無法在交易市場以所有人身分出賣，選項錯誤。"]}, {"year": 102, "num": 11, "ans": "D", "stem": "甲有一棟房屋，與乙訂立買賣契約，將該房屋賣給乙。下列敘述何者正確？", "opts": ["買賣契約有效成立時，立刻使乙取得房屋之所有權", "甲將房屋交付給乙時，立刻使乙取得房屋之所有權", "甲將房屋所有權狀交付給乙前，乙無法取得房屋之所有權", "甲將房屋所有權移轉登記給乙前，乙無法取得房屋之所有權"], "exp": ["✗A. 買賣契約（債權行為）成立，不移轉所有權，乙尚未取得房屋所有權。", "✗B. 不動產（房屋）所有權移轉，以「登記」為生效要件（§758），僅「交付占有」並不移轉所有權，選項錯誤（動產才以交付移轉所有權）。", "✗C. 所有權狀只是行政證明文件，交付所有權狀並不等於辦理登記，並非取得所有權之要件，選項錯誤。", "✓D. 不動產所有權移轉，非經「登記」（§758Ⅱ），不生效力，甲完成移轉登記前，乙無法取得所有權，正確。"]}, {"year": 102, "num": 12, "ans": "C", "stem": "甲死亡時，遺有子女乙、丙二人為繼承人，及房屋一棟。下列敘述何者正確？", "opts": ["甲對房屋之所有權，並不因甲死亡，而發生所有權之移轉", "房屋為不動產，乙丙二人非經登記，無法取得房屋所有權", "乙丙二人縱使未辦理登記，仍然因繼承而取得房屋所有權", "乙丙二人縱使未辦理登記，仍然因繼承而取得房屋所有權，並且得以處分該所有權"], "exp": ["✗A. 被繼承人死亡，繼承開始，繼承人即承受被繼承人之財產（§1148Ⅰ），所有權因繼承而移轉，選項說「不發生移轉」錯誤。", "✗B. §759，非因法律行為（如繼承、強制執行、判決）取得不動產物權者，不以登記為要件，繼承取得不動產所有權「不以登記為要件」，選項說「非經登記無法取得」錯誤。", "✓C. 繼承為非依法律行為取得不動產（§759），乙丙未辦理登記，仍因繼承取得房屋所有權，正確。", "✗D. §759Ⅱ，繼承人取得不動產（未登記），「不得處分」（處分須先登記），選項說「得以處分」錯誤。"]}, {"year": 102, "num": 14, "ans": "D", "stem": "甲、乙、丙三人共有一筆A地，應有部分各三分之一。下列敘述何者錯誤？", "opts": ["甲、乙二人得在未經丙同意的情況下，將A地出售與丁建設公司", "甲、乙二人得在未經丙同意的情況下，將A地出租與戊使用", "甲得在未經乙、丙同意的情況下，將其A地的應有部分設定抵押權", "甲、乙二人得在未經丙同意的情況下，將A地分割予甲、乙2人"], "exp": ["✓A. §819Ⅱ，共有物之處分（出售）須全體共有人同意——本題甲乙合計2/3，過半數及應有部分過半數，但「處分」（出售）須「全體」同意（§819Ⅱ），不適用多數決……但本選項說「得未經丙同意出售」，依§819Ⅱ須全體同意，A似為錯誤；然官方答案為D，以D為準。", "✓B. §820，共有物管理（出租屬管理行為），以多數決（過半數共有人及應有部分合計過半數）為之，甲乙合計2/3，可以，正確（可未經丙同意出租）。", "✓C. §819Ⅰ，各共有人得自由處分其「應有部分」，甲可單獨就自己應有部分設定抵押，正確。", "✗D（本題答案）. 共有物分割屬重大決定，「協議分割」須全體共有人同意，甲乙二人未經丙同意不得分割，本選項說「得未經丙同意分割」錯誤，為應選答案。"]}, {"year": 102, "num": 18, "ans": "B", "stem": "甲有一幅臺灣著名畫家之名畫，市值新臺幣500萬元，借給乙在畫展中展覽，並未委託乙出售。丙觀賞該名畫，愛不釋手，不知該畫是乙向甲借的，於是向乙表示願出新臺幣700萬元請乙割愛，乙就以新臺幣700萬元將該畫賣給丙，並以移轉所有權之意思交付給丙。", "opts": ["丙因善意取得而取得該名畫之所有權，甲無從主張任何物上請求權", "丙雖善意，但善意取得須以受讓人為「善意」，由於丙以700萬元購買，顯示丙可能為惡意，故丙不能善意取得", "丙因善意取得而取得該名畫之所有權，但甲仍得依債權之規定向丙主張返還", "甲得依善意取得制度向丙主張返還，並得向乙依侵權行為請求損害賠償"], "exp": ["✓A→ 官方答案為B，需重新分析。依§801、§948善意取得：①丙善意（不知乙無處分權）②乙以移轉所有權意思交付③動產（名畫）→丙善意取得所有權。但本題關鍵：乙借畫展覽（使用借貸），乙「占有」且以移轉所有權意思交付，似符合善意取得要件。", "✗B（本題答案官方選B）. 以700萬元高價購買（原值500萬），可能顯示丙「可知」乙無權處分（高於市值購買者可能非善意），依§944Ⅱ，占有人如有可得而知之情事，不得主張善意；官方以此認定丙不能善意取得，B為官方答案。★備考：善意取得需受讓人「善意」（無過失），丙以高於市值價格購買，若被認定可得而知乙無處分權，則不能主張善意取得。", "✗C. 甲依所有物返還請求權（§767）向丙主張，而非「依債權規定」，且若丙已善意取得，甲無從對丙主張。", "✗D. 善意取得後甲失去對物之請求權（若善意取得成立），且甲不能「依善意取得」向丙主張（善意取得是丙取得所有權，甲失去主張基礎）。"]}, {"year": 102, "num": 21, "ans": "A", "stem": "甲所有的A屋蓋在乙已登記的B地上18年。下列敘述何者正確？", "opts": ["乙可向甲主張B地的所有物返還請求權，請求甲拆屋還地", "已經超過15年，乙不可向甲主張B地的所有物返還請求權，請求甲拆屋還地", "甲可主張時效取得B地的所有權", "甲如為善意且無過失之占有人，可以主張時效取得B地的所有權"], "exp": ["✓A. 乙對已登記的B地有所有物返還請求權（§767），不動產所有物返還請求權「不罹於消滅時效」（對已登記不動產之物上請求權不適用消滅時效），乙隨時得請求甲拆屋還地，正確。", "✗B. 物上請求權對「已登記」不動產不適用消滅時效（最高法院判例），超過15年（一般請求權消滅時效）並不影響，乙仍可請求，選項錯誤。", "✗C. §770，時效取得不動產所有權，限於「未登記」之不動產；B地已登記，甲無法時效取得，選項錯誤。", "✗D. 同C，B地已登記，不論甲是否善意無過失，均無法時效取得已登記不動產之所有權。★重點：已登記不動產→物上請求權不罹消滅時效，也不能被時效取得。"]}, {"year": 102, "num": 26, "ans": "C", "stem": "甲所有的古董花瓶為乙所盜並寄放在丙的古董店裡展售，嗣後為顧客丁所買。關於當事人之間的權利義務，下列敘述何者錯誤？", "opts": ["丙出售古董花瓶的行為，須經甲的承認始生效力", "不知情的顧客丁因丙的受讓移轉，取得古董花瓶的所有權", "該古董花瓶係盜贓物，甲得於古董花瓶喪失占有後15年間，向丁請求返還", "甲可向乙依侵權行為請求損害賠償"], "exp": ["✓A. 丙以寄售名義出售（無授權），屬無權處分（§118），須甲承認才生效，正確。", "✓B. 丁在古董店善意購買，符合§801、§948善意取得（善意、有償、占有移轉），取得所有權，正確。", "✗C（本題答案）. §949，盜贓物（甲被盜）若由善意受讓人取得，所有人（甲）得向受讓人請求回復，時間為「2年內」（§949：盜贓或遺失物，被害人或遺失人自喪失占有時起2年內請求回復），本選項說「15年間」錯誤，正確時限為2年，為應選答案。", "✓D. 乙竊盜行為侵害甲之所有權（§184），甲得依侵權行為向乙請求賠償，正確。"]}, {"year": 102, "num": 27, "ans": "A", "stem": "甲向乙購買房屋，雙方簽訂買賣契約後，乙將房屋交付於甲，但尚未辦理所有權移轉登記，突然發生地震致使房屋全毀。下列敘述何者正確？", "opts": ["甲雖未取得房屋所有權，但仍需交付約定之房屋價金", "甲因未取得房屋所有權，故毋需交付約定之房屋價金", "甲已受領房屋之交付，故取得房屋所有權", "甲雖已受領房屋之交付，但未辦妥登記，故其僅取得房屋之占有，而無庸繳納房屋價金"], "exp": ["✓A. §373，危險自「交付」時移轉於買受人，房屋已交付甲，地震造成滅失的危險由甲承受；甲仍須依約給付價金（§373），雖未取得所有權（未登記），但危險已在甲，甲應付款，正確。", "✗B. 危險已移轉甲（交付後），甲不能以「未取得所有權」為由拒付，選項錯誤。", "✗C. 不動產（房屋）所有權移轉須登記（§758），僅交付占有並不取得所有權，選項錯誤。", "✗D. 如A所述，危險隨交付移轉，甲「仍須繳納價金」，選項後半段「無庸繳納」錯誤。"]}, {"year": 102, "num": 28, "ans": "B", "stem": "甲所有的A地因通行之需在乙的B地上設定不動產役權。下列敘述何者錯誤？", "opts": ["甲得將A地設定抵押權與丙銀行", "甲得將B地上的不動產役權單獨讓與給丁", "嗣後A地分割並讓與，為戊、己所有，戊、己皆享有B地上的不動產役權", "嗣後B地分割並讓與，各受讓人就各自分得部分均受不動產役權之拘束"], "exp": ["✓A. 甲以A地（需役地）設定抵押，與B地（供役地）不動產役權無衝突，得設定，正確。", "✗B（本題答案）. §853，不動產役權「不得由需役地分離而單獨讓與」（不得與需役地分離），故甲不得單獨讓與不動產役權於丁（必須隨A地讓與），本選項說「甲得單獨讓與」錯誤，為應選答案。", "✓C. §855，需役地（A地）分割，各分割部分均受不動產役權之利益（役權隨需役地分割而及於各部分），戊己均享有，正確。", "✓D. §855，供役地（B地）分割，各部分均繼續承受不動產役權之負擔，正確。"]}, {"year": 102, "num": 36, "ans": "D", "stem": "關於不動產所有權取得時效，下列敘述何者錯誤？", "opts": ["應以所有之意思", "應和平公然繼續占有", "應占有他人未登記之不動產", "時效完成即取得不動產所有權"], "exp": ["✓A. §769，以「所有之意思」和平公然繼續占有，為時效取得不動產要件，正確。", "✓B. 和平（無暴力）、公然（公開）、繼續占有，均為必要條件，正確。", "✓C. 時效取得不動產，限於「他人未登記之不動產」，已登記不動產不能時效取得（§770），正確。", "✗D（本題答案）. 時效取得不動產，時效完成後，僅取得「請求登記為所有人」之權利，須「向地政機關聲請登記」後才取得所有權（§769），並非「時效完成即取得」，選項錯誤，為應選答案。"]}, {"year": 103, "num": 3, "ans": "C", "stem": "下列何種權利屬於準物權？", "opts": ["農育權", "商標權", "漁業權", "典權"], "exp": ["✗A. 農育權屬於民法物權編明文之「用益物權」，並非準物權。", "✗B. 商標權屬「智慧財產權」（無形財產權），性質上非物權亦非準物權。", "✓C. 漁業權依漁業法規定設立，性質上準用物權規定（具有排他性、可讓與等物權特性），屬「準物權」，正確。★準物權：礦業權、漁業權、水權等，依特別法準用物權規定。", "✗D. 典權為民法物權編明文規定之物權（§911以下），屬真正物權，而非準物權。"]}, {"year": 103, "num": 16, "ans": "A", "stem": "關於共有物分割，下列敘述何者正確？", "opts": ["共有物依共有人協議分割時，並不適用多數決原則", "共有人以契約訂有不分割之期限者不得逾十年；逾十年者，縮短為十年", "共有之不動產，其契約訂有管理之約定時，約定不分割之期限，不得逾五十年；逾五十年者，縮短為五十年", "不動產共有物之分割方法，任何共有人均得聲請法院以價金補償方式為之"], "exp": ["✓A. 共有物「協議」分割，須全體共有人同意（§824Ⅰ），不適用多數決（多數決只適用於管理行為），正確。", "✗B. §823Ⅱ，不分割約定不得逾「五年」（一般情形），逾五年縮短為五年；本選項說「十年」錯誤。", "✗C. §823Ⅱ但書，「有管理之約定」之不動產共有，不分割期限不得逾「三十年」（逾三十年縮短為三十年），選項說五十年錯誤。", "✗D. §824Ⅱ，裁判分割由法院決定方式（原物分割或變賣補償），並非任何共有人均得指定為價金補償，法院有裁量權，本選項說「任何共有人均得聲請」以特定方式過於絕對。"]}, {"year": 103, "num": 19, "ans": "B", "stem": "關於合夥人出資及合夥財產，下列敘述何者正確？", "opts": ["合夥人之出資，得為金錢，其他財產權或勞務，但不得以信用代之", "合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任", "合夥人之出資及其他合夥財產，為合夥人全體分別共有之集合財產", "合夥因損失而至資本虧蝕，各合夥人仍毋需補充出資"], "exp": ["✗A. §667，合夥人出資得為金錢、「其他財產權、勞務、信用」或其他利益，「信用」亦得作為出資，選項說「不得以信用代之」錯誤。", "✓B. §681，合夥財產不足清償合夥債務時，各合夥人對不足額「連帶」負責，正確。", "✗C. §668，合夥人出資及合夥財產為「公同共有」（非分別共有），正確描述應為公同共有，選項錯誤。", "✗D. §679，合夥損失致資本虧蝕，合夥人有補充出資之義務（除非合夥契約另有約定），選項說「毋需補充」錯誤。"]}, {"year": 103, "num": 20, "ans": "D", "stem": "甲自行出資建造違章建築房屋一幢，將之出售予乙，並已交付乙占有。但事後甲對乙主張其為所有權人，請求乙返還房屋。下列敘述何者正確？", "opts": ["甲之請求為無理由，因為違章建築是違法行為，甲無法取得該屋所有權", "甲之請求為有理由，因為違章建築買賣是違法行為，買賣契約無效，乙無法律上之原因持有房屋", "甲之請求為有理由，因甲未移轉所有權登記給乙，甲仍為所有權人，故有物上請求權", "甲之請求為無理由，因甲已交付且移轉事實上處分權給乙，故甲非有權請求乙返還之人"], "exp": ["✗A. 違章建築雖不能登記，但建造人仍取得「事實上處分權」（實務上的所有權地位），甲並非無法取得建物支配地位，選項錯誤。", "✗B. 違章建築買賣並非當然無效（實務上有效），乙有合法購買之原因，並非「無法律上原因」，選項錯誤。", "✗C. 違章建築未登記，甲「原建造人」是「事實上處分權人」，但甲既已出售並交付乙，事實上處分權已移轉給乙，甲不能再以「原建造人」主張返還，選項方向有誤。", "✓D. 依實務見解，違章建築買賣有效，以「移轉事實上處分權」替代所有權移轉；甲既已交付並移轉事實上處分權給乙，甲無從再主張返還（甲已無正當請求基礎），正確。"]}, {"year": 103, "num": 22, "ans": "D", "stem": "關於越界建築之處理，下列敘述何者正確？", "opts": ["土地所有人建築圍牆時因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其圍牆", "土地所有人建築圍牆時非因重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其圍牆", "越界建築，鄰地所有人得請求適當的償金，如不以償金補償而拆除者，須負損害賠償之責", "土地所有人建築房屋非因故意或重大過失逾越地界，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋"], "exp": ["✗A. §796，保護條件為「非因故意或重大過失」越界；「因重大過失」越界，鄰地所有人仍可請求拆除，本選項把重大過失也納入保護，錯誤。", "✗B. §796保護範圍為「非因故意或重大過失」，「僅非重大過失」不足（還需同時非故意），且須鄰地所有人知其越界而不即時異議，本選項漏掉「非故意」的條件，描述不完整。", "✗C. 鄰地所有人請求的是「償金」，而非「拆除後賠償損害」，法律架構是以償金換取不拆除，選項描述方向錯誤。", "✓D. §796，土地所有人建築房屋「非因故意或重大過失」越界，鄰地所有人知其越界而不即提出異議，不得請求移去或變更房屋，正確（注意：圍牆與房屋略有不同規定，§796適用房屋）。"]}, {"year": 103, "num": 23, "ans": "C", "stem": "甲在其土地上為乙設定眺望不動產役權，其後甲未獲得乙之同意又為丙設定地上權，丙預備在該地上建築房屋，若該房屋建成，乙之眺望權將因而受到影響，下列敘述，何者正確？", "opts": ["應不許丙設定地上權", "縱然設定地上權，亦屬無效", "地上權人不許在該地上建築房屋", "設定地上權有效，但丙在其地上興建房屋，受乙之不動產役權之限制"], "exp": ["✗A. 甲在設定不動產役權後，仍可再設定地上權（抵押人可繼續處分財產），物權法不禁止，選項錯誤。", "✗B. 地上權設定並非無效，兩種物權均有效，只是效力有先後優先關係，選項錯誤。", "✓C→D為官方答案. 依物權優先原則（先設定者優先），不動產役權（先設定）優先於地上權（後設定）；丙取得地上權後，其行使受眺望役權拘束，不得建築阻礙乙眺望之房屋，故官方答案D「設定地上權有效，但丙受乙之不動產役權限制」較C正確。", "✓D. 地上權設定有效，但丙行使地上權（包含建築行為）受先設定之眺望不動產役權拘束，不得妨礙乙之眺望，正確，為官方答案。"]}, {"year": 103, "num": 24, "ans": "B", "stem": "關於地上權，下列敘述何者正確？", "opts": ["普通地上權乃以在他人土地上下之一定空間範圍內有建築物或其他工作物為目的而使用其土地之權", "地上權定有期限，而有支付地租之約定者，地上權人得支付未到期之三年分地租後，拋棄其權利", "地上權人得將其權利設定權利質權。但契約另有約定或性質不許者，不在此限", "依民法規定，設定地上權不得定有期限"], "exp": ["✗A. §832，普通地上權是「以在他人土地『上下』有建築物、工作物或竹木為目的」——選項說「一定空間範圍內」為「區分地上權」（§841-1）的特徵，混淆了普通地上權與區分地上權。", "✓B. §835，有地租約定之地上權，欲拋棄時，地上權人需支付「未到期三年地租後」方可拋棄（補償土地所有人），正確。", "✗C. 地上權為用益物權（使用收益性質），並不得設定「權利質權」（§899-1，設定質權之客體為可讓與之債權、其他權利——地上權得設定抵押權§882，但設定質權有爭議），一般地上權人設定的是「抵押權」而非「質權」，選項說「設定質權」有誤。", "✗D. 地上權可定有期限，亦可未定期限（§833-1），選項說「不得定有期限」錯誤。"]}, {"year": 103, "num": 25, "ans": "B", "stem": "甲將土地為乙設定典權並交付之，其後甲將該地出賣與丙，乙主張有權以相同條件購買，此權利稱為：", "opts": ["找貼權", "留買權", "回贖權", "絕賣權"], "exp": ["✗A. 找貼權：典價低於土地時價，出典人（甲）得請求典權人找貼差額，性質不同。", "✓B. §919，出典人（甲）將典物（土地）出賣於他人（丙），典權人（乙）有「留買權」（得以同樣條件留買典物），此即留買權，正確。", "✗C. 回贖權：出典人於典期屆滿後，以原典價將典物「贖回」之權，性質不同。", "✗D. 絕賣：典期屆滿逾一定期間不回贖，典物所有權歸典權人，非本題情形。"]}, {"year": 103, "num": 27, "ans": "D", "stem": "下列何者不屬於直接占有人？", "opts": ["房屋承租人", "土地之典權人", "汽車之受委託保管人", "為雇主駕駛汽車之司機"], "exp": ["✗A. 承租人直接使用、占有租賃物，為直接占有人，正確（屬直接占有）。", "✗B. 典權人支付典價取得不動產使用收益，為直接占有人（對典物有直接管領力），正確（屬直接占有）。", "✗C. 受委託保管汽車者對汽車有直接管領，為直接占有人，正確（屬直接占有）。", "✓D. 司機為雇主駕駛汽車，係「輔助占有人」（§942，占有輔助人），司機僅依雇主指示駕駛，無獨立占有意思，其管領的利益歸屬於雇主（雇主為直接占有人），司機本身「不屬於」直接占有人，正確為應選答案。★輔助占有（§942）：在從屬關係下為他人管領者，不具有獨立占有地位。"]}, {"year": 103, "num": 28, "ans": "B", "stem": "下列何種權利，不得單獨成為抵押權之標的物？", "opts": ["地上權", "不動產役權", "農育權", "典權"], "exp": ["✗A. §882，地上權「得為」抵押權之標的（得以地上權設定抵押），A可以，選項排除。", "✓B. 不動產役權（§851以下）係附隨於需役地而存在，不得與需役地分離（§853），故「不得單獨」成為抵押權標的物，正確，為應選答案。", "✗C. §882，農育權「得為」抵押權標的，C可以，選項排除。", "✗D. §882，典權「得為」抵押權標的，D可以，選項排除。★記法：地上權、農育權、典權均可單獨抵押（§882）；不動產役權因附隨性不得單獨抵押。"]}, {"year": 103, "num": 30, "ans": "D", "stem": "下列關於最高限額抵押權之敘述，何者正確？", "opts": ["得有效約定最高限額係指本金最高限額", "得約定凡是書面契約所生之債權，均屬擔保範圍", "得約定凡是新臺幣100萬元以下之債權，均屬擔保範圍", "得經抵押人之同意，將最高限額抵押權讓與他人"], "exp": ["✗A. 最高限額抵押權係「債權最高限額」（擔保本金加計利息、違約金等合計之最高額），並非僅「本金最高限額」，選項錯誤。", "✗B. §881-1，最高限額抵押權擔保範圍須限定於「一定法律關係所生之債權」或「基於票據所生之權利」，以「書面契約所生之所有債權」為範圍過於不特定，不符合法定要件，選項錯誤。", "✗C. 以「金額上限」（100萬以下）為擔保範圍，缺乏「法律關係」的連結，不符§881-1要件，選項錯誤。", "✓D. §881-7，最高限額抵押權原則上得讓與（原債權確定後，抵押人同意）；依§881-7之規定，最高限額抵押權確定前得讓與他人，但須具備一定條件（通常需抵押人同意），正確。"]}, {"year": 103, "num": 32, "ans": "B", "stem": "設定抵押權時，土地及其土地上之建築物，同屬於一人所有，而以土地及建築物為抵押者，如經拍賣，其土地與建築物之拍定人各異時，關於拍定人間之關係，下列敘述何者正確：", "opts": ["視為已有不動產役權之設定", "視為已有地上權之設定", "視為取得使用借貸權", "視為取得租賃權"], "exp": ["✗A. 不動產役權是需役地與供役地之間的關係，本題為土地與建物拍賣後之關係，性質不同。", "✓B. §877-1，土地及其上建物同屬一人，以土地及建物為抵押，拍賣後由不同人拍得，「視為」已設定地上權（保護建物所有人使用土地之權益），正確。★§877-1「視為地上權」。", "✗C. 使用借貸為債之關係，而§877-1明定「視為地上權」（物權），選項錯誤。", "✗D. 租賃關係適用於§425-1（買賣分離情形，且為「推定」），本題為抵押拍賣，適用§877-1（「視為」地上權），選項法律關係錯誤。"]}, {"year": 103, "num": 33, "ans": "A", "stem": "夫妻之財產及所得，除特有財產外，合併為共同財產者，屬於下述何種所有型態？", "opts": ["夫妻公同共有", "夫妻分別共有", "夫妻區分所有", "夫妻總體共有"], "exp": ["✓A. §1031，夫妻共同財產制下，除特有財產外，夫妻之財產「合併為共同財產，屬夫妻公同共有」，正確。", "✗B. 分別共有是各人有確定應有部分比例的共有，夫妻共同財產無此結構，選項錯誤。", "✗C. 區分所有指各自就建物特定部分有所有權（如公寓），與夫妻財產制無關，選項錯誤。", "✗D. 「總體共有」並非民法用語，選項錯誤。"]}, {"year": 104, "num": 2, "ans": "D", "stem": "承上（甲與乙通謀虛偽將A地移轉登記乙，乙再賣給丙完成登記），嗣後丙將A地又賣給丁，並完成移轉登記。A地之所有權應屬何人？", "opts": ["甲", "乙", "丙", "丁"], "exp": ["✗A. 甲乙通謀虛偽，甲乙間移轉無效，但丙、丁為後手。", "✗B. 乙為通謀虛偽之人，不能因此成為真正所有人。", "✗C. 丙為甲乙通謀無效之後手，但丙如為善意第三人（§87Ⅰ但書），丙取得所有權；丙再讓與丁，丁完成登記。", "✓D. 丙善意取得後，取得有效所有權；丙再讓與丁並完成登記，丁為最終登記名義人，善意取得所有權，正確。不動產善意第三人保護：通謀虛偽不得對抗善意第三人（§87Ⅰ但書），丙善意取得後再讓與丁，丁有合法所有權。"]}, {"year": 104, "num": 7, "ans": "B", "stem": "債權人甲不得代位其債務人乙，行使乙對第三人丙之何項權利？", "opts": ["不動產登記請求權", "扶養請求權", "實行抵押權", "提起訴訟之權利"], "exp": ["✗A. 不動產登記請求權具有財產性，可代位行使，A可代位。", "✓B. 扶養請求權屬「一身專屬權」（§242但書），甲不得代位乙行使對丙之扶養請求，正確，為應選答案。", "✗C. 抵押權之實行係財產性權利，可代位行使，C可代位。", "✗D. 訴訟行為（如起訴請求）係保全財產之行為，原則上可代位行使，D可代位。★一身專屬權不得代位（§242但書）：扶養請求、離婚請求、撤銷婚姻等身分權。"]}, {"year": 104, "num": 22, "ans": "D", "stem": "甲有名筆一枝，其子乙將甲之筆賣給知情之丙，乙、丙於104年9月28日簽訂買賣契約，惟尚未交付。嗣後，乙又於104年10月10日將甲之筆賣給不知情之丁並交付之。甲於104年11月1日死亡，乙是甲之唯一繼承人。試問：", "opts": ["丁善意取得名筆之所有權", "丙善意取得名筆之所有權", "乙繼承甲之後，名筆所有權仍屬甲之繼承財產", "乙繼承甲之後，無權處分之瑕疵補正，名筆所有權屬丙"], "exp": ["✗A. 丁善意取得須以「交付」時善意（§948）；丁雖已受交付，但無論丁是否善意，本題後續另有甲死亡乙繼承的事實，需進一步分析。", "✗B. 丙購買時尚未交付，且丙知情（惡意），丙不符善意取得要件，丙亦無法取得。", "✗C. 甲死亡，乙唯一繼承人，乙繼承甲之所有財產（包含名筆），但乙已處分名筆給丁（已交付），此時名筆已非甲之遺產（已交付丁），選項描述不精確。", "✓D. 乙繼承甲後，成為名筆所有人（補正了原來無權處分之身份），乙與丙原先的買賣契約（債權行為）雖有效，且乙繼承後取得處分權，「無權處分之瑕疵補正」（§118Ⅱ），乙丙間買賣之物權效力應補正生效——但問題是丁已取得交付……依官方答案D，乙繼承補正後名筆所有權補正歸丙（丙先買賣在前，補正後效力溯及），正確。"]}, {"year": 104, "num": 25, "ans": "D", "stem": "關於添附，下列敘述，何者正確？", "opts": ["動產因附合而為不動產之重要成分者，動產及不動產所有人，共有該動產所有權", "動產與他人之動產附合，非毀損不能分離，或分離需費過鉅者，各動產所有人，按其動產附合時之比例，比例高者取得合成物之所有權", "動產與他人之動產混合，非毀損不能分離，或分離需費過鉅者，各動產所有人，各取得其混合物之所有權", "加工於他人之動產者，其加工物之所有權，原則上屬於材料所有人"], "exp": ["✗A. §811，動產附合於不動產成為重要成分，動產「所有權消滅」，由「不動產所有人」取得，並非共有，選項錯誤。", "✗B. §812，動產與動產附合，成合成物，各動產所有人「按附合時之價值，共有合成物」，並非比例高者單獨取得，選項錯誤。", "✗C. §813，動產混合，準用§812，各所有人「按混合時之價值，共有混合物」，並非各取得各自部分，選項錯誤。", "✓D. §814，加工原則上，加工物屬材料所有人（例外：加工之費用超過材料價值時，歸加工人），正確。"]}, {"year": 104, "num": 26, "ans": "B", "stem": "甲將其單獨所有之土地的特定部分出售予乙後，如該土地無不可分割之限制時，乙得如何請求甲履行其移轉所有權之義務？", "opts": ["請求甲移轉登記按該特定部分計算之土地應有部分，與甲共有該土地", "請求甲將該特定部分分割後移轉登記與乙", "乙得選擇請求甲為上述或之任一種", "甲應先以分割為前提，再移轉所有權"], "exp": ["✗A. 買受人「特定部分」，原則上買受人應取得「該特定部分獨立所有權」而非應有部分（分別共有），但分割前確以應有部分先行移轉是過渡方案，此非最精確主張。", "✓B. 最正確方式：甲應先辦理「分割」（使特定部分成為獨立地號），再「移轉登記」該部分給乙，使乙取得該特定部分之完整所有權，正確。", "✗C. 「選擇」並非正確描述，乙應請求甲分割後移轉，而非二擇一，選項不精確。", "✗D. 描述方向正確（先分割再移轉），但此為出賣人（甲）的義務而非乙的主張前提，且選項語氣不準確，官方以B為最正確答案。"]}, {"year": 104, "num": 27, "ans": "B", "stem": "甲、乙、丙三人各有應有部分三分之一分別共有A地。下列敘述，何者正確？", "opts": ["甲得以其應有部分供第三人丁設定不動產役權", "三人協議分割達成合意之履行請求權，有消滅時效之適用", "甲須以共有人過半數及應有部分合計過半數之同意，始得請求分割", "甲得以共有人過半數及應有部分合計過半數之同意，將全體A地出售於第三人"], "exp": ["✗A. 不動產役權附隨於需役地（§853），以「應有部分」設定不動產役權有爭議——應有部分係抽象比例，無特定使用空間，難以設定需要具體位置的役權，一般認為不動產役權須對整體共有物設定，選項描述不準確。", "✓B. 協議分割契約成立後，各共有人間的「履行請求權」（請求對方依協議辦理登記）有消滅時效（15年，§125）之適用，正確。", "✗C. 請求分割共有物（§823Ⅰ）：各共有人「隨時」均得請求，無需其他共有人同意，本選項說「須過半數同意」錯誤。", "✗D. 共有物處分（出售）須「全體共有人同意」（§819Ⅱ），而非「過半數及應有部分合計過半數」，選項將管理行為多數決規則誤用於處分，錯誤。"]}, {"year": 104, "num": 28, "ans": "C", "stem": "關於區分所有建築物，下列敘述，何者錯誤？", "opts": ["稱區分所有建築物者，謂數人區分一建築物而各專有其一部，就專有部分有單獨所有權，並就該建築物及其附屬物之共同部分共有之建築物", "區分所有建築物共有部分，指區分所有建築物專有部分以外之其他部分及不屬於專有部分之附屬物", "專有部分及共有部分可以分離讓與", "專有部分得為區分所有人共有"], "exp": ["✓A. §799，區分所有建築物之定義：數人區分，就專有部分有單獨所有權，並就共同部分共有，正確。", "✓B. §799Ⅱ，共有部分指專有部分以外之其他部分及不屬於專有部分之附屬物，正確。", "✗C（本題答案）. §799-1，專有部分與共有部分「不得分離讓與」（一體性），選項說「可以分離讓與」與法條相反，錯誤，為應選答案。", "✓D. §799，專有部分本身得為數人共有（如夫妻共有一間套房），正確。"]}, {"year": 104, "num": 29, "ans": "C", "stem": "甲以其土地設定不動產役權於乙後，復以同一土地之一部分設定普通地上權於丙。丙之普通地上權的效力如何？", "opts": ["當然無效", "當然有效、且其效力優先於乙之不動產役權", "無妨害乙之不動產役權時，當然有效", "乙、丙各自之用益物權的優先效力，由所有權人甲決定之"], "exp": ["✗A. 後設定地上權並非無效（物權不衝突即並存），選項過於絕對，錯誤。", "✗B. 依物權「先設定者優先」原則，不動產役權（先設定）優先於地上權（後設定），並非地上權效力優先，選項錯誤。", "✓C. 後設定之地上權，「無妨害已設定不動產役權時」，地上權有效；若行使地上權會妨礙不動產役權，則地上權之行使受限，正確。", "✗D. 物權效力依法律規定（先設定優先），並非由所有人甲決定，選項錯誤。"]}, {"year": 104, "num": 30, "ans": "A", "stem": "甲以A地設定抵押權於乙，擔保其對乙所負債務後，復將A地設定地上權於丙，由丙於A地上建築房屋。甲屆期無力清償債務，乙實行對A地之抵押權時，抵押權人實行抵押權受有影響者。下列敘述，何者正確？", "opts": ["法院得除去丙之地上權，乙於必要時並得聲請法院將A地及A地上之建築物合併拍賣，對A地建築物之拍賣價金，無優先受償之權", "法院得除去丙之地上權，並不得聲請法院將A地及A地上之建築物合併拍賣", "法院不得除去丙之地上權，乙得聲請法院將A地及A地上之建築物合併拍賣，對A地建築物之拍賣價金，有優先受償之權", "法院不得除去丙之地上權，乙不得聲請法院將A地及A地上之建築物合併拍賣"], "exp": ["✓A. §866，抵押權設定後，抵押人設定地上權（後設定），若影響抵押權實行，法院得「除去地上權」後拍賣；另依§877，乙（抵押土地）得聲請併付拍賣建築物，但對建築物拍賣價金「無優先受償之權」（優先受償只在土地部分），正確。", "✗B. 得除去地上權部分正確，但「不得聲請合併拍賣」錯誤（§877得聲請），選項不完整。", "✗C. 法院「得」除去後設定之地上權（§866），本選項說「不得」錯誤。", "✗D. 兩者均否定，均錯誤，選項不正確。"]}, {"year": 104, "num": 32, "ans": "B", "stem": "下列關於最高限額抵押權之敘述，何者正確？", "opts": ["為避免法律關係複雜，最高限額抵押權不得共有", "原債權確定前，抵押權人與抵押人得約定變更其債務人", "最高限額抵押權人得讓與其抵押權次序與後次序抵押權人", "原債權確定前，抵押權人得任意分割最高限額抵押權之一部與他人"], "exp": ["✗A. §881-9，最高限額抵押權「得為共有」，選項說不得共有，錯誤。", "✓B. §881-7，原債權確定前，當事人得約定變更「債務人」（但須抵押人及抵押權人同意），正確。", "✗C. 次序讓與（讓與抵押次序給後次序人）與「讓與最高限額抵押權」不同，且次序讓與有複雜條件，選項描述混淆，不正確。", "✗D. §881-7，最高限額抵押權之分割，須經當事人約定並非任意為之，且有特定要件，選項說「得任意分割」過於絕對，錯誤。"]}, {"year": 105, "num": 21, "ans": "C", "stem": "有關物權之優先性，在同一標的物下，下列敘述何者正確？", "opts": ["當所有權與定限物權併存時，所有權之效力依舊優先於定限物權", "當內容或性質相衝突之物權併存時，二者效力均等", "先成立用益物權，再設定擔保物權時，該擔保物權不得對抗該已成立之用益物權", "先成立擔保物權，再設定用益物權時，用益物權人之權利不受任何限制"], "exp": ["✗A. 所有權與定限物權（如地上權、抵押權）並存，定限物權優先於所有權（定限物權是在限制所有權的範圍內發揮效力），選項說「所有權優先」錯誤。", "✗B. 同一標的物上相衝突之物權，以設定先後（登記先後）定優先順序（先設定者優先），並非均等，選項錯誤。", "✓C. 先成立用益物權（如地上權），後設定擔保物權（如抵押權），擔保物權人實行擔保時受先成立用益物權之拘束，不得對抗先設定之用益物權，正確。", "✗D. 先成立擔保物權（如抵押），後設定用益物權（如地上權），實行擔保時用益物權若影響抵押，法院得除去後設定之用益物權（§866），用益物權人並非不受任何限制，選項錯誤。"]}, {"year": 105, "num": 22, "ans": "D", "stem": "民法第796條規定，土地所有人建築房屋非因故意或重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋。假設甲僅有抽象輕過失，且乙知其越界未即提出異議，下列敘述何者正確？", "opts": ["甲將自己之廚廁建於鄰地所有人乙之部分土地上，甲得向乙請求購買越界部分之乙地", "甲建築之越界房屋，無庸支付任何費用，即可使用乙之土地", "越界建築中，乙僅得請求損害賠償，不得請求甲支付償金", "乙雖不得請求甲移去越界房屋，但乙得請求甲支付償金，且此償金請求權時效為15年"], "exp": ["✗A. §796-1，越界建築時，「鄰地所有人」（乙）得請求甲購買越界部分，並非甲得請求乙出售，主動權在乙，選項主客顛倒，錯誤。", "✗B. §796，甲雖因乙不即提出異議而不需拆除，但仍須「支付償金」（使用鄰地的對價），並非無庸支付，選項錯誤。", "✗C. 乙得請求的是「償金」（相當於地租的補償），並非損害賠償，選項說「僅得請求損害賠償」錯誤（且二者描述相反）。", "✓D. 乙不得請求拆除（已不即提出異議），但仍得請求甲支付「償金」（§796）；償金請求權性質上為財產權請求權，消滅時效為15年（§125一般消滅時效），正確。"]}, {"year": 105, "num": 23, "ans": "D", "stem": "有關地上權之敘述，下列何者正確？", "opts": ["地上權乃為債權", "地上權人必須支付地租", "地上權之存續期間，有法定最長20年之限制", "地上權人原則上得將其權利讓與他人或設定抵押權"], "exp": ["✗A. 地上權為「物權」（用益物權，§832以下），不是債權，選項錯誤。", "✗B. 地上權可以「無償」（不支付地租），有無地租由當事人約定（§836），並非必須支付，選項錯誤。", "✗C. 民法並未規定地上權最長20年（租賃有最長20年限制§449，但地上權無此上限），選項錯誤。", "✓D. §838，地上權人「得將其權利讓與他人」或「設定抵押權」，但契約另有約定或性質不許者除外，原則上可讓與及抵押，正確。"]}, {"year": 105, "num": 24, "ans": "D", "stem": "民法規定，區分地上權人得與其設定之土地上下有使用、收益權利之人，約定相互間使用收益之限制。其約定未經土地所有人同意者，於使用收益權消滅時，土地所有人不受該約定之拘束。此之「其設定之土地上下有使用、收益權利之人」不包含下列何種？", "opts": ["普通地上權人", "不動產役權人", "農育權人", "典權人"], "exp": ["✗A. 普通地上權人在地上有使用收益，與區分地上權可能衝突，屬「土地上下有使用收益權利之人」，包含之。", "✗B. 不動產役權人對供役地有一定使用權，屬有使用收益之人，包含之。", "✗C. 農育權人對土地有使用收益，屬有使用收益之人，包含之。", "✓D. 典權人（§911）就典物有使用收益，亦屬有使用收益之人，包含之——等等，D才是「不包含」的正確答案。依官方答案D，典權人「不包含」在「土地上下有使用收益之人」的涵蓋範圍，可能因典權人係就「不動產整體」使用，而非就「土地上下特定空間範圍」，故區分地上權（上下空間）的衝突對象不包含典權，官方以D為正解。"]}, {"year": 105, "num": 25, "ans": "C", "stem": "以他人不動產供自己不動產通行、汲水、採光、眺望、電信或以其他特定便宜之用者，稱為：", "opts": ["農育權", "抵押權", "不動產役權", "土地租賃權"], "exp": ["✗A. 農育權（§850-1）：以農作、牧畜、養殖、造林等為目的之用益物權，非本題情形。", "✗B. 抵押權：擔保物權，非用益物權，與本題使用他人不動產性質不同。", "✓C. §851，「不動產役權」：以他人不動產（供役地）供自己不動產（需役地）通行、汲水、採光、眺望、電信等便宜之用，正確。", "✗D. 土地租賃權：以支付租金為對價使用土地，不具物權性質，且與本題「供他人不動產使用」之役權結構不同。"]}, {"year": 105, "num": 27, "ans": "A", "stem": "有關抵押權之實行，下列敘述何者正確？", "opts": ["土地所有人於設定抵押權後，在抵押之土地上營造建築物者，抵押權人於必要時，得於強制執行程序中聲請法院將其建築物與土地併付拍賣，對於建築物之價金，無優先受清償之權", "以建築物設定抵押權者，於法院拍賣抵押物時，其抵押物上之地上權消滅", "以抵押權擔保之債權，於時效完成後30年，抵押權方消滅", "抵押物受有損害時，抵押人無須補充擔保物，以確保抵押之價值"], "exp": ["✓A. §877，抵押土地（設定後）其上有建築物，抵押權人得聲請「併付拍賣」建築物，但「對建築物拍賣所得無優先受償之權」（優先受償僅在土地部分），正確。", "✗B. 建築物設定抵押並拍賣後，建築物上的地上權若在抵押設定前已存在，應視情況而非當然消滅，選項過度概括，錯誤。", "✗C. §880，抵押權之消滅：擔保債權時效完成後「5年」不實行，抵押權消滅；並非「30年」，選項錯誤。", "✗D. §871，抵押物受損害致擔保不足，抵押權人得請求抵押人「回復原狀或提出相當擔保」，並非無義務補充，選項錯誤。"]}, {"year": 105, "num": 28, "ans": "D", "stem": "乙將其所有汽車為甲設定動產質權，以為其對甲借款債務之擔保。該車並已交付甲之占有。下列那種情形，甲之動產質權並不消滅？", "opts": ["丙仗義相助幫乙清償該債務", "甲將該車返還給乙", "甲喪失對該車之占有，於第3年始請求返還", "該車被盜後，隔年再讓與給善意第三人"], "exp": ["✗A. 主債務（乙的借款）清償後，擔保質權（從屬性）隨之消滅，甲之質權消滅。", "✗B. §897，質權人（甲）將質物返還給出質人（乙），質權消滅（質物交還等同質權放棄），選項是使質權消滅之情形。", "✗C. §898，質權人喪失占有，須「自喪失占有時起2年內」請求返還，逾2年喪失質權；題目說第3年才請求，已超過2年，質權消滅，選項是使質權消滅之情形。", "✓D. 質物被盜後讓與給善意第三人，「隔年再讓與」——被盜為2年內（隔年=約1年），在2年期間內甲如有向善意第三人請求返還的問題，但善意取得是否對抗盜竊……§949，盜贓物善意受讓人不受§948善意取得保護（被盜後2年內所有人得請求返還）；但本題問「質權不消滅」，若被盜後甲仍在2年內有追及質物之可能，質權尚未消滅。依官方答案D：被盜後讓與善意第三人（動產善意取得），甲之動產質權「不因此」消滅（§898規定的消滅原因是「喪失占有逾2年不請求」，被盜後善意讓與屬特殊情形，甲之質權仍存在），正確。"]}, {"year": 106, "num": 4, "ans": "D", "stem": "關於繼承之效力，下列敘述何者錯誤？", "opts": ["繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任", "繼承，因被繼承人死亡而開始", "繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有", "繼承人從被繼承人生前所受贈之全部財產，視為其所得遺產"], "exp": ["✓A. §1148Ⅱ，繼承人對被繼承人之債務以繼承所得遺產為限（法定限定繼承），正確。", "✓B. §1147，繼承因被繼承人死亡而開始，正確。", "✓C. §1151，繼承人有數人時，在分割前，各繼承人對遺產全部「公同共有」，正確。", "✗D（本題答案）. §1148-1，繼承人從被繼承人生前所受贈之財產「視為其所得遺產」，用於計算特留分等，但並非「全部」視為所得遺產——法條有時間限制（死亡前一定年限內或特定情形），選項說「全部財產」過於絕對，超出法條範圍，為應選答案。"]}, {"year": 106, "num": 17, "ans": "B", "stem": "關於區分所有建築物，下列敘述何者正確？", "opts": ["全體專有部分所有人公同共有區分所有建築物之基地", "專有部分可共有或單獨所有", "全體專有部分所有人公同共有區分所有建築物之公同部分", "頂樓之專有部分所有人得占有區分所有建築物之屋頂，並為使用收益"], "exp": ["✗A. 區分所有建築物之基地，由各區分所有人「按應有部分比例分別共有」（而非公同共有），正確應為分別共有，選項錯誤。", "✓B. §799Ⅲ，專有部分「得由其所有人單獨所有，或由數人共有」，共有或單獨均可，正確。", "✗C. 區分所有建築物之共同部分（電梯、走廊等），由各區分所有人「按比例分別共有」（非公同共有），選項說「公同共有」錯誤。", "✗D. 屋頂如屬「共同部分」（全體所有人共有），頂樓所有人無從單獨占有使用，除非規約另有規定或其專有部分範圍包含屋頂，並非當然得占有使用，選項過於絕對，錯誤。"]}, {"year": 106, "num": 20, "ans": "D", "stem": "甲、乙與丙3人共有A車，應有部分各3分之1，約定A車由丙占有、使用及收益（分管契約）。占有A車之丙未經甲與乙同意，出賣A車於丁。試問，下列敘述何者正確？", "opts": ["丁若不知丙非單獨所有人，且就其不知無過失，則善意取得A車所有權", "丁若不知丙非單獨所有人，且就其不知無過失，亦不能善意取得A車所有權", "丁善意取得A車所有權後，仍不對丁交付A車", "甲與乙得依侵權行為規定，請求丙賠償損害"], "exp": ["✗A. 丙無處分全部所有權之權限（僅有1/3），丙出賣全部A車屬「無權處分」（§118），若丁善意受讓有效交付，可善意取得，但本題後續需確認交付完成。", "✗B. 丙有A車的占有（分管），以讓與所有權意思交付，若丁善意（不知丙無完整處分權）且無過失，原則上符合善意取得（§801、§948），本選項說「亦不能善意取得」，過度限縮，不正確。", "✗C. 丁若已善意取得，應可向丙請求交付，本選項說「仍不對丁交付」邏輯不通。", "✓D. 丙未經甲乙同意擅自出賣A車（超越管理範圍的處分行為），侵害甲乙之共有權，甲乙得依侵權行為（§184）請求丙賠償損害，正確。"]}, {"year": 106, "num": 21, "ans": "D", "stem": "關於地上權，下列敘述何者正確？", "opts": ["以公共建設為目的而成立之地上權，不得定有期限", "經設定地上權之土地，不得再設定抵押權", "同一土地上，得設定數則內容相同之地上權", "地上權亦得為時效取得之客體"], "exp": ["✗A. 以公共建設為目的之地上權（區分地上權§841-1），並非不得定期限，選項無根據。", "✗B. 地上權（用益物權）與抵押權（擔保物權）可並存於同一土地（但效力有先後），並無禁止再設定抵押，選項錯誤。", "✗C. 同一土地同一空間範圍，性質相衝突之地上權不能並存（佔有排斥），不同空間範圍（如地上、地下）才可能並存，「內容相同」之地上權不能在同一空間設定兩個，選項錯誤。", "✓D. §772，時效取得（§769、§770）可類推適用於地上權，地上權得以時效取得，正確。"]}, {"year": 106, "num": 22, "ans": "A", "stem": "關於公同共有，下列敘述何者正確？", "opts": ["公同關係存續中，各公同共有人，不得請求分割其公同共有物", "各公同共有人，得自由處分其應有部分", "公同關係，不以法律規定或習慣者為限", "各公同共有人之權利，僅及於公同共有物之應有部分"], "exp": ["✓A. §829，公同關係存續中，「各公同共有人不得請求分割其公同共有物」（須公同關係消滅後才可分割），正確。", "✗B. 公同共有人「無應有部分」（此為公同共有與分別共有之核心差異），無從自由處分，選項錯誤。", "✗C. §827，公同共有之基礎（公同關係）由「法律規定或習慣」所生，並非當事人任意約定，選項說「不以法律規定或習慣為限」錯誤。", "✗D. 公同共有人的權利及於「公同共有物之全部」（而非應有部分，公同共有無應有部分概念），選項錯誤。"]}, {"year": 106, "num": 23, "ans": "A", "stem": "關於最高限額抵押權，下列敘述何者正確？", "opts": ["當事人得約定其所擔保原債權之應確定之期日", "最高限額抵押權所擔保之債權，不以由一定法律關係所生之權利為限", "最高限額抵押權所擔保之債權，不得將其分離而為讓與", "同一不動產上，僅得設定一項最高限額抵押權"], "exp": ["✓A. §881-1Ⅱ，最高限額抵押權當事人「得約定原債權確定之期日」（確定日之約定），正確。", "✗B. §881-1Ⅰ，最高限額抵押所擔保債權「以因一定法律關係所生之債權或基於票據所生之權利為限」，並非不限一定法律關係，選項相反，錯誤。", "✗C. 最高限額抵押之個別債權「確定後」，可分離讓與（§881-7），並非「不得讓與」，選項過於絕對。", "✗D. 同一不動產上「得設定多個」最高限額抵押權（有不同次序），並無只能一項之限制，選項錯誤。"]}, {"year": 106, "num": 24, "ans": "D", "stem": "關於占有之推定，下列敘述何者正確？", "opts": ["占有已登記之不動產而行使物權者，推定有該物權", "行使所有權以外之權利者，對使其占有之人，推定有該權利", "占有人推定其為他主占有", "占有人推定其為無過失占有"], "exp": ["✗A. §943，占有人推定「以所有之意思占有」（自主占有）以及「善意、和平、公然」，但並未規定「占有已登記不動產者推定有物權」（登記名義人才有物權推定，§759-1），選項描述混淆。", "✗B. §943Ⅱ，行使所有權「以外」之權利（如地上權），「對使其占有之人，推定其有此權利」（對讓其占有之人），本選項描述方向有混淆，官方以D為正解。", "✗C. §944，占有人推定「以自主占有」（自己所有之意思占有），並非「他主占有」，選項錯誤（自主≠他主）。", "✓D. §944，占有人推定「善意」及「無過失」（§944Ⅱ），正確。"]}, {"year": 106, "num": 28, "ans": "A", "stem": "依民法規定，無權占有人返還占有物於回復請求人時，其得向回復請求人主張之權利及應負擔之義務，下列敘述何者正確？", "opts": ["善意占有人對於占有物支出之必要費用，於扣除其所收取孳息之餘額，皆得請求償還", "善意占有人對於占有物因改良占有物支出之有益費用，於扣除其所收取孳息之餘額，皆得請求償還", "惡意占有人，得請求返還所支出之必要費用", "惡意占有人對於占有物支出有益費用，回復請求人應給予相當償還"], "exp": ["✓A. §953，善意占有人支出必要費用（維持占有物所必需），扣除其所收孳息後的餘額，得請求償還，正確。", "✗B. §954，善意占有人支出有益費用（改良費用），僅得請求「現存之增加價額」（不能超過現存增加額），並非「全部請求」，且「扣除孳息餘額」為必要費用的計算方式，有益費用計算不同，選項描述不精確。", "✗C. §955，惡意占有人所得請求者：「僅必要費用」仍得請求（法律從寬），但計算方式和善意占有人不同；依§955，惡意占有人「得請求返還必要費用」——本選項描述方向正確，但官方以A為最正確答案。", "✗D. 惡意占有人支出有益費用，回復請求人不必然給予相當償還（§955未明文此點，法律從嚴對惡意占有人），選項不正確。"]}, {"year": 106, "num": 29, "ans": "C", "stem": "依民法之規定，稱典權者，謂支付典價在他人之不動產為使用、收益，於他人不回贖時，取得該不動產所有權之權。下列關於典權之敘述，何者錯誤？", "opts": ["典權人對於典物因轉典所受之損害，負賠償責任", "典權之約定期限超過15年時，當事人間得附有到期不贖即作絕賣之條款", "典權人就典物支出有益費用，雖典物因此增加其價值，亦不得請求償還", "典權存續期限不超過30年，超過部分無效"], "exp": ["✓A. §915，典權人轉典或出租典物，因此所受之損害，典權人負賠償責任，正確。", "✓B. §923，典期超過15年，始得附「到期不贖即作絕賣」之條款，正確。", "✗C（本題答案）. §916，典權人就典物支出有益費用致增加典物價值，「出典人於回贖時應償還」（典物增值部分），並非不得請求，本選項說「不得請求償還」與法條相反，錯誤，為應選答案。", "✓D. §912，典權存續期限不超過30年（超過部分縮短為30年），正確。"]}, const TOTAL=77;
const YEARS=[99, 100, 101, 102, 103, 104, 105, 106];
const SK='civlaw_d_drill_p1_v1';
let S={};try{S=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function sv(){localStorage.setItem(SK,JSON.stringify(S))}
let aY='all',aF='all';
function gk(q){return q.year+'_'+q.num}
function getFilt(){return QS.filter(q=>{const k=gk(q),s=S[k];if(aY!=='all'&&q.year!==aY)return false;if(aF==='un')return!s;if(aF==='wrong')return s&&!s.ok;return true})}
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stats(){const done=QS.filter(q=>S[gk(q)]).length,cor=QS.filter(q=>S[gk(q)]&&S[gk(q)].ok).length;document.getElementById('stat').textContent='已作答 '+done+'/'+TOTAL+'　答對 '+cor+'　正確率 '+(done?Math.round(cor/done*100):0)+'%';document.getElementById('prog').style.width=(done/TOTAL*100)+'%'}
function buildChips(){var c=document.getElementById('chips');c.innerHTML='';var a=mk('div','chip'+(aY==='all'?' active':''));a.textContent='全部('+TOTAL+')';a.onclick=function(){aY='all';render()};c.appendChild(a);YEARS.forEach(function(y){var cnt=QS.filter(function(q){return q.year===y}).length,d=mk('div','chip'+(aY===y?' active':''));d.textContent=y+'年('+cnt+')';d.onclick=function(){aY=y;render()};c.appendChild(d)})}
function card(q){var k=gk(q),s=S[k],c=mk('div','q-card');c.id='c_'+k;var hd=mk('div','q-head');hd.appendChild(mk('span','q-year',q.year+'年'));hd.appendChild(mk('span','q-num','第'+q.num+'題'));if(s){var b=mk('span','rbadge '+(s.ok?'ok':'ng'),s.ok?'✓ 答對':'✗ 答錯');hd.appendChild(b)}var st=mk('div','q-stem',q.stem);var op=mk('div','opts');['A','B','C','D'].forEach(function(L,i){var o=mk('div','opt');if(s){if(L===q.ans)o.classList.add('correct');else if(s.ch===L)o.classList.add('wrong')}o.appendChild(mk('span','opt-lbl',L+'.'));o.appendChild(mk('span','opt-txt',q.opts[i]));if(!s)o.onclick=(function(qq,ll){return function(){choose(qq,ll)}})(q,L);op.appendChild(o)});var ex=mk('div','exp-block'+(s?' show':''));q.exp.forEach(function(ln){var d=mk('div','exp-line');var ch=ln.charAt(0);if(ch==='✓')d.classList.add('cl');else if(ch==='✗')d.classList.add('wl');else if(ch==='★'||ch==='※')d.classList.add('nl');d.textContent=ln;ex.appendChild(d)});if(s){var tr=mk('div','err-tag');var lb=mk('span',null,'錯題分類：');lb.style.cssText='font-size:11px;color:var(--gray)';tr.appendChild(lb);[['a','A法條混淆'],['b','B粗心'],['c','C真的不熟']].forEach(function(pair){var k2=pair[0],lbl=pair[1];var t=mk('span','etag',lbl);if(s.et===k2)t.classList.add(k2+'-on');t.onclick=(function(kk){return function(){s.et=(s.et===kk?null:kk);sv();rc(q)}})(k2);tr.appendChild(t)});ex.appendChild(tr)}c.appendChild(hd);c.appendChild(st);c.appendChild(op);c.appendChild(ex);return c}
function rc(q){var old=document.getElementById('c_'+gk(q));if(old)old.parentNode.replaceChild(card(q),old)}
