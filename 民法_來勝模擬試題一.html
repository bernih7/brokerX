<script>
var D={"Q": [{"n": 1, "ch": "A", "sec": "A 行為能力", "stem": "甲為17歲之未成年人，未得法定代理人允許，向乙購買價值新臺幣5萬元之筆記型電腦。該交易並非依甲之年齡及身分、日常生活所必需，甲亦未以詐術使乙信其有行為能力。依民法規定，下列敘述何者正確？", "opts": ["該買賣契約自始無效", "該買賣契約當然有效", "該買賣契約須經甲之法定代理人承認，始生效力", "甲得不待法定代理人表示，隨時自行撤銷該契約"], "ans": "C", "notes": ["❌ 限制行為能力人未得允許所訂契約是「效力未定」，不是無效（無效是無行為能力人，§75）。", "❌ 非純獲法律上利益、非日常生活所必需，依§77 須得允許；也沒有§83 詐術，所以不會當然有效。", "✅ §79：限制行為能力人未得法定代理人之允許，所訂立之契約，須經法定代理人之承認，始生效力。", "❌ 民法沒有讓限制行為能力人自行「撤銷」的規定；能撤回的是不知情的相對人（§82）。"], "trap": "效力未定 ≠ 無效 ≠ 得撤銷。17 歲＝限制行為能力（§12、§13Ⅱ）。", "src": "§12、§13Ⅱ、§77、§79、§82、§83", "neg": false}, {"n": 2, "ch": "A", "sec": "A 意思表示（第三人詐欺）", "stem": "甲因第三人丙之詐欺，與乙訂立買賣契約；乙對丙之詐欺並不知情，且依當時情形亦無從知悉。依民法規定，下列敘述何者正確？", "opts": ["甲只要證明受詐欺，即得一律撤銷對乙之意思表示", "甲不得以丙之詐欺為由，撤銷對乙之意思表示", "該買賣契約自始當然無效", "甲須先向丙請求損害賠償，始得撤銷對乙之意思表示"], "ans": "B", "notes": ["❌ §92Ⅰ但書：詐欺由第三人所為者，以相對人明知或可得而知為限始得撤銷；本題乙不知且無從知悉，甲不得撤銷，「一律可撤銷」錯。", "✅ §92Ⅰ但書：詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限，始得撤銷之。乙不知也無從知悉→甲不得撤銷。", "❌ 被詐欺的效果是「得撤銷」，不是當然無效。", "❌ 撤銷不以先向詐欺人求償為前提；甲可另依§184 向丙請求賠償。"], "trap": "第三人詐欺→看相對人「明知或可得而知」；第三人脅迫則無此限制。", "src": "§92Ⅰ、§184Ⅰ", "neg": false}, {"n": 3, "ch": "B", "sec": "B 給付遲延", "stem": "甲向乙借款，約定應於9月1日清償。9月1日屆至後，甲仍未清償，且無不可歸責於甲之事由。乙尚未另行催告。依民法規定，甲自何時起負遲延責任？", "opts": ["自9月1日期限屆滿時起", "自乙以存證信函催告時起", "自乙起訴且判決確定時起", "自甲表示拒絕清償時起"], "ans": "A", "notes": ["✅ §229Ⅰ：給付有確定期限者，債務人自期限屆滿時起，負遲延責任。不必催告。", "❌ 催告是「無確定期限」才需要（§229Ⅱ）。", "❌ 起訴送達訴狀才與催告同效，且一樣只用在無確定期限；不必等判決確定。", "❌ 遲延責任不以債務人表示拒絕為要件。"], "trap": "有確定期限→期限屆滿起；無確定期限→催告時起（起訴送達訴狀＝催告）。", "src": "§229Ⅰ、Ⅱ、§230", "neg": false}, {"n": 4, "ch": "B", "sec": "B 違約金", "stem": "甲、乙約定甲如遲延履約，應支付違約金新臺幣500萬元。嗣甲遲延情節輕微，約定之違約金顯然過高。依民法規定，下列敘述何者正確？", "opts": ["法院僅得宣告違約金約定全部無效，不得調整數額", "法院不得介入，因契約自由優先於一切考量", "僅債權人得決定是否降低違約金", "法院得將約定之違約金減至相當之數額"], "ans": "D", "notes": ["❌ §252：違約金額過高者，法院得「減至相當之數額」；效果是酌減，不是宣告無效。", "❌ §252 明文授權法院介入，契約自由有界限。", "❌ §252 授權「法院」減至相當之數額，不是由債權人單方決定。", "✅ §252：約定之違約金額過高者，法院得減至相當之數額。"], "trap": "過高→法院「酌減」，不是無效。", "src": "§250、§252", "neg": false}, {"n": 5, "ch": "B", "sec": "B 債權讓與", "stem": "甲將其對乙之金錢債權讓與丙，但甲、丙均尚未通知乙。依民法規定，下列敘述何者正確？", "opts": ["債權讓與因未經乙同意而無效", "債權讓與在甲、丙間得成立，但未通知乙前，對乙不生效力", "只有甲得通知乙，丙所為通知不生效力", "債權讓與須經公證始生效力"], "ans": "B", "notes": ["❌ 債權讓與不需債務人同意（§294）。", "✅ §297Ⅰ：債權之讓與，非經讓與人或受讓人通知債務人，對於債務人不生效力。甲丙間仍成立。", "❌ 讓與人「或受讓人」都可通知；受讓人提示讓與字據亦同（§297Ⅱ）。", "❌ 民法未要求公證。"], "trap": "通知是「對債務人生效」要件，不是讓與成立要件；甲、丙任一方通知都可以。", "src": "§294、§297", "neg": false}, {"n": 6, "ch": "B", "sec": "B 多數債務人（連帶）", "stem": "甲、乙二人共同向丙借款，契約僅記載甲、乙各負擔一半債務，法律亦無特別規定。依民法規定，下列敘述何者正確？", "opts": ["只要債務人有二人以上，即一律成立連帶債務", "丙得任意向甲請求全部債務，因多數債務人即推定連帶", "甲、乙不因共同借款即當然成立連帶債務", "甲、乙是否連帶，完全取決於丙之單方意思"], "ans": "C", "notes": ["❌ §272：連帶債務須債務人明示各負全部給付之責任，或法律有規定，不因債務人有二人以上就當然成立。", "❌ 民法沒有「推定連帶」；本題甚至約定各負一半。", "✅ §272：須明示對債權人各負全部給付之責任，或法律有規定，始為連帶債務。本題兩者皆無。", "❌ §272Ⅰ：須數債務人「明示對於債權人各負全部給付之責任」，或依同條Ⅱ有法律規定；不是債權人單方決定。"], "trap": "連帶債務＝「明示」或「法律規定」二選一；沒有推定。", "src": "§271、§272", "neg": false}, {"n": 7, "ch": "C", "sec": "C 買賣・物之瑕疵擔保", "stem": "關於買賣契約中出賣人之物之瑕疵擔保責任，下列敘述何者正確？", "opts": ["出賣人原則上應擔保標的物於危險移轉時，無滅失或減少價值、通常效用或契約預定效用之瑕疵", "標的物只要有任何極輕微缺點，無論是否重要，均必然構成法律上之瑕疵", "出賣人僅擔保標的物交付時之外觀，不擔保其通常效用", "出賣人所保證之品質，不屬瑕疵擔保範圍"], "ans": "A", "notes": ["✅ §354Ⅰ本文：危險移轉（§373，原則為交付時）時無滅失或減少價值、通常效用或契約預定效用之瑕疵。", "❌ §354Ⅰ但書：減少之程度無關重要者，不得視為瑕疵。", "❌ 通常效用正是擔保範圍。", "❌ §354Ⅱ：出賣人並應擔保其物於危險移轉時，具有其所保證之品質。"], "trap": "基準時點＝危險移轉時；無關重要不算瑕疵；保證品質另列第2項。", "src": "§354、§373", "neg": false}, {"n": 8, "ch": "C", "sec": "C 互易", "stem": "甲、乙約定，甲將其名畫所有權移轉於乙，乙則將其古董手錶所有權移轉於甲。依民法規定，該契約之性質及適用規範為何？", "opts": ["屬贈與契約，準用委任規定", "屬租賃契約，準用使用借貸規定", "屬合夥契約，不準用其他有名契約規定", "屬互易契約，準用關於買賣之規定"], "ans": "D", "notes": ["❌ 雙方都有對價，不是無償。", "❌ 移轉所有權，不是使用收益。", "❌ 不是共同經營事業。", "✅ §398：當事人雙方約定互相移轉金錢以外之財產權者，準用關於買賣之規定。"], "trap": "物換物＝互易，準用買賣。", "src": "§398", "neg": false}, {"n": 9, "ch": "C", "sec": "C 贈與（任意撤銷）", "stem": "甲以經公證之契約表示贈與乙一部汽車，惟尚未移轉汽車所有權。甲僅以贈與物權利尚未移轉為由，主張依民法第408條第1項撤銷贈與。下列敘述何者正確？", "opts": ["甲得任意撤銷，因所有未履行之贈與均可撤銷", "甲不得僅以權利尚未移轉為由，依該項規定撤銷經公證之贈與", "贈與契約須交付標的物始成立，因此本案根本無契約", "經公證之贈與在任何情況下均絕對不得撤銷"], "ans": "B", "notes": ["❌ §408Ⅱ排除經公證之贈與。", "✅ §408Ⅱ：前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。", "❌ 贈與是諾成契約（§406），不以交付為成立要件。", "❌ 太絕對：仍可能依§412（附負擔）、§416、§417 等法定事由撤銷。"], "trap": "公證只擋住§408 任意撤銷，擋不住§416、§417 法定撤銷——「絕對」選項多半錯。", "src": "§406、§408、§412、§416、§417", "neg": false}, {"n": 10, "ch": "C", "sec": "C 租賃（買賣不破租賃）", "stem": "甲將房屋出租予乙3年，租賃契約未經公證，但甲已交付房屋，乙亦占有使用中。其後甲將房屋所有權讓與丙。依民法規定，下列敘述何者正確？", "opts": ["房屋所有權一經移轉，租賃契約當然消滅", "乙僅得向甲請求損害賠償，不得對丙主張租賃關係", "該租賃契約原則上對丙仍繼續存在", "任何不動產租賃契約均須公證，始得對受讓人繼續存在"], "ans": "C", "notes": ["❌ §425Ⅰ買賣不破租賃。", "❌ 乙得對丙主張租約繼續存在。", "✅ §425Ⅰ：租賃物交付後、承租人占有中讓與所有權，租約對受讓人仍繼續存在；3年未逾5年，不受同條Ⅱ限制。", "❌ §425Ⅱ只排除「未經公證且逾5年或未定期限」者；3年定期不必公證。"], "trap": "要件＝交付＋占有中；例外＝未公證且（逾5年或不定期）。", "src": "§425", "neg": false}, {"n": 11, "ch": "C", "sec": "C 消費借貸", "stem": "依民法關於消費借貸之規定，下列敘述何者正確？", "opts": ["貸與人移轉金錢或其他代替物之所有權，借用人應返還種類、品質、數量相同之物", "借用人僅取得占有，不取得借用物所有權", "借用人必須返還原來交付之同一物", "消費借貸之標的僅限於不動產"], "ans": "A", "notes": ["✅ §474Ⅰ：移轉金錢或其他代替物之所有權於他方，而約定他方以種類、品質、數量相同之物返還。", "❌ 那是使用借貸（§464）；消費借貸移轉所有權。", "❌ 返還同種類物即可，不必原物。", "❌ 標的是金錢或代替物，通常是動產。"], "trap": "消費借貸＝移轉所有權＋還同種類；使用借貸＝只交付使用＋還原物。", "src": "§464、§474", "neg": false}, {"n": 12, "ch": "C", "sec": "C 僱傭（終止）", "stem": "甲、乙間之僱傭未定期限，且不能依勞務之性質或目的定其期限；本題並無其他特別法規定。依民法規定，下列敘述何者正確？", "opts": ["僅受僱人得終止契約，僱用人不得終止", "雙方均須提出不可歸責於己之事由，始得終止", "契約一經成立，須經雙方合意始得終止", "各當事人原則上得隨時終止，但有利於受僱人之習慣者，從其習慣"], "ans": "D", "notes": ["❌ §488Ⅱ：未定期限且不能依勞務性質或目的定其期限之僱傭，「各當事人」得隨時終止，僱用人也可以，不限受僱人。", "❌ §488Ⅱ 規定各當事人得「隨時」終止，不以提出不可歸責於己之事由為要件。", "❌ §488Ⅱ：一方以意思表示即可隨時終止，不必雙方合意。", "✅ §488Ⅱ：僱傭未定期限，亦不能依勞務之性質或目的定其期限者，各當事人得隨時終止契約。但有利於受僱人之習慣者，從其習慣。"], "trap": "本題排除勞基法（題目寫無特別法）；與§450Ⅱ租賃「有利於承租人之習慣」同一句型。", "src": "§488Ⅱ、§489", "neg": false}, {"n": 13, "ch": "C", "sec": "C 委任（終止）", "stem": "甲委任乙處理事務。嗣甲於明顯不利於乙之時期終止委任，且無非可歸責於甲而不得不終止之事由。依民法規定，下列敘述何者正確？", "opts": ["委任契約成立後，雙方均不得片面終止", "甲雖得隨時終止，但應就不利時期終止所生損害負賠償責任", "甲之終止一律無效，委任關係仍繼續存在", "只有受任人乙得隨時終止，委任人甲不得終止"], "ans": "B", "notes": ["❌ §549Ⅰ任何一方得隨時終止。", "✅ §549Ⅱ：於不利於他方之時期終止契約者，應負損害賠償責任；但非可歸責而不得不終止者除外。本題無但書情形。", "❌ 終止仍有效，只是要賠償。", "❌ 雙方都可終止。"], "trap": "終止「有效」＋「賠償」兩件事分開看。", "src": "§549", "neg": false}, {"n": 14, "ch": "C", "sec": "占有人於占有物上行使之權利，原則上推定其適法有此權利，但法律設有例外", "占有已登記之不動產而行使物權時，仍一律適用占有之權利推定", "占有人行使所有權以外之權利時，對使其占有之人也一律適用該推定"], "ans": "B", "notes": ["❌ 推定不是取得。", "✅ §943Ⅰ推定適法有此權利；Ⅱ列兩種例外。", "❌ §943Ⅱ①：占有已登記之不動產而行使物權→不適用（登記推定優先，§759-1Ⅰ）。", "❌ §943Ⅱ②：行使所有權以外之權利者，對使其占有之人→不適用。"], "trap": "兩個例外：已登記不動產；對使其占有之人（如承租人對出租人）。", "src": "§943、§759-1Ⅰ", "neg": false}, {"n": 24, "ch": "E", "sec": "E 剩餘財產分配（計算）", "stem": "甲、乙夫妻適用法定財產制。法定財產制關係消滅時，甲扣除婚姻關係存續所負債務後之現存婚後財產為800萬元，其中200萬元為繼承所得；乙扣除債務後之現存婚後財產為200萬元。假設無其他應排除或調整之情形，乙得向甲請求多少剩餘財產差額？", "opts": ["100萬元", "150萬元", "200萬元", "300萬元"], "ans": "C", "notes": ["❌ 依 §1030-1Ⅰ：甲 800−200（繼承不列入）＝600 萬，乙 200 萬，差額 400 萬平均分配＝200 萬，不是 100 萬。", "❌ 依 §1030-1Ⅰ：甲 600 萬（800 扣繼承 200）−乙 200 萬＝差額 400 萬，平均分配＝200 萬，不是 150 萬。", "✅ §1030-1Ⅰ①繼承所得不列入：甲 800−200＝600 萬；乙 200 萬；差額 400 萬平均分配→乙得請求 200 萬。", "❌ 300 萬是把甲的繼承所得 200 萬也算進去：（甲 800−乙 200）÷2＝300；繼承所得依 §1030-1Ⅰ① 不列入分配。"], "trap": "先扣繼承／無償取得與慰撫金，再相減÷2。", "src": "§1030-1", "neg": false}, {"n": 25, "ch": "E", "sec": "E 法定應繼分", "stem": "甲死亡，未立遺囑，遺有配偶乙及子女丙、丁，且無其他影響繼承之事由。依民法規定，乙、丙、丁之應繼分各為多少？", "opts": ["乙、丙、丁各三分之一", "乙二分之一，丙、丁各四分之一", "乙三分之二，丙、丁各六分之一", "乙不參與繼承，由丙、丁各二分之一"], "ans": "A", "notes": ["✅ §1144①：配偶與第一順序繼承人同為繼承時，應繼分與他繼承人平均→各 1/3。", "❌ 1/2 是配偶與第二、三順序（父母、兄弟姊妹）。", "❌ 2/3 是配偶與第四順序（祖父母）。", "❌ 配偶為當然繼承人（§1138）。"], "trap": "配偶：一平均、二三 1/2、四 2/3、無人全部。", "src": "§1138、§1144", "neg": false}], "E": [{"t": "申論題一（25分）", "q": "甲、乙、丙三人各有三分之一應有部分，共有一棟三層樓房屋。三人取得房屋後約定，由甲專用一樓、乙專用二樓、丙專用三樓，其餘公共部分共同使用，並依此方式使用多年，但未就該約定辦理登記。嗣丙因資金需求，將其三分之一應有部分以新臺幣500萬元出售予丁，雙方簽訂買賣契約，丁並交付50萬元定金，但尚未辦理所有權移轉登記。其後房價上漲，丙又將同一應有部分以600萬元出售予戊，並先行辦妥所有權移轉登記。試依民法規定，就下列問題說明：（一）丙先後將同一共有持分出售予丁、戊，丁、戊何人取得該共有持分？戊於締約時明知丁在先之買賣契約，是否影響其取得所有權？（二）丁得否請求戊將該共有持分移轉登記予自己？丁得向丙主張何種權利？", "parts": [["一、定義", "「二重買賣」指出賣人就同一標的物先後與數人訂立買賣契約。買賣契約僅為債權行為，各買受人只取得請求出賣人移轉所有權之債權；不動產所有權之變動另須物權行為並經登記。「債權相對性」指債權原則上僅得向債務人主張，不得對抗第三人。"], ["二、法條", "① 第758條：「不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。前項行為，應以書面為之。」\n② 第348條第1項：「物之出賣人，負交付其物於買受人，並使其取得該物所有權之義務。」\n③ 第819條第1項：「各共有人，得自由處分其應有部分。」\n④ 第184條第1項：「因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。」\n⑤ 第226條第1項：「因可歸責於債務人之事由，致給付不能者，債權人得請求賠償損害。」第256條：「債權人於有第二百二十六條之情形時，得解除其契約。」\n⑥ 第249條第3款：「契約因可歸責於受定金當事人之事由，致不能履行時，該當事人應加倍返還其所受之定金。」"], ["三、涵攝分析", "（一）所有權歸屬：丙依第819條第1項得自由處分其應有部分，無須甲乙同意。丙與丁、丙與戊之兩個買賣契約均有效成立（買賣他人或同一物之契約，債權行為本身不因重複而無效），丁、戊各取得對丙之移轉請求權。惟依第758條，不動產物權依法律行為取得者非經登記不生效力；丁未辦登記，戊已辦妥移轉登記，故由戊取得該三分之一應有部分。\n戊之明知：債權具相對性，丁之債權不能對抗戊；所有權歸屬以登記先後定，而非以締約先後或善意惡意定，戊單純知悉在先買賣，不影響其取得所有權。惟戊若非僅知悉，而係與丙通謀、教唆丙違約，以背於善良風俗之方法故意加損害於丁，丁得依第184條第1項後段向戊請求損害賠償（但仍不能以此請求戊移轉所有權）。\n（二）丁對戊：丁戊間無任何契約關係，丁對丙之債權不得對抗戊，且戊為合法所有人，丁不得請求戊移轉登記。\n丁對丙：丙依第348條第1項負使丁取得所有權之義務；丙將同一應有部分移轉予戊，對丁之給付陷於不能，且係丙自行為之，屬可歸責於丙之給付不能。丁得①依第226條第1項請求損害賠償（含因房價上漲所失之履行利益）；②依第256條解除契約；③依第249條第3款請求丙加倍返還定金100萬元。"], ["四、結論", "（一）由已完成移轉登記之戊取得該應有部分；戊締約時明知丁之買賣，原則上不影響其取得所有權，僅於以背於善良風俗之方法故意侵害丁時，另負第184條第1項後段之賠償責任。（二）丁不得請求戊移轉登記；丁得向丙依第226條請求給付不能之損害賠償、依第256條解除契約，並依第249條第3款請求加倍返還定金。"], ["考試陷阱", "二重買賣看「登記」不看「誰先簽約」；惡意後買受人仍取得所有權，丁頂多對戊主張侵權，不能要求移轉。"]], "warn": "補習班模擬題（非考選部官方試題）。\n【老師版與本站差異】結論完全一致。\n【延伸加分點（老師解答未寫，本站補充）】\n① 土地法第34條之1第4項：共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。本題標的為共有房屋應有部分，適用於共有建築改良物，甲、乙原有優先承購權。\n　惟實務認該權利僅具債權效力：丙未通知即移轉予戊，移轉仍有效，甲乙僅得向丙請求損害賠償，不影響戊取得所有權。\n② 甲乙丙之分層專用約定（分管）未登記，依第826條之1第1項對受讓人戊不生效力。\n③ 定金加倍返還與損害賠償得否併請，視定金性質（違約定金或證約定金）而定；考場寫明依第249條第3款即可。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "二重買賣：數個買賣皆有效，只生債權；物權看登記。"], ["二、法條", "§758（登記生效）、§348Ⅰ、§819Ⅰ、§184Ⅰ後段、§226Ⅰ、§256、§249③。"], ["三、涵攝", "（一）戊先登記→取得；明知不影響，惡意故意侵害才另負§184Ⅰ後段。（二）丁戊無法律關係→不得請求移轉；丙可歸責給付不能→丁得§226 賠償、§256 解約、§249③ 加倍還定金 100 萬。"], ["四、結論", "戊取得；丁對戊不能請求移轉，對丙求償＋解約＋加倍返還定金。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "二重買賣｜債權行為／物權行為｜登記生效（§758）｜債權相對性｜§184Ⅰ後段（背於善良風俗）｜可歸責之給付不能｜§226｜§256｜§249③ 加倍返還", "ok"], ["常見失分點", "① 以「丁先簽約」判丁取得所有權\n② 把戊惡意寫成取得無效\n③ 丁對丙只寫解約，漏損害賠償或定金加倍返還\n④ 誤寫第249條第2款（那是付定金方可歸責）", "bad"], ["加分點", "土地法§34-1Ⅳ 共有人優先承購權（實務：債權效力）；分管未登記依§826-1Ⅰ 不拘束戊。", "ok"]]}, {"n": "來勝老師版", "src": "📄 老師原文：以下（一）（二）標題與 1、2、3、4 各點，依來勝解答照片逐字轉錄，未改寫、未重排（只做分段顯示）。最後一段標【本站補充】者是本站寫的，不是老師原文。", "parts": [["（一）丙先後將同一共有持分出售予丁、戊，應由完成移轉登記的戊取得所有權，且縱使戊於締約時明知丁在先之買賣契約，原則上並不影響其取得所有權：", "1、按民法第758條規定，不動產物權依法律行為而取得、設定、喪失或變更者，非經登記，不生效力。另依民法第348條規定，出賣人負有交付其物並使買受人取得所有權之義務。因此，不動產買賣契約成立本身僅發生債權效力，買受人取得請求出賣人移轉所有權之債權；至不動產所有權之取得，仍須完成所有權移轉登記。同一不動產先後出售予二人時，原則上並非以買賣契約成立之先後決定所有權歸屬，而係以何人先完成所有權移轉登記決定之。\n2、本題丙先將其三分之一應有部分出售予丁，丁雖已與丙成立買賣契約並交付50萬元定金，但雙方尚未辦理所有權移轉登記。因此，丁僅取得請求丙移轉該應有部分之債權，尚未取得該共有持分。其後丙又將同一三分之一應有部分出售予戊，並已辦妥所有權移轉登記。戊既已完成登記，即已取得該三分之一應有部分之所有權。\n3、至戊於締約時已知悉丙先前曾將同一持分出售予丁，僅屬後買受人知悉在先買賣契約之存在。債權原則上具有相對性，戊單純知悉在先買賣之事實，尚不足使其與丙間之買賣契約或所有權移轉行為無效。惟如戊非僅單純知悉，而有積極與丙通謀、引誘丙違約或以其他背於善良風俗之方法故意侵害丁之債權時，始可能另成立民法第184條第1項後段之侵權行為責任，併予敘明。"], ["（二）丁不得直接請求戊移轉共有持分，且丁得向丙主張債務不履行責任及加倍返還定金：", "1、債權具有相對性，買賣契約原則上僅於買賣雙方間發生效力。先買受人如尚未取得所有權，即不得僅憑其買賣契約上之債權，直接向已取得所有權之第三人請求移轉所有權。\n2、本題丁與丙成立買賣契約，但未完成所有權移轉登記，故丁僅對丙享有移轉所有權之債權。戊則已依法完成移轉登記而取得所有權。丁與戊間並不存在買賣契約或其他足以請求移轉所有權之法律關係。準此，本題丁原則上不得以自己係先買受人為由，請求戊將該三分之一應有部分移轉登記予自己。\n3、又依民法第348條，出賣人負有使買受人取得所有權之義務。另依民法第226條第1項規定，因可歸責於債務人之事由致給付不能者，債權人得請求損害賠償；依民法第256條規定，有第226條給付不能之情形時，債權人並得解除契約。此外，依民法第249條第3款規定，契約因可歸責於受定金當事人之事由致不能履行時，該當事人應加倍返還其所受之定金。\n4、本題丙原應依其與丁之買賣契約，將三分之一應有部分移轉登記予丁。惟丙嗣後自行將同一共有持分移轉登記予戊，致戊取得所有權，使丙不能再依原買賣契約將該持分移轉予丁而屬於給付不能之情形。此項給付不能係因丙之二重買賣行為並移轉所有權所致，係屬可歸責於丙之事由，故丁得依民法第226條請求丙負給付不能之損害賠償責任，並得依民法第256條解除買賣契約，且得依民法第249條第3款規定，請求丙加倍返還所受定金。"], ["【本站補充・非老師原文】老師的作答架構（讀法）", "每個子題：標題就是結論（結論先行）→ 1 法條與原則 → 2 套本題事實 → 3（4）延伸或結論。\n考場可直接照這個順序寫；若要套四段式，1＝定義＋法條、2～4＝涵攝、標題＝結論。", "add"]]}, {"n": "對照：老師版 vs 本站四段式", "src": "📝 本站整理（非老師原文）：同一題，老師版與本站「完整四段式」逐項比較。", "parts": [["架構", "老師：兩個子題各自一套——標題（＝結論）→ 1 法條與原則 → 2 套本題事實 → 3、4 延伸。結論先講。\n本站：全題一套——一、定義 → 二、法條 → 三、涵攝（分（一）（二））→ 四、結論。結論最後講。"], ["定義", "老師：沒有獨立定義段，「買賣只生債權、所有權看登記」寫在 1 裡。\n本站：另寫「二重買賣」「債權相對性」兩個定義。"], ["法條", "老師：在內文用白話轉述（§758、§348、§184Ⅰ後段、§226Ⅰ、§256、§249③）。\n本站：列條文原文，並多列 §819Ⅰ（丙得自由處分應有部分）。"], ["本站有、老師沒寫", "① §819Ⅰ：丙賣應有部分不必甲乙同意。\n② 明寫「兩個買賣契約都有效」。\n③ 定金加倍返還算出金額 100 萬元。\n④ 損害賠償可含房價上漲的履行利益。\n⑤ 戊縱成立§184 侵權，丁也只能請求賠償，不能請求移轉。\n⑥ 提示框：土地法§34-1Ⅳ 優先承購、§826-1Ⅰ 分管、定金性質。", "ok"], ["老師有、本站較少", "① 原則句「同一不動產先後出售予二人，以何人先完成登記決定，不以契約成立先後」。\n② 戊「單純知悉」為何不影響：寫到「不足使買賣契約或所有權移轉行為無效」，並舉「通謀、引誘違約」為例。\n③ 第（二）題先用債權相對性講原則，再套事實，層次分明。", "ok"], ["結論", "兩版相同：戊取得；明知不影響；丁不能請求戊移轉；丁對丙得§226 賠償、§256 解約、§249③ 加倍返還定金。"], ["考場怎麼選", "時間夠：用本站四段式（有定義、條文原文，符合你的作答格式）。\n時間緊：用老師的「標題＝結論」寫法，每子題先寫一句結論當標題，閱卷者一眼看到答案。"]]}], "m": "二重買賣：登記決定歸屬，惡意不影響取得；後手只怕§184Ⅰ後段。", "kw": ["二重買賣", "登記生效", "債權相對性", "給付不能", "定金加倍返還"]}, {"t": "申論題二（25分）", "q": "甲、乙、丙三人共有A土地一筆，各有三分之一之應有部分。嗣丙因經營事業需要資金，向丁銀行借款新臺幣600萬元，並以其對A土地之三分之一應有部分設定第一順位普通抵押權予丁銀行，且已辦妥抵押權設定登記。數年後，甲認為共有關係造成土地利用不便，遂請求分割共有物。因甲、乙、丙無法就分割方法達成協議，甲乃向法院提起分割共有物之訴。法院於訴訟程序中將分割訴訟之情形告知丁銀行，丁銀行收受通知後並未參加訴訟。法院審理後，判決將A土地原物分割為A1、A2及A3三筆土地，分別由甲、乙、丙單獨取得。其中丙分得A3土地。嗣丙未依約清償對丁銀行之借款，丁銀行主張其原係以丙對A土地之三分之一應有部分設定抵押權，共有物嗣後之分割不得損害其抵押權，故其抵押權仍得及於甲、乙、丙分割後所取得之A1、A2、A3三筆土地。甲、乙則主張，其二人從未為丙之債務提供擔保，丁銀行僅得就丙所分得之A3土地主張抵押權。試依民法規定回答下列問題：（一）丙得否未經甲、乙同意，單獨以其對A土地三分之一之應有部分設定抵押權予丁銀行？其抵押權效力如何？（二）丁銀行原設定於丙三分之一應有部分之抵押權，其效力及標的有何變化？嗣丙未依約清償借款時，丁銀行得對何一土地實行抵押權？", "parts": [["一、定義", "「應有部分」指各共有人對共有物所有權之抽象比例。「抵押權之移存」指應有部分上之抵押權，於共有物分割後，集中存在於抵押人所分得之特定部分。"], ["二、法條", "① 第819條：「各共有人，得自由處分其應有部分。共有物之處分、變更、及設定負擔，應得共有人全體之同意。」\n② 第860條：「稱普通抵押權者，謂債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權。」第758條第1項（登記生效）。\n③ 第824條之1第1項：「共有人自共有物分割之效力發生時起，取得分得部分之所有權。」第2項：「應有部分有抵押權或質權者，其權利不因共有物之分割而受影響。但有下列情形之一者，其權利移存於抵押人或出質人所分得之部分：一、權利人同意分割。二、權利人已參加共有物分割訴訟。三、權利人經共有人告知訴訟而未參加。」\n④ 第873條：「抵押權人，於債權已屆清償期，而未受清償者，得聲請法院，拍賣抵押物，就其賣得價金而受清償。」"], ["三、涵攝分析", "（一）丙以應有部分設定抵押權，屬處分其應有部分，依第819條第1項得自由為之，無須甲乙同意；第819條第2項須全體同意者，係就「共有物」全部設定負擔，與本題不同。丁銀行抵押權已依第758條第1項登記，有效成立，標的為丙之三分之一應有部分，丁取得第一順位普通抵押權，得就該應有部分賣得價金優先受償（第860條）。\n（二）分割後，丙之抽象應有部分轉為 A3 之單獨所有（第824條之1第1項）。依同條第2項本文，抵押權原則上不因分割而受影響（按原應有部分比例存續於 A1、A2、A3），此即丁銀行主張之依據；惟同項但書第3款規定，權利人經共有人告知訴訟而未參加者，權利移存於抵押人分得之部分。本題丁銀行於訴訟中受告知分割訴訟情形而未參加，已有參與分割程序、表示意見之機會而放棄，應認該當但書第3款，抵押權移存於丙分得之 A3，不再及於甲之 A1、乙之 A2。甲乙主張有理由，丁銀行主張無理由。\n丙屆期未清償，丁銀行得依第873條聲請法院拍賣 A3，就賣得價金優先受償，不得就 A1、A2 實行抵押權。"], ["四、結論", "（一）丙得未經甲乙同意，以其應有部分設定抵押權；抵押權經登記有效，標的為丙之三分之一應有部分。（二）分割後，因丁銀行受告知訴訟而未參加，依第824條之1第2項但書第3款，抵押權移存於丙分得之 A3；丁銀行僅得依第873條拍賣 A3 優先受償，不得及於 A1、A2。"], ["考試陷阱", "先寫第2項本文（原則不受影響＝丁的主張），再寫但書三款（本題第3款）——只寫但書會漏掉「為什麼丁會這樣主張」。"]], "warn": "補習班模擬題（非考選部官方試題）。\n【老師版與本站差異】結論完全一致。\n【老師原文錯字】「民法地819條」應為「第」，老師版照原文保留。\n【⚠️ 題幹與老師解答用語不同】\n・題目：「法院」於訴訟中將分割訴訟告知丁銀行。\n・第824條之1第2項但書第3款：「經共有人告知訴訟」。\n・老師解答：「甲已依法將該訴訟告知丁銀行」。\n【考場寫法】先引條文原文，再寫「本題丁銀行已受分割訴訟之告知（通知）而不參加，已有參與機會，依該款保障抵押權人參與分割程序之意旨，應同其效果」。\n【對照官方題】103-二（分割＋補償金法定抵押權§824-1Ⅳ）、110-一（抵押權按比例續存§824-1Ⅱ本文），指揮中心申論分頁有範文。", "v": [{"n": "考場速寫版", "parts": [["一、定義", "應有部分＝抽象比例；移存＝分割後集中到抵押人分得部分。"], ["二、法條", "§819Ⅰ（自由處分應有部分）vs §819Ⅱ（全部設定負擔需全體）；§860、§758Ⅰ；§824-1Ⅰ、Ⅱ本文＋但書①②③；§873。"], ["三、涵攝", "（一）設定在應有部分→不需甲乙同意；已登記→有效。（二）原則不受影響（丁的主張），但丁受告知未參加→但書③移存 A3；甲乙有理由。屆期未償→拍賣 A3。"], ["四、結論", "可單獨設定且有效；移存 A3，只能拍 A3。"]]}, {"n": "得分關鍵與失分點", "parts": [["得分關鍵詞", "§819Ⅰ 自由處分應有部分｜§819Ⅱ 對照｜登記生效｜§824-1Ⅱ 本文「不受影響」｜但書第3款「經告知訴訟而未參加」｜移存｜§873 拍賣", "ok"], ["常見失分點", "① 用§819Ⅱ 說要全體同意\n② 只寫移存，沒先寫本文原則\n③ 把但書款次寫錯（本題是第3款，不是第1款同意分割）\n④ 結論漏寫「不得就 A1、A2 實行」", "bad"], ["加分點", "點出題目為「法院」告知、條文為「共有人告知」，並說明為何仍應同其效果。", "ok"]]}, {"n": "來勝老師版", "src": "📄 老師原文：以下（一）（二）標題與 1、2、3、4 各點，依來勝解答照片逐字轉錄，未改寫、未重排（只做分段顯示）。最後一段標【本站補充】者是本站寫的，不是老師原文。", "parts": [["（一）丙得依民法地819條第1項規定以其三分之一應有部分設定抵押權予丁銀行，無須共有人甲、乙之同意：", "1、依民法第819條第1項規定，各共有人得自由處分其應有部分。又依民法第860條規定，普通抵押權係債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權。另依民法第758條規定，不動產物權依法律行為而設定者，非經登記，不生效力。\n2、本題甲、乙、丙各有A土地三分之一應有部分。丙設定抵押權之標的並非A土地全部，而僅係自己所有之三分之一應有部分。因此，丙係處分自己之應有部分，而非對共有物全部設定抵押權，且丙與丁銀行已就該三分之一應有部分辦妥抵押權設定登記，故依民法第819條第1項，丙得自由以自己三分之一應有部分設定抵押權，無須取得甲、乙同意。該抵押權既已依法辦理登記，即有效成立，丁銀行取得以丙三分之一應有部分為標的之第一順位普通抵押權。"], ["（二）丁銀行之抵押權依民法第824條之1第2項規定應移存於丙所分得之A3土地其抵押權並不消滅，且丁得依民法第873條聲請拍賣A3土地，並就其賣得價金優先受償：", "1、按民法第824條之1規定，共有人自共有物分割之效力發生時起，取得其分得部分之所有權；又應有部分上設有抵押權或質權者，該權利原則上不因共有物之分割而受影響。惟為兼顧其他共有人於分割後取得完整所有權之利益，法律另規定，抵押權人如同意分割、或已參加共有物分割訴訟、或經共有人告知訴訟而未參加者，則抵押權之標的因共有物分割而轉為抵押人所分得之特定部分。\n2、本題丁銀行原已就丙所有之A土地三分之一應有部分取得有效抵押權。其後A土地雖經法院分割，使丙原有之三分之一抽象應有部分不再存在，但依民法第824條之1之規定，丁銀行之抵押權並不因此消滅。又甲提起分割共有物之訴後，已依法將該訴訟告知丁銀行，丁銀行收受訴訟告知後並未參加訴訟，依民法第824條之1第2項但書第3款規定，丁銀行之抵押權應移存於丙所分得之A3土地，而不再及於甲取得之A1及乙取得之A2。\n3、又抵押權所擔保之債權屆期未獲清償時，依民法第873條規定，抵押權人得聲請法院拍賣抵押物，並就其賣得價金優先受償。準此，本題丙之借款屆期未清償時，丁銀行得依民法第873條聲請拍賣A3土地，並就其賣得價金優先受償，且不得就A1或A2實行抵押權。"], ["【本站補充・非老師原文】老師的作答架構（讀法）", "同申論一：標題＝結論 → 1 法條 → 2 套事實 → 3 實行方式。\n原文（一）標題「民法地819條」為印刷錯字，上方照原文保留，正確為「第」。\n⚠️ 老師 2 寫「甲已依法將該訴訟告知丁銀行」，但題目是「法院」告知，見下方提示框。", "add"]]}, {"n": "對照：老師版 vs 本站四段式", "src": "📝 本站整理（非老師原文）：同一題，老師版與本站「完整四段式」逐項比較。", "parts": [["架構", "老師：兩個子題各自一套——標題（＝結論）→ 1 法條 → 2 套事實 → 3 實行方式。\n本站：一、定義 → 二、法條 → 三、涵攝（（一）（二））→ 四、結論。"], ["定義", "老師：沒有定義段。\n本站：另寫「應有部分」「抵押權之移存」兩個定義。"], ["本站有、老師沒寫", "① §819Ⅱ 對照：就「共有物全部」設定負擔才要全體同意，本題只設定在應有部分。\n② 先寫§824-1Ⅱ 本文「原則不受影響」＝丁銀行主張的依據，再寫但書第3款，回應題目雙方主張。\n③ 明寫「甲乙主張有理由、丁銀行主張無理由」。\n④ 列條文原文（§819、§860、§824-1Ⅰ Ⅱ、§873）。\n⑤ 處理題目「法院告知」與條文「共有人告知」的差異。", "ok"], ["老師有、本站較少", "① 立法目的：「為兼顧其他共有人於分割後取得完整所有權之利益」。\n② 「丙原有之三分之一抽象應有部分不再存在，但抵押權並不因此消滅」——把「標的變了、權利還在」講清楚。", "ok"], ["老師版要注意", "① 標題「民法地819條」是錯字，應為「第」。\n② 老師寫「甲已依法將該訴訟告知丁銀行」，題目是「法院」告知，與題幹不同；考場照題幹寫。", "bad"], ["結論", "兩版相同：丙可單獨設定、抵押權有效；分割後移存 A3；只能拍賣 A3，不及 A1、A2。"], ["考場怎麼選", "本站四段式回應了題目中丁銀行與甲乙兩方的主張，較完整；老師的立法目的句可以加進本站涵攝當加分。"]]}], "m": "應有部分抵押：自由設定；分割後原則跟著比例走，但書三款移存。", "kw": ["應有部分", "自由處分", "抵押權移存", "告知訴訟", "拍賣抵押物"]}], "timer": true},ID="civls1";
