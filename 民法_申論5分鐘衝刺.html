<!DOCTYPE html>
<html lang="zh-Hant">
<head><script>/*bxdef*/(function(){var s=null;try{s=localStorage.getItem('bx-theme')}catch(e){}if(s)document.documentElement.setAttribute('data-theme',s)})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>民法｜申論 5 分鐘衝刺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;
--b1:#2F6B8C;--b1s:#E3EFF6;--b2:#7A5BA6;--b2s:#EEE8F6;--b3:#2F7A55;--b3s:#E1F1E8;--b4:#B8782E;--b4s:#F8EBD3;--hl:#FFE9A8}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;
--b1:#7DB6D8;--b1s:#1D2F3A;--b2:#B79BE0;--b2s:#2B2438;--b3:#7FCBA0;--b3s:#1D3226;--b4:#E0B070;--b4s:#3A3220;--hl:#5A4A18;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:900 1.45rem/1.3 "Noto Serif TC",serif;margin:6px 0 2px;text-wrap:balance}
.lead{color:var(--sub);font-size:.92rem;margin:0 0 14px}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:.88rem}.top a{white-space:nowrap}.top>span{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end}
/* 模式選擇 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:1.02rem}
.mode small{display:block;color:var(--sub);line-height:1.55;margin-top:2px}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px;padding:0;list-style:none;font-size:.82rem;color:var(--sub)}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.flow li b{color:var(--ink);font-weight:700;margin-right:4px}
/* 佇列 */
.sec-h{font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--sub);font-weight:400}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;color:var(--ink)}
.qi .n{font-size:.78rem;color:var(--sub);min-width:4.2em}
.qi .t{min-width:0;font-size:.93rem;line-height:1.5}
.qi .r{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;font-size:.76rem;color:var(--sub)}
.chip{border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:nowrap}
.chip.new{background:var(--acc-soft);color:var(--acc);font-weight:700}
.chip.hard{background:var(--bad-soft);color:var(--bad);font-weight:700}
.chip.mid{background:var(--b1s);color:var(--b1);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qi .go{font-size:.8rem;color:var(--pri);font-weight:700}
.more{margin-top:8px}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar .row{display:flex;align-items:center;gap:10px}
.stg{font-weight:700;font-size:.98rem;flex:1;min-width:0}
.stg small{display:block;font-weight:400;color:var(--sub);font-size:.8rem;line-height:1.4}
.clk{font:700 1.6rem/1 "Noto Sans TC",monospace;font-variant-numeric:tabular-nums;color:var(--pri)}
.clk.red{color:var(--bad)}
.tot{font-size:.78rem;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.tot.red{color:var(--bad);font-weight:700}
.segs{display:grid;grid-template-columns:30fr 30fr 150fr 60fr 30fr;gap:3px;margin-top:8px}
.segs i{height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--pri)}
.segs i.over b{background:var(--bad)}
.segs i.done b{width:100%!important}
.modechip{font-size:.74rem;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.modechip.h{background:var(--bad-soft);color:var(--bad)}
.modechip.s{background:var(--pri-soft);color:var(--pri)}
/* 題卡 */
.card{margin-top:14px}
.meta{font-size:.8rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ttl{font-weight:700;font-size:1.05rem;line-height:1.5;margin:4px 0 8px;text-wrap:balance}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.85}
.qbox.clamp .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qbox .qx{display:none;margin-left:8px;font-size:.8rem;color:var(--pri);background:none;border:0;padding:0;font-weight:700}.qbox.clamp .qx,.qbox.open .qx{display:inline}
.qbox .nq{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:0 10px}
.recall{margin-top:12px;background:var(--acc-soft);border-radius:12px;padding:12px 14px}
.recall b{display:block;margin-bottom:2px}
.recall ol{margin:4px 0 0;padding-left:1.4em}
.mn{margin-top:10px;font-size:.88rem;color:var(--sub)}
.mn b{color:var(--ink)}
.ev{margin-top:12px}
.blk{border-radius:10px;padding:12px 15px;margin:8px 0;background:var(--cs);transition:opacity .25s}
.blk.b1{--c:var(--b1);--cs:var(--b1s)}.blk.b2{--c:var(--b2);--cs:var(--b2s)}.blk.b3{--c:var(--b3);--cs:var(--b3s)}.blk.b4{--c:var(--b4);--cs:var(--b4s)}
.blk-l{display:inline-block;font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.06em}
.blk p{margin:4px 0 0;line-height:1.85}
.blk .art{color:var(--sub);font-weight:400}
.blk .evp{margin-top:12px}.blk .evh{font-weight:700;margin-top:0}
.blk .evx{display:flex;gap:8px;align-items:baseline}
.blk .evli{display:block;padding-left:1.15em;text-indent:-1.15em;margin-top:3px}
.blk .evt{flex:none;font-size:.74em;line-height:1.6;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--sub);font-weight:600}
.blk.dim{opacity:.38}
.blk.focus{outline:2px solid var(--c);outline-offset:-2px}
.cover{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:.92rem}
/* 檢核 */
.ck{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6;cursor:pointer}
.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--pri)}
.ck label.on{border-color:var(--ok);background:var(--ok-soft)}
.must{flex:none;font-size:.72rem;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:0 7px;margin-top:3px}
.score{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:900 1.8rem/1 "Noto Serif TC",serif;color:var(--pri)}
.score small{color:var(--sub)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 6px;font-weight:700}
.rate button.on[data-v="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rate button.on[data-v="2"]{border-color:var(--b1);background:var(--b1s);color:var(--b1)}
.rate button.on[data-v="3"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hist{margin-top:10px;font-size:.84rem;color:var(--sub)}
/* 底部操作列 */
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.act .hint{font-size:.8rem;color:var(--sub);flex:1;min-width:0}
.done-box{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (max-width:480px){.modes{grid-template-columns:1fr}.clk{font-size:1.4rem}}
.pz{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;line-height:1;padding:0}
body.paused .pz{background:var(--pri);border-color:var(--pri);color:var(--on)}
.pzbox{display:none;margin-top:16px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub)}
.pzbox b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:4px}
body.paused .pzbox{display:block}
body.paused #body,body.paused .qbox,body.paused .ttl,body.paused .meta{display:none}
body.paused .clk{opacity:.5}
body.paused #nextBtn{opacity:.45;pointer-events:none}
.thb{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap}
</style>
</head>

<script>
var CARDS=[{"id": "114-一", "no": "114年第一題", "t": "共有屋頂平台：默示分管＋對後手效力", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲為某公寓五樓住戶，該公寓之屋頂平台係屬全體十戶區分所有權人按其應有部分共有。甲於20多年前在屋頂平台上增建一處鋼構加蓋房屋，自用作倉庫與晾衣之用，歷年來其他區分所有權人均未對此提出異議。乙於2年前購得該公寓四樓房屋後，發現屋頂平台被甲占用，遂主張系爭增建物妨礙其共有物使用，請求甲拆除並返還占用部分予全體共有人。甲抗辯：其占用屋頂平台已逾20年，其他共有人均未反對，已成立默示分管契約，該分管契約對後來之買受人乙亦有拘束力，故乙不得請求拆除或返還。試問，誰的主張有理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>分管契約得以明示或默示成立，性質上僅具債之效力，原則上僅拘束締約之共有人。不動產分管約定依<span class=\"art\">民法第826條之1第1項</span>，須登記後始對應有部分之受讓人生效；未登記者，釋字第349號解釋以受讓人明知或可得而知為拘束後手之要件；區分所有建物共有部分，另有<span class=\"art\">第799條之1第4項</span>特別規定。本題應區分分管是否成立與是否拘束後手二層次。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第820條第1項</span>（管理之多數決，契約含默示分管）；<span class=\"art\">第799條之1第4項</span>（其他約定對特定繼受人之效力）；<span class=\"art\">第826條之1第1項</span>（分管約定登記之效力）；<span class=\"art\">第767條第1項</span>（返還及除去妨害）；<span class=\"art\">第821條</span>（回復共有物須為全體利益）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）默示分管是否成立</p><p>依<span class=\"art\">第820條第1項</span>，共有物之管理除契約另有約定外，應經多數決同意，此契約包含默示分管；惟單純沉默原則上不得謂為默示之意思表示。本題中，甲增建逾20年，其他共有人僅未異議，屬單純沉默，尚不足認定默示分管成立。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>沉默欠缺推知合意之表示價值。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）縱成立，是否拘束乙</p><p>依<span class=\"art\">第799條之1第4項</span>，區分所有人依其他約定所生之權利義務，特定繼受人對於約定之內容明知或可得而知者，始受拘束。本題中，屋頂平台屬共有部分，增建外觀僅足推知占用事實，不足推知分管約定內容，甲亦未能舉證乙受讓時明知或可得而知，該約定不拘束乙；依<span class=\"art\">第826條之1第1項</span>，未登記亦不生該項之效力。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護受讓人之交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙得否請求拆除返還</p><p>依<span class=\"art\">第767條第1項</span>，所有人對無權占有者得請求返還，對妨害得請求除去；依<span class=\"art\">第821條但書</span>，回復共有物僅得為共有人全體之利益為之。本題中，甲未經他共有人全體同意占用特定部分，乙得依<span class=\"art\">第767條第1項</span>中段請求拆除，依同項前段及<span class=\"art\">第821條但書</span>請求返還予全體共有人；已登記不動產之此等請求權無消滅時效之適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>甲之占用對乙欠缺得以對抗之權源。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，默示分管原則上不成立；縱成立，乙受讓時非明知或可得而知，該約定不拘束乙。乙得依<span class=\"art\">第767條第1項</span>及<span class=\"art\">第821條但書</span>請求甲拆除增建物並返還占用部分予全體共有人，乙之主張有理由。</p>"], "ck": [{"x": "§820Ⅰ 除契約另有約定外依多數決（實務：契約含默示分管）", "h": false}, {"x": "其他共有人僅未異議＝單純沉默，原則不成立默示分管", "h": true}, {"x": "§799-1Ⅳ 共有部分之其他約定，以繼受人明知或可得而知為限受拘束", "h": true}, {"x": "「分管成立」與「對後手生效」分兩層；甲未證乙明知或可得而知", "h": true}, {"x": "§826-1Ⅰ 未登記亦不對受讓人生效，結論一致", "h": false}, {"x": "甲雖為共有人，未經同意占用特定部分即侵害他共有人權利", "h": false}, {"x": "已登記不動產之§767請求權無消滅時效適用，占用逾20年不影響乙之請求", "h": false}, {"x": "乙依 §767Ⅰ 及 §821但書請求拆除並返還全體共有人，乙有理由", "h": false}], "mn": "沉默≠默示 → 縱成立，§799-1Ⅳ 乙不知不受拘束 → 共有人擅占也要拆 → §767＋§821但書返還全體"}, {"id": "110-一", "no": "110年第一題", "t": "共有物分割：抵押權按比例續存", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲與乙共有一筆土地，甲持分2/3，乙持分為1/3。乙分別於99年1月28日、99年8月10日、99年9月8日設定最高限額抵押權與丙、丁、戊等人。嗣後甲與乙於110年3月18日訴請法院分割，兩人並因此取得因分割而形成單獨所有的土地，而上述三筆抵押權按應有部分比例移轉到甲與乙之土地上。甲不服該抵押權移轉到自己分得單獨所有的土地上，遂向法院起訴請求塗銷抵押權登記。請問甲之請求是否有理由？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>共有物分割使各共有人取得單獨所有權，共有關係消滅。應有部分上之抵押權係就該共有人之權利比例所設定，若因分割而消滅，將損及抵押權人之擔保利益，故民法規定原則上不因分割而受影響，按原應有部分轉載於分割後各宗土地；僅於例外情形始移存於抵押人分得之部分。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第824條之1第1項</span>（分割後取得分得部分所有權）、第2項（本文不受影響、但書三款移存）；<span class=\"art\">第767條第1項</span>中段（除去妨害）；土地登記規則<span class=\"art\">第107條</span>（按原應有部分轉載）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲乙各自取得分得部分之單獨所有權</p><p>依<span class=\"art\">民法第824條之1第1項</span>，共有人自分割效力發生時起取得分得部分之所有權。本題中，甲乙經裁判分割，各就分得土地取得單獨所有權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>分割使共有關係消滅。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）原則不受影響、例外移存</p><p>依同條第2項，應有部分之抵押權不因分割而受影響；但權利人同意分割、已參加分割訴訟或經告知訴訟而未參加者，移存於抵押人分得之部分。本題中，丙丁戊之抵押權設定於乙之應有部分三分之一。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧抵押權人之擔保利益。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙丁戊無但書情形者，抵押權依本文轉載於甲乙之地</p><p>本題甲乙係訴請裁判分割，非丙丁戊同意之協議分割，題目亦未載丙丁戊參加訴訟或經告知，應認不該當但書；依第2項本文及土地登記規則<span class=\"art\">第107條本文</span>，抵押權按乙原應有部分三分之一轉載於甲、乙分得之各宗土地，與題示事實吻合。反之，若丙丁戊有但書情形，則僅移存於乙分得之土地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>但書以抵押權人參與分割程序為關鍵。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）甲依<span class=\"art\">第767條第1項</span>中段請求塗銷，原則無理由，有但書情形則有理由</p><p>依<span class=\"art\">第767條第1項</span>中段，所有人對妨害其所有權者得請求除去。本題中，甲雖非抵押權設定人，惟抵押權依本文轉載於甲地屬法定負擔，非不法妨害，甲請求無理由；若有但書情形，甲地上之登記即屬妨害，甲請求有理由。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>原則轉載、例外移存。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>本題未見丙丁戊有但書情形，依<span class=\"art\">民法第824條之1第2項本文</span>，抵押權不因分割而受影響，按乙原應有部分三分之一轉載於甲乙分得之土地，甲依<span class=\"art\">第767條第1項</span>中段請求塗銷，原則上無理由；惟若丙丁戊有但書情形，抵押權僅移存於乙分得之土地，甲之請求即有理由。</p>"], "ck": [{"x": "§824-1Ⅰ：分割效力發生時起取得分得部分單獨所有權", "h": false}, {"x": "§824-1Ⅱ本文：抵押權不因分割而受影響（原則），按原應有部分轉載於分割後各宗土地（土地登記規則§107）", "h": true}, {"x": "§824-1Ⅱ但書：同意分割、參加訴訟、經告知未參加 → 才移存抵押人分得部分（例外）", "h": true}, {"x": "丙丁戊未同意、未參加、未經告知，不該當但書三款", "h": false}, {"x": "甲乙分得之地各負擔乙原應有部分1/3之抵押權（非甲2/3、乙1/3），乃本文之法定結果", "h": false}, {"x": "§767Ⅰ中段：甲塗銷之請求權基礎；但書情形甲地上之登記屬妨害", "h": true}, {"x": "依本文甲請求塗銷無理由；有但書情形則有理由", "h": false}], "mn": "分割各拿一塊 → 本文不受影響 → 但書三款都沒有 → 按乙原應有部分轉載各宗土地 → 甲塗銷原則無理由（但書情形有理由）"}, {"id": "106-一", "no": "106年第一題", "t": "共有出租＋共同借款是否連帶", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲乙丙丁共同出資並借款購置公寓，由甲負責付息予戊，甲未經其他共有人同意，逕將一樓出租予娃娃機店。問：該出租契約效力如何？戊應如何向四人追討借款？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>共有物之出租屬管理行為，應經共有人多數決同意，未經同意者，對未同意之共有人不生效力。數人共同負擔之借款債務，以可分之債為原則，除明示對債權人各負全部給付之責任或法律規定外，並非當然連帶，債權人不得逕向任一債務人請求全部。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第820條第1項</span>（共有物管理之多數決）、<span class=\"art\">第817條第2項</span>（應有部分不明者推定均等）、<span class=\"art\">第767條第1項前段</span>（所有物返還請求權）、<span class=\"art\">第821條</span>（共有人對第三人之權利）、<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第271條</span>（可分之債）、<span class=\"art\">第272條</span>（連帶債務以明示或法律規定為限）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）出租契約之效力</p><p>依<span class=\"art\">民法第820條第1項</span>，共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之，出租為管理行為。本題中，題目未載各人應有部分，依<span class=\"art\">第817條第2項</span>推定各為四分之一；甲一人逕將一樓出租予娃娃機店，人數及應有部分均未過半，亦未逾三分之二，租約對乙丙丁不生效力，僅於甲與承租人間有債之拘束力。承租人對乙丙丁屬無權占有，乙丙丁得依<span class=\"art\">第767條第1項前段</span>及<span class=\"art\">第821條但書</span>請求返還一樓予共有人全體；甲收取之租金逾其應有部分者，並得依<span class=\"art\">第179條</span>請求返還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>共有物之使用收益應由多數決定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）戊之追討方式</p><p>依<span class=\"art\">第271條</span>，數人負同一債務而給付可分者，除法律另有規定或契約另有訂定外，應各平均分擔；依<span class=\"art\">第272條</span>，連帶債務須數人明示對債權人各負全部給付之責任，或有法律規定。本題中，借款屬可分之金錢債務，題目未敘明四人有連帶清償之特別約定，亦無法律規定，戊僅得按各人約定或均等比例分別請求，不得請求任一人清償全部。甲負責付息僅係內部分工，不足認已明示連帶；甲代付利息逾其分擔部分者，得依內部約定向其他三人請求償還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不當然連帶可避免加重債務人責任。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>出租契約對乙丙丁不生效力，僅拘束甲與承租人；乙丙丁得請求承租人返還一樓予全體共有人，並得請求甲返還逾其應有部分之租金。戊除能證明四人明示各負全部給付責任或法律另有規定外，僅得按平均分擔之部分分別向四人請求，不得向任一人請求全額。</p>"], "ck": [{"x": "§820Ⅰ 出租屬管理行為，須過半數且應有部分合計過半數同意", "h": false}, {"x": "甲未經乙丙丁同意出租，對未同意者不生效力", "h": false}, {"x": "租約僅在甲與承租人間有債之拘束力，甲自負責任", "h": false}, {"x": "§767Ⅰ前段＋§821但書：乙丙丁請求承租人返還全體；§179：甲所收租金逾應有部分者應返還", "h": false}, {"x": "§271 數人負同一可分債務，各平均分擔", "h": false}, {"x": "§272：共同借款不當然連帶，題示無明示亦無法律規定", "h": true}, {"x": "戊按分擔比例分別請求，不得向一人求償全額", "h": true}], "mn": "出租是管理 → 看多數決 → 借款不當然連帶 → §271 平均各自要"}, {"id": "105-二", "no": "105年第二題", "t": "區分所有頂樓加蓋：使用權源＋買賣效力", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲為A公寓5樓之區分所有權人，將公寓頂樓搭建鐵皮屋並隔成三間房間使用（未辦建物所有權第一次登記），其他區分所有權人長期未表反對意思，今甲將該5樓及頂樓鐵皮屋一併出售予乙。問：甲於頂樓搭建鐵皮屋之使用權源為何？甲乙間就該鐵皮屋之買賣契約是否有效？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>屋頂平台屬共有部分，原則上由全體區分所有權人共同使用；共有人間得以明示或默示成立分管契約，作為特定共有人使用之權源。違章建築雖無法辦理移轉登記，其買賣契約之效力不因此受影響，僅物權效果受限制。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第799條第3項</span>（共有部分得經規約供特定所有人使用）；<span class=\"art\">第767條第1項</span>（物上請求權）、<span class=\"art\">第821條但書</span>（回復共有物須為全體利益）；<span class=\"art\">第246條</span>（以不能之給付為標的者無效）、<span class=\"art\">第71條</span>（違反強制規定之效力）；<span class=\"art\">第799條之1第4項</span>（其他約定對特定繼受人之效力）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲於頂樓搭建鐵皮屋之使用權源</p><p>依<span class=\"art\">第799條第3項</span>，共有部分得經規約約定供特定所有人使用，另共有人間亦得成立分管契約；默示分管須有足以間接推知合意之舉動或特別情事，單純沉默原則上不構成默示意思表示（最高法院101年度台上字第1294號判決參照）。本題中，未見規約；其他區分所有權人僅長期未表反對，若無其他特別情事，難認默示分管成立，甲即屬無權占用，其他區分所有權人得依<span class=\"art\">第767條第1項</span>及<span class=\"art\">第821條但書</span>，請求甲拆除鐵皮屋並將平台返還全體共有人。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>沉默不得逕認為同意。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲乙間鐵皮屋買賣契約之效力</p><p>依<span class=\"art\">第246條</span>，以不能之給付為契約標的者無效；依<span class=\"art\">第71條</span>，違反強制或禁止規定者無效。本題中，甲出資興建鐵皮屋而原始取得其所有權，雖屬違章建築無法辦理移轉登記，然事實上處分權仍得移轉，非屬給付不能，依實務見解亦不因違反建築管理法規而無效，故買賣契約有效，乙取得事實上處分權。至分管約定，依<span class=\"art\">第799條之1第4項</span>，以乙對約定內容明知或可得而知者為限始受拘束；乙係連同5樓一併買受，通常明知，若默示分管成立，乙應受拘束。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>債權契約與物權歸屬應分開判斷。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）其他區分所有權人僅長期未反對，屬單純沉默，原則上難認默示分管成立，須有特別情事甲始有使用權源；否則甲屬無權占用，其他區分所有權人得依<span class=\"art\">第767條第1項</span>、<span class=\"art\">第821條但書</span>請求拆除返還。（二）甲乙間鐵皮屋之買賣契約有效，乙取得事實上處分權；乙通常明知，若默示分管成立應受拘束。</p>"], "ck": [{"x": "§799Ⅱ 共有部分＝專有部分以外之其他部分，頂樓平台屬之（解釋）；§820Ⅰ 管理除契約另有約定外依多數決", "h": false}, {"x": "他人僅長期未反對＝單純沉默，原則不成立默示分管", "h": true}, {"x": "須有特別情事，甲始得以默示分管為使用權源；否則甲屬無權占用，他共有人得請求拆除", "h": false}, {"x": "違建無保存登記，不影響買賣（債權契約）效力，非 §246 給付不能、亦非 §71 無效；甲原始取得違建所有權", "h": true}, {"x": "甲乙鐵皮屋買賣契約有效", "h": true}, {"x": "乙僅取得鐵皮屋之事實上處分權，非所有權", "h": false}, {"x": "§799-1Ⅳ 乙明知或可得而知始受拘束；向甲一併買受通常明知", "h": false}], "mn": "頂樓是共有 → 單純沉默難成默示分管 → 違建照樣能賣（債權有效）→ 乙只拿事實上處分權 → 乙明知就受分管拘束"}, {"id": "103-二", "no": "103年第二題", "t": "分割共有物：抵押權移存＋補償金保障", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙共有一筆土地，面積100平方公尺，僅符合建築面積最小單位，應有部分分別為甲十分之八、乙十分之二，甲、乙以其應有部分分別向丙、丁貸款，設定抵押權作為擔保。嗣甲請求分割，因與乙無法達成協議，遂提起分割共有物之訴，法院依民法第824條第3項規定，判決將該共有地分配於甲，並命甲補償乙新臺幣100萬元。請問乙對甲之補償金債權，民法設有何種保障機制？又丁在乙之應有部分上原有之抵押權如何處理？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>共有物分割後，應有部分上原有之抵押權原則上不因分割而受影響，例外移存於抵押人分得之部分。又以原物分配而須以金錢補償他共有人時，為保障受補償人之補償金債權，民法另設法定抵押權，使其就補償義務人分得之不動產優先受償。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第824條第3項</span>（原物分配兼金錢補償）；<span class=\"art\">第824條之1第2項</span>（抵押權不受影響、但書移存）、第3項（準用<span class=\"art\">第881條第1項</span>、第2項）、第4項（補償金之法定抵押權）、第5項（一併登記及次序）；<span class=\"art\">第865條</span>（登記先後法理）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙補償金債權之保障</p><p>依<span class=\"art\">第824條之1第4項</span>，以原物分配而應以金錢補償之不動產分割，應受補償之共有人就補償金額，對補償義務人分得之不動產有抵押權。本題中，土地僅100平方公尺，法院依<span class=\"art\">第824條第3項</span>將土地分配予甲並命補償乙100萬元，乙即就該款對甲分得之土地有法定抵押權；依同條第5項應於分割登記時一併登記，次序優先於第2項但書移存之抵押權，至依本文轉載、登記在先者，則依登記先後（<span class=\"art\">第865條</span>法理）。故丙之抵押權如屬但書移存，乙優先；如依本文轉載，丙優先。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>受補償人未取得原物，須以物權擔保。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丁抵押權之處理</p><p>依<span class=\"art\">第824條之1第2項</span>，應有部分之抵押權不因分割而受影響，但權利人同意分割、已參加分割訴訟或經告知訴訟而未參加者，移存於抵押人分得之部分。本題中，丁之抵押權原設定於乙之2/10應有部分，題未載有無但書情形，分論：無但書情形者，依本文仍按乙原2/10存在於甲分得之土地；有但書情形者，乙僅受金錢補償，依同條第3項準用<span class=\"art\">第881條第1項</span>、第2項，丁就乙對甲之補償金債權有權利質權，次序與原抵押權同。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>使擔保價值不因分割而落空。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙之補償金債權，依<span class=\"art\">第824條之1第4項</span>、第5項，就甲分得之土地有法定抵押權，於分割登記時一併登記，次序優先於但書移存之抵押權，但不優先於依本文轉載、登記在先者。丁之抵押權原則上仍按乙原2/10存在於甲分得之土地；符合但書情形者，依第3項準用<span class=\"art\">第881條第1項</span>、第2項，就乙之補償金債權有權利質權，次序與原抵押權同。</p>"], "ck": [{"x": "§824Ⅲ：土地無法原物分割，判歸甲並命補償乙 100 萬", "h": false}, {"x": "§824-1Ⅳ：乙就補償金對甲分得之土地有抵押權", "h": true}, {"x": "§824-1Ⅴ：分割登記時一併登記，次序優先於Ⅱ但書抵押權", "h": true}, {"x": "§824-1Ⅱ本文：丁抵押權不因分割而受影響，仍按 2/10 存在於甲分得地", "h": true}, {"x": "但書情形且乙僅受金錢補償→準用 §881Ⅰ、Ⅱ，丁就補償金債權有權利質權", "h": false}, {"x": "丙抵押權：本文按甲原 8/10 續存於甲分得地；符合但書才移存於全部", "h": false}, {"x": "乙有法定抵押權保障；丁抵押權不消滅：本文按 2/10 續存甲分得地，但書情形就補償金有權利質權", "h": false}], "mn": "判歸甲補償乙 → 乙有法定抵押權、登記排前面 → 丁不受影響 → 但書情形、補償金上有權利質權"}, {"id": "102-一", "no": "102年第一題", "t": "共有物出租vs修繕：管理行為與保存行為", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲乙丙共有房屋，應有部分各三分之一，甲出租於丁，又因房屋門窗不牢僱工修復後交付丁使用。甲出租契約效力如何？乙丙對丁可否主張所有物返還請求權？甲僱工修復是否需事先徵得乙丙同意？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>民法就共有人對共有物所為之行為，區分管理行為與保存行為：管理行為（如出租）攸關共有物整體之使用收益，原則上應經多數決同意；保存行為（如單純修繕）具急迫性且有利於全體，各共有人得單獨為之，無須事先取得他共有人同意。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第820條第1項</span>（管理之多數決）、第5項（保存行為）；<span class=\"art\">第821條</span>（共有人對第三人之請求）；<span class=\"art\">第767條第1項前段</span>（所有物返還）；<span class=\"art\">第822條</span>（負擔之分擔與求償）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲出租契約之效力</p><p>依<span class=\"art\">第820條第1項</span>，共有物之管理應以共有人過半數及其應有部分合計過半數之同意行之，應有部分合計逾三分之二者，人數不予計算。本題中，出租屬管理行為，甲僅1人、應有部分三分之一，人數及應有部分均未過半，亦未逾三分之二，擅自出租之租約對乙丙不生效力，僅於甲丁間有債之拘束力，甲自負契約責任。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>管理行為涉及全體之使用收益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙丙得否對丁主張返還</p><p>依<span class=\"art\">第821條</span>，各共有人對於第三人，得就共有物之全部為本於所有權之請求，但回復共有物之請求，僅得為共有人全體之利益為之。本題中，租約對乙丙不生效力，丁對乙丙屬無權占有，乙丙得依<span class=\"art\">第767條第1項前段</span>及<span class=\"art\">第821條</span>，為共有人全體之利益請求丁返還房屋。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>共有人之權利及於共有物全部。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）修繕是否須事先同意</p><p>依<span class=\"art\">第820條第5項</span>，共有物之簡易修繕及其他保存行為，得由各共有人單獨為之。本題中，修復不牢之門窗屬保存行為，甲不須事先徵得乙丙同意；修繕費依<span class=\"art\">第822條第1項</span>按應有部分分擔，甲支出逾三分之一者，得依同條第2項向乙丙請求償還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保存行為有利於全體共有人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，（一）甲擅自出租未經多數決，租約僅於甲丁間有效，對乙丙不生效力。（二）乙丙得依<span class=\"art\">第767條第1項前段</span>及<span class=\"art\">第821條</span>，為全體利益請求丁返還房屋。（三）修復門窗屬保存行為，甲得單獨為之，不須事先徵得乙丙同意，逾應分擔部分得依<span class=\"art\">第822條第2項</span>求償。</p>"], "ck": [{"x": "§820Ⅰ 管理須人數及應有部分過半（逾2/3人數不計）", "h": false}, {"x": "出租屬管理行為，甲1/3未經同意，對乙丙不生效力", "h": true}, {"x": "§821 各共有人得就全部請求，回復須為全體利益", "h": false}, {"x": "乙丙依 §767、§821 請求丁返還，須為全體利益", "h": false}, {"x": "§820Ⅴ 簡易修繕及保存行為得單獨為之", "h": false}, {"x": "修門窗屬保存行為，不是管理行為", "h": true}, {"x": "甲修繕不須事先徵得乙丙同意", "h": false}, {"x": "§822Ⅱ 修繕費逾應分擔部分，得向乙丙按應分擔部分請求償還", "h": false}], "mn": "出租＝管理要多數 → 甲1/3不夠、對乙丙不生效 → 丁無權占有，乙丙為全體請求返還 → 修繕＝保存自己來"}, {"id": "100-二", "no": "100年第二題", "t": "分別共有vs公同共有比較", "lv": "", "k": "off", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙為兄弟，共同出資購買A地，應有部分各二分之一。嗣後甲、乙之父親死亡，二人共同繼承其遺產B地及C屋，應繼分均等。問：①甲乙在A地上之共有關係與在B地及C屋上之共有關係，其型態有何不同？試比較說明之。②應有部分與應繼分有何區別？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>分別共有係數人按應有部分共有一物，各共有人得自由處分其應有部分；公同共有則基於公同關係（如繼承、合夥）共有一物，各人權利及於公同共有物之全部，無得自由處分之應有部分（僅有潛在應有部分），處分原則須得全體同意。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第817條</span>、<span class=\"art\">第819條</span>、<span class=\"art\">第820條第1項</span>、<span class=\"art\">第823條第1項</span>（分別共有）；<span class=\"art\">第827條第3項</span>、<span class=\"art\">第828條第2項</span>、第3項、<span class=\"art\">第829條</span>（公同共有）；<span class=\"art\">第1151條</span>、<span class=\"art\">第1164條</span>（遺產）；土地法<span class=\"art\">第34條之1第5項</span>。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A地為分別共有，B地C屋為公同共有</p><p>依<span class=\"art\">第817條</span>，數人按應有部分共有一物為分別共有；依<span class=\"art\">第1151條</span>，繼承人有數人時，分割遺產前對遺產全部為公同共有。本題中，甲乙出資購買A地、應有部分各二分之一，屬分別共有，得依<span class=\"art\">第819條第1項</span>自由處分應有部分；B地C屋因繼承而公同共有，依<span class=\"art\">第827條第3項</span>權利及於全部，依<span class=\"art\">第828條第3項</span>處分須甲乙全體同意（不動產得依土地法<span class=\"art\">第34條之1第5項</span>準用多數決）。分別共有物全部之處分依<span class=\"art\">第819條第2項</span>亦須全體同意，故差異在有無可單獨處分之應有部分。管理上，分別共有依<span class=\"art\">第820條第1項</span>，公同共有依<span class=\"art\">第828條第2項</span>準用；分割上，分別共有得依<span class=\"art\">第823條第1項</span>隨時請求，公同共有依<span class=\"art\">第829條</span>不得請求，惟遺產得依<span class=\"art\">第1164條</span>請求分割。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>公同共有以公同關係為基礎。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）應有部分是具體所有權比例，應繼分是遺產分配之抽象基準</p><p>依<span class=\"art\">第817條</span>、<span class=\"art\">第819條第1項</span>，應有部分係各共有人對共有物之量化所有權比例，已具體化、可自由處分；應繼分則係各繼承人對遺產整體應得之比例，僅為計算分配之基準。本題中，甲乙得單獨出賣A地應有部分，但於遺產分割前，不得就B地或C屋主張或處分相當於應繼分之部分。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>依<span class=\"art\">第1151條</span>遺產為公同共有，應繼分尚未具體化於特定標的物。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲乙就A地為分別共有，各有可自由處分之應有部分；就B地C屋為公同共有，權利及於遺產全部，處分原則須全體同意，管理與分割亦有不同。（二）應有部分是已具體化、可自由處分之所有權比例；應繼分則是計算遺產分配之抽象比例基準，二者性質不同。</p>"], "ck": [{"x": "§817 分別共有；§827～§829 公同共有；§1151 遺產分割前公同共有", "h": false}, {"x": "A地出資購買、各1/2＝分別共有，應有部分可自由處分（§819Ⅰ）", "h": false}, {"x": "B地C屋因繼承，分割前為公同共有", "h": false}, {"x": "公同共有無得自由處分之應有部分，處分原則須全體同意（不動產例外：土地法§34-1Ⅴ）", "h": true}, {"x": "應有部分：分別共有下具體、可自由處分之所有權比例", "h": true}, {"x": "應繼分：計算遺產分配之抽象比例，分割前不得單獨處分", "h": true}, {"x": "分割：§823Ⅰ 分別共有隨時請求；§829 公同共有存續中不得；§1164 遺產得隨時請求分割", "h": true}], "mn": "出資 → 分別共有 → 有份可自賣；繼承 → 公同共有 → 無份要全體；應有部分具體、應繼分抽象"}, {"id": "來勝-二", "no": "來勝115模擬試題（一） 申論二", "t": "應有部分設定抵押：分割後抵押權移存於抵押人分得部分", "lv": "", "k": "mock", "tier": 2, "g": "共有・分管・區分所有", "q": "甲、乙、丙三人共有A土地一筆，各有三分之一之應有部分。嗣丙因經營事業需要資金，向丁銀行借款新臺幣600萬元，並以其對A土地之三分之一應有部分設定第一順位普通抵押權予丁銀行，且已辦妥抵押權設定登記。數年後，甲認為共有關係造成土地利用不便，遂請求分割共有物。因甲、乙、丙無法就分割方法達成協議，甲乃向法院提起分割共有物之訴。法院於訴訟程序中將分割訴訟之情形告知丁銀行，丁銀行收受通知後並未參加訴訟。法院審理後，判決將A土地原物分割為A1、A2及A3三筆土地，分別由甲、乙、丙單獨取得。其中丙分得A3土地。嗣丙未依約清償對丁銀行之借款，丁銀行主張其原係以丙對A土地之三分之一應有部分設定抵押權，共有物嗣後之分割不得損害其抵押權，故其抵押權仍得及於甲、乙、丙分割後所取得之A1、A2、A3三筆土地。甲、乙則主張，其二人從未為丙之債務提供擔保，丁銀行僅得就丙所分得之A3土地主張抵押權。試依民法規定回答下列問題：（一）丙得否未經甲、乙同意，單獨以其對A土地三分之一之應有部分設定抵押權予丁銀行？其抵押權效力如何？（二）丁銀行原設定於丙三分之一應有部分之抵押權，其效力及標的有何變化？嗣丙未依約清償借款時，丁銀行得對何一土地實行抵押權？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>應有部分，指各共有人對共有物所有權之抽象比例。抵押權之移存，指應有部分上之抵押權，於共有物分割後，集中存在於抵押人所分得之特定部分，不再及於其他共有人分得之部分。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第819條第1項</span>（自由處分應有部分）、第2項（共有物設定負擔應得全體同意）；<span class=\"art\">第758條第1項</span>（登記生效）；<span class=\"art\">第860條</span>（普通抵押權）；<span class=\"art\">第824條之1第1項</span>（分割後取得分得部分之所有權）、第2項本文及但書第3款（權利人經共有人告知訴訟而未參加者，移存於抵押人分得之部分）；<span class=\"art\">第873條</span>（拍賣抵押物）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙得自行以應有部分設定抵押權，經登記有效</p><p>丙以其三分之一應有部分設定抵押權，屬處分自己之應有部分，依<span class=\"art\">第819條第1項</span>得自由為之，無須甲乙同意；<span class=\"art\">第819條第2項</span>須全體同意者，係就共有物全部設定負擔，與本題不同。該抵押權已依<span class=\"art\">第758條第1項</span>登記，有效成立，丁銀行就丙之應有部分取得第一順位普通抵押權，得就其賣得價金優先受償（<span class=\"art\">第860條</span>）。</p></div><div class=\"evp\"><p class=\"evh\">（二）丁銀行受告知訴訟而未參加，抵押權移存於A3，只能拍賣A3</p><p>法院判決原物分割後，丙依<span class=\"art\">第824條之1第1項</span>取得A3之單獨所有權。依同條第2項本文，應有部分上之抵押權原則上不因分割而受影響，按原比例存續於A1、A2、A3，此即丁銀行主張之依據。惟同項但書第3款規定，權利人經共有人告知訴訟而未參加者，權利移存於抵押人所分得之部分。本題丁銀行於分割訴訟中受告知而未參加，已有參與分割程序之機會而放棄，題目雖為法院告知，依該款保障抵押權人參與程序之意旨應同其效果，抵押權移存於丙分得之A3，不再及於A1、A2，甲乙之主張有理由。丙屆期未清償，丁銀行得依<span class=\"art\">第873條</span>聲請法院拍賣A3，就賣得價金優先受償。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）丙得未經甲乙同意，以其應有部分設定抵押權，經登記有效。（二）丁銀行受告知訴訟而未參加，依<span class=\"art\">第824條之1第2項但書</span>第3款，抵押權移存於丙分得之A3；丙屆期未清償，丁銀行僅得依<span class=\"art\">第873條</span>拍賣A3，不得就A1、A2實行抵押權。</p>"], "ck": [{"x": "§819Ⅰ 應有部分自由處分 vs §819Ⅱ 共有物全部設定負擔才要全體同意", "h": true}, {"x": "已登記 → 抵押權有效，標的是丙的三分之一應有部分", "h": false}, {"x": "§824-1Ⅰ 分割效力發生時取得分得部分", "h": false}, {"x": "§824-1Ⅱ本文 原則不受影響（先寫丁的主張）", "h": true}, {"x": "但書第3款：經告知訴訟而未參加 → 移存A3（款次不要寫錯）", "h": true}, {"x": "§873 只能拍賣A3，不得就A1、A2實行", "h": false}], "mn": "應有部分自由押 → 分割原則跟著比例走 → 同意、參加、告知未參加三款移存 → 只拍抵押人分得那塊"}, {"id": "專練-一", "no": "申論專練卷① 申論一", "t": "共有：分管約定未登記與多數決出租、租金返還", "lv": "", "k": "mock", "tier": 2, "g": "共有・分管・區分所有", "q": "甲、乙、丙共有 A 地，應有部分各三分之一。三人口頭約定：A 地東半部由甲使用，西半部由乙、丙使用，未辦理登記。113 年甲將其應有部分出賣並移轉登記予丁，丁買受時不知上開約定。114 年乙、丙未經丁同意，將 A 地全部出租予戊經營停車場，租期三年，每月租金 3 萬元均由乙、丙收取。試問：（一）甲乙丙間之使用約定，對丁有無拘束力？（二）乙、丙出租 A 地之效力如何？丁得否請求戊返還 A 地？丁就租金得主張何種權利？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>分管約定指共有人間約定各自分別占有、使用共有物特定部分之契約。共有物之管理指對共有物為保存、改良及利用之行為；依通說及實務，出租共有物屬管理行為，而非處分行為。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第826條之1第1項</span>、第2項（分管約定登記後始拘束受讓人）、<span class=\"art\">第820條第1項</span>、第2項、第4項（管理多數決；聲請變更；連帶賠償）、<span class=\"art\">第818條</span>（按應有部分收益）、<span class=\"art\">第821條</span>、<span class=\"art\">第767條第1項前段</span>（返還請求）、<span class=\"art\">第179條</span>（不當得利）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）分管約定對丁無拘束力</p><p>依<span class=\"art\">第826條之1第1項</span>，不動產共有人間關於共有物使用、管理之約定，於登記後，始對應有部分之受讓人具有效力。本題中，甲乙丙之分管約定未登記，丁受讓甲之應有部分，不論是否知悉均不受拘束；知悉標準依同條第2項僅適用於動產。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不動產以登記為公示方法。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）出租有效，丁不得請求戊返還，但得請求返還租金</p><p>依<span class=\"art\">第820條第1項</span>，共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。本題中，分管約定不能拘束丁，回歸多數決；乙丙占三人之過半數，應有部分合計三分之二亦過半數，出租合法，對丁亦有效力。丁於決定時已為共有人，直接受<span class=\"art\">第820條第1項</span>拘束，無<span class=\"art\">第826條之1</span>登記問題。戊為有權占有，丁不得依<span class=\"art\">第821條</span>、<span class=\"art\">第767條第1項前段</span>請求戊返還。惟依<span class=\"art\">第818條</span>，丁按應有部分三分之一有收益權，乙丙收取全部租金，逾越其應有部分之每月1萬元，丁得依<span class=\"art\">第179條</span>請求返還。出租條件顯失公平者，丁得依<span class=\"art\">第820條第2項</span>聲請法院變更；乙丙有故意或重大過失致丁受損害者，依同條第4項連帶賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>多數決合法不等於多數共有人得獨取收益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）分管約定未登記，依<span class=\"art\">第826條之1第1項</span>對丁無拘束力。（二）乙丙出租符合<span class=\"art\">第820條第1項</span>多數決而有效，戊為有權占有，丁不得請求戊返還A地；丁得依<span class=\"art\">第818條</span>、<span class=\"art\">第179條</span>請求乙丙返還逾越應有部分之租金每月合計1萬元，並得視情形依<span class=\"art\">第820條第2項</span>聲請變更、依同條第4項請求賠償。</p>"], "ck": [{"x": "§826-1Ⅰ：不動產分管約定登記後才對應有部分受讓人有效", "h": true}, {"x": "丁知不知情不重要，知悉標準限動產（§826-1Ⅱ）", "h": false}, {"x": "出租＝管理行為，§820Ⅰ 人數及應有部分雙過半；不是 §819Ⅱ 全體同意", "h": true}, {"x": "乙丙 2/3 人數、2/3 應有部分 → 出租有效，戊有權占有，丁不得請求返還", "h": false}, {"x": "§818 收益按應有部分 → 丁每月 1 萬元", "h": true}, {"x": "乙丙多收部分依 §179 返還（各就所受逾越部分）", "h": false}, {"x": "§820Ⅱ 顯失公平聲請變更；§820Ⅳ 故意重過失連帶賠償", "h": false}], "mn": "不動產分管看登記 → 不知情不是理由 → 出租是管理雙過半 → 戊有權占有不必還 → 租金照份分 → 多拿依§179還 → 不公平找法院、重過失連帶賠"}, {"id": "預02", "no": "預測題 02", "t": "共有物分割：抵押權移存與補償金抵押權", "lv": "", "k": "pred", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙、丙共有 A 地，應有部分各為 1/2、1/4、1/4。乙以其應有部分為丁設定抵押權。嗣丙訴請裁判分割，法院判決將 A 地分割為 A1、A2 兩筆，A1 分配於甲，A2 分配於乙；丙因未受原物分配，由甲、乙各以金錢補償丙。試問：（一）丁之抵押權於分割後存在於何處？（二）丙就補償金之保障為何？其與丁之抵押權次序如何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>共有物分割後，原設定於應有部分之抵押權，原則上不因分割而受影響，仍按原應有部分存續於分割後各部分；僅於法定但書情形，始移存於抵押人所分得之部分，此即抵押權移存。補償金抵押權，指以原物分配而有共有人未受分配或不能按應有部分受分配時，受補償之共有人就補償金額，對補償義務人所分得之不動產當然取得之抵押權。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第824條第3項</span>（金錢補償）、<span class=\"art\">第824條之1第2項</span>（抵押權不受分割影響；但書三款移存）、<span class=\"art\">第824條之1第4項</span>（補償金抵押權）、<span class=\"art\">第824條之1第5項</span>（一併登記、次序優先於但書抵押權）、<span class=\"art\">第865條</span>（抵押權次序依登記先後）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丁之抵押權於分割後存在於何處</p><p>依<span class=\"art\">第824條之1第2項</span>，應有部分有抵押權者，其權利不因共有物之分割而受影響；但權利人同意分割、已參加分割訴訟，或經告知訴訟而未參加者，移存於抵押人所分得之部分。本題中，題幹未載丁有上述情形，故依本文，丁之抵押權按乙原應有部分（1/4）存續於A1、A2；若有但書情形，則移存於A2。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>抵押權人未參與分割時，其權利不應受影響。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙之保障及與丁之次序</p><p>依<span class=\"art\">第824條之1第4項</span>、第5項，受補償之共有人就補償金額，對補償義務人所分得之不動產有抵押權，應於分割登記時一併登記，次序優先於第2項但書之抵押權。本題中，丙就甲應付補償金對A1、就乙應付補償金對A2各有抵押權。丁之抵押權依但書移存於A2者，丙優先；依本文轉載於A1、A2者，第5項未設特別規定，回歸<span class=\"art\">第865條</span>登記先後，丁登記在先而優先。題幹未載但書情形，故原則上丁優先。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>次序以登記公示為準。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）丁之抵押權原則不受分割影響，按乙原應有部分存續於A1、A2；符合但書三款情形者，移存於乙所分得之A2。（二）丙就甲應付之補償金對A1、就乙應付之補償金對A2，各有法定抵押權，須與分割登記一併登記；丁之抵押權如依但書移存，丙優先，如依本文轉載於各筆土地，依登記先後，丁優先。</p>"], "ck": [{"x": "§824-1Ⅱ本文：應有部分抵押權不因分割而受影響（原則）", "h": true}, {"x": "§824-1Ⅱ但書：同意分割、參加訴訟、告知未參加 → 移存抵押人分得部分", "h": false}, {"x": "題幹未載丁有三款情形，依本文；若符合則移存 A2", "h": false}, {"x": "§824Ⅲ＋§824-1Ⅳ：丙就甲應付補償金對 A1、乙應付補償金對 A2 各有抵押權", "h": true}, {"x": "§824-1Ⅴ：分割登記時一併登記，次序優先於但書抵押權", "h": true}, {"x": "本文情形依登記先後丁優先；但書移存時丙才優先", "h": false}], "mn": "本文不受影響 → 但書才移存 A2 → 丙沒分到拿補償 → 補償金有抵押 → 一併登記只贏移存 → 本文看登記先後"}, {"id": "預03", "no": "預測題 03", "t": "共有物管理：過半數決與分管登記對受讓人效力", "lv": "", "k": "pred", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙、丙共有 A 屋，應有部分甲 3/4、乙 1/8、丙 1/8。甲未經乙、丙同意，將 A 屋一樓出租於丁，租期五年。又，三人曾以書面約定乙專用二樓、丙專用三樓，並已辦理登記。其後甲將其應有部分讓與戊，戊主張乙使用二樓為無權占有，請求返還；乙則主張其曾代甲墊付共有物稅捐 20 萬元，請求戊清償。試問：（一）甲出租一樓之決定是否有效？乙、丙不同意時有何救濟？（二）戊之請求與乙之請求各有無理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>共有物管理，指就共有物之使用、收益、改良等事項所為之決定，依法以多數決為之。分管契約，指共有人間就共有物之使用範圍所為之約定；不動產共有人間之分管約定經登記後，對應有部分之受讓人具有拘束力。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第820條第1項</span>至第4項（多數決管理及其救濟）；<span class=\"art\">第818條</span>（按應有部分使用收益）、<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第826條之1第1項前段</span>（登記之約定拘束受讓人）、<span class=\"art\">第826條之1第3項</span>（受讓人連帶清償負擔）；<span class=\"art\">第822條第2項</span>（墊付負擔之求償）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲出租一樓之決定是否有效及乙、丙之救濟</p><p>依<span class=\"art\">第820條第1項</span>，共有物之管理，應以共有人過半數及其應有部分合計過半數之同意行之，但其應有部分合計逾三分之二者，其人數不予計算。本題中，甲之應有部分3/4逾2/3，得單獨決定出租一樓，租約有效。甲受領租金逾其應有部分者，乙、丙得依<span class=\"art\">第818條</span>、<span class=\"art\">第179條</span>請求返還；管理顯失公平者，得依<span class=\"art\">第820條第2項</span>聲請法院裁定變更；因情事變更難以繼續者，得依同條第3項聲請變更；甲之決定有故意或重大過失致乙、丙受損害者，得依同條第4項請求賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧利用效率與少數保障。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）戊之請求與乙之請求</p><p>依<span class=\"art\">第826條之1第1項前段</span>，不動產共有人間關於共有物使用之約定，於登記後，對於應有部分之受讓人具有效力；依<span class=\"art\">第822條第2項</span>，共有人就共有物之負擔為支付而逾其所應分擔之部分者，得對其他共有人請求償還；依<span class=\"art\">第826條之1第3項</span>，受讓人對讓與人就共有物所生之負擔連帶負清償責任。本題中，乙專用二樓之約定已辦理登記，拘束受讓人戊，乙非無權占有，戊不得請求返還；乙代甲墊付之稅捐屬共有物之負擔，乙得向甲求償，戊應與甲連帶清償，乙請求戊清償20萬元有理由。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>登記之約定及共有物負擔均及於受讓人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲應有部分逾2/3，出租決定有效；乙、丙得依<span class=\"art\">第179條</span>請求返還逾其應有部分之租金，並得聲請法院變更或依<span class=\"art\">第820條第4項</span>請求賠償。（二）分管約定已登記而拘束戊，戊之請求無理由；戊就甲所生負擔應與甲連帶清償，乙之請求有理由。</p>"], "ck": [{"x": "§820Ⅰ 多數決；應有部分逾 2/3 者人數不計（非全體同意）", "h": true}, {"x": "甲 3/4 逾 2/3，得單獨決定出租，租約有效", "h": false}, {"x": "§818、§179、§820Ⅱ：乙丙得按應有部分請求返還租金；顯失公平得聲請法院裁定變更", "h": false}, {"x": "§820Ⅳ 管理決定有故意或重大過失致損害，對不同意之共有人負賠償責任；§820Ⅲ 情事變更得聲請變更", "h": false}, {"x": "§826-1Ⅰ 分管約定須「登記」後才對受讓人有效", "h": true}, {"x": "乙二樓專用已登記，戊不得主張無權占有請求返還", "h": false}, {"x": "§826-1Ⅲ 受讓人戊就甲所生負擔與甲連帶清償", "h": true}, {"x": "戊請求無理由；乙得請求戊清償 20 萬", "h": false}], "mn": "逾 2/3 不算人 → 甲可出租、乙丙分租金 → 分管已登記拘束戊 → 稅捐戊甲連帶"}, {"id": "預12", "no": "預測題 12", "t": "區分所有：規約專用約定與不得分離", "lv": "", "k": "pred", "tier": 1, "g": "共有・分管・區分所有", "q": "A 大樓規約約定：屋頂平台（共有部分）供頂樓區分所有人丁專用。四樓區分所有人庚將四樓專有部分出賣並移轉登記予戊，戊主張該專用約定對其無拘束力，欲使用屋頂平台；另主張自己僅受讓專有部分而未受讓共有部分及基地之應有部分，故不受規約拘束。另有住戶己認為該規約專用約定顯失公平。試問：（一）該專用約定對戊是否有拘束力？（二）己得如何救濟？（三）戊僅受讓專有部分之主張是否可行？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>區分所有建築物，指數人區分一建築物而各專有其一部，就專有部分有單獨所有權，並就共同部分共有之建築物。規約指區分所有人間就共有部分使用、管理等事項所訂之約定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第799條第3項</span>（共有部分得經規約供特定所有人使用）、<span class=\"art\">第799條之1第4項</span>（繼受人受規約拘束）、<span class=\"art\">第799條之1第3項</span>（顯失公平得請求撤銷）、<span class=\"art\">第799條第5項</span>（不得分離移轉）；<span class=\"art\">第71條</span>（違反強制禁止規定無效）、<span class=\"art\">第111條</span>（一部無效）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）專用約定合法，戊應受拘束</p><p>依<span class=\"art\">第799條第3項</span>，共有部分除法律另有規定外，得經規約之約定供區分所有建築物之特定所有人使用。本題中，屋頂平台屬共有部分，規約約定其供丁專用，係就平台之使用為約定，屬合法之專用約定。此係依規約所生之權利義務，依<span class=\"art\">第799條之1第4項</span>，繼受人戊應受拘束，不得主張無拘束力。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>規約須拘束繼受人，始能維持管理秩序。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）己若未同意，得於三個月內訴請撤銷</p><p>依<span class=\"art\">第799條之1第3項</span>，規約內容按其情形顯失公平者，不同意之區分所有人得於規約成立後三個月內，請求法院撤銷之。本題中，題目未交代己是否同意，若己為不同意者，須於規約成立後三個月內請求法院撤銷，逾期不得再請求；己若曾同意，則無從依本項請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>撤銷權僅保護不同意之區分所有人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）戊僅受讓專有部分之主張不可行</p><p>依<span class=\"art\">第799條第5項</span>，專有部分與其所屬之共有部分及其基地之權利，不得分離而為移轉或設定負擔。本題中，僅受讓專有部分而不受讓共有部分及基地應有部分之約定，依<span class=\"art\">第71條</span>違反強制規定而無效（依通說）；惟依<span class=\"art\">第111條但書</span>，除去該部分亦可成立，庚移轉專有部分予戊仍有效，應解為連同共有部分及基地應有部分一併移轉，戊仍為共有人。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>專有、共有與基地須一體化。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）屋頂平台專用約定依<span class=\"art\">第799條第3項</span>合法，依<span class=\"art\">第799條之1第4項</span>對繼受人戊有拘束力。（二）己若為不同意之區分所有人，得於三個月內請求法院撤銷。（三）分離約定無效，專有部分之移轉依<span class=\"art\">第111條但書</span>仍有效，並連同共有部分及基地應有部分移轉，戊之主張不可行。</p>"], "ck": [{"x": "§799Ⅲ 共有部分除法律另有規定外，得經規約供特定所有人使用（屋頂構造除外）", "h": false}, {"x": "§799-1Ⅳ 規約所生權利義務，繼受人應受拘束", "h": true}, {"x": "專用約定對戊有拘束力", "h": false}, {"x": "§799-1Ⅲ 顯失公平，規約成立後三個月內請求法院撤銷", "h": true}, {"x": "§799Ⅴ 專有部分與共有部分、基地權利不得分離移轉", "h": true}, {"x": "戊僅受讓專有部分違反 §799Ⅴ，依 §71 無效（通說）", "h": false}, {"x": "戊僅受讓專有部分之主張不可行", "h": false}, {"x": "§111但書：除去分離約定，移轉仍有效，連同共有部分及基地應有部分移轉", "h": false}], "mn": "規約繼受要遵守 → 顯失公平三月內找法院 → 專有共有基地三樣綁一起"}, {"id": "預20", "no": "預測題 20", "t": "共有人優先承購權：未通知出賣應有部分與分割變價", "lv": "", "k": "pred", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙、丙三人分別共有 A 地，應有部分各三分之一。甲未通知乙、丙，逕以 600 萬元將其應有部分出賣予丁，並已完成所有權移轉登記。乙事後得知，主張其依法有優先承購權，請求塗銷丁之登記。其後乙、丙與丁（已為共有人）無法就 A 地分割達成協議，乙訴請裁判分割，法院判決變賣 A 地，拍賣時非共有人戊出價最高，乙、丙、丁均表示願以相同條件承買。試問：（一）共有人出賣應有部分，他共有人之優先承購權依何規定？要件為何？（二）乙請求塗銷丁之登記，有無理由？乙得主張何種救濟？（三）分割變賣時，乙、丙、丁之優先承買權依何規定？有數人願優先承買時如何處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>共有人之優先承購（買）權，指他共有人得以相同價格或條件優先取得共有物或應有部分之權利，目的在使共有關係單純化。本題有兩種情境：共有人出賣應有部分，依土地法<span class=\"art\">第34條之1第4項</span>；分割時變賣共有物，依<span class=\"art\">民法第824條第7項</span>，二者要件與效果不同。</p>", "<span class=\"blk-l\">二、法條</span><p>土地法<span class=\"art\">第34條之1第2項</span>（處分之通知）、第4項（共有人優先承購權）；<span class=\"art\">民法第758條第1項</span>（不動產物權登記生效）；<span class=\"art\">第184條第2項</span>（違反保護他人之法律）；<span class=\"art\">第216條</span>（損害賠償範圍）；<span class=\"art\">第824條第2項第2款</span>（變賣共有物）、第7項（共有人優先承買、抽籤）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）優先承購權之依據及要件</p><p>依土地法<span class=\"art\">第34條之1第4項</span>，共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。要件為：標的為共有土地或建築改良物之應有部分；共有人出賣（贈與不屬之）；相對人為共有人以外之人；以同一價格行使。本題中，甲將應有部分以600萬元出賣予原非共有人之丁，均符合；甲未為通知，侵害乙、丙之承購機會。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止外人介入。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）塗銷有無理由及救濟</p><p>依<span class=\"art\">民法第758條第1項</span>，甲丁已完成移轉登記。實務認優先承購權無對抗第三人之效力，故乙請求塗銷丁之登記，原則上無理由。惟該項屬保護他人之法律，乙得依<span class=\"art\">第184條第2項</span>向甲請求賠償，範圍依<span class=\"art\">第216條</span>包括所受損害及可得預期之所失利益；丙亦同。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>優先承購權僅具債權效力。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）分割變賣時之優先承買</p><p>依<span class=\"art\">民法第824條第7項</span>，變賣共有物時，除買受人為共有人外，共有人有依相同條件優先承買之權，二人以上願承買者以抽籤定之。本題中，法院依同條第2項第2款判決變賣，戊非共有人，乙、丙及已取得共有人身分之丁均得以相同條件承買，三人均願承買，應抽籤定之。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧公平。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）他共有人依土地法<span class=\"art\">第34條之1第4項</span>得以同一價格優先承購，要件如上述四項。（二）乙請求塗銷丁之登記，依實務見解原則上無理由；乙得依<span class=\"art\">民法第184條第2項</span>向甲請求賠償，範圍依<span class=\"art\">第216條</span>。（三）乙、丙、丁均得依<span class=\"art\">民法第824條第7項</span>以相同條件優先承買，三人均願承買，以抽籤定之。</p>"], "ck": [{"x": "土地法 §34-1Ⅳ：出賣應有部分，同一價格共同或單獨優先承購（與 §824Ⅶ 分開）", "h": true}, {"x": "要件：應有部分・出賣・出賣予外人・同一價格；甲未書面通知，侵害承購機會", "h": false}, {"x": "§758Ⅰ 丁已登記取得；優先承購權僅存於共有人間，無對抗第三人效力", "h": true}, {"x": "乙請求塗銷丁之登記，原則上無理由", "h": false}, {"x": "§184Ⅱ、§216：乙向甲求償（§184Ⅰ前段有爭議，本文不採），所失利益須可得預期", "h": true}, {"x": "§824Ⅱ②、Ⅶ：變賣時依相同條件優先承買，買受人為共有人者除外", "h": false}, {"x": "丁受讓後已為共有人，乙丙丁皆得承買，數人願買以抽籤定之", "h": true}], "mn": "出賣看土地法、變賣看民法 → 債權效力不塗銷 → 找甲賠 → 數人願買抽籤"}, {"id": "預21", "no": "預測題 21", "t": "處分應有部分vs處分共有物：分別共有與公同共有", "lv": "", "k": "pred", "tier": 0, "g": "共有・分管・區分所有", "q": "甲、乙、丙三人分別共有 A 大樓一棟（登記簿載明三人分別共有，應有部分各三分之一）。甲未經乙、丙同意，以自己名義將 A 大樓整棟出賣予丁，並持偽造之乙、丙同意書辦理所有權移轉登記。丁於買受前已向地政機關申請登記謄本，僅見上述分別共有之登記，並不知乙、丙反對。事後乙、丙表示不同意甲之處分。試問：（一）甲丁間買賣契約及移轉登記之效力如何？（二）丁得否主張善意取得 A 大樓全部？乙、丙得如何救濟？（三）若 A 大樓係甲、乙、丙因繼承而公同共有（尚未分割，登記亦為公同共有），甲擅自出賣並持偽造之同意書移轉登記予丁，其效力與（一）有何差異？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>分別共有之各共有人得自由處分其應有部分，但處分共有物須得全體同意；公同共有人基於公同關係共有一物，無可獨自處分之應有部分。無權處分須經有權利人承認始生效力；不動產善意取得以信賴登記且原登記不實為前提。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第819條第1項</span>、第2項（處分應有部分／共有物）；<span class=\"art\">第118條第1項</span>（無權處分）；<span class=\"art\">第759條之1第2項</span>（善意第三人保護）；<span class=\"art\">第821條</span>、<span class=\"art\">第767條第1項</span>中段（除去妨害）；<span class=\"art\">第1151條</span>（遺產公同共有）；<span class=\"art\">第828條第2項</span>、第3項（公同共有之準用與處分）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）買賣及移轉登記之效力</p><p>依<span class=\"art\">第819條第1項</span>各共有人得自由處分其應有部分，同條第2項共有物之處分應得共有人全體之同意。本題中，買賣為負擔行為，不以有處分權為要件，甲丁間買賣有效；物權行為就甲之三分之一，依<span class=\"art\">第111條但書</span>仍為有效（本文採肯定說）；乙、丙部分屬<span class=\"art\">第118條第1項</span>無權處分，持偽造同意書亦不能補正，乙、丙拒絕承認後確定無效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>取得三分之一仍符合丁之利益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丁得否善意取得及乙丙之救濟</p><p>依<span class=\"art\">第759條之1第2項</span>，須信賴登記且原登記物權不實。本題中，登記簿明載三人分別共有各三分之一，並無不實，丁已查閱謄本，無信賴基礎，不得就乙、丙部分善意取得；乙、丙得依<span class=\"art\">第821條</span>、<span class=\"art\">第767條第1項</span>中段請求除去妨害，就逾越甲應有部分之登記回復原狀。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>登記正確時無信賴可保護。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）公同共有之差異</p><p>依<span class=\"art\">第1151條</span>，分割遺產前各繼承人對遺產全部為公同共有；依<span class=\"art\">第828條第3項</span>，處分應得公同共有人全體之同意。本題中，甲處分整棟全部為無權處分，乙、丙拒絕承認即全部無效，不生三分之一有效之結果；丁亦不得善意取得，乙、丙得依<span class=\"art\">第828條第2項</span>準用<span class=\"art\">第821條</span>請求塗銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>公同共有無應有部分。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲丁買賣契約有效；移轉登記就甲之三分之一有效，乙、丙部分為無權處分，拒絕承認後確定無效。（二）丁不得善意取得乙、丙部分；乙、丙得依<span class=\"art\">第821條</span>、<span class=\"art\">第767條第1項</span>中段請求除去妨害、回復原狀。（三）公同共有時，甲之處分全部無效，丁亦不得善意取得。</p>"], "ck": [{"x": "§819Ⅰ 應有部分自由處分；§819Ⅱ 處分共有物須全體同意", "h": false}, {"x": "買賣契約（債權行為）有效，與移轉登記分開判斷", "h": true}, {"x": "移轉登記：甲1/3有效，乙丙2/3為無權處分（§118Ⅰ 效力未定）", "h": true}, {"x": "乙丙拒絕承認，2/3部分確定無效", "h": false}, {"x": "登記明載分別共有並無不實，丁無信賴基礎，不適用 §759-1Ⅱ", "h": true}, {"x": "乙丙依 §821、§767Ⅰ中段請求塗銷／更正，為全體利益", "h": false}, {"x": "§1151、§828Ⅲ 公同共有物處分須全體同意", "h": false}, {"x": "公同共有無應有部分，不套 §819Ⅰ，整體為無權處分", "h": true}, {"x": "乙丙拒絕承認後全部無效，丁不得善意取得", "h": false}], "mn": "契約有效、登記分開看 → 甲1/3有效、2/3無權處分 → 登記不假不能善意取得 → 公同共有無份全部無效"}, {"id": "114-二", "no": "114年第二題", "t": "抵押權＋地上權＋所有權讓與：物權優先順序", "lv": "", "k": "off", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲為A地之所有人。甲因資金需求，向乙借款新臺幣500萬元，並以A地設定抵押權予乙。其後，甲又就A地設定地上權予丙，以供丙在其上建築房屋。再後，甲將A地所有權讓與其子丁，並完成移轉登記。試問：依物權之一般效力，乙、丙、丁三人間之法律關係為何？並說明各物權之優先順序及其效力範圍。（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>物權具優先效力及追及效力：同一標的物上之數物權，成立在先者優先；標的物縱輾轉歸於他人，權利人仍得追及行使權利。不動產物權依法律行為設定者，非經登記不生效力，其次序依登記先後定之。抵押權不移轉占有，設定後所有人仍得設定用益物權或讓與所有權，惟後手均應承受先存在之物權負擔。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第758條</span>（不動產物權登記生效）、<span class=\"art\">第860條</span>（普通抵押權）、<span class=\"art\">第832條</span>（地上權）、<span class=\"art\">第867條</span>（抵押權不因抵押物讓與而受影響）、<span class=\"art\">第866條第1項</span>、第2項（得設定用益物權；抵押權受影響時得除去）、<span class=\"art\">第877條第2項</span>準用第1項（建築物併付拍賣）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙、丙、丁三人間之法律關係</p><p>依<span class=\"art\">第758條</span>，不動產物權依法律行為而取得、設定者，非經登記，不生效力；依<span class=\"art\">第867條</span>，不動產所有人設定抵押權後得將不動產讓與他人，但其抵押權不因此而受影響。本題中，乙之抵押權最先登記，丙之地上權次之，丁最後完成所有權移轉登記；丁所取得者係已負擔乙抵押權及丙地上權之所有權，應概括承受，不得以後手受讓人為由主張排除。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>物權具追及效力。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）優先順序及效力範圍</p><p>依登記先後，乙之抵押權先於丙之地上權，並優先於甲之普通債權人受償。依<span class=\"art\">第866條第1項</span>，設定抵押權後得設定地上權，但抵押權不因此受影響；依同條第2項，抵押權人實行抵押權受有影響者，法院得除去該權利後拍賣之。本題中，若丙之地上權影響乙之受償，乙得聲請除去後拍賣，使拍定人取得無負擔之所有權；丙已建房屋者，依<span class=\"art\">第877條第2項</span>準用第1項，乙得聲請併付拍賣，但就房屋價金無優先受償權。丙之地上權被除去者，得依設定契約向甲請求債務不履行之損害賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧擔保安全與物盡其用。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙之抵押權、丙之地上權依登記先後成立，乙之抵押權先於丙之地上權，並優先於甲之普通債權人；丁受讓之所有權須承受乙之抵押權及丙之地上權，不得排除。乙實行抵押權受丙地上權影響時，法院得依<span class=\"art\">第866條第2項</span>除去丙之地上權後拍賣，丙得向甲請求損害賠償；丙已建房屋者，乙得依<span class=\"art\">第877條第2項</span>聲請併付拍賣，但就房屋價金無優先受償權。</p>"], "ck": [{"x": "§758 不動產物權非經登記不生效力，依登記先後定次序", "h": false}, {"x": "依優先效力（登記先後）：乙抵押權先於丙地上權，丁所有權受兩者限制", "h": true}, {"x": "物權優先於債權：乙之抵押權優先於甲之普通債權人", "h": false}, {"x": "§867 抵押物讓與，抵押權不受影響（追及效力）", "h": false}, {"x": "丁受讓所有權，概括承受乙抵押權與丙地上權", "h": true}, {"x": "§866Ⅰ、Ⅱ 抵押權實行受影響時，法院得除去地上權後拍賣", "h": false}, {"x": "乙實行抵押權得除去丙地上權，丙得依設定契約向甲求償", "h": false}, {"x": "§877Ⅱ 準用Ⅰ：除去地上權後，地上權人之建物得併付拍賣，建物價金無優先受償權", "h": true}], "mn": "先登先優先 → 讓與不免負擔 → 實行受影響，法院除去"}, {"id": "108-二", "no": "108年第二題", "t": "最高限額抵押權：擔保範圍＋物上代位", "lv": "", "k": "off", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲有A屋，因向乙貸款1000萬元（新臺幣，下同），乃設定最高限額1200萬元之最高限額抵押權予以擔保。試問：最高限額抵押權擔保的債權範圍如何？A屋如發生毀損或滅失，乙本於代位性得如何行使權利？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>最高限額抵押權，係為擔保一定範圍內現在及將來之不特定債權，於一定金額限度內設定之抵押權。物上代位性，指抵押物因滅失、毀損而生保險金、補償金等代位物時，抵押權人得就代位物優先受償，使擔保價值延續。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第881條之1第1項</span>、第2項（最高限額抵押權之定義及擔保債權範圍）、<span class=\"art\">第881條之2</span>（確定後於最高限額內行使權利）；<span class=\"art\">第881條之17</span>（準用普通抵押權之規定）、<span class=\"art\">第881條第2項</span>、第3項（物上代位）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）最高限額抵押權擔保之債權範圍</p><p>依<span class=\"art\">第881條之1第1項</span>，最高限額抵押權係就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權；依同條第2項，所擔保之債權以由一定法律關係所生之債權或基於票據所生之權利為限。本題中，甲以A屋向乙借款1000萬元，設定最高限額1200萬元，凡確定前甲乙間基於該借貸關係所生之各筆債權（含本金、利息、違約金），均於1200萬元限額內受擔保，不以現有之1000萬元為限；確定後，依<span class=\"art\">第881條之2</span>，乙僅得就已確定之原債權於最高限額範圍內行使權利，利息、違約金等合計亦不得逾限額。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>其擔保者為不特定債權，而非特定之一筆債權。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）A屋毀損或滅失時乙之代位權利</p><p>依<span class=\"art\">第881條之17</span>，最高限額抵押權準用普通抵押權之規定；依<span class=\"art\">第881條第2項</span>，抵押權人對於抵押人因抵押物滅失所得行使之賠償或其他請求權有權利質權，其次序與原抵押權同。本題中，A屋如毀損或滅失，乙得就甲因此所得請求之保險金、徵收補償金或損害賠償請求權主張權利質權，於實際擔保債權額（不逾1200萬元）範圍內優先受償；依同條第3項，給付義務人因故意或重大過失向甲給付者，對乙不生效力。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>擔保不因標的物實體滅失而落空。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）擔保範圍及於抵押權確定前，甲乙間基於該借貸關係陸續發生、在1200萬元限額內之各筆債權，不以1000萬元為限。（二）A屋毀損或滅失時，乙依<span class=\"art\">第881條第2項</span>，就甲因此所得請求之保險金、徵收補償金或損害賠償請求權有權利質權，次序與原抵押權同，得於擔保債權額範圍內優先受償。</p>"], "ck": [{"x": "§881-1Ⅰ：一定範圍內不特定債權，最高限額內擔保", "h": false}, {"x": "確定前同一法律關係所生本金、利息、違約金，在1200萬內均受擔保，不以1000萬為限", "h": false}, {"x": "§881Ⅱ、§881-17：抵押物滅失，乙就代位物有權利質權，次序與原抵押權同", "h": true}, {"x": "代位物具體舉例：保險金、徵收補償金、損害賠償請求權", "h": false}, {"x": "優先受償以實際債權額為限，不逾1200萬", "h": false}, {"x": "§881Ⅲ：故意或重大過失向抵押人給付，對抵押權人不生效力", "h": false}, {"x": "A屋滅失抵押權不是消失，乙就代位物優先受償", "h": true}], "mn": "不特定債權限額內 → 1000萬不是上限 → 物滅有代位 → 質權次序同 → 限額內受償"}, {"id": "104-二", "no": "104年第二題", "t": "抵押權與地上權併存（§866）", "lv": "", "k": "off", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "乙企業向甲銀行申請企業貸款5,000萬元，乙提供其所有的A素地為擔保，設定抵押權給甲，甲同意貸款，但要求乙同意將A素地同時設定地上權給甲，然而就設定地上權的契約，並未約定權利金或地租的給付。請問雙方設定抵押權與地上權的效力？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產所有人得就同一標的物同時設定不同種類之物權，各依其成立要件判斷效力。抵押權為不移轉占有、就賣得價金優先受償之擔保物權；地上權為以在他人土地上下有建築物或其他工作物為目的而使用其土地之用益物權，得為有償或無償，未約定地租不影響其成立。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第860條</span>（普通抵押權之定義）；<span class=\"art\">第832條</span>（普通地上權之定義，未以地租為成立要件）；<span class=\"art\">第87條第1項</span>（通謀虛偽意思表示無效）；<span class=\"art\">第866條</span>（抵押權設定後設定用益物權、除去規定）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）抵押權之效力</p><p>依<span class=\"art\">第860條</span>，普通抵押權係債權人對債務人或第三人不移轉占有而供擔保之不動產，得就賣得價金優先受償之權。本題中，乙以A素地為甲之5,000萬元貸款設定抵押權，雙方合意並完成登記，抵押權合法成立，甲就A地享有優先受償之擔保。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>抵押權之成立以合意及登記為已足。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）地上權之效力</p><p>依<span class=\"art\">第832條</span>，地上權以在他人土地上下有建築物或其他工作物為目的而使用其土地，條文未以權利金或地租為成立要件。本題中，乙甲雖未約定權利金或地租，地上權仍依合意及登記成立。惟此係銀行甲為防止乙或第三人另設用益權減損擔保價值所設之擔保地上權，否定說認其欠缺<span class=\"art\">第832條</span>使用目的，且屬<span class=\"art\">第87條第1項</span>通謀虛偽而無效；肯定說認雙方有使甲取得地上權之真意，亦不排除將來使用，非通謀虛偽。本文採肯定說，地上權有效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>雙方確有設定之效果意思，且其具保全抵押物價值之經濟功能。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）二權得否併存</p><p>依<span class=\"art\">第866條</span>，抵押權設定後所設之用益物權，使抵押權人實行受有影響者，法院得除去之。本題中，二權同時設定且同屬甲，甲不致因自己之地上權而受有影響，<span class=\"art\">第866條第2項</span>除去規定原則上無適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>二權性質不同，一為擔保、一為用益，可並存不悖。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙為甲設定之抵押權，依<span class=\"art\">第860條</span>合法成立，甲享有優先受償之擔保利益；地上權雖未約定地租，依<span class=\"art\">第832條</span>仍合法成立，且雙方有設定真意，非<span class=\"art\">第87條</span>之通謀虛偽，甲合法取得A地地上權。二物權性質不同，得併存於A地，均合法有效。</p>"], "ck": [{"x": "§860 抵押權：不移轉占有、就賣得價金優先受償", "h": false}, {"x": "乙以A地設定抵押權予甲，合意並登記，抵押權成立", "h": false}, {"x": "§832 地上權：在他人土地上下有工作物而使用土地", "h": false}, {"x": "未約定權利金或地租，不影響地上權成立（地租非要件）", "h": true}, {"x": "擔保地上權：§832 目的要件與 §87 通謀虛偽之爭議，正反說並表明立場", "h": true}, {"x": "§866 典型為第三人設定；本題兩權同屬甲，§866Ⅱ 除去原則無適用", "h": false}, {"x": "抵押權與地上權性質不同、得併存，二者均有效", "h": false}], "mn": "抵押看 860 → 地上看 832，地租不是要件 → 866 兩者併存"}, {"id": "102-二", "no": "102年第二題", "t": "未辦繼承登記能否實行抵押權（§759）", "lv": "", "k": "off", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲向乙借款1000萬元並以A地設定抵押權，乙死亡後其子丙未辦繼承登記，丙得否實行抵押權？民法第759條所謂「非經登記不得處分」之意涵為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>民法就不動產物權依法律行為而變動者，採登記生效主義；惟因繼承、強制執行、徵收、法院之判決等非因法律行為取得不動產物權者，其取得不待登記即生效力，僅於嗣後欲處分該物權時，始須先完成登記，此即宣示登記。其規範目的在於兼顧繼承等法定物權變動之即時效力，並維持地政登記之公示正確，以保護交易安全。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第759條</span>（非因法律行為取得，應經登記始得處分）；<span class=\"art\">第1147條</span>（繼承因死亡而開始）；<span class=\"art\">第1148條第1項</span>（承受被繼承人財產上一切權利義務）；<span class=\"art\">第870條</span>（抵押權不得由債權分離而為讓與）；<span class=\"art\">第873條</span>（抵押權人得聲請拍賣抵押物）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙得否實行抵押權</p><p>依<span class=\"art\">第1147條</span>、<span class=\"art\">第1148條第1項</span>，繼承因被繼承人死亡而開始，繼承人承受被繼承人財產上之一切權利義務；依<span class=\"art\">第873條</span>，抵押權人於債權已屆清償期而未受清償者，得聲請法院拍賣抵押物。本題中，乙死亡時，其對甲之1000萬元債權及從屬之A地抵押權當然由丙取得，不待登記。實行抵押權是否屬處分有二說：否定說認拍賣使抵押權消滅，屬處分，應先辦繼承登記；肯定說認實行係行使抵押權本來之權能以實現債權，抵押權消滅乃清償目的達成之結果。本文採肯定說，丙雖未辦繼承登記，仍得聲請法院拍賣A地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>聲請拍賣並無第三人信賴丙之登記而與之交易，無害於交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）<span class=\"art\">第759條</span>之意涵</p><p>依<span class=\"art\">第759條</span>，因繼承等非因法律行為，於登記前已取得不動產物權者，應經登記，始得處分其物權（題示用語為修正前規定，意旨相同）。本題中，丙於登記前已取得抵押權，登記僅具宣示性質；所謂處分，係指讓與、設定負擔、拋棄等使物權在法律上發生變動之處分行為，不包括事實上處分，亦不限制權利之行使。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>本條目的在使登記與實體一致，以維護公示及交易安全。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，丙因繼承當然取得乙對甲之債權及A地抵押權，不待登記即生效力。<span class=\"art\">第759條</span>僅限制丙於登記前為讓與、設定負擔、拋棄等法律上處分，不限制權利之行使；實行抵押權非屬處分，本文採肯定說，丙未辦繼承登記，仍得聲請法院拍賣A地。惟實務操作上，先補辦繼承登記較為穩妥。</p>"], "ck": [{"x": "§1147・§1148Ⅰ 乙死亡時丙當然承受債權", "h": false}, {"x": "抵押權具從屬性（§870），隨債權由丙繼承取得（§1148Ⅰ），不待登記", "h": false}, {"x": "§873Ⅰ 實行抵押權是行使權能，非 §759 之處分", "h": true}, {"x": "正反二說；本文採肯定說，丙得逕行聲請拍賣", "h": true}, {"x": "§759 宣示登記：取得不待登記，處分前須先登記", "h": false}, {"x": "處分＝讓與、設定負擔、拋棄等法律上處分，不含事實上處分", "h": false}], "mn": "繼承即承受 → 抵押隨債權 → 登記只管處分 → 拍賣是行使不是處分"}, {"id": "109-二", "no": "109年第二題", "t": "時效取得地上權（§772準用§769）", "lv": "", "k": "off", "tier": 1, "g": "抵押權・地上權・物權順序", "q": "甲向乙建設公司購買與丙地主合建之預售房屋A屋一棟，乙建設公司以買受人甲為起造人進行蓋造。房屋完工後，甲取得房屋所有權並登記完畢，但土地部分因地主丙債務問題，導致合建土地遭債權人查封，而無法移轉登記於買受人甲。事隔逾20年，該筆土地經法院強制執行由某丁拍定。試依民法相關規定說明：甲得否主張時效取得地上權？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>地上權係以在他人土地上下有建築物或其他工作物為目的而使用其土地之權。民法為保護長期以行使地上權之意思和平、公然、繼續占有他人土地之事實狀態，設時效取得制度，使占有人得請求登記為地上權人，調和使用狀態與登記名義之落差。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第832條</span>（地上權定義）；<span class=\"art\">第772條</span>準用<span class=\"art\">第769條</span>（20年時效）、<span class=\"art\">第770條</span>（10年時效）；<span class=\"art\">第945條</span>（占有意思之變更）；<span class=\"art\">第838條之1</span>（強制執行之法定地上權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲基於合建買賣占有，原則欠缺行使地上權之意思</p><p>依<span class=\"art\">第772條</span>準用<span class=\"art\">第769條</span>，以行使地上權之意思，20年間和平、公然、繼續占有他人不動產者，得請求登記為地上權人（<span class=\"art\">第772條後段</span>：已登記之不動產亦同）。本題中，甲基於合建及預售屋買賣，期待取得土地所有權而占有，係以所有之意思占有，原則欠缺行使地上權之意思；除能證明已依<span class=\"art\">第945條</span>變更占有意思並經20年，始符要件。甲明知土地仍屬丙所有，難認善意無過失，亦不適用<span class=\"art\">第770條</span>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>占有土地建屋非必以行使地上權之意思，主張者應舉證（最高法院64年台上字第2552號原判例、84年度台上字第748號判決）。</span></p></div><div class=\"evp\"><p><b>（二）</b>時效取得之效果係「得請求登記」，非「當然取得」：依<span class=\"art\">第772條</span>準用<span class=\"art\">第769條</span>，時效完成僅得請求登記。本題中，縱甲符合要件，登記前仍未取得地上權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>時效取得非當然取得。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁拍定不影響甲之登記請求權，但甲須已申請登記並經受理始得對抗</p><p>依最高法院69年度第5次、80年度第2次民事庭會議原決議，未登記前原則不得對抗所有人，已申請登記並經受理者，法院應為實體裁判。本題中，丁拍定不使甲之登記請求權消滅，但甲須已申請登記並經受理，始得對抗丁之拆屋還地請求；土地與房屋自始分屬丙、甲，亦無<span class=\"art\">第838條之1</span>之適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>登記請求權具獨立性。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲基於合建買賣占有土地，原則係以所有之意思占有，欠缺行使地上權之意思，不得主張時效取得地上權；僅於能舉證以行使地上權之意思占有逾20年時，始得依<span class=\"art\">民法第772條</span>準用<span class=\"art\">第769條</span>請求登記為地上權人，不因丁拍定而受影響，惟須已申請登記並經受理始得對抗丁。</p>"], "ck": [{"x": "§832 地上權：在他人土地上下有建築物而使用其土地", "h": false}, {"x": "§772準用§769：以行使地上權之意思，20 年和平公然繼續占有", "h": true}, {"x": "§772後段：已登記之不動產亦準用", "h": false}, {"x": "合建買賣占有＝以所有之意思，原則欠缺地上權意思（64台上2552原判例、84台上748）", "h": true}, {"x": "效果僅「得請求登記」，登記前尚非地上權人", "h": true}, {"x": "丁拍定不影響甲之請求權；須先申請登記並經受理", "h": false}, {"x": "§838-1 須土地與建物同屬一人；本題自始分屬丙、甲，無法定地上權", "h": false}, {"x": "原則不得時效取得；能舉證者得請求登記，且須申請受理後丁始不得拆屋還地", "h": false}], "mn": "先看占有意思（合建買賣＝所有之意思）→ 有地上權意思＋20年才符合 → 只得請求登記 → 申請受理才擋得住丁"}, {"id": "預01", "no": "預測題 01", "t": "抵押權：法定地上權與併付拍賣", "lv": "", "k": "pred", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲有 A 地及其上 B 屋（B 屋為甲自建並已保存登記），甲以 A 地為乙銀行設定第一順位抵押權，擔保借款 1,000 萬元，設定時 B 屋已存在，未一併設定抵押。其後甲在 A 地上另增建 C 屋。甲屆期未清償，乙聲請拍賣 A 地，由丙拍定並登記取得所有權。丙主張 B 屋、C 屋均無權占有，請求甲拆屋還地。試問：（一）丙對 B 屋之請求有無理由？（二）乙於聲請拍賣 A 地時，得否就 C 屋一併聲請拍賣？C 屋拍賣價金如何受償？乙未為此聲請者，丙對 C 屋之請求有無理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>法定地上權，指土地及其地上建築物原屬同一人所有，因抵押權實行致分屬不同人時，法律視為已有地上權之設定，以保護建物之利用。併付拍賣，指抵押人於設定抵押權後在抵押地上營造建築物，抵押權人得聲請將建築物與土地一併拍賣。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第876條第1項</span>（設定時同屬一人之法定地上權）；<span class=\"art\">第877條第1項</span>（設定後營造之併付拍賣、建物價金無優先受償權）；<span class=\"art\">第767條第1項</span>（所有物返還請求權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）B 屋有法定地上權，丙不得請求拆除</p><p>依<span class=\"art\">第876條第1項</span>，設定抵押權時土地及其建築物同屬一人所有，僅以土地為抵押者，於抵押物拍賣時，視為已有地上權之設定，地租、期間及範圍由當事人協議，不能協議者得聲請法院判決。本題中，設定時A地與B屋同屬甲所有，B屋已存在，僅以A地抵押，A地拍賣時視為已有地上權，B屋占用A地非無權占有，丙依<span class=\"art\">第767條第1項</span>請求拆除B屋無理由，僅得請求地租。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免建物因拍賣被拆。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙原得聲請併付拍賣（C屋價金無優先權）；未聲請者，丙得請求拆除C屋</p><p>依<span class=\"art\">第877條第1項</span>，土地所有人於設定抵押權後在抵押土地上營造建築物者，抵押權人於必要時得於強制執行程序中聲請併付拍賣，但對建築物之價金無優先受清償之權。本題中，C屋係設定後增建，無<span class=\"art\">第876條</span>之適用；乙原得聲請併付拍賣，惟僅就A地價金優先受償，C屋價金僅得以普通債權人地位與其他債權人平均受償，剩餘歸甲。乙未聲請而A地已由丙拍定登記，已不能併付；C屋無法定地上權，丙得依<span class=\"art\">第767條第1項</span>請求甲拆屋還地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>併付拍賣兼顧換價利益與建物價值。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）B屋設定時已存在且與A地同屬甲所有，依<span class=\"art\">民法第876條第1項</span>有法定地上權，丙請求拆除無理由，僅得請求地租。（二）乙原得依<span class=\"art\">第877條第1項</span>聲請就C屋併付拍賣，但對C屋價金無優先受償權；乙未聲請而A地已拍定，已不能併付，丙依<span class=\"art\">第767條第1項</span>請求甲拆除C屋還地，有理由。</p>"], "ck": [{"x": "§876Ⅰ 設定時同屬一人、僅抵押土地，拍賣時視為有地上權", "h": false}, {"x": "B屋設定時已存在且同屬甲，丙不得請求拆屋還地", "h": false}, {"x": "地租、期間由當事人協議，不能協議聲請法院判決", "h": true}, {"x": "丙對B屋之請求無理由", "h": false}, {"x": "C屋為設定後增建，不是法定地上權", "h": true}, {"x": "§877Ⅰ 須於強制執行程序中聲請併付；A地已拍定則不能併付", "h": false}, {"x": "C屋價金乙無優先權，僅以普通債權人地位與他債權人平均受償", "h": true}, {"x": "C屋欠缺正當權源，丙得依 §767Ⅰ 請求甲拆屋還地", "h": false}], "mn": "設定時有屋 → §876 視為地上權不能拆 → 設定後蓋屋 → §877 併付拍賣 → 價金沒優先"}, {"id": "預07", "no": "預測題 07", "t": "最高限額抵押權：確定與債權讓與", "lv": "", "k": "pred", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲以 A 地為乙銀行設定最高限額抵押權，限額 1,000 萬元，擔保甲對乙現在及將來之借款債務，未約定確定期日。其後乙將對甲之一筆 600 萬元借款債權（原債權確定前）讓與丙；甲另對乙尚有 300 萬元借款債務。嗣後甲欲終止該擔保關係。試問：（一）乙讓與 600 萬元債權予丙，最高限額抵押權是否隨同移轉？（二）甲如何使擔保之原債權確定？確定後乙得行使抵押權之範圍為何？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>最高限額抵押權，指債務人或第三人提供不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權。原債權確定，指所擔保之不特定債權因確定事由而特定，其後新發生之債權不再屬擔保範圍。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第881條之1第1項</span>、第2項（定義；擔保一定法律關係所生之債權）、<span class=\"art\">第881條之6第1項</span>（確定前讓與不隨同移轉）、<span class=\"art\">第881條之5</span>（未約定確定期日得隨時請求確定，經十五日確定）、<span class=\"art\">第881條之12第1項第3款</span>（基礎法律關係終止致確定）、<span class=\"art\">第881條之2</span>（於最高限額內行使）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙讓與600萬元債權，最高限額抵押權是否隨同移轉</p><p>依<span class=\"art\">第881條之6第1項</span>，所擔保之債權於原債權確定前讓與他人者，其最高限額抵押權不隨同移轉。本題中，乙讓與600萬元債權時原債權尚未確定，抵押權不隨同移轉，丙之債權不受擔保；抵押權仍屬乙，僅擔保於確定時仍屬乙之原債權，依題示為300萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>確定前所擔保者為不特定債權。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲如何使原債權確定及確定後之範圍</p><p>依<span class=\"art\">第881條之5</span>，未約定確定期日者，抵押人得隨時請求確定，自請求之日起經十五日為確定期日；依<span class=\"art\">第881條之12第1項第3款</span>，擔保債權所由發生之法律關係經終止者，原債權確定。本題中，甲得隨時請求確定；如基礎關係為得終止之繼續性授信或往來契約，甲亦得依約終止使原債權確定，已成立之個別借款不因此消滅。依<span class=\"art\">第881條之2</span>，確定後乙僅得就300萬元及其利息、遲延利息、違約金，與原債權合計於1,000萬元範圍內行使抵押權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧債權人擔保與後順位權利人保護。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙於原債權確定前讓與600萬元債權予丙，最高限額抵押權不隨同移轉，丙之債權不受擔保。（二）甲得隨時請求確定，自請求日起經十五日確定，或於基礎關係得終止時終止之，使原債權確定（<span class=\"art\">第881條之12第1項第3款</span>）；確定後乙得就300萬元及利息等，於1,000萬元限額內行使抵押權。</p>"], "ck": [{"x": "§881-1 最高限額抵押權：一定範圍不特定債權於限額內擔保", "h": false}, {"x": "§881-6Ⅰ 原債權確定前讓與，抵押權不隨同移轉", "h": true}, {"x": "丙受讓600萬不受擔保，抵押權仍屬乙，擔保乙餘下債權", "h": false}, {"x": "§881-5 未約定期日得隨時請求，自請求日起15日確定", "h": true}, {"x": "§881-12Ⅰ③ 擔保債權所由發生之法律關係經終止 → 原債權確定", "h": false}, {"x": "確定後只剩乙之300萬原債權受擔保", "h": false}, {"x": "§881-2 300萬及利息、遲延利息、違約金合計不逾1,000萬", "h": true}], "mn": "確定之前讓出去，抵押權不跟 → 沒約確定日，請求後十五天確定 → 本金加利息違約金，不超過限額"}, {"id": "預09", "no": "預測題 09", "t": "消滅時效：請求不起訴與抵押權消滅", "lv": "", "k": "pred", "tier": 1, "g": "抵押權・地上權・物權順序", "q": "甲於民國 90 年 6 月 1 日向乙借款 500 萬元，約定 90 年 12 月 31 日清償，並以 A 地設定抵押權予乙。乙於 95 年 6 月寄發存證信函請求甲還款，嗣後未於 6 個月內起訴，亦未再為其他請求。乙於 112 年聲請拍賣 A 地，甲主張抵押權已消滅。試問：（一）乙之借款返還請求權時效何時完成？（二）乙於 112 年聲請拍賣抵押物，有無理由？（三）如甲於 106 年因不知時效已完成而清償 100 萬元，得否請求返還？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>消滅時效指請求權因不行使達一定期間，債務人取得拒絕給付之抗辯權。時效中斷指因請求、承認、起訴等事由，使已經過之期間歸於無效、重新起算。以抵押權擔保之債權，請求權雖罹於時效仍得實行抵押權，但於時效完成後五年間不實行者，抵押權消滅。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第125條</span>（十五年時效）、<span class=\"art\">第128條</span>（起算點）、<span class=\"art\">第129條第1項第1款</span>（請求中斷）、<span class=\"art\">第130條</span>（六個月內不起訴視為不中斷）；<span class=\"art\">第145條第1項</span>（仍得就抵押物取償）、<span class=\"art\">第880條</span>（五年不實行而消滅）、<span class=\"art\">第767條第1項</span>中段；<span class=\"art\">第144條</span>（時效完成之效力）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）105年12月31日完成</p><p>依<span class=\"art\">第125條</span>，請求權因十五年間不行使而消滅，依<span class=\"art\">第128條</span>自請求權可行使時起算。本題清償期90年12月31日屆至，時效自此起算；95年6月存證信函雖屬請求，惟乙未於六個月內起訴，依<span class=\"art\">第130條</span>視為不中斷，時效於105年12月31日完成。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>請求須以起訴確保，始生中斷效力。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）聲請無理由</p><p>依<span class=\"art\">第145條第1項</span>，抵押權擔保之請求權雖經時效消滅，債權人仍得就抵押物取償；但依<span class=\"art\">第880條</span>，於時效完成後五年間不實行者，抵押權消滅。本題乙須於110年12月31日前實行，遲至112年始聲請拍賣，抵押權已消滅；甲得依<span class=\"art\">第767條第1項</span>中段請求塗銷抵押權登記。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免擔保物權長期懸而未決。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）不得請求返還</p><p>依<span class=\"art\">第144條第2項</span>，請求權已經時效消滅，債務人仍為履行之給付者，不得以不知時效為理由請求返還。本題甲於106年時效完成後清償100萬元，不得請求返還。又依實務見解，須明知時效完成仍為承認，始屬默示拋棄時效利益；甲係不知而清償，不構成拋棄，不影響<span class=\"art\">第880條</span>五年期間。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持已履行法律關係之安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）借款返還請求權於105年12月31日時效完成。（二）乙於112年聲請拍賣，已逾<span class=\"art\">第880條</span>五年期間，抵押權消滅，聲請無理由。（三）甲依<span class=\"art\">第144條第2項</span>不得請求返還100萬元；其不知而清償不構成拋棄時效利益，不影響（二）之結論。</p>"], "ck": [{"x": "§125、§128：15年時效，自 91/1/1 起算", "h": false}, {"x": "§129Ⅰ①、§130：存證信函為請求，6個月內未起訴視為不中斷", "h": true}, {"x": "時效於 105/12/31 完成", "h": false}, {"x": "§145Ⅰ＋§880：時效完成仍可取償，但完成後5年不實行抵押權消滅", "h": true}, {"x": "五年自時效完成起算至 110/12/31（不是自清償期起算）", "h": true}, {"x": "112年聲請已逾期，抵押權消滅，聲請無理由，甲得請求塗銷", "h": false}, {"x": "§144Ⅱ：106年時效完成後清償，不得以不知時效請求返還", "h": false}, {"x": "甲不知時效完成而清償，不構成拋棄時效利益（須明知仍承認），不影響 §880 計算", "h": false}], "mn": "請求不起訴視為沒中斷 → 105 完成 → 再五年 110 → 112 拍賣太晚 → 106 清償不返還"}, {"id": "預37", "no": "預測題 37", "t": "時效取得地上權：已登記土地、善意無過失與中斷", "lv": "", "k": "pred", "tier": 1, "g": "抵押權・地上權・物權順序", "q": "乙所有已登記之 A 地，甲於民國 90 年間明知 A 地非其所有，以在他人土地上有建築物為目的之意思，未經乙同意在 A 地上興建透天厝並居住至今，登記為甲之建物所有權人。甲占有期間，乙從未異議。民國 105 年乙起訴請求甲拆屋還地。試問：（一）甲得否主張時效取得 A 地之地上權？須具備何要件？（二）甲若為善意無過失，與明知無權占有者，所需期間有何不同？（三）乙起訴請求返還占有物，對取得時效之效力如何？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>取得時效指以所有之意思或所有權以外財產權之意思，和平、公然、繼續占有，經過一定期間，得請求登記為所有人或他物權人。時效取得地上權，指以行使地上權之意思占有他人土地，經過一定期間，得請求登記為地上權人。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第772條</span>（於所有權以外財產權及已登記之不動產準用）、<span class=\"art\">第769條</span>（二十年）、<span class=\"art\">第770條</span>（善意無過失十年）、<span class=\"art\">第832條</span>（普通地上權）；<span class=\"art\">第767條第1項</span>（所有物返還請求權）、<span class=\"art\">第771條第2項</span>（起訴請求返還占有物致時效中斷）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲須依<span class=\"art\">第772條</span>準用並具四要件</p><p>依<span class=\"art\">第772條後段</span>「於已登記之不動產，亦同」，A地雖已登記亦得適用。要件為①以行使地上權之意思占有（<span class=\"art\">第832條</span>：以有建築物或其他工作物為目的）；<span class=\"evli\">②和平、公然、繼續占有；</span><span class=\"evli\">③經過法定期間；</span><span class=\"evli\">④請求登記為地上權人。本題中，甲於A地興建透天厝並居住，客觀上可認有行使地上權之意思。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>取得之權利依占有之意思定之。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）善意無過失十年，明知者二十年</p><p>依<span class=\"art\">第770條</span>準用，占有之始善意並無過失者須占有十年；明知無權占有者，依<span class=\"art\">第769條</span>準用須占有二十年。本題中，民國90年至105年計十五年，善意無過失者已逾十年，惡意者則尚未滿二十年。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>善意占有人較值保護。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）起訴僅中斷進行中之時效</p><p>依<span class=\"art\">第771條第2項</span>，依<span class=\"art\">第767條</span>起訴請求返還占有物者，取得時效因而中斷（經<span class=\"art\">第772條</span>準用）。本題中，甲明知無權占有，至105年僅十五年，時效因乙起訴而中斷；若甲善意無過失，於民國100年已滿十年，已完成之時效不因起訴中斷，惟依實務見解（最高法院69年度第5次、80年度第2次民事庭會議原決議），甲須於乙起訴前已申請地上權登記並經受理，始得對抗乙之拆屋還地請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧權利行使與法律安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲須依<span class=\"art\">第772條</span>準用具備前述四要件；惟甲明知非其所有須二十年，至105年僅十五年且因乙起訴而中斷，不得主張時效取得地上權。（二）善意無過失者十年，明知無權占有者二十年。（三）乙起訴使進行中之時效中斷；已完成者不受影響，但甲須已申請登記並經受理，始得對抗乙。</p>"], "ck": [{"x": "§772 準用 §769、§770；後段「已登記之不動產亦同」", "h": true}, {"x": "甲建屋居住＝以行使地上權之意思占有（非以所有之意思）", "h": true}, {"x": "時效完成須請求登記為地上權人，非當然取得", "h": true}, {"x": "§770 善意無過失十年；§769 否則二十年", "h": true}, {"x": "甲明知，90 至 105 年僅 15 年，未滿二十年", "h": false}, {"x": "§771Ⅱ 起訴請求返還占有物，取得時效中斷", "h": false}, {"x": "已完成之時效不受起訴影響（仍須已申請登記並經受理始得對抗）；本題未完成，因起訴中斷", "h": false}], "mn": "已登記靠 772 → 建屋＝地上權意思 → 善意十年、明知二十年 → 起訴只斷還在跑的"}, {"id": "預40", "no": "預測題 40", "t": "地上權終止：積欠地租、拋棄與法院終止", "lv": "", "k": "pred", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "乙所有 A 地，與甲設定普通地上權，約定存續期間未定，地租每年 20 萬元，甲於 A 地上興建房屋，並以該地上權設定抵押權予銀行丙。甲因經營不善，連續兩年未付地租，積欠達兩年之總額。試問：（一）乙得否終止甲之地上權？程序為何？（二）甲若不欲繼續持有地上權，得否拋棄？須符合何條件？（三）若地上權存續已逾二十年，當事人得否請求法院處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>地上權，指以在他人土地上下有建築物或其他工作物為目的而使用其土地之權。終止指使其向將來消滅；拋棄指地上權人以單方意思表示拋棄之。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第836條第1項</span>、第3項（積欠地租之終止）；<span class=\"art\">第835條第2項</span>（未定期限有地租之拋棄）、<span class=\"art\">第764條第2項</span>（拋棄須得第三人同意）、<span class=\"art\">第758條第1項</span>（登記生效）；<span class=\"art\">第833條之1</span>（法院定存續期間或終止）、<span class=\"art\">第841條</span>（地上權不因工作物滅失而消滅）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得否終止及其程序</p><p>依<span class=\"art\">第836條第1項</span>，地上權人積欠地租達二年之總額，除另有習慣外，土地所有人得定相當期限催告，地上權人於期限內不為支付者得終止；地上權經設定抵押權者，並應同時將催告之事實通知抵押權人；依同條第3項，終止應向地上權人以意思表示為之。本題中，乙應定相當期限催告甲並同時通知抵押權人丙，期滿甲仍不付，乙始得向甲為終止之意思表示。漏未通知丙者，有附隨義務說與不得對抗說，本文採後者。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>通知旨在使抵押權人得代為清償地租以保全抵押權。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲得否拋棄及其條件</p><p>依<span class=\"art\">第835條第2項</span>，地上權未定有期限而有支付地租之約定者，拋棄時應於一年前通知土地所有人，或支付未到期之一年分地租；依<span class=\"art\">第764條第2項</span>，第三人有以該物權為標的物之其他物權者，非經該第三人同意，不得拋棄。本題中，甲須一年前通知乙或支付一年分地租，並得抵押權人丙同意，始得拋棄，且應依<span class=\"art\">第758條第1項</span>辦理塗銷登記。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護所有人及抵押權人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）存續逾二十年之處理</p><p>依<span class=\"art\">第833條之1</span>，地上權未定有期限者，存續期間逾二十年時，法院得因當事人之請求，定其存續期間或終止其地上權。本題中，存續若已逾二十年，當事人得請求法院處理，並非自行終止；依<span class=\"art\">第841條</span>，亦不因房屋滅失而消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>調和雙方利益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙須定相當期限催告甲並同時通知抵押權人丙，期滿甲仍不付，始得向甲終止；漏未通知者，不得對抗丙。（二）甲須一年前通知或支付一年分地租，並得抵押權人丙同意，始得拋棄，且須辦理塗銷登記。（三）存續逾二十年者，當事人得請求法院定存續期間或終止。</p>"], "ck": [{"x": "§836Ⅰ 積欠地租達二年總額，須定相當期限催告", "h": false}, {"x": "地上權設有抵押權，催告時同時通知抵押權人丙", "h": true}, {"x": "未通知抵押權人之效力：二說並陳，本文採不得對抗丙", "h": true}, {"x": "§836Ⅲ 終止向地上權人甲表示，不是向丙", "h": true}, {"x": "乙催告並通知丙，甲逾期不付即得終止", "h": false}, {"x": "§834・§835 拋棄條件：無租隨時／定期三年分／不定期一年／不可歸責二分之一", "h": true}, {"x": "甲須一年前通知或支付一年分地租，並得丙同意，始得拋棄", "h": false}, {"x": "§764Ⅱ 地上權已抵押予丙，拋棄須得丙同意", "h": false}, {"x": "拋棄為物權行為，須辦塗銷登記始生效力（§758Ⅰ）", "h": false}, {"x": "§833-1 未定期逾二十年，由法院定存續期間或終止", "h": true}], "mn": "積欠兩年先催告 → 通知抵押權人 → 向甲終止；有租拋棄看期限 → 逾二十年找法院"}, {"id": "預24", "no": "預測題 24", "t": "設定抵押權後讓與不動產：追及力、併付拍賣與出租", "lv": "", "k": "pred", "tier": 0, "g": "抵押權・地上權・物權順序", "q": "甲以其所有之 A 地向乙銀行借款 1,000 萬元，並設定抵押權登記。其後甲將 A 地以 1,500 萬元出賣予丙，並完成移轉登記；丙取得後在 A 地上興建房屋 B。又甲於讓與前曾將 A 地出租予丁，租期 5 年，已交付使用。屆清償期甲未還款。試問：（一）乙之抵押權是否因甲讓與 A 地而受影響？乙得對何人、何物實行？（二）乙實行抵押權拍賣 A 地時，B 屋得否併付拍賣？乙對 B 屋價金有無優先受償權？（三）丁之租賃是否影響乙實行抵押權？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>抵押權為擔保物權，具有追及性：抵押人將抵押物讓與他人後，抵押權仍存在於該物上，抵押權人得追及實行，就抵押物賣得價金優先受償。抵押權人無須占有抵押物，其優先受償之效力來自登記公示。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第860條</span>（普通抵押權之定義）；<span class=\"art\">第867條</span>（設定後讓與，抵押權不受影響）；<span class=\"art\">第873條</span>（聲請法院拍賣抵押物）；<span class=\"art\">第877條第1項</span>（建築物併付拍賣、價金無優先權）；<span class=\"art\">第866條第1項</span>、第2項（設定後成立租賃、法院終止後拍賣）；<span class=\"art\">第425條</span>（買賣不破租賃）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）讓與對抵押權之影響</p><p>依<span class=\"art\">第867條</span>，不動產所有人設定抵押權後，得將不動產讓與他人，但其抵押權不因此而受影響。本題中，甲將A地讓與丙，A地仍負擔已登記之抵押權；債務人仍為甲，屆期未受清償，乙得依<span class=\"art\">第873條</span>聲請拍賣A地優先受償，丙為第三取得人須容忍執行，不足部分仍得向甲請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>抵押權具追及性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）B屋併付拍賣</p><p>依<span class=\"art\">第877條第1項</span>，土地所有人於設定抵押權後在抵押土地上營造建築物者，抵押權人於必要時得聲請併付拍賣，但對建築物價金無優先受清償之權。本題中，丙係於抵押權設定後在A地興建B屋，乙得聲請併付拍賣，但僅就A地價金優先受償，B屋價金歸丙或其債權人。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>抵押權僅就土地設定，併付拍賣僅為利於土地價值實現。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁之租賃</p><p>依<span class=\"art\">第866條</span>，設定抵押權後仍得成立租賃，但抵押權不受影響，實行受有影響者，法院得終止租賃後拍賣。本題中，租賃成立於讓與前，題未載是否在抵押權設定前，應分論：設定前者，依<span class=\"art\">第425條第1項</span>對買受人繼續存在，租期5年未逾五年，不生同條第2項問題，不影響乙；設定後者，如妨礙乙實行，法院得依<span class=\"art\">第866條第2項</span>終止後拍賣。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免抵押權被架空。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙之抵押權不因A地讓與丙而受影響，乙得向債務人甲請求，並聲請拍賣A地，丙須容忍。（二）B屋得依<span class=\"art\">第877條</span>併付拍賣，但乙對B屋價金無優先受償權。（三）租賃成立於抵押權設定前者不受影響；設定後者，若妨礙乙實行，法院得依<span class=\"art\">第866條第2項</span>終止該租賃關係後拍賣。</p>"], "ck": [{"x": "§867：設定後得讓與，抵押權不受影響（非消滅、不須同意）", "h": true}, {"x": "乙向債務人甲請求，對 A 地聲請拍賣，丙須容忍", "h": false}, {"x": "§877：設定後營造之建築物得併付拍賣", "h": false}, {"x": "乙對 B 屋價金無優先受償權（§877但書）", "h": true}, {"x": "租賃先分抵押權設定前或設定後", "h": true}, {"x": "租期 5 年未逾五年，不受 §425Ⅱ 排除", "h": false}, {"x": "§866Ⅱ：設定後租賃妨礙實行，法院得終止該租賃關係後拍賣", "h": false}, {"x": "設定前租賃不受影響；設定後視是否妨礙實行", "h": false}], "mn": "賣地抵押跟著走 → 併拍屋但不優先 → 租約先分設定前後"}, {"id": "110-二", "no": "110年第二題", "t": "通謀虛偽＋繼承人非第三人", "lv": "", "k": "off", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲為了避免債主追討以及法院強制執行拍賣其不動產，而與乙通謀虛偽意思表示進行土地買賣。乙因此取得甲所有之A地，並且完成移轉登記。乙於99年1月28日死亡、其子女丙與丁於99年2月2日辦妥繼承登記。請問丙丁何時取得A地所有權？又嗣後甲向丙與丁請求塗銷登記，返還其所有之土地，請問甲之請求是否有理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>通謀虛偽意思表示當然無效，但不得對抗善意第三人。繼承人依<span class=\"art\">第1148條</span>自繼承開始時承受被繼承人財產上之一切權利、義務，屬概括繼受人，依通說並非<span class=\"art\">第87條第1項但書</span>所稱之第三人；且<span class=\"art\">第759條之1第2項</span>之善意保護，以已依法律行為為物權變動之登記為要件，繼承並非法律行為。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第87條第1項</span>（通謀虛偽意思表示無效，不得對抗善意第三人）、<span class=\"art\">第1147條</span>（繼承因死亡而開始）、<span class=\"art\">第1148條</span>（概括承受）、<span class=\"art\">第759條</span>（非因法律行為取得須登記始得處分）、<span class=\"art\">第759條之1第2項</span>（限依法律行為為物權變動之登記）、<span class=\"art\">第767條第1項</span>（所有物返還及妨害除去）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙丁何時取得A地所有權</p><p>依<span class=\"art\">第87條第1項</span>，通謀虛偽意思表示無效。本題中，甲乙間買賣契約及移轉物權行為均屬通謀虛偽，當然無效，乙自始未取得所有權，僅係登記名義人。依<span class=\"art\">第1147條</span>、<span class=\"art\">第1148條</span>，乙於99年1月28日死亡時繼承開始，丙丁即承受乙就A地之地位（登記名義），而非遲至99年2月2日辦妥繼承登記時；故丙丁僅承受登記名義，並未取得所有權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>繼承人僅承受被繼承人原有之法律地位。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲之請求是否有理由</p><p>依<span class=\"art\">第87條第1項但書</span>，無效不得對抗善意第三人；<span class=\"art\">第759條之1第2項</span>以已依法律行為為物權變動之登記為要件。本題中，丙丁依<span class=\"art\">第1148條</span>概括承受乙之地位，依通說非但書之第三人，繼承又非法律行為，不在<span class=\"art\">第759條之1第2項</span>保護範圍。故不論善意或惡意，A地仍屬甲，甲得依<span class=\"art\">第767條第1項</span>請求塗銷登記並返還A地，並因丙丁為公同共有人（<span class=\"art\">第1151條</span>）以二人為共同被告；依司法院釋字第107號、第164號解釋，無消滅時效之適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>貫徹真正權利人之保護。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲乙間買賣及移轉行為依<span class=\"art\">第87條第1項</span>當然無效，乙自始未取得A地所有權；丙丁於乙死亡時（99年1月28日）即承受乙之登記名義地位，非於99年2月2日繼承登記時，且並未取得A地所有權。丙丁為概括繼受人，非善意第三人，亦不適用<span class=\"art\">第759條之1第2項</span>，甲依<span class=\"art\">第767條第1項</span>請求丙丁塗銷登記、返還A地，為有理由。</p>"], "ck": [{"x": "§87Ⅰ 通謀虛偽意思表示無效", "h": false}, {"x": "甲乙買賣及移轉均無效，乙僅為登記名義人", "h": false}, {"x": "§1147・§1148：丙丁於 99/1/28 承受，非 99/2/2", "h": true}, {"x": "丙丁只承受登記名義，未取得所有權", "h": false}, {"x": "丙丁為概括繼受人，非 §87Ⅰ但書第三人", "h": true}, {"x": "繼承非法律行為，不適用 §759-1Ⅱ", "h": true}, {"x": "甲依 §767Ⅰ 請求塗銷返還有理由", "h": false}], "mn": "通謀無效乙沒有 → 繼承只拿到名義 → 繼承人不是第三人、不是法律行為 → 甲拿回來"}, {"id": "109-一", "no": "109年第一題", "t": "夫妻財產制＋登記推定＋無權處分", "lv": "", "k": "off", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲男、乙女結婚十餘年，未約定夫妻財產制度。婚後甲出資購買A屋一棟，登記在乙女名下。嗣後因故，甲、乙雙方乃協議離婚，協議離婚期間甲男未經乙女同意，擅自拿走A屋所有權狀與乙的印章，與丙簽訂A屋買賣契約，但尚未完成產權移轉登記。試問：A屋之所有權為何人所有？甲、丙間A屋買賣契約之效力為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>夫妻未約定夫妻財產制者，適用法定財產制，財產分為婚前財產與婚後財產，由夫妻各自所有並各自管理處分。不動產之歸屬，應先以登記推定登記名義人適法有此權利，不因出資來源而異，但得舉反證推翻。無權處分須經有權利人承認始生效力。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第1017條第1項</span>（婚後財產各自所有）、<span class=\"art\">第759條之1第1項</span>（登記推定力）；<span class=\"art\">第170條</span>（無權代理）、<span class=\"art\">第171條</span>（相對人之撤回權）、<span class=\"art\">第110條</span>（無權代理人之責任）、<span class=\"art\">第169條</span>（表見代理）、<span class=\"art\">第1003條</span>（日常家務代理）、<span class=\"art\">第118條</span>（無權處分）、<span class=\"art\">第758條</span>（不動產物權登記生效）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A屋所有權之歸屬</p><p>依<span class=\"art\">第1017條第1項</span>，夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有；依<span class=\"art\">第759條之1第1項</span>，不動產物權經登記者，推定登記權利人適法有此權利。本題中，A屋雖係甲婚後出資購買，惟登記於乙名下，推定乙適法有此權利，為乙之婚後財產；縱屬借名登記，對外仍以乙為所有人。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>法定財產制採各自所有，出資來源不影響登記之推定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲丙間A屋買賣契約之效力</p><p>甲以乙名義訂約者，屬無權代理（冒名行為類推適用無權代理），依<span class=\"art\">第170條</span>非經乙承認，對乙不生效力，丙得依<span class=\"art\">第171條</span>撤回；乙拒絕承認時，甲應依<span class=\"art\">第110條</span>對善意之丙負損害賠償責任。乙能證明印章遭甲擅自取走者，不成立<span class=\"art\">第169條</span>表見代理；出賣不動產亦非日常家務，不適用<span class=\"art\">第1003條</span>。甲以自己名義訂約者，屬出賣他人之物，買賣契約於甲丙間有效，甲嗣後為移轉之物權行為，始屬<span class=\"art\">第118條</span>之無權處分。本題中，尚未辦理移轉登記，依<span class=\"art\">第758條</span>，A屋所有權仍屬乙。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>買賣為債權行為，出賣人不以有處分權為必要。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）A屋登記於乙名下，推定乙適法有此權利，為乙之婚後財產，所有權屬乙。（二）甲以乙名義訂約者，為無權代理，非經乙承認對乙不生效力，乙拒絕承認時，甲應依<span class=\"art\">第110條</span>對善意之丙負賠償責任；甲以自己名義訂約者，屬出賣他人之物，契約於甲丙間有效，甲不能移轉所有權時對丙負債務不履行責任。因尚未辦理移轉登記，A屋所有權現仍屬乙。</p>"], "ck": [{"x": "§1017Ⅰ 法定財產制，婚後財產各自所有", "h": false}, {"x": "§759-1Ⅰ 推定登記名義人乙適法有此權利", "h": false}, {"x": "A屋登記乙名下，出資人甲不因出資取得所有權", "h": true}, {"x": "§170Ⅰ 以乙名義＝無權代理（冒名類推），非經乙承認不生效力", "h": true}, {"x": "出賣不動產非日常家務，不適用 §1003", "h": false}, {"x": "§110 乙拒絕承認，甲對善意丙負賠償責任", "h": false}, {"x": "以甲自己名義＝出賣他人之物，買賣有效；移轉時才是 §118 無權處分", "h": true}, {"x": "尚未登記（§758），A屋仍屬乙，不生善意取得問題", "h": false}], "mn": "登記推名義 → 乙所有 → 先分訂約名義 → 乙名義＝無權代理§170、甲負§110 → 甲名義＝買賣有效 → 未登記仍屬乙"}, {"id": "108-一", "no": "108年第一題", "t": "借名登記＋無權處分（丙為登記名義人）", "lv": "", "k": "off", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲向乙購買A農地，為掩人耳目，借用丙的名義，登記在丙的名下，交給丙無償使用，雙方協議丙不得處分。丙將A農地出售給不知情的丁，並辦理所有權移轉登記。試問：無權處分的意義及效力如何？丙是否為無權處分？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>無權處分，指無處分權人以自己名義，就他人權利標的物所為之處分行為；處分行為包括物權行為及準物權行為，不包括買賣等債權行為。借名登記則為僅於當事人內部發生債之關係之債權契約。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第118條</span>（無權處分）；<span class=\"art\">第115條</span>（承認溯及效力）；<span class=\"art\">第758條第1項</span>（不動產物權登記生效）；<span class=\"art\">第759條之1</span>（登記推定力、善意第三人保護）；<span class=\"art\">第71條</span>（違反強制禁止規定無效）；<span class=\"art\">第767條</span>（所有物返還請求權）；<span class=\"art\">第541條</span>、<span class=\"art\">第544條</span>（委任，類推適用）；<span class=\"art\">第184條第1項</span>（侵權行為）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）無權處分之意義及效力</p><p>依<span class=\"art\">第118條第1項</span>，無權利人就權利標的物所為之處分，經有權利人之承認始生效力，並依<span class=\"art\">第115條</span>溯及生效；依同條第2項，無權利人處分後取得其權利者，其處分自始有效，但原權利人或第三人已取得之利益不受影響；未經承認亦未取得權利前，處分效力未定。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧真正權利人之意思與交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙是否為無權處分</p><p>依<span class=\"art\">第758條第1項</span>及<span class=\"art\">第759條之1第1項</span>，不動產物權以登記為生效及推定要件。本題中，甲借丙名義將A農地登記於丙名下，借名契約僅為甲丙間債權契約，丙不得處分之約定亦僅具債之效力；縱為規避農地法令而依<span class=\"art\">第71條</span>無效，亦僅影響內部關係。丙既為登記所有權人，實務採有權處分說，其出售並移轉登記予丁屬有權處分，丁取得A農地所有權；縱採無權處分說，不知情之丁亦得依<span class=\"art\">第759條之1第2項</span>善意取得。甲不得依<span class=\"art\">第767條</span>向丁請求返還，僅得依借名契約類推適用委任規定，向丙請求交付價金（<span class=\"art\">第541條</span>）或賠償損害（<span class=\"art\">第544條</span>）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>借名之內部限制不得對抗第三人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>無權處分指無處分權人以自己名義處分他人權利標的物，經有權利人承認溯及有效，未承認前效力未定。本題借名登記僅屬甲丙間債權契約，丙為登記名義人，其出售A農地予丁屬有權處分，並非無權處分；丁取得所有權（縱採無權處分說，亦得依<span class=\"art\">第759條之1第2項</span>善意取得），甲僅得依借名契約類推適用委任規定向丙請求交付價金或賠償損害。</p>"], "ck": [{"x": "§118Ⅰ＋通說：無處分權人以自己名義處分他人標的物", "h": false}, {"x": "處分含物權與準物權行為，不含債權行為", "h": false}, {"x": "§118：經承認溯及有效，未承認前效力未定（不是無效）", "h": true}, {"x": "借名登記為甲丙間債權契約，不得處分約定不及第三人；縱因脫法無效，丙仍為登記名義人", "h": false}, {"x": "丙為登記名義人（§758Ⅰ、§759-1Ⅰ），先判斷：處分為有權處分", "h": true}, {"x": "縱採無權處分說，丁善意依 §759-1Ⅱ 取得所有權", "h": false}, {"x": "丙非無權處分；甲不得向丁主張，僅得依類推委任（§541、§544）向丙請求，§184Ⅰ後段為輔", "h": false}], "mn": "無權處分效力未定 → 借名只是債權 → 名義人處分有權 → 縱無權丁也善意取得 → 甲找丙賠"}, {"id": "99-一", "no": "99年第一題", "t"
