: "第三人詐欺撤銷＋抵押權善意取得", "lv": "", "k": "off", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲乙共謀，由甲出面詐欺丙，使丙將A地廉價售予乙，已交付並辦妥所有權移轉登記。乙即以A地向丁貸款並設定抵押權。丙發現被詐欺後，可否請求乙返還土地？可否請求丁塗銷抵押權？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>受詐欺而為意思表示者，表意人得撤銷；惟詐欺由第三人所為者，須相對人明知或可得而知始得撤銷，以兼顧意思自主與交易安全。撤銷後法律行為視為自始無效，受讓人即成無權處分人；然信賴登記之善意第三人仍受保護。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第92條</span>（詐欺之撤銷及對抗效力）；<span class=\"art\">第93條</span>（撤銷期間）；<span class=\"art\">第114條第1項</span>（撤銷之效力）；<span class=\"art\">第767條第1項前段</span>（所有物返還）；<span class=\"art\">第759條之1第2項</span>（善意第三人保護）；<span class=\"art\">第184條第1項</span>、<span class=\"art\">第185條第1項</span>（共同侵權）；<span class=\"art\">第179條</span>（不當得利）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙得否請求乙返還A地</p><p>依<span class=\"art\">第92條第1項</span>，被詐欺而為意思表示者得撤銷；但詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限。本題中，甲雖以第三人地位詐欺丙，惟甲乙事前共謀，乙自始明知，丙得於發見詐欺後一年內（<span class=\"art\">第93條</span>）撤銷買賣及物權行為；依<span class=\"art\">第114條第1項</span>視為自始無效，乙未取得A地所有權，丙得依<span class=\"art\">第767條第1項前段</span>請求乙返還A地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>相對人明知詐欺，無信賴保護之必要。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙得否請求丁塗銷抵押權</p><p>依<span class=\"art\">第759條之1第2項</span>，因信賴不動產登記之善意第三人，已依法律行為為物權變動之登記者，其變動之效力，不因原登記物權之不實而受影響。本題中，乙為丁設定抵押權屬無權處分；丁若善意，即取得抵押權（<span class=\"art\">第92條第2項</span>亦同此旨），丙不得請求塗銷，僅得依<span class=\"art\">第184條第1項</span>、<span class=\"art\">第185條第1項</span>請求甲乙連帶賠償，或依<span class=\"art\">第179條</span>請求乙返還所受利益；丁若明知甲乙共謀即非善意，丙得請求塗銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧真正權利人與交易安全。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，丙得撤銷其與乙間之買賣及物權行為，依<span class=\"art\">第767條第1項前段</span>請求乙返還A地。至塗銷抵押權，視丁是否善意而定：丁善意者，依<span class=\"art\">第759條之1第2項</span>取得抵押權，丙不得請求塗銷，僅得向甲乙求償；丁非善意者，丙得請求塗銷。</p>"], "ck": [{"x": "§92Ⅰ但書：第三人詐欺，相對人明知或可得而知仍得撤銷", "h": true}, {"x": "甲乙共謀，乙自始明知，丙得撤銷買賣及物權行為", "h": false}, {"x": "撤銷溯及無效，乙為無權處分人", "h": false}, {"x": "丙得請求乙返還A地", "h": false}, {"x": "§759-1Ⅱ 善意信賴登記並已登記之第三人，變動效力不受影響", "h": false}, {"x": "必須檢驗丁是否善意（另提 §92Ⅱ 不得對抗善意第三人）", "h": true}, {"x": "丁善意 → 丙不得請求塗銷；丁非善意 → 丙得請求塗銷", "h": false}, {"x": "丁保有抵押權時，丙依 §184Ⅰ、§185 向甲乙請求連帶賠償，或依 §179 向乙請求", "h": false}], "mn": "共謀＝明知 → 撤銷溯及無效 → 乙無權處分 → 丁善意保得住"}, {"id": "111-一", "no": "111年第一題", "t": "以自己名義出租他人之屋：返還＋§952抗辯", "lv": "", "k": "off", "tier": 2, "g": "無權處分・善意取得・登記", "q": "甲出國進修期間將其名下A屋委託好友乙打掃照看，但乙卻未經甲同意，私自以自己名義將A屋出租給不知情的丙並按月收取租金一萬元，租期五年。三年後甲學成歸國，發現此事非常生氣，主張丙無權占有A屋，向丙請求返還A屋，並要求丙支付占有使用A屋三年之租金36萬元作為補償。丙認為自己是合法承租A屋且已按時向乙支付租金，斷然拒絕甲之請求。請問丙之主張是否有理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>代理係於代理權限內以本人名義為意思表示，效果直接歸屬本人；行為人以自己名義處分或出租他人之物，非屬代理，本人不受拘束。至相對人占有使用之利益應否返還，另涉善意占有人使用收益權之爭點，不能僅因無權占有即當然負返還責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第103條</span>（代理以本人名義）；<span class=\"art\">第767條第1項前段</span>（所有物返還）；<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第952條</span>（善意占有人使用收益）；<span class=\"art\">第959條第2項</span>（訴狀送達時視為惡意）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙丙間租約之定性，基於債之相對性不得對抗甲</p><p>依<span class=\"art\">第103條</span>，代理須以本人名義為意思表示始對本人生效。本題中，乙以自己名義出租A屋予丙，非屬代理；租賃為債權契約，出租人不以所有人為限，乙丙租約有效，惟丙不得據以對甲主張有權占有。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>債之相對性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲得依<span class=\"art\">第767條</span>請求丙返還A屋</p><p>依<span class=\"art\">第767條第1項前段</span>，所有人對於無權占有其所有物者，得請求返還。本題中，甲丙間無契約關係，丙之占有對甲屬無權占有，甲得請求丙返還A屋，丙之抗辯無理由。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>乙丙租約不能對抗甲。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲得否依<span class=\"art\">第179條</span>請求36萬元使用利益，應視丙是否善意而定（本題核心爭點）</p><p>依<span class=\"art\">第179條</span>，無法律上原因受利益應返還；依<span class=\"art\">第952條</span>，善意占有人得為占有物之使用、收益。舊說認無權占有人不問善惡均負不當得利責任；新說（近期實務見解）認善意占有人之使用收益有法律上原因，不負返還義務。本題中，丙不知乙無權出租，屬善意占有人，依新說拒付36萬元有理由；惟依<span class=\"art\">第959條第2項</span>，丙於本權訴訟敗訴時自訴狀送達之日起視為惡意占有人，其後之使用利益仍應返還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第952條</span>保護善意占有人之信賴。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>丙之主張一部有理由：甲得依<span class=\"art\">民法第767條第1項前段</span>請求丙返還A屋，丙以租約抗辯無理由；丙為善意占有人，依<span class=\"art\">第952條</span>及近期實務見解，就三年使用利益對甲不負不當得利返還責任，拒付36萬元有理由；惟自訴狀送達之日起依<span class=\"art\">第959條第2項</span>視為惡意占有人，其後利益仍應返還。</p>"], "ck": [{"x": "乙以自己名義出租，非代理（不是無權代理）", "h": true}, {"x": "租約於乙丙間有效，但債之相對性不得對抗甲，丙屬無權占有", "h": false}, {"x": "甲依 §767Ⅰ前段請求返還有理由，丙此抗辯無理由", "h": false}, {"x": "§179 舊說：無權占有人不問善惡意均應返還使用利益", "h": false}, {"x": "題示丙不知情＝善意占有人", "h": true}, {"x": "§952 新說：善意占有人得使用收益，無不當得利", "h": true}, {"x": "§959Ⅱ：訴狀送達後視為惡意，其後之使用利益應返還", "h": false}, {"x": "丙拒付36萬元有理由", "h": false}], "mn": "自己名義非代理 → 租約不能對抗甲 → 返還有理由 → 善意用益 §952 → 租金不必還"}, {"id": "來勝-一", "no": "來勝115模擬試題（一） 申論一", "t": "二重買賣：共有持分先賣丁、後賣戊並先登記", "lv": "", "k": "mock", "tier": 2, "g": "無權處分・善意取得・登記", "q": "甲、乙、丙三人各有三分之一應有部分，共有一棟三層樓房屋。三人取得房屋後約定，由甲專用一樓、乙專用二樓、丙專用三樓，其餘公共部分共同使用，並依此方式使用多年，但未就該約定辦理登記。嗣丙因資金需求，將其三分之一應有部分以新臺幣500萬元出售予丁，雙方簽訂買賣契約，丁並交付50萬元定金，但尚未辦理所有權移轉登記。其後房價上漲，丙又將同一應有部分以600萬元出售予戊，並先行辦妥所有權移轉登記。試依民法規定，就下列問題說明：（一）丙先後將同一共有持分出售予丁、戊，丁、戊何人取得該共有持分？戊於締約時明知丁在先之買賣契約，是否影響其取得所有權？（二）丁得否請求戊將該共有持分移轉登記予自己？丁得向丙主張何種權利？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>二重買賣，指出賣人就同一標的物先後與數人訂立買賣契約。買賣契約僅為債權行為，各買受人只取得請求出賣人移轉所有權之債權；不動產所有權之變動，另須物權行為並經登記。債權具相對性，原則上僅得向債務人主張，不得對抗第三人。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第758條第1項</span>（不動產物權登記生效）；<span class=\"art\">第348條第1項</span>（出賣人使買受人取得所有權之義務）；<span class=\"art\">第819條第1項</span>（各共有人得自由處分其應有部分）；<span class=\"art\">第184條第1項後段</span>（故意以背於善良風俗之方法加損害於他人）；<span class=\"art\">第226條第1項</span>（可歸責之給付不能）；<span class=\"art\">第256條</span>（給付不能之解除）；<span class=\"art\">第249條第3款</span>（受定金當事人可歸責時加倍返還定金）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）戊先完成登記，取得應有部分；戊明知不影響</p><p>丙依<span class=\"art\">第819條第1項</span>得自由出賣其應有部分，無須甲乙同意。丙丁、丙戊兩買賣契約均有效，丁、戊各取得對丙之移轉請求權。依<span class=\"art\">第758條第1項</span>，不動產物權依法律行為取得者非經登記不生效力；丁未登記，戊已辦妥移轉登記，故由戊取得該三分之一應有部分。所有權歸屬以登記先後定，不以締約先後或善意惡意定；債權具相對性，戊單純知悉在先買賣，不影響其取得。惟戊若與丙通謀、教唆違約，以背於善良風俗之方法故意加損害於丁，丁得依<span class=\"art\">第184條第1項後段</span>向戊請求賠償，但仍不得請求移轉。</p></div><div class=\"evp\"><p class=\"evh\">（二）丁不得請求戊移轉；對丙得請求賠償、解約、加倍返還定金</p><p>丁戊間無法律關係，丁之債權不得對抗已登記之所有人戊，丁不得請求戊移轉登記。丙依<span class=\"art\">第348條第1項</span>負使丁取得所有權之義務，丙自行移轉予戊，致對丁給付不能，屬可歸責於丙。丁得依<span class=\"art\">第226條第1項</span>請求損害賠償（含房價上漲之履行利益），依<span class=\"art\">第256條</span>解除契約，並依<span class=\"art\">第249條第3款</span>請求丙加倍返還定金100萬元。</p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）由已登記之戊取得該應有部分；戊明知丁之買賣不影響其取得，僅於背於善良風俗故意侵害丁時另負<span class=\"art\">第184條第1項後段</span>責任。（二）丁不得請求戊移轉登記；丁得向丙依<span class=\"art\">第226條第1項</span>請求損害賠償、依<span class=\"art\">第256條</span>解除契約，並依<span class=\"art\">第249條第3款</span>請求加倍返還定金。</p>"], "ck": [{"x": "§819Ⅰ 丙得自由出賣其應有部分", "h": false}, {"x": "兩個買賣契約都有效，只生債權", "h": false}, {"x": "§758Ⅰ 不動產物權非經登記不生效力 → 戊取得", "h": true}, {"x": "戊明知不影響取得；背於善良風俗故意侵害才另負 §184Ⅰ後段", "h": true}, {"x": "丁戊無法律關係，丁不得請求戊移轉", "h": false}, {"x": "可歸責於丙之給付不能 → §226Ⅰ 損害賠償", "h": false}, {"x": "§256 解除契約＋§249③ 加倍返還定金 100 萬（不是第2款）", "h": true}], "mn": "二重買賣：契約都有效 → 登記先者得 → 明知不影響 → 先買者回頭找出賣人：賠償、解約、定金加倍"}, {"id": "預05", "no": "預測題 05", "t": "通謀虛偽＋善意第三人：登記公信力", "lv": "", "k": "pred", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲為避免債權人丙對其唯一不動產 A 屋強制執行，與乙通謀，虛偽訂立買賣契約並辦理所有權移轉登記予乙；實際上價金未交付，A 屋亦仍由甲居住。其後乙未經甲同意，將 A 屋以市價出售並辦理移轉登記予丁，丁不知甲乙通謀情事。試問：（一）甲乙間買賣契約及移轉登記之效力為何？（二）甲得否請求丁返還 A 屋或塗銷登記？甲對乙得主張何種權利？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>通謀虛偽意思表示，指表意人與相對人互相故意為非真意之表示，且雙方均知其非真意，其意思表示無效，但不得對抗善意第三人。登記公信力，指信賴不動產登記而為物權變動登記之善意第三人，其變動效力不受原登記不實之影響。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第87條第1項</span>（通謀虛偽表示無效，不得對抗善意第三人）；<span class=\"art\">第118條第1項</span>（無權處分）；<span class=\"art\">第759條之1第2項</span>（善意第三人保護）；<span class=\"art\">第184條第1項前段</span>（侵權行為）；<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第180條第4款</span>（不法原因給付）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲乙間買賣及移轉登記之效力</p><p>依<span class=\"art\">第87條第1項</span>，表意人與相對人通謀而為虛偽意思表示者，其意思表示無效。本題中，甲為避免丙強制執行，與乙虛偽訂立買賣並移轉登記，價金未交付、A屋仍由甲居住，雙方均知非真意，買賣契約及物權行為均無效；乙僅為登記名義人，甲仍為所有權人。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>雙方均無受法律效果拘束之真意。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲得否向丁請求及對乙之權利</p><p>依<span class=\"art\">第759條之1第2項</span>，因信賴不動產登記之善意第三人，已依法律行為為物權變動之登記者，其變動之效力，不因原登記物權之不實而受影響。本題中，乙未經甲同意出售A屋，屬<span class=\"art\">第118條第1項</span>之無權處分；惟丁不知通謀情事，基於買賣並已完成登記，依<span class=\"art\">第87條第1項但書</span>及<span class=\"art\">第759條之1第2項</span>取得所有權，甲不得請求丁返還或塗銷登記。甲得依<span class=\"art\">第184條第1項前段</span>或<span class=\"art\">第179條</span>向乙請求賠償或返還價金，擇一行使；乙以<span class=\"art\">第180條第4款</span>抗辯者，本文採否定說，因甲欠缺使乙終局取得之給付意思。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧交易安全與真正所有人之求償。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲乙間買賣及移轉登記，依<span class=\"art\">第87條第1項本文</span>均無效，甲仍為所有權人。（二）丁為善意第三人，依<span class=\"art\">第87條第1項但書</span>及<span class=\"art\">第759條之1第2項</span>取得A屋所有權，甲不得請求丁返還或塗銷登記；甲得依<span class=\"art\">第184條第1項前段</span>或<span class=\"art\">第179條</span>向乙請求賠償或返還價金，不受<span class=\"art\">第180條第4款</span>影響。</p>"], "ck": [{"x": "§87Ⅰ本文：通謀虛偽意思表示無效", "h": false}, {"x": "買賣（債權行為）與移轉登記（物權行為）分開說明，均無效", "h": true}, {"x": "乙僅為登記名義人，甲仍為所有人", "h": false}, {"x": "§87Ⅰ但書：不得以無效對抗善意第三人", "h": true}, {"x": "乙屬無權處分，丁善意且依法律行為已登記", "h": false}, {"x": "§180④ 不法原因給付抗辯：二說並陳，本文採否定說", "h": false}, {"x": "§759-1Ⅱ：信賴登記之善意第三人受保護，丁取得所有權", "h": false}, {"x": "甲不得向丁請求；對乙依 §184Ⅰ前段或 §179 求償", "h": true}], "mn": "通謀無效甲還是主人 → 乙無權處分 → 善意丁有但書＋公信力 → 甲找乙賠"}, {"id": "預22", "no": "預測題 22", "t": "動產善意取得：借用物擅賣、占有改定與盜贓物", "lv": "", "k": "pred", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲將其名貴相機 A（市價 8 萬元）借給乙使用 3 個月。乙未經甲同意，以 6 萬元將 A 出賣予丙，並當場交付；丙不知 A 為借用物，亦無可疑情事。試問：（一）丙是否取得 A 之所有權？甲得否向丙請求返還？甲對乙得主張何種權利？（二）若乙與丙約定 A 仍由乙保管使用，僅以契約將 A 之所有權讓與丙，乙其後拒不交出，丙是否取得所有權？（三）若 A 並非借用物，而係被丁竊取，丁即賣予經營二手相機買賣之戊，戊再以 6 萬元賣予善意之丙；甲於遭竊 10 個月後發現 A 在丙處，甲得否請求返還？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>動產善意取得，指讓與人雖無移轉所有權之權利，受讓人信賴其占有而善意受讓者，法律仍使其取得所有權，以保護動產交易安全。動產無登記制度，占有是唯一外觀；其效果為原始取得，真正所有權人因而喪失所有權。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第801條</span>、<span class=\"art\">第948條第1項</span>（善意取得）；<span class=\"art\">第948條第2項</span>、<span class=\"art\">第761條第2項</span>（占有改定）；<span class=\"art\">第949條</span>（盜贓物二年內回復）；<span class=\"art\">第950條</span>（向商人買得須償還價金）；<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第226條第1項</span>、<span class=\"art\">第179條</span>、<span class=\"art\">第177條第2項</span>（對乙求償）；<span class=\"art\">第767條第1項</span>。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙擅賣借用物，丙取得所有權</p><p>依<span class=\"art\">第801條</span>、<span class=\"art\">第948條第1項</span>，善意受讓動產之占有者，縱讓與人無讓與權利，仍取得所有權；但明知或因重大過失而不知者除外。本題中，乙為借用人無處分權，惟買賣有效；丙不知情且無可疑情事，已受現實交付，A為甲自願借出之委託物，丙原始取得所有權，甲不得依<span class=\"art\">第767條</span>請求返還，僅得依<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第226條第1項</span>向乙請求賠償，或依<span class=\"art\">第179條</span>、<span class=\"art\">第177條第2項</span>請求交出售得價金。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）以占有改定受讓，丙尚未取得所有權</p><p>依<span class=\"art\">第948條第2項</span>，依<span class=\"art\">第761條第2項</span>受讓占有者，以受現實交付且交付時善意為限始受保護。本題中，A仍由乙保管，屬占有改定，丙僅取得間接占有，未取得所有權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>外觀占有人仍是乙，不宜僅憑觀念交付犧牲原所有權人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）盜贓物經商人售出，甲須償還價金始得回復</p><p>依<span class=\"art\">第949條第1項</span>，盜贓物原占有人自喪失占有時起二年內，得向善意之現占有人請求回復；依<span class=\"art\">第950條</span>，現占有人由販賣同種之物之商人善意買得者，非償還價金不得回復。本題中，甲遭竊10個月仍在二年內，得請求回復，惟丙係向商人戊善意買得，甲須償還6萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧原所有人與善意買受人利益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）丙依<span class=\"art\">民法第801條</span>、<span class=\"art\">第948條第1項</span>原始取得A所有權，甲不得向丙請求返還，只能依<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第226條第1項</span>向乙請求賠償，或依<span class=\"art\">第179條</span>、<span class=\"art\">第177條第2項</span>請求售得價金。（二）僅以占有改定受讓，依<span class=\"art\">第948條第2項</span>丙未取得所有權。（三）甲於二年內得依<span class=\"art\">第949條第1項</span>請求回復，但須依<span class=\"art\">第950條</span>償還6萬元。</p>"], "ck": [{"x": "§801、§948Ⅰ：明知或重大過失才排除，輕過失不影響", "h": true}, {"x": "借用物＝委託物，不適用 §949，甲不得向丙請求", "h": true}, {"x": "丙原始取得；甲依 §184Ⅰ前段、§226Ⅰ 向乙求償，或依 §179、§177Ⅱ 請求交出價金", "h": false}, {"x": "§761Ⅱ 占有改定＋§948Ⅱ：須現實交付且交付時善意", "h": true}, {"x": "僅占有改定，丙未取得，甲得請求乙返還", "h": false}, {"x": "§949Ⅰ 自喪失占有時起二年；§950 商人買得須償還價金", "h": true}, {"x": "10個月內得回復，但須償還6萬元", "h": false}], "mn": "委託物善意＋現交 → 丙取得、甲找乙 → 占有改定不算 → 盜贓二年內可回復 → 商人買的要還錢"}, {"id": "預23", "no": "預測題 23", "t": "表見代理：授權終止未通知、空白契約書與店章", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "甲經營不動產仲介店，聘乙為業務員，並授權乙以甲之名義簽訂房屋租賃契約。後甲將乙解僱，但未收回乙持有之蓋有甲店章的空白契約書，亦未通知往來之房東。乙離職後，仍持空白契約書以甲之名義與房東丙簽訂 A 屋租賃契約（租期 3 年）。丙過去多次與甲、乙簽約，並不知乙已離職。試問：（一）甲是否須受該租約拘束？（二）若丙訂約時已知乙離職，結果如何？（三）若甲不受拘束，丙得向乙主張何種責任？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>表見代理指行為人無代理權，但本人以自己之行為製造有代理權之外觀，使善意第三人合理信賴，法律使本人對第三人負授權人之責任。其與無權代理之分界，在於本人有無歸責事由，與第三人是否善意。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第169條</span>（表見代理）、<span class=\"art\">第107條</span>（代理權之撤回不得對抗善意第三人）、<span class=\"art\">第170條</span>（無權代理須經承認；催告）、<span class=\"art\">第171條</span>（相對人撤回）、<span class=\"art\">第110條</span>（無權代理人責任）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲須受租約拘束</p><p>依<span class=\"art\">第169條</span>，由自己之行為表示以代理權授與他人者，對於第三人應負授權人之責任，要件為①本人有表示授權之行為②第三人善意無過失③因信賴而為法律行為。本題中，乙離職後已無代理權；惟甲未收回蓋有店章之空白契約書，亦未通知往來房東，持續維持乙為代理人之外觀，可歸責於甲；丙多次與甲、乙簽約，不知乙離職，屬善意無過失。不論類推適用<span class=\"art\">第107條</span>或適用<span class=\"art\">第169條</span>，丙均受保護，租約對甲生效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>本人製造外觀即應負責。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙明知則回歸無權代理</p><p>依<span class=\"art\">第169條但書</span>，第三人明知其無代理權或可得而知者，不在此限。本題中，丙不能主張表見代理，租約屬<span class=\"art\">第170條</span>之無權代理，甲得承認或拒絕；丙得定相當期限催告，甲逾期未答覆視為拒絕；丙明知乙無代理權，依<span class=\"art\">第171條但書</span>不得撤回，亦不能依<span class=\"art\">第110條</span>求償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>法律不保護明知之相對人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙對善意之丙負賠償責任</p><p>依<span class=\"art\">第110條</span>，無代理權人對於善意之相對人，負損害賠償之責。本題中，表見代理不成立且甲拒絕承認，丙為善意者，乙應負無過失之賠償責任，依實務見解以履行利益為上限。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護善意相對人之信賴。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲製造乙仍有代理權之外觀，丙善意無過失，依<span class=\"art\">第169條</span>甲負授權人之責任（採類推適用<span class=\"art\">第107條</span>之說結論相同），租約對甲生效。（二）丙明知者不適用<span class=\"art\">第169條</span>，依<span class=\"art\">第170條</span>屬效力未定，甲得承認或拒絕，丙得催告，但依<span class=\"art\">第171條但書</span>不得撤回，亦不得依<span class=\"art\">第110條</span>求償。（三）甲不受拘束而丙善意時，乙依<span class=\"art\">第110條</span>對丙負損害賠償責任。</p>"], "ck": [{"x": "§169 本人以自己行為表示授權，對第三人負授權人之責任", "h": false}, {"x": "甲未收回店章空白契約書、未通知房東＝本人可歸責", "h": true}, {"x": "丙多次簽約、不知乙離職，善意無過失", "h": false}, {"x": "甲負授權人之責任，租約對甲生效，不需承認", "h": false}, {"x": "§169但書：第三人明知或可得而知者不受保護", "h": true}, {"x": "丙明知 → 回 §170 無權代理，甲得承認或拒絕，丙得催告", "h": true}, {"x": "§110 無代理權人只對善意相對人負損害賠償", "h": true}], "mn": "有歸責才表見 → 丙不知才有效 → 明知回無權代理 → 乙只賠善意人"}, {"id": "預27", "no": "預測題 27", "t": "無權代理：仲介人員越權簽約與相對人救濟", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "屋主甲委託乙仲介公司出售 A 屋，僅授權乙之業務員丙「帶看及轉交要約書」。丙卻擅自以甲之名義與買方丁簽訂買賣契約，收受定金 100 萬元。丁為此向銀行辦理貸款鑑價支出 8 萬元，並提前退租原住處負擔違約金 12 萬元。甲知悉後表示從未授權簽約，拒絕承認。試問：（一）買賣契約對甲有無效力？丁得如何確定法律關係？（二）丁得否向丙請求損害賠償？其範圍如何？（三）若丁簽約時已知丙僅受授權帶看，結論有何不同？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>無權代理，指無代理權人以代理人之名義所為之法律行為，非經本人承認，對本人不生效力（效力未定）。無權代理人責任，指無代理權人對善意相對人所負之損害賠償責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第103條第1項</span>（代理之效力）、<span class=\"art\">第169條</span>（表見代理）、<span class=\"art\">第107條</span>（代理權之限制）；<span class=\"art\">第170條</span>（本人承認、相對人催告）、<span class=\"art\">第171條</span>（相對人撤回）；<span class=\"art\">第110條</span>（無權代理人之責任）；<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第184條第1項後段</span>、<span class=\"art\">第188條第1項</span>（侵權、僱用人責任）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）契約確定對甲不生效力</p><p>依<span class=\"art\">第103條第1項</span>反面，丙僅受授權帶看及轉交要約書，以甲名義簽約已逾代理權限，屬無權代理；甲無授權外觀，不成立<span class=\"art\">第169條</span>表見代理，亦無<span class=\"art\">第107條</span>之適用。依<span class=\"art\">第170條第1項</span>，契約非經甲承認對甲不生效力。本題中，甲已拒絕承認，契約確定對甲不生效力，丁之催告（<span class=\"art\">第170條第2項</span>）、撤回（<span class=\"art\">第171條</span>）均無實益。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>本人未授權不應受拘束。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丁得向丙請求損害賠償及返還定金</p><p>依<span class=\"art\">第110條</span>，無代理權人對於善意之相對人，負損害賠償之責，屬無過失責任。本題中，丁善意，鑑價費8萬元及違約金12萬元屬信賴利益，未超過履行利益者（實務見解），均得向丙請求；定金100萬元無法律上原因，得依<span class=\"art\">第179條</span>請求丙返還。丙若故意背俗加損害且屬執行職務，並得依<span class=\"art\">第188條第1項</span>請求乙公司連帶賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護善意相對人之信賴。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁明知者僅得請求返還定金</p><p><span class=\"art\">第110條</span>以相對人善意為要件，<span class=\"art\">第171條但書</span>亦排除明知者之撤回權。本題中，丁明知丙僅受授權帶看，丙不負<span class=\"art\">第110條</span>之責任，丁亦不得撤回；甲已拒絕承認，催告亦無實益，丁僅得依<span class=\"art\">第179條</span>請求丙返還定金。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>明知者無信賴可保護。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）屬無權代理，不成立表見代理，甲拒絕承認後契約確定對甲不生效力，催告、撤回已無實益。（二）丁得依<span class=\"art\">第110條</span>請求丙賠償鑑價費及違約金（以履行利益為上限），並依<span class=\"art\">第179條</span>請求返還定金。（三）丁若明知，不得依<span class=\"art\">第110條</span>、<span class=\"art\">第171條</span>主張，僅得依<span class=\"art\">第179條</span>請求丙返還定金。</p>"], "ck": [{"x": "丙越權簽約＝無權代理，效力未定（不是無效）", "h": true}, {"x": "甲無表示授權行為 → 不成立 §169 表見代理", "h": false}, {"x": "§170Ⅰ：非經本人承認不生效力；甲拒絕 → 確定不生效力", "h": false}, {"x": "§170Ⅱ 催告權、§171 撤回權（明知者除外）", "h": true}, {"x": "§110：善意相對人得向無權代理人請求損害賠償", "h": false}, {"x": "範圍不超過契約有效所得利益；8萬、12萬信賴損失均得請求", "h": false}, {"x": "定金100萬依 §179 向丙請求返還", "h": false}, {"x": "損害屬純粹經濟上損失 → §188 須以 §184Ⅰ後段成立侵權為前提", "h": false}, {"x": "丁明知時不得依 §110、§171 主張；甲已拒絕，僅得依 §179 請求返還定金", "h": true}], "mn": "越權簽約無代理 → 本人不認不生效 → 催告或撤回 → 善意找丙賠＋還定金 → 明知就沒有 §110"}, {"id": "預29", "no": "預測題 29", "t": "繼承未辦登記：繼承人處分與債權人查封", "lv": "", "k": "pred", "tier": 0, "g": "無權處分・善意取得・登記", "q": "甲死亡，遺有 A 屋，繼承人為其子乙與丙，均未辦理繼承登記。乙因急需用錢，先辦妥繼承登記（登記為乙、丙公同共有），再單獨以自己名義將 A 屋出賣予丁，並持偽造之丙同意書辦理出售移轉登記；丙事後得知，主張乙無權處分。另設乙未出賣 A 屋，乙之債權人戊欲對乙就 A 屋之應有部分聲請查封。試問：（一）甲死亡時 A 屋所有權歸屬如何？未辦繼承登記有何限制？（二）乙單獨出賣並移轉 A 屋，其效力如何？丁得否取得所有權？（三）戊得否對乙就 A 屋之應有部分聲請查封？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>繼承，指繼承人自繼承開始時承受被繼承人財產上之一切權利義務。宣示登記，指繼承等非因法律行為取得者，登記僅於處分前須先辦理。公同共有，指各共有人之權利及於共有物之全部，並無應有部分可言。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第1147條</span>（繼承因死亡開始）、<span class=\"art\">第1148條第1項</span>（概括承受）、<span class=\"art\">第1151條</span>（遺產公同共有）、<span class=\"art\">第759條</span>（非因法律行為取得須登記始得處分）；<span class=\"art\">第828條第3項</span>（公同共有物處分須全體同意）、<span class=\"art\">第118條第1項</span>（無權處分）、<span class=\"art\">第759條之1第2項</span>（信賴登記之保護）、<span class=\"art\">第767條第1項</span>（所有物返還及妨害除去）；<span class=\"art\">第242條</span>（代位權）；土地法<span class=\"art\">第34條之1</span>。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A屋所有權歸屬及登記限制</p><p>依<span class=\"art\">第1147條</span>、<span class=\"art\">第1148條第1項</span>、<span class=\"art\">第1151條</span>，繼承人自繼承開始時承受權利義務，分割遺產前為公同共有。本題中，甲死亡時乙、丙即公同共有A屋，無須登記；惟依<span class=\"art\">第759條</span>，非經繼承登記不得處分。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維護處分前之公示。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙單獨出賣並移轉之效力</p><p>依<span class=\"art\">第828條第3項</span>，公同共有物之處分應得全體同意；依<span class=\"art\">第118條第1項</span>，無權處分經承認始生效力。本題中，買賣契約依實務並非無效，但乙持偽造之丙同意書辦理移轉，未真正得丙同意，屬無權處分；乙一人亦不符土地法<span class=\"art\">第34條之1</span>多數決要件。登記簿已表明公同共有並無不實，丁信賴者為偽造同意書而非登記，不能依<span class=\"art\">第759條之1第2項</span>善意取得，丙得依<span class=\"art\">第767條第1項</span>請求塗銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>善意取得以信賴不實登記為要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）戊得否就乙之應有部分查封</p><p>依<span class=\"art\">第1151條</span>，遺產分割前為公同共有，無所謂應有部分。本題中，戊不得以乙之應有部分為標的查封拍賣；依執行實務，應俟遺產分割後始得拍賣，執行法院將命戊補正已分割遺產之資料，或命其依<span class=\"art\">第242條</span>代位提起分割遺產訴訟。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧繼承人權益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）A屋自甲死亡時由乙、丙公同共有，處分前須先辦繼承登記。（二）乙丁買賣契約並非無效，但乙係無權處分，須經丙承認始生效力；丁不能善意取得，丙得請求塗銷。（三）戊不得逕就乙之應有部分查封，應俟遺產分割後始得拍賣，或代位提起分割遺產訴訟。</p>"], "ck": [{"x": "§1147、§1148Ⅰ 繼承開始承受；§1151 分割前公同共有", "h": false}, {"x": "§759 宣示登記：繼承時已取得，處分前須先登記（≠ §758Ⅰ）", "h": true}, {"x": "A屋乙丙公同共有，處分前須先辦繼承登記", "h": false}, {"x": "買賣有效；處分違反 §828Ⅲ＝無權處分，§118Ⅰ 須丙承認", "h": true}, {"x": "土地法 §34-1：乙一人未過半，亦不得依多數決處分", "h": false}, {"x": "§759-1Ⅱ 以信賴不實登記為前提，丁原則不能善意取得", "h": false}, {"x": "公同共有無應有部分，不是分別共有", "h": true}, {"x": "不得逕查封應有部分；俟分割後拍賣，必要時 §242 代位訴請分割", "h": false}], "mn": "死亡即繼承 → 分割前公同共有 → 要處分先登記 → 乙單獨賣＝無權處分 → 丁無不實登記可信賴 → 沒有應有部分，分割後才拍賣"}, {"id": "預35", "no": "預測題 35", "t": "善意占有人：使用收益、費用償還與毀損賠償", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "甲所有之 A 屋，被乙誤信為自己繼承而占有，並出租予丙收取租金。乙占有期間支出屋頂修繕費 20 萬元（必要費用）及增設衛浴 50 萬元（現存增加價值 30 萬元），並因疏忽使屋內一房間失火燒毀，損失 40 萬元。甲提起訴訟請求返還 A 屋，乙於收受訴狀送達後仍繼續占有。試問：（一）甲得否請求乙返還 A 屋？（二）甲得否請求乙返還占有期間之使用利益與租金？（三）乙得否請求甲償還費用？（四）乙對房間燒毀應否賠償？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>占有指對於物有事實上管領之力；善意占有人指不知其無占有本權而占有之人。民法依善意或惡意區分其權利義務範圍；善意占有人於本權訴訟敗訴時，自訴狀送達之日起視為惡意。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第767條第1項前段</span>（所有物返還）；<span class=\"art\">第952條</span>（善意使用收益）、<span class=\"art\">第958條</span>（惡意返還孳息）、<span class=\"art\">第959條第2項</span>（視為惡意）；<span class=\"art\">第954條</span>（必要費用）、<span class=\"art\">第955條</span>（有益費用）；<span class=\"art\">第953條</span>（善意賠償以所受利益為限）、<span class=\"art\">第956條</span>（惡意賠償）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得請求返還</p><p>依<span class=\"art\">第767條第1項前段</span>，所有人對無權占有者得請求返還。本題乙誤信繼承而占有，無正當權源，甲得請求返還A屋。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>善意不影響物上請求權。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）送達前不得請求，送達後應返還</p><p>依<span class=\"art\">第952條</span>，善意占有人於推定其為適法所有之權利範圍內，得為占有物之使用、收益。本題訴狀送達前之使用利益及租金，依實務見解甲不得請求；依<span class=\"art\">第959條第2項</span>，乙自訴狀送達之日起視為惡意，依<span class=\"art\">第958條</span>應返還其後之租金等孳息。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護善意占有人之信賴。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）得請求20萬元及30萬元</p><p>依<span class=\"art\">第954條</span>，必要費用得請求償還，但已取得孳息者不得請求通常必要費用；依<span class=\"art\">第955條</span>，有益費用以現存增加價值為限。本題屋頂修繕依通說屬特別必要費用，不受但書限制，得請求20萬元；衛浴僅得請求30萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>償還以回復請求人所受利益為度。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）善意期間原則不賠</p><p>依<span class=\"art\">第953條</span>，善意占有人就可歸責於己之毀損，僅以所受利益為限負賠償責任。本題燒毀若在善意期間，乙通常無所受利益，原則上不賠；本文認<span class=\"art\">第953條</span>排除<span class=\"art\">第184條</span>之適用。若在送達後，依<span class=\"art\">第956條</span>負賠償之責。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>善意占有人誤信為自己之物，不應課以一般注意義務。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得依<span class=\"art\">第767條第1項前段</span>請求返還A屋。（二）送達前之使用利益與租金不得請求；送達後乙視為惡意，應返還租金等孳息。（三）乙得請求修繕費20萬元，衛浴以現存增加價值30萬元為限。（四）善意期間燒毀，僅以所受利益為限，通常無須賠償；送達後燒毀者，依<span class=\"art\">第956條</span>負賠償責任。</p>"], "ck": [{"x": "§767Ⅰ前段 甲得請求返還，乙善意不影響", "h": false}, {"x": "§952 善意占有人於適法所有範圍內使用收益，起訴前免返還", "h": false}, {"x": "§959Ⅱ 本權訴訟敗訴，自訴狀送達之日起視為惡意", "h": true}, {"x": "送達後依 §958 返還孳息（租金）", "h": false}, {"x": "§954 已取得孳息僅不得請求通常必要費用；屋頂修繕屬特別必要費用，得請求20萬", "h": true}, {"x": "§955 有益費用限現存增加價值30萬，非50萬", "h": true}, {"x": "§953 善意占有人毀損僅以所受利益為限", "h": false}, {"x": "§953 與 §184 之關係：二說並陳，本文採 §953 排除 §184", "h": true}, {"x": "送達後燒毀依 §956 負損害賠償（不以所受利益為限）", "h": false}], "mn": "善意照樣還屋 → 善意可用可收 → 訴狀一到變惡意 → 有益費用看增價 → 毀損善意只賠所得利益"}, {"id": "預39", "no": "預測題 39", "t": "雙方代理與自己代理：仲介兼任買賣雙方代理人", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "屋主甲委託乙代為出售 A 屋，授權書載明得簽訂買賣契約。買方丙同日亦委託乙代為購買 A 屋，授權書載明得簽訂買賣契約，總價 2,500 萬元。乙未告知甲與丙雙方均有委託，即同時以甲、丙雙方代理人之身分簽訂 A 屋買賣契約。甲事後得知，主張契約無效。試問：（一）乙同時為甲與丙之代理人簽約，效力如何？（二）若甲事前許諾乙得同時為雙方代理，結論如何？（三）若乙僅為居間人而非代理人，有無§106 之問題？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>雙方代理指代理人同時為本人與第三人之代理人，而為本人與第三人間之法律行為；自己代理指代理人以本人名義與自己為法律行為。二者均因利益衝突，原則上禁止。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第106條</span>（自己代理、雙方代理之禁止）、<span class=\"art\">第103條</span>（代理之效力）、<span class=\"art\">第170條第1項</span>、第2項（無權代理之承認與催告）；<span class=\"art\">第565條</span>（居間定義）、<span class=\"art\">第567條第1項</span>（據實報告）、<span class=\"art\">第570條</span>（報酬平均負擔）、<span class=\"art\">第571條</span>（報酬喪失）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）雙方代理未經許諾，效力未定</p><p>依<span class=\"art\">第106條</span>，代理人非經本人之許諾，「亦不得既為第三人之代理人，而為本人與第三人之法律行為」。本題中，乙未經許諾同時代理甲、丙簽訂買賣契約，違反<span class=\"art\">第106條</span>。依最高法院85年度台上字第106號判決，該規定非強行規定，違反者並非無效，經本人事後承認仍生效力；依<span class=\"art\">第170條第1項</span>，須經甲、丙雙方承認始生效力，任一方拒絕即不生效力。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>禁止雙方代理旨在保護本人利益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲許諾後，效力繫於丙之承認</p><p>許諾須由各該本人為之。本題中，甲事前許諾，甲方之代理已無瑕疵；惟丙未許諾，乙代丙部分仍屬未經許諾之雙方代理。丙承認者，依<span class=\"art\">第103條</span>、<span class=\"art\">第170條第1項</span>對甲、丙發生效力，丙拒絕者全部不生效力，甲並得依<span class=\"art\">第170條第2項</span>定相當期限催告丙確答。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>契約成立須雙方意思表示均有效歸屬於本人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）居間人無<span class=\"art\">第106條</span>之問題</p><p>依<span class=\"art\">第565條</span>，居間人僅報告訂約機會或為訂約媒介，不為意思表示，無<span class=\"art\">第106條</span>之適用。本題中，乙如僅為居間人，報酬依<span class=\"art\">第570條</span>由雙方平均負擔；但須依<span class=\"art\">第567條第1項</span>據實報告各當事人，違反對委託人之義務而為利於相對人之行為，或違反誠實及信用方法由相對人收受利益者，依<span class=\"art\">第571條</span>不得向委託人請求報酬及償還費用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>居間人仍負忠實義務。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙未經許諾為雙方代理，並非無效，屬效力未定，須甲、丙均承認始生效力，甲主張無效無理由。（二）甲事前許諾者，契約整體繫於丙之承認，丙承認則對雙方生效，丙拒絕則全部不生效力。（三）居間人非代理人，無<span class=\"art\">第106條</span>問題，但須據實報告並受<span class=\"art\">第571條</span>限制。</p>"], "ck": [{"x": "§106：非經本人許諾不得雙方代理；專履行債務者除外", "h": true}, {"x": "乙同時代甲、丙簽約＝雙方代理，未經許諾", "h": false}, {"x": "違反 §106 非無效，效力未定（最高 85 台上 106），§170Ⅰ 須甲、丙均承認", "h": true}, {"x": "甲許諾 → 甲方無瑕疵；丙未許諾 → 契約整體效力未定，繫於丙承認（不能只對甲生效）", "h": true}, {"x": "§565：居間人僅報告或媒介，不是代理人", "h": true}, {"x": "§567、§571：據實報告；違反而利於相對人不得請求報酬", "h": false}, {"x": "居間人無 §106 之問題", "h": false}], "mn": "雙方代理要許諾（專履行債務可）→ 沒許諾效力未定 → 兩個本人都許諾才有效 → 居間不是代理"}, {"id": "預45", "no": "預測題 45", "t": "物：未分離出產物、從物、法定孳息與房地分離", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "甲所有A農地上種有已成熟但尚未收割之稻作，並設有專供灌溉A地之抽水馬達；A地一角另有甲自建之B倉庫一棟（未辦保存登記）。甲前將A地另一角出租予丙設置廣告看板，租金每月月底給付，並已交付丙使用。甲於某月15日將A地出賣予乙，並辦妥所有權移轉登記，雙方對稻作、馬達及B倉庫均未約定。試問：（一）稻作與抽水馬達之所有權歸屬？（二）B倉庫是否隨同移轉？乙得否請求甲拆除？（三）丙當月之租金應如何歸屬？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>不動產謂土地及其定著物，其出產物尚未分離者為該不動產之部分。從物指非主物之成分，常助主物效用而同屬一人之物。法定孳息按收取權利存續期間之日數取得。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第66條</span>（不動產；出產物）、<span class=\"art\">第68條</span>（從物）、<span class=\"art\">第348條第1項</span>、<span class=\"art\">第761條第1項</span>、<span class=\"art\">第425條之1</span>（推定租賃）、<span class=\"art\">第425條</span>（買賣不破租賃）、<span class=\"art\">第70條第2項</span>（法定孳息按日數）、<span class=\"art\">第179條</span>（不當得利）、<span class=\"art\">第373條</span>（利益自交付移轉）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）稻作與馬達均歸乙所有</p><p>依<span class=\"art\">第66條第2項</span>，不動產之出產物，尚未分離者，為該不動產之部分；依<span class=\"art\">第68條第2項</span>，主物之處分，及於從物。本題中，稻作已成熟但未收割，仍為A地之部分，隨A地歸乙；抽水馬達專供A地灌溉，屬從物，甲依<span class=\"art\">第348條第1項</span>負交付義務，依<span class=\"art\">第761條第1項</span>交付後乙取得所有權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>已成熟不等於已分離。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）B倉庫不隨同移轉，乙不得請求拆除</p><p>依<span class=\"art\">第66條第1項</span>，定著物為獨立不動產；依<span class=\"art\">第425條之1第1項</span>，土地及其上房屋同屬一人而僅讓與土地者，推定在房屋得使用期限內有租賃關係。本題中，B倉庫雖未辦保存登記，仍屬甲所有；甲僅讓與A地，推定乙甲間有租賃關係，乙不得請求拆屋還地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免建物遭拆除。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）當月租金按日數分歸甲、乙</p><p>依<span class=\"art\">第425條</span>，租約已公證，或定有期限且未逾五年者，對乙繼續存在；依<span class=\"art\">第70條第2項</span>，法定孳息按權利存續期間內之日數取得。本題中，甲之收取權存續至15日，當月租金按移轉前後日數分歸甲、乙；月底出租人已為乙，丙應向乙給付全月租金，甲再依<span class=\"art\">第179條</span>向乙請求應得部分。惟依<span class=\"art\">第373條</span>，甲乙內部以交付時點為分界，交付在登記後者，交付前租金仍歸甲。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>孳息歸屬應與收取權相符。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）稻作為A地之部分，抽水馬達為從物，均隨A地歸乙所有。（二）B倉庫仍屬甲所有，不隨同移轉，依<span class=\"art\">第425條之1第1項</span>推定有租賃關係，乙不得請求拆除。（三）租約對乙繼續存在者，當月租金依<span class=\"art\">第70條第2項</span>按日數分歸甲、乙，丙向乙全額給付，甲再向乙請求其應得部分。</p>"], "ck": [{"x": "§66Ⅱ：未分離之出產物為不動產之部分", "h": true}, {"x": "§68：從物要件＋主物之處分及於從物", "h": false}, {"x": "倉庫＝定著物，未保存登記仍為獨立不動產", "h": true}, {"x": "§425-1Ⅰ：房地同屬一人而僅讓與土地 → 推定租賃", "h": true}, {"x": "§425：已交付占有中 → 租約對受讓人繼續存在；未公證且逾五年或未定期限者不適用", "h": true}, {"x": "§70Ⅱ：法定孳息按權利存續日數取得", "h": false}, {"x": "§373：甲乙內部之租金利益以交付時點為準", "h": true}], "mn": "沒割的稻屬地 → 灌溉馬達是從物 → 倉庫自成一物不跟走 → 推定租賃不能拆 → 租約跟著地 → 租金按日分"}, {"id": "預48", "no": "預測題 48", "t": "拾得遺失物之報酬與歸屬；動產附合（§805～§812、§816）", "lv": "", "k": "pred", "tier": 1, "g": "無權處分・善意取得・登記", "q": "（一）甲於搭乘捷運時，在車廂內拾得乙遺失之名錶一只（價值新臺幣10萬元），翌日即交存警察機關，乙於招領期間內認領，甲得否請求報酬？若拾得人係捷運公司站務員丙於執行職務時拾得，結論是否不同？（二）若該名錶自招領之日起逾六個月無人認領，所有權歸屬為何？（三）若甲拾得後未通知亦未交存，並自行將自己價值3萬元之金質錶帶焊接於該錶上，非毀損不能分離，其後乙尋獲該錶，雙方權利如何？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>拾得遺失物，指發見他人遺失之物而占有之，認領時拾得人得請求報酬，逾期無人認領者由拾得人取得所有權。附合，指動產與他人之動產結合，非毀損不能分離或分離需費過鉅，有可視為主物者，由主物所有人取得合成物所有權。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第805條第2項</span>、第5項（報酬及留置權）、<span class=\"art\">第805條之1第1款</span>、第2款（不得請求報酬）、<span class=\"art\">第807條</span>（逾期未認領之歸屬）、<span class=\"art\">第942條</span>（占有輔助人）；<span class=\"art\">第812條</span>（動產附合）、<span class=\"art\">第816條</span>（償金）、<span class=\"art\">第767條第1項前段</span>（所有物返還）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲得請求至多1萬元報酬，丙不得請求</p><p>依<span class=\"art\">第805條第2項</span>，有受領權之人認領遺失物時，拾得人得請求報酬，但不得超過其物財產上價值十分之一。本題中，甲為一般乘客且翌日即交存，無<span class=\"art\">第805條之1</span>除外事由，得請求上限1萬元之報酬；站務員丙於執行職務時在交通設備內拾得，依<span class=\"art\">第805條之1第1款</span>不得請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>受僱人拾得屬執行職務。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）逾六個月無人認領，由甲取得所有權</p><p>依<span class=\"art\">第807條第1項</span>，遺失物自通知或最後招領之日起逾六個月，未經有受領權之人認領者，由拾得人取得其所有權。本題中，名錶由甲取得；惟依同條第2項，甲受通知或公告後三個月內未領取者，歸屬保管地之地方自治團體。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧權利安定。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙取得合成物並得請求返還，甲僅得請求償還價額</p><p>依<span class=\"art\">第812條第2項</span>，附合之動產有可視為主物者，該主物所有人取得合成物之所有權。本題中，名錶可視為主物，由乙取得合成物所有權，甲無權占有，乙得依<span class=\"art\">第767條第1項前段</span>請求返還。甲依<span class=\"art\">第816條</span>得請求償還乙所受利益之價額，非當然為3萬元，乙得主張強迫得利，並以名錶受損之賠償抵銷；甲未於七日內通知或交存，依<span class=\"art\">第805條之1第2款</span>不得請求報酬。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持物之經濟一體性。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得依<span class=\"art\">第805條第2項</span>請求報酬，上限1萬元；站務員丙依<span class=\"art\">第805條之1第1款</span>不得請求。（二）逾六個月無人認領，依<span class=\"art\">第807條第1項</span>由甲取得所有權。（三）乙取得合成物所有權並得請求返還；甲得依<span class=\"art\">第816條</span>請求償還價額，乙得主張強迫得利及抵銷；甲不得請求報酬。</p>"], "ck": [{"x": "§805Ⅱ：報酬不得超過財產上價值十分之一", "h": true}, {"x": "§805-1①：管理人或受僱人在交通設備內拾得 → 不得請求報酬", "h": true}, {"x": "§807Ⅰ：逾六個月無人認領 → 拾得人取得；Ⅱ 三個月未領 → 地方自治團體", "h": false}, {"x": "§812Ⅱ：附合有主物 → 主物所有人取得合成物", "h": true}, {"x": "乙依 §767Ⅰ前段請求甲返還名錶（甲為無權占有）", "h": true}, {"x": "§816：因附合受損害 → 依不當得利請求償還價額", "h": false}, {"x": "甲未於七日內通知交存 → §805-1② 無報酬", "h": false}], "mn": "認領給報酬 ≦1/10 → 站員或逾七日沒報酬 → 半年沒人領歸拾得人 → 焊上分不開歸主物 → 損失依不當得利還價額"}, {"id": "113-一", "no": "113年第一題", "t": "買賣瑕疵擔保（§354vs§360）＋精神慰撫金", "lv": "", "k": "off", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "乙出售A屋予甲，並保證A屋無任何瑕疵，甲買受後發現A屋漏水。甲得否向乙請求修繕費用30萬元及精神損害賠償2萬元？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>出賣人就買賣標的物之瑕疵，原則上負瑕疵擔保責任，買受人得請求解除契約或減少價金；惟物缺少出賣人所保證之品質，或出賣人故意不告知瑕疵者，買受人得逕行請求損害賠償。至精神慰撫金之請求，民法原則上以侵害人格法益為前提，財產上損害本身原則不得請求非財產上損害賠償。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第354條第1項</span>（物之瑕疵擔保責任）、<span class=\"art\">第359條</span>（解除契約或減少價金）、<span class=\"art\">第360條</span>（缺少保證品質之損害賠償）、<span class=\"art\">第227條</span>（不完全給付）、<span class=\"art\">第356條</span>（檢查通知義務）；<span class=\"art\">第227條之1</span>（債務不履行侵害人格權之準用）、<span class=\"art\">第195條第1項</span>（人格法益之非財產上損害）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）修繕費用30萬元</p><p>依<span class=\"art\">第354條第1項</span>，漏水屬減損房屋通常效用之瑕疵；依<span class=\"art\">第360條</span>，買賣之物缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償。本題中，乙保證A屋無任何瑕疵，是否屬保證品質有二說：否定說認概括表示僅重申法定責任；本文採肯定說，乙主動保證使甲信賴A屋不漏水，漏水正屬保證範圍，甲得依<span class=\"art\">第360條</span>請求30萬元，毋須先解除或減價。如漏水可歸責於乙，另得依<span class=\"art\">第227條</span>請求，擇一行使；甲並應於發見後即通知乙（<span class=\"art\">第356條</span>）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第359條</span>僅賦予解除或減價之權，<span class=\"art\">第360條</span>始得直接請求損害賠償。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）精神損害賠償2萬元</p><p>依<span class=\"art\">第227條之1</span>準用<span class=\"art\">第195條第1項</span>，須不法侵害身體、健康、名譽等人格法益而情節重大者，始得請求非財產上損害賠償。本題中，漏水係物之瑕疵所致之財產上損害，甲所受者為一般生活上之不便；縱認居住安寧屬人格利益，亦未達情節重大，故不得請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>財產損害與人格法益侵害性質不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙以A屋無任何瑕疵為保證，本文認屬保證品質，A屋漏水即缺少所保證之品質，甲得依<span class=\"art\">民法第360條</span>向乙請求修繕費用30萬元之損害賠償。惟漏水純屬財產上損害，未侵害甲之人格法益，甲不得依<span class=\"art\">第227條之1</span>準用<span class=\"art\">第195條</span>請求精神損害賠償2萬元。</p>"], "ck": [{"x": "§354Ⅰ 漏水屬減損通常效用之物之瑕疵", "h": false}, {"x": "§360：缺少所保證之品質，得請求不履行之損害賠償", "h": true}, {"x": "概括保證「無任何瑕疵」是否屬保證品質：二說並陳，本文採肯定說", "h": true}, {"x": "乙保證無瑕疵卻漏水，該當 §360，毋須先解約或減價", "h": true}, {"x": "甲得請求修繕費30萬元", "h": false}, {"x": "§195Ⅰ：須人格法益受侵害且情節重大", "h": false}, {"x": "漏水屬財產上損害，非人格法益侵害", "h": false}, {"x": "居住安寧雖屬人格利益，但本題未達情節重大", "h": false}, {"x": "甲不得請求精神損害賠償2萬元", "h": false}], "mn": "漏水是瑕疵 → 有保證走 §360 直接賠 → 慰撫金要人格 → 漏水只是財產"}, {"id": "113-二", "no": "113年第二題", "t": "委託銷售：居間報酬＋定金退還（兩爭點）", "lv": "", "k": "off", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲乙簽訂一般委託銷售契約書，甲委託乙出售其所有之A廠房土地，委託契約之報酬為委託銷售總價2%，同日乙即媒介甲與丙公司簽立不動產買賣意向書，丙交付100萬元支票為定金，由乙保管作為嗣後丙履約時價金之一部或違約時之賠償；三週後，甲與丙公司以總價7500萬元簽訂不動產買賣契約書，惟丙公司並未依約給付第一期款，亦未開設履約專戶，甲丙簽訂和解契約，乙未得甲同意逕將作為定金之100萬支票退還給丙公司。試問：甲乙之法律關係為何？乙得否向甲主張服務報酬？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>委託銷售往往兼具居間（促成訂約）與委任（保管款項）性質。居間報酬於契約因媒介而成立時發生，原則上不受後續履行影響；保管款項則應依委任規定盡注意義務。二者應分別檢驗。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間）、<span class=\"art\">第528條</span>（委任）、<span class=\"art\">第535條</span>（受有報酬者應盡善良管理人之注意）、<span class=\"art\">第541條</span>（交付所收取之物）、<span class=\"art\">第249條</span>（定金之效力）、<span class=\"art\">第544條</span>（受任人之損害賠償責任）；<span class=\"art\">第568條第1項</span>（報酬請求權發生時點）、<span class=\"art\">第571條</span>（違反義務不得請求報酬）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲乙之法律關係</p><p>依<span class=\"art\">第565條</span>，居間係一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約；依<span class=\"art\">第528條</span>、<span class=\"art\">第535條</span>，受任人受有報酬者，應以善良管理人之注意處理委任事務；依<span class=\"art\">第541條</span>，受任人所收取之物應交付委任人。本題中，甲委託乙出售A廠房土地，約定報酬為總價2%，屬居間；乙保管丙交付之100萬元定金支票，另構成委任，非經甲同意不得交還丙。該定金約定作為違約時之賠償，依<span class=\"art\">第249條</span>序文當事人另有訂定，丙違約時甲得不返還；乙未經甲同意逕行退還，除和解契約明文約定退還者外，即違反善良管理人注意義務，應依<span class=\"art\">第544條</span>對甲負賠償責任。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>二者義務性質不同。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得否請求服務報酬</p><p>依<span class=\"art\">第568條第1項</span>，居間人以契約因其媒介而成立者為限，得請求報酬；惟依<span class=\"art\">第571條</span>，居間人違反其對於委託人之義務，而為利於委託人之相對人之行為，不得請求報酬。本題中，甲丙7500萬元之買賣契約已因乙之媒介而成立，報酬請求權已發生，後續違約、和解不影響其成立；然乙未向甲確認即退還定金，使甲喪失不返還定金之機會，屬有利於相對人丙之行為，依<span class=\"art\">第571條</span>不得請求150萬元（7500萬元×2%）之報酬；和解已明定退還者不適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>居間人應忠於委託人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲乙間兼具居間及委任性質；乙擅自退還定金，甲得依<span class=\"art\">第544條</span>請求賠償。（二）甲丙契約雖因乙之媒介而成立，惟乙未經甲同意退還定金，係為利於相對人之行為，依<span class=\"art\">第571條</span>不得向甲請求150萬元服務報酬；但和解契約已明文約定退還定金者，不在此限。</p>"], "ck": [{"x": "委託銷售兼具居間（§565）與委任（§528）性質", "h": false}, {"x": "§535 乙受有報酬，須盡善良管理人之注意", "h": false}, {"x": "丙僅遲延非當然「不能履行」；依 §249 序文之約定，甲得不返還定金", "h": false}, {"x": "點出和解：約定退還則無違反；否則未經甲同意擅退，乙負賠償", "h": false}, {"x": "§568Ⅰ 契約因媒介成立時，報酬請求權發生", "h": false}, {"x": "甲丙7,500萬買賣已因乙媒介成立，丙違約、和解不影響契約成立之事實", "h": false}, {"x": "§571：違反義務而為利於相對人之行為，或違反誠信由相對人收受利益者，不得請求報酬", "h": false}, {"x": "乙擅退定金係利於相對人丙之行為，依 §571 不得請求150萬報酬；甲另得依 §544 請求賠償", "h": true}], "mn": "居間一條線：買賣因媒介成立 → 委任一條線：擅退定金要賠 → 擅退定金利於丙 → §571 報酬喪失"}, {"id": "112-二", "no": "112年第二題", "t": "居間報酬：成立時點，事後解除不影響", "lv": "", "k": "off", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "A仲介公司受買方甲之委託媒介甲購買乙所有之土地，雙方簽訂居間契約，約定「於甲乙間土地買賣契約成立後，甲應依約給付A公司新臺幣一千萬的服務費」。後來甲與乙在A公司之媒合下簽訂土地買賣契約，甲於是給付A公司一千萬元。然嗣後甲乙間對於土地分區使用有所爭執，因而甲乙合意解除該買賣契約。甲因此對A公司主張，請求A公司返還所支付之一千萬服務費，是否有理？請附具理由說明之。（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>居間人之報酬請求權，於契約因其報告或媒介而成立時即確定發生，不受該契約嗣後是否履行、是否經當事人合意解除之影響。蓋居間人之給付僅止於促成契約成立。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間之定義）；<span class=\"art\">第568條第1項</span>（契約因媒介而成立始得請求報酬）；<span class=\"art\">第567條第1項</span>、第2項（據實報告及調查義務）；<span class=\"art\">第571條</span>（違反忠實義務不得請求報酬）；<span class=\"art\">第227條</span>（不完全給付）；<span class=\"art\">第179條</span>（不當得利）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）A報酬請求權之發生</p><p>依<span class=\"art\">第565條</span>及<span class=\"art\">第568條第1項</span>，居間人以契約因其報告或媒介而成立者為限，得請求報酬。本題中，甲乙間土地買賣契約因A之媒介而成立，A之報酬請求權於成立時即確定發生，甲亦已依約給付一千萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>報酬之基準時點為契約成立。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）合意解除之影響</p><p>依<span class=\"art\">第568條第1項</span>，報酬請求權僅以契約成立為要件。本題中，甲乙因土地分區使用爭執而合意解除買賣契約，純屬甲乙間契約關係之範疇，與A已完成之媒介行為無涉，A之報酬請求權不因此溯及或嗣後消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>合意解除與契約自始未成立有本質區別。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）A是否違反調查義務</p><p>依<span class=\"art\">第567條第2項</span>，以居間為營業者，關於訂約事項有調查義務。本題中，土地分區攸關甲購地目的；若A未盡調查致甲誤認分區而締約，甲得依<span class=\"art\">第227條</span>請求賠償，A如為利於乙而違反義務，依<span class=\"art\">第571條</span>不得請求報酬；惟題示未載A違反義務之事實，報酬不受影響。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>報酬僅於居間人違反忠實義務時始被剝奪。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）返還請求有無理由</p><p>依<span class=\"art\">第179條</span>，無法律上原因受利益者始負返還義務。本題中，甲之給付係基於已確定發生之報酬請求權，具有法律上原因，不成立不當得利。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>事後解除不能溯及動搖已取得之報酬基礎。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>A之報酬請求權於甲乙買賣契約因其媒介而成立時即已確定發生，甲之給付具法律上原因；甲乙嗣後合意解除契約不影響A之報酬，題示亦未載A違反<span class=\"art\">第567條第2項</span>調查義務，故甲請求A返還一千萬元服務費，無理由（如A確未盡調查，甲得依<span class=\"art\">第227條</span>請求賠償；A為利於乙而違反義務者，依<span class=\"art\">第571條</span>不得請求報酬）。</p>"], "ck": [{"x": "§565：居間＝報告訂約機會或媒介，他方給付報酬", "h": false}, {"x": "§568Ⅰ：契約因居間而成立時，即得請求報酬", "h": false}, {"x": "買賣因A媒介成立，報酬請求權於成立時確定發生", "h": true}, {"x": "甲乙合意解除屬兩人契約關係，不影響A已發生之報酬", "h": true}, {"x": "§567Ⅱ：以居間為營業者對土地分區有調查義務；違反 → §227 賠償／§571 喪失報酬", "h": true}, {"x": "甲已依約給付，有法律上原因，不生不當得利", "h": false}, {"x": "甲請求返還一千萬服務費無理由", "h": false}], "mn": "居間定義 → 成立即確定 → 事後解除無關 → 有法律上原因 → 不用還"}, {"id": "104-一", "no": "104年第一題", "t": "居間報酬：成立時點＋服務費計算", "lv": "", "k": "off", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "A建地面積130坪，乙為A地所有權人，於民國101年7月26日委由甲不動產經紀人代為尋找買主，甲乙簽訂專任委託銷售契約約定：「委託底價：每坪20萬元（合計2,600萬元）；服務費：超過每坪20萬元以上，均算為『服務費』予甲；委託期限：自101年7月26日至101年10月25日止」。甲於101年8月26日找到丙願意以每坪21萬元購買，乙丙雙方碰面後，乙表示要先塗銷A地原有的抵押權登記，再與丙約期簽約。之後，一直到101年10月25日前止，乙均以抵押權登記尚未塗銷為理由，拒絕簽約。102年2月25日後乙丙雙方合意辦理A地所有權移轉登記完畢，而買賣價格即為每坪21萬元。甲發現後即起訴，請求乙給付130萬元服務費，請問有無理由？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>居間契約係一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約。本題採底價式服務費約定，成交價超過底價部分歸居間人。應先判斷報酬請求權是否成立，再依約計算金額；成立關鍵在契約是否因居間人之媒介而成立，而非委託期限是否存續。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間之定義）；<span class=\"art\">第568條第1項</span>（因媒介成立始得請求報酬）；<span class=\"art\">第101條第1項</span>（不正當阻止條件成就，類推）；<span class=\"art\">第148條第2項</span>（誠信原則）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）遲延簽約之可歸責事由</p><p>依<span class=\"art\">第565條</span>，居間人之義務在報告訂約機會或為訂約之媒介。本題中，甲於委託期限內之101年8月26日找到丙，促成乙丙就每坪21萬元達成共識，媒介已於期限內完成；遲至102年2月25日始移轉，原因在A地抵押權未塗銷，排除權利瑕疵係乙之義務，非可歸責於甲。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>乙自身遲延不應轉嫁於甲。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）報酬請求權之成立</p><p>依<span class=\"art\">第568條第1項</span>，居間人，以契約因其報告或媒介而成立者為限，得請求報酬。本題中，乙丙經甲媒合而磋商並達成價金合意，買賣契約仍因甲之媒介而成立，報酬請求權已發生，不因簽約逾委託期限而受影響。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>報酬取決於媒介與成約之因果關係。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙拖延之效果</p><p>依<span class=\"art\">第101條第1項</span>，以不正當行為阻其條件之成就者，視為條件已成就；依<span class=\"art\">第148條第2項</span>，行使權利，履行義務，應依誠實及信用方法。本題中，縱認報酬以期限內成交為前提，乙於期限內一再拒絕簽約，屆滿後始以同價成交，應類推<span class=\"art\">第101條第1項</span>視為條件已成就，其執期限拒付亦違反誠信。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不容乙以不正當行為獲利。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）服務費之計算</p><p>依約底價每坪20萬元，超過部分為服務費。本題中，成交價每坪21萬元，A地130坪，服務費為（21萬元－20萬元）×130坪＝130萬元。</p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，甲於期限內已完成媒介，遲延可歸責於乙，契約仍因甲之媒介而成立，依<span class=\"art\">第568條第1項</span>報酬請求權已成立，並應類推<span class=\"art\">第101條第1項</span>視為條件已成就；甲得請求服務費130萬元，其請求有理由。</p>"], "ck": [{"x": "角色：乙為委託人（地主）、甲為受託經紀人", "h": true}, {"x": "§565、§568Ⅰ：契約因媒介成立即得請求報酬", "h": false}, {"x": "甲於期限內 8/26 找到丙並達成價金合意，媒介已完成", "h": false}, {"x": "遲延因乙未塗銷抵押權，可歸責乙，非甲", "h": false}, {"x": "買賣契約仍係因甲之媒介而成立，委託期限屆滿不影響", "h": true}, {"x": "類推 §101Ⅰ 視為條件已成就；§148Ⅱ 誠信補充：乙不得以自己遲延規避報酬", "h": true}, {"x": "底價式服務費：（21萬－20萬）×130坪＝130萬元", "h": true}, {"x": "甲請求 130 萬元有理由", "h": false}], "mn": "看清乙委甲 → 期限內媒介完成 → 有因果就有酬 → 拖延怪乙 → 價差×坪數＝130萬"}, {"id": "112-一", "no": "112年第一題", "t": "靈骨塔永久使用權：債權效力vs強制執行", "lv": "", "k": "off", "tier": 2, "g": "居間・委任・買賣・租賃", "q": "甲向A公司購得靈骨塔某塔位之「永久使用權」。A公司大樓其後因遭強制執行而由B公司拍定取得。問：甲得否對B公司主張其永久使用權存在？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>依物權法定主義，法律未創設塔位永久使用權之物權，故其性質僅屬債權（使用權狀為債權憑證），不具對抗第三人效力。強制執行拍賣之拍定人原則取得完整所有權，除法律特別規定、拍賣公告載明承受或負擔本身具物權效力外，不受出賣人與第三人間單純債權契約拘束。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第757條</span>（物權法定）；<span class=\"art\">第348條</span>（出賣人之義務）；<span class=\"art\">第425條第1項</span>（買賣不破租賃）；最高法院49年台抗字第83號（拍賣為買賣之一種）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲之永久使用權性質</p><p>依<span class=\"art\">第757條</span>，物權除依法律或習慣外不得創設；依<span class=\"art\">第348條</span>，權利之出賣人負使買受人取得其權利之義務。本題中，甲購得之永久使用權不得以契約創設為物權，性質屬債權，僅拘束甲與A公司。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>債之相對性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）強制執行拍賣後之效力</p><p>依最高法院49年台抗字第83號，拍賣為買賣之一種，拍定人繼受取得。本題中，B公司拍定取得A公司大樓，除特別法規（例如殯葬管理條例）或拍賣公告明定應承受外，無義務繼受A公司與甲間之債權契約。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>B公司非契約當事人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲得否對B公司主張永久使用權</p><p>依<span class=\"art\">第425條第1項</span>，租賃物交付後、承租人占有中讓與所有權者，租約對受讓人繼續存在。本題中，甲原則不得對B公司主張使用權，僅得向A公司請求損害賠償；惟塔位使用權兼有租賃、寄託、僱傭之債權性質，甲如已特定塔位並經交付而占有使用，得類推適用本項，使用權對B公司繼續存在，未占有者則否（實務見解）。題示未載甲是否占有，應分別論述。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護已占有之實際使用人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲之永久使用權依<span class=\"art\">民法第757條</span>屬債權，僅具相對效力，原則上不能對抗拍定取得所有權之B公司，甲不得對B公司主張其存在，僅得向A公司求償；但甲如已特定塔位並實際占有使用，得類推適用<span class=\"art\">第425條第1項</span>，使用權對B公司繼續存在。特別法規或拍賣公告另定應承受者，依其規定。</p>"], "ck": [{"x": "§757 物權法定：法律未創設塔位永久使用權之物權 → 僅屬債權", "h": true}, {"x": "永久使用權性質屬債權契約，非物權", "h": true}, {"x": "§348 出賣人負使買受人取得其權利之義務", "h": false}, {"x": "債之相對性：只拘束甲與A公司", "h": false}, {"x": "拍賣＝買賣之一種，B公司繼受取得，不受單純債權契約拘束", "h": true}, {"x": "已特定並占有塔位者，可主張類推 §425Ⅰ；未占有者不得類推", "h": true}, {"x": "例外：特別法或拍賣公告明定承受者，依其規定", "h": false}, {"x": "原則不得對B公司主張，僅得向A公司求償；已占有塔位可類推 §425", "h": false}], "mn": "使用權是債權 → 只綁甲與A → 拍定人繼受取得也不跟 → 已占有塔位可類推§425 → 否則找A求償"}, {"id": "101-二", "no": "101年第二題", "t": "出典＋買賣＋押租金歸屬", "lv": "", "k": "off", "tier": 2, "g": "居間・委任・買賣・租賃", "q": "甲將A地出租於乙供其停放遊覽車三年，租賃存續中甲將A地出典於丙後又賣與丁並完成登記。何人得對乙收取租金？何人應返還乙押租金？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>典權人於典權存續期間對典物享有使用收益權能。出租人就租賃物設定物權，致妨礙承租人之使用收益者，租賃契約對該物權人繼續存在，故租賃物出典後，典權人承受出租人地位。另押租金係擔保承租人租賃債務之金錢，押租金契約為要物契約，依實務見解屬租賃契約以外之別一契約。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第426條</span>（出租人就租賃物設定物權，準用<span class=\"art\">第425條</span>）、<span class=\"art\">第425條</span>（買賣不破租賃）、<span class=\"art\">第911條</span>（典權之定義）、<span class=\"art\">第918條</span>（典物讓與不影響典權）；押租金之移轉：最高法院65年台上字第156號原判例。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）何人得對乙收取租金</p><p>依<span class=\"art\">第426條</span>準用<span class=\"art\">第425條</span>，出租人就租賃物設定物權致妨礙承租人使用收益者，租賃契約對物權人繼續存在；依<span class=\"art\">第911條</span>，典權人就典物有使用、收益之權。本題中，甲於乙占有中將A地出典於丙，妨礙乙之使用收益，丙承受出租人地位，由丙收租；租期三年未逾五年，不在<span class=\"art\">第425條第2項</span>排除之列。其後甲將A地賣與丁並登記，依<span class=\"art\">第918條</span>，出典人得將典物讓與他人，但典權不因此而受影響，丁取得受典權負擔之所有權，典權存續期間仍由丙收租，須待典權因回贖或期滿而消滅，丁始回復完整之出租人地位。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護承租人之使用收益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）何人應返還乙押租金</p><p>依最高法院65年台上字第156號原判例，押租金契約為要物契約，屬租賃契約以外之別一契約，其債權移轉須交付金錢始生效力；<span class=\"art\">第426條</span>準用<span class=\"art\">第425條</span>，同理適用。本題中，題目未載甲已將押租金交付丙或丁，故應由收受押租金之甲返還；若已交付，則由受交付者返還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>受讓人未受領押租金卻須負返還責任，過於嚴苛。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲將A地出典後，依<span class=\"art\">第426條</span>準用<span class=\"art\">第425條</span>，由典權人丙承受出租人地位，得向乙收取租金；丁其後買受A地，依<span class=\"art\">第918條</span>典權不受影響，典權存續期間仍由丙收租。押租金部分，押租金契約不隨租賃契約當然移轉，甲未將押租金交付丙或丁者，應由甲返還乙押租金。</p>"], "ck": [{"x": "§426準用§425：設定典權妨礙使用收益，租約對丙繼續存在", "h": true}, {"x": "租期 3 年未逾五年，未公證亦不受 §425Ⅱ 排除（以已訂字據為前提）", "h": false}, {"x": "丙承受出租人地位，向乙收租，甲已非出租人", "h": true}, {"x": "§918：典物讓與，典權不因此受影響", "h": false}, {"x": "丁之所有權附有典權負擔，典權存續期間仍由丙收租", "h": false}, {"x": "65 台上 156 原判例：押租金為要物之別一契約，交付金錢始移轉", "h": true}, {"x": "甲未交付押租金予丙丁 → 由甲返還乙", "h": false}], "mn": "出典換房東 → 賣給丁典權照舊 → 押租跟錢走"}, {"id": "預08", "no": "預測題 08", "t": "居間報酬：停止條件與違反義務", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲委託房屋仲介業乙出售 A 屋，約定：『成交時，甲給付成交價 2% 為報酬』。乙介紹丙為買方，甲丙簽訂買賣契約，成交價 2,000 萬元，惟該契約約定『丙取得貸款核准』為停止條件。於議價過程中，乙明知丙願意出價 2,300 萬元，卻向甲謊稱『丙最高只出得起 2,000 萬元』，並私下向丙收取 10 萬元謝禮。試問：（一）貸款尚未核准前，乙得否向甲請求報酬 40 萬元？（二）乙上述行為對其向甲請求報酬及費用有何影響？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>居間指當事人約定，一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約。居間人之報酬請求權以契約因其報告或媒介而成立為前提；契約附停止條件者，條件成就時法律行為始發生效力。居間人對委託人負據實報告義務，違反忠實義務者喪失報酬並負賠償責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間定義）、<span class=\"art\">第568條第1項</span>（契約成立始得請求報酬）、<span class=\"art\">第568條第2項</span>（停止條件成就前不得請求）；<span class=\"art\">第567條第1項前段</span>（據實報告）、<span class=\"art\">第571條</span>（喪失報酬及費用）、<span class=\"art\">第227條第1項</span>（不完全給付）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）不得請求報酬</p><p>依<span class=\"art\">第568條第1項</span>，居間人以契約因其報告或媒介而成立者為限，得請求報酬；同條第2項，契約附有停止條件者，於該條件成就前不得請求。本題甲丙買賣契約因乙之媒介而成立，惟附丙取得貸款核准之停止條件，尚未成就，乙目前不得請求40萬元，須待貸款核准後始得請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>條件成就前買賣契約尚未生效。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）喪失報酬及費用並負賠償</p><p>依<span class=\"art\">第567條第1項前段</span>，居間人應就其所知據實報告；依<span class=\"art\">第571條</span>，有下列情形之一者，不得向委託人請求報酬及償還費用：<span class=\"evli\">①違反對委託人之義務而為利於相對人之行為；</span><span class=\"evli\">②違反誠實及信用方法，由相對人收受利益。本題乙明知丙願出價2,300萬元卻謊報上限，壓低價格利於丙，該當①；私下收取丙10萬元謝禮，該當②。乙不得向甲請求報酬及費用，縱條件成就亦同。乙並屬可歸責之不完全給付，甲得依<span class=\"art\">第227條</span>請求賠償，惟損害額及因果關係須由甲舉證。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>居間人應忠於委託人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）貸款核准前停止條件未成就，乙不得向甲請求報酬40萬元。（二）乙謊報出價利於丙並收受謝禮，依<span class=\"art\">第571條</span>不得向甲請求報酬及償還費用，縱條件成就亦同；甲並得依<span class=\"art\">第227條</span>請求乙賠償損害。</p>"], "ck": [{"x": "§568Ⅱ：附停止條件，條件成就前不得請求報酬", "h": true}, {"x": "貸款未核准前，乙不得請求40萬元", "h": false}, {"x": "§567Ⅰ 居間人應據實報告於各當事人", "h": false}, {"x": "乙明知丙願出2,300萬卻謊稱2,000萬，違反據實報告義務", "h": false}, {"x": "§571 兩種情形擇一：①謊報利於丙；②違反誠信收丙10萬元", "h": true}, {"x": "乙不得請求報酬及費用，縱條件成就亦同", "h": false}, {"x": "甲另得依 §227 請求損害賠償", "h": true}], "mn": "媒介成立才有報酬 → 附條件要等成就 → 謊報＋收對方錢 → §571 全沒 → 甲還能求償"}, {"id": "預10", "no": "預測題 10", "t": "買賣瑕疵擔保：免責特約與故意不告知", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲出賣 A 屋予乙，契約約定『現況交屋，甲不負瑕疵擔保責任』。交屋後半年，乙發現屋頂嚴重漏水，經查甲於出賣時即已知悉漏水，但未告知乙。試問：（一）乙得對甲主張何種權利？（二）如甲出賣時並不知屋頂漏水，結論有何不同？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>物之瑕疵擔保指出賣人應擔保標的物於危險移轉時無滅失或減少價值、通常效用或契約預定效用之瑕疵，並具有所保證之品質。免責特約指當事人約定免除或限制出賣人之瑕疵擔保義務；出賣人故意不告知瑕疵者，其特約無效。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第354條</span>（物之瑕疵擔保）、<span class=\"art\">第366條</span>（免責特約無效）、<span class=\"art\">第356條</span>、<span class=\"art\">第357條</span>（故意不告知不適用檢查通知）、<span class=\"art\">第359條</span>（解除或減價）、<span class=\"art\">第360條</span>（不履行之損害賠償）、<span class=\"art\">第365條</span>（解除權、減價請求權之期間）；<span class=\"art\">第227條</span>（不完全給付）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）特約無效，乙得解除、減價或請求損害賠償</p><p>依<span class=\"art\">第366條</span>，以特約免除出賣人關於物之瑕疵擔保義務者，「如出賣人故意不告知其瑕疵，其特約為無效」。本題中，屋頂嚴重漏水屬減少通常效用之瑕疵（<span class=\"art\">第354條</span>），甲明知而未告知，現況交屋、不負擔保之特約無效，甲仍負擔保責任。依<span class=\"art\">第357條</span>，<span class=\"art\">第356條</span>之檢查通知規定不適用，乙不因未即時通知而視為承認。乙得依<span class=\"art\">第359條</span>解除契約或請求減少價金；或依<span class=\"art\">第360條</span>，因甲故意不告知瑕疵，不解除、不減價而請求不履行之損害賠償，二者擇一行使。又依<span class=\"art\">第365條第2項</span>，六個月期間不適用，僅受交付後五年之限制，乙半年內主張並未逾期。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免出賣人濫用特約。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲不知情，特約有效，乙不得主張</p><p>依<span class=\"art\">第366條</span>反面解釋，出賣人無故意不告知者，免責特約有效。本題中，甲出賣時不知漏水，乙不得依<span class=\"art\">第359條</span>、<span class=\"art\">第360條</span>向甲主張瑕疵擔保責任，亦無甲保證品質之事實；至<span class=\"art\">第227條</span>之不完全給付以可歸責於債務人為要件，甲如亦無過失，即不成立。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>尊重私法自治。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲故意不告知漏水，免責特約依<span class=\"art\">第366條</span>無效；乙得依<span class=\"art\">第359條</span>解除契約或請求減少價金，或依<span class=\"art\">第360條</span>不解除、不減價而請求不履行之損害賠償，二者擇一，且未逾<span class=\"art\">第365條</span>之期間。（二）甲出賣時不知漏水者，免責特約有效，乙不得向甲主張瑕疵擔保責任；甲如亦無過失，亦不負<span class=\"art\">第227條</span>之責任。</p>"], "ck": [{"x": "§354 漏水屬減少通常效用之瑕疵", "h": false}, {"x": "§366 故意不告知瑕疵，免責特約無效", "h": true}, {"x": "甲出賣時已知漏水未告知，特約無效仍負擔保", "h": false}, {"x": "§357：甲故意不告知，不適用 §356 檢查通知規定", "h": false}, {"x": "§359 解除或減價；§360 不解除不減價而請求賠償（二者擇一，不是並用）", "h": true}, {"x": "§365Ⅱ 故意不告知不適用六個月，仍有交付後五年", "h": true}, {"x": "甲不知情則特約有效，乙不得依 §359、§360 主張", "h": false}], "mn": "漏水是瑕疵 → 故意不說特約廢 → 不必通知 → 解除減價或賠償擇一 → 六個月不算、五年內"}, {"id": "預11", "no": "預測題 11", "t": "買賣不破租賃：公證與五年門檻", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲將 A 屋出租於乙，租期 3 年，未經公證，乙已受交付占有 A 屋。嗣甲將 A 屋出賣並移轉所有權登記予丙。試問：（一）乙得否以其租賃關係對抗丙？（二）如租期為 6 年且未經公證，結論有何不同？乙對甲得主張何種權利？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>買賣不破租賃指出租人於租賃物交付後，將所有權讓與第三人者，租賃契約對受讓人仍繼續存在。公證指以公證書訂立租賃契約，使租約具較強之證據力。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第425條第1項</span>、第2項（買賣不破租賃及其排除）、<span class=\"art\">第422條</span>（逾一年未以字據視為不定期）、<span class=\"art\">第767條第1項前段</span>（返還請求）、<span class=\"art\">第423條</span>（保持租賃物義務）、<span class=\"art\">第226條第1項</span>（給付不能賠償）、<span class=\"art\">第436條</span>準用<span class=\"art\">第435條</span>（減租、終止）、<span class=\"art\">第347條</span>準用<span class=\"art\">第349條</span>、<span class=\"art\">第353條</span>（權利瑕疵擔保）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得以租賃關係對抗丙</p><p>依<span class=\"art\">第425條第1項</span>，出租人於租賃物交付後，承租人占有中，縱將其所有權讓與第三人，其租賃契約，對於受讓人仍繼續存在。本題中，A屋已交付乙占有，租約未公證，但期限3年未逾五年且為定期，不在同條第2項排除範圍，丙承受出租人地位。惟依<span class=\"art\">第422條</span>，未以字據訂立者視為不定期限之租賃，即不受保護；本文以已訂立字據為前提。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>短期定期租約毋須公證亦受保護。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙得請求返還，乙得向甲求償</p><p>依<span class=\"art\">第425條第2項</span>，未經公證之不動產租賃契約，其期限逾五年者，不適用買賣不破租賃。本題中，租期6年未公證，租約對丙不生效力，乙屬無權占有，丙得依<span class=\"art\">第767條第1項前段</span>請求返還A屋。乙對甲部分，甲讓與所有權致無法履行<span class=\"art\">第423條</span>之義務，可歸責於甲，乙得依<span class=\"art\">第226條第1項</span>請求損害賠償；並得依<span class=\"art\">第436條</span>準用<span class=\"art\">第435條</span>請求減少租金，或不能達租賃目的時終止契約；亦得依<span class=\"art\">第347條</span>準用<span class=\"art\">第349條</span>、<span class=\"art\">第353條</span>主張權利瑕疵擔保。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>長期未公證租約之風險應由出租人承擔。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）租期3年未公證（以已訂立字據為前提），依<span class=\"art\">第425條第1項</span>乙得以租約對抗丙。（二）租期6年未公證，依<span class=\"art\">第425條第2項</span>不適用買賣不破租賃，丙得請求乙返還A屋；乙得向甲依<span class=\"art\">第226條第1項</span>請求損害賠償，並得依<span class=\"art\">第436條</span>準用<span class=\"art\">第435條</span>請求減少租金或終止契約。</p>"], "ck": [{"x": "§425Ⅰ：租賃物交付、承租人占有中，租約對受讓人繼續存在", "h": false}, {"x": "§425Ⅱ：未公證「且」逾五年或未定期限，才排除（不是未公證一律不適用）", "h": true}, {"x": "租期3年未逾五年，雖未公證仍對丙繼續存在", "h": false}, {"x": "§422 不動產租約逾一年未以字據訂立 → 視為不定期，會被 §425Ⅱ 排除（本題以已訂字據為前提）", "h": true}, {"x": "乙得以租賃關係對抗丙", "h": false}, {"x": "租期6年且未公證，租約對丙不生效力，乙為無權占有，丙依 §767Ⅰ 請求返還", "h": false}, {"x": "乙對甲依 §226Ⅰ 請求損害賠償（§423 為出租人義務，非獨立請求權基礎）", "h": true}, {"x": "§436 準用 §435：第三人主張權利致不能使用收益 → 減少租金或終止契約", "h": true}, {"x": "本題是 §425，不要和 §425-1（房地同屬一人推定租賃）混淆", "h": true}], "mn": "交付占有不怕賣 → 未公證＋逾五年才會破 → 3年對抗、6年被請求返還 → 回頭找房東賠"}, {"id": "預13", "no": "預測題 13", "t": "居間報酬：未約定報酬額與雙方負擔", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲委託房屋仲介業乙出售 A 屋，雙方僅口頭約定「成交後再談服務費」，未約定報酬額。乙促成丙以 1,500 萬元買受 A 屋並簽約；乙另同時受丙委託尋找房屋，甲丙均未約定報酬如何負擔。甲主張「未約定報酬，乙不得請求」。試問：（一）乙得否向甲請求報酬？（二）乙公司價目表載明「成交價 2%（買賣雙方合計）」，報酬額為何？（三）甲丙之間若無約定亦無習慣，該報酬應如何負擔？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>居間，指當事人約定，一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約。居間報酬之問題有三層：有無報酬請求權、報酬額多少、由誰負擔，應分層處理；順序為約定、價目表、習慣。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間之定義）、<span class=\"art\">第566條第1項</span>（視為允與報酬）、<span class=\"art\">第566條第2項</span>（未定報酬額按價目表，無者按習慣）、<span class=\"art\">第568條第1項</span>（契約因媒介成立始得請求報酬）、<span class=\"art\">第570條</span>（媒介報酬由雙方平均負擔）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得向甲請求報酬</p><p>依<span class=\"art\">第566條第1項</span>，如依情形，非受報酬即不為報告或媒介者，視為允與報酬；依<span class=\"art\">第568條第1項</span>，以契約因其報告或媒介而成立者為限，得請求報酬。本題中，乙以營業為居間，依情形非受報酬即不為媒介，視為允與報酬；甲丙買賣契約因乙之媒介而成立，乙得請求報酬，甲「未約定即不須給付」之主張不可採。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>沒約定不等於沒報酬。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）報酬額依價目表為30萬元</p><p>依<span class=\"art\">第566條第2項</span>，報酬額未經約定者，按價目表所定給付之；無價目表者，按習慣給付。本題中，乙公司價目表載明成交價2%（買賣雙方合計），報酬總額為1,500萬元×2%＝30萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>價目表優先於習慣。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲丙平均負擔，各15萬元</p><p>依<span class=\"art\">第570條</span>，居間人因媒介應得之報酬，除契約另有訂定或另有習慣外，由契約當事人雙方平均負擔。本題中，乙同時受甲丙委託並促成簽約，屬媒介居間，甲丙既無約定亦無習慣，應各負擔15萬元，乙得向甲請求15萬元，另15萬元向丙請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>落實雙方公平分擔。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙得依<span class=\"art\">第566條第1項</span>、<span class=\"art\">第568條第1項</span>向甲請求報酬，甲之主張不可採。（二）報酬額依<span class=\"art\">第566條第2項</span>按價目表計算為30萬元。（三）依<span class=\"art\">第570條</span>由甲丙平均負擔，各15萬元，乙得向甲請求其負擔之15萬元。</p>"], "ck": [{"x": "§566 非受報酬不為媒介，視為允與報酬", "h": true}, {"x": "§568Ⅰ 契約因其媒介而成立，乙得請求報酬", "h": false}, {"x": "乙得請求報酬，甲「未約定」之主張不可採", "h": false}, {"x": "依序價目表→習慣：1,500萬×2%＝30萬元", "h": true}, {"x": "§570 契約另有訂定或習慣優先；無者雙方平均負擔", "h": true}, {"x": "甲、丙各負擔 15 萬元，乙得向甲請求 15 萬元", "h": false}], "mn": "營業仲介視為有酬 → 契約成立可請求 → 價目表先、習慣後 → 沒約就平分"}, {"id": "預14", "no": "預測題 14", "t": "居間人義務：顯無履行能力、第571條要件與費用", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "房屋仲介乙（以居間為營業）受甲委託出售 A 屋，約定成交時給付成交價 2% 為報酬。乙明知買方丙已遭多件強制執行、顯無履行能力，仍媒介甲丙簽約（價金 1,200 萬元，報酬 24 萬元）。丙簽約後無力付款，甲因此受有損害 100 萬元。乙另自行支出廣告費 5 萬元，未經約定。試問：（一）乙得否請求報酬 24 萬元？（二）乙得否請求償還廣告費 5 萬元？（三）甲得否向乙請求損害賠償？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>居間人對委託人負據實報告義務，對顯無履行能力之人不得為其媒介；以居間為營業者並負調查履行能力之義務。違反義務時，須分報酬、費用、損害賠償三條線分別判斷，不得因有過錯即逕認喪失報酬。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第567條第1項後段</span>、第2項（不得媒介、調查義務）；<span class=\"art\">第568條第1項</span>（報酬）、<span class=\"art\">第571條</span>（喪失報酬）；<span class=\"art\">第569條第1項</span>（費用）；<span class=\"art\">第227條第1項</span>（不完全給付）、<span class=\"art\">第334條第1項</span>、<span class=\"art\">第335條第1項</span>（抵銷）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）仍得請求24萬元</p><p>依<span class=\"art\">第568條第1項</span>，契約因媒介而成立者得請求報酬；依<span class=\"art\">第571條</span>，須①違反義務而為利於相對人之行為，或②違反誠信方法由相對人收受利益，始喪失報酬。本題乙明知丙顯無履行能力仍媒介，違反<span class=\"art\">第567條第1項後段</span>及第2項；惟未向丙收受利益，不該當②。是否屬①有爭議：肯定說認乙偏袒相對人；否定說認①指為相對人爭取不當利益而犧牲委託人（如壓低價格），丙未因此獲實質利益。本文採否定說。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>乙之過失應以損害賠償處理，而非剝奪報酬。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）不得請求廣告費</p><p>依<span class=\"art\">第569條第1項</span>，居間人支出之費用，非經約定，不得請求償還。本題廣告費5萬元係乙自行支出，未經約定。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>費用負擔以約定為準。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）得請求賠償並抵銷</p><p>乙違反居間人義務，屬可歸責之債務不履行，依<span class=\"art\">第227條</span>甲得請求賠償損害100萬元（須有因果關係）。依<span class=\"art\">第334條第1項</span>，互負種類相同且均屆清償期之債務得抵銷，並依<span class=\"art\">第335條第1項</span>以意思表示為之。本題均為金錢債務且均屆清償期，甲得與報酬24萬元抵銷，差額76萬元仍得請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以抵銷簡化結算。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）本文採否定說，<span class=\"art\">第571條</span>不適用，乙仍得請求報酬24萬元（若採肯定說則不得請求）。（二）廣告費未經約定，乙不得請求償還5萬元。（三）甲得依<span class=\"art\">第227條</span>請求賠償100萬元，並與報酬24萬元抵銷，淨額76萬元。</p>"], "ck": [{"x": "§567 不得媒介顯無履行能力之人；營業居間有調查義務", "h": false}, {"x": "§571 兩種情形擇一：①利於丙之行為有爭議；②乙未收受丙利益 → 不該當", "h": true}, {"x": "採 §571 不適用之見解，乙仍得依 §568Ⅰ 請求報酬24萬", "h": false}, {"x": "§569Ⅰ 費用非經約定不得請求償還", "h": true}, {"x": "廣告費5萬不得請求", "h": false}, {"x": "§227 甲得請求乙賠償100萬", "h": true}, {"x": "依 §334・§335 抵銷報酬後，淨額76萬", "h": false}], "mn": "三線分開：酬、費、賠 → 571兩情形擇一 → 費用要約定 → 賠償可抵銷"}, {"id": "預16", "no": "預測題 16", "t": "房屋買賣違約金與定金：性質、酌減與並存", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲以 2,000 萬元將 A 屋出賣予乙，約定價款分四期：簽約時乙交付定金 100 萬元（約定「履約時充作價款，乙違約時甲得沒收」），簽約款 400 萬元，用印款 500 萬元，交屋款 1,000 萬元。契約並約定：「買方逾期給付任一期價款者，應給付賣方違約金 400 萬元（即總價 20%）。」乙已依約付清前三期共 1,000 萬元，惟交屋款 1,000 萬元逾期 30 日仍未給付。甲請求乙給付交屋款 1,000 萬元，並另請求違約金 400 萬元；乙抗辯：違約金過高，且其已履行一半價款，請求酌減。經查，甲因遲延所受損害，以週年利率 5% 概算，約 4.1 萬元。試問：（一）上開違約金之性質為何？甲得否於請求履行外，另請求違約金？（二）乙得否請求酌減？酌減之標準與舉證責任為何？乙主張「已履行一半價款」，是否適用第 251 條？（三）乙已給付之定金 100 萬元，與違約金之關係為何？甲得否主張沒收定金，並同時請求違約金？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>違約金指當事人約定債務人於債務不履行時應支付之金額，分為損害賠償總額預定性違約金與懲罰性違約金。定金指為擔保契約之履行，由一方交付他方之金錢或其他代替物。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第250條第1項</span>（違約金之約定）、第2項前段（賠償總額預定）、後段（遲延違約金得併請履行）；<span class=\"art\">第252條</span>（過高酌減）、<span class=\"art\">第251條</span>（一部履行之減少）；<span class=\"art\">第249條第1款</span>（履行時作為給付之一部）、第2款（可歸責於付定金人致不能履行不得請求返還）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）屬賠償總額預定性之遲延違約金，得併請履行</p><p>依<span class=\"art\">第250條第2項</span>，約定不於適當時期履行即須支付違約金者，債權人除得請求履行債務外，違約金視為遲延所生損害之賠償總額。本題中，約款未約明另得請求損害賠償，屬同項後段之遲延違約金，甲得請求交屋款1,000萬元並另請求違約金，無須證明實際損害。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>違約金已預定遲延損害之總額。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得依<span class=\"art\">第252條</span>請求酌減，<span class=\"art\">第251條</span>不適用</p><p>依<span class=\"art\">第252條</span>，約定之違約金額過高者，法院得減至相當之數額；債務人應就過高之事實負舉證責任（實務見解）。本題中，甲之損害約4.1萬元，違約金400萬元為其近百倍，乙已付半數價款、遲延僅30日，足認過高。<span class=\"art\">第251條</span>以債務一部履行為前提，本文採各期獨立債務說，違約金係擔保逾期之該一期價款，不適用<span class=\"art\">第251條</span>；已付價款得於<span class=\"art\">第252條</span>一併斟酌。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免顯失公平。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲不得沒收定金，亦不得並請違約金</p><p>依<span class=\"art\">第249條第2款</span>，須契約因可歸責於付定金人之事由「致不能履行」始不得請求返還。本題中，「乙違約時甲得沒收」解釋上指契約解除或終局不履行，單純遲延而契約仍得履行者不及之；依<span class=\"art\">第249條第1款</span>，定金作為給付之一部，已計入乙所付之1,000萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免雙重填補。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）本件為損害賠償總額預定性之遲延違約金，甲得請求交屋款1,000萬元並另請求違約金。（二）乙得依<span class=\"art\">第252條</span>請求酌減，乙就過高負舉證責任；本文採各期獨立債務說，不適用<span class=\"art\">第251條</span>。（三）定金依<span class=\"art\">第249條第1款</span>作為價款一部，甲不得沒收定金，亦不得一面沒收一面請求違約金。</p>"], "ck": [{"x": "§250Ⅱ：無另訂視為賠償總額；遲延約定得請求履行＋違約金", "h": true}, {"x": "屬總額預定之遲延違約金，甲得請求履行並另請求違約金", "h": false}, {"x": "§252 過高酌減；標準：客觀事實、經濟狀況、所受損害、如期履行可得利益", "h": true}, {"x": "損害約 4.1 萬 vs 違約金 400 萬；債務人乙負過高之舉證責任", "h": true}, {"x": "§251 本文認不適用：前三期非本件遲延債務之一部履行（單一債務說則可適用）；已付價款均供 §252 斟酌", "h": true}, {"x": "§249 各款僅於無另有訂定時適用；「乙違約時得沒收」解釋上指解除或終局不履行，不及於單純遲延", "h": true}, {"x": "§249②：沒收須可歸責於付定金人致不能履行", "h": true}, {"x": "契約仍可履行，定金作價款，甲不得沒收亦不得雙重填補", "h": false}], "mn": "先分性質 → 遲延可求履行＋違約金 → 過高 §252 乙舉證、§251 看擔保債務 → 定金沒收要不能履行"}, {"id": "預17", "no": "預測題 17", "t": "買賣標的物危險負擔：以交付而非登記為準", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲以 1,200 萬元將其所有之 A 屋出賣予乙，約定乙於簽約時付 200 萬元，於辦畢所有權移轉登記時再付 600 萬元，餘款 400 萬元於交屋時付清。甲已辦畢移轉登記，乙亦已付 800 萬元，惟尚未交屋。交屋前，A 屋因強震倒塌全毀，甲乙均無過失。另甲就 B 屋與丁訂立買賣契約，總價 1,000 萬元，丁已受甲交屋並入住，已付 400 萬元，餘款 600 萬元約定於辦理移轉登記時付清，尚未登記。丁入住兩週後，鄰戶戊煮食疏忽起火，延燒致 B 屋全毀；甲就 B 屋另投保火災保險。試問：（一）A 屋部分，乙是否仍須給付尾款 400 萬元？已付之 800 萬元得否請求返還？（二）B 屋部分，丁是否仍須給付餘款 600 萬元？丁對甲或戊得主張何種權利？（三）若 A 屋非因地震，而係乙經甲同意提前進場裝潢，因乙自己疏未關閉瓦斯而起火全毀，則結論有何不同？（設甲因免交屋而節省其依約應負擔之點交整理費用 2 萬元）（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>危險負擔指雙務契約因不可歸責於雙方之事由致一方給付不能時，其不利益由何人承擔。買賣標的物之危險自交付時起由買受人承擔，看交付而不看登記。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第373條</span>（危險自交付移轉）、<span class=\"art\">第266條</span>（不可歸責於雙方）、<span class=\"art\">第225條第1項</span>、第2項（免給付義務；代償請求）、<span class=\"art\">第267條</span>（可歸責於他方）、<span class=\"art\">第179條</span>（不當得利）、<span class=\"art\">第184條第1項前段</span>（侵權行為）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙免付尾款，得請求返還800萬元</p><p>依<span class=\"art\">第373條</span>，危險自交付時起由買受人承受；依<span class=\"art\">第266條</span>，不可歸責於雙方致給付全部不能者，他方免為對待給付。本題中，A屋已登記未交付，危險仍在甲；地震屬不可歸責於雙方，甲依<span class=\"art\">第225條第1項</span>免給付義務，乙免付400萬元，已付800萬元得依<span class=\"art\">第266條第2項</span>、<span class=\"art\">第179條</span>請求返還。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>危險移轉以交付為準。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丁仍須付600萬元，得請求讓與對戊之請求權</p><p>依<span class=\"art\">第373條</span>，B屋已交付，危險由丁承擔；依<span class=\"art\">第225條第2項</span>，債權人得向債務人請求讓與其對第三人之損害賠償請求權。本題中，丁不得援引<span class=\"art\">第266條</span>，仍須付600萬元；甲為所有權人，對戊有<span class=\"art\">第184條第1項前段</span>之請求權，丁得請求甲讓與。丁非所有人，屬純粹經濟上損失，不得逕向戊請求；保險金有爭議。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免加害人因危險移轉而免責。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）未交付者付398萬元，已交付者付足400萬元</p><p>依<span class=\"art\">第267條</span>，因可歸責於他方致不能給付者，得請求對待給付，但應扣除所得利益。本題中，A屋因乙疏失全毀，無<span class=\"art\">第266條</span>之適用；點交未完成，宜認未交付，甲得請求400萬元扣除節省之2萬元，即398萬元。若認已交付，依<span class=\"art\">第373條</span>危險已由乙負擔，乙應付足400萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>可歸責於債權人者不得免為對待給付。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙不須付尾款400萬元，並得請求返還已付800萬元。（二）丁仍須付600萬元，已付400萬元不得請求返還；得依<span class=\"art\">第225條第2項</span>請求甲讓與對戊之請求權，不得逕向戊請求（自有動產除外）。（三）未交付時依<span class=\"art\">第267條</span>，乙應付398萬元；縱認已交付，應付足400萬元；已付800萬元均不得請求返還。</p>"], "ck": [{"x": "§373 危險自交付時移轉，不是自登記時", "h": true}, {"x": "A屋未交付危險在甲；地震不可歸責雙方，§266Ⅰ 乙免付400萬", "h": false}, {"x": "依 §266Ⅱ、§179 乙得請求返還800萬", "h": true}, {"x": "B屋已交付未登記，危險在丁，仍須付600萬", "h": true}, {"x": "§225Ⅱ 代償請求權：請求讓與對戊之 §184Ⅰ前段請求權", "h": true}, {"x": "保險金有爭議，丁不當然得請求", "h": false}, {"x": "丁非所有人，B屋損失屬純粹經濟上損失，不得逕向戊依 §184 請求", "h": false}, {"x": "乙經同意進場裝潢：點交未完成難認已交付（§373）；若已交付，危險在乙，付足400萬", "h": true}, {"x": "§267 可歸責債權人仍得請求對待給付，但扣除所得利益", "h": true}, {"x": "未交付：§267 付398萬；已交付：§373 付足400萬；800萬均不得請求返還", "h": false}], "mn": "危險看交付不看登記 → 天災 §266 免付＋退錢 → 已交付仍付、拿 §225Ⅱ 代償 → 債權人有過：未交付 §267 扣利益、已交付付足"}, {"id": "預18", "no": "預測題 18", "t": "一物二賣：債權均有效、先登記者取得所有權", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲所有 A 屋，登記為甲名義。甲先於 5 月 1 日與乙簽訂買賣契約，約定價金 1,800 萬元，乙已給付頭期款 360 萬元，尾款於 7 月 1 日移轉登記時付清。嗣 A 屋市價上漲，甲於 6 月 1 日又與丙簽訂買賣契約，價金 2,000 萬元；丙訂約時已知甲先前已將 A 屋賣予乙，仍與甲辦理移轉登記，並於 6 月 20 日完成所有權移轉登記。試問：（一）甲乙、甲丙二買賣契約效力如何？（二）A 屋所有權由何人取得？（三）乙得對甲、丙主張何種權利？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>一物二賣，指出賣人就同一標的物，先後與不同買受人訂立買賣契約。應區分債權行為與物權變動：買賣契約僅拘束當事人；不動產所有權之移轉須經登記始生效力。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第348條第1項</span>（出賣人移轉所有權義務）、<span class=\"art\">第758條第1項</span>（不動產登記生效）；<span class=\"art\">第226條第1項</span>（給付不能損害賠償）、<span class=\"art\">第256條</span>（解除契約）、<span class=\"art\">第259條第1款</span>、第2款（回復原狀及利息）、<span class=\"art\">第260條</span>（解除不妨礙損害賠償）；<span class=\"art\">第184條第1項後段</span>、第2項（侵權行為）、<span class=\"art\">第244條第3項</span>（特定物債權不得撤銷）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）二契約均有效</p><p>買賣契約為債權契約，不以出賣人仍保有處分權為生效要件。本題中，甲乙、甲丙契約皆無無效或得撤銷之事由，均有效；丙雖明知甲已賣乙，僅涉及侵權責任問題，不影響契約效力。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>債之關係具相對性。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙取得A屋所有權</p><p>依<span class=\"art\">第758條第1項</span>，不動產物權依法律行為而取得者，非經登記不生效力。本題中，乙雖先訂約並付頭期款，僅取得債權；丙已於6月20日完成移轉登記，取得所有權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以登記先後而非訂約先後為準。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙得對甲主張債務不履行，對丙原則無請求權</p><p>依<span class=\"art\">第348條第1項</span>，甲負使乙取得所有權之義務。本題中，甲移轉登記予丙，致給付不能且可歸責於甲，乙得依<span class=\"art\">第226條第1項</span>請求損害賠償，或依<span class=\"art\">第256條</span>解除契約，依<span class=\"art\">第259條第1款</span>、第2款請求返還頭期款360萬元並加計自受領時起之利息，依<span class=\"art\">第260條</span>仍得請求賠償；另得類推適用<span class=\"art\">第225條第2項</span>請求甲交付自丙所得價金（本文採肯定說）。對丙，依<span class=\"art\">第244條第3項</span>不得撤銷甲丙間之移轉；單純明知屬自由競爭，不構成<span class=\"art\">第184條第1項後段</span>，<span class=\"art\">第184條第2項</span>亦難成立。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持交易自由。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲乙、甲丙二買賣契約均有效。（二）丙已登記，依<span class=\"art\">第758條第1項</span>取得A屋所有權，乙未取得。（三）乙得依<span class=\"art\">第226條第1項</span>請求甲賠償，或依<span class=\"art\">第256條</span>解約並依<span class=\"art\">第259條</span>請求返還頭期款及利息、依<span class=\"art\">第260條</span>請求賠償；對丙原則無請求權，僅能證明丙故意背俗加損害時，始得依<span class=\"art\">第184條第1項後段</span>請求。</p>"], "ck": [{"x": "甲乙、甲丙二契約均有效，丙明知不影響契約效力", "h": true}, {"x": "§758Ⅰ 不動產物權依法律行為變動，非經登記不生效力", "h": false}, {"x": "丙先完成登記取得所有權，乙僅有債權", "h": true}, {"x": "§348Ⅰ、§226Ⅰ 甲可歸責給付不能，乙得請求賠償", "h": false}, {"x": "§256・§259・§260 解除、返還360萬加利息、仍得請求賠償", "h": true}, {"x": "類推 §225Ⅱ：乙得請求甲交付另賣丙所得價金（有爭議，本文肯定）", "h": false}, {"x": "對丙：§184Ⅰ後段須背於善良風俗，單純明知不足；§184Ⅱ難成立", "h": true}, {"x": "§244Ⅲ：僅有害於特定物債權者不得撤銷 → 乙不得撤銷甲丙間之移轉", "h": true}, {"x": "乙向甲求償或解除，對丙原則上無請求權", "h": false}], "mn": "契約都有效 → 登記定歸屬 → 輸的找賣方（賠償或解除）→ 對買方要背俗"}, {"id": "預19", "no": "預測題 19", "t": "房屋租賃：漏水修繕、有益費用與押租金", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲將其所有 A 屋出租予乙供居住，租期一年，月租 2 萬元，乙交付押租金 4 萬元，租約未特別約定修繕由誰負擔。入住第 4 個月，A 屋屋頂滲漏，非乙之過失所致。乙以書面定 10 日期限催告甲修繕，甲置之不理，乙遂自行僱工修復，支出 3 萬元。其後乙另自費 10 萬元翻新浴室，甲到場看過，說「你高興就好」，未表示反對；租期屆滿，乙遷出並返還 A 屋，鑑定浴室現存增價額為 6 萬元。乙最後兩個月租金 4 萬元未付。乙請求甲返還押租金並償還上述費用，甲抗辯：「押租金已抵欠租，裝修我沒同意，不用還。」試問：（一）乙自行修繕漏水之 3 萬元，得否向甲請求？（二）乙翻新浴室之 10 萬元，得請求償還若干？（三）押租金與欠租應如何處理？乙最後得請求甲給付若干？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>租賃指一方以物租與他方使用收益，他方支付租金之契約。出租人負有保持租賃物合於約定使用收益狀態之義務，修繕原則上由出租人負擔。承租人支出之費用分必要費用與有益費用，要件不同。押租金為擔保承租人租賃債務而交付之金錢。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第423條</span>（保持合於使用狀態）、<span class=\"art\">第429條第1項</span>（出租人修繕）、<span class=\"art\">第430條</span>（催告修繕、自行修繕請求償還或扣租）；<span class=\"art\">第431條第1項</span>（有益費用）；押租金民法無明文，住宅租賃另有租賃住宅市場發展及管理條例<span class=\"art\">第7條</span>（押金上限、返還或抵充）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得請求3萬元</p><p>依<span class=\"art\">第429條第1項</span>，修繕除另有約定或習慣外由出租人負擔；依<span class=\"art\">第430條</span>，出租人於催告期限內不為修繕者，承租人得自行修繕而請求償還費用或於租金中扣除。本題漏水非乙之過失，租約未另訂，應由甲修繕；乙定10日期限催告，甲置之不理，乙自行修繕支出3萬元，得請求償還或扣租。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>必要費用不以增加價值或出租人同意為要件。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得請求6萬元</p><p>依<span class=\"art\">第431條第1項</span>，承租人支出有益費用增加價值，出租人知其情事而不為反對之表示者，於租賃關係終止時應償還，但以現存之增價額為限。本題甲到場看過且未表示反對，租期屆滿乙已返還A屋；甲辯稱未同意不可採，惟現存增價額僅6萬元，其餘4萬元不得請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>法條要件係知而不反對，不須明示同意。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）押租金抵充欠租，乙得請求9萬元</p><p>依實務見解，押租金於租賃關係終止、返還租賃物時應返還，但得扣除欠租及損害。本題押租金4萬元未逾二個月租金，甲抵充欠租4萬元有理由，乙無餘額；惟修繕費3萬元及有益費用6萬元係獨立之費用償還請求權，甲不得拒絕，合計9萬元。驗算：若以3萬元扣租，欠租剩1萬元，押租金餘3萬元返還，加6萬元亦為9萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>押租金與費用償還各自成立。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙得依<span class=\"art\">第430條</span>請求甲償還修繕費3萬元或於租金中扣除。（二）乙得依<span class=\"art\">第431條第1項</span>請求6萬元，其餘4萬元不得請求。（三）押租金4萬元抵充欠租後無餘額，乙最後得請求甲給付9萬元。</p>"], "ck": [{"x": "§423、§429Ⅰ：出租人負維持使用狀態與修繕義務", "h": false}, {"x": "§430：須定相當期限催告、逾期不修，才可自行修繕請求償還或扣租", "h": true}, {"x": "乙書面催告10日甲不理，得請求3萬元修繕費", "h": false}, {"x": "§431Ⅰ：知其情事而不反對（非須同意）＋以現存增價額為限", "h": true}, {"x": "投入10萬、現存增價額6萬，只得請求6萬", "h": false}, {"x": "押租金為擔保，返還時先扣欠租；4萬抵欠租4萬，無餘額", "h": true}, {"x": "乙最後得請求9萬元（3萬＋6萬）", "h": true}], "mn": "漏水甲修 → 催告不理自修拿3萬 → 增益知而不反對看現存拿6萬 → 押租先抵欠租 → 費用另算共9萬"}, {"id": "預30", "no": "預測題 30", "t": "終止委任：仲介公司中途被解任之報酬與賠償", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "屋主甲委任乙仲介公司出售 A 屋，約定委任期間六個月，報酬為成交價之 3%。乙受任後登廣告、帶看十餘次，支出廣告費 3 萬元，並已找到買方丙，丙願以 3,000 萬元購買，雙方已於議價後簽署買賣意向書。此時甲突然表示「不賣了」，並通知終止與乙之委任契約，數日後改以同價自行出售予丙。乙請求甲給付報酬 90 萬元及廣告費、賠償其損失。試問：（一）甲得否隨時終止委任？（二）乙得否請求報酬？範圍如何？（三）乙得否請求甲賠償損害？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>委任指當事人約定，一方委託他方處理事務，他方允為處理之契約；居間指一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約。本題報酬以成交為條件，性質上屬居間，終止事項類推適用委任之規定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第565條</span>（居間）、<span class=\"art\">第568條第1項</span>（契約因媒介成立始得請求報酬）、<span class=\"art\">第549條第1項</span>（隨時終止）、第2項（不利時期終止之賠償）、<span class=\"art\">第101條第1項</span>（阻條件成就視為成就）、<span class=\"art\">第548條第2項</span>（已處理部分之報酬）、<span class=\"art\">第569條第1項</span>（居間費用）、<span class=\"art\">第546條第1項</span>（必要費用）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲得隨時終止，但於不利時期應賠償</p><p>類推適用<span class=\"art\">第549條第1項</span>，當事人之任何一方得隨時終止，不須事由。本題中，甲自得終止；惟其係單純改變心意，並非不得不終止，應依同條第2項負責。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>委任具高度信任關係。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得請求全額報酬90萬元</p><p>依<span class=\"art\">第568條第1項</span>，居間人以契約因其報告或媒介而成立者為限，得請求報酬。本題中，甲終止後數日即以同價售予乙覓得之丙，仍可評價為因乙之媒介而成立。縱認不成立，成交係報酬之法定要件，得類推適用<span class=\"art\">第101條第1項</span>，甲顯係規避報酬，視為條件已成就；二者均不成立時，乙至少得類推適用<span class=\"art\">第548條第2項</span>就已處理部分請求報酬（有爭議，本文肯定）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止委託人以終止規避報酬。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲應賠償，廣告費依定性處理</p><p>類推適用<span class=\"art\">第549條第2項</span>，於不利於他方之時期終止者，應負損害賠償責任。本題中，乙已覓得買方，屬不利於乙之時期，甲應賠償。廣告費3萬元若定性為居間，依<span class=\"art\">第569條第1項</span>非經約定不得請求償還（有爭議）；若定性為委任，得依<span class=\"art\">第546條第1項</span>請求償還必要費用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>同一筆費用不得重複請求，避免雙重得利。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得類推適用<span class=\"art\">第549條第1項</span>隨時終止，但於不利時期終止須賠償。（二）乙得依<span class=\"art\">第568條第1項</span>請求全額報酬90萬元，或類推適用<span class=\"art\">第101條第1項</span>視為條件成就；至少得類推適用<span class=\"art\">第548條第2項</span>請求已處理部分。（三）甲應依<span class=\"art\">第549條第2項</span>賠償乙之損害；廣告費依居間或委任之定性決定得否請求，均不得重複請求。</p>"], "ck": [{"x": "§549Ⅰ 任何一方得隨時終止委任", "h": false}, {"x": "§549Ⅱ 不利時期終止須賠償（甲單純改變心意，不適用但書）", "h": true}, {"x": "報酬以成交為條件 → 定性居間（§565），報酬依 §568Ⅰ：契約因乙媒介而成立得請求", "h": false}, {"x": "§548Ⅱ（委任觀點／否定說）：中途終止，就「已處理之部分」請求報酬（非全額）", "h": true}, {"x": "§101Ⅰ 不正當依誠信客觀評價：同價、數日內、同一買方 → 近肯定說，視為成就得全額", "h": true}, {"x": "§548Ⅰ 報告顛末：僅委任觀點適用，居間依 §568Ⅰ 無此前提", "h": true}, {"x": "乙得依 §568Ⅰ 或 §101Ⅰ 請求全額 90 萬；如認甲非不正當，依 §548Ⅱ 請求已處理部分", "h": false}, {"x": "乙已覓得買方、支出廣告費時被終止＝不利時期", "h": false}, {"x": "廣告費：居間 §569Ⅰ 非經約定不得請求；委任 §546Ⅰ 得請求；不重複", "h": true}], "mn": "隨時可終止 → 不利時期要賠 → 定性居間看 §568Ⅰ → 規避依 §101 兩說 → 至少已處理部分 → 廣告費不重複"}, {"id": "預31", "no": "預測題 31", "t": "概括委任與特別授權：受任人出賣不動產", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "屋主甲因出國，出具「全權處理名下房地產事宜」之委任書（未載明得出賣）交予乙，並以口頭告知乙「可代為辦理一切事務」。乙持委任書以甲名義與買方丙訂立 A 屋買賣契約，價金 2,500 萬元，並辦理移轉登記予丙。甲回國後主張乙無出賣權，要求塗銷登記。試問：（一）乙是否有出賣 A 屋之代理權？（二）買賣契約及移轉登記對甲有無效力？（三）丙得否主張表見代理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>概括委任指委任人僅概括授與受任人處理一切事務，而未就個別事項特別授權。特別授權指就法律列舉之重大行為，須有明確之授權始得為之。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第534條第1款</span>（不動產出賣須特別授權）、<span class=\"art\">第531條</span>（授權之文字要件）、<span class=\"art\">第170條第1項</span>（無權代理）、<span class=\"art\">第767條第1項</span>中段（除去妨害）、<span class=\"art\">第759條之1第2項</span>（信賴登記保護）、<span class=\"art\">第110條</span>（無權代理人責任）、<span class=\"art\">第169條</span>（表見代理）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙無出賣A屋之代理權</p><p>依<span class=\"art\">第534條</span>，受任人受概括委任者，得為委任人為一切行為，但不動產之出賣須有特別之授權（第1款）。本題中，委任書僅概括授權處理房地產事宜，口頭亦僅稱一切事務，未就出賣為特別授權，代理權範圍不及於出賣。甲已出具書面，<span class=\"art\">第531條</span>之文字要件並無欠缺，乙欠缺代理權係因<span class=\"art\">第534條第1款</span>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不動產出賣影響重大。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）買賣及移轉登記對甲不生效力</p><p>依<span class=\"art\">第170條第1項</span>，無代理權人以代理人之名義所為之法律行為，非經本人承認，對於本人不生效力。本題中，甲否認，買賣契約對甲確定不生效力；移轉登記欠缺有權之處分行為，甲得依<span class=\"art\">第767條第1項</span>中段請求丙塗銷。丙不得主張<span class=\"art\">第759條之1第2項</span>，因登記名義人即甲本人，登記並無不實，丙信賴者為乙之代理權而非登記；丙若善意，得依<span class=\"art\">第110條</span>向乙求償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護本人之所有權。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙不得主張表見代理</p><p>依<span class=\"art\">第169條</span>，本人應負授權人之責任，但第三人明知其無代理權或可得而知者，不在此限。本題中，委任書未載明得出賣，不動產出賣須特別授權，丙未向甲查證即逕與乙訂約，屬可得而知，依<span class=\"art\">第169條但書</span>不得主張表見代理。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>可得而知之第三人不值保護。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙僅受概括委任，無出賣A屋之特別授權，欠缺代理權。（二）買賣契約屬無權代理，甲拒絕承認，對甲不生效力，甲得請求丙塗銷登記。（三）丙未向甲查證，屬可得而知，依<span class=\"art\">第169條但書</span>不得主張表見代理。</p>"], "ck": [{"x": "§534 第1款：不動產之出賣須有特別授權", "h": true}, {"x": "「全權處理」屬概括委任，書面未特別授權出賣 → 乙無出賣代理權（原因在 §534①，非 §531）", "h": false}, {"x": "§170Ⅰ 無權代理，甲不承認即對甲不生效力", "h": false}, {"x": "甲得依 §767Ⅰ 請求丙塗銷登記", "h": true}, {"x": "丙信賴代理權而非登記 → 無 §759-1Ⅱ 善意受讓保護", "h": false}, {"x": "§169 表見代理：本人行為造成授權外觀", "h": false}, {"x": "§169但書：丙明知或可得而知即不適用", "h": true}, {"x": "丙可得而知，依 §169但書不得主張表見代理", "h": false}], "mn": "全權 ≠ 可賣（§534①）→ 無權代理甲不認 → 塗銷登記 → 表見代理卡在可得而知"}, {"id": "預32", "no": "預測題 32", "t": "要約書・斡旋・定金：買方出價後賣方反悔", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "買方丙看屋後，透過仲介乙向屋主甲遞出「要約書」，載明願以 2,800 萬元購買 A 屋，並簽署斡旋金 50 萬元支票交予乙保管，約定有效期限為三日。甲在期限內表示「價格可以，但要加傢俱」，丙不同意，雙方未達成合意。第三日，丙撤回要約並請乙退還斡旋金；乙則表示依慣例「斡旋金須待有結果才退」。另一情形：若甲表示「同意」，並簽署買賣契約，丙為履約已交付定金 100 萬元，並約定丙違約時甲得沒收定金，嗣後丙因個人原因無法付款。試問：（一）要約書之法律性質與拘束力為何？甲回覆「加傢俱」之效力如何？（二）乙得否拒絕退還斡旋金？（三）若契約成立後丙違約，定金如何處理？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>要約，指以訂立契約為目的之意思表示。斡旋金，指買方為向賣方表示購買誠意，交由仲介保管之款項，性質上多為信賴保證金，不同於定金。定金，指為確保契約之履行而交付之金錢，依<span class=\"art\">第249條</span>規定其效力。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第153條</span>（契約成立）、<span class=\"art\">第154條第1項</span>（要約之拘束力）、<span class=\"art\">第160條第2項</span>（變更承諾視為新要約）；<span class=\"art\">第179條</span>（不當得利）、<span class=\"art\">第565條</span>、<span class=\"art\">第568條第1項</span>（居間及報酬）；<span class=\"art\">第249條</span>（定金之效力）、<span class=\"art\">第254條</span>（遲延解除）、<span class=\"art\">第252條</span>（違約金酌減）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）要約書有拘束力，甲之回覆為新要約</p><p>依<span class=\"art\">第154條第1項</span>，契約之要約人，因要約而受拘束；依<span class=\"art\">第160條第2項</span>，將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約。本題中，要約書載明價金、標的、期限，屬要約；甲回覆加傢俱，視為拒絕原要約而為新要約，原要約失其拘束力，丙不同意，契約未成立，丙第三日之撤回已無實益。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>契約須意思一致始成立。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙不得拒絕退還斡旋金</p><p>斡旋金非定金，不適用<span class=\"art\">第249條</span>。本題中，契約未成立，斡旋目的不達，乙應依約返還；縱無返還約定，丙亦得依<span class=\"art\">第179條</span>請求。乙依<span class=\"art\">第568條第1項</span>以契約因其媒介而成立為限始得請求報酬，本題無報酬請求權，不得以斡旋金充抵。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>斡旋金僅表達誠意。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲催告解約後得依約沒收定金，過高得酌減</p><p>依<span class=\"art\">第254條</span>，遲延給付經定期催告不履行者得解除契約。本題中，丙無法付款屬給付遲延，甲催告後解除，得依「丙違約時甲得沒收」之約定沒收定金，定金具違約金性質者類推適用<span class=\"art\">第252條</span>酌減（實務見解）。若無此約定，是否屬<span class=\"art\">第249條第2款</span>致不能履行有爭議，本文採肯定說。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧契約嚴守與公平。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）要約書為要約，具拘束力；甲加傢俱之回覆視為拒絕原要約而為新要約，原要約失其拘束力，契約未成立，丙之撤回已無實益。（二）乙應返還斡旋金，縱無約定丙亦得依<span class=\"art\">第179條</span>請求，乙不得拒絕。（三）丙給付遲延，甲依<span class=\"art\">第254條</span>催告後解約，得依約沒收定金，過高者類推適用<span class=\"art\">第252條</span>酌減；無約定時本文採肯定說，丙亦不得請求返還。</p>"], "ck": [{"x": "§154Ⅰ：要約人受拘束，要約書有效期限內不得任意撤回", "h": true}, {"x": "§160Ⅱ：變更後承諾視為拒絕原要約而為新要約", "h": true}, {"x": "甲加傢俱＝新要約，丙不同意，契約未成立（§153）", "h": false}, {"x": "斡旋金是信賴保證金，不是定金，不適用 §249", "h": true}, {"x": "契約未成立，乙應依斡旋約定返還（縱無約定，§179），乙不得拒絕", "h": false}, {"x": "丙遲延，§254 催告解約；依沒收約定沒收，定金具違約金性質者類推 §252 酌減（實務見解）", "h": false}, {"x": "無沒收約定：解約後是否屬 §249②「不能履行」有爭議（本文肯定，丙不得請求返還）", "h": true}, {"x": "須先依約定判斷定金類型；另有損害依債務不履行請求", "h": true}], "mn": "要約有拘束 → 加條件是新要約 → 未成立退斡旋金（不是定金）→ 已成立丙遲延 → 催告解約、依約沒收定金，過高可酌減"}, {"id": "預47", "no": "預測題 47", "t": "贈與：任意撤銷、附負擔贈與與法定撤銷期間", "lv": "", "k": "pred", "tier": 1, "g": "居間・委任・買賣・租賃", "q": "甲以書面約定將A屋贈與其子乙，並約定乙應每月給付甲生活費2萬元，契約未經公證。試問：（一）A屋尚未移轉登記前，甲反悔，得否撤銷贈與？（二）若A屋已移轉登記予乙，乙其後拒不給付生活費，甲有何權利？（三）若A屋已移轉登記，乙其後故意毆打甲成傷，經法院判處傷害罪，甲於被毆後一年三個月始以存證信函向乙表示撤銷贈與，有無效力？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>贈與指一方以自己之財產無償給與他方，他方允受之契約。因屬無償，民法賦予贈與人撤銷權：權利未移轉前得任意撤銷；附負擔贈與，受贈人不履行負擔時得請求履行或撤銷；受贈人忘恩時得於法定期間內撤銷。撤銷應以意思表示為之，撤銷後依不當得利請求返還。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第406條</span>（定義）、<span class=\"art\">第408條第1項</span>、第2項（任意撤銷及除外）；<span class=\"art\">第412條第1項</span>（不履行負擔）、<span class=\"art\">第419條</span>（撤銷方法及返還）、<span class=\"art\">第1114條第1款</span>（扶養義務）；<span class=\"art\">第416條第1項第1款</span>、第2款（忘恩撤銷）、<span class=\"art\">第416條第2項</span>（一年期間）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得任意撤銷</p><p>依<span class=\"art\">第408條第1項</span>，贈與物之權利未移轉前，贈與人得撤銷其贈與；同條第2項，經公證或為履行道德上義務之贈與不適用。本題A屋尚未移轉登記，書面贈與未經公證，父贈子屋亦非履行道德上義務，甲得撤銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>書面不等於公證。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得請求履行或撤銷</p><p>依<span class=\"art\">第412條第1項</span>，贈與人已為給付而受贈人不履行其負擔時，得請求履行或撤銷贈與。本題乙每月給付生活費屬負擔，甲已移轉A屋，乙拒付，甲得擇一主張；撤銷應依<span class=\"art\">第419條第1項</span>向乙為意思表示，並依同條第2項請求返還A屋。又乙依<span class=\"art\">第1114條第1款</span>負扶養義務，甲有受扶養必要而乙不履行者，亦得依<span class=\"art\">第416條第1項第2款</span>於一年內撤銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>受贈人不履行負擔，贈與人不受拘束。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）撤銷不生效力</p><p>依<span class=\"art\">第416條第1項第1款</span>，受贈人對贈與人有故意侵害之行為，依刑法有處罰之明文者，贈與人得撤銷；依同條第2項，自知有撤銷原因之時起一年內不行使而消滅。本題乙毆傷甲符合本款，不以刑事判決確定為必要；惟甲被毆時即知，至一年三個月後始撤銷，已逾一年，撤銷權消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以法定期間兼顧受贈人之信賴。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）A屋未移轉且贈與未經公證，甲得依<span class=\"art\">第408條第1項</span>撤銷。（二）甲得依<span class=\"art\">第412條第1項</span>請求乙履行負擔或撤銷贈與，撤銷後依<span class=\"art\">第419條第2項</span>請求返還A屋。（三）撤銷權已逾<span class=\"art\">第416條第2項</span>一年期間而消滅，撤銷不生效力。</p>"], "ck": [{"x": "§408Ⅰ：權利未移轉前得撤銷；Ⅱ 公證或道德義務除外", "h": true}, {"x": "書面≠公證，仍得撤銷", "h": true}, {"x": "§412Ⅰ：附負擔＋贈與人已給付＋受贈人不履行 → 請求履行或撤銷", "h": false}, {"x": "§419：向受贈人表示；撤銷後依不當得利返還", "h": false}, {"x": "§416Ⅰ①：故意侵害、依刑法有處罰 → 得撤銷", "h": false}, {"x": "§416Ⅱ：知悉起一年；一年三個月已逾", "h": true}], "mn": "過戶前可任意撤 → 公證道德例外 → 負擔不做請求或撤 → 撤銷依不當得利要回 → 忘恩撤銷一年內"}, {"id": "101-一", "no": "101年第一題", "t": "拋棄債權／抵押權／繼承權效力比較", "lv": "", "k": "off", "tier": 0, "g": "意思表示・行為能力・債總", "q": "父甲、母乙、子丙、女丁一家，丙創業向戊融資1000萬元，由乙提供A地設定抵押權擔保，丁為連帶保證人；甲死亡留有2000萬元遺產，未立遺囑。問：戊拋棄債權、戊拋棄抵押權，丁拋棄繼承權，其效力各如何？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>拋棄主權利，效力及於從權利（擔保物權、保證債務）；拋棄從權利，原則上不影響
