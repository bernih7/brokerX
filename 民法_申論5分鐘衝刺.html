主權利；拋棄具身分性質之繼承權，則另設要式規範。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第343條</span>（債務免除）；<span class=\"art\">第764條</span>（物權之拋棄）、<span class=\"art\">第758條</span>（不動產物權之拋棄須登記）、<span class=\"art\">第751條</span>（拋棄擔保物權時保證人之免責）；<span class=\"art\">第1174條</span>、<span class=\"art\">第1175條</span>（拋棄繼承之方式及效力）、<span class=\"art\">第1176條第1項</span>（拋棄者應繼分之歸屬）、<span class=\"art\">第1138條第1款</span>、<span class=\"art\">第1144條第1款</span>（配偶與第一順序繼承人之應繼分）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）戊拋棄債權</p><p>依<span class=\"art\">第343條</span>，債權人向債務人表示免除其債務之意思者，債之關係消滅。本題中，戊拋棄對丙之1000萬元債權，即為債務免除，主債權消滅，從屬於該債權之乙所設定抵押權及丁之連帶保證債務，均隨同消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>從權利以主債權存在為前提。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）戊拋棄抵押權</p><p>依<span class=\"art\">第764條第1項</span>，物權因拋棄而消滅；抵押權為不動產物權，依<span class=\"art\">第758條</span>應以書面為之，並辦理塗銷登記始生效力。本題中，戊單獨拋棄抵押權，對丙之主債權不因此消滅，僅喪失就A地優先受償之利益；惟依<span class=\"art\">第751條</span>，債權人拋棄為其債權擔保之物權者，保證人丁就戊所拋棄權利之限度內免其責任，其餘部分仍須負責。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>從權利之拋棄，原則上不影響主權利之存續。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁拋棄繼承權</p><p>依<span class=\"art\">第1174條</span>，拋棄應於知悉得繼承時起3個月內，以書面向法院為之；依<span class=\"art\">第1175條</span>，溯及於繼承開始時發生效力；依<span class=\"art\">第1176條第1項</span>，其應繼分歸屬於其他同為繼承之人。本題中，甲之繼承人為配偶乙及子女丙、丁，依<span class=\"art\">第1138條第1款</span>、<span class=\"art\">第1144條第1款</span>原各三分之一；丁合法拋棄後，視為自始未繼承，其應繼分歸屬乙、丙，乙、丙各繼承二分之一，即各1000萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>繼承權具身分性質，須依法定方式為之。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>戊拋棄債權，主債權消滅，乙之抵押權及丁之保證債務隨同消滅；戊拋棄抵押權，主債權仍存續，惟丁依<span class=\"art\">第751條</span>於所拋棄權利之限度內免責；丁拋棄繼承權，須以書面向法院為之，溯及繼承開始時生效，其應繼分歸屬乙、丙，乙、丙各繼承1000萬元。三者效力互不相涉。</p>"], "ck": [{"x": "§343 拋棄債權即免除，債之關係消滅", "h": false}, {"x": "主債權消滅，乙之抵押權與丁之保證隨同消滅", "h": false}, {"x": "§764Ⅰ 抵押權人得拋棄抵押權（Ⅱ 第三人有利益須同意）", "h": false}, {"x": "§758：拋棄抵押權須書面＋塗銷登記始生效力", "h": true}, {"x": "戊只拋棄抵押權，主債權不消滅，只喪失優先受償", "h": true}, {"x": "§751 拋棄擔保物權，保證人於拋棄限度內免責", "h": false}, {"x": "§1174 3個月內以書面向法院拋棄", "h": false}, {"x": "§1175 溯及繼承開始；§1176Ⅰ 丁應繼分歸乙丙，各1/2（各1,000萬）", "h": false}], "mn": "拋主連從消 → 拋從主不消、保證人限度免責 → 拋繼承要書面向法院、溯及"}, {"id": "106-二", "no": "106年第二題", "t": "行為能力（成年）＋瑕疵擔保（海砂屋）", "lv": "", "k": "off", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲現年18歲未婚，未經法定代理人同意，與乙建設公司簽訂買賣契約並辦理移轉登記，購買500萬元A套房，其後發現該屋為海砂屋。甲得依民法向乙主張何等權利？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>現行法滿18歲為成年，有完全行為能力。物之瑕疵擔保課出賣人就標的物瑕疵負擔保責任，以確保對價公平，性質上為法定無過失責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第12條</span>（成年年齡18歲）；<span class=\"art\">第77條</span>、<span class=\"art\">第79條</span>（舊法附帶）；<span class=\"art\">第354條</span>、<span class=\"art\">第373條</span>（物之瑕疵擔保、危險移轉）；<span class=\"art\">第356條</span>（通知義務）；<span class=\"art\">第359條</span>（解除契約或減少價金）；<span class=\"art\">第365條</span>（解除權、減價權之消滅）；<span class=\"art\">第360條</span>（不履行之損害賠償）；<span class=\"art\">第227條</span>（不完全給付）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）契約效力</p><p>依現行<span class=\"art\">第12條</span>，滿十八歲為成年。本題中，甲現年18歲，已為完全行為能力人，買賣契約及移轉登記均有效（依舊法甲未成年，依<span class=\"art\">第77條</span>、<span class=\"art\">第79條</span>須經法定代理人承認）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>成年年齡已修正為18歲。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）瑕疵擔保之解除或減價</p><p>依<span class=\"art\">第354條第1項</span>，出賣人應擔保其物依<span class=\"art\">第373條</span>危險移轉時無減少價值或效用之瑕疵。本題中，A套房為海砂屋，屬物之瑕疵，甲得依<span class=\"art\">第359條</span>解除契約或請求減少價金（解除顯失公平者，僅得減價）；惟甲應依<span class=\"art\">第356條</span>即時通知乙，且依<span class=\"art\">第365條</span>，通知後六個月或交付後五年不行使即消滅（乙故意不告知者，無六個月之限制）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維持對價均衡。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）損害賠償</p><p>依<span class=\"art\">第360條</span>，買賣之物缺少出賣人所保證之品質，或出賣人故意不告知瑕疵者，買受人得請求不履行之損害賠償。本題中，若乙明知為海砂屋而故意不告知，或缺少所保證之品質，甲得請求修繕費用等損害。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>出賣人可非難。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）不完全給付</p><p>依<span class=\"art\">第227條</span>，因可歸責於債務人之事由致為不完全給付者，債權人得依給付遲延或給付不能之規定行使權利。本題中，若海砂屋可歸責於乙（如興建時使用海砂），甲並得依<span class=\"art\">第227條</span>主張，與瑕疵擔保併存。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>二者要件效果不同（實務見解）。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲依現行法為完全行為能力人，契約及移轉登記均有效。甲得依<span class=\"art\">第359條</span>請求解除契約或減少價金；若乙故意不告知瑕疵或缺少所保證之品質，甲亦得依<span class=\"art\">第360條</span>請求不履行之損害賠償（與<span class=\"art\">第359條</span>擇一行使）；瑕疵如可歸責於乙，甲並得依<span class=\"art\">第227條</span>主張不完全給付，與瑕疵擔保請求權併存。</p>"], "ck": [{"x": "§12 現行法成年年齡為18歲", "h": true}, {"x": "甲18歲為完全行為能力人，買賣及移轉登記均有效", "h": false}, {"x": "§354Ⅰ 出賣人負物之瑕疵擔保責任", "h": false}, {"x": "海砂屋屬瑕疵，甲依 §359 得解除契約或減少價金", "h": false}, {"x": "§360 缺少所保證之品質或故意不告知瑕疵，得請求不履行之損害賠償", "h": true}, {"x": "§360 須乙故意不告知或缺少所保證之品質，與 §359 效果不同", "h": true}, {"x": "§227 瑕疵可歸責於乙 → 不完全給付，與瑕疵擔保併存", "h": true}, {"x": "甲得解除或減價，或符合 §360 者改請求損害賠償（擇一）", "h": false}], "mn": "十八成年看現行 → 契約有效 → 海砂屋是瑕疵 → 解除減價 → 故意或保證改求賠償"}, {"id": "103-一", "no": "103年第一題", "t": "詐欺撤銷：債權行為／物權行為、詐欺vs脅迫", "lv": "", "k": "off", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲被乙詐欺出賣房屋並已辦妥所有權移轉登記，若甲僅撤銷債權行為、或同時撤銷債權及物權行為，法律關係各如何？詐欺撤銷與脅迫撤銷之效力有何不同？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>民法對因詐欺、脅迫而為之意思表示賦予撤銷權，惟就能否對抗善意第三人異其規範：被詐欺者之撤銷不得對抗善意第三人，以兼顧交易安全；被脅迫者意思自由受壓制，法律未設此限制。又我國採物權行為獨立性及無因性，債權行為與物權行為應分別判斷。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第92條</span>（詐欺脅迫之撤銷及對抗效力）；<span class=\"art\">第93條</span>（撤銷期間）；<span class=\"art\">第114條第1項</span>（撤銷之效力）；<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第767條第1項</span>（所有物返還及除去妨害）；<span class=\"art\">第759條之1第2項</span>（善意第三人保護）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）僅撤銷債權行為</p><p>依<span class=\"art\">第114條第1項</span>，法律行為經撤銷者，視為自始無效。本題中，買賣契約自始無效，惟物權行為具獨立性、無因性仍屬有效，乙仍為所有人，但其受領所有權欠缺法律上原因，甲得依<span class=\"art\">第179條</span>請求乙將所有權移轉登記返還，並應同時返還價金。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>物權行為不因原因行為失效而當然失效。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）同時撤銷債權及物權行為</p><p>依<span class=\"art\">第114條第1項</span>，二者均視為自始無效。本題中，物權行為亦因受詐欺而為，得一併撤銷，乙自始未取得所有權，甲得依<span class=\"art\">第767條第1項前段</span>請求返還房屋、依同項中段請求塗銷登記；甲受領之價金亦應依<span class=\"art\">第179條</span>返還乙。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>所有權未曾移轉。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）詐欺與脅迫撤銷之差異</p><p>依<span class=\"art\">第92條第2項</span>，被詐欺而為之意思表示，其撤銷不得以之對抗善意第三人；脅迫則無此限制。本題中，房屋若已移轉予不知情之第三人，詐欺撤銷不得對抗之，脅迫撤銷原則上得對抗；惟第三人信賴登記而善意取得者，仍受<span class=\"art\">第759條之1第2項</span>保護。又第三人詐欺須相對人明知或可得而知始得撤銷，脅迫則否；二者期間均依<span class=\"art\">第93條</span>。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>二者對意思自由之侵害程度不同。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，甲僅撤銷債權行為者，物權行為不受影響，僅得依<span class=\"art\">第179條</span>請求返還所有權並返還價金；一併撤銷者，甲得依<span class=\"art\">第767條第1項</span>請求塗銷登記並返還占有，亦應返還價金。詐欺撤銷不得對抗善意第三人，脅迫撤銷原則上得對抗，惟不動產善意第三人仍受<span class=\"art\">第759條之1第2項</span>保護。</p>"], "ck": [{"x": "§114Ⅰ：撤銷後視為自始無效", "h": false}, {"x": "僅撤銷債權行為：物權行為獨立無因仍有效，乙仍為所有人", "h": false}, {"x": "§179：乙受領無法律上原因，甲得請求乙將所有權移轉登記返還；甲應返還價金", "h": false}, {"x": "同時撤銷債權及物權行為：移轉自始無效，甲仍為所有人", "h": false}, {"x": "§767：甲得請求乙塗銷登記並返還占有", "h": false}, {"x": "§92Ⅱ：詐欺撤銷不得對抗善意第三人", "h": true}, {"x": "脅迫撤銷原則得對抗第三人；不動產善意信賴登記者仍受 §759-1Ⅱ 保護", "h": true}], "mn": "債物分開 → 只撤債權找 §179 → 連物權撤找 §767 → 詐欺不對善意、脅迫對誰都行"}, {"id": "107-一", "no": "107年第一題", "t": "債權人代位權（§242）", "lv": "", "k": "off", "tier": 2, "g": "意思表示・行為能力・債總", "q": "甲將自己所有之一筆土地出賣於乙，尚未交付，亦未辦理所有權移轉登記，乙即將該土地轉賣於丙，屆清償期乙未依約將該土地所有權移轉登記於丙，丙一再催促，乙均置之不理，而該土地仍登記為甲所有。請問：丙得如何行使權利，取得該土地所有權？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>債之關係原則上僅拘束契約當事人，惟債務人怠於行使其權利，致害及債權人債權之保全者，法律例外允許債權人以自己名義代位行使債務人之權利，以防止債務人消極不行使權利致責任財產減損，影響債權之實現。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第758條第1項</span>（不動產物權登記生效）；<span class=\"art\">第242條</span>（債權人代位權）；<span class=\"art\">第243條</span>（債務人負遲延責任時始得行使）；<span class=\"art\">第264條</span>（同時履行抗辯）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丙與乙間之法律關係</p><p>依<span class=\"art\">第758條第1項</span>，不動產物權依法律行為而取得者，非經登記，不生效力。本題中，甲未交付亦未移轉登記予乙，土地仍登記為甲所有，乙非所有權人，無從直接移轉登記予丙；題目未載乙曾向甲請求移轉登記，可認乙怠於行使權利。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不動產物權採登記生效主義。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙得依<span class=\"art\">第242條</span>、<span class=\"art\">第243條</span>代位行使乙對甲之請求權</p><p>依<span class=\"art\">第242條</span>，債務人怠於行使其權利時，債權人因保全債權，得以自己之名義行使其權利；依<span class=\"art\">第243條</span>，須債務人負遲延責任時始得行使。本題中，乙基於買賣契約對甲有移轉登記請求權而怠於行使，致丙之債權有不能實現之虞；乙對丙之義務已屆清償期，經丙一再催促仍置之不理，已負遲延責任，丙得以自己名義代位乙向甲請求移轉登記。依實務見解，保全特定債權者不以債務人無資力為要件；惟甲得以對乙之抗辯對抗丙，如依<span class=\"art\">第264條</span>主張同時履行抗辯。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代位權係行使債務人之權利。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）所有權取得之流程</p><p>本題中，丙代位之效果係使甲將土地移轉登記予乙，而非直接登記予丙；乙取得所有權後，丙再依買賣契約請求乙移轉登記予丙，完成甲→乙→丙之連續移轉登記，實務上得於同一訴訟一併請求。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代位所得利益原則歸屬債務人之責任財產。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>乙尚未取得土地所有權，無從直接移轉登記予丙；丙得依<span class=\"art\">民法第242條</span>，於乙怠於行使其對甲之移轉登記請求權、且乙對丙已負遲延責任時（<span class=\"art\">第243條</span>），以自己名義代位乙向甲請求移轉登記予乙，再依其與乙之買賣契約請求乙移轉登記予丙，始能終局取得該土地所有權。</p>"], "ck": [{"x": "§758 不動產物權依法律行為變動，非經登記不生效力", "h": false}, {"x": "土地仍登記甲名下，乙未取得所有權，無從直接移轉丙", "h": false}, {"x": "§242 債務人怠於行使，債權人為保全債權得以自己名義代位", "h": false}, {"x": "§243 須債務人負遲延責任始得代位（保存行為除外）；乙屆期經催告不履行已遲延", "h": true}, {"x": "第三債務人甲得以對乙之抗辯對抗丙（如 §264 同時履行抗辯）", "h": false}, {"x": "乙置之不理，丙得代位乙向甲請求移轉登記", "h": false}, {"x": "代位效果：甲先移轉登記予乙，非直接予丙", "h": true}, {"x": "乙取得後丙再依買賣請乙移轉，完成甲→乙→丙", "h": true}], "mn": "乙沒登記不是主人 → 乙不要丙代位 → 先登給乙 → 再登給丙"}, {"id": "100-一", "no": "100年第一題", "t": "信賴利益之定義與損害賠償", "lv": "", "k": "off", "tier": 2, "g": "意思表示・行為能力・債總", "q": "何謂信賴利益？我國民法關於信賴利益之損害賠償規定有那些？請列舉說明之。（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>信賴利益，指當事人因信賴法律行為有效成立或將發生效力而為準備或支出，嗣因該法律行為不成立、無效、被撤銷或不能履行，致信賴落空所受之損害。履行利益係契約依約履行時所能獲得之利益（積極利益）；信賴利益則在回復至未信賴前之狀態（消極利益），其賠償範圍原則上不得超過履行利益，以免受害人因行為不成立反而獲得較履行更優厚之地位。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第91條</span>（錯誤或誤傳撤銷之損害賠償）、<span class=\"art\">第110條</span>（無權代理人之責任；賠償範圍是否限於信賴利益，學說有爭議）、<span class=\"art\">第113條</span>（無效法律行為之回復原狀及損害賠償）、<span class=\"art\">第245條之1</span>（締約過失責任）、<span class=\"art\">第247條</span>（因給付不能致契約無效之損害賠償）、<span class=\"art\">第165條</span>（懸賞廣告之撤回）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）何謂信賴利益</p><p>信賴利益係因信賴法律行為有效而受之損害，屬消極利益，與履行利益相對。本題中，其賠償以回復至未信賴前之原狀為目的。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免受害人因法律行為不成立反而受有更優厚之地位。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）民法關於信賴利益之規定</p><p>1. 依<span class=\"art\">第91條</span>，表意人依<span class=\"art\">第88條</span>、<span class=\"art\">第89條</span>撤銷意思表示者，對信其表示有效而受損害之相對人或第三人負賠償責任，但受害人明知或可得而知撤銷原因者不得請求。2. 依<span class=\"art\">第110條</span>，無權代理人對善意相對人負損害賠償之責，不以故意或過失為要件，其範圍不以信賴利益為限，但不得超過履行利益。3. 依<span class=\"art\">第245條之1</span>，契約未成立時，締約一方於準備或商議中惡意隱匿或不實說明、洩漏經明示保密之秘密，或有其他顯然違反誠信之行為者，對非因過失而信契約能成立之他方負賠償責任。4. 依<span class=\"art\">第247條</span>，契約以不能之給付為標的而無效時，訂約時知其不能或可得而知之一方，對非因過失而信契約為有效之他方負賠償責任。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>法律對信賴落空之一方給予衡平保護。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>信賴利益係當事人信賴法律行為有效而受之損害，其賠償以回復未信賴前之原狀為目的，範圍原則上不得逾越履行利益。民法相關規定有<span class=\"art\">第91條</span>、<span class=\"art\">第110條</span>、<span class=\"art\">第245條之1</span>、<span class=\"art\">第247條</span>，另<span class=\"art\">第113條</span>及<span class=\"art\">第165條</span>亦可列舉，均體現對信賴落空一方之衡平保護。</p>"], "ck": [{"x": "信賴利益＝信賴法律行為有效而受之損害（消極利益）", "h": false}, {"x": "與履行利益（積極利益）區分，賠償原則不逾履行利益", "h": true}, {"x": "§91 撤銷錯誤意思表示，對信賴之相對人或第三人賠償", "h": false}, {"x": "§110 無權代理人對善意相對人負賠償責任（以履行利益為上限）", "h": false}, {"x": "§245-1 締約過失：契約未成立，對信其能成立者賠償", "h": false}, {"x": "§247 契約因給付不能無效，知或可得而知者賠償", "h": false}, {"x": "四條完整列舉，不能只講一條", "h": true}], "mn": "信賴看有效 → 錯誤撤銷 91 → 無權代理 110 → 磋商落空 245-1 → 自始不能 247"}, {"id": "專練-二", "no": "申論專練卷① 申論二", "t": "行為能力＋詐欺＋瑕疵擔保：未成年人用詐術購買泡水車", "lv": "", "k": "mock", "tier": 2, "g": "意思表示・行為能力・債總", "q": "17 歲之甲未得父母同意，持偽造之父母同意書，向乙車行購買二手機車一部，價金 6 萬元當場付清並交車。乙明知該車曾經泡水，卻向甲保證「本車無泡水、無重大事故」。一個月後甲發現該車曾泡水，引擎受損須支出修理費 2 萬元，甲隨即通知乙。甲之父母得知後，主張買賣契約未經其同意而無效。試問：（一）甲乙間買賣契約之效力如何？甲父母之主張有無理由？（二）甲對乙得主張何種權利？", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>限制行為能力人指滿七歲以上之未成年人，現行法滿十八歲為成年。詐術指限制行為能力人以積極行為使相對人誤信其有行為能力或已得法定代理人允許。詐欺指故意示以不實之事，令人陷於錯誤而為意思表示。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第12條</span>、<span class=\"art\">第13條第2項</span>（限制行為能力）、<span class=\"art\">第77條</span>、<span class=\"art\">第79條</span>（未得允許之契約效力未定）、<span class=\"art\">第83條</span>（用詐術之法律行為有效）；<span class=\"art\">第92條第1項</span>、<span class=\"art\">第93條</span>（詐欺撤銷）、<span class=\"art\">第114條第1項</span>、<span class=\"art\">第179條</span>、<span class=\"art\">第78條</span>；<span class=\"art\">第354條</span>、<span class=\"art\">第356條</span>、<span class=\"art\">第357條</span>、<span class=\"art\">第359條</span>、<span class=\"art\">第360條</span>、<span class=\"art\">第365條</span>；<span class=\"art\">第227條</span>、<span class=\"art\">第184條第1項後段</span>。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）契約有效，甲父母主張無理由</p><p>依<span class=\"art\">第83條</span>，限制行為能力人「用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效」。本題中，甲17歲為限制行為能力人，未得允許之契約依<span class=\"art\">第79條</span>原屬效力未定；惟甲持偽造之父母同意書，屬積極之詐術，契約確定有效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護相對人。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲得撤銷、主張瑕疵擔保或請求損害賠償</p><p>依<span class=\"art\">第92條第1項</span>，因被詐欺而為意思表示者，表意人得撤銷之。本題中，乙明知泡水仍保證無泡水，甲得於發見後一年內撤銷（<span class=\"art\">第93條</span>），惟撤銷非純獲法律上利益，應由法定代理人代為或得其允許，否則依<span class=\"art\">第78條</span>無效；撤銷後視為自始無效（<span class=\"art\">第114條第1項</span>），甲得依<span class=\"art\">第179條</span>請求返還價金。泡水屬<span class=\"art\">第354條第1項</span>之瑕疵，並缺少所保證之品質；乙故意不告知，依<span class=\"art\">第357條</span>不受<span class=\"art\">第356條</span>之限制。甲得依<span class=\"art\">第359條</span>解除或減價，或依<span class=\"art\">第360條</span>請求修理費2萬元，三者擇一。乙明知瑕疵仍交付，甲並得依<span class=\"art\">第227條</span>、<span class=\"art\">第184條第1項後段</span>請求損害賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>乙明知泡水仍積極保證，可歸責性明確；惟撤銷後即不得再主張瑕疵擔保。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲雖為限制行為能力人，但以偽造同意書使乙信其已得允許，依<span class=\"art\">第83條</span>契約有效；甲父母主張無效無理由。（二）甲得依<span class=\"art\">第92條第1項</span>、<span class=\"art\">第93條</span>撤銷並依<span class=\"art\">第179條</span>請求返還價金；或依<span class=\"art\">第359條</span>解除、減價，或依<span class=\"art\">第360條</span>請求修理費2萬元（三者擇一）；並得依<span class=\"art\">第227條</span>、<span class=\"art\">第184條第1項後段</span>請求損害賠償。</p>"], "ck": [{"x": "§77＋§79：未得允許之契約效力未定（不是無效）", "h": false}, {"x": "§83：用詐術使人信已得允許 → 法律行為有效", "h": true}, {"x": "偽造父母同意書＝積極詐術 → 父母主張無效無理由", "h": false}, {"x": "§92Ⅰ、§93：被詐欺 → 發見後一年內撤銷；撤銷須法定代理人代為或允許（§78）", "h": false}, {"x": "§354Ⅰ、Ⅱ：泡水＝減少價值效用之瑕疵，且缺保證品質", "h": false}, {"x": "§360：缺保證品質／故意不告知 → 不解除不減價，請求不履行之損害賠償（與 §359 擇一）", "h": true}, {"x": "§365Ⅱ：故意不告知 → 解除、減價不受通知後六個月限制", "h": false}, {"x": "§227：明知瑕疵仍交付屬可歸責之不完全給付（本文立場）；另 §184Ⅰ後段", "h": false}], "mn": "十七歲限制能力 → 未允許效力未定 → 偽造同意書用詐術就有效 → 被騙一年內撤銷（法代出手） → 泡水缺保證品質 → 解除減價或§360賠修理費擇一 → 明知仍交付再加§227、§184"}, {"id": "預25", "no": "預測題 25", "t": "遲延給付與契約解除：催告、回復原狀與損害賠償", "lv": "", "k": "pred", "tier": 0, "g": "意思表示・行為能力・債總", "q": "甲向乙購買 A 屋，價金 2,000 萬元，約定 3 月 1 日交屋並辦理移轉登記，甲已給付頭期款 500 萬元。屆期乙因另覓得更高價買主，遲未辦理移轉登記。甲於 3 月 10 日以存證信函定 10 日期限催告乙履行，期限屆滿乙仍不履行。試問：（一）乙自何時起負遲延責任？甲得否解除契約？解除之程序為何？（二）解除後雙方之權利義務如何？甲得否另請求賠償？（三）若 A 屋買賣係因甲須於 3 月 1 日前搬入開店，雙方明確約定「過期不履行即失契約目的」，結果有何不同？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>契約解除，指當事人一方以單方意思表示使契約溯及消滅，雙方負回復原狀義務；須先有遲延等事由，再依催告（原則）或免催告（例外）行使。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第229條第1項</span>（確定期限之遲延）、<span class=\"art\">第254條</span>（遲延之催告解除）、<span class=\"art\">第258條</span>（解除之意思表示）；<span class=\"art\">第259條第1款</span>、第2款（回復原狀及金錢附加利息）、<span class=\"art\">第260條</span>（解除不妨礙損害賠償）、<span class=\"art\">第231條第1項</span>（遲延損害）；<span class=\"art\">第255條</span>（定期行為免催告解除）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙之遲延時點、甲得否解除及程序</p><p>依<span class=\"art\">第229條第1項</span>，給付有確定期限者，債務人自期限屆滿時起負遲延責任；依<span class=\"art\">第254條</span>，一方遲延給付者，他方得定相當期限催告，於期限內不履行時得解除契約；依<span class=\"art\">第258條</span>，解除權之行使應向他方以意思表示為之，且不得撤銷。本題中，3月1日為確定期限，乙自期限屆滿起當然負遲延責任；甲定10日期限催告，尚非明顯過短，期滿乙仍不履行，甲得向乙為解除之意思表示。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>應先給予補正機會。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）解除後之權利義務及損害賠償</p><p>依<span class=\"art\">第259條第1款</span>、第2款，由他方所受領之給付物應返還，受領之給付為金錢者，應附加自受領時起之利息償還；依<span class=\"art\">第260條</span>，解除權之行使，不妨礙損害賠償之請求。本題中，乙應返還500萬元及自受領時起之利息；甲並得請求解除前之遲延損害（<span class=\"art\">第231條第1項</span>），另購房屋之差價屬履行利益，須就因果關係及數額舉證。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>解除不免除債務人之不履行責任。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）約定過期即失契約目的之效果</p><p>依<span class=\"art\">第255條</span>，依當事人之意思表示，非於一定時期為給付不能達其契約之目的，而一方不按照時期給付者，他方得不為催告，解除其契約。本題中，雙方明確約定過期不履行即失契約目的，屬定期行為，乙逾3月1日未履行，甲得不經催告直接解除。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>逾期給付已無意義。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙自3月1日起負遲延責任；甲已依<span class=\"art\">第254條</span>定相當期限催告，乙仍不履行，甲得依<span class=\"art\">第258條</span>以意思表示向乙解除契約。（二）解除後乙應返還500萬元及自受領時起之利息，甲並得依<span class=\"art\">第260條</span>請求損害賠償。（三）若屬定期行為，甲得依<span class=\"art\">第255條</span>不經催告直接解除。</p>"], "ck": [{"x": "§229Ⅰ：確定期限屆滿即負遲延責任，不需催告", "h": true}, {"x": "§254：定相當期限催告，期限內不履行始得解除", "h": true}, {"x": "10 日催告屬相當；§258 以意思表示解除，不得撤銷", "h": false}, {"x": "乙若已移轉登記他人 → 給付不能，§256 免催告解除", "h": false}, {"x": "§259②：受領金錢應附加自受領時起之利息", "h": true}, {"x": "乙返還 500 萬及利息；甲依 §260 另得請求賠償（遲延損害 §231Ⅰ、另購差價屬履行利益）", "h": true}, {"x": "§255：定期行為得不催告而解除", "h": false}, {"x": "約定過期失契約目的 → 免催告直接解除，效果同前", "h": false}], "mn": "期限到就遲延 → 催了才可解 → 退錢要加息、解除不礙賠 → 定期不用催"}, {"id": "預15", "no": "預測題 15", "t": "不完全給付：瑕疵給付與加害給付（§227）", "lv": "", "k": "pred", "tier": 0, "g": "意思表示・行為能力・債總", "q": "甲委請乙工程行承攬 A 屋室內配線工程，總價 60 萬元，乙完工交付。甲入住一週後，因乙施作之線路絕緣不良短路起火，燒毀甲之家具 20 萬元，甲手部灼傷支出醫療費 3 萬元。試問：（一）甲得否請求乙補正線路？乙不補正時，甲得否解除契約？（二）甲得否請求家具及醫療費之賠償？（三）甲得否請求精神慰撫金？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>不完全給付，指債務人雖已為給付，但不依債務本旨，致債權人受損害。可分為瑕疵給付（給付本身有瑕疵，如線路不良）與加害給付（因瑕疵給付另造成固有利益之損害，如燒毀家具、灼傷）兩型。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第227條第1項</span>、第2項（不完全給付）；<span class=\"art\">第254條</span>（催告後解除）；<span class=\"art\">第493條</span>至<span class=\"art\">第495條</span>（承攬瑕疵之修補、解除、損害賠償）；<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第193條第1項</span>（侵權行為）；<span class=\"art\">第227條之1</span>（人格權受侵害準用）；<span class=\"art\">第195條第1項</span>（慰撫金）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）補正及解除</p><p>依<span class=\"art\">第227條第1項</span>，因可歸責於債務人之事由致為不完全給付者，債權人得依給付遲延或給付不能之規定行使權利。本題中，線路絕緣不良屬可補正之瑕疵給付，乙可歸責，甲得定期催告補正，乙逾期不補正，依<span class=\"art\">第254條</span>得解除契約；承攬另得依<span class=\"art\">第493條</span>自行修補求償或依<span class=\"art\">第494條本文</span>解除。<span class=\"art\">第494條但書</span>雖限制工作物之解除，惟本題已釀成火災、A屋無法安全供電，依<span class=\"art\">第495條第2項</span>屬瑕疵重大致不能達使用之目的，甲仍得解除。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>重新配線無須拆除建物。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）家具及醫療費</p><p>依<span class=\"art\">第227條第2項</span>，因不完全給付而生前項以外之損害者，債權人並得請求賠償。本題中，燒毀家具20萬元及醫療費3萬元屬固有利益之損害，為加害給付，甲得請求合計23萬元；乙施工有過失，另成立<span class=\"art\">第184條第1項前段</span>侵權行為（醫療費並依<span class=\"art\">第193條第1項</span>），二者競合，擇一行使。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>加害給付同時侵害甲之所有權及身體健康。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）精神慰撫金</p><p>依<span class=\"art\">第227條之1</span>，債務不履行致人格權受侵害者，準用<span class=\"art\">第195條</span>。本題中，手部灼傷屬身體、健康受侵害，甲得依<span class=\"art\">第227條之1</span>準用<span class=\"art\">第195條第1項</span>請求相當之慰撫金；家具毀損屬財產損害，不得請求慰撫金。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>慰撫金以人格法益受侵害為限。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得請求乙補正線路，乙逾期不補正，甲得解除契約。（二）甲得依<span class=\"art\">第227條第2項</span>請求家具及醫療費合計23萬元，並得依<span class=\"art\">第184條第1項前段</span>請求，二者競合，擇一行使。（三）就手部灼傷之身體健康受侵害部分，甲得請求慰撫金；家具毀損之財產損害部分，不得請求。</p>"], "ck": [{"x": "線路不良為瑕疵給付，可補正且乙可歸責", "h": true}, {"x": "§227Ⅰ 準用給付遲延：定期催告補正，逾期依 §254 解除", "h": false}, {"x": "§493～§495 併述；§494但書不限本題（重要瑕疵、無須拆屋）", "h": false}, {"x": "家具20萬、醫療3萬屬固有利益損害（加害給付）", "h": true}, {"x": "依 §227Ⅱ 請求賠償合計23萬元", "h": false}, {"x": "§184Ⅰ前段（§193Ⅰ）侵權請求與 §227Ⅱ 競合，擇一行使", "h": false}, {"x": "慰撫金依 §227-1 準用 §195Ⅰ，不是 §227", "h": true}, {"x": "灼傷得請求慰撫金；家具屬財產損害不得請求", "h": true}], "mn": "瑕疵給付 → 催告補正、不補就解約 → 加害給付賠固有利益 → 人格靠 §227-1"}, {"id": "預26", "no": "預測題 26", "t": "詐欺撤銷與瑕疵擔保：賣方或仲介隱匿屋況", "lv": "", "k": "pred", "tier": 0, "g": "意思表示・行為能力・債總", "q": "甲出售其 A 屋，A 屋曾遭火災致主要樑柱受損，甲僅補強後重新粉刷，未做結構鑑定。買方丁看屋時，甲明白告知「屋況良好，從未有重大修繕」。丁因此以 2,000 萬元向甲購買，並已付清價金、完成移轉登記及交屋。一年三個月後，丁因整修發現真相。試問：（一）丁得否撤銷買賣之意思表示？撤銷後法律關係如何？（二）丁除撤銷外，得否併主張瑕疵擔保？兩者有何不同？（三）若不實說明者並非甲，而是甲委託之仲介丙擅自向丁保證「屋況良好」，甲對丙之說詞不知情，丁得否撤銷？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>詐欺，指故意以欺罔方法使他人陷於錯誤而為意思表示，被詐欺者得撤銷，撤銷後視為自始無效。物之瑕疵擔保，指出賣人應擔保標的物於危險移轉時無減少價值或通常效用之瑕疵，並具有所保證之品質。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第92條第1項</span>（詐欺撤銷、第三人詐欺）；<span class=\"art\">第93條</span>（撤銷期間）；<span class=\"art\">第114條第1項</span>；<span class=\"art\">第179條</span>；<span class=\"art\">第767條第1項</span>；<span class=\"art\">第354條</span>（物之瑕疵擔保）；<span class=\"art\">第359條</span>（解除或減價）；<span class=\"art\">第360條</span>（損害賠償）；<span class=\"art\">第365條</span>（行使期間）；<span class=\"art\">第184條第1項前段</span>。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丁得否撤銷及撤銷後之關係</p><p>依<span class=\"art\">第92條第1項</span>，被詐欺而為意思表示者得撤銷；依<span class=\"art\">第93條</span>，應於發見詐欺後一年內為之。本題中，甲明知樑柱受損仍稱屋況良好，屬故意欺罔，丁得撤銷；丁於一年三個月後始發見，期間自發見時起算，未逾期。依<span class=\"art\">第114條第1項</span>自始無效，丁得依<span class=\"art\">第179條</span>請求返還價金，甲得依<span class=\"art\">第767條第1項</span>或<span class=\"art\">第179條</span>請求返還A屋。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護表意人意思自由。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得否併主張瑕疵擔保及區別</p><p>依<span class=\"art\">第354條</span>，出賣人應擔保物無減少價值或通常效用之瑕疵。本題中，樑柱受損屬瑕疵，甲故意不告知，丁得依<span class=\"art\">第359條</span>解除或減價、依<span class=\"art\">第360條</span>請求賠償。依實務見解，瑕疵擔保不排除詐欺撤銷，得擇一或先位／備位主張；撤銷使契約自始無效，瑕疵擔保以契約有效為前提；期間上撤銷為發見後一年，瑕疵擔保依<span class=\"art\">第365條</span>僅適用交付後五年。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>二者規範目的不同。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）仲介丙詐欺時得否撤銷</p><p>依<span class=\"art\">第92條第1項但書</span>，詐欺係由第三人所為者，以相對人明知其事實或可得而知者為限，始得撤銷之。本題中，本文認丙屬第三人，甲不知情，丁不得以丙之詐欺撤銷；惟甲明知瑕疵而沉默，依實務見解構成詐欺，丁仍得以甲之詐欺撤銷，並得依<span class=\"art\">第184條第1項前段</span>向丙請求賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>居間人非相對人之意思表示輔助人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）丁得於發見後一年內撤銷，買賣自始無效，雙方互負返還義務。（二）丁亦得依<span class=\"art\">第354條</span>、<span class=\"art\">第359條</span>、<span class=\"art\">第360條</span>主張瑕疵擔保，兩者效果與期間不同，得擇一或先位／備位主張。（三）丁不得以丙之詐欺撤銷，但得以甲沉默之詐欺撤銷。</p>"], "ck": [{"x": "§92Ⅰ 被詐欺而為意思表示者得撤銷", "h": false}, {"x": "§93 詐欺自發見時起一年內撤銷（脅迫自終止時起）；自意思表示後十年", "h": true}, {"x": "甲親自保證屋況良好＝詐欺；撤銷後自始無效（§114Ⅰ）並返還", "h": false}, {"x": "§354・§359・§360 樑柱受損屬瑕疵，故意不告知得請求損害賠償", "h": false}, {"x": "撤銷與瑕疵擔保得擇一（或先位撤銷、備位擔保），並比較效果與期間", "h": true}, {"x": "仲介丙詐欺、甲不知情 → 本文認丙屬第三人，不得以丙之詐欺撤銷（§92Ⅰ但書）", "h": true}, {"x": "甲明知重大瑕疵而沉默＝不作為詐欺（實務：有告知義務之沉默），丁仍得撤銷", "h": true}, {"x": "（三）仍得對甲主張瑕疵擔保，並依 §184 對丙請求賠償", "h": true}], "mn": "甲親口騙 → 發見後一年可撤 → 同時是瑕疵可併用 → 仲介騙、甲不知不能以丙之詐欺撤 → 甲沉默也是詐欺仍可撤 → 另找甲擔保、丙侵權"}, {"id": "預28", "no": "預測題 28", "t": "債權人代位權：買受人代位前手請求移轉登記", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "乙向丙購買 A 地，價金已付清，丙亦已交付占有，但雙方尚未辦理移轉登記。乙隨後將 A 地轉賣予甲，甲已付大部分價金並取得占有，乙卻因與丙失聯，怠於請求丙辦理移轉登記，亦別無其他財產。試問：（一）甲得否以自己名義，行使乙對丙之登記請求權？（二）如得行使，甲得請求丙將 A 地登記於何人名下？（三）若甲對乙僅有一筆借款債權，而乙資力充足，結論有何不同？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>債權人代位權指債務人怠於行使其權利，債權人為保全債權，得以自己之名義，行使債務人之權利。其效果歸屬於債務人，債權人不得直接取得。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第242條</span>（代位權）、<span class=\"art\">第243條</span>（債務人負遲延始得行使；保存行為除外）、<span class=\"art\">第348條第1項</span>（出賣人移轉所有權義務）、<span class=\"art\">第758條第1項</span>（登記生效）、<span class=\"art\">第767條第1項</span>（所有物返還）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲得代位行使</p><p>依<span class=\"art\">第242條</span>，債務人怠於行使其權利時，債權人因保全債權，得以自己之名義，行使其權利；依<span class=\"art\">第243條</span>，須債務人負遲延責任，但專為保存債務人權利之行為，不在此限。本題中，甲對乙有移轉A地所有權之債權，乙對丙有移轉登記之債權；乙失聯怠於請求，又無其他財產，甲之登記請求權將無法實現，有保全必要，且非專屬於乙。依實務見解，保全特定債權不以債務人無資力為限。乙已屆期未履行者，甲得代位；未屆期者，僅得為保存行為，例如中斷時效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免甲之特定債權落空。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）應請求丙登記於乙名下</p><p>依<span class=\"art\">第242條</span>，代位係行使債務人之權利，效果歸屬債務人。本題中，甲不得請求丙直接登記於甲名下，否則成為登記之省略，應請求丙依<span class=\"art\">第758條第1項</span>移轉登記予乙，再依<span class=\"art\">第348條第1項</span>請求乙移轉予甲。甲受登記前尚非所有人，不得依<span class=\"art\">第767條第1項</span>行使物上請求權。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代位之效果歸屬債務人。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲不得代位</p><p>依<span class=\"art\">第242條</span>，代位須以保全債權為必要。本題中，甲為金錢債權，乙資力充足，債權有受清償之可能，無保全必要。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免干涉債務人自由。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙對甲已負遲延責任時（<span class=\"art\">第243條</span>），甲得依<span class=\"art\">第242條</span>代位乙請求丙移轉登記。（二）應登記於乙名下，再由乙移轉予甲。（三）甲僅有借款債權而乙資力充足，無保全必要，不得代位。</p>"], "ck": [{"x": "§242：怠於行使、以自己名義、保全債權、專屬權除外（但書）", "h": true}, {"x": "§243：債務人負遲延責任始得代位；專為保存債務人權利之行為不在此限", "h": true}, {"x": "甲對乙有買賣債權，乙對丙有登記請求權且怠於行使", "h": false}, {"x": "保全特定債權不以債務人無資力為限（實務見解）", "h": false}, {"x": "乙已遲延（§243）時，甲得以自己名義代位乙請求丙移轉登記", "h": false}, {"x": "代位效果歸乙：登記於乙名下，再由乙移轉予甲，不得直接登記給甲", "h": true}, {"x": "金錢債權＋乙有資力＝無保全必要（特定債權與金錢債權不同）", "h": true}, {"x": "（三）不得代位", "h": false}], "mn": "債務人懶得討 → 債權人替他討 → 特定債權不問資力 → 討回先登記給乙 → 金錢債權乙有錢就不必代位"}, {"id": "預36", "no": "預測題 36", "t": "連帶債務：對外請求、免責事由與內部求償", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲、乙、丙共同向丁借款 1,200 萬元購買共有之 A 地，三人於借款契約中明示「各負全部給付之責任」，約定內部平均分擔。借款到期後，丁先向甲請求全部清償。試問：（一）丁得向何人請求？範圍如何？（二）若丙清償全部 1,200 萬元，丙得向甲、乙如何求償？（三）若乙無資力，無法償還其分擔額，結果如何？（四）若丁在丙清償前，向乙表示免除其債務，而無消滅全部債務之意思，其效力如何？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>連帶債務，指數人負同一債務，明示對債權人各負全部給付之責任，或依法律規定成立者。求償權，指清償之債務人向他債務人請求償還分擔額之權利。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第272條第1項</span>（明示連帶）、<span class=\"art\">第273條第1項</span>（債權人之請求）；<span class=\"art\">第274條</span>（清償絕對效力）、<span class=\"art\">第280條</span>（平均分擔）、<span class=\"art\">第281條</span>（求償及承受債權）；<span class=\"art\">第282條第1項</span>（不能償還之分擔）；<span class=\"art\">第276條第1項</span>（免除）、<span class=\"art\">第279條</span>（相對效力）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）丁得向任一人請求全部</p><p>依<span class=\"art\">第273條第1項</span>，連帶債務之債權人，得對於債務人中之一人或數人或其全體，同時或先後請求全部或一部之給付。本題中，三人明示各負全部給付責任，依<span class=\"art\">第272條第1項</span>成立連帶債務，丁向甲請求1,200萬元於法有據，甲不得以內部分擔額對抗。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>強化債權擔保。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙得向甲、乙各求償400萬元及利息</p><p>依<span class=\"art\">第274條</span>，丙清償後甲、乙同免責任；依<span class=\"art\">第281條第1項</span>，得向他債務人請求償還各自分擔之部分，並自免責時起之利息。本題中，依<span class=\"art\">第280條</span>內部平均分擔，丙得向甲、乙各請求400萬元及利息，並承受丁之債權（<span class=\"art\">第281條第2項</span>）。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>內部依分擔額負責。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙得向甲求償600萬元</p><p>依<span class=\"art\">第282條第1項</span>，連帶債務人中之一人不能償還其分擔額者，由求償權人與他債務人按照比例分擔之。本題中，乙不能償還之400萬元由甲、丙各再分擔200萬元，丙實際向甲求償600萬元；</p><p class=\"evx\"><span class=\"evt\">理由</span><span>風險由全體分擔。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）甲、丙減為負擔800萬元</p><p>依<span class=\"art\">第276條第1項</span>，債權人向一人免除債務，而無消滅全部債務之意思表示者，除該債務人應分擔之部分外，他債務人仍不免其責任。本題中，丁免除乙，甲、丙債務由1,200萬元減為800萬元，此為<span class=\"art\">第279條</span>之例外。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>免除僅於分擔額內生效。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）丁得向任一人、數人或全體請求全部或一部，向甲請求全部有理由。（二）丙得向甲、乙各求償400萬元並加計自免責時起之利息。（三）乙不能償還部分由甲、丙按比例分擔，丙得向甲求償600萬元。（四）免除僅於乙之分擔額400萬元範圍內使甲、丙免責，甲、丙仍負800萬元。</p>"], "ck": [{"x": "§272 明示成立連帶；§273 債權人得向任一人請求全部", "h": true}, {"x": "甲不得以內部分擔 400 萬對抗丁", "h": false}, {"x": "§274 一人清償，他債務人同免責任", "h": false}, {"x": "§280、§281：丙向甲乙各求償 400 萬＋自免責時起利息＋承受丁之債權", "h": true}, {"x": "§282Ⅰ 乙無資力由甲丙按比例分擔，丙向甲得求償 600 萬", "h": true}, {"x": "§276Ⅰ 免除僅扣該債務人應分擔部分（§279 之例外）", "h": true}, {"x": "免除乙：甲丙仍負 800 萬", "h": false}], "mn": "對外全部 → 清償同免 → 對內各 400＋利息 → 乙沒錢甲丙分 → 免除只扣乙那份"}, {"id": "預38", "no": "預測題 38", "t": "行為能力：未成年人購車、詐術與受監護宣告", "lv": "", "k": "pred", "tier": 0, "g": "意思表示・行為能力・債總", "q": "甲現年 16 歲，未得父母同意，以其打工存款 30 萬元與賣方乙簽訂中古機車買賣契約，總價 60 萬元，其中 30 萬元已付，尚欠 30 萬元。甲簽約時口頭向乙表示「我已滿 18 歲」。另甲之同學丙，年滿 20 歲，因精神障礙，經法院為監護宣告，丙於宣告後自行與丁簽訂 A 屋買賣契約。試問：（一）甲與乙之買賣契約效力如何？乙得如何自保？（二）若乙於簽約時知悉甲為未成年且未得父母同意，乙得否撤回？（三）甲之謊稱滿 18 歲，是否影響契約效力？（四）丙與丁之買賣契約效力如何？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>行為能力，指得以自己之行為取得權利或負擔義務之資格。未滿七歲之未成年人及受監護宣告之人無行為能力；滿七歲以上之未成年人為限制行為能力人；現行法滿十八歲為成年。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第12條</span>（成年）；<span class=\"art\">第13條第2項</span>（限制行為能力）；<span class=\"art\">第15條</span>（受監護宣告無行為能力）；<span class=\"art\">第75條</span>（意思表示無效）；<span class=\"art\">第76條</span>（法定代理）；<span class=\"art\">第77條</span>（應得允許）；<span class=\"art\">第79條</span>（契約須經承認）；<span class=\"art\">第80條</span>（催告）；<span class=\"art\">第82條</span>（撤回及但書）；<span class=\"art\">第83條</span>（詐術）；<span class=\"art\">第84條</span>（允許處分之財產）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲與乙之契約效力</p><p>依<span class=\"art\">第77條</span>，限制行為能力人為意思表示應得法定代理人允許；依<span class=\"art\">第79條</span>，未得允許之契約須經承認始生效力。本題中，甲16歲為限制行為能力人（<span class=\"art\">第12條</span>、<span class=\"art\">第13條第2項</span>），購買60萬元機車非純獲法律上利益，亦非日常生活所必需，總價已逾存款，難認屬<span class=\"art\">第84條</span>之財產，契約效力未定；乙得依<span class=\"art\">第80條</span>定一個月以上期限催告，逾期未確答視為拒絕承認，或依<span class=\"art\">第82條</span>於承認前撤回。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護未成年人。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙明知甲未成年且未得允許</p><p>依<span class=\"art\">第82條但書</span>，訂立契約時知其未得有允許者，不得撤回。本題中，乙明知甲未成年且未得允許，不得撤回，僅得依<span class=\"art\">第80條</span>催告。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>明知之相對人無信賴可保護。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）單純口頭謊稱成年不構成詐術，契約仍效力未定</p><p>依<span class=\"art\">第83條</span>，用詐術使人信其為有行為能力人者，其法律行為有效。單純口頭謊稱是否為詐術，有肯定、否定二說，本文採否定說。本題中，甲僅口頭表示已滿18歲，未出示偽造證件等積極欺罔手段，不構成詐術，契約仍效力未定。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第83條</span>為例外規定，應從嚴解釋。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）丙與丁之契約</p><p>依<span class=\"art\">第15條</span>，受監護宣告之人無行為能力；依<span class=\"art\">第75條</span>，其意思表示無效。本題中，丙自行與丁簽約，確定無效，不因事後承認補正，應由法定代理人依<span class=\"art\">第76條</span>代為。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護無行為能力人。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲乙買賣契約效力未定，乙得依<span class=\"art\">民法第80條</span>催告或依<span class=\"art\">第82條</span>撤回。（二）乙明知甲未得允許，依<span class=\"art\">第82條但書</span>不得撤回，僅得催告。（三）採否定說，單純口頭謊稱成年不構成詐術，契約仍效力未定；若出示偽造證件則構成詐術，契約有效。（四）丙為無行為能力人，與丁之契約無效。</p>"], "ck": [{"x": "§12・§13 18歲成年，甲16歲為限制行為能力人", "h": true}, {"x": "60萬機車非日常必需，未得允許＝效力未定", "h": true}, {"x": "§80 催告須定一個月以上期限", "h": true}, {"x": "§82但書：訂約時明知未得允許，不得撤回", "h": false}, {"x": "§83 詐術；本文採否定說：單純口頭謊稱不構成詐術，契約仍效力未定", "h": false}, {"x": "§15・§75 受監護宣告＝無行為能力，意思表示無效", "h": true}, {"x": "丙丁契約確定無效，不能承認補正", "h": false}], "mn": "16歲限制能力 → 契約未定 → 催告一個月或撤回 → 明知不撤回 → 口頭謊稱不算詐術 → 監護宣告無效"}, {"id": "預42", "no": "預測題 42", "t": "僱用人責任：受僱人執行職務侵權（§188）", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲為A不動產仲介公司之受僱經紀營業員，某日駕駛公司車輛載客戶看屋途中超速，撞傷行人乙，乙支出醫療費30萬元，並因住院休養減少收入10萬元。試問：（一）乙得向何人請求損害賠償？（二）A公司主張其選任甲時已審核駕照、平日亦舉辦安全講習，得否免責？（三）A公司賠償後，得否向甲求償？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>僱用人責任指受僱人因執行職務不法侵害他人之權利時，由僱用人與行為人連帶負損害賠償責任。其性質為推定過失責任，僱用人須自行舉證選任監督已盡相當注意始得免責；被害人因此不能受賠償時，法院得令僱用人負衡平責任；僱用人賠償後對受僱人有求償權。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第184條第1項前段</span>、第2項（侵權行為）、<span class=\"art\">第191條之2</span>（動力車輛）、<span class=\"art\">第193條第1項</span>（增加生活上需要）、<span class=\"art\">第216條第1項</span>（所失利益）；<span class=\"art\">第188條第1項</span>（連帶責任及免責）、<span class=\"art\">第188條第2項</span>（衡平責任）、<span class=\"art\">第188條第3項</span>（求償權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得向甲及A公司請求連帶賠償</p><p>依<span class=\"art\">第184條第1項前段</span>，因過失不法侵害他人之權利者負賠償責任。本題甲超速撞傷乙，乙並得依<span class=\"art\">第191條之2</span>及<span class=\"art\">第184條第2項</span>請求；醫療費屬增加生活上之需要（<span class=\"art\">第193條第1項</span>），減少收入屬所失利益（<span class=\"art\">第216條第1項</span>）。依<span class=\"art\">第188條第1項本文</span>，受僱人因執行職務侵權者，僱用人與行為人連帶負責；執行職務採客觀說。甲載客看屋途中駕駛公司車輛，外觀上屬執行職務。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>僱用人藉受僱人擴張活動而獲利，應承擔風險。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）原則上不得免責</p><p>依<span class=\"art\">第188條第1項但書</span>，僱用人須證明選任及監督已盡相當之注意，或縱加以相當之注意而仍不免發生損害，舉證責任在僱用人。本題審核駕照及講習屬一般性措施，不足證明對甲本次駕駛已盡相當監督。縱免責成立，依<span class=\"art\">第188條第2項</span>，法院得因乙之聲請，斟酌雙方經濟狀況，令A公司為全部或一部之賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧被害人保護與免責之衡平。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）得向甲求償</p><p>依<span class=\"art\">第188條第3項</span>，僱用人賠償損害時，對於為侵權行為之受僱人，有求償權。本題A公司賠償後得向甲求償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>損害終局應由實際侵權之甲負擔。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙得依<span class=\"art\">第184條第1項前段</span>向甲、依<span class=\"art\">第188條第1項本文</span>向A公司請求醫療費30萬元及減少收入10萬元，二人連帶負責。（二）A公司免責舉證原則上不成立；縱成立，法院仍得依<span class=\"art\">第188條第2項</span>令其負衡平責任。（三）A公司賠償後，得依<span class=\"art\">第188條第3項</span>向甲求償。</p>"], "ck": [{"x": "§184Ⅰ前段：甲過失侵害乙身體健康", "h": false}, {"x": "§193Ⅰ 醫療費＝增加生活上需要；§216Ⅰ 減少收入＝所失利益；另得依§191-2、§184Ⅱ", "h": false}, {"x": "「執行職務」採客觀說：看屋途中開公司車", "h": true}, {"x": "§188Ⅰ本文：僱用人與行為人連帶負責", "h": false}, {"x": "免責舉證責任在僱用人；審駕照＋一般講習不足", "h": true}, {"x": "§188Ⅱ：被害人聲請，法院斟酌經濟狀況令僱用人賠償", "h": false}, {"x": "§188Ⅲ：A賠償後得向甲求償", "h": false}], "mn": "甲過失侵權 → 執行職務看外觀 → 公司連帶 → 免責要公司自己證明 → 不能受償有衡平 → 賠完向員工求償"}, {"id": "預43", "no": "預測題 43", "t": "債權人撤銷權：無償贈與與有償脫產（§244）", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲積欠乙借款500萬元已屆清償期未還，甲名下唯一財產為A屋。試問：（一）甲為免A屋遭強制執行，將A屋無償贈與其子丙並辦妥移轉登記，乙得如何主張？（二）若甲係將A屋以低價出售予明知甲欲脫產之友人丁並移轉登記，丁旋即將A屋出售並移轉登記予不知情之戊，乙得如何主張？（三）乙之撤銷權有無行使期間之限制？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>債權人撤銷權指債務人所為有害及債權之行為，債權人得聲請法院撤銷，以回復債務人之責任財產。無償行為只須有害及債權即得撤銷；有償行為則須債務人行為時明知有損害於債權人之權利，且受益人於受益時亦知其情事。撤銷權須以訴行使。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第244條第1項</span>（無償行為之撤銷）、第2項（有償行為之撤銷）、第4項（回復原狀；善意轉得人除外）、<span class=\"art\">第245條</span>（撤銷權之行使期間）、<span class=\"art\">第759條之1第2項</span>（信賴登記之保護）、<span class=\"art\">第184條第1項後段</span>（故意背俗加損害）、<span class=\"art\">第185條第1項</span>（共同侵權連帶責任）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得撤銷贈與並命丙回復原狀</p><p>依<span class=\"art\">第244條第1項</span>，「債務人所為之無償行為，有害及債權者，債權人得聲請法院撤銷之」，不以受益人知情為要件。本題中，甲將唯一財產A屋無償贈與丙，有害及乙之債權，乙得聲請撤銷甲丙間之贈與及移轉登記，並依同條第4項本文聲請命丙塗銷登記。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>回復責任財產。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得撤銷甲丁行為，但不得命戊回復原狀</p><p>依<span class=\"art\">第244條第2項</span>，有償行為須債務人行為時明知有損害於債權人之權利，且受益人受益時亦知其情事。本題中，甲為脫產低價出售，丁明知其情，兩項主觀要件均具備，乙得聲請撤銷。惟依同條第4項但書，戊於轉得時不知有撤銷原因，乙不得請求戊塗銷登記，戊並受<span class=\"art\">第759條之1第2項</span>保護。乙對丁仍得依<span class=\"art\">第184條第1項後段</span>請求損害賠償，甲丁共同為之，依<span class=\"art\">第185條第1項</span>連帶負責。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）撤銷權受<span class=\"art\">第245條</span>期間限制</p><p>依<span class=\"art\">第245條</span>，撤銷權自債權人知有撤銷原因時起，一年間不行使，或自行為時起，經過十年而消滅。本題中，乙應於知悉時起一年內、行為起十年內起訴行使。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>此為除斥期間，不適用時效中斷。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙得依<span class=\"art\">第244條第1項</span>聲請撤銷甲丙間之贈與及移轉行為，並依同條第4項本文聲請命丙塗銷登記。（二）乙得依<span class=\"art\">第244條第2項</span>聲請撤銷甲丁間之有償行為；但戊為善意轉得人，依同條第4項但書，乙不得請求戊回復原狀，僅得請求甲丁連帶賠償。（三）撤銷權有期間限制，應依<span class=\"art\">第245條</span>於知有撤銷原因起一年內、行為起十年內行使。</p>"], "ck": [{"x": "§244Ⅰ：無償行為有害及債權即得撤銷（不問受益人知否）", "h": true}, {"x": "§244Ⅳ本文：並聲請命受益人回復原狀（塗銷登記）", "h": false}, {"x": "§244Ⅱ：有償行為須債務人明知＋受益人亦知", "h": true}, {"x": "戊轉得時不知 → §244Ⅳ但書不得命其回復原狀", "h": true}, {"x": "§245：知悉起1年、行為起10年", "h": false}, {"x": "撤銷權須聲請法院（起訴）行使", "h": false}], "mn": "無償害債就撤 → 有償要雙方知情 → 並請回復原狀 → 善意轉得人追不到 → 一年十年"}, {"id": "預44", "no": "預測題 44", "t": "法人：董事侵權、代表權限制與總會決議撤銷", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "A為社團法人，甲為其董事。（一）甲為A法人至銀行辦理業務途中，駕駛A法人之車輛不慎撞傷路人乙，乙得向何人請求賠償？（二）A法人章程規定：「董事代表法人簽訂逾新臺幣50萬元之契約，應經董事會同意。」甲未經董事會同意，即代表A法人與不知此項章程規定之丙簽訂80萬元之裝修契約，A法人得否以違反章程為由，主張該契約對其不生效力？（三）A法人召開社員總會時漏未通知社員丁，總會仍作成決議，丁得如何救濟？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>法人指依法律規定得享受權利、負擔義務之團體。董事為法人之代表機關，其因執行職務所為之行為即為法人之行為。總會為社團法人最高意思機關，決議程序有瑕疵者得撤銷，內容違法者無效。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第26條</span>（權利能力）、<span class=\"art\">第28條</span>（法人侵權連帶責任）、<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第191條之2</span>（侵權行為）、<span class=\"art\">第188條第1項但書</span>（僱用人免責）、<span class=\"art\">第27條第2項</span>、第3項（代表權及其限制）、<span class=\"art\">第56條第1項</span>、第2項（決議撤銷、無效）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得向甲及A法人請求連帶賠償</p><p>依<span class=\"art\">第28條</span>，法人對於其董事因執行職務所加於他人之損害，與該行為人連帶負賠償之責任。本題中，甲過失撞傷乙，依<span class=\"art\">第184條第1項前段</span>負責，駕駛動力車輛依<span class=\"art\">第191條之2</span>亦應賠償。甲係為A法人辦理業務途中肇事，屬執行職務，A法人依<span class=\"art\">第26條</span>得為責任主體，依<span class=\"art\">第28條</span>與甲連帶負責；<span class=\"art\">第28條</span>無<span class=\"art\">第188條第1項但書</span>之免責規定，A法人不得主張已盡選任監督之注意。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>董事之行為即法人之行為。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）A法人不得主張契約不生效力</p><p>依<span class=\"art\">第27條第2項</span>，董事就法人一切事務，對外代表法人；同條第3項，對於董事代表權所加之限制，不得對抗善意第三人。本題中，章程逾50萬元須經董事會同意之規定，係對代表權之限制；丙不知該規定，為善意第三人，80萬元契約對A法人仍生效力，A法人僅得對甲追究內部責任。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維護交易安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁得訴請撤銷決議</p><p>依<span class=\"art\">第56條第1項</span>，總會之召集程序違反法令或章程時，社員得於決議後三個月內請求法院撤銷其決議，但出席而未當場表示異議者，不在此限。本題中，漏未通知丁屬召集程序瑕疵，丁未出席，無但書情形；與同條第2項內容違法當然無效者不同。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧社員權益與團體自治。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙得依<span class=\"art\">第184條第1項前段</span>、<span class=\"art\">第191條之2</span>向甲、依<span class=\"art\">第28條</span>向A法人請求連帶賠償，A法人不得免責。（二）依<span class=\"art\">第27條第3項</span>，章程限制不得對抗善意之丙，契約對A法人有效。（三）丁得依<span class=\"art\">第56條第1項</span>，於決議後三個月內請求法院撤銷總會決議。</p>"], "ck": [{"x": "§28：法人對董事執行職務之損害與行為人連帶賠償，無免責規定", "h": true}, {"x": "董事為法人辦業務途中肇事＝執行職務", "h": false}, {"x": "§27Ⅲ：代表權限制不得對抗善意第三人", "h": true}, {"x": "丙善意 → 契約對A法人有效", "h": false}, {"x": "§56Ⅰ：程序瑕疵 → 決議後三個月內訴請撤銷；出席未異議者不得", "h": true}, {"x": "§56Ⅱ：內容違法 → 無效", "h": false}], "mn": "董事執行職務 → 法人連帶 → 章程限制不擋善意 → 程序瑕疵三月撤 → 內容違法當然無效"}, {"id": "預46", "no": "預測題 46", "t": "無因管理：適法管理費用償還與急迫危險之責任減輕", "lv": "", "k": "pred", "tier": 1, "g": "意思表示・行為能力・債總", "q": "甲出國期間，其房屋屋頂因颱風破損大量漏水。鄰居乙未受甲委託，亦無義務，即自行僱工修繕，支出費用10萬元；其中2萬元係乙順便將屋頂改鋪為甲曾明白表示反對之高價琉璃瓦之差價。乙於搶修時因一時不慎（輕過失）打破甲屋內花瓶一只。甲返國後拒絕償還任何費用，並請求乙賠償花瓶。試問：（一）乙得向甲請求償還多少費用？（二）乙應否賠償花瓶？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>無因管理，指未受委任，並無義務，而為他人管理事務。管理利於本人且不違反本人意思者為適法無因管理，管理人得請求償還必要或有益費用及利息；不合此要件者，本人之償還義務以所得利益為限。管理人為免除本人財產上急迫危險而為管理者，除有惡意或重大過失外，不負賠償之責。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第172條</span>（無因管理之成立）、<span class=\"art\">第173條第1項</span>（通知義務）、<span class=\"art\">第176條第1項</span>（適法管理之費用償還）、<span class=\"art\">第177條第1項</span>（不適法管理以所得利益為限）、<span class=\"art\">第174條第1項</span>（違反本人意思之無過失責任）；<span class=\"art\">第175條</span>（急迫危險之責任減輕）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙得請求8萬元及利息，2萬元差價不得請求</p><p>依<span class=\"art\">第176條第1項</span>，管理事務利於本人，並不違反本人明示或可得推知之意思者，得請求償還費用及自支出時起之利息；不合者依<span class=\"art\">第177條第1項</span>以本人所得之利益為限。本題中，乙未受委任並無義務而修繕，依<span class=\"art\">第172條</span>成立無因管理；修繕屋頂利於甲並合其可得推知之意思，乙得請求8萬元及利息，甲返國後拒絕不影響之。改鋪琉璃瓦違反甲明示之意思，甲已拒絕償還即不主張享有，乙不得請求2萬元，亦不得改依<span class=\"art\">第179條</span>請求，否則形成強迫得利。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以本人意思為界限。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙毋庸賠償花瓶</p><p>依<span class=\"art\">第175條</span>，管理人為免除本人之生命、身體或財產上之急迫危險，而為事務之管理者，對於因其管理所生之損害，除有惡意或重大過失者外，不負賠償之責。本題中，颱風致屋頂大量漏水，甲之房屋有持續受損之急迫危險，乙之搶修屬急迫管理，打破花瓶僅屬輕過失，不負賠償之責；甲改依<span class=\"art\">第184條第1項前段</span>請求，此項減輕亦應適用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>減輕急難管理人之注意義務、鼓勵救助。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙成立無因管理，修繕費8萬元屬適法管理，得依<span class=\"art\">第176條第1項</span>請求甲償還並附加自支出時起之利息；琉璃瓦差價2萬元違反甲明示之意思，依<span class=\"art\">第177條第1項</span>甲既不主張享有，乙不得請求。（二）乙係為免除甲財產上急迫危險而管理，僅有輕過失，依<span class=\"art\">第175條</span>不負賠償花瓶之責，甲改依侵權行為請求亦同。</p>"], "ck": [{"x": "§172：未受委任、並無義務、為他人管理事務", "h": false}, {"x": "§176Ⅰ：適法管理 → 必要或有益費用＋利息", "h": true}, {"x": "琉璃瓦違反甲明示意思 → 不適法部分", "h": true}, {"x": "§177Ⅰ：本人得享有利益，償還以所得利益為限", "h": false}, {"x": "甲不享有琉璃瓦利益時，乙亦不得改依 §179 請求（強迫得利）", "h": false}, {"x": "§175：急迫危險 → 除惡意或重大過失外不負賠償", "h": true}, {"x": "乙輕過失打破花瓶 → 不必賠", "h": false}, {"x": "§175 之責任減輕於甲依 §184 請求時亦適用", "h": false}], "mn": "沒人託也沒義務 → 無因管理 → 合意有益費用還 → 違意以得利為限 → 急迫搶修輕過失不賠"}, {"id": "105-一", "no": "105年第一題", "t": "消滅時效＋抵押權塗銷（§880）", "lv": "", "k": "off", "tier": 0, "g": "時效・相鄰・親屬繼承", "q": "甲向乙借款並以其所有不動產設定普通抵押權，逾20年未清償。甲死亡後，其繼承人丙發現該抵押權，主張借款債權及抵押權均已罹於消滅時效而消滅，訴請乙塗銷抵押權登記，有無理由？（25分）", "nq": 1, "b": ["<span class=\"blk-l\">一、意義</span><p>請求權原則上適用15年消滅時效。抵押權若於主債權罹於時效後永久存續，將使不動產權利長期不明確，有礙物之流通，民法乃規定主債權時效完成後，抵押權人應於一定期間內實行抵押權，逾期抵押權始歸消滅，兼顧債權人受償利益與物之流通安定。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第125條</span>（一般消滅時效15年）、<span class=\"art\">第128條</span>（自請求權可行使時起算）、<span class=\"art\">第144條第1項</span>（時效完成僅生抗辯權）；<span class=\"art\">第145條第1項</span>（時效消滅後仍得就抵押物取償）、<span class=\"art\">第880條</span>（時效完成後五年間不實行抵押權者消滅）；<span class=\"art\">第1148條第1項</span>（繼承人承受被繼承人權利義務）、<span class=\"art\">第767條第1項</span>中段（妨害除去請求權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）借款債權是否消滅</p><p>依<span class=\"art\">第125條</span>，請求權因15年間不行使而消滅；依<span class=\"art\">第144條第1項</span>，時效完成後，債務人得拒絕給付。本題中，甲逾20年未清償，借款債權已罹於時效，惟僅發生抗辯權，債權本身並不當然消滅；丙為甲之繼承人，繼受此抗辯權，僅得拒絕清償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>時效完成並非使債權消滅。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）抵押權是否消滅</p><p>依<span class=\"art\">第145條第1項</span>，以抵押權擔保之請求權雖經時效消滅，債權人仍得就其抵押物取償；惟依<span class=\"art\">第880條</span>，抵押權人於消滅時效完成後，五年間不實行其抵押權者，其抵押權消滅。本題中，時效依<span class=\"art\">第128條</span>自清償期起算，題未載中斷事由，15年時效完成後又已逾5年，乙亦未實行，抵押權依<span class=\"art\">第880條</span>消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免抵押權永久存續，有礙物之流通。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙訴請塗銷有無理由</p><p>依<span class=\"art\">第1148條第1項</span>，繼承人自繼承開始時承受被繼承人財產上之一切權利；依<span class=\"art\">第767條第1項</span>中段，所有人對於妨害其所有權者，得請求除去之。本題中，丙繼承取得該不動產所有權，抵押權既已消滅，其登記仍存在即妨害丙之所有權，丙得訴請乙塗銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>已消滅之權利登記構成對所有權之妨害。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲之借款債權雖已罹於15年消滅時效，依<span class=\"art\">第144條</span>僅生抗辯權，債權本身不消滅；惟時效完成後乙五年間未實行抵押權，依<span class=\"art\">第880條</span>抵押權消滅，丙繼承取得所有權，得依<span class=\"art\">第767條第1項</span>中段訴請乙塗銷抵押權登記，有理由。若乙已於五年內實行抵押權，則請求無理由。</p>"], "ck": [{"x": "§125：請求權 15 年不行使而消滅", "h": false}, {"x": "借款逾 20 年未清償，已罹 15 年時效", "h": false}, {"x": "§144Ⅰ：時效完成僅生抗辯權，債權不當然消滅", "h": false}, {"x": "§128 自請求權可行使時起算；§145Ⅰ 時效消滅後仍得就抵押物取償", "h": false}, {"x": "§880：時效完成後 5 年不實行，抵押權才消滅", "h": true}, {"x": "題示逾 20 年＝15 年時效＋5 年已屆滿（未約定清償期者另判斷起算點）", "h": true}, {"x": "請求權基礎：§1148Ⅰ 丙繼承所有權 → §767Ⅰ中段 除去妨害（塗銷登記）", "h": true}, {"x": "已逾 5 年乙未實行 → 抵押權消滅，丙請求有理由", "h": false}, {"x": "若乙已於 5 年內實行 → 抵押權未消滅（本題未見此情）", "h": false}], "mn": "15 年時效只生抗辯 → 再等 5 年不拍 → 抵押權才消滅 → 逾 20 年已屆 → 丙請求塗銷有理由"}, {"id": "99-二", "no": "99年第二題", "t": "同時死亡＋代位繼承＋拋棄繼承", "lv": "", "k": "off", "tier": 0, "g": "時效・相鄰・親屬繼承", "q": "甲男乙女為夫妻，育有丙丁，並收養戊。戊與己結婚生有A、B。甲乙戊同車同時死亡。甲遺產600萬如何繼承？丙曾向庚借款300萬後拋棄繼承，庚得否依詐害債權撤銷？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>數人同時遇難、不能證明死亡先後時，推定同時死亡，相互間不發生繼承關係。第一順序繼承人於繼承開始前死亡者，由其直系血親卑親屬代位繼承其應繼分，以維繼承公平。拋棄繼承溯及於繼承開始時生效，其性質屬身分行為。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第11條</span>（同時死亡推定）；<span class=\"art\">第1077條第1項</span>、第4項（養子女關係同婚生子女）；<span class=\"art\">第1138條</span>（法定繼承順序）；<span class=\"art\">第1140條</span>（代位繼承）；<span class=\"art\">第1141條</span>（按人數平均）；<span class=\"art\">第1174條</span>、<span class=\"art\">第1175條</span>（拋棄繼承及溯及效力）；<span class=\"art\">第1176條第1項</span>（拋棄者應繼分之歸屬）；<span class=\"art\">第244條第3項</span>（非以財產為標的之行為不得撤銷）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲遺產600萬元之繼承</p><p>依<span class=\"art\">第11條</span>，二人以上同時遇難，不能證明死亡先後時，推定同時死亡。本題中，甲、乙、戊同車同時死亡，互不繼承，乙、戊均不得繼承甲。依<span class=\"art\">第1138條</span>，由第一順序丙、丁繼承；戊之應繼分依<span class=\"art\">第1140條</span>由其子女A、B代位繼承，戊雖為養子，依<span class=\"art\">第1077條第1項</span>與婚生子女同（A、B如收養認可時已出生，依同條第4項判斷）；同時死亡者，通說及行政實務亦許代位。依<span class=\"art\">第1141條</span>原由丙、丁、戊股各200萬元；丙拋棄，依<span class=\"art\">第1175條</span>溯及生效，並依<span class=\"art\">第1176條第1項</span>歸屬其他同為繼承之人。其分配有按人數說與按股說，本文採按股說，丁、戊股各增100萬元。故丁得300萬元，A、B各得150萬元，丙為0，己非甲之直系血親卑親屬不得繼承。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>代位繼承人係承受被代位人之應繼分。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）庚得否撤銷丙之拋棄</p><p>依<span class=\"art\">第244條第3項</span>，債務人之行為非以財產為標的者，不適用債權人撤銷權之規定。本題中，丙向庚借款300萬元後依<span class=\"art\">第1174條</span>拋棄繼承，實務認拋棄繼承屬身分行為，庚不得依<span class=\"art\">第244條</span>撤銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>繼承與否涉及繼承人之人格自由，且庚本無期待以甲之遺產受償之正當基礎。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲、乙、戊推定同時死亡、互不繼承；甲之600萬元遺產，因丙拋棄繼承，由丁取得300萬元，A、B代位繼承戊之應繼分並承受丙拋棄之部分，各得150萬元。丙拋棄繼承屬身分行為，依<span class=\"art\">第244條第3項</span>不適用債權人撤銷權，庚不得撤銷。</p>"], "ck": [{"x": "§11 推定同時死亡，相互間不繼承", "h": false}, {"x": "乙、戊不繼承甲；第一順序為丙丁（§1138）", "h": false}, {"x": "§1140 戊之應繼分由A、B代位繼承", "h": false}, {"x": "§1141 原丙丁戊三股各200萬（A、B代位戊股），不是四人平分", "h": false}, {"x": "§1176Ⅰ 丙拋棄之應繼分歸丁及A、B（本文採按股說；另說按人數）", "h": true}, {"x": "丁300萬、A、B各150萬，丙0", "h": false}, {"x": "§1174、§1175 拋棄繼承溯及繼承開始時發生效力", "h": false}, {"x": "拋棄繼承屬身分行為，§244Ⅲ 不適用", "h": true}, {"x": "庚不得撤銷丙之拋棄", "h": false}], "mn": "同時死亡互不繼承 → 丙丁＋A、B代位戊 → 三股各200 → 丙拋棄按股歸丁與戊股 → 丁300、A、B各150 → 拋棄是身分行為，庚撤不了"}, {"id": "107-二", "no": "107年第二題", "t": "消滅時效vs除斥期間＋已登記不動產（釋字107）", "lv": "", "k": "off", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "消滅時效與除斥期間之區別何在？設甲有一筆登記在其名下之A地及一棟未辦理保存登記之B屋，於民國92年5月1日被乙擅自占用，甲直到107年10月25日始向乙請求返還，乙抗辯甲之請求權已罹於時效而消滅，其抗辯是否有理由？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>消滅時效係請求權人於法定期間內不行使請求權，期間經過後義務人取得拒絕給付之抗辯權；除斥期間則係法律對形成權行使所定之存續期間。已登記與未登記不動產之所有物返還請求權，原則上均適用消滅時效；惟依釋字第107號解釋，已登記不動產之權利狀態經登記公示而明確，其所有人之回復請求權不適用消滅時效，未辦保存登記之不動產則仍適用。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第125條</span>（一般消滅時效15年）；<span class=\"art\">第129條</span>（時效中斷事由）；<span class=\"art\">第144條</span>（時效完成後得拒絕給付）；<span class=\"art\">第767條第1項</span>（所有物返還請求權）；釋字第107號解釋（已登記不動產回復請求權不適用消滅時效）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）消滅時效與除斥期間之區別</p><p>依<span class=\"art\">第144條</span>，時效完成後，債務人得拒絕給付。本題中，二者區別如下：<span class=\"evli\">①對象：消滅時效適用於請求權，除斥期間適用於撤銷權、解除權等形成權；</span><span class=\"evli\">②效果：消滅時效完成僅生抗辯權，權利本身不消滅，除斥期間屆滿則權利當然消滅，法院得依職權審酌；</span><span class=\"evli\">③中斷：消滅時效得依<span class=\"art\">第129條</span>因請求、承認、起訴等而中斷，或因特定事由而不完成，除斥期間為不變期間，不得中斷或停止。</span></p><p class=\"evx\"><span class=\"evt\">理由</span><span>前者督促權利行使，後者使形成權之法律關係早日確定。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙之時效抗辯</p><p>依<span class=\"art\">第125條</span>，請求權因十五年間不行使而消滅；依釋字第107號解釋，已登記不動產所有人之回復請求權（<span class=\"art\">第767條</span>）不適用消滅時效。本題中，乙自92年5月1日占用至甲107年10月25日請求，已逾15年。A地已登記，甲之返還請求權不因時效而消滅，乙之抗辯無理由；B屋未辦保存登記，仍適用<span class=\"art\">第125條</span>，其請求權已罹於時效，乙得依<span class=\"art\">第144條</span>拒絕返還，抗辯有理由。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>登記之公示功能使已登記不動產無須以時效督促權利行使，未登記者則欠缺公示基礎。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>綜上，消滅時效適用於請求權、完成後僅生抗辯權且得中斷；除斥期間適用於形成權、屆滿後權利消滅且不得中斷。乙之時效抗辯應分別論斷：A地已登記，依釋字第107號解釋不適用消滅時效，乙之抗辯無理由；B屋未辦保存登記，甲逾15年始請求，乙之抗辯有理由。</p>"], "ck": [{"x": "消滅時效適用請求權，完成僅生抗辯權（§144）", "h": false}, {"x": "除斥期間適用形成權，屆滿權利本身消滅", "h": false}, {"x": "時效得中斷（§129）、不完成；除斥期間為不變期間", "h": false}, {"x": "§125 一般時效15年；§767 所有物返還請求權", "h": false}, {"x": "A地已登記：依釋字107號不適用時效，抗辯無理由", "h": true}, {"x": "B屋未保存登記：適用15年，自92年起已逾，抗辯有理由", "h": true}, {"x": "A、B須分別論斷，差異在登記的公示功能", "h": true}], "mn": "時效管請求權、除斥管形成權 → 已登記不罹時效 → 未登記適用十五年"}, {"id": "111-二", "no": "111年第二題", "t": "相鄰關係：鄰地使用＋越界建築", "lv": "", "k": "off", "tier": 2, "g": "時效・相鄰・親屬繼承", "q": "甲建商興建大樓，因基地條件限制，僅相鄰B地有空間可供工程車迴旋使用，B地所有人乙拒絕提供；工程完工後，相鄰C地所有人丙返國始發現甲之建物越界2平方公尺，主張拆屋還地。甲應如何主張其權利，並應如何負責？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>土地所有人因建築確有使用鄰地之必要者，民法賦予鄰地使用權，鄰地所有人受損害得請求償金；建築物越界者，若非因故意或重大過失，且鄰地所有人知其越界而不即提出異議，例外限制其拆除請求權，以避免資源浪費，改以金錢衡平雙方利益。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第792條</span>（鄰地使用權）；<span class=\"art\">第796條第1項</span>、第2項（越界建築、購買越界土地）；<span class=\"art\">第796條之1</span>（法院得免為移去）；<span class=\"art\">第767條第1項</span>（返還及除去妨害）；<span class=\"art\">第179條</span>（不當得利）；<span class=\"art\">第800條之1</span>（利用人準用）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲得否使用B地作工程車迴旋空間</p><p>依<span class=\"art\">第792條</span>，土地所有人因鄰地所有人在其地界或近旁營造建築物有使用其土地之必要，應許其使用；但因而受損害者，得請求償金。本題中，甲因基地條件限制，僅B地可供工程車迴旋，具使用必要，乙應許甲使用，不得逕行拒絕，受損害者得請求償金；乙仍拒絕，甲得訴請乙許其使用。甲若僅為受託興建之建商而非土地所有人，須依<span class=\"art\">第800條之1</span>準用。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧土地利用與鄰地權益。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）丙得請求拆屋還地及相當於租金之不當得利，甲僅得主張<span class=\"art\">第796條之1</span></p><p>依<span class=\"art\">第796條第1項</span>，非因故意或重大過失越界，且鄰地所有人知其越界而不即提出異議者，不得請求移去，但應支付償金。本題中，丙於完工後返國始發現越界，建築當時無從知悉，不該當後一要件，甲難援引本條免責；丙得依<span class=\"art\">第767條第1項前段</span>、中段請求返還土地並除去越界建物，並依<span class=\"art\">第179條</span>請求相當於租金之不當得利。甲如非故意越界，僅得依<span class=\"art\">第796條之1</span>請求法院斟酌公共利益及當事人利益，免為全部或一部之移去，此時丙得準用<span class=\"art\">第796條</span>請求償金或購買越界土地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span><span class=\"art\">第796條</span>二要件須同時具備。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>甲得依<span class=\"art\">民法第792條</span>請求使用B地供工程車迴旋，乙不得逕行拒絕，受損害者得請求償金。越界部分，丙於完工後始發現，不該當<span class=\"art\">第796條</span>，丙得依<span class=\"art\">第767條第1項</span>請求拆屋還地，並依<span class=\"art\">第179條</span>請求不當得利；甲如非故意越界，以越界僅2平方公尺，得依<span class=\"art\">第796條之1</span>請求法院免為移去，並負償金或購買土地之責。</p>"], "ck": [{"x": "§792：有使用鄰地必要，鄰地所有人應許使用，受損害得請求償金", "h": true}, {"x": "B地為唯一可迴旋空間，具必要性，乙不得拒絕，拒絕時甲得訴請許可", "h": false}, {"x": "§796Ⅰ：非因故意重大過失＋知其越界不即異議，兩要件須同時具備", "h": true}, {"x": "§796 以建築當時是否知其越界而不即異議為斷；丙完工後返國始發現，不該當 → 得拆屋還地", "h": false}, {"x": "請求權基礎：§767Ⅰ 拆屋還地＋§179 相當於租金之不當得利", "h": true}, {"x": "§796-1：法院斟酌公共利益及當事人利益，得免為全部或一部移去（故意除外）", "h": false}, {"x": "§796-1 法院免為移去時，丙得準用 §796 請求償金或以相當價額購買越界土地", "h": false}, {"x": "甲得使用B地；丙得依 §767Ⅰ 請求拆屋還地並依 §179 請求相當租金，甲如非故意僅得依 §796-1 請求法院免為移去", "h": false}], "mn": "鄰地應許使用給償金 → 越界兩要件齊才不拆 → 丙建築時不知 → 可拆 → 甲只能求 §796-1 免拆"}, {"id": "專練-三", "no": "申論專練卷① 申論三", "t": "贈與之任意撤銷＋歸扣與繼承人限定責任", "lv": "", "k": "mock", "tier": 2, "g": "時效・相鄰・親屬繼承", "q": "甲（配偶已歿）有子乙、女丙。（一）113 年甲以書面（未經公證）與乙約定，將 A 地無償贈與乙，尚未辦理移轉登記，甲旋即反悔，以書面通知乙撤銷，嗣將 A 地出售他人，價金已花用殆盡。甲之撤銷是否有效？（二）114 年 5 月，甲將 B 屋（時值 800 萬元）贈與丙並辦妥移轉登記，丙並非因結婚、分居或營業而受贈。114 年 12 月甲死亡，遺有現金 400 萬元，另積欠丁 600 萬元。乙主張 B 屋應加入遺產由兄妹平均分配；丁則請求乙、丙清償 600 萬元。試問乙、丁之主張有無理由？", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>贈與指一方以自己之財產無償給與他方，他方允受之契約。歸扣指繼承人於繼承開始前因結婚、分居或營業受有被繼承人之贈與，於分割時將贈與價額加入應繼遺產並由其應繼分中扣除。限定責任指繼承人對被繼承人之債務，以因繼承所得遺產為限負清償責任。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第406條</span>、<span class=\"art\">第408條</span>（任意撤銷及除外）、<span class=\"art\">第419條第1項</span>（撤銷之意思表示）；<span class=\"art\">第1138條</span>、<span class=\"art\">第1141條</span>（第一順序、平均繼承）、<span class=\"art\">第1173條第1項</span>（歸扣）；<span class=\"art\">第1148條第2項</span>（限定責任）、<span class=\"art\">第1148條之1第1項</span>（二年內受贈）、<span class=\"art\">第1153條</span>（連帶責任及內部分擔）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）撤銷有效</p><p>依<span class=\"art\">第408條第1項</span>，贈與物之權利未移轉前，贈與人得撤銷其贈與；同條第2項除外限於經公證或為履行道德上義務之贈與。本題A地尚未移轉登記，僅以書面而未經公證，亦非履行道德上義務；甲以書面通知乙，已依<span class=\"art\">第419條第1項</span>為意思表示。撤銷後出售A地係處分自己財產，乙不得請求移轉或賠償。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>書面不影響撤銷權。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙之主張無理由</p><p>依<span class=\"art\">第1173條第1項</span>，歸扣限於因結婚、分居或營業之贈與，丙非因此受贈，B屋不加入應繼遺產；<span class=\"art\">第1148條之1</span>僅為計算限定責任範圍而設。故遺產僅現金400萬元，依<span class=\"art\">第1141條</span>乙丙各分200萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>歸扣與限定責任功能不同。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丁得請求連帶清償，但乙以200萬元為限</p><p>依<span class=\"art\">第1148條第2項</span>、<span class=\"art\">第1153條第1項</span>，乙丙以所得遺產為限負連帶責任。乙限200萬元；丙之B屋係繼承開始前二年內受贈，依<span class=\"art\">第1148條之1第1項</span>視為所得遺產，限度1,000萬元，得就600萬元全額負責。內部依<span class=\"art\">第1153條第2項</span>各負擔300萬元，惟本文認乙內部分擔亦不逾200萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免乙以固有財產清償而架空限定責任。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲依<span class=\"art\">第408條第1項</span>、<span class=\"art\">第419條第1項</span>向乙撤銷，撤銷有效。（二）B屋非歸扣之贈與，乙主張無理由，遺產400萬元由乙丙各分200萬元。（三）丁得請求乙丙連帶清償600萬元，乙以200萬元為限，丙足以全額清償；內部分擔乙以200萬元為限，餘由丙負擔。</p>"], "ck": [{"x": "§408Ⅰ、Ⅱ：未移轉前得撤銷；例外只有經公證、履行道德上義務（書面不是例外）", "h": true}, {"x": "甲已書面通知乙（§419Ⅰ）→ 撤銷有效；嗣後出售 A 地乙無從主張", "h": false}, {"x": "§1173Ⅰ：歸扣限結婚、分居、營業之贈與", "h": true}, {"x": "§1148-1 只算清償責任，不把 B 屋加入分割；遺產 400 萬各 200 萬", "h": false}, {"x": "§1153Ⅰ：以因繼承所得遺產為限，對外負連帶責任", "h": false}, {"x": "§1148-1Ⅰ：繼承開始前二年內受贈 → 視為其所得遺產；丙限度 1,000 萬", "h": true}, {"x": "§1153Ⅱ 內部各 300 萬，但乙分擔不逾 200 萬（本文立場）", "h": false}], "mn": "未移轉未公證，贈與可撤銷 → 書面通知即生效 → 歸扣看婚分營 → 遺產四百各兩百 → 對外連帶以遺產為限 → 二年受贈只算債（丙到一千萬） → 內部各半但乙封頂兩百"}, {"id": "預04", "no": "預測題 04", "t": "遺囑與特留分：扣減遺贈", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "甲死亡，留下配偶乙、兒子丙、兒子丁，以及孫子己。己是甲另一個兒子戊的小孩；戊在甲死亡之前就已經過世。甲之遺產 1,200 萬元，甲生前以遺囑將全部遺產遺贈友人庚。試問：（一）乙、丙、丁、己之應繼分及特留分各為若干？（二）乙、丙、丁、己得如何主張？庚最後得受遺贈若干？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>應繼分指各繼承人對遺產之法定分配比例。特留分指被繼承人不得以遺囑處分、須為特定繼承人保留之部分。代位繼承指第一順序繼承人於繼承開始前死亡或喪失繼承權，由其直系血親卑親屬代位繼承其應繼分。扣減指特留分不足時，得由遺贈財產扣減之權利。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第1138條第1款</span>、<span class=\"art\">第1144條第1款</span>（配偶與直系血親卑親屬平均繼承）、<span class=\"art\">第1140條</span>（代位繼承）、<span class=\"art\">第1187條</span>（遺囑自由處分以不違反特留分為限）、<span class=\"art\">第1223條第1款</span>、第3款（直系血親卑親屬、配偶之特留分為應繼分二分之一）、<span class=\"art\">第1224條</span>（特留分之算定）、<span class=\"art\">第1225條</span>（扣減）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）應繼分各四分之一，特留分各150萬元</p><p>依<span class=\"art\">第1140條</span>，第一順序繼承人於繼承開始前死亡者，由其直系血親卑親屬代位繼承其應繼分；依<span class=\"art\">第1144條第1款</span>，配偶與第一順序繼承人同為繼承時，應繼分與他繼承人平均。本題中，戊於甲死亡前已過世，由己代位繼承，繼承人為乙、丙、丁、己共4人，應繼分各1/4，即300萬元。依<span class=\"art\">第1224條</span>，特留分由應繼財產中除去債務額算定，本題應繼財產1,200萬元、無債務；依<span class=\"art\">第1223條</span>，直系血親卑親屬及配偶之特留分各為應繼分二分之一，即各150萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>先算應繼分，再算特留分。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）四人各得扣減150萬元，庚得600萬元</p><p>依<span class=\"art\">第1187條</span>，遺囑人僅於不違反特留分之範圍內得自由處分遺產；依<span class=\"art\">第1225條</span>，應得特留分之人因遺贈致其應得之數不足者，「得按其不足之數由遺贈財產扣減之」。本題中，甲將全部遺產1,200萬元遺贈庚，四人均未取得任何遺產，各短少150萬元，乙、丙、丁、己得各向庚主張扣減150萬元，共計600萬元；庚最後得受遺贈1,200－600＝600萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>特留分保障法定繼承人最低生活與家庭倫理。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙、丙、丁、己（代位戊）應繼分各1/4即300萬元，特留分各為應繼分二分之一即150萬元。（二）乙、丙、丁、己得依<span class=\"art\">第1225條</span>各按不足之數150萬元向庚主張扣減，共計600萬元；庚最後得受遺贈600萬元。</p>"], "ck": [{"x": "§1140 戊先死，己代位其應繼分", "h": true}, {"x": "繼承人乙丙丁己共 4 人，各 1/4＝300 萬", "h": false}, {"x": "§1223 特留分為應繼分 1/2（不是全額）", "h": true}, {"x": "§1224 特留分以應繼財產除去債務額算定：1,200萬－0＝1,200萬", "h": false}, {"x": "特留分各 150 萬", "h": false}, {"x": "§1187 遺囑不得違反特留分；全遺贈庚致四人各短少 150 萬", "h": false}, {"x": "§1225 按不足之數由遺贈財產扣減；數人時按遺贈價額比例", "h": true}, {"x": "四人各扣減 150 萬共 600 萬，庚得受遺贈 600 萬", "h": false}], "mn": "己代位 → 四人平分 300 → 特留取半 150 → 全遺贈各扣 150 → 庚剩 600"}, {"id": "預06", "no": "預測題 06", "t": "剩餘財產分配：計算、追加與返還", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "甲乙為夫妻，未約定夫妻財產制，婚後育有一子。113 年甲乙協議離婚。離婚時，甲現存婚後財產 400 萬元（其中 100 萬元為婚後繼承父親所得），婚姻關係存續中所負債務 50 萬元；離婚前二年，甲無償贈與其弟丙 200 萬元。乙現存婚後財產 100 萬元，無負債。試問：（一）甲乙剩餘財產差額如何計算？乙得請求分配多少？（二）若甲財產不足清償乙之分配額，乙得如何主張？其請求權時效為何？（25分）", "nq": 2, "b": ["<span class=\"blk-l\">一、意義</span><p>剩餘財產分配請求權指法定財產制關係消滅時，夫妻就婚後財產扣除債務後之差額，由較少一方向較多一方請求平均分配。追加計算指為減少他方分配而於消滅前五年內處分之財產，視為現存婚後財產。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第1030條之1第1項</span>（差額平均分配；繼承除外）、第5項（時效）、<span class=\"art\">第1030條之3第1項</span>（追加計算）、第2項（對第三人請求返還）、第3項（時效）、<span class=\"art\">第1030條之4</span>（計價時點）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）差額350萬元，乙得請求175萬元</p><p>依<span class=\"art\">第1030條之1第1項</span>，現存婚後財產扣除婚姻關係存續所負債務後之剩餘差額，應平均分配，因繼承取得之財產除外；依<span class=\"art\">第1030條之3第1項</span>，為減少他方分配於消滅前五年內處分之婚後財產，應追加計算。本題中，甲400萬元扣除繼承100萬元為300萬元，扣債務50萬元為250萬元，加計贈與丙之200萬元為450萬元；乙100萬元，差額350萬元，乙得請求175萬元。依<span class=\"art\">第1030條之4</span>，現存財產以離婚時、追加財產以處分時為準。上開計算以贈與係為減少乙之分配且出自婚後財產為前提；不具備者不追加，差額150萬元，乙得請求75萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止一方處分財產減少他方分配。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）得對丙請求返還，時效二年／五年</p><p>依<span class=\"art\">第1030條之3第2項</span>，義務人不足清償時，權利人得就不足額對受領之第三人於其所受利益內請求返還，有償受領者以顯不相當對價為限。本題中，丙係無償受領，乙得於200萬元內請求返還。對甲之請求權依<span class=\"art\">第1030條之1第5項</span>，自知有差額時起二年、自離婚時起逾五年消滅；對丙之請求權依<span class=\"art\">第1030條之3第3項</span>，自知悉權利受侵害時起二年、自離婚時起逾五年消滅。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧配偶權益與法律安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）以贈與係為減少乙之分配且為婚後財產為前提，差額350萬元，乙得請求175萬元；不具備者差額150萬元，乙得請求75萬元。（二）甲不足清償時，乙得依<span class=\"art\">第1030條之3第2項</span>對丙於所受利益內請求返還；時效為知悉時起二年、離婚時起五年。</p>"], "ck": [{"x": "繼承所得100萬依 §1030-1Ⅰ但書排除", "h": true}, {"x": "扣除婚姻存續中債務50萬，甲為250萬", "h": false}, {"x": "§1030-3Ⅰ 五年內為減少分配之處分，追加計算200萬", "h": true}, {"x": "差額350萬平均分配，乙得請求175萬", "h": true}, {"x": "§1030-3 不足額對無償受領之丙於所受利益內請求返還", "h": false}, {"x": "時效 §1030-1Ⅴ・§1030-3Ⅲ：知悉2年／關係消滅5年", "h": true}], "mn": "扣債務排繼承 → 追加五年內 → 差額對半分 → 不足找受贈 → 知悉二年、關係五年"}, {"id": "預33", "no": "預測題 33", "t": "相鄰關係：鷹架、挖掘、噪音與越界建築", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "甲在 A 地興建大樓，因施工需在地界旁搭設鷹架，事先請求鄰地所有人乙同意使用乙地一小塊空地，乙拒絕。甲仍進場搭設，施工期間並挖掘地基，致乙之 B 屋牆壁龜裂；大樓完工後，甲設於頂樓之機房日夜發出低頻噪音與振動。另甲所建大樓有 0.3 公尺越界至乙地，乙於完工半年後才發現，隨即提出異議。甲稱其越界係測量失誤，並非故意。試問：（一）乙得否拒絕甲使用其土地搭設鷹架？（二）乙對牆壁龜裂得主張何種權利？（三）乙得否禁止機房噪音與振動？（四）乙得否請求甲拆除越界部分？（25分）", "nq": 4, "b": ["<span class=\"blk-l\">一、意義</span><p>相鄰關係，指相鄰不動產所有人間，為調和使用利益，法律就所有權內容所設之限制與擴張。越界建築，指土地所有人建築房屋逾越地界。償金，指因容忍他人利用所受損害之補償，不同於損害賠償。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第792條</span>（鄰地使用及償金）；<span class=\"art\">第794條</span>（開掘不得損害鄰地）、<span class=\"art\">第184條第1項前段</span>、第2項（侵權行為）；<span class=\"art\">第793條</span>（喧囂振動之禁止）；<span class=\"art\">第796條</span>（越界建築）、<span class=\"art\">第796條之1</span>（法院得免為移去）；<span class=\"art\">第767條第1項</span>（物上請求權）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）乙不得拒絕，僅得請求償金</p><p>依<span class=\"art\">第792條</span>，鄰地所有人營造建築物有使用其土地之必要，應許鄰地所有人使用其土地，但因而受損害者，得請求償金。本題中，甲搭設鷹架有使用乙地之必要，乙不得拒絕；本文採容忍義務說，甲於必要範圍內使用並非不法，乙不得請求拆除。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>避免規範目的落空。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得請求損害賠償並防止</p><p>依<span class=\"art\">第794條</span>，開掘土地或為建築時，不得使鄰地之建築物受其損害。本題中，甲挖掘地基致乙屋龜裂，違反本條；本文認其屬保護他人之法律，乙得依<span class=\"art\">第184條第2項</span>請求賠償，甲須證明無過失始免責，另得依<span class=\"art\">第184條第1項前段</span>請求，並依<span class=\"art\">第767條第1項</span>請求防止。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>保護鄰地安全。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙得禁止噪音振動</p><p>依<span class=\"art\">第793條</span>，喧囂、振動侵入時得禁止之，但侵入輕微或按地方習慣認為相當者不在此限。本題中，機房噪音振動日夜持續，難認輕微，乙得禁止並依<span class=\"art\">第767條第1項</span>請求除去。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>維護居住安寧。</span></p></div><div class=\"evp\"><p class=\"evh\">（四）乙原則得請求移去，但法院得免為移去</p><p>依<span class=\"art\">第796條</span>，非因故意或重大過失越界，鄰地所有人知其越界而不即提出異議者，不得請求移去。本題中，甲係測量失誤，乙已即異議，得依<span class=\"art\">第767條第1項</span>請求拆除；惟甲非故意，法院得依<span class=\"art\">第796條之1第1項</span>免為移去，乙得請求償金或購買越界土地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧公共利益。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）乙不得拒絕甲搭設鷹架，僅得請求償金。（二）乙得依<span class=\"art\">第184條第2項</span>及第1項前段請求賠償，並請求防止。（三）乙得依<span class=\"art\">第793條</span>禁止並請求除去。（四）乙得請求拆除，但法院得依<span class=\"art\">第796條之1</span>免為移去，改以償金或購買土地處理。</p>"], "ck": [{"x": "§792：應許使用，受損害得請求償金（不是損害賠償）", "h": true}, {"x": "甲擅自進場：本文採容忍義務說，必要範圍內使用非不法，乙只能請求償金", "h": true}, {"x": "§794：開掘不得使鄰地建築物受損", "h": false}, {"x": "牆壁龜裂：本文認§794屬保護他人之法律→§184Ⅱ推定過失賠償（另§184Ⅰ前段）＋§767Ⅰ防止", "h": false}, {"x": "§793：侵入得禁止，輕微或地方習慣相當者除外", "h": true}, {"x": "低頻噪音日夜持續，難認輕微，乙得禁止", "h": false}, {"x": "甲非故意重過失、乙知悉即異議 → 未喪失移去請求權", "h": true}, {"x": "§796-1：法院得免移去；故意越界者不適用", "h": true}, {"x": "可請求移去，但法院得免移，改付償金或購買越界地", "h": false}], "mn": "鷹架容忍給償金 → 挖壞鄰屋要賠 → 噪音能禁（輕微除外）→ 越界先看故不故、異不異議，再看法院免拆"}, {"id": "預34", "no": "預測題 34", "t": "袋地通行：分割讓與、任意行為、償金與開設道路", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "丙原有一筆 A 地，緊鄰公路，面積約 300 坪。丙將 A 地分割為 A1（臨公路）與 A2（在後方），並將 A2 賣給甲，自己保留 A1，致 A2 與公路無適宜聯絡。另甲所有 B 地原有一條通往公路之小徑，甲為興建農舍，自行以鐵皮將小徑封閉，致 B 地亦無通路。試問：（一）甲就 A2 得否通行 A1？是否須支付償金？（二）甲就 B 地得否主張通行周圍地？（三）若甲在 A2 通行時必要開設水泥道路，通行地損害過鉅，丙得如何主張？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>袋地指與公路無適宜聯絡，致不能為通常使用之土地；袋地通行權指袋地所有人得通行周圍地以至公路之權利。因任意行為所生之袋地，不得主張通行；因一部讓與或分割所生者，僅得通行讓與人、受讓人或他分割人之地，且無須支付償金。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第787條第1項</span>（通行權及任意行為排除）、<span class=\"art\">第787條第2項</span>（償金）；<span class=\"art\">第788條第1項</span>（開設道路）、<span class=\"art\">第788條第2項</span>（損害過鉅請求購買）；<span class=\"art\">第789條第1項</span>（分割讓與之通行）、<span class=\"art\">第789條第2項</span>（無須償金）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）得通行A1，無須償金</p><p>依<span class=\"art\">第789條第1項</span>，因土地一部之讓與或分割而成袋地者，土地所有人僅得通行受讓人或讓與人或他分割人之所有地；依同條第2項，有通行權人，無須支付償金。本題A2因丙分割讓與而成袋地，甲僅得通行丙之A1，且無須支付償金。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>袋地係讓與人自行造成，不應使周圍第三人受累。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）不得通行</p><p>依<span class=\"art\">第787條第1項</span>，土地與公路無適宜之聯絡時，除因土地所有人之任意行為所生者外，得通行周圍地以至公路。本題甲自行以鐵皮封閉小徑，屬任意行為所生之袋地，不得主張通行周圍地。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>不得令鄰地所有人為其任意行為負擔通行義務。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）丙得請求甲購買</p><p>依<span class=\"art\">第788條第1項</span>，有通行權人於必要時得開設道路，但應支付償金；同條第2項，致通行地損害過鉅者，通行地所有人得請求有通行權人以相當價額購買通行地及畸零地。本題開設道路係通行之方法，其償金依<span class=\"art\">第789條第2項</span>免除。至得否請求購買，否定說認與無償通行意旨不符；肯定說認購買係對價交換而非償金，且<span class=\"art\">第788條</span>之有通行權人未限於<span class=\"art\">第787條</span>。本文採肯定說，價額由當事人協議，不能協議者請求法院判決。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>損害過鉅若令丙長期承受，所有權將形同虛設。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲僅得通行丙之A1，無須支付償金。（二）B地無通路係甲之任意行為所致，不得主張通行周圍地。（三）開設道路之償金依<span class=\"art\">第789條第2項</span>免付；惟致通行地損害過鉅時，本文採肯定說，丙得依<span class=\"art\">第788條第2項</span>請求甲以相當價額購買通行地及因此形成之畸零地。</p>"], "ck": [{"x": "§789 分割讓與只能通行讓與人／受讓人／他分割人之地，無須償金", "h": true}, {"x": "甲只能通行A1且免償金，不得任選周圍地", "h": true}, {"x": "§787Ⅰ（任意行為除外）：任意行為所生之袋地不得通行", "h": false}, {"x": "B地自封小徑＝任意行為，不得主張通行", "h": true}, {"x": "§788Ⅰ 必要時得開設道路（§789 通行權人依 §789Ⅱ 免償金）；Ⅱ 損害過鉅得請求購買", "h": false}, {"x": "本文採肯定說：§788Ⅱ 購買請求不在 §789Ⅱ 免除之列，丙得請求購買", "h": true}], "mn": "分割讓與 → 只走讓與人的地、免償金 → 自己封路不能主張 → 開路損害太大，丙要你買"}, {"id": "預41", "no": "預測題 41", "t": "婚後財產處分：夫妻財產制、撤銷權與追加計算", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "甲乙為夫妻，未約定夫妻財產制。甲婚後以自己薪資購入 A 屋（登記於甲名下），價值 2,000 萬元。婚姻關係存續中，甲為避免與乙離婚時須分配財產，於 113 年未經乙同意，將 A 屋以 800 萬元出售予其弟丙（市價 2,000 萬元），丙明知甲欲脫產。乙於 114 年發現，提起訴訟請求離婚並主張剩餘財產分配。試問：（一）甲未經乙同意出售 A 屋，有無處分權？（二）乙得如何主張保障其權利？（三）乙得否請求丙返還？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>法定財產制指夫妻未約定財產制時所適用之財產制；婚後財產指婚姻關係存續中取得之財產，由夫妻各自所有、各自處分。剩餘財產分配請求權指法定財產制消滅時，就婚後財產差額由少者向多者請求平均分配之權利。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第1017條第1項</span>、<span class=\"art\">第1018條</span>（各自所有、各自處分）；<span class=\"art\">第1020條之1第2項</span>（有償行為之撤銷）、<span class=\"art\">第1020條之2</span>（撤銷權之期間）、<span class=\"art\">第1010條第1項第5款</span>（宣告改用分別財產制）、<span class=\"art\">第1022條</span>（報告義務）；<span class=\"art\">第1030條之1</span>（剩餘財產分配）、<span class=\"art\">第1030條之3</span>（追加計算與請求返還）、<span class=\"art\">第1030條之4</span>（價值計算）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲有處分權，出售有效</p><p>依<span class=\"art\">第1018條</span>，「夫或妻各自管理、使用、收益及處分其財產」。本題中，A屋為甲婚後以薪資取得之婚後財產，甲出售A屋不須乙同意。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>夫妻財產各自獨立。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）乙得聲請撤銷，並得請求改用分別財產制</p><p>依<span class=\"art\">第1020條之1第2項</span>，有償行為於行為時明知有損於他方之剩餘財產分配請求權，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷。本題中，甲以800萬元出售市價2,000萬元之A屋，丙明知脫產，乙得聲請撤銷，惟須於<span class=\"art\">第1020條之2</span>期間內行使，本題可能已逾一年。乙並得依<span class=\"art\">第1010條第1項第5款</span>請求改用分別財產制，依<span class=\"art\">第1022條</span>請求甲報告。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>防止不當減少婚後財產。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）乙得對丙於所受利益1,200萬元內請求返還</p><p>依<span class=\"art\">第1030條之3</span>，消滅前五年內為減少他方分配而處分者，應追加計算；不足清償時，得對受領之第三人於所受利益內請求返還，有償者以顯不相當對價為限。本題中，800萬元與2,000萬元差距甚大，屬顯不相當；依<span class=\"art\">第1030條之4第2項</span>以處分時價值計算，丙所受利益為1,200萬元。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>另闢撤銷權以外之路徑，兩者擇一主張。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲有處分權，無須乙同意。（二）乙得依<span class=\"art\">第1020條之1第2項</span>聲請撤銷（須於<span class=\"art\">第1020條之2</span>期間內），並得依<span class=\"art\">第1010條</span>請求改用分別財產制。（三）甲不足清償時，乙得依<span class=\"art\">第1030條之3第2項</span>對丙於所受利益1,200萬元內請求返還。</p>"], "ck": [{"x": "§1017・§1018 婚後財產各自所有、各自處分", "h": true}, {"x": "甲有處分權，不須乙同意，出售有效", "h": false}, {"x": "§1020-1Ⅱ 有償行為須甲明知＋受益人丙亦知，乙得聲請撤銷", "h": true}, {"x": "§1010Ⅰ⑤ 不當減少婚後財產，得請求改用分別財產制", "h": true}, {"x": "§1030-3 五年內處分追加計算；不足時對第三人請求返還", "h": true}, {"x": "800萬對2,000萬為顯不相當對價", "h": false}, {"x": "甲不足清償時，丙須於所受利益內返還", "h": false}], "mn": "各自處分不須同意 → 脫產可撤銷（有償雙方知情）＋改分別財產制 → 五年內追加 → 顯不相當找丙還"}, {"id": "預49", "no": "預測題 49", "t": "婚約與結婚：不得強迫履行、形式要件與撤銷婚姻", "lv": "", "k": "pred", "tier": 1, "g": "時效・相鄰・親屬繼承", "q": "甲男、乙女均已成年，雙方訂定婚約，甲並因訂婚贈送乙金飾一套。（一）其後甲乙合意解除婚約，甲得否請求乙返還金飾？若甲乙未解除婚約，而乙單方反悔不願結婚，甲得否訴請法院判命乙履行婚約？（二）假設甲乙並未解除婚約，而是舉行婚宴、宴請親友並開始同居，但未作成書面、亦未辦理結婚登記，其婚姻效力如何？（三）甲其後與17歲之丙女以書面、二人證人簽名辦理結婚登記，假設戶政機關誤予受理登記，甲丙之婚姻效力如何？丙之法定代理人得否請求撤銷？若丙已年滿18歲才提起訴訟呢？（25分）", "nq": 3, "b": ["<span class=\"blk-l\">一、意義</span><p>婚約指男女約定將來結婚之契約，不得請求強迫履行；因訂婚約而為之贈與，婚約解除時得請求返還。結婚須書面、二人以上證人簽名及結婚登記，欠缺者無效；未達結婚年齡者得撤銷。</p>", "<span class=\"blk-l\">二、法條</span><p><span class=\"art\">民法第975條</span>（不得強迫履行）、<span class=\"art\">第976條</span>（解除事由）、<span class=\"art\">第978條</span>、<span class=\"art\">第979條第1項</span>（賠償）、<span class=\"art\">第979條之1</span>（贈與返還）、<span class=\"art\">第980條</span>、<span class=\"art\">第989條</span>（未達年齡得撤銷）、<span class=\"art\">第982條</span>、<span class=\"art\">第988條第1款</span>（方式欠缺無效）、<span class=\"art\">第985條</span>（重婚）、<span class=\"art\">第998條</span>（不溯及既往）。</p>", "<span class=\"blk-l\">三、涵攝</span><div class=\"evp\"><p class=\"evh\">（一）甲得請求返還金飾，不得訴請強迫履行</p><p>依<span class=\"art\">第979條之1</span>，因訂定婚約而為贈與者，婚約解除時得請求返還；依<span class=\"art\">第975條</span>，婚約，不得請求強迫履行。本題中，甲乙合意解除婚約，甲得請求返還金飾。乙單方反悔，甲不得訴請判命乙履行；惟乙無<span class=\"art\">第976條</span>之理由違反婚約，甲得依<span class=\"art\">第978條</span>請求賠償，非財產上損害依<span class=\"art\">第979條第1項</span>以甲無過失為限。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>結婚須基於自由意思。</span></p></div><div class=\"evp\"><p class=\"evh\">（二）甲乙結婚無效</p><p>依<span class=\"art\">第982條</span>，結婚應以書面為之，有二人以上證人之簽名，並應由雙方當事人向戶政機關為結婚之登記；不具備者依<span class=\"art\">第988條第1款</span>無效。本題中，甲乙僅舉行婚宴並同居，未作成書面、未登記，結婚無效。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>以登記確保身分明確。</span></p></div><div class=\"evp\"><p class=\"evh\">（三）甲丙婚姻有效但得撤銷</p><p>依<span class=\"art\">第989條</span>，結婚違反<span class=\"art\">第980條</span>之規定者，當事人或其法定代理人得向法院請求撤銷之，但當事人已達該條所定年齡或已懷胎者，不得請求撤銷。本題中，甲乙結婚無效，甲與丙結婚不違反<span class=\"art\">第985條</span>；甲丙具備<span class=\"art\">第982條</span>之方式，婚姻成立。丙僅17歲，其法定代理人得請求撤銷，依<span class=\"art\">第998條</span>撤銷不溯及既往；丙已滿18歲始起訴者，不得請求撤銷。</p><p class=\"evx\"><span class=\"evt\">理由</span><span>兼顧婚姻安定。</span></p></div>", "<span class=\"blk-l\">四、結論</span><p>（一）甲得依<span class=\"art\">第979條之1</span>請求返還金飾；依<span class=\"art\">第975條</span>不得訴請強迫履行，但得依<span class=\"art\">第978條</span>請求賠償。（二）依<span class=\"art\">第982條</span>、<span class=\"art\">第988條第1款</span>，甲乙結婚無效。（三）甲丙婚姻成立而不構成重婚，丙未滿18歲，其法定代理人得依<span class=\"art\">第989條本文</span>請求撤銷；丙已年滿18歲才起訴者，依同條但書不得撤銷。</p>"], "ck": [{"x": "§979-1：婚約解除 → 得請求返還因婚約所為之贈與", "h": false}, {"x": "§975：婚約不得請求強迫履行", "h": true}, {"x": "§978：無 §976 之理由違反婚約 → 賠償損害", "h": false}, {"x": "§982：書面＋二人以上證人簽名＋向戶政機關登記", "h": true}, {"x": "§988①：不具備方式 → 無效", "h": false}, {"x": "前婚無效 → 後婚不構成重婚", "h": false}, {"x": "§989：未達年齡得撤銷；已達年齡或已懷胎不得撤銷", "h": true}], "mn": "婚約不能逼 → 訂婚禮解約還 → 沒書面沒登記無效 → 前婚無效後婚非重婚 → 未滿十八得撤銷 → 成年懷胎撤不得"}];
var STG=[{n:'① 讀題',d:'看清楚問什麼、問幾問',s:30},{n:'② 先自己想',d:'不看答案，先列出條號與分點',s:30},{n:'③ 意義・法條・涵攝',d:'先看（一）（二）小標，再看例、理由',s:150},{n:'④ 結論',d:'對照題目每一問有沒有回答到',s:60},{n:'⑤ 關鍵檢核',d:'不看答案，勾出你剛剛有想到的',s:30}];
var TOTAL=300, LOG='bxm-es-log', SP='bxm-es-sprint', MK='bxm-sprint-mode';
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}
function sv(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function mmss(s){var a=Math.abs(s);return (s<0?'+':'')+Math.floor(a/60)+':'+('0'+(a%60)).slice(-2)}
var RL={1:'✅ 熟',2:'📖 還沒背起來',3:'😵 太難'};

/* ---- 模式 ---- */
var mode='h';try{mode=localStorage.getItem(MK)||'h'}catch(e){}
function paintMode(){[].forEach.call(document.querySelectorAll('.mode'),function(b){b.classList.toggle('on',b.getAttribute('data-m')===mode)})}
[].forEach.call(document.querySelectorAll('.mode'),function(b){b.onclick=function(){mode=b.getAttribute('data-m');try{localStorage.setItem(MK,mode)}catch(e){}paintMode()}});
paintMode();

/* ---- 狀態與排序：沒做過的優先，再來不熟的 ---- */
function stat(id){
  var L=ld(LOG)[id]||{}, S=ld(SP)[id]||[], R=ld('minfa_read')[id];
  var last=S[0]||null;
  return {n:(L.n||0), sp:S.length, v:({ok:1,mem:2,hard:3})[L.v]||0, last:last, read:!!R, t:Math.max(L.t||0,last?last.t:0)};
}
function order(){
  var arr=CARDS.map(function(c,i){var s=stat(c.id);return {c:c,s:s,i:i}});
  function kindRank(c){return c.k==='off'?0:(c.k==='pred'?1:2)}
  var fresh=arr.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read});
  var seen=arr.filter(function(x){return x.s.n||x.s.sp||x.s.read});
  fresh.sort(function(a,b){return kindRank(a.c)-kindRank(b.c)||a.c.tier-b.c.tier||a.i-b.i});
  function vr(v){return v===3?0:(v===2?1:(v===0?2:3))}
  function pct(x){return x.s.last?x.s.last.sc/Math.max(1,x.s.last.mx):-1}
  seen.sort(function(a,b){return vr(a.s.v)-vr(b.s.v)||pct(a)-pct(b)||a.s.t-b.s.t});
  return fresh.concat(seen);
}
function reason(x){
  var s=x.s,o=[];
  if(!s.n&&!s.sp&&!s.read)o.push('<span class="chip new">沒做過</span>');
  if(s.v===3)o.push('<span class="chip hard">😵 太難</span>');
  else if(s.v===2)o.push('<span class="chip mid">📖 還沒背起來</span>');
  else if(s.v===1)o.push('<span class="chip ok">✅ 熟</span>');
  if(s.sp)o.push('<span class="chip">衝刺 '+s.sp+' 次</span>');
  if(s.last)o.push('<span class="chip">上次 '+s.last.sc+'／'+s.last.mx+'</span>');
  if(s.n)o.push('<span class="chip">讀過 '+s.n+' 輪</span>');
  o.push('<span class="chip">'+esc(x.c.g)+'</span>');
  return o.join('');
}
var showAll=false;
function home(){
  var Q=order(), f=Q.filter(function(x){return !x.s.n&&!x.s.sp&&!x.s.read}).length;
  $('qcount').textContent='沒做過 '+f+'・做過 '+(Q.length-f)+'・共 '+Q.length+' 題';
  var tot=0,done=0;CARDS.forEach(function(c){var S=ld(SP)[c.id]||[];tot+=S.length;if(S.length)done++});
  $('sum').textContent='衝刺過 '+done+'／'+CARDS.length+' 題・共 '+tot+' 次';
  var list=showAll?Q:Q.slice(0,8);
  $('qlist').innerHTML=list.map(function(x){return '<button type="button" class="qi" data-id="'+x.c.id+'"><span class="n">'+esc(x.c.no)+'</span><span class="t">'+esc(x.c.t)+'</span><span class="go">開始 ▸</span><span class="r">'+reason(x)+'</span></button>'}).join('');
  [].forEach.call($('qlist').querySelectorAll('.qi'),function(b){b.onclick=function(){start(b.getAttribute('data-id'))}});
  $('moreBtn').textContent=showAll?'只看前 8 題':'顯示全部 '+Q.length+' 題';
}
$('moreBtn').onclick=function(){showAll=!showAll;home()};
var pick='order';
function randPick(ex){var a=CARDS.filter(function(c){return c.id!==ex});return a[Math.floor(Math.random()*a.length)]}
$('startBtn').onclick=function(){pick='order';start(order()[0].c.id)};
$('randBtn').onclick=function(){pick='rand';start(randPick('').id)};

/* ---- 作答 ---- */
var cur=null, st=0, stLeft=0, elapsed=0, iv=null, peek=false;
function start(id){
  setPause(false);
  cur=CARDS.filter(function(c){return c.id===id})[0]; if(!cur)return;
  st=0; stLeft=STG[0].s; elapsed=0; peek=false; cur.got={}; cur.rate=0;
  $('home').hidden=true; $('run').hidden=false; $('act').hidden=false;
  var s=stat(id);
  $('meta').innerHTML='<span>'+esc(cur.no)+'</span><span>'+esc(cur.g)+'</span>'+(cur.lv?'<span>'+esc(cur.lv)+'</span>':'')+'<span>第 '+(s.sp+1)+' 次衝刺'+(s.last?'・上次 '+s.last.sc+'／'+s.last.mx:'')+'</span>';
  $('ttl').textContent=cur.t;
  $('qbox').innerHTML='<div class="qt">'+esc(cur.q)+'</div><span class="nq">本題 '+cur.nq+' 問</span><button type="button" class="qx" id="qx">展開題目</button>';$('qbox').className='qbox';
  $('qx').onclick=function(){var q=$('qbox'),o=q.classList.contains('clamp');q.classList.toggle('clamp',!o);q.classList.toggle('open',o);this.textContent=o?'收起題目':'展開題目'};
  $('mchip').className='modechip '+mode; $('mchip').textContent=mode==='h'?'⚡ 衝刺':'🪑 停留';
  render(); tick(true);
  if(iv)clearInterval(iv); iv=setInterval(function(){tick(false)},1000);
  scrollTo(0,0);
}
function evHTML(show,focus,dim){
  return '<div class="ev">'+cur.b.map(function(h,i){
    if(show.indexOf(i)<0)return '';
    return '<div class="blk b'+(i+1)+(focus.indexOf(i)>=0?' focus':'')+(dim.indexOf(i)>=0?' dim':'')+'">'+h+'</div>'}).join('')+'</div>';
}
function render(){
  var b=$('body'), h='';
  if(st===0){h='<div class="cover">讀完題目，數清楚問幾問。<br>答案在後面，現在先不看。</div>'}
  else if(st===1){h='<div class="recall"><b>先不看答案，在心裡或紙上列出：</b><ol><li>會用哪幾條（條號）</li><li>要分幾點（照題目幾問）</li><li>結論一句話怎麼答</li></ol></div>'+(cur.mn?'<div class="mn">提示口訣（想不出來再看）：<b>'+esc(cur.mn)+'</b></div>':'')}
  else if(st===2){h=evHTML([0,1,2],[2],[])}
  else if(st===3){h=evHTML([0,1,2,3],[3],[0,1,2])}
  else if(st===4){
    var hide=(mode==='h'||!peek);
    h=(hide?'<div class="cover">答案已蓋住。憑記憶勾出你剛剛有想到、考試會寫到的關鍵。'+(mode==='s'?'<br><button type="button" class="btn" id="peekBtn" style="margin-top:8px">偷看一下答案</button>':'')+'</div>':evHTML([0,1,2,3],[],[]))
      +'<div class="ck" id="ck">'+cur.ck.map(function(c,i){return '<label data-i="'+i+'"'+(cur.got[i]?' class="on"':'')+'><input type="checkbox"'+(cur.got[i]?' checked':'')+'>'+(c.h?'<span class="must">必寫</span>':'')+'<span>'+esc(c.x)+'</span></label>'}).join('')+'</div>'
      +'<div class="score"><span class="big" id="sc"></span><small id="scs"></small></div>'
      +'<div class="rate" id="rate">'+[1,2,3].map(function(v){return '<button type="button" data-v="'+v+'"'+(cur.rate===v?' class="on"':'')+'>'+RL[v]+'</button>'}).join('')+'</div>'
      +'<div class="hist" id="hist"></div>';
  }
  b.innerHTML=h;
  if(st===4){
    var pb=$('peekBtn'); if(pb)pb.onclick=function(){peek=true;render()};
    [].forEach.call(b.querySelectorAll('.ck label'),function(l){var i=+l.getAttribute('data-i'),cb=l.querySelector('input');
      cb.onchange=function(){cur.got[i]=cb.checked;l.classList.toggle('on',cb.checked);score()}});
    [].forEach.call(b.querySelectorAll('#rate button'),function(x){x.onclick=function(){cur.rate=+x.getAttribute('data-v');
      [].forEach.call(b.querySelectorAll('#rate button'),function(y){y.classList.toggle('on',y===x)});paintAct()}});
    score(); hist();
  }
  var qb=$('qbox'); if(!qb.classList.contains('open'))qb.classList.toggle('clamp',st>=2&&st<=4);
  paintStage(); paintAct();
}
function score(){
  var sc=0,mx=cur.ck.length,hm=0,hx=0;cur.ck.forEach(function(c,i){if(cur.got[i])sc++;if(c.h){hx++;if(cur.got[i])hm++}});
  cur.sc=sc;cur.mx=mx;cur.hm=hm;cur.hx=hx;
  $('sc').textContent=sc+'／'+mx;
  $('scs').textContent='關鍵字樣'+(hx?'・必寫 '+hm+'／'+hx:'');
}
function hist(){
  var S=ld(SP)[cur.id]||[];
  $('hist').innerHTML=S.length?'過去衝刺：'+S.slice(0,5).map(function(r){var d=new Date(r.t*1000);return (d.getMonth()+1)+'/'+d.getDate()+' '+r.sc+'／'+r.mx+(r.m==='h'?'⚡':'🪑')}).join('　'):'這題第一次衝刺。';
}
function paintStage(){
  $('stg').innerHTML=STG[st].n+'<small>'+STG[st].d+'</small>';
  [].forEach.call($('segs').children,function(seg,i){seg.classList.toggle('done',i<st);seg.classList.remove('over')});
}
function paintAct(){
  var nb=$('nextBtn');
  if(st<4){nb.textContent=st===3?'去檢核 →':'下一段 →';nb.disabled=false;
    $('hint').textContent=mode==='h'?'時間到會自動往下；讀過的段落會蓋住。':'時間到只會變紅，看完再按下一段。'}
  else{nb.textContent='存檔';nb.disabled=!cur.rate;$('hint').textContent=cur.rate?'':'勾完關鍵後，選一個自評才能存檔。'}
}
function tick(first){
  if(!first){ if(paused||document.visibilityState!=='visible')return; elapsed++; stLeft--; }
  var clk=$('clk'),seg=$('segs').children[st].querySelector('b');
  clk.textContent=mmss(stLeft); clk.classList.toggle('red',stLeft<=0);
  seg.style.width=Math.min(100,(STG[st].s-stLeft)/STG[st].s*100)+'%';
  $('segs').children[st].classList.toggle('over',stLeft<0);
  var t=$('tot'); t.textContent='總 '+mmss(elapsed).replace('+','')+'／5:00'; t.classList.toggle('red',elapsed>TOTAL);
  if(stLeft<=0&&mode==='h'&&st<4&&!first){next()}
}
function next(){
  if(paused)return;
  if(st>4)return;
  if(st<4){st++;stLeft=STG[st].s;render();tick(true);scrollTo(0,0);return}
  save();
}
function save(){
  if(!cur.rate)return;
  var now=Math.floor(Date.now()/1000);
  var S=ld(SP); S[cur.id]=[{t:now,sc:cur.sc,mx:cur.mx,hm:cur.hm,hx:cur.hx,m:mode,sec:elapsed,v:cur.rate}].concat(S[cur.id]||[]).slice(0,30); sv(SP,S);
  var L=ld(LOG), r=L[cur.id]=L[cur.id]||{n:0,s:[],tot:0};
  r.n=(r.n||0)+1; r.tot=(r.tot||0)+elapsed; r.s=(r.s||[]).concat([elapsed]).slice(-5); r.v=['','ok','mem','hard'][cur.rate]; r.t=now; sv(LOG,L);
  clearInterval(iv); iv=null;
  var nx=pick==='rand'?{c:randPick(cur.id)}:order().filter(function(x){return x.c.id!==cur.id})[0];
  $('body').innerHTML='<div class="done-box"><b>已存檔</b>：'+cur.sc+'／'+cur.mx+'・'+RL[cur.rate]+'・用時 '+mmss(elapsed).replace('+','')+'<br><span style="color:var(--sub);font-size:.88rem">指揮中心這張申論卡的輪數、自評會一起更新。</span>'
    +(nx?'<div style="margin-top:10px;font-size:.9rem">'+(pick==='rand'?'🎲 隨機':'')+'下一題：'+esc(nx.c.no)+'｜'+esc(nx.c.t)+'</div>':'')+'</div>';
  $('stg').innerHTML='完成<small>這題的紀錄已同步</small>';
  [].forEach.call($('segs').children,function(seg){seg.classList.add('done')});
  st=5; $('hint').textContent=''; $('quitBtn').textContent='回清單';
  var nb=$('nextBtn'); nb.disabled=!nx; nb.textContent='下一題 ▸';
  nb.onclick=function(){nb.onclick=next;$('quitBtn').textContent='放棄這題';start(nx.c.id)};
}
$('nextBtn').onclick=next;
$('quitBtn').onclick=function(){setPause(false);$('quitBtn').textContent='放棄這題';$('nextBtn').onclick=next;clearInterval(iv);iv=null;cur=null;$('run').hidden=true;$('act').hidden=true;$('home').hidden=false;home();scrollTo(0,0)};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!$('home').hidden)home()});
home();

var paused=false;
function setPause(v){paused=v;document.body.classList.toggle('paused',v);var b=$('pauseBtn');b.textContent=v?'▶':'⏸';b.setAttribute('aria-label',v?'繼續':'暫停');if(!v)scrollTo(0,0)}
$('pauseBtn').onclick=function(){setPause(!paused)};
$('resumeBtn').onclick=function(){setPause(false)};
</script>
<script id="th-js">/* 深淺色切換：有存過看 bx-theme，沒存過跟系統；按了才寫入（全站共用鍵） */
(function(){var H=document.documentElement,b=document.getElementById('thBtn');
function dark(){var a=H.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function paint(){b.textContent=dark()?'☀️ 淺色':'🌙 深色'}
b.onclick=function(){var n=dark()?'light':'dark';H.setAttribute('data-theme',n);try{localStorage.setItem('bx-theme',n)}catch(e){}paint()};
paint();try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint)}catch(e){}})();</script>
</body>
</html>
