<!DOCTYPE html><html lang="zh-Hant"><head><script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}document.documentElement.setAttribute("data-theme",s||"light")})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>民法全真模擬卷②（自擬・限時 90 分鐘）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;line-height:1.7;padding-bottom:84px}
header{padding:14px 16px 6px;max-width:760px;margin:auto}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:'Noto Serif TC',serif;font-size:1.2rem;margin:0;color:var(--pri);flex:1}
.th{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;flex:none}
.sub{font-size:13px;color:var(--sub)}
.wrap{max-width:760px;margin:auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-size:15px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card.done{border-left:4px solid var(--ok)}.card.done.wrong{border-left:4px solid var(--bad)}
.qn{font-family:'Noto Serif TC',serif;color:var(--pri);font-weight:700}
.stem{white-space:pre-wrap;margin:4px 0 10px;font-family:'Noto Serif TC',serif}
.tag{display:inline-block;background:var(--acc);color:#fff;font-size:12px;padding:0 8px;border-radius:8px;margin-left:6px;font-family:'Noto Sans TC',sans-serif;font-weight:500}
.opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;margin:6px 0;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.opt>b{color:var(--pri);flex:none}
.ob{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.bg{display:none;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.opt.ok .bg.a{display:inline-block;background:var(--ok)}.opt.bad .bg.p{display:inline-block;background:var(--bad)}
.nt{display:none;font-size:13px;color:var(--ink);margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}
.arr{display:none;float:right;margin-left:6px;color:var(--sub);transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
body[data-ex="B"] .done .opt .nt,body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.res{display:none}
.done .res{display:block;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.86rem;margin:0 0 8px;background:var(--bad-soft);color:var(--bad)}
.done .res.ok{background:var(--ok-soft);color:var(--ok)}
.hn{display:none;font-size:.72rem;color:var(--sub);margin:-4px 0 8px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.exs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:8px 0}
.exs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:.78rem;cursor:pointer}
.exs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}
.trap,.src,.cls{display:none;margin-top:8px;padding:8px 10px;font-size:14px;border-radius:6px}
.trap{background:var(--warn);border-left:4px solid var(--acc)}.src{font-size:12px;color:var(--sub);padding:0 2px}
.done .trap,.done .src{display:block}.wrong.done .cls{display:block;background:var(--bad-soft)}
.cls button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;margin:2px;font-family:inherit;font-size:13px;cursor:pointer}
.cls button.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
.score{position:sticky;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px}
.score button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;font-family:inherit}
.bar{height:14px;background:var(--pri-soft);border-radius:7px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.lo{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}.note{font-size:13px;color:var(--sub)}
.ph{font-family:'Noto Serif TC',serif;color:var(--pri);font-weight:700;margin-top:10px}.pb{white-space:pre-wrap}
.fr{border-left:5px solid var(--pri);background:var(--pri-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
.fr .ph{margin-top:0}.fr.f2{border-color:var(--acc);background:var(--acc-soft)}.fr.f2 .ph{color:var(--acc-ink)}
.fr.f3{border-color:var(--ok);background:var(--ok-soft)}.fr.f3 .ph{color:var(--ok)}
.fr.f4{border-color:var(--bad);background:var(--bad-soft)}.fr.f4 .ph{color:var(--bad)}
.vt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}.vt button{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--sub);cursor:pointer}
.vt button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.xk{color:var(--bad);font-weight:700}.xa{color:var(--acc-ink);font-weight:700}.xn{background:var(--acc-soft);color:var(--acc-ink);font-weight:700;padding:0 3px;border-radius:3px}
.kouf{border-left:5px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14px}.kouf b{color:var(--ok)}
.tipf{border-left:5px solid var(--acc);background:var(--acc-soft);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;color:var(--acc-ink)}
.lg{font-size:12px;color:var(--sub);margin-top:6px}
.fr>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}.fr>summary::-webkit-details-marker{display:none}.fr>summary::before{content:"▸";font-size:.9em}.fr[open]>summary::before{content:"▾"}.fr[open]>summary{margin-bottom:4px}
.vt .vx{margin-left:auto;border-style:dashed}
.vn{font-size:12px;color:var(--sub);margin-top:6px}
details summary{cursor:pointer;color:var(--pri);font-weight:700}.warn{font-size:13px;color:var(--bad);margin-top:8px}
#tm{font-weight:700;color:var(--bad)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style><script src="bxm-use.js"></script>

<script>
var D={"Q":[{"n":1,"ch":"A","sec":"A 行為能力","stem":"關於行為能力，下列敘述何者正確？","opts":["受監護宣告之人，僅有限制行為能力","未滿七歲之未成年人，無行為能力；滿七歲以上之未成年人，有限制行為能力","受輔助宣告之人處分不動產，無須經輔助人同意","限制行為能力人用詐術使人信其為有行為能力人者，其法律行為效力未定"],"ans":"B","notes":["❌ §15：受監護宣告之人，無行為能力。","✅ §13 原文（成年已改為滿十八歲，§12）。","❌ §15-2Ⅰ⑤：不動產之處分、設定負擔、買賣、租賃或借貸，應經輔助人同意。","❌ §83：其法律行為為「有效」。"],"trap":"未成年（7歲分界）／監護＝無行為能力／輔助＝特定重要行為須同意／詐術＝有效。","src":"§12、§13、§15、§15-2、§83；歷屆 106-二","neg":false},{"n":2,"ch":"A","sec":"A 暴利行為","stem":"甲趁乙急需用錢，以市價三成買受乙之房屋，並辦妥移轉登記。下列敘述何者正確？","opts":["該買賣當然無效","乙得於法律行為後二年內聲請撤銷","乙得逕以意思表示撤銷，毋須經法院","乙得於法律行為後一年內，聲請法院撤銷其法律行為或減輕其給付"],"ans":"D","notes":["❌ §74 的效果是「法院得撤銷或減輕」，不是當然無效。","❌ §74Ⅱ：一年，不是二年。","❌ §74 須「聲請法院」，與 §92 詐欺脅迫（以意思表示撤銷）不同。","✅ §74Ⅰ、Ⅱ：乘人急迫、輕率或無經驗，顯失公平者，法院得因利害關係人之聲請撤銷或減輕給付；聲請應於法律行為後一年內為之。"],"trap":"暴利行為＝聲請法院＋一年；詐欺脅迫＝意思表示撤銷＋發見後一年／十年。","src":"§74、§92、§93；本卷自擬","neg":false},{"n":3,"ch":"A","sec":"A 要約與承諾","stem":"下列有關要約與承諾之敘述，何者錯誤？","opts":["價目表之寄送，視為要約","貨物標定賣價陳列者，視為要約","對話為要約者，非立時承諾，即失其拘束力","將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約"],"ans":"A","notes":["✅ 此敘述錯誤（本題答案）：§154Ⅱ 但書：價目表之寄送，「不視為」要約。","❌ 此敘述正確，不選：§154Ⅱ 本文，敘述正確。","❌ 此敘述正確，不選：§156，敘述正確。","❌ 此敘述正確，不選：§160Ⅱ，敘述正確。"],"trap":"標價陳列＝要約；價目表寄送＝要約引誘；變更承諾＝新要約。","src":"§154、§156、§160；本卷自擬","neg":true},{"n":4,"ch":"A","sec":"A 條件","stem":"下列有關附條件法律行為之敘述，何者正確？","opts":["附停止條件之法律行為，於成立時即生效力","因條件成就而受不利益之當事人，以不正當行為阻其條件之成就者，視為條件不成就","附解除條件之法律行為，於條件成就時，失其效力","條件成否未定前，當事人損害相對人因條件成就所應得之利益，無須負賠償責任"],"ans":"C","notes":["❌ §99Ⅰ：附停止條件者，於條件成就時發生效力。","❌ §101Ⅰ：視為條件「已成就」。","✅ §99Ⅱ 原文。","❌ §100：負賠償損害之責任。"],"trap":"停止＝成就才生效；解除＝成就即失效；惡意阻止成就＝視為成就；惡意促成成就＝視為不成就。","src":"§99~§101；本卷自擬","neg":false},{"n":5,"ch":"A","sec":"A 短期時效","stem":"下列請求權，何者因二年間不行使而消滅？","opts":["房屋租金之各期給付請求權","律師之報酬及其墊款請求權","借款本金返還請求權","定期給付之利息各期請求權"],"ans":"B","notes":["❌ §126：租金各期給付請求權 5 年。","✅ §127⑤。","❌ 一般請求權，§125：15 年。","❌ §126：5 年。"],"trap":"二年短期時效（§127）八類：旅店飲食／運送／動產租賃營業／醫藥／律師會計公證／技師承攬／商人製造供貨。租金利息＝5 年。","src":"§125~§127；本卷自擬","neg":false},{"n":6,"ch":"B","sec":"B 契約解除","stem":"甲乙訂立房屋買賣契約，乙遲延給付第二期價金。下列敘述何者正確？","opts g":false},{"n":11,"ch":"C","sec":"C 承攬","stem":"乙承攬甲之房屋裝修工程，工作尚未完成。下列有關終止契約之敘述，何者正確？","opts":["甲須經乙同意，始得終止契約","甲得隨時終止契約，且無須賠償乙任何損害","甲僅於乙遲延完工時，始得終止契約","甲得隨時終止契約，但應賠償乙因契約終止而生之損害"],"ans":"D","notes":["❌ §511：定作人得「隨時」終止。","❌ §511 但書：應賠償承攬人因契約終止而生之損害。","❌ §511 不以承攬人遲延為要件。","✅ §511 原文。"],"trap":"承攬＝定作人隨時可終止但賠償；委任＝任何一方隨時可終止，不利時機賠償（§549）。","src":"§511、§549；本卷自擬","neg":false},{"n":12,"ch":"C","sec":"C 委任報酬","stem":"甲委任乙（有報酬）出售 A 屋，乙處理部分事務後，甲無故終止委任。下列敘述何者正確？","opts":["乙須待事務全部處理完畢，始得請求報酬","僅受任人得隨時終止委任契約，委任人不得","乙得就已處理之部分，請求報酬","甲於不利於乙之時期終止契約，無須賠償"],"ans":"C","notes":["❌ §548Ⅱ 例外允許就已處理部分請求。","❌ §549Ⅰ：當事人任何一方得隨時終止。","✅ §548Ⅱ：委任關係因非可歸責於受任人之事由，於事務處理未完畢前已終止者，受任人得就已處理之部分請求報酬。","❌ §549Ⅱ：應負損害賠償責任（因非可歸責之事由者除外）。"],"trap":"委任報酬：關係終止＋明確報告顛末後才得請求（§548Ⅰ）；中途終止（非可歸責受任人）→ 已處理部分報酬（Ⅱ）。","src":"§535、§548、§549；歷屆 113-二","neg":false},{"n":13,"ch":"D","sec":"D 物上請求權","stem":"乙無權占有甲所有且已登記之 A 地。下列敘述何者正確？","opts":["甲之返還請求權，因 15 年間不行使而消滅","甲得請求乙返還 A 地；所有權以外之物權，準用之","甲須證明乙有故意或過失，始得請求返還","§767 僅適用於所有權，他物權人不得準用"],"ans":"B","notes":["❌ 釋字第 107 號：已登記不動產所有人之回復請求權，無 §125 消滅時效之適用。","✅ §767Ⅰ、Ⅱ。","❌ §767 不問占有人有無故意過失。","❌ §767Ⅱ：於所有權以外之物權，準用之。"],"trap":"§767 物上請求權三種（返還／除去／防止），不以過失為要件；已登記不動產所有權的物上請求權不適用 15 年時效（釋字107）。","src":"§767；歷屆 107-二、111-一（釋字107）","neg":false},{"n":14,"ch":"D","sec":"D 時效取得","stem":"下列有關占有取得時效之敘述，何者正確？","opts":["以所有之意思，二十年間和平、公然、繼續占有他人未登記之不動產者，得請求登記為所有人","動產須占有二十年，始能取得所有權","善意無過失占有他人未登記之不動產，須十五年，始得請求登記為所有人","地上權不得因時效而取得"],"ans":"A","notes":["✅ §769 原文。","❌ §768：動產 10 年；§768-1：善意無過失 5 年。","❌ §770：十年。","❌ §772：前五條規定於所有權以外財產權之取得準用之，於已登記之不動產亦同。"],"trap":"動產 10／5；不動產 20／10；其他財產權準用（109-二 時效取得地上權）。","src":"§768~§772；歷屆 109-二","neg":false},{"n":15,"ch":"D","sec":"D 袋地通行","stem":"甲將其所有之 A 地分割為 A1、A2，將 A2 讓與乙，致 A2 與公路無適宜之聯絡。下列敘述何者正確？","opts":["乙得通行任何周圍地，並應支付償金","乙須先取得不動產役權登記，始得通行","乙應擇對周圍地損害最少之處所通行，並支付償金","乙僅得通行讓與人甲或他分割人之所有地，且無須支付償金"],"ans":"D","notes":["❌ 那是 §787 一般袋地規則；因分割或讓與所生之袋地，通行範圍限於讓與人、受讓人或他分割人之所有地。","❌ 通行權依法律規定而生（§787~§789），不以登記為前提。","❌ 那是 §787Ⅱ 一般袋地規則；§789Ⅱ 無須支付償金。","✅ §789Ⅰ、Ⅱ。"],"trap":"§787（一般袋地：周圍地、損害最少、付償金）vs §789（分割讓與：限於相關人之地、無須付償金）。","src":"§787~§789；本卷自擬","neg":false},{"n":16,"ch":"D","sec":"D 區分所有","stem":"關於區分所有建築物，下列敘述何者正確？","opts":["專有部分得單獨讓與，而保留其共有部分及基地之應有部分","規約對區分所有人之繼受人一律不生拘束力","區分所有人就共有部分及基地之應有部分，依專有部分面積與專有部分總面積之比例定之，但另有約定者從其約定","規約內容顯失公平者，不同意之區分所有人得於規約成立後六個月內請求法院撤銷"],"ans":"C","notes":["❌ §799Ⅴ：專有部分與其所屬之共有部分及其基地之權利，不得分離而為移轉或設定負擔。","❌ §799-1Ⅳ：區分所有人間依規約所生之權利義務，繼受人應受拘束。","✅ §799Ⅳ 原文。","❌ §799-1Ⅲ：三個月。"],"trap":"區分所有：專有／共有／基地三者不得分離；規約繼受人受拘束；顯失公平三個月內撤銷。","src":"§799、§799-1；歷屆 105-二、114-一","neg":false},{"n":17,"ch":"D","sec":"D 不動產役權","stem":"下列有關不動產役權之敘述，何者正確？","opts":["不動產役權得由需役不動產分離而單獨讓與","需役不動產經分割者，不動產役權為各部分之利益仍為存續；但其行使依性質祇關於需役不動產之一部分者，僅就該部分仍為存續","供役不動產經分割者，不動產役權即歸消滅","不動產役權僅得以通行為目的"],"ans":"B","notes":["❌ §853：不得由需役不動產分離而為讓與，或為其他權利之標的物。","✅ §856 原文。","❌ §857：就其各部分仍為存續（但性質只關於一部分者僅對該部分存續）。","❌ §851：通行、汲水、採光、眺望、電信或其他以特定便宜之用為目的。"],"trap":"不動產役權（舊地役權）：從屬於需役不動產；分割後仍存續。","src":"§851、§853、§856、§857；本卷自擬","neg":false},{"n":18,"ch":"D","sec":"D 最高限額抵押權","stem":"下列有關最高限額抵押權之敘述，何者正確？","opts":["確定期日之約定，自抵押權設定時起不得逾三十年；逾三十年者，縮短為三十年","所擔保之債權，不以由一定法律關係所生或基於票據所生者為限","未約定確定期日者，自請求之日起經三十日為其確定期日","所擔保之債權，於原債權確定前讓與他人者，最高限額抵押權隨同移轉"],"ans":"A","notes":["✅ §881-4Ⅱ 原文。","❌ §881-1Ⅱ：以由一定法律關係所生之債權或基於票據所生之權利為限。","❌ §881-5Ⅱ：十五日。","❌ §881-6Ⅰ：不隨同移轉。"],"trap":"最高限額：一定法律關係／確定期日 30 年／請求確定 15 日／確定前讓與不隨同。","src":"§881-1~§881-6；歷屆 108-二","neg":false},{"n":19,"ch":"D","sec":"D 強制執行與法定地上權","stem":"甲有 A 地及其上 B 屋（均未設定抵押權），乙聲請強制執行拍賣 A 地，由丙拍定，B 屋仍屬甲所有。下列敘述何者正確？","opts":["丙得請求甲拆屋還地","須設定抵押權時土地與建物同屬一人，始有法定地上權","該地上權不因建築物之滅失而消滅","視為已有地上權之設定，其地租、期間及範圍由當事人協議；不能協議者，得請求法院以判決定之"],"ans":"D","notes":["❌ §838-1Ⅰ 視為已有地上權設定，丙不得請求拆屋還地。","❌ 那是 §876 抵押權情形；強制執行拍賣適用 §838-1，不以設定抵押權為前提。","❌ §838-1Ⅱ：此地上權因建築物之滅失而消滅（與一般地上權 §841 不同）。","✅ §838-1Ⅰ 原文。"],"trap":"法定地上權兩條：§876（抵押權拍賣，設定時同屬一人）／§838-1（強制執行拍賣，土地建物同屬一人）。後者建物滅失即消滅。","src":"§838-1、§876、§841；歷屆 109-二、114-二","neg":false},{"n":20,"ch":"E","sec":"E 結婚","stem":"下列有關結婚之敘述，何者錯誤？","opts":["男女未滿十八歲者，不得結婚","結婚應以書面為之，有二人以上證人之簽名，並應由雙方當事人向戶政機關為結婚之登記","違反重婚禁止之結婚，得由當事人請求法院撤銷","因被詐欺而結婚者，得於發見詐欺終止後六個月內向法院請求撤銷"],"ans":"C","notes":["❌ 此敘述正確，不選：§980 原文。","❌ 此敘述正確，不選：§982 原文。","✅ 此敘述錯誤（本題答案）：§988③：重婚的結婚為「無效」（但書情形除外），不是得撤銷。","❌ 此敘述正確，不選：§997 原文。"],"trap":"結婚無效（§988：方式、近親、重婚）vs 得撤銷（未達法定年齡、詐欺脅迫、不能人道等）。","src":"§980、§982、§988、§997；本卷自擬","neg":true},{"n":21,"ch":"E","sec":"E 裁判離婚","stem":"甲知悉其配偶乙與丙合意性交之事實後，事前未同意、事後亦未宥恕，但拖延七個月才訴請離婚（該情事發生距今約一年）。下列敘述何者正確？","opts":["甲得請求離婚，不受期間限制","甲不得請求離婚，因知悉後已逾六個月","甲不得請求離婚，因自情事發生後已逾一年","甲不得請求離婚，因知悉後已逾三個月"],"ans":"B","notes":["❌ §1053 就 §1052Ⅰ①② 設有除斥期間。","✅ §1053：有請求權之一方，知悉後已逾六個月，或自其情事發生後已逾二年，不得請求離婚。","❌ §1053 的「情事發生後」期間是二年，不是一年。","❌ §1053 知悉後期間為六個月。"],"trap":"§1053：事前同意／事後宥恕／知悉後 6 個月／發生後 2 年——四擇一即不得請求離婚（限重婚、合意性交兩款）。","src":"§1052、§1053；本卷自擬","neg":false},{"n":22,"ch":"E","sec":"E 非婚生子女","stem":"下列有關非婚生子女之敘述，何者正確？","opts":["非婚生子女經生父撫育者，視為認領","非婚生子女與其生母之關係，須經生母認領始視為婚生子女","生父認領非婚生子女後，無論如何均不得撤銷","認領之訴於生父死亡後即不得提起"],"ans":"A","notes":["✅ §1065Ⅰ 後段。","❌ §1065Ⅱ：與生母之關係視為婚生子女，無須認領。","❌ §1070 但書：有事實足認其非生父者，不在此限。","❌ §1067Ⅱ：生父死亡後，得向生父之繼承人為之。"],"trap":"認領：生父認領／撫育視為認領；生母無須認領；撤銷限於非生父。","src":"§1064~§1070；本卷自擬","neg":false},{"n":23,"ch":"E","sec":"E 收養","stem":"下列有關收養之敘述，何者正確？","opts":["收養者之年齡，只須長於被收養者十六歲以上","除夫妻共同收養外，一人得同時為二人之養子女","收養應以口頭為之即可，無須向法院聲請認可","養子女與本生父母及其親屬間之權利義務，於收養關係存續中停止之"],"ans":"D","notes":["❌ §1073Ⅰ：原則須長於被收養者二十歲以上；夫妻共同收養時一方二十歲、他方十六歲；§1073Ⅱ 繼親收養長十六歲。","❌ §1075：除夫妻共同收養外，一人不得同時為二人之養子女。","❌ §1079Ⅰ：應以書面為之，並向法院聲請認可。","✅ §1077Ⅱ：停止（但夫妻之一方收養他方之子女者，他方與其子女之權利義務不受影響）。"],"trap":"收養：書面＋法院認可；年齡差 20（例外 16）；養子女本生關係停止；不得同時為二人養子女。","src":"§1073~§1079；本卷自擬","neg":false},{"n":24,"ch":"E","sec":"E 隱匿遺產","stem":"繼承人丙隱匿遺產，情節重大。下列敘述何者正確？","opts":["丙當然喪失繼承權","丙之應繼分歸屬國庫","丙不得主張 §1148Ⅱ 所定之利益，即不得主張以因繼承所得遺產為限負清償責任","丙仍得主張以所得遺產為限負清償責任，隱匿遺產不影響"],"ans":"C","notes":["❌ §1145 喪失繼承權的事由不含隱匿遺產；隱匿遺產只是喪失限定責任的利益（§1163）。","❌ 無此規定。","✅ §1163①：隱匿遺產情節重大者，不得主張 §1148Ⅱ 之利益。","❌ §1163 明文剝奪該利益。"],"trap":"喪失繼承權（§1145 五款，如殺害、偽造遺囑）≠ 喪失限定責任利益（§1163：隱匿、虛偽記載、詐害債權人處分）。","src":"§1145、§1148、§1163；本卷自擬","neg":false},{"n":25,"ch":"E","sec":"E 遺產分割","stem":"下列有關遺產分割之敘述，何者正確？","opts":["遺囑禁止遺產分割之效力，以二十年為限","遺囑禁止遺產之分割者，其禁止之效力以十年為限","胎兒為繼承人時，其他繼承人得逕行分割遺產，毋須保留其應繼分","繼承人於繼承開始前因結婚受被繼承人贈與，縱被繼承人於贈與時有反對意思表示，仍須歸扣"],"ans":"B","notes":["❌ §1165Ⅱ：十年。","✅ §1165Ⅱ 原文。","❌ §1166Ⅰ：非保留其應繼分，他繼承人不得分割遺產。","❌ §1173Ⅰ 但書：被繼承人有反對意思表示者，不在此限。"],"trap":"遺產分割：隨時請求（§1164）／遺囑禁止 10 年／胎兒保留應繼分／歸扣（結婚分居營業）。","src":"§1164、§1165、§1166、§1173；本卷自擬","neg":false}],"E":[{"t":"申論題一（25分）","q":"甲有 A 地及其上 B 屋（B 屋為甲自建並已保存登記），甲以 A 地為乙銀行設定第一順位抵押權，擔保借款 1,000 萬元，設定時 B 屋已存在，未一併設定抵押。其後甲在 A 地上另增建 C 屋。甲屆期未清償，乙聲請拍賣 A 地，由丙拍定並登記取得所有權。丙主張 B 屋、C 屋均無權占有，請求甲拆屋還地。試問：（一）丙對 B 屋之請求有無理由？（二）乙得否就 C 屋亦聲請拍賣？C 屋拍賣價金如何受償？","parts":[["一、定義","『法定地上權』指土地及其地上建築物原屬同一人所有，因抵押權實行致土地與建物分屬不同人時，法律視為已有地上權之設定，以保護建物之利用。『併付拍賣』指抵押人於設定後在抵押地上營造建築物，抵押權人得聲請將該建築物與土地一併拍賣。"],["二、法條","① 第876條第1項：設定抵押權時，土地及其土地上之建築物同屬一人所有，而僅以土地或僅以建築物為抵押者，於抵押物拍賣時，視為已有地上權之設定，其地租、期間及範圍由當事人協議定之；不能協議者，得聲請法院以判決定之。② 第877條第1項：土地所有人於設定抵押權後，在抵押之土地上營造建築物者，抵押權人於必要時，得於強制執行程序中聲請法院將其建築物與土地併付拍賣。但對於建築物之價金，無優先受清償之權。③ 第767條第1項：所有物返還請求權。"],["三、涵攝分析","（一）設定抵押權時，A 地與 B 屋同屬甲所有，僅以 A 地為抵押，B 屋於設定時已存在，符合第876條第1項，於 A 地拍賣時視為已有地上權設定，丙不得請求甲拆除 B 屋；地租、期間由丙甲協議，不能協議得聲請法院判決。（二）C 屋係設定後營造，無第876條適用，抵押權人乙得依第877條第1項於必要時聲請與 A 地併付拍賣；惟乙對 C 屋價金無優先受償權，僅就 A 地價金優先受償，C 屋價金由其他債權人或甲取得。"],["四、結論","丙對 B 屋之請求無理由（法定地上權）；乙得就 C 屋聲請併付拍賣，但對 C 屋價金無優先受償權。"],["考試陷阱","三條易混：§876（抵押，設定時同屬一人）／§838-1（強制執行，未設抵押）／§877（設定後營造→併付拍賣）。"]],"warn":"自擬模擬題（非官方考題）。法定地上權要件『設定時土地與建物同屬一人』：建物須在設定時已存在；設定後才蓋的 C 屋，不是法定地上權，而是併付拍賣問題。","v":[{"n":"考場速寫版","parts":[["一、定義","法定地上權＝同屬一人、抵押實行後分屬；併付拍賣＝設定後新蓋建物一併賣。"],["二、法條","§876設定時同屬一人→視為地上權；§877設定後營造→併付拍賣，價金無優先權。"],["三、涵攝","B 屋設定時已存在→§876，丙不得拆屋；C 屋設定後增建→§877併付拍賣，乙僅就A地優先受償。"],["四、結論","B 有法定地上權；C 可併付拍賣但價金無優先權。"]]},{"n":"得分關鍵與失分點","parts":[["得分關鍵詞","法定地上權｜第876條｜同屬一人｜視為已有地上權｜第877條｜併付拍賣｜無優先受清償之權｜地租","ok"],["常見失分點","① 把 C 屋也當成法定地上權，忽略『設定時已存在』的時點\n② 漏寫第877條但書『對建築物價金無優先受償權』\n③ 只結論『有地上權』，沒寫地租、期間可協議或聲請法院判決","bad"]]}],"m":"設定時有屋給地上權；設定後蓋屋併著賣，價金優先沒有份","kw":["法定地上權","第876條","同屬一人","視為已有地上權","第877條","併付拍賣","無優先受清償之權","地租","拆屋還地"]},{"t":"申論題二（25分）","q":"甲乙為夫妻，未約定夫妻財產制，婚後育有一子。113 年甲乙協議離婚。離婚時，甲現存婚後財產 400 萬元（其中 100 萬元為婚後繼承父親所得），婚姻關係存續中所負債務 50 萬元；離婚前二年，甲無償贈與其弟丙 200 萬元。乙現存婚後財產 100 萬元，無負債。試問：（一）甲乙剩餘財產差額如何計算？乙得請求分配多少？（二）若甲財產不足清償乙之分配額，乙得如何主張？其請求權時效為何？","parts":[["一、定義","『剩餘財產分配請求權』指法定財產制關係消滅時，夫妻就婚後財產扣除債務後之差額，由較少一方向較多一方請求平均分配。『追加計算』指為減少他方分配而於消滅前五年內處分之財產，視為現存婚後財產。"],["二、法條","① 第1030條之1第1項：法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配。但因繼承或其他無償取得之財產、慰撫金，不在此限。② 第1030條之3：為減少他方分配，於法定財產制關係消滅前五年內處分婚後財產者，應追加計算；分配義務人不足清償時，權利人得就不足額對受領之第三人於其所受利益內請求返還（有償受領者，以顯不相當對價取得者為限）。③ 第1030條之4：現存婚後財產以法定財產制關係消滅時為準（判決離婚者以起訴時為準），追加計算之財產以處分時為準。④ 第1030條之1第5項：差額分配請求權自知有剩餘財產差額時起二年、自法定財產制關係消滅時起逾五年不行使而消滅；第1030條之3第3項：對第三人之返還請求權，自知悉分配權利受侵害時起二年、自關係消滅時起逾五年而消滅。"],["三、涵攝分析","（一）甲：現存婚後財產 400 萬元，扣除繼承所得 100 萬元（但書排除）＝ 300 萬元，扣除婚姻存續中債務 50 萬元＝ 250 萬元，加計離婚前五年內無償贈與丙之 200 萬元（追加計算）＝ 450 萬元。乙：100 萬元。差額 450 − 100 ＝ 350 萬元，平均分配，乙得請求 175 萬元。（二）若甲現存財產不足給付 175 萬元，乙得依第1030條之3，就不足額對受贈人丙於其所受利益（200 萬元）內請求返還；因丙係無償受領，不受『顯不相當對價』之限制。時效：乙對甲之差額分配請求權，依第1030條之1第5項，自知有差額時起二年、自離婚時起逾五年而消滅；對丙之返還請求權，依第1030條之3第3項，自知悉權利受侵害時起二年、自離婚時起逾五年而消滅。"],["四、結論","（一）差額 350 萬元，乙得請求 175 萬元；（二）不足額得對丙於所受利益內請求返還；時效二年（知悉）／五年（自關係消滅）。"],["考試陷阱","債務扣除、繼承排除與追加計算的先後次序，教材寫法略有不同，考場把每一步列式寫出來，閱卷者最容易給分。"]],"warn":"自擬模擬題（非官方考題）。本題計算順序為『先排除繼承／無償所得、扣債務，再加追加財產』；法院亦得依第1030條之1第2項調整或免除分配額。條文已與核實表（2026-10-08）對照。","v":[{"n":"考場速寫版","parts":[["一、定義","剩餘財產分配＝法定財產制消滅時，差額平均分配；追加計算＝前五年處分視為現存。"],["二、法條","§1030-1Ⅰ扣債務、排除繼承無償；§1030-3追加＋返還第三人；§1030-1Ⅴ二年／五年。"],["三、涵攝","甲：400−100(繼承)−50(債)+200(追加)＝450；乙100；差額350→分配175萬；不足額向丙於所受利益內請求返還。"],["四、結論","差額350，分配175萬；不足額對丙返還；時效2年／5年。"]]},{"n":"得分關鍵與失分點","parts":[["得分關鍵詞","剩餘財產｜平均分配｜繼承｜無償取得｜扣除債務｜追加計算｜五年內｜所受利益內返還","ok"],["常見失分點","① 把繼承所得 100 萬元算進現存財產（應排除）\n② 漏掉追加計算離婚前處分之 200 萬元\n③ 分配額寫成差額全額，忘記『平均分配』÷2\n④ 時效只寫一個期間，漏『二年／五年』兩段","bad"]]}],"m":"扣債務排繼承，追加五年內；差額對半分，不足找受贈；知悉二年關係五年","kw":["剩餘財產","平均分配","繼承","無償取得","扣除債務","追加計算","五年內","所受利益內返還","二年","五年"]}],"timer":true},ID="civ2";
