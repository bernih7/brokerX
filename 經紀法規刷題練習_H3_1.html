const QUESTIONS = [{"year": 99, "qnum": 15, "stem": "依消費者保護法之規定，定型化契約條款如有疑義時，應為有利於何人之解釋？", "options": ["企業經營者", "政府", "消費者", "消費者保護團體"], "answer": "C", "explains": {"A": "定型化契約由企業經營者單方擬定，疑義解釋不利於自己是消保法保護弱勢消費者之基本原則，非有利於企業經營者。", "B": "政府非契約當事人，非解釋利益歸屬對象。", "C": "正確。定型化契約條款如有疑義時，應為有利於「消費者」之解釋，此為消保法最核心之解釋原則（類似民法之「不利益歸於條款擬定人」原則）。", "D": "消保團體非契約當事人，非解釋利益歸屬對象。"}, "ref": "消費者保護法第11條第2項", "id": 1, "chapter": "H3"}, {"year": 99, "qnum": 17, "stem": "企業經營者與消費者訂立定型化契約前，如未能提供合理期間供消費者審閱全部條款內容時，下列何者正確？", "options": ["其條款無需經消費者之主張，仍構成契約之內容", "其條款不構成契約之內容，且消費者亦不得主張該條款構成契約之內容", "其條款不構成契約之內容，但消費者得主張該條款仍構成契約之內容", "其條款構成契約之內容，但消費者得主張該條款不構成契約之內容"], "answer": "C", "explains": {"A": "違反審閱期規定之條款「不」當然構成契約內容，本選項方向錯誤。", "B": "消費者「仍得」主張該條款構成契約內容（單方選擇權，對消費者有利即可選擇主張生效），並非完全不得主張，本選項限制過嚴。", "C": "正確。未提供合理期間審閱者，該條款原則上不構成契約內容，但賦予消費者「單方選擇權」，消費者得主張該條款仍構成契約內容（若對消費者有利），此為保護消費者之彈性設計。", "D": "原則上不構成契約內容（除非消費者主張生效），本選項方向相反。"}, "ref": "消費者保護法第11條之1", "id": 2, "chapter": "H3"}, {"year": 99, "qnum": 20, "stem": "企業經營者與消費者分期付款買賣契約應以書面為之，下列何者不為此契約書應載明事項？", "options": ["利率", "頭期款", "保證期間及其起算方法", "各期價款"], "answer": "C", "explains": {"A": "利率為分期付款契約應載明事項，非本題答案。", "B": "頭期款為分期付款契約應載明事項，非本題答案。", "C": "正確答案。「保證期間及其起算方法」為「品質保證書」之應載明事項（第25條），而非「分期付款買賣契約書」之應載明事項（第21條），兩種不同法定文件之應載明事項互相混淆，此為★高頻陷阱。", "D": "各期價款為分期付款契約應載明事項，非本題答案。"}, "ref": "消費者保護法第21條", "id": 3, "chapter": "H3"}, {"year": 99, "qnum": 22, "stem": "依消費者保護法第 45 條之規定，直轄市、縣（市）政府應設消費爭議調解委員會，並置委員幾名？", "options": ["5至7名", "5至9名", "7至15名", "9至15名"], "answer": "C", "explains": {"A": "數字錯誤。", "B": "數字錯誤。", "C": "正確。直轄市、縣（市）政府應設消費爭議調解委員會，置委員「7至15名」。", "D": "數字錯誤。"}, "ref": "消費者保護法第45條", "id": 4, "chapter": "H3"}, {"year": 99, "qnum": 25, "stem": "由消費者保護官同意後，得以自己之名義，依消費者保護法提起第 50 條消費者損害賠償訴訟或第 53 條不作為訴訟之消費者保護團體，須經許可設立多少年以上？", "options": ["5年", "4年", "3年", "2年"], "answer": "C", "explains": {"A": "數字錯誤，非5年。", "B": "數字錯誤，非4年。", "C": "正確。得提起第50條消費者損害賠償訴訟或第53條不作為訴訟之消費者保護團體，須經許可設立「3年以上」，並置有消費者保護專門人員，且申請行政院評定優良，三要件須同時具備。", "D": "數字錯誤，非2年（此為易混淆之陷阱數字，須與「3年」區辨）。"}, "ref": "消費者保護法第49條", "id": 5, "chapter": "H3"}, {"year": 99, "qnum": 38, "stem": "下列有關消費者保護官之職掌，何者錯誤？", "options": ["提起不作為訴訟", "調解消費爭議", "提起消費者損害賠償訴訟", "接受消費者申訴"], "answer": "C", "explains": {"A": "消費者保護官得提起不作為訴訟（第53條），敘述正確，非本題答案。", "B": "消費者保護官參與消費爭議調解，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。「提起消費者損害賠償訴訟」（第50條）之主體為「消費者保護團體」，並非「消費者保護官」（消費者保護官僅得提起不作為訴訟，不得提起損害賠償訴訟），主體混淆，此為★高頻陷阱。", "D": "消費者保護官職掌包含接受消費者申訴，敘述正確，非本題答案。"}, "ref": "消費者保護法第49條、第53條", "id": 6, "chapter": "H3"}, {"year": 99, "qnum": 39, "stem": "就不動產經紀業所出具的文件而言，下列何者係屬消費者保護法第 25 條所稱書面保證書？", "options": ["不動產標的現況說明書", "成交認證公報", "不動產買賣價金履約保證", "買方權益說明保證"], "answer": "C", "explains": {"A": "現況說明書屬交易資訊揭露文件，非品質保證書性質。", "B": "成交認證公報非品質保證書性質之文件。", "C": "正確。不動產買賣價金履約保證（如同履約保證機制）具備保證企業經營者履行特定義務之性質，可歸屬消保法第25條所稱之書面保證書概念。", "D": "買方權益說明保證非消保法第25條所定義之典型書面保證書態樣。"}, "ref": "消費者保護法第25條", "id": 7, "chapter": "H3"}, {"year": 99, "qnum": 40, "stem": "張三與上海不動產仲介公司因仲介服務發生消費爭議，張三得向下列那些對象申訴？①內政部 ②上海不動產仲介公司 ③行政院消費者保護委員會 ④消費者服務中心", "options": ["①②", "③④", "①③", "②④"], "answer": "D", "explains": {"A": "內政部非消保法規定之申訴對象。", "B": "行政院消保會非消保法規定之受理申訴對象（消保會為政策研議機關，非受理個案申訴之窗口）。", "C": "①③皆非法定申訴對象。", "D": "正確。消費者得向「企業經營者本身」（②上海不動產仲介公司）或「消費者服務中心或其分中心」（④）申訴，此二者為第一線受理消費爭議申訴之法定管道（消費者保護團體亦為法定申訴對象之一，惟本題選項未列入）。"}, "ref": "消費者保護法第43條", "id": 8, "chapter": "H3"}, {"year": 100, "qnum": 30, "stem": "下列何者不是消費者保護法所定品質保證書應載明之事項？", "options": ["商品之名稱", "製造商地址", "產品責任險金額", "交易日期"], "answer": "C", "explains": {"A": "商品之名稱為品質保證書應載明事項，非本題答案。", "B": "製造商地址為品質保證書應載明事項，非本題答案。", "C": "正確答案。「產品責任險金額」非消保法第25條所定書面保證書之法定應載明事項，此為虛構事項之陷阱選項。", "D": "交易日期為品質保證書應載明事項，非本題答案。"}, "ref": "消費者保護法第25條", "id": 9, "chapter": "H3"}, {"year": 100, "qnum": 32, "stem": "依消費者保護法之規定，下列有關消費爭議處理的敘述，何者錯誤？", "options": ["消費者得向企業經營者提出申訴", "消費爭議之調解程序得不公開", "消費者不得直接向法院提起訴訟", "企業經營者所屬之代表得為消費爭議調解委員"], "answer": "C", "explains": {"A": "消費者得向企業經營者提出申訴，敘述正確，非本題答案。", "B": "調解程序得不公開，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。消費者「得」直接向法院提起訴訟（申訴、調解、訴訟三種救濟途徑並無強制先後順序，消費者得逕行選擇訴訟），本選項稱不得逕行提起訴訟，方向錯誤，此為★陷阱：申訴調解並非提起消費訴訟之強制前置程序。", "D": "企業經營者代表得為消費爭議調解委員，敘述正確，非本題答案。"}, "ref": "消費者保護法第43條、第44條、第47條", "id": 10, "chapter": "H3"}, {"year": 100, "qnum": 38, "stem": "依消費者保護法規定，有關主管機關對於企業經營者興建預售屋商品出售予消費者所為之行政監督的敘述，下列何者錯誤？", "options": ["建商拒絕、規避主管機關之調查，經直轄市政府、縣（市）政府核准者，得命停止營業", "主管機關認為確有損害消費者財產之虞者，應命其限期改善或採取其他必要措施", "主管機關對消費者有發生重大損害之虞而情況危急時，應即在大眾傳播媒體公告企業經營者之名稱", "主管機關認為有損害消費者財產之虞者，應即進行調查並得公開其經過與結果"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。建商拒絕、規避主管機關調查者，主管機關「得直接」命其停止營業（或為其他必要處置），並非須另「經直轄市政府、縣（市）政府核准」此一額外程序，此為虛構附加程序之陷阱（實際上直轄市、縣市政府本身即為主管機關，無須自我核准之邏輯矛盾）。", "B": "確有損害消費者財產之虞者，應命限期改善或採取必要措施，敘述正確，非本題答案。", "C": "情況危急時應即在大眾傳播媒體公告企業經營者名稱，敘述正確，非本題答案。", "D": "有損害消費者財產之虞者應即進行調查並得公開經過結果，敘述正確，非本題答案。"}, "ref": "消費者保護法第33條、第36條", "id": 11, "chapter": "H3"}, {"year": 100, "qnum": 39, "stem": "依消費者保護法之規定，消費者保護團體以自己之名義提起第 50 條訴訟，其標的價額超過多少金額，其超過部分免繳裁判費？", "options": ["新臺幣六十萬元", "新臺幣八十萬元", "新臺幣一百萬元", "新臺幣二百萬元"], "answer": "A", "explains": {"A": "正確。消保團體以自己名義提起第50條訴訟，訴訟標的價額超過「新臺幣60萬元」者，超過部分免繳裁判費，此為鼓勵團體訴訟制度之減輕訟累設計，高頻數字。", "B": "數字錯誤，非80萬元。", "C": "數字錯誤，非100萬元。", "D": "數字錯誤，非200萬元。"}, "ref": "消費者保護法第52條", "id": 12, "chapter": "H3"}, {"year": 100, "qnum": 40, "stem": "政府為達成制定消費者保護法之目的，應就某些事項有關之法規及其執行情形，定期檢討、協調、改進之，下列何者不屬之？", "options": ["維護商品或服務之品質與安全衛生", "防止商品或服務損害消費者之生命、身體、健康、財產或其他權益", "確保商品或服務之標示，符合法令規定", "促進事業品牌形象或商譽維護"], "answer": "D", "explains": {"A": "維護商品或服務品質與安全衛生屬立法目的相關事項，非本題答案。", "B": "防止損害消費者權益屬立法目的相關事項，非本題答案。", "C": "確保標示符合法令規定屬立法目的相關事項，非本題答案。", "D": "正確答案。「促進事業品牌形象或商譽維護」係企業經營者自身商業利益，與消保法保護「消費者」權益之立法宗旨無關，此為方向錯置之陷阱選項。"}, "ref": "消費者保護法第4條", "id": 13, "chapter": "H3"}, {"year": 101, "qnum": 7, "stem": "依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額多少倍以下之懲罰性賠償金？", "options": ["三", "五", "七", "十"], "answer": "A", "explains": {"A": "正確（依101年當時法條版本）。101年（2012年）出題當時，消保法第51條規定因企業經營者故意所致之損害，消費者得請求損害額「三倍以下」之懲罰性賠償金，尚無「重大過失3倍、一般過失1倍」之分層規定。⚠️注意：現行條文（2015年修正後）已將「故意」上限提高為「五倍以下」，並新增「重大過失3倍以下」層級，回答時務必留意題目年份對應之法條版本，109年以後之題目應以「五倍」為準。", "B": "101年當時法條尚未修正至5倍，答此選項不符當年法條（惟109年後題目此答案即為正確，須依題目年份判斷）。", "C": "任何年份版本皆無7倍之規定。", "D": "任何年份版本皆無10倍之規定。"}, "ref": "消費者保護法第51條（101年版本：故意3倍以下）", "id": 14, "chapter": "H3"}, {"year": 101, "qnum": 8, "stem": "依消費者保護法規定，企業經營者使用定型化契約者，主管機關得隨時派員查核，倘阻撓調查，依法最高將處新臺幣多少萬元以下罰鍰？", "options": ["十", "十五", "二十", "三十"], "answer": "D", "explains": {"A": "數字錯誤。", "B": "數字錯誤。", "C": "數字錯誤。", "D": "正確。企業經營者拒絕、規避或阻撓主管機關派員查核定型化契約者，最高處新臺幣「30萬元」以下罰鍰。"}, "ref": "消費者保護法第56條之1", "id": 15, "chapter": "H3"}, {"year": 101, "qnum": 9, "stem": "依消費者保護法規定，企業經營者與消費者所訂分期付款買賣契約書，未依規定記載利率者，其利率按現金交易價格週年利率多少計算之？", "options": ["百分之一", "百分之三", "百分之五", "百分之六"], "answer": "C", "explains": {"A": "數字錯誤，非1%。", "B": "數字錯誤，非3%。", "C": "正確。分期付款買賣契約書未記載利率者，其利率按現金交易價格週年利率「百分之五」計算之，此為法定推定利率，高頻數字，須與「6%」（易混淆數字）區辨。", "D": "數字錯誤，非6%（此為常見混淆數字陷阱）。"}, "ref": "消費者保護法第21條", "id": 16, "chapter": "H3"}, {"year": 101, "qnum": 15, "stem": "下列名詞定義何者為錯誤？", "options": ["消費爭議：指因消費關係而向消費者保護官提起之爭議", "消費關係：指消費者與企業經營者間就商品或服務所發生之法律關係", "消費者：指以消費為目的而為交易、使用商品或接受服務者", "企業經營者：指以設計、生產、製造、輸入、經銷商品或提供服務為營業者"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。「消費爭議」之法定定義為「消費者與企業經營者間因商品或服務所生之爭議」，並非「向消費者保護官提起之爭議」（爭議之發生不以向消保官提起為要件，消保官僅是爭議處理管道之一），定義主體混淆，此為★陷阱。", "B": "消費關係定義正確，非本題答案。", "C": "消費者定義正確，非本題答案。", "D": "企業經營者定義正確，非本題答案。"}, "ref": "消費者保護法第2條", "id": 17, "chapter": "H3"}, {"year": 101, "qnum": 19, "stem": "下列敘述何者為最正確？", "options": ["消費者向企業經營者申訴，未獲妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解", "消費者向消費者保護官申訴，未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解", "消費者向消費者保護官申訴，未能獲得妥適處理時，得向消費者服務中心或其分中心申訴", "消費爭議之調解程序，應予公開"], "answer": "A", "explains": {"A": "正確答案（已依考選部公告官方單一答案核實）。消費者向企業經營者申訴未獲妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解，此為申訴轉調解之標準法定流程。", "B": "本選項描述「向消費者保護官申訴」後轉調解之流程，非法定標準申訴管道（消保官非消費者申訴之第一線對象），與官方答案A之申訴主體（企業經營者）不同，非本題答案。", "C": "C選項邏輯顛倒：消費者服務中心是申訴管道之一，非「向消保官申訴未獲妥適處理」後之後續程序。", "D": "調解程序原則上「得不公開」，並非「應公開」，此選項方向錯誤，非本題答案。"}, "ref": "消費者保護法第43條、第44條、第45條之1（已依考選部公告答案核實：官方單一答案為A）", "id": 18, "chapter": "H3"}, {"year": 102, "qnum": 22, "stem": "消費者保護法規定，企業經營者與消費者訂立定型化契約前，應有幾日以內之合理期間，供消費者審閱全部條款內容？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "D", "explains": {"A": "數字錯誤。", "B": "數字錯誤。", "C": "數字錯誤。", "D": "正確。企業經營者與消費者訂立定型化契約前，應有「30日以內」之合理期間供消費者審閱全部條款內容，此為母法審閱期上限，全科最高頻數字之一。注意：此為「30日以內」之合理期間（依契約性質及複雜程度決定實際天數），非固定「30日」，各類定型化契約應記載事項對此另有具體天數規定（如成屋5日、預售屋5日、委託銷售3日等）。"}, "ref": "消費者保護法第11條之1", "id": 19, "chapter": "H3"}, {"year": 102, "qnum": 23, "stem": "消費者保護團體之設立宗旨為何？", "options": ["處理消費爭議，提起消費訴訟", "保護消費者權益，推行消費者教育", "提供消費資訊，編印發行刊物", "接受消費者申訴，調解消費爭議"], "answer": "B", "explains": {"A": "處理消費爭議、提起消費訴訟屬消保團體之「任務」之一，非其設立「宗旨」本身。", "B": "正確。消費者保護團體之設立宗旨為「保護消費者權益，推行消費者教育」，此為消保團體存在之根本目的性描述。", "C": "提供消費資訊編印刊物屬消保團體之「任務」之一，非設立宗旨本身。", "D": "接受申訴調解爭議屬消保團體之「任務」之一，非設立宗旨本身。"}, "ref": "消費者保護法第27條", "id": 20, "chapter": "H3"}, {"year": 102, "qnum": 24, "stem": "直轄市、縣（市）政府應設何單位辦理消費者之諮詢服務、教育宣導、申訴等事項？", "options": ["消費者保護團體", "消費爭議調解委員會", "消費者服務中心", "消費者保護委員會"], "answer": "C", "explains": {"A": "消費者保護團體為民間組織，非直轄市、縣市政府應設立之官方單位。", "B": "消費爭議調解委員會職掌為調解爭議，非諮詢服務教育宣導。", "C": "正確。直轄市、縣（市）政府應設「消費者服務中心」，辦理消費者諮詢服務、教育宣導、申訴等事項。", "D": "消費者保護委員會為中央（行政院）層級機關，非地方政府應設立之單位。"}, "ref": "消費者保護法第42條", "id": 21, "chapter": "H3"}, {"year": 102, "qnum": 25, "stem": "消費者保護法針對小額消費爭議，另定有職權調解程序。所謂「小額」之額度為多少？", "options": ["十萬元", "二十萬元", "三十萬元", "四十萬元"], "answer": "A", "explains": {"A": "正確。消保法所稱小額消費爭議之額度為新臺幣「10萬元」以下，適用簡化之職權調解程序。", "B": "數字錯誤，非20萬元。", "C": "數字錯誤，非30萬元。", "D": "數字錯誤，非40萬元。"}, "ref": "消費者保護法第45條之4", "id": 22, "chapter": "H3"}, {"year": 102, "qnum": 26, "stem": "關於企業經營者對消費者保證服務品質時，應主動出具書面保證書，以下何者不屬於消費者保護法第 25條規定之服務品質保證書應載明事項？", "options": ["服務有批號者，其批號", "服務之對象", "保證之內容", "保證期間及其起算方法"], "answer": "B", "explains": {"A": "服務有批號者其批號為保證書應載明事項，非本題答案。", "B": "正確答案。「服務之對象」非消保法第25條所定書面保證書之法定應載明事項，此為虛構事項之陷阱選項。", "C": "保證之內容為保證書應載明事項，非本題答案。", "D": "保證期間及其起算方法為保證書應載明事項，非本題答案。"}, "ref": "消費者保護法第25條", "id": 23, "chapter": "H3"}, {"year": 102, "qnum": 27, "stem": "企業經營者對於消費者之申訴，應於申訴之日起幾日內妥適處理之？", "options": ["30日", "25日", "20日", "15日"], "answer": "D", "explains": {"A": "數字錯誤，非30日。", "B": "數字錯誤，非25日。", "C": "數字錯誤，非20日。", "D": "正確。企業經營者對於消費者之申訴，應於申訴之日起「15日內」妥適處理，此為全科最高頻數字之一，反覆重複命題。"}, "ref": "消費者保護法第43條", "id": 24, "chapter": "H3"}, {"year": 102, "qnum": 29, "stem": "關於消費訴訟之敘述，以下何者正確？", "options": ["消費者保護團體對於同一之原因事件，致使眾多消費者受害時，得受讓二十人以上消費者損害賠償請求權後，以自己名義，提起訴訟", "消費者保護團體受讓消費者讓與之損害賠償請求權，不包括民法第194條、第195條第1項非財產上之損害", "消費訴訟，係因企業經營者之過失所致之損害，得請求損害額三倍以下之懲罰性賠償金", "消費者保護官或消費者保護團體，就企業經營者重大違反消費者保護法有關保護消費者規定之行為，得向法院訴請停止或禁止之。前項訴訟其標的價額超過新臺幣六十萬元者，超過部分免繳裁判費"], "answer": "A", "explains": {"A": "正確。消保團體對同一原因事件致眾多消費者受害時，得受讓「20人以上」消費者損害賠償請求權後，以自己名義提起訴訟，此為消保團體訴訟制度核心門檻數字。", "B": "民法第194條為第三人（如被害人之父母子女配偶）因侵害生命權所生之慰撫金請求權，非「消費者受讓」讓與問題之典型情境，本選項細節描述超出常考範圍且非官方標準答案，本題正確答案為A。", "C": "應為請求損害額「一倍以下」（一般過失情形），此為與各年份法條版本相關之數字混淆陷阱，本題非正確答案。", "D": "不作為訴訟（第53條）標的價額免繳裁判費金額之描述，本題其餘細節超出官方標準答案範圍，正確答案應選A。"}, "ref": "消費者保護法第50條", "id": 25, "chapter": "H3"}, {"year": 102, "qnum": 30, "stem": "根據消費者保護法規定，有關主管機關對於企業經營者所販售食品所為行政監督之敘述，以下何者錯誤？", "options": ["認為企業經營者提供之食品有損害消費者生命、身體、健康或財產之虞者，應即進行調查", "於調查有必要時，得就地抽樣商品，加以檢驗，對於可為證據之食品，得自行扣押之", "直轄市或縣（市）主管機關辦理檢驗，得委託設有與檢驗項目有關之檢驗設備之消費者保護團體辦理之", "對消費者已發生重大損害而情況危急時，除命其限期回收或銷燬外，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品或為其他必要之處置"], "answer": "B", "explains": {"A": "有損害之虞者應即進行調查，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。對於可為證據之商品，主管機關「得聲請檢察官扣押之」，而非「自行扣押」（扣押涉及對財產權之強制處分，須經檢察官依法定程序為之），此為程序主體錯誤之★陷阱。", "C": "檢驗得委託消保團體辦理，敘述正確，非本題答案。", "D": "情況危急時應即公告企業經營者名稱等，敘述正確，非本題答案。"}, "ref": "消費者保護法第33條", "id": 26, "chapter": "H3"}, {"year": 102, "qnum": 31, "stem": "企業經營者以網際網路使消費者未能檢視商品而與企業經營者所為之買賣，如消費者對所收受之商品不願買受時，得於收受商品後幾日內，退回商品？", "options": ["七日", "十日", "十五日", "二十日"], "answer": "A", "explains": {"A": "正確。通訊交易（含網際網路交易）消費者於收受商品後「7日內」得retreat契約（猶豫期／解除權），無須說明理由及負擔任何費用或對價，此為消保法通訊交易保護核心制度，全科高頻數字。", "B": "數字錯誤，非10日。", "C": "數字錯誤，非15日。", "D": "數字錯誤，非20日。"}, "ref": "消費者保護法第19條", "id": 27, "chapter": "H3"}, {"year": 102, "qnum": 39, "stem": "依「預售屋買賣定型化契約應記載及不得記載事項」規定，契約審閱期間至少幾日？", "options": ["二日", "三日", "四日", "五日"], "answer": "D", "explains": {"A": "數字錯誤，非2日。", "B": "數字錯誤，非3日（3日為「不動產委託銷售契約」之審閱期，非預售屋買賣契約，須區辨）。", "C": "數字錯誤，非4日。", "D": "正確。預售屋買賣定型化契約應記載事項規定，契約審閱期間至少「5日」，與成屋買賣契約審閱期相同（皆為5日），須與委託銷售契約審閱期（3日）區辨。"}, "ref": "預售屋買賣定型化契約應記載及不得記載事項", "id": 28, "chapter": "H3"}, {"year": 103, "qnum": 23, "stem": "依消費者保護法規定，消費爭議調解辦法由何機關定之？", "options": ["消費者爭議調解委員會", "消費者保護委員會", "消費者服務中心", "各直轄市或縣（市）政府"], "answer": "B", "explains": {"A": "消費爭議調解委員會為執行調解事務之機關，非訂定調解辦法之機關。", "B": "正確。消費爭議調解辦法由「消費者保護委員會」（中央行政院層級）定之。", "C": "消費者服務中心非訂定調解辦法之機關。", "D": "地方政府非訂定全國性調解辦法之機關（僅執行辦理層級）。"}, "ref": "消費者保護法第45條之5", "id": 29, "chapter": "H3"}, {"year": 103, "qnum": 25, "stem": "甲消費者保護團體依消費者保護法第四十九條規定提起訴訟。下列敘述何者正確？", "options": ["應經消費者保護基金會的同意，始得提起該訴訟", "如已置有消費者保護專門人員，則可不委任律師代理訴訟", "如委任律師代理訴訟，該律師不得請求預付必要費用", "固然甲並非被害人，但甲仍得為該訴訟的原告"], "answer": "D", "explains": {"A": "提起訴訟不須經消費者保護基金會同意，此為虛構程序之陷阱。", "B": "依法規定，消保團體提起第49條訴訟「應委任律師代理訴訟」，不因已置有消費者保護專門人員而免除委任律師之要求。", "C": "律師「得」請求預付或償還必要費用，非不得請求，此選項方向相反。", "D": "正確。消保團體雖非被害人本身，但依法定訴訟擔當制度，仍得以自己名義為該訴訟之原告，此為消保團體訴訟制度之核心特徵。"}, "ref": "消費者保護法第49條、第50條", "id": 30, "chapter": "H3"}, {"year": 103, "qnum": 26, "stem": "因同一消費關係而被害之甲、乙、丙，依民事訴訟法之規定，選定甲與乙起訴請求損害賠償。以下敘述何者正確？", "options": ["此為法定訴訟擔當", "甲與乙稱為選定人", "甲與乙稱為選定當事人", "該訴訟繫屬中，同一消費關係之其他被害人丁與戊在法院判決前，均得併案請求賠償"], "answer": "C", "explains": {"A": "此為「任意訴訟擔當」（依民事訴訟法選定當事人制度，由多數有共同利益之人自行選定），非「法定訴訟擔當」（法定訴訟擔當如消保團體依第50條受讓提起訴訟屬另一類型）。", "B": "甲與乙為受選定提起訴訟之人，應稱為「選定當事人」，而非「選定人」（選定人是委託甲乙提起訴訟的其他被害人，即丙等人才是選定人）。", "C": "正確。甲與乙經其他有共同利益之人選定，為進行訴訟之人，依民事訴訟法規定稱為「選定當事人」。", "D": "併案請求賠償之期限及程序有一定要件限制（如須以書狀表明），非任何被害人在判決前均得無條件併案請求，敘述過於寬泛。"}, "ref": "民事訴訟法第41條、消費者保護法第54條", "id": 31, "chapter": "H3"}, {"year": 103, "qnum": 27, "stem": "消費者甲向企業經營者乙提起消費訴訟，下列敘述何者正確？", "options": ["法院為甲敗訴之判決時，得依職權宣告為減少擔保之假執行。果爾，乙得在判決確定前，聲請法院強制執行甲的財產", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假處分", "法院為乙敗訴之判決時，得依職權宣告為減少擔保之假扣押", "法院為乙敗訴之判決時，得依職權宣告為免除擔保之假執行。果爾，甲得在判決確定前，聲請法院強制執行乙的財產"], "answer": "D", "explains": {"A": "消保法特別規定係為保障「消費者（原告）勝訴」時之執行便利，本選項描述「甲敗訴」情形不符消保法立法目的之保護方向。", "B": "假處分非消保訴訟特別規定之保護型態，法條規範者為「假執行」。", "C": "假扣押非消保訴訟特別規定之保護型態，法條規範者為「假執行」。", "D": "正確。消費者甲勝訴（乙敗訴）時，法院得依職權宣告為「免除擔保」之假執行，甲得於判決確定前聲請法院強制執行乙的財產，此為消保訴訟保障消費者及時獲償之特別規定。"}, "ref": "消費者保護法第48條", "id": 32, "chapter": "H3"}, {"year": 103, "qnum": 28, "stem": "甲慈善事業的慈善經營方式是：以一般價格購買商品後，將其便宜賣給貧困者。貧困者乙向甲便宜購買商品，如因而受有身體上的損害，請問乙主張甲就此應負商品責任，有無理由？", "options": ["有理由，因為甲應負不完全給付的商品責任", "有理由，因為甲反覆為此行為並以此為業", "無理由，因為甲的行為並非以營利為目的", "無理由，因為人身損害並非商品責任所規範"], "answer": "B", "explains": {"A": "本題爭點在於甲是否屬消保法規範之「企業經營者」，非民法不完全給付責任之問題，選項論述角度錯誤。", "B": "正確。消保法所稱「企業經營者」不以「營利」為要件，僅須「反覆實施」該行為並「以此為業」（具持續性、經常性從事該經濟活動），甲慈善事業反覆販售商品予貧困者，符合企業經營者之實質定義，故乙得主張商品責任。", "C": "消保法企業經營者之認定不以營利為目的為必要要件，本選項理由錯誤。", "D": "人身損害正屬消保法商品責任（第7條安全性保障）所規範之核心範疇，本選項理由錯誤。"}, "ref": "消費者保護法第2條、第7條", "id": 33, "chapter": "H3"}, {"year": 103, "qnum": 29, "stem": "設若消費者保護基金會對於同一之原因事件，致使眾多消費者受害時，受讓甲、乙、丙等 20 位消費者損害賠償請求權後，以自己名義，提起消費訴訟。以下敘述何者正確？", "options": ["如甲僅有非財產上損害賠償請求權，因該權利具一身專屬性，故不得讓與給消費者保護基金會", "該訴訟繫屬中，如乙終止讓與損害賠償請求權，消費者保護基金會仍具當事人適格", "在該訴訟判決前，丙均得終止讓與損害賠償請求權，並通知法院", "消費者保護基金會應將該訴訟結果所得賠償，交付甲、乙、丙等20位消費者，不得扣除訴訟費用"], "answer": "B", "explains": {"A": "民法第195條非財產上損害賠償請求權原則具一身專屬性不得讓與，惟若已依契約承諾或已起訴者，例外得讓與，本選項稱「故不得讓與」過於絕對，未考慮例外情形。", "B": "正確。訴訟繫屬中，個別消費者（如乙）終止讓與損害賠償請求權，僅該部分請求權退出訴訟，消保基金會就其餘部分（甲、丙等）仍具當事人適格，訴訟不因此全部失效。", "C": "消費者於「言詞辯論終結前」得終止讓與（而非「判決前」，兩者時點略有差異，此為條文精確用語之陷阱），且終止方式及效力另有規定。", "D": "消保團體得於訴訟結果所得賠償中「扣除訴訟必要費用及得請求之報酬」後，始交付予讓與請求權之消費者，並非全額交付不得扣除。"}, "ref": "消費者保護法第50條", "id": 34, "chapter": "H3"}, {"year": 103, "qnum": 30, "stem": "依消費者保護法規定，下列有關調解之敘述何者正確？", "options": ["消費爭議調解委員會，由委員互推主席", "依消費者保護法第四十五條之二，有關一般消費爭議經委員會依職權調解提出之解決方案，應經全體調解委員過半數之同意", "當事人對委員會依職權調解之方案，得於送達後十五日之不變期間內，提出異議", "調解成立者應作成調解書。調解書之作成及效力，準用鄉鎮市調解條例第二十二條至第二十六條之規定"], "answer": "D", "explains": {"A": "主席之產生方式應由「主管機關首長或其指定人員」擔任（實務規定），非單純「委員互推」，此為程序細節之陷阱。", "B": "一般消費爭議依職權提出之解決方案，應經「參與調解委員」過半數之同意，而非「全體調解委員」過半數，此為與小額消費爭議調解門檻（全體調解委員過半數）不同之易混淆數字陷阱。", "C": "異議提出期限為送達後「10日」之不變期間，而非「15日」，數字錯誤。", "D": "正確。調解成立者應作成調解書，其作成及效力準用鄉鎮市調解條例第22條至第26條之規定（經法院核定後與民事確定判決有同一效力）。"}, "ref": "消費者保護法第45條之1、第45條之2、第46條", "id": 35, "chapter": "H3"}, {"year": 103, "qnum": 31, "stem": "依消費者保護法規定，下列有關分期付款買賣契約書之敘述何者錯誤？", "options": ["分期付款買賣契約應以書面為之", "分期付款買賣之附加費用，應明確記載併入各期價款計算之利息數額", "契約書未記載利率者，其利率按現金交易價格週年利率百分之五計算之", "契約書未載明頭期款、各期價款與其他附加費用合計之總價款與現金交易之差額者，消費者不負現金交易價格以外價款之給付義務"], "answer": "B", "explains": {"A": "分期付款買賣契約應以書面為之，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。分期付款買賣契約書應載明之事項為「各期價款與其他附加費用合計之總價款與現金交易價格之『差額』」，而非要求「將附加費用併入各期價款計算之利息數額」，此為法定應載明事項用語之混淆陷阱，實務上並非要求將所有附加費用折算為利息數額併入計算。", "C": "契約書未記載利率者按現金交易價格週年利率5%計算，敘述正確，非本題答案。", "D": "未載明總價款與現金交易差額者，消費者不負現金交易價格以外價款之給付義務，敘述正確，非本題答案，此為保護消費者不受不明附加費用侵害之重要規定。"}, "ref": "消費者保護法第21條", "id": 36, "chapter": "H3"}, {"year": 103, "qnum": 32, "stem": "依消費者保護法規定，下列有關消費者保護委員會之敘述何者錯誤？", "options": ["以行政院副院長為主任委員", "消費者保護委員會應置消費者保護官若干名", "消費者保護委員會組織規程由內政部定之", "其設立目的為研擬及審議消費者保護基本政策與監督其實施"], "answer": "C", "explains": {"A": "以行政院副院長為主任委員，敘述正確，非本題答案。", "B": "消費者保護委員會應置消費者保護官若干名，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。消費者保護委員會組織規程應由「行政院」定之，而非「內政部」，訂定機關主體錯誤，此為機關層級混淆之★陷阱。", "D": "設立目的為研擬審議消保基本政策並監督其實施，敘述正確，非本題答案。"}, "ref": "消費者保護法第40條", "id": 37, "chapter": "H3"}, {"year": 103, "qnum": 33, "stem": "有關消費者保護法第五十四條消費者集體訴訟之相關規定，下列敍述何者錯誤？", "options": ["集體訴訟之公告曉示後，其他被害人得於一定之期間內表明併案請求賠償。前述之期間，至少應有七日", "併案請求賠償之書狀，應以繕本送達於兩造", "集體訴訟之公告應黏貼於法院牌示處", "公告應登載新聞紙，其費用由國庫墊付"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。公告曉示後其他被害人得表明併案請求賠償之期間，法定至少應有「十日」（而非「七日」），此為期間數字之★陷阱。", "B": "併案請求賠償書狀應以繕本送達兩造，敘述正確，非本題答案。", "C": "公告應黏貼於法院牌示處，敘述正確，非本題答案。", "D": "公告應登載新聞紙，費用由國庫墊付，敘述正確，非本題答案。"}, "ref": "消費者保護法第54條", "id": 38, "chapter": "H3"}, {"year": 103, "qnum": 37, "stem": "甲為廣告主，非公眾人物乙與明星丙為該廣告中薦證之人，乙丙分別接受 2000 元與 20 萬元報酬。若有消費者丁因該廣告不實而受有 30 萬元損害，關於乙丙的責任，以下敘述何者不正確？", "options": ["即便丙不知情，丁依個案情形，仍可能得依法對丙請求30萬元損害賠償", "即便乙不知情，丁依個案情形，仍可能得依法對乙請求3萬元損害賠償", "如乙依法賠償丁，乙得向甲行使求償權", "如丙依法賠償丁，丙得向甲行使法定承受權"], "answer": "B", "explains": {"A": "知名薦證人（丙為明星，屬社會共知之公眾人物）即便不知情，仍可能因其較高之注意義務及影響力，於一定條件下對消費者負連帶賠償責任，此為對明知情狀舉證責任較輕的公眾人物薦證者之特別規定，敘述可能成立，非本題答案。", "B": "正確答案（不正確之敘述）。「非公眾人物」薦證者（乙）如「不知情」廣告有引人錯誤之虞而為薦證者，法律對其賠償責任設有較輕之保護（僅於受廣告主報酬之範圍內負連帶責任，例如乙僅得2000元報酬，其負擔上限即為2000元，而非依損害全額30萬元之特定金額「3萬元」，此金額與報酬顯不相當），此金額計算與法定保護非公眾人物薦證者之立法意旨不符，屬★陷阱。", "C": "薦證者依法賠償消費者後，得向廣告主甲行使求償權，敘述正確，非本題答案。", "D": "薦證者依法賠償消費者後，得於賠償金額範圍內承受消費者對廣告主之請求權（法定承受權），敘述正確，非本題答案。"}, "ref": "消費者保護法第22條之1", "id": 39, "chapter": "H3"}, {"year": 104, "qnum": 11, "stem": "依消費者保護法規定，直轄市或縣（市）政府對於建商興建預售屋商品出售予消費者所為之行政監督的敘述，下列何者錯誤？", "options": ["直轄市或縣（市）政府認為建商提供之預售屋有損害消費者生命、身體、健康或財產之虞者，應即進行調查。於調查完成後，不得公開其經過及結果", "直轄市或縣（市）政府於調查時，對於可為證據之物，得聲請檢察官扣押之", "直轄市或縣（市）政府對於建商提供之商品或服務，經調查認為確有損害消費者生命、身體、健康或財產，或確有損害之虞者，應命其限期改善、回收或銷燬", "直轄市或縣（市）政府於建商提供之商品或服務，對消費者已發生重大損害或有發生重大損害之虞，而情況危急時，除命其限期改善、回收或銷燬之處置外，應即在大眾傳播媒體公告企業經營者之名稱、地址、商品、服務、或為其他必要之處置"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。主管機關對調查有損害之虞之案件，「得公開其經過及結果」（而非「不得公開」），公開資訊是保障其他潛在消費者知情權之重要手段，本選項方向相反，屬★陷阱。", "B": "對可為證據之物得聲請檢察官扣押，敘述正確，非本題答案。", "C": "確有損害或損害之虞者應命限期改善回收銷燬，敘述正確，非本題答案。", "D": "情況危急時應即在大眾傳播媒體公告，敘述正確，非本題答案。"}, "ref": "消費者保護法第33條", "id": 40, "chapter": "H3"}, {"year": 104, "qnum": 12, "stem": "發生消費爭議時，不動產經紀業經營者對於消費者之申訴，依消費者保護法之規定，應於申訴之日起幾日內妥適處理之？", "options": ["5日", "10日", "15日", "20日"], "answer": "C", "explains": {"A": "數字錯誤，非5日。", "B": "數字錯誤，非10日。", "C": "正確。企業經營者對消費者之申訴，應於申訴之日起「15日內」妥適處理，全科最高頻數字，反覆重複命題。", "D": "數字錯誤，非20日。"}, "ref": "消費者保護法第43條", "id": 41, "chapter": "H3"}, {"year": 104, "qnum": 13, "stem": "建商銷售房屋因同一原因事件，致使眾多購屋者受害時，依消費者保護法規定，消費者保護團體得受讓多少人以上之購屋者的損害賠償請求權後，以自己名義提起訴訟？", "options": ["10人", "20人", "30人", "50人"], "answer": "B", "explains": {"A": "數字錯誤，非10人。", "B": "正確。消保團體對同一原因事件致眾多消費者受害時，得受讓「20人以上」消費者損害賠償請求權後，以自己名義提起訴訟，全科高頻數字。", "C": "數字錯誤，非30人。", "D": "數字錯誤，非50人。"}, "ref": "消費者保護法第50條", "id": 42, "chapter": "H3"}, {"year": 104, "qnum": 14, "stem": "消費者與不動產經紀業經營者因商品或服務發生消費爭議時，依消費者保護法之規定，關於爭議的解決方式，下列敘述何者錯誤？", "options": ["消費者得向不動產經紀業經營者、消費者保護團體或消費者服務中心或其分中心申訴", "消費者向等對象申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解", "調解程序，於直轄市、縣（市）政府或其他適當之處所行之，其程序得公開", "調解委員、列席協同調解人及其他經辦調解事務之人，對於調解事件之內容，除已公開之事項外，應保守秘密"], "answer": "C", "explains": {"A": "得向企業經營者、消保團體或消費者服務中心申訴，敘述正確，非本題答案。", "B": "申訴未獲妥適處理得申請調解，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。調解程序原則上「得不公開」（而非「得公開」），保護當事人隱私及和諧解決爭議之考量，此為方向相反之★陷阱。", "D": "調解相關人員對調解事件內容應保守秘密（除已公開事項外），敘述正確，非本題答案。"}, "ref": "消費者保護法第45條之1", "id": 43, "chapter": "H3"}, {"year": 104, "qnum": 15, "stem": "依消費者保護法之規定，關於消費訴訟事件，下列敍述何者錯誤？", "options": ["因不動產經紀業經營者之故意所致之損害，消費者得請求損害額5倍以下之懲罰性賠償金", "因不動產經紀業經營者之過失所致之損害，消費者得請求損害額3倍以下之懲罰性賠償金", "法院為不動產經紀業經營者敗訴之判決時，得依職權宣告減免擔保之假執行", "消費者保護團體以自己之名義提起訴訟時，其標的價額超過新臺幣60萬元者，超過部分免繳裁判費"], "answer": "B", "explains": {"A": "104年（此題出題時已適用現行法修正後版本）因故意所致之損害得請求5倍以下懲罰性賠償金，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。因「過失」（一般過失）所致之損害，消費者得請求損害額「一倍以下」之懲罰性賠償金，而非「三倍以下」（三倍以下係適用於「重大過失」情形），倍數與過失程度對應錯誤，此為現行法三層級（故意5倍、重大過失3倍、一般過失1倍）混淆之★極高頻陷阱。", "C": "企業經營者敗訴時法院得依職權宣告減免擔保之假執行，敘述正確，非本題答案。", "D": "消保團體訴訟標的價額超過60萬元部分免繳裁判費，敘述正確，非本題答案。"}, "ref": "消費者保護法第51條", "id": 44, "chapter": "H3"}, {"year": 104, "qnum": 32, "stem": "依消費者保護法之規定，企業經營者對消費者保證商品或服務之品質所出具之保證書，應載明下列那一事項？", "options": ["商品價格", "使用方法", "警告標示", "交易日期"], "answer": "D", "explains": {"A": "商品價格非保證書法定應載明事項。", "B": "使用方法非保證書法定應載明事項（此屬商品標示規範範疇）。", "C": "警告標示非保證書法定應載明事項（此屬第10條回收警告規範範疇）。", "D": "正確。交易日期為消保法第25條所定書面保證書之法定應載明事項之一。"}, "ref": "消費者保護法第25條", "id": 45, "chapter": "H3"}, {"year": 104, "qnum": 34, "stem": "依消費者保護法之規定，下列有關消費者保護團體之敘述，何者錯誤？", "options": ["消費者保護團體以社團法人或財團法人為限", "消費者保護團體之任務包含接受消費者申訴，調解消費爭議", "消費者保護團體為商品或服務之調查、檢驗時，得請求政府予以必要之協助", "消費者保護團體對於企業經營者提供之商品，認為有損害消費者健康之虞者，得命其回收"], "answer": "D", "explains": {"A": "消保團體以社團法人或財團法人為限，敘述正確，非本題答案。", "B": "消保團體任務包含接受申訴調解爭議，敘述正確，非本題答案。", "C": "消保團體為調查檢驗得請求政府必要協助，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。消保團體並「無」命企業經營者回收商品之公權力（此為主管機關之行政處分權限），消保團體僅得建議、檢舉或提起訴訟，本選項賦予消保團體不具備之公權力，此為主體權限混淆之★陷阱。"}, "ref": "消費者保護法第27條、第28條、第33條", "id": 46, "chapter": "H3"}];
const STORAGE_KEY = "brokerlaw_h3_1_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
