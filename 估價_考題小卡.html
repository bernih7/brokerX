<title>估價考題小卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* BrokerX Design System — 估價考題小卡 */
:root {
  --paper: #F8F3E9;
  --paper2: #FBF8F0;
  --paper-deep: #EFE6D5;
  --ink: #2A2722;
  --ink-soft: #7A7165;
  --line: #DDD2BB;
  --stamp: #A8402B;
  --gold: #BC8A2E;
  --green: #3F6B4C;
  --ok-bg: #EDF5F0;
  --ng-bg: #FDF0EE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Noto Sans TC",sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100%;
  padding-inline:16px;
  padding-block:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ── Header ── */
.hd{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:100;
  background:var(--paper);
  width:100%; max-width:620px;
  padding-block:12px;
  border-bottom:2px solid var(--line);
  margin-bottom:14px;
}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.eyebrow{
  font-family:"Noto Serif TC",serif;
  font-size:10px;font-weight:700;letter-spacing:.18em;
  color:var(--stamp);
  border:1px solid var(--stamp);
  border-radius:999px;padding:2px 10px;
  display:inline-block;margin-bottom:6px;
}
h1{
  font-family:"Noto Serif TC",serif;
  font-weight:900;font-size:18px;letter-spacing:.04em;
  color:var(--ink);
  text-wrap:balance;
}
.btn-icon{
  width:34px;height:34px;border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--paper2);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;transition:.15s;
}
.btn-icon:hover{border-color:var(--gold);color:var(--ink);}
.btn-icon.on{background:var(--stamp);border-color:var(--stamp);color:#fff;}

/* progress */
.prow{
  display:flex;align-items:center;gap:10px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:12px;
  color:var(--ink-soft);margin-bottom:6px;
}
.pcount{color:var(--ink);font-size:14px;}
.pbar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.pfill{height:100%;background:var(--stamp);border-radius:2px;transition:width .25s;}
.mpills{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
.mpills .ok{color:var(--green);font-weight:700;}
.mpills .ng{color:var(--stamp);font-weight:700;}

/* ── Chips ── */
.chips-wrap{width:100%;max-width:620px;margin-bottom:14px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}
.chip{
  font-size:11.5px;font-weight:700;
  font-family:"Noto Serif TC",serif;
  padding:5px 11px;border-radius:999px;
  border:1.5px solid var(--line);
  background:var(--paper2);color:var(--ink-soft);
  cursor:pointer;user-select:none;
  transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--gold);color:var(--ink);}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.chip-all{border-color:var(--stamp);color:var(--stamp);}
.chip-all.active{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.cn{font-weight:500;opacity:.65;}

/* ── Card ── */
.scene{width:100%;max-width:620px;perspective:1600px;margin-bottom:16px;}
.card{
  width:100%;min-height:480px;position:relative;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;border:1.5px solid var(--line);
  background:var(--paper2);
  display:flex;flex-direction:column;
  padding:20px;
  box-shadow:0 2px 14px rgba(42,39,34,.08);
  overflow-y:auto;
}
.face.back{
  transform:rotateY(180deg);
  background:var(--paper-deep);
  border-left:4px solid var(--stamp);
}
.cmeta{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:14px;flex-wrap:wrap;
}
.cat-b{
  font-family:"Noto Serif TC",serif;font-size:11px;font-weight:700;
  color:#fff;background:var(--stamp);
  padding:4px 12px;border-radius:999px;letter-spacing:.06em;
}
.yr-b{
  font-family:"Noto Serif TC",serif;font-size:11px;font-weight:700;
  color:var(--ink-soft);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;
}
.m-btn{font-size:18px;cursor:pointer;user-select:none;line-height:1;padding:2px;}
.qtext{font-size:14px;line-height:1.85;font-weight:500;margin-bottom:16px;color:var(--ink);}

/* Options */
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.opt{
  display:flex;align-items:flex-start;gap:9px;
  padding:10px 12px;border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--paper);
  cursor:pointer;font-size:13px;line-height:1.65;
  transition:border-color .15s,background .15s;
  color:var(--ink);
}
.opt:hover:not(.locked){
  border-color:var(--gold);
  background:#fff;
}
.opt.correct{border-color:var(--green);background:var(--ok-bg);}
.opt.wrong{border-color:var(--stamp);background:var(--ng-bg);}
.ol{
  font-family:"Noto Serif TC",serif;font-weight:700;
  font-size:12px;color:var(--ink-soft);
  min-width:18px;flex-shrink:0;margin-top:1px;
}
.opt.correct .ol{color:var(--green);}
.opt.wrong .ol{color:var(--stamp);}
.hint{
  text-align:center;font-size:11.5px;color:var(--ink-soft);
  margin-top:auto;padding-top:10px;letter-spacing:.06em;
  font-family:"Noto Serif TC",serif;
}

/* Back face */
.ans-banner{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:9px;margin-bottom:14px;
  font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
}
.ans-banner.ok{background:var(--ok-bg);color:var(--green);border:1.5px solid var(--green);}
.ans-banner.ng{background:var(--ng-bg);color:var(--stamp);border:1.5px solid var(--stamp);}
.exlist{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.ex{
  display:flex;gap:9px;font-size:12.5px;line-height:1.7;
  padding:9px 12px;border-radius:8px;
  background:var(--paper);border:1px solid var(--line);
}
.ex.is-ok{border-color:var(--green);background:var(--ok-bg);}
.exl{
  font-family:"Noto Serif TC",serif;font-weight:700;
  font-size:12px;color:var(--ink-soft);
  min-width:18px;flex-shrink:0;
}
.ex.is-ok .exl{color:var(--green);}
.note-el{
  font-size:11.5px;color:var(--gold);margin-bottom:10px;
  padding:6px 10px;border-left:3px solid var(--gold);
  background:rgba(188,138,46,.08);border-radius:0 6px 6px 0;line-height:1.6;
}
.back-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:9px;
  border:1.5px solid var(--line);
  background:var(--paper2);color:var(--ink-soft);
  cursor:pointer;font-size:12px;font-weight:700;
  font-family:"Noto Serif TC",serif;letter-spacing:.06em;
  transition:background .15s;margin-top:auto;
}
.back-btn:hover{background:#fff;border-color:var(--gold);}

/* Nav */
.nav{display:flex;gap:10px;width:100%;max-width:620px;margin-bottom:16px;}
.nbtn{
  flex:1;padding:12px 10px;border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--paper2);color:var(--ink);
  font-size:13px;font-weight:700;
  font-family:"Noto Serif TC",serif;
  cursor:pointer;transition:background .15s,border-color .15s;
  letter-spacing:.04em;
}
.nbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.nbtn:disabled{opacity:.35;cursor:default;}

/* FAB */
.fab{
  position:fixed;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;
  width:42px;height:42px;border-radius:50%;
  background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;text-decoration:none;
  box-shadow:0 3px 14px rgba(42,39,34,.25);
  z-index:200;transition:transform .15s;
}
.fab:hover{transform:scale(1.08);}
@media(prefers-reduced-motion:reduce){.card{transition:none;}}
</style>

<script>
const ITEMS=[{"id":"VA1_99_2","cat":"A1","year":"99年第2題","q":"客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行前提下，所作得以獲致最高利益之使用的估價原則是指那一種原則呢？","opts":["最有效使用原則","均衡原則","適合原則","競爭原則"],"explains":["技術規則第2條第17款明定：最有效使用，指客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行四項前提下，得以獲致最高利益之使用，與題目敘述完全相符。","均衡原則指生產要素間達最適配置，與題目所述「客觀上良好意識使用能力者」之四項前提定義無關。","適合原則指不動產與其坐落環境協調一致，與題目定義無關。","「競爭原則」並非技術規則明文定義之獨立估價原則名稱，技術規則所列原則中無此項。"],"correct":0,"note":null},{"id":"VA1_99_15","cat":"A1","year":"99年第15題","q":"要使不動產創造最高價值，其生產要素間要達到最適配置，請問此屬於何種原則？","opts":["貢獻原則","適合原則","均衡原則","收益分配原則"],"explains":["貢獻原則指局部對整體價值之貢獻（如加裝電梯提升整體價值），與「生產要素間達最適配置」此一定義不同。","適合原則指不動產與坐落環境之協調，與生產要素配置無關。","均衡原則之核心概念即為生產要素（如土地與建物比例）間達最適配置才能創造最高價值，與題目敘述相符。","「收益分配原則」是指營運性不動產應扣除非屬不動產本身之收益，與生產要素配置無關。"],"correct":2,"note":null},{"id":"VA1_99_19","cat":"A1","year":"99年第19題","q":"不動產估價時，對於土地與建物結合體於市場形成之不動產價格中，扣除土地、建物成本外，其餘部分認為是來自土地與建物之價值，此一原則係指：","opts":["土地貢獻原則","建物貢獻原則","土地建物聯合貢獻原則","均衡原則"],"explains":["「土地貢獻原則」單獨強調土地對價值之貢獻，題目敘述的是「土地與建物結合體」之聯合貢獻，非單一土地貢獻。","「建物貢獻原則」單獨強調建物對價值之貢獻，同樣與題目所述聯合貢獻概念不符。","題目描述：土地與建物結合體扣除個別成本後的剩餘部分，認為是來自土地與建物「共同聯合」貢獻所致，此即土地建物聯合貢獻原則（聯合貢獻說），是房地價值分配理論中的核心觀點。","均衡原則指生產要素達最適配置，與此處「扣除成本後剩餘價值之歸屬」定義不同。"],"correct":2,"note":null},{"id":"VA1_99_24","cat":"A1","year":"99年第24題","q":"下列何種原則強調不動產與其坐落環境間之關係？","opts":["適合原則","均衡原則","預測原則","貢獻原則"],"explains":["技術規則所稱適合原則，強調不動產與其坐落環境達成協調一致，與題目所問「不動產與其坐落環境間之關係」完全相符。","均衡原則強調的是生產要素內部配置，並非不動產與外部環境的關係。","預測（預期）原則強調對未來收益或發展之預期，並非單純坐落環境之關係。","貢獻原則強調局部對整體價值之貢獻，並非不動產與坐落環境之協調關係。"],"correct":0,"note":null},{"id":"VA1_99_30","cat":"A1","year":"99年第30題","q":"不動產估價報告中常表明評估價格適用的有效期間，此係下列何種原則的具體考量？","opts":["替代原則","競爭原則","最有效使用原則","變動原則"],"explains":["替代原則強調比較相同滿意度財貨之代價，與「評估價格適用之有效期間」無關。","「競爭原則」非技術規則明文定義之獨立原則名稱。","最有效使用原則強調合法實質可能等四項前提下獲致最高利益之使用，與「有效期間」之記載無關。","變動原則強調不動產價格隨時間變動，故估價報告書應載明價格日期及評估價格適用之有效期間，與題目敘述相符。"],"correct":3,"note":null},{"id":"VA1_100_6","cat":"A1","year":"100年第6題","q":"公寓新增電梯設備，提高了該棟建物之價值，屬於：","opts":["貢獻原則","外部性原則","預測原則","適合原則"],"explains":["貢獻原則指局部（電梯設備）對整體（建物）價值之貢獻，加裝電梯使整體價值提升，正是貢獻原則之典型例子。","外部性原則強調周邊環境設施對價格之影響，電梯設備是建物本身的內部改良，非外部環境因素。","預測（預期）原則強調對未來收益之預期，電梯設備是已完成之既有改良，非預期未來之影響。","適合原則強調不動產與坐落環境之協調，與建物內部設備提升無關。"],"correct":0,"note":null},{"id":"VA1_100_7","cat":"A1","year":"100年第7題","q":"下列何者為成本法重置成本之成立依據？","opts":["最有效使用原則","競爭原則","替代原則","均衡原則"],"explains":["最有效使用原則是估價的整體判斷基準，並非成本法重置成本之直接成立依據。","「競爭原則」非技術規則明文定義之獨立原則。","替代原則強調審慎消費者不會支付高於相同滿意度替代財貨之代價，是比較法、成本法、收益法三大方法之共同理論基礎；成本法以重建/重置成本作為價格替代依據，正是替代原則之運用（重置觀點）。","均衡原則指生產要素配置，與成本法之重置成本概念無關。"],"correct":2,"note":null},{"id":"VA1_100_8","cat":"A1","year":"100年第8題","q":"不動產之特性與其外部環境達成協調一致，是為何種原則？","opts":["外部性原則","適合原則","貢獻原則","最有效使用原則"],"explains":["外部性原則強調周邊環境設施對價格之影響（如公園、嫌惡設施），與「不動產特性與外部環境達成協調一致」此一定義不同（外部性著重影響，非協調）。","適合原則明定不動產與其坐落環境達成協調一致，與題目敘述完全相符。","貢獻原則強調局部對整體價值之貢獻，與外部環境協調無關。","最有效使用原則強調合法實質可能等四項前提下之最高利益使用，與環境協調定義不同。"],"correct":1,"note":null},{"id":"VA1_100_30","cat":"A1","year":"100年第30題","q":"不動產估價報告中常表明評估價格適用的有效期間，此係下列何種原則的具體考量？","opts":["替代原則","競爭原則","最有效使用原則","變動原則"],"explains":["替代原則強調比較相同滿意度財貨之代價，與「評估價格適用之有效期間」無關。","「競爭原則」非技術規則明文定義之獨立原則。","最有效使用原則與「有效期間」記載無關。","變動原則強調不動產價格隨時間變動，估價報告書應載明價格日期及評估價格適用之有效期間，與題目相符。"],"correct":3,"note":null},{"id":"VA1_101_5","cat":"A1","year":"101年第5題","q":"政府提出桃園航空城開發案，將帶動周邊地價上漲，此係下列何項原則的表現？","opts":["競爭原則","貢獻原則","預期原則","適合原則"],"explains":["「競爭原則」非技術規則明文定義之獨立原則。","貢獻原則強調局部對整體價值之貢獻，與「未來開發案帶動周邊地價上漲」此一對未來發展之預期效果不同。","預期（預測）原則強調對未來收益或發展之預期影響現在價值，桃園航空城開發案屬於尚未完成、預期未來將帶動地價上漲之情境，正是預期原則之典型運用。","適合原則強調不動產與坐落環境之協調，與未來開發案之預期效果無關。"],"correct":2,"note":null},{"id":"VA1_101_6","cat":"A1","year":"101年第6題","q":"下列相關原則的陳述何者最不適宜？","opts":["公園對地價的影響係基於外部性原則","老舊公寓價格飆漲係基於均衡原則","不動產有行無市呈現變動原則","在偏遠地區興建大廈卻無法創造利潤係因未能掌握最有效使用原則"],"explains":["公園屬於周邊環境設施，對地價產生加值影響，確實是外部性原則之表現，此敘述適宜，非本題答案（本題問「最不適宜」）。","均衡原則強調生產要素間達最適配置，「老舊公寓價格飆漲」是市場供需或區域發展等因素所致之價格上漲現象，與生產要素配置無直接關連，將此現象歸因於均衡原則並不適宜，即本題正解。","「不動產有行無市」反映價格隨時間、市場狀況變動之特性，符合變動原則之精神，此敘述適宜。","在偏遠地區興建大廈卻無法創造利潤，正是因為該開發未能掌握「合法、實質可能、正當合理、財務可行」四項前提中的財務可行性，屬於未能掌握最有效使用原則之表現，此敘述適宜。"],"correct":1,"note":null},{"id":"VA1_101_24","cat":"A1","year":"101年第24題","q":"如不動產其中某一條件發生改變，將造成整體不動產價格的提升，此種不動產估價原則稱之為：","opts":["供需原則","最有效使用原則","貢獻原則","均衡原則"],"explains":["供需原則並非技術規則用來描述「某一條件改變使整體價格提升」之核心概念，供需原則著重市場供給需求對價格水準之影響。","最有效使用原則強調合法實質可能等四項前提下之最高利益使用，與單一條件改變致整體提升之概念不同。","貢獻原則明定局部（某一條件）對整體（不動產）價值之貢獻，與題目所述「某一條件發生改變，將造成整體不動產價格的提升」完全相符。","均衡原則強調生產要素配置，並非單一條件改變對整體價格之貢獻效果。"],"correct":2,"note":null},{"id":"VA1_101_25","cat":"A1","year":"101年第25題","q":"進行不動產估價時，標的不動產如因捷運系統的開通，或鄰近公園的興闢，對其價格產生影響，所採行之不動產估價原則稱之為：","opts":["貢獻原則","外部性原則","收益分配原則","最有效使用原則"],"explains":["貢獻原則強調局部（不動產本身內部之要素）對整體價值之貢獻，而捷運系統、公園是不動產「外部」之周邊環境設施，性質上屬外部性而非內部貢獻。","外部性原則明定周邊環境設施（非標的本身）對價格之影響，捷運系統開通、鄰近公園興闢皆屬於標的外部之環境變化，與題目敘述完全相符。","收益分配原則指營運性不動產應扣除非屬不動產本身之收益，與外部設施對價格之影響無關。","最有效使用原則強調四項前提下之最高利益使用，與外部設施開通之影響無關。"],"correct":1,"note":null},{"id":"VA1_101_30","cat":"A1","year":"101年第30題","q":"進行不動產估價時，對營運性不動產淨收益，應扣除非屬於不動產所產生的其他淨收益，以免高估不動產本身所產生的淨收益，此估價原則稱之為：","opts":["適合原則","收益分配原則","外部性原則","最有效使用原則"],"explains":["適合原則強調不動產與坐落環境之協調，與「扣除非屬不動產淨收益以免高估」此一收益計算概念無關。","收益分配原則明定對營運性不動產淨收益，應扣除非屬於不動產所產生之其他淨收益，以免高估不動產本身所產生的淨收益，與題目敘述完全相符。","外部性原則強調周邊環境設施對價格之影響，與收益扣除概念無關。","最有效使用原則與淨收益扣除非屬不動產部分之概念無關。"],"correct":1,"note":null},{"id":"VA1_101_34","cat":"A1","year":"101年第34題","q":"對房地結合所產生之超額利潤之歸屬，採土地貢獻說者，主要係基於下列何者？","opts":["土地經營管理之貢獻","土地區位特性之貢獻","土地取得成本之貢獻","土地開發投資之貢獻"],"explains":["土地經營管理之貢獻側重後天人為經營行為，並非土地貢獻說所強調的核心要素。","土地貢獻說主張房地結合之超額利潤主要歸因於土地本身的區位特性（地段、稀缺性等先天條件），這正是土地貢獻說的核心論點。","土地取得成本之貢獻側重原始取得成本，並非土地貢獻說強調區位特性之核心論點。","土地開發投資之貢獻側重後天開發投入，並非土地貢獻說強調區位特性之核心論點。"],"correct":1,"note":null},{"id":"VA1_102_4","cat":"A1","year":"102年第4題","q":"在不考慮時間、高風險或不便利等因素下，審慎的消費者不會支付高於財貨或勞務成本之代價，以取得一相同滿意度的替代性財貨或勞務。以上觀念是屬於何種估價原則？","opts":["競爭原則","供需原則","替代原則","預測原則"],"explains":["「競爭原則」非技術規則明文定義之獨立原則，且與題目所述「不支付高於相同滿意度替代財貨代價」之定義不符。","供需原則著重市場供給需求對價格水準之影響，與題目所述比較替代財貨代價之概念不同。","替代原則明定審慎消費者不會支付高於相同滿意度替代財貨之代價，與題目敘述完全相符，是比較法、成本法、收益法三大方法之共同基礎。","預測（預期）原則強調對未來之預期影響現在價值，與題目所述「不考慮時間」之當下比較概念不符。"],"correct":2,"note":null},{"id":"VA1_102_28","cat":"A1","year":"102年第28題","q":"有關不動產估價之最有效使用原則，下列敘述何者錯誤？","opts":["為消費者主觀效用之認知","具有良好意識及通常之使用能力者之認知","需以合法、實質可能、正當合理、財務可行為前提","得以獲致最高利益之使用"],"explains":["技術規則第2條第17款明定最有效使用係「客觀上」具有良好意識及通常使用能力者之認知，並非消費者「主觀」效用之認知，本選項將客觀誤植為主觀，是錯誤敘述，即本題正解。","具有良好意識及通常之使用能力者之認知，是規則明定的正確要件，敘述正確。","需以合法、實質可能、正當合理、財務可行為前提，是規則明定的正確要件，敘述正確。","得以獲致最高利益之使用，是規則明定的正確要件，敘述正確。"],"correct":0,"note":null},{"id":"VA1_103_8","cat":"A1","year":"103年第8題","q":"不動產估價，應切合何時之價值？","opts":["價格日期當時","交易日期當時","交換日期當時","登記日期當時"],"explains":["技術規則第6條第1項明定：估價應切合價格日期當時之價值，與題目敘述完全相符，這是變動原則於估價程序中的具體落實。","交易日期是交易發生的時間點，並非估價應切合之價值基準時點。","交換日期並非技術規則規定之估價價值基準時點。","登記日期是辦理產權登記之日期，並非估價應切合之價值基準時點。"],"correct":0,"note":null},{"id":"VA1_103_23","cat":"A1","year":"103年第23題","q":"依路線價法之基本原理，假設其他條件均相同，一宗土地愈接近街道部分，其價值：","opts":["愈低","不受接近街道之影響","愈高","不變"],"explains":["路線價法基本原理為愈接近主要街道之土地，可及性與商業價值愈高，故價值應愈高而非愈低，本選項方向相反。","路線價法明確認為接近街道部分對價值有正向影響，並非不受影響，本選項與基本原理不符。","依路線價法基本原理，宗地愈接近街道，其交通可及性與使用便利性愈高，價值隨之愈高，與題目假設條件相符。","路線價法的核心精神正是反映接近街道程度造成的價值差異，並非價值不變。"],"correct":2,"note":null},{"id":"VA1_103_26","cat":"A1","year":"103年第26題","q":"捷運於某不動產附近設站，該不動產價格因而提高，此屬於何種估價原則？","opts":["供需原則","競爭原則","替代原則","外部性原則"],"explains":["供需原則著重市場整體供給需求對價格水準之影響，與捷運設站此一鄰近設施之具體影響不同。","「競爭原則」非技術規則明文定義之獨立原則。","替代原則強調比較相同滿意度替代財貨之代價，與捷運設站之影響無直接關連。","外部性原則明定周邊環境設施（捷運站）對價格之影響，捷運設站屬於不動產外部的交通建設改善，使周邊不動產價格提高，與外部性原則定義完全相符。"],"correct":3,"note":null},{"id":"VA1_103_34","cat":"A1","year":"103年第34題","q":"老舊公寓外牆進行更新，該公寓之價格因此增加，此屬於何種估價原則？","opts":["供需原則","替代原則","貢獻原則","外部性原則"],"explains":["供需原則著重市場整體供給需求，與單一建物外牆更新之內部改良無關。","替代原則著重比較相同滿意度替代財貨之代價，與外牆更新此一具體改良行為無直接關連。","貢獻原則明定局部（外牆更新）對整體（公寓）價值之貢獻，外牆更新屬於建物本身內部改良，使整體價值因此提升，與貢獻原則定義相符。","外部性原則強調周邊環境設施（非標的本身）對價格之影響，外牆更新是針對建物本身的改良，並非周邊外部環境因素，性質不符。"],"correct":2,"note":null},{"id":"VA1_103_39","cat":"A1","year":"103年第39題","q":"下列對不動產市場之描述何者有誤？","opts":["產品異質性","人為干預多","為完全競爭市場","交易成本高"],"explains":["不動產市場確實具有產品異質性高之特性（每筆不動產位置條件皆不同），此敘述正確，非本題答案（本題問「何者有誤」）。","不動產市場確實人為干預多（如政府土地使用管制、稅制政策等），此敘述正確。","不動產市場因產品異質性高、資訊不完全、交易成本高、人為干預多等特性，屬於非完全競爭市場，並非完全競爭市場，本選項描述有誤，即本題正解。","不動產市場交易成本確實偏高（如仲介費、稅費、登記規費等），此敘述正確。"],"correct":2,"note":null},{"id":"VA1_104_3","cat":"A1","year":"104年第3題","q":"下列有關不動產市場與一般商品市場比較的敘述，何者正確？","opts":["一般商品市場交易成本低，不動產市場交易成本高","一般商品市場資訊不完全，不動產市場資訊極為完全","一般商品市場經常有人為干預，不動產市場完全沒有人為干預","一般商品市場為不完全競爭市場，不動產市場為完全競爭市場"],"explains":["一般商品市場因標準化程度高、交易程序簡便，交易成本相對較低；不動產市場因產權複雜、稅費登記程序繁瑣，交易成本較高，與題目敘述相符。","一般商品市場通常資訊較為公開透明（如標準定價），不動產市場則因個別差異大而資訊不完全，本選項描述方向相反。","不動產市場同樣存在大量人為干預（如土地使用管制、稅制），並非完全沒有人為干預，本選項描述錯誤。","不動產市場因產品異質性高、進入門檻高等特性，屬於非完全競爭市場，而非完全競爭市場；一般商品市場視產業別而定，本選項描述與市場特性不符。"],"correct":0,"note":null},{"id":"VA1_105_6","cat":"A1","year":"105年第6題","q":"不動產與其環境配合，以保持協調一致之利用，則其收益才能發揮最大化，例如在學校附近開設餐廳或書局等。此現象就不動產估價原則而言，是屬下列何者？","opts":["貢獻原則","均衡原則","供需原則","適合原則"],"explains":["貢獻原則強調局部對整體價值之貢獻，與「不動產配合環境保持協調一致」此一定義不同。","均衡原則強調生產要素配置，與不動產配合周邊環境之協調無關。","供需原則著重市場整體供給需求，與不動產配合特定環境（學校附近）之適合度無關。","適合原則明定不動產與其坐落環境達成協調一致以發揮收益最大化，學校附近開設餐廳或書局正是配合周邊機能而達成的適合運用，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA1_105_8","cat":"A1","year":"105年第8題","q":"不動產估價常用之比較法、成本法與收益法，其評價基礎為何？","opts":["均衡原則","適合原則","替代原則","外部性原則"],"explains":["均衡原則強調生產要素配置，並非比較法成本法收益法三大方法之共同評價基礎。","適合原則強調不動產與環境之協調，並非三大方法之共同基礎。","替代原則明定審慎消費者不會支付高於相同滿意度替代財貨之代價，是比較法（交易觀點）、成本法（重置觀點）、收益法（投資觀點）三大估價方法之共同理論基礎。","外部性原則強調周邊環境對價格之影響，並非三大方法之共同評價基礎。"],"correct":2,"note":null},{"id":"VA1_105_10","cat":"A1","year":"105年第10題","q":"客觀淨收益之評估，應符合何種估價原則，以作為評估之基準？","opts":["最有效使用原則","替代原則","適合原則","外部性原則"],"explains":["技術規則第33條明定：客觀淨收益之評估，應以勘估標的作最有效使用之客觀淨收益為基準，與題目敘述完全相符。","替代原則是三大估價方法之共同基礎，並非客觀淨收益評估之直接基準原則。","適合原則強調不動產與環境之協調，並非客觀淨收益評估之基準。","外部性原則強調周邊環境對價格之影響，並非客觀淨收益評估之基準。"],"correct":0,"note":null},{"id":"VA1_106_20","cat":"A1","year":"106年第20題","q":"不動產是一種異質的商品，因其下列何種之特徵而分割為許多地區性市場？","opts":["區位","高程","地形","地質"],"explains":["不動產因其區位（位置）的不可移動性與唯一性，使其無法如一般商品般自由流通替代，因而分割為許多地區性市場，這是不動產異質性最核心的成因，與題目敘述相符。","高程（地勢高低）雖會影響個別不動產之條件，但並非造成「分割為許多地區性市場」此一現象的主要特徵。","地形同樣是影響個別不動產條件的因素之一，但非造成地區性市場分割之主要特徵。","地質屬於影響個別不動產條件的因素，但非造成地區性市場分割之主要特徵。"],"correct":0,"note":null},{"id":"VA1_106_23","cat":"A1","year":"106年第23題","q":"不動產附近如有公園、圖書館、學校、歌劇院等建設，皆會對其價值產生影響，此種估價時需掌握的原則較適合被稱為：","opts":["供需原則","貢獻原則","外部性原則","社會成本原則"],"explains":["供需原則著重市場整體供給需求，與周邊公共設施對價值之具體影響不同。","貢獻原則強調局部對整體價值之貢獻，但公園、圖書館等屬於不動產外部之公共設施，並非標的本身內部要素之貢獻。","外部性原則明定周邊環境設施（非標的本身）對價格之影響，公園、圖書館、學校、歌劇院等周邊建設正是典型的外部性影響因素，與題目敘述相符。","「社會成本原則」並非技術規則明文定義之獨立估價原則名稱。"],"correct":2,"note":null},{"id":"VA1_106_35","cat":"A1","year":"106年第35題","q":"有關不動產估價原則中之最有效使用原則，下列敘述何者錯誤？","opts":["具有良好意識及通常之使用能力者","在合法、實質可能、正當合理、財務可行前提下者","所作得以獲致最高利益之使用","係消費者主觀效用上"],"explains":["具有良好意識及通常之使用能力者，是技術規則明定最有效使用原則的正確要件，敘述正確，非本題答案（本題問「何者錯誤」）。","在合法、實質可能、正當合理、財務可行前提下者，是規則明定的正確要件，敘述正確。","所作得以獲致最高利益之使用，是規則明定的正確要件，敘述正確。","技術規則明定最有效使用係「客觀上」具有良好意識及通常使用能力者之認知，並非「消費者主觀效用上」之認知，本選項將客觀誤植為主觀，是錯誤敘述，即本題正解。"],"correct":3,"note":null},{"id":"VA1_106_37","cat":"A1","year":"106年第37題","q":"在不考慮時間、高風險或不便利等因素下，審慎者不會支付高於財貨或勞務成本之代價，以取得一相同滿意度的替代性財貨或勞務。是指何種不動產價格形成原則？","opts":["預測原則","競爭原則","供需原則","替代原則"],"explains":["預測（預期）原則強調對未來收益之預期，與題目所述「不考慮時間」之當下比較概念不符。","「競爭原則」非技術規則明文定義之獨立原則。","供需原則著重市場整體供給需求，與題目所述比較替代財貨代價之概念不同。","替代原則明定審慎者不會支付高於相同滿意度替代財貨之代價，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA1_107_14","cat":"A1","year":"107年第14題","q":"不動產估價報告書中載明價格日期，係立基於下列何種原則？","opts":["最有效使用原則","競爭原則","變動原則","預期原則"],"explains":["最有效使用原則強調四項前提下之最高利益使用，與「載明價格日期」此一時點性記載無直接關連。","「競爭原則」非技術規則明文定義之獨立原則。","變動原則明定不動產價格隨時間變動，故估價報告書應載明價格日期及有效期間，與題目敘述完全相符。","預期原則強調對未來之預期，與報告書載明價格日期此一基準時點記載之精神不同。"],"correct":2,"note":null},{"id":"VA1_108_9","cat":"A1","year":"108年第9題","q":"勘估標的因位於垃圾掩埋場附近，造成其價格下降，此屬於何種原則？","opts":["替代原則","最有效原則","外部性原則","供需原則"],"explains":["替代原則強調比較相同滿意度替代財貨之代價，與垃圾掩埋場此一周邊嫌惡設施之具體影響不同。","「最有效原則」非技術規則明文定義之正確原則名稱（正確名稱為最有效使用原則），且與垃圾掩埋場之影響定義不符。","外部性原則明定周邊環境設施（非標的本身）對價格之影響，垃圾掩埋場屬於典型的嫌惡設施，造成價格減損，與題目敘述完全相符。","供需原則著重市場整體供給需求，與垃圾掩埋場此一具體周邊設施之影響不同。"],"correct":2,"note":null},{"id":"VA1_109_13","cat":"A1","year":"109年第13題","q":"不動產市場是一動態的市場，對於估價的變動原則，下列敘述何者錯誤？","opts":["不動產估價應掌握影響價格的一般因素、區域因素與個別因素變動，以切合勘察日期當時之價值","影響不動產價格因素不斷變動，因此估價報告書應載明價格日期與勘察日期","運用成本法估價時，應分析使用建築材料隨時間變動的成本差異對不動產造成的價格影響","分析不動產價格景氣週期性變動，以利不動產價格變動趨勢之掌握"],"explains":["技術規則第6條明定估價應切合「價格日期」當時之價值，本選項稱「以切合勘察日期當時之價值」，將價格日期誤植為勘察日期，二者定義不同（價格日期為價格基準日期，勘察日期為現場調查日期），此為錯誤敘述，即本題正解。","影響價格因素持續變動，故估價報告書應同時載明價格日期與勘察日期，此為正確敘述。","成本法估價時確實應分析建築材料隨時間變動之成本差異，此屬變動原則於成本法之具體應用，敘述正確。","分析不動產價格景氣週期性變動，以利掌握價格變動趨勢，正是變動原則之具體實踐，敘述正確。"],"correct":0,"note":null},{"id":"VA1_110_3","cat":"A1","year":"110年第3題","q":"不動產因鄰近殯儀館，造成價格之減損，此屬於何種原則？","opts":["競爭原則","供需原則","替代原則","外部性原則"],"explains":["「競爭原則」非技術規則明文定義之獨立原則。","供需原則著重市場整體供給需求，與殯儀館此一具體周邊嫌惡設施之影響不同。","替代原則強調比較相同滿意度替代財貨之代價，與殯儀館之影響無直接關連。","外部性原則明定周邊環境設施（非標的本身）對價格之影響，殯儀館屬於典型的嫌惡設施，造成價格減損，與題目敘述相符。"],"correct":3,"note":null},{"id":"VA1_110_4","cat":"A1","year":"110年第4題","q":"公寓因加裝電梯而價格提昇，此屬於何種不動產估價原則？","opts":["外部性原則","貢獻原則","替代原則","遞增原則"],"explains":["外部性原則強調周邊環境設施（非標的本身）對價格之影響，但電梯是建物本身的內部改良設備，非外部周邊環境因素。","貢獻原則明定局部（電梯設備）對整體（公寓）價值之貢獻，加裝電梯使整體價值提升，與題目敘述完全相符。","替代原則強調比較相同滿意度替代財貨之代價，與電梯設備加裝此一具體改良行為無直接關連。","「遞增原則」非技術規則明文定義之獨立估價原則名稱。"],"correct":1,"note":null},{"id":"VA1_111_5","cat":"A1","year":"111年第5題","q":"不動產估價技術規則對「最有效使用」原則有所定義，請問下列敘述何者錯誤？","opts":["得以獲致最高利益之使用","基於合法、實質可能前提","正當合理、財務可行前提下者","具有超凡意識及使用能力者"],"explains":["得以獲致最高利益之使用，是技術規則明定最有效使用原則之正確要件，敘述正確，非本題答案（本題問「何者錯誤」）。","基於合法、實質可能前提，是規則明定四項前提中之兩項，敘述正確。","正當合理、財務可行前提下者，是規則明定四項前提中之另兩項，敘述正確。","技術規則明定最有效使用係「具有良好意識及通常之使用能力者」，並非「具有超凡意識及使用能力者」，「超凡」一詞誇大且非規則用語，此為錯誤敘述，即本題正解。"],"correct":3,"note":null},{"id":"VA1_111_20","cat":"A1","year":"111年第20題","q":"某高鐵站周圍地區的新建住宅大樓平均成交價格，由三年前每坪35萬元上漲到現今每坪接近50萬元，此現象可以不動產估價中那一原則加以解釋？","opts":["變動原則","預期原則","貢獻原則","日期原則"],"explains":["變動原則明定不動產價格隨時間變動，題目描述高鐵站周圍住宅大樓成交價格從三年前每坪35萬元上漲至現今接近50萬元，正是價格隨時間經過而產生變動的具體現象，與變動原則完全相符。","預期原則強調對「未來」收益或發展之「預期」影響「現在」價值，但題目描述的是已實際發生的「過去到現在」的價格變化趨勢，並非對未來的預期，性質不同。","貢獻原則強調局部對整體價值之貢獻，與題目所述整體市場價格隨時間上漲之現象無直接關連。","「日期原則」非技術規則明文定義之獨立估價原則名稱。"],"correct":0,"note":null},{"id":"VA1_112_4","cat":"A1","year":"112年第4題","q":"收益性不動產價值是由現在至將來所能帶給權利人之利潤總計，估價師求取將來的收益據以評估不動產價值，應重視何種不動產估價原則？","opts":["期日原則","外部性原則","預測原則","內部性原則"],"explains":["「期日原則」非技術規則明文定義之獨立估價原則名稱。","外部性原則強調周邊環境設施對價格之影響，與題目所述求取未來收益之概念不同。","預測（預期）原則明定對未來收益或發展之預期影響現在價值，題目描述收益性不動產之價值由「現在至將來」所能帶給權利人之利潤總計，估價師求取「將來」收益，正是預測原則之具體應用。","「內部性原則」非技術規則明文定義之獨立估價原則名稱。"],"correct":2,"note":null},{"id":"VA1_112_5","cat":"A1","year":"112年第5題","q":"老舊公寓因加裝電梯設備，價格也因此提升，此為何種不動產原則？","opts":["收益分配原則","貢獻原則","均衡原則","供需原則"],"explains":["收益分配原則指營運性不動產應扣除非屬不動產本身之收益，與電梯設備加裝提升整體價值之概念不同。","貢獻原則明定局部（電梯設備）對整體（公寓）價值之貢獻，加裝電梯使整體價值提升，與題目敘述完全相符。","均衡原則強調生產要素配置，與電梯設備加裝此一具體改良無關。","供需原則著重市場整體供給需求，與電梯設備加裝此一具體改良行為無關。"],"correct":1,"note":null},{"id":"VA1_113_1","cat":"A1","year":"113年第1題","q":"不動產市場循環受到諸多經濟因素的影響，評估不動產價格時都訂有價格日期，依價格日期評估時必須掌握那項原則？","opts":["預測原則","變動原則","收益分配原則","外部性原則"],"explains":["預測原則強調對未來收益之預期，與「依價格日期評估」此一基準時點性質不同。","變動原則明定不動產價格隨時間變動，故估價應訂明價格日期，與題目所述「不動產市場循環受經濟因素影響，評估時都訂有價格日期」完全相符。","收益分配原則指扣除非屬不動產本身之收益，與價格日期之訂定無關。","外部性原則強調周邊環境設施對價格之影響，與價格日期之訂定無直接關連。"],"correct":1,"note":null},{"id":"VA1_113_2","cat":"A1","year":"113年第2題","q":"王小姐住家旁有一個高壓電塔，電塔周遭的房子不太容易售出，價格也比較低，不動產估價師評估該嫌惡設施對於房屋價格的影響是基於那一項原則？","opts":["適合原則","外部性原則","貢獻原則","競爭原則"],"explains":["適合原則強調不動產與坐落環境之協調，與高壓電塔此一具體嫌惡設施之影響定義不同。","外部性原則明定周邊環境設施（非標的本身）對價格之影響，高壓電塔屬於典型的嫌惡設施，造成周遭房屋不易售出且價格較低，與題目敘述完全相符。","貢獻原則強調局部對整體價值之貢獻（通常為正向提升），與高壓電塔造成價格減損之負向影響不符。","「競爭原則」非技術規則明文定義之獨立原則。"],"correct":1,"note":null},{"id":"VA1_113_4","cat":"A1","year":"113年第4題","q":"某預售建案因取得綠建築黃金級標章，每坪開價比附近未取得標章之建案貴，建商申請綠建築標章的行為是基於不動產估價之何種經濟原則？","opts":["最高最有效原則","貢獻原則","供需原則","外部性原則"],"explains":["「最高最有效原則」非技術規則明文定義之獨立原則名稱（正確名稱為最有效使用原則）。","貢獻原則明定局部（綠建築標章認證）對整體（建案）價值之貢獻，建案因取得綠建築黃金級標章而使開價提升，正是貢獻原則之具體應用。","供需原則著重市場整體供給需求，與單一建案取得標章之具體改良行為無直接關連。","外部性原則強調周邊環境設施對價格之影響，但綠建築標章是建案本身的內部品質認證，非外部周邊環境因素。"],"correct":1,"note":null},{"id":"VA1_114_1","cat":"A1","year":"114年第1題","q":"鄰近國小的店舖，做販賣文具及圖書生意使用，此為何種不動產估價原則之掌握？","opts":["外部性原則","貢獻原則","適合原則","內部性原則"],"explains":["外部性原則強調周邊環境設施對價格之影響，但題目描述店舖「自身」販賣文具圖書與鄰近國小機能之配合，屬於使用方式與環境之適合度判斷，非單純外部設施影響。","貢獻原則強調局部對整體價值之貢獻，與店舖配合鄰近國小販售特定商品之經營策略無直接關連。","適合原則明定不動產與其坐落環境達成協調一致，鄰近國小開設文具圖書店舖，正是配合周邊機能（學生客群）而達成的適合運用，與題目敘述相符。","「內部性原則」非技術規則明文定義之獨立估價原則名稱。"],"correct":2,"note":null},{"id":"VA1_114_15","cat":"A1","year":"114年第15題","q":"下列各項原則中，何者最能說明畸零地價格偏高的現象？","opts":["預期原則","貢獻原則","適合原則","外部性原則"],"explains":["預期原則強調對未來之預期，與「畸零地價格偏高」此一既有現況之價格現象不符。","貢獻原則強調局部對整體價值之貢獻；畸零地因其特殊形狀對於鄰地合併使用後能大幅提升整體開發效益，具有相對於其面積不成比例的較高貢獻價值，這正是貢獻原則能說明畸零地價格偏高現象的核心理論。","適合原則強調不動產與環境之協調，與畸零地價格偏高之現象無直接關連。","外部性原則強調周邊環境設施對價格之影響，與畸零地本身形狀造成之價格現象不同。"],"correct":1,"note":null},{"id":"VA2_99_25","cat":"A2","year":"99年第25題","q":"對都市邊緣未來有可能變更為建地之農地進行估價，其價格種類為何？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格須具備不受特定條件影響、經適當市場行銷形成之一般市場價值，農地以「未來可能變更為建地」此特定前提估價，已附加特定條件，不符正常價格定義。","限定價格係基於①權利與所有權合併②不動產合併③違反經濟合理性之分割三種限定條件之一形成，與「以未來可能變更用途之特定條件估價」之情境不符。","技術規則第2條第3款明定：特定價格係具市場性之不動產，基於特定條件下形成之價值。農地以「未來有可能變更為建地」此一特定條件進行估價，正是特定價格之典型情境。","特殊價格指對不具市場性之不動產所估計之價值，農地本身具有市場性，不適用特殊價格。"],"correct":2,"note":null},{"id":"VA2_100_9","cat":"A2","year":"100年第9題","q":"不動產估價之價格種類，包括下列那些？①一般價格　②正常價格　③限定價格　④特定價格　⑤特別價格","opts":["②③④⑤","①②③④","①③④⑤","②③④⑤"],"explains":["①②③④缺少⑤特別價格，且①一般價格並非技術規則明定之四種價格種類之一。","技術規則第2條第1-4款明定之價格種類為正常價格②、限定價格③、特定價格④、特殊價格（題目選項用「特別價格」⑤表示，惟此處依官方答案組合②③④⑤判斷，「特別價格」應理解為「特殊價格」之題目用語），①一般價格非規則定義範圍，不應列入。","①③④⑤包含①一般價格，但一般價格非技術規則第2條明定之四種價格種類，且缺少②正常價格此一核心類別，組合錯誤。","②③④⑤皆屬技術規則第2條明定之價格種類範疇（正常、限定、特定、特殊），不含①一般價格，與官方答案組合相符。"],"correct":0,"note":null},{"id":"VA2_100_10","cat":"A2","year":"100年第10題","q":"下列何者屬於限定價格？①租賃權與租賃地合併之買賣　②企業資產重估　③違反經濟合理性之不動產分割買賣　④學校或公益使用之不動產估價","opts":["①③","①②③","①③④","①②③④"],"explains":["①租賃權與租賃地合併之買賣（屬不動產合併情形）、③違反經濟合理性之不動產分割買賣，皆屬技術規則第2條第2款明定之限定價格形成條件，組合正確。","②企業資產重估屬於會計處理目的之價值評估，並非技術規則所定義限定價格之形成條件（限定價格須基於合併或違反經濟合理性分割等特定情境）。","④學校或公益使用之不動產估價屬於使用目的之分類，並非限定價格之形成條件，限定價格強調「合併」或「分割」之交易情境而非使用目的。","②④皆非限定價格之形成條件，不應列入。"],"correct":0,"note":null},{"id":"VA2_100_13","cat":"A2","year":"100年第13題","q":"雙併公寓同層打通之住宅，其市場出售價格應以何種價格評估？","opts":["正常價格","特定價格","限定價格","特殊價格"],"explains":["雙併公寓同層打通後作為一般市場出售之住宅，其交易係在正常市場條件下進行，買賣雙方依專業知識謹慎行動，不受特定合併或分割前提之限制，屬於正常價格。","特定價格須基於特定條件（如預期變更）形成，本題並無此類特定前提，僅是物理空間打通後的一般市場出售。","限定價格須基於合併、分割等限定條件形成，本題打通後是作為一般住宅整體出售，並非以「合併」為目的之估價情境（合併已完成，現在是對打通後整體進行一般市場估價）。","特殊價格指不具市場性之不動產，本題仍具一般住宅市場性，不適用。"],"correct":0,"note":null},{"id":"VA2_101_11","cat":"A2","year":"101年第11題","q":"下例何者屬於具有市場性之價格？①正常價格　②限定價格　③特殊價格　④特定價格","opts":["①②","①②③","①②④","①②③④"],"explains":["①②僅列正常與限定價格，遺漏④特定價格，特定價格同樣具有市場性。","①②③包含③特殊價格，但特殊價格定義為「不具市場性」之不動產所估計之價值，與「具有市場性」之題目要求矛盾，不應列入。","正常價格①、限定價格②、特定價格④三者依技術規則定義皆為「具市場性」之不動產所形成之價值，僅特殊價格③為不具市場性，故①②④為正確組合。","①②③④全選，但③特殊價格不具市場性，不應列入，組合錯誤。"],"correct":2,"note":null},{"id":"VA2_101_21","cat":"A2","year":"101年第21題","q":"以不動產所有權以外其他權利與所有權合併為目的，如地上權人向地主購買設定地上權之土地，評估該土地之價格稱之為：","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格須為一般市場交易形成之價值，本題是地上權人向地主購買設定地上權之土地，屬於權利與所有權合併之特殊交易情境，非一般市場正常交易。","技術規則第2條第2款明定限定價格之第一種形成條件為「以不動產所有權以外其他權利與所有權合併為目的」，地上權人購買設定地上權之土地，正是地上權與土地所有權合併之典型情境，與題目敘述完全相符。","特定價格須基於特定條件（如預期變更）形成，本題是權利合併情境，非特定條件估價。","特殊價格指不具市場性之不動產，本題土地仍具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_101_23","cat":"A2","year":"101年第23題","q":"甲公司於A市擁有商業區土地一宗，擬將其分割為兩筆土地，一筆做為辦公大樓使用，另一筆做為百貨公司使用，以符合商業區土地的經濟效益。今如就前述兩筆土地進行估價，則價格種類為下列何者？","opts":["正常價格","特殊價格","限定價格","特定價格"],"explains":["甲公司將商業區土地分割為兩筆分別作辦公大樓與百貨公司使用，此分割係「為符合商業區土地之經濟效益」，並非違反經濟合理性之分割，反而是基於提升使用效益之合理分割，故仍應以正常價格估價（限定價格須以「違反經濟合理性之分割」為前提，本題分割合乎經濟效益，不符限定價格要件）。","特殊價格指不具市場性之不動產，本題土地具市場性，不適用。","限定價格須以「違反經濟合理性之分割」為前提形成，本題分割係為提升土地經濟效益而為，屬合理分割而非違反經濟合理性之分割，不符限定價格要件。","特定價格須基於特定條件（如預期用途變更）形成，本題並無此類特定前提，僅是依法定用途分割兩塊土地分別估價。"],"correct":0,"note":null},{"id":"VA2_102_2","cat":"A2","year":"102年第2題","q":"下列何者較接近不動產估價價格種類中之正常價格？","opts":["臺北市精華區標售國有土地價格","實價登錄之價格","奢侈稅經主管機關認定低報之銷售價格","土地徵收補償所查估之市價"],"explains":["標售國有土地之價格可能受標售程序、底價設定等特殊因素影響，未必完全反映正常市場供需下之合理價值，較難視為典型正常價格代表。","實價登錄價格未經主管機關篩選排除特殊交易（親友間買賣、急售等），可能包含非正常交易情況，不宜直接視為正常價格代表。","奢侈稅低報之銷售價格屬刻意規避稅負之不實申報價格，明顯非正常市場交易價值。","土地徵收補償所查估之市價，依規定須切實反映一般正常交易情況下之市場價值，是技術規則所稱「正常價格」概念中最具代表性、最貼近一般市場合理交易條件的查估價格。"],"correct":3,"note":null},{"id":"VA2_102_3","cat":"A2","year":"102年第3題","q":"不動產估價應先確定價格種類，如估價師受託辦理釣魚台估價，你認為應屬於何種價格？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["釣魚台主權具有爭議性質，且不具一般市場交易性，無法以一般市場條件估算正常價格。","限定價格須基於合併或分割等特定交易情境形成，釣魚台估價並非此類交易情境。","特定價格須基於特定條件（如未來用途變更）形成，與釣魚台不具市場性之本質不符。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，釣魚台屬不具一般市場交易性質之特殊不動產，與總統府、孔廟、龜山島等同屬特殊價格之典型例子。"],"correct":3,"note":null},{"id":"VA2_103_27","cat":"A2","year":"103年第27題","q":"有一畸零地之地主擬購買鄰地合併開發，委託不動產估價師評估購買價格，此價格種類為何？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["畸零地地主擬購買鄰地合併開發，此交易係基於「不動產合併」之特定目的，並非一般市場正常交易，不適用正常價格。","技術規則第2條第2款明定限定價格之第二種形成條件為「以不動產合併為目的」，畸零地地主購買鄰地以合併開發，正是不動產合併目的之典型情境，與題目相符。","特定價格須基於特定條件（如預期用途變更）形成，本題是不動產合併情境，非特定條件估價。","特殊價格指不具市場性之不動產，畸零地與鄰地皆具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_105_2","cat":"A2","year":"105年第2題","q":"請問國內某大專院校擬購買鄰接學校之土地作為擴校之用，此以合併使用為目的之不動產買賣，係屬下列何種價格？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["大專院校以擴校為目的購買鄰接學校之土地，此交易係基於合併使用之特定目的，並非一般市場正常交易，不適用正常價格。","技術規則第2條第2款明定限定價格之第二種形成條件為「以不動產合併為目的」，大專院校購買鄰地以合併使用作擴校之用，正是不動產合併目的之典型情境，與題目相符。","特定價格須基於特定條件（如預期用途變更）形成，本題是合併使用情境，非特定條件估價。","特殊價格指不具市場性之不動產，學校與鄰接土地皆具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_105_3","cat":"A2","year":"105年第3題","q":"有關特殊價格的敘述，下列何者錯誤？","opts":["總統府的估價是屬特殊價格","無法以貨幣金額表示","指對不具市場性之不動產所估計之價值","宗教建築物的估價是屬特殊價格"],"explains":["總統府屬於不具一般市場交易性之指標性建築，其估價確實屬於特殊價格之範疇，此敘述正確，非本題答案（本題問「何者錯誤」）。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產「所估計之價值，並以貨幣金額表示者」，特殊價格仍須以貨幣金額表示，並非無法以貨幣金額表示，此為錯誤敘述，即本題正解。","「指對不具市場性之不動產所估計之價值」是技術規則明定之正確定義，敘述正確。","宗教建築物（如寺廟）通常不具一般市場交易性，其估價確實屬於特殊價格，此敘述正確。"],"correct":1,"note":null},{"id":"VA2_105_7","cat":"A2","year":"105年第7題","q":"依不動產估價技術規則之規定，評估何種價格種類時，應同時估計其正常價格？","opts":["限定價格","正常租金","限定租金","特定價格"],"explains":["技術規則第2條第3款明定：特定價格須敘明估價條件，並同時估計其正常價格。惟本題標準答案為A限定價格，依規則第2條第2款及相關規定，限定價格同樣須同時估計其正常價格，作答時請以官方公告答案A為準（限定價格基於合併分割等特殊條件，須有正常價格作為比較基準，方能評估限定價格相對於正常市場之差異）。","正常租金是對應正常價格之租賃合理價值概念，並非「應同時估計正常價格」之價格種類本身。","限定租金基於續訂租約或不動產合併形成，並非本題所問「同時估計正常價格」之價格種類。","特定價格依規則規定亦須敘明估價條件並同時估計正常價格，但本題官方答案鎖定為限定價格（A），特定價格與限定價格在「須同時估計正常價格」此一要求上具有相似性，作答時請以官方公告為準。"],"correct":0,"note":null},{"id":"VA2_105_12","cat":"A2","year":"105年第12題","q":"某塊素地為都市計畫工業區土地，若以其變更為住宅區的前提來估價，請問評估之價格種類為：","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格反映一般市場正常交易情況下之價值，本題是以「變更為住宅區的前提」進行估價，已附加特定條件，不符正常價格定義。","限定價格須基於合併或分割等特定交易情境形成，本題是用途變更前提估價，非合併或分割情境。","技術規則第2條第3款明定特定價格係基於特定條件下形成之價值，工業區土地以「變更為住宅區」此一特定前提進行估價，正是特定價格之典型情境（與都市計畫變更相關的預期估價）。","特殊價格指不具市場性之不動產，工業區土地具市場性，不適用。"],"correct":2,"note":null},{"id":"VA2_106_1","cat":"A2","year":"106年第1題","q":"不動產估價應敘明價格種類，如估價師受託辦理太平島估價，您認為應屬於何種價格？","opts":["限定價格","正常價格","特定價格","特殊價格"],"explains":["限定價格須基於合併或分割等特定交易情境形成，太平島估價並非此類交易情境。","正常價格須反映一般市場正常交易情況，太平島具有特殊地理及主權性質，不具一般市場交易性，不適用正常價格。","特定價格須基於特定條件（如未來用途變更）形成，與太平島不具市場性之本質不符。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，太平島與釣魚台、龜山島、東沙島等同屬不具一般市場交易性質之特殊不動產，屬特殊價格。"],"correct":3,"note":null},{"id":"VA2_106_2","cat":"A2","year":"106年第2題","q":"下列何種情況，可歸類於不動產估價價格種類中之正常價格？","opts":["實價登錄經主管機關篩選之價格","臺北市精華區標售國有土地價格","土地徵收補償所查估之市價","實價課稅經主管機關認定低報之價格"],"explains":["實價登錄價格若僅是「經主管機關篩選」，未必完全排除特殊交易因素，未必能直接視為正常價格的典型代表。","標售國有土地之價格可能受標售程序、底價設定等特殊機制影響，未必完全反映正常市場供需下之合理價值。","土地徵收補償所查估之市價，依規定須切實反映一般正常交易情況下之市場價值，是技術規則所稱正常價格概念中最具代表性的查估價格。","實價課稅經主管機關認定低報之價格，屬刻意規避稅負之不實申報價格，明顯非正常市場交易價值。"],"correct":2,"note":null},{"id":"VA2_107_16","cat":"A2","year":"107年第16題","q":"勘估標的是一都市邊緣之農地，未來極有可能變更為建地，今依委託人要求針對勘估標的未來可能變更為建地情況進行估價，其價格種類為何？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格反映一般市場正常交易情況下之價值，本題依委託人要求以「未來可能變更為建地情況」進行估價，已附加特定條件，不符正常價格定義。","限定價格須基於合併或分割等特定交易情境形成，本題是用途變更前提估價，非合併或分割情境。","技術規則第2條第3款明定特定價格係基於特定條件下形成之價值，都市邊緣農地以「未來極有可能變更為建地」此一特定前提進行估價，正是特定價格之典型情境。","特殊價格指不具市場性之不動產，農地具市場性，不適用。"],"correct":2,"note":null},{"id":"VA2_108_1","cat":"A2","year":"108年第1題","q":"甲君擬購買相鄰兩塊土地合併建築，請問在此目的下所評估出的價值，以貨幣金額表示者，稱為：","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格反映一般市場正常交易情況下之價值，本題是以「合併建築」為目的之估價，已附加特定合併條件，不符正常價格定義。","技術規則第2條第2款明定限定價格之第二種形成條件為「以不動產合併為目的」，甲君擬購買相鄰兩塊土地合併建築，正是不動產合併目的之典型情境，與題目相符。","特定價格須基於特定條件（如預期用途變更）形成，本題是合併目的情境，非特定條件估價。","特殊價格指不具市場性之不動產，本題土地具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_108_24","cat":"A2","year":"108年第24題","q":"對具有市場性之不動產，以違反經濟合理性之不動產分割為前提，查估其所形成之價值，並以貨幣金額表示者，屬下列那一種價格？","opts":["特殊價格","特定價格","正常價格","限定價格"],"explains":["特殊價格指對「不具市場性」之不動產所估計之價值，本題標的具有市場性，不適用特殊價格。","特定價格須基於特定條件（如未來用途變更）形成，本題是分割情境，非特定條件估價。","正常價格反映一般市場正常交易情況下之價值，本題以「違反經濟合理性之分割」為前提估價，已偏離正常交易情況，不符正常價格定義。","技術規則第2條第2款明定限定價格之第三種形成條件為「以違反經濟合理性之不動產分割為前提」，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA2_108_25","cat":"A2","year":"108年第25題","q":"下列敘述何者為正確？","opts":["具有市場性之不動產，以不動產所有權以外其他權利與所有權合併為目的，查估其所形成之價值，並以貨幣金額表示者，屬「限定價格」","具有市場性之不動產，基於特定條件下形成之價值，並以貨幣金額表示者，為「特殊價格」","對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為「特定價格」","對不具市場性之不動產，以不動產合併為目的，查估其所形成之價值，並以貨幣金額表示者，屬「限定價格」"],"explains":["技術規則第2條第2款明定限定價格之第一種形成條件為「以不動產所有權以外其他權利與所有權合併為目的」，與本選項描述完全相符，為正確敘述。","特定價格（而非特殊價格）才是「基於特定條件下形成之價值」，本選項將特定價格之定義誤植為特殊價格，敘述錯誤。","特殊價格才是「對不具市場性之不動產所估計之價值」，本選項將特殊價格之定義誤植為特定價格，敘述錯誤。","限定價格須是「具有市場性」之不動產，本選項描述「對不具市場性之不動產，以不動產合併為目的」，將具市場性與不具市場性的前提混淆，且不具市場性之不動產合併估價應屬特殊價格範疇，敘述錯誤。"],"correct":0,"note":null},{"id":"VA2_109_12","cat":"A2","year":"109年第12題","q":"正常價格的定義中，不包含下列那一要件？","opts":["形成正常價格的不動產具備市場性","係為有意願的買賣雙方，依專業知識分析與謹慎行動的交易","有意願之買賣雙方不受債權債務關係或親友關係人等等壓力或脅迫","經適當市場行銷及交易雙方條件形成之價值"],"explains":["正常價格定義要件之一為「形成正常價格的不動產具備市場性」，這是正確要件，非本題答案（本題問「不包含」哪一要件）。","「係為有意願的買賣雙方，依專業知識分析與謹慎行動的交易」是技術規則第2條第1款正常價格定義的正確要件之一。","「有意願之買賣雙方不受債權債務關係或親友關係人等等壓力或脅迫」同樣是正常價格定義的正確要件之一。","正常價格定義要求「經適當市場行銷及『正常交易條件』形成之價值」，本選項稱「交易雙方條件形成之價值」，未精確對應規則用語「正常交易條件」，此為定義中不包含或表述不精確之要件，即本題正解。"],"correct":3,"note":null},{"id":"VA2_109_24","cat":"A2","year":"109年第24題","q":"依據不動產估價技術規則規定，不動產估價應敘明價格種類，請問辦理東沙島估價，此屬於何種價格？","opts":["正常價格","特殊價格","限定價格","特定價格"],"explains":["正常價格須反映一般市場正常交易情況，東沙島具特殊地理及主權性質，不具一般市場交易性，不適用正常價格。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，東沙島與釣魚台、太平島、龜山島等同屬不具一般市場交易性質之特殊不動產，屬特殊價格。","限定價格須基於合併或分割等特定交易情境形成，東沙島估價並非此類交易情境。","特定價格須基於特定條件（如未來用途變更）形成，與東沙島不具市場性之本質不符。"],"correct":1,"note":null},{"id":"VA2_110_7","cat":"A2","year":"110年第7題","q":"對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為何種價格？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格須具備市場性並反映一般市場正常交易情況，與「不具市場性」之前提矛盾。","限定價格須是「具有市場性」之不動產基於合併分割等條件形成，與「不具市場性」之前提矛盾。","特定價格須是「具有市場性」之不動產基於特定條件形成，與「不具市場性」之前提矛盾。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，並以貨幣金額表示者，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA2_110_16","cat":"A2","year":"110年第16題","q":"土地承租人欲購買所承租土地供未來繼續使用，委託不動產估價師進行估價，其價格種類為何？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格反映一般市場正常交易情況下之價值，本題承租人購買所承租土地供繼續使用，屬於權利與所有權合併之特殊情境，非一般市場正常交易。","技術規則第2條第2款明定限定價格之第一種形成條件為「以不動產所有權以外其他權利與所有權合併為目的」，土地承租人（具租賃權）欲購買所承租土地（取得所有權），正是租賃權與所有權合併之典型情境，與題目敘述相符。","特定價格須基於特定條件（如預期用途變更）形成，本題是權利合併情境，非特定條件估價。","特殊價格指不具市場性之不動產，本題土地具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_111_2","cat":"A2","year":"111年第2題","q":"不動產估價應敘明價格種類，當不動產估價師受託辦理龜山島估價，您認為應屬於何種價格種類？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格須反映一般市場正常交易情況，龜山島具特殊地理性質，不具一般市場交易性，不適用正常價格。","限定價格須基於合併或分割等特定交易情境形成，龜山島估價並非此類交易情境。","特定價格須基於特定條件（如未來用途變更）形成，與龜山島不具市場性之本質不符。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，龜山島與釣魚台、太平島、東沙島等同屬不具一般市場交易性質之特殊不動產，屬特殊價格。"],"correct":3,"note":null},{"id":"VA2_111_12","cat":"A2","year":"111年第12題","q":"不動產估價之限定價格指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者。請問下列何者非屬限定條件？","opts":["以不動產所有權以外其他權利與所有權合併為目的","以不動產合併為目的","以違反經濟合理性之不動產分割為前提","經適當市場行銷及正常交易條件形成"],"explains":["「以不動產所有權以外其他權利與所有權合併為目的」是技術規則第2條第2款明定的限定條件之一，非本題答案（本題問「非屬」哪一限定條件）。","「以不動產合併為目的」同樣是規則明定的限定條件之一。","「以違反經濟合理性之不動產分割為前提」同樣是規則明定的限定條件之一。","「經適當市場行銷及正常交易條件形成」是正常價格的定義要件，並非限定價格的限定條件；限定價格恰好是「在限定條件下」形成，與正常市場行銷交易條件形成之概念相反，本選項非屬限定條件，即本題正解。"],"correct":3,"note":null},{"id":"VA2_111_13","cat":"A2","year":"111年第13題","q":"不動產估價，應註明其價格種類；以何種價格估價時應敘明其估價條件，並同時估計其正常價格？","opts":["限定價格","特殊價格","特定價格","特別價格"],"explains":["限定價格須敘明估價條件，但依技術規則規定特定價格之規範更直接對應「敘明估價條件並同時估計正常價格」之描述。","特殊價格指不具市場性不動產之估價，不涉及「敘明估價條件並同時估計正常價格」之要求。","技術規則第6條第2項及第2條第3款明定：以特定價格估價者，應敘明其估價條件，並同時估計其正常價格，與題目敘述完全相符。","「特別價格」並非技術規則明定之正式價格種類名稱，技術規則僅定義正常、限定、特定、特殊四種價格。"],"correct":2,"note":null},{"id":"VA2_111_22","cat":"A2","year":"111年第22題","q":"科學園區附近的農業用地，未來可能變更為建地，土地所有權人要求估價人員針對其農地未來可能變更為建地情況進行估價，請問該筆土地的價格屬於何種類？","opts":["正常價格","特定價格","限定價格","特殊價格"],"explains":["正常價格反映一般市場正常交易情況下之價值，本題是依土地所有權人要求以「未來可能變更為建地情況」進行估價，已附加特定條件，不符正常價格定義。","技術規則第2條第3款明定特定價格係基於特定條件下形成之價值，科學園區附近農地以「未來可能變更為建地」此一特定前提進行估價，正是特定價格之典型情境。","限定價格須基於合併或分割等特定交易情境形成，本題是用途變更前提估價，非合併或分割情境。","特殊價格指不具市場性之不動產，農地具市場性，不適用。"],"correct":1,"note":null},{"id":"VA2_112_2","cat":"A2","year":"112年第2題","q":"不動產估價師受託評估總統府價值，此屬於何種價格種類？","opts":["申報價格","特殊價格","特定價格","限定價格"],"explains":["「申報價格」並非技術規則明定之正式價格種類，屬於混淆選項。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，總統府屬於指標性公有建築，不具一般市場交易性，與孔廟、媽祖廟等同屬特殊價格之典型例子。","特定價格須基於特定條件（如未來用途變更）形成，與總統府不具市場性之本質不符。","限定價格須基於合併或分割等特定交易情境形成，總統府估價並非此類交易情境。"],"correct":1,"note":null},{"id":"VA2_113_17","cat":"A2","year":"113年第17題","q":"下列那種情況評估的是特殊價格？","opts":["估價師受託辦理評估因都市計畫將公園變更為住宅用地之土地價格","估價師受託辦理評估以土地租賃權與租賃地合併為目的之價格","估價師受託辦理評估大甲鎮瀾宮的價格","估價師受託辦理評估都市邊緣未來可能變更為建地的農地價格"],"explains":["都市計畫將公園變更為住宅用地之土地價格，是基於「特定條件」（都市計畫變更）形成之價值，屬於特定價格而非特殊價格。","土地租賃權與租賃地合併為目的之價格，是「權利與所有權合併」之情境，屬於限定價格而非特殊價格。","大甲鎮瀾宮是著名宗教建築物，與孔廟、媽祖廟同屬不具一般市場交易性之指標性建築，依技術規則第2條第4款屬於特殊價格，與題目敘述相符。","都市邊緣未來可能變更為建地的農地價格，是基於「特定條件」（未來變更）形成之價值，屬於特定價格而非特殊價格。"],"correct":2,"note":null},{"id":"VA2_114_16","cat":"A2","year":"114年第16題","q":"評估臺南孔廟的現值，依不動產估價技術規則之規定，其價格種類為下列何者？","opts":["正常價格","限定價格","特定價格","特殊價格"],"explains":["正常價格須反映一般市場正常交易情況，孔廟具特殊宗教文化性質，不具一般市場交易性，不適用正常價格。","限定價格須基於合併或分割等特定交易情境形成，孔廟估價並非此類交易情境。","特定價格須基於特定條件（如未來用途變更）形成，與孔廟不具市場性之本質不符。","技術規則第2條第4款明定特殊價格係對不具市場性之不動產所估計之價值，臺南孔廟屬於著名宗教文化古蹟，不具一般市場交易性，與總統府、媽祖廟等同屬特殊價格之典型例子。"],"correct":3,"note":null},{"id":"VA3_99_4","cat":"A3","year":"99年第4題","q":"直轄市或縣市政府對轄區內之土地，應經常調查其地價動態，繪製地價區段圖並估計區段地價，提經地價評議委員會評議之後，於每年1月1日公告，此乃何種價格？","opts":["公告現值","公告地價","拍賣地價","收購地價"],"explains":["公告現值是地價稅與土地增值稅課徵基準，每年1月1日公告，但題目描述的是「經常調查地價動態、繪製區段地價」之程序，此程序屬於公告地價的查估作業（公告現值另有獨立查估程序）。","依平均地權條例規定，直轄市或縣市政府應經常調查轄區地價動態，繪製地價區段圖並估計區段地價，提經地價評議委員會評定後，於每年1月1日公告，此即公告地價，與題目敘述完全相符。","拍賣地價是法院拍賣程序中決定之價格，與政府例行性地價動態調查公告無關。","收購地價是政府收購土地時議定之價格，與例行性地價動態調查公告程序不同。"],"correct":1,"note":null},{"id":"VA3_99_22","cat":"A3","year":"99年第22題","q":"請問對於不動產估價而言，兩岸簽訂ＥＣＦＡ屬於何種因素？","opts":["一般因素","區域因素","個別因素","特定因素"],"explains":["ECFA（兩岸經濟合作架構協議）屬於全國性、整體經濟政策層面之協議，影響範圍涵蓋全國不動產市場，符合一般因素「對不動產市場及價格水準發生全面影響之自然、政治、社會、經濟等共同因素」之定義。","區域因素指影響近鄰地區不動產價格水準之因素，ECFA為全國性政策，非侷限於特定近鄰地區之影響。","個別因素指不動產本身條件所產生之價格差異因素，與ECFA此一總體經濟政策無關。","「特定因素」並非技術規則第2條明定之獨立因素分類名稱，技術規則僅分一般、區域、個別三層次因素。"],"correct":0,"note":null},{"id":"VA3_99_23","cat":"A3","year":"99年第23題","q":"下列不動產價格影響因素中何者屬於個別因素？","opts":["興建焚化爐","捷運站規劃","臨街寬度","設置加油站"],"explains":["興建焚化爐屬於影響特定區域內不動產價格水準之公共設施規劃，性質上是影響近鄰地區之區域因素，非個別因素。","捷運站規劃同樣是影響周邊近鄰地區不動產價格水準之區域因素，非個別因素。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「臨街寬度」是勘估標的本身臨接道路的具體寬度條件，屬於標的自身特性，符合個別因素定義。","設置加油站屬於影響周邊區域不動產價格水準之鄰避設施規劃，性質上是區域因素，非個別因素。"],"correct":2,"note":null},{"id":"VA3_99_27","cat":"A3","year":"99年第27題","q":"比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍稱之為何？","opts":["生活圈","類似地區","近鄰地區","同一供需圈"],"explains":["「生活圈」並非技術規則第2條明定之正式用語，技術規則使用的是近鄰地區、類似地區、同一供需圈等專有名詞。","類似地區指同一供需圈內，近鄰地區以外而使用性質相近之地區，與題目所述「能成立替代關係且價格互為影響之最適範圍」此一更廣泛的定義不符（類似地區是同一供需圈的次集合）。","近鄰地區指勘估標的或比較標的周圍，形成同質性較高之地區，範圍小於同一供需圈，與題目所述「最適範圍」定義不符。","技術規則第2條第10款明定同一供需圈係指比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍，與題目敘述完全相符（同一供需圈＝近鄰地區＋類似地區）。"],"correct":3,"note":null},{"id":"VA3_100_1","cat":"A3","year":"100年第1題","q":"政策宣示不動產交易將採實價登錄，此於不動產估價中屬於影響價格的何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則第2條明定之獨立因素分類名稱。","個別因素指不動產本身條件所產生之價格差異，實價登錄政策非標的本身條件。","區域因素指影響近鄰地區不動產價格水準之因素，實價登錄屬全國性政策，非侷限特定區域。","技術規則第2條第14款明定一般因素係對不動產市場及價格水準發生全面影響之自然、政治、社會、經濟等共同因素，政策宣示實價登錄屬全國性交易制度變革，影響全國不動產市場，符合一般因素定義。"],"correct":3,"note":null},{"id":"VA3_100_2","cat":"A3","year":"100年第2題","q":"飛航管制對於建築高度之限制，此於不動產估價中屬於影響價格的何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明定之獨立因素分類名稱。","飛航管制對建築高度之限制，通常依特定機場周邊範圍劃設限建區，此限制直接影響該特定勘估標的本身可建築之高度條件，屬於標的本身之使用限制條件，依技術規則定義應歸類為個別因素（惟若依限制範圍涵蓋整個近鄰地區之角度觀察，亦有歸類為區域因素之可能，本題依官方答案採個別因素，作答時請以官方公告為準並留意此類題目常因適用範圍認定不同而產生爭議）。","區域因素指影響近鄰地區不動產價格水準之因素，若飛航管制範圍涵蓋整個近鄰地區，亦可能被視為區域因素，惟本題官方答案為個別因素。","一般因素係全國性、整體經濟社會政治環境之共同因素，飛航管制屬特定機場周邊之限制規定，非全國性一般因素。"],"correct":1,"note":"官方答案表標示為C，惟飛航管制依限制範圍性質亦可能歸類個別因素，作答時請以官方答案為準並留意題目係問「建築高度限制」之適用範圍（區域性管制規定）。"},{"id":"VA3_100_3","cat":"A3","year":"100年第3題","q":"不動產座北朝南，此於不動產估價中屬於影響價格的何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「座北朝南」是勘估標的本身之座向條件，屬於標的自身特性，符合個別因素定義。","區域因素指影響近鄰地區不動產價格水準之因素，座向是標的本身特性而非區域共通條件。","一般因素係全國性共同因素，與單一標的之座向條件無關。"],"correct":1,"note":null},{"id":"VA3_100_4","cat":"A3","year":"100年第4題","q":"下列因素那些屬於影響地價之一般因素？①利率　②位置　③道路寬度　④土地形狀　⑤土地政策","opts":["①③","②④","①⑤","①②③④⑤"],"explains":["①利率屬於影響全國經濟之金融政策因素，符合一般因素定義；③道路寬度是影響特定區域或標的本身之條件，非全國性一般因素。","②位置是不動產本身或鄰近區域之條件，非全國性一般因素；④土地形狀是標的本身之個別因素，非一般因素。","技術規則第2條第14款明定一般因素係對不動產市場及價格水準發生全面影響之自然、政治、社會、經濟等共同因素，①利率（金融政策）與⑤土地政策（全國性政策）皆屬全國性共同因素，符合一般因素定義。","①②③④⑤全選，但②位置、③道路寬度、④土地形狀皆屬區域或個別因素層次，非一般因素，不應全部列入。"],"correct":2,"note":null},{"id":"VA3_100_5","cat":"A3","year":"100年第5題","q":"勘估標的距離捷運車站之遠近為下列何種影響因素？","opts":["區域因素","個別因素","特別因素","一般因素"],"explains":["技術規則第2條第15款明定區域因素係影響近鄰地區不動產價格水準之因素，捷運車站之設置會影響其周邊整個近鄰地區的不動產價格水準，屬於區域因素。","個別因素指不動產本身條件，而距離捷運站之遠近是影響周邊整個區域之共通條件，非僅標的本身特有條件，屬於區域因素而非個別因素。","「特別因素」並非技術規則明文定義之獨立因素分類名稱。","一般因素係全國性共同因素，捷運車站之遠近僅影響特定近鄰區域，非全國性影響。"],"correct":0,"note":null},{"id":"VA3_100_17","cat":"A3","year":"100年第17題","q":"因接近行動電話基地臺而引起之價值減損，屬於下列何種因素？","opts":["物理的因素","功能的因素","特殊的因素","經濟的因素"],"explains":["物理的因素通常指建物本身結構、材料等實體狀況，與行動電話基地台此一外部嫌惡設施之影響性質不同。","功能的因素通常指建物設計、配置等使用功能層面，與行動電話基地台之影響性質不同。","「特殊的因素」並非技術規則用以分類影響因素性質之正式用語。","因接近行動電話基地台引起之價值減損，屬於民眾對電磁波等健康疑慮所反映之心理與經濟層面影響，技術規則上將此類非實體、非功能但實際影響市場價值之因素歸類為經濟的因素（廣義之外部性影響反映在價格水準上）。"],"correct":3,"note":null},{"id":"VA3_101_1","cat":"A3","year":"101年第1題","q":"下列那些因素屬於影響土地價格之個別因素？①土地形狀　②土地面積　③貸款利率　④地價稅稅率","opts":["①②","③④","①②④","②③④"],"explains":["①土地形狀、②土地面積皆屬不動產本身條件所產生之價格差異因素，符合技術規則第2條第16款個別因素之定義。","③貸款利率屬於影響全國金融市場之一般因素，④地價稅稅率屬於影響全國稅制之一般因素，皆非個別因素。","①②④組合中含④地價稅稅率，但地價稅稅率是全國性稅制規定，非標的本身條件，不應列入個別因素。","②③④組合中含③④兩項一般因素，且遺漏①土地形狀此一明確個別因素，組合錯誤。"],"correct":0,"note":null},{"id":"VA3_101_2","cat":"A3","year":"101年第2題","q":"歐債風暴對臺灣不動產市場的影響，此於不動產估價中屬於影響價格的何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","個別因素指不動產本身條件，歐債風暴屬國際總體經濟事件，非標的本身條件。","區域因素指影響近鄰地區不動產價格水準之因素，歐債風暴影響範圍涵蓋全國甚至全球，非侷限特定近鄰地區。","技術規則第2條第14款明定一般因素係對不動產市場及價格水準發生全面影響之政治、社會、經濟等共同因素，歐債風暴屬國際總體經濟事件，透過總體經濟管道影響臺灣整體不動產市場，符合一般因素定義。"],"correct":3,"note":null},{"id":"VA3_101_7","cat":"A3","year":"101年第7題","q":"土地徵收補償市價查估與區段式公告土地現值查估相較，兩者主要的差異在於下列那一影響不動產價格因素調整的考量？","opts":["個別因素","區域因素","一般因素","特別因素"],"explains":["土地徵收補償市價查估須針對每筆土地之個別條件（如形狀、臨路、使用現況等）逐筆精算，較區段式公告土地現值更著重個別差異之調整，符合個別因素之考量。","區域因素影響近鄰地區整體價格水準，兩種查估方式皆會考量區域因素，非本題鑑別之主要差異所在。","一般因素是全國性共同因素，兩種查估方式皆受其影響，非鑑別差異所在。","「特別因素」非技術規則明文定義之獨立因素分類名稱。"],"correct":0,"note":null},{"id":"VA3_102_1","cat":"A3","year":"102年第1題","q":"特種貨物與勞務稅（俗稱奢侈稅）近日研議之修法動向，對不動產市場之影響，是屬於下列何種因素？","opts":["一般因素","區域因素","個別因素","期待因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場及價格水準發生全面影響之政治、社會、經濟等共同因素，奢侈稅修法動向屬全國性稅制政策變動，影響全國不動產市場，符合一般因素定義。","區域因素指影響近鄰地區不動產價格水準之因素，奢侈稅政策非侷限特定區域。","個別因素指不動產本身條件，與全國性稅制政策無關。","「期待因素」並非技術規則第2條明定之獨立因素分類名稱（預期或預測屬於估價原則範疇，非影響因素分類）。"],"correct":0,"note":null},{"id":"VA3_102_23","cat":"A3","year":"102年第23題","q":"下列何者非屬區域因素調整的考量項目？","opts":["交通條件","樓層別條件","商圈發展條件","學區條件"],"explains":["交通條件是影響近鄰地區整體可及性之共通條件，屬於區域因素調整之考量項目。","樓層別條件是區分所有建物各樓層間使用效益差異之個別條件，與該宗地所在區域之共通條件無關，屬於房地估價中個別樓層之考量項目，非區域因素調整之考量項目，即本題正解。","商圈發展條件是影響近鄰地區整體商業活絡程度之共通條件，屬於區域因素調整之考量項目。","學區條件是影響近鄰地區整體教育資源之共通條件，屬於區域因素調整之考量項目。"],"correct":1,"note":null},{"id":"VA3_102_26","cat":"A3","year":"102年第26題","q":"勘估標的距離變電所遠近為以下何種影響因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「距離變電所遠近」是針對該勘估標的本身與變電所之相對距離所產生之個別差異，屬於個別因素。","區域因素指影響近鄰地區整體不動產價格水準之共通因素，本題所述為單一標的與變電所之相對距離，屬個別條件而非區域共通條件。","一般因素係全國性共同因素，與單一標的距離變電所遠近此一具體個別條件無關。"],"correct":1,"note":null},{"id":"VA3_103_4","cat":"A3","year":"103年第4題","q":"美國第二輪量化寬鬆（QE2）貨幣政策對臺北市不動產市場的影響，於不動產估價中屬於影響價格的何種因素？","opts":["一般因素","區域因素","個別因素","特殊因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場及價格水準發生全面影響之經濟等共同因素，美國QE2貨幣政策屬國際總體經濟事件，透過總體經濟管道影響臺北市整體不動產市場，符合一般因素定義。","區域因素指影響近鄰地區不動產價格水準之因素，QE2影響範圍涵蓋全國（甚至全球）市場，非侷限特定近鄰地區。","個別因素指不動產本身條件，與國際貨幣政策無關。","「特殊因素」並非技術規則明文定義之獨立因素分類名稱。"],"correct":0,"note":null},{"id":"VA3_103_6","cat":"A3","year":"103年第6題","q":"不動產位於路沖，此於不動產估價中屬於影響價格的何種因素？","opts":["一般因素","區域因素","個別因素","特殊因素"],"explains":["一般因素係全國性共同因素，與單一標的位於路沖此一具體位置條件無關。","區域因素指影響近鄰地區整體不動產價格水準之共通因素，路沖是該特定標的自身之位置特性，非區域共通條件。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「位於路沖」是勘估標的本身之位置條件，屬於標的自身特性，符合個別因素定義。","「特殊因素」並非技術規則明文定義之獨立因素分類名稱。"],"correct":2,"note":null},{"id":"VA3_103_13","cat":"A3","year":"103年第13題","q":"比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍，稱之為：","opts":["近鄰地區","類似地區","共同生活圈","同一供需圈"],"explains":["近鄰地區指勘估標的或比較標的周圍，形成同質性較高之地區，範圍小於同一供需圈，與題目所述「最適範圍」定義不符。","類似地區指同一供需圈內，近鄰地區以外而使用性質相近之地區，是同一供需圈的次集合，與題目所述最適範圍定義不符。","「共同生活圈」並非技術規則第2條明定之正式用語。","技術規則第2條第10款明定同一供需圈係指比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA3_103_16","cat":"A3","year":"103年第16題","q":"財政部目前正在研擬合理課稅方案，擬將房地合一課稅並納入實價課稅精神。此屬於影響不動產價格之何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","個別因素指不動產本身條件，房地合一課稅方案非標的本身條件。","區域因素指影響近鄰地區不動產價格水準之因素，房地合一課稅方案非侷限特定區域。","技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之經濟政策等共同因素，財政部研擬房地合一課稅方案屬全國性稅制政策，影響全國不動產市場，符合一般因素定義。"],"correct":3,"note":"官方答案表標示為D（一般因素）。"},{"id":"VA3_103_25","cat":"A3","year":"103年第25題","q":"不動產位於路角地，雙面採光，此於不動產估價中屬於影響價格之何種因素？","opts":["特殊因素","個別因素","區域因素","一般因素"],"explains":["「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「位於路角地，雙面採光」是勘估標的本身之位置與採光條件，屬於標的自身特性，符合個別因素定義。","區域因素指影響近鄰地區整體不動產價格水準之共通因素，路角地雙面採光是該特定標的自身特性，非區域共通條件。","一般因素係全國性共同因素，與單一標的之位置採光條件無關。"],"correct":1,"note":null},{"id":"VA3_103_31","cat":"A3","year":"103年第31題","q":"下列有關影響不動產價格的因素，何者屬區域因素？","opts":["地區主要道路的連接性","臨接道路寬度","臨街寬度","宗地臨街情形"],"explains":["技術規則第2條第15款明定區域因素係影響近鄰地區不動產價格水準之因素，「地區主要道路的連接性」是描述整個地區的交通網絡狀況，影響範圍涵蓋整個近鄰地區，屬於區域因素。","「臨接道路寬度」是針對勘估標的本身臨接道路的具體寬度，屬於標的自身條件，為個別因素而非區域因素。","「臨街寬度」同樣是標的本身臨街部分的寬度條件，屬於個別因素。","「宗地臨街情形」是描述該宗地本身與街道之相對關係，屬於標的自身條件之個別因素。"],"correct":0,"note":null},{"id":"VA3_104_4","cat":"A3","year":"104年第4題","q":"下列有關影響近鄰地區不動產價格水準之區域因素的敘述，何者錯誤？","opts":["軍事禁限建與使用分區管制，影響不動產價值","街道配置與公共設施愈完備，其不動產價值愈高","宗地坵塊面臨街道之寬度愈寬，其不動產價值愈高","瓦斯、上下水道等公用設備愈完備，其不動產價值愈高"],"explains":["軍事禁限建與使用分區管制，確實會影響整個近鄰地區不動產之使用強度與價值，此敘述正確，非本題答案（本題問「何者錯誤」）。","街道配置與公共設施完備程度，是影響近鄰地區整體不動產價值之區域因素，此敘述正確，街道配置公共設施愈完備則不動產價值愈高，符合常理。","「宗地坵塊面臨街道之寬度」是該宗地「本身」臨街的具體寬度，屬於標的本身之個別因素，而非影響「近鄰地區」整體不動產價格水準之區域因素，本選項將個別因素誤植為區域因素之敘述，即本題正解。","瓦斯、上下水道等公用設備完備程度，是影響近鄰地區整體不動產價值之區域因素，此敘述正確。"],"correct":2,"note":"依官方答案表標示C為錯誤選項，惟此敘述內容本身符合一般原則；推測本題正確答案另有其爭議點，作答時建議以官方公告答案為準，並留意題目係問「錯誤」敘述。"},{"id":"VA3_104_5","cat":"A3","year":"104年第5題","q":"下列何者不屬於鄰避設施（NIMBY）？","opts":["公園","監獄","變電廠","垃圾掩埋場"],"explains":["公園屬於受民眾歡迎之公共設施，通常對周邊不動產價值產生正向加值效果，並非鄰避設施（NIMBY，Not In My Backyard，指民眾不願其鄰近設置之嫌惡設施），即本題正解。","監獄屬於典型的鄰避設施，民眾普遍不願鄰近居住，會造成周邊不動產價值減損。","變電廠同樣屬於典型的鄰避設施，因電磁波疑慮及景觀影響造成周邊不動產價值減損。","垃圾掩埋場是典型的鄰避設施，因環境污染及異味問題造成周邊不動產價值減損。"],"correct":0,"note":null},{"id":"VA3_104_6","cat":"A3","year":"104年第6題","q":"房地合一課稅的相關法案，已經立法院三讀通過，總統公布，並訂於2016年1月1日實施，其對不動產市場之影響是屬於下列何種因素？","opts":["一般因素","個別因素","特殊因素","區域因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之政治社會經濟等共同因素，房地合一課稅相關法案經立法院三讀通過並訂定全國一致實施日期，屬全國性稅制政策變革，符合一般因素定義。","個別因素指不動產本身條件，與全國性稅制立法無關。","「特殊因素」並非技術規則明文定義之獨立因素分類名稱。","區域因素指影響近鄰地區之因素，房地合一課稅是全國一致適用之稅制，非侷限特定區域。"],"correct":0,"note":null},{"id":"VA3_104_7","cat":"A3","year":"104年第7題","q":"下列有關比較法估價時之區域分析的敘述，何者正確？","opts":["類似地區係指同一供需圈內，近鄰地區內與勘估標的使用性質相近之地區","同一供需圈係指比較標的與勘估標的間能成立貢獻關係，且其價格互為影響之最適範圍","近鄰地區係指勘估標的或比較標的周圍，供相同或類似用途之不動產，形成異質性較高之地區","區域分析是要分析判定對象不動產屬於何種地區，有何特性，其對該地區內之不動產價格形成有何影響等"],"explains":["技術規則第2條第13款明定類似地區係指同一供需圈內，「近鄰地區以外」而使用性質相近之地區，本選項稱「近鄰地區內」，將「以外」誤植為「內」，定義方向相反，敘述錯誤。","同一供需圈定義係比較標的與勘估標的間能成立「替代關係」，本選項稱「貢獻關係」，用語錯誤，技術規則明確使用「替代關係」一詞。","近鄰地區定義係供相同或類似用途之不動產，形成「同質性較高」之地區，本選項稱「異質性較高」，定義方向相反，敘述錯誤。","區域分析的目的正是要分析判定對象不動產屬於何種地區，有何特性，其對該地區內不動產價格形成有何影響，此為正確之區域分析定義敘述。"],"correct":3,"note":null},{"id":"VA3_104_28","cat":"A3","year":"104年第28題","q":"下列那一個區域比較可能符合不動產估價技術規則中所定義與臺北市信義區的不動產具替代關係，且其價格互為影響之「同一供需圈」？","opts":["香港上環","上海徐家匯區","紐約曼哈頓區","臺北市大安區"],"explains":["香港上環與臺北市信義區分屬不同國家、不同貨幣與法律制度之市場，難以成立替代關係，不符同一供需圈定義。","上海徐家匯區同樣與信義區分屬不同國家市場制度，難以成立替代關係。","紐約曼哈頓區與信義區地理位置相距遙遠，分屬不同國家市場，難以成立替代關係及價格互為影響之關係。","技術規則第2條第10款明定同一供需圈係比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。臺北市大安區與信義區地理位置相鄰，同屬臺北市精華區域，購屋者在兩區之間具有實質的替代選擇可能性，價格水準也會互相影響，符合同一供需圈之定義。"],"correct":3,"note":null},{"id":"VA3_105_5","cat":"A3","year":"105年第5題","q":"就住宅用地之估價而言，下列何者非屬影響價格水準之區域因素？","opts":["公共設施、公益設施等配置狀態","噪音、空氣污染、土壤污染等公害發生之程度","臨接道路之寬度","離市中心之距離及交通設施狀態"],"explains":["公共設施、公益設施等配置狀態，是影響近鄰地區整體不動產價值之區域因素，此選項屬於區域因素，非本題答案（本題問「非屬」區域因素）。","噪音、空氣污染、土壤污染等公害發生程度，是影響近鄰地區整體環境品質之區域因素，屬於區域因素。","「臨接道路之寬度」是針對勘估標的本身臨接道路的具體寬度，屬於標的自身條件之個別因素，而非影響近鄰地區整體不動產價格水準之區域因素，即本題正解。","離市中心之距離及交通設施狀態，是影響近鄰地區整體可及性之區域因素，屬於區域因素。"],"correct":2,"note":"依官方答案表標示C為非屬區域因素之選項，臨接道路寬度實務上常歸類為個別因素（標的本身條件），與其餘三項屬區域因素（周邊環境條件）性質不同，此即本題鑑別點。"},{"id":"VA3_105_9","cat":"A3","year":"105年第9題","q":"影響不動產價格的一般因素，不包含下列何者？","opts":["房地合一稅制之推動","國民所得水準","距離捷運站遠近","兩岸政策之改變"],"explains":["房地合一稅制之推動屬全國性稅制政策，影響全國不動產市場，是一般因素，此選項屬於一般因素，非本題答案（本題問「不包含」哪一項）。","國民所得水準是反映全國整體經濟發展狀況之指標，屬於一般因素。","「距離捷運站遠近」是影響特定近鄰地區整體不動產價值之區域因素，而非全國性一般因素，即本題正解（影響因素不包含此項一般因素）。","兩岸政策之改變屬全國性政治經濟政策，影響全國不動產市場，是一般因素。"],"correct":2,"note":null},{"id":"VA3_105_11","cat":"A3","year":"105年第11題","q":"臺灣老年人口的比例正大幅增加，高齡化社會已成為重大議題，此屬於何種影響價格因素？","opts":["一般因素","區域因素","個別因素","特殊因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之社會等共同因素，臺灣老年人口比例大幅增加、高齡化社會議題，屬全國性社會結構變遷，影響全國不動產市場（如養老宅、無障礙空間需求），符合一般因素定義。","區域因素指影響近鄰地區之因素，高齡化是全國性社會現象，非侷限特定區域。","個別因素指不動產本身條件，與全國人口結構變遷無關。","「特殊因素」並非技術規則明文定義之獨立因素分類名稱。"],"correct":0,"note":null},{"id":"VA3_105_36","cat":"A3","year":"105年第36題","q":"依不動產估價技術規則之規定，下列敘述何者正確？","opts":["比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍稱為近鄰地區","勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區，稱為類似地區","所選用之比較標的與勘估標的不在同一近鄰地區內時，應進行區域因素調整","所選用之比較標的與勘估標的不在同一近鄰地區內時，應進行個別因素調整"],"explains":["技術規則明定同一供需圈係比較標的與勘估標的間能成立替代關係之最適範圍，本選項稱此為「近鄰地區」，定義名稱誤植，敘述錯誤。","技術規則明定近鄰地區係供相同或類似用途之不動產形成「同質性較高」之地區，本選項描述符合近鄰地區定義，但題目要求找出「正確」敘述，需與其他選項比較確認。","技術規則第19條第3款明定：比較標的與勘估標的不在同一近鄰地區內時，應將比較標的價格轉化為勘估標的同一近鄰地區之價格水準，此調整即為區域因素調整，與本選項描述相符，為正確敘述。","比較標的與勘估標的不在同一近鄰地區內時，應進行的是「區域因素調整」而非「個別因素調整」，本選項調整類型誤植，敘述錯誤。"],"correct":2,"note":null},{"id":"VA3_106_22","cat":"A3","year":"106年第22題","q":"容積移轉及容積調派制度的實施，對不動產價值發生影響的因素被稱為：","opts":["行政條件","政治條件","社會條件","接近條件"],"explains":["容積移轉及容積調派制度屬於政府透過行政法規調控土地使用強度之政策工具，其對不動產價值之影響歸類為行政條件（即政府行政管制措施對不動產市場之影響），與題目敘述相符。","政治條件通常指更廣泛的政治體制或政局穩定度因素，容積移轉調派制度是具體的行政管理措施，非政治條件。","社會條件通常指人口結構、社會風氣等社會性因素，與容積移轉調派此一具體行政管制工具性質不同。","「接近條件」通常指不動產與特定設施之距離遠近，與容積移轉調派制度性質不同。"],"correct":0,"note":null},{"id":"VA3_108_3","cat":"A3","year":"108年第3題","q":"不動產面臨道路之寬度，此屬於影響不動產價格之何種因素？","opts":["個別因素","區域因素","一般因素","特別因素"],"explains":["技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「不動產面臨道路之寬度」是該標的本身臨路的具體寬度條件，屬於標的自身特性，符合個別因素定義。","區域因素指影響近鄰地區整體不動產價格水準之共通因素，本題所述為單一標的本身面臨道路之寬度，屬個別條件而非區域共通條件。","一般因素係全國性共同因素，與單一標的面臨道路寬度此一具體個別條件無關。","「特別因素」並非技術規則明文定義之獨立因素分類名稱。"],"correct":0,"note":null},{"id":"VA3_108_12","cat":"A3","year":"108年第12題","q":"政府宣布實施空屋稅政策，此屬於何種影響價格之因素？","opts":["個別因素","情況因素","一般因素","區域因素"],"explains":["個別因素指不動產本身條件，空屋稅政策非標的本身條件。","「情況因素」是比較法調整流程中的概念（描述交易非正常情形），並非影響不動產價格之三層次因素分類之一。","技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之政治經濟政策等共同因素，政府實施空屋稅政策屬全國性稅制政策，影響全國不動產市場，符合一般因素定義。","區域因素指影響近鄰地區之因素，空屋稅是全國一致適用之政策，非侷限特定區域。"],"correct":2,"note":null},{"id":"VA3_110_1","cat":"A3","year":"110年第1題","q":"政府宣布實價登錄2.0新制自110年7月1日施行，此為影響不動產價格之何種因素？","opts":["情況因素","一般因素","區域因素","個別因素"],"explains":["「情況因素」是比較法調整流程中的概念，並非影響價格之三層次因素分類之一。","技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之政治經濟政策等共同因素，實價登錄2.0新制屬全國一致施行之交易制度變革，影響全國不動產市場，符合一般因素定義。","區域因素指影響近鄰地區之因素，實價登錄新制是全國一致適用之政策，非侷限特定區域。","個別因素指不動產本身條件，與全國性交易制度變革無關。"],"correct":1,"note":null},{"id":"VA3_110_2","cat":"A3","year":"110年第2題","q":"不動產所在地區對外連絡道路為中山路，路寬30公尺，並有兩線捷運經過。請問此為影響不動產價格之何種因素？","opts":["情況因素","一般因素","區域因素","個別因素"],"explains":["「情況因素」是比較法調整流程中的概念，並非影響價格之三層次因素分類之一。","一般因素係全國性共同因素，題目所述對外連絡道路寬度與捷運經過情形，是描述特定地區之具體條件，非全國性政策或現象。","技術規則第2條第15款明定區域因素係影響近鄰地區不動產價格水準之因素，題目描述該不動產所在地區之對外連絡道路（中山路，路寬30公尺）及捷運經過情形，是描述整個地區的交通網絡條件，影響範圍涵蓋整個近鄰地區，屬於區域因素。","個別因素指不動產本身條件，題目描述的是「地區」之對外連絡道路及捷運狀況，而非該特定標的本身之條件，屬於區域因素而非個別因素。"],"correct":2,"note":null},{"id":"VA3_110_17","cat":"A3","year":"110年第17題","q":"近年受疫情影響，各地商圈人潮減少、店面空置率提高，此屬於何種價格影響因素？","opts":["一般因素","區域因素","個別因素","總體因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之社會經濟等共同因素，疫情屬全國性（甚至全球性）公共衛生事件，透過總體經濟與社會行為改變影響全國各地商圈，符合一般因素定義。","區域因素指影響特定近鄰地區之因素，但題目描述「各地商圈」均受影響，屬於全國性現象而非侷限特定區域。","個別因素指不動產本身條件，與疫情此一全國性公共衛生事件無關。","「總體因素」並非技術規則第2條明定之正式因素分類名稱（技術規則僅分一般、區域、個別三層次）。"],"correct":0,"note":null},{"id":"VA3_111_1","cat":"A3","year":"111年第1題","q":"平均地權條例近日研議抑制炒房之修法動向，其對不動產市場之影響，是屬於不動產估價影響因素中之下列何種因素？","opts":["市場因素","一般因素","區域因素","個別因素"],"explains":["「市場因素」並非技術規則第2條明定之正式因素分類名稱。","技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之政治經濟政策等共同因素，平均地權條例修法動向屬全國性土地政策法規變動，影響全國不動產市場，符合一般因素定義。","區域因素指影響近鄰地區之因素，平均地權條例修法是全國一致適用之法規，非侷限特定區域。","個別因素指不動產本身條件，與全國性修法動向無關。"],"correct":1,"note":null},{"id":"VA3_112_1","cat":"A3","year":"112年第1題","q":"不動產售屋廣告中「面對公園第一排」，對不動產之影響，是屬於不動產估價影響因素中之何種因素？","opts":["一般因素","市場因素","區域因素","個別因素"],"explains":["一般因素係全國性共同因素，「面對公園第一排」是該特定標的本身與公園之相對位置關係，非全國性政策或現象。","「市場因素」並非技術規則第2條明定之正式因素分類名稱。","區域因素指影響近鄰地區整體不動產價格水準之共通因素，「面對公園第一排」是該特定標的自身之位置特性，非區域共通條件。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「面對公園第一排」是該標的本身與公園緊鄰之具體位置條件，屬於標的自身特性，符合個別因素定義。"],"correct":3,"note":null},{"id":"VA3_112_3","cat":"A3","year":"112年第3題","q":"各直轄市、縣（市）國土計畫於110年4月30日公告實施，此為影響不動產價格之何種因素？","opts":["一般因素","市場因素","區域因素","個別因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之政治社會等共同因素，國土計畫於各直轄市縣市同步公告實施，屬全國一致性之國土空間規劃政策，影響全國不動產市場，符合一般因素定義。","「市場因素」並非技術規則第2條明定之正式因素分類名稱。","區域因素指影響近鄰地區之因素，國土計畫雖按各直轄市縣市分別公告，但其本質是全國一致性之國土空間規劃政策架構，屬一般因素而非單一近鄰地區之區域因素。","個別因素指不動產本身條件，與國土計畫此一全國性空間規劃政策無關。"],"correct":0,"note":null},{"id":"VA3_113_11","cat":"A3","year":"113年第11題","q":"中央銀行理監事會於113年第3季會議決議調升存款準備率及調整選擇性信用管制措施，此項宣布可能會影響不動產市場與價值，此為影響不動產價值之何種因素？","opts":["一般因素","情況因素","區域因素","個別因素"],"explains":["技術規則第2條第14款明定一般因素係對不動產市場發生全面影響之經濟金融政策等共同因素，中央銀行調升存款準備率及信用管制措施屬全國性貨幣金融政策，影響全國不動產市場與融資環境，符合一般因素定義。","「情況因素」是比較法調整流程中的概念，並非影響價格之三層次因素分類之一。","區域因素指影響近鄰地區之因素，中央銀行貨幣政策是全國一致適用之政策，非侷限特定區域。","個別因素指不動產本身條件，與全國性貨幣政策無關。"],"correct":0,"note":null},{"id":"VA3_113_18","cat":"A3","year":"113年第18題","q":"影響不動產價格的三大因素中區域因素甚為重要，下列敘述何者非屬區域因素的描述？","opts":["王小姐的房子位於信義計畫區內房價水準很高","張先生的房子距離大安森林公園約50公尺條件很好","板橋埔墘生活圈生活機能很好","中正紀念堂周遭的房子有很好的價值條件"],"explains":["「王小姐的房子位於信義計畫區內房價水準很高」是描述信義計畫區此一近鄰地區之整體房價水準，屬於區域因素之描述，此選項屬於區域因素，非本題答案（本題問「非屬」區域因素）。","「張先生的房子距離大安森林公園約50公尺」是描述該特定標的本身與公園之具體距離關係，屬於標的自身條件之個別因素，而非影響整個近鄰地區之區域因素，即本題正解。","「板橋埔墘生活圈生活機能很好」是描述特定生活圈（近鄰地區）之整體機能水準，屬於區域因素之描述。","「中正紀念堂周遭的房子有很好的價值條件」是描述中正紀念堂周遭此一近鄰地區之整體價值水準，屬於區域因素之描述。"],"correct":1,"note":null},{"id":"VA3_114_13","cat":"A3","year":"114年第13題","q":"下列因素：①地區淹水　②捷運站設置　③利率變動　④離小學距離，那些是屬於影響不動產價格之區域因素？","opts":["①②","①③","②③④","①②③④"],"explains":["①地區淹水是描述整個地區之共通淹水風險，影響近鄰地區整體不動產價值，屬區域因素；②捷運站設置同樣是影響周邊整個近鄰地區之區域因素，①②組合正確。","①地區淹水正確，但③利率變動屬全國性金融政策，是一般因素而非區域因素，組合錯誤。","②③④組合中，③利率變動是一般因素，④離小學距離是該標的本身之個別因素，皆非區域因素，僅②捷運站設置屬區域因素，組合錯誤過多。","①②③④全選，但③利率變動為一般因素、④離小學距離為個別因素，皆非區域因素，不應全部列入。"],"correct":0,"note":null},{"id":"VA3_114_14","cat":"A3","year":"114年第14題","q":"下列何者是個別因素之描述？","opts":["甲先生的房子位於重劃區內，房價水準很高","乙小姐的房子距捷運站距離大約50公尺","X大學特定區生活機能佳","大巨蛋球場完工，周圍不動產房價跟著起漲"],"explains":["「甲先生的房子位於重劃區內，房價水準很高」是描述重劃區此一近鄰地區之整體房價水準，屬於區域因素之描述，非個別因素。","技術規則第2條第16款明定個別因素係不動產本身條件所產生之價格差異因素，「乙小姐的房子距捷運站距離大約50公尺」是該特定標的本身與捷運站之具體距離關係，屬於標的自身條件，符合個別因素定義。","「X大學特定區生活機能佳」是描述特定區（近鄰地區）之整體生活機能水準，屬於區域因素之描述。","「大巨蛋球場完工，周圍不動產房價跟著起漲」是描述周圍整個區域因重大建設完工而房價普遍上漲之現象，屬於影響近鄰地區整體之區域因素，非個別因素。"],"correct":1,"note":null},{"id":"VA4_99_29","cat":"A4","year":"99年第29題","q":"不動產估價作業程序中應確定之基本事項為：","opts":["委託人","勘察日期","估價條件","估價費用"],"explains":["委託人是估價委託關係之當事人，並非技術規則第9條明定之估價基本事項項目（基本事項著重於估價本身的條件設定，委託人身分屬於委託關係範疇而非此處所列四項基本事項之一，但實務上仍會記載）。","勘察日期是赴現場調查之日期，技術規則明定基本事項中為「價格日期」而非「勘察日期」，二者不同。","技術規則第9條明定估價基本事項包含：勘估標的內容、價格日期、價格種類及條件（估價條件）、估價目的，「估價條件」是其中明定項目之一，與本選項相符。","估價費用是估價服務之對價，非技術規則明定應確定之估價基本事項項目。"],"correct":2,"note":null},{"id":"VA4_101_8","cat":"A4","year":"101年第8題","q":"下列何者不屬於從事不動產估價前需確定之基本事項？","opts":["價格種類","勘察日期","勘估標的權利狀態","估價條件"],"explains":["價格種類是技術規則第9條明定應確定之估價基本事項之一，非本題答案（本題問「不屬於」基本事項）。","技術規則第9條明定之基本事項為價格日期，而非勘察日期；勘察日期是赴現場調查之日期，屬於估價程序中「確認勘估標的狀態」階段的工作，非屬「確定基本事項」階段之項目，即本題正解。","勘估標的權利狀態屬於確定勘估標的內容之一環，是基本事項範疇。","估價條件是技術規則第9條明定之基本事項之一。"],"correct":1,"note":null},{"id":"VA4_101_9","cat":"A4","year":"101年第9題","q":"下列那些項目屬於不動產估價技術規則所指之勘估標的？①果樹　②房屋　③智慧財產權　④地上權　⑤租賃權","opts":["③④⑤","②③④⑤","①②④⑤","①②③④⑤"],"explains":["③④⑤遺漏①果樹與②房屋，但①②皆屬於不動產估價技術規則所稱之勘估標的（房屋為土地改良物，果樹為農作改良物之一種具體個案需視成熟程度判斷，惟一般成長中之果樹本身可列入勘估標的範圍探討）。","②③④⑤包含③智慧財產權，但智慧財產權非屬不動產估價技術規則所稱之勘估標的範圍（不動產估價著重於土地、建物及其權利，不含智慧財產權此類無形資產）。","技術規則所稱勘估標的包含土地、建物（房屋）及其權利（地上權、租賃權等），①果樹（生長中之農作改良物）、②房屋（建物）、④地上權（權利）、⑤租賃權（權利）皆屬於勘估標的範圍，③智慧財產權則不屬之，故①②④⑤為正確組合。","①②③④⑤全選，但③智慧財產權不屬於不動產估價技術規則所稱之勘估標的，不應列入。"],"correct":2,"note":null},{"id":"VA4_101_10","cat":"A4","year":"101年第10題","q":"不動產估價所稱之價格日期係指：","opts":["接受委託估價之日期","赴勘估標的現場調查之日期","估價報告書提出之日期","估價報告書上勘估標的價格之日期"],"explains":["接受委託估價之日期是估價委託關係成立之日期，並非技術規則所稱之價格日期。","赴勘估標的現場調查之日期是「勘察日期」，與價格日期定義不同。","估價報告書提出之日期是完成估價作業並提交報告之日期，並非價格基準日期本身。","技術規則第2條第7款明定價格日期係指表示估價報告書上所載勘估標的價格之基準日期，與題目敘述相符。"],"correct":3,"note":null},{"id":"VA4_101_19","cat":"A4","year":"101年第19題","q":"都市計畫住宅區現供耕作使用之土地，其地價之查估應依下列何種使用價格查估？","opts":["農業用地","住宅用地","耕作用地","鄉村區用地"],"explains":["技術規則規定地價查估應依「法定用途」估價，都市計畫住宅區之土地縱使現供耕作使用，其法定使用分區仍為住宅區，應依住宅用地之使用價值查估，而非依現況之農業用地查估，本選項與法定用途查估原則不符。","都市計畫住宅區現雖供耕作使用，但其都市計畫法定用途為住宅區，依規定應依「法定用途」查估地價，即依住宅用地之價值查估，與題目敘述相符。","「耕作用地」並非都市計畫法定使用分區之正式名稱，且與依法定用途查估之原則不符。","「鄉村區用地」是非都市土地之使用分區類別，與本題都市計畫住宅區之情境不符。"],"correct":1,"note":null},{"id":"VA4_101_38","cat":"A4","year":"101年第38題","q":"不動產估價為能確切掌握土地所有權、面積、土地界線及鄰地地號，應取得之資料為下列何者？","opts":["土地登記簿謄本及地籍圖","地籍圖及都市計畫圖","土地登記簿謄本及建物登記簿謄本","土地登記簿謄本及地形圖"],"explains":["技術規則第13條明定確認勘估標的狀態時應確認基本資料及權利狀態，土地登記簿謄本記載所有權及他項權利狀態，地籍圖記載土地界線、面積及鄰地地號，兩者合併可確切掌握所有權、面積、土地界線及鄰地地號等資訊，與題目敘述相符。","都市計畫圖主要顯示土地使用分區管制，無法提供土地所有權及鄰地地號等具體產權資訊。","建物登記簿謄本記載建物產權狀態，與本題所問「土地」所有權、面積、界線及鄰地地號無直接關連。","地形圖主要呈現地表高低起伏狀況，無法提供土地所有權及鄰地地號等產權資訊。"],"correct":0,"note":null},{"id":"VA4_102_22","cat":"A4","year":"102年第22題","q":"請問下列對價格日期的敘述，何者正確？","opts":["不動產價格的委託日期","不動產價格的基準日期","不動產價格的查估日期","不動產價格的交易日期"],"explains":["委託日期是委託估價關係成立之日期，並非價格日期之定義。","技術規則第2條第7款明定價格日期係表示價格之基準日期，與本選項描述相符。","查估日期並非技術規則明定之正式用語，與價格日期定義不符。","交易日期是不動產實際成交之日期，與估價報告書所載價格之基準日期（價格日期）不同，兩者可能不一致。"],"correct":1,"note":null},{"id":"VA4_102_29","cat":"A4","year":"102年第29題","q":"不動產估價由三大方法所推估之價值，於綜合決定勘估標的價格時，下列敘述何者錯誤？","opts":["屬於不動產估價程序之後段步驟","過程中應就其中金額顯著差異者重新檢討","應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度判斷","以經濟租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析之收益價格應視前項情形賦予相對較大之權重"],"explains":["綜合決定勘估標的價格確實屬於不動產估價程序中較後段之步驟（蒐集資料、運用方法推算後才綜合決定），此敘述正確，非本題答案（本題問「何者錯誤」）。","技術規則第15條規定，對不同方法所得金額顯著差異者應重新檢討，此敘述正確。","技術規則第15條規定，應視資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度決定價格，此敘述正確。","依技術規則第15條規定，係以「契約租金」（非經濟租金）作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析之收益價格才應賦予相對較大之權重，本選項誤植為「經濟租金」，與規則規定不符，即本題正解。"],"correct":3,"note":"依不動產估價技術規則規定，係以「契約約定租金」（非經濟租金）作為信託利益分配基礎者，DCF收益價格才賦予較大權重，故本選項敘述有誤。"},{"id":"VA4_102_32","cat":"A4","year":"102年第32題","q":"依不動產估價技術規則第7條規定：「依本規則辦理估價所稱之面積，已辦理登記者，以登記之面積為準；其未辦理登記或以部分面積為估價者，應調查註明之。」因此房地產買賣實價登錄時，如屬未登記建物，辦理申報登錄時，應如何辦理？","opts":["仍選擇房地合併申報","如有車位，則選擇房地加車位申報","單純以土地申報即可","以土地申報並應於備註欄註明之"],"explains":["未登記建物無法併入房地合併申報，因建物本身尚未完成產權登記，無法以建物名義申報。","未登記建物之車位同樣面臨無產權登記問題，無法以房地加車位形式申報。","單純以土地申報雖可行，但技術規則第7條要求未登記或部分面積估價者應「調查註明」，僅以土地申報而未註明建物存在之事實，不完整。","技術規則第7條明定未辦理登記或以部分面積為估價者，應調查註明之，故未登記建物應以土地申報，並於備註欄註明建物存在之事實，與題目敘述及規則精神相符。"],"correct":3,"note":null},{"id":"VA4_102_35","cat":"A4","year":"102年第35題","q":"以下何者為不動產估價技術規則所稱之勘估標的？①地上權　②專利權　③蘋果樹上的蘋果　④堆置田中已採收之稻穀　⑤未登記建物","opts":["②③④","①②④","①②⑤","①③⑤"],"explains":["②③④組合中含②專利權，非屬不動產估價技術規則所稱之勘估標的範圍。","①②④組合中含②專利權，同樣非屬勘估標的範圍。","①②⑤組合中含②專利權，非屬勘估標的範圍。","①地上權（權利）、③蘋果樹上的蘋果（生長中尚未採收之天然孳息，依民法歸屬於土地之部分，可視為勘估標的相關範圍）、⑤未登記建物（建物改良物，雖未登記但仍屬技術規則第7條所稱可調查註明估價之標的），三者依官方答案組合判斷屬於勘估標的範圍；②專利權與④堆置田中已採收之稻穀（已分離之動產，非土地之部分）則不屬之。"],"correct":3,"note":null},{"id":"VA4_102_38","cat":"A4","year":"102年第38題","q":"某房屋受地震損害經鑑定無法居住使用，下列估價原則何者較能掌握其房地價格？","opts":["先估計重建價格，再以重建後房地價格扣掉重建所花費金額","以素地價格估價，並扣除拆除建物費用","以比較法估計一般正常未受損價格，再以特殊情況調整","無法估價"],"explains":["「先估計重建價格，再以重建後房地價格扣掉重建所花費金額」此一邏輯混亂且非技術規則規定之標準作法，無法妥適反映已嚴重毀損無法居住之房屋現況價值。","房屋因地震損害已無法居住使用，建物本身已喪失正常使用價值，技術規則規定此種情形得將基地視為素地估價（即不考慮已無實質效用之建物價值），但應考量拆除成本予以扣除，與題目所述「以素地價格估價，並扣除拆除建物費用」相符，此為處理建物已不具使用價值情形之正確估價邏輯。","以比較法估計一般正常未受損價格，再以特殊情況調整，此方法未能精確反映建物已無法居住使用、實質上已無建物價值之現況，估價邏輯不夠精確。","受損房屋仍可依素地估價搭配拆除成本調整之方式進行估價，並非無法估價。"],"correct":1,"note":null},{"id":"VA4_103_1","cat":"A4","year":"103年第1題","q":"何者是地價區段內具代表性，以作為查估公共設施保留地毗鄰非公共設施保留地區段地價之宗地？","opts":["基準地","比準地","標準地","比較標的"],"explains":["「基準地」是地價區段內具代表性之宗地，但與本題所問「公共設施保留地毗鄰非公共設施保留地區段地價」之查估宗地名稱不符。","「比準地」是地價區段內具代表性，作為查估公共設施保留地毗鄰非公共設施保留地區段地價之宗地，與題目敘述完全相符。","「標準地」並非本題所問特定查估程序中使用之正式宗地名稱。","比較標的是比較法估價中蒐集之交易實例，與本題所問地價區段內具代表性之宗地概念不同。"],"correct":1,"note":null},{"id":"VA4_103_12","cat":"A4","year":"103年第12題","q":"確認勘估標的狀態時，應至現場勘察之事項，何者有誤？","opts":["確定勘估標的內容","確認勘估標的之基本資料及權利狀態","調查勘估標的及比較標的之使用現況","確認影響價格之各項資料"],"explains":["「確定勘估標的內容」是屬於技術規則第9條「確定估價基本事項」階段之工作項目，並非「確認勘估標的狀態」階段應至現場勘察之事項，本選項階段歸屬有誤，即本題正解（本題問「何者有誤」）。","確認勘估標的之基本資料及權利狀態，是技術規則第13條明定確認勘估標的狀態時應至現場勘察之正確事項。","調查勘估標的及比較標的之使用現況，是現場勘察應辦理之正確事項。","確認影響價格之各項資料，是現場勘察應辦理之正確事項。"],"correct":0,"note":null},{"id":"VA4_103_14","cat":"A4","year":"103年第14題","q":"依不動產估價技術規則之規定，不動產估價師應經常蒐集何者之相關交易、收益及成本等案例及資料，並詳予求證其可靠性？","opts":["勘估標的","比較標的","買賣標的","估價標的"],"explains":["「勘估標的」是待估價的標的本身，並非蒐集相關交易收益成本案例資料的對象，蒐集資料的對象應是可供比較參考之標的。","技術規則第4條規定應蒐集「比較標的」相關交易、收益及成本等案例及資料，並詳予求證其可靠性，「比較標的」才是規則明定應蒐集資料之對象，惟本題官方答案標示為C（買賣標的），可能命題單位採用更廣義之「買賣標的」用語涵蓋比較標的之交易資料，建議考生對照規則原文「比較標的」用語確認本題鑑別細節，並以官方公告答案為準。","依官方答案，本題正解為買賣標的，惟技術規則原文用語係指「比較標的」相關資料之蒐集，建議對照法條原文確認用語差異。","「估價標的」並非技術規則第4條明定之正式用語。"],"correct":2,"note":"本題依官方答案表標示C，惟依不動產估價技術規則原文用語係指「比較標的」相關資料之蒐集，建議對照法條原文確認用語。"},{"id":"VA4_103_29","cat":"A4","year":"103年第29題","q":"不動產估價作業程序中應確定之基本事項為：","opts":["委託人","勘察日期","估價費用","估價條件"],"explains":["委託人雖為委託關係之當事人，但技術規則第9條明定之四項基本事項並未單獨列出「委託人」一項作為核心基本事項內容（委託人身分屬於委託契約範疇）。","勘察日期是赴現場調查之日期，技術規則第9條明定的是「價格日期」而非勘察日期。","估價費用是估價服務之對價，非技術規則明定應確定之估價基本事項項目。","技術規則第9條明定估價基本事項包含勘估標的內容、價格日期、價格種類及條件（估價條件）、估價目的，「估價條件」是其中明定項目之一，與題目敘述相符。"],"correct":3,"note":null},{"id":"VA4_104_8","cat":"A4","year":"104年第8題","q":"下列有關不動產估價三大基本方法之敘述，何者正確？","opts":["比較法運用重置觀點得出比較價格","收益法運用投資觀點得出收益價格","成本法運用未來成本得出成本價格","比較法運用交易觀點得出成交價格"],"explains":["比較法運用「交易觀點」（非重置觀點）得出比較價格，本選項將觀點誤植，敘述錯誤。","收益法運用投資觀點，求取未來收益折現或資本化後得出收益價格，與題目敘述完全相符。","成本法運用「重置觀點」（求取重建或重置成本扣除折舊），而非「未來成本」概念，本選項用詞錯誤。","比較法運用交易觀點得出的是「比較價格」，而非「成交價格」，成交價格是實際交易發生之價格，與估價方法所得之比較價格性質不同，本選項用詞錯誤。"],"correct":1,"note":null},{"id":"VA4_104_27","cat":"A4","year":"104年第27題","q":"不動產估價作業程序包含下列8項，請問其正確程序為何？①確定估價基本事項　②擬定估價計畫　③確認勘估標的狀態　④蒐集資料　⑤整理、比較、分析資料　⑥決定勘估標的價格　⑦運用估價方法推算勘估標的價格　⑧製作估價報告書","opts":["①②③④⑤⑥⑦⑧","①②④③⑤⑥⑦⑧","①②③④⑤⑦⑥⑧","①②④③⑤⑦⑥⑧"],"explains":["①②③④⑤⑥⑦⑧此順序將③確認勘估標的狀態置於④蒐集資料之前，且⑥決定價格置於⑦運用估價方法之前，皆與正確的8步驟順序不符。","①②④③⑤⑥⑦⑧此順序中，⑥決定勘估標的價格置於⑦運用估價方法推算價格之前，順序顛倒，應先運用方法推算（⑦）才能決定價格（⑥），不符正確邏輯。","①②③④⑤⑦⑥⑧此順序將③確認勘估標的狀態置於④蒐集資料之前，順序錯誤（應先蒐集資料才能確認標的狀態）。","技術規則第8條明定8大程序為：①確定估價基本事項→②擬定估價計畫→④蒐集資料→③確認勘估標的狀態→⑤整理比較分析資料→⑦運用估價方法推算價格→⑥決定勘估標的價格→⑧製作估價報告書，與本選項①②④③⑤⑦⑥⑧之順序完全相符。"],"correct":3,"note":null},{"id":"VA4_104_38","cat":"A4","year":"104年第38題","q":"下列有關土地建築開發之直接成本及間接成本之敘述，何者正確？①直接成本係指營造或施工費　②規劃設計費、廣告費、銷售費皆為間接成本　③直接成本包含規劃設計費　④間接成本不包含銷售費","opts":["②③","①②","①④","①②"],"explains":["②③組合中，③稱直接成本包含規劃設計費，但規劃設計費依規則屬於間接成本而非直接成本，敘述錯誤。","①②組合中，①直接成本係指營造或施工費，正確；②規劃設計費、廣告費、銷售費皆為間接成本，正確，兩者組合皆為正確敘述。","①④組合中，④稱間接成本不包含銷售費，但銷售費依規則明確屬於間接成本之一項，敘述錯誤。","技術規則第76條明定：直接成本＝營造施工費；間接成本＝規劃設計費＋廣告銷售費＋管理費＋稅捐及其他負擔，①②兩項描述完全符合此規定，為正確組合。"],"correct":3,"note":"原始選項排列依官方答案表為D，對應①②（直接成本係營造施工費，規劃設計費/廣告費/銷售費均屬間接成本）。"},{"id":"VA4_105_4","cat":"A4","year":"105年第4題","q":"於不動產估價作業程序中，下列何者不屬於「確定估價基本事項」的內容？","opts":["估價方法","價格日期","價格種類及條件","估價目的"],"explains":["技術規則第9條明定之估價基本事項為勘估標的內容、價格日期、價格種類及條件、估價目的，並不包含「估價方法」此一項目（估價方法屬於後續運用估價程序中決定的事項，非事前確定之基本事項），即本題正解。","價格日期是技術規則第9條明定之基本事項之一，非本題答案（本題問「不屬於」基本事項）。","價格種類及條件是規則明定之基本事項之一。","估價目的是規則明定之基本事項之一。"],"correct":0,"note":null},{"id":"VA4_105_13","cat":"A4","year":"105年第13題","q":"地政機關辦理公告土地現值之估價方法，其主要之法令依據為：","opts":["地價調查估計規則","不動產估價技術規則","土地徵收補償市價查估辦法","土地建築改良物估價規則"],"explains":["地政機關辦理公告土地現值之估價方法，主要法令依據為地價調查估計規則，與不動產經紀人估價技術規則（適用於估價師受託估價）係不同法令體系，題目敘述相符。","不動產估價技術規則是適用於不動產估價師受託辦理民間估價業務之規範，並非地政機關辦理公告土地現值之主要法令依據。","土地徵收補償市價查估辦法是適用於土地徵收補償市價查估之專門法令，非公告土地現值估價之主要依據。","「土地建築改良物估價規則」並非地政機關辦理公告土地現值之主要法令依據。"],"correct":0,"note":null},{"id":"VA4_105_22","cat":"A4","year":"105年第22題","q":"依不動產估價技術規則之規定，下列何者並非由不動產估價師公會全國聯合會公告？","opts":["建物經濟耐用年數表","建築改良物標準單價表","營造或施工費標準表","廣告費、銷售費、管理費及稅捐之相關費率"],"explains":["建物經濟耐用年數表是技術規則明定由不動產估價師公會全國聯合會公告之項目，非本題答案（本題問「並非」由全聯會公告）。","「建築改良物標準單價表」並非技術規則明定由全聯會公告之項目，這是常見混淆陷阱，技術規則明定全聯會公告之項目為建物經濟耐用年數表、營造施工費標準表、廣告銷售管理費及稅捐相關費率等，不含此表，即本題正解。","營造或施工費標準表是技術規則明定由全聯會公告之項目。","廣告費、銷售費、管理費及稅捐之相關費率，是技術規則第61-62條明定由全聯會公告之費率項目。"],"correct":1,"note":null},{"id":"VA4_105_25","cat":"A4","year":"105年第25題","q":"有關市地重劃估價的敘述，下列何者錯誤？","opts":["相關法令未明定重劃前後地價查估之價格日期","重劃前之地價應分別估計各宗土地地價及區段價","重劃後之地價應估計重劃後各路街之路線價或區段價","估計重劃前後地價應提地價評議委員會評定"],"explains":["市地重劃相關法令確實未明定重劃前後地價查估之特定價格日期規範，此敘述符合實務現況，非本題答案（本題問「何者錯誤」）。","重劃前之地價依市地重劃相關規定，應估計重劃前各路街之路線價或區段價（與重劃後對應），而非「分別估計各宗土地地價」，本選項描述與市地重劃地價查估之一般原則（查估路線價或區段價而非逐宗估價）不符，即本題正解。","重劃後之地價應估計重劃後各路街之路線價或區段價，此為正確敘述。","估計重劃前後地價應提地價評議委員會評定，此為正確程序敘述。"],"correct":1,"note":"依官方答案表標示B為錯誤選項，惟此敘述內容大致符合一般市地重劃地價查估原則，建議考生對照地價調查估計規則相關條文確認細節爭議點。"},{"id":"VA4_105_35","cat":"A4","year":"105年第35題","q":"下列何種估價方法，係以未來期望利益計算不動產價值？","opts":["成本法","收益法","比較法","土地開發分析法"],"explains":["成本法是以重建或重置成本扣除折舊推算價格，著重於「過去投入成本」而非未來期望利益，與題目敘述不符。","技術規則明定收益法係以勘估標的未來平均一年期間之客觀淨收益除以收益資本化率，或以折現現金流量分析法估算未來各期收益，本質上是以未來期望利益計算不動產價值，與題目敘述完全相符。","比較法是以比較標的之交易價格為基礎，著重於「市場已實現之交易價格」而非未來期望利益。","土地開發分析法雖也涉及未來銷售金額之估算，但其本質屬於成本法之延伸應用，核心仍是扣除開發成本及利潤後求得當前土地價值，非單純「未來期望利益」之資本化計算。"],"correct":1,"note":null},{"id":"VA4_106_3","cat":"A4","year":"106年第3題","q":"依不動產估價技術規則第7條規定：「依本規則辦理估價所稱之面積，已辦理登記者，以登記之面積為準」但未辦理登記或以部分面積為估價者，應如何處理？","opts":["省略不處理","先探求未登記之原因","當作無價值","調查註明"],"explains":["技術規則第7條明定未登記或部分面積估價者應「調查註明」，並非省略不處理。","技術規則第7條僅規定應調查註明，並未要求先探求未登記之原因，本選項超出規則規定範圍。","技術規則並未規定未登記面積應當作無價值處理，此與規則精神不符。","技術規則第7條明定：未辦理登記或以部分面積為估價者，應調查註明之，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA4_106_21","cat":"A4","year":"106年第21題","q":"已開闢道路及其二側或一側帶狀土地，可就具有顯著商業活動之繁榮地區，依當地發展及地價高低情形而劃設為下列那二種地價區段？","opts":["住宅價區段與商業價區段","商業價區段與非商業價區段","基準地價區段與標準地價區段","繁榮街道路線價區段與一般路線價區段"],"explains":["「住宅價區段與商業價區段」並非技術規則或地價調查估計規則明定之地價區段劃分正式名稱。","「商業價區段與非商業價區段」並非正式之地價區段劃分名稱。","「基準地價區段與標準地價區段」並非本題所問已開闢道路依繁榮程度劃設之地價區段正式名稱。","已開闢道路及其二側或一側帶狀土地，依當地發展及地價高低情形，可就具有顯著商業活動之繁榮地區劃設為「繁榮街道路線價區段」，其餘則劃設為「一般路線價區段」，此為地價區段劃分之正式名稱，與題目敘述相符。"],"correct":3,"note":null},{"id":"VA4_106_25","cat":"A4","year":"106年第25題","q":"初入社會的陳君預計在往後10年，每年有10萬元的償債能力，假設此時銀行利率為3%，請問其可貸得金額為何？","opts":["853,390元","967,970元","853,020元","1,146,390元"],"explains":["853,390元的計算結果與年金現值公式精確計算結果存在誤差，非正確答案。","967,970元的計算基礎有誤，未正確套用年金現值公式。","依年金現值公式 PV＝A×[1－(1+i)^(-n)]/i，代入A=10萬元、i=3%、n=10年，計算得PV≈853,020元，與本選項相符（此為每年10萬元償債能力，按3%利率折算10年期間可貸得之金額）。","1,146,390元明顯超出合理計算範圍，計算方式有誤。"],"correct":2,"note":"本題依官方答案表標示為C，數值已比照原PDF格式呈現（OCR辨識位數可能有誤差，作答時請以年金現值公式 PV ＝ A×[1－(1+i)^(-n)]/i 重新代入10萬元、3%、10年驗算）。"},{"id":"VA4_106_39","cat":"A4","year":"106年第39題","q":"有關不動產價值的定義，下列何者正確？","opts":["保險價值是不動產用於某種特定壽險用途所產生之價值","營運價值係指特定投資人評估該不動產投資所能產生的主觀價值","市場價值是不動產在營運過程中的既有價值，它是整個企業的一部分","公允價值係指能瞭解實情、有意願之當事人間公平交易所議定之資產交換或還清債務之數額"],"explains":["保險價值通常指用於保險理賠目的所評估之重置成本相關價值，並非「用於某種特定壽險用途所產生之價值」，本選項定義與保險價值之一般概念不符。","營運價值（或稱企業價值之不動產部分）通常指不動產作為企業整體營運資產之一部分所產生的價值，並非「特定投資人評估之主觀價值」，本選項定義有誤。","市場價值是反映公開市場上買賣雙方合理交易所形成之價值，並非「不動產在營運過程中的既有價值，是整個企業的一部分」，本選項描述的其實更接近營運價值之概念，與市場價值定義不符。","公允價值係指能瞭解實情、有意願之當事人間，公平交易所議定之資產交換或清償債務之數額，此為國際會計準則對公允價值之標準定義，與本選項描述完全相符。"],"correct":3,"note":null},{"id":"VA4_107_11","cat":"A4","year":"107年第11題","q":"下列那一項不屬於土地建築開發之間接成本？","opts":["施工費","規劃設計費","銷售費","管理費"],"explains":["技術規則第76條明定直接成本＝營造施工費（施工費），施工費是直接投入工程本身之成本，屬於直接成本而非間接成本，即本題正解（本題問「不屬於」間接成本）。","規劃設計費依規則明定屬於間接成本之一項。","銷售費依規則明定屬於間接成本之一項（廣告銷售費）。","管理費依規則明定屬於間接成本之一項。"],"correct":0,"note":null},{"id":"VA4_108_8","cat":"A4","year":"108年第8題","q":"對於估價目的為不動產買賣交易之參考所為之不動產估價，應評估的價格為：","opts":["買方希望之價格","賣方希望之價格","市場中最可能之成交價格","買賣雙方希望價格之平均數"],"explains":["買方希望之價格僅反映單方主觀期望，並非市場客觀交易價格，不適合作為買賣交易參考之估價結論。","賣方希望之價格同樣僅反映單方主觀期望，不適合作為客觀估價結論。","估價目的為不動產買賣交易之參考時，應評估市場中最可能之成交價格（即正常價格概念之具體應用），反映買賣雙方在公開市場上依專業知識謹慎行動可能達成之合理交易價格，與題目敘述相符。","買賣雙方希望價格之簡單平均數，未必反映市場實際供需與合理交易條件，並非正確之估價方法論。"],"correct":2,"note":null},{"id":"VA4_108_22","cat":"A4","year":"108年第22題","q":"下列何者非屬不動產估價師受理委託估價之勘估標的？","opts":["土地及其權利估價","建築改良物及其權利估價","不動產租金估計","不動產稅負之估算"],"explains":["土地及其權利估價，是不動產估價師依估價師法明定之核心業務範圍，非本題答案（本題問「非屬」受理委託估價之勘估標的）。","建築改良物及其權利估價，同樣是估價師明定業務範圍之一。","不動產租金估計，依技術規則第八章規定，亦屬估價師受理委託估價之業務範圍之一。","不動產稅負之估算（如試算應納地價稅、土地增值稅等稅額）屬於稅務計算範疇，非不動產估價師依估價師法及技術規則明定之估價業務範圍（稅負試算通常屬地政士或會計師之專業範疇），即本題正解。"],"correct":3,"note":null},{"id":"VA4_108_23","cat":"A4","year":"108年第23題","q":"不動產估價師在收集比較標的相關交易等案例及資料時，得向當事人、四鄰、其他不動產估價師、不動產經紀人員、地政士、地政機關、金融機構、公地管理機關、司法機關、媒體或有關單位收集之。請問：到實價登錄系統查詢交易案例相關資訊，屬向何者收集資料？","opts":["不動產經紀人","地政士","地政機關","媒體"],"explains":["不動產經紀人是提供仲介或代銷服務之專業人員，並非實價登錄系統之管轄或建置單位。","地政士是辦理土地登記代理業務之專業人員，並非實價登錄系統之管轄單位。","實價登錄系統是由地政機關（內政部及地方地政機關）建置管理之官方交易資訊申報登錄系統，到此系統查詢交易案例資訊，性質上屬於向「地政機關」收集資料，與技術規則第4條明定得向地政機關蒐集資料之規定相符。","媒體通常指新聞報導等公開資訊來源，實價登錄系統屬官方申報登錄資料庫，非媒體性質之資訊來源。"],"correct":2,"note":null},{"id":"VA4_109_3","cat":"A4","year":"109年第3題","q":"進行宗地估價時，下列敘述何者錯誤？","opts":["以分割為前提之宗地估價，應考慮分割前與分割後之價格變動情形，而予酌量增減","數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格","一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價","土地之上下有其他設施通過，致使用受限制之宗地，應先估算其特定價格，再考量該設施通過造成土地利用之影響，並計算其地價減損額後，從特定價格中扣除之，以其餘額為該宗地之價格"],"explains":["技術規則第83條明定，以分割為前提之宗地估價，應考慮分割前後之價格變動情形酌量增減，此為正確敘述，非本題答案（本題問「何者錯誤」）。","技術規則第84條明定，數筆土地合併為一宗估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格，此為正確敘述。","技術規則第85條明定，一宗土地內有數種不同法定用途時，應考量最有效使用及各用途相關性與分割難易度，決定分別估價或依主要用途估價，此為正確敘述。","技術規則第88條規定土地上下有其他設施通過致使用受限制之宗地，應「先估算其『正常價格』」（而非特定價格），再扣除地價減損額；本選項將正常價格誤植為特定價格，此為錯誤敘述，即本題正解。"],"correct":3,"note":"應先估算其「正常價格」而非「特定價格」，再扣除地價減損額，此為本題錯誤敘述之鑑別點。"},{"id":"VA4_109_7","cat":"A4","year":"109年第7題","q":"某大樓座落於原為住宅區變更為商業區之土地，依據目前土地使用管制相關法令規定，該大樓應以商業與一般事務所為其法定用途，今勘估標的某層建物未變更為商業區前之原核定用途為住宅使用，請問勘估標的之估價處理方式，下列何者較為適當？","opts":["以現行商業區允許之商業與一般事務所估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，並就住宅用途與建物法定用途估價之差額於估價報告書中敘明","以原核定住宅用途估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，同時以原核定住宅用途估價，再以兩者平均數為估價結論，並於估價報告書中敘明"],"explains":["僅以現行商業區允許之用途估價，未敘明原核定住宅用途與現行用途間之差額影響，未完整反映技術規則第102條規定的處理原則。","技術規則第102條明定，原核定用途與現行管制不符之合法建物，應以現行管制允許用途估價，並敘明該用途與原核定用途間之差額，此選項完整描述了「以現行用途估價」並「敘明差額」兩個要件，與規則規定完全相符。","僅以原核定住宅用途估價，未依現行（商業區）管制之允許用途估價，與技術規則明定「應以現行管制允許用途估價」之原則不符。","將兩種用途估價結果平均作為結論，並非技術規則規定之正確估價方法，規則明定應以現行用途估價並敘明差額，而非簡單平均。"],"correct":1,"note":null},{"id":"VA4_110_19","cat":"A4","year":"110年第19題","q":"勘估標的若為未完工之建物，應依何種方式估價？","opts":["未完工之建物應依比準建物進行估價","未完工之建物應依實際完成部分估價","未完工之建物應待完工後再進行估價","未完工之建物無法產生正常報酬，不予估計"],"explains":["「比準建物」並非技術規則明定處理未完工建物之估價方法，此為混淆選項。","技術規則第63條明定未完工建物估價，應依實際完成部分估價，或以營造施工費標準表參考工程進度比例估算，與題目敘述相符。","未完工建物可依實際完成部分進行估價，並非須待完工後才能進行估價。","未完工建物雖未完工，但已投入之部分仍具經濟價值，並非無法估計，規則明定應依實際完成部分估價。"],"correct":1,"note":null},{"id":"VA4_111_4","cat":"A4","year":"111年第4題","q":"依據不動產估價技術規則之規定，在一宗土地內有不同法定用途時，應如何估價？","opts":["應考量不同用途之合併或分割前後之價格變動情形，予酌量增減","應以合併用途後估價，並以合併用途前各筆土地價值比例分算其土地價格","應考慮不同用途之建築物對宗地價格造成之影響，予以酌量增減","應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價"],"explains":["「合併或分割前後之價格變動情形」是技術規則第83條規範分割或合併前提宗地估價之原則，而非本題所問「一宗土地內有不同法定用途」之處理方式，本選項答非所問。","「應以合併用途後估價，並以合併用途前各筆土地價值比例分算」是技術規則第84條規範「數筆土地合併」之原則，而非「一宗土地內有不同法定用途」此一情境之處理方式。","「考慮不同用途建築物對宗地價格造成之影響」並非技術規則第85條規範一宗多種法定用途土地估價之正確處理原則。","技術規則第85條明定，一宗土地內有數種不同法定用途時，應考量最有效使用及各種用途之相關性及分割難易度後，決定分別估價或依主要用途估價，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VA4_111_8","cat":"A4","year":"111年第8題","q":"不動產估價作業程序依不動產估價技術規則規定，總共有八項作業程序，其中第七個步驟為何？","opts":["製作估價報告書","整理、比較、分析資料","運用估價方法推算勘估標的價格","決定勘估標的價格"],"explains":["製作估價報告書是8步驟中的第⑧（最後）步驟，非第七步驟。","整理、比較、分析資料是8步驟中的第⑤步驟，非第七步驟。","運用估價方法推算勘估標的價格是8步驟中的第⑦步驟（依技術規則第8條順序：①確定基本事項②擬定計畫④蒐集資料③確認標的狀態⑤整理分析⑦運用方法⑥決定價格⑧製作報告書，惟此處依較常見之教材排列順序⑦為運用估價方法），與本題官方答案相符。","決定勘估標的價格是8步驟中的第⑥步驟（在運用估價方法之後），非第七步驟。"],"correct":3,"note":"依8步驟順序：①確定估價基本事項②擬定估價計畫③蒐集資料④確認勘估標的狀態⑤整理比較分析資料⑥運用估價方法推算價格⑦決定勘估標的價格⑧製作估價報告書，故第七步驟為「決定勘估標的價格」。"},{"id":"VA4_111_18","cat":"A4","year":"111年第18題","q":"不動產估價人員應針對不動產勘估標的之價格日期當時的價值進行估價，而所謂價格日期是指：","opts":["估價人員撰寫估價報告書之日期","勘估標的價格之基準日期","至勘估標的現場從事調查的日期","勘估標的交易之日期"],"explains":["估價人員撰寫估價報告書之日期，是估價報告書的製作完成日期，並非技術規則所稱之價格日期定義。","技術規則第2條第7款明定價格日期係指勘估標的價格之基準日期，與題目敘述完全相符。","至勘估標的現場從事調查的日期是「勘察日期」，與價格日期定義不同（二者不必相同）。","勘估標的交易之日期是實際成交之日期，與估價報告書所載價格之基準日期（價格日期）可能不一致。"],"correct":1,"note":null},{"id":"VA4_111_21","cat":"A4","year":"111年第21題","q":"依據不動產估價技術規則，在進行不動產估價作業程序時，下列何者屬於估價要確定的基本事項？","opts":["作業所需時間","估價目的","勘估標的之狀態","勘估標的相關交易、收益及成本資料"],"explains":["作業所需時間是技術規則第10條「擬定估價計畫」階段之要素，非「確定估價基本事項」階段之內容。","技術規則第9條明定估價基本事項包含勘估標的內容、價格日期、價格種類及條件、估價目的，「估價目的」是其中明定項目之一，與題目敘述相符。","勘估標的之狀態是技術規則第13條「確認勘估標的狀態」階段（現場勘察）之工作內容，非「確定基本事項」階段。","勘估標的相關交易、收益及成本資料是技術規則第11條「蒐集資料」階段之內容，非「確定基本事項」階段。"],"correct":1,"note":null},{"id":"VA4_112_20","cat":"A4","year":"112年第20題","q":"下列何者不屬於土地建築開發之間接成本項目？","opts":["建築開發之施工人員施工費用","建築開發之規劃設計費","建築開發之管理費","建築開發之銷售費"],"explains":["技術規則第76條明定直接成本＝營造施工費，「建築開發之施工人員施工費用」屬於營造施工費的直接投入，是直接成本而非間接成本，即本題正解（本題問「不屬於」間接成本項目）。","建築開發之規劃設計費依規則明定屬於間接成本之一項。","建築開發之管理費依規則明定屬於間接成本之一項。","建築開發之銷售費依規則明定屬於間接成本之一項（廣告銷售費）。"],"correct":0,"note":null},{"id":"VA4_112_25","cat":"A4","year":"112年第25題","q":"有關一宗土地內有數種不同法定用途時之估價敘述，下列何者錯誤？","opts":["估價前應先考量其最有效使用再決定估價方式","在考量宗地狀況後可以視不同法定用途採分別估價","估價前應先考量各種用途之相關性及分割之難易度再決定估價方式","估價時無須考量是否有數種不同法定用途，只需依其主要用途估價"],"explains":["估價前應先考量其最有效使用再決定估價方式，是技術規則第85條規定的正確處理原則，此敘述正確，非本題答案（本題問「何者錯誤」）。","在考量宗地狀況後可以視不同法定用途採分別估價，是規則明定的正確選項之一，敘述正確。","估價前應先考量各種用途之相關性及分割之難易度再決定估價方式，是規則明定的正確考量因素，敘述正確。","技術規則第85條明定，一宗土地內有數種不同法定用途時，應「考量最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價」，並非「無須考量，只需依主要用途估價」，本選項與規則規定（須經審慎考量後決定）完全相反，即本題正解。"],"correct":3,"note":null},{"id":"VA4_113_3","cat":"A4","year":"113年第3題","q":"下列何者非屬於不動產估價範疇？","opts":["大鵬灣濕地","地上權房屋，如101大樓","種植在山上的果樹","從果樹上摘下來的果實"],"explains":["大鵬灣濕地屬於具特殊生態與經濟價值之土地，仍屬不動產估價技術規則所稱之土地範疇，可進行估價，此選項屬於估價範疇，非本題答案（本題問「非屬」估價範疇）。","地上權房屋（如101大樓設定於公有土地上之地上權建物），其地上權及建物本身皆屬於技術規則第114條明定之權利估價及建物估價範圍，屬於估價範疇。","種植在山上的果樹（生長中尚未採收之天然孳息，依民法附屬於土地之部分），可作為農作改良物估價之標的，屬於估價範疇。","從果樹上摘下來的果實，已經與土地分離成為獨立動產，不再具有不動產（或其孳息附著於不動產）之性質，已脫離不動產估價技術規則所稱勘估標的之範疇，即本題正解。"],"correct":3,"note":null},{"id":"VA4_113_6","cat":"A4","year":"113年第6題","q":"不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？","opts":["不動產估價師應兼採二種以上估價方法推算勘估標的價格","不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討","評估證券化不動產清算價格時，對於折現現金流量分析法之收益價格應賦予相對較大之權重","對於各方法試算價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明"],"explains":["技術規則第14條明定原則上應兼採二種以上估價方法推算價格，此敘述正確，非本題答案（本題問「何者錯誤」）。","技術規則第15條規定應就不同方法所得金額顯著差異者重新檢討，此敘述正確。","技術規則第15條明定，係以「契約租金」（而非經濟租金）作為不動產證券化受益證券「信託利益分配」基礎者，DCF收益價格才應賦予較大權重；本題敘述「評估證券化不動產清算價格時」應賦予較大權重，混淆了適用情境（清算價格非信託利益分配之適用前提），此為錯誤敘述，即本題正解。","技術規則第15條規定，應視資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度決定價格並詳予敘明理由，此敘述正確。"],"correct":2,"note":"賦予DCF較大權重之前提係以「契約約定租金作為信託利益分配基礎」之情形，並非泛指「評估證券化不動產清算價格」，此為敘述錯誤之處。"},{"id":"VA4_114_17","cat":"A4","year":"114年第17題","q":"不動產估價報告書中應註明價格日期與勘查日期，就時間發生的先後下列敘述何者正確？","opts":["價格日期先於勘查日期","勘查日期先於價格日期","勘查日期等於價格日期","不一定"],"explains":["技術規則並未規定價格日期必然先於勘查日期，兩者先後關係視個案情況而定，本選項過於絕對化。","技術規則並未規定勘查日期必然先於價格日期，兩者先後關係視個案情況而定，本選項同樣過於絕對化。","技術規則明定價格日期與勘查日期是兩個不同定義的日期（價格日期為價格基準日期，勘查日期為現場調查日期），二者「不必相同」，本選項稱兩者相等，與規則精神不符。","技術規則第2條第7-8款明定價格日期與勘察日期係不同定義之兩個日期，二者先後關係視個案實際情況而定，並無固定先後順序，「不一定」是最精確的描述，與規則精神相符。"],"correct":3,"note":null},{"id":"VA4_114_25","cat":"A4","year":"114年第25題","q":"估價事務所接受委託展開估價作業前應先確定估價基本事項，於下列各項中應包含那些項目？①確定勘估標的內容　②確定勘查日期　③確定價格種類　④確定估價目的　⑤確定估價條件","opts":["僅①③④","①②③④","①③④⑤","①②③④⑤"],"explains":["僅①③④遺漏⑤確定估價條件，但估價條件是技術規則第9條明定基本事項之一，不應遺漏。","①②③④組合中含②確定勘查日期，但勘查日期並非技術規則第9條明定之「確定估價基本事項」內容（基本事項明定為價格日期而非勘查日期），不應列入。","技術規則第9條明定估價基本事項包含：①勘估標的內容、③價格種類、④估價目的、⑤估價條件，四項與本選項組合①③④⑤完全相符，不含②勘查日期（勘查日期屬於後續確認勘估標的狀態階段之工作）。","①②③④⑤全選，但②確定勘查日期非屬「確定估價基本事項」階段之內容，不應列入。"],"correct":2,"note":null},{"id":"VB1_99_1","cat":"B1","year":"99年第1題","q":"勘估標的選取比較標的價格經情況調整、價格日期調整，並比較分析區域因素及個別因素之差異後計算勘估標的之價格，稱為：","opts":["比較價格","成本價格","收益價格","試算價格"],"explains":["比較價格是試算價格經重新檢討確認適當合理後的最終結果，不是「經情況、價格日期、區域、個別因素調整後」這個調整過程本身得出的價格。","成本價格是成本法的產物（重建/重置成本扣除折舊），與比較法的調整流程無關。","收益價格是收益法的產物（淨收益除以資本化率），與比較法的調整流程無關。","技術規則第21條第2項明定：試算價格＝比較標的價格經情況、價格日期、區域因素及個別因素四項調整後所得之價格。題目描述的正是這個定義。"],"correct":3,"note":null},{"id":"VB1_99_3","cat":"B1","year":"99年第3題","q":"運用比較法時，區域因素、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率應該以下列何者為原則來判定該比較標的與勘估標的差異過大應排除該比較標的之適用呢？","opts":["任一單獨項目調整率大於30%","任一單獨項目調整率大於15%","總調整率大於15%","總調整率小於30%"],"explains":["30%是「總調整率」（情況+價格日期+區域+個別因素總和）的上限，不是任一單獨項目的判定標準。","技術規則第25條：區域因素或個別因素內任一單獨項目之價格調整率大於15%，即判定差異過大應排除該比較標的。","15%是單項調整率的上限，不是總調整率的判定標準，本選項把兩者數字對調。","「總調整率大於30%」才是排除條件，「小於30%」方向相反，且本題問的是單項調整率判定基準，與此選項描述對象不符。"],"correct":1,"note":null},{"id":"VB1_99_11","cat":"B1","year":"99年第11題","q":"根據不動產估價技術規則之規定，採取比較法進行區域因素及個別因素差異分析調整時，可以採那種方法為其調整方法呢？","opts":["百分率法","定率法","定額法","差額法"],"explains":["技術規則第24條：區域因素及個別因素之差異所為之調整，以百分率法為原則，亦得以差額法調整。","定率法是成本法折舊計算方法（如初期加速折舊路徑），不是比較法的因素調整方法。","定額法同樣是折舊計算方法，與比較法的區域/個別因素調整無關。","差額法是調整方法之一，但屬於例外或補充方式，「原則」仍是百分率法，本題問的是原則方法。"],"correct":0,"note":null},{"id":"VB1_99_18","cat":"B1","year":"99年第18題","q":"運用比較法進行估價時，將影響勘估標的及比較標的價格差異之區域因素及個別因素逐項比較，並依優劣程度或高低等級所評定之差額進行價格調整之方法，係指：","opts":["百分率法","差額法","區域分析法","個別因素法"],"explains":["百分率法是依優劣程度評定「差異百分率」進行調整，本題描述的是評定「差額」，方法名稱不符。","技術規則第19條第6款：差額法＝依優劣程度評定之差額進行調整，與題目描述「依優劣程度評定差額進行價格調整」完全相符。","「區域分析法」並非技術規則所定義的調整方法名稱，屬於混淆選項。","「個別因素法」同樣不是技術規則定義的調整方法名稱，調整方法只有百分率法與差額法兩種。"],"correct":1,"note":null},{"id":"VB1_99_39","cat":"B1","year":"99年第39題","q":"利用比較法進行估價時，若比較標的之個別因素較勘估標的差5%，則個別因素調整率為多少？","opts":["100/95","95/100","100/105","105/100"],"explains":["個別因素調整公式：勘估標的100 ÷ 比較標的(100-5) ＝ 100/95。比較標的較勘估標的差5%，代表勘估標的條件較佳，調整率應為100/95（將比較標的價格向上修正至勘估標的水準）。","95/100小於1，代表向下修正，但比較標的條件較差，調整方向應該是向上修正比較標的價格，本選項方向錯誤。","100/105的分母設定錯誤，未正確反映「比較標的較差5%」這個條件差異關係。","105/100同樣方向與分母分子設定有誤，未對應題目所述比較標的條件較差的情境。"],"correct":0,"note":null},{"id":"VB1_100_15","cat":"B1","year":"100年第15題","q":"林君將其所有不動產賣給女兒，成交價格為2,000萬元，經判斷此一價格較正常價格便宜2成。請問在其他條件不變下，該不動產之正常價格為多少？","opts":["1,600萬元","1,666萬元","2,400萬元","2,500萬元"],"explains":["1,600萬元是用「2,000×0.8」計算，但便宜2成的基準應該是正常價格而非成交價格，此為反向誤算。","1,666萬元的計算基準錯誤，未正確處理「便宜2成」的還原方向。","2,400萬元同樣未正確還原，計算基礎有誤。","成交價格2,000萬元為正常價格打8折（便宜2成）後的結果，故正常價格＝2,000÷(1-20%)＝2,000÷0.8＝2,500萬元。"],"correct":3,"note":null},{"id":"VB1_100_19","cat":"B1","year":"100年第19題","q":"下列有關比較法之敘述，何者正確？","opts":["經檢討後試算價格之間差距達15%以下者，應排除該試算價格之適用","進行個別因素調整時，任一單獨項目之價格調整率大於20%時，不應排除該比較標的之適用","進行區域因素調整時，任一單獨項目之價格調整率大於30%時，不應排除該比較標的之適用","經檢討後試算價格之間差距達20%以上者，應排除該試算價格之適用"],"explains":["技術規則第26條規定差距達「20%以上」應排除，不是「15%以下」，方向與數字皆錯誤。","技術規則第25條規定任一單獨項目調整率大於15%即應排除，不是「大於20%時不應排除」，本選項邏輯相反。","區域因素調整率大於15%即應排除（非30%），本選項數字錯誤。","技術規則第26條：檢討後試算價格之間差距達20%以上者，應排除該試算價格之適用，與本選項描述相符。"],"correct":3,"note":null},{"id":"VB1_100_21","cat":"B1","year":"100年第21題","q":"下列那些價格不宜直接視為正常交易價格，於無法掌握調整時，應不予採用。①親友間之買賣　②法院拍賣　③賣方支付土地增值稅之交易　④期待變更之價格","opts":["①②③","①②④","②③④","①②③④"],"explains":["技術規則第23條列舉之應先調整或不予採用情況包含親友間買賣、法院拍賣、賣方支付土地增值稅之交易（隱含降價誘因）等3項，「期待變更之價格」屬於另一類「受預期因素影響」，性質上雖也需調整但本題答案組合鎖定①②③。","④期待變更之價格雖然也是技術規則第23條列舉的應調整情況之一，但本題標準答案組合為①②③，不含④。","本選項未包含①親友間買賣，但①親友間買賣明確屬於第23條應調整情況之一，遺漏不正確。","全選④項雖然每一項單獨來看皆屬於第23條列舉範圍，但依官方答案僅①②③屬本題情境設定的核心組合。"],"correct":0,"note":"依官方答案表標示A，惟「法院拍賣」價格實務上多屬「應作適當調整」而非當然排除，作答時請以法條原文及官方答案為準。"},{"id":"VB1_100_22","cat":"B1","year":"100年第22題","q":"勘估標的與比較標的若因樓層之不同，而有100萬元的價格調整。此調整屬於下列何種方法之運用？","opts":["差額法","定額法","定率法","百分率法"],"explains":["技術規則第19條第6款：差額法係依優劣程度評定「差額」進行調整。題目明確以「100萬元的價格調整」此一具體金額（差額）描述調整，符合差額法定義。","定額法是成本法折舊計算方式（年折舊額固定），非比較法的因素調整方法。","定率法同樣是成本法折舊計算方式，非比較法調整方法。","百分率法是以「百分比」表示調整幅度，而題目給的是具體金額（100萬元），屬於差額法而非百分率法。"],"correct":0,"note":null},{"id":"VB1_101_13","cat":"B1","year":"101年第13題","q":"運用比較法選擇實例的條件，下列何者最不適宜？","opts":["必須與勘估標的使用性質相符","必須為正常價格","必須與勘估標的地點相近","必須為一個月以內之實例"],"explains":["與勘估標的使用性質相符是技術規則第12條明定之選取比較實例原則之一，屬必要條件。","必須為正常價格（或可調整為正常價格）也是第12條明定原則之一，屬必要條件。","位於同一供需圈之近鄰或類似地區同樣是第12條明定原則，屬必要條件。","「必須為一個月以內之實例」並非技術規則第12條所列的選取原則，第12條只要求「價格形成日期與勘估標的之價格日期接近」，沒有設定「一個月內」這種具體期限，此選項是常見混淆陷阱，故為最不適宜（即正解）。"],"correct":3,"note":null},{"id":"VB1_101_15","cat":"B1","year":"101年第15題","q":"預售屋的開價如高於市價一成，依此價格進行勘估標的價格調整時，此調整屬於下列何種方法之運用？","opts":["差額法","定額法","定率法","百分率法"],"explains":["差額法是依優劣程度評定差額（具體金額）進行調整，題目給的開價「高於市價一成」是百分比表示，不是金額差額。","定額法是成本法折舊概念，非比較法調整方法。","定率法同樣是成本法折舊概念，非比較法調整方法。","「高於市價一成」是以百分比（10%）表示優劣程度的調整，依技術規則第24條，此類調整以百分率法為原則，符合定義。"],"correct":3,"note":null},{"id":"VB1_101_22","cat":"B1","year":"101年第22題","q":"某甲以1,200萬元將其房屋移轉給弟弟，經判斷正常價格比這價格低二成；於一般不動產估價中，運用此案例進行情況調整後之價格為多少？","opts":["1,440萬元","1,400萬元","1,000萬元","960萬元"],"explains":["1,440萬元的計算方向錯誤，本題正常價格應低於成交價格，不應向上調整。","1,400萬
