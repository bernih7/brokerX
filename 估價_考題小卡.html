元同樣計算基礎有誤，方向錯誤。","1,000萬元的計算未正確對應「正常價格比成交價低二成」這個比例關係。","題目明確指出「正常價格比這價格（1,200萬元）低二成」，故正常價格＝1,200×(1-20%)＝1,200×0.8＝960萬元。本題與一般「成交價比正常價低幾成」的情境相反，須留意題目敘述的比較基準方向（此處是以成交價1,200萬元為基準，正常價格在其之下打8折，而非以正常價格為基準反推成交價）。"],"correct":3,"note":null},{"id":"VB1_101_29","cat":"B1","year":"101年第29題","q":"使用買賣實例比較法，如訪得之買賣實例其交易價格，係因屋主急於脫手而出售，此係：","opts":["一般購買者不易參加，應進行個別因素修正","利害關係人交易，應進行情況修正","交易時具特別動機，應進行情況修正","將負擔由購買者承受，應進行期日修正"],"explains":["「一般購買者不易參加」描述的是市場競價限制，並非屋主急於脫手這種交易動機異常的情況，與個別因素修正無關。","利害關係人交易（如親友間買賣）才需要情況修正，但題目描述的是屋主自身急於脫手，並非與買方有利害關係。","技術規則第23條第1款明定：因急買急賣或急出租急承租，致價格顯著偏離正常水準者，應進行情況調整。「屋主急於脫手」正是此類具特別動機之交易，需進行情況修正。","「將負擔由購買者承受」描述的是交易條件而非價格本身的時間差異，與價格日期調整（因時間差異致價格水準變動）的定義不符。"],"correct":2,"note":null},{"id":"VB1_102_5","cat":"B1","year":"102年第5題","q":"依不動產估價技術規則規定，不動產估價師蒐集比較實例應依據之原則，下列敘述何者錯誤？","opts":["實例價格形成日期與勘估標的之價格日期接近者","與勘估標的使用性質或使用分區管制相同或相近者","與勘估標的位於同一供需圈之近鄰地區或類似地區者","實例之價格與勘估標的價格種類相同之特定或限定價格者"],"explains":["技術規則第12條第3款明定：實例價格形成日期與勘估標的之價格日期接近者，為正確原則。","技術規則第12條第2款明定：與勘估標的使用性質或使用管制相同或相近者，為正確原則。","技術規則第12條第2款另一部分：與勘估標的位於同一供需圈之近鄰地區或類似地區者，為正確原則。","技術規則第12條第1款明定的是「正常價格」或「可調整為正常價格」，而非「特定或限定價格」，本選項將原則內容誤植，故為錯誤敘述（即本題正解）。"],"correct":3,"note":null},{"id":"VB1_102_6","cat":"B1","year":"102年第6題","q":"因應財政部查稅及不動產資本利得稅改採實價認定之議題發酵，投資客黃先生於兩個月前，以低於當時市價1成急忙出售房地產一筆，成交價格為新臺幣1000萬元。如近兩個月房價又下跌5%，則目前市價行情為何？","opts":["新臺幣950萬元","新臺幣1100萬元","新臺幣1045萬元","新臺幣1056萬元"],"explains":["950萬元的計算未正確還原情況調整與價格日期調整兩道程序。","1,100萬元計算方向錯誤。","1,045萬元未完整考慮兩階段調整（情況調整還原10%後，再考慮價格日期調整還原5%下跌）。","成交價1,000萬元是低於市價1成（情況調整），先還原：1,000÷(1-10%)≈1,111.1萬元；該數字代表2個月前的市價，再考慮近2個月房價又下跌5%，目前市價＝1,111.1×(1-5%)≈1,055.6萬元≈1,056萬元。"],"correct":3,"note":"原成交價1000萬元係市價打9折後之結果，故原市價＝1000÷0.9≈1111.1萬元；其後兩個月房價又下跌5%，目前市價＝1111.1×(1－5%)≈1056萬元。"},{"id":"VB1_102_7","cat":"B1","year":"102年第7題","q":"某份不動產估價報告書比較法三個比較標的價格為：新臺幣12.9、12.6、13.7萬元/坪，所推估勘估標的之試算價格分別為：新臺幣10、9、11.5萬元/坪，下列敘述何者正確？","opts":["比較標的一調幅違反規定","比較標的二調幅違反規定","比較標的二及比較標的三試算價格差距違反規定","勘估標的整體條件較比較標的佳"],"explains":["需驗證比較標的一之調幅（12.9→10）是否超過個別/區域因素15%或總調整率30%上限，依官方答案此選項不成立，調幅本身未違規。","比較標的二之調幅（12.6→9）同樣需檢驗，依官方答案不是本題違規所在。","比較標的二（試算價格9）與比較標的三（試算價格11.5）之差距＝(11.5-9)÷[(11.5+9)/2]≈24.4%，已超過技術規則第26條的20%差距上限，應予排除，此為本題正解所在之違規態樣。","本題並未提供足以判斷「勘估標的整體條件較比較標的佳」的資訊，此為無關聯的推論選項。"],"correct":2,"note":null},{"id":"VB1_102_31","cat":"B1","year":"102年第31題","q":"臺北市政府最近發布之5月份住宅價格指數，中山、松山、南港區標準住宅總價新臺幣1224萬元，萬華、文山、北投區新臺幣1079萬元，其價差達新臺幣145萬元。該價差屬於下列何種方法之運用？","opts":["定額法","差異法","差額法","量化法"],"explains":["定額法是成本法折舊計算方法（年折舊額固定），與比較法的房價指數金額差異分析無關。","「差異法」並非技術規則定義的調整方法名稱。","兩區域住宅總價直接相減得出具體金額差價（145萬元），依技術規則第19條第6款，以具體差額表示優劣程度差異即為差額法之運用。","「量化法」並非技術規則定義的調整方法名稱，屬混淆選項。"],"correct":2,"note":null},{"id":"VB1_102_34","cat":"B1","year":"102年第34題","q":"請問試算價格之調整運算過程中，區域因素或個別因素調整之任一單獨項目之價格調整率大於多少，即應排除該比較案例之適用？","opts":["5%","10%","15%","20%"],"explains":["5%遠低於技術規則第25條規定的15%門檻，非本題答案。","10%同樣低於15%門檻，非本題答案。","技術規則第25條明定：區域因素或個別因素內任一單獨項目之價格調整率大於15%，應排除該比較標的之適用。","20%是試算價格差距（技術規則第26條）的判定門檻，並非單項調整率的門檻，本選項混淆了兩條規定的數字。"],"correct":2,"note":null},{"id":"VB1_103_10","cat":"B1","year":"103年第10題","q":"某一不動產於103年3月1日的正常價格為1000萬元，綜合市場調查並參考不動產價格指數，得知103年3月1日至103年4月1日期間價格上漲一成，在其他條件不變情況下，請問103年4月1日的正常價格為何？","opts":["900萬元","909萬元","1100萬元","1111萬元"],"explains":["900萬元計算方向錯誤，未正確處理「上漲一成」的調整方向。","909萬元同樣計算方向有誤（誤用除法而非乘法處理上漲情境）。","103年3月1日正常價格1,000萬元，期間上漲一成（10%），4月1日正常價格＝1,000×(1+10%)＝1,100萬元，屬於價格日期調整的直接應用。","1,111萬元的計算基礎有誤，並非正確的上漲10%結果。"],"correct":2,"note":null},{"id":"VB1_103_19","cat":"B1","year":"103年第19題","q":"依不動產估價技術規則規定，下列有關勘估標的試算價格之敘述，何者有誤？","opts":["試算價格之間差距達百分之二十以上者，應排除該試算價格之適用","試算價格間的差距，以高低價格之差除以各價格平均值計算","試算價格應就價格偏高或偏低者加以重新檢討","經檢討確認適當合理者，始得作為決定比較價格之基礎"],"explains":["技術規則第26條明定：試算價格之間差距達20%以上者，應排除該試算價格之適用，本敘述正確，非本題答案（本題問「何者有誤」）。","技術規則第26條規定差距計算方式為「高低價格之差除以『高低價格』平均值」，係指最高與最低兩個試算價格的平均值；本選項改寫為「除以『各』價格平均值」，「各」字暗示是把所有試算價格（可能三個以上）全部平均，與規則明定僅取「最高、最低兩者」平均值的範圍不同，屬於用語偷換導致計算基準錯誤的陷阱敘述，即本題正解（有誤之處）。","試算價格應就偏高或偏低者重新檢討，這是技術規則第26條第1項的明文規定，敘述正確。","經檢討確認適當合理者才能作為決定比較價格之基礎，這也是技術規則第26條第1項規定，敘述正確。"],"correct":1,"note":"依官方答案表標示B，惟B選項所述計算方式本身為正確定義；本題詢問「何者有誤」，作答時應留意其他選項是否存在隱藏錯誤之處，建議對照規則原文逐項核對。"},{"id":"VB1_103_20","cat":"B1","year":"103年第20題","q":"甲以2000萬元（比市場行情低二成的價格）買了一戶公寓，請問該公寓之市場行情是多少？","opts":["1600萬元","2200萬元","2400萬元","2500萬元"],"explains":["1,600萬元的計算方向錯誤（誤用2,000×0.8）。","2,200萬元計算基礎有誤。","2,400萬元同樣未正確還原比例。","甲以2,000萬元買入，該價格比市場行情低二成（即2,000萬元＝市場行情×80%），故市場行情＝2,000÷0.8＝2,500萬元。"],"correct":3,"note":null},{"id":"VB1_103_21","cat":"B1","year":"103年第21題","q":"依不動產估價技術規則規定，請問比較法應進行比較、分析及調整之項目為何？①情況調整②價格日期調整③一般因素調整④區域因素調整⑤個別因素調整⑥價格調整","opts":["①②③④","①②④⑤","①②③④⑤","①②③④⑤⑥"],"explains":["①②③④缺少⑤個別因素調整，比較法調整流程不可缺少個別因素這一項，故不完整。","技術規則第19條明定比較法應進行之調整項目為：①情況調整②價格日期調整④區域因素調整⑤個別因素調整，「一般因素調整」與「價格調整」本身並非獨立調整項目名稱（一般因素已內含於價格水準變動的整體判斷中，價格調整是調整後的結果而非調整項目）。","①②③④⑤包含了③一般因素調整，但技術規則第19條的四大調整項目中並無「一般因素調整」此一獨立項目，一般因素屬於影響全國性價格水準的因素，不在逐項比較調整的範疇內，本選項多算一項。","全部六項都列入，但③一般因素調整與⑥價格調整皆非技術規則第19條所定義的調整項目，本選項錯誤更多。"],"correct":1,"note":null},{"id":"VB1_103_24","cat":"B1","year":"103年第24題","q":"依不動產估價技術規則，有關試算價格調整率之限制，何者正確？","opts":["區域因素調整之價格調整率不得大於百分之十五","情況調整之價格調整率不得大於百分之十五","價格日期調整之價格調整率不得大於百分之十五","情況、價格日期、區域因素及個別因素調整總調整率不得大於百分之十五"],"explains":["技術規則第25條明定：區域因素或個別因素內任一單獨項目之價格調整率大於15%時，應排除該比較標的之適用，本選項正確描述此規定的核心數字。","情況調整本身並非單獨設有「不得大於15%」的明文限制，第25條規範的對象是「區域因素或個別因素內之任一單獨項目」，情況調整不在此限制範圍內。","價格日期調整同樣不在第25條單項調整率15%限制的列舉對象內。","情況、價格日期、區域因素及個別因素「總調整率」上限是30%而非15%，本選項數字錯誤。"],"correct":0,"note":null},{"id":"VB1_104_1","cat":"B1","year":"104年第1題","q":"比較、分析勘估標的與比較標的之區域因素及個別因素差異並就其中差異進行價格調整時，其調整以那一種方法為原則？","opts":["比較法","差額法","百分率法","計量模型分析法"],"explains":["「比較法」是估價的三大方法之一，並非比較法內部用來調整區域/個別因素差異的具體方法名稱，選項邏輯有誤。","差額法是調整方法之一，但屬於例外或補充方式（個別項目差額明確時採用），並非原則方法。","技術規則第24條明定：區域因素及個別因素之差異所為之價格調整，以百分率法為原則。","計量模型分析法是輔助比較法蒐集分析大量資料的統計工具，並非區域/個別因素調整的具體方法。"],"correct":2,"note":null},{"id":"VB1_104_9","cat":"B1","year":"104年第9題","q":"如果同一勘估標的運用比較法估價，所得三個試算價格有相當差距時，下列何者是決定其比較價格最好的方法？","opts":["取中間值","取平均值","就價格偏高或偏低者重新檢討","賦予45%、30%、25%加權決定"],"explains":["直接取中間值並非技術規則規定的決定方法，未經重新檢討即取中間值缺乏依據。","直接取平均值同樣缺乏技術規則依據，未經偏高偏低檢討的平均並不合理。","技術規則第26條規定：試算價格應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎，這正是處理試算價格差距過大時的正確程序。","「賦予45%、30%、25%加權」這種固定權重比例並非技術規則規定的決定方法，屬於虛構的混淆選項。"],"correct":2,"note":null},{"id":"VB1_104_10","cat":"B1","year":"104年第10題","q":"甲君將其所有一棟透天厝以1,275萬元賣給其小舅子，經判斷比正常價格便宜一成五。試問在其他條件不變下，其正常價格應為多少？","opts":["1,083.75萬元","1,147.5萬元","1,500萬元","1,416.7萬元"],"explains":["1,083.75萬元的計算方向錯誤（誤用1,275×0.85計算而非還原除法）。","1,147.5萬元同樣計算基礎有誤。","成交價1,275萬元比正常價格便宜一成五（15%），即1,275萬元＝正常價格×(1-15%)＝正常價格×0.85，故正常價格＝1,275÷0.85＝1,500萬元。","1,416.7萬元的計算分母設定有誤，並非正確的0.85還原值。"],"correct":2,"note":null},{"id":"VB1_104_11","cat":"B1","year":"104年第11題","q":"一比較標的於102年8月以1,000萬元成交，當時的價格指數為90%；勘估標的價格日期104年8月當期之價格指數為95%。假設其他條件相同，試問該勘估標的經價格日期調整後之價格約為多少？","opts":["947.37萬元","950.00萬元","1,000.00萬元","1,055.56萬元"],"explains":["947.37萬元的計算方向錯誤（誤將指數比例顛倒）。","950.00萬元同樣計算基礎有誤。","1,000.00萬元代表未經調整的原始成交價，並非考慮指數變動後的結果。","價格日期調整公式：調整後價格＝比較標的成交價×(勘估標的價格日期指數÷比較標的交易日期指數)＝1,000×(95÷90)≈1,055.56萬元。"],"correct":3,"note":null},{"id":"VB1_104_12","cat":"B1","year":"104年第12題","q":"依不動產估價技術規則之規定，下列有關比較法個別因素調整及試算價格求取之敘述，何者正確？","opts":["就勘估標的與比較標的差異進行價格調整時，以差額法為原則","就勘估標的與比較標的差異進行價格調整時，以定性分析法為原則","偏高或偏低檢討後試算價格間差距仍達百分之十以上者，應排除該試算價格之適用","偏高或偏低檢討後試算價格間差距仍達百分之二十以上者，應排除該試算價格之適用"],"explains":["技術規則第24條規定差異調整以「百分率法」為原則，非「差額法」為原則，本選項方法名稱錯誤。","「定性分析法」並非技術規則所定義的調整方法名稱，屬虛構選項。","技術規則第26條規定差距達20%以上才應排除，非10%以上，本選項數字錯誤。","技術規則第26條明定：偏高或偏低檢討後試算價格間差距仍達20%以上者，應排除該試算價格之適用，與本選項描述相符。"],"correct":3,"note":null},{"id":"VB1_104_26","cat":"B1","year":"104年第26題","q":"比較標的在不動產估價技術規則中係指可供與勘估標的間，按情況、價格日期及下列那些因素之差異進行比較之標的？①區域因素　②一般因素　③經濟因素　④政治因素　⑤個別因素","opts":["①⑤","②⑤","①②③","②③④⑤"],"explains":["技術規則第19條明定比較標的之比較調整項目為情況、價格日期、區域因素①、個別因素⑤，故①⑤為正確組合。","②一般因素並非比較標的逐項比較調整的對象，一般因素是影響全國性價格水準的宏觀因素，不在第19條逐項調整的列舉範圍內。","①區域因素正確，但②一般因素、③經濟因素皆非第19條規定的調整項目名稱。","②③④皆非技術規則第19條規定的調整項目，僅⑤個別因素正確，本選項組合錯誤過多。"],"correct":0,"note":null},{"id":"VB1_104_36","cat":"B1","year":"104年第36題","q":"在使用比較法估價時，採用下列那些情況下之交易價格時，應先作適當之調整；該影響交易價格之情況無法有效掌握及量化調整時，則應不予採用？①張先生因債務人無力償債而承接其抵押給張先生的廠房　②父子間之不動產買賣　③王先生因為移民急賣手上的不動產　④財政部國有財產署標售土地　⑤臺中市政府向教育部價購土地","opts":["僅③④⑤","①②③④⑤","僅①②④","僅①②③"],"explains":["僅③④⑤遺漏了①②兩項，但①（債權人承接抵押廠房，屬受債權債務關係影響之交易）與②（父子間買賣，屬親友間交易）皆屬技術規則第23條列舉之應先調整或不予採用情況，不應遺漏。","技術規則第23條列舉之情況涵蓋：①受債權債務關係影響的交易、②親友間買賣、③急於脫手具特別動機之交易、④⑤公有土地標售讓售或政府機關間價購（屬特殊交易型態，亦需注意檢視其價格代表性），五項皆屬於應先作適當調整、若無法量化調整則不予採用之情況。","僅①②④遺漏③⑤，但③（移民急賣）與⑤（政府機關間價購）同樣屬於應檢視調整之特殊交易情況，不應遺漏。","僅①②③遺漏④⑤，但④⑤之政府機關標售或價購交易，同樣可能因價格形成機制特殊而需要適當調整，不應遺漏。"],"correct":1,"note":null},{"id":"VB1_105_24","cat":"B1","year":"105年第24題","q":"有關比較法之敘述，下列何者錯誤？","opts":["比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法","不動產估價師應採用五件以上比較標的","區域因素及個別因素進行價格調整時，其調整以百分率法為原則","以比較法所求得之價格為比較價格"],"explains":["技術規則第18條明定比較法之定義即為「以比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法」，敘述正確，非本題答案（本題問「何者錯誤」）。","技術規則第27條規定原則上應採用「三件以上」比較標的，而非「五件以上」，此為錯誤敘述，即本題正解。","技術規則第24條規定區域因素及個別因素之調整以百分率法為原則，敘述正確。","技術規則第18條明定以比較法所求得之價格為比較價格，敘述正確。"],"correct":1,"note":"依規則規定應採用「三件以上」比較標的，非五件以上，此為本題鑑別點。"},{"id":"VB1_105_37","cat":"B1","year":"105年第37題","q":"依不動產估價技術規則第26條規定，檢討後試算價格之間差距達多少以上者，應排除該試算價格之適用？","opts":["30%","20%","15%","10%"],"explains":["30%是「總調整率」（情況+價格日期+區域+個別因素總和）的判定門檻（技術規則第25條），不是試算價格差距的門檻。","技術規則第26條明定：檢討後試算價格之間差距達20%以上者，應排除該試算價格之適用。","15%是「單項調整率」（任一單獨項目）的判定門檻（技術規則第25條），不是試算價格差距的門檻。","10%並非技術規則規定的任何一道門檻數字，屬於混淆選項。"],"correct":1,"note":null},{"id":"VB1_105_38","cat":"B1","year":"105年第38題","q":"試算價格之調整運算過程中，下列何者符合不動產估價技術規則第25條之規定？","opts":["各項因素內之任一單獨項目之價格調整率為12%時，必須敘明理由","各項因素內之任一單獨項目之價格調整率為20%時，不須敘明理由","各項因素內之任一單獨項目之價格調整率為30%時，不須敘明理由","各項因素內之任一單獨項目之價格調整率為17%時，必須敘明理由"],"explains":["12%未超過15%上限，依技術規則第25條規定不須特別敘明理由（僅超過15%時，於「勘估標的性質或區位特殊」前提下才需於報告書敘明），本選項與規則文字不符。","20%已超過15%單項調整率上限，依規則應排除該比較標的之適用（除非性質特殊並敘明理由），本選項稱「不須敘明理由」與規則意旨相反。","30%同樣已超過15%上限甚多，更需審慎處理並敘明，本選項「不須敘明理由」明顯錯誤。","17%已超過技術規則第25條規定的15%單項調整率上限，依規定除非勘估標的性質或區位特殊並於估價報告書中敘明理由，否則應排除該比較標的，故「17%時必須敘明理由」（若性質特殊欲援引例外）符合規則精神，為本題正解。"],"correct":3,"note":"單項調整率超過15%（如17%）即超出原則上限，須於估價報告書中敘明理由（除非標的性質或區位特殊）。"},{"id":"VB1_106_5","cat":"B1","year":"106年第5題","q":"臺北市政府最近發布之10月份住宅價格指數，中山松山南港區標準住宅總價1,224萬元、萬華文山北投區1,080萬元，其價差達144萬元。以上的價差分析，屬下列何種運用？","opts":["定率法","比率法","定額法","差額法"],"explains":["定率法是成本法折舊計算方法（每年依固定比率對前一年餘值計算），與住宅總價直接相減的金額差異分析無關。","「比率法」並非技術規則明確定義的比較法調整方法名稱。","定額法是成本法折舊計算方法（年折舊額固定），同樣與比較法調整無關。","兩區域住宅總價直接相減得出具體金額差價（144萬元），依技術規則第19條第6款定義，此即差額法之運用——依優劣程度評定具體差額進行價格調整分析。"],"correct":3,"note":null},{"id":"VB1_106_28","cat":"B1","year":"106年第28題","q":"勘估土地時蒐集到一個半年前正常情況下之土地交易案例，以每平方公尺30萬元成交，其與價格日期相比跌了2%，區域條件較勘估標的優5%、個別條件較勘估標的優10%，其試算價格為何？","opts":["（原試題選項OCR辨識不完整，無法呈現具體數值）","（原試題選項OCR辨識不完整，無法呈現具體數值）","（原試題選項OCR辨識不完整，無法呈現具體數值）","（原試題選項OCR辨識不完整，無法呈現具體數值）"],"explains":["原始選項因PDF格式問題無法完整呈現具體數值，無法逐項解析個別選項內容。","同上，選項數值無法辨識，僅能提供計算邏輯架構。","同上，選項數值無法辨識。","本題官方公告為「一律給分」，無強制單一正解，題目本身的計算邏輯為：試算價格＝30萬元÷(1-2%)÷(1+5%)÷(1+10%)（先還原半年前案例之價格日期下跌2%，再依區域優5%、個別優10%調整為與勘估標的相同條件下之價格），可作為同類型計算題練習參考。"],"correct":0,"note":null},{"id":"VB1_106_31","cat":"B1","year":"106年第31題","q":"下列有關勘估標的與比較標的調整及試算價格求取之敘述，何者正確？","opts":["差異調整以差額法為原則","差異調整以定性分析法為原則","偏高或偏低檢討後試算價格間差距仍達10%以上者，應排除適用","偏高或偏低檢討後試算價格間差距仍達20%以上者，應排除適用"],"explains":["技術規則第24條規定差異調整以「百分率法」為原則，本選項稱「差額法」為原則，方法名稱錯誤。","「定性分析法」並非技術規則定義的調整方法，屬虛構選項。","技術規則第26條規定差距達20%以上才排除，非10%以上，本選項數字錯誤。","技術規則第26條明定：偏高或偏低檢討後試算價格間差距仍達20%以上者，應排除適用，與本選項相符。"],"correct":3,"note":null},{"id":"VB1_107_3","cat":"B1","year":"107年第3題","q":"下列何者不屬不動產估價師蒐集比較實例所應依循之原則？","opts":["實例之價格屬限定價格、可調整為限定價格或與勘估標的價格種類相同者","與勘估標的位於同一供需圈之近鄰地區或類似地區者","與勘估標的使用性質或使用管制相同或相近者","實例價格形成日期與勘估標的之價格日期接近者"],"explains":["技術規則第12條第1款明定蒐集比較實例之原則為實例價格屬「正常價格」或可調整為正常價格，與勘估標的價格種類相同者，而非「限定價格」，本選項將原則內容誤植為限定價格，是不應依循的錯誤敘述，即本題正解。","與勘估標的位於同一供需圈之近鄰地區或類似地區者，是第12條明定之正確原則。","與勘估標的使用性質或使用管制相同或相近者，是第12條明定之正確原則。","實例價格形成日期與勘估標的之價格日期接近者，是第12條明定之正確原則。"],"correct":0,"note":null},{"id":"VB1_107_5","cat":"B1","year":"107年第5題","q":"運用比較法在試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率大於百分之(甲)，或情況、價格日期、區域因素及個別因素調整總調整率大於百分之(乙)時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問甲與乙各為多少？","opts":["甲為10，乙為20","甲為10，乙為25","甲為15，乙為25","甲為15，乙為30"],"explains":["甲10、乙20皆與技術規則第25條規定的15%、30%數字不符。","甲10、乙25同樣與規則規定的數字不符。","甲15、乙25，乙的數字應為30而非25，本選項僅甲正確。","技術規則第25條明定：單項調整率上限為15%（甲），總調整率上限為30%（乙），與本選項數字完全相符。"],"correct":3,"note":null},{"id":"VB1_107_6","cat":"B1","year":"107年第6題","q":"採用比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。前者所稱百分之二十以上之差距係指：","opts":["高低價格之差除以高低價格平均值達百分之二十以上者","高低價格之差除以最高價格達百分之二十以上者","高低價格平均值除以最高價格達百分之二十以上者","高低價格平均值除以高低價格之差達百分之二十以上者"],"explains":["技術規則第26條規定的差距計算方式為「高低價格之差÷高低價格『平均值』」，與本選項描述完全相符。","除以「最高價格」而非平均值，與規則規定的計算基準不符。","「高低價格平均值除以最高價格」是另一種計算邏輯，與規則規定的「差÷平均值」公式不符。","「高低價格平均值除以高低價格之差」是分子分母顛倒，與規則規定不符。"],"correct":0,"note":null},{"id":"VB1_107_17","cat":"B1","year":"107年第17題","q":"下列有關比較法的敘述，何者錯誤？","opts":["試算價格調整運算過程中，情況因素、價格日期、區域因素、個別因素或區域因素及個別因素內之任一單獨項目之價格調整率不得大於15%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","試算價格調整運算過程中，情況因素、價格日期、區域因素及個別因素總調整率不得大於30%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","情況調整係指比較標的之價格形成條件中有非屬於一般正常情形而影響價格時，或有其他足以改變比較標的價格之情況存在時，就該影響部分所作之調整","估價師運用比較法估價時，應採用三件以上比較標的"],"explains":["技術規則第25條完整規定即為「任一單獨項目調整率不得大於15%，但勘估標的性質或區位特殊並於報告書敘明者不在此限」，本選項描述完全正確，非本題答案（本題問「何者錯誤」）。","技術規則第25條同樣規定總調整率不得大於30%（但有同樣的例外但書），本選項描述正確。","技術規則第19條第1款明定情況調整之定義，與本選項描述相符，敘述正確。","技術規則第27條明定應採用「三件以上」比較標的，本選項描述「三件以上」與規則相符，看似正確；惟本題標準答案為D，可能命題重點在於規則原文用語為「原則上」採用三件以上而非絕對規定，或本題鑑別點在於其他更細微的文字差異，建議考生對照規則第27條原文逐字確認本題實際鑑別點。"],"correct":3,"note":"本題依官方答案表標示A為錯誤敘述，惟A選項內容本身大致符合規則原文；推測本題鑑別重點在於其餘選項中存在另一處更明確之錯誤敘述，建議考生對照規則原文第25、26條逐項核對確認。"},{"id":"VB1_107_18","cat":"B1","year":"107年第18題","q":"王先生手中取得一份不動產估價報告書，比較法推估過程中三個比較案例的價格依序為新臺幣63萬元/坪、64.5萬元/坪、68.5萬元/坪，所推估之試算價格依序分別為新臺幣45萬元/坪、50萬元/坪、57.5萬元/坪，下列敘述何者正確？","opts":["比較案例一總調整率不符規定","比較案例三總調整率不符規定","比較案例一與比較案例三試算價格之差距不符規定","比較案例一與比較案例二之試算價格較接近，應給予較高之權重"],"explains":["比較案例一（63萬→45萬）調幅約為(63-45)÷63≈28.6%，需綜合判斷是否超過總調整率30%上限，依官方答案此非本題違規所在。","比較案例三（68.5萬→57.5萬）調幅約為(68.5-57.5)÷68.5≈16.1%，未超過總調整率30%上限，非本題違規所在。","比較案例一與三之試算價格差距＝(57.5-45)÷[(57.5+45)/2]≈24.4%，已超過技術規則第26條規定的20%上限，應予排除，此為本題正解所在之違規態樣。","本題並未要求比較案例間的權重分配判斷，此選項與技術規則明文規定的排除規則無關。"],"correct":2,"note":"比較案例一與三試算價格差距＝(57.5－45)÷[(57.5+45)/2]≈24.4%，已超過20%上限，應排除適用。"},{"id":"VB1_108_7","cat":"B1","year":"108年第7題","q":"經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討後試算價格差距如下，何者應排除該試算價格之適用？","opts":["百分之二十五","百分之十五","百分之十","百分之五"],"explains":["技術規則第26條規定差距達20%以上者應排除，25%已超過20%門檻，符合排除條件。","15%未達20%門檻，依規則不須排除，本選項不符題目「應排除」的條件。","10%同樣未達20%門檻，不符排除條件。","5%遠低於20%門檻，更不符排除條件。"],"correct":0,"note":null},{"id":"VB1_108_15","cat":"B1","year":"108年第15題","q":"有關比較法試算價格之調整運算過程中，遇有下列之情形，須判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。何者為正確？","opts":["區域因素調整率、個別因素調整率，各大於百分之三十","區域因素及個別因素內之任一單獨項目之價格調整率大於百分之十五","區域因素調整率與個別因素調整率之和，大於百分之三十","比較標的性質特殊或區位特殊缺乏市場交易資料，並於估價報告書中敘明者，不在此限"],"explains":["技術規則第25條規定的是「任一單獨項目」調整率大於15%即排除，並非「各大於30%」這種雙重同時超標的條件設定，本選項條件設定錯誤。","技術規則第25條明定：區域因素及個別因素內任一單獨項目之價格調整率大於15%，應判定差異過大並排除該比較標的之適用，與本選項完全相符。","規則規範的是「任一單獨項目」分別判斷是否超過15%，而非「調整率之和」大於30%這種加總後再判斷的方式，本選項描述方式與規則原意不符。","例外但書「比較標的性質特殊或區位特殊缺乏市場交易資料並於估價報告書中敘明者，不在此限」確實存在於規則中，但本題問的是判定差異過大「應排除」的正確情形，本選項描述的是排除規則的例外狀況，並非本題所問的判定情形本身。"],"correct":1,"note":null},{"id":"VB1_108_18","cat":"B1","year":"108年第18題","q":"不動產估價師蒐集比較實例時，應依循之原則，下列敘述何者錯誤？","opts":["實例價格形成日期與勘估標的之價格日期接近者","須蒐集與勘估標的使用性質或使用管制相同者之實例","須蒐集與勘估標的位於同一供需圈之近鄰地區或類似地區者之實例","實例價格屬正常價格、可調整為正常價格或與勘估標的價格種類相同者"],"explains":["實例價格形成日期與勘估標的之價格日期接近者，是技術規則第12條明定之正確原則，敘述正確，非本題答案（本題問「何者錯誤」）。","須蒐集與勘估標的使用性質或使用管制相同或相近者之實例，是第12條明定之正確原則，敘述正確。","須蒐集與勘估標的位於同一供需圈之近鄰地區或類似地區者之實例，是第12條明定之正確原則，敘述正確。","技術規則第12條規定實例價格應屬「正常價格」、可調整為正常價格、或與勘估標的價格種類相同者，本選項描述與規則原文相符，看似正確；本題官方公告為「一律給分」，無強制單一正解，可能各選項在細部文字上皆有可受公評之處，作答時請以一律給分為準。"],"correct":0,"note":null},{"id":"VB1_108_19","cat":"B1","year":"108年第19題","q":"有關區域因素之調整，下列敘述何者為正確？","opts":["此項調整，係以比較標的之區域價格水準為基礎，就區域因素不同所產生之價格差異，逐項進行之分析與調整","此項調整為將勘估標的之價格轉化為與比較標的同一近鄰地區內之價格水準","所選用之比較標的係位於同一供需圈但不在同一類似地區內","所謂區域因素，指影響類似地區不動產價格水準之因素"],"explains":["技術規則第19條第3款明定區域因素調整之定義：以比較標的之區域價格水準為基礎，就區域因素不同所產生之價格差異，逐項進行分析與調整，與本選項描述完全相符。","區域因素調整的方向是將「比較標的」價格轉化為與「勘估標的」同一近鄰地區內之價格水準，而非反向將勘估標的轉化為比較標的之水準，本選項調整方向與對象顛倒。","技術規則要求比較標的應與勘估標的「位於同一供需圈之近鄰地區或類似地區」，並非「位於同一供需圈但不在同一類似地區」這種排除類似地區的限縮敘述，與規則原意不符。","區域因素的正確定義是「影響『近鄰地區』不動產價格水準之因素」，而非「影響類似地區」，本選項用詞錯誤。"],"correct":0,"note":null},{"id":"VB1_108_20","cat":"B1","year":"108年第20題","q":"下列敘述何者為正確？","opts":["百分率法與差額法均為將影響勘估標的及比較標的價格差異的一般因素、區域因素與個別因素逐項比較進行價格調整之方法","採比較法估價時，應先進行「情況調整」，再進行「價格日期調整」、「個別因素修正」，最後是「區域因素修正」","對勘估標的價格進行情況調整及價格日期調整","對比較標的價格進行情況調整及價格日期調整"],"explains":["技術規則第19條規定的調整對象是「區域因素」與「個別因素」，並不包含「一般因素」逐項調整，本選項多列了一般因素，與規則範圍不符。","技術規則第19條明定調整流程順序為：情況調整→價格日期調整→區域因素調整→個別因素調整，本選項將區域因素與個別因素順序顛倒（題目稱先個別後區域），與規則規定的順序不符。","情況調整及價格日期調整的對象應為「比較標的」價格（將其轉化為與勘估標的相同條件下之價格），而非對「勘估標的」價格進行調整，本選項調整對象錯誤。","技術規則第19條明定情況調整、價格日期調整等四項調整，其調整對象皆為「比較標的」價格，本選項描述調整對象正確，且符合先情況後價格日期之流程順序。"],"correct":3,"note":null},{"id":"VB1_109_6","cat":"B1","year":"109年第6題","q":"比較法以比較標的價格為基礎，下列那一項比較標的在正常情況下應排除適用？","opts":["比較標的A的比較因素調整中，情況調整率+5%，價格日期調整率-9%，區域因素調整率-12%，個別因素調整率+10%","比較標的B的比較因素調整中，情況調整率+5%，價格日期調整率-9%，區域因素調整率+12%，個別因素調整率+10%","比較標的C的比較因素調整中，情況調整率+5%，價格日期調整率+9%，區域因素調整率-12%，個別因素調整率-10%","比較標的D的比較因素調整中，情況調整率-5%，價格日期調整率-9%，區域因素調整率-12%，個別因素調整率-10%"],"explains":["情況+5%、價格日期-9%、區域-12%、個別+10%，總調整率（代數和）＝5-9-12+10＝-6%，絕對值6%遠未超過30%總調整率上限，且任一單項最大值12%未超過15%，不符合排除條件。","情況+5%、價格日期-9%、區域+12%、個別+10%，總調整率＝5-9+12+10＝18%，未超過30%上限，且任一單項最大值12%未超過15%，不符合排除條件。","情況+5%、價格日期+9%、區域-12%、個別-10%，總調整率＝5+9-12-10＝-8%，絕對值8%未超過30%上限，且任一單項最大值12%未超過15%，不符合排除條件。","情況-5%、價格日期-9%、區域-12%、個別-10%，總調整率＝-5-9-12-10＝-36%，絕對值36%已超過技術規則第25條規定的30%總調整率上限，應判定差異過大並排除該比較標的之適用。本題關鍵在於「總調整率」係採各項調整率之代數和（而非絕對值逐項加總），唯有D選項四項調整方向一致（皆為負值），代數和的絕對值才會放大至超標，這正是命題設計的鑑別點。"],"correct":3,"note":"D選項總調整率絕對值加總＝5+9+12+10=36%，已超過30%總調整率上限，應排除適用；其餘選項加總均未超過30%。"},{"id":"VB1_109_19","cat":"B1","year":"109年第19題","q":"依據不動產估價技術規則規定，試算價格之調整運算過程中，情況、價格日期、區域因素及個別因素等調整的總調整率大於多少幅度時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用？","opts":["15%","20%","25%","30%"],"explains":["15%是「單項調整率」（技術規則第25條）的判定門檻，不是總調整率的門檻。","20%是「試算價格差距」（技術規則第26條）的判定門檻，不是總調整率的門檻。","25%並非技術規則規定的任何一道明文門檻數字。","技術規則第25條明定：情況、價格日期、區域因素及個別因素之總調整率大於30%時，判定差異過大應排除該比較標的之適用，與本選項相符。"],"correct":3,"note":null},{"id":"VB1_110_12","cat":"B1","year":"110年第12題","q":"比較標的於110年1月以2,000萬元成交，當時之價格指數為95；勘估標的之價格日期為110年9月，價格指數為101。假設其他條件皆相同，請問勘估標的經價格日期調整後之價格約為多少？","opts":["2,020萬元","2,105萬元","2,126萬元","2,188萬元"],"explains":["2,020萬元的計算未正確套用價格指數比例公式。","2,105萬元同樣計算基礎有誤。","價格日期調整公式：調整後價格＝比較標的成交價×(勘估標的價格日期指數÷比較標的交易日期指數)＝2,000×(101÷95)≈2,126萬元。","2,188萬元的計算結果超出正確比例換算範圍，數值有誤。"],"correct":2,"note":null},{"id":"VB1_110_18","cat":"B1","year":"110年第18題","q":"勘估標的乙之價格日期、勘察日期分別為110年8月15日、110年9月15日，若比較標的交易日期為110年7月10日（經查110年7至9月不動產指數分別為：106%、108%、107%），其價格日期調整百分率為何？","opts":["98%","99%","101%","102%"],"explains":["98%低於100%代表向下調整，但比較標的交易日期（7月，指數106%）相對於勘估標的價格日期（8月15日附近，指數約108%）應呈現上升趨勢，方向不符。","99%同樣方向與數值不符合題目給定的指數變化趨勢。","101%雖為上升方向，但比例計算未精確對應108÷106的結果。","比較標的交易日期7月10日對應指數106%，勘估標的價格日期8月15日落在7-9月區間需內插或就近取8月指數約108%估算，調整百分率＝108÷106≈102%，與本選項相符。"],"correct":3,"note":"比較標的交易日期為7月（指數106%），勘估標的價格日期為8月15日（指數約108%），調整百分率＝108÷106≈102%。"},{"id":"VB1_111_11","cat":"B1","year":"111年第11題","q":"不動產估價比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達多少以上者，應排除該試算價格之適用？","opts":["百分之五","百分之十","百分之十五","百分之二十"],"explains":["5%遠低於技術規則第26條規定的20%門檻。","10%同樣低於20%門檻。","15%仍低於20%門檻，未達排除標準。","技術規則第26條明定：檢討後試算價格之間差距仍達20%以上者，應排除該試算價格之適用，與本選項相符。"],"correct":3,"note":null},{"id":"VB1_111_14","cat":"B1","year":"111年第14題","q":"不動產估價比較法於市場成交資訊充足時廣為運用，有關比較法之敘述，下列何者錯誤？","opts":["通常採用三件以上比較標的","試算價格之調整運算過程中，任一單獨項目之價格調整率大於百分之十五，應排除該比較標的之適用","試算價格之調整運算過程中，總調整率大於百分之三十時，應排除該比較標的之適用","其調整以差額法為原則"],"explains":["技術規則第27條規定原則上應採用「三件以上」比較標的，本選項描述正確，非本題答案（本題問「何者錯誤」）。","技術規則第25條規定任一單獨項目調整率大於15%應排除，本選項描述正確。","技術規則第25條規定總調整率大於30%應排除，本選項描述正確。","技術規則第24條明定差異調整以「百分率法」為原則，而非「差額法」為原則，差額法僅用於個別項目差額明確時的補充方式，本選項方法名稱錯誤，即本題正解。"],"correct":3,"note":"依規則規定，調整以「百分率法」為原則，「差額法」僅用於單獨項目之調整，此為敘述錯誤之處。"},{"id":"VB1_111_24","cat":"B1","year":"111年第24題","q":"有一比較標的於110年10月以800萬元成交，當時的價格指數為103.6%，不動產勘估標的之價格日期為111年3月，當時的價格指數為100.3%。假設其他條件相同，請問該勘估標的經價格日期調整後的價格為多少？","opts":["834.7萬元","826.3萬元","789.6萬元","774.5萬元"],"explains":["834.7萬元的計算方向或比例設定有誤。","826.3萬元同樣計算基礎有誤。","789.6萬元雖接近正確答案但比例計算略有偏差。","價格日期調整公式：調整後價格＝800×(100.3÷103.6)≈774.5萬元，指數下降代表市場呈現微幅下跌趨勢，調整後價格應低於原成交價。"],"correct":3,"note":"調整後價格＝800×(100.3÷103.6)≈774.5萬元。"},{"id":"VB1_112_6","cat":"B1","year":"112年第6題","q":"依不動產估價技術規則規定，比較標的為父親賣給兒子之交易，應進行何種調整？","opts":["情況調整","價格日期調整","區域因素調整","個人因素調整"],"explains":["技術規則第23條第4款明定親友間交易（含父母子女間之買賣）應進行情況調整，父親賣給兒子屬於典型的親友間交易情況。","價格日期調整處理的是時間差異致價格水準變動，與交易雙方關係（父子）無關。","區域因素調整處理的是區域位置差異，與交易雙方為父子關係無關。","「個人因素調整」並非技術規則定義的調整項目名稱，技術規則規定的是「個別因素調整」（標的本身條件差異），且與本題交易雙方關係無關。"],"correct":0,"note":null},{"id":"VB1_112_23","cat":"B1","year":"112年第23題","q":"比較法估價試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內之任一單獨項目之價格調整率大於（甲），或情況、價格日期、區域因素及個別因素調整總調整率大於（乙）時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問（甲）與（乙）各為多少？","opts":["（甲）為百分之十五，（乙）為百分之十五","（甲）為百分之十五，（乙）為百分之三十","（甲）為百分之三十，（乙）為百分之十五","（甲）為百分之三十，（乙）為百分之三十"],"explains":["甲乙皆為15%與規則規定的甲15%、乙30%不符，乙的數字錯誤。","技術規則第25條明定：單項調整率上限15%（甲），總調整率上限30%（乙），與本選項完全相符。","甲乙數字對調，與規則規定相反。","甲乙皆設為30%，甲的數字應為15%而非30%，本選項甲的數字錯誤。"],"correct":1,"note":null},{"id":"VB1_113_7","cat":"B1","year":"113年第7題","q":"有關比較法的敘述下列何者錯誤？","opts":["比較標的價格經情況調整、價格日期調整、區域因素調整及個別因素調整後所獲得之價格稱為比較價格","比較法指以比較標的價格為基礎，經比較、分析及調整等，以推算勘估標的價格之方法","價格日期調整是指比較標的之交易日期與勘估標的之價格日期因時間之差異，致價格水準發生變動，應以適當之變動率或變動金額，將比較標的價格調整為勘估標的價格日期之價格","比較標的與勘估標的不在同一近鄰地區內時，為將比較標的之價格轉化為與勘估標的同一近鄰地區內之價格水準的調整稱為區域因素調整"],"explains":["比較標的價格經各項調整後所得之價格，依技術規則第21條第2項定義應稱為「試算價格」，須再經第26條重新檢討確認適當合理後才能稱為「比較價格」，本選項將試算價格直接稱為比較價格，混淆了兩個階段的用語，此為錯誤敘述，即本題正解。","技術規則第18條明定比較法之定義，與本選項描述相符，敘述正確。","技術規則第19條第2款明定價格日期調整之定義，與本選項描述相符，敘述正確。","技術規則第19條第3款明定區域因素調整之定義，與本選項描述相符，敘述正確。"],"correct":0,"note":"依規則規定，比較標的價格經各項調整後所得之價格應稱為「試算價格」，須經重新檢討後才能成為「比較價格」，此為敘述錯誤之處。"},{"id":"VB1_113_8","cat":"B1","year":"113年第8題","q":"不動產估價技術規則第26條第1項：經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別為79萬元/坪，77萬元/坪及95萬元/坪，下列敘述何者正確？","opts":["三個試算價格之間皆符合排除條件","三個試算價格之間皆不符合排除條件","比較標的一與三之間符合排除條件","比較標的二與三之間符合排除條件"],"explains":["需逐一檢驗三組差距是否皆達20%以上，依官方答案並非三者皆符合排除條件。","需逐一檢驗，依官方答案並非三者皆不符合排除條件，至少有一組超過門檻。","比較標的一（79）與三（95）之差距＝(95-79)÷[(95+79)/2]≈18.4%，未達20%門檻，不符合排除條件。","比較標的二（77）與三（95）之差距＝(95-77)÷[(95+77)/2]≈20.9%，已超過技術規則第26條規定的20%門檻，符合排除條件，此為本題正解。"],"correct":3,"note":"二、三差距＝(95－77)÷[(95+77)/2]≈21%，超過20%；一、三差距＝(95－79)÷[(95+79)/2]≈18.4%，未超過20%。故僅二、三符合排除條件。"},{"id":"VB1_113_23","cat":"B1","year":"113年第23題","q":"依據不動產估價技術規則規定試算價格的價格決定，那一項不適用？","opts":["試算價格調整過程中，任一單獨項目之價格調整率大於15%時應排除","試算價格調整過程中，總調整率大於20%應排除","試算價格調整過程中，總調整率大於30%應排除","試算價格調整過程中，試算價格之間差距達20%以上應排除"],"explains":["技術規則第25條規定任一單獨項目調整率大於15%應排除，本選項描述正確，適用本規則，非本題答案（本題問「那一項不適用」）。","技術規則第26條規定的是試算價格「差距」達20%以上應排除，而非「調整過程中總調整率」大於20%應排除，本選項把總調整率的門檻誤植為20%（正確應為30%），與規則規定不符，即本題正解（不適用）。","技術規則第25條規定總調整率大於30%應排除，本選項描述正確，適用本規則。","技術規則第26條規定試算價格之間差距達20%以上應排除，本選項描述正確，適用本規則。"],"correct":1,"note":"總調整率上限應為30%而非20%，此選項不適用（即敘述有誤）。"},{"id":"VB1_113_22","cat":"B1","year":"113年第22題","q":"比較標的於112年9月以3,060萬元售出，當時房價指數為102；勘估標的價格日期為113年5月，房價指數上漲至105。假設其他條件相同，勘估標的經價格日期調整後的應該是多少？","opts":["2,970萬元","3,150萬元","3,240萬元","3,210萬元"],"explains":["2,970萬元的計算方向或比例設定有誤。","價格日期調整公式：調整後價格＝3,060×(105÷102)≈3,150萬元，房價指數上升代表市場呈現上漲趨勢，調整後價格應高於原成交價。","3,240萬元的計算結果超出正確比例換算範圍。","3,210萬元同樣與正確比例計算結果有落差。"],"correct":1,"note":"調整後價格＝3,060×(105÷102)≈3,150萬元。"},{"id":"VB1_114_4","cat":"B1","year":"114年第4題","q":"比較標的為與法定用途不符之交易，應先作適當之調整才能採用，此為何種調整？","opts":["情況調整","價格日期調整","區域因素調整","個別因素調整"],"explains":["技術規則第23條第12款明定：比較標的之交易與法定用途不符者，應先作適當調整才能採用，此屬情況調整之範疇。","價格日期調整處理的是時間差異致價格水準變動，與「法定用途不符」這種交易條件異常無關。","區域因素調整處理的是區域位置差異，與「法定用途不符」這種交易本身的異常情況無關。","個別因素調整處理的是標的本身條件差異（面積、形狀等），與交易是否符合法定用途無關，此為交易情況層面的問題，應屬情況調整。"],"correct":0,"note":null},{"id":"VB1_114_5","cat":"B1","year":"114年第5題","q":"下列價格調整率何者符合不動產估價技術規則之規定？","opts":["區域因素總價格調整率為18%","個別因素總價格調整率為18%","個別因素內之任一單獨項目之價格調整率為18%","情況、價格日期、區域因素及個別因素調整總調整率為18%"],"explains":["區域因素總價格調整率18%，若指的是區域因素「內任一單獨項目」調整率，18%已超過技術規則第25條規定的15%單項上限，不符合規定。","個別因素總價格調整率18%，同樣若指任一單獨項目調整率，18%已超過15%上限，不符合規定。","個別因素內任一單獨項目之價格調整率18%，已明確超過技術規則第25條規定的15%單項調整率上限，不符合規定。","情況、價格日期、區域因素及個別因素「調整總調整率」18%，未超過技術規則第25條規定的30%總調整率上限，符合規定。"],"correct":3,"note":"18%未超過總調整率上限30%，故符合規定；其餘選項18%已超過個別/區域因素單項調整率上限15%，不符合規定。"},{"id":"VB2_100_38","cat":"B2","year":"100年第38題","q":"兩宗土地合併後整體利用，合併後價格為1,000萬元，其合併前價格分別為300萬元及500萬元，則對於原來500萬元之土地，其合併後價格應為：","opts":["600萬元","700萬元","625萬元","425萬元"],"explains":["600萬元計算有誤，未正確套用合併增值比例分配公式。","700萬元計算有誤。","合併增值法公式：某宗合併後價格＝合併後總價×(該宗合併前價格÷各宗合併前總和)＝1,000×(500÷800)＝625萬元，與本選項相符。","425萬元計算有誤，方向不正確。"],"correct":2,"note":"500÷(300+500)＝62.5%；合併後分配價格＝1,000×62.5%＝625萬元。"},{"id":"VB2_106_7","cat":"B2","year":"106年第7題","q":"不動產估價比較法就「畸零地或有合併使用之交易」所進行之調整，是屬於下列何項調整？","opts":["情況調整","價格日期調整","區域因素調整","個別因素調整"],"explains":["技術規則明定畸零地或有合併使用之交易，係因買方有合併使用需求而願意支付較高價格，此種因特殊動機造成的價格偏離正常市場，屬於「情況調整」之範疇（交易條件異常須予調整），與題目相符。","價格日期調整處理的是時間差異致價格水準變動，與合併使用動機無關。","區域因素調整處理的是區域位置差異，與合併使用動機無關。","個別因素調整處理的是標的本身條件差異（面積、形狀等），與買方合併使用動機不同（合併使用造成的溢價是情況層面的調整）。"],"correct":0,"note":null},{"id":"VB2_107_24","cat":"B2","year":"107年第24題","q":"三筆土地分別為1500萬元、2500萬元及6000萬元，今決定將三筆土地合併開發，經評估合併後土地總價值為1億5千萬元，請問相對於原來1500萬元之土地，其合併後價格應為：","opts":["3750萬元","2250萬元","9000萬元","2500萬元"],"explains":["3,750萬元計算有誤，可能誤用了不同的計算基礎。","合併增值法公式：1500萬元那宗合併後價格＝15,000×(1,500÷10,000)＝15,000×0.15＝2,250萬元，與本選項相符。","9,000萬元明顯偏高，計算有誤。","2,500萬元計算有誤。"],"correct":1,"note":"1500÷(1500+2500+6000)＝15%；合併後分配價格＝15,000×15%＝2,250萬元。"},{"id":"VB2_108_4","cat":"B2","year":"108年第4題","q":"設三宗土地合併後整體開發利用，其合併後價格為2,500萬元，合併前價格分別為800萬元、500萬元及700萬元。則對於原來700萬元之土地，其合併後之價格應為何？","opts":["825萬元","850萬元","875萬元","895萬元"],"explains":["825萬元計算有誤。","850萬元計算有誤。","合併增值法公式：700萬元那宗合併後價格＝2,500×(700÷2,000)＝2,500×0.35＝875萬元，與本選項相符。","895萬元計算有誤。"],"correct":2,"note":"700÷(800+500+700)＝35%；合併後分配價格＝2,500×35%＝875萬元。"},{"id":"VC1_99_7","cat":"C1","year":"99年第7題","q":"按工程概算項目逐項比較勘估標的與比較標的或標準建物之差異，並依工程價格及工程數量比率進行調整，以求取勘估標的營造或施工費方法，稱之為：","opts":["淨計法","工程造價比較法","單位工程法","單位面積比較法"],"explains":["淨計法是逐一材料人工數量乘以單價工資之直接法，與題目所述「按工程概算項目逐項比較調整」之間接法性質不同。","技術規則明定工程造價比較法：按工程概算項目逐項比較勘估標的與比較標的或標準建物之差異，並依工程價格及工程數量比率進行調整，與題目敘述完全相符。","單位工程法是建築細部工程各項目單價乘以施工數量之直接法，與題目所述間接法性質不同。","單位面積比較法是以單位面積營造費為基礎乘以勘估標的面積，與題目所述「逐項比較工程概算項目」之具體操作方式不同。"],"correct":1,"note":null},{"id":"VC1_99_8","cat":"C1","year":"99年第8題","q":"根據不動產估價技術規則規定，成本法中估算勘估標的資本利息之敘述，何者正確？","opts":["應依分期投入資本數額及資本使用年數","預售收入之資金應計息","若勘估標的包含土地時，不應另加計土地價格","自有資金之計息利率可高於1年以上活存利率"],"explains":["技術規則明定資本利息應依分期投入資本數額及資本使用年數計息，與題目敘述相符，為正確敘述。","預售收入之資金應依其資金來源性質計息，而非一律應計息或不應計息，本選項過於絕對。","若勘估標的包含土地，土地價格亦應計息，本選項「不應另加計土地價格」與規則規定相反，敘述錯誤。","自有資金之計息利率應不高於1年期定存利率、不低於活存利率，並非「可高於1年以上活存利率」之模糊描述，本選項表述不精確。"],"correct":0,"note":null},{"id":"VC1_99_21","cat":"C1","year":"99年第21題","q":"若勘估標的同時包含土地與建物，但視為無建物存在之素地進行估價，稱之為何？","opts":["部分估價","獨立估價","限制估價","特殊估價"],"explains":["部分估價是附有建物之宗地估價，考慮建物對宗地價格造成之影響，與題目所述「視為無建物存在」之定義相反。","技術規則明定獨立估價係土地上有建物，但估價時將土地視為素地估價（不考慮建物影響），與題目敘述完全相符。","「限制估價」並非技術規則明定之正式估價類型名稱。","「特殊估價」並非技術規則明定之正式估價類型名稱（特殊價格是價格種類而非估價方法類型）。"],"correct":1,"note":null},{"id":"VC1_99_32","cat":"C1","year":"99年第32題","q":"勘估標的如果是區分所有建物時，以其房地價格推估該區分所有建物基地單價時，下列估計方式的敘述何種有誤？","opts":["該區分所有建物基地權利價格＝該區分所有建物房地價格－該區分所有建物之建物成本價格","該區分所有建物之基地權利單價＝該區分所有建物基地權利價格／該區分所有建物之基地持分面積","基地單價＝該區分所有建物之基地權利單價×平均地價分配率／該區分所有建物之地價分配率","基地單價＝該區分所有建物基地持分價格×該區分所有建物之基地持分面積"],"explains":["技術規則第99條明定：基地權利價格＝房地價格－建物成本價格，此為正確之計算公式，非本題答案（本題問「何種有誤」）。","基地權利單價＝基地權利價格÷基地持分面積，此為正確之計算公式。","基地單價＝基地權利單價×平均地價分配率÷該區分所有建物之地價分配率，此為正確之樓層別效用比相關公式。","「基地單價＝基地持分價格×基地持分面積」此公式邏輯有誤，基地單價應是「單位面積價格」，以總價格乘以面積會得出更大的數值而非單價，正確應為基地持分價格除以面積，本選項運算方式錯誤，即本題正解。"],"correct":3,"note":null},{"id":"VC1_99_34","cat":"C1","year":"99年第34題","q":"下列何者非估計勘估標的之營造或施工費時應包括之成本？","opts":["稅捐","間接人工費","資本利息","廣告費"],"explains":["稅捐是技術規則明定營造施工費應包括之成本項目之一，非本題答案（本題問「非」應包括之成本）。","間接人工費是營造施工費之構成項目，應包括在內。","資本利息是技術規則明定營造施工費應包括之成本項目之一。","廣告費屬於總成本中「間接成本」之廣告銷售費範疇，並非「營造或施工費」本身應包括之項目（營造施工費是直接成本，廣告費是間接成本之另一獨立項目），即本題正解。"],"correct":3,"note":"廣告費屬視性質「得」計入成本估價之項目，並非營造或施工費本身應包括之直接成本項目。"},{"id":"VC1_99_36","cat":"C1","year":"99年第36題","q":"依建築細部工程之各項目單價，乘以該工程施工數量，並合計之，此方法為何？","opts":["工程造價比較法","單位工程法","淨計法","單位面積比較法"],"explains":["工程造價比較法是按工程概算項目逐項比較調整之間接法，與題目所述「依細部工程項目單價乘以施工數量」之具體計算方式不同。","技術規則明定單位工程法係依建築細部工程之各項目單價，乘以該工程施工數量，並合計之，與題目敘述完全相符。","淨計法是逐一材料人工數量乘以單價工資，計算單位是材料人工而非建築細部工程項目，與題目敘述不同。","單位面積比較法是以單位面積營造費為基礎乘以面積，計算單位是整體面積而非細部工程項目，與題目敘述不同。"],"correct":1,"note":null},{"id":"VC1_99_38","cat":"C1","year":"99年第38題","q":"下列有關成本法中估算勘估標的資本利息之敘述何者錯誤？","opts":["應依分期投入資本數額及資本使用年數計息","自有資金不應計息","若勘估標的包含土地時，土地價格亦應計息","資本利息之計算應按各項費用之合計額乘上利率計算"],"explains":["資本利息應依分期投入資本數額及資本使用年數計息，此為正確敘述，非本題答案（本題問「何者錯誤」）。","技術規則明定自有資金「應」計息（計息利率不高於1年期定存、不低於活存），並非不應計息，本選項與規則規定相反，即本題正解。","若勘估標的包含土地，土地價格亦應計息，此為正確敘述。","資本利息之計算應按各項費用之合計額乘上利率計算，此為正確之計算方式敘述。"],"correct":1,"note":null},{"id":"VC1_100_11","cat":"C1","year":"100年第11題","q":"運用成本法進行不動產估價，下列何者不需納入計算？","opts":["土地總成本","建物總成本","建物累積折舊額","土地增值"],"explains":["土地總成本是成本法房地成本價格計算之必要組成部分，需納入計算，非本題答案（本題問「不需」納入計算）。","建物總成本（扣除折舊後為建物成本價格）是成本法計算之必要組成部分，需納入計算。","建物累積折舊額是計算建物成本價格（重建成本扣除折舊）之必要項目，需納入計算。","土地增值是指土地價格隨時間上漲之金額變化，並非成本法計算房地成本價格時應納入之獨立計算項目（成本法著重於成本之加總，非市場增值幅度之計算），即本題正解。"],"correct":3,"note":null},{"id":"VC1_100_16","cat":"C1","year":"100年第16題","q":"依不動產估價技術規則規定，以成本法推估建物折舊前之價格時，以求取何種成本為原則？","opts":["重製成本","重置成本","重建成本","營造成本"],"explains":["「重製成本」並非技術規則明定之正式用語（正確用語為重建成本或重置成本）。","重置成本是建材無生產或施工方法改變時之例外替代成本，並非折舊前價格推估之原則性成本。","技術規則明定建物折舊前之價格，以求取重建成本為原則，與題目敘述完全相符。","「營造成本」並非技術規則明定折舊前價格推估之正式專有名詞（營造或施工費是總成本之構成項目之一，非折舊前價格之原則用語）。"],"correct":2,"note":null},{"id":"VC1_100_18","cat":"C1","year":"100年第18題","q":"下列何者不屬於營造或施工費應考量之項目？","opts":["銷售費","稅捐","資本利息","利潤"],"explains":["銷售費屬於總成本中「間接成本」之廣告銷售費項目，並非「營造或施工費」本身應考量之項目，即本題正解（本題問「不屬於」營造施工費應考量之項目）。","稅捐是技術規則明定營造施工費應考量之項目之一。","資本利息是技術規則明定營造施工費應考量之項目之一。","利潤是技術規則明定營造施工費應考量之項目之一。"],"correct":0,"note":null},{"id":"VC1_100_32","cat":"C1","year":"100年第32題","q":"不動產估價技術規則規定：「建物已不具備使用價值，將其基地視為素地估價」，此為：","opts":["部分估價","獨立估價","限制估價","特殊估價"],"explains":["部分估價是考慮建物對宗地價格之影響，與題目所述「建物已不具使用價值，視為素地估價」之定義相反。","技術規則明定建物已不具備使用價值，將其基地視為素地估價，此即獨立估價之具體應用情境（不考慮已無實質效用之建物），與題目敘述相符。","「限制估價」並非技術規則明定之正式估價類型名稱。","「特殊估價」並非技術規則明定之正式估價類型名稱。"],"correct":1,"note":null},{"id":"VC1_101_3","cat":"C1","year":"101年第3題","q":"於民國100年評估一棟20年前建造、樓地板面積200坪之建物，該建物之建築成本於民國80年每坪5萬元、100年每坪10萬元，如經濟耐用年數為50年、殘餘價格率為10％。若採定額法折舊，請問該建物之成本價格為何？","opts":["720萬元","1,000萬元","1,280萬元","2,000萬元"],"explains":["720萬元僅為累積折舊額本身之數值，並非扣除折舊後之成本價格（成本價格須以重建成本減去累積折舊額），混淆了折舊額與最終成本價格。","1,000萬元的計算基礎有誤，未正確採用價格日期（100年）當時每坪10萬元之重建成本標準。","重建成本應採價格日期（民國100年）當時造價標準，即每坪10萬元×200坪＝2,000萬元；年折舊額＝2,000×(1-10%)÷50＝36萬元；累積折舊（20年）＝36×20＝720萬元；成本價格＝2,000－720＝1,280萬元，與本選項相符。","2,000萬元僅為未扣除折舊之重建成本總額，並非扣除累積折舊後之最終成本價格。"],"correct":2,"note":"重建成本應以「現在（100年）」之造價為準，C＝200坪×10萬＝2,000萬元；累積折舊額＝2,000×(0.9/50)×20＝720萬元；現值＝2,000－720＝1,280萬元。"},{"id":"VC1_101_4","cat":"C1","year":"101年第4題","q":"依不動產估價技術規則規定，勘估標的營造費求取方式中稱直接法者分為那兩種？①淨計法　②單位工程法　③工程造價比較法　④單位面積比較法　⑤粗算法","opts":["①②","②③","③④","④⑤"],"explains":["技術規則明定直接法分為淨計法與單位工程法兩種，與本選項①②組合完全相符。","②單位工程法屬直接法，但③工程造價比較法屬間接法，混合兩類方法，組合錯誤。","③④兩項皆屬間接法（工程造價比較法、單位面積比較法），非直接法之子方法。","④單位面積比較法屬間接法，⑤「粗算法」並非技術規則明定之正式方法名稱，組合錯誤。"],"correct":0,"note":null},{"id":"VC1_101_12","cat":"C1","year":"101年第12題","q":"營造費＝［Σ（標準建物工程概算項目每坪單價×單價調整率）］×總面積，此可為下列何種方法之計算公式？","opts":["淨計法","單位工程法","工程造價比較法","單位面積比較法"],"explains":["淨計法是逐一材料人工數量乘以單價工資，計算單位是材料人工，與題目所述「標準建物工程概算項目每坪單價」之公式結構不同。","單位工程法是建築細部工程各項目單價乘以施工數量，計算單位是工程項目，與題目所述以「標準建物」概算項目單價為基礎之公式不同。","題目公式為：營造費＝［Σ（標準建物工程概算項目每坪單價×單價調整率）］×總面積，此正是工程造價比較法依工程概算項目逐項比較調整之具體計算公式呈現方式。","單位面積比較法是以比較標的單位面積營造費為基礎調整，與題目公式中逐項加總「各工程概算項目」之結構不同（工程造價比較法是逐項計算後加總，單位面積比較法是整體單價調整）。"],"correct":2,"note":null},{"id":"VC1_101_17","cat":"C1","year":"101年第17題","q":"採成本法估價時，必須先求取某一基準日期重新建造對象不動產的原價，該基準日期稱為：","opts":["估價日期","勘察日期","出件日期","試算日期"],"explains":["技術規則第6條明定估價應切合「價格日期」當時之價值，成本法求取重新建造對象不動產原價之基準日期，即為價格日期，與題目敘述相符。","勘察日期是赴現場調查之日期，與「重新建造原價」之價格基準日期定義不同。","「出件日期」並非技術規則明定之正式用語。","「試算日期」並非技術規則明定之正式用語（試算價格是比較法之概念，非此處之基準日期名稱）。"],"correct":0,"note":"此基準日期依規則用語應為「價格日期」，惟四個選項均未列出此用語，故本題判定一律給分。"},{"id":"VC1_101_27","cat":"C1","year":"101年第27題","q":"以定額法計算建築物折舊額時，係假定在不動產耐用期間：","opts":["每年乘以一定比率計算折舊額","期初先確定減價額，累計時呈現減價額遞減","每年之減價額劃一計算，與經過年數逐年累計","每年折舊提存一定金額，以複利計算其總減價額"],"explains":["「每年乘以一定比率計算折舊額」是定率法之計算邏輯（依固定比率對前一年餘值計算），非定額法。","「期初先確定減價額，累計時呈現減價額遞減」並非定額法之描述，定額法每年折舊額固定不遞減。","定額法假定每年之減價額（折舊額）劃一固定計算，隨經過年數逐年累計，與題目敘述完全相符（這是等速折舊路徑之計算方式）。","「每年折舊提存一定金額，以複利計算總減價額」是償債基金法之計算邏輯（複利提存概念），非定額法。"],"correct":2,"note":null},{"id":"VC1_101_33","cat":"C1","year":"101年第33題","q":"從已知投資成分的價值，乘以資本化率，求得其收益後，由總收益中扣除，進而求得未知投資成分之價格的方法，上述方法稱為：","opts":["分配法","積算法","殘餘法","收益倍數法"],"explains":["「分配法」並非技術規則明定描述此種計算邏輯之正式專有名詞。","積算法通常指依直接成本加總計算之估價方法，與題目所述「由總收益扣除已知投資成分收益以求未知投資成分價格」之邏輯不同。","殘餘法之核心邏輯即為從已知投資成分（如土地或建物）價值乘以資本化率求得其應有收益，再從總收益中扣除，剩餘部分即為未知投資成分之收益，據以反推其價格，與題目敘述完全相符（此為土地貢獻說/建物貢獻說背後常用之計算邏輯）。","「收益倍數法」通常指以收益乘數估算價格之簡化方法，與題目所述扣除已知成分收益以求未知成分價格之邏輯不同。"],"correct":2,"note":null},{"id":"VC1_101_36","cat":"C1","year":"101年第36題","q":"進行不動產估價時，所謂獨立估價，係指：","opts":["土地上有建築物，但估價時將土地與建物併同估價","土地上無建築物，但估價時假設土地與建物併同估價","土地上有建築物，但估價時將土地視為素地加以估價","土地上無建築物，但估價時視為存有地上權加以估價"],"explains":["土地上有建築物時，獨立估價是將土地「視為素地」估價（不考慮建物），而非「土地與建物併同估價」，本選項描述與獨立估價定義相反。","獨立估價的前提是「土地上有建築物」存在，本選項描述「土地上無建築物」之情境不符獨立估價之適用前提。","技術規則明定獨立估價係土地上有建築物，但估價時將土地視為素地加以估價（不考慮建物影響），與本選項描述完全相符。","獨立估價是不考慮既有建物之影響，而非「視為存有地上權」這種額外假設權利存在之情境，本選項描述與獨立估價定義不符。"],"correct":2,"note":null},{"id":"VC1_102_14","cat":"C1","year":"102年第14題","q":"成本法操作中，使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，係指下列何者？","opts":["重造成本","重建成本","重置成本","提撥成本"],"explains":["「重造成本」並非技術規則明定之正式用語。","技術規則明定重建成本係使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，與題目敘述完全相符。","重置成本是以「現代建材標準」（而非相同或極類似建材）建築所需之成本，與題目所述「相同或極類似建材標準」之定義不符。","「提撥成本」並非技術規則明定之正式用語。"],"correct":1,"note":null},{"id":"VC1_102_15","cat":"C1","year":"102年第15題","q":"不動產估價成本法總成本各項推估中，下列敘述何者錯誤？","opts":["規劃設計費按總成本之百分之二至百分之三推估","廣告費、銷售費按總成本之百分之四至百分之五推估","管理費按總成本之百分之三至百分之四推估","稅捐按總成本之百分之零點五至百分之一點二推估"],"explains":["技術規則明定規劃設計費按「營造或施工費」（而非總成本）之2%至3%推估，本選項將推估基礎誤植為總成本，敘述錯誤，即本題正解。","廣告費、銷售費按總成本之4%至5%推估，此為正確敘述。","管理費按總成本之3%至4%推估，此為正確敘述。","稅捐按總成本之0.5%至1.2%推估，此為正確敘述。"],"correct":0,"note":"規劃設計費依規則應按「營造或施工費」之2%至3%推估，非按「總成本」推估，此為敘述錯誤之處。"},{"id":"VC1_102_30","cat":"C1","year":"102年第30題","q":"依不動產估價技術規則規定，某建商蓋到一半的建案，其建物應如何估價？","opts":["依實際完成部分估價","以總銷售金額扣除土地管銷成本及利潤率，再扣除剩餘建築費用","以總銷售金額扣除土地管銷成本及利潤率，再扣除延遲損失及剩餘建築費用","無法估價"],"explains":["技術規則第63條明定未完工建物應依實際完成部分估價，與題目敘述相符，這是處理興建中建案最直接的估價方式。","「以總銷售金額扣除土地管銷成本及利潤率，再扣除剩餘建築費用」此計算邏輯較接近土地開發分析法之公式架構，並非技術規則規定處理未完工建物估價之方式。","「扣除延遲損失」並非技術規則規定處理未完工建物估價時應計算之項目。","未完工建物雖未完工，但已投入部分仍具經濟價值，技術規則明定得依實際完成部分估價，並非無法估價。"],"correct":0,"note":null},{"id":"VC1_102_33","cat":"C1","year":"102年第33題","q":"成本法總成本中營造施工費之求取，估價實務上最常用的方法為何？","opts":["淨計法","單位工程法","工程造價比較法","單位面（體）積比較法"],"explains":["淨計法是逐一材料人工計算之最精細方法，因作業繁瑣，實務上較少採用。","技術規則及估價實務上，單位工程法（建築細部工程各項目單價乘以施工數量）兼顧精確度與作業效率，是估價實務上最常用的營造施工費求取方法。","工程造價比較法屬間接法，精確度不及直接法，較非實務最常用方法。","單位面積（體積）比較法是較粗略的間接法估算方式，精確度較低，非實務最常用方法。"],"correct":1,"note":null},{"id":"VC1_102_40","cat":"C1","year":"102年第40題","q":"依中華民國不動產估價師公會全國聯合會第四號公報規定，目前住宅用鋼筋混凝土造房屋之經濟耐用年限為多少年？","opts":["35年","40年","50年","60年"],"explains":["35年並非全聯會公報所定鋼筋混凝土造住宅用房屋之經濟耐用年限。","40年並非全聯會公報所定鋼筋混凝土造住宅用房屋之經濟耐用年限。","依不動產估價師公會全國聯合會第四號公報規定，住宅用鋼筋混凝土造房屋之經濟耐用年限為50年，與題目敘述相符。","60年並非全聯會公報所定鋼筋混凝土造住宅用房屋之經濟耐用年限（60年通常用於更耐久之構造類型）。"],"correct":2,"note":null},{"id":"VC1_103_3","cat":"C1","year":"103年第3題","q":"建物估價，以何種方法估價為原則？","opts":["收益法","成本法","比較法","殘餘法"],"explains":["收益法以淨收益折現或資本化估算價格，並非建物估價之原則方法（收益法較適用於收益性不動產，而非單純建物本身之估價原則）。","技術規則明定建物估價以成本法為原則（因建物可明確計算重建/重置成本並扣除折舊），與題目敘述相符。","比較法是估價的三大方法之一，但並非技術規則明定建物估價之原則方法。","殘餘法是成本法或收益法延伸應用之計算技巧，並非獨立的建物估價原則方法。"],"correct":1,"note":null},{"id":"VC1_103_17","cat":"C1","year":"103年第17題","q":"依不動產估價技術規則規定，下列有關總成本中廣告費之敘述，何者正確？","opts":["計算營造或施工費應考量廣告費","廣告費按營造或施工費乘以相關費率計算","廣告費之相關費率應由不動產估價師公會全國聯合會定期公告之","廣告費視勘估標的之性質，於成本估價時應予計入"],"explains":["計算營造或施工費並不需考量廣告費，廣告費屬於總成本中獨立的間接成本項目，與營造施工費（直接成本）計算無關。","廣告費是按「總成本」（而非營造或施工費）乘以相關費率計算，本選項計算基礎誤植。","技術規則明定廣告費、銷售費等相關費率，應由不動產估價師公會全國聯合會定期公告之，與題目敘述相符。","廣告費「視勘估標的之性質」於成本估價時得不予計入（並非應予計入），本選項與規則規定相反。"],"correct":2,"note":null},{"id":"VC1_103_33","cat":"C1","year":"103年第33題","q":"依不動產估價技術規則規定，下列有關總成本中規劃設計費之敘述，何者正確？","opts":["規劃設計費按縣（市）政府發布之建築師酬金標準表計算之","規劃設計費按實際營造施工費之百分之二至百分之五推估之","規劃設計費按縣（市）政府發布之建造執照工程造價表計算之","規劃設計費率由不動產估價師公會全國聯合會定期公告之"],"explains":["規劃設計費並非按縣市政府發布之建築師酬金標準表計算，技術規則自有其推估標準。","技術規則明定規劃設計費按「實際營造施工費」之2%至3%推估（本選項稱2%至5%，雖上限數字略有出入，但推估基礎「營造施工費」正確，依官方答案為此選項正確，建議以官方公告為準確認上限數字）。","規劃設計費並非按縣市政府發布之建造執照工程造價表計算，此非技術規則規定之推估依據。","規劃設計費「率」是技術規則明定之計算比率（2-3%），並非「由全聯會定期公告」此一動態公告機制（全聯會公告的是經濟耐用年數表、營造施工費標準表等項目，規劃設計費率是技術規則本身明定的固定比率範圍）。"],"correct":1,"note":null},{"id":"VC1_103_35","cat":"C1","year":"103年第35題","q":"請問「附有建物之宗地估價，應考慮該建物對該宗地價格造成之影響。但以素地估價為前提並於估價報告書敘明者，不在此限。」中，但書之規定屬於何種類型之估價？","opts":["獨立估價","部分估價","正常估價","限定估價"],"explains":["技術規則明定「附有建物之宗地估價，應考慮該建物對該宗地價格造成之影響。但以素地估價為前提並於估價報告書敘明者，不在此限」，此但書規定（以素地估價為前提）正是獨立估價（將土地視為素地，不考慮建物影響）之定義，與題目敘述相符。","部分估價正是該條文「本文」所規定之內容（考慮建物對宗地價格之影響），而非「但書」規定，題目問的是但書類型，非本文。","「正常估價」並非技術規則明定之正式估價類型名稱。","「限定估價」並非技術規則明定之正式估價類型名稱（限定價格是價格種類，非估價方法類型）。"],"correct":0,"note":null},{"id":"VC1_104_2","cat":"C1","year":"104年第2題","q":"下列何者最適合說明建築物預期的耐用年數期滿時，欲廢棄之資產價值？","opts":["回收價值（salvage value）","清算價值（liquidation value）","剩餘價值（residual value）","殘餘價值（scrap value）"],"explains":["回收價值（salvage value）通常指資產報廢時可回收再利用部分之價值，與題目所述「廢棄」資產之概念較不直接對應。","清算價值（liquidation value）通常指企業清算情境下急速處分資產之價值，與單純建物耐用年數期滿後之廢棄資產價值概念不同。","剩餘價值（residual value）通常用於描述扣除已知成分後的剩餘部分（如殘餘法概念），與「耐用年數期滿欲廢棄之資產價值」此一特定情境用語不完全對應。","殘餘價值（scrap value）正是技術規則所稱「殘餘價格」之英文對應概念，指建物耐用年數終止後欲廢棄時所餘存之價值，與題目敘述最為相符。"],"correct":3,"note":null},{"id":"VC1_104_18","cat":"C1","year":"104年第18題","q":"建物估價以求取重建成本為原則，但建物使用之材料目前已無生產或施工方法已改變者，得採取下列何種成本替代之？","opts":["毛胚成本","比較成本","重置成本","總體成本"],"explains":["「毛胚成本」並非技術規則明定之正式用語。","「比較成本」並非技術規則明定之正式用語。","技術規則明定建物估價以求取重建成本為原則，但建物使用之材料目前已無生產或施工方法已改變者，得採重置成本替代之，與題目敘述完全相符。","「總體成本」並非技術規則明定之正式用語。"],"correct":2,"note":null},{"id":"VC1_104_19","cat":"C1","year":"104年第19題","q":"營造或施工費，得就同一供需圈內近鄰地區或類似地區中選擇與勘估標的類似之比較標的或標準建物，經比較與勘估標的營造或施工費之條件差異並作價格調整以求取之，下列何者不是其子方法？","opts":["單位工程法","工程造價比較法","單位面積比較法","單位體積比較法"],"explains":["技術規則明定間接法之子方法為工程造價比較法及單位面積（或體積）比較法，「單位工程法」屬於直接法而非間接法之子方法，即本題正解（本題問「不是」間接法子方法者）。","工程造價比較法是技術規則明定間接法之子方法之一。","單位面積比較法是技術規則明定間接法之子方法之一。","單位體積比較法（與單位面積比較法併列，適用於不同建物型態）是間接法之子方法之一。"],"correct":0,"note":"單位工程法屬「直接法」，非屬此題所述「就近鄰地區或類似地區選擇比較標的」之間接法子方法，間接法包含工程造價比較法、單位面積比較法、單位體積比較法。"},{"id":"VC1_105_16","cat":"C1","year":"105年第16題","q":"在成本法中，使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，稱為下列何者？","opts":["新建成本","建造成本","重置成本","重建成本"],"explains":["「新建成本」並非技術規則明定之正式用語。","「建造成本」並非技術規則明定之正式用語。","重置成本是以「現代建材標準」（而非相同或極類似建材）建築所需之成本，與題目所述「相同或極類似建材標準」之定義不符。","技術規則明定重建成本係使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VC1_105_23","cat":"C1","year":"105年第23題","q":"有關房地估價之敘述，下列何者錯誤？","opts":["實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用之現況估價，並敘明法定容積對估值之影響","附有違章建築之房地估價，其違建部分不予以評估","未達最有效使用狀態之房地估價，應先求取其最有效使用狀態之正常價格，再視其低度使用情況進行調整","經調整。建物已不具備使用價值，得將其基地視為素地估價。但應考量建物拆除成本予以調整之"],"explains":["技術規則明定實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用之「合法部分」現況估價，並敘明法定容積對估值之影響，本選項未提及「合法部分」之限定，與規則完整規定有所出入，此為錯誤敘述，即本題正解。","附有違章建築之房地估價，違建部分不予以評估，此為正確敘述，符合技術規則規定。","未達最有效使用狀態之房地估價，應先求取最有效使用狀態之正常價格，再視低度使用情況進行調整，此為正確敘述。","建物已不具備使用價值，得將其基地視為素地估價，但應考量建物拆除成本予以調整之，此為正確敘述。"],"correct":0,"note":"應以「實際建築使用合法部分」之現況估價，並非以「實際建築使用」全部現況估價，此為敘述錯誤之處。"},{"id":"VC1_105_31","cat":"C1","year":"105年第31題","q":"依不動產估價技術規則之規定，下列何者非屬不動產估價師公會全國聯合會公告之項目？","opts":["建物工程進度營造費用比例表","開發或建築利潤率","建造執照工程造價表","營造或施工費標準表"],"explains":["建物工程進度營造費用比例表是技術規則明定由全聯會公告之項目，非本題答案（本題問「非屬」全聯會公告項目）。","開發或建築利潤率是技術規則明定由全聯會公告之項目。","「建造執照工程造價表」並非技術規則明定由全聯會公告之項目，這是常見混淆陷阱，建造執照工程造價表通常是地方政府工務機關發布之行政參考資料，非全聯會公告項目，即本題正解。","營造或施工費標準表是技術規則明定由全聯會公告之項目。"],"correct":2,"note":null},{"id":"VC1_105_32","cat":"C1","year":"105年第32題","q":"不動產估價技術規則有關廣告費、銷售費、管理費、稅捐及開發或建築利潤之規定，下列述敘何者正確？","opts":["廣告費、銷售費等，於成本估價時必須計入","開發或建築利潤，可視勘估標的之性質，於成本估價時得不予計入","稅捐於成本估價時必須計入","管理費於成本估價時一律計入"],"explains":["廣告費、銷售費「視勘估標的之性質」於成本估價時得不予計入（並非必須計入），本選項與規則規定相反。","技術規則明定開發或建築利潤，可視勘估標的之性質，於成本估價時得不予計入，與題目敘述相符。","稅捐同樣是「視勘估標的之性質」決定是否計入，並非必須計入，本選項過於絕對。","管理費同樣非一律計入，應視勘估標的之性質而定，本選項過於絕對。"],"correct":1,"note":null},{"id":"VC1_106_14","cat":"C1","year":"106年第14題","q":"勘估標的之營造或施工費之求取方法中，「以建築細部工程之各項目單價乘以該工程施工數量，並合計之」之方法，係指何方法？","opts":["淨計法","單位工程法","工程造價比較法","單位面積（或體積）比較法"],"explains":["淨計法是逐一材料人工數量乘以單價工資，與題目所述「建築細部工程各項目單價乘以施工數量」之計算單位不同。","技術規則明定單位工程法係以建築細部工程之各項目單價乘以該工程施工數量，並合計之，與題目敘述完全相符。","工程造價比較法是按工程概算項目逐項比較調整之間接法，與題目所述直接計算施工數量乘單價之方式不同。","單位面積（或體積）比較法是以單位面積營造費為基礎調整，與題目所述細部工程項目逐項計算之方式不同。"],"correct":1,"note":null},{"id":"VC1_106_30","cat":"C1","year":"106年第30題","q":"附有建物之宗地，考慮建物對宗地價格影響下所為之土地估價，稱之為：","opts":["分割估價","合併估價","部分估價","獨立估價"],"explains":["「分割估價」並非技術規則明定之正式估價類型名稱。","「合併估價」並非技術規則明定之正式估價類型名稱（合併開發估價屬比較法相關概念，與此處土地估價類型不同）。","技術規則明定部分估價係附有建物之宗地，考慮建物對宗地價格影響下所為之土地估價，與題目敘述完全相符。","獨立估價是不考慮建物影響、將土地視為素地估價，與題目所述「考慮建物影響」之定義相反。"],"correct":2,"note":null},{"id":"VC1_106_38","cat":"C1","year":"106年第38題","q":"成本法中，指與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本，是指何種成本？","opts":["重置成本","重建成本","重蓋成本","替換成本"],"explains":["技術規則明定重置成本係指與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本，與題目敘述完全相符。","重建成本是使用「相同或極類似」建材標準（而非現代建材標準）複製之成本，與題目所述「現代建材標準」之定義不符。","「重蓋成本」並非技術規則明定之正式用語。","「替換成本」並非技術規則明定之正式用語。"],"correct":0,"note":null},{"id":"VC1_106_40","cat":"C1","year":"106年第40題","q":"依不動產估價技術規則第55條第1款之規定，就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築之單價及人工工資，並加計管理費、稅捐、資本利息及利潤之估價方法稱為：","opts":["淨計法","單位法","工程造價比較法","單位面積比較法"],"explains":["技術規則第55條第1款明定淨計法係就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築之單價及人工工資，並加計管理費、稅捐、資本利息及利潤之方法，與題目敘述完全相符。","「單位法」並非技術規則明定之正式方法名稱（正確名稱應為單位工程法）。","工程造價比較法是按工程概算項目逐項比較調整之間接法，與題目所述直接逐一計算材料人工數量之方式不同。","單位面積比較法是以單位面積營造費為基礎調整，與題目所述逐一計算材料人工之方式不同。"],"correct":0,"note":null},{"id":"VC1_107_9","cat":"C1","year":"107年第9題","q":"在使用成本法估價時，建物估價以求取(甲)為原則。但建物使用之材料目前已無生產或施工方法已改變者，得採(乙)替代之。請問甲、乙分別為何種成本？","opts":["甲為重建成本、乙為重置成本","甲為重置成本、乙為重建成本","甲為直接成本、乙為間接成本","甲為間接成本、乙為直接成本"],"explains":["技術規則明定建物估價以求取重建成本為原則（甲），但建物使用之材料已無生產或施工方法已改變者，得採重置成本替代之（乙），與題目敘述（甲為原則、乙為替代）完全相符。","本選項將甲乙順序對調（甲為重置成本、乙為重建成本），與規則規定「重建成本為原則」之順序相反，敘述錯誤。","「直接成本、間接成本」是成本構成之分類（營造施工費vs規劃設計費等），與本題甲乙所問「建物估價基準成本」之原則與替代關係無關。","同C選項，直接成本與間接成本分類與本題所問成本替代關係無關。"],"correct":0,"note":null},{"id":"VC1_107_15","cat":"C1","year":"107年第15題","q":"不動產估價有所謂的獨立估價，請問獨立估價是指：","opts":["土地上原有地上建物，但於估價之價格日期時已頽壞傾倒，估價時仍視為有地上建物，併同土地一併估價","土地上無地上建物，純素地估價","土地上有地上建物，估價時將土地與地上建物併同估價","土地上有地上建物或他項權利存在，但估價時將土地視為素地予以估價，不考慮地上建物或他項權利對該土地的影響"],"explains":["若地上建物已頽壞傾倒，已不具實質使用價值，技術規則規定此情形應視為素地估價（即建物已不具備使用價值之獨立估價情境），而非「仍視為有地上建物」併同估價，本選項與獨立估價定義不符。","獨立估價的適用前提是「土地上有建築物」存在，本選項描述「純素地估價」（即土地上原本就無建物）不符獨立估價之定義情境（純素地本身就無須做「視為素地」之假設處理）。","獨立估價是「將土地視為素地」估價，而非「土地與建物併同估價」，本選項描述與獨立估價定義相反。","技術規則明定獨立估價係土地上有地上建物或他項權利存在，但估價時將土地視為素地予以估價，不考慮地上建物或他項權利對該土地之影響，與本選項描述完全相符。"],"correct":3,"note":null},{"id":"VC1_108_10","cat":"C1","year":"108年第10題","q":"使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，稱為：","opts":["重建成本","重置成本","直接成本","間接成本"],"explains":["技術規則明定重建成本係使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，與題目敘述完全相符。","重置成本是以「現代建材標準」（而非相同或極類似建材）建築所需之成本，與題目所述「相同或極類似建材標準」之定義不符。","直接成本是指營造或施工費，與題目所述「重新複製建築所需成本」之完整定義層次不同（直接成本是構成重建成本的其中一部分）。","間接成本是指規劃設計費、廣告銷售費等，與題目所述「重新複製建築」之核心成本定義不同。"],"correct":0,"note":null},{"id":"VC1_108_13","cat":"C1","year":"108年第13題","q":"就勘估標的之構成部分或全體，調查其使用材料之種別、品級、數量及所需勞力種別、時間等，並以勘估標的所在地區於價格日期之各種單價為基礎，計算其營造或施工費的方法為：","opts":["直接法","間接法","工程造價比較法","單位面積比較法"],"explains":["技術規則明定直接法係就勘估標的之構成部分或全體，調查其使用材料之種別、品級、數量及所需勞力種別、時間等，並以勘估標的所在地區於價格日期之各種單價為基礎，計算其營造或施工費，與題目敘述完全相符。","間接法是選擇比較標的或標準建物進行比較調整，與題目所述「就勘估標的本身逐一調查材料人工」之直接計算方式不同。","工程造價比較法屬間接法之子方法，與題目所述直接調查計算之方式不同。","單位面積比較法屬間接法之子方法，與題目所述直接調查計算之方式不同。"],"correct":0,"note":null},{"id":"VC1_108_16","cat":"C1","year":"108年第16題","q":"不動產估價技術規則第99條之計算公式，勘估標的之基地價格＝勘估標的之房地價格－勘估標的之建物成本價格。請問此為何種學說之主張？","opts":["土地貢獻說","建物貢獻說","聯合貢獻說","合併貢獻說"],"explains":["技術規則第99條明定基地價格＝房地價格－建物成本價格之公式，正是土地貢獻說的核心主張（房地結合之超額利潤歸屬於土地，扣除建物成本後之剩餘部分視為土地之貢獻價值），與題目敘述相符。","建物貢獻說主張超額利潤應歸屬於建物，與本公式「扣除建物成本求基地價格」（即超額利潤歸於土地）之邏輯相反。","聯合貢獻說主張房地結合之超額利潤是土地與建物共同聯合貢獻所致，與本公式單純將剩餘部分全歸於土地（基地價格）之邏輯不同。","「合併貢獻說」並非技術規則或估價理論明定之正式學說名稱。"],"correct":0,"note":null},{"id":"VC1_109_17","cat":"C1","year":"109年第17題","q":"依據不動產估價技術規則，有關成本法資本利息的敘述，下列敘述何者錯誤？","opts":["資金中自有資金之計息利率應不高於1年期定存利率","資金中自有資金之計息利率應不低於活存利率","借款則以銀行短期放款利率計息","預售收入之資金以定存利率計息"],"explains":["自有資金之計息利率應不高於1年期定存利率，此為正確敘述，非本題答案（本題問「何者錯誤」）。","自有資金之計息利率應不低於活存利率，此為正確敘述。","借款則以銀行短期放款利率計息，此為正確敘述。","技術規則明定預售收入之資金應依其資金來源性質計息（而非一律以定存利率計息），本選項過於絕對地規定以定存利率計息，與規則規定不符，即本題正解。"],"correct":3,"note":"預售收入之資金應依「其資金來源性質」計息（如自有資金或借款利率），並非一律以定存利率計息，此為敘述錯誤之處。"},{"id":"VC1_109_18","cat":"C1","year":"109年第18題","q":"成本法營造施工費求取方式，有分為直接法及間接法兩大類，其中以建築細部工程之各項目單價乘以該工程施工數量合計之方法係指下列何者？","opts":["淨計法","單位工程法","工程造價比較法","單位面積（或體積）比較法"],"explains":["淨計法是逐一材料人工數量乘以單價工資，與題目所述「建築細部工程各項目單價乘以施工數量」之計算單位不同。","技術規則明定單位工程法係以建築細部工程之各項目單價乘以該工程施工數量合計之，與題目敘述完全相符。","工程造價比較法屬間接法，與題目所述直接逐項計算施工數量乘單價之方式不同。","單位面積（或體積）比較法屬間接法，與題目所述細部工程項目逐項計算之方式不同。"],"correct":1,"note":null},{"id":"VC1_109_21","cat":"C1","year":"109年第21題","q":"估價人員就某建物使用與勘估標的相同之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，是指下列何者？","opts":["重置成本","重製成本","重建成本","複舊成本"],"explains":["重置成本是以「現代建材標準」（而非相同建材標準）建築所需之成本，與題目所述「相同之建材標準」之定義不符。","「重製成本」並非技術規則明定之正式用語。","技術規則明定重建成本係使用與勘估標的相同之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，與題目敘述完全相符。","「複舊成本」並非技術規則明定之正式用語。"],"correct":2,"note":null},{"id":"VC1_109_23","cat":"C1","year":"109年第23題","q":"依據不動產估價技術規則，有關成本法建築工期係指自申請建造執照開始至那個時間點為止無間斷所需之時間？","opts":["變更建照執照","擬定權利變換計畫","銷售完竣","建築完成達到可交屋使用"],"explains":["「變更建照執照」並非建築工期計算之終止時間點，這是建照變更程序而非完工概念。","「擬定權利變換計畫」是都市更新程序之專有概念，與一般建築工期之終止時間點無關。","「銷售完竣」是預售屋銷售完成之時間點，並非建築完成之時間點，建築工期關注的是「建造」過程而非銷售過程。","技術規則明定建築工期係指自申請建造執照開始至建築完成達到可交屋使用為止無間斷所需之時間，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VC1_110_8","cat":"C1","year":"110年第8題","q":"勘估標的之營造或施工費，依不動產估價技術規則之規定，不包含下列那一項目？","opts":["間接材料費","稅捐","資本利息","廣告費"],"explains":["間接材料費是技術規則明定營造施工費應包括之成本項目之一，非本題答案（本題問「不包含」之項目）。","稅捐是技術規則明定營造施工費應包括之成本項目之一。","資本利息是技術規則明定營造施工費應包括之成本項目之一。","廣告費屬於總成本中「間接成本」之廣告銷售費項目，並非「營造或施工費」本身應包括之項目，即本題正解。"],"correct":3,"note":null},{"id":"VC1_110_9","cat":"C1","year":"110年第9題","q":"就同一供需圈內近鄰地區或類似地區中，選擇與勘估標的類似之比較標的或標準建物，經比較與勘估標的營造或施工費之條件差異並作價格調整，以求取勘估標的營造或施工費的方法為何？","opts":["直接法","間接法","淨計法","單位工程法"],"explains":["直接法是就勘估標的本身逐一調查材料人工計算（淨計法、單位工程法），與題目所述「選擇比較標的或標準建物進行比較調整」之間接計算方式不同。","技術規則明定間接法係就同一供需圈內近鄰地區或類似地區中，選擇與勘估標的類似之比較標的或標準建物，經比較與勘估標的營造或施工費之條件差異並作價格調整，以求取勘估標的營造或施工費，與題目敘述完全相符。","淨計法屬直接法之子方法，與題目所述間接比較調整之方式不同。","單位工程法屬直接法之子方法，與題目所述間接比較調整之方式不同。"],"correct":1,"note":null},{"id":"VC1_111_7","cat":"C1","year":"111年第7題","q":"不動產估價成本法對勘估標的之營造或施工費，其中「指以類似勘估標的之比較標的或標準建物之單位面積（或體積）營造或施工費單價為基礎，經比較並調整價格後，乘以勘估標的之面積（或體積）總數，以求取勘估標的營造或施工費。」方法，係指何方法？","opts":["單位工程法","淨計法","單位面積（或體積）比較法","工程造價比較法"],"explains":["單位工程法是以建築細部工程各項目單價乘以施工數量，屬直接法，與題目所述「以比較標的單位面積營造費為基礎調整」之間接法定義不同。","淨計法是逐一材料人工數量乘以單價工資，屬直接法，與題目所述間接比較調整方式不同。","技術規則明定單位面積（或體積）比較法係以類似勘估標的之比較標的或標準建物之單位面積（或體積）營造或施工費單價為基礎，經比較並調整價格後，乘以勘估標的之面積（或體積）總數，以求取勘估標的營造或施工費，與題目敘述完全相符。","工程造價比較法是按工程概算項目逐項比較調整，與題目所述「以單位面積（或體積）營造費單價為基礎」之整體單價調整方式不同。"],"correct":2,"note":null},{"id":"VC1_112_11","cat":"C1","year":"112年第11題","q":"目前銀行之一年期定存利率為1.57%，活存利率為0.58%，短期放款利率為7.11%，下列之敘述何者正確？","opts":["資金中自有資金之計息利率為7.11%","資金中預售收入之計息利率為0.58%","資金中自有資金之計息利率為1.52%","資金中借款之計息利率為1.57%"],"explains":["自有資金之計息利率應不高於1年期定存利率1.57%，7.11%（短期放款利率）已超過此上限，不符規定。","預售收入之資金應依其資金來源性質計息，並非一律以活存利率0.58%計息，本選項描述過於絕對且未必符合規則精神。","技術規則規定自有資金之計息利率應介於活存利率（0.58%）與1年期定存利率（1.57%）之間，1.52%恰好落在此區間內，符合規定，與本選項相符。","技術規則規定借款應以「短期放款利率」（7.11%）計息，而非1年期定存利率1.57%，本選項計息基礎誤植。"],"correct":2,"note":"自有資金計息利率應不高於1年期定存利率（1.57%）、不低於活存利率（0.58%），1.52%落於此區間內，符合規定；借款應以短期放款利率（7.11%）計息，非1.57%。"},{"id":"VC1_112_12","cat":"C1","year":"112年第12題","q":"就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤，以求取勘估標的營造施工費之方法為何？","opts":["間接法","淨計法","工程造價比較法","單位面積比較法"],"explains":["間接法是選擇比較標的或標準建物進行比較調整，與題目所述「逐一計算材料人工數量並加計管理費等」之直接計算方式不同。","技術規則明定淨計法係就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤，以求取勘估標的營造施工費，與題目敘述完全相符。","工程造價比較法屬間接法，與題目所述逐一計算材料人工之直接方式不同。","單位面積比較法屬間接法，與題目所述逐一計算材料人工之直接方式不同。"],"correct":1,"note":null},{"id":"VC1_112_21","cat":"C1","year":"112年第21題","q":"有關房地成本價格之計算公式，下列何者正確？","opts":["房地成本價格＝土地總成本＋建物成本價格","房地成本價格＝土地總成本＋建物總成本","房地成本價格＝土地價格＋建物成本價格－建物累積折舊額","房地成本價格＝土地價格＋建物成本價格＋建物累積折舊額"],"explains":["技術規則明定房地成本價格＝土地總成本＋建物成本價格（建物成本價格係已扣除折舊之建物現值），與題目敘述完全相符。","「房地成本價格＝土地總成本＋建物總成本」中之建物總成本若未扣除折舊，將高估建物實際價值，與正確公式「建物成本價格（已扣除折舊）」不符。","土地價格與建物成本價格加總後再「減去建物累積折舊額」會造成折舊重複扣除（因建物成本價格本身已扣除折舊），公式邏輯錯誤。","土地價格與建物成本價格相加後再「加上建物累積折舊額」，會使已扣除折舊的建物現值再加回折舊額，等同於恢復未折舊狀態，公式邏輯錯誤。"],"correct":0,"note":null},{"id":"VC1_113_9","cat":"C1","year":"113年第9題","q":"下列何者非屬營造或施工費的內含項目？","opts":["直接人工費","間接材料費","開發商的合理利潤","資本利息"],"explains":["直接人工費是技術規則明定營造施工費之內含項目之一，非本題答案（本題問「非屬」內含項目）。","間接材料費是技術規則明定營造施工費之內含項目之一。","「開發商的合理利潤」雖然「利潤」是營造施工費內含項目之一，但此處特別強調「開發商的」利潤，與營造施工費所稱之承包商或營造商利潤概念不同；惟此題鑑別重點在於利潤本身雖屬內含項目，但開發或建築利潤依規則規定屬於可視性質決定是否計入之另一獨立項目（與直接的材料人工費等必要成本性質不同），故即本題正解。","資本利息是技術規則明定營造施工費之內含項目之一。"],"correct":2,"note":"開發商之開發利潤屬成本法總成本中之獨立項目，非屬「營造或施工費」本身之內含項目。"},{"id":"VC1_113_10","cat":"C1","year":"113年第10題","q":"有關營造或施工費的敘述何者錯誤？","opts":["營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低","勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋折舊的一部分","淨計法屬於直接法的一種，是指就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤","單位工程法也屬於直接法，係以建築細部工程之各項目單價乘以該工程施工數量，並合計之"],"explains":["技術規則規定的是「重建成本」隨價格日期之物價水準變動，並非「房屋愈舊，營造或施工費就愈低」這種直接關聯；營造施工費是重新複製建築當下的成本估算，與房屋實際屋齡無直接反向關係（房屋愈舊產生的是折舊額增加，而非營造施工費本身降低），此為錯誤敘述，即本題正解。","勘估標的之營造或施工費，得按直接法或間接法擇一求取之，此為正確敘述；功能性退化造成的折舊屬於房屋折舊的一部分，此亦為正確敘述。","淨計法屬於直接法的一種，其定義（逐一材料人工數量乘以單價工資，並加計管理費稅捐資本利息利潤）與技術規則規定相符，敘述正確。","單位工程法也屬於直接法，其定義（建築細部工程各項目單價乘以施工數量並合計）與技術規則規定相符，敘述正確。"],"correct":0,"note":"營造或施工費係指「重建（重置）成本」概念，反映的是現在重新建造所需之費用，並非隨屋齡增加而降低；建物因屋齡增加而減損的是「折舊額」，而非營造施工費本身，此為敘述錯誤之處。"},{"id":"VC1_114_2","cat":"C1","year":"114年第2題","q":"以成本法進行不動產估價，下列何者非為總成本應包括之項目？","opts":["營造或施工費","出售不動產之所得稅","資本利息","建築利潤"],"explains":["營造或施工費是技術規則明定總成本應包括之項目之一，非本題答案（本題問「非」總成本應包括之項目）。","出售不動產之所得稅是處分不動產後的稅務負擔，與成本法估算「建造」當下所需投入之總成本性質不同，並非技術規則明定總成本應包括之項目（這與收益法估算淨收益時排除所得稅之邏輯一致），即本題正解。","資本利息是技術規則明定總成本應包括之項目之一。","建築利潤是技術規則明定總成本應包括之項目之一（視性質得不予計入，但屬性上仍是總成本構成項目之一）。"],"correct":1,"note":null},{"id":"VC1_114_18","cat":"C1","year":"114年第18題","q":"勘估標的營造或施工費之求取得採直接法或間接法，下列各方法中何者相對精細？","opts":["工程造價比較法","淨計法","單位工程法","單位面積比較法"],"explains":["工程造價比較法屬間接法，精確度不及直接法，非本題答案（本題問「相對精細」之方法）。","淨計法是逐一材料人工數量乘以單價工資的最精細計算方式（逐項計算每一種材料與人工），屬直接法中最精細之方法，與題目敘述相符。","單位工程法雖屬直接法，但其計算單位是「工程項目」而非逐一材料人工，精細度不及淨計法。","單位面積比較法屬間接法，是較粗略的整體估算方式，精確度最低。"],"correct":1,"note":null},{"id":"VC2_99_13","cat":"C2","year":"99年第13題","q":"建物經過一定時間會產生折舊，有關建物累積折舊額之計算，根據不動產估價技術規則規定應該以何為原則呢？","opts":["定額法","定率法","償債基金法","觀察法"],"explains":["技術規則明定建物累積折舊額之計算應以定額法為原則（每年折舊額固定計算），與題目敘述相符。","定率法（每年依固定比率對前一年餘值計算）是折舊計算方法之一，但並非規則明定之原則方法。","償債基金法（複利提存概念）是折舊計算方法之一，但並非規則明定之原則方法。","「觀察法」並非技術規則明定之正式折舊計算方法名稱。"],"correct":0,"note":null},{"id":"VC2_99_14","cat":"C2","year":"99年第14題","q":"當估價師進行不動產估價時，對於附有違章建築之房地估價，有關違建部分是否需要評估呢？","opts":["違建部分一定要評估。並需就合法建物及違建部分於估價報告書中合併計算其價值","違建部分不予以評估。但委託人要求評估其價值，並就合法建物及違建部分於估價報告書中分別標示各該部分之價格者，不在此限","違建部分一定要評估。但委託人要求評估其價值，可就合法建物及違建部分於估價報告書中分別標示各該部分之價格者","違建部分不予以評估。但受託人可自行斟酌其價值"],"explains":["技術規則明定違建部分「不予以評估」，並非「一定要評估並合併計算」，本選項與規則規定相反。","技術規則明定附有違章建築之房地估價，違建部分不予以評估，但委託人要求評估其價值者，應就合法建物及違建部分分別標示各該部分之價格，與題目敘述完全相符。","違建部分原則上「不予以評估」（而非「一定要評估」），本選項對原則之描述與規則相反。","委託人要求評估時，應依規則規定分別標示價格，並非由受託人「自行斟酌」決定是否評估，本選項與規則明確規定不符。"],"correct":1,"note":null},{"id":"VC2_99_16","cat":"C2","year":"99年第16題","q":"根據不動產估價技術規則規定，實際建築使用之容積率超過法定容積率之房地估價，應以何種容積估價呢？","opts":["以法定容積估價","以實際建築使用合法部分之現況估價","根據法定容積或是實際建築使用合法部分擇一估價","根據重新測量所得面積估價"],"explains":["技術規則並非以「法定容積」估價（這會忽略實際已建成且合法之使用現況），與規則規定不符。","技術規則明定實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響，與題目敘述相符。","規則並非「擇一」估價，而是明確規定以實際建築使用合法部分之現況估價為準。","「根據重新測量所得面積估價」並非技術規則規定處理容積超限情形之方式。"],"correct":1,"note":null},{"id":"VC2_99_26","cat":"C2","year":"99年第26題","q":"建築物因功能或效益衰退至不值得使用所經歷之年數，稱之為何？","opts":["物理耐用年數","化學耐用年數","經濟耐用年數","建築耐用年數"],"explains":["物理耐用年數指建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數，與題目所述「功能或效益衰退」之定義不同。","「化學耐用年數」並非技術規則明定之正式用語。","技術規則明定經濟耐用年數係建物因功能或效益衰退至不值得使用所經歷之年數，與題目敘述完全相符。","「建築耐用年數」並非技術規則明定之正式用語。"],"correct":2,"note":null},{"id":"VC2_100_12","cat":"C2","year":"100年第12題","q":"依不動產估價技術規則之規定，計算建物折舊額時應以何種年數為主？","opts":["物理耐用年數","經濟耐用年數","資本使用年數","調整耐用年數"],"explains":["物理耐用年數是結構層面之耐用年數概念，技術規則明定折舊計算應以經濟耐用年數為主，非物理耐用年數。","技術規則明定建物折舊額計算應以經濟耐用年數為主，與題目敘述相符。","「資本使用年數」是資本利息計算之相關概念，非建物折舊計算所採用之耐用年數類型。","「調整耐用年數」並非技術規則明定之正式用語。"],"correct":1,"note":null},{"id":"VC2_101_14","cat":"C2","year":"101年第14題","q":"運用成本法估計建築物價格時，如採定額法折舊，則求取建築物累積折舊之公式為：Dn = C × [(1 - s )/N] × n，其中N優先採用下列何者？","opts":["物理耐用年數","殘餘年數","經濟耐用年數","已經歷年數"],"explains":["物理耐用年數是結構層面之概念，技術規則明定折舊計算公式中N應優先採用經濟耐用年數，非物理耐用年數。","「殘餘年數」並非折舊公式中N所代表之正確變數名稱（N代表的是耐用年數本身）。","技術規則明定定額法折舊公式中之N（總耐用年數）應優先採用經濟耐用年數，與題目敘述相符，這是因為經濟耐用年數較能反映建物實際喪失市場價值之時點。","「已經歷年數」是公式中之變數n（小寫，已使用年數），與公式中N（大寫，總耐用年數）為不同變數，本選項混淆兩者。"],"correct":2,"note":null},{"id":"VC2_101_26","cat":"C2","year":"101年第26題","q":"於不動產估價時，所謂物理的耐用年數，係指：","opts":["建築改良物從興建完成，至不堪使用的期間","建築改良物對不動產價值具有貢獻的一段期間","建築改良物從興建完成，至毀損的期間","建築改良物從興建完成，至其經濟壽命結束的期間"],"explains":["技術規則明定物理耐用年數係指建築改良物從興建完成，至「不堪使用」的期間（即因自然耗損或外力破壞至結構脆弱不堪使用），與題目敘述相符。","「對不動產價值具有貢獻的一段期間」較接近經濟耐用年數之概念（強調效益與價值貢獻），非物理耐用年數定義。","「至毀損的期間」描述較為片面，技術規則之正式定義是「至不堪使用」，毀損僅是不堪使用的其中一種成因。","「至其經濟壽命結束的期間」是經濟耐用年數之定義，非物理耐用年數。"],"correct":0,"note":null},{"id":"VC2_101_35","cat":"C2","year":"101年第35題","q":"某棟建物耐用年數為50年，殘價率為10％，該建物每年折舊率為：","opts":["1.8％","2.0％","1.5％","2.4％"],"explains":["依定額法折舊率公式：(1－殘價率)÷耐用年數＝(1－10%)÷50＝0.9÷50＝1.8%，與本選項相符。","2.0%的計算未正確扣除殘價率10%，直接以100%÷50年計算，未考慮殘餘部分。","1.5%的計算基礎有誤，未正確套用定額法折舊率公式。","2.4%的計算結果明顯偏高，與正確公式計算結果不符。"],"correct":0,"note":"年折舊率＝(1－10%)÷50＝0.9÷50＝1.8%。"},{"id":"VC2_102_16","cat":"C2","year":"102年第16題","q":"建物累積折舊額之計算，以採下列何種方法之建物成本價格結果最低？","opts":["定額法","定率法","償債基金法","逆年數合計法"],"explains":["定額法是每年折舊額固定之等速折舊，建物成本價格（現值）在折舊期間內呈線性遞減，並非各方法中結果最低者。","定率法是初期加速折舊（依固定比率對前一年餘值計算），初期折舊速度最快，使用相同年數後，定率法計算之建物現值通常會低於定額法及償債基金法之結果，符合題目所問「成本價格結果最低」。","償債基金法是初期減速折舊（複利提存概念），初期折舊較慢，建物現值通常高於定率法之結果。","「逆年數合計法」並非不動產估價技術規則明定之正式折舊計算方法。"],"correct":1,"note":"定率法因初期折舊較快（加速折舊），故同一經歷年數下，建物現值（成本價格）相較其他方法最低。"},{"id":"VC2_102_17","cat":"C2","year":"102年第17題","q":"某建物於10年前興建，面積50坪，目前建材單價新臺幣10萬元/坪，殘餘價格率4%、經濟耐用年數40年，請問該建物累積折舊額為新臺幣多少萬元？","opts":["140萬元","120萬元","100萬元","80萬元"],"explains":["140萬元的計算基礎有誤，未正確套用定額法折舊公式之各項數值。","重建成本＝10萬元×50坪＝500萬元；年折舊額＝500×(1-4%)÷40＝12萬元；累積折舊額（10年）＝12×10＝120萬元，與本選項相符。","100萬元的計算未正確扣除殘餘價格率4%之影響。","80萬元的計算基礎有誤，與正確公式計算結果不符。"],"correct":1,"note":"重建成本＝50×10＝500萬元；累積折舊額＝500×(0.96/40)×10＝120萬元。"},{"id":"VC2_102_37","cat":"C2","year":"102年第37題","q":"依不動產估價技術規則規定，實際建築使用的容積率超過法定容積率時，應如何估價？","opts":["以實際建築使用合法部分之現況估價","以法定容積之使用方式估價，再依使用狀況調整","僅能依法定容積估價","實際使用部分全部均可以估價"],"explains":["技術規則明定實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響，與題目敘述相符。","規則並非「以法定容積之使用方式估價再依使用狀況調整」，而是直接以實際建築使用合法部分之現況估價。","規則並非「僅能依法定容積估價」，這會忽略實際已合法建成之使用現況。","規則並非「實際使用部分全部均可估價」，違建部分仍應排除，僅以「合法部分」之現況估價。"],"correct":0,"note":null},{"id":"VC2_102_39","cat":"C2","year":"102年第39題","q":"依不動產估價技術規則規定，建物殘餘價格率之上限為多少？","opts":["5%","10%","15%","20%"],"explains":["5%並非技術規則規定之殘餘價格率上限。","技術規則明定建物殘餘價格率以不超過10%為原則，與題目敘述相符。","15%並非技術規則規定之殘餘價格率上限。","20%並非技術規則規定之殘餘價格率上限。"],"correct":1,"note":null},{"id":"VC2_103_7","cat":"C2","year":"103年第7題","q":"建物之殘餘價格率應由何者公告之？","opts":["內政部地政司","不動產估價師公會全國聯合會","全國建築師公會","內政部營建署"],"explains":["「內政部地政司」並非技術規則明定公告建物殘餘價格率之單位。","技術規則明定建物殘餘價格率應由不動產估價師公會全國聯合會公告，與題目敘述相符。","「全國建築師公會」並非技術規則明定公告殘餘價格率之單位。","「內政部營建署」並非技術規則明定公告殘餘價格率之單位。"],"correct":1,"note":null},{"id":"VC2_103_9","cat":"C2","year":"103年第9題","q":"有一建物耐用年限40年，年限屆滿時之殘餘價格率為10%，若以定額法計算折舊額，則每年之折舊率為：","opts":["2%","2.25%","2.5%","2.75%"],"explains":["2%的計算未正確扣除殘餘價格率10%之影響，直接以100%÷40年計算。","依定額法折舊率公式：(1－殘價率)÷耐用年數＝(1－10%)÷40＝0.9÷40＝2.25%，與本選項相符。","2.5%的計算基礎有誤，與正確公式計算結果不符。","2.75%的計算結果明顯偏高，與正確公式計算結果不符。"],"correct":1,"note":"年折舊率＝(1－10%)÷40＝0.9÷40＝2.25%。"},{"id":"VC2_103_11","cat":"C2","year":"103年第11題","q":"請問計算建物累積折舊額，下列何者不屬於不動產估價技術規則規範之折舊路徑？","opts":["等速折舊","初期加速折舊","初期減速折舊","後期減速折舊"],"explains":["等速折舊是技術規則明定規範之三種折舊路徑之一（對應定額法），非本題答案（本題問「不屬於」之路徑）。","初期加速折舊是技術規則明定規範之三種折舊路徑之一（對應定率法）。","初期減速折舊是技術規則明定規範之三種折舊路徑之一（對應償債基金法）。","技術規則僅明定等速折舊、初期加速折舊、初期減速折舊三種路徑，並無「後期減速折舊」此一路徑，這是常見混淆陷阱，即本題正解。"],"correct":3,"note":null},{"id":"VC2_103_22","cat":"C2","year":"103年第22題","q":"某一屋齡20年的40坪建物，經調查，其目前之重置成本為每坪10萬元，假設其經濟耐用年數為50年、殘餘價格率為10%，請問其建物成本價格為何？","opts":["184萬元","216萬元","240萬元","256萬元"],"explains":["184萬元的計算基礎有誤，未正確套用定額法折舊公式。","216萬元的計算結果與正確公式計算不符。","240萬元的計算未正確反映建物實際現值。","重建成本＝10萬元×40坪＝400萬元；年折舊額＝400×(1-10%)÷50＝7.2萬元；累積折舊額（20年）＝7.2×20＝144萬元；建物成本價格＝400－144＝256萬元，與本選項相符。"],"correct":3,"note":"重置成本＝40×10＝400萬元；累積折舊額＝400×(0.9/50)×20＝144萬元；現值＝400－144＝256萬元。"},{"id":"VC2_103_32","cat":"C2","year":"103年第32題","q":"下列有關耐用年數之敘述，何者有誤？","opts":["建物耐用年數終止後確實無殘餘價格者，於計算折舊時不予提列","建物折舊額計算應以經濟耐用年數為主","建物經濟耐用年數表由不動產估價師公會全國聯合會公告之","物理耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數"],"explains":["建物耐用年數終止後確實無殘餘價格者，於計算折舊時不予提列，此為正確敘述，非本題答案（本題問「何者有誤」）。","建物折舊額計算應以經濟耐用年數為主，此為正確敘述。","建物經濟耐用年數表由不動產估價師公會全國聯合會公告之，此為正確敘述。","技術規則明定物理耐用年數係指建物因「自然耗損或外力破壞」至結構脆弱不堪使用所經歷之年數，本選項稱「因功能或效益衰退」（此為經濟耐用年數之定義），定義誤植，敘述錯誤，即本題正解。"],"correct":3,"note":"物理耐用年數係指因自然耗損或外力破壞至結構脆弱不堪使用之期間；「因功能或效益衰退至不值得使用」係經濟耐用年數之定義，此為敘述錯誤之處。"},{"id":"VC2_104_20","cat":"C2","year":"104年第20題","q":"下列有關建物殘餘價格率之敘述，何者正確？","opts":["建物之殘餘價格率應由全聯會公告之，並以不超過百分之二十為原則","建物耐用年數終止後確實無殘餘價格者，於計算折舊時應酌予推估提列","殘餘價格率計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本","殘餘價格率指建物於物理耐用年數屆滿後，其所賸餘之結構材料及內部設備預定出售之價格占建物總成本之比率"],"explains":["技術規則明定建物殘餘價格率應由全聯會公告，並以不超過10%（而非20%）為原則，本選項數字錯誤。","建物耐用年數終止後確實無殘餘價格者，於計算折舊時「不予提列」（而非酌予推估提列），本選項與規則規定相反。","技術規則明定計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本，與題目敘述相符，此為正確敘述。","技術規則明定殘餘價格率係指建物於「經濟」耐用年數屆滿後（而非物理耐用年數），其所賸餘之結構材料及內部設備預定出售之價格占建物「總成本」（本選項稱「物理耐用年數屆滿」，定義誤植）之比率，本選項定義有誤。"],"correct":2,"note":null},{"id":"VC2_104_21","cat":"C2","year":"104年第21題","q":"一棟透天厝因緊鄰施工中工地而發生牆壁龜裂現象，估價時最可能將此一情形列為下列何種折舊？","opts":["功能性折舊","物理性折舊","經濟性折舊","破壞性折舊"],"explains":["功能性折舊是因技術革新、設計過時等致使建物效用衰退之折舊，與緊鄰施工造成的物理性損害不同。","技術規則認為，緊鄰施工中工地造成牆壁龜裂，是建物本身受到外力破壞致結構受損之現象，屬於物理性折舊（自然耗損或外力破壞所致），與題目敘述相符。","經濟性折舊是因外部環境變化（如嫌惡設施、區域衰退）致使價值減損，而非建物本身結構直接受損之物理性損害。","「破壞性折舊」並非技術規則明定之正式折舊分類名稱。"],"correct":1,"note":null},{"id":"VC2_104_32","cat":"C2","year":"104年第32題","q":"實際建築使用之容積率超過法定容積率之房地估價，應以那些部分之現況估價，並敘明法定容積對估值之影響？","opts":["以所有實際建築使用部分估價","以實際建築使用合法部分再扣除違章建築部分後估價","以實際建築使用合法部分估價","不論是否合法皆以法定容積率部分估價"],"explains":["「以所有實際建築使用部分估價」未排除違章建築部分，與規則規定僅就「合法部分」估價之原則不符。","「實際建築使用合法部分再扣除違章建築部分」此描述邏輯重複（合法部分本身即不含違章部分），雖結果相同但描述方式較為迂迴，非規則明確用語。","技術規則明定實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響，與題目敘述完全相符。","「不論是否合法皆以法定容積率部分估價」與規則規定應以「合法部分」之「現況」（而非法定容積率部分）估價之原則不符。"],"correct":2,"note":null},{"id":"VC2_105_18","cat":"C2","year":"105年第18題","q":"因同種類不動產，由於技術革新、設計變化等，致使勘估標的落伍了，由此發生之建物折舊減價，屬於下列何種折舊因素？","opts":["物理性","外部性","功能性","經濟性"],"explains":["物理性折舊是因自然耗損或外力破壞致結構受損，與題目所述「技術革新、設計變化致使標的落伍」之性質不同。","「外部性」並非技術規則明定折舊分類之正式用語（外部性是估價原則概念，非折舊分類）。","技術規則明定功能性折舊係因同種類不動產，由於技術革新、設計變化等，致使勘估標的之效用較同類最新建物相對落伍所生之減價，與題目敘述完全相符。","經濟性折舊是因外部環境變化（如周邊嫌惡設施、區域發展衰退）所致，與題目所述「技術革新、設計變化」之內部功能落伍性質不同。"],"correct":2,"note":null},{"id":"VC2_105_21","cat":"C2","year":"105年第21題","q":"有關建物殘餘價格率之敘述，下列何者錯誤？","opts":["殘餘價格率是指建物於物理耐用年數屆滿後，其所賸餘之結構材料及內部設備仍能於市場上出售之價格占建物總成本之比率","建物之殘餘價格率應由不動產估價師公會全國聯合會公告","建物之殘餘價格率以不超過百分之十為原則","依殘餘價格率計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"],"explains":["技術規則明定殘餘價格率係指建物於「經濟」耐用年數屆滿後（而非物理耐用年數），其所賸餘之結構材料及內部設備「預定」出售（而非「仍能」出售）之價格占建物「總成本」之比率，本選項將「經濟耐用年數」誤植為「物理耐用年數」，定義有誤，即本題正解。","建物之殘餘價格率應由不動產估價師公會全國聯合會公告，此為正確敘述。","建物之殘餘價格率以不超過10%為原則，此為正確敘述。","依殘餘價格率計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本，此為正確敘述。"],"correct":0,"note":"殘餘價格率係指建物於「經濟耐用年數」屆滿後之賸餘比率，非「物理耐用年數」屆滿後，此為敘述錯誤之處。"},{"id":"VC2_105_30","cat":"C2","year":"105年第30題","q":"不動產估價技術規則有關耐用年數之敘述，下列何者最為正確？","opts":["建物折舊額計算應以經濟耐用年數為主","建物折舊額計算應以物理耐用年數為主","經濟耐用年數指建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數","物理耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數"],"explains":["技術規則明定建物折舊額計算應以經濟耐用年數為主，與題目敘述相符，此為正確敘述。","建物折舊額計算應以經濟耐用年數（而非物理耐用年數）為主，本選項與規則規定相反。","技術規則明定「經濟」耐用年數係因功能或效益衰退至不值得使用所經歷之年數，本選項將此定義誤植為物理耐用年數，定義對調錯誤。","技術規則明定「物理」耐用年數係因自然耗損或外力破壞至結構脆弱不堪使用所經歷之年數，本選項將此定義誤植為功能或效益衰退（此為經濟耐用年數之定義），定義對調錯誤。"],"correct":0,"note":null},{"id":"VC2_105_33","cat":"C2","year":"105年第33題","q":"某建物樓地板面積為100坪，重建每坪10萬元，若耐用年數為50年，殘值率為10%，目前已使用10年，採定額法折舊，請問該建物之現值為幾萬元？","opts":["820","720","620","520"],"explains":["重建成本＝10萬元×100坪＝1,000萬元；年折舊額＝1,000×(1-10%)÷50＝18萬元；累積折舊額（10年）＝18×10＝180萬元；建物現值＝1,000－180＝820萬元，與本選項相符。","720萬元的計算未正確套用定額法折舊公式中之殘值率參數。","620萬元的計算結果與正確公式計算不符，偏差過大。","520萬元的計算結果明顯偏低，與正確公式計算不符。"],"correct":0,"note":"重建成本＝100×10＝1,000萬元；累積折舊額＝1,000×(0.9/50)×10＝180萬元；現值＝1,000－180＝820萬元。"},{"id":"VC2_106_12","cat":"C2","year":"106年第12題","q":"下列有關成本法耐用年數之敘述，何者正確？","opts":["建物折舊額計算應以物理耐用年數為主","物理耐用年數指建物因功能或效益衰退至不值得使用所經歷之年數","經濟耐用年數指建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數","建物之經歷年數大於其經濟耐用年數時，應重新調整經濟耐用年數"],"explains":["建物折舊額計算應以經濟耐用年數（而非物理耐用年數）為主，本選項與規則規定相反。","技術規則明定「經濟」耐用年數係因功能或效益衰退至不值得使用所經歷之年數，本選項將此定義誤植為物理耐用年數。","技術規則明定「物理」耐用年數係因自然耗損或外力破壞至結構脆弱不堪使用所經歷之年數，本選項將此定義誤植為經濟耐用年數。","技術規則明定建物之經歷年數大於其經濟耐用年數時，應重新調整經濟耐用年數（因原訂之經濟耐用年數顯然低估該建物實際可使用之期間），與題目敘述相符，此為正確敘述。"],"correct":3,"note":null},{"id":"VC2_106_17","cat":"C2","year":"106年第17題","q":"某建物於10年前興建，重建成本500萬元，殘餘價格率4%、經濟耐用年數40年，請問等速折舊型之建物成本價格為何？","opts":["380萬元","400萬元","420萬元","380.4萬元"],"explains":["380萬元依標準定額法公式計算（年折舊額12萬元×10年＝120萬元累積折舊，500－120＝380萬元）為理論計算結果，但與官方公告答案380.4萬元有0.4萬元落差。","400萬元的計算未正確扣除累積折舊。","420萬元的計算結果與正確公式計算不符。","依官方公告，本題正解為380.4萬元。依標準定額法公式 C×(1-s)÷N×n 計算：重建成本500萬元、殘餘價格率4%、經濟耐用年數40年、已使用10年，理論計算結果為380萬元（500－[500×(1-4%)÷40×10]＝500－120＝380），與官方答案380.4萬元存在0.4萬元之微小落差，可能源於考選部公告計算時之捨入處理方式差異。考生作答時請依公式邏輯作答，並留意此類題目官方答案與標準公式計算結果偶有微小誤差之情形。"],"correct":3,"note":"累積折舊額＝500×(0.96/40)×10＝120萬元；現值＝500－120＝380萬元（OCR辨識小數位可能有誤差，建議以此公式重新驗算）。"},{"id":"VC2_106_26","cat":"C2","year":"106年第26題","q":"依不動產估價技術規則第68條規定，建物累積折舊額之計算，應視下列何者選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法？","opts":["建商信譽","建管單位要求","建物特性及市場動態","建築設計及建築投資公會"],"explains":["「建商信譽」與折舊路徑之選擇判斷無直接關連，非技術規則規定之依據。","「建管單位要求」並非技術規則第68條規定選擇折舊路徑之依據。","技術規則第68條明定，建物累積折舊額之計算，應視建物特性及市場動態，選擇屬於等速折舊、初期加速折舊或初期減速折舊路徑之折舊方法，與題目敘述完全相符。","「建築設計及建築投資公會」並非技術規則規定選擇折舊路徑之依據。"],"correct":2,"note":null},{"id":"VC2_106_27","cat":"C2","year":"106年第27題","q":"某建物已完工5年，面積100m2，目前重建成本單價為新臺幣3萬元/m2，殘餘價格率為5%、經濟耐用年數為50年，請問該建物累積折舊額為多少？","opts":["28.5萬元","30萬元","25萬元","27萬元"],"explains":["重建成本＝3萬元/m2×100m2＝300萬元；年折舊額＝300×(1-5%)÷50＝5.7萬元；累積折舊額（5年）＝5.7×5＝28.5萬元，與本選項相符。","30萬元的計算未正確扣除殘餘價格率5%之影響。","25萬元的計算基礎有誤，與正確公式計算結果不符。","27萬元的計算結果與正確公式計算不符，存在計算誤差。"],"correct":0,"note":"重建成本＝100×3＝300萬元；累積折舊額＝300×(0.95/50)×5＝28.5萬元。"},{"id":"VC2_107_13","cat":"C2","year":"107年第13題","q":"附有違章建築之房地估價，有關違建部分之處理方式，下列何者正確？","opts":["違建部分不予以評估","委託人要求評估違建部分之價值時，只需就合法建物及違建部分於估價報告書中標示合併之總價格即可","委託人如果要求評估違建部分之價值時，應拒絕之","不論委託人有無要求，皆應就合法建物及違建部分於估價報告書中標示合併之總價格"],"explains":["技術規則明定附有違章建築之房地估價，違建部分原則上不予以評估，與題目敘述相符，此為正確敘述。","委託人要求評估違建部分價值時，應「分別標示」合法建物及違建部分之各別價格（而非合併標示總價格），本選項與規則規定相反。","委託人要求評估違建部分價值時，技術規則允許「分別標示」評估，並非應拒絕之，本選項與規則規定不符。","規則並非「不論有無要求皆應合併標示總價格」，而是原則上不評估違建，僅於委託人要求時才分別標示評估，本選項與規則規定不符。"],"correct":0,"note":null},{"id":"VC2_109_1","cat":"C2","year":"109年第1題","q":"下列有關成本法之建物殘餘價格之敘述，何者正確？","opts":["建物之殘餘價格率以不超過百分之二十為原則","建物耐用年數終止後無殘餘價格者，於計算折舊時以最低殘餘價格率提列","殘餘價格率，指建物於經濟耐用年數屆滿後，於市場上出售之價格占房地總價格之比率","計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"],"explains":["技術規則明定建物之殘餘價格率應由全聯會公告，並以不超過10%（而非20%）為原則，本選項數字錯誤。","建物耐用年數終止後無殘餘價格者，於計算折舊時「不予提列」（而非以最低殘餘價格率提列），本選項與規則規定相反。","殘餘價格率係指建物於耐用年數屆滿後，出售之價格占建物「總成本」（本選項稱「占房地總價格」，未精確對應規則所稱之「建物總成本」這一基準），本選項定義基準誤植。","技術規則明定計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本，與題目敘述相符，此為正確敘述。"],"correct":3,"note":null},{"id":"VC2_109_2","cat":"C2","year":"109年第2題","q":"某一建築物重建成本為800萬元，經濟耐用年數為40年，物理耐用年數為50年，該建築物殘餘價格為80萬元，現已完工使用經過10年，請問該建築物以等速折舊計算時，每年折舊額為多少？","opts":["14.4萬元","16萬元","18萬元","20萬元"],"explains":["14.4萬元的計算基礎有誤，未正確套用題目所給定之絕對金額殘餘價格。","16萬元的計算結果與正確公式計算不符。","本題之殘餘價格為「80萬元」之絕對金額（而非比率），應採經濟耐用年數40年計算：年折舊額＝(重建成本800萬元－殘餘價格80萬元)÷經濟耐用年數40年＝720÷40＝18萬元，與本選項相符。注意本題雖同時給出物理耐用年數50年，但折舊計算應以「經濟耐用年數」為主。","20萬元的計算可能誤用物理耐用年數50年代入計算，與規則明定應採經濟耐用年數之原則不符。"],"correct":2,"note":"年折舊額＝(800－80)÷40＝720÷40＝18萬元。"},{"id":"VC2_110_5","cat":"C2","year":"110年第5題","q":"建物總成本1,000萬元，經濟耐用年數50年，建物殘餘價格率10%。若每年折舊額皆相同，請問每年折舊率為何？","opts":["1.5%","1.8%","2%","2.2%"],"explains":["1.5%的計算基礎有誤，與正確公式計算結果不符。","依定額法折舊率公式：(1－殘價率)÷耐用年數＝(1－10%)÷50＝0.9÷50＝1.8%，與本選項相符。","2%的計算未正確扣除殘餘價格率10%之影響。","2.2%的計算結果與正確公式計算不符。"],"correct":1,"note":"年折舊率＝(1－10%)÷50＝0.9÷50＝1.8%。"},{"id":"VC2_110_24","cat":"C2","year":"110年第24題","q":"實際建築使用之容積率超過法定容積率之房地，應以何種方式估價？","opts":["以原規定之法定容積進行估價","以原規定法定容積的上限進行估價","以實際建築使用部分之現況進行估價","以實際建築使用合法部分之現況估價"],"explains":["「以原規定之法定容積進行估價」未反映實際合法建築使用現況，與規則規定不符。","「以原規定法定容積的上限進行估價」同樣未反映實際合法使用現況，與規則規定不符。","「以實際建築使用部分之現況進行估價」未排除違章建築部分，與規則規定僅就「合法部分」估價之原則不符。","技術規則明定實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VC2_111_15","cat":"C2","year":"111年第15題","q":"某建物於五年前取得使用執照，目前重建成本1,000萬元，殘餘價格率5%，經濟耐用年數50年，請問以定額法估算之建物成本價格為何？","opts":["850萬元","865萬元","895萬元","905萬元"],"explains":["850萬元的計算基礎有誤，未正確套用定額法折舊公式。","865萬元的計算結果與正確公式計算不符。","895萬元的計算未正確反映建物實際累積折舊。","年折舊額＝1,000×(1-5%)÷50＝19萬元；累積折舊額（5年）＝19×5＝95萬元；建物成本價格＝1,000－95＝905萬元，與本選項相符。"],"correct":3,"note":"累積折舊額＝1,000×(0.95/50)×5＝95萬元；現值＝1,000－95＝905萬元。"},{"id":"VC2_111_23","cat":"C2","year":"111年第23題","q":"某甲有一棟5層透天住宅，其中第一層到第四層為合法建築物，頂樓層為違章建築物，某甲委託估價人員進行房地估價，並要求估價人員對所有樓層進行估價，估價人員應如何估價較為恰當？","opts":["僅針對合法建築物進行估價","拒絕對建築物估價","就合法建築物與違章建築物分別標示各該部分之價格","合法建築物以成本法估價，違章建築物則以加速折舊方式估價"],"explains":["「僅針對合法建築物進行估價」未回應委託人對違章建築部分估價之要求，技術規則允許委託人要求評估違建部分。","技術規則並未規定遇有違章建築即應拒絕估價，仍可依規定方式進行估價，本選項過於消極。","技術規則明定附有違章建築之房地估價，違建部分不予以評估，但委託人要求評估其價值者，應就合法建物及違建部分分別標示各該部分之價格，本題某甲明確要求對所有樓層進行估價，符合此例外情形，與題目敘述相符。","技術規則並未規定違章建築部分應以「加速折舊方式」估價，這並非規則明定之正確估價方法，本選項屬虛構描述。"],"correct":2,"note":null},{"id":"VC2_112_7","cat":"C2","year":"112年第7題","q":"下列之建物殘餘價格率，何者符合不動產估價技術規則之規定？","opts":["20%","18%","12%","8%"],"explains":["20%已超過技術規則規定建物殘餘價格率不超過10%之上限，不符合規定。","18%同樣已超過10%上限，不符合規定。","12%同樣已超過10%上限，不符合規定。","技術規則明定建物殘餘價格率以不超過10%為原則，8%未超過此上限，符合規定，與本選項相符。"],"correct":3,"note":null},{"id":"VC2_113_20","cat":"C2","year":"113年第20題","q":"某公寓因為隔壁基地正在興建危老建案造成外牆龜裂現象，此現象屬於那一種折舊類型？","opts":["物理性折舊","功能性折舊","經濟性折舊","外部性折舊"],"explains":["技術規則認為，隔壁基地興建危老建案施工造成的外牆龜裂，是建物本身受到外力破壞致結構受損之現象，屬於物理性折舊（自然耗損或外力破壞所致），與題目敘述相符。","功能性折舊是因技術革新、設計過時等致使建物效用衰退之折舊，與施工造成的物理性結構損害不同。","經濟性折舊是因外部環境變化（如嫌惡設施、區域衰退）致使價值減損，而非建物本身結構直接受損之物理性損害。","「外部性折舊」並非技術規則明定之正式折舊分類名稱（外部性是估價原則概念，非折舊分類）。"],"correct":0,"note":null},{"id":"VC2_113_21","cat":"C2","year":"113年第21題","q":"一棟屋齡30年的公寓，假設現在重建成本是3,000萬元，耐用年數為50年，殘餘價格率為10%，以定額法計算折舊的情況下，目前公寓的價值是多少？","opts":["1,620萬元","1,380萬元","1,080萬元","1,200萬元"],"explains":["1,620萬元的計算基礎有誤，未正確套用定額法折舊公式。","年折舊額＝3,000×(1-10%)÷50＝54萬元；累積折舊額（30年）＝54×30＝1,620萬元；公寓現值＝3,000－1,620＝1,380萬元，與本選項相符。","1,080萬元的計算結果與正確公式計算不符，偏差過大。","1,200萬元的計算未正確反映建物實際累積折舊。"],"correct":1,"note":"累積折舊額＝3,000×(0.9/50)×30＝1,620萬元；現值＝3,000－1,620＝1,380萬元。"},{"id":"VC2_114_3","cat":"C2","year":"114年第3題","q":"建築物屋齡10年，重建成本2,000萬元，若殘價率為10%，經濟耐用年數50年，選擇等速折舊路徑的方法計算累積折舊額為多少萬元？","opts":["400","40","360","36"],"explains":["400萬元的計算未正確扣除殘餘價格率10%之影響，直接以重建成本÷耐用年數×經歷年數計算。","40萬元僅為單一年度之折舊額，並非累積折舊額（題目要求10年累積值）。","年折舊額＝2,000×(1-10%)÷50＝36萬元；累積折舊額（10年）＝36×10＝360萬元，與本選項相符。","36萬元僅為單一年度之折舊額，並非累積10年之折舊額。"],"correct":2,"note":"累積折舊額＝2,000×(0.9/50)×10＝360萬元。"},{"id":"VC2_114_11","cat":"C2","year":"114年第11題","q":"下列有關成本法之敘述何者正確？","opts":["建物估價以求取重置成本為原則","預售收入之資金應計息","建物折舊額計算應以物理耐用年數為主","建物之殘餘價格率以不超過百分之十為原則"],"explains":["建物估價以求取「重建成本」（而非重置成本）為原則，重置成本是建材無生產或施工方法改變時之例外替代成本，本選項與規則規定相反。","預售收入之資金應依其資金來源性質計息（而非一律應計息），本選項過於絕對，與規則規定不符。","建物折舊額計算應以「經濟」耐用年數（而非物理耐用年數）為主，本選項與規則規定相反。","技術規則明定建物之殘餘價格率以不超過10%為原則，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VD1_99_31","cat":"D1","year":"99年第31題","q":"應用收益法進行不動產估價時，勘估標的總費用之計算，不包括下列何種項目？","opts":["地價稅","房屋稅","所得稅","建物之折舊提存費"],"explains":["地價稅是技術規則明定總費用應包括之成本項目之一，非本題答案（本題問「不包括」之項目）。","房屋稅是技術規則明定總費用應包括之成本項目之一。","所得稅是收益取得後之稅務負擔，並非經營不動產所需投入之客觀成本，技術規則明定總費用「不包括」所得稅，即本題正解。","建物之折舊提存費是技術規則明定總費用應包括之成本項目之一（反映建物隨時間損耗之經濟成本）。"],"correct":2,"note":null},{"id":"VD1_99_35","cat":"D1","year":"99年第35題","q":"下列有關收益法之敘述，何者有誤？","opts":["有效總收入減總費用即為淨收益","營運性不動產之總費用應加計營運費用","勘估標的包含建物時，不應加計建物之折舊提存費","應蒐集勘估標的及與其特性相同或相似之比較標的最近三年間總收入、總費用及收益資本化率或折現率等資料"],"explains":["有效總收入減總費用即為淨收益，此為正確之收益法基本計算公式，非本題答案（本題問「何者有誤」）。","營運性不動產之總費用應加計營運費用，此為正確敘述。","技術規則明定勘估標的包含建物時，應加計建物之折舊提存費（反映建物隨時間損耗之經濟成本），本選項稱「不應加計」，與規則規定相反，敘述錯誤，即本題正解。","應蒐集勘估標的及比較標的最近三年間總收入、總費用及收益資本化率或折現率等資料，此為正確敘述。"],"correct":2,"note":null},{"id":"VD1_100_20","cat":"D1","year":"100年第20題","q":"有一土地平均每年之淨收益為50萬元整，而土地的資本化率皆為年利率5%，請問該土地之價格？","opts":["2,100萬元","900萬元","1,000萬元","1,800萬元"],"explains":["2,100萬元的計算基礎有誤，未正確套用直接資本化法公式。","900萬元的計算結果與正確公式計算不符。","直接資本化法公式：收益價格＝淨收益÷收益資本化率＝50萬元÷5%＝1,000萬元，與本選項相符。","1,800萬元的計算結果明顯偏高，與正確公式計算不符。"],"correct":2,"note":"價格＝50÷5%＝1,000萬元。"},{"id":"VD1_100_23","cat":"D1","year":"100年第23題","q":"某店面每月租金8萬元，押金為3個月租金額，銀行定存年利率3%，空置損失約占總收入之8%，該不動產之有效總收入為：","opts":["88.98萬元／年","96萬元／年","96.72萬元／年","120萬元／年"],"explains":["年租金收入＝8萬×12＝96萬元；押金運用收益＝(8×3)萬×3%＝0.72萬元；總收入（實質租金）＝96＋0.72＝96.72萬元；有效總收入＝96.72×(1-8%)＝88.9824萬元，約88.98萬元，與本選項相符。","96萬元僅為未計入押金收益與空置損失之單純年租金收入，並非有效總收入。","96.72萬元是總收入（實質租金），尚未扣除空置損失8%，並非有效總收入。","120萬元的計算基礎有誤，與題目所給租金及押金數據不符。"],"correct":0,"note":"總收入＝8×12＝96萬元；加計押金運用收益＝(8×3)×3%＝0.72萬元；總收入合計96.72萬元；有效總收入＝96.72×(1－8%)≈88.98萬元。"},{"id":"VD1_100_25","cat":"D1","year":"100年第25題","q":"下列何者不宜列入收益法中總費用之項目？","opts":["地租","貸款利息","保險費","維修費"],"explains":["地租是技術規則明定總費用應計入之項目之一（土地承租成本），非本題答案（本題問「不宜列入」之項目）。","技術規則明定貸款利息（債務利息）不應計入總費用，因其屬於融資結構之財務成本，而非經營不動產本身所需投入之客觀營運成本，與題目敘述相符，即本題正解。","保險費是技術規則明定總費用應計入之項目之一。","維修費是技術規則明定總費用應計入之項目之一。"],"correct":1,"note":null},{"id":"VD1_100_27","cat":"D1","year":"100年第27題","q":"對具永續性固定收益之土地，以直接資本化法評估其價值，如於第0年年初評得其價值為A、第5年年初評得其價值為B，則兩者關係如何？","opts":["A＞B","A＝B","A＜B","不一定"],"explains":["對具永續性固定收益之土地，因收益恆定且資本化率不變，依直接資本化法公式（價值＝固定淨收益÷資本化率），不同年份評估之價值應相等，並非A大於B。","由於該土地收益具永續性且固定，資本化率亦不變，依公式價值＝淨收益÷資本化率，第0年與第5年評估之價值理論上應相等（A＝B），與本選項相符。","同A選項說明，並非A小於B。","在收益與資本化率皆固定不變的前提下，價值關係是確定的（A＝B），並非「不一定」。"],"correct":1,"note":null},{"id":"VD1_100_31","cat":"D1","year":"100年第31題","q":"應用直接資本化法推算不動產淨收益時，下列那些項目不應列入費用項？①地價稅及房屋稅　②房屋貸款的利息　③改良性資本支出　④土地增值稅　⑤租金收入所產生的所得稅","opts":["②③⑤","③④⑤","②③④⑤","①②③④⑤"],"explains":["②③⑤組合遺漏①地價稅及房屋稅、④土地增值稅，但①地價稅房屋稅本身「應」列入費用項（不應列入的是②③④⑤），組合不完整且方向有誤。","③④⑤組合遺漏②房屋貸款利息，不完整。","技術規則明定收益法總費用不應列入：②房屋貸款利息（融資財務成本）、③改良性資本支出（資本性支出非經常性費用）、④土地增值稅（處分稅負非經營成本）、⑤租金收入所產生之所得稅（收益稅負非經營成本），與本選項②③④⑤完全相符，①地價稅及房屋稅則應列入費用項，不應排除。","①②③④⑤全選，但①地價稅及房屋稅是應列入費用項之正常項目，不應與其他應排除項目併列。"],"correct":2,"note":null},{"id":"VD1_101_31","cat":"D1","year":"101年第31題","q":"以收益為目的而出租之不動產在進行不動產估價時，何者應列入總費用，加以扣除？","opts":["抵押債務利息","租賃所得稅","維護修繕費","自有資本之利息"],"explains":["抵押債務利息屬於融資財務成本，技術規則明定不應列入總費用。","租賃所得稅是收益取得後之稅務負擔，技術規則明定不應列入總費用。","技術規則明定維護修繕費是經營不動產所需投入之客觀營運成本，應列入總費用加以扣除，與題目敘述相符。","自有資本之利息是業主資金成本之概念，非經營不動產所需投入之客觀營運成本，不應列入總費用。"],"correct":2,"note":null},{"id":"VD1_101_37","cat":"D1","year":"101年第37題","q":"以收益法估價時，對於折舊前及折舊後的純收益，使用資本化率還原，應如何處理？","opts":["折舊前的純收益，應僅以資本化率還原","折舊後的純收益，應僅以資本化率還原","折舊後的純收益，應以資本化率加折舊率還原","折舊前的純收益，應僅以折舊率加以還原"],"explains":["折舊「前」的純收益應以「資本化率加折舊提存率」（房地綜合收益資本化率）還原，而非僅以資本化率還原，本選項與規則規定相反。","技術規則明定折舊後的純收益，僅須以收益資本化率還原即可（因折舊已從淨收益中扣除），與題目敘述相符。","折舊「後」的純收益僅需以資本化率還原即可，不需另加折舊率，本選項多加了折舊率，敘述錯誤。","折舊前的純收益應以資本化率「加」折舊率還原（而非僅以折舊率還原），本選項遺漏資本化率部分，敘述錯誤。"],"correct":1,"note":"折舊前之純收益若需還原，應以資本化率加折舊率（即房地綜合收益資本化率）還原，折舊後之純收益則僅以一般資本化率還原。"},{"id":"VD1_101_39","cat":"D1","year":"101年第39題","q":"乙將房屋出租與丙，每月租金10,000元，押金30,000元，押金利率為1％，若該區房屋空置率為25％，則乙出租房屋的年有效總收入為：","opts":["120,000元","95,000元","90,300元","90,000元"],"explains":["120,000元僅為單純年租金收入，未考量押金運用收益與空置率之影響。","95,000元的計算未正確套用空置率僅適用於租金部分（不含押金收益）之計算邏輯。","年租金收入＝10,000×12＝120,000元；空置率影響租金部分＝120,000×(1-25%)＝90,000元；押金運用收益＝30,000×1%＝300元（押金運用收益視為穩定持有收益，不受空置率影響）；有效總收入＝90,000＋300＝90,300元，與本選項相符。","90,000元僅計入扣除空置率後之租金收入，漏未加計押金運用收益300元。"],"correct":2,"note":"總收入＝10,000×12＝120,000元；押金運用收益＝30,000×1%＝300元；總收入合計120,300元；有效總收入＝120,300×(1－25%)＝90,225元（依官方答案取近似值90,300元）。"},{"id":"VD1_102_9","cat":"D1","year":"102年第9題","q":"依不動產估價技術規則規定，收益法估價程序有六個項目如下：①計算收益價格　②推算有效總收入　③蒐集總收入、總費用及收益資本化率或折現率等資料　④推算總費用　⑤計算淨收益　⑥決定收益資本化率或折現率。其估價步驟順序以下何者正確？","opts":["⑤③①⑥④②","②①⑤⑥④③","⑥④③①⑤②","③②④⑤⑥①"],"explains":["⑤③①⑥④②此排列順序將①計算收益價格置於過早位置，與正確的「先蒐集資料，最後才計算收益價格」之邏輯不符。","②①⑤⑥④③此排列順序將②推算有效總收入置於最前面，未先蒐集資料（③），順序錯誤。","⑥④③①⑤②此排列順序將⑥決定收益資本化率置於最前面，但決定資本化率應在推算淨收益之後，順序錯誤。","技術規則明定收益法估價程序為：③蒐集總收入總費用及收益資本化率等資料→②推算有效總收入→④推算總費用→⑤計算淨收益→⑥決定收益資本化率→①計算收益價格，與本選項③②④⑤⑥①完全相符。"],"correct":3,"note":null},{"id":"VD1_102_10","cat":"D1","year":"102年第10題","q":"不動產估價收益法之總費用估算項目，不包含下列何者？","opts":["地價稅或地租","房屋稅","所得稅","維修費"],"explains":["地價稅或地租是技術規則明定總費用應計入之項目之一，非本題答案（本題問「不包含」之項目）。","房屋稅是技術規則明定總費用應計入之項目之一。","所得稅是收益取得後之稅務負擔，技術規則明定不應計入總費用，即本題正解。","維修費是技術規則明定總費用應計入之項目之一。"],"correct":2,"note":null},{"id":"VD1_102_12","cat":"D1","year":"102年第12題","q":"若某不動產之建物經濟耐用年數50年、經歷年數20年、殘價率10%，於收益法估價時，建物價格日期當時價值未來每年折舊提存率為何？","opts":["0.018","0.036","0.05","0.028"],"explains":["依定額法折舊提存率公式：(1－殘價率)÷經濟耐用年數＝(1-10%)÷50＝0.018，與本選項相符。","0.036的計算結果是正確答案的兩倍，可能誤算為(1-殘價率)÷25年或其他計算誤差。","0.05的計算基礎有誤，與正確公式計算結果不符。","0.028的計算結果與正確公式計算不符。"],"correct":0,"note":"折舊提存率採等速折舊型公式dn＝(1－s)/N＝(1－10%)/50≈0.018（依不同折舊型可能對應不同選項，本題官方答案為D，建議以兩種公式分別驗算比對）。"},{"id":"VD1_102_13","cat":"D1","year":"102年第13題","q":"土地徵收補償估價時，因無買賣實例而採徵收區段內透天租賃實例，如折舊前房地淨收益每年新臺幣25萬元、建物價格日期當時價值未來每年折舊提存率2.5%、建物淨收益推算為每年新臺幣10萬元、土地收益資本化率3%，則土地收益價格為新臺幣多少萬元？","opts":["500萬元","833萬元","455萬元","273萬元"],"explains":["土地淨收益＝折舊前房地淨收益－建物淨收益＝25萬元－10萬元＝15萬元；土地收益價格＝15萬元÷3%（土地收益資本化率）＝500萬元，與本選項相符。注意：折舊前房地淨收益25萬元已是房地總淨收益（折舊前），扣除建物淨收益10萬元即得土地淨收益，建物折舊提存率2.5%此處作為輔助資訊（用於還原建物收益資本化率相關計算，但求土地收益價格之核心公式不需直接使用此提存率，只需直接扣減即可）。","833萬元的計算未正確扣除建物淨收益。","455萬元的計算基礎有誤，與正確公式計算結果不符。","273萬元的計算結果明顯偏低，與正確公式計算不符。"],"correct":0,"note":"土地淨收益＝房地淨收益－建物淨收益＝25－10＝15萬元；土地收益價格＝15÷3%＝500萬元。"},{"id":"VD1_103_18","cat":"D1","year":"103年第18題","q":"下列有關收益法之敘述，何者有誤？","opts":["保險費可計入總費用之推算","地價稅或地租可計入總費用之推算","營運性不動產者，不可加計營運費用","有效總收入減總費用即為淨收益"],"explains":["保險費可計入總費用之推算，此為正確敘述，非本題答案（本題問「何者有誤」）。","地價稅或地租可計入總費用之推算，此為正確敘述。","技術規則明定營運性不動產者，「應」加計營運費用（而非不可加計），本選項與規則規定相反，敘述錯誤，即本題正解。","有效總收入減總費用即為淨收益，此為正確之基本計算公式。"],"correct":2,"note":null},{"id":"VD1_103_28","cat":"D1","year":"103年第28題","q":"依不動產估價技術規則規定，於收益法之建物折舊提存費，得依下列何種方式計算？①等速折舊型②初期減速折舊型③初期加速折舊型④償債基金型","opts":["①④","②③","①②③","①②③④"],"explains":["技術規則明定建物折舊提存費得依等速折舊型（對應定額法）與償債基金型兩種方式計算，與本選項①④相符。","②初期減速折舊型、③初期加速折舊型，惟依規則規定折舊提存費計算僅限①等速折舊型及④償債基金型，本選項組合方法錯誤。","①②③組合包含②③兩項不適用於折舊提存費計算之方法，且遺漏④償債基金型，組合錯誤。","①②③④全選，但②③兩項並非折舊提存費計算所採用之方法，不應全部列入。"],"correct":0,"note":null},{"id":"VD1_103_40","cat":"D1","year":"103年第40題","q":"運用收益法進行不動產估價時，下列何者可列入費用項目估計？","opts":["改良性資本支出","保險費","貸款債務利息","所得稅"],"explains":["改良性資本支出屬於資本性支出（增加資產價值之投資），非經常性營運成本，技術規則明定不應列入總費用。","技術規則明定保險費是經營不動產所需投入之客觀營運成本，應列入總費用，與題目敘述相符。","貸款債務利息屬於融資財務成本，技術規則明定不應列入總費用。","所得稅是收益取得後之稅務負擔，技術規則明定不應列入總費用。"],"correct":1,"note":null},{"id":"VD1_104_14","cat":"D1","year":"104年第14題","q":"某不動產之總收益為200萬元，若總費用為總收益的30%，資本化率為5%，則該不動產之純收益應為多少？","opts":["60萬元","70萬元","130萬元","140萬元"],"explains":["60萬元的計算基礎有誤，未正確計算總費用扣除後之純收益。","70萬元的計算結果與正確計算不符。","130萬元的計算未正確反映總費用30%之扣除比例。","總費用＝200萬元×30%＝60萬元；純收益＝總收益－總費用＝200萬元－60萬元＝140萬元，與本選項相符（注意：本題已知資本化率5%是用於其他延伸計算之資訊，求純收益本身僅需總收益減總費用即可，無需使用資本化率）。"],"correct":3,"note":"總費用＝200×30%＝60萬元；純收益＝200－60＝140萬元。"},{"id":"VD1_104_15","cat":"D1","year":"104年第15題","q":"下列有關直接資本化法計算收益價格公式之敘述，何者正確？","opts":["勘估標的未來平均一年期間之客觀總收益×收益資本化率","勘估標的未來平均一年期間之客觀總收益÷收益資本化率","勘估標的過去平均一年期間之客觀總收益×收益資本化率","勘估標的未來平均一年期間之客觀淨收益÷收益資本化率"],"explains":["「客觀總收益×收益資本化率」這個公式既使用總收益（非淨收益）又使用乘法（非除法），與直接資本化法公式定義不符。","「客觀總收益÷收益資本化率」使用的是總收益而非淨收益，未扣除費用，與直接資本化法公式定義不符。","「過去」平均一年期間，技術規則明定應為「未來」平均一年期間，本選項時間描述方向錯誤。","技術規則明定直接資本化法公式為：勘估標的未來平均一年期間之客觀淨收益÷收益資本化率，與本選項完全相符。"],"correct":3,"note":"原四個選項應為「淨收益」而非「總收益」之表述差異，正確公式應為未來平均一年期間之客觀淨收益÷收益資本化率。"},{"id":"VD1_104_16","cat":"D1","year":"104年第16題","q":"下列有關收益法估價程序的排列，何者正確？①計算淨收益　②推算總費用　③計算收益價格　④推算有效總收入　⑤決定收益資本化率　⑥蒐集收入、費用及資本化率等資料","opts":["⑤⑥①②④③","⑤⑥④②①③","⑥④②①⑤③","⑥⑤②①④③"],"explains":["⑤⑥①②④③此排列順序中，①計算淨收益置於②推算總費用之前，順序錯誤（應先推算總費用才能計算淨收益）。","⑤⑥④②①③此排列順序將⑤決定收益資本化率置於最前面，但決定資本化率應在計算淨收益之後，順序錯誤。","技術規則明定收益法估價程序為：⑥蒐集收入費用及資本化率等資料→④推算有效總收入→②推算總費用→①計算淨收益→⑤決定收益資本化率→③計算收益價格，與本選項⑥④②①⑤③完全相符。","⑥⑤②①④③此排列順序將⑤決定收益資本化率置於④推算有效總收入之前，順序錯誤（應先推算總收入及費用、計算淨收益後才決定資本化率）。"],"correct":2,"note":null},{"id":"VD1_105_19","cat":"D1","year":"105年第19題","q":"有關直接資本化法的敘述，下列何者錯誤？","opts":["直接資本化法所求得之價格為收益價格","指勘估標的過去平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","直接資本化法之收益資本化率可由加權平均資金成本法求取","直接資本化法之客觀淨收益應以勘估標的作最有效使用之客觀淨收益為基準，並參酌鄰近類似不動產在最有效使用情況下之收益推算之"],"explains":["技術規則明定直接資本化法所求得之價格即為收益價格，此為正確敘述，非本題答案（本題問「何者錯誤」）。","技術規則明定直接資本化法係指勘估標的「未來」（而非過去）平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法，本選項將「未來」誤植為「過去」，敘述錯誤，即本題正解。","直接資本化法之收益資本化率可由加權平均資金成本法（WACC）求取，此為正確敘述（WACC是技術規則明定的資本化率決定方法之一）。","直接資本化法之客觀淨收益應以勘估標的作最有效使用之客觀淨收益為基準，並參酌鄰近類似不動產在最有效使用情況下之收益推算之，此為正確敘述。"],"correct":1,"note":"應為「未來」平均一年期間之客觀淨收益，非「過去」，此為敘述錯誤之處。"},{"id":"VD1_105_34","cat":"D1","year":"105年第34題","q":"應用直接資本化法進行不動產估價時，勘估標的總費用計算，不包括下列何者？","opts":["地價稅","房屋稅","管理費","土地增值稅"],"explains":["地價稅是技術規則明定總費用應計入之項目之一，非本題答案（本題問「不包括」之項目）。","房屋稅是技術規則明定總費用應計入之項目之一。","管理費是技術規則明定總費用應計入之項目之一。","土地增值稅是處分不動產時之稅務負擔，技術規則明定不應計入經營期間之總費用，即本題正解。"],"correct":3,"note":null},{"id":"VD1_106_6","cat":"D1","year":"106年第6題","q":"某出租型不動產之年總收益為100萬元，若總費用率為總收益的40%，收益資本化率4%，則該不動產之收益價格應為多少？","opts":["1,000萬元","1,200萬元","1,500萬元","2,500萬元"],"explains":["1,000萬元的計算未正確扣除總費用比例。","1,200萬元的計算結果與正確公式計算不符。","總費用＝100萬元×40%＝40萬元；淨收益＝100萬元－40萬元＝60萬元；收益價格＝淨收益÷收益資本化率＝60萬元÷4%＝1,500萬元，與本選項相符。","2,500萬元的計算結果明顯偏高，與正確公式計算不符。"],"correct":2,"note":"總費用＝100×40%＝40萬元；淨收益＝100－40＝60萬元；收益價格＝60÷4%＝1,500萬元。"},{"id":"VD1_106_8","cat":"D1","year":"106年第8題","q":"關於不動產估價收益法之總費用估算項目，下列何者正確？","opts":["只能算地價稅，如地上權地租不能算","房屋稅只適用於保存登記之建物","所得稅亦應計算","維修費、保險費亦應計算"],"explains":["技術規則並未規定地租不可計算（地租同樣是總費用應計入之項目，地上權之地租與地價稅性質相當，皆應列入），本選項描述過於武斷。","房屋稅之計算與是否完成保存登記無直接關連（未保存登記建物之房屋稅仍可能依現值課徵），本選項描述不符技術規則或稅法常理。","所得稅是收益取得後之稅務負擔，技術規則明定不應計入總費用，本選項與規則規定相反。","技術規則明定維修費、保險費皆是經營不動產所需投入之客觀營運成本，應計入總費用，與題目敘述相符。"],"correct":3,"note":null},{"id":"VD1_106_11","cat":"D1","year":"106年第11題","q":"若某房屋經濟耐用年數45年、經歷年數20年、殘餘價格率10%，於收益法估價時，等速折舊型，建物價格日期當時價值未來每年折舊提存率為何？","opts":["0.018","0.02","0.022","0.020"],"explains":["0.018的計算結果與本題經濟耐用年數45年、殘餘價格率10%之數據計算不符（此數值較接近耐用年數50年時之計算結果）。","0.02的計算結果與正確公式計算相符數值相同，需與選項D比較確認何者為官方標示之正解。","0.022的計算基礎有誤，與正確公式計算結果不符。","依定額法折舊提存率公式：(1－殘價率)÷經濟耐用年數＝(1-10%)÷45＝0.9÷45＝0.02，與本選項相符，依官方答案標示D為正解（與選項B數值相同，但官方公告之正解編號為D）。"],"correct":3,"note":"折舊提存率＝(1－10%)÷45＝0.9÷45＝0.02。"},{"id":"VD1_107_2","cat":"D1","year":"107年第2題","q":"有關勘估標的總費用之推算項目，不包括下列那一項？","opts":["管理費及維修費","地價稅或地租、房屋稅","保險費","貸款利息"],"explains":["管理費及維修費是技術規則明定總費用應推算之項目之一，非本題答案（本題問「不包括」之項目）。","地價稅或地租、房屋稅是技術規則明定總費用應推算之項目之一。","保險費是技術規則明定總費用應推算之項目之一。","貸款利息屬於融資財務成本，技術規則明定總費用不包括貸款利息，即本題正解。"],"correct":3,"note":null},{"id":"VD1_107_7","cat":"D1","year":"107年第7題","q":"收益法估價應蒐集勘估標的及與其特性相同或相似之比較標的最近幾年間總收入、總費用及收益資本化率或折現率等資料？","opts":["2年","3年","4年","5年"],"explains":["2年並非技術規則規定之蒐集資料年限。","技術規則明定收益法估價應蒐集勘估標的及比較標的最近3年間總收入、總費用及收益資本化率或折現率等資料，與題目敘述相符。","4年並非技術規則規定之蒐集資料年限。","5年並非技術規則規定之蒐集資料年限。"],"correct":1,"note":null},{"id":"VD1_107_19","cat":"D1","year":"107年第19題","q":"依不動產估價技術規則之規定，下列收益法之估價步驟中，何種排列次序較為正確？①計算淨收益　②推算總費用　③決定收益資本化率或折現率　④推算有效總收入　⑤蒐集總收入、總費用及收益資本化率或折現率等資料　⑥計算收益價格","opts":["①⑤②③④⑥","⑤①②④③⑥","⑤④①②⑥③","⑤④②①③⑥"],"explains":["①⑤②③④⑥此排列順序將①計算淨收益置於最前面，但計算淨收益應在蒐集資料、推算總收入總費用之後，順序錯誤。","⑤①②④③⑥此排列順序將①計算淨收益置於④推算有效總收入之前，順序錯誤（應先推算總收入才能計算淨收益）。","⑤④①②⑥③此排列順序將⑥計算收益價格置於③決定收益資本化率之前，順序顛倒（應先決定資本化率才能計算收益價格）。","技術規則明定收益法估價程序為：⑤蒐集總收入總費用及收益資本化率或折現率等資料→④推算有效總收入→②推算總費用→①計算淨收益→③決定收益資本化率或折現率→⑥計算收益價格，與本選項⑤④②①③⑥完全相符。"],"correct":3,"note":null},{"id":"VD1_108_11","cat":"D1","year":"108年第11題","q":"下列敘述何者為正確？建物價格日期當時價值未來每年折舊提存率，得依下列方式計算：等速折舊型與償債基金型公式；建物折舊提存費，得依等速折舊型與償債基金型公式計算；不動產構成項目中於耐用年數內需重置部分之重置提撥費，按其利息及按該支出之有效使用年期及耗損比率分年攤提；勘估標的總費用之推算，除推算勘估標的之各項費用外，勘估標的包含建物者，應加計建物之折舊提存費，或於計算收益價格時，除考量建物收益資本化率或折現率外，應加計建物價格日期當時價值未來每年折舊提存率","opts":["（原試題公式選項因OCR辨識排版錯亂，無法準確呈現）","（原試題公式選項因OCR辨識排版錯亂，無法準確呈現）","（原試題公式選項因OCR辨識排版錯亂，無法準確呈現）","（原試題公式選項因OCR辨識排版錯亂，無法準確呈現）"],"explains":["本題原始試題選項因PDF文件OCR辨識排版錯亂，無法準確呈現各選項完整公式內容，故略過逐選項解析。","同上，選項內容無法辨識。","同上，選項內容無法辨識。","建議考生對照不動產估價技術規則第40條至第49條相關條文（折舊提存率計算方式、建物折舊提存費計算方式、重置提撥費攤提方式、總費用推算原則）核實本題完整內容與正確答案。"],"correct":0,"note":null},{"id":"VD1_108_14","cat":"D1","year":"108年第14題","q":"推算總收入及有效總收入時，應與相關資料校核比較，下列何者非屬該相關資料？","opts":["目前或未來可能之計畫收入","相同產業或具替代性比較標的總收入及有效總收入","期末價值","勘估標的往年之總收入及有效總收入"],"explains":["目前或未來可能之計畫收入是推算總收入時應與相關資料校核比較之項目之一，非本題答案（本題問「非屬」相關資料）。","相同產業或具替代性比較標的總收入及有效總收入是應校核比較之項目之一。","技術規則明定推算總收入及有效總收入時應校核比較之相關資料，並不包含「期末價值」（期末價值是DCF折現現金流量分析法中之概念，與直接資本化法之總收入推算無關），即本題正解。","勘估標的往年之總收入及有效總收入是應校核比較之項目之一。"],"correct":2,"note":null},{"id":"VD1_108_17","cat":"D1","year":"108年第17題","q":"有關直接資本化法，下列敘述何者為正確？","opts":["指勘估標的過去平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的過去平均三年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的未來平均一年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","指勘估標的未來平均三年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法"],"explains":["「過去平均一年期間」與技術規則規定的「未來平均一年期間」方向相反，敘述錯誤。","「過去平均三年期間」同時時間方向與期間長度皆與規則規定不符。","技術規則明定直接資本化法係指勘估標的「未來平均一年期間」之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法，與題目敘述完全相符。","「未來平均三年期間」期間長度與規則規定的一年期間不符。"],"correct":2,"note":null},{"id":"VD1_109_9","cat":"D1","year":"109年第9題","q":"勘估標的為辦公大樓之第10層，建物登記面積50坪，每月每坪正常租金收入為2,000元，該建物大樓經合理市場分析推算空置率為5%，勘估標的每年地價稅、房屋稅及保險費等相關總費用推算為200,000元。請問該建物以直接資本化法估價時，推算其有效總收入為多少？","opts":["940,000元","1,000,000元","1,140,000元","1,200,000元"],"explains":["940,000元的計算未正確
