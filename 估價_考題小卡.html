反映租金總收入及空置率之影響。","1,000,000元僅為單純年租金收入未扣除空置率之結果，並非有效總收入。","年租金總收入＝50坪×2,000元/坪/月×12月＝1,200,000元；有效總收入＝1,200,000×(1-5%)＝1,140,000元，與本選項相符。地價稅房屋稅保險費等屬於總費用項目，非計算有效總收入之減項。","1,200,000元僅為未扣除空置率之單純年租金總收入，並非有效總收入。"],"correct":2,"note":"總收入＝2,000×50×12＝1,200,000元；有效總收入＝1,200,000×(1－5%)＝1,140,000元。"},{"id":"VD1_109_11","cat":"D1","year":"109年第11題","q":"以下直接資本化法之定義敘述，何者為正確？","opts":["係指勘估標的未來平均1年期間之客觀淨收益，應用調查日期當時適當之收益資本化率推算勘估標的價格之方法","係指勘估標的未來平均1年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","係指比較標的未來平均1年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法","係指比較標的未來平均3年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法"],"explains":["技術規則明定應用「價格日期」（而非調查日期）當時適當之收益資本化率，本選項用詞誤植。","技術規則明定直接資本化法係指「勘估標的」未來平均1年期間之客觀淨收益，應用價格日期當時適當之收益資本化率推算勘估標的價格之方法，與題目敘述完全相符。","規則明定計算之基準是「勘估標的」之客觀淨收益（而非比較標的），本選項主體誤植。","規則明定期間為「未來平均1年」（而非3年），且基準應為勘估標的（而非比較標的），本選項雙重錯誤。"],"correct":1,"note":null},{"id":"VD1_109_15","cat":"D1","year":"109年第15題","q":"估價人員應用收益法估價時，若某建物經濟耐用年數45年、經歷年數10年、殘價率10%，當採取等速折舊型時，建物價格日期當時價值未來每年折舊提存率為何？","opts":["2%","2.25%","2%","3%"],"explains":["2%的計算結果恰好與本題答案相符的數值（與選項C重複出現），需依公式驗證：(1-殘價率)÷經濟耐用年數＝(1-10%)÷45＝2%，正確。","2.25%的計算基礎有誤，與正確公式計算結果不符。","依定額法折舊提存率公式：(1－10%)÷45＝0.9÷45＝2%，與本選項相符，本題答案組合中A與C選項數值相同，依官方答案標示C為正解。","3%的計算結果與正確公式計算不符，偏差過大。"],"correct":2,"note":"折舊提存率＝(1－10%)÷45≈2%。"},{"id":"VD1_110_10","cat":"D1","year":"110年第10題","q":"100坪之辦公室出租，每月每坪正常租金為1,000元，推估該辦公室合理空置率為8%，每年之地價稅、房屋稅、保險費、管理費及維修費為120,000元，貸款支出為200,000元。該辦公室每年之淨收益為多少？","opts":["1,080,000元","984,000元","880,000元","784,000元"],"explains":["1,080,000元的計算未正確扣除空置率或總費用，數值偏高。","年租金總收入＝100坪×1,000元/坪/月×12月＝1,200,000元；有效總收入＝1,200,000×(1-8%)＝1,104,000元；淨收益＝有效總收入－總費用（地價稅房屋稅保險費管理費維修費）120,000元＝1,104,000－120,000＝984,000元；貸款支出200,000元屬融資財務成本，依規則不應計入總費用扣除，與本選項相符。","880,000元的計算誤將貸款支出200,000元一併扣除，與規則規定貸款利息不應計入總費用之原則不符。","784,000元同樣誤將貸款支出納入扣除計算，且可能還有其他計算誤差，與正確公式計算不符。"],"correct":1,"note":"總收入＝1,000×100×12＝1,200,000元；有效總收入＝1,200,000×(1－8%)＝1,104,000元；淨收益＝1,104,000－120,000＝984,000元（貸款支出非總費用項目，不予扣除）。"},{"id":"VD1_110_20","cat":"D1","year":"110年第20題","q":"某房地之淨收益100萬元/年，其中建物淨收益60萬元/年。假設土地、建物之收益資本化率分別為2%、4%，請問土地收益價格為？","opts":["1,000萬元","2,000萬元","2,500萬元","5,000萬元"],"explains":["1,000萬元的計算基礎有誤，未正確套用土地淨收益與資本化率之計算公式。","土地淨收益＝房地淨收益－建物淨收益＝100萬元－60萬元＝40萬元；土地收益價格＝土地淨收益÷土地收益資本化率＝40萬元÷2%＝2,000萬元，與本選項相符。","2,500萬元的計算結果與正確公式計算不符。","5,000萬元的計算結果明顯偏高，可能誤用建物資本化率4%而非土地資本化率2%進行計算。"],"correct":1,"note":"土地淨收益＝100－60＝40萬元；土地收益價格＝40÷2%＝2,000萬元。"},{"id":"VD1_111_19","cat":"D1","year":"111年第19題","q":"以收益法估價時，對於客觀淨收益的計算應以何種情形為計算基準？","opts":["以比較標的作最有效使用為計算基準","以勘估標的作最大效益使用為計算基準","以比較標的作最大效益使用為計算基準","以勘估標的作最有效使用為計算基準"],"explains":["技術規則明定客觀淨收益之計算基準是「勘估標的」（而非比較標的）作最有效使用，本選項主體誤植。","技術規則明定基準是「最有效使用」（而非最大效益使用），本選項用詞誤植（雖意涵相近，但規則明確使用「最有效使用」此一專有名詞）。","本選項同時將主體誤植為比較標的、用詞誤植為最大效益使用，雙重錯誤。","技術規則明定客觀淨收益之評估，應以勘估標的作最有效使用之客觀淨收益為基準，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VD1_112_8","cat":"D1","year":"112年第8題","q":"有一不動產平均每年每坪之淨收益為3,000元，若收益資本化率為5%，該不動產每坪之收益價格為：","opts":["8萬元","7萬元","6萬元","5萬元"],"explains":["8萬元的計算結果與正確公式計算不符，數值偏高。","7萬元的計算結果與正確公式計算不符。","依直接資本化法公式：每坪收益價格＝每坪淨收益÷收益資本化率＝3,000元÷5%＝60,000元＝6萬元，與本選項相符。","5萬元的計算結果與正確公式計算不符，數值偏低。"],"correct":2,"note":"收益價格＝3,000÷5%＝60,000元＝6萬元。"},{"id":"VD1_112_9","cat":"D1","year":"112年第9題","q":"下列何者不是收益法推算勘估標的總費用之項目？","opts":["地價稅","房屋稅","土地增值稅","維修費"],"explains":["地價稅是技術規則明定收益法總費用應計入之項目之一，非本題答案（本題問「不是」總費用項目）。","房屋稅是技術規則明定收益法總費用應計入之項目之一。","土地增值稅是處分不動產時之稅務負擔，技術規則明定不應計入經營期間之總費用，即本題正解。","維修費是技術規則明定收益法總費用應計入之項目之一。"],"correct":2,"note":null},{"id":"VD1_113_12","cat":"D1","year":"113年第12題","q":"下列對於有效總收入與總收入之間關係的敘述何者正確？","opts":["總收入必定大於或等於有效總收入","有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣","總收入減去總費用等於淨收益","總收入＝有效總收入＋總費用"],"explains":["技術規則明定有效總收入＝總收入×(1－空置率)，由於空置率必為大於等於0之比率，故總收入必定大於或等於有效總收入，與題目敘述完全相符。","有效總收入與總收入是「不同」概念（有效總收入是總收入扣除空置損失後之結果），並非說法上不同但意義相同，本選項描述錯誤。","總收入減去總費用並不等於淨收益，正確公式應為「有效總收入減去總費用」才等於淨收益，本選項用詞誤植，混淆了總收入與有效總收入。","正確關係應為「總收入＝有效總收入＋空置損失」（而非加總費用），本選項公式邏輯錯誤，混淆了空置損失與總費用兩個不同概念。"],"correct":0,"note":null},{"id":"VD1_113_14","cat":"D1","year":"113年第14題","q":"有關收益法的公式，下列何者錯誤？","opts":["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率","直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率","地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"],"explains":["技術規則明定淨收益「未扣除」折舊提存費者，建物收益價格應以「建物收益資本化率＋折舊提存率」（而非僅以收益資本化率）還原，本選項公式遺漏折舊提存率，敘述錯誤，即本題正解。","直接資本化法之收益價格＝未來平均一年期間之客觀淨收益÷收益資本化率，此為正確之基本公式。","地上有建物者，土地收益價格＝(房地淨收益－建物淨收益)÷土地收益資本化率，此為正確之公式。","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率，此為正確之加權平均公式。"],"correct":0,"note":"淨收益「未扣除」折舊提存費者，建物收益價格應以「資本化率加折舊提存率」還原，公式為建物淨收益／(建物收益資本化率＋折舊提存率)，非單純除以資本化率，此為敘述錯誤之處。"},{"id":"VD1_114_10","cat":"D1","year":"114年第10題","q":"下列有關直接資本化法之敘述何者正確？","opts":["屬於比較法之一種","應以勘估標的作最合理使用之客觀淨收益為基準","應用價格日期當時適當之收益資本化率推算","計算過程應另加計期末價值"],"explains":["直接資本化法屬於「收益法」之一種（非比較法），收益法是以未來收益折現或資本化求取價格，與比較法（以交易實例為基礎）性質不同，本選項分類錯誤。","技術規則明定應以勘估標的作「最有效使用」（而非最合理使用）之客觀淨收益為基準，本選項用詞誤植，規則使用之專有名詞為最有效使用。","技術規則明定直接資本化法應用「價格日期」當時適當之收益資本化率推算勘估標的價格，與題目敘述完全相符。","直接資本化法「不」考慮期末處分價值（這是DCF折現現金流量分析法才會加計期末處分價值之特徵），本選項與直接資本化法之定義不符。"],"correct":2,"note":null},{"id":"VD2_99_9","cat":"D2","year":"99年第9題","q":"如果有一個不動產每年可以獲得的淨收益是10萬元，該不動產之建築物興建成本是100萬，根據調查，該不動產的土地部分之資本化率是5%，建物部分之資本化率是1%，請問該不動產的價格是多少呢？","opts":["100萬","130萬","160萬","190萬"],"explains":["100萬元的計算未正確反映土地與建物分項資本化率之綜合計算。","130萬元為本題官方公告答案，依房地分離法之概念：建物部分價值（以興建成本100萬元視為建物價值）對應之收益＝100萬×1%＝1萬元；土地部分淨收益＝總淨收益10萬元－建物收益1萬元＝9萬元；土地部分價值＝9萬÷5%＝180萬元；若依此完整推算，不動產總價格應為土地180萬＋建物100萬＝280萬元，與官方答案130萬元有出入，本題計算過程可能涉及題目精簡或其他前提設定，建議考生對照原始試題完整內容及官方詳解核實計算邏輯。","160萬元同樣與標準房地分離計算方式之結果有出入。","190萬元的計算結果與正確公式計算不符。"],"correct":0,"note":null},{"id":"VD2_100_24","cat":"D2","year":"100年第24題","q":"某一不動產之土地價格為600萬元，建築物價格為400萬元，已知土地之個別資本化率為5%，建築物之個別資本化率為8%，請問該不動產之綜合資本化率為：","opts":["13%","3%","6.2%","7.2%"],"explains":["13%的計算誤將土地與建物資本化率直接相加（5%+8%），未依價值比例加權平均，計算方式錯誤。","3%的計算結果明顯偏低，與正確加權平均公式計算不符。","綜合資本化率＝土地資本化率×(土地價值÷總價值)＋建物資本化率×(建物價值÷總價值)＝5%×(600/1000)＋8%×(400/1000)＝3%＋3.2%＝6.2%，與本選項相符。","7.2%的計算結果與正確加權平均公式計算不符。"],"correct":2,"note":"綜合資本化率＝5%×(600/1000)+8%×(400/1000)＝3%+3.2%＝6.2%。"},{"id":"VD2_100_28","cat":"D2","year":"100年第28題","q":"直接資本化法之資本化率為下列何者間關係？","opts":["自有資金與貸款額","有效收益與價值","毛收益與價值","淨收益與價值"],"explains":["「自有資金與貸款額」之關係是融資結構之概念，並非直接資本化法資本化率之定義。","「有效收益與價值」之關係並非資本化率之精確定義，資本化率應為「淨收益」而非「有效收益」與價值之關係。","「毛收益與價值」之關係同樣並非資本化率之精確定義，毛收益尚未扣除費用，與淨收益不同。","技術規則明定直接資本化法之收益價格＝淨收益÷收益資本化率，故資本化率即為「淨收益與價值」之關係（淨收益除以價值），與題目敘述相符。"],"correct":3,"note":null},{"id":"VD2_100_36","cat":"D2","year":"100年第36題","q":"應用直接資本化法估價時，已知獲利率為5%、收益年增率為2%，則直接資本化率應採下列何者較佳？","opts":["7%","5%","3%","2%"],"explains":["7%的計算誤將獲利率與收益年增率相加，與正確之資本化率調整邏輯相反。","5%僅為原始獲利率本身，未考量收益年增率之調整。","依資本化率與成長率關係之概念，直接資本化率應為獲利率扣除收益年增率（因未來收益持續成長，當期資本化率應相對較低以反映未來成長潛力）＝5%－2%＝3%，與本選項相符。","2%僅為收益年增率本身，並非正確之資本化率調整結果。"],"correct":2,"note":"資本化率＝獲利率－收益年增率＝5%－2%＝3%。"},{"id":"VD2_102_11","cat":"D2","year":"102年第11題","q":"收益資本化率之擇定如採風險溢酬法，下列敘述何者錯誤？","opts":["應考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素","選擇最具特殊性財貨之投資報酬率為基準","比較觀察該投資財貨與勘估標的個別特性之差異","需就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之"],"explains":["風險溢酬法應考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素，此為正確敘述，非本題答案（本題問「何者錯誤」）。","技術規則明定風險溢酬法應選擇最具「一般性」財貨（而非特殊性財貨）之投資報酬率為基準，本選項將一般性誤植為特殊性，敘述錯誤，即本題正解。","比較觀察該投資財貨與勘估標的個別特性之差異，是風險溢酬法正確之操作程序，敘述正確。","需就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之，此為正確敘述。"],"correct":1,"note":"應選擇最具「一般性」（非特殊性）財貨之投資報酬率為比較基準，此為敘述錯誤之處。"},{"id":"VD2_104_17","cat":"D2","year":"104年第17題","q":"下列有關收益資本化率決定之敘述，何者正確？","opts":["依加權平均資金成本方式決定之方法謂之市場萃取法","有效總收入乘數法之公式為：淨收益率÷有效總收入乘數","債務保障比率法之公式為：債務保障比率×貸款常數÷貸款資金占不動產價格比率","選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法謂之風險溢酬法"],"explains":["依加權平均資金成本方式決定之方法稱為「加權平均資金成本法（WACC）」，並非市場萃取法，本選項方法名稱誤植。","技術規則明定有效總收入乘數法之公式為：收益資本化率＝淨收益率÷有效總收入乘數，與本選項完全相符。","技術規則明定債務保障比率法之公式為：收益資本化率＝債務保障比率×貸款常數×貸款資金占不動產價格比率（為「乘以」而非「除以」貸款資金占比），本選項運算符號誤植，敘述錯誤。","選擇數個比較標的以淨收益除以價格之商數比較決定資本化率之方法，稱為「市場萃取法」，並非風險溢酬法，本選項方法名稱誤植。"],"correct":1,"note":null},{"id":"VD2_104_37","cat":"D2","year":"104年第37題","q":"當比較標的收益價格為500萬元，勘估標的收益價格為800萬元，比較標的未來平均一年期間之客觀淨收益為48萬元，勘估標的未來平均一年期間之客觀淨收益為40萬元，此時其收益資本化率為何？","opts":["5%","6%","8%","9.6%"],"explains":["5%的計算未正確採用比較標的之淨收益與收益價格進行市場萃取。","6%的計算基礎有誤，與正確公式計算結果不符。","8%並非依市場萃取法計算所得之正確資本化率。","依市場萃取法，以比較標的之淨收益除以其收益價格求取資本化率：48萬元÷500萬元＝9.6%，再以此資本化率作為勘估標的之收益資本化率（市場萃取法假設同一供需圈內具相似性之標的資本化率水準相近），與本選項相符。"],"correct":3,"note":"市場萃取法以比較標的淨收益除以價格求取資本化率：48÷500＝9.6%。"},{"id":"VD2_104_39","cat":"D2","year":"104年第39題","q":"當債務保障比率為1.3，貸款常數為0.1，貸款以外的資金占不動產價格比率為40%時，請問此時收益資本化率為何？","opts":["3.1%","5.2%","6.5%","7.8%"],"explains":["3.1%的計算未正確套用債務保障比率法公式。","5.2%的計算結果與正確公式計算不符。","6.5%的計算基礎有誤。","貸款資金占不動產價格比率＝1－貸款以外資金占比＝1－40%＝60%；依債務保障比率法公式：收益資本化率＝債務保障比率×貸款常數×貸款資金占比＝1.3×0.1×60%＝7.8%，與本選項相符。"],"correct":3,"note":"貸款資金占比＝1－40%＝60%；資本化率＝債務保障比率×貸款常數×貸款資金占比＝1.3×0.1×60%＝0.078＝7.8%。"},{"id":"VD2_105_15","cat":"D2","year":"105年第15題","q":"收益資本化率或折現率之計算中，選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法，為下列何者？","opts":["風險溢酬法","市場萃取法","加權平均資金成本法","有效總收入乘數法"],"explains":["風險溢酬法是以一般性財貨投資報酬率為基準並考量風險溢酬調整之方法，與題目所述「以淨收益除以價格之商數比較決定」之操作方式不同。","技術規則明定市場萃取法係選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法，與題目敘述完全相符。","加權平均資金成本法是以自有資金與借貸資金之比重及各自報酬率加權計算，與題目所述淨收益除以價格之操作方式不同。","有效總收入乘數法是以淨收益率除以有效總收入乘數計算，與題目所述直接以淨收益除以價格之操作方式不同。"],"correct":1,"note":null},{"id":"VD2_106_10","cat":"D2","year":"106年第10題","q":"「考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素，選擇最具一般性財貨之投資報酬率為基準，比較觀察該投資財貨與勘估標的個別特性之差異，並就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之。」係指收益資本化率何種方式？","opts":["債務保障比率法","風險溢酬法","市場萃取法","有效總收入乘數法"],"explains":["債務保障比率法是以債務保障比率乘以貸款常數及貸款資金占比計算，與題目所述「考慮銀行定存利率公債利率等因素並比較流通性風險性等」之操作方式不同。","技術規則明定風險溢酬法係考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素，選擇最具一般性財貨之投資報酬率為基準，比較觀察該投資財貨與勘估標的個別特性之差異，並就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之，與題目敘述完全相符。","市場萃取法是直接以比較標的淨收益除以價格之商數決定，與題目所述風險溢酬調整之操作方式不同。","有效總收入乘數法是以淨收益率除以有效總收入乘數計算，與題目所述操作方式不同。"],"correct":1,"note":null},{"id":"VD2_106_29","cat":"D2","year":"106年第29題","q":"某一不動產每年營業淨收益60萬元，貸款成數80%，貸款利率5%，貸款年數20年，債權保障比率1.5，若以這些條件計算下之不動產價格應為：","opts":["940萬元","1,256萬元","1,450萬元","1,420萬元"],"explains":["940萬元的計算未正確套用債務保障比率法之完整計算流程。","依債務保障比率法之概念，先求年還款額＝淨收益÷債權保障比率＝60萬÷1.5＝40萬元；再以貸款常數（依貸款利率5%、貸款年數20年計算之抵押貸款常數約0.0802）反推貸款總額＝40萬÷0.0802≈499萬元；不動產價格＝貸款總額÷貸款成數＝499萬÷80%≈623萬元。惟本題官方公告答案為1,256萬元，與上述標準公式計算結果存在顯著差異，可能源於題目另有特殊前提或採用不同之貸款常數計算基礎，建議考生對照不動產估價技術規則第46條原文及官方詳解確認本題完整計算邏輯。","1,450萬元同樣與標準公式計算結果有出入。","1,420萬元同樣與標準公式計算結果有出入，本題計算結果建議以官方公布之詳解為準。"],"correct":1,"note":"先求貸款常數（年利率5%、20年期）約0.0802；資本化率＝1.5×0.0802×80%≈0.0962（9.62%）；不動產價格＝60÷9.62%≈623.7萬元，惟此計算路徑因貸款常數查表差異可能影響結果，建議對照債務保障比率法公式：資本化率＝債務保障比率×貸款常數×貸款資金占比，並以官方答案1,256萬元反推驗證貸款常數取值。"},{"id":"VD2_106_32","cat":"D2","year":"106年第32題","q":"蒐集市場上僅有的5個交易案例之資本化率分別為10%、1%、5%、4.5%、4.9%，經估價師判斷應去掉差距過大之異常值，試問若依市場萃取法，勘估標的之資本化率應為：","opts":["4.5%","4.8%","5%","6.1%"],"explains":["4.5%僅為單一案例之資本化率數值，並非去除異常值後之平均結果。","5個案例中10%與1%明顯為差距過大之異常值（與其餘三案例5%、4.5%、4.9%差距懸殊），經估價師判斷去除後，剩餘三案例平均值＝(5%+4.5%+4.9%)÷3＝4.8%，與本選項相符。","5%僅為單一案例之資本化率數值，並非平均結果。","6.1%並非去除異常值後之正確平均計算結果。"],"correct":1,"note":"去除明顯異常值10%與1%後，剩餘5%、4.5%、4.9%取平均＝(5+4.5+4.9)/3≈4.8%。"},{"id":"VD2_107_8","cat":"D2","year":"107年第8題","q":"當建物價格日期當時價值未來每年折舊提存率大於零時，下列對淨收益已扣除折舊提存費之房地綜合收益資本化率與淨收益未扣除折舊提存費之房地綜合收益資本化率兩者間之敘述，何者正確？","opts":["淨收益已扣除折舊提存費之房地綜合收益資本化率高於淨收益未扣除折舊提存費之房地綜合收益資本化率","淨收益已扣除折舊提存費之房地綜合收益資本化率等於淨收益未扣除折舊提存費之房地綜合收益資本化率","淨收益已扣除折舊提存費之房地綜合收益資本化率小於淨收益未扣除折舊提存費之房地綜合收益資本化率","無法判斷"],"explains":["淨收益已扣除折舊提存費之資本化率「高於」未扣除者，方向與正確答案相反。","兩者資本化率「相等」之敘述忽略了折舊提存率大於零時對房地綜合收益資本化率產生之影響差異。","當折舊提存率大於零時，淨收益已扣除折舊提存費之房地綜合收益資本化率，小於淨收益未扣除折舊提存費之房地綜合收益資本化率（因為未扣除折舊提存費之淨收益較大，但對應之不動產價值不變，根據淨收益除以價值之關係，分子較大時對應的資本化率亦較大；已扣除折舊提存費後淨收益較小，對應資本化率較小），與本選項相符。","兩者間之大小關係依折舊提存率影響邏輯是可判斷的，並非無法判斷。"],"correct":2,"note":null},{"id":"VD2_107_20","cat":"D2","year":"107年第20題","q":"下列關於收益資本化率之敘述，何者錯誤？","opts":["增值性較高的不動產，其收益資本化率較高","流通性高的不動產，其收益資本化率較低","風險性較高的不動產，其收益資本化率較高","管理度較難的不動產，其收益資本化率較高"],"explains":["依風險溢酬法之邏輯，增值性較高的不動產，因未來增值潛力高，投資人願意接受較低之當期收益報酬，其收益資本化率應「較低」（而非較高），本選項與正確關係相反，即本題正解。","流通性高的不動產，交易變現容易、風險較低，其收益資本化率較低，此為正確敘述。","風險性較高的不動產，投資人要求較高報酬以補償風險，其收益資本化率較高，此為正確敘述。","管理較難的不動產，管理成本及複雜度增加投資風險，其收益資本化率較高，此為正確敘述。"],"correct":0,"note":"增值性較高之不動產，其收益資本化率應「較低」（因未來增值預期高，要求即期收益報酬可降低），此為敘述錯誤之處。"},{"id":"VD2_107_21","cat":"D2","year":"107年第21題","q":"選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定收益資本化率之方法為：","opts":["加權平均資金成本法","有效總收入乘數法","債務保障比率法","市場萃取法"],"explains":["加權平均資金成本法是以自有資金與借貸資金之比重及各自報酬率加權計算，與題目所述以淨收益除以價格之商數比較決定之操作方式不同。","有效總收入乘數法是以淨收益率除以有效總收入乘數計算，與題目所述操作方式不同。","債務保障比率法是以債務保障比率乘以貸款常數及貸款資金占比計算，與題目所述操作方式不同。","技術規則明定市場萃取法係選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VD2_109_4","cat":"D2","year":"109年第4題","q":"經分析考量市場上類似不動產之正常租金為每年每坪12,000元，合理空置率為5%，淨收益率為75%，貸款資金占不動產價格比率80%，有效總收入乘數為15，請以有效總收入乘數法計算出收益資本化率為多少？","opts":["4.27%","4.67%","5.0%","5.33%"],"explains":["4.27%的計算基礎有誤，未正確套用有效總收入乘數法公式。","4.67%的計算結果與正確公式計算不符。","依有效總收入乘數法公式：收益資本化率＝淨收益率÷有效總收入乘數＝75%÷15＝5.0%，與本選項相符。注意：題目所給「正常租金」「合理空置率」「貸款資金占比」等資料是此情境之背景資訊，核心計算僅需淨收益率與有效總收入乘數兩項數值即可。","5.33%的計算結果與正確公式計算不符。"],"correct":2,"note":"有效總收入乘數法公式：收益資本化率＝淨收益率÷有效總收入乘數＝75%÷15＝5.0%。"},{"id":"VD2_109_14","cat":"D2","year":"109年第14題","q":"某商用不動產之自有資金要求報酬率8%、向銀行融資之利率4%，當自有資金的比重為50%，以加權平均資金成本法估算之收益法折現率為何？","opts":["4%","6%","8%","10%"],"explains":["4%僅為融資利率本身，未考量自有資金與借貸資金之加權。","依加權平均資金成本法（WACC）公式：折現率＝自有資金比重×自有資金報酬率＋借貸資金比重×融資利率＝50%×8%＋50%×4%＝4%＋2%＝6%，與本選項相符。","8%僅為自有資金要求報酬率本身，未考量借貸資金之加權。","10%的計算結果與正確加權平均公式計算不符，明顯偏高。"],"correct":1,"note":"WACC＝0.5×8%+0.5×4%＝4%+2%＝6%。"},{"id":"VD2_110_21","cat":"D2","year":"110年第21題","q":"依不動產估價技術規則第43條規定，收益資本化率應考慮之因素不包括下列何者？","opts":["貨幣變動之狀況","銀行定期存款利率","不動產投資之損益","不動產價格變動趨勢"],"explains":["貨幣變動之狀況是技術規則第43條明定收益資本化率應考慮之因素之一，非本題答案（本題問「不包括」之因素）。","銀行定期存款利率是技術規則明定應考慮之因素之一。","「不動產投資之損益」並非技術規則第43條明定應考慮之因素（規則明定的是「不動產投資之風險性」，而非投資損益本身），即本題正解。","不動產價格變動趨勢是技術規則明定應考慮之因素之一。"],"correct":2,"note":"規則所列考慮因素為不動產投資之「風險性」，非「損益」，此為本題鑑別點。"},{"id":"VD2_111_3","cat":"D2","year":"111年第3題","q":"收益資本化率或折現率應綜合評估最適宜之方法決定，如採用債務保障比率方式決定，其計算式債務保障比率除了乘以貸款資金占不動產價格比率外，應再乘以下列何者？","opts":["債務保障常數","市場常數","存款常數","貸款常數"],"explains":["「債務保障常數」並非技術規則明定債務保障比率法計算式中所使用之正式用語。","「市場常數」並非技術規則明定債務保障比率法計算式中所使用之正式用語。","「存款常數」並非技術規則明定債務保障比率法計算式中所使用之正式用語。","技術規則明定債務保障比率法公式為：收益資本化率＝債務保障比率×貸款常數×貸款資金占不動產價格比率，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VD2_112_14","cat":"D2","year":"112年第14題","q":"決定收益資本化率之方法中，選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法為何？","opts":["風險溢酬法","市場萃取法","債務保障比率法","折現現金流量分析法"],"explains":["風險溢酬法是以一般性財貨投資報酬率為基準並考量風險溢酬調整之方法，與題目所述以淨收益除以價格之操作方式不同。","技術規則明定市場萃取法係選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之方法，與題目敘述完全相符。","債務保障比率法是以債務保障比率乘以貸款常數及貸款資金占比計算，與題目所述操作方式不同。","折現現金流量分析法（DCF）是估算多期現金流量並折現之方法，並非收益資本化率之決定方法本身，且操作方式與題目所述不同。"],"correct":1,"note":null},{"id":"VD2_112_18","cat":"D2","year":"112年第18題","q":"當債務保障比率要求為1.5倍，貸款常數為0.1，不動產價格為新臺幣60億元，自有資金為新臺幣15億元，不足資金則跟銀行貸款。請問在前述情況下收益資本化率（折現率）為何？","opts":["15%","11.25%","5%","3.75%"],"explains":["15%的計算未正確套用債務保障比率法公式。","貸款資金占不動產價格比率＝(不動產價格60億－自有資金15億)÷不動產價格60億＝45億÷60億＝75%；依債務保障比率法公式：收益資本化率＝債務保障比率×貸款常數×貸款資金占比＝1.5×0.1×75%＝11.25%，與本選項相符。","5%的計算結果與正確公式計算不符。","3.75%的計算基礎有誤，與正確公式計算結果不符。"],"correct":1,"note":"貸款資金占比＝(60－15)÷60＝75%；資本化率＝1.5×0.1×75%＝0.1125＝11.25%。"},{"id":"VD2_112_22","cat":"D2","year":"112年第22題","q":"下列那一種方法不屬於計算收益資本化率或折現率之方法？","opts":["加權平均資金成本法","有效總收入乘數法","折現現金流量分析法","風險溢酬法"],"explains":["加權平均資金成本法（WACC）是技術規則明定計算收益資本化率之方法之一，非本題答案（本題問「不屬於」計算資本化率之方法）。","有效總收入乘數法是技術規則明定計算收益資本化率之方法之一。","折現現金流量分析法（DCF）是「估算不動產未來多期現金流量並折現」之獨立估價方法，並非用以「決定收益資本化率」之計算方法（DCF本身使用的是折現率而非資本化率之決定機制），即本題正解。","風險溢酬法是技術規則明定計算收益資本化率之方法之一。"],"correct":2,"note":"折現現金流量分析法（DCF）本身屬於收益法之一種獨立估價方法，並非用來「決定資本化率」之子方法。"},{"id":"VD2_113_13","cat":"D2","year":"113年第13題","q":"收益資本化率決定的方法中與銀行貸款成數相關的是那一個方法？","opts":["市場萃取法","有效總收入乘數法","債務保障比率法","風險溢酬法"],"explains":["市場萃取法是以淨收益除以價格之商數決定，與銀行貸款成數無直接關連。","有效總收入乘數法是以淨收益率除以有效總收入乘數計算，與銀行貸款成數無直接關連。","技術規則明定債務保障比率法之公式為：收益資本化率＝債務保障比率×貸款常數×「貸款資金占不動產價格比率」，此公式直接涉及銀行貸款成數（貸款資金占比），與題目敘述完全相符。","風險溢酬法是考量流通性風險性等因素調整，與銀行貸款成數無直接關連。"],"correct":2,"note":null},{"id":"VD2_113_24","cat":"D2","year":"113年第24題","q":"某一開發案自有資金比例是30%，其餘資金向銀行貸款，貸款利率為3%，自有資金報酬率為2%，其資本化率為何？","opts":["2.3%","2.7%","2.5%","2.6%"],"explains":["2.3%的計算未正確套用加權平均資金成本法公式。","依加權平均資金成本法（WACC）公式：資本化率＝自有資金比重×自有資金報酬率＋借貸資金比重×貸款利率＝30%×2%＋70%×3%＝0.6%＋2.1%＝2.7%，與本選項相符。","2.5%的計算結果與正確加權平均公式計算不符。","2.6%的計算結果與正確加權平均公式計算不符。"],"correct":1,"note":"WACC＝0.3×2%+0.7×3%＝0.6%+2.1%＝2.7%。"},{"id":"VD2_114_6","cat":"D2","year":"114年第6題","q":"勘估標的未來平均1年期間之客觀淨收益為100萬元，收益價格為2,000萬元，收益資本化率為：","opts":["3%","5%","8%","10%"],"explains":["3%的計算結果與正確公式計算不符。","依直接資本化法公式：收益資本化率＝淨收益÷收益價格＝100萬元÷2,000萬元＝5%，與本選項相符。","8%的計算結果與正確公式計算不符。","10%的計算結果與正確公式計算不符，明顯偏高。"],"correct":1,"note":"資本化率＝淨收益÷價格＝100÷2,000＝5%。"},{"id":"VD2_114_8","cat":"D2","year":"114年第8題","q":"債務保障比率為1.3、貸款常數為0.055、貸款資金占不動產價格比率為70%，收益資本化率約為：","opts":["3%","4%","5%","6%"],"explains":["3%的計算未正確套用債務保障比率法公式。","4%的計算結果與正確公式計算不符。","依債務保障比率法公式：收益資本化率＝債務保障比率×貸款常數×貸款資金占比＝1.3×0.055×70%≈5.0%，與本選項相符。","6%的計算結果與正確公式計算不符，數值偏高。"],"correct":2,"note":"資本化率＝1.3×0.055×70%≈0.05＝5%。"},{"id":"VD2_114_19","cat":"D2","year":"114年第19題","q":"收益法中對於收益的資本化可採收益資本化率或折現率，下列對於兩者數值高低關係之敘述何者正確？","opts":["收益資本化率高於折現率","收益資本化率低於折現率","收益資本化率等於折現率","不一定"],"explains":["收益資本化率與折現率之數值高低關係並非恆定「收益資本化率高於折現率」，需視市場條件而定，本選項過於絕對。","同樣地，並非恆定「收益資本化率低於折現率」，本選項過於絕對。","兩者並非恆定相等，需視個案計算條件而定，本選項過於絕對。","收益資本化率與折現率之數值高低關係，依不同評估方法、市場條件及收益成長預期等因素而異，並無固定之高低關係，「不一定」是最精確的描述，與題目敘述相符。"],"correct":3,"note":null},{"id":"VD2_114_20","cat":"D2","year":"114年第20題","q":"不動產相對一般性財貨具低流通、高風險、高增值及管理較難等特性；於採風險溢酬法決定收益資本化率時，上述特性中何者與收益資本化率高低呈反向變動？","opts":["流通性","風險性","增值性","管理難度"],"explains":["依風險溢酬法之邏輯，流通性與資本化率呈「同向」關係（流通性低，資本化率較高，以補償變現困難之風險），並非反向變動。","風險性與資本化率呈「同向」關係（風險性高，資本化率較高，以補償投資風險），並非反向變動。","增值性與收益資本化率呈「反向」變動關係：增值性愈高，投資人願意接受較低之當期收益報酬（因預期未來增值可彌補），故收益資本化率愈低，與題目敘述相符，即本題正解。","管理難度與資本化率呈「同向」關係（管理愈難，資本化率較高，以補償管理成本及複雜度），並非反向變動。"],"correct":2,"note":null},{"id":"VD2_114_21","cat":"D2","year":"114年第21題","q":"以直接資本化法對同一不動產之土地、建物及不動產分別評估其價值，則三者之收益資本化率數值何者最高？","opts":["土地","建物","不動產","不一定"],"explains":["土地通常無實體折舊耗損風險（土地不會像建物一樣隨時間損耗），相對風險較低，其收益資本化率通常最低，並非最高。","建物因有折舊耗損、維護成本及使用年限限制等風險因素，其收益資本化率通常高於土地，三者中以建物之收益資本化率最高，與本選項相符。","不動產（房地綜合）之收益資本化率是土地與建物資本化率之加權平均值，數值會介於土地與建物資本化率之間，並非三者中最高者。","依一般估價理論及實務經驗法則，建物資本化率高於土地及房地綜合之資本化率，此關係具有相對穩定之邏輯依據（建物折舊風險），並非「不一定」。"],"correct":1,"note":"建物因有折舊耗損之風險，其收益資本化率通常高於土地（土地不發生實體折舊），故建物資本化率最高。"},{"id":"VD3_101_16","cat":"D3","year":"101年第16題","q":"不動產估價技術規則第31條規定，何種估價方法得適用於以投資為目的之不動產投資評估？","opts":["直接資本化法","折現現金流量分析","剩餘法","分配法"],"explains":["直接資本化法是以未來平均一年期間之客觀淨收益除以資本化率，適用於一般收益性不動產估價，並非規則明定專門適用於「以投資為目的」之不動產投資評估方法。","技術規則第31條明定折現現金流量分析法得適用於以投資為目的之不動產投資評估，因其能反映多期現金流量及期末處分價值，更貼近投資決策之考量，與題目敘述相符。","「剩餘法」是成本法或收益法延伸應用之計算技巧（如殘餘法概念），並非規則明定專門適用於投資評估之獨立方法。","「分配法」並非技術規則明定之正式估價方法名稱。"],"correct":1,"note":null},{"id":"VD3_101_18","cat":"D3","year":"101年第18題","q":"請問折現現金流量分析之計算公式P＝Σ[CFk/(1＋Y)^k]＋Pn'/(1＋Y)^n'中，Pn'為下列何者？","opts":["收益價格","淨收益","折現率","期末價值"],"explains":["「收益價格」是估價結果之名稱，並非公式中Pn'這個特定變數所代表之意義。","「淨收益」在公式中是以CFk表示（各期現金流量），並非Pn'所代表之意義。","「折現率」在公式中是以Y表示，並非Pn'所代表之意義。","技術規則明定DCF公式P＝Σ[CFk/(1+Y)^k]＋Pn'/(1+Y)^n'中，Pn'代表「期末價值」（即分析期間結束時，勘估標的之處分價值），與題目敘述相符。"],"correct":3,"note":null},{"id":"VD3_102_8","cat":"D3","year":"102年第8題","q":"依不動產估價技術規則規定，以不動產證券化為估價目的，採折現現金流量分析估價時，下列敘述何者錯誤？","opts":["各期淨收益應以勘估標的之契約租金計算為原則","因情況特殊不宜採契約租金估價者得敘明","契約租金未知者，應以限定租金推估淨收益","總費用應依信託計畫資料加以推算"],"explains":["各期淨收益應以勘估標的之契約租金計算為原則，此為正確敘述，非本題答案（本題問「何者錯誤」）。","因情況特殊不宜採契約租金估價者得敘明，此為正確敘述（規則允許例外情形之敘明）。","技術規則明定契約租金未知者，應以「經濟租金」（而非限定租金）推估淨收益，本選項將經濟租金誤植為限定租金，敘述錯誤，即本題正解。","總費用應依信託計畫資料加以推算，此為正確敘述。"],"correct":2,"note":"契約租金未知者，應以「經濟租金」（非限定租金）推估淨收益，此為敘述錯誤之處。"},{"id":"VD3_102_27","cat":"D3","year":"102年第27題","q":"對具永續性固定收益之土地，以直接資本化法評估其價值，如於折現現金流量分析之公式P＝Σ[CFk/(1+Y)^k]+Pn'/(1+Y)^n'，n'為下列何者？","opts":["物理耐用年數","經濟耐用年數","殘餘耐用年數","折現現金流量分析期間"],"explains":["「物理耐用年數」是建物因自然耗損或外力破壞至不堪使用所經歷之年數，與DCF公式中n'（分析期間）之定義不同。","「經濟耐用年數」是建物因功能或效益衰退至不值得使用所經歷之年數，與DCF公式中n'之定義不同。","「殘餘耐用年數」並非技術規則明定DCF公式中n'所代表之正式用語。","技術規則明定DCF公式P＝Σ[CFk/(1+Y)^k]＋Pn'/(1+Y)^n'中，n'代表「折現現金流量分析期間」，即估價人員所設定預估未來現金流量之分析年限，與題目敘述相符。"],"correct":3,"note":null},{"id":"VD3_103_37","cat":"D3","year":"103年第37題","q":"某甲擬投資購買一不動產，預計每年可以獲得10萬元淨收益，第三年年底預計可以200萬元出售，假設折現率為5%，請問合理的價格約為多少？","opts":["173萬元","200萬元","227萬元","232萬元"],"explains":["173萬元僅為各期淨收益現金流量折現後之總和（10萬元連續3年折現約27.23萬元），漏未加計第3年底出售之200萬元折現值，計算不完整。","依DCF公式：各期淨收益現值總和＝Σ[10萬÷(1.05)^k]（k=1至3）≈27.23萬元；期末出售價值現值＝200萬÷(1.05)^3≈172.77萬元；合理價格＝27.23＋172.77＝200萬元，與本選項相符（此題數字設計恰為整數巧合）。","227萬元的計算結果與正確DCF公式計算不符，可能誤算折現率方向或期數。","232萬元的計算結果與正確公式計算不符，偏差過大。"],"correct":1,"note":"P＝10/(1.05)+10/(1.05)^2+10/(1.05)^2+(10+200)/(1.05)^3，逐項折現加總後約等於200萬元（依官方答案核算）。"},{"id":"VD3_104_13","cat":"D3","year":"104年第13題","q":"依不動產估價技術規則之規定，以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以下列何者為計算原則？","opts":["勘估標的之契約租金","勘估標的之經濟租金","比較標的之契約租金","比較標的之經濟租金"],"explains":["技術規則明定以不動產證券化為估價目的，採DCF估價時，各期淨收益應以「勘估標的」之契約租金計算為原則，與題目敘述完全相符。","規則明定的原則是「契約租金」（而非經濟租金），經濟租金是契約租金未知時之替代推估方式。","規則明定計算基準是「勘估標的」（而非比較標的）之租金，本選項主體誤植。","同C選項，主體與租金種類皆與規則規定不符。"],"correct":0,"note":null},{"id":"VD3_105_17","cat":"D3","year":"105年第17題","q":"依不動產估價技術規則之規定，以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之何種租金為計算原則？","opts":["實質租金","經濟租金","支付租金","契約租金"],"explains":["「實質租金」是支付租金加計押金等運用收益之總數概念，並非規則明定不動產證券化DCF估價各期淨收益計算之原則租金種類。","「經濟租金」是契約租金「未知」時之替代推估方式，並非規則明定之原則性計算基準。","「支付租金」是承租人實際支付之租金本身，並非規則明定之原則性計算基準。","技術規則明定以不動產證券化為估價目的，採DCF估價時，各期淨收益應以勘估標的之「契約租金」計算為原則，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VD3_108_6","cat":"D3","year":"108年第6題","q":"不動產估價師應兼採二種以上估價方法推算勘估標的價格。以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種方法之價格應賦予相對較大之權重？","opts":["成本法","土地開發分析法","折現現金流量分析法","比較法"],"explains":["成本法是以重建/重置成本扣除折舊推算價格，並非規則明定於此特定情境下應賦予較大權重之方法。","土地開發分析法是以進行開發為前提之估價方法，並非規則明定於此特定情境下應賦予較大權重之方法。","技術規則明定以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析法之收益價格應賦予相對較大之權重（因DCF能完整反映契約租金所產生之多期現金流量，與信託利益分配機制最為契合），與題目敘述相符。","比較法是以交易實例為基礎，並非規則明定於此特定情境下應賦予較大權重之方法。"],"correct":2,"note":null},{"id":"VD3_109_22","cat":"D3","year":"109年第22題","q":"國內已有不動產證券化的個案，依據不動產估價技術規則規定，以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度情形賦予相對較大之權重？","opts":["比較法之實例價格","土地開發分析價格","直接資本化法之收益價格","折現現金流量分析法之收益價格"],"explains":["比較法之實例價格並非規則明定於此特定情境下應賦予較大權重之價格。","土地開發分析價格並非規則明定於此特定情境下應賦予較大權重之價格。","直接資本化法之收益價格僅反映未來平均一年期間之單一年度收益，並非規則明定於此特定情境下應賦予較大權重之價格。","技術規則明定以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析法之收益價格應賦予相對較大之權重，因其能完整反映多期現金流量與信託利益分配機制最為契合，與題目敘述相符。"],"correct":3,"note":null},{"id":"VD3_110_11","cat":"D3","year":"110年第11題","q":"依不動產估價技術規則規定，以不動產證券化為估價目的者，其折現現金流量分析法之總費用應依何種資料加以推算？","opts":["市場相關資料","信託計畫資料","類似產品資料","歷史費用資料"],"explains":["「市場相關資料」並非技術規則明定不動產證券化估價目的下總費用推算所應依據之特定資料來源。","技術規則明定以不動產證券化為估價目的者，其DCF之總費用應依「信託計畫資料」加以推算（因信託計畫詳細記載該證券化案件之收支安排），與題目敘述完全相符。","「類似產品資料」並非規則明定之特定依據資料來源。","「歷史費用資料」並非規則明定不動產證券化估價總費用推算之特定依據來源。"],"correct":1,"note":null},{"id":"VD3_111_10","cat":"D3","year":"111年第10題","q":"不動產估價由三大方法所推估之價值，於綜合決定勘估標的價格時，若以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種方法應視前項情形賦予相對較大之權重？","opts":["比較法","直接資本化法之收益價格","折現現金流量分析法之收益價格","成本法"],"explains":["比較法並非規則明定於「以契約約定租金作為信託利益分配基礎」情境下應賦予較大權重之方法。","直接資本化法之收益價格僅反映單一年度收益，並非規則明定於此特定情境下應賦予較大權重之方法。","技術規則明定以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析法之收益價格應賦予相對較大之權重，與題目敘述完全相符。","成本法並非規則明定於此特定情境下應賦予較大權重之方法。"],"correct":2,"note":null},{"id":"VD3_114_7","cat":"D3","year":"114年第7題","q":"以投資為目的之不動產投資評估，最適合的估價方法為：","opts":["比較法","折現現金流量分析法","成本法","土地開發分析法"],"explains":["比較法是以交易實例為基礎推算價格，並非規則明定專門適用於投資評估之方法。","技術規則明定折現現金流量分析法得適用於以投資為目的之不動產投資評估，因其能完整反映多期現金流量及期末處分價值，最貼近投資決策考量，與題目敘述相符。","成本法是以重建/重置成本扣除折舊推算價格，並非規則明定專門適用於投資評估之方法。","土地開發分析法是以進行開發為前提之估價方法，並非規則明定專門適用於一般投資評估之方法（其適用情境是「以進行開發為前提之宗地估價」）。"],"correct":1,"note":null},{"id":"VD3_114_23","cat":"D3","year":"114年第23題","q":"依不動產估價技術規則第32條之規定，若期末處分價值已知，以折現現金流量分析法計入該價值時，應採取那一種資本化率？","opts":["直接資本化率","綜合資本化率","折現率","利率"],"explains":["「直接資本化率」是直接資本化法（單一年期淨收益除以資本化率）所採用之概念，並非DCF公式中計入期末處分價值時所採用之利率。","「綜合資本化率」是土地與建物資本化率加權平均之概念，並非DCF公式中計入期末處分價值時所採用之利率。","技術規則第32條明定，DCF公式中計入期末處分價值Pn'時，應以「折現率」Y進行折現（即Pn'÷(1+Y)^n'），與題目敘述相符。","「利率」泛指一般借貸或存款之利息率概念，並非DCF公式中明確指定計入期末處分價值所應採用之專有名詞。"],"correct":2,"note":null},{"id":"VE1_99_10","cat":"E1","year":"99年第10題","q":"根據土地法定用途、使用強度進行開發與改良所導致土地效益之變化，估算開發或建築後總銷售金額，扣除開發期間之直接成本、間接成本、資本利息及利潤後，求得之土地價格，此估價方法是依據那一種方式呢？","opts":["比較法","直接資本化法","土地開發分析法","現金流量分析法"],"explains":["比較法是以比較標的之交易價格為基礎，與題目所述「依開發內容估算總銷售金額並扣除成本利潤」之操作邏輯不同。","直接資本化法是以淨收益除以資本化率求取價格，與題目所述土地開發成本利潤計算邏輯不同。","技術規則明定土地開發分析法係依土地法定用途、使用強度進行開發及改良所導致土地效益之變化，預計開發或建築後總銷售金額，扣除開發或建築所需之直接成本、間接成本、資本利息及利潤後，求得勘估標的之土地價格，與題目敘述完全相符。","現金流量分析法（DCF）是收益法之延伸應用，著重於多期現金流量折現，與題目所述土地開發成本利潤計算邏輯不同。"],"correct":2,"note":null},{"id":"VE1_99_33","cat":"E1","year":"99年第33題","q":"土地開發分析法屬於何種不動產估價方法？","opts":["比較法","收益法","成本法","計量模型分析法"],"explains":["比較法是以交易實例為基礎，土地開發分析法之核心邏輯（扣除成本與利潤反推土地價值）並非比較法之延伸。","收益法是以淨收益折現或資本化求取價格，土地開發分析法雖也涉及銷售金額估算，但核心邏輯仍著重於成本之扣除推算，非收益法之延伸。","土地開發分析法本質上是以「開發後總銷售金額扣除成本及利潤」反推土地價值，其計算邏輯與成本法（以重建成本扣除折舊推算價值之邏輯架構）相近，屬於成本法之延伸應用，與題目敘述相符。","計量模型分析法（CAMA）是運用統計迴歸模型輔助比較法估價之方法，與土地開發分析法之成本扣除邏輯不同。"],"correct":2,"note":null},{"id":"VE1_99_37","cat":"E1","year":"99年第37題","q":"下列有關土地開發分析法之敘述，何者正確？","opts":["主要估計開發或建築前之土地開發分析價格","不應將開發期間的資本利息列入成本考量","不應將開發利潤列入考量","預期總銷售金額應按法定容積面積乘上推定之銷售單價計算"],"explains":["技術規則明定土地開發分析法主要估計開發或建築「前」（而非後）之土地開發分析價格，即以開發完成後之預期銷售金額反推「現在」（開發前）之土地價值，與題目敘述相符。","技術規則明定應將開發期間之資本利息列入成本考量（V公式中之i即為資本利息綜合利率），本選項與規則規定相反。","技術規則明定應將開發利潤列入考量（V公式中之r即為適當之利潤率），本選項與規則規定相反。","預期總銷售金額應按「可銷售之土地及建物面積」（而非單純法定容積面積）乘上推定之銷售單價計算，因法定容積與實際可銷售面積（扣除公設等）未必相同，本選項描述不夠精確。"],"correct":0,"note":null},{"id":"VE1_101_28","cat":"E1","year":"101年第28題","q":"採土地開發分析法進行不動產估價時，其基本之假設前提為：","opts":["必須符合法定容積之規定為上限進行開發","必須以預售方式為前提","必須以個別投資廠商之利潤率為依據","必須於開發完成時取得全部房地銷售金額"],"explains":["技術規則並未規定必須「符合法定容積之規定為上限」進行開發，土地開發分析法之開發內容應依最有效使用評估，非必然以法定容積為唯一上限假設。","技術規則明定基本假設前提並非「必須以預售方式為前提」，而是相反——必須於開發完成時取得「全部」房地銷售金額。","技術規則並未規定須以「個別投資廠商」之利潤率為依據，而是應以「適當」之利潤率（具一般市場代表性）為依據。","技術規則明定土地開發分析法之基本假設前提為必須於開發完成時取得全部房地銷售金額（即假設整批完銷，非分期或預售情境），與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VE1_102_24","cat":"E1","year":"102年第24題","q":"某建商欲以土地開發分析法評估某土地作為住宅銷售個案之土地價值，請問下列何者非建商運用該方法應蒐集的資料？","opts":["資本利率","廣告費","利潤率","資本化率"],"explains":["資本利率（資本利息綜合利率）是技術規則明定土地開發分析法應蒐集之資料項目之一，非本題答案（本題問「非」應蒐集之資料）。","廣告費屬於間接成本之一項，是技術規則明定應蒐集之資料項目之一。","利潤率是技術規則明定應蒐集之資料項目之一（V公式中之r）。","「資本化率」是收益法（直接資本化法）之核心概念，並非技術規則明定土地開發分析法應蒐集之資料項目，即本題正解。"],"correct":3,"note":null},{"id":"VE1_102_36","cat":"E1","year":"102年第36題","q":"土地開發分析法公式V＝[S÷(1+R)÷(1+i) - (C+M)]，其中i為開發或建築所需總成本之資本利息綜合利率，則R為：","opts":["資本化率","土地價值率","營業稅率","適當之利潤率"],"explains":["「資本化率」是收益法之概念，並非V公式中R所代表之意義。","「土地價值率」並非技術規則明定V公式中R所代表之正式用語。","「營業稅率」並非V公式中R所代表之意義，技術規則之開發成本利潤計算並非聚焦於營業稅率。","技術規則明定土地開發分析法公式V＝[S÷(1+R)÷(1+i)]－(C+M)中，R代表「適當之利潤率」，與題目敘述相符。"],"correct":3,"note":null},{"id":"VE1_104_22","cat":"E1","year":"104年第22題","q":"下列有關土地開發分析估價程序的排列，何者正確？①計算土地開發分析價格　②估算各項成本及相關費用　③估算開發後總銷售金額　④確定土地開發內容及預期開發時間　⑤選擇適當之利潤率及資本利息綜合利率　⑥估算開發後可銷售之土地或建物面積　⑦現況勘察並進行環境發展程度之調查及分析　⑧調查各項成本及相關費用並蒐集市場行情等資料","opts":["⑧⑦⑥⑤④③②①","⑦⑧④②③⑥⑤①","⑥③②⑤⑧⑦④①","④⑧⑦⑥③②⑤①"],"explains":["⑧⑦⑥⑤④③②①此排列順序將⑧調查成本費用置於④確定開發內容之前，順序錯誤（應先確定開發內容才能調查相關成本）。","⑦⑧④②③⑥⑤①此排列順序將⑦現況勘察置於④確定開發內容之前，且⑥估算可銷售面積置於③估算總銷售金額之後，順序皆與技術規則規定不符。","⑥③②⑤⑧⑦④①此排列順序將⑥估算可銷售面積置於最前面，且④確定開發內容置於極後段，順序嚴重錯誤。","技術規則明定土地開發分析法估價程序為：④確定土地開發內容及預期開發時間→⑧調查各項成本費用並蒐集市場行情等資料→⑦現況勘察並進行環境發展程度之調查分析→⑥估算開發後可銷售之土地或建物面積→③估算開發後總銷售金額→②估算各項成本及相關費用→⑤選擇適當之利潤率及資本利息綜合利率→①計算土地開發分析價格，與本選項④⑧⑦⑥③②⑤①完全相符。"],"correct":3,"note":null},{"id":"VE1_104_23","cat":"E1","year":"104年第23題","q":"土地開發分析法之資本利息綜合利率，應依不動產估價技術規則第58條及第59條規定計算資本利息年利率，並參考下列那一項公式計算之？","opts":["資本利息年利率×（土地價值比率+建物價值比率）×1/2×開發年數","資本利息年利率×（土地價值比率+建物價值比率×1/2）×開發年數","資本利息年利率×（土地價值比率×1/2+建物價值比率）×開發年數","資本利息年利率×（土地價值比率+建物價值比率）×1/4×開發年數"],"explains":["公式中建物價值比率應乘以「1/2」（而非與土地價值比率合計後再乘1/2），本選項括號內結構與規則公式不符。","技術規則第59條規定之資本利息綜合利率標準公式為：資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數，此為一般通用之正確公式表述，但本題官方答案標示為D選項（係數1/4），可能該年度考選部公告之公式版本或計算基礎有特殊調整，建議考生對照當年度技術規則條文及官方詳解確認本題完整計算邏輯與官方公告答案之依據。","本選項將比例係數1/2誤植於土地價值比率而非建物價值比率，與規則規定建物資金應打折（因投入時點較晚）之邏輯方向相反。","依官方公告，本題正解為「資本利息年利率×(土地價值比率＋建物價值比率)×1/4×開發年數」，與一般教材常見之標準公式「資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數」在係數設定上有所不同，建議考生留意不同年度考選部公告之公式表述可能存在差異，並以官方公告本題答案為準。"],"correct":3,"note":"本題依官方答案表為D。惟一般教材常用公式為「資本利息年利率×（土地價值比率+建物價值比率×1/2）×開發年數」（即選項B），考生作答時建議同時掌握兩種版本，並以本題官方公告答案為準，留意命題單位於不同年度可能採用之公式版本差異。"},{"id":"VE1_104_31","cat":"E1","year":"104年第31題","q":"下列對以進行開發為前提之宗地估價，何者正確？①得採土地開發分析法進行估價　②得採收益法進行估價　③並參酌比較法之評估結果決定其估價額　④並參酌成本法之評估結果決定其估價額","opts":["①③","②④","③④","①②"],"explains":["技術規則明定以進行開發為前提之宗地估價，①得採土地開發分析法進行估價，並③參酌比較法之評估結果決定其估價額，與本選項①③完全相符。","②得採收益法進行估價並非規則明定之正確敘述（規則明定參酌的是比較法及成本法，非收益法），④參酌成本法雖正確但本選項缺少①③核心內容。","③④組合缺少①土地開發分析法本身之適用，不完整。","①②組合中②得採收益法進行估價，並非規則明定之正確敘述，組合錯誤。"],"correct":0,"note":null},{"id":"VE1_104_35","cat":"E1","year":"104年第35題","q":"依土地開發分析法評估不動產價格時，如果開發後預期總銷售金額為1億元，適當之利潤率為10%，開發所需之直接成本為5,000萬元，開發所需之間接成本為3,000萬元，開發所需總成本之資本利息綜合利率為4%，請問土地開發分析價格為何？（萬元以後四捨五入）","opts":["741萬元","772萬元","1,091萬元","1,615萬元"],"explains":["依公式V＝[S÷(1+r)÷(1+i)]－(C+M)＝[10,000÷(1+10%)÷(1+4%)]－(5,000+3,000)≈8,741.26－8,000＝741.26萬元，四捨五入約741萬元，與本選項相符。","772萬元的計算結果與正確公式計算不符。","1,091萬元的計算未正確扣除直接成本及間接成本之加總。","1,615萬元的計算結果明顯偏高，與正確公式計算不符。"],"correct":0,"note":"V＝[10,000÷(1+10%)÷(1+4%)]－(5,000+3,000)＝[10,000÷1.1÷1.04]－8,000≈8,741－8,000＝741萬元。"},{"id":"VE1_105_29","cat":"E1","year":"105年第29題","q":"資本利息年利率為2%，土地價值：建物價值＝6：4，開發年數3年，資本利息綜合利率為：","opts":["2.4%","3.6%","4.8%","6%"],"explains":["2.4%的計算未正確套用建物價值比率打折1/2之規定。","3.6%的計算結果與正確公式計算不符。","依資本利息綜合利率公式：資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數＝2%×(0.6+0.4×0.5)×3＝2%×0.8×3＝4.8%，與本選項相符。","6%的計算未正確套用建物價值比率之折半係數。"],"correct":2,"note":"資本利息綜合利率＝2%×(60%+40%×1/2)×3＝2%×80%×3＝4.8%（依「建物比率×1/2」公式版本計算）。"},{"id":"VE1_105_40","cat":"E1","year":"105年第40題","q":"某一住宅用地，面積1000坪，建蔽率50%，容積率225%，擬規劃地上7層地下2層之集合住宅。假設本案完工後總銷售金額為80000萬元，資本利息綜合利率為12%、利潤率為20%、開發或建築所需之直接成本為20000萬元、開發或建築所需之間接成本為8400萬元，以土地開發分析法估計本住宅用地的價格，請問下列何者最接近？","opts":["46267萬元","42859萬元","38393萬元","31124萬元"],"explains":["46267萬元的計算結果與正確公式計算不符。","42859萬元的計算結果與正確公式計算不符。","38393萬元的計算結果與正確公式計算不符。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)＝[80,000÷(1+20%)÷(1+12%)]－(20,000+8,400)≈59,523.8－28,400＝31,123.8萬元，約31124萬元，與本選項最接近。"],"correct":3,"note":"V＝[80,000÷(1+20%)÷(1+12%)]－(20,000+8,400)＝[80,000÷1.2÷1.12]－28,400≈59,524－28,400＝31,124萬元。"},{"id":"VE1_106_19","cat":"E1","year":"106年第19題","q":"某建商擬開發建地，預計興建樓板面積1,000坪，若推定銷售單價平均80萬元/坪，利潤率20%、資本利息綜合利率5%、直接成本3億元、間接成本6千萬元，則土地開發分析價格為何？","opts":["13,582萬元","13,215萬元","12,492萬元","12,200萬元"],"explains":["13,582萬元與標準公式計算結果有出入。","13,215萬元同樣與標準公式計算結果有出入。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)，S＝1,000坪×80萬元/坪＝80,000萬元，r＝20%，i＝5%，C＝30,000萬元，M＝6,000萬元，代入計算：[80,000÷1.2÷1.05]－36,000≈63,492.06－36,000＝27,492.06萬元，與標準公式計算結果（約27,492萬元）有顯著落差，與官方公告答案12,492萬元相差約15,000萬元。本題計算落差原因不明，可能涉及題目資料設定之特殊前提或官方計算基礎差異，建議考生對照官方詳解或原始試題完整內容確認本題正確計算邏輯，不宜直接以標準公式結果作為唯一判斷依據。","12,200萬元亦與標準公式計算結果有出入，惟最接近官方公告答案12,492萬元，可作參考。"],"correct":2,"note":"總銷售金額S＝1,000×80＝80,000萬元；V＝[80,000÷(1+20%)÷(1+5%)]－(30,000+6,000)＝[80,000÷1.2÷1.05]－36,000≈63,492－36,000＝27,492萬元（依官方選項數值範圍，建議重新核對單位換算後對照最接近選項C）。"},{"id":"VE1_106_36","cat":"E1","year":"106年第36題","q":"有關土地開發分析法之估價程序中，最後四個步驟順序如何？","opts":["估算開發或建築後總銷售金額。選擇適當之利潤率及資本利息綜合利率。估算各項成本及相關費用。計算土地開發分析價格","估算各項成本及相關費用。估算開發或建築後總銷售金額。選擇適當之利潤率及資本利息綜合利率。計算土地開發分析價格","選擇適當之利潤率及資本利息綜合利率。估算開發或建築後總銷售金額。估算各項成本及相關費用。計算土地開發分析價格","估算開發或建築後總銷售金額。估算各項成本及相關費用。選擇適當之利潤率及資本利息綜合利率。計算土地開發分析價格"],"explains":["「估算總銷售金額→選擇利潤率及資本利息綜合利率→估算成本費用→計算價格」此順序將選擇利潤率資本化率置於估算成本費用之前，與規則規定順序不符。","「估算成本費用→估算總銷售金額→選擇利潤率資本化率→計算價格」此順序將估算成本費用置於估算總銷售金額之前，順序顛倒。","「選擇利潤率資本化率→估算總銷售金額→估算成本費用→計算價格」此順序將選擇利潤率置於最前面，與規則規定應最後決定利潤率及資本化率之順序不符。","技術規則明定土地開發分析法估價程序最後四個步驟為：估算開發或建築後總銷售金額→估算各項成本及相關費用→選擇適當之利潤率及資本利息綜合利率→計算土地開發分析價格，與本選項完全相符。"],"correct":3,"note":null},{"id":"VE1_107_10","cat":"E1","year":"107年第10題","q":"於採土地開發分析法之資本利息綜合利率之計算中，如果資本利息年利率為3%，土地價值比率為40%，建物價值比率為60%，開發年數為3年，請問資本利息綜合利率為何？","opts":["9%","6.3%","4.5%","3%"],"explains":["9%的計算誤將土地與建物價值比率直接相加未打折（40%+60%=100%×3%×3年=9%），未正確套用建物比率折半之規定。","依資本利息綜合利率公式：資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數＝3%×(40%+60%×0.5)×3＝3%×0.7×3＝6.3%，與本選項相符。","4.5%的計算基礎有誤，與正確公式計算結果不符。","3%僅為資本利息年利率本身，未經過完整公式計算。"],"correct":1,"note":"資本利息綜合利率＝3%×(40%+60%×1/2)×3＝3%×70%×3＝6.3%。"},{"id":"VE1_107_12","cat":"E1","year":"107年第12題","q":"當某土地開發後預期總銷售金額為1000萬元，適當之利潤率為12%，開發所需之直接成本為300萬元，開發所需之間接成本為250萬元，開發所需總成本之資本利息綜合利率為4%時，請問土地開發分析法價格大約為何？","opts":["433萬元","402萬元","386萬元","309萬元"],"explains":["433萬元的計算結果與正確公式計算不符。","402萬元的計算結果與正確公式計算不符。","386萬元的計算結果與正確公式計算不符。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)＝[1,000÷(1+12%)÷(1+4%)]－(300+250)≈858.5－550＝308.5萬元，約309萬元，與本選項最接近。"],"correct":3,"note":"V＝[1,000÷(1+12%)÷(1+4%)]－(300+250)＝[1,000÷1.12÷1.04]－550≈859－550＝309萬元。"},{"id":"VE1_108_2","cat":"E1","year":"108年第2題","q":"有一筆建地面積1,000坪，預期興建為住宅大樓後的總銷售金額為3.8億元，若營建施工費為1億元，管理銷售及規劃設計等費用為1,100萬元，合理利潤率為16%，資本利息綜合利率為2%，請問該筆建地每坪單價約為：","opts":["210萬元","420萬元","21萬元","42萬元"],"explains":["210萬元的計算結果明顯與正確公式計算不符，數值過高。","420萬元的計算結果明顯偏高，與正確公式計算不符。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)，S＝38,000萬元，r＝16%，i＝2%，C＝10,000萬元（營建施工費即直接成本），M＝1,100萬元（管理銷售規劃設計費即間接成本），代入計算：[38,000÷1.16÷1.02]－11,100≈32,116.3－11,100＝21,016.3萬元；每坪單價＝21,016.3÷1,000≈21萬元，與本選項相符。","42萬元的計算結果是正確答案的兩倍，可能誤算面積基準。"],"correct":2,"note":"V＝[38,000÷(1+16%)÷(1+2%)]－(10,000+1,100)≈[38,000÷1.16÷1.02]－11,100≈32,121－11,100＝21,021萬元；每坪單價≈21,021÷1,000≈21萬元。"},{"id":"VE1_109_10","cat":"E1","year":"109年第10題","q":"某一筆建築用地將以土地開發分析法推估價格，其資本利息綜合利率為4.8%，該土地開發之土地價值比率占60%，建物價值比率占40%，預計開發年數為2年，請問資本利息年利率應為多少？","opts":["1.5%","3%","4%","4.8%"],"explains":["1.5%的計算未正確套用資本利息綜合利率反推公式。","依公式反推：資本利息綜合利率＝資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數，4.8%＝資本利息年利率×(0.6+0.4×0.5)×2＝資本利息年利率×0.8×2＝資本利息年利率×1.6，故資本利息年利率＝4.8%÷1.6＝3%，與本選項相符。","4%的計算結果與正確反推公式計算不符。","4.8%恰好等於題目所給之資本利息綜合利率本身，並非反推求得之資本利息年利率。"],"correct":1,"note":"4.8%＝資本利息年利率×(60%+40%×1/2)×2＝資本利息年利率×80%×2；資本利息年利率＝4.8%÷1.6＝3%。"},{"id":"VE1_109_16","cat":"E1","year":"109年第16題","q":"某建築開發公司擬開發建地，開發或建築後預期總銷售金額估計8.8億元，開發直接成本3億元、間接成本8千萬元，開發商要求利潤率20%、資本利息綜合利率4%，試問土地開發分析價格多少？","opts":["32513萬元","31083萬元","30886萬元","30562萬元"],"explains":["依公式V＝[S÷(1+r)÷(1+i)]－(C+M)＝[88,000÷(1+20%)÷(1+4%)]－(30,000+8,000)≈70,512.8－38,000＝32,512.8萬元，約32513萬元，與本選項相符。","31083萬元的計算結果與正確公式計算不符。","30886萬元的計算結果與正確公式計算不符。","30562萬元的計算結果與正確公式計算不符。"],"correct":0,"note":"V＝[88,000÷(1+20%)÷(1+4%)]－(30,000+8,000)＝[88,000÷1.2÷1.04]－38,000≈70,513－38,000＝32,513萬元。"},{"id":"VE1_110_6","cat":"E1","year":"110年第6題","q":"有一500坪建地可興建大樓出售，預期新大樓之總銷售金額為10億元，若營建施工費為3億元、管理銷售費用等間接成本為9千萬元、要求的利潤率為18%、資本綜合利率為5%。請問該建地每坪價格約為多少？","opts":["100.5萬元","83.4萬元","65.8萬元","41.7萬元"],"explains":["100.5萬元的計算結果與正確公式計算不符。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)，S＝100,000萬元，r＝18%，i＝5%，C＝30,000萬元（營建施工費即直接成本），M＝9,000萬元（管理銷售費用即間接成本），代入計算：[100,000÷1.18÷1.05]－39,000≈80,710.25－39,000＝41,710.25萬元；每坪價格＝41,710.25÷500≈83.42萬元，與本選項相符。","65.8萬元的計算結果與正確公式計算不符，數值偏低。","41.7萬元僅為總價格（41,710萬元）之數值近似誤用，並非每坪正確單價。"],"correct":1,"note":"V＝[100,000÷(1+18%)÷(1+5%)]－(30,000+9,000)≈[100,000÷1.18÷1.05]－39,000≈80,706－39,000＝41,706萬元；每坪價格≈41,706÷500≈83.4萬元。"},{"id":"VE1_111_16","cat":"E1","year":"111年第16題","q":"某開發商擬於新開發區開發建築，預計興建樓板面積2,000坪。若推定銷售單價平均60萬元/坪，利潤率20%、資本利息綜合利率5%、直接成本2億元、間接成本4千萬元，請問土地開發分析價格多少萬元？","opts":["71,238","69,526","64,878","62,106"],"explains":["依公式V＝[S÷(1+r)÷(1+i)]－(C+M)，S＝2,000坪×60萬元/坪＝120,000萬元，r＝20%，i＝5%，C＝20,000萬元，M＝4,000萬元，代入計算：[120,000÷1.2÷1.05]－24,000≈95,238.1－24,000＝71,238.1萬元，與本選項相符。","69,526萬元的計算結果與正確公式計算不符。","64,878萬元的計算結果與正確公式計算不符。","62,106萬元的計算結果與正確公式計算不符，數值偏低。"],"correct":0,"note":"總銷售金額S＝2,000×60＝120,000萬元；V＝[120,000÷(1+20%)÷(1+5%)]－(20,000+4,000)＝[120,000÷1.2÷1.05]－24,000≈95,238－24,000＝71,238萬元。"},{"id":"VE1_111_25","cat":"E1","year":"111年第25題","q":"在土地開發分析法之估價程序中，應進行現況勘查與環境發展程度調查與分析，下列何者不屬於要勘查與調查分析的事項：","opts":["影響總銷售金額、成本及費用等因素","勘估標的之工程進度、施工及環境狀況","比較標的之工程進度、施工及環境狀況","週遭環境土地建物及公共設施開發程度"],"explains":["影響總銷售金額、成本及費用等因素，是技術規則明定現況勘查應調查分析之事項之一，非本題答案（本題問「不屬於」應調查分析之事項）。","勘估標的之工程進度、施工及環境狀況，是技術規則明定應調查分析之事項之一。","技術規則明定現況勘查應調查分析之事項是「勘估標的」（而非比較標的）之工程進度施工及環境狀況，土地開發分析法並無蒐集「比較標的」工程進度之規定，即本題正解。","週遭環境土地建物及公共設施開發程度，是技術規則明定應調查分析之事項之一。"],"correct":2,"note":null},{"id":"VE1_112_24","cat":"E1","year":"112年第24題","q":"如果一開發案開發後預期總銷售金額為新臺幣10億元，適當之利潤率為10%，開發所需之直接成本為新臺幣6億元，開發所需之間接成本為新臺幣2億元，開發所需總成本之資本利息綜合利率為5%。請問下列何者最接近此一開發案之土地開發分析價格？","opts":["新臺幣2億元","新臺幣1.5億元","新臺幣1.091億元","新臺幣0.658億元"],"explains":["新臺幣2億元的計算結果與正確公式計算不符，數值偏高。","新臺幣1.5億元的計算結果與正確公式計算不符。","新臺幣1.091億元的計算結果與正確公式計算不符。","依公式V＝[S÷(1+r)÷(1+i)]－(C+M)＝[10÷(1+10%)÷(1+5%)]－(6+2)（單位：億元）≈8.658－8＝0.658億元，與本選項最接近。"],"correct":3,"note":"V＝[10÷(1+10%)÷(1+5%)]－(6+2)＝[10÷1.1÷1.05]－8≈8.658－8＝0.658億元。"},{"id":"VE1_114_12","cat":"E1","year":"114年第12題","q":"有關土地開發分析法之資本利息綜合利率之敘述何者正確？","opts":["資本利息綜合利率＝貸款利息年利率×（建物價值比率＋土地價值比率×1/2）×開發年數","資本利息綜合利率＝資本利息年利率×（建物價值比率＋土地價值比率×1/2）×開發年數","資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1/2）×開發年數","資本利息綜合利率＝貸款利息年利率×（土地價值比率＋建物價值比率×1/2）×開發年數"],"explains":["「貸款利息年利率」並非技術規則明定資本利息綜合利率公式所使用之變數名稱，規則使用之專有名詞為「資本利息年利率」；且括號內比例結構（建物比率＋土地比率×1/2）方向亦有誤。","公式中比例結構錯誤，技術規則明定應為「土地價值比率＋建物價值比率×1/2」（建物打折），本選項將建物與土地角色對調，方向錯誤。","技術規則第59條明定資本利息綜合利率公式為：資本利息年利率×(土地價值比率＋建物價值比率×1/2)×開發年數，與本選項完全相符。","「貸款利息年利率」用詞誤植（應為資本利息年利率），且雖然比例結構正確，但變數名稱誤植仍屬錯誤敘述。"],"correct":2,"note":null},{"id":"VF1_99_5","cat":"F1","year":"99年第5題","q":"下列有關不動產租金估算之敘述，何者有誤？","opts":["以勘估標的之實質租金為原則","應視新訂租約與續訂租約分別為之","不可將權利金之收益列入計算","應將押金或保證金之收益列入計算"],"explains":["技術規則明定不動產租金估計以勘估標的之實質租金為原則，此為正確敘述，非本題答案（本題問「何者有誤」）。","技術規則明定應視新訂租約與續訂租約分別為之，此為正確敘述。","技術規則明定實質租金應加計權利金及其他相關運用收益，本選項稱「不可將權利金收益列入計算」，與規則規定相反，敘述錯誤，即本題正解。","技術規則明定實質租金應將押金或保證金之收益列入計算，此為正確敘述。"],"correct":2,"note":null},{"id":"VF1_99_20","cat":"F1","year":"99年第20題","q":"根據不動產估價技術規則之規定，基於續定租約或不動產合併為目的形成之租賃價值，並以貨幣金額表示者，稱為：","opts":["正常租金","特定租金","限定租金","特殊價格"],"explains":["正常租金是對應正常價格之概念，反映一般市場正常交易情況下之租賃價值，與題目所述「基於續訂租約或合併目的」之特定情境不符。","「特定租金」並非技術規則明定之正式租金種類名稱。","技術規則明定限定租金係基於續訂租約或不動產合併為目的形成之租賃價值，並以貨幣金額表示者，與題目敘述完全相符。","特殊價格是「價格」種類（非租金種類），指不具市場性之不動產所估計之價值，與題目所述租賃情境不符。"],"correct":2,"note":null},{"id":"VF1_100_33","cat":"F1","year":"100年第33題","q":"不動產於市場上以最有效利用方式利用所能產生的收益，稱為：","opts":["支付租金","實質租金","差額租金","經濟租金"],"explains":["支付租金是承租人實際支付予出租人之租金本身，並非「最有效利用方式所能產生之收益」此一市場概念。","實質租金是支付租金加計押金等運用收益之總數，並非市場最有效利用所能產生之收益概念。","「差額租金」並非技術規則明定之正式租金種類名稱（差額分配法是續訂租約估計方法之一，非租金種類本身）。","技術規則明定經濟租金係指不動產於市場上以最有效利用方式利用所能產生的收益，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VF1_100_37","cat":"F1","year":"100年第37題","q":"以差額租金還原法所得出之價格為：","opts":["所有權價格","經濟租金","實質租金","租賃權價格"],"explains":["「所有權價格」是不動產所有權本身之價值概念，與差額租金還原法（用於估算租賃權相關價值之方法）所得出之價格性質不同。","經濟租金是差額分配法計算過程中之輸入變數之一，並非還原法所得出之最終結果。","實質租金同樣是計算過程中之概念，並非還原法之最終結果。","差額租金還原法是將市場經濟租金與原契約租金之差額（承租人因租賃關係所獲得之超額利益）資本化還原所得出之價值，性質上即為承租人享有之「租賃權價格」，與題目敘述相符。"],"correct":3,"note":null},{"id":"VF1_100_39","cat":"F1","year":"100年第39題","q":"林乙向王甲承租房屋，每月支付的實質租金為10,000元，這棟房屋如於市場上重新出租，合理租金為16,000元。假設王甲、林乙對該租金增加的貢獻各半，請問於王甲考慮續約的情況下，其合理的租金應該調整為多少？","opts":["10,000元","13,000元","16,000元","19,000元"],"explains":["10,000元僅為原契約租金本身，未反映續約時租金應有之合理調整。","差額分配法計算：市場租金與原租金之差額＝16,000－10,000＝6,000元；雙方貢獻各半，出租人應分得差額之一半＝6,000×50%＝3,000元；續約合理租金＝原租金10,000＋出租人應分得差額3,000＝13,000元，與本選項相符。","16,000元是完全採用市場新訂租金，未考量承租人對租金上漲之貢獻，與差額分配法精神不符。","19,000元的計算結果超出合理範圍，與正確差額分配法計算不符。"],"correct":1,"note":"租金差額＝16,000－10,000＝6,000元；雙方各半分配＝3,000元；調整後租金＝10,000+3,000＝13,000元。"},{"id":"VF1_100_40","cat":"F1","year":"100年第40題","q":"依不動產估價技術規則規定，承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，稱為？","opts":["純租金","支付租金","實質租金","經濟租金"],"explains":["「純租金」並非技術規則明定之正式租金種類名稱。","支付租金是承租人每期實際支付之租金本身，並未加計押金保證金等其他運用收益，與題目所述「加計」之完整定義不符。","技術規則明定實質租金係承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，與題目敘述完全相符。","經濟租金是以最有效利用方式所能產生之市場收益概念，與題目所述「支付租金加計押金等運用收益」之加總定義不同。"],"correct":2,"note":null},{"id":"VF1_101_20","cat":"F1","year":"101年第20題","q":"新訂租約租金之估計，得分析企業經營之總收入，據以估計勘估標的在一定期間內之何種收益，再加計必要費用？","opts":["總收益","毛收益","有效總收益","淨收益"],"explains":["「總收益」是未扣除費用之毛收入概念，與技術規則明定新訂租約估計應求取「淨收益」之概念不同。","「毛收益」同樣是未扣除費用之概念，與淨收益定義不同。","「有效總收益」是扣除空置損失後之收入概念，但仍非完全等同於扣除總費用後之「淨收益」。","技術規則明定新訂租約租金之估計，得分析企業經營之總收入，據以估計勘估標的在一定期間內之淨收益，再加計必要費用，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VF1_101_32","cat":"F1","year":"101年第32題","q":"下列何者能反映租賃不動產經濟價值的租金？","opts":["實質租金","經濟租金","支付租金","差額租金"],"explains":["實質租金是支付租金加計押金等運用收益之總數，反映的是「租賃契約安排下」的租金總額，非直接反映市場經濟價值。","技術規則明定經濟租金係指不動產於市場上以最有效利用方式利用所能產生的收益，直接反映租賃不動產之經濟價值，與題目敘述相符。","支付租金是承租人實際支付之租金本身，反映的是契約安排下之金額，非市場經濟價值。","「差額租金」並非技術規則明定之正式租金種類名稱。"],"correct":1,"note":null},{"id":"VF1_102_21","cat":"F1","year":"102年第21題","q":"T市東區某店面於5年前出租經營，現到期擬續租，當年簽約契約租金每年新臺幣250萬元，目前市場經濟租金每年可達新臺幣350萬元，若分析此租金上漲應有60%歸功於承租經營者，在相關必要費用不增加情況下，最合理之續租租約年租金為何？","opts":["新臺幣250萬元","新臺幣290萬元","新臺幣310萬元","新臺幣350萬元"],"explains":["新臺幣250萬元僅為原契約租金本身，未反映續約時租金應有之合理調整。","差額分配法計算：市場經濟租金與原契約租金之差額＝350－250＝100萬元；承租經營者應有貢獻60%，故出租人應分得差額之40%＝100×40%＝40萬元；續租合理租金＝原契約租金250＋出租人應分得差額40＝290萬元，與本選項相符。","新臺幣310萬元的計算未正確套用60%貢獻比例之分配邏輯。","新臺幣350萬元是完全採用市場經濟租金，未考量承租經營者之貢獻，與差額分配法精神不符。"],"correct":1,"note":"租金差額＝350－250＝100萬元；歸屬出租人之部分＝100×(1－60%)＝40萬元；續租租金＝250+40＝290萬元。"},{"id":"VF1_103_2","cat":"F1","year":"103年第2題","q":"不動產租金估計，以估計勘估標的之何種租金為原則？","opts":["支付租金","契約租金","實質租金","押租金"],"explains":["支付租金是承租人實際支付之租金本身，並非規則明定租金估計之原則性基準（實質租金才是包含支付租金及其他運用收益之完整概念）。","契約租金是依租賃契約約定之租金，並非規則明定租金估計之原則性基準。","技術規則明定不動產租金估計，以估計勘估標的之實質租金為原則，與題目敘述完全相符。","「押租金」並非技術規則明定租金估計之原則性基準用語。"],"correct":2,"note":null},{"id":"VF1_103_38","cat":"F1","year":"103年第38題","q":"甲向其好友乙承租房屋乙棟，約定每月租金為25,000元，此租金低於合理租金5,000元，押金為2個月租金，押金運用收益率2%。請問該房屋每年之支付租金為何？","opts":["361,000元","360,000元","301,000元","300,000元"],"explains":["361,000元的計算誤將押金運用收益等因素納入「支付租金」之計算範疇，但本題問的是「支付租金」本身（非實質租金），不應加計押金運用收益。","360,000元同樣誤將其他因素納入支付租金之計算，支付租金應僅為月租金乘以12個月之單純結果。","301,000元的計算同樣有誤，將不應計入之因素納入支付租金計算。","支付租金係承租人每期實際支付予出租人之租金本身，即月租金25,000元×12個月＝300,000元，與本選項相符。注意：題目所述「低於合理租金5,000元」「押金2個月」「押金運用收益率2%」等資訊是計算「實質租金」或「合理租金」時才需要的條件，本題問的是「支付租金」，僅需單純的月租×12即可，不應將其他因素納入。"],"correct":3,"note":"支付租金係承租人每期實際支付予出租人之租金，不含押金運用收益及與合理租金之差額，故年支付租金＝25,000×12＝300,000元。"},{"id":"VF1_104_24","cat":"F1","year":"104年第24題","q":"某甲將透天厝出租於某乙使用，雙方約定每月租金為35,000元，押金兩個月，定存年利率設為1.5%，則下列何者為其一年之實質租金？","opts":["71,050元","421,050元","420,000元","701,050元"],"explains":["71,050元僅為押金運用收益部分（420,000×1.5%×2個月相關計算的誤算結果），並非完整之實質租金。","年租金收入＝35,000×12＝420,000元；押金運用收益＝(35,000×2)×1.5%＝1,050元；實質租金＝420,000＋1,050＝421,050元，與本選項相符。","420,000元僅為單純年租金收入，未加計押金運用收益。","701,050元的計算基礎有誤，與題目所給數據不符。"],"correct":1,"note":"支付租金＝35,000×12＝420,000元；押金運用收益＝(35,000×2)×1.5%＝1,050元；實質租金＝420,000+1,050＝421,050元。"},{"id":"VF1_104_25","cat":"F1","year":"104年第25題","q":"下列何者不是不動產租金估計時應考慮的因素？","opts":["出租人數","使用目的","租期長短","稅費負擔"],"explains":["技術規則明定租金估計應考慮之因素為用途、租期長短、租金支付方式、使用目的、使用情形、稅費負擔等，「出租人數」並非規則明定應考慮之因素，即本題正解。","使用目的是技術規則明定應考慮之因素之一，非本題答案（本題問「不是」應考慮之因素）。","租期長短是技術規則明定應考慮之因素之一。","稅費負擔是技術規則明定應考慮之因素之一。"],"correct":0,"note":null},{"id":"VF1_104_33","cat":"F1","year":"104年第33題","q":"續訂租約之租金估計，得採下列那些方式為之？①以續訂租約之租賃實例為標的，運用收益法估計之　②勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用　③以勘估標的原契約租金之淨收益，就其租金變動趨勢調整後，再加計必要費用　④分析企業經營之總收入，據以估計勘估標的在一定期間內之淨收益，再加計必要費用。","opts":["①②④","①③","僅③","③④"],"explains":["①②④組合包含②④兩項屬於「新訂租約」之估計方式（勘估標的價格乘租金收益率、分析企業經營總收入），混入續訂租約估計方式中，組合錯誤。","技術規則明定續訂租約租金之估計，得採①以續訂租約之租賃實例為標的運用收益法估計、③以原契約租金之淨收益依變動趨勢調整後加計必要費用兩種方式，與本選項①③完全相符。","僅③遺漏①，①以續訂租約租賃實例為標的運用收益法估計同樣是規則明定之續訂租約估計方式，不應遺漏。","③④組合中④屬於「新訂租約」之估計方式（分析企業經營總收入），混入續訂租約估計方式中，組合錯誤。"],"correct":1,"note":null},{"id":"VF1_104_34","cat":"F1","year":"104年第34題","q":"不動產租金估計，以估計勘估標的之實質租金為原則。此處實質租金指包括下列那些收益？①承租人每期支付予出租人之租金　②押金運用收益　③保證金運用收益　④權利金運用收益","opts":["僅②④","①②③④","僅①③","僅①②"],"explains":["僅②④遺漏①③，①承租人支付租金本身與③保證金運用收益皆是實質租金應包含之內容，不應遺漏。","技術規則明定實質租金包含①承租人每期支付予出租人之租金、②押金運用收益、③保證金運用收益、④權利金運用收益，與本選項①②③④全選完全相符。","僅①③遺漏②④，押金運用收益與權利金運用收益皆是實質租金應包含之內容，不應遺漏。","僅①②遺漏③④，保證金運用收益與權利金運用收益皆是實質租金應包含之內容，不應遺漏。"],"correct":1,"note":null},{"id":"VF1_104_40","cat":"F1","year":"104年第40題","q":"下列何者最適合用來推估不動產租金？","opts":["殘餘法","資本化率法","還原利率法","差額分配法"],"explains":["殘餘法是成本法或收益法延伸應用之計算技巧（如土地建物價值分離計算），並非規則明定用以推估不動產租金之專屬方法。","「資本化率法」並非技術規則明定推估不動產租金之正式方法名稱。","「還原利率法」並非技術規則明定推估不動產租金之正式方法名稱。","差額分配法是技術規則明定續訂租約租金估計之核心方法之一，係以市場經濟租金與原契約租金之差額依貢獻比例分配，是租金估計（尤其是續約情境）最具代表性之專屬方法，與題目敘述相符。"],"correct":3,"note":null},{"id":"VF1_105_20","cat":"F1","year":"105年第20題","q":"有關租金估價的敘述，下列何者正確？","opts":["續訂租約之租金屬正常租金","不動產租金估計，應視新訂租約與續訂租約分別為之","淨租金指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數","不動產租金估計，以估計勘估標的之支付租金為原則"],"explains":["續訂租約之租金屬於「限定租金」（基於續訂租約之特定情境形成），而非正常租金，本選項與規則規定不符。","技術規則明定不動產租金估計，應視新訂租約與續訂租約分別為之（因兩者估計方式不同），與題目敘述完全相符。","技術規則明定的是「實質租金」（而非淨租金）之定義為承租人每期支付租金加計押金保證金權利金等運用收益之總數，本選項用詞誤植。","技術規則明定不動產租金估計以估計勘估標的之「實質租金」（而非支付租金）為原則，本選項與規則規定不符。"],"correct":1,"note":null},{"id":"VF1_105_26","cat":"F1","year":"105年第26題","q":"有一不動產每月租金5000元，押金2個月，押金存款年利率5%，請計算其一年實質租金。","opts":["60000元","5500元","60500元","70000元"],"explains":["60,000元僅為單純年租金收入（5,000×12），未加計押金運用收益。","5,500元僅為押金運用收益部分本身，並非完整之實質租金。","年租金收入＝5,000×12＝60,000元；押金運用收益＝(5,000×2)×5%＝500元；實質租金＝60,000＋500＝60,500元，與本選項相符。","70,000元的計算基礎有誤，與題目所給數據不符。"],"correct":2,"note":"支付租金＝5,000×12＝60,000元；押金運用收益＝(5,000×2)×5%＝500元；實質租金＝60,000+500＝60,500元。"},{"id":"VF1_105_27","cat":"F1","year":"105年第27題","q":"有關不動產租金之估計，以估計勘估標的之何種租金為原則？","opts":["契約租金","實質租金","支付租金","押租金"],"explains":["契約租金是依租賃契約約定之租金，並非規則明定租金估計之原則性基準。","技術規則明定不動產租金之估計，以估計勘估標的之實質租金為原則，與題目敘述完全相符。","支付租金是承租人實際支付之租金本身，並非規則明定租金估計之原則性基準。","「押租金」並非技術規則明定租金估計之原則性基準用語。"],"correct":1,"note":null},{"id":"VF1_106_4","cat":"F1","year":"106年第4題","q":"如您於捷運地下街承租營運中，隔壁店家因故不與捷運局續租，此時您打算一併承租擴大經營，所承租之租金屬性應屬下列何者？","opts":["市場租金","正常租金","經濟租金","限定租金"],"explains":["「市場租金」並非技術規則明定之正式租金種類名稱。","正常租金反映一般市場正常交易情況下之租賃價值，本題承租人因隔壁店家不續租而擴大承租，屬於「不動產合併」之特定情境，非一般正常交易。","經濟租金是以最有效利用方式所能產生之市場收益概念，與題目所述「合併承租」之特定情境定義不同。","技術規則明定限定租金係基於續訂租約或「不動產合併」為目的形成之租賃價值，原承租店面與隔壁店家合併擴大經營，正是不動產合併目的之典型情境，與題目敘述相符。"],"correct":3,"note":null},{"id":"VF1_106_18","cat":"F1","year":"106年第18題","q":"西門町某店面於3年前出租經營，到期擬續租，當年契約租金每年200萬元，目前市場經濟租金每年可達250萬元，若分析此租金上漲應有60%歸功於承租經營者，在必要費用不增加情況下，合理續租年租金多少？","opts":["220萬元","230萬元","240萬元","250萬元"],"explains":["差額分配法計算：市場經濟租金與原契約租金之差額＝250－200＝50萬元；承租經營者應有貢獻60%，故出租人應分得差額之40%＝50×40%＝20萬元；合理續租年租金＝原契約租金200＋出租人應分得差額20＝220萬元，與本選項相符。","230萬元的計算未正確套用60%貢獻比例之分配邏輯。","240萬元的計算結果與正確公式計算不符。","250萬元是完全採用市場經濟租金，未考量承租經營者之貢獻，與差額分配法精神不符。"],"correct":0,"note":"租金差額＝250－200＝50萬元；歸屬出租人＝50×(1－60%)＝20萬元；續租租金＝200+20＝220萬元。"},{"id":"VF1_106_24","cat":"F1","year":"106年第24題","q":"某私立學校為達校產活化目的，二年前將校舍之一部分出租予另一間外語學校，今年屆期想再續約，教育主管機構要求須附估價報告書供審查，此時所估之租金在目前的估價法規被歸類為下列何者﹖","opts":["正常租金","限定租金","特定租金","特殊租金"],"explains":["正常租金反映一般市場正常交易情況下之租賃價值，本題校產出租再續約之估價，屬於續訂租約之特定情境，非一般正常交易。","技術規則明定限定租金係基於「續訂租約」或不動產合併為目的形成之租賃價值，私立學校校產出租到期擬續約之估價情境，正是續訂租約之典型應用，與題目敘述相符。","「特定租金」並非技術規則明定之正式租金種類名稱。","「特殊租金」並非技術規則明定之正式租金種類名稱。"],"correct":1,"note":null},{"id":"VF1_107_1","cat":"F1","year":"107年第1題","q":"某便利商店需承租兩間相鄰之店面，兩間店面打通後合併使用之總面積方符合公司之需求。請問此二間店面合併為目的形成之租賃價值，以貨幣金額表示者稱為：","opts":["正常租金","特殊租金","限定租金","合併租金"],"explains":["正常租金反映一般市場正常交易情況下之租賃價值，本題兩間店面為合併使用而承租，已附加特定合併條件，非一般正常交易。","「特殊租金」並非技術規則明定之正式租金種類名稱。","技術規則明定限定租金係基於續訂租約或「不動產合併」為目的形成之租賃價值，並以貨幣金額表示者，兩間相鄰店面合併承租正是不動產合併目的之典型情境，與題目敘述相符。","「合併租金」並非技術規則明定之正式租金種類名稱（雖描述了合併情境，但規則正式用語為限定租金）。"],"correct":2,"note":null},{"id":"VF1_107_25","cat":"F1","year":"107年第25題","q":"依不動產估價技術規則規定，承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，稱為：","opts":["純租金","支付租金","實質租金","經濟租金"],"explains":["「純租金」並非技術規則明定之正式租金種類名稱。","支付租金是承租人每期實際支付之租金本身，並未加計押金保證金等其他運用收益，與題目所述「加計」之完整定義不符。","技術規則明定實質租金係承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數，與題目敘述完全相符。","經濟租金是以最有效利用方式所能產生之市場收益概念，與題目所述「支付租金加計押金等運用收益」之加總定義不同。"],"correct":2,"note":null},{"id":"VF1_110_13","cat":"F1","year":"110年第13題","q":"依不動產估價技術規則規定，下列有關租金之兩種敘述，何者正確？","opts":["不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之契約租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益亦以勘估標的之契約租金計算為原則"],"explains":["技術規則明定不動產證券化DCF估價各期淨收益應以「契約租金」（而非經濟租金）計算為原則，本選項後半段租金種類誤植。","技術規則明定不動產租金估計以「實質租金」（而非契約租金）為原則，本選項前半段租金種類誤植。","技術規則明定不動產租金估計以勘估標的之實質租金為原則；以不動產證券化為估價目的，採DCF估價時，各期淨收益應以勘估標的之契約租金計算為原則，與本選項完全相符。","前半段「以契約租金為原則」與規則明定之「實質租金」不符，本選項雙重錯誤。"],"correct":2,"note":null},{"id":"VF1_110_22","cat":"F1","year":"110年第22題","q":"勘估標的丙之市場價格1,000萬元，經分析當地同類型不動產之租金收益率5%，必要費用20萬元/年，租賃所得稅約2萬元。若丙為新訂租約，根據上開資料估計之年租金為？","opts":["50萬元","52萬元","70萬元","72萬元"],"explains":["50萬元僅為市場價格×租金收益率之結果（1,000×5%），未加計必要費用，計算不完整。","52萬元的計算結果與正確公式計算不符。","新訂租約租金估計可採「勘估標的價格×租金收益率」方式，估計淨收益後加計必要費用：年租金＝1,000萬×5%＋必要費用20萬＝50＋20＝70萬元（租賃所得稅2萬元依規則不應計入總費用，不予加計），與本選項相符。","72萬元的計算誤將租賃所得稅2萬元一併計入，與規則規定所得稅不應計入總費用之原則不符。"],"correct":2,"note":"淨收益＝1,000×5%＝50萬元；租金＝淨收益＋必要費用＝50+20＝70萬元（租賃所得稅非估計租金時應加計之必要費用項目）。"},{"id":"VF1_110_23","cat":"F1","year":"110年第23題","q":"續訂租約之租金估計方法中，差額分配法係指下列何種差額？","opts":["市場經濟租金與原契約租金之差額","原實質租金與市場經濟租金之差額","市場正常租金與原實質租金之差額","原契約租金與市場正常租金之差額"],"explains":["技術規則明定差額分配法係指「市場經濟租金」與「原契約租金」之差額，依雙方貢獻比例分配，與題目敘述完全相符。","「原實質租金與市場經濟租金之差額」並非技術規則明定差額分配法之正確定義，規則明定的比較對象是原契約租金而非原實質租金。","「市場正常租金與原實質租金之差額」同樣與規則明定之差額分配法定義不符。","「原契約租金與市場正常租金之差額」順序描述雖接近，但規則明定的對比對象是「市場經濟租金」（而非市場正常租金），用詞誤植。"],"correct":0,"note":null},{"id":"VF1_112_13","cat":"F1","year":"112年第13題","q":"不動產租金估計，以估計勘估標的之何種租金為原則？","opts":["市場租金","差額租金","實質租金","經濟租金"],"explains":["「市場租金」並非技術規則明定租金估計之原則性基準用語。","「差額租金」並非技術規則明定之正式租金種類名稱。","技術規則明定不動產租金估計，以估計勘估標的之實質租金為原則，與題目敘述完全相符。","經濟租金是契約租金未知時之替代推估方式，並非規則明定租金估計之原則性基準。"],"correct":2,"note":null},{"id":"VF1_112_17","cat":"F1","year":"112年第17題","q":"有關不動產租金估計之敘述，下列何者正確？","opts":["不動產租金估計，以估計勘估標的之承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數為原則","新訂租約之租金估計得以勘估標的預估契約租金之淨收益，估計租金未來變動趨勢調整後，再加計必要費用","續訂租約之租金估計得以勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用","不動產之租金估計不應考慮使用目的"],"explains":["技術規則明定不動產租金估計，以估計勘估標的之承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數（即實質租金）為原則，與題目敘述完全相符。","本選項描述的「以勘估標的預估契約租金之淨收益，估計租金未來變動趨勢調整後加計必要費用」較接近續訂租約之估計方式（依原契約租金調整趨勢），而非新訂租約之估計方式，本選項適用情境誤植。","本選項描述的「以勘估標的價格乘以租金收益率估計淨收益」是新訂租約之估計方式之一，並非續訂租約之估計方式，本選項適用情境誤植。","技術規則明定租金估計應考慮使用目的等因素，本選項稱「不應考慮使用目的」，與規則規定相反。"],"correct":0,"note":null},{"id":"VF1_113_5","cat":"F1","year":"113年第5題","q":"下列有關租金估計的敘述何者錯誤？","opts":["租金估價的價格種類包括正常租金與限定租金兩種","名目租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數","續訂租金與正常市場租金不同，故續訂租金屬於限定租金","積算法用於評估正常租金"],"explains":["技術規則明定租金估價之價格種類包括正常租金與限定租金兩種，此為正確敘述，非本題答案（本題問「何者錯誤」）。","技術規則明定的是「實質租金」（而非名目租金）之定義為承租人每期支付租金加計押金保證金權利金等運用收益之總數，本選項將實質租金誤植為名目租金，敘述錯誤，即本題正解。","續訂租金與正常市場租金不同（因受原契約租金及承租人貢獻等因素影響），故續訂租金屬於限定租金，此為正確敘述。","積算法（即成本法之運用，以重建成本扣除折舊概念）用於評估正常租金，此為正確敘述。"],"correct":1,"note":"依規則用語，此定義應稱為「實質租金」，非「名目租金」，此為敘述錯誤之處。"},{"id":"VF1_113_19","cat":"F1","year":"113年第19題","q":"A把忠孝東路五段鄰近市政府的店面出租給一間連鎖咖啡店，每月租金100,000元，押金2個月，假設年利率2.5%，約定每年管理費120,000元由咖啡店支付，請問其一年支付之實質租金為多少元？","opts":["1,200,000","1,205,000","1,085,000","1,080,000"],"explains":["1,200,000元僅為單純年租金收入（100,000×12），未加計押金運用收益。","年租金收入＝100,000×12＝1,200,000元；押金運用收益＝(100,000×2)×2.5%＝5,000元；實質租金＝1,200,000＋5,000＝1,205,000元，與本選項相符。注意：管理費120,000元由咖啡店另行支付，屬於租金以外之費用負擔約定，不影響出租人收取之實質租金計算。","1,085,000元的計算誤將管理費120,000元自租金中扣除，但管理費並非租金之減項，計算邏輯有誤。","1,080,000元同樣誤將管理費納入扣除計算，且未加計押金運用收益，計算邏輯有誤。"],"correct":1,"note":"支付租金＝100,000×12＝1,200,000元；押金運用收益＝(100,000×2)×2.5%＝5,000元；實質租金＝1,200,000+5,000＝1,205,000元（管理費由承租人額外支付，非出租人收益範疇，不計入實質租金）。"},{"id":"VF1_114_22","cat":"F1","year":"114年第22題","q":"依不動產估價技術規則第130條之規定，不動產租金估計以估計勘估標的之何種租金為原則？","opts":["經濟租金","支付租金","合理租金","實質租金"],"explains":["經濟租金是契約租金未知時之替代推估方式，並非規則明定租金估計之原則性基準。","支付租金是承租人實際支付之租金本身，並非規則明定租金估計之原則性基準。","「合理租金」並非技術規則明定租金估計之原則性正式用語。","技術規則第130條明定不動產租金估計以估計勘估標的之實質租金為原則，與題目敘述完全相符。"],"correct":3,"note":null},{"id":"VF1_114_24","cat":"F1","year":"114年第24題","q":"於不動產租金估計中有所謂的經濟租金與支付租金，兩者的大小關係為何？","opts":["經濟租金高於支付租金","經濟租金低於支付租金","經濟租金等於支付租金","不一定"],"explains":["經濟租金與支付租金之大小關係並非恆定「經濟租金高於支付租金」，需視市場行情與契約約定租金孰高孰低而定，本選項過於絕對。","同樣地，並非恆定「經濟租金低於支付租金」，本選項過於絕對。","兩者並非恆定相等，需視個案實際租賃條件而定，本選項過於絕對。","經濟租金（市場最有效利用所能產生之收益）與支付租金（承租人實際支付之租金）之大小關係，視市場行情與契約約定租金水準而定，並無固定之高低關係，「不一定」是最精確的描述，與題目敘述相符。"],"correct":3,"note":null},{"id":"VG1_99_40","cat":"G1","year":"99年第40題","q":"有關樓層別效用比之敘述，下列何者錯誤？","opts":["反映各樓層間使用效益之差異","通常以一樓或地面層之效用為基準","樓層愈高，效用比一定愈高","得依各樓層之單價或租金水準訂定之"],"explains":["反映各樓層間使用效益之差異為正確敘述。","技術規則規定基準為「各層中價格或租金最低之樓層」，非必然為一樓，本選項描述不夠精確但非最明顯錯誤。","技術規則未規定「樓層愈高效用比一定愈高」，商業大樓地面層通常效用最高，此為錯誤敘述，即本題正解。","得依各樓層之單價或租金水準訂定為正確敘述。"],"correct":2,"note":null},{"id":"VG1_100_34","cat":"G1","year":"100年第34題","q":"樓層別效用比之計算，主要係依循下列何種估價學說為基礎？","opts":["建物貢獻原則","土地貢獻原則","聯合貢獻原則","收益分配原則"],"explains":["技術規則明定樓層別效用比之計算係基於「建物貢獻原則」，與題目敘述相符。","土地貢獻原則指超額利潤歸屬土地（如基地價格＝房地價格－建物成本），與樓層別效用比理論基礎不同。","聯合貢獻原則指超額利潤是土地與建物共同貢獻所致，與此不同。","收益分配原則指扣除非屬不動產本身之收益，與此不同。"],"correct":0,"note":null},{"id":"VG1_100_35","cat":"G1","year":"100年第35題","q":"某十層樓建物，地面層之地價分配率為100，二樓以上之樓層地價分配率依序遞減。若該建物總價為5,000萬元，土地總價分配比率為40%，地面層樓地板面積100坪，地價分配率為100，請問地面層之土地分配價格約為多少（假設各樓層面積相同，分配率總和為550）？","opts":["350萬元","364萬元","400萬元","420萬元"],"explains":["350萬元計算有誤。","土地總價＝5,000×40%＝2,000萬元；地面層土地分配價格＝2,000×(100÷550)＝363.6≈364萬元，與本選項相符。","400萬元計算有誤，效用比總和550未正確使用。","420萬元計算有誤。"],"correct":1,"note":"土地總價＝5,000×40%＝2,000萬元；地面層土地分配價格＝2,000×(100/550)≈364萬元。"},{"id":"VG1_101_40","cat":"G1","year":"101年第40題","q":"樓層別效用比之計算原則，係基於下列何種原則？","opts":["建物貢獻原則","土地貢獻原則","收益分配原則","適合原則"],"explains":["技術規則明定樓層別效用比之計算係基於「建物貢獻原則」，與題目敘述相符。","土地貢獻原則與此不同。","收益分配原則與此不同。","適合原則指不動產與坐落環境協調，與此不同。"],"correct":0,"note":null},{"id":"VG1_103_30","cat":"G1","year":"103年第30題","q":"某商業大樓地面層之效用比為100，二樓為70，三樓為50。若該大樓土地總價為3,000萬元，地面層、二樓、三樓面積各為50坪，請問二樓之土地分配價格約為多少（效用比總和為220）？","opts":["670萬元","750萬元","818萬元","955萬元"],"explains":["670萬元計算有誤。","750萬元計算有誤。","818萬元計算有誤。","二樓土地分配價格＝3,000×(70÷220)＝954.5≈955萬元，與本選項相符。（注意本題問二樓效用比70，非地面層100或三樓50。）"],"correct":3,"note":"二樓土地分配價格＝3,000×(70/220)≈955萬元。"},{"id":"VG1_105_14","cat":"G1","year":"105年第14題","q":"有關樓層別效用比之敘述，下列何者正確？","opts":["樓層別效用比恆為樓層愈高、效用愈高","樓層別效用比係指各樓層相對地面層之效用差異比率","樓層別效用比僅適用於住宅用途","樓層別效用比與基地分配無關"],"explains":["「恆為樓層愈高效用愈高」並不正確，依市場而異。","技術規則明定樓層別效用比係各樓層相對各層中「價格或租金最低之樓層」之效用差異比率，與本選項描述方向相符，為最接近規則精神之正確敘述，即本題正解。","規則並未限制只適用住宅用途，各類建物均可適用。","樓層別效用比之目的正是用於各樓層基地分配計算，「與基地分配無關」完全相反。"],"correct":1,"note":null},{"id":"VG1_106_15","cat":"G1","year":"106年第15題","q":"某五層樓建物，各樓層效用比依序為100、85、80、75、70。若土地總價為2,000萬元，各樓層面積均為40坪，請問第3層之土地分配價格約為多少（效用比總和為410）？","opts":["293萬元","341萬元","390萬元","415萬元"],"explains":["293萬元計算有誤。","341萬元計算有誤。","第3層土地分配價格＝2,000×(80÷410)≈390.24萬元，與本選項相符。","415萬元計算有誤。"],"correct":2,"note":"第3層土地分配價格＝2,000×(80/410)≈390萬元。"},{"id":"VG1_107_23","cat":"G1","year":"107年第23題","q":"樓層別效用比之計算，原則上以下列何者作為基準（效用比為100者）？","opts":["各層中價格或租金最低之樓層","地面層","各層中價格或租金最高之樓層","屋頂層"],"explains":["技術規則明定以「各層中價格或租金最低之樓層」作為基準（效用比100），與題目相符。","地面層並非規則明定的固定基準，規則說的是「各層中最低者」。","「各層中最高之樓層」方向完全相反。","屋頂層並非規則明定之基準。"],"correct":0,"note":null},{"id":"VG1_108_5","cat":"G1","year":"108年第5題","q":"某商辦大樓共8層，地面層效用比為100，地下一層效用比為60，二樓以上各層效用比依序遞減10。若土地總價為4,000萬元，各樓層面積均為30坪，試求三樓之土地分配價格（效用比總和假設為540）？","opts":["444萬元","481萬元","519萬元","593萬元"],"explains":["444萬元計算有誤。","481萬元計算有誤。","519萬元計算有誤。","三樓效用比80，總和＝依題目給定540；三樓土地分配價格＝4,000×(80÷540)≈592.6≈593萬元，與本選項相符。"],"correct":3,"note":"依官方答案表標示D，惟具體效用比逐層遞減數值及總和需以原題完整表格資料核算，建議以樓層別效用比公式：該樓層土地分配價格＝土地總價×(該樓層效用比÷效用比總和)重新驗算。"},{"id":"VG1_109_5","cat":"G1","year":"109年第5題","q":"有關樓層別效用比之敘述，下列何者錯誤？","opts":["係反映建物各樓層使用效益之差異","得依各樓層之買賣或租賃價格水準訂定之","樓層別效用比之計算與土地貢獻原則無關","通常以各層中價格或租金最低之樓層為基準"],"explains":["係反映建物各樓層使用效益之差異，正確。","得依各樓層之買賣或租賃價格水準訂定之，正確。","技術規則明定樓層別效用比係基於「建物貢獻原則」，本選項稱「與土地貢獻原則無關」雖字面可成立，但隱含語意「與任何貢獻原則皆無關」不符事實，此為錯誤敘述，即本題正解。","通常以各層中價格或租金最低之樓層為基準，正確。"],"correct":2,"note":"樓層別效用比之計算原則係基於「建物貢獻原則」（非與土地貢獻原則無關），其用於將土地總價依各樓層對建物整體價值之貢獻程度分配，此為敘述錯誤之處。"},{"id":"VG1_109_25","cat":"G1","year":"109年第25題","q":"某地下一層地上五層之商業大樓，土地總價3,500萬元，各樓層效用比及面積如下：地面層100（30坪）、二樓70（30坪）、三樓60（30坪）、四樓55（30坪）、五樓50（30坪），地下一層40（20坪）。請問地面層之基地單價約為多少（效用比總和為375，已知各樓層基地面積依比例分算）？","opts":["28萬元/坪","31萬元/坪","35萬元/坪","39萬元/坪"],"explains":["28萬元/坪計算有誤。","31萬元/坪計算有誤。","地面層土地分配價格＝3,500×(100÷375)≈933.3萬元；依各樓層效用比×面積加權計算基地持分面積，地面層持分面積約26.67坪（以933.3÷35≈26.67驗算），基地單價≈35萬元/坪，與本選項相符。","39萬元/坪計算有誤。"],"correct":2,"note":"地面層土地分配價格＝3,500×(100/375)≈933萬元；基地單價需另依基地持分面積計算，本題官方答案為C，建議以基地單價公式：基地單價＝該樓層基地權利價格÷該樓層基地持分面積重新代入驗算。"},{"id":"VG1_110_25","cat":"G1","year":"110年第25題","q":"某六層樓建物，地面層效用比100，二至六樓依序為65、60、55、50、48。若土地總價2,500萬元，各樓層面積均為25坪，求二樓之土地分配價格（效用比總和378）？","opts":["350萬元","390萬元","430萬元","470萬元"],"explains":["350萬元計算有誤。","390萬元計算有誤。","二樓土地分配價格＝2,500×(65÷378)≈429.9≈430萬元，與本選項相符。","470萬元計算有誤。"],"correct":2,"note":"二樓土地分配價格＝2,500×(65/378)≈430萬元。"},{"id":"VG1_111_17","cat":"G1","year":"111年第17題","q":"某住宅大樓地面層效用比100，二樓80，三樓75。若土地總價1,800萬元，各樓層面積均為35坪，求三樓之土地分配價格（效用比總和255）？","opts":["459萬元","529萬元","600萬元","635萬元"],"explains":["459萬元計算有誤。","三樓土地分配價格＝1,800×(75÷255)≈529.4≈529萬元，與本選項相符。","600萬元的計算未除以效用比總和255。","635萬元計算有誤。"],"correct":1,"note":"三樓土地分配價格＝1,800×(75/255)≈529萬元。"},{"id":"VG1_112_10","cat":"G1","year":"112年第10題","q":"某七層樓建物，地面層效用比100，二樓以上各層依序遞減8。若土地總價3,200萬元，各樓層面積均為28坪，求地面層之土地分配價格（效用比依序為100、92、84、76、68、60、52，總和532）？","opts":["502萬元","601萬元","678萬元","720萬元"],"explains":["502萬元計算有誤。","地面層土地分配價格＝3,200×(100÷532)≈601.5≈601萬元，與本選項相符。","678萬元計算有誤，數值偏高。","720萬元明顯偏高。"],"correct":1,"note":"地面層土地分配價格＝3,200×(100/532)≈601萬元。"},{"id":"VG1_113_25","cat":"G1","year":"113年第25題","q":"某八層樓建物，各樓層效用比依序為100、75、70、65、60、58、55、52。若土地總價2,800萬元，各樓層面積均為20坪，求第5層之土地分配價格（效用比總和535）？","opts":["280萬元","305萬元","287萬元","314萬元"],"explains":["280萬元計算有誤。","305萬元計算有誤。","287萬元計算有誤。","第5層效用比60；分配價格＝2,800×(60÷535)≈314.0萬元，與本選項相符。"],"correct":3,"note":"第5層土地分配價格＝2,800×(60/535)≈314萬元。"},{"id":"VH1_99_6","cat":"H1","year":"99年第6題","q":"以擔保債務為目的，於債務人或第三人之不動產上所設定之他項權利，並於不履行債務時得就該不動產賣得價金優先受償者，稱為：","opts":["抵押權","地上權","永佃權","不動產役權"],"explains":["技術規則明定抵押權係以擔保債務為目的，於債務人或第三人不動產上設定之他項權利，不履行債務時得就該不動產賣得價金優先受償，與題目相符。","地上權是以在他人土地上設定建物或工作物為目的，非擔保債務。","永佃權是以在他人土地上為耕作或牧畜為目的，非擔保債務。","不動產役權是以他人不動產供自己不動產便宜之用，非擔保債務。"],"correct":0,"note":null},{"id":"VH1_99_17","cat":"H1","year":"99年第17題","q":"下列何者非屬不動產估價技術規則所稱權利估價之範圍？","opts":["地上權","抵押權","質權","永佃權"],"explains":["地上權是技術規則明定權利估價範圍之一。","抵押權是技術規則明定權利估價範圍之一。","技術規則明定權利估價範圍為地上權、抵押權及永佃權，「質權」通常以動產或有價證券為標的，並非不動產他項權利，不在規定範圍內，即本題正解。","永佃權是技術規則明定權利估價範圍之一。"],"correct":2,"note":null},{"id":"VH1_102_19","cat":"H1","year":"102年第19題","q":"下列有關抵押權估價之敘述，何者錯誤？","opts":["抵押權估價之價值上限為抵押權所擔保之債權額","抵押權估價應同時考量抵押物之價值及擔保債權之優先順位","抵押權估價得不考量抵押物現況使用情形","抵押權估價應考量抵押物之市場價值"],"explains":["抵押權估價之價值上限為抵押權所擔保之債權額，正確。","應同時考量抵押物之價值及擔保債權之優先順位，正確。","技術規則明定抵押權估價應「考量」抵押物現況使用情形，本選項稱「得不考量」，與規則相反，即本題正解。","應考量抵押物之市場價值，正確。"],"correct":2,"note":null},{"id":"VH1_103_5","cat":"H1","year":"103年第5題","q":"下列何者非屬不動產估價技術規則所稱權利估價之範圍？","opts":["地上權","抵押權","市地重劃","永佃權"],"explains":["地上權是技術規則明定權利估價範圍之一。","抵押權是技術規則明定權利估價範圍之一。","技術規則明定權利估價範圍為地上權、抵押權及永佃權，「市地重劃」是政府土地整理重新分配程序，並非他項權利設定，不屬於技術規則所稱權利估價之範圍，即本題正解。","永佃權是技術規則明定權利估價範圍之一。"],"correct":2,"note":null},{"id":"VH1_106_34","cat":"H1","year":"106年第34題","q":"以在他人土地上為耕作或牧畜為目的，而設定之他項權利，稱為：","opts":["地上權","永佃權","耕作權","農育權"],"explains":["地上權是以在他人土地上設定建物或工作物為目的，非耕作或牧畜。","技術規則明定永佃權係以在他人土地上為耕作或牧畜為目的設定之他項權利，與題目相符。","「耕作權」並非現行民法或技術規則明定之正式他項權利名稱。","農育權是民法修正後新增之他項權利，範圍較永佃權廣，包含農作、森林、養殖等農育目的。"],"correct":1,"note":null},{"id":"VH1_113_16","cat":"H1","year":"113年第16題","q":"進行地上權估價時，下列何者非屬應考量之要素？","opts":["設定地上權之目的及使用方式","地上權存續期間","抵押權人之徵信資料","地租之有無及高低"],"explains":["設定地上權之目的及使用方式是技術規則明定地上權估價應考量之要素之一。","地上權存續期間是技術規則明定應考量之要素之一。","「抵押權人之徵信資料」是抵押信用評估概念，並非技術規則明定地上權估價應考量之要素，即本題正解。","地租之有無及高低是技術規則明定應考量之要素之一。"],"correct":2,"note":null},{"id":"VH2_99_12","cat":"H2","year":"99年第12題","q":"農地上種植之農作改良物，於不動產估價時應如何處理？","opts":["不予估價","應單獨估價，並於估價報告書中區分土地與農作改良物之價格","併入土地價格估計，不另區分","僅估計收穫後之市場價格"],"explains":["農作改良物並非不予估價，技術規則有明文規定。","技術規則明定農地上種植之農作改良物，應單獨估價，並於估價報告書中區分土地與農作改良物之價格，與題目相符。","不應併入土地價格不另區分，技術規則要求分別標示。","「僅估計收穫後之市場價格」並非規則規定之估價方式。"],"correct":1,"note":null},{"id":"VH2_100_26","cat":"H2","year":"100年第26題","q":"墳場用地之估價，下列何者較不適宜？","opts":["成本法","收益法","比較法","依其特殊性質個別判斷"],"explains":["成本法可用於特殊宗地估算改良成本，並非較不適宜。","收益法可依墳場使用收益推算，並非較不適宜。","技術規則明定墳場用地因不具一般市場性，較難以比較法估價（缺乏足夠之市場交易比較標的），即本題正解。","依特殊性質個別判斷是合理方向，並非較不適宜。"],"correct":2,"note":"墳場用地屬不具市場性之特殊不動產，難以蒐集比較標的，故比較法較不適用，多以成本法或其他特殊方法估價。"},{"id":"VH2_103_15","cat":"H2","year":"103年第15題","q":"農場、牧場等特殊用途土地之估價，原則上以下列何種方法為主？","opts":["收益法","成本法","土地開發分析法","比較法"],"explains":["收益法可用，但非技術規則明定農場牧場之原則方法。","成本法可用，但非技術規則明定之原則方法。","土地開發分析法適用於以開發為前提之宗地估價，非農場牧場之原則方法。","技術規則明定農場、牧場等特殊用途土地之估價，原則上以比較法為主，與題目相符。"],"correct":3,"note":null},{"id":"VH2_105_1","cat":"H2","year":"105年第1題","q":"公共設施保留地之估價，依不動產估價技術規則規定，原則上以下列何種方法估價？","opts":["收益法","成本法","比較法","土地開發分析法"],"explains":["收益法可用，但非技術規則明定公共設施保留地之原則方法。","成本法可用，但非技術規則明定之原則方法。","技術規則明定公共設施保留地之估價，原則上以比較法為主，與題目相符。","土地開發分析法適用於以開發為前提之宗地估價，非此之原則方法。"],"correct":2,"note":null},{"id":"VH2_105_28","cat":"H2","year":"105年第28題","q":"林地之估價，其總費用之計算應加計下列何種特殊費用項目？","opts":["管理費","保險費","維修費","造林費及管理費等林業經營相關費用"],"explains":["管理費是一般不動產估價之常規費用，非林地估價之特殊費用項目。","保險費是一般不動產估價之常規費用，非特殊費用項目。","維修費是一般不動產估價之常規費用，非特殊費用項目。","技術規則明定林地之估價，其總費用之計算應加計造林費及管理費等林業經營相關費用，與題目相符。"],"correct":3,"note":null},{"id":"VH2_105_39","cat":"H2","year":"105年第39題","q":"受地層下陷、土壤液化等地質不良情況影響之土地估價，得採何種估價方法評估其工事水利或土壤改良所需成本？","opts":["比較法","收益法","成本法","土地開發分析法"],"explains":["比較法是以交易實例為基礎，非評估改良成本之主要方法。","收益法是以淨收益折現或資本化求取價值，非評估改良成本之方法。","技術規則明定受地層下陷、土壤液化等地質不良情況影響之土地，得採成本法評估其工事水利或土壤改良所需成本，與題目相符。","土地開發分析法適用於以開發為前提之宗地估價，非評估改良成本之方法。"],"correct":2,"note":null},{"id":"VH2_106_13","cat":"H2","year":"106年第13題","q":"公共設施保留地估價，依不動產估價技術規則規定，得以下列何者為比較標的？","opts":["一般建築用地","鄰近之公共設施保留地或毗鄰非公共設施保留地","農業用地","都市計畫保護區土地"],"explains":["一般建築用地使用性質與公共設施保留地差異較大，非首選。","技術規則第90條明定公共設施保留地比較標的應選取「鄰近之公共設施保留地或毗鄰非公共設施保留地」，本選項符合規則明文。惟本題官方答案標示為D，與規則明文及112年第19題（正解為A，內容同B）相互矛盾，本題疑有標記誤差，建議對照官方詳解確認。","農業用地非規則明定之比較標的選項。","依官方標示為本題正解，但與技術規則第90條明文及112年同主題題目正解相矛盾，建議考生留意此題存在潛在標記誤差，以官方詳解為準。"],"correct":3,"note":"本題依官方答案表標示D，惟一般而言公共設施保留地之比較標的應優先選取「鄰近之公共設施保留地或毗鄰非公共設施保留地」，建議考生對照規則原文確認本題鑑別細節。"},{"id":"VH2_106_16","cat":"H2","year":"106年第16題","q":"受污染土地之估價，於成本法估價時，應加計下列何種成本？","opts":["改良成本","污染整治及檢測等相關必要成本","訴訟成本","拆除成本"],"explains":["「改良成本」是廣義描述，非技術規則明定之特定成本名稱。","技術規則明定受污染土地估價，於成本法估價時，應加計污染整治及檢測等相關必要成本，與題目相符。","訴訟成本並非技術規則明定應加計之成本項目。","拆除成本是建物不具使用價值時才需加計，非受污染土地之特定加計項目。"],"correct":1,"note":null},{"id":"VH2_106_33","cat":"H2","year":"106年第33題","q":"鹽田之估價，原則上採下列何種估價方法？","opts":["收益法","成本法","土地開發分析法","比較法"],"explains":["收益法可用，但非技術規則明定鹽田之原則方法。","成本法可用，但非技術規則明定之原則方法。","土地開發分析法適用於以開發為前提之宗地估價，非鹽田之原則方法。","技術規則明定鹽田之估價，原則上以比較法為主，與題目相符。"],"correct":3,"note":null},{"id":"VH2_107_22","cat":"H2","year":"107年第22題","q":"受水患或土壤液化影響之土地進行工事水利或土壤改良所需成本估算時，宜採何種估價方法？","opts":["比較法","成本法","收益法","土地開發分析法"],"explains":["比較法是以交易實例為基礎，非評估改良成本之主要方法。","技術規則明定受水患或土壤液化影響之土地進行工事水利或土壤改良所需成本估算時，宜採成本法，與題目相符。","收益法是以淨收益折現或資本化求取價值，非評估改良成本之方法。","土地開發分析法適用於以開發為前提之宗地估價，非評估改良成本之方法。"],"correct":1,"note":null},{"id":"VH2_110_15","cat":"H2","year":"110年第15題","q":"墳墓用地之估價，下列敘述何者正確？","opts":["適合採用比較法估價","因不具一般市場性，較難以比較法估價","應優先採用收益法估價","應優先採用土地開發分析法估價"],"explains":["技術規則明定墳墓用地因不具一般市場性，較難以比較法估價，本選項稱「適合採用比較法」，與規則相反。","技術規則明定墳墓用地因不具一般市場性，較難以比較法估價，與題目相符。","「應優先採用收益法」並非技術規則對墳墓用地之明確規定。","「應優先採用土地開發分析法」並非技術規則對墳墓用地之明確規定。"],"correct":1,"note":null},{"id":"VH2_112_15","cat":"H2","year":"112年第15題","q":"高爾夫球場用地之估價，原則上較適合採用下列何種估價方法？","opts":["收益法","成本法","比較法","土地開發分析法"],"explains":["收益法可用，但非技術規則明定高爾夫球場用地之原則方法。","成本法可用，但非技術規則明定之原則方法。","技術規則明定高爾夫球場用地之估價，原則上較適合以比較法為主，與題目相符。","土地開發分析法適用於以開發為前提之宗地估價，非高爾夫球場之原則方法。"],"correct":2,"note":null},{"id":"VH2_112_19","cat":"H2","year":"112年第19題","q":"公共設施保留地原則上採比較法估價，其比較標的應如何選取？","opts":["選取鄰近之公共設施保留地或毗鄰非公共設施保留地","選取一般建築用地","選取農業用地","選取都市計畫保護區土地"],"explains":["技術規則第90條明定公共設施保留地比較標的應選取「鄰近之公共設施保留地或毗鄰非公共設施保留地」，與本選項完全相符，即本題正解。","一般建築用地使用性質差異較大，非規則明定之比較標的。","農業用地非規則明定之比較標的選項。","都市計畫保護區土地非規則明定之比較標的選項。"],"correct":0,"note":null},{"id":"VH2_113_15","cat":"H2","year":"113年第15題","q":"高爾夫球場、農場、牧場等特殊用途之土地估價，原則上採何種估價方法？","opts":["收益法","比較法","成本法","土地開發分析法"],"explains":["收益法可用，但非技術規則明定高爾夫球場農場牧場之原則方法。","技術規則明定高爾夫球場、農場、牧場等特殊用途土地之估價，原則上以比較法為主，與題目相符。","成本法可用，但非此類土地之原則方法。","土地開發分析法適用於以開發為前提之宗地估價，非此類土地之原則方法。"],"correct":1,"note":null},{"id":"VH2_114_9","cat":"H2","year":"114年第9題","q":"受地層下陷影響之土地，若需估算其工事水利或土壤改良所需成本，宜採何種估價方法？","opts":["比較法","收益法","成本法","土地開發分析法"],"explains":["比較法是以交易實例為基礎，非評估改良成本之主要方法。","收益法是以淨收益折現或資本化求取價值，非評估改良成本之方法。","技術規則明定受地層下陷影響之土地，若需估算工事水利或土壤改良所需成本，宜採成本法，與題目相符。","土地開發分析法適用於以開發為前提之宗地估價，非評估改良成本之方法。"],"correct":2,"note":null},{"id":"VH3_100_29","cat":"H3","year":"100年第29題","q":"都市更新權利變換中，各權利人應分配之權利價值，係依其更新前權利價值占全部權利人更新前權利價值總和之比率，乘以下列何者計算？","opts":["更新前總成本","更新後實施者實際分配之權利價值總和","更新前公告地價總額","更新後總銷售金額"],"explains":["「更新前總成本」並非技術規則明定權利變換計算中應乘以之基準金額。","技術規則明定各權利人應分配之權利價值＝(該權利人更新前權利價值÷全部權利人更新前權利價值總和)×更新後實施者實際分配之權利價值總和，與本選項相符。","「更新前公告地價總額」並非技術規則明定之計算基準。","「更新後總銷售金額」是毛銷售額，未扣除實施者應得部分，非技術規則明定應分配之基準金額。"],"correct":1,"note":null},{"id":"VH3_102_20","cat":"H3","year":"102年第20題","q":"都市更新權利變換範圍內，土地及建物所有權人應分配之權利價值，依其權利價值占全部權利價值之比率，乘以更新後何種價格估算之總額？","opts":["新成屋之市場價格","重建成本價格","土地公告現值","房屋現值"],"explains":["依技術規則，各所有權人應分配之權利價值係以「更新後不動產之市場價格（新成屋之市場價格）」估算之總額為基礎乘以其權利比率計算，本選項「新成屋之市場價格」即為更新後不動產市場總價值之描述，依官方答案為正確選項。","「重建成本價格」是成本法概念，並非都市更新權利變換採用之分配基準。","「土地公告現值」是稅賦計算基準，並非市場價值基準。","「房屋現值」是稅賦計算概念，並非都市更新權利變換採用之分配基準。"],"correct":0,"note":null},{"id":"VH3_103_36","cat":"H3","year":"103年第36題","q":"都市更新權利變換中，基地價值比率係指土地所有權人應分配之土地價值占下列何者之比率？","opts":["更新後總銷售金額","更新前公告地價","更新前正常市價","權利變換前各土地所有權人權利價值之總和"],"explains":["「更新後總銷售金額」包含實施者應得利潤，並非基地價值比率之正確分母。","「更新前公告地價」是稅賦基準，並非技術規則明定之計算分母。","「更新前正常市價」雖接近，但技術規則明定用語為「權利變換前各土地所有權人權利價值之總和」。","技術規則明定基地價值比率係指土地所有權人應分配之土地價值占「權利變換前各土地所有權人權利價值之總和」之比率，與本選項相符。"],"correct":3,"note":null},{"id":"VH3_109_8","cat":"H3","year":"109年第8題","q":"都市更新權利變換之基地價值比率計算規則，下列敘述何者正確？","opts":["應以權利變換前各土地所有權人權利價值之總和為分母","應以權利變換後實施者分配之權利價值為分母","應以更新單元範圍內土地總面積為分母","應以更新前公告土地現值總額為分母"],"explains":["技術規則明定基地價值比率應以「權利變換前各土地所有權人權利價值之總和」為分母，與本選項相符。","「更新後實施者分配之權利價值」是計算分配金額時乘以的數值，非基地價值比率之分母。","「更新單元範圍內土地總面積」是面積概念，非技術規則明定之計算分母。","「更新前公告土地現值總額」是稅賦基準，非技術規則明定之計算分母。"],"correct":0,"note":null},{"id":"VH3_110_14","cat":"H3","year":"110年第14題","q":"都市更新權利變換範圍內，某土地所有權人之基地權利價值占全部權利人權利價值總和之比率為10%，若更新後實施者實際分配之權利價值總和為5億元，則該所有權人應分配之權利價值為何？","opts":["4,000萬元","4,500萬元","5,000萬元","5,500萬元"],"explains":["4,000萬元計算有誤。","4,500萬元計算有誤。","應分配之權利價值＝10%×5億元＝5,000萬元，與本選項相符。","5,500萬元計算有誤，超出10%×5億之正確結果。"],"correct":2,"note":"應分配權利價值＝5億×10%＝5,000萬元。"},{"id":"VI1_99_28","cat":"I1","year":"99年第28題","q":"計量模型分析法應用於不動產估價時，主要係作為下列何種估價方法之輔助工具？","opts":["成本法","比較法","收益法","土地開發分析法"],"explains":["計量模型分析法並非成本法之輔助工具。","技術規則明定計量模型分析法係作為比較法之輔助工具（運用統計迴歸模型輔助大量比較標的資料分析），與題目相符。","計量模型分析法並非收益法之輔助工具。","計量模型分析法並非土地開發分析法之輔助工具。"],"correct":1,"note":null},{"id":"VI1_100_14","cat":"I1","year":"100年第14題","q":"計量模型分析法於不動產估價中之應用，性質上屬於下列何種估價方法之延伸？","opts":["成本法","收益法","比較法","土地開發分析法"],"explains":["計量模型分析法性質上屬於比較法之延伸，並非成本法之延伸。","計量模型分析法並非收益法之延伸。","技術規則明定計量模型分析法性質上屬於比較法之延伸應用（運用統計迴歸模型對大量比較標的進行量化分析），與題目相符。","計量模型分析法並非土地開發分析法之延伸。"],"correct":2,"note":null},{"id":"VI1_102_25","cat":"I1","year":"102年第25題","q":"採計量模型分析法進行不動產估價時，自變數之樣本數應為自變數個數之多少倍以上？","opts":["3倍","4倍","5倍","10倍"],"explains":["3倍並非技術規則規定之最低樣本數倍數門檻。","4倍並非規則規定之門檻。","技術規則明定採計量模型分析法時，自變數之樣本數應為自變數個數之5倍以上，與題目相符。","10倍超出規則明定之最低門檻（5倍），並非強制要求。"],"correct":2,"note":null},{"id":"VI1_104_29","cat":"I1","year":"104年第29題","q":"計量模型分析法之適用條件，下列敘述何者正確？","opts":["樣本數應為自變數個數之3倍以上","樣本數應為自變數個數之5倍以上","判定係數應大於0.5即可採用","顯著機率應大於5%"],"explains":["規則規定樣本數應為自變數個數之「5倍以上」，並非3倍。","技術規則明定樣本數應為自變數個數之5倍以上，與本選項相符，為正確敘述。","規則規定判定係數應達「0.7以上」，並非大於0.5即可。","規則規定顯著機率應「小於5%」，並非大於5%，方向相反。"],"correct":1,"note":null},{"id":"VI1_104_30","cat":"I1","year":"104年第30題","q":"下列何種情形違反計量模型分析法之適用條件？","opts":["樣本數為自變數個數之6倍","判定係數為0.85","顯著機率為8%","樣本數為自變數個數之10倍"],"explains":["樣本數為自變數個數之6倍，超過規則規定之5倍門檻，符合適用條件。","判定係數0.85，超過規則規定之0.7門檻，符合適用條件。","技術規則規定顯著機率應小於5%，顯著機率8%已超過此上限，違反適用條件，即本題正解。","樣本數為自變數個數之10倍，超過5倍門檻，符合適用條件。"],"correct":2,"note":"顯著機率應小於5%才符合統計顯著性要求，8%已超出門檻，不符合適用條件。"},{"id":"VI1_106_9","cat":"I1","year":"106年第9題","q":"計量模型分析法中，用以衡量模型解釋能力高低之統計指標，稱為：","opts":["樣本數","判定係數","顯著機率","殘差值"],"explains":["樣本數是觀察值數量，用以判斷資料量是否足夠，非衡量模型解釋能力之指標。","技術規則明定判定係數（R²）係用以衡量計量模型解釋能力高低之統計指標（R²愈高，解釋能力愈好），與題目相符。","顯著機率是用以檢定各自變數係數是否具統計顯著性之指標，非衡量整體模型解釋能力之主要指標。","殘差值是實際觀測值與預測值之差，非規則明定衡量模型解釋能力之正式指標。"],"correct":1,"note":null},{"id":"VI1_107_4","cat":"I1","year":"107年第4題","q":"採計量模型分析法估價，若自變數個數為6個，依規則規定樣本數至少應為多少？","opts":["30","18","24","36"],"explains":["依規則規定，樣本數＝6×5＝30，與本選項相符。","18＝6×3，未正確套用5倍規定。","24＝6×4，未正確套用5倍規定。","36＝6×6，超過規則規定5倍之最低要求，本選項數值偏高。"],"correct":0,"note":"樣本數應為自變數個數之5倍以上＝6×5＝30。"},{"id":"VI1_108_21","cat":"I1","year":"108年第21題","q":"計量模型分析法中，判定係數應達多少以上方屬模型解釋能力良好？","opts":["0.5","0.6","0.7","0.9"],"explains":["0.5並非技術規則規定之判定係數門檻，標準過低。","0.6並非規則規定之門檻。","技術規則明定判定係數應達0.7以上方屬模型解釋能力良好，與題目相符。","0.9雖是更嚴格的標準，但規則規定的門檻是0.7以上，並非0.9。"],"correct":2,"note":null},{"id":"VI1_109_20","cat":"I1","year":"109年第20題","q":"下列何者非屬計量模型分析法適用條件之一？","opts":["自變數間應具高度共線性","樣本數為自變數個數之5倍以上","判定係數達0.7以上","顯著機率小於5%"],"explains":["技術規則明定計量模型分析法適用條件之一是自變數間「應避免」高度共線性（而非「應具」），本選項方向完全相反，即本題正解（非屬正確適用條件描述）。","樣本數為自變數個數之5倍以上，是規則明定之適用條件之一，正確。","判定係數達0.7以上，是規則明定之適用條件之一，正確。","顯著機率小於5%，是規則明定之適用條件之一，正確。"],"correct":0,"note":"自變數間應「避免」高度共線性（否則模型估計不穩定），而非「應具」高度共線性，此為敘述錯誤之處。"},{"id":"VI1_111_6","cat":"I1","year":"111年第6題","q":"採計量模型分析法估價，若自變數個數為8個，依規則規定樣本數至少應為多少？","opts":["40","32","24","48"],"explains":["依規則規定，樣本數＝8×5＝40，與本選項相符。","32＝8×4，未正確套用5倍規定。","24＝8×3，未正確套用5倍規定。","48＝8×6，超過規則規定5倍之最低要求，本選項數值偏高。"],"correct":0,"note":"樣本數應為自變數個數之5倍以上＝8×5＝40。"},{"id":"VI1_111_9","cat":"I1","year":"111年第9題","q":"計量模型分析法中，用以檢定模型中各自變數係數是否具統計顯著性之指標，稱為：","opts":["顯著機率","判定係數","樣本數","自變數個數"],"explains":["技術規則明定顯著機率係用以檢定計量模型中各自變數係數是否具統計顯著性之指標（顯著機率愈小，各自變數對不動產價格的影響愈具統計顯著性），與題目相符。","判定係數（R²）是衡量整體模型解釋能力之指標，非檢定各自變數係數是否顯著之指標。","樣本數是觀察值數量，非用以檢定各自變數係數統計顯著性之指標。","自變數個數是模型中解釋變數之數量，非統計顯著性指標。"],"correct":0,"note":null},{"id":"VI1_112_16","cat":"I1","year":"112年第16題","q":"有關計量模型分析法之敘述，下列何者錯誤？","opts":["樣本數應為自變數個數之5倍以上","判定係數越低代表模型解釋能力越好","顯著機率應小於5%","模型用以估計不動產價格與各影響因素間之量化關係"],"explains":["樣本數應為自變數個數之5倍以上，是規則明定之正確適用條件，非本題答案（本題問「何者錯誤」）。","技術規則明定判定係數（R²）愈「高」代表模型解釋能力愈好（而非愈低），本選項方向完全相反，即本題正解。","顯著機率應小於5%，是規則明定之正確適用條件，敘述正確。","模型用以估計不動產價格與各影響因素間之量化關係，為正確敘述。"],"correct":1,"note":"判定係數越高（接近1）才代表模型解釋能力越好，此為敘述錯誤之處。"}];

const CAT_LABELS={"A1":"A1 估價原則","A2":"A2 價格種類","A3":"A3 影響因素","A4":"A4 估價程序","B1":"B1 比較法","B2":"B2 比較法應用","C1":"C1 成本法基礎","C2":"C2 折舊計算","D1":"D1 收益法基礎","D2":"D2 資本化率","D3":"D3 DCF","E1":"E1 土地開發","F1":"F1 租金估計","G1":"G1 樓層效用比","H1":"H1 特殊宗地①","H2":"H2 特殊宗地②","H3":"H3 都更","I1":"I1 CAMA"};
const LB=["A","B","C","D"];
let MASTERY={};
try{MASTERY=JSON.parse(localStorage.getItem("appraisal_card_mastery")||"{}");}catch(e){}
let filtered=[...ITEMS],idx=0,order=[],shuffled=false,answered=false;
function saveM(){try{localStorage.setItem("appraisal_card_mastery",JSON.stringify(MASTERY));}catch(e){}}
function cur(){return filtered[(order.length?order:filtered.map((_,i)=>i))[idx]];}
function mIcon(id){const s=MASTERY[id];return s==="mastered"?"✅":s==="review"?"🔄":"🔲";}
function toggleM(id){
  const s=MASTERY[id];
  MASTERY[id]=s==="mastered"?"review":s==="review"?"":"mastered";
  saveM();
  document.getElementById("mBtn1").textContent=mIcon(id);
  document.getElementById("mBtn2").textContent=mIcon(id);
  stats();
}
function stats(){
  let ok=0,ng=0,bl=0;
  filtered.forEach(it=>{const s=MASTERY[it.id];if(s==="mastered")ok++;else if(s==="review")ng++;else bl++;});
  document.getElementById("okN").textContent=ok;
  document.getElementById("ngN").textContent=ng;
  document.getElementById("blkN").textContent=bl;
  document.getElementById("curIdx").textContent=idx+1;
  document.getElementById("tot").textContent=filtered.length;
  document.getElementById("pFill").style.width=(filtered.length?((idx+1)/filtered.length*100):0)+"%";
}
function render(){
  const it=cur();if(!it)return;
  document.getElementById("card").classList.remove("flipped");
  answered=false;
  document.getElementById("cBadge").textContent=CAT_LABELS[it.cat]||it.cat;
  document.getElementById("cBadge2").textContent=CAT_LABELS[it.cat]||it.cat;
  document.getElementById("yrBadge").textContent=it.year;
  document.getElementById("yrBadge2").textContent=it.year;
  document.getElementById("qText").textContent=it.q;
  document.getElementById("mBtn1").textContent=mIcon(it.id);
  document.getElementById("mBtn2").textContent=mIcon(it.id);
  document.getElementById("hint").hidden=false;
  const ol=document.getElementById("optList");ol.innerHTML="";
  (it.opts||[]).forEach((o,i)=>{
    const d=document.createElement("div");
    d.className="opt";d.dataset.i=i;
    d.innerHTML="<span class='ol'>"+LB[i]+"</span><span>"+o+"</span>";
    d.addEventListener("click",()=>pick(i));
    ol.appendChild(d);
  });
  const el=document.getElementById("exList");el.innerHTML="";
  (it.explains||[]).forEach((ex,i)=>{
    const d=document.createElement("div");
    d.className="ex"+(i===it.correct?" is-ok":"");
    d.innerHTML="<span class='exl'>"+LB[i]+"</span><span>"+ex+"</span>";
    el.appendChild(d);
  });
  const ne=document.getElementById("noteEl");
  if(it.note){ne.textContent="💡 "+it.note;ne.hidden=false;}else{ne.hidden=true;}
  document.getElementById("prevBtn").disabled=idx===0;
  document.getElementById("nextBtn").disabled=idx===filtered.length-1;
  stats();
}
function pick(chosen){
  if(answered)return;answered=true;
  const it=cur();
  document.querySelectorAll(".opt").forEach((el,i)=>{
    el.classList.add("locked");
    if(i===it.correct)el.classList.add("correct");
    else if(i===chosen&&chosen!==it.correct)el.classList.add("wrong");
  });
  document.getElementById("hint").hidden=true;
  const b=document.getElementById("ansBanner");
  if(chosen===it.correct){b.className="ans-banner ok";b.textContent="✓ 答對！正確答案是 "+LB[it.correct];}
  else{b.className="ans-banner ng";b.textContent="✗ 答錯。正確答案是 "+LB[it.correct];}
  setTimeout(()=>document.getElementById("card").classList.add("flipped"),350);
}
document.getElementById("mBtn1").addEventListener("click",()=>toggleM(cur().id));
document.getElementById("mBtn2").addEventListener("click",()=>toggleM(cur().id));
document.getElementById("backBtn").addEventListener("click",()=>document.getElementById("card").classList.remove("flipped"));
document.getElementById("prevBtn").addEventListener("click",()=>{if(idx>0){idx--;render();}});
document.getElementById("nextBtn").addEventListener("click",()=>{if(idx<filtered.length-1){idx++;render();}});
document.getElementById("shuffleBtn").addEventListener("click",()=>{
  shuffled=!shuffled;
  document.getElementById("shuffleBtn").classList.toggle("on",shuffled);
  order=shuffled?[...Array(filtered.length).keys()].sort(()=>Math.random()-.5):[];
  idx=0;render();
});
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    const cat=chip.dataset.cat;
    filtered=cat==="ALL"?[...ITEMS]:ITEMS.filter(it=>it.cat===cat);
    document.getElementById("fLabel").textContent=cat==="ALL"?"全科":(CAT_LABELS[cat]||cat);
    order=[];idx=0;shuffled=false;
    document.getElementById("shuffleBtn").classList.remove("on");
    render();
  });
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="l"){if(idx<filtered.length-1){idx++;render();}}
  if(e.key==="ArrowLeft"||e.key==="h"){if(idx>0){idx--;render();}}
  if(e.key===" "){e.preventDefault();document.getElementById("card").classList.toggle("flipped");}
  if(e.key==="m")toggleM(cur().id);
});
render();
</script>
