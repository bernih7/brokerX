 host.innerHTML='<div class="note">申論兩題共 50 分。建議先自己寫在紙上，再展開四段式參考解答對照。</div>';
 D.E.forEach(function(x){
  var c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="qn"></div><div class="stem"></div><details><summary>展開四段式參考解答</summary><div class="ans"></div></details><div class="warn"></div>';
  c.querySelector(".qn").textContent=x.t;c.querySelector(".stem").textContent=x.q;
  var a=c.querySelector(".ans");
  x.parts.forEach(function(p){var h=document.createElement("div");h.className="ph";h.textContent=p[0];var b=document.createElement("div");b.className="pb";b.textContent=p[1];a.appendChild(h);a.appendChild(b)});
  c.querySelector(".warn").textContent="⚠️ "+x.warn;host.appendChild(c)})}
function mkR(host){
 host.innerHTML="";var N=D.Q.length;
 var tot={},ok={},n=0;
 D.Q.forEach(function(q){tot[q.ch]=(tot[q.ch]||0)+1;if(st[q.n]!==undefined)n++;if(st[q.n])ok[q.ch]=(ok[q.ch]||0)+1});
 var c=document.createElement("div");c.className="card";
 var h='<div class="qn">分篇答對率</div>';
 if(n<N)h+='<div class="note">尚有 '+(N-n)+' 題未作答，結果僅供參考。</div>';
 Object.keys(NAMES).forEach(function(k){if(!tot[k])return;var t=tot[k],o=ok[k]||0,p=Math.round(o*100/t);
  h+='<div class="row"><span>'+NAMES[k]+'</span><span>'+o+'/'+t+'（'+p+'%）</span></div><div class="bar"><i class="'+(p<70?'lo':'')+'" style="width:'+p+'%"></i></div>'});
 c.innerHTML=h;host.appendChild(c);
 var wr=D.Q.filter(function(q){return st[q.n]===false});
 var cnt={A:0,B:0,C:0,N:0};wr.forEach(function(q){cnt[cl[q.n]||"N"]++});
 var d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="qn">錯題歸類</div><div class="note">A 法條混淆 '+cnt.A+'｜B 粗心 '+cnt.B+'｜C 真的不熟 '+cnt.C+'｜未歸類 '+cnt.N+'</div><div class="ls"></div>';
 var ls=d.querySelector(".ls");
 if(!wr.length){ls.textContent=n?"目前沒有答錯的題目。":"尚未作答。"}
 wr.forEach(function(q){var p=document.createElement("div");p.className="row";p.style.margin="6px 0";
  p.textContent="第"+q.n+"題｜"+q.sec+"｜"+(cl[q.n]?cl[q.n]+"型":"未歸類");ls.appendChild(p)});
 host.appendChild(d);
 var e=document.createElement("div");e.className="card";
 e.innerHTML='<div class="qn">怎麼讀這份結果</div><div class="note">單一篇低於 70%（紅條）＝優先補強；A 型多＝做混淆對比表；C 型多＝回重點筆記重讀；B 型多＝放慢題幹審題。把結果貼回專案對話，我據此調整後續卷。</div>';
 host.appendChild(e)}

mkQ(qHost);go(0);
