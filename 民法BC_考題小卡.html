<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="bx-vp.js"></script>
<title>民法概要｜歷屆考題小卡（B+C＋常考其他之債）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F1E6;--paper-deep:#EAE6D6;--ink:#25302C;--ink-soft:#66726B;--rule:#DDD6C0;--stamp:#A8402B;--gold:#B8782E;--green:#35693F;--blue:#3A5A7A;--orange:#B8782E;--purple:#7A4F8A;--red:#A8402B;--surf:#FFFEFA;--onc:#FFFFFF;--t-red:var(--t-red);--t-green:#E9F1E6;--t-gold:#FAF0DC;--t-blue:#E8EEF4;--t-zebra:#FAF7EE;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#A5B1A8;--rule:#34403A;--stamp:#E8806A;--gold:#D9A863;--green:#7FC18A;--blue:#8DB0CE;--orange:#D9A863;--purple:#C3A0D4;--red:#E8806A;--surf:#1F2723;--onc:#10201B;--t-red:#3A2420;--t-green:#1F3326;--t-gold:#3A2F1C;--t-blue:#1E2D3A;--t-zebra:#1B221E;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161C19;--paper-deep:#1F2723;--ink:#E7ECE6;--ink-soft:#A5B1A8;--rule:#34403A;--stamp:#E8806A;--gold:#D9A863;--green:#7FC18A;--blue:#8DB0CE;--orange:#D9A863;--purple:#C3A0D4;--red:#E8806A;--surf:#1F2723;--onc:#10201B;--t-red:#3A2420;--t-green:#1F3326;--t-gold:#3A2F1C;--t-blue:#1E2D3A;--t-zebra:#1B221E;color-scheme:dark}
#bxth{position:fixed;top:10px;right:12px;z-index:70;padding:4px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--surf);color:var(--ink);font-size:12px;cursor:pointer;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.15)}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(188,138,46,0.06), transparent 40%),
    radial-gradient(circle at 90% 95%, rgba(168,64,43,0.05), transparent 45%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 48px;
}
.wrap{width:100%;max-width:560px;}
header{text-align:center;margin-bottom:14px;}
.case-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:12px;
  letter-spacing:.12em;color:var(--stamp);
  border:1px solid var(--stamp);border-radius:999px;
  padding:3px 12px;margin-bottom:10px;
}
h1{
  font-family:'Noto Serif TC',serif;font-weight:900;
  font-size:21px;letter-spacing:.04em;line-height:1.5;
}
h1 .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);
  letter-spacing:.06em;margin-top:4px;font-family:'Noto Sans TC',sans-serif;}

/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 6px;}
.chip{
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--surf);color:var(--ink-soft);
  cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;
}
.chip.active{color:#fff;border-color:transparent;}
.filter-row{display:flex;justify-content:center;margin-bottom:14px;}
.filter-row .chip{border-color:var(--ink);color:var(--ink);font-weight:700;}
.filter-row .chip.active{background:var(--ink);color:var(--onc);}

/* progress */
.progress{
  text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:13px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:10px;
}
.progress b{color:var(--ink);font-size:15px;}
.progress-bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 auto 18px;max-width:200px;}
.progress-fill{height:100%;background:var(--stamp);transition:width .25s ease;}

/* card */
.scene{perspective:1800px;width:100%;}
.card{
  position:relative;width:100%;min-height:520px;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;border:1.5px solid var(--rule);
  background:var(--surf);display:flex;flex-direction:column;
  padding:20px;box-shadow:0 4px 18px rgba(42,39,34,0.07);
  overflow-y:auto;
}
.face.back{transform:rotateY(180deg);background:var(--paper-deep);}
.face.back{border-left:6px solid var(--cat-color,var(--stamp));}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.cat-badge{
  font-size:11px;font-weight:700;color:#fff;padding:4px 12px;border-radius:999px;
  letter-spacing:.06em;font-family:'Noto Serif TC',serif;
}
.year-badge{
  font-size:11px;font-weight:700;color:var(--ink-soft);border:1px solid var(--rule);
  border-radius:999px;padding:3px 10px;font-family:'Noto Serif TC',serif;
}
.mastery-badge{font-size:18px;line-height:1;}
.q-text{font-size:14px;line-height:1.8;margin-bottom:14px;font-weight:500;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;gap:8px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--rule);
  background:var(--surf);font-size:13px;line-height:1.6;cursor:pointer;transition:all .15s ease;
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--stamp);background:var(--t-red);}
.opt .letter{
  font-family:'Noto Serif TC',serif;font-weight:900;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;letter-spacing:.1em;font-family:'Noto Serif TC',serif;}

/* back face */
.answer-banner{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:15px;
  padding:10px;border-radius:8px;margin-bottom:12px;
}
.answer-banner.correct{background:var(--t-green);color:var(--green);border:1.5px solid var(--green);}
.answer-banner.wrong{background:var(--t-red);color:var(--stamp);border:1.5px solid var(--stamp);}
.exp-list{display:flex;flex-direction:column;gap:8px;}
.exp-item{padding:9px 10px;border-radius:8px;font-size:12.5px;line-height:1.75;border:1.5px solid var(--rule);background:var(--surf);}
.exp-item.right{border-color:var(--green);background:var(--t-green);}
.exp-item .exp-head{font-weight:900;font-family:'Noto Serif TC',serif;margin-bottom:3px;}
.exp-item.right .exp-head{color:var(--green);}
.exp-item:not(.right) .exp-head{color:var(--stamp);}

/* controls */
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{
  font-family:'Noto Serif TC',serif;font-weight:700;font-size:14px;
  border:1.5px solid var(--ink);background:var(--surf);color:var(--ink);
  border-radius:10px;padding:10px 16px;cursor:pointer;transition:all .15s ease;
}
.btn:hover{background:var(--ink);color:var(--onc);}
.btn.primary{background:var(--stamp);border-color:var(--stamp);color:var(--onc);}
.btn.primary:hover{background:color-mix(in srgb,var(--stamp) 78%,#000);}
.btn.green{border-color:var(--green);color:var(--green);}
.btn.green:hover{background:var(--green);color:var(--onc);}
.btn.icon{padding:10px 14px;}

.quiz-stats{
  text-align:center;font-size:13px;color:var(--ink-soft);margin-top:14px;
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
}
.quiz-stats b{font-family:'Noto Serif TC',serif;}
.quiz-stats .ok{color:var(--green);}
.quiz-stats .ng{color:var(--stamp);}

footer{margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.12em;line-height:2;}
footer .reset{text-decoration:underline;cursor:pointer;color:var(--ink-soft);background:none;border:none;font-size:11px;letter-spacing:.12em;font-family:inherit;}
</style>
<script src="bxm-use.js"></script>
<script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}if(s)document.documentElement.setAttribute("data-theme",s)})();</script>
<script src="bxm-exp.js"></script><script src="bxm-links.js"></script></head>
<body>
<div class="wrap">
  <header>
    <div class="case-tag">案號 B＋C・歷屆試題精選</div>
    <h1>民法概要 考題小卡
      <span class="sub">99-114年不動產經紀人考題・共 20 題</span>
    </h1>
  </header>

  <div class="filter-row" id="resetRow"><div class="chip active" id="resetBtn">全部分類</div></div>
  <div class="chips" id="chips"></div>

  <div class="progress"><b id="curNum">1</b> / <span id="totalNum">20</span>　<span id="catName"></span></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="top-row">
          <span class="cat-badge" id="badgeFront"></span>
          <span class="year-badge" id="yearFront"></span>
          <span class="mastery-badge" id="badgeMasteryFront"></span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="opt-list" id="optList"></div>
        <div class="hint">點選一個選項　看詳解 ▸</div>
      </div>
      <div class="face back">
        <div class="top-row">
          <span class="cat-badge" id="badgeBack"></span>
          <span class="year-badge" id="yearBack"></span>
          <span class="mastery-badge" id="badgeMasteryBack"></span>
        </div>
        <div class="answer-banner" id="answerBanner"></div>
        <div class="exp-list" id="expList"></div>
        <div class="hint">◂ 點擊卡片　回題目</div>
      </div>
    </div>
  </div>

  <div class="controls" id="masteryControls">
    <button class="btn icon" id="markReview">🔄 待複習</button>
    <button class="btn green icon" id="markMastered">✅ 已掌握</button>
  </div>

  <div class="controls">
    <button class="btn icon" id="prevBtn">◂ 上一題</button>
    <button class="btn primary" id="shuffleBtn">🔀 隨機</button>
    <button class="btn icon" id="nextBtn">下一題 ▸</button>
  </div>

  <div class="quiz-stats" id="quizStatsBar">
    <span>本輪：<b class="ok" id="quizOk">0</b> 對　<b class="ng" id="quizNg">0</b> 錯</span>
    <span style="cursor:pointer;text-decoration:underline;" id="resetQuiz">重新測驗</span>
  </div>
  <div class="quiz-stats" id="overallStatsBar">
    <span>累積：已作答 <b id="totalAttempts">0</b> 題次・正確率 <b id="overallAcc">—</b>・已掌握 <b id="masteredCount">0</b>/<b id="totalCards">0</b></span>
  </div>

  <footer>不動產經紀人考試・民法概要｜每題附A-D逐選項詳解，點選答案後自動判對錯並標記掌握度<br>
    <button class="reset" id="resetMastery">清除所有「已掌握」標記</button>
  </footer>
</div>

<script>
const CARDS = [{"id": "E01", "cat": "契約成立", "year": "112年第5題", "q": "甲向乙推銷一只古董錶，甲出價新臺幣（下同）10萬元問乙要不要買，乙答覆說：「如果8萬元我就買」，請問乙的答覆性質上為何？", "opts": ["要約之引誘", "承諾", "要約", "意思實現"], "correct": 2, "exps": ["要約引誘是邀請他人向自己為要約（如價目表寄送、一般廣告，§154 Ⅱ），本題乙已明確表示「8萬元我就買」，內容具體、可一經承諾即成立契約，不是單純邀請。", "承諾須對原要約為完全同意；乙將價金由10萬元改為8萬元，已變更要約內容，依§160 Ⅱ不是承諾。", "依§160 Ⅱ：將要約擴張、限制或為其他變更而承諾者，視為拒絕原要約而為新要約；乙把10萬元改為8萬元，即為（反）要約，正確。", "意思實現（§161 Ⅰ）：依習慣或事件性質承諾無須通知者，在相當時期內有可認為承諾之事實時，契約即成立（如逕行履行）；本題乙只是以言語表示「8萬元就買」，並非以履行等事實承諾，不是意思實現。"], "core": ["乙表示具體，不是單純邀請", "變更價金，不是承諾", "變更要約而承諾視為新要約", "乙以言語表示，非以事實承諾"], "key": [["內容具體"], ["已變更要約內容"], ["視為拒絕原要約", "為新要約"], ["以言語表示"]], "tk": ["ng", "ng", "ok", "ng"]}, {"id": "E02", "cat": "契約成立", "year": "101年第3題", "q": "甲當面向乙表示願以一千萬元出售甲所有之A房屋予乙，乙當場未置可否，經三日後乙回覆甲願以一千萬元購買A屋。就甲、乙各自之意思表示，下列敘述何者最正確？", "opts": ["甲之意思表示為要約，乙之意思表示為承諾", "甲之意思表示為要約引誘，乙之意思表示為要約", "甲之意思表示為要約，乙之意思表示為要約引誘", "甲之意思表示為要約，乙之意思表示為新要約"], "correct": 3, "exps": ["乙三日後才回覆，已逾對話要約應即時承諾之期間（§156），不是有效承諾。", "甲所為特定價格與標的之表示是要約，並非要約引誘。", "乙之回覆不是要約引誘，而是遲到之承諾，視為新要約。", "§156 對話要約須立時承諾，否則失效；§160Ⅰ 遲到之承諾視為新要約。"], "core": ["三日後才回覆，不是有效承諾", "特定價格標的之表示是要約", "乙回覆是遲到承諾，視為新要約", "遲到之承諾視為新要約"], "key": [["應即時承諾", "不是有效承諾"], ["特定價格與標的", "是要約"], ["遲到之承諾", "視為新要約"], ["須立時承諾", "遲到之承諾", "視為新要約"]], "tk": ["ng", "ng", "ng", "ok"], "trap": "對話要約→當場不承諾即失效；遲到的承諾＝新要約（§160Ⅰ）。陷阱：誤把遲到承諾當有效承諾。"}, {"id": "E03", "cat": "契約成立", "year": "99年第11題", "q": "甲欲購買乙所有房屋1棟，經數次與乙磋商之後，雙方同意該屋以500萬元成交，並詳細約定付款及交屋、移轉所有權方式，為求慎重並由丙丁2人擔任見證人，且言明為免日後爭議，應將約定內容寫成契約書。嗣後因乙反悔，結果連契約書都無法完成。則下列敘述何者正確？", "opts": ["因為無法完成契約書，因此甲乙之契約不成立", "甲如果已經給付部分價金，應以不當得利請求返還", "甲如能證明與乙已有訂立契約之合意，仍得請求乙履行", "甲為了使乙履行契約，應先請求乙完成契約書"], "correct": 2, "exps": ["§166 約定須用書面者，未完成前僅推定契約不成立，並非當然不成立。", "甲能證明契約已成立，則價金給付有債之原因，不是不當得利。", "§166 推定可被推翻，甲如證明雙方已達成合意，仍得請求履行。", "買賣為諾成契約（§345），無須先完成契約書才可請求履行。"], "core": ["未完成書面只推定不成立", "契約成立，付款有法律原因", "§166推定可推翻，得請求履行", "買賣是諾成契約，不需先寫約"], "key": [["推定契約不成立"], ["有債之原因"], ["推定可被推翻"], ["諾成契約"]], "tk": ["ng", "ng", "ok", "ng"], "trap": "§166：約定方式→推定未成立，可舉反證推翻。陷阱：把「推定」當成「確定」。"}, {"id": "E04", "cat": "買賣", "year": "102年第4題", "q": "甲以新臺幣1000萬元向乙購買某特定房屋，買賣契約何時成立？", "opts": ["甲交付新臺幣1000萬元於乙時", "乙將該特定房屋交付於甲時", "甲、乙完成交屋及付清價金時", "甲、乙就房屋及價金互相同意時"], "correct": 3, "exps": ["交付價金是「履行」契約的行為，並非契約「成立」時點，成立不需先交付。", "交付房屋同樣是履行行為，非契約成立要件。", "買賣契約不以「完成交屋及付清價金」為成立要件，成立遠早於此。", "依§345Ⅱ，當事人就「標的物」及「價金」互相同意時，買賣契約即為成立（諾成契約），正確。買賣是最典型的諾成契約：意思合致→成立→各負交付義務。"], "core": ["交付價金是履行，不是成立", "交付房屋是履行，非成立要件", "成立不以交屋付清為要件", "標的物與價金合意即成立"], "key": [["「履行」契約", "成立不需先交付"], ["履行行為"], ["成立遠早於此"], ["互相同意時", "諾成契約"]], "tk": ["ng", "ng", "ng", "ok"]}, {"id": "E05", "cat": "買賣", "year": "109年第3題", "q": "甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？", "opts": ["於甲與乙簽訂汽車買賣契約時起，由乙承受", "自該車辦理過戶登記於乙時，由乙承受", "自該車交付於乙時起，由乙承受", "於乙支付價金完畢時，由乙承受"], "correct": 2, "exps": ["買賣契約成立時，危險尚未移轉（交付前仍在甲），成立時由甲承受。", "動產危險移轉以「交付」為準（§373），並非以登記（過戶）為準；不動產所有權移轉以登記，但危險移轉仍以「交付」為準，選項錯誤。", "§373，買賣標的物之利益及危險，自「交付」時起由買受人（乙）承受，無特別約定時以交付為準，正確。", "價金支付非危險移轉的依據，依法以交付為準，選項錯誤。"], "core": ["訂約時危險尚未移轉", "危險移轉以交付為準，非登記", "利益危險自交付時移轉", "付清價金非危險移轉依據"], "key": [["危險尚未移轉", "成立時由甲承受"], ["以「交付」為準", "並非以登記"], ["自「交付」時起"], ["以交付為準"]], "tk": ["ng", "ng", "ok", "ng"]}, {"id": "E06", "cat": "買賣", "year": "109年第6題", "q": "下列關於定金之敘述何者正確？", "opts": ["訂約當事人之一方，由他方受有定金時，其契約視為成立", "定金為諾成契約，於當事人約定時即成立", "契約因可歸責於付定金當事人之事由，致不能履行時，定金不得請求返還", "契約因不可歸責於雙方當事人之事由，致不能履行時，定金視為債務不履行損害賠償之總額"], "correct": 2, "exps": ["§248：由他方受有定金時，是「推定」契約成立，並非視為成立。", "定金契約為要物契約，須交付定金才成立，並非諾成。", "§249 (2)：契約因可歸責於付定金當事人之事由致不能履行時，定金不得請求返還。", "§249 (4)：契約因不可歸責於雙方之事由致不能履行時，定金應返還。"], "core": ["受定金是推定成立，非視為", "定金契約是要物契約", "可歸責付定金方，定金不得返還", "不可歸責雙方時定金應返還"], "key": [["「推定」契約成立"], ["要物契約"], ["付定金當事人", "不得請求返還"], ["定金應返還"]], "tk": ["ng", "ng", "ok", "ng"], "trap": "定金四種：成立推定（§248）；付定金方可歸責→沒收；受定金方可歸責→加倍返還；雙方不可歸責→返還（§249）。"}, {"id": "E07", "cat": "租賃", "year": "109年第8題", "q": "依我國民法之規定，下列關於租賃契約之敘述何者正確？", "opts": ["出租人將租賃之房屋交付承租人後，非經承租人同意，不得將其所有權讓與第三人", "出租人出賣租賃之房屋時，承租人有依同樣條件優先承買之權利", "除有反對之約定外，承租人依法得將其一部分轉租於他人", "房屋租賃之租金，當事人得因其價值之昇降，聲請法院增減之，但以定期租賃為限"], "correct": 2, "exps": ["§425 I 買賣不破租賃：房屋交付後出租人讓與所有權，租約對受讓人繼續存在，無須承租人同意。", "一般房屋租賃之承租人無優先承買權；§426-2 的優先承買權僅限於租用基地建築房屋之情形。", "§443 I 但書：租賃物為房屋者，除有反對約定外，承租人得將其一部分轉租他人。", "§442：不動產租賃租金得聲請法院增減，但其租賃定有期限者，不在此限，故並非以定期租賃為限（反而排除之）。"], "core": ["讓與所有權無須承租人同意", "一般房屋承租人無優先承買權", "房屋除反對約定外得一部轉租", "定期租賃反被排除，非以之為限"], "key": [["繼續存在", "無須承租人同意"], ["無優先承買權", "租用基地建築房屋"], ["除有反對約定外", "一部分轉租"], ["定有期限者", "不在此限"]], "tk": ["ng", "ng", "ok", "ng"], "trap": "房屋「一部轉租」可，全部轉租須經承諾。陷阱：§442 增減租金只適用不定期租賃；優先承買權是基地租賃才有。"}, {"id": "E08", "cat": "租賃", "year": "99年第17題", "q": "以下有關租賃關係之敘述何者正確？", "opts": ["租賃物如有修繕之必要，基於使用者付費之原則，應由承租人負擔修繕之費用", "承租人有使用收益租賃物之權利，所以可以自行將房間分租，當二房東", "甲將其房屋出租與乙，言明租期3年，有訂立契約書但未公證。至第2年時甲將房屋所有權讓與丙，乙得向丙主張該租賃契約仍存在", "租賃之房屋因電線走火發生火災，房屋因而受損時，因承租人未盡善良管理人之責，應負損害賠償責任"], "correct": 2, "exps": ["§429 I：租賃物修繕除契約另有訂定或習慣外，由出租人負擔。", "§443 I：承租人非經出租人承諾，不得將租賃物轉租於他人；但書僅限「房屋」之「一部分」且「無反對之約定」時才可轉租。選項把轉租的依據說成「承租人有使用收益權，所以可以」，並以「當二房東」概括表示可自行轉租，忽略原則須經承諾及但書的兩個條件，故不成立（對照 109-8：附上「除有反對之約定外、一部分」條件的敘述才正確）。", "§425 I：租賃物交付後所有權讓與第三人，租賃契約對受讓人繼續存在；本題期限3年，未逾§425 II 之5年限制，雖未公證仍適用。", "§434：承租人失火僅就重大過失負賠償責任，單純未盡善良管理人注意不足以負責。"], "core": ["修繕原則上由出租人負擔", "轉租原則上須經出租人承諾", "交付後讓與，租約對受讓人存續", "失火僅就重大過失負賠償責任"], "key": [["由出租人負擔"], ["非經出租人承諾", "不得將租賃物轉租"], ["繼續存在", "雖未公證仍適用"], ["重大過失"]], "tk": ["ng", "ng", "ok", "ng"], "trap": "白話：買賣不破租賃——房子換主人，租約照舊，但未公證且逾5年或不定期者例外（§425 II）。陷阱：失火責任限重大過失。"}, {"id": "E09", "cat": "契約效力與消滅", "year": "102年第1題", "q": "甲向乙建設公司購買預售屋一戶，約定甲應依已完成之工程進度所定付款明細表之規定於工程完工後繳款，半年後乙建設公司資金週轉不靈，財產遭法院查封，甲是否應繼續繳納約定的工程款？", "opts": ["資金週轉不靈，屬可歸責於乙建設公司之事由，甲可拒絕繳納已完工的工程款", "因甲無過失，可免給付之義務，甲可拒絕繳納已完工的工程款", "基於買賣契約，甲得向乙建設公司主張同時履行抗辯，拒絕繳納已完工的工程款", "甲可主張在乙建設公司未繼續進行工程或提出擔保前，得拒絕繳納已完工的工程款"], "correct": 3, "exps": ["乙週轉不靈並非給付不能，乙之債務尚在；甲不得僅因此拒絕繳款，而須依 §265 主張不安抗辯。", "§225 免給付義務須因給付不能且不可歸責；甲之給付（付款）並未不能，不能以無過失免除。", "§264 I 但書：甲依約有先為給付之義務，不得主張同時履行抗辯。", "§265：應先為給付者，若他方財產於訂約後顯形減少而有難為對待給付之虞，他方未為對待給付或提出擔保前，得拒絕自己之給付。"], "core": ["週轉不靈並非給付不能", "付款並未不能，不能以無過失免除", "甲先為給付，不得同時履行抗辯", "先給付者得主張不安抗辯"], "key": [["並非給付不能", "不安抗辯"], ["並未不能"], ["有先為給付之義務"], ["顯形減少", "提出擔保前"]], "tk": ["ng", "ng", "ng", "ok"], "trap": "先給付義務人的保護工具是 §265 不安抗辯，不是 §264 同時履行。陷阱：同時履行要「雙方同時」，先給付義務就不適用。"}, {"id": "E10", "cat": "契約效力與消滅", "year": "100年第6題", "q": "甲向乙買一台液晶電視，約定一手交錢一手交貨，於乙未交付液晶電視前，當乙向甲請求價金之支付時，甲得主張：", "opts": ["撤銷權", "解除權", "不安抗辯權", "同時履行抗辯權"], "correct": 3, "exps": ["撤銷權須有意思表示瑕疵等事由，本題無。", "解除權須有法定或約定解除事由，本題無。", "不安抗辯權（§265）適用於有先為給付義務者，本題為同時交換。", "§264Ⅰ 因契約互負債務者，於他方未為對待給付前得拒絕自己之給付。"], "core": ["無意思表示瑕疵，無撤銷權", "無法定或約定解除事由", "不安抗辯限有先為給付義務者", "互負債務得拒絕自己之給付"], "key": [["意思表示瑕疵"], ["解除事由"], ["有先為給付義務者", "同時交換"], ["互負債務", "未為對待給付前"]], "tk": ["ng", "ng", "ng", "ok"], "trap": "同時履行（§264）＝一手交錢一手交貨；不安抗辯（§265）＝有先給付義務、對方財產顯形減少。"}, {"id": "E11", "cat": "契約效力與消滅", "year": "109年第7題", "q": "甲借給乙100萬元，借期屆至，甲請求乙返還100萬元借款，乙因此開立100萬元之本票交由甲受領。下列敘述，何者正確？", "opts": ["甲所受領乙開立的100萬元本票，是債之內容更改", "甲所受領乙開立的100萬元本票，是抵銷", "甲所受領乙開立的100萬元本票，是代物清償", "甲所受領乙開立的100萬元本票，是新債清償"], "correct": 3, "exps": ["債之更改是以新債務取代舊債務、使舊債務消滅；但依§320，因清償債務而對債權人負擔新債務者，除當事人另有意思表示外，舊債務並不消滅，本題無使舊債務消滅之意思表示，不能認為更改。", "抵銷（§334）須二人互負債務、給付種類相同且均屆清償期；本題只有乙對甲負借款債務，甲對乙並無相對債務，無從抵銷。", "代物清償（§319）是債權人受領「他種給付」以代原定給付，債之關係即消滅；本題乙只是開立本票（負擔新債務），並非已以他種給付取代借款，且本票若不獲兌現，借款仍在，故非代物清償。", "新債清償（§320）：因清償債務而對債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，舊債務仍不消滅；乙為清償100萬元借款而開立100萬元本票，即屬此類，正確。"], "core": ["舊債務不消滅，不是更改", "甲對乙無相對債務，無從抵銷", "開本票是負擔新債，非代物清償", "為清償舊債而負新債是新債清償"], "key": [["舊債務並不消滅"], ["二人互負債務", "並無相對債務"], ["「他種給付」", "負擔新債務"], ["新債清償", "舊債務仍不消滅"]], "tk": ["ng", "ng", "ng", "ok"]}, {"id": "E12", "cat": "委任與居間", "year": "109年第11題", "q": "關於委任契約受任人之報酬，下列敘述，何者錯誤？", "opts": ["委任關係因可歸責於受任人之事由，而於委任事務處理完畢前經終止者，受任人仍得就已經處理之部分比例請求報酬", "受任人受有報酬之注意義務，高於受任人未受報酬之注意義務", "當事人縱未約定報酬，但依交易習慣或委任事務之性質應給與報酬者，受任人得請求報酬", "除契約另有規定外，原則上於委任關係終止時，受任人須明確報告始末後才能請求報酬"], "correct": 0, "exps": ["§548 II：僅「非可歸責於受任人」之事由而提前終止時，受任人才得就已處理部分比例請求報酬；因可歸責於受任人而終止者不適用。", "§535：有報酬者以善良管理人注意，無報酬者以處理自己事務同一之注意，前者義務較重。", "§547：報酬縱未約定，如依習慣或依委任事務之性質，應給與報酬者，受任人得請求報酬。", "§548 I：應受報酬之受任人，除契約另有訂定外，於委任關係終止及明確報告顛末後，得請求報酬。"], "core": ["可歸責受任人而終止不得比例請求", "有報酬者注意義務較重", "依習慣或性質應給報酬得請求", "終止並報告顛末後才得請求報酬"], "key": [["非可歸責於受任人"], ["善良管理人注意", "前者義務較重"], ["依習慣", "依委任事務之性質"], ["明確報告顛末後"]], "tk": ["ng", "ok", "ok", "ok"], "trap": "報酬比例請求以「非可歸責於受任人」為前提。陷阱：記住關鍵字「非」可歸責。"}, {"id": "E13", "cat": "委任與居間", "year": "108年第11題", "q": "依我國民法之規定，下列關於居間契約之敘述何者錯誤？", "opts": ["稱居間者，謂當事人約定，一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約", "約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，法院得因報酬給付義務人之請求酌減之。報酬已給付者，得請求返還", "因婚姻居間而約定報酬者，就其報酬無請求權", "居間人就其媒介所成立之契約，無為當事人給付或受領給付之權"], "correct": 1, "exps": ["§565：居間為當事人約定，一方為他方報告訂約機會或為訂約媒介，他方給付報酬之契約。", "§572：報酬過鉅失公平，法院得因給付義務人之請求酌減，但報酬已給付者，不得請求返還。", "§573：因婚姻居間而約定報酬者，就其報酬無請求權（現行條文未規定約定無效）。", "§574：居間人就其媒介所成立之契約，無為當事人給付或受領給付之權。"], "core": ["居間是報告或媒介訂約之契約", "報酬已給付者不得請求返還", "婚姻居間就報酬無請求權", "居間人無給付或受領給付之權"], "key": [["報告訂約機會", "訂約媒介", "給付報酬"], ["報酬已給付者", "不得請求返還"], ["無請求權"], ["無為當事人給付"]], "tk": ["ok", "ng", "ok", "ok"], "trap": "居間報酬可酌減，但付了就不能要回。陷阱：與§252 違約金酌減不同，這裡「已給付者不得請求返還」。"}, {"id": "E14", "cat": "承攬與保證", "year": "100年第10題", "q": "甲為定作人，與乙訂立承攬契約，由乙為甲建一房屋。關於此案例，下列敘述何者正確？", "opts": ["乙得就承攬之報酬額，對於將來完成之甲之房屋，請求預為抵押權之登記", "工作未完成前，定作人甲不得隨時終止契約", "定作人甲所供給之材料，因不可抗力而毀損者，承攬人須負其責", "如乙所蓋房屋有瑕疵，甲於房屋交付後二年始發見者，不得請求乙修補"], "correct": 0, "exps": ["§513：承攬之工作為建築物等，承攬人得就報酬額，對於將來完成之定作人不動產，請求預為抵押權之登記（開始工作前亦得為之）。", "§511：工作未完成前，定作人得隨時終止契約，但應賠償承攬人因契約終止而生之損害。", "§508 II：定作人所供給之材料，因不可抗力而毀損滅失者，承攬人不負其責。", "建築物瑕疵發見期間延長為五年（§499），交付後二年發見仍得依§493 請求修補。"], "core": ["建物承攬人得請求預為抵押登記", "定作人得隨時終止，但須賠償", "不可抗力毀損材料承攬人不負責", "建物瑕疵發見期五年，仍可修補"], "key": [["預為抵押權之登記"], ["定作人得隨時終止", "應賠償承攬人"], ["承攬人不負其責"], ["延長為五年"]], "tk": ["ok", "ng", "ng", "ng"], "trap": "承攬人是「工作完成才領錢」，所以給預為抵押權登記保障。陷阱：定作人可隨時終止，但要賠償。"}, {"id": "E15", "cat": "承攬與保證", "year": "110年第11題", "q": "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？", "opts": ["同時履行抗辯", "撤銷訴權", "追索權抗辯", "先訴抗辯"], "correct": 3, "exps": ["同時履行抗辯（§264）：雙務契約一方未提出履行，他方得拒絕己方給付，與保證無關。", "撤銷訴權（§244）：債權人撤銷債務人詐害行為之權利，與保證抗辯無關。", "追索權見於票據法（票據不獲付款後向前手追索），與民法保證無關。", "§745「先訴抗辯」（或稱「先訴利益」）：保證人於債權人未先就主債務人財產強制執行無效果前，得拒絕清償，此即先訴抗辯，正確。"], "core": ["同時履行抗辯屬雙務契約", "撤銷訴權是撤銷詐害行為", "追索權見於票據法", "未強制執行無效果前得拒絕清償"], "key": [["與保證無關"], ["詐害行為", "與保證抗辯無關"], ["票據法"], ["強制執行無效果前", "得拒絕清償"]], "tk": ["ng", "ng", "ng", "ok"]}, {"id": "E16", "cat": "承攬與保證", "year": "102年第13題", "q": "甲於民國102年1月1日向乙借新臺幣10萬元，約定同年6月30日清償，並由丙於其期限內擔任保證人。下列敘述何者正確？", "opts": ["清償期屆滿，乙允許甲延期清償時，應得丙之同意，否則丙不負保證責任", "丙得隨時通知乙終止保證契約，並於通知到達乙後，不負保證責任", "清償期屆滿後，丙應定一個月以上之期限催告乙向甲請求，丙始能免責", "丙得隨時通知甲終止保證契約，並於通知到達甲後，不負保證責任"], "correct": 0, "exps": ["§755 I：定有期限之債務，債權人允許主債務人延期，除保證人已同意外，保證人不負保證責任。", "§754 I 隨時終止僅適用連續發生之債務且未定期間者，單一借款且定有期限不適用。", "催告免責（§753）限於「未定期間」之保證，且係催告債權人向主債務人為審判上之請求；本題保證定有期間（適用§752），不適用；保證人免責事由另如§755 延期未經同意。", "終止保證之通知對象為債權人而非主債務人，且本題非連續債務，不適用§754。"], "core": ["延期未經保證人同意則免責", "隨時終止限連續債務未定期間", "催告免責限未定期間保證", "終止通知對象是債權人"], "key": [["保證人已同意", "不負保證責任"], ["連續發生之債務", "定有期限不適用"], ["未定期間", "定有期間"], ["通知對象為債權人", "非連續債務"]], "tk": ["ok", "ng", "ng", "ng"], "trap": "白話：債權人擅自放寬還款時間，保證人若沒同意就不負責。隨時終止保證僅限連續債務。"}, {"id": "E17", "cat": "贈與", "year": "100年第1題", "q": "下列關於贈與契約之敘述何者正確？", "opts": ["贈與契約之贈與人對其贈與之物，有瑕疵時，原則上贈與人應負物之瑕疵擔保責任", "贈與契約為無償契約，所以贈與人均可撤銷其贈與", "定期給付之贈與，不因贈與人死亡而失其效力", "贈與人僅就其故意或重大過失，對於受贈人負給付不能之責任"], "correct": 3, "exps": ["贈與人原則上不負物之瑕疵擔保責任（§411 本文）；僅贈與人故意不告知瑕疵或保證無瑕疵時，才對受贈人因瑕疵所生損害負賠償義務（§411 但書）。", "贈與人並非『均可』撤銷：§408 Ⅰ 僅限於贈與物之權利『未移轉前』得撤銷，已移轉者不得任意撤銷；Ⅱ 經公證之贈與或為履行道德上義務而為贈與者，亦不得任意撤銷。（§416 是受贈人忘恩時贈與人的法定撤銷權，另為一事。）", "定期給付之贈與，依§415，因贈與人或受贈人之死亡而失其效力（但贈與人有反對意思表示者除外）；本選項說『不因贈與人死亡而失效』與條文相反。", "依§410，贈與人僅就其故意或重大過失，對於受贈人負給付不能之責任（無償契約，責任從輕），正確。"], "core": ["贈與人原則上不負瑕疵擔保", "僅權利未移轉前才得撤銷", "定期給付贈與因贈與人死亡失效", "無償契約，僅故意重大過失負責"], "key": [["不負物之瑕疵擔保"], ["未移轉前", "不得任意撤銷"], ["死亡而失其效力"], ["故意或重大過失", "責任從輕"]], "tk": ["ng", "ng", "ng", "ok"]}, {"id": "E18", "cat": "贈與", "year": "107年第14題", "q": "下列有關贈與之敘述，何者正確？", "opts": ["贈與係單獨行為", "贈與以物之交付為要件，於物之交付後，贈與行為才為生效", "經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與", "贈與得附有負擔"], "correct": 3, "exps": ["依§406，贈與是當事人約定一方無償給與財產、他方允受之契約，須雙方意思表示合致（受贈人須允受），不是單獨行為，選項錯誤。", "依§406，贈與於雙方約定「無償給與」並經允受時即成立生效（諾成契約），不以物之交付為要件，選項錯誤。", "依§408Ⅱ，經公證之贈與（或為履行道德上義務而為之贈與），不適用§408Ⅰ 的任意撤銷，贈與人不得在權利移轉前隨時撤銷；選項說「得隨時撤銷」正好相反，錯誤。" async function loadMastery(){
  try{
    const res = await window.storage.get('exam_mastery_data');
    if(res && res.value) mastery = JSON.parse(res.value);
  }catch(e){ mastery = {}; }
}
async function saveMastery(){
  try{ await window.storage.set('exam_mastery_data', JSON.stringify(mastery)); }
  catch(e){ console.error('storage save failed', e); }
}

Object.keys(CAT_COLORS).forEach(cat=>{
  const count = CARDS.filter(c=>c.cat===cat).length;
  const chip = document.createElement('div');
  chip.className='chip active';
  chip.style.background=CAT_COLORS[cat];
  chip.style.borderColor=CAT_COLORS[cat];
  chip.style.color='#fff';
  chip.textContent=`${cat} (${count})`;
  chip.dataset.cat=cat;
  chip.addEventListener('click',()=>{
    if(activeCats.has(cat)){
      if(activeCats.size===1) return;
      activeCats.delete(cat);
      chip.classList.remove('active');
      chip.style.background='var(--surf)';
      chip.style.color=CAT_COLORS[cat];
    } else {
      activeCats.add(cat);
      chip.classList.add('active');
      chip.style.background=CAT_COLORS[cat];
      chip.style.color='#fff';
    }
    rebuildDeck();
  });
  chipsEl.appendChild(chip);
});

resetBtn.addEventListener('click',()=>{
  activeCats = new Set(Object.keys(CAT_COLORS));
  document.querySelectorAll('.chip[data-cat]').forEach(chip=>{
    const cat=chip.dataset.cat;
    chip.classList.add('active');
    chip.style.background=CAT_COLORS[cat];
    chip.style.color='#fff';
  });
  rebuildDeck();
});

function getStat(id){
  const m = mastery[id];
  if(!m) return {status:null, attempts:0, correct:0};
  if(typeof m === 'string') return {status:m, attempts:1, correct:(m==='mastered'?1:0)};
  return m;
}
function masteryIcon(stat){
  if(!stat.status) return '';
  const icon = stat.status==='mastered' ? '✅' : '🔄';
  return stat.attempts>0 ? `${icon}×${stat.attempts}` : icon;
}
function updateOverallStats(){
  let attempts=0, correct=0, mastered=0;
  CARDS.forEach(c=>{
    const s = getStat(c.id);
    attempts += s.attempts;
    correct += s.correct;
    if(s.status==='mastered') mastered++;
  });
  document.getElementById('totalAttempts').textContent = attempts;
  document.getElementById('overallAcc').textContent = attempts ? Math.round(correct/attempts*100)+'%' : '—';
  document.getElementById('masteredCount').textContent = mastered;
  document.getElementById('totalCards').textContent = CARDS.length;
}

function rebuildDeck(){
  deck = CARDS.filter(c=>activeCats.has(c.cat));
  idx = 0;
  render();
}

function render(){
  const c = deck[idx];
  const color = CAT_COLORS[c.cat];
  flipped = false;
  selectedOpt = null;
  cardEl.classList.remove('flipped');
  qText.textContent = c.q;
  badgeFront.textContent = c.cat;
  badgeFront.style.background = color;
  badgeBack.textContent = c.cat;
  badgeBack.style.background = color;
  yearFront.textContent = c.year;
  yearBack.textContent = c.year;
  document.querySelector('.face.back').style.borderLeftColor = color;
  const stat = getStat(c.id);
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
  curNum.textContent = idx+1;
  totalNum.textContent = deck.length;
  catName.textContent = '・' + c.cat;
  progFill.style.width = ((idx+1)/deck.length*100)+'%';

  optList.innerHTML = '';
  const letters = ['A','B','C','D'];
  c.opts.forEach((opt,i)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    div.addEventListener('click', ()=> selectOption(i));
    optList.appendChild(div);
  });
}

function okOf(c){return c.ok||[c.correct]}
function selectOption(i){
  if(flipped) return;
  const c = deck[idx];
  selectedOpt = i;
  const correct = (okOf(c).includes(i));
  document.querySelectorAll('.opt')[i].classList.add('selected');

  // build back face
  answerBanner.className = 'answer-banner ' + (correct ? 'correct' : 'wrong');
  const letters = ['A','B','C','D'];
  answerBanner.textContent = correct
    ? `✅ 答對！正解是 ${okOf(c).map(x=>letters[x]).join('、')}`
    : `❌ 答錯了，你選 ${letters[i]}，正解是 ${okOf(c).map(x=>letters[x]).join('、')}`;

  expList.innerHTML = '';
  c.exps.forEach((exp,j)=>{
    const div = document.createElement('div');
    div.className = 'exp-item' + (okOf(c).includes(j) ? ' right' : '');
    const mark = okOf(c).includes(j) ? '✓ 正解' : '✗';
    div.innerHTML = `${window.bxmExp?'<div>'+bxmExp(exp,(c.core||[])[j],(c.key||[])[j],(c.tk||[])[j],'',{L:letters[j],ans:okOf(c).includes(j)})+'</div>':'<div class="exp-head">'+letters[j]+'. '+mark+'</div><div>'+exp+'</div>'}`;
    expList.appendChild(div);
  });
  if(window.BXM_LINKS_HTML){const ym=String(c.year||'').match(/(\d+)年第(\d+)題/);const lk=ym?BXM_LINKS_HTML(ym[1]+'-'+ym[2]):'';if(lk){const w=document.createElement('div');w.innerHTML=lk;expList.appendChild(w)}}/*bxm-links*/

  // stats + mastery
  if(correct) quizStats.ok++; else quizStats.ng++;
  const stat = getStat(c.id);
  stat.attempts += 1;
  if(correct) stat.correct += 1;
  stat.status = correct ? 'mastered' : 'review';
  mastery[c.id] = stat;
  saveMastery();
  quizOk.textContent = quizStats.ok;
  quizNg.textContent = quizStats.ng;
  updateOverallStats();

  setTimeout(()=>{ flipped=true; cardEl.classList.add('flipped'); }, 150);

  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent = icon;
  badgeMasteryBack.textContent = icon;
}

cardEl.addEventListener('click',()=>{
  if(flipped){ flipped=false; cardEl.classList.remove('flipped'); }
});

function goNext(){ idx=(idx+1)%deck.length; render(); }
function goPrev(){ idx=(idx-1+deck.length)%deck.length; render(); }
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('shuffleBtn').addEventListener('click',()=>{
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0; render();
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
});

document.getElementById('markMastered').addEventListener('click',()=>{
  const c = deck[idx];
  const stat = getStat(c.id);
  stat.status='mastered';
  mastery[c.id]=stat; saveMastery();
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent=icon; badgeMasteryBack.textContent=icon;
  updateOverallStats();
});
document.getElementById('markReview').addEventListener('click',()=>{
  const c = deck[idx];
  const stat = getStat(c.id);
  stat.status='review';
  mastery[c.id]=stat; saveMastery();
  const icon = masteryIcon(stat);
  badgeMasteryFront.textContent=icon; badgeMasteryBack.textContent=icon;
  updateOverallStats();
});

document.getElementById('resetQuiz').addEventListener('click',()=>{
  quizStats = {ok:0, ng:0};
  quizOk.textContent=0; quizNg.textContent=0;
});

document.getElementById('resetMastery').addEventListener('click',async ()=>{
  if(!confirm('確定要清除所有學習記錄（已掌握/待複習/作答次數）嗎？此動作無法復原。')) return;
  mastery = {};
  await saveMastery();
  render();
  updateOverallStats();
});

(async function init(){
  await loadMastery();
  rebuildDeck();
  updateOverallStats();
})();
</script>
