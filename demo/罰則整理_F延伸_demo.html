<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>罰則總整理 F 延伸 demo</title>
<style>
:root{--bg:#F5F1E6;--card:#FFFEFA;--ink:#25302C;--mut:#6B7470;--pri:#2F5D50;--gold:#B8782E;--red:#A8402B;--green:#35693F;--line:#DDD6C3;--gbg:#FBF1D9;--p2:#EFE9D8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 14px 60px}button{font:inherit;color:inherit;cursor:pointer;text-align:left}
.vs{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 14px;margin:0 -14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.vs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 12px;font-size:.84rem}.vs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.desc{font-size:.8rem;color:var(--mut);margin:8px 0}
mark{background:var(--gbg);color:#7A4B14;font-weight:700;padding:0 4px;border-radius:4px}
.k{font-size:.78rem;font-weight:700;color:var(--gold);background:var(--gbg);border-radius:6px;padding:0 8px;white-space:nowrap;flex:none}
.cnt{font-size:.74rem;color:var(--mut);background:var(--p2);border-radius:99px;padding:0 8px;flex:none}
.num{font-weight:700;color:var(--pri);flex:none;min-width:1.6em}.ar{margin-left:auto;font-size:.8rem;opacity:.7;transition:transform .12s;flex:none}
.open>.hh>.ar{transform:rotate(180deg)}
/* sticky skeleton shared */
.ch{margin-bottom:14px}
.h1{position:sticky;top:var(--t1,45px);z-index:12;display:flex;gap:10px;align-items:center;width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:1.05rem}
.h1 .num{color:#fff;opacity:.85}.h1 small{font-weight:400;font-size:.76rem;opacity:.85;margin-left:4px}
.c1{display:none}.ch.open>.c1{display:block}
.sub{border-bottom:1px solid var(--line)}
.h2{position:sticky;top:calc(var(--t1,45px) + 44px);z-index:10;display:flex;gap:8px;align-items:center;width:100%;background:var(--p2);border:0;padding:8px 12px;font-weight:700;font-size:.96rem}
.c2{display:none;background:var(--card)}.sub.open>.c2{display:block}
.chap{background:var(--card);border:1px solid var(--line);border-radius:0 0 10px 10px}
/* item common */
.it{border-top:1px dashed var(--line);padding:0 12px}.it:first-child{border-top:0}
.ih{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:9px 0;font-size:.94rem}
.it .det{display:none;padding:0 0 10px 0}.it.open .det{display:block}
.no{margin-top:6px;padding:5px 10px;border-left:3px solid var(--red);background:var(--p2);font-size:.9rem}.no b{color:var(--red);font-size:.76rem;margin-right:6px}
.kou{margin:8px 12px;padding:6px 10px;background:var(--gbg);border-radius:8px;font-size:.9rem}.kou b{color:var(--gold)}
/* slots */
.sl{display:grid;grid-template-columns:5.6em 1fr;gap:4px 10px;font-size:.9rem}.sl dt{color:var(--mut);font-size:.78rem;padding-top:3px;font-weight:600}.sl dd{margin:0}
.sl dd.no2{border-left:3px solid var(--red);padding-left:8px}.sl dt.r{color:var(--red)}
/* F2 bar */
#cb{position:sticky;top:45px;z-index:25;background:var(--pri);color:#fff;border-radius:0 0 10px 10px;padding:8px 14px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:.92rem;cursor:pointer}
#cb span.s{opacity:.8;font-weight:400}#menu{display:none;position:sticky;top:90px;z-index:24;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#menu.on{display:block}#menu a{display:flex;gap:8px;padding:5px 0;font-size:.92rem;color:var(--ink);text-decoration:none}#menu a.l1{font-weight:700;margin-top:4px}#menu a.l2{margin-left:1.8em;color:var(--mut)}
/* F3 flat blocks */
.bk{padding:10px 12px;border-top:1px dashed var(--line)}.bk:first-child{border-top:0}.bk .tt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.94rem;margin-bottom:2px}.bk p{margin:2px 0;font-size:.9rem}
.dim{color:var(--mut);font-size:.8rem;margin:3px 0 0}
/* F4 study */
.ck{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;background:var(--card);display:grid;place-items:center;color:#fff;font-size:.8rem;padding:0}
.it.done .ck{background:var(--green);border-color:var(--green)}.it.done .ih .t{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.pg{flex:none;font-size:.72rem;font-weight:700;color:var(--green);background:#E3EEDF;border-radius:99px;padding:0 8px}
.h1 .pg{background:rgba(255,255,255,.22);color:#fff}
.flt{display:flex;gap:6px;margin:6px 0 10px}.flt button{border:1px solid var(--gold);color:var(--gold);background:none;border-radius:99px;padding:1px 12px;font-size:.84rem}.flt button.on{background:var(--gold);color:#fff}
.hide .it.done{display:none}
.bar{display:flex;gap:8px;margin:6px 0 10px}.bar button{border:1px solid var(--gold);color:var(--gold);background:none;border-radius:99px;padding:2px 14px;font-size:.85rem}
</style></head><body><div class="w"><div class="vs" id="vs"></div><p class="desc" id="desc"></p><div id="app"></div></div>
<script>
const DATA=[
{n:"二",t:"土地法本法",tag:"必背",subs:[
 {n:"2.1",t:"逾期登記罰鍰",art:"§73",its:[
  {n:"①",t:"一般權利變更登記逾期",k:"1個月",art:"§73 第2項",b:"權利變更後 <mark>1個月</mark> 內聲請",no:"逾期每逾1個月得處登記費 <mark>1倍</mark>，最高 <mark>20倍</mark>",trap:"107-1 改成 2倍；基數是登記費，不是公告地價",ex:"99-10、107-1"},
  {n:"②",t:"繼承登記逾期",k:"6個月",art:"§73 第2項後段",b:"繼承開始後 <mark>6個月</mark> 內聲請",no:"罰法同上（每逾1個月 1倍，最高 20倍）",trap:"不是1個月、3個月、1年（112-8A）",ex:"99-12、108-21、112-8"}],kou:"一月登記、六月繼承、每月一倍、二十封頂"},
 {n:"2.2",t:"繼承標售（逾1年未辦）",art:"§73-1",its:[
  {n:"1",t:"先辦繼承登記",k:"6個月",art:"§73",b:"繼承人向地政事務所申請繼承登記",no:"逾期每逾1個月得處登記費1倍，最高20倍",ex:"100-33"},
  {n:"2",t:"公告催辦",k:"3個月",art:"§73-1 第1項",b:"逾1年，公告並書面通知；繼承人 <mark>3個月</mark> 內聲請",no:"不聲請 → 進入列冊管理",trap:"不可歸責事由遲延者扣除",ex:"108-21"},
  {n:"3",t:"列冊管理",k:"15年",art:"§73-1",b:"列冊管理 <mark>15年</mark>",no:"15年屆滿仍未聲請 → 進入標售"},
  {n:"4",t:"公開標售",k:"3個月",art:"§73-1",b:"移請 <mark>財政部國有財產署</mark> 標售；標售前公告 <mark>3個月</mark>",trap:"不是地政機關、縣市政府、行政執行署"},
  {n:"5",t:"優先購買",art:"§73-1",b:"順序：繼承人 → 合法使用人 → 其他共有人",no:"無合法使用權者喪失占有；租賃逾5年以 5年 為限"},
  {n:"6",t:"價款分配",k:"10年",art:"§73-1",b:"價款依法定應繼分領取",no:"逾 10年 無人領取 → 歸國庫",trap:"價款期是10年，不是15年（109-15C）",ex:"109-15、112-8"},
  {n:"7",t:"再標售、登記國有",art:"§73-1",b:"無人應買 → 再標售（酌減不逾20%）",no:"五次不成 → 登記國有；10年內仍可請領價金"}],kou:"1年・3個月・15年・10年（1、3、15、10）"},
 {n:"2.3",t:"其他責任",its:[
  {n:"①",t:"總登記逾期不登記／不補件",k:"30日",art:"§57、§58",b:"視為無主土地，公告 <mark>30日</mark>",no:"無人異議 → 國有",trap:"「不得少於15日」是錯選項",ex:"112-7"},
  {n:"②",t:"登記錯誤致人受損",k:"10%",art:"§68、§70、§71",b:"地政機關賠償；登記儲金 <mark>10%</mark>",trap:"重大過失才由人員償還",ex:"99-6、112-20"},
  {n:"③",t:"房屋租金超限",k:"10%",art:"§97、§99",b:"年息 <mark>10%</mark> 上限；押金不得逾 <mark>2個月</mark>",no:"政府得強制減定",ex:"105-12、110-5"}]}]},
{n:"三",t:"平均地權條例",tag:"必背",subs:[{n:"3.1",t:"刑責與基礎罰鍰",its:[{n:"①",t:"（同樣格式）",b:""}]},{n:"3.2",t:"申報登錄與預售屋",its:[{n:"①",t:"（同樣格式）",b:""}]}]}];
const V=[["F1 固定欄位","每一項點開，欄位順序永遠一樣：條文／重點／不做會怎樣／陷阱／考古題。"],["F2 路徑導覽列","吸頂的是一條「現在位置」導覽列，點它可看整份目錄並直接跳過去。"],["F3 兩層就好","只有章、小節兩層要點；小節展開後內容直接全部看得到，不用再點第三層。"],["F4 讀書模式","在 F1 上加每項「已背」勾選、各層進度、可只看未背的。"]];
let cur=0;
const slots=i=>`<dl class="sl">${i.art?`<dt>條文</dt><dd>${i.art}</dd>`:""}${i.b?`<dt>重點</dt><dd>${i.b}</dd>`:""}${i.no?`<dt class="r">不做會怎樣</dt><dd class="no2">${i.no}</dd>`:""}${i.trap?`<dt>陷阱</dt><dd>${i.trap}</dd>`:""}${i.ex?`<dt>考古題</dt><dd>${i.ex}</dd>`:""}</dl>`;
const kou=s=>s.kou?`<div class="kou"><b>口訣</b>　${s.kou}</div>`:"";
const itemF=(i,chk)=>`<div class="it" data-id="${i.n}${i.t}"><div class="ih" role="button" data-it>${chk?`<button class="ck" data-ck>✓</button>`:""}<span class="num">${i.n}</span><span class="t">${i.t}</span>${i.k?`<span class="k" style="margin-left:auto">${i.k}</span>`:""}</div><div class="det">${slots(i)}</div></div>`;
const frame=(c,ci,sub,extra="")=>`<div class="ch" id="c${ci}"><button class="h1 hh" data-ch><span class="num">${c.n}</span>${c.t}<small>${c.tag||""}</small>${extra}<span class="ar">▾</span></button><div class="c1"><div class="chap">`+c.subs.map((s,si)=>`<div class="sub" id="s${ci}_${si}" data-nm="${c.n} ${c.t}|${s.n} ${s.t}"><button class="h2 hh" data-sb><span class="num">${s.n}</span>${s.t}<span class="cnt">${s.its.length}</span><span class="ar">▾</span></button><div class="c2">${sub(s,ci,si)}</div></div>`).join("")+`</div></div></div>`;
function F1(){return DATA.map((c,ci)=>frame(c,ci,s=>s.its.map(i=>itemF(i)).join("")+kou(s))).join("")}
function F2(){return `<div id="cb"><span id="cbt">二 土地法本法</span><span class="s" id="cbs"></span><span class="ar">目錄 ▾</span></div><div id="menu">`+DATA.map((c,ci)=>`<a class="l1" href="#c${ci}" data-j="${ci}">${c.n}　${c.t}</a>`+c.subs.map((s,si)=>`<a class="l2" href="#s${ci}_${si}" data-j="${ci},${si}">${s.n}　${s.t}</a>`).join("")).join("")+`</div>`+DATA.map((c,ci)=>`<div class="ch open" id="c${ci}"><button class="h1 hh" data-ch style="position:static"><span class="num">${c.n}</span>${c.t}<small>${c.tag||""}</small><span class="ar">▾</span></button><div class="c1"><div class="chap">`+c.subs.map((s,si)=>`<div class="sub" id="s${ci}_${si}" data-nm="${c.n} ${c.t}|${s.n} ${s.t}"><button class="h2 hh" data-sb style="position:static"><span class="num">${s.n}</span>${s.t}<span class="cnt">${s.its.length}</span><span class="ar">▾</span></button><div class="c2">${s.its.map(i=>itemF(i)).join("")+kou(s)}</div></div>`).join("")+`</div></div></div>`).join("")}
function F3(){return DATA.map((c,ci)=>frame(c,ci,s=>s.its.map(i=>`<div class="bk"><div class="tt"><span class="num">${i.n}</span>${i.t}${i.k?`<span class="k" style="margin-left:auto">${i.k}</span>`:""}</div>${i.b?`<p>${i.b}</p>`:""}${i.no?`<div class="no"><b>不做會怎樣</b>${i.no}</div>`:""}${i.trap?`<p class="dim">陷阱：${i.trap}</p>`:""}${(i.art||i.ex)?`<p class="dim">${i.art||""}${i.art&&i.ex?"｜":""}${i.ex?"考古題 "+i.ex:""}</p>`:""}</div>`).join("")+kou(s))).join("")}
function F4(){return `<div class="flt"><button id="onlyN">只看未背</button><button id="rst">全部重設</button></div>`+DATA.map((c,ci)=>frame(c,ci,s=>s.its.map(i=>itemF(i,true)).join("")+kou(s),`<span class="pg" data-pgc="${ci}"></span>`).replace(/<span class="cnt">(\d+)<\/span>/g,'<span class="cnt">$1</span><span class="pg" data-pgs></span>')).join("")}
function prog(){document.querySelectorAll(".sub").forEach(s=>{const a=s.querySelectorAll(".it"),d=s.querySelectorAll(".it.done");const p=s.querySelector("[data-pgs]");if(p)p.textContent=d.length+"/"+a.length});document.querySelectorAll(".ch").forEach(c=>{const a=c.querySelectorAll(".it"),d=c.querySelectorAll(".it.done");const p=c.querySelector("[data-pgc]");if(p)p.textContent="已背 "+d.length+"/"+a.length})}
function render(){vs.innerHTML=V.map((v,i)=>`<button class="${i==cur?'on':''}" data-v="${i}">${v[0]}</button>`).join("");desc.textContent=V[cur][1]+"　（預設全部收合）";app.innerHTML=[F1,F2,F3,F4][cur]();app.classList.remove("hide");if(cur==3)prog();if(cur==1)upd()}
function upd(){const cb=document.getElementById("cbt");if(!cb)return;let best=null;document.querySelectorAll(".sub").forEach(s=>{const r=s.getBoundingClientRect();if(r.top<140)best=s});if(best){const[a,b]=best.dataset.nm.split("|");cbt.textContent=a;cbs.textContent="› "+b}}
addEventListener("scroll",upd,{passive:true});
document.addEventListener("click",e=>{const b=e.target.closest("[data-v],[data-ch],[data-sb],[data-it],[data-ck],[data-j],#cb,#onlyN,#rst");if(!b)return;
if(b.dataset.v!=null){cur=+b.dataset.v;return render()}
if(b.dataset.ck!=null){const it=b.closest(".it");it.classList.toggle("done");prog();e.stopPropagation();return}
if(b.dataset.ch!=null){if(cur!=1)b.parentElement.classList.toggle("open");else b.parentElement.querySelector(".c1").style.display=b.parentElement.querySelector(".c1").style.display=="none"?"block":"none";return}
if(b.dataset.sb!=null){b.parentElement.classList.toggle("open");return}
if(b.dataset.it!=null){b.parentElement.classList.toggle("open");return}
if(b.id=="cb"){menu.classList.toggle("on");return}
if(b.dataset.j!=null){menu.classList.remove("on");const[c,s]=b.dataset.j.split(",");if(s!=null){document.getElementById("s"+c+"_"+s).classList.add("open")}return}
if(b.id=="onlyN"){app.classList.toggle("hide");b.classList.toggle("on");return}
if(b.id=="rst"){document.querySelectorAll(".it.done").forEach(x=>x.classList.remove("done"));prog()}});
render();
</script></body></html>
