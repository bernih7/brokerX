<style>
:root{
  --paper:#F8F3E9; --ink:#2A2722; --vermillion:#A8402B; --gold:#BC8A2E;
  --green:#3F6B4C; --line:#DDD2BB;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",sans-serif; line-height:1.6; padding-bottom:60px;
}
header{
  padding:20px 16px 14px; border-bottom:3px double var(--vermillion);
  background:linear-gradient(180deg,#FBF8F0,var(--paper));
  position:sticky; top:0; z-index:20;
}
h1{
  font-family:"Noto Serif TC",serif; font-weight:900; font-size:1.35rem;
  margin:0 0 4px; color:var(--vermillion); letter-spacing:.02em;
}
.sub{font-size:.78rem; color:#7a6f5c;}
.stats{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:.78rem; }
.stat{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; color:#5a5142; }
.stat b{color:var(--vermillion);}
.controls{ max-width:920px; margin:14px auto 0; padding:0 16px; }
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.fbtn{
  border:1.5px solid var(--gold); background:#fff; color:#7a5c1e;
  padding:7px 14px; border-radius:20px; font-size:.82rem; cursor:pointer;
  font-family:"Noto Sans TC",sans-serif; transition:.15s;
}
.fbtn.active{ background:var(--gold); color:#fff; }
.fbtn.danger{ border-color:var(--vermillion); color:var(--vermillion); }
.fbtn.danger.active{ background:var(--vermillion); color:#fff; }
.chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.chip{
  border:1px solid var(--line); background:#fff; color:#6b6252;
  padding:4px 11px; border-radius:14px; font-size:.75rem; cursor:pointer;
}
.chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
main{ max-width:920px; margin:0 auto; padding:14px 16px 40px; }
.qcard{
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:16px 18px 14px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.qmeta{ font-size:.72rem; color:#9a8f78; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
.badge{ display:inline-block; font-size:.68rem; padding:1px 7px; border-radius:8px; border:1px solid var(--line); color:#7a6f5c; }
.badge.wrong{ border-color:var(--vermillion); color:var(--vermillion); background:#FBEDEA;}
.stem{ font-size:1rem; font-weight:500; margin:4px 0 10px; }
.opt{
  display:block; width:100%; text-align:left; padding:9px 12px;
  margin-bottom:7px; border:1.5px solid var(--line); border-radius:8px;
  background:#FEFCF7; cursor:pointer; font-size:.9rem; color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;
}
.opt:hover{ border-color:var(--gold); }
.opt.correct{ border-color:var(--green); background:#EAF3EC; font-weight:700; }
.opt.chosen-wrong{ border-color:var(--vermillion); background:#FBEDEA; font-weight:700; }
.opt.disabled{ cursor:default; }
.explain-box{
  margin-top:10px; padding:12px 14px; background:#FBF8F0;
  border-left:3px solid var(--gold); border-radius:6px; font-size:.85rem; display:none;
}
.explain-box.show{ display:block; }
.explain-line{ margin-bottom:6px; }
.explain-line b{ color:var(--vermillion); }
.explain-line.ok b{ color:var(--green); }
.ref{ margin-top:8px; font-size:.75rem; color:#8a7f68; }
.errtag-row{ margin-top:10px; display:none; gap:6px; }
.errtag-row.show{ display:flex; }
.etag{
  font-size:.72rem; padding:3px 9px; border-radius:12px; border:1px solid var(--line);
  background:#fff; cursor:pointer; color:#6b6252;
}
.etag.on-A{ background:#A8402B; color:#fff; border-color:#A8402B; }
.etag.on-B{ background:#BC8A2E; color:#fff; border-color:#BC8A2E; }
.etag.on-C{ background:#3F6B4C; color:#fff; border-color:#3F6B4C; }
footer{ text-align:center; font-size:.7rem; color:#a49a86; padding:20px 10px 10px; }
.empty{ text-align:center; color:#9a8f78; padding:40px 0; font-size:.9rem; }
</style>

const QUESTIONS = [{"year": 99, "qnum": 26, "stem": "下列有關公寓大廈管理條例中對公共基金規範之敘述何者錯誤？", "options": ["公共基金應設專戶儲存", "公共基金由管理負責人或管理委員會負責管理", "管理負責人或管理委員會負責管理之公共基金應不定期將其收支、保管及運用情形公告", "公共基金之運用應依區分所有權人會議之決議為之"], "answer": "C", "explains": {"A": "公共基金應設專戶儲存，敘述正確，非本題答案。", "B": "由管理負責人或管理委員會負責管理，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應為「定期」公告收支保管運用情形，而非「不定期」，此為方向相反之陷阱。", "D": "公共基金運用應依區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第18條", "id": 1, "chapter": "E3"}, {"year": 99, "qnum": 27, "stem": "住戶積欠依公寓大廈管理條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者，由管理負責人或管理委員會促請其改善，於多久內其仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離？", "options": ["1個月", "3個月", "6個月", "1年"], "answer": "B", "explains": {"A": "數字錯誤，非1個月。", "B": "正確。促請改善後「3個月」內仍未改善者，得依區分所有權人會議決議訴請法院強制遷離，此為強制遷離程序之核心數字。", "C": "數字錯誤，非6個月。", "D": "數字錯誤，非1年。"}, "ref": "公寓大廈管理條例第22條", "id": 2, "chapter": "E3"}, {"year": 99, "qnum": 28, "stem": "區分所有權人會議，由全體區分所有權人組成，每年至少應召開定期會議幾次？", "options": ["1次", "2次", "4次", "12次"], "answer": "A", "explains": {"A": "正確。區分所有權人會議每年至少應召開定期會議「1次」，此為全科最高頻數字之一。", "B": "數字錯誤，非2次。", "C": "數字錯誤，非4次。", "D": "數字錯誤，非12次（非每月一次）。"}, "ref": "公寓大廈管理條例第25條", "id": 3, "chapter": "E3"}, {"year": 99, "qnum": 29, "stem": "區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人之區分所有權占全部區分所有權多少以上者，其超過部分不予計算？", "options": ["十分之一", "五分之一", "四分之一", "三分之一"], "answer": "B", "explains": {"A": "數字錯誤，非十分之一。", "B": "正確。任一區分所有權人之區分所有權占全部區分所有權「五分之一以上」者，其超過部分不予計算，此規定目的在防止大戶壟斷表決權，與「專有部分個數超過總數五分之一」規定併行適用，須同時牢記兩者皆為五分之一。", "C": "數字錯誤，非四分之一。", "D": "數字錯誤，非三分之一。"}, "ref": "公寓大廈管理條例第27條", "id": 4, "chapter": "E3"}, {"year": 99, "qnum": 30, "stem": "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上時，起造人應於幾個月內召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["1個月", "2個月", "3個月", "6個月"], "answer": "C", "explains": {"A": "數字錯誤，非1個月。", "B": "數字錯誤，非2個月。", "C": "正確。區分所有權人達半數以上及區分所有權比例合計半數以上時，起造人應於「3個月內」召集會議成立管委會或推選管理負責人並報備，此為高頻重複命題數字。", "D": "數字錯誤，非6個月。"}, "ref": "公寓大廈管理條例第28條", "id": 5, "chapter": "E3"}, {"year": 99, "qnum": 35, "stem": "下列之說明，何者為正確？ ①由區分所有權人會議決議或管理負責人或管理委員會僱傭或委任之警衛，即屬公寓大廈管理條例所稱之管理服務人 ②為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項，即稱為住戶公約 ③區分所有：指數人區分一建築物而各有其專用部分 ④登記簿謄本記載之主建物與附屬建築物面積，即屬公寓大廈管理條例所指專有部分面積", "options": ["①②", "②③", "③④", "①④"], "answer": "D", "explains": {"A": "②錯誤，此共同遵守事項法定名稱為「規約」，非「住戶公約」（用詞錯誤）。", "B": "②③皆錯誤。", "C": "③錯誤，區分所有應為「各有其專有部分」，而非「專用部分」，用詞錯誤（專有部分與約定專用部分為不同概念）。", "D": "正確。①受區權會決議或管委會僱傭委任之警衛屬管理服務人，敘述正確；④登記簿謄本記載之主建物與附屬建築物面積即為專有部分面積，敘述正確，①④組合正確。"}, "ref": "公寓大廈管理條例第3條", "id": 6, "chapter": "E3"}, {"year": 99, "qnum": 36, "stem": "下列有關於住戶之權利義務，何者錯誤？", "options": ["專有部分之共同壁內之管線，其維修費用由該共同壁雙方共同負擔", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會之決議為之", "約定專用部分之修繕、管理、維護，由約定專用部分之使用人為之，並負擔其費用", "約定共用部分之修繕、管理、維護，其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之"], "answer": "B", "explains": {"A": "共同壁管線維修費用由雙方共同負擔，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」之決議為之，而非「管理委員會」決議，此為全科極高頻陷阱：管理委員會僅有「執行」權，重大處分事項須經區分所有權人會議決議。", "C": "約定專用部分由使用人自行修繕維護並負擔費用，敘述正確，非本題答案。", "D": "約定共用部分費用由公共基金或依比例分擔，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第10條、第11條", "id": 7, "chapter": "E3"}, {"year": 99, "qnum": 37, "stem": "依公寓大廈管理條例規定，於區分所有權人會議訂定規約前，規約草約經承受人簽署同意後之效力為何？", "options": ["視為規約", "阻卻違法", "其內容不具拘束力", "僅供參考"], "answer": "A", "explains": {"A": "正確。區分所有權人會議訂定規約前，規約草約經承受人簽署同意者，「視為規約」，具有規約之拘束力。", "B": "阻卻違法為刑法概念，與本題無關。", "C": "經簽署同意後具有拘束力，非不具拘束力。", "D": "經簽署同意後視為規約，非僅供參考。"}, "ref": "公寓大廈管理條例第23條", "id": 8, "chapter": "E3"}, {"year": 100, "qnum": 2, "stem": "公寓大廈建築物所有權登記之區分所有權人數及其區分所有權比例在多少以上，起造人應於三個月內召開區分所有權人會議，成立管理委員會？", "options": ["五分之一、五分之一", "二分之一、二分之一", "三分之一、三分之二", "三分之二、四分之三"], "answer": "B", "explains": {"A": "比例錯誤，非五分之一。", "B": "正確。區分所有權人數達「二分之一以上」及其區分所有權比例合計「二分之一以上」時，起造人應於3個月內召開會議成立管委會，此為高頻數字（與③會議決議門檻2/3、3/4不同，須區辨）。", "C": "比例錯誤，非三分之一、三分之二（此為決議之出席門檻，非起造人召集門檻）。", "D": "比例錯誤，非三分之二、四分之三（此為決議之表決門檻，非起造人召集門檻）。"}, "ref": "公寓大廈管理條例第28條", "id": 9, "chapter": "E3"}, {"year": 100, "qnum": 3, "stem": "對於一樓住戶在公寓大廈一樓外牆面改建增設鐵門，除應依法令規定之外，得依何種程序方式另為限制？", "options": ["管理委員會主任委員之同意", "管理委員會會議決議", "區分所有權人會議決議", "區分所有權人之半數同意"], "answer": "C", "explains": {"A": "主委個人同意層級過低，非法定程序。", "B": "管理委員會會議決議層級不足，外牆變更使用屬重大事項應經區分所有權人會議。", "C": "正確。外牆面等非專有部分之變更使用，除法令規定外，應依「區分所有權人會議決議」另為限制（或規約另有規定並報備者），此為外牆使用限制之標準考點。", "D": "區分所有權人半數同意非法定會議決議程序，用語不精確。"}, "ref": "公寓大廈管理條例第8條", "id": 10, "chapter": "E3"}, {"year": 100, "qnum": 4, "stem": "公寓大廈共用部分設施之拆除，應經下列何者程序始得為之？", "options": ["管理委員會會議決議", "區分所有權人會議決議", "區分所有權人與管理委員會之協議", "管理委員會與住戶之協議"], "answer": "B", "explains": {"A": "管理委員會決議層級不足，拆除屬重大處分事項。", "B": "正確。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」決議為之，此為極高頻重複命題觀念。", "C": "協議非法定程序，須經會議決議。", "D": "協議非法定程序，須經會議決議。"}, "ref": "公寓大廈管理條例第11條", "id": 11, "chapter": "E3"}, {"year": 100, "qnum": 11, "stem": "區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後最長幾日內送達各區分所有權人並公告之？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "B", "explains": {"A": "數字錯誤，非十日。", "B": "正確。會議紀錄應由主席簽名，於會後「15日內」送達各區分所有權人並公告，此為高頻數字，須與召集通知「開會前10日」區辨。", "C": "數字錯誤，非二十日。", "D": "數字錯誤，非三十日。"}, "ref": "公寓大廈管理條例第34條", "id": 12, "chapter": "E3"}, {"year": 101, "qnum": 13, "stem": "依據公寓大廈管理條例規定，下列有關共用部分之敘述，何者為錯誤？", "options": ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者，從其約定", "共用部分、約定共用部分之修繕、管理、維護，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之。但修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會會議之決議為之", "住戶對共用部分之使用應依其設置目的及通常使用方法為之。但另有約定者從其約定"], "answer": "C", "explains": {"A": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "B": "共用部分修繕管理維護由管理負責人/管理委員會為之，費用分擔規則正確，非本題答案。", "C": "正確答案（錯誤敘述）。應依「區分所有權人會議」決議為之，而非「管理委員會會議」，此為極高頻重複命題陷阱（本科目重複命題率最高之觀念之一）。", "D": "依設置目的及通常使用方法使用，但另有約定從其約定，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第9條、第10條、第11條", "id": 13, "chapter": "E3"}, {"year": 101, "qnum": 17, "stem": "依公寓大廈管理條例規定，下列有關管理委員會敘述何者錯誤？", "options": ["管理委員會係指由區分所有權人選任住戶若干人為管理委員所設立之組織", "管理委員會不具有當事人能力", "管理委員會會議決議之內容不得違反區分所有權人會議決議", "管理委員會之職務包括約定共用部分及其附屬設施設備之點收及保管"], "answer": "B", "explains": {"A": "管理委員會係由區分所有權人選任住戶若干人設立之組織，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。管理委員會「有」當事人能力，得為原告或被告，此為法定明文賦予之訴訟能力，本選項方向相反，屬★高頻陷阱。", "C": "管理委員會決議不得違反區分所有權人會議決議，敘述正確，非本題答案。", "D": "點收保管約定共用部分及附屬設施設備為管理委員會職務之一，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第3條、第36條、第38條", "id": 14, "chapter": "E3"}, {"year": 102, "qnum": 1, "stem": "關於區分所有權之繼受人，應於繼受前向管理負責人或管理委員會請求閱覽或影印之文件，不包括以下何者？", "options": ["會計憑證", "區分所有權人名冊", "公共基金餘額", "管理委員會會議紀錄"], "answer": "B", "explains": {"A": "會計憑證屬繼受人得請求閱覽影印之文件，非本題答案。", "B": "正確答案。「區分所有權人名冊」涉及全體住戶個資，非繼受人得請求閱覽影印之文件範圍，此為個資保護★陷阱：繼受人僅能查閱與自身交易相關之財務、規約類文件，不含全體住戶名冊。", "C": "公共基金餘額屬繼受人得請求閱覽影印之文件，非本題答案。", "D": "管理委員會會議紀錄屬繼受人得請求閱覽影印之文件，非本題答案。"}, "ref": "公寓大廈管理條例第24條", "id": 15, "chapter": "E3"}, {"year": 102, "qnum": 14, "stem": "在公寓大廈樓頂平臺設置廣告物，除應依法令規定辦理外，尚應受何限制？", "options": ["管理委員會之決議", "管理負責人之許可", "區分所有權人會議決議", "頂層住戶同意"], "answer": "C", "explains": {"A": "管理委員會決議層級不足。", "B": "管理負責人個人許可層級不足。", "C": "正確。樓頂平台設置廣告物等非專有部分之使用限制，除法令規定外，應依「區分所有權人會議決議」（或規約另有規定並報備），與外牆設置廣告物之規定相同法理。", "D": "頂層住戶同意非法定程序，樓頂平台屬全體共有，非頂層住戶專屬。"}, "ref": "公寓大廈管理條例第8條", "id": 16, "chapter": "E3"}, {"year": 102, "qnum": 15, "stem": "下列有關公寓大廈管理委員會之敘述，何者錯誤？", "options": ["管理委員會有當事人能力", "管理委員會為原告或被告時，應將訴訟事件要旨速告區分所有權人", "管理委員會應向區分所有權人會議召集人負責，並向其報告會務", "管理委員會會議決議之內容不得違反區分所有權人會議決議"], "answer": "C", "explains": {"A": "管理委員會有當事人能力，敘述正確，非本題答案。", "B": "為原告或被告時應將訴訟事件要旨速告區分所有權人，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。管理委員會應向「區分所有權人會議」負責並報告會務，而非向「會議召集人」個人負責，負責對象錯誤，此為★陷阱。", "D": "管理委員會決議不得違反區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第36條、第38條", "id": 17, "chapter": "E3"}, {"year": 102, "qnum": 18, "stem": "關於區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人所有之專有部分之個數超過全部專有部分個數總合之多少比例以上者，其超過部分不予計算？", "options": ["二分之一", "三分之一", "五分之一", "十分之一"], "answer": "C", "explains": {"A": "比例錯誤。", "B": "比例錯誤。", "C": "正確。專有部分個數超過全部個數總合「五分之一以上」者，其超過部分不予計算，此與「區分所有權比例超過五分之一以上者超過部分不予計算」為併行之兩項限制，皆為五分之一，須同時牢記。", "D": "比例錯誤。"}, "ref": "公寓大廈管理條例第27條", "id": 18, "chapter": "E3"}, {"year": 102, "qnum": 19, "stem": "公寓大廈之住戶於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，以下敘述何者正確？", "options": ["得自由進入或使用，但應修復或補償所生損害", "應經管理服務人之同意", "應經管理負責人或管理委員會之同意", "應經區分所有權人會議之同意"], "answer": "C", "explains": {"A": "並非得自由進入使用，仍須經同意程序，此為未經同意逕行使用之錯誤敘述。", "B": "管理服務人非同意權主體，管理服務人僅受僱執行事務。", "C": "正確。住戶因維護修繕專有部分、約定專用部分或設置管線而須使用共用部分時，應經「管理負責人或管理委員會」之同意，此為日常性使用便利之考量，門檻低於區分所有權人會議決議（該部分適用於變更、拆除等重大處分事項）。", "D": "區分所有權人會議層級過高，此為日常性同意事項非須經大會決議。"}, "ref": "公寓大廈管理條例第6條", "id": 19, "chapter": "E3"}, {"year": 103, "qnum": 14, "stem": "依公寓大廈管理條例規定，因重大瓦斯氣爆引發火災肇致該公寓大廈有危害公共安全之虞，擬進行重建時，下列敍述何者錯誤？", "options": ["應經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "需經區分所有權人會議決議", "當區分所有權人不同意法定會議之決議又不出讓區分所有權，管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。因地震、水災、風災、火災或其他重大事變致有危害公共安全之虞而重建者，「不須」經全體區分所有權人及基地所有權人、地上權人或典權人之同意，僅須經區分所有權人會議特別決議即可，此為重大事變重建之特別簡化程序，與一般改建（須全體同意）不同，屬★極高頻陷阱。", "B": "重建須經區分所有權人會議決議，敘述正確，非本題答案。", "C": "不同意者管委會得訴請法院命出讓應有部分，敘述正確，非本題答案。", "D": "重建之建照申請以區分所有權人會議決議之名義為之，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 20, "chapter": "E3"}, {"year": 103, "qnum": 16, "stem": "依公寓大廈管理條例規定，區分所有權人因故無法出席區分所有權人會議時，得以書面委託代理人出席。下列何者不是公寓大廈管理條例所規定的代理人？", "options": ["承租人", "有行為能力之直系血親", "其他區分所有權人", "管理服務人"], "answer": "D", "explains": {"A": "承租人得受託為代理人出席，非本題答案。", "B": "有行為能力之直系血親得受託為代理人出席，非本題答案。", "C": "其他區分所有權人得受託為代理人出席，非本題答案。", "D": "正確答案。管理服務人（如物業管理公司人員）並非法定得受託出席會議之代理人身分，因管理服務人屬受僱執行事務者，與住戶利益關係不同，法律未將其列為法定代理人範圍。"}, "ref": "公寓大廈管理條例第25條", "id": 21, "chapter": "E3"}, {"year": 103, "qnum": 19, "stem": "Ａ封閉式公寓大廈為區分所有建物。下列敘述，何者正確？", "options": ["Ａ公寓大廈專有部分的無權占有人甲，並非住戶，故並無積欠該大廈應負擔費用的問題", "Ａ公寓大廈每年至少應召開住戶大會一次", "針對Ａ公寓大廈區分所有人乙積欠管理費，現行法有法定優先受償權的規定", "Ａ公寓大廈於一定要件下，得以該辦公、商場部分召開區分所有權人會議"], "answer": "C", "explains": {"A": "無權占有人實際使用專有部分，仍屬「住戶」定義範圍（住戶不以有權占有為限），仍有積欠費用問題，敘述錯誤。", "B": "法定用語為「區分所有權人會議」，並非「住戶大會」，用詞錯誤。", "C": "正確。區分所有權人積欠管理費，於強制執行後對拍賣所得，就積欠本條例應分擔費用部分，享有與第一順位抵押權相同之優先受償權，此為公寓大廈管理費優先受償權★高頻考點。", "D": "以辦公商場部分召開會議之特例，適用於「非封閉式」公寓大廈，本題為「封閉式」公寓大廈，不符特例要件，敘述錯誤。"}, "ref": "公寓大廈管理條例第3條、第24條之1（第22條）", "id": 22, "chapter": "E3"}, {"year": 103, "qnum": 20, "stem": "依公寓大廈管理條例規定，有關公寓大廈之公共基金，下列敍述何者正確？", "options": ["區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉；不得因個人事由為讓與、扣押、抵銷或設定負擔", "公共基金應設專戶儲存，其運用應依管理委員會會議之決議為之", "起造人應按建築物銷售總金額一定比例或金額提列公共基金", "起造人於該公寓大廈建造執照申請時，應提出繳交各直轄市、縣（市）主管機關公庫代收公共基金之證明"], "answer": "A", "explains": {"A": "正確。公共基金權利隨區分所有權移轉而移轉，不得因個人事由讓與、扣押、抵銷或設定負擔，具高度屬物從屬性，敘述完整正確。", "B": "公共基金運用應依「區分所有權人會議」決議，而非「管理委員會會議」，決議層級錯誤。", "C": "起造人應按「工程造價」一定比例或金額提列，而非「建築物銷售總金額」，計算基礎錯誤。", "D": "起造人應於「使用執照」申請時（而非建造執照申請時）提出繳交公庫代收公共基金之證明，時點錯誤。"}, "ref": "公寓大廈管理條例第18條", "id": 23, "chapter": "E3"}, {"year": 103, "qnum": 21, "stem": "依公寓大廈管理條例第三十二條有關區分所有權人會議未獲致決議，重新開議之規定，下列敘述何者正確？", "options": ["其開議除規約另有規定出席人數外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席", "應以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議", "決議之會議紀錄各區分所有權人得於十日內以書面表示反對意見", "書面反對意見未超過出席區分所有權人及其區分所有權比例合計半數時，該決議視為成立"], "answer": "B", "explains": {"A": "重新開議之出席門檻已降低，非仍須三分之二以上出席，此為第一次會議未獲決議後之簡化再議程序，出席門檻已放寬。", "B": "正確。未獲決議重新開議時，應以出席人數「過半數」及其區分所有權比例占出席人數區分所有權合計「過半數」之同意即可作成決議，門檻大幅降低，此為第32條之核心簡化機制。", "C": "書面反對意見表示期限為決議送達後「10日內」，惟本題選項描述之細節（反對權基準時點）與官方條文文字有出入，官方標準答案未選此項。", "D": "反對意見「超過」（而非「未超過」）半數時，該決議才「不成立」；本選項邏輯方向誤植，敘述不符法條原意。"}, "ref": "公寓大廈管理條例第32條", "id": 24, "chapter": "E3"}, {"year": 104, "qnum": 28, "stem": "依公寓大廈管理條例之規定，下列有關公寓大廈規約之敘述，何者錯誤？", "options": ["規約是指公寓大廈住戶為增進共同利益，確保良好生活環境，經管理委員會決議之共同遵守事項", "公寓大廈樓頂平台依法得設置廣告物時，規約如另有規定並向主管機關報備有案者，仍應受該規約之限制", "禁止住戶飼養動物之特別約定，非經載明於規約者，不生效力", "區分所有權之繼受人應於繼受前閱覽規約，並於繼受後遵守規約所定一切權利義務事項"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。規約應為經「區分所有權人會議」決議之共同遵守事項，而非「管理委員會」決議，決議主體錯誤，此為與第11條同類型之高頻陷阱（管理委員會 vs 區分所有權人會議混淆）。", "B": "規約另有規定並報備者仍受其限制，敘述正確，非本題答案。", "C": "禁養動物約定須載明於規約始生效力，敘述正確，非本題答案。", "D": "繼受人應於繼受前閱覽規約並於繼受後遵守，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第3條", "id": 25, "chapter": "E3"}, {"year": 104, "qnum": 29, "stem": "依公寓大廈管理條例之規定，下列何者非公寓大廈起造人之法定義務？", "options": ["按工程造價一定比例提列公共基金", "公寓大廈建築物所有權登記達法定比例後，於三個月內召開管理委員會第一次會議", "依使用執照所記載用途及建物測繪後，辦理建物所有權第一次登記", "將公寓大廈共用設施設備、圖說、手冊等資料，會同主管機關檢測，確認其功能正常無誤後，移交給管理委員會"], "answer": "B", "explains": {"A": "按工程造價一定比例提列公共基金為起造人法定義務，非本題答案。", "B": "正確答案。起造人召集之會議係「成立管理委員會或推選管理負責人」之「第一次區分所有權人會議」，而非「管理委員會第一次會議」（管委會成立後其內部會議與起造人義務無關），用語主體錯誤，此為易混淆之陷阱。", "C": "辦理建物所有權第一次登記為起造人法定義務，非本題答案。", "D": "移交共用設施設備等資料予管理委員會為起造人法定義務，非本題答案。"}, "ref": "公寓大廈管理條例第28條、第57條", "id": 26, "chapter": "E3"}, {"year": 104, "qnum": 30, "stem": "依公寓大廈管理條例之規定，公寓大廈管理委員會應向下列何者負責，並向其報告會務？", "options": ["直轄市、縣（市）主管機關", "區分所有權人會議", "管理委員會主任委員", "管理負責人"], "answer": "B", "explains": {"A": "主管機關非管委會負責報告之對象，主管機關僅具行政監督角色。", "B": "正確。管理委員會應向「區分所有權人會議」負責，並向其報告會務，此為管委會與區權會之從屬關係核心規定。", "C": "主任委員為管委會內部職務，非管委會對外負責報告之對象。", "D": "管理負責人是無管委會時的替代角色，非管委會負責報告之對象。"}, "ref": "公寓大廈管理條例第36條", "id": 27, "chapter": "E3"}, {"year": 105, "qnum": 31, "stem": "關於公寓大廈住戶行為規範之敘述，下列何者錯誤？", "options": ["住戶不得於大樓之公共密閉處所吸菸，以免影響其他住戶健康", "針對開放空間，在直轄市、縣（市）政府核准範圍內，住戶縱依規約或區分所有權人會議決議許可得使用該空間，亦不得為營業目的使用", "住戶於公寓大廈內依法經營餐飲業者，應依中央主管機關所定保險金額投保公共意外責任保險", "住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定"], "answer": "B", "explains": {"A": "不得於公共密閉處所吸菸，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。開放空間在主管機關核准範圍內，依規約或區分所有權人會議決議「即得」供營業使用，本選項稱「亦不得為營業目的使用」方向相反，屬★陷阱。", "C": "經營餐飲業應投保公共意外責任保險，敘述正確，非本題答案。", "D": "飼養動物不得妨礙公安公衛，但法令或規約另有規定從其規定，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第16條", "id": 28, "chapter": "E3"}, {"year": 105, "qnum": 32, "stem": "依公寓大廈管理條例規定，區分所有權人召開定期會議之頻率為：", "options": ["每半年至少應召開定期會議1次", "每季至少應召開定期會議1次", "每年至少應召開定期會議1次", "每兩年至少應召開定期會議1次"], "answer": "C", "explains": {"A": "數字錯誤，非每半年。", "B": "數字錯誤，非每季。", "C": "正確。區分所有權人會議每年至少應召開定期會議1次，全科最高頻數字之一。", "D": "數字錯誤，非每兩年。"}, "ref": "公寓大廈管理條例第25條", "id": 29, "chapter": "E3"}, {"year": 105, "qnum": 35, "stem": "依公寓大廈管理條例規定，公寓大廈住戶對於非屬專有部分之利用情形，下列敘述何者正確？", "options": ["住戶得經管理委員會主委同意，於外牆面設置廣告看板", "有12歲以下兒童之住戶，如未依規約或未經區分所有權人會議決議之同意，不得擅自於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施", "有12歲以下兒童之住戶，得於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施，無庸經規約或區分所有權人會議決議同意，但設置理由消失者，住戶應予改善或回復原狀", "住戶得經頂樓住戶之許可，於樓頂平台加蓋廟宇神壇"], "answer": "C", "explains": {"A": "外牆設置廣告物須經區分所有權人會議決議（或報備規約），非主委個人同意可決定，層級不足。", "B": "正確答案應為C，本選項與C內容方向相反：法律「特別放寬」有12歲以下兒童之住戶得逕行設置防墜設施，「無庸」經規約或會議同意，此為兒童安全保障之特別規定，本選項稱須經同意，方向錯誤。", "C": "正確。為兒童安全考量，有12歲以下兒童之住戶得逕行於外牆開口部或陽台設置不妨礙逃生且不突出外牆面之防墜設施，無庸經規約或區權會決議同意；惟設置理由消失（如兒童已成年）者，應予改善或回復原狀，此為特別例外規定★高頻陷阱。", "D": "樓頂平台加蓋廟宇神壇非屬經常許可範圍，且僅頂樓住戶許可不足，仍應依區分所有權人會議決議或法令規定辦理。"}, "ref": "公寓大廈管理條例第8條", "id": 30, "chapter": "E3"}, {"year": 105, "qnum": 36, "stem": "關於公寓大廈營運與管理維護的敘述，下列何者正確？", "options": ["住戶共同事務應興革事項之決議，為管理委員會的職務之一", "受僱於公寓大廈管理維護公司之管理服務人員，不得同時受聘於2家以上之管理維護公司", "利害關係人請求閱覽或影印規約，管理委員於必要時得拒絕之，並應召集區分所有權人會議臨時會議", "公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，不得被選任、推選為管理委員、主任委員或管理負責人"], "answer": "B", "explains": {"A": "住戶共同事務應興革事項之「決議」屬區分所有權人會議之職權，管理委員會僅有「執行」相關決議之職務，主體錯誤。", "B": "正確。受僱於管理維護公司之管理服務人員，不得同時受聘於2家以上管理維護公司，此為避免利益衝突及專責管理之規定。", "C": "利害關係人請求閱覽規約，管理委員無正當理由不得拒絕（規約屬應公開文件），且法律未規定拒絕時應召集臨時會議，此為虛構程序之陷阱。", "D": "實務上非區分所有權人之住戶（如承租人）「得」被選任為管理委員（現行法已放寬此限制，不以區分所有權人為限），本選項限制過嚴，與現行條文（住戶均得被選任）不符。"}, "ref": "公寓大廈管理條例第36條、第38條之1", "id": 31, "chapter": "E3"}, {"year": 105, "qnum": 37, "stem": "區分所有權人違反公寓大廈管理條例第 22 條，管理委員會得依區分所有權人會議之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分；於判決確定後 3 個月內不自行完成者，經管理委員會聲請法院拍賣之所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序的敘述，下列何者正確？", "options": ["優先於普通抵押權", "與第一順位抵押權同", "與普通抵押權同", "與一般債權同"], "answer": "B", "explains": {"A": "並非優先於第一順位抵押權，而是與其「同」順位，此為常考混淆點（同順位≠優先受償）。", "B": "正確。積欠應分擔費用於拍賣所得中之受償順序，與「第一順位抵押權」相同，此為公寓大廈管理費優先受償權之核心規定，須注意是「同順位」而非「絕對優先」。", "C": "應為與「第一順位」抵押權同，而非「普通」抵押權同，順位層級錯誤（第一順位優先於普通抵押權）。", "D": "優先受償順序高於一般債權，非與一般債權同順位。"}, "ref": "公寓大廈管理條例第24條之1（第22條）", "id": 32, "chapter": "E3"}, {"year": 105, "qnum": 40, "stem": "公寓大廈外牆面設置廣告物，除應依法令規定辦理外，下列敘述何者正確？", "options": ["該公寓大廈規約另有規定，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，即應受該管理委員會會議決議之限制", "該公寓大廈規約另有規定，經向直轄市、縣（市）主管機關完成報備有案者，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，即應受該管理委員會會議決議之限制"], "answer": "C", "explains": {"A": "僅規約另有規定而「未經報備」者，尚不足以拘束，須完成報備程序方生此限制效力，本選項漏未報備要件。", "B": "管理委員會會議決議層級不足以限制外牆使用，須經區分所有權人會議決議（或規約規定），主體錯誤。", "C": "正確。外牆廣告物設置除法令規定外，須「規約另有規定」且「經向主管機關完成報備有案」兩要件同時具備，始受該規約限制，此為外牆使用限制之完整法定要件，缺一不可。", "D": "管理委員會會議決議非適格之限制依據，應為規約，主體錯誤。"}, "ref": "公寓大廈管理條例第8條", "id": 33, "chapter": "E3"}, {"year": 106, "qnum": 38, "stem": "依公寓大廈管理條例規定，召開區分所有權人會議之通知，應由召集人於開會幾日前以書面載明開會內容，通知各區分所有權人？", "options": ["7日", "10日", "15日", "20日"], "answer": "B", "explains": {"A": "數字錯誤，非7日。", "B": "正確。召開區分所有權人會議，應由召集人於開會「10日前」以書面載明開會內容通知各區分所有權人，此為高頻數字，須與會議紀錄送達期限「15日內」區辨（易混淆）。", "C": "數字錯誤，此為會議紀錄送達期限（15日內），非召集通知期限。", "D": "數字錯誤，非20日。"}, "ref": "公寓大廈管理條例第30條", "id": 34, "chapter": "E3"}, {"year": 106, "qnum": 39, "stem": "依公寓大廈管理條例規定，關於供區分所有權人使用部分之敘述，下列何者錯誤？", "options": ["區分所有權人除法律另有限制外，對其專有部分得自由使用、收益、處分", "獨立建築物所有權之牆壁，以牆之外緣為界。故該牆所屬區分所有權人得於區分所有人權會議決議同意後，於外牆設置廣告物", "專有部分之共同壁修繕費用，若修繕費係因可歸責於區分所有權人之事由所致，全數由該區分所有權人負擔", "公寓大廈通往室外之通路不得為約定專用部分"], "answer": "B", "explains": {"A": "對專有部分得自由使用收益處分（除法律另有限制），敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。外牆為建築物之「共用部分」（結構安全與整體外觀所繫），並非「所屬區分所有權人」得單獨決定設置廣告物之標的，須經全體區分所有權人會議決議（非該特定住戶單方申請同意即可設置），此為外牆權屬歸屬之混淆陷阱。", "C": "因可歸責事由所致之共同壁修繕費用由該區分所有權人負擔，敘述正確，非本題答案。", "D": "通往室外之通路不得為約定專用部分，敘述正確，非本題答案（此為法定不得約定專用之項目之一，攸關逃生安全）。"}, "ref": "公寓大廈管理條例第4條、第7條、第8條", "id": 35, "chapter": "E3"}, {"year": 106, "qnum": 40, "stem": "依公寓大廈管理條例規定，關於召開區分所有權人會議，下列敘述何者錯誤？", "options": ["每年至少應召開定期會議一次", "發生重大事故有及時處理之必要，經管理委員會請求者，得召開臨時會議", "須經區分所有權人三分之一以上及其區分所有權比例合計三分之一以上，以書面載明召集之目的及理由請求召集者，始得召開臨時會議", "區分所有權人會議可由具區分所有權人身分之管理委員為召集人"], "answer": "C", "explains": {"A": "每年至少召開定期會議一次，敘述正確，非本題答案。", "B": "重大事故經管委會請求得召開臨時會議，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應為區分所有權人「五分之一以上」（非「三分之一以上」）及其區分所有權比例合計五分之一以上，以書面請求召集，始得召開臨時會議，比例數字錯誤，此為★陷阱。", "D": "具區分所有權人身分之管理委員得為召集人，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第25條", "id": 36, "chapter": "E3"}, {"year": 107, "qnum": 16, "stem": "依公寓大廈管理條例之規定，非封閉式之公寓大廈集居社區其地面層為各自獨立之數幢建築物，且區內屬住宅與辦公、商場混合使用，其辦公、商場之出入口各自獨立之公寓大廈，各該幢內之辦公、商場部分，得就該幢或結合他幢內之辦公、商場部分，經其區分所有權人過多少比例之書面同意，及全體區分所有權人會議決議或規約明定法定事項後，以該辦公、商場部分召開區分所有權人會議，成立管理委員會，並向直轄市、縣（市）主管機關報備？", "options": ["二分之一", "三分之二", "五分之三", "四分之三"], "answer": "A", "explains": {"A": "正確。非封閉式住辦混合公寓大廈，辦公商場部分得經其區分所有權人「過半數（二分之一）」書面同意，並經全體區權會決議或規約明定後，以該部分單獨召開會議成立管委會，此為住辦混合社區之特別分治規定。", "B": "比例錯誤，非三分之二。", "C": "比例錯誤，非五分之三。", "D": "比例錯誤，非四分之三。"}, "ref": "公寓大廈管理條例第26條", "id": 37, "chapter": "E3"}, {"year": 107, "qnum": 20, "stem": "依公寓大廈管理條例之規定，開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，應經下列何種程序，始得供營業使用？", "options": ["經向直轄市、縣市主管機關申請許可之許可函", "依規約或區分所有權人會議決議", "依管理負責人或管理委員會之決定", "依開放空間及退縮空地鄰近之區分所有權人之同意"], "answer": "B", "explains": {"A": "單獨向主管機關申請許可函非法定要件，主管機關核准範圍是前提要件，非本項程序本身。", "B": "正確。開放空間及退縮空地在主管機關核准範圍內，應「依規約或區分所有權人會議決議」，始得供營業使用，與外牆廣告物設置程序相似法理。", "C": "管理負責人或管理委員會決定層級不足。", "D": "鄰近住戶同意非法定程序，須依規約或會議決議。"}, "ref": "公寓大廈管理條例第16條", "id": 38, "chapter": "E3"}, {"year": 107, "qnum": 21, "stem": "依公寓大廈管理條例之規定，因地震、水災、風災、火災或其他重大事變，肇致危害公共安全，而需要辦理公寓大廈之重建者，下列敘述何者錯誤？", "options": ["公寓大廈依此事由所為之重建，不須經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之", "管理負責人或管理委員會依公寓大廈管理條例之規定，訴請法院命不同意決議又不出讓區分所有權之區分所有權人出讓其區分所有權及其基地所有權應有部分後，對於該受讓人仍應徵詢其意見，不當然視為同意重建"], "answer": "D", "explains": {"A": "重大事變重建不須全體同意，敘述正確，非本題答案。", "B": "不同意者管委會得訴請法院命出讓應有部分，敘述正確，非本題答案。", "C": "重建建照申請以區分所有權人會議決議之名義為之，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。法院拍賣或裁判命出讓後，該應有部分之「受讓人視為同意重建」（法律擬制同意，非須另行徵詢意見），此為避免程序無限延宕之強制規定，本選項稱「不當然視為同意」方向相反，屬★陷阱。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 39, "chapter": "E3"}, {"year": 108, "qnum": 11, "stem": "安心社區擬於近日召開區分所有權人定期會議，討論社區管理事宜，同時選任新的管理委員。社區規約對於定期會議之召集程序及管理委員之選任事項，未定有特別規定。請問：管理委員會主任委員召集會議時，下列何項程序有違公寓大廈管理條例之規定？", "options": ["於開會前十日通知各區分所有權人", "以書面通知載明開會內容", "逕以公告代替書面通知，公告期間多於二日", "有關管理委員之選任事項，在開會通知中載明並公告之"], "answer": "C", "explains": {"A": "開會前10日通知，程序合法，非本題答案。", "B": "以書面通知載明開會內容，程序合法，非本題答案。", "C": "正確答案（違反規定之選項）。法定召集程序原則上應以「書面」通知各區分所有權人，僅於「規約另有規定」得以公告代替書面通知，本社區規約並未定有此特別規定，故不得逕以公告代替書面通知，屬程序違法，此為★陷阱：公告代替書面通知須以規約另有規定為前提要件。", "D": "管理委員選任事項應於開會通知中載明並公告，屬於「不得以臨時動議提出」之法定事項，程序合法，非本題答案。"}, "ref": "公寓大廈管理條例第30條", "id": 40, "chapter": "E3"}, {"year": 108, "qnum": 23, "stem": "以下有關公寓大廈區分所有權人會議及管理委員會兩者間關係之說明，何者錯誤？", "options": ["管理委員會有執行區分所有權人會議決議事項之義務", "管理委員會會議決議之內容不得違反區分所有權人會議決議", "管理委員會不得為訴訟之原告或被告，如起訴或被訴時，應通知區分所有權人擔當訴訟", "管理委員會應向區分所有權人會議負責，並向其報告會務"], "answer": "C", "explains": {"A": "管理委員會有執行區權會決議事項之義務，敘述正確，非本題答案。", "B": "管理委員會決議不得違反區權會決議，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。管理委員會「有」當事人能力，「得」為訴訟之原告或被告（此為法定明文賦予），並非不得為訴訟當事人，本選項方向相反，此為與101年-17題相同類型之高頻陷阱。", "D": "管理委員會應向區權會負責並報告會務，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第38條", "id": 41, "chapter": "E3"}, {"year": 108, "qnum": 24, "stem": "向上大樓已成立管理委員會，並將公共基金存放銀行專戶。住戶希望閒置的公共基金能獲取較銀行存款更高的投資報酬，擬交付信託。試問：依公寓大廈管理條例規定，應如何處理？", "options": ["經管理委員會決議後，由負責財務管理之管理委員交付信託", "經區分所有權人會議決議後，由管理委員會交付信託", "由管理委員會主任委員直接交付信託", "由負責財務管理之管理委員直接交付信託"], "answer": "B", "explains": {"A": "公共基金交付信託須經「區分所有權人會議」決議，管理委員會決議層級不足。", "B": "正確。公共基金經「區分所有權人會議」決議交付信託者，由「管理委員會」交付信託，決議主體與執行主體均正確。", "C": "主任委員個人無權逕行交付信託，須先經區權會決議。", "D": "財務管理委員個人無權逕行交付信託，須先經區權會決議。"}, "ref": "公寓大廈管理條例第18條", "id": 42, "chapter": "E3"}, {"year": 109, "qnum": 12, "stem": "關於公寓大廈之公共基金，下列敘述何者正確？", "options": ["起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列", "區分所有權人依管理委員會議決議繳納", "區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉", "區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付"], "answer": "C", "explains": {"A": "起造人應按「工程造價」一定比例或金額提列，其提列時點與「使用執照三年內管理維護事項」之描述不精確，此為條文用語混淆之陷阱選項。", "B": "區分所有權人繳納公共基金依「區分所有權比例」（或依區權會決議之分擔方式），非依「管理委員會議決議」，決議主體錯誤。", "C": "正確。公共基金權利隨區分所有權移轉而移轉，具高度屬物從屬性，此為公共基金核心規定。", "D": "法條雖有相關催告及訴請給付機制，惟本題其餘選項相較之下，C選項為條文明確直接規定，故官方標準答案為C。"}, "ref": "公寓大廈管理條例第18條", "id": 43, "chapter": "E3"}, {"year": 109, "qnum": 23, "stem": "約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理條例之規定，下列敘述何者錯誤？", "options": ["於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之", "公寓大廈本身所占之地面不得為約定專用部分", "規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約者，不生效力", "成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。維護修繕約定專用部分而須使用共用部分時，應經「管理負責人或管理委員會」之同意即可，而非須經「區分所有權人會議」同意，門檻層級錯誤，此類日常使用便利事項門檻低於重大處分事項，屬★陷阱（與102年-19題相同法理）。", "B": "公寓大廈本身所占地面不得為約定專用部分，敘述正確，非本題答案（此為法定不得約定專用之項目之一）。", "C": "約定專用部分範圍及使用主體須載明於規約始生效力，敘述正確，非本題答案。", "D": "約定專用變更須經使用人同意，但違反公共利益經訴請法院判決確定者不在此限，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第6條、第7條、第23條、第33條", "id": 44, "chapter": "E3"}, {"year": 109, "qnum": 24, "stem": "某公寓大廈社區將原本為甲所有之專有部分，經約定後供共同使用。請問該約定共用部分，於公寓大廈管理條例之規定中，下列敘述何者錯誤？", "options": ["公寓大廈之起造人於申請建造執照時，應檢附資料包含約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同", "約定共用部分之修繕、管理、維護，由專有部分區分所有權人甲負擔之", "約定共用部分，若涉及公共環境清潔衛生之維持、公共消防滅火器材之維護、公共通道溝渠及相關設施之修繕，其費用政府得視情況予以補助", "專有部分經依區分所有權人會議約定為約定共用部分者，應經甲之同意，否則不生效力"], "answer": "B", "explains": {"A": "起造人申請建照時應檢附約定共用部分圖說及規約草約，設計變更時亦同，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。約定共用部分之修繕管理維護，應由「管理負責人或管理委員會」為之（比照共用部分規定），費用由公共基金或依區分所有權人比例分擔，而非由原專有部分所有權人甲個人負擔，主體錯誤，此為★陷阱：一旦成立約定共用部分即適用共用部分之管理規則，非由原所有人單獨負擔。", "C": "約定共用部分之公益性維護費用政府得視情況補助，敘述正確，非本題答案。", "D": "專有部分經約定為約定共用部分應經甲同意，否則不生效力，敘述正確，非本題答案（保障原所有權人權益）。"}, "ref": "公寓大廈管理條例第10條、第56條", "id": 45, "chapter": "E3"}, {"year": 109, "qnum": 25, "stem": "公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者，為共用部分。公寓大廈管理條例對於共用部分權利義務關係之規定，下列敘述何者錯誤？", "options": ["管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕", "共用部分之修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔。其費用若區分所有權人會議或規約另有規定者，從其規定", "各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定", "共用部分及其相關設施之拆除，應由管理負責人或管理委員會決定為之"], "answer": "D", "explains": {"A": "住戶不得拒絕管理負責人或管理委員會因維護修繕而進入或使用其專有/約定專用部分，敘述正確，非本題答案。", "B": "因可歸責事由致修繕費用由該區分所有權人或住戶負擔，但規約或會議另有規定從其規定，敘述正確，非本題答案。", "C": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」之決議為之，而非「管理負責人或管理委員會」決定，此為本科重複命題率最高之核心觀念，須牢記。"}, "ref": "公寓大廈管理條例第6條、第10條、第9條、第11條", "id": 46, "chapter": "E3"}, {"year": 110, "qnum": 1, "stem": "依據公寓大廈管理條例有關起造人之規定，下列敘述何者錯誤？", "options": ["公寓大廈建築物之起造人有召集第1次區分所有權人會議之義務", "公寓大廈建築物起造人要領得建造執照，始可辦理公寓大廈銷售", "公寓大廈建築物起造人負有移交共用部分等之義務及移交期限", "公寓大廈建築物之起造人於申請使用執照時，應檢附規約草約"], "answer": "D", "explains": {"A": "起造人於區分所有權人達法定比例後有召集第1次會議之義務，敘述正確，非本題答案。", "B": "起造人須領得建造執照始可辦理銷售，敘述正確，非本題答案。", "C": "起造人負有移交共用部分等義務及移交期限，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。起造人應於申請「建造執照」時（而非使用執照時）檢附規約草約，申請時點錯誤，此為與103年-20題（公共基金證明應於使用執照申請時提出）相對應之另一組時點陷阱，須仔細區辨「建造執照」與「使用執照」何時檢附何種文件。"}, "ref": "公寓大廈管理條例第56條", "id": 47, "chapter": "E3"}, {"year": 110, "qnum": 3, "stem": "依據公寓大廈管理條例規定，下列敘述何者正確？", "options": ["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物", "未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造", "住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用", "依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"], "answer": "B", "explains": {"A": "樓梯間屬防火避難逃生通道，不得堆放雜物，縱經住戶協議同意亦不得為之，此屬強制規定不容約定排除，敘述錯誤。", "B": "正確。住戶為修繕時，未經申請主管建築機關核准，不得破壞建築物之主要構造，涉及結構安全之強制規定。", "C": "退縮空地在主管機關核准範圍內，「得」依規約或區分所有權人會議決議供營業使用，本選項稱不得，方向相反。", "D": "公共走道加設鐵門涉及逃生安全及建築管理法規，非僅依規約或區權會決議即可自行加設，仍須符合建築管理相關法令規定（如防火避難設施規定），非單純依規約或決議即可。"}, "ref": "公寓大廈管理條例第6條、第8條、第16條", "id": 48, "chapter": "E3"}, {"year": 110, "qnum": 4, "stem": "有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？", "options": ["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意", "約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限", "專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意", "共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"], "answer": "C", "explains": {"A": "無線電台基地台等強波發射設備之設置，屬另有特別規範（電信法相關），非以「頂層/該樓層住戶同意」為要件，此為虛構規定之陷阱選項。", "B": "約定專用變更之例外要件應為「經管理委員會或管理負責人訴請法院判決確定」，而非「經區分所有權人會議決議」，此為與109年-23題相對應之陷阱（法院判決確定 vs 會議決議之混淆）。", "C": "正確。專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意，此為保障原所有權人權益之特別生效要件。", "D": "共用部分本身即屬全體共有，並無「該專有部分區分所有權人」需個別同意之問題（此選項主客體錯置：約定專用部分之標的是共用部分，非某人專有部分，故無「該專有部分區分所有權人」同意之要件），敘述邏輯有誤。"}, "ref": "公寓大廈管理條例第33條", "id": 49, "chapter": "E3"}, {"year": 110, "qnum": 5, "stem": "下列何者不是公寓大廈管理委員會之職務？", "options": ["管理服務人之委任、僱傭及監督", "共用部分、約定專用部分及其附屬設施設備之點收及保管", "公寓大廈發生重大事故有及時處理之必要，請求召開區分所有權人臨時會議", "住戶違規情事之制止及相關資料之提供"], "answer": "B", "explains": {"A": "管理服務人之委任僱傭及監督為管理委員會職務之一，非本題答案。", "B": "正確答案。應為「共用部分及」約定「共用」部分（非「約定專用部分」）及其附屬設施設備之點收保管，本選項誤植為「約定專用部分」，範圍主體錯誤（約定專用部分是供特定住戶使用，非管委會點收保管之共用性質標的），此為文字替換之★陷阱。", "C": "重大事故時請求召開臨時會議為管理委員會職務之一，非本題答案。", "D": "住戶違規情事之制止及相關資料提供為管理委員會職務之一，非本題答案。"}, "ref": "公寓大廈管理條例第36條", "id": 50, "chapter": "E3"}, {"year": 110, "qnum": 6, "stem": "公寓大廈之區分所有權人因違反規約情節重大者，管理委員會如何要求區分所有權人出讓其區分所有權及其基地所有權應有部分？", "options": ["依管理委員會議之決議訴請法院命其強制出讓", "依區分所有權人會議之決議訴請法院命其強制出讓", "依管理委員會議之決議報請直轄市、縣（市）政府強制執行", "依區分所有權人會議之決議報請直轄市、縣（市）政府強制執行"], "answer": "B", "explains": {"A": "決議主體應為「區分所有權人會議」，非「管理委員會議」，決議層級錯誤。", "B": "正確。違反規約情節重大者，管理委員會應依「區分所有權人會議」之決議，訴請「法院」命其強制出讓應有部分，決議主體及執行機關（法院）皆正確。", "C": "應訴請「法院」判決，而非「報請主管機關強制執行」，執行機關錯誤。", "D": "決議主體正確但執行機關錯誤，應訴請法院而非報請主管機關。"}, "ref": "公寓大廈管理條例第22條", "id": 51, "chapter": "E3"}, {"year": 110, "qnum": 7, "stem": "公寓大廈公共基金之來源及運用、管理方式，下列何者正確？", "options": ["起造人就公寓大廈領得建造執照一年內之管理維護事項，應按工程造價一定比例或金額提列為公共基金", "區分所有權人依管理委員會決議繳納公共基金", "公共基金經區分所有權人會議決議交付信託者，由管理委員會主任委員交付信託", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理"], "answer": "D", "explains": {"A": "起造人提列公共基金並非以「領得建造執照一年內管理維護事項」為描述基準，此為條文用語混淆之陷阱選項，非官方標準答案。", "B": "應依「區分所有權比例」（非管理委員會決議）繳納公共基金，主體錯誤。", "C": "信託應由「管理委員會」（機關本身），而非「主任委員」個人交付信託，主體錯誤。", "D": "正確。公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理，此為公共基金管理之核心規定。"}, "ref": "公寓大廈管理條例第18條", "id": 52, "chapter": "E3"}, {"year": 111, "qnum": 17, "stem": "依公寓大廈管理條例之規定，下列之定義何者正確？", "options": ["約定專用部分：指公寓大廈專有部分經約定供共同使用者", "管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司", "專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權", "公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"], "answer": "D", "explains": {"A": "正確定義應為「約定專用部分：指公寓大廈共用部分經約定供特定區分所有權人使用者」，本選項將「約定專用」與「約定共用」定義互換，用語錯誤。", "B": "此為「管理服務人」之定義（受委任執行事務者），非「管理負責人」（管理負責人是住戶互推之個人，非公司或受僱人員），定義主體混淆。", "C": "此為「區分所有」之定義，非「專有部分」之定義（專有部分係指公寓大廈之一部分，具構造上及使用上獨立性，且得單獨為所有權之標的者），定義互換錯誤。", "D": "正確。公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地，定義完整正確。"}, "ref": "公寓大廈管理條例第3條", "id": 53, "chapter": "E3"}, {"year": 112, "qnum": 9, "stem": "依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？", "options": ["住戶大會決議事項之執行", "住戶違規情事之制止及相關資料之提供", "共有及共用部分之清潔、維護、重大修繕及改良", "住戶共同事務應興革事項之決定與管理"], "answer": "B", "explains": {"A": "法定用語為「區分所有權人會議」決議事項之執行，並非「住戶大會」，用詞錯誤。", "B": "正確。住戶違規情事之制止及相關資料之提供，為管理委員會之法定職務之一。", "C": "共用部分之「重大修繕及改良」須依區分所有權人會議決議為之，非管理委員會逕行決定執行之職務範圍，管理委員會僅負責日常清潔維護（非重大修繕改良之決定權）。", "D": "住戶共同事務應興革事項之「決定」屬區分所有權人會議之職權，管理委員會僅有「執行」之職務，非「決定」，主體錯誤。"}, "ref": "公寓大廈管理條例第36條", "id": 54, "chapter": "E3"}, {"year": 112, "qnum": 10, "stem": "有關公寓大廈公共基金之設置，下列何者錯誤？", "options": ["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列", "起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理", "公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"], "answer": "B", "explains": {"A": "起造人就領得使用執照1年內管理維護事項按工程造價比例提列公共基金，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。起造人應於使用執照申請時提出繳交公庫代收之證明，惟公庫代為撥付之對象應為「管理委員會或管理負責人」（於其成立後），而非於「召開區分所有權人會議時」逕行撥付，撥付時點及對象敘述不精確，此為條文細節混淆之陷阱。", "C": "公共基金設專戶儲存並由管理負責人或管理委員會負責管理，敘述正確，非本題答案。", "D": "公共基金信託後之運用仍依區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第18條", "id": 55, "chapter": "E3"}, {"year": 113, "qnum": 4, "stem": "有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？", "options": ["專有部分之修繕，由各該區分所有權人為之，並負擔其費用", "共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之", "共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定", "共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"], "answer": "C", "explains": {"A": "專有部分修繕由該區分所有權人為之並負擔費用，敘述正確，非本題答案。", "B": "共用部分修繕由管理負責人或管委會為之，費用由公共基金或依比例分擔，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。因可歸責事由所致之修繕費用，仍應由「管理負責人或管理委員會」負責修繕（執行修繕之主體不變），僅費用由該可歸責之區分所有權人負擔，本選項稱「由區分所有權人為之」（即由該人自行修繕執行），混淆了執行主體與費用負擔主體，屬★陷阱。", "D": "共用部分重大修繕依區分所有權人會議決議為之，費用由公共基金或依比例分擔，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第10條、第11條", "id": 56, "chapter": "E3"}, {"year": 113, "qnum": 5, "stem": "按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？", "options": ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定", "共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用", "共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定", "共用部分之拆除，應依區分所有權人會議之決議為之"], "answer": "C", "explains": {"A": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "B": "共用部分得約定專用，但違反法令使用限制者不得約定專用，敘述正確，非本題答案。", "C": "正確答案（不符規定之敘述）。共用部分之應有部分應隨同專有部分一併移轉或設定負擔，此為「強制規定」，並「不得」另有約定排除（與專有部分不可分離原則有關，維護產權單一性），本選項稱「另有約定者從其約定」，此為錯誤延伸適用範圍，屬★陷阱。", "D": "共用部分拆除依區分所有權人會議決議為之，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第4條、第9條、第11條", "id": 57, "chapter": "E3"}, {"year": 113, "qnum": 6, "stem": "某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第 30 條及第 31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？", "options": ["因未經全體區分所有權人之同意，該公寓社區不得進行重建", "管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分", "管理負責人或管理委員會得訴請法院將甲強制遷離", "管理負責人或管理委員會得請求主管機關為必要之處置"], "answer": "B", "explains": {"A": "因地震等重大事變而重建者，不須經全體區分所有權人同意，僅須經區分所有權人會議特別決議（2/3出席3/4同意）即可，敘述錯誤。", "B": "正確。甲不同意重建決議又不出讓區分所有權者，管理負責人或管理委員會得訴請法院命甲「出讓」其區分所有權及其基地所有權應有部分，此為重建異議處理之核心機制。", "C": "訴請法院「強制遷離」適用於違反義務情節重大（如積欠費用）之情形，非重建異議之處理方式，兩者法律效果不同，不應混淆。", "D": "法律已明定訴請法院命出讓應有部分之機制，非請求主管機關為必要處置，此為虛構程序之陷阱選項。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 58, "chapter": "E3"}, {"year": 113, "qnum": 7, "stem": "依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"], "answer": "A", "explains": {"A": "正確。區分所有權人達「半數以上」及其區分所有權比例合計「半數以上」時，起造人應於3個月內召開會議成立管委會或推選管理負責人並報備，此為高頻重複命題之標準門檻（與「二分之一、二分之一」為同一數字之不同表述）。", "B": "比例組合錯誤，非半數與三分之二之組合。", "C": "比例組合錯誤，非三分之二與半數之組合。", "D": "比例組合錯誤，非三分之二與三分之二之組合（此組合近似會議決議之較高門檻，非起造人召集門檻）。"}, "ref": "公寓大廈管理條例第28條", "id": 59, "chapter": "E3"}, {"year": 114, "qnum": 1, "stem": "公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？", "options": ["依區分所有權人會議決議", "公寓大廈管理委員會", "頂樓住戶", "頂樓住戶和管理委員會共同負責"], "answer": "B", "explains": {"A": "日常修繕（非拆除、重大修繕或改良之處分性事項）不須經區分所有權人會議決議，管理委員會即可依職權辦理修繕。", "B": "正確。頂樓平台屬公寓大廈之共用部分，因年久失修（非可歸責於特定人之事由）致漏水，其修繕義務人為「管理負責人或管理委員會」，費用由公共基金支付或依比例分擔。", "C": "頂樓平台非頂樓住戶之專有部分（僅可能為約定專用部分，仍屬共用性質），非由頂樓住戶單獨負修繕義務。", "D": "非因可歸責於頂樓住戶之事由所致（年久失修），修繕義務應歸屬管理委員會，非頂樓住戶共同負責。"}, "ref": "公寓大廈管理條例第10條", "id": 60, "chapter": "E3"}, {"year": 114, "qnum": 2, "stem": "舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？", "options": ["管理委員選任之事項", "公共區域禁止吸煙之事項", "公共設施緊急維修之事項", "調整收取社區管理費之事項"], "answer": "A", "explains": {"A": "正確。管理委員選任之事項，因涉及重大人事決定，須事先於開會通知中載明並公告，不得以臨時動議提出，此為保障住戶充分知情參與之程序保障規定。", "B": "公共區域禁煙屬一般議案，非法定禁止臨時動議之事項。", "C": "緊急維修事項因具急迫性，得依情況彈性處理，非法定禁止臨時動議之事項。", "D": "調整管理費屬一般議案，非法定禁止臨時動議之事項（惟仍建議事先載明較為周延，但非強制禁止臨時動議之法定事項）。"}, "ref": "公寓大廈管理條例第30條", "id": 61, "chapter": "E3"}, {"year": 114, "qnum": 3, "stem": "依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？", "options": ["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定", "管理委員會會議得決議各管理委員任期為1年或2年", "主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次", "管理委員會的各管理委員之任期屆滿，連選得連任"], "answer": "C", "explains": {"A": "管理委員任期「得」規定於規約中，並非不可，敘述錯誤。", "B": "管理委員任期應規定於規約或由區分所有權人會議決議，非由「管理委員會會議」自行決議決定，決議主體層級不足。", "C": "正確。主任委員、財務管理委員及監察業務委員之任期屆滿，「連選得連任一次」，此為避免權力集中之限制規定，屬本科高頻重複命題考點。", "D": "一般管理委員任期屆滿「連選得連任」（無次數限制），但主委、財委、監委三類特定職務則限制「連任一次」，本選項未區分職務類型，一概而論，敘述不夠精確（易與C選項混淆，此為對照組陷阱）。"}, "ref": "公寓大廈管理條例第29條", "id": 62, "chapter": "E3"}, {"year": 114, "qnum": 4, "stem": "甲在公寓大廈 1 樓開店營業，向管理委員會表示想要於該大樓 1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？", "options": ["管理委員會開會同意", "管理委員會會議及區分所有權人會議決議同意", "2樓區分所有權人同意", "區分所有權人會議決議同意及1樓、2樓區分所有權人同意"], "answer": "D", "explains": {"A": "管理委員會開會同意層級不足，外牆設置廣告物須經區分所有權人會議決議。", "B": "管理委員會會議決議非法定必要程序，仍應以區分所有權人會議決議為核心要件。", "C": "僅2樓區分所有權人同意不足，尚須經區分所有權人會議決議及1樓區分所有權人（廣告物所在牆面涉及樓層）同意。", "D": "正確。外牆設置廣告物涉及整體建築物外觀及結構安全，須經「區分所有權人會議決議同意」；又因廣告物設置範圍橫跨1、2樓外牆，並涉及該特定樓層之權益，故尚須經「1樓、2樓區分所有權人」個別同意，雙重要件缺一不可。"}, "ref": "公寓大廈管理條例第8條、第33條", "id": 63, "chapter": "E3"}, {"year": 114, "qnum": 15, "stem": "依公寓大廈管理條例之規定，關於共用部分之敘述，何者錯誤？", "options": ["各區分所有權人對建築物之共用部分及其基地有使用收益之權利，按其共有之應有部分比例，不得另行約定之", "住戶對共用部分之使用方法，可以另外約定調整之", "共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。各區分所有權人按應有部分比例對共用部分及基地有使用收益之權，「但另有約定者，從其約定」，本選項稱「不得另行約定」，方向相反，法律明文允許另有約定，此為★陷阱。", "B": "住戶對共用部分之使用方法得另外約定調整，敘述正確，非本題答案。", "C": "共用部分拆除重大修繕改良依區分所有權人會議決議為之，敘述正確，非本題答案。", "D": "專有部分不得與共用部分應有部分及基地權利應有部分分離移轉，敘述正確，非本題答案（維護產權整體性之強制規定）。"}, "ref": "公寓大廈管理條例第4條、第9條、第11條", "id": 64, "chapter": "E3"}, {"year": 114, "qnum": 16, "stem": "甲買了一個社區的房子，剛好到了要召開區分所有權人會議的時間。依公寓大廈管理條例之規定，區分所有權人會議至少多久應召開定期會議一次？", "options": ["每3個月", "每季", "每半年", "每年"], "answer": "D", "explains": {"A": "數字錯誤，非每3個月。", "B": "數字錯誤，非每季（與每3個月相同意涵之誤導選項）。", "C": "數字錯誤，非每半年。", "D": "正確。區分所有權人會議每年至少應召開定期會議1次，全科最高頻數字，反覆重複命題。"}, "ref": "公寓大廈管理條例第25條", "id": 65, "chapter": "E3"}, {"year": 114, "qnum": 17, "stem": "區分所有權人會議之決議，依公寓大廈管理條例，除規約另有規定，應有區分所有權人⑴以上及其區分所有權比例合計 ⑵以上出席，以出席人數 ⑶以上及其區分所有權比例占出席人數區分所有權 ⑷以上之同意行之。上述⑴⑵⑶⑷之比例，依序應為多少？", "options": ["二分之一、二分之一、三分之二、三分之二", "二分之一、三分之二、三分之二、四分之三", "三分之二、三分之二、四分之三、四分之三", "三分之二、四分之三、四分之三、五分之四"], "answer": "C", "explains": {"A": "比例組合錯誤，出席門檻應為三分之二（非二分之一）。", "B": "比例組合錯誤，出席門檻應皆為三分之二（非二分之一與三分之二混合）。", "C": "正確。除規約另有規定外，應有區分所有權人「三分之二以上」及其區分所有權比例合計「三分之二以上」出席，以出席人數「四分之三以上」及其區分所有權比例占出席人數區分所有權「四分之三以上」之同意行之，此為區分所有權人會議一般事項決議之標準門檻（俗稱2/3出席、3/4同意，惟精確數字為出席2/3、同意4/4分之3），務必牢記完整四個數字組合。", "D": "比例組合錯誤，同意門檻應為四分之三（非五分之四）。"}, "ref": "公寓大廈管理條例第31條", "id": 66, "chapter": "E3"}];
const STORAGE_KEY = "brokerlaw_e3_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
