<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}document.documentElement.setAttribute("data-theme",s||"light")})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規刷題練習｜E3管理組織與會議決議</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E6;--surface:#FFFEFA;--ink:#25302C;--sub:#5F6B63;--line:#DAD6C3;--pri:#2F5D50;--pri2:#3E7566;--on:#FFFFFF;--pri-soft:#DDEBE5;--acc:#B8782E;--acc-ink:#8A5517;--acc-soft:#F7E6CC;--ok:#35693F;--ok-soft:#E0EFE0;--bad:#A8402B;--bad-soft:#F8E1DC;--warn:#FBF1D9;--shadow:0 2px 8px rgba(37,48,44,.07)}
:root[data-theme="dark"]{--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--surface:#1F2723;--ink:#E7ECE6;--sub:#A5B1A8;--line:#33403A;--pri:#84C2AE;--pri2:#6FAE9A;--on:#161C19;--pri-soft:#24362F;--acc:#E0B070;--acc-ink:#E6C06E;--acc-soft:#3A3220;--ok:#8FCB93;--ok-soft:#22351F;--bad:#F08A7E;--bad-soft:#42261F;--warn:#3A3220;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65;padding-bottom:84px}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg);}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem;margin:0;color:var(--pri);flex:1;min-width:0}
.th{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;flex:none}
.sub{font-size:.76rem;color:var(--sub);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.76rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--sub)}
.stat b{color:var(--pri)}
.controls{max-width:760px;margin:12px auto 0;padding:0 16px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:.82rem;cursor:pointer;font-family:inherit}
.fbtn.active{background:var(--pri);color:var(--on);border-color:var(--pri)}
.fbtn.danger{border-color:var(--bad);color:var(--bad)}
.fbtn.danger.active{background:var(--bad);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);padding:4px 11px;border-radius:14px;font-size:.75rem;cursor:pointer}
.chip.active{background:var(--pri-soft);color:var(--pri);border-color:var(--pri);font-weight:700}
.ords,.exs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:6px 0}
.ords button,.exs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:inherit;font-size:.78rem;cursor:pointer}
.ords button.on,.exs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.ords .sh{margin-left:auto}
.exs .ea{margin-left:auto;display:none}body[data-ex="C"] .exs .ea,body[data-ex="D"] .exs .ea{display:inline-block}
main{max-width:760px;margin:0 auto;padding:6px 16px 40px}
.yr-header,.ch-header{font-family:"Noto Serif TC",serif;font-weight:700;font-size:.92rem;color:var(--pri);padding:10px 0 6px;border-bottom:2px solid var(--pri);margin:16px 0 10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.qcard.answered-ok{border-left:4px solid var(--ok)}
.qcard.answered-ng{border-left:4px solid var(--bad)}
.qmeta{font-size:.72rem;color:var(--sub);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.wrong{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.stem{font-family:"Noto Serif TC",serif;font-size:.98rem;font-weight:500;margin:4px 0 10px;line-height:1.75}
.res{display:none}
.done .res{display:block;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.86rem;margin:0 0 8px;background:var(--bad-soft);color:var(--bad)}
.done .res.ok{background:var(--ok-soft);color:var(--ok)}
.hn{display:none;font-size:.72rem;color:var(--sub);margin:-4px 0 8px}
body[data-ex="C"] .done .hn,body[data-ex="D"] .done .hn{display:block}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.55}
.opt:hover{border-color:var(--pri)}
.ltr{flex-shrink:0;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.76rem}
.ob{flex:1;min-width:0}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.disabled{cursor:default}
.bg{display:none;font-size:.65rem;font-weight:700;border-radius:99px;padding:0 8px;margin-left:6px;color:#fff;vertical-align:middle}
.opt.correct .bg.a{display:inline-block;background:var(--ok)}
.opt.chosen-wrong .bg.p{display:inline-block;background:var(--bad)}
.nt{display:none;font-size:.8rem;line-height:1.6;margin-top:5px;border-top:1px dashed var(--line);padding-top:4px;color:var(--ink);font-weight:400}
.arr{display:none;float:right;margin-left:6px;color:var(--sub);transition:transform .15s}
body[data-ex="C"] .done .arr,body[data-ex="D"] .done .arr{display:inline-block}
.done .opt.open .arr,body.allopen .done .arr{transform:rotate(180deg)}
body[data-ex="C"] .done .opt.open .nt,body[data-ex="D"] .done .opt.open .nt,body.allopen .done .opt .nt{display:block}
body[data-ex="C"] .done .opt,body[data-ex="D"] .done .opt{cursor:pointer}
.explain-box{display:none;margin-top:10px;padding:10px 12px;background:var(--pri-soft);border:1px solid var(--line);border-radius:8px;font-size:.82rem}
body[data-ex="B"] .done .explain-box{display:block}
.ei{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.6}
.ei:last-child{border-bottom:none}
.el{flex-shrink:0;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:700;font-size:.7rem;margin-top:2px;color:#fff}
.el.ok{background:var(--ok)}.el.no{background:var(--sub)}.el.ng{background:var(--bad)}
.ref{margin-top:8px;font-size:.76rem;color:var(--sub)}
.errtag-row{margin-top:10px;display:none;gap:6px;flex-wrap:wrap}
.errtag-row.show{display:flex}
.etag{font-size:.72rem;padding:3px 9px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--sub)}
.etag.on-A{background:var(--bad);color:#fff;border-color:var(--bad)}
.etag.on-B{background:var(--acc);color:#fff;border-color:var(--acc)}
.etag.on-C{background:var(--pri);color:var(--on);border-color:var(--pri)}
footer{text-align:center;font-size:.7rem;color:var(--sub);padding:20px 10px 10px}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
<script src="bxj-use.js"></script>
</head>

<script>
const QUESTIONS = [{"year": 99, "qnum": 26, "stem": "下列有關公寓大廈管理條例中對公共基金規範之敘述何者錯誤？", "options": ["公共基金應設專戶儲存", "公共基金由管理負責人或管理委員會負責管理", "管理負責人或管理委員會負責管理之公共基金應不定期將其收支、保管及運用情形公告", "公共基金之運用應依區分所有權人會議之決議為之"], "answer": "C", "explains": {"A": "公共基金應設專戶儲存，敘述正確，非本題答案。", "B": "由管理負責人或管理委員會負責管理，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應為「定期」公告收支保管運用情形，而非「不定期」，此為方向相反之陷阱。", "D": "公共基金運用應依區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第20條第1項（管理負責人或管理委員會應「定期」公告公共基金及應分擔費用之收支、保管及運用情形，並於解職、離職或改組時移交）、第18條第3項（專戶儲存、管理，運用應依區權會決議）", "id": 1, "chapter": "E3"}, {"year": 99, "qnum": 27, "stem": "住戶積欠依公寓大廈管理條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者，由管理負責人或管理委員會促請其改善，於多久內其仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離？", "options": ["1個月", "3個月", "6個月", "1年"], "answer": "B", "explains": {"A": "數字錯誤，非1個月。", "B": "正確。促請改善後「3個月」內仍未改善者，得依區分所有權人會議決議訴請法院強制遷離，此為強制遷離程序之核心數字。", "C": "數字錯誤，非6個月。", "D": "數字錯誤，非1年。"}, "ref": "公寓大廈管理條例第22條", "id": 2, "chapter": "E3"}, {"year": 99, "qnum": 28, "stem": "區分所有權人會議，由全體區分所有權人組成，每年至少應召開定期會議幾次？", "options": ["1次", "2次", "4次", "12次"], "answer": "A", "explains": {"A": "正確。區分所有權人會議每年至少應召開定期會議「1次」，此為全科最高頻數字之一。", "B": "數字錯誤，非2次。", "C": "數字錯誤，非4次。", "D": "數字錯誤，非12次（非每月一次）。"}, "ref": "公寓大廈管理條例第25條", "id": 3, "chapter": "E3"}, {"year": 99, "qnum": 29, "stem": "區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人之區分所有權占全部區分所有權多少以上者，其超過部分不予計算？", "options": ["十分之一", "五分之一", "四分之一", "三分之一"], "answer": "B", "explains": {"A": "數字錯誤，非十分之一。", "B": "正確。任一區分所有權人之區分所有權占全部區分所有權「五分之一以上」者，其超過部分不予計算，此規定目的在防止大戶壟斷表決權，與「專有部分個數超過總數五分之一」規定併行適用，須同時牢記兩者皆為五分之一。", "C": "數字錯誤，非四分之一。", "D": "數字錯誤，非三分之一。"}, "ref": "公寓大廈管理條例第27條", "id": 4, "chapter": "E3"}, {"year": 99, "qnum": 30, "stem": "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上時，起造人應於幾個月內召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["1個月", "2個月", "3個月", "6個月"], "answer": "C", "explains": {"A": "數字錯誤，非1個月。", "B": "數字錯誤，非2個月。", "C": "正確。區分所有權人達半數以上及區分所有權比例合計半數以上時，起造人應於「3個月內」召集會議成立管委會或推選管理負責人並報備，此為高頻重複命題數字。", "D": "數字錯誤，非6個月。"}, "ref": "公寓大廈管理條例第28條", "id": 5, "chapter": "E3"}, {"year": 99, "qnum": 35, "stem": "下列之說明，何者為正確？ ①由區分所有權人會議決議或管理負責人或管理委員會僱傭或委任之警衛，即屬公寓大廈管理條例所稱之管理服務人 ②為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項，即稱為住戶公約 ③區分所有：指數人區分一建築物而各有其專用部分 ④登記簿謄本記載之主建物與附屬建築物面積，即屬公寓大廈管理條例所指專有部分面積", "options": ["①②", "②③", "③④", "①④"], "answer": "D", "explains": {"A": "②錯誤，此共同遵守事項法定名稱為「規約」，非「住戶公約」（用詞錯誤）。", "B": "②③皆錯誤，兩個都是用詞陷阱。②依公寓大廈管理條例第3條第12款，「為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項」法定名稱是『規約』，不是「住戶公約」。③依同條第2款，區分所有是「數人區分一建築物而各有其『專有部分』」，不是「專用部分」——專有部分是所有權的標的，約定專用部分是共用部分經約定給特定人使用，兩回事。", "C": "③錯誤，區分所有應為「各有其專有部分」，而非「專用部分」，用詞錯誤（專有部分與約定專用部分為不同概念）。", "D": "正確。①受區權會決議或管委會僱傭委任之警衛屬管理服務人，敘述正確；④登記簿謄本記載之主建物與附屬建築物面積即為專有部分面積，敘述正確，①④組合正確。"}, "ref": "公寓大廈管理條例第3條", "id": 6, "chapter": "E3"}, {"year": 99, "qnum": 36, "stem": "下列有關於住戶之權利義務，何者錯誤？", "options": ["專有部分之共同壁內之管線，其維修費用由該共同壁雙方共同負擔", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會之決議為之", "約定專用部分之修繕、管理、維護，由約定專用部分之使用人為之，並負擔其費用", "約定共用部分之修繕、管理、維護，其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之"], "answer": "B", "explains": {"A": "共同壁管線維修費用由雙方共同負擔，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」之決議為之，而非「管理委員會」決議，此為全科極高頻陷阱：管理委員會僅有「執行」權，重大處分事項須經區分所有權人會議決議。", "C": "約定專用部分由使用人自行修繕維護並負擔費用，敘述正確，非本題答案。", "D": "約定共用部分費用由公共基金或依比例分擔，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第10條、第11條", "id": 7, "chapter": "E3"}, {"year": 99, "qnum": 37, "stem": "依公寓大廈管理條例規定，於區分所有權人會議訂定規約前，規約草約經承受人簽署同意後之效力為何？", "options": ["視為規約", "阻卻違法", "其內容不具拘束力", "僅供參考"], "answer": "A", "explains": {"A": "正確。區分所有權人會議訂定規約前，規約草約經承受人簽署同意者，「視為規約」，具有規約之拘束力。", "B": "阻卻違法為刑法概念，與本題無關。", "C": "經簽署同意後具有拘束力，非不具拘束力。", "D": "經簽署同意後視為規約，非僅供參考。"}, "ref": "公寓大廈管理條例第23條", "id": 8, "chapter": "E3"}, {"year": 100, "qnum": 2, "stem": "公寓大廈建築物所有權登記之區分所有權人數及其區分所有權比例在多少以上，起造人應於三個月內召開區分所有權人會議，成立管理委員會？", "options": ["五分之一、五分之一", "二分之一、二分之一", "三分之一、三分之二", "三分之二、四分之三"], "answer": "B", "explains": {"A": "比例錯誤，非五分之一。", "B": "正確。區分所有權人數達「二分之一以上」及其區分所有權比例合計「二分之一以上」時，起造人應於3個月內召開會議成立管委會，此為高頻數字（與③會議決議門檻2/3、3/4不同，須區辨）。", "C": "比例錯誤，非三分之一、三分之二（此為決議之出席門檻，非起造人召集門檻）。", "D": "比例錯誤，非三分之二、四分之三（此為決議之表決門檻，非起造人召集門檻）。"}, "ref": "公寓大廈管理條例第28條", "id": 9, "chapter": "E3"}, {"year": 100, "qnum": 3, "stem": "對於一樓住戶在公寓大廈一樓外牆面改建增設鐵門，除應依法令規定之外，得依何種程序方式另為限制？", "options": ["管理委員會主任委員之同意", "管理委員會會議決議", "區分所有權人會議決議", "區分所有權人之半數同意"], "answer": "C", "explains": {"A": "主委個人同意層級過低，非法定程序。", "B": "管理委員會會議決議層級不足，外牆變更使用屬重大事項應經區分所有權人會議。", "C": "正確。依第8條第1項，公寓大廈周圍上下、外牆面、樓頂平臺及不屬專有部分之防空避難設備，其變更構造、顏色、設置廣告物、鐵鋁窗或其他類似行為，除應依法令規定辦理外，受「該公寓大廈規約另有規定『或』區分所有權人會議已有決議，『經向直轄市、縣（市）主管機關完成報備有案』者」之限制。★報備是兩支共用的要件：不論靠規約還是靠區權會決議，都要完成報備才算，不是只有規約才需要報備。另第8條第3項：住戶違反者，管理負責人或管理委員會應予制止；經制止不從者，報請主管機關依第49條第1項處理，該住戶並應於「一個月內」回復原狀。", "D": "區分所有權人半數同意非法定會議決議程序，用語不精確。"}, "ref": "公寓大廈管理條例第8條（第1項外牆面等變更，除依法令規定辦理外，受「規約另有規定或區權會已有決議，經向主管機關完成報備有案」之限制；第3項制止、報請主管機關依第49條第1項處理、1個月內回復原狀）、第49條第1項第2款", "id": 10, "chapter": "E3"}, {"year": 100, "qnum": 4, "stem": "公寓大廈共用部分設施之拆除，應經下列何者程序始得為之？", "options": ["管理委員會會議決議", "區分所有權人會議決議", "區分所有權人與管理委員會之協議", "管理委員會與住戶之協議"], "answer": "B", "explains": {"A": "管理委員會決議層級不足，拆除屬重大處分事項。", "B": "正確。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」決議為之，此為極高頻重複命題觀念。", "C": "「協議」不是法定程序。公寓大廈管理條例第11條第1項：共用部分及其相關設施之拆除、重大修繕或改良，「應依『區分所有權人會議』之決議為之」——決議權在區權會，不是區分所有權人與管理委員會兩方私下協議就能拆。", "D": "「協議」不是法定程序，而且主體也不對。依第11條第1項須經區分所有權人會議決議；管理委員會的角色是執行區權會決議（第36條第1款），住戶則連決議權都沒有（區權會由全體『區分所有權人』組成，第25條第1項）。★第11條第2項一起記：費用由公共基金支付，或由區分所有權人按其共有之應有部分比例分擔。"}, "ref": "公寓大廈管理條例第11條（第1項共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之；第2項費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔）、第36條第1款（管委會執行區權會決議事項）", "id": 11, "chapter": "E3"}, {"year": 100, "qnum": 11, "stem": "區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後最長幾日內送達各區分所有權人並公告之？", "options": ["十日", "十五日", "二十日", "三十日"], "answer": "B", "explains": {"A": "數字錯誤，非十日。", "B": "正確。會議紀錄應由主席簽名，於會後「15日內」送達各區分所有權人並公告，此為高頻數字，須與召集通知「開會前10日」區辨。", "C": "數字錯誤，非二十日。", "D": "數字錯誤，非三十日。"}, "ref": "公寓大廈管理條例第34條", "id": 12, "chapter": "E3"}, {"year": 101, "qnum": 13, "stem": "依據公寓大廈管理條例規定，下列有關共用部分之敘述，何者為錯誤？", "options": ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者，從其約定", "共用部分、約定共用部分之修繕、管理、維護，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之。但修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔", "共用部分及其相關設施之拆除、重大修繕或改良，應依管理委員會會議之決議為之", "住戶對共用部分之使用應依其設置目的及通常使用方法為之。但另有約定者從其約定"], "answer": "C", "explains": {"A": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "B": "共用部分修繕管理維護由管理負責人/管理委員會為之，費用分擔規則正確，非本題答案。", "C": "正確答案（錯誤敘述）。應依「區分所有權人會議」決議為之，而非「管理委員會會議」，此為極高頻重複命題陷阱（本科目重複命題率最高之觀念之一）。", "D": "依設置目的及通常使用方法使用，但另有約定從其約定，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第9條、第10條、第11條", "id": 13, "chapter": "E3"}, {"year": 101, "qnum": 17, "stem": "依公寓大廈管理條例規定，下列有關管理委員會敘述何者錯誤？", "options": ["管理委員會係指由區分所有權人選任住戶若干人為管理委員所設立之組織", "管理委員會不具有當事人能力", "管理委員會會議決議之內容不得違反區分所有權人會議決議", "管理委員會之職務包括約定共用部分及其附屬設施設備之點收及保管"], "answer": "B", "explains": {"A": "管理委員會係由區分所有權人選任住戶若干人設立之組織，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。管理委員會「有」當事人能力，得為原告或被告，此為法定明文賦予之訴訟能力，本選項方向相反，屬★高頻陷阱。", "C": "管理委員會決議不得違反區分所有權人會議決議，敘述正確，非本題答案。", "D": "點收保管約定共用部分及附屬設施設備為管理委員會職務之一，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第3條、第36條、第38條", "id": 14, "chapter": "E3"}, {"year": 102, "qnum": 1, "stem": "關於區分所有權之繼受人，應於繼受前向管理負責人或管理委員會請求閱覽或影印之文件，不包括以下何者？", "options": ["會計憑證", "區分所有權人名冊", "公共基金餘額", "管理委員會會議紀錄"], "answer": "B", "explains": {"A": "會計憑證屬繼受人得請求閱覽影印之文件，非本題答案。", "B": "正確答案。「區分所有權人名冊」涉及全體住戶個資，非繼受人得請求閱覽影印之文件範圍，此為個資保護★陷阱：繼受人僅能查閱與自身交易相關之財務、規約類文件，不含全體住戶名冊。", "C": "公共基金餘額屬繼受人得請求閱覽影印之文件，非本題答案。", "D": "管理委員會會議紀錄屬繼受人得請求閱覽影印之文件，非本題答案。"}, "ref": "公寓大廈管理條例第24條", "id": 15, "chapter": "E3"}, {"year": 102, "qnum": 14, "stem": "在公寓大廈樓頂平臺設置廣告物，除應依法令規定辦理外，尚應受何限制？", "options": ["管理委員會之決議", "管理負責人之許可", "區分所有權人會議決議", "頂層住戶同意"], "answer": "C", "explains": {"A": "管理委員會決議層級不足。", "B": "管理負責人個人許可層級不足。", "C": "正確。樓頂平臺設置廣告物屬第8條第1項列舉的範圍，除應依法令規定辦理外，受「規約另有規定『或』區分所有權人會議已有決議，『經向主管機關完成報備有案』者」之限制（報備是兩支共用的要件）。★另依第33條第2款，在樓頂平臺設置廣告物、強波發射設備等，設置於屋頂者還要經「頂層區分所有權人」同意，這是第8條之外的另一道門檻。", "D": "頂層住戶同意非法定程序，樓頂平台屬全體共有，非頂層住戶專屬。"}, "ref": "公寓大廈管理條例第8條第1項（樓頂平臺等變更受已完成報備之規約或區權會決議限制）、第33條第2款（設置於屋頂者應經頂層區分所有權人同意）", "id": 16, "chapter": "E3"}, {"year": 102, "qnum": 15, "stem": "下列有關公寓大廈管理委員會之敘述，何者錯誤？", "options": ["管理委員會有當事人能力", "管理委員會為原告或被告時，應將訴訟事件要旨速告區分所有權人", "管理委員會應向區分所有權人會議召集人負責，並向其報告會務", "管理委員會會議決議之內容不得違反區分所有權人會議決議"], "answer": "C", "explains": {"A": "管理委員會有當事人能力，敘述正確，非本題答案。", "B": "為原告或被告時應將訴訟事件要旨速告區分所有權人，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。管理委員會應向「區分所有權人會議」負責並報告會務，而非向「會議召集人」個人負責，負責對象錯誤，此為★陷阱。", "D": "管理委員會決議不得違反區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第36條（管理委員會職務十三款）、第37條（管理委員會會議決議之內容不得違反本條例、規約或區分所有權人會議決議）、第38條（管理委員會有當事人能力）、第39條（應向區分所有權人會議負責並報告會務）", "id": 17, "chapter": "E3"}, {"year": 102, "qnum": 18, "stem": "關於區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人所有之專有部分之個數超過全部專有部分個數總合之多少比例以上者，其超過部分不予計算？", "options": ["二分之一", "三分之一", "五分之一", "十分之一"], "answer": "C", "explains": {"A": "不是二分之一。公寓大廈管理條例第27條第2項的門檻是「五分之一以上」。", "B": "不是三分之一。第27條第2項是「五分之一以上」；三分之一是干擾數字。", "C": "正確。公寓大廈管理條例第27條第2項：區分所有權人會議之出席人數與表決權之計算，於任一區分所有權人之『區分所有權』占全部區分所有權「五分之一以上」者，或任一區分所有權人所有之『專有部分個數』超過全部專有部分個數總合之「五分之一以上」者，其超過部分不予計算。★同條三個五分之一一起記：第2項兩個（區分所有權比例、專有部分個數），第3項受託人代理出席也是——受託之區分所有權占全部五分之一以上，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，超過部分不予計算。", "D": "不是十分之一。第27條第2項是「五分之一以上」。"}, "ref": "公寓大廈管理條例第27條（第2項區分所有權比例與專有部分個數各五分之一以上；第3項受託人代理出席亦為五分之一）", "id": 18, "chapter": "E3"}, {"year": 102, "qnum": 19, "stem": "公寓大廈之住戶於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，以下敘述何者正確？", "options": ["得自由進入或使用，但應修復或補償所生損害", "應經管理服務人之同意", "應經管理負責人或管理委員會之同意", "應經區分所有權人會議之同意"], "answer": "C", "explains": {"A": "並非得自由進入使用，仍須經同意程序，此為未經同意逕行使用之錯誤敘述。", "B": "管理服務人非同意權主體，管理服務人僅受僱執行事務。", "C": "正確。住戶因維護修繕專有部分、約定專用部分或設置管線而須使用共用部分時，應經「管理負責人或管理委員會」之同意，此為日常性使用便利之考量，門檻低於區分所有權人會議決議（該部分適用於變更、拆除等重大處分事項）。", "D": "區分所有權人會議層級過高，此為日常性同意事項非須經大會決議。"}, "ref": "公寓大廈管理條例第6條", "id": 19, "chapter": "E3"}, {"year": 103, "qnum": 14, "stem": "依公寓大廈管理條例規定，因重大瓦斯氣爆引發火災肇致該公寓大廈有危害公共安全之虞，擬進行重建時，下列敍述何者錯誤？", "options": ["應經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "需經區分所有權人會議決議", "當區分所有權人不同意法定會議之決議又不出讓區分所有權，管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。因地震、水災、風災、火災或其他重大事變致有危害公共安全之虞而重建者，「不須」經全體區分所有權人及基地所有權人、地上權人或典權人之同意，僅須經區分所有權人會議特別決議即可，此為重大事變重建之特別簡化程序，與一般改建（須全體同意）不同，屬★極高頻陷阱。", "B": "重建須經區分所有權人會議決議，敘述正確，非本題答案。", "C": "不同意者管委會得訴請法院命出讓應有部分，敘述正確，非本題答案。", "D": "重建之建照申請以區分所有權人會議決議之名義為之，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 20, "chapter": "E3"}, {"year": 103, "qnum": 16, "stem": "依公寓大廈管理條例規定，區分所有權人因故無法出席區分所有權人會議時，得以書面委託代理人出席。下列何者不是公寓大廈管理條例所規定的代理人？", "options": ["承租人", "有行為能力之直系血親", "其他區分所有權人", "管理服務人"], "answer": "D", "explains": {"A": "承租人得受託為代理人出席，非本題答案。", "B": "有行為能力之直系血親得受託為代理人出席，非本題答案。", "C": "其他區分所有權人得受託為代理人出席，非本題答案。", "D": "正確答案。管理服務人（如物業管理公司人員）並非法定得受託出席會議之代理人身分，因管理服務人屬受僱執行事務者，與住戶利益關係不同，法律未將其列為法定代理人範圍。"}, "ref": "公寓大廈管理條例第27條第3項（代理出席之受託人限「配偶、有行為能力之直系血親、其他區分所有權人或承租人」四類；受託之區分所有權占全部五分之一以上，或以單一區分所有權計算之人數超過區分所有權人數五分之一者，超過部分不予計算）。★第25條是定期與臨時會議之召集，不是代理出席", "id": 21, "chapter": "E3"}, {"year": 103, "qnum": 19, "stem": "Ａ封閉式公寓大廈為區分所有建物。下列敘述，何者正確？", "options": ["Ａ公寓大廈專有部分的無權占有人甲，並非住戶，故並無積欠該大廈應負擔費用的問題", "Ａ公寓大廈每年至少應召開住戶大會一次", "針對Ａ公寓大廈區分所有人乙積欠管理費，現行法有法定優先受償權的規定", "Ａ公寓大廈於一定要件下，得以該辦公、商場部分召開區分所有權人會議"], "answer": "C", "explains": {"A": "本選項前半句對、結論錯。依第3條第8款，住戶指「區分所有權人、承租人或其他『經區分所有權人同意』而為專有部分之使用者或業經取得停車空間建築物所有權者」——無權占有人未經同意，確實不在住戶定義內。但第24條第2項明定：公寓大廈專有部分之『無權占有人，應遵守依本條例規定住戶應盡之義務』；第3項並規定其違反時『準用』第21條、第22條、第47條、第49條關於住戶之規定。所以無權占有人仍有積欠應分擔費用被訴請給付、甚至被強制遷離的問題，本選項的結論錯。★記法：無權占有人不是「住戶」，而是『準用住戶規定』。", "B": "法定用語為「區分所有權人會議」，並非「住戶大會」，用詞錯誤。", "C": "正確。區分所有權人積欠管理費，於強制執行後對拍賣所得，就積欠本條例應分擔費用部分，享有與第一順位抵押權相同之優先受償權，此為公寓大廈管理費優先受償權★高頻考點。", "D": "以辦公商場部分召開會議之特例，適用於「非封閉式」公寓大廈，本題為「封閉式」公寓大廈，不符特例要件，敘述錯誤。"}, "ref": "公寓大廈管理條例第3條第8款（住戶之定義，不含無權占有人）、第24條第2項、第3項（無權占有人應遵守住戶義務，違反時「準用」第21條、第22條、第47條、第49條住戶之規定）、第22條第2項、第3項（出讓、拍賣與受償順序）。★本條例並沒有「第24條之1」這一條", "id": 22, "chapter": "E3"}, {"year": 103, "qnum": 20, "stem": "依公寓大廈管理條例規定，有關公寓大廈之公共基金，下列敍述何者正確？", "options": ["區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉；不得因個人事由為讓與、扣押、抵銷或設定負擔", "公共基金應設專戶儲存，其運用應依管理委員會會議之決議為之", "起造人應按建築物銷售總金額一定比例或金額提列公共基金", "起造人於該公寓大廈建造執照申請時，應提出繳交各直轄市、縣（市）主管機關公庫代收公共基金之證明"], "answer": "A", "explains": {"A": "正確。公共基金權利隨區分所有權移轉而移轉，不得因個人事由讓與、扣押、抵銷或設定負擔，具高度屬物從屬性，敘述完整正確。", "B": "公共基金運用應依「區分所有權人會議」決議，而非「管理委員會會議」，決議層級錯誤。", "C": "起造人應按「工程造價」一定比例或金額提列，而非「建築物銷售總金額」，計算基礎錯誤。", "D": "起造人應於「使用執照」申請時（而非建造執照申請時）提出繳交公庫代收公共基金之證明，時點錯誤。"}, "ref": "公寓大廈管理條例第18條（公共基金之來源、專戶儲存與運用）、第19條（公共基金之權利應隨區分所有權之移轉而移轉；不得因個人事由為讓與、扣押、抵銷或設定負擔）", "id": 23, "chapter": "E3"}, {"year": 103, "qnum": 21, "stem": "依公寓大廈管理條例第三十二條有關區分所有權人會議未獲致決議，重新開議之規定，下列敘述何者正確？", "options": ["其開議除規約另有規定出席人數外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席", "應以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議", "決議之會議紀錄各區分所有權人得於十日內以書面表示反對意見", "書面反對意見未超過出席區分所有權人及其區分所有權比例合計半數時，該決議視為成立"], "answer": "B", "explains": {"A": "現行第32條重新開議的開議門檻是區分所有權人「三人以上」且人數及區分所有權比例各達「五分之一」以上（規約另有規定出席人數者從其規定），不是三分之二；三分之二是第一次開會（§31）的出席門檻，所以A錯。（已對法律人網頁核對現行條文；先前寫「三分之一」有誤，已更正。）", "B": "正確。未獲決議重新開議時，應以出席人數「過半數」及其區分所有權比例占出席人數區分所有權合計「過半數」之同意即可作成決議，門檻大幅降低，此為第32條之核心簡化機制。", "C": "對決議的書面反對意見期限是「七日」內，不是十日。", "D": "書面反對意見的計算基準是「全體」區分所有權人及其區分所有權比例，不是「出席」者，所以D錯。⚠️ C、D 的數字與基準以現行第32條為準。"}, "ref": "公寓大廈管理條例第32條", "id": 24, "chapter": "E3"}, {"year": 104, "qnum": 28, "stem": "依公寓大廈管理條例之規定，下列有關公寓大廈規約之敘述，何者錯誤？", "options": ["規約是指公寓大廈住戶為增進共同利益，確保良好生活環境，經管理委員會決議之共同遵守事項", "公寓大廈樓頂平台依法得設置廣告物時，規約如另有規定並向主管機關報備有案者，仍應受該規約之限制", "禁止住戶飼養動物之特別約定，非經載明於規約者，不生效力", "區分所有權之繼受人應於繼受前閱覽規約，並於繼受後遵守規約所定一切權利義務事項"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。規約應為經「區分所有權人會議」決議之共同遵守事項，而非「管理委員會」決議，決議主體錯誤，此為與第11條同類型之高頻陷阱（管理委員會 vs 區分所有權人會議混淆）。", "B": "規約另有規定並報備者仍受其限制，敘述正確，非本題答案。", "C": "禁養動物約定須載明於規約始生效力，敘述正確，非本題答案。", "D": "繼受人應於繼受前閱覽規約並於繼受後遵守，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第3條", "id": 25, "chapter": "E3"}, {"year": 104, "qnum": 29, "stem": "依公寓大廈管理條例之規定，下列何者非公寓大廈起造人之法定義務？", "options": ["按工程造價一定比例提列公共基金", "公寓大廈建築物所有權登記達法定比例後，於三個月內召開管理委員會第一次會議", "依使用執照所記載用途及建物測繪後，辦理建物所有權第一次登記", "將公寓大廈共用設施設備、圖說、手冊等資料，會同主管機關檢測，確認其功能正常無誤後，移交給管理委員會"], "answer": "B", "explains": {"A": "按工程造價一定比例提列公共基金為起造人法定義務，非本題答案。", "B": "正確答案。起造人召集之會議係「成立管理委員會或推選管理負責人」之「第一次區分所有權人會議」，而非「管理委員會第一次會議」（管委會成立後其內部會議與起造人義務無關），用語主體錯誤，此為易混淆之陷阱。", "C": "辦理建物所有權第一次登記為起造人法定義務，非本題答案。", "D": "移交共用設施設備等資料予管理委員會為起造人法定義務，非本題答案。"}, "ref": "公寓大廈管理條例第28條（起造人召集首次區權會之義務）、第56條第3項（測繪與建物所有權第一次登記）、第57條（檢測與點交）、第58條（非經領得建造執照不得辦理銷售；不得將共用部分讓售特定人）", "id": 26, "chapter": "E3"}, {"year": 104, "qnum": 30, "stem": "依公寓大廈管理條例之規定，公寓大廈管理委員會應向下列何者負責，並向其報告會務？", "options": ["直轄市、縣（市）主管機關", "區分所有權人會議", "管理委員會主任委員", "管理負責人"], "answer": "B", "explains": {"A": "主管機關非管委會負責報告之對象，主管機關僅具行政監督角色。", "B": "正確。管理委員會應向「區分所有權人會議」負責，並向其報告會務，此為管委會與區權會之從屬關係核心規定。", "C": "主任委員為管委會內部職務，非管委會對外負責報告之對象。", "D": "管理負責人是無管委會時的替代角色，非管委會負責報告之對象。"}, "ref": "公寓大廈管理條例第39條（管理委員會應向區分所有權人會議負責，並向其報告會務）；第36條為管理委員會之十三項職務", "id": 27, "chapter": "E3"}, {"year": 105, "qnum": 31, "stem": "關於公寓大廈住戶行為規範之敘述，下列何者錯誤？", "options": ["住戶不得於大樓之公共密閉處所吸菸，以免影響其他住戶健康", "針對開放空間，在直轄市、縣（市）政府核准範圍內，住戶縱依規約或區分所有權人會議決議許可得使用該空間，亦不得為營業目的使用", "住戶於公寓大廈內依法經營餐飲業者，應依中央主管機關所定保險金額投保公共意外責任保險", "住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定"], "answer": "B", "explains": {"A": "不得於公共密閉處所吸菸，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。開放空間在主管機關核准範圍內，依規約或區分所有權人會議決議「即得」供營業使用，本選項稱「亦不得為營業目的使用」方向相反，屬★陷阱。", "C": "經營餐飲業應投保公共意外責任保險，敘述正確，非本題答案。", "D": "飼養動物不得妨礙公安公衛，但法令或規約另有規定從其規定，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第16條", "id": 28, "chapter": "E3"}, {"year": 105, "qnum": 32, "stem": "依公寓大廈管理條例規定，區分所有權人召開定期會議之頻率為：", "options": ["每半年至少應召開定期會議1次", "每季至少應召開定期會議1次", "每年至少應召開定期會議1次", "每兩年至少應召開定期會議1次"], "answer": "C", "explains": {"A": "數字錯誤，非每半年。", "B": "數字錯誤，非每季。", "C": "正確。區分所有權人會議每年至少應召開定期會議1次，全科最高頻數字之一。", "D": "數字錯誤，非每兩年。"}, "ref": "公寓大廈管理條例第25條", "id": 29, "chapter": "E3"}, {"year": 105, "qnum": 35, "stem": "依公寓大廈管理條例規定，公寓大廈住戶對於非屬專有部分之利用情形，下列敘述何者正確？", "options": ["住戶得經管理委員會主委同意，於外牆面設置廣告看板", "有12歲以下兒童之住戶，如未依規約或未經區分所有權人會議決議之同意，不得擅自於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施", "有12歲以下兒童之住戶，得於外牆開口部或陽臺設置不妨礙逃生且不突出外牆面之防墜設施，無庸經規約或區分所有權人會議決議同意，但設置理由消失者，住戶應予改善或回復原狀", "住戶得經頂樓住戶之許可，於樓頂平台加蓋廟宇神壇"], "answer": "C", "explains": {"A": "層級不足。依公寓大廈管理條例第8條第1項，外牆面設置廣告物除應依法令規定辦理外，受「該公寓大廈規約另有規定或區分所有權人會議已有決議，『經向直轄市、縣（市）主管機關完成報備有案』」的限制——要的是規約或區權會決議（且已完成報備），不是管委會主委一個人同意。★住戶違反第1項，管理負責人或管理委員會應予制止；經制止不從者，報請主管機關依第49條第1項處理，該住戶並應於『一個月內』回復原狀（第8條第3項）。", "B": "方向與正解C相反，所以錯。公寓大廈管理條例第8條第2項是『特別放寬』：有12歲以下兒童（現行條文並增列六十五歲以上老人）之住戶，外牆開口部或陽臺「得」設置不妨礙逃生且不突出外牆面之防墜設施，『無庸』經規約或區權會決議同意。本選項卻說未經同意「不得擅自」設置，把放寬寫成限制。", "C": "正確。公寓大廈管理條例第8條第2項：「公寓大廈有十二歲以下兒童或六十五歲以上老人之住戶，外牆開口部或陽臺『得』設置不妨礙逃生且不突出外牆面之防墜設施。」不必經規約或區權會決議同意，這是為了兒童與老人安全的特別放寬。★但現行條文有三個地方跟本題選項不完全一樣，115年要以現行條文為準：一、對象已增列「六十五歲以上老人」，不只12歲以下兒童；二、回復原狀的義務人條文寫的是『區分所有權人』，不是「住戶」；三、條件是「設置理由消失『且不符前項限制』者」，不是只要理由消失就要回復。", "D": "僅頂樓住戶許可不足。樓頂平臺屬公寓大廈管理條例第8條第1項列舉的範圍，其變更構造、設置類似行為除應依法令規定辦理外，受規約或區權會決議（並完成報備）之限制；加蓋廟宇神壇另涉建築法違章建築問題，不是頂樓住戶可以自行許可的事。"}, "ref": "公寓大廈管理條例第8條（第1項外牆面等變更受規約或區權會決議並完成報備之限制；第2項12歲以下兒童或65歲以上老人之住戶得設防墜設施，理由消失且不符第1項限制者區分所有權人應改善或回復原狀；第3項制止、報請主管機關依第49條第1項處理、1個月內回復原狀）", "id": 30, "chapter": "E3"}, {"year": 105, "qnum": 36, "stem": "關於公寓大廈營運與管理維護的敘述，下列何者正確？", "options": ["住戶共同事務應興革事項之決議，為管理委員會的職務之一", "受僱於公寓大廈管理維護公司之管理服務人員，不得同時受聘於2家以上之管理維護公司", "利害關係人請求閱覽或影印規約，管理委員於必要時得拒絕之，並應召集區分所有權人會議臨時會議", "公寓大廈之住戶非該專有部分之區分所有權人者，除區分所有權人會議之決議或規約另有規定外，不得被選任、推選為管理委員、主任委員或管理負責人"], "answer": "B", "explains": {"A": "住戶共同事務應興革事項之「決議」屬區分所有權人會議之職權，管理委員會僅有「執行」相關決議之職務，主體錯誤。", "B": "正確。受僱於管理維護公司之管理服務人員，不得同時受聘於2家以上管理維護公司，此為避免利益衝突及專責管理之規定。", "C": "利害關係人請求閱覽規約，管理委員無正當理由不得拒絕（規約屬應公開文件），且法律未規定拒絕時應召集臨時會議，此為虛構程序之陷阱。", "D": "實務上非區分所有權人之住戶（如承租人）「得」被選任為管理委員（現行法已放寬此限制，不以區分所有權人為限），本選項限制過嚴，與現行條文（住戶均得被選任）不符。"}, "ref": "公寓大廈管理條例第36條（管理委員會職務）、第44條第3款（管理服務人員不得同時受聘於二家以上管理維護公司）、第35條（利害關係人之閱覽影印請求權）、第29條第5項（住戶非區分所有權人者，除區權會決議或規約另有規定外，得被選任、推選為管理委員、主任委員或管理負責人）。★本條例查無「第38條之1」", "id": 31, "chapter": "E3"}, {"year": 105, "qnum": 37, "stem": "區分所有權人違反公寓大廈管理條例第 22 條，管理委員會得依區分所有權人會議之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分；於判決確定後 3 個月內不自行完成者，經管理委員會聲請法院拍賣之所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序的敘述，下列何者正確？", "options": ["優先於普通抵押權", "與第一順位抵押權同", "與普通抵押權同", "與一般債權同"], "answer": "B", "explains": {"A": "並非優先於第一順位抵押權，而是與其「同」順位，此為常考混淆點（同順位≠優先受償）。", "B": "正確。積欠應分擔費用於拍賣所得中之受償順序，與「第一順位抵押權」相同，此為公寓大廈管理費優先受償權之核心規定，須注意是「同順位」而非「絕對優先」。", "C": "應為與「第一順位」抵押權同，而非「普通」抵押權同，順位層級錯誤（第一順位優先於普通抵押權）。", "D": "優先受償順序高於一般債權，非與一般債權同順位。"}, "ref": "公寓大廈管理條例第22條第2項、第3項（訴請出讓、判決確定後3個月內未自行出讓得聲請法院拍賣；拍賣所得於積欠本條例應分擔費用之受償順序與第一順位抵押權同）★本條例並沒有「第24條之1」這一條，原註記有誤已更正", "id": 32, "chapter": "E3"}, {"year": 105, "qnum": 40, "stem": "公寓大廈外牆面設置廣告物，除應依法令規定辦理外，下列敘述何者正確？", "options": ["該公寓大廈規約另有規定，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，即應受該管理委員會會議決議之限制", "該公寓大廈規約另有規定，經向直轄市、縣（市）主管機關完成報備有案者，即應受該規約之限制", "該公寓大廈管理委員會會議已有決議，經向直轄市、縣（市）主管機關完成報備有案者，即應受該管理委員會會議決議之限制"], "answer": "C", "explains": {"A": "僅規約另有規定而「未經報備」者，尚不足以拘束，須完成報備程序方生此限制效力，本選項漏未報備要件。", "B": "管理委員會會議決議層級不足以限制外牆使用，須經區分所有權人會議決議（或規約規定），主體錯誤。", "C": "正確。外牆廣告物設置除法令規定外，須「規約另有規定」且「經向主管機關完成報備有案」兩要件同時具備，始受該規約限制，此為外牆使用限制之完整法定要件，缺一不可。", "D": "管理委員會會議決議非適格之限制依據，應為規約，主體錯誤。"}, "ref": "公寓大廈管理條例第8條", "id": 33, "chapter": "E3"}, {"year": 106, "qnum": 38, "stem": "依公寓大廈管理條例規定，召開區分所有權人會議之通知，應由召集人於開會幾日前以書面載明開會內容，通知各區分所有權人？", "options": ["7日", "10日", "15日", "20日"], "answer": "B", "explains": {"A": "數字錯誤，非7日。", "B": "正確。召開區分所有權人會議，應由召集人於開會「10日前」以書面載明開會內容通知各區分所有權人，此為高頻數字，須與會議紀錄送達期限「15日內」區辨（易混淆）。", "C": "數字錯誤，此為會議紀錄送達期限（15日內），非召集通知期限。", "D": "數字錯誤，非20日。"}, "ref": "公寓大廈管理條例第30條", "id": 34, "chapter": "E3"}, {"year": 106, "qnum": 39, "stem": "依公寓大廈管理條例規定，關於供區分所有權人使用部分之敘述，下列何者錯誤？", "options": ["區分所有權人除法律另有限制外，對其專有部分得自由使用、收益、處分", "獨立建築物所有權之牆壁，以牆之外緣為界。故該牆所屬區分所有權人得於區分所有人權會議決議同意後，於外牆設置廣告物", "專有部分之共同壁修繕費用，若修繕費係因可歸責於區分所有權人之事由所致，全數由該區分所有權人負擔", "公寓大廈通往室外之通路不得為約定專用部分"], "answer": "B", "explains": {"A": "對專有部分得自由使用收益處分（除法律另有限制），敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。本選項錯在兩處。第一，「獨立建築物所有權之牆壁，以牆之外緣為界」是第56條第3項第1款的『建物測繪界線』規定，只決定登記時怎麼量，不生「外牆歸該區分所有權人所有」的效果；外牆面仍屬共用部分，推不出該牆所屬區分所有權人有設置權。第二，外牆面設置廣告物除應依法令規定辦理外，依第8條第1項，規約規定或區分所有權人會議決議還必須「經向直轄市、縣（市）主管機關『完成報備有案』」；且依第33條第2款，設置於其他樓層者尚應經『該樓層區分所有權人』同意（設置於屋頂者應經頂層區分所有權人同意）。僅有區權會決議並不足夠。", "C": "因可歸責事由所致之共同壁修繕費用由該區分所有權人負擔，敘述正確，非本題答案。", "D": "通往室外之通路不得為約定專用部分，敘述正確，非本題答案（此為法定不得約定專用之項目之一，攸關逃生安全）。"}, "ref": "公寓大廈管理條例第4條、第7條（五款不得為約定專用）、第8條第1項（外牆面等變更須依法令並受「已完成報備」之規約或區權會決議限制）、第33條第2款（外牆面、樓頂平臺設置廣告物或強波發射設備：屋頂須經頂層區分所有權人同意，其他樓層須經該樓層區分所有權人同意）、第56條第3項第1款（獨立建築物牆壁以牆之外緣為界，屬測繪界線規定）", "id": 35, "chapter": "E3"}, {"year": 106, "qnum": 40, "stem": "依公寓大廈管理條例規定，關於召開區分所有權人會議，下列敘述何者錯誤？", "options": ["每年至少應召開定期會議一次", "發生重大事故有及時處理之必要，經管理委員會請求者，得召開臨時會議", "須經區分所有權人三分之一以上及其區分所有權比例合計三分之一以上，以書面載明召集之目的及理由請求召集者，始得召開臨時會議", "區分所有權人會議可由具區分所有權人身分之管理委員為召集人"], "answer": "C", "explains": {"A": "每年至少召開定期會議一次，敘述正確，非本題答案。", "B": "重大事故經管委會請求得召開臨時會議，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。應為區分所有權人「五分之一以上」（非「三分之一以上」）及其區分所有權比例合計五分之一以上，以書面請求召集，始得召開臨時會議，比例數字錯誤，此為★陷阱。", "D": "具區分所有權人身分之管理委員得為召集人，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第25條", "id": 36, "chapter": "E3"}, {"year": 107, "qnum": 16, "stem": "依公寓大廈管理條例之規定，非封閉式之公寓大廈集居社區其地面層為各自獨立之數幢建築物，且區內屬住宅與辦公、商場混合使用，其辦公、商場之出入口各自獨立之公寓大廈，各該幢內之辦公、商場部分，得就該幢或結合他幢內之辦公、商場部分，經其區分所有權人過多少比例之書面同意，及全體區分所有權人會議決議或規約明定法定事項後，以該辦公、商場部分召開區分所有權人會議，成立管理委員會，並向直轄市、縣（市）主管機關報備？", "options": ["二分之一", "三分之二", "五分之三", "四分之三"], "answer": "A", "explains": {"A": "正確。非封閉式住辦混合公寓大廈，辦公商場部分得經其區分所有權人「過半數（二分之一）」書面同意，並經全體區權會決議或規約明定後，以該部分單獨召開會議成立管委會，此為住辦混合社區之特別分治規定。", "B": "比例錯誤，非三分之二。", "C": "比例錯誤，非五分之三。", "D": "比例錯誤，非四分之三。"}, "ref": "公寓大廈管理條例第26條", "id": 37, "chapter": "E3"}, {"year": 107, "qnum": 20, "stem": "依公寓大廈管理條例之規定，開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，應經下列何種程序，始得供營業使用？", "options": ["經向直轄市、縣市主管機關申請許可之許可函", "依規約或區分所有權人會議決議", "依管理負責人或管理委員會之決定", "依開放空間及退縮空地鄰近之區分所有權人之同意"], "answer": "B", "explains": {"A": "單獨向主管機關申請許可函非法定要件，主管機關核准範圍是前提要件，非本項程序本身。", "B": "正確。開放空間及退縮空地在主管機關核准範圍內，應「依規約或區分所有權人會議決議」，始得供營業使用，與外牆廣告物設置程序相似法理。", "C": "管理負責人或管理委員會決定層級不足。", "D": "鄰近住戶同意非法定程序，須依規約或會議決議。"}, "ref": "公寓大廈管理條例第16條", "id": 38, "chapter": "E3"}, {"year": 107, "qnum": 21, "stem": "依公寓大廈管理條例之規定，因地震、水災、風災、火災或其他重大事變，肇致危害公共安全，而需要辦理公寓大廈之重建者，下列敘述何者錯誤？", "options": ["公寓大廈依此事由所為之重建，不須經全體區分所有權人及基地所有權人、地上權人或典權人之同意", "經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分", "重建之建造執照之申請，其名義以區分所有權人會議之決議為之", "管理負責人或管理委員會依公寓大廈管理條例之規定，訴請法院命不同意決議又不出讓區分所有權之區分所有權人出讓其區分所有權及其基地所有權應有部分後，對於該受讓人仍應徵詢其意見，不當然視為同意重建"], "answer": "D", "explains": {"A": "重大事變重建不須全體同意，敘述正確，非本題答案。", "B": "不同意者管委會得訴請法院命出讓應有部分，敘述正確，非本題答案。", "C": "重建建照申請以區分所有權人會議決議之名義為之，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。法院拍賣或裁判命出讓後，該應有部分之「受讓人視為同意重建」（法律擬制同意，非須另行徵詢意見），此為避免程序無限延宕之強制規定，本選項稱「不當然視為同意」方向相反，屬★陷阱。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 39, "chapter": "E3"}, {"year": 108, "qnum": 11, "stem": "安心社區擬於近日召開區分所有權人定期會議，討論社區管理事宜，同時選任新的管理委員。社區規約對於定期會議之召集程序及管理委員之選任事項，未定有特別規定。請問：管理委員會主任委員召集會議時，下列何項程序有違公寓大廈管理條例之規定？", "options": ["於開會前十日通知各區分所有權人", "以書面通知載明開會內容", "逕以公告代替書面通知，公告期間多於二日", "有關管理委員之選任事項，在開會通知中載明並公告之"], "answer": "C", "explains": {"A": "開會前10日通知，程序合法，非本題答案。", "B": "以書面通知載明開會內容，程序合法，非本題答案。", "C": "正確答案（違反規定之選項）。本選項錯在前提，不是錯在公告天數。公寓大廈管理條例第30條第1項逐字：「區分所有權人會議，應由召集人於開會前『十日』以書面載明開會內容，通知各區分所有權人。但有『急迫情事須召開臨時會』者，得以公告為之；公告期間不得少於『二日』。」本題召開的是「定期會議」，沒有急迫情事，所以不得以公告代替書面通知，縱使公告期間多於二日也一樣違法。★公告代替書面的前提是『急迫情事＋臨時會』，與規約有沒有規定無關。另第30條第2項：管理委員之選任事項，應在開會通知中載明並公告之，『不得以臨時動議提出』。", "D": "管理委員選任事項應於開會通知中載明並公告，屬於「不得以臨時動議提出」之法定事項，程序合法，非本題答案。"}, "ref": "公寓大廈管理條例第30條（第1項開會前10日以書面通知；有急迫情事須召開臨時會者得以公告為之，公告期間不得少於2日。第2項管理委員之選任應於開會通知載明並公告，不得以臨時動議提出）、第25條（定期與臨時會議之召集）", "id": 40, "chapter": "E3"}, {"year": 108, "qnum": 23, "stem": "以下有關公寓大廈區分所有權人會議及管理委員會兩者間關係之說明，何者錯誤？", "options": ["管理委員會有執行區分所有權人會議決議事項之義務", "管理委員會會議決議之內容不得違反區分所有權人會議決議", "管理委員會不得為訴訟之原告或被告，如起訴或被訴時，應通知區分所有權人擔當訴訟", "管理委員會應向區分所有權人會議負責，並向其報告會務"], "answer": "C", "explains": {"A": "管理委員會有執行區權會決議事項之義務，敘述正確，非本題答案。", "B": "管理委員會決議不得違反區權會決議，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。管理委員會「有」當事人能力，「得」為訴訟之原告或被告（此為法定明文賦予），並非不得為訴訟當事人，本選項方向相反，此為與101年-17題相同類型之高頻陷阱。", "D": "管理委員會應向區權會負責並報告會務，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第38條", "id": 41, "chapter": "E3"}, {"year": 108, "qnum": 24, "stem": "向上大樓已成立管理委員會，並將公共基金存放銀行專戶。住戶希望閒置的公共基金能獲取較銀行存款更高的投資報酬，擬交付信託。試問：依公寓大廈管理條例規定，應如何處理？", "options": ["經管理委員會決議後，由負責財務管理之管理委員交付信託", "經區分所有權人會議決議後，由管理委員會交付信託", "由管理委員會主任委員直接交付信託", "由負責財務管理之管理委員直接交付信託"], "answer": "B", "explains": {"A": "公共基金交付信託須經「區分所有權人會議」決議，管理委員會決議層級不足。", "B": "正確。公共基金經「區分所有權人會議」決議交付信託者，由「管理委員會」交付信託，決議主體與執行主體均正確。", "C": "主任委員個人無權逕行交付信託，須先經區權會決議。", "D": "財務管理委員個人無權逕行交付信託，須先經區權會決議。"}, "ref": "公寓大廈管理條例第18條", "id": 42, "chapter": "E3"}, {"year": 109, "qnum": 12, "stem": "關於公寓大廈之公共基金，下列敘述何者正確？", "options": ["起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列", "區分所有權人依管理委員會議決議繳納", "區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉", "區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付"], "answer": "C", "explains": {"A": "起造人應就領得「使用執照一年內」的管理維護事項提列公共基金，不是三年，所以A錯。", "B": "繳納公共基金是依「區分所有權人會議決議」，不是管理委員會決議，所以B錯。", "C": "正確。公共基金權利隨區分所有權移轉而移轉，具高度屬物從屬性，此為公共基金核心規定。", "D": "積欠公共基金須「已逾二期」或達相當金額，經定相當期間催告仍不給付，才可以訴請法院命其給付；本選項寫「已逾一期」，期數錯誤，所以D錯。"}, "ref": "公寓大廈管理條例第18條（第1項四款來源，第2款為「區分所有權人依區分所有權人會議決議繳納」；第3項專戶儲存、管理與運用）、第19條（權利之從屬性）", "id": 43, "chapter": "E3"}, {"year": 109, "qnum": 23, "stem": "約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理條例之規定，下列敘述何者錯誤？", "options": ["於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之", "公寓大廈本身所占之地面不得為約定專用部分", "規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約者，不生效力", "成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。維護修繕約定專用部分而須使用共用部分時，應經「管理負責人或管理委員會」之同意即可，而非須經「區分所有權人會議」同意，門檻層級錯誤，此類日常使用便利事項門檻低於重大處分事項，屬★陷阱（與102年-19題相同法理）。", "B": "公寓大廈本身所占地面不得為約定專用部分，敘述正確，非本題答案（此為法定不得約定專用之項目之一）。", "C": "約定專用部分範圍及使用主體須載明於規約始生效力，敘述正確，非本題答案。", "D": "約定專用變更須經使用人同意，但違反公共利益經訴請法院判決確定者不在此限，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第6條、第7條、第23條、第33條", "id": 44, "chapter": "E3"}, {"year": 109, "qnum": 24, "stem": "某公寓大廈社區將原本為甲所有之專有部分，經約定後供共同使用。請問該約定共用部分，於公寓大廈管理條例之規定中，下列敘述何者錯誤？", "options": ["公寓大廈之起造人於申請建造執照時，應檢附資料包含約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同", "約定共用部分之修繕、管理、維護，由專有部分區分所有權人甲負擔之", "約定共用部分，若涉及公共環境清潔衛生之維持、公共消防滅火器材之維護、公共通道溝渠及相關設施之修繕，其費用政府得視情況予以補助", "專有部分經依區分所有權人會議約定為約定共用部分者，應經甲之同意，否則不生效力"], "answer": "B", "explains": {"A": "起造人申請建照時應檢附約定共用部分圖說及規約草約，設計變更時亦同，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。約定共用部分之修繕管理維護，應由「管理負責人或管理委員會」為之（比照共用部分規定），費用由公共基金或依區分所有權人比例分擔，而非由原專有部分所有權人甲個人負擔，主體錯誤，此為★陷阱：一旦成立約定共用部分即適用共用部分之管理規則，非由原所有人單獨負擔。", "C": "約定共用部分之公益性維護費用政府得視情況補助，敘述正確，非本題答案。", "D": "專有部分經約定為約定共用部分應經甲同意，否則不生效力，敘述正確，非本題答案（保障原所有權人權益）。"}, "ref": "公寓大廈管理條例第10條、第56條", "id": 45, "chapter": "E3"}, {"year": 109, "qnum": 25, "stem": "公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者，為共用部分。公寓大廈管理條例對於共用部分權利義務關係之規定，下列敘述何者錯誤？", "options": ["管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕", "共用部分之修繕費係因可歸責於區分所有權人或住戶之事由所致者，由該區分所有權人或住戶負擔。其費用若區分所有權人會議或規約另有規定者，從其規定", "各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定", "共用部分及其相關設施之拆除，應由管理負責人或管理委員會決定為之"], "answer": "D", "explains": {"A": "住戶不得拒絕管理負責人或管理委員會因維護修繕而進入或使用其專有/約定專用部分，敘述正確，非本題答案。", "B": "因可歸責事由致修繕費用由該區分所有權人或住戶負擔，但規約或會議另有規定從其規定，敘述正確，非本題答案。", "C": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。共用部分之拆除、重大修繕或改良，應依「區分所有權人會議」之決議為之，而非「管理負責人或管理委員會」決定，此為本科重複命題率最高之核心觀念，須牢記。"}, "ref": "公寓大廈管理條例第6條、第10條、第9條、第11條", "id": 46, "chapter": "E3"}, {"year": 110, "qnum": 1, "stem": "依據公寓大廈管理條例有關起造人之規定，下列敘述何者錯誤？", "options": ["公寓大廈建築物之起造人有召集第1次區分所有權人會議之義務", "公寓大廈建築物起造人要領得建造執照，始可辦理公寓大廈銷售", "公寓大廈建築物起造人負有移交共用部分等之義務及移交期限", "公寓大廈建築物之起造人於申請使用執照時，應檢附規約草約"], "answer": "D", "explains": {"A": "起造人於區分所有權人達法定比例後有召集第1次會議之義務，敘述正確，非本題答案。", "B": "起造人須領得建造執照始可辦理銷售，敘述正確，非本題答案。", "C": "起造人負有移交共用部分等義務及移交期限，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。起造人應於申請「建造執照」時（而非使用執照時）檢附規約草約，申請時點錯誤，此為與103年-20題（公共基金證明應於使用執照申請時提出）相對應之另一組時點陷阱，須仔細區辨「建造執照」與「使用執照」何時檢附何種文件。"}, "ref": "公寓大廈管理條例第56條", "id": 47, "chapter": "E3"}, {"year": 110, "qnum": 3, "stem": "依據公寓大廈管理條例規定，下列敘述何者正確？", "options": ["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物", "未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造", "住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用", "依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"], "answer": "B", "explains": {"A": "樓梯間屬防火避難逃生通道，不得堆放雜物，縱經住戶協議同意亦不得為之，此屬強制規定不容約定排除，敘述錯誤。", "B": "正確。住戶為修繕時，未經申請主管建築機關核准，不得破壞建築物之主要構造，涉及結構安全之強制規定。", "C": "退縮空地在主管機關核准範圍內，「得」依規約或區分所有權人會議決議供營業使用，本選項稱不得，方向相反。", "D": "公共走道加設鐵門涉及逃生安全及建築管理法規，非僅依規約或區權會決議即可自行加設，仍須符合建築管理相關法令規定（如防火避難設施規定），非單純依規約或決議即可。"}, "ref": "公寓大廈管理條例第6條、第8條、第16條", "id": 48, "chapter": "E3"}, {"year": 110, "qnum": 4, "stem": "有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？", "options": ["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意", "約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限", "專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意", "共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"], "answer": "C", "explains": {"A": "本選項錯在同意權的主體，不是錯在制度。公寓大廈管理條例第33條第2款逐字：公寓大廈外牆面、樓頂平臺設置廣告物、無線電台基地台等類似強波發射設備或其他類似行為，「設置於屋頂者，應經『頂層區分所有權人』同意；設置其他樓層者，應經『該樓層區分所有權人』同意。該層住戶，並得參加區分所有權人會議陳述意見。」本選項寫「頂層住戶同意」「該樓層住戶同意」，把同意權主體從區分所有權人降成住戶。★高頻陷阱：住戶只能「陳述意見」，同意權在區分所有權人。", "B": "約定專用變更之例外要件應為「經管理委員會或管理負責人訴請法院判決確定」，而非「經區分所有權人會議決議」，此為與109年-23題相對應之陷阱（法院判決確定 vs 會議決議之混淆）。", "C": "正確。專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意，此為保障原所有權人權益之特別生效要件。", "D": "共用部分本身即屬全體共有，並無「該專有部分區分所有權人」需個別同意之問題（此選項主客體錯置：約定專用部分之標的是共用部分，非某人專有部分，故無「該專有部分區分所有權人」同意之要件），敘述邏輯有誤。"}, "ref": "公寓大廈管理條例第33條（區權會決議之特別生效要件三款；第2款外牆面、樓頂平臺設置廣告物、強波發射設備等：設置於屋頂應經「頂層區分所有權人」同意，設置其他樓層應經「該樓層區分所有權人」同意，該層住戶並得參加區權會陳述意見）", "id": 49, "chapter": "E3"}, {"year": 110, "qnum": 5, "stem": "下列何者不是公寓大廈管理委員會之職務？", "options": ["管理服務人之委任、僱傭及監督", "共用部分、約定專用部分及其附屬設施設備之點收及保管", "公寓大廈發生重大事故有及時處理之必要，請求召開區分所有權人臨時會議", "住戶違規情事之制止及相關資料之提供"], "answer": "B", "explains": {"A": "管理服務人之委任僱傭及監督為管理委員會職務之一，非本題答案。", "B": "正確答案。應為「共用部分及」約定「共用」部分（非「約定專用部分」）及其附屬設施設備之點收保管，本選項誤植為「約定專用部分」，範圍主體錯誤（約定專用部分是供特定住戶使用，非管委會點收保管之共用性質標的），此為文字替換之★陷阱。", "C": "重大事故時請求召開臨時會議為管理委員會職務之一，非本題答案。", "D": "住戶違規情事之制止及相關資料提供為管理委員會職務之一，非本題答案。"}, "ref": "公寓大廈管理條例第36條", "id": 50, "chapter": "E3"}, {"year": 110, "qnum": 6, "stem": "公寓大廈之區分所有權人因違反規約情節重大者，管理委員會如何要求區分所有權人出讓其區分所有權及其基地所有權應有部分？", "options": ["依管理委員會議之決議訴請法院命其強制出讓", "依區分所有權人會議之決議訴請法院命其強制出讓", "依管理委員會議之決議報請直轄市、縣（市）政府強制執行", "依區分所有權人會議之決議報請直轄市、縣（市）政府強制執行"], "answer": "B", "explains": {"A": "決議主體應為「區分所有權人會議」，非「管理委員會議」，決議層級錯誤。", "B": "正確。違反規約情節重大者，管理委員會應依「區分所有權人會議」之決議，訴請「法院」命其強制出讓應有部分，決議主體及執行機關（法院）皆正確。", "C": "應訴請「法院」判決，而非「報請主管機關強制執行」，執行機關錯誤。", "D": "決議主體正確但執行機關錯誤，應訴請法院而非報請主管機關。"}, "ref": "公寓大廈管理條例第22條", "id": 51, "chapter": "E3"}, {"year": 110, "qnum": 7, "stem": "公寓大廈公共基金之來源及運用、管理方式，下列何者正確？", "options": ["起造人就公寓大廈領得建造執照一年內之管理維護事項，應按工程造價一定比例或金額提列為公共基金", "區分所有權人依管理委員會決議繳納公共基金", "公共基金經區分所有權人會議決議交付信託者，由管理委員會主任委員交付信託", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理"], "answer": "D", "explains": {"A": "起造人應就領得「使用執照」一年內的管理維護事項提列公共基金，不是「建造執照」，執照種類錯誤。", "B": "本選項錯在決議主體。公寓大廈管理條例第18條第1項第2款逐字，公共基金來源之一是「區分所有權人依『區分所有權人會議決議』繳納」，不是依管理委員會決議。管理委員會只負責收支、保管及運用之執行（第36條第7款），要不要繳、繳多少的權限在區分所有權人會議。★「按應有部分比例分擔」是第10條第2項、第11條第2項的『修繕費用』分擔規則，兩件事不要混。", "C": "公共基金經區分所有權人會議決議交付信託者，由「管理委員會」交付信託，不是由主任委員個人交付。", "D": "正確。公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理，此為公共基金管理之核心規定。"}, "ref": "公寓大廈管理條例第18條（第1項第2款：區分所有權人依「區分所有權人會議決議」繳納；第3項專戶儲存、管理與運用依區權會決議）、第36條第7款（管委會負責收支、保管及運用）、第10條第2項、第11條第2項（修繕費用按應有部分比例分擔）", "id": 52, "chapter": "E3"}, {"year": 111, "qnum": 17, "stem": "依公寓大廈管理條例之規定，下列之定義何者正確？", "options": ["約定專用部分：指公寓大廈專有部分經約定供共同使用者", "管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司", "專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權", "公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"], "answer": "D", "explains": {"A": "正確定義應為「約定專用部分：指公寓大廈共用部分經約定供特定區分所有權人使用者」，本選項將「約定專用」與「約定共用」定義互換，用語錯誤。", "B": "此為「管理服務人」之定義（受委任執行事務者），非「管理負責人」（管理負責人是住戶互推之個人，非公司或受僱人員），定義主體混淆。", "C": "此為「區分所有」之定義（第3條第2款：數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權），不是「專有部分」。專有部分依第3條第3款是「公寓大廈之一部分，具有『使用上之獨立性』，且『為區分所有之標的』者」。★本條例只寫「使用上之獨立性」，不含「構造上」。", "D": "正確。公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地，定義完整正確。"}, "ref": "公寓大廈管理條例第3條", "id": 53, "chapter": "E3"}, {"year": 112, "qnum": 9, "stem": "依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？", "options": ["住戶大會決議事項之執行", "住戶違規情事之制止及相關資料之提供", "共有及共用部分之清潔、維護、重大修繕及改良", "住戶共同事務應興革事項之決定與管理"], "answer": "B", "explains": {"A": "法定用語為「區分所有權人會議」決議事項之執行，並非「住戶大會」，用詞錯誤。", "B": "正確。住戶違規情事之制止及相關資料之提供，為管理委員會之法定職務之一。", "C": "共用部分之「重大修繕及改良」須依區分所有權人會議決議為之，非管理委員會逕行決定執行之職務範圍，管理委員會僅負責日常清潔維護（非重大修繕改良之決定權）。", "D": "住戶共同事務應興革事項之「決定」屬區分所有權人會議之職權，管理委員會僅有「執行」之職務，非「決定」，主體錯誤。"}, "ref": "公寓大廈管理條例第36條", "id": 54, "chapter": "E3"}, {"year": 112, "qnum": 10, "stem": "有關公寓大廈公共基金之設置，下列何者錯誤？", "options": ["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列", "起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付", "公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理", "公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"], "answer": "B", "explains": {"A": "起造人就領得使用執照1年內管理維護事項按工程造價比例提列公共基金，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。起造人應於使用執照申請時提出繳交公庫代收之證明，惟公庫代為撥付之對象應為「管理委員會或管理負責人」（於其成立後），而非於「召開區分所有權人會議時」逕行撥付，撥付時點及對象敘述不精確，此為條文細節混淆之陷阱。", "C": "公共基金設專戶儲存並由管理負責人或管理委員會負責管理，敘述正確，非本題答案。", "D": "公共基金信託後之運用仍依區分所有權人會議決議，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第18條", "id": 55, "chapter": "E3"}, {"year": 113, "qnum": 4, "stem": "有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？", "options": ["專有部分之修繕，由各該區分所有權人為之，並負擔其費用", "共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人按其共有之應有部分比例分擔之", "共用部分之修繕，係因可歸責於區分所有權人之事由所致者，由區分所有權人為之，並負擔其費用。但規約另有規定者，從其規定", "共用部分之重大修繕，應依區分所有權人會議之決議為之。其費用，由公共基金支付或由區分所有權人按其共有之應有部分比例分擔"], "answer": "C", "explains": {"A": "專有部分修繕由該區分所有權人為之並負擔費用，敘述正確，非本題答案。", "B": "共用部分修繕由管理負責人或管委會為之，費用由公共基金或依比例分擔，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。因可歸責事由所致之修繕費用，仍應由「管理負責人或管理委員會」負責修繕（執行修繕之主體不變），僅費用由該可歸責之區分所有權人負擔，本選項稱「由區分所有權人為之」（即由該人自行修繕執行），混淆了執行主體與費用負擔主體，屬★陷阱。", "D": "共用部分重大修繕依區分所有權人會議決議為之，費用由公共基金或依比例分擔，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第10條、第11條", "id": 56, "chapter": "E3"}, {"year": 113, "qnum": 5, "stem": "按公寓大廈之共有部分為區分所有人所分別共有。下列關於共有部分之使用、收益及處分權能之說明，何者與公寓大廈管理條例之規定不符？", "options": ["各區分所有權人按其共有之應有部分比例，對建築物之共用部分有使用收益之權。但另有約定者從其約定", "共用部分得約定供特定區分所有權人使用。但有違法令使用限制之規定者，不得約定專用", "共用部分之應有部分應隨同專有部分一併移轉或設定負擔。但另有約定者從其約定", "共用部分之拆除，應依區分所有權人會議之決議為之"], "answer": "C", "explains": {"A": "按應有部分比例使用收益，但另有約定從其約定，敘述正確，非本題答案。", "B": "共用部分得約定專用，但違反法令使用限制者不得約定專用，敘述正確，非本題答案。", "C": "正確答案（不符規定之敘述）。共用部分之應有部分應隨同專有部分一併移轉或設定負擔，此為「強制規定」，並「不得」另有約定排除（與專有部分不可分離原則有關，維護產權單一性），本選項稱「另有約定者從其約定」，此為錯誤延伸適用範圍，屬★陷阱。", "D": "共用部分拆除依區分所有權人會議決議為之，敘述正確，非本題答案。"}, "ref": "公寓大廈管理條例第4條、第9條、第11條", "id": 57, "chapter": "E3"}, {"year": 113, "qnum": 6, "stem": "某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第 30 條及第 31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？", "options": ["因未經全體區分所有權人之同意，該公寓社區不得進行重建", "管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分", "管理負責人或管理委員會得訴請法院將甲強制遷離", "管理負責人或管理委員會得請求主管機關為必要之處置"], "answer": "B", "explains": {"A": "因地震等重大事變而重建者，不須經全體區分所有權人同意，僅須經區分所有權人會議特別決議（2/3出席3/4同意）即可，敘述錯誤。", "B": "正確。甲不同意重建決議又不出讓區分所有權者，管理負責人或管理委員會得訴請法院命甲「出讓」其區分所有權及其基地所有權應有部分，此為重建異議處理之核心機制。", "C": "訴請法院「強制遷離」適用於違反義務情節重大（如積欠費用）之情形，非重建異議之處理方式，兩者法律效果不同，不應混淆。", "D": "法律已明定訴請法院命出讓應有部分之機制，非請求主管機關為必要處置，此為虛構程序之陷阱選項。"}, "ref": "公寓大廈管理條例第13條、第14條", "id": 58, "chapter": "E3"}, {"year": 113, "qnum": 7, "stem": "依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上", "公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之二以上"], "answer": "A", "explains": {"A": "正確。區分所有權人達「半數以上」及其區分所有權比例合計「半數以上」時，起造人應於3個月內召開會議成立管委會或推選管理負責人並報備，此為高頻重複命題之標準門檻（與「二分之一、二分之一」為同一數字之不同表述）。", "B": "比例組合錯誤，非半數與三分之二之組合。", "C": "比例組合錯誤，非三分之二與半數之組合。", "D": "比例組合錯誤，非三分之二與三分之二之組合（此組合近似會議決議之較高門檻，非起造人召集門檻）。"}, "ref": "公寓大廈管理條例第28條", "id": 59, "chapter": "E3"}, {"year": 114, "qnum": 1, "stem": "公寓大廈頂樓平台漏水之原因，為年久失修導致防水層破損。此時應由誰負修繕義務？", "options": ["依區分所有權人會議決議", "公寓大廈管理委員會", "頂樓住戶", "頂樓住戶和管理委員會共同負責"], "answer": "B", "explains": {"A": "日常修繕（非拆除、重大修繕或改良之處分性事項）不須經區分所有權人會議決議，管理委員會即可依職權辦理修繕。", "B": "正確。頂樓平台屬公寓大廈之共用部分，因年久失修（非可歸責於特定人之事由）致漏水，其修繕義務人為「管理負責人或管理委員會」，費用由公共基金支付或依比例分擔。", "C": "頂樓平台非頂樓住戶之專有部分（僅可能為約定專用部分，仍屬共用性質），非由頂樓住戶單獨負修繕義務。", "D": "非因可歸責於頂樓住戶之事由所致（年久失修），修繕義務應歸屬管理委員會，非頂樓住戶共同負責。"}, "ref": "公寓大廈管理條例第10條", "id": 60, "chapter": "E3"}, {"year": 114, "qnum": 2, "stem": "舉行公寓大廈區分所有權人會議時，何種事項在會議中，不得以臨時動議提出？", "options": ["管理委員選任之事項", "公共區域禁止吸煙之事項", "公共設施緊急維修之事項", "調整收取社區管理費之事項"], "answer": "A", "explains": {"A": "正確。管理委員選任之事項，因涉及重大人事決定，須事先於開會通知中載明並公告，不得以臨時動議提出，此為保障住戶充分知情參與之程序保障規定。", "B": "公共區域禁煙屬一般議案，非法定禁止臨時動議之事項。", "C": "緊急維修事項因具急迫性，得依情況彈性處理，非法定禁止臨時動議之事項。", "D": "調整管理費屬一般議案，非法定禁止臨時動議之事項（惟仍建議事先載明較為周延，但非強制禁止臨時動議之法定事項）。"}, "ref": "公寓大廈管理條例第30條", "id": 61, "chapter": "E3"}, {"year": 114, "qnum": 3, "stem": "依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？", "options": ["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定", "管理委員會會議得決議各管理委員任期為1年或2年", "主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次", "管理委員會的各管理委員之任期屆滿，連選得連任"], "answer": "C", "explains": {"A": "管理委員任期「得」規定於規約中，並非不可，敘述錯誤。", "B": "管理委員任期應規定於規約或由區分所有權人會議決議，非由「管理委員會會議」自行決議決定，決議主體層級不足。", "C": "正確。主任委員、財務管理委員及監察業務委員之任期屆滿，「連選得連任一次」，此為避免權力集中之限制規定，屬本科高頻重複命題考點。", "D": "一般管理委員任期屆滿「連選得連任」（無次數限制），但主委、財委、監委三類特定職務則限制「連任一次」，本選項未區分職務類型，一概而論，敘述不夠精確（易與C選項混淆，此為對照組陷阱）。"}, "ref": "公寓大廈管理條例第29條", "id": 62, "chapter": "E3"}, {"year": 114, "qnum": 4, "stem": "甲在公寓大廈 1 樓開店營業，向管理委員會表示想要於該大樓 1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？", "options": ["管理委員會開會同意", "管理委員會會議及區分所有權人會議決議同意", "2樓區分所有權人同意", "區分所有權人會議決議同意及1樓、2樓區分所有權人同意"], "answer": "D", "explains": {"A": "管理委員會開會同意層級不足，外牆設置廣告物須經區分所有權人會議決議。", "B": "管理委員會會議決議非法定必要程序，仍應以區分所有權人會議決議為核心要件。", "C": "僅2樓區分所有權人同意不足，尚須經區分所有權人會議決議及1樓區分所有權人（廣告物所在牆面涉及樓層）同意。", "D": "正確。外牆設置廣告物涉及整體建築物外觀及結構安全，須經「區分所有權人會議決議同意」；又因廣告物設置範圍橫跨1、2樓外牆，並涉及該特定樓層之權益，故尚須經「1樓、2樓區分所有權人」個別同意，雙重要件缺一不可。"}, "ref": "公寓大廈管理條例第8條、第33條", "id": 63, "chapter": "E3"}, {"year": 114, "qnum": 15, "stem": "依公寓大廈管理條例之規定，關於共用部分之敘述，何者錯誤？", "options": ["各區分所有權人對建築物之共用部分及其基地有使用收益之權利，按其共有之應有部分比例，不得另行約定之", "住戶對共用部分之使用方法，可以另外約定調整之", "共用部分及其相關設施之拆除、重大修繕或改良，應依區分所有權人會議之決議為之", "專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。各區分所有權人按應有部分比例對共用部分及基地有使用收益之權，「但另有約定者，從其約定」，本選項稱「不得另行約定」，方向相反，法律明文允許另有約定，此為★陷阱。", "B": "住戶對共用部分之使用方法得另外約定調整，敘述正確，非本題答案。", "C": "共用部分拆除重大修繕改良依區分所有權人會議決議為之，敘述正確，非本題答案。", "D": "專有部分不得與共用部分應有部分及基地權利應有部分分離移轉，敘述正確，非本題答案（維護產權整體性之強制規定）。"}, "ref": "公寓大廈管理條例第4條、第9條、第11條", "id": 64, "chapter": "E3"}, {"year": 114, "qnum": 16, "stem": "甲買了一個社區的房子，剛好到了要召開區分所有權人會議的時間。依公寓大廈管理條例之規定，區分所有權人會議至少多久應召開定期會議一次？", "options": ["每3個月", "每季", "每半年", "每年"], "answer": "D", "explains": {"A": "數字錯誤，非每3個月。", "B": "數字錯誤，非每季（與每3個月相同意涵之誤導選項）。", "C": "數字錯誤，非每半年。", "D": "正確。區分所有權人會議每年至少應召開定期會議1次，全科最高頻數字，反覆重複命題。"}, "ref": "公寓大廈管理條例第25條", "id": 65, "chapter": "E3"}, {"year": 114, "qnum": 17, "stem": "區分所有權人會議之決議，依公寓大廈管理條例，除規約另有規定，應有區分所有權人⑴以上及其區分所有權比例合計 ⑵以上出席，以出席人數 ⑶以上及其區分所有權比例占出席人數區分所有權 ⑷以上之同意行之。上述⑴⑵⑶⑷之比例，依序應為多少？", "options": ["二分之一、二分之一、三分之二、三分之二", "二分之一、三分之二、三分之二、四分之三", "三分之二、三分之二、四分之三、四分之三", "三分之二、四分之三、四分之三、五分之四"], "answer": "C", "explains": {"A": "比例組合錯誤，出席門檻應為三分之二（非二分之一）。", "B": "比例組合錯誤，出席門檻應皆為三分之二（非二分之一與三分之二混合）。", "C": "正確。依第31條，區分所有權人會議之決議，除規約另有規定外，應有區分所有權人「三分之二以上」及其區分所有權比例合計「三分之二以上」出席，以出席人數「四分之三以上」及其區分所有權比例占出席人數區分所有權「四分之三以上」之同意行之。★四個數字依序是：三分之二、三分之二、四分之三、四分之三（俗稱 2/3 出席、3/4 同意）。另第32條一起記：第31條未獲決議或出席不足時，召集人得就同一議案重新召集，門檻降為「區分所有權人三人並五分之一以上及其區分所有權比例合計五分之一以上」出席、出席人數過半數及其區分所有權比例占出席人數過半數之同意；該決議之會議紀錄送達後，各區分所有權人得於「七日內」以書面表示反對意見。", "D": "比例組合錯誤，同意門檻應為四分之三（非五分之四）。"}, "ref": "公寓大廈管理條例第31條（一般決議：區分所有權人2/3以上及其區分所有權比例合計2/3以上出席，以出席人數3/4以上及其區分所有權比例占出席人數區分所有權3/4以上之同意）、第32條（未獲決議時重新召集之降低門檻與七日反對意見）", "id": 66, "chapter": "E3"}];
