const QUESTIONS = [{"year": 105, "qnum": 1, "stem": "關於不動產經紀業為廣告行為之規範，下列敘述何者錯誤？", "options": ["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售", "委託契約內容與事實不符者，經紀業應依事實修正廣告內容", "經紀業如為加盟店或加盟經營者，得逕以加盟店名稱替代直營店之法定經紀業名稱，以資消費者便於辨識", "廣告對不動產之外在環境、視野或景觀之表示與事實不符者，得認定為不實廣告"], "answer": "C", "explains": {"A": "須先簽委託契約書方得刊登廣告，敘述正確，非本題答案。", "B": "契約內容與事實不符者應依事實修正廣告內容，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。加盟經營者「不得」以加盟店名稱替代法定經紀業名稱，而應「併同標明」加盟店或加盟經營字樣及經紀業名稱（兩者併存，非替代關係），此為★陷阱：加盟標明是附加義務，非取代原經紀業名稱之揭露義務。", "D": "外在環境視野景觀表示與事實不符得認定為不實廣告，敘述正確，非本題答案。"}, "ref": "不動產經紀業管理條例第9條、第21條", "id": 1, "chapter": "G1"}, {"year": 105, "qnum": 11, "stem": "不動產經紀業者進行房屋聯賣時，如業者間共同約束實施聯賣之不動產物件開發方擁有一定的專賣期間，致使已尋得交易相對人之其他不動產經紀業者受限於專賣權之規定而無法成交，對此共同約束行為之監督管理機關為：", "options": ["內政部營建署", "法務部檢察司", "經濟部商業司", "公平交易委員會"], "answer": "D", "explains": {"A": "內政部營建署非公平交易法主管機關。", "B": "法務部檢察司非公平交易法主管機關。", "C": "經濟部商業司非公平交易法主管機關。", "D": "正確。聯賣業者間共同約束行為涉及聯合行為（相互約束事業活動），其監督管理機關為「公平交易委員會」，非不動產經紀業之地政主管機關（內政部），此為主管機關轄屬混淆之陷阱：涉及公平競爭議題歸公平會管轄。"}, "ref": "公平交易法第14條、第26條", "id": 2, "chapter": "G1"}, {"year": 105, "qnum": 13, "stem": "事業違反公平交易法之規定致侵害他人權益者，被害人損害賠償請求權消滅時效的敘述，下列何者正確？", "options": ["自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾5年者亦同", "自請求權人知有行為及賠償義務人時起，1年間不行使而消滅；自為行為時起，逾10年者亦同", "自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾5年者亦同", "自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾10年者亦同"], "answer": "D", "explains": {"A": "兩處數字皆錯誤，應為2年、10年。", "B": "主觀時效數字錯誤，應為2年非1年。", "C": "客觀時效數字錯誤，應為10年非5年。", "D": "正確。自請求權人知有行為及賠償義務人時起，「2年」間不行使而消滅；自為行為時起，逾「10年」者亦同，此為全科高頻雙重時效數字組合。"}, "ref": "公平交易法第33條", "id": 3, "chapter": "G1"}, {"year": 105, "qnum": 14, "stem": "依公平交易法規定，主管機關為強化聯合行為查處，促進市場競爭秩序之健全發展，得設立何種基金？", "options": ["反托拉斯基金", "管理維護基金", "市場安定基金", "市場重建基金"], "answer": "A", "explains": {"A": "正確。主管機關為強化聯合行為查處，促進市場競爭秩序健全發展，得設立「反托拉斯基金」。", "B": "管理維護基金非公平交易法之基金制度，此為與公寓大廈公共基金混淆之陷阱。", "C": "市場安定基金非公平交易法之基金制度。", "D": "市場重建基金非公平交易法之基金制度。"}, "ref": "公平交易法第47條之1", "id": 4, "chapter": "G1"}, {"year": 105, "qnum": 15, "stem": "事業不得為聯合行為。但因經濟不景氣，致同一行業之事業難以繼續維持或生產過剩，為有計畫適應需求而限制價格之共同行為，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。主管機關為許可時，應附多少時間之期限？", "options": ["不得逾1年", "不得逾2年", "不得逾3年", "不得逾5年"], "answer": "D", "explains": {"A": "數字錯誤，非1年。", "B": "數字錯誤，非2年。", "C": "數字錯誤，非3年（3年為一般聯合行為許可期限，本題「經濟不景氣產銷過剩」情形為特殊之5年期限，須區辨）。", "D": "正確。因經濟不景氣致產銷過剩而為有計畫適應需求限制價格之共同行為，經許可者，許可期限「不得逾5年」，此為聯合行為許可期限之特殊延長情形，與一般情形（3年）不同。"}, "ref": "公平交易法第15條", "id": 5, "chapter": "G1"}, {"year": 105, "qnum": 16, "stem": "有關公平交易法對獨占規範之敘述，下列何者錯誤？", "options": ["獨占係指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者", "二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有在相關市場處於無競爭狀態之情形者，視為獨占", "二事業全體於相關市場之占有率若未達二分之一者，不列入獨占事業認定範圍", "獨占之事業，不得對商品價格或服務報酬，為不當之決定"], "answer": "C", "explains": {"A": "獨占之法定定義，敘述正確，非本題答案。", "B": "二以上事業實際上不為價格競爭，視為獨占，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。二事業全體市占率門檻應為「三分之二」，而非「二分之一」，未達三分之二者始不列入獨占事業認定範圍，數字錯誤，此為★高頻陷阱（一事業1/2、二事業2/3、三事業3/4）。", "D": "獨占事業不得對商品價格或服務報酬為不當決定，敘述正確，非本題答案。"}, "ref": "公平交易法第7條、第9條", "id": 6, "chapter": "G1"}, {"year": 105, "qnum": 18, "stem": "下列何種情形，係屬於公平交易法所稱之結合？", "options": ["無正當理由，對他事業給予差別待遇之行為", "直接或間接控制他事業之業務經營或人事任免", "具競爭關係之同一產銷階段事業，以契約共同決定商品或服務之價格", "以不正當方法，使他事業不為價格之競爭"], "answer": "B", "explains": {"A": "差別待遇屬第20條限制競爭行為，非結合。", "B": "正確。直接或間接控制他事業之業務經營或人事任免，屬「結合」之法定定義態樣之一。", "C": "以契約共同決定價格屬聯合行為，非結合。", "D": "以不正當方法使他事業不為價格競爭屬第19條規範行為，非結合。"}, "ref": "公平交易法第11條", "id": 7, "chapter": "G1"}, {"year": 105, "qnum": 19, "stem": "公平交易法所規範不動產經紀業者涉及違法聯合行為之態樣，下列何者不屬之？", "options": ["共同決定服務報酬收費標準，或協議限制服務報酬之調整", "協議拒絕其他不動產經紀業者參與聯賣", "共同約束收取斡旋金之票期，致使斡旋金票期趨於一致", "廣告宣稱「連續20年仲介服務第一品牌」，惟無銷售數字或意見調查等客觀數據為基礎，顯有虛偽不實或引人錯誤者"], "answer": "D", "explains": {"A": "共同決定服務報酬或限制調整，屬聯合行為態樣，非本題答案。", "B": "協議拒絕他業者參與聯賣（杯葛），屬聯合行為態樣，非本題答案。", "C": "共同約束斡旋金票期趨於一致，屬聯合行為態樣，非本題答案。", "D": "正確答案。單一業者無客觀數據基礎宣稱「第一品牌」，屬「虛偽不實或引人錯誤之廣告」（第21條），非「聯合行為」（第14條，須有多數業者相互合意約束之要件），此為單一業者行為與多數業者合意行為之性質區辨，屬★陷阱。"}, "ref": "公平交易法第14條、第21條", "id": 8, "chapter": "G1"}, {"year": 105, "qnum": 24, "stem": "未經消費者要約而對之郵寄或投遞之商品，寄送人未經消費者通知取回，在寄送後逾多少時間未經消費者表示承諾，而仍不取回其商品者，視為拋棄其寄投之商品：", "options": ["逾1個月", "逾2個月", "逾3個月", "逾6個月"], "answer": "A", "explains": {"A": "正確。寄送後逾「1個月」未經消費者表示承諾，仍不取回其商品者，視為拋棄，此為保護消費者免受未經同意商品騷擾之核心數字。", "B": "數字錯誤，非2個月。", "C": "數字錯誤，非3個月。", "D": "數字錯誤，非6個月。"}, "ref": "消費者保護法第20條", "id": 9, "chapter": "G1"}, {"year": 105, "qnum": 29, "stem": "依消費者保護法規定，定型化契約條款於下列何種情形，可認為並非違反平等互惠原則？", "options": ["當事人間之給付與對待給付顯不相當者", "當事人一方之企業經營者，就系爭商品或服務之市場占有率規模超過50%者", "消費者負擔非其所能控制之危險者", "消費者違約時，應負擔顯不相當之賠償責任者"], "answer": "B", "explains": {"A": "給付與對待給付顯不相當，係違反平等互惠原則之典型態樣，非本題答案。", "B": "正確。企業經營者市場占有率規模之大小，本身並非判斷契約條款是否違反平等互惠原則之直接因素（市占率高低與契約條款是否顯失公平係不同層次之問題，非當然掛勾），故不當然構成違反平等互惠原則。", "C": "消費者負擔非其所能控制之危險，係違反平等互惠原則之態樣，非本題答案。", "D": "消費者違約負擔顯不相當賠償責任，係違反平等互惠原則之態樣，非本題答案。"}, "ref": "消費者保護法施行細則第14條", "id": 10, "chapter": "G1"}, {"year": 106, "qnum": 13, "stem": "依公平交易法規定，事業有與他事業經常共同經營或受他事業委託經營之情形者，稱為下列何者？", "options": ["聯合", "結合", "獨占", "寡占"], "answer": "B", "explains": {"A": "聯合行為是平行合意約束事業活動之行為，與經常共同經營或受委託經營之從屬控制關係不同。", "B": "正確。事業與他事業經常共同經營或受他事業委託經營者，屬「結合」之法定定義態樣之一。", "C": "獨占是市場支配地位描述，非本題情形。", "D": "寡占非本法正式法律用語。"}, "ref": "公平交易法第11條", "id": 11, "chapter": "G1"}, {"year": 106, "qnum": 14, "stem": "不動產經紀業者，共同約束開發物件必須與委託人簽訂專任委託契約，致使不動產經紀業者及委託人選擇委託契約型態之自由受到限制，可能違反公平交易法之何種行為？", "options": ["第20條之妨害公平競爭行為", "第15條之聯合行為", "第11條之結合行為", "第9條之獨占行為"], "answer": "B", "explains": {"A": "本題情形為多數業者間之合意約束，非單一事業妨害公平競爭之行為。", "B": "正確。多數不動產經紀業者共同約束（合意）委託契約型態，相互約束事業活動限制契約自由，構成「聯合行為」（第14條，惟本題選項標示為第15條，因第15條規範聯合行為原則禁止及例外許可，此類共同約束契約型態的聯合行為屬第15條禁止之範疇）。", "C": "結合行為係取得控制從屬關係，非本題平行合意行為。", "D": "獨占行為是單一事業之市場支配地位濫用，非本題多數業者合意行為。"}, "ref": "公平交易法第14條、第15條", "id": 12, "chapter": "G1"}, {"year": 106, "qnum": 15, "stem": "關於結合行為之申報，下列敘述何者錯誤？", "options": ["事業自主管機關受理其提出完整申報資料之日起算30工作日內，不得結合", "關於不得為結合之期間，主管機關認為必要時，得書面通知事業另行延長期間。該延長期間不得逾60工作日", "如主管機關屆期未為延長通知或決定者，原則上事業得逕行結合", "關於不得為結合之期間，主管機關認為必要時，得書面通知事業另行縮短期間，該縮短期間不得短於15工作日"], "answer": "D", "explains": {"A": "自受理完整申報資料之日起算30工作日內不得結合，敘述正確，非本題答案。", "B": "延長期間不得逾60工作日，敘述正確，非本題答案。", "C": "屆期未為延長通知或決定者，原則上事業得逕行結合，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。主管機關縮短不得結合期間之通知，法定並「無」「不得短於15工作日」之下限限制（法條僅規定得縮短期間，未設下限），本選項增加虛構之下限規定，此為★陷阱。"}, "ref": "公平交易法第11條、第12條", "id": 13, "chapter": "G1"}, {"year": 106, "qnum": 16, "stem": "甲向乙汽車公司購買限量跑車一台，在交車前夕，甲接獲汽車公司通知必須加購「跑車保險」，但甲向乙公司表示，可自行安排保險事宜無須加保，但遭乙公司拒絕，試問，乙汽車公司最有可能違反公平交易法中何種規定？", "options": ["聯合行為", "不正當限制交易相對人與其交易行為", "差別待遇", "不實廣告"], "answer": "B", "explains": {"A": "本題為單一事業之交易條件限制，非多數事業合意行為，非聯合行為。", "B": "正確。乙公司以「必須加購保險」作為交易條件，強制搭售保險商品，構成「以不正當限制交易相對人之事業活動為條件，而與其交易之行為」（第20條），此為搭售行為之典型態樣。", "C": "本題非涉及對不同交易相對人給予不同待遇之問題，非差別待遇。", "D": "本題未涉及廣告內容虛偽不實之問題，非不實廣告。"}, "ref": "公平交易法第20條", "id": 14, "chapter": "G1"}, {"year": 106, "qnum": 17, "stem": "下列有關獨占之敘述，何者錯誤？", "options": ["一事業在相關市場中達到三分之二的市場占有率", "一事業在相關市場中具有壓倒性的地位，並且可以排除他事業的競爭", "二事業實際上無價格競爭之情勢，但具有排除第三事業進入市場的實力", "因技術困難或政府法令等情形，使得其他事業進入但具市場產生障礙，此種情形，主管機關得以認定其為獨占事業"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。一事業獨占認定市占率門檻為「二分之一」，而非「三分之二」（三分之二是「二事業全體」之門檻），數字錯誤，此為認定基準之★高頻陷阱。", "B": "具壓倒性地位可排除他事業競爭，符合獨占定義，敘述正確，非本題答案。", "C": "二事業無價格競爭且具排除第三事業實力，符合視為獨占之情形，敘述正確，非本題答案。", "D": "因技術困難或法令等致市場產生進入障礙者，主管機關得認定為獨占事業，敘述正確，非本題答案。"}, "ref": "公平交易法第7條、第8條", "id": 15, "chapter": "G1"}, {"year": 106, "qnum": 18, "stem": "依公平交易法第20條之規定，妨害公平競爭之行為不包括下列何者？", "options": ["無正當理由，對他事業給予差別待遇之行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "以脅迫、利誘或其他不正當之方法，使競爭者之交易相對人與自己交易之行為", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為"], "answer": "C", "explains": {"A": "差別待遇屬第20條列舉行為之一，非本題答案。", "B": "低價利誘阻礙競爭者參與競爭屬第20條列舉行為之一，非本題答案。", "C": "正確答案。「以脅迫、利誘或其他不正當方法，使競爭者之交易相對人與自己交易」屬「第19條」規範之特殊限制競爭行為（脅迫利誘使他事業不為價格競爭等），並非「第20條」妨害公平競爭之列舉態樣，此為條文歸類混淆之陷阱。", "D": "不正當限制交易相對人事業活動為條件交易，屬第20條列舉行為之一，非本題答案。"}, "ref": "公平交易法第19條、第20條", "id": 16, "chapter": "G1"}, {"year": 106, "qnum": 19, "stem": "甲建設公司請乙廣告公司針對新推出之建案，宣傳其公共設施包含三溫暖及健身房，並請知名女星丙推薦該建案。然該建案依使用執照登載所示，廣告中宣傳該公共設施位置之使用用途為「梯間、水箱及機械室」且未辦理變更使用執照。使該建案於日後交屋時，消費者並未能獲得或合法享有廣告所示之公共設施空間使用。根據公平交易法，下列敘述何者錯誤？", "options": ["主管機關得限期令甲停止或改正其行為，並得處新臺幣2,500萬元以下罰鍰", "甲應負損害賠償責任", "乙於明知該宣傳內容虛偽不實時，須負連帶損害賠償責任", "丙如非明知或非可得而知該宣傳內容虛偽不實時，僅需就報酬十倍內負損害賠償責任"], "answer": "D", "explains": {"A": "主管機關得限期令甲停止改正並得處2500萬元以下罰鍰（惟精確金額範圍為5萬至2500萬元，本題描述上限金額正確），敘述可視為正確，非本題答案。", "B": "甲為廣告主應負損害賠償責任，敘述正確，非本題答案。", "C": "廣告代理業乙明知虛偽不實仍為製作，須負連帶損害賠償責任，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。「非公眾人物」薦證者不知情時，僅於受廣告主報酬十倍範圍內負連帶責任；惟本題丙為「知名女星」（公眾人物），依法應適用「較高注意義務」標準，公眾人物薦證者原則上須就其薦證負連帶賠償責任（不論是否明知），本選項將公眾人物適用非公眾人物之較低責任標準（十倍報酬上限），主體適用錯誤，屬★陷阱。"}, "ref": "公平交易法第21條、第21條之1", "id": 17, "chapter": "G1"}, {"year": 106, "qnum": 20, "stem": "不動產開發業者或不動產經紀業者銷售預售屋時，要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱，可能違反公平交易法之何種行為？", "options": ["第20條之妨害公平競爭行為", "第25條之欺罔或顯失公平行為", "第21條之虛偽不實廣告行為", "第15條之聯合行為"], "answer": "B", "explains": {"A": "本題非涉及與他事業間之競爭妨害問題，非第20條情形。", "B": "正確。要求購屋人須給付定金始提供契約書審閱，剝奪消費者法定審閱期權益，構成「足以影響交易秩序之欺罔或顯失公平行為」（第25條兜底條款），此為經紀業實務常見違規態樣。", "C": "本題非涉及廣告內容虛偽不實之問題，非第21條情形。", "D": "本題為單一業者行為，非多數業者合意約束之聯合行為。"}, "ref": "公平交易法第25條", "id": 18, "chapter": "G1"}, {"year": 106, "qnum": 21, "stem": "下列何者非托拉斯基金之用途？", "options": ["辦理競爭法之教育及宣傳", "補助本法與涉及檢舉獎金訴訟案件相關費用之支出", "推動國際競爭法執法機關之合作", "補助消費者因聯合行為而受之損害"], "answer": "D", "explains": {"A": "辦理競爭法教育及宣傳為反托拉斯基金用途之一，非本題答案。", "B": "補助本法相關訴訟檢舉獎金費用支出為用途之一，非本題答案。", "C": "推動國際競爭法執法機關合作為用途之一，非本題答案。", "D": "正確答案。反托拉斯基金並非用於「直接補助消費者因聯合行為所受之損害」（該基金用途聚焦於強化查處機制與制度建設，非個案損害填補），此為虛構用途之陷阱。"}, "ref": "公平交易法第47條之1", "id": 19, "chapter": "G1"}, {"year": 106, "qnum": 22, "stem": "依公平交易法規定，下列關於期間之敘述何者錯誤？", "options": ["主管機關對於違反獨占、聯合行為之裁處權，因5年期間經過而消滅", "損害賠償請求權，自請求權人知有行為及賠償義務人時起，2年間不行使而消滅", "損害賠償請求權，自行為時起，逾10年不行使而消滅", "聯合行為許可應附期限，其期限不得逾3年。以書面申請延展，其延展期限每次不得逾3年"], "answer": "D", "explains": {"A": "裁處權因5年期間經過而消滅，敘述正確，非本題答案。", "B": "主觀時效2年，敘述正確，非本題答案。", "C": "客觀時效10年，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。本選項就數字組合而言（許可3年、延展每次不逾3年）本身符合一般聯合行為規定，然題目要求選出「錯誤」敘述，官方認定D為錯誤選項，可能係因法條原文對「延展」之表述與本選項用字有其他出入（如延展次數限制或期限計算方式），建議對照官方詳解確認細節差異。"}, "ref": "公平交易法第15條、第33條、第41條", "id": 20, "chapter": "G1"}, {"year": 107, "qnum": 8, "stem": "不動產經紀業者共同約束專任委託契約之期間，致使不動產經紀業者縱未積極努力撮合，委託人卻因受限於契約而無法另行委託其他不動產經紀業者，該行為將違反公平交易法所規範之那一種行為？", "options": ["以著名之他人姓名、商號或公司名稱、標章或其他表示他人營業、服務之表徵，於同一或類似之服務為相同或近似之使用，致與他人營業或服務之設施或活動混淆", "結合", "聯合行為", "為其他足以影響交易秩序之欺罔或顯失公平之行為"], "answer": "C", "explains": {"A": "此為仿冒行為（第22條）之定義，與本題共同約束契約期間無關。", "B": "結合行為係取得控制從屬關係，非本題平行合意行為。", "C": "正確。多數不動產經紀業者共同約束（合意）專任委託契約之期間，相互約束事業活動，構成「聯合行為」。", "D": "本題涉及多數業者間之合意約束，性質上更精確歸類為聯合行為，非單一業者之欺罔顯失公平行為。"}, "ref": "公平交易法第14條", "id": 21, "chapter": "G1"}, {"year": 107, "qnum": 9, "stem": "甲為不動產經紀業者，受乙不動產開發業者委託從事銷售行為，甲外包請丙廣告公司設計廣告，經消費者丁舉報該廣告之內容，有虛偽不實或引人錯誤之情形，經公平交易委員會認定為違反規定。依公平交易法之規定，下列敘述情形，何者錯誤？", "options": ["主管機關對於甲，得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣二十萬元以上五千萬元以下罰鍰", "若甲與乙共同具名製作不實房屋銷售廣告，且收取建案底價或總銷售金額一定成數之銷售服務費用，與乙共同獲有利益，可認為甲乙俱為廣告主", "丙在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任", "甲違反公平交易法之規定，致侵害丁之權益，應負損害賠償責任"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。違反虛偽不實廣告（第21條）規定之罰鍰級距應為「5萬元以上2500萬元以下」，本選項稱「20萬元以上5000萬元以下」，金額級距錯誤，此為與其他條款（如結合違法罰鍰20萬至5000萬元）混淆之陷阱。", "B": "甲乙共同具名製作廣告並共同獲利者，可認為皆為廣告主，敘述正確，非本題答案。", "C": "廣告代理業丙明知或可得而知仍製作設計，須負連帶損害賠償責任，敘述正確，非本題答案。", "D": "甲違反規定致侵害丁權益應負損害賠償責任，敘述正確，非本題答案。"}, "ref": "公平交易法第21條、第21條之1、第42條", "id": 22, "chapter": "G1"}, {"year": 107, "qnum": 10, "stem": "公平交易委員會發現某甲事業可能有違法之聯合行為情事，依職權欲對甲事業調查處理。關於調查之事項，下列何者錯誤？", "options": ["派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "甲事業若承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得中止調查", "執行調查之人員依法執行公務時，未出示有關執行職務之證明文件者，受調查者得拒絕之", "調查所得可為證據之物，主管機關得扣留之；其扣留範圍及期間，不以供調查、檢驗、鑑定或其他為保全證據之目的所必要者為限"], "answer": "D", "explains": {"A": "派員前往事務所營業所調查，屬法定調查程序，敘述正確，非本題答案。", "B": "事業承諾具體改正措施者，主管機關得「中止」調查，敘述正確，非本題答案。", "C": "未出示職務證明文件者受調查者得拒絕之，屬程序保障，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。扣留可為證據之物，其「扣留範圍及期間」應「以供調查、檢驗、鑑定或其他為保全證據之目的所必要者為限」（比例原則限制），本選項稱「不以...為限」，方向相反，屬★陷阱。"}, "ref": "公平交易法第27條", "id": 23, "chapter": "G1"}, {"year": 107, "qnum": 11, "stem": "甲為一位知名影星，曾拍攝二個不動產廣告，且知悉該等廣告有不實的情形。在成名之前，甲接拍廣告主乙的不動產廣告，廣告中反映甲對不動產商品的信賴，結果當時消費者丙即曾經檢舉廣告不實。十二年之後，甲已成為知名公眾人物，接了第二個廣告主丁的不動產廣告，反映甲對該廣告商品的親身體驗。此時，消費者戊檢舉廣告不實。依公平交易法之規定，下列敘述，何者正確？", "options": ["甲必須是「明知」其所從事之薦證有引人錯誤之虞，而仍為薦證，才需要負責", "第一個廣告，甲仍非知名公眾人物，僅於受乙報酬五倍之範圍內，與乙負連帶損害賠償責任", "第二個廣告，甲為知名人士，須與丁負連帶損害賠償責任", "丙和戊的請求權尚未超過法定期限，故其請求權尚未消滅"], "answer": "C", "explains": {"A": "非公眾人物薦證者僅須「明知或可得而知」（包含過失情形，非僅限故意明知）即須負責，本選項限縮過嚴，與法定要件不符。", "B": "非公眾人物薦證者之責任範圍應為「受報酬十倍之範圍內」，而非「五倍」，數字錯誤。", "C": "正確。甲於第二個廣告拍攝時已為「知名公眾人物」，依法公眾人物薦證者須就其薦證內容適用較高之注意義務標準，本題甲明知（知悉）該廣告不實情形仍為薦證，須與廣告主丁負連帶損害賠償責任。", "D": "丙之請求權自12年前檢舉時起算，已逾損害賠償請求權「自行為時起10年」之客觀時效上限，其請求權應已消滅，本選項稱尚未消滅，與時效規定不符。"}, "ref": "公平交易法第21條之1、第33條", "id": 24, "chapter": "G1"}, {"year": 108, "qnum": 8, "stem": "公平交易法規定，法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", "options": ["二倍", "三倍", "四倍", "五倍"], "answer": "B", "explains": {"A": "數字錯誤，非二倍。", "B": "正確。事業故意行為侵害他人權益者，法院酌定之賠償不得超過已證明損害額之「3倍」，全科最高頻數字。", "C": "數字錯誤，非四倍。", "D": "數字錯誤，非五倍（易與消保法「故意5倍」混淆）。"}, "ref": "公平交易法第31條", "id": 25, "chapter": "G1"}, {"year": 108, "qnum": 9, "stem": "不動產經紀業者以下何種行為不涉及違法聯合行為？", "options": ["共同決定服務報酬收費標準，或協議限制服務報酬之調整", "協議拒絕其他不動產經紀業者參與聯賣", "共同約束開發物件必須與委託人簽訂一般委託契約", "共同約束專任委託契約之期間"], "answer": "C", "explains": {"A": "共同決定服務報酬或限制調整，涉及違法聯合行為，非本題答案。", "B": "協議拒絕他業者參與聯賣（杯葛），涉及違法聯合行為，非本題答案。", "C": "正確答案。共同約束開發物件必須簽訂「一般委託契約」（而非「專任委託契約」），因「一般委託契約」（非專任性質）本身並不排除委託人另行委託其他業者之自由，對市場競爭之限制效果較輕微，不當然構成違法聯合行為（與共同約束「專任」委託契約，明顯限制委託人選擇自由之情形不同）。", "D": "共同約束專任委託契約之期間，涉及違法聯合行為，非本題答案。"}, "ref": "公平交易法第14條", "id": 26, "chapter": "G1"}, {"year": 108, "qnum": 12, "stem": "甲房屋仲介公司擬與乙房屋仲介公司合併，下列何種情形不須先向公平交易委員會提出申報？", "options": ["甲公司已持有乙公司達百分之五十以上之有表決權股份", "兩家公司合併後之市場占有率達三分之一", "乙公司之市場占有率已達四分之一", "甲公司上一會計年度銷售金額，超過公平交易委員會所公告之金額"], "answer": "A", "explains": {"A": "正確答案。甲公司已持有乙公司50%以上有表決權股份，再與乙公司結合（合併）者，因結合前已具實質控制關係，市場結構無實質改變，法律明文排除此情形之申報義務。", "B": "合併後市占率達1/3，觸及申報門檻，須申報。", "C": "乙公司市占率達1/4，觸及申報門檻，須申報。", "D": "銷售金額超過公告金額，觸及申報門檻，須申報。"}, "ref": "公平交易法第11條", "id": 27, "chapter": "G1"}, {"year": 108, "qnum": 13, "stem": "某直轄市內有競爭關係之甲、乙、丙、丁不動產仲介業者相互協議，就仲介成交之房屋買賣或租賃案件一律收取固定之服務報酬。試問：甲、乙、丙、丁之協議行為，可能構成公平交易法所規定之何種行為？", "options": ["獨占", "結合", "聯合", "杯葛"], "answer": "C", "explains": {"A": "獨占是單一（或視為單一）事業之市場支配地位，非本題多數業者平行協議行為。", "B": "結合行為係取得控制從屬關係，非本題平行協議行為。", "C": "正確。有競爭關係之甲乙丙丁相互協議共同決定固定服務報酬，構成「聯合行為」（價格卡特爾之典型態樣）。", "D": "杯葛是拒絕交易之特定行為態樣，非本題共同定價協議之核心性質。"}, "ref": "公平交易法第14條", "id": 28, "chapter": "G1"}, {"year": 109, "qnum": 4, "stem": "根據公平交易法，二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有此等規定之情形者，視為下列何者？", "options": ["寡占", "獨占", "結合", "聯合"], "answer": "B", "explains": {"A": "寡占非本法正式法律用語。", "B": "正確。二以上事業實際上不為價格競爭，而其全體對外關係具有相關市場處於無競爭狀態之情形者，「視為獨占」，此為法定擬制獨占之規定。", "C": "結合行為係取得控制從屬關係，非本題情形。", "D": "聯合行為需有相互約束事業活動之合意要件，本題描述「視為獨占」之特殊擬制規定屬第7條範疇，非聯合行為。"}, "ref": "公平交易法第7條", "id": 29, "chapter": "G1"}, {"year": 109, "qnum": 5, "stem": "公平交易法第二十條規定，有下列各款行為之一，而有限制競爭之虞者，事業不得為之。其事項「不」包括下列何者？", "options": ["無正當理由，對他事業給予差別待遇之行為", "為加強貿易效能，而就國外商品或服務之輸入採取共同行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "answer": "B", "explains": {"A": "無正當理由差別待遇，屬第20條列舉行為之一，非本題答案。", "B": "正確答案。「為加強貿易效能就國外商品或服務之輸入採取共同行為」係「第15條」聯合行為「例外許可」之情形，並非「第20條」限制競爭行為之列舉態樣，此為條文歸類混淆之陷阱（第15條是允許之例外事由，非禁止行為）。", "C": "低價利誘阻礙競爭者參與競爭，屬第20條列舉行為之一，非本題答案。", "D": "以損害特定事業為目的促使斷絕交易（杯葛），屬第20條列舉行為之一，非本題答案。"}, "ref": "公平交易法第15條、第20條", "id": 30, "chapter": "G1"}, {"year": 109, "qnum": 7, "stem": "事業違反公平交易法，致侵害他人權益者，如為事業之故意行為，法院得酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", "options": ["一倍", "三倍", "五倍", "十倍"], "answer": "B", "explains": {"A": "數字錯誤，非一倍。", "B": "正確。事業故意行為致侵害他人權益者，法院酌定之賠償不得超過已證明損害額之「3倍」，全科最高頻數字。", "C": "數字錯誤，非五倍。", "D": "數字錯誤，非十倍。"}, "ref": "公平交易法第31條", "id": 31, "chapter": "G1"}, {"year": 109, "qnum": 17, "stem": "不動產經紀業者從事不動產買賣之仲介業務時，在向買方收取斡旋金前，未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係等資訊，將違反下列那一項規定？", "options": ["構成欺罔行為，且足以影響交易秩序者，將違反公平交易法第二十五條規定", "不當爭取交易之機會，將違反公平交易法第二十三條規定", "為虛偽不實或引人錯誤之表示或表徵，將違反公平交易法第二十一條規定", "致與他人營業或服務之設施或活動混淆者，將違反公平交易法第二十二條規定"], "answer": "A", "explains": {"A": "正確。未告知斡旋金與要約書之區別及替代關係，未充分揭露重要交易資訊致消費者權益受損，構成「足以影響交易秩序之欺罔或顯失公平行為」，違反公平交易法第25條（兜底條款）。", "B": "第23條規範不當提供贈品贈獎爭取交易機會，與本題未告知資訊之情形無關。", "C": "第21條規範虛偽不實廣告，本題非涉及廣告內容不實之問題。", "D": "第22條規範仿冒致混淆之行為，與本題無關。"}, "ref": "公平交易法第25條", "id": 32, "chapter": "G1"}, {"year": 109, "qnum": 18, "stem": "依公平交易法之規定，事業不得為限制競爭之行為，下列敘述何者錯誤？", "options": ["事業不得限制消費者，就供給之商品轉售與第三人或第三人再轉售時之價格", "以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "無正當理由，對他事業給予差別待遇之行為"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。限制轉售價格之禁止規範對象為「交易相對人」（如經銷商），而非「消費者」（一般終端消費者非本條規範限制對象），主體錯誤，此為★陷阱：限制轉售價格禁止是規範事業對其「交易相對人」（下游經銷商）之限制，非對一般消費者。", "B": "不正當限制交易相對人事業活動為條件交易，屬第20條列舉行為，敘述正確，非本題答案。", "C": "低價利誘阻礙競爭者參與競爭，屬第20條列舉行為，敘述正確，非本題答案。", "D": "無正當理由差別待遇，屬第20條列舉行為，敘述正確，非本題答案。"}, "ref": "公平交易法第19條、第20條", "id": 33, "chapter": "G1"}, {"year": 110, "qnum": 13, "stem": "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者，應由何機關依法處理？", "options": ["由直轄市、縣（市）政府依公平交易法處理", "由行政院依消費者保護法處理", "由行政院公平交易委員會依公平交易法處理", "由內政部依不動產經紀業管理條例處理"], "answer": "D", "explains": {"A": "處理機關及依據法律皆錯誤。", "B": "處理機關及依據法律皆錯誤。", "C": "依「不動產經紀業管理條例」第21條規定（經紀業廣告銷售內容應與事實相符），此類事項已有經紀業專法明文規範，優先適用經紀業管理條例，非公平交易法（公平交易法係適用於未受其他專法規範之一般虛偽不實廣告情形），此為★核心觀念：經紀業廣告與事實不符優先適用經紀業管理條例（內政部主管），而非公平交易法（公平會主管）。", "D": "正確。經紀業與委託人簽訂委託契約後，刊登廣告銷售內容與事實不符者，應依「不動產經紀業管理條例」（由「內政部」為中央主管機關）處理，此為經紀業專法優先適用之核心觀念，須與其他廣告不實情形（適用公平交易法或消保法）區辨。"}, "ref": "不動產經紀業管理條例第3條、第21條", "id": 34, "chapter": "G1"}, {"year": 110, "qnum": 20, "stem": "下列何者屬於公平交易法之適用範圍？", "options": ["依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之正當行為", "不動產仲介業與不動產買方有關斡旋金返還之糾紛處理", "不動產開發業者銷售預售屋時要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱之情形", "不動產經紀業加盟店未於廣告中標明加盟店或加盟經營字樣之處理"], "answer": "C", "explains": {"A": "依智慧財產權法規行使權利之「正當行為」，明文排除於公平交易法適用範圍之外，非本題答案。", "B": "斡旋金返還糾紛屬單純民事契約履行爭議，非公平交易法規範之市場競爭秩序問題。", "C": "正確。要求給付定金始提供契約書審閱，剝奪消費者法定審閱期，構成足以影響交易秩序之欺罔或顯失公平行為，屬公平交易法（第25條）適用範圍。", "D": "加盟店未標明加盟字樣，屬不動產經紀業管理條例（第9條）規範之揭示義務違反，非公平交易法適用範圍。"}, "ref": "公平交易法第25條、第46條", "id": 35, "chapter": "G1"}, {"year": 110, "qnum": 21, "stem": "下列有關公平交易法對於事業聯合行為規定之敘述，何者錯誤？", "options": ["主管機關對事業聯合行為原則上是採限制原則", "主管機關對事業聯合行為有益於整體經濟與公共利益時得例外許可", "主管機關對事業聯合行為之許可事項得附加條件", "主管機關對事業聯合行為許可事項及其有關之條件、負擔、期限，應主動公開"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。主管機關對事業聯合行為原則上係採「禁止原則」（而非「限制原則」，聯合行為原則上是「禁止」的，例外符合法定要件經許可者始得為之），用語程度錯誤，此為性質描述不精確之陷阱。", "B": "有益整體經濟與公共利益時得例外許可，敘述正確，非本題答案。", "C": "許可事項得附加條件，敘述正確，非本題答案。", "D": "許可事項及條件負擔期限應主動公開，敘述正確，非本題答案。"}, "ref": "公平交易法第15條、第17條", "id": 36, "chapter": "G1"}, {"year": 110, "qnum": 22, "stem": "不動產經紀業者倘與具競爭關係之事業，以契約、協議共同決定服務之價格、交易對象、交易地區等相互約束事業活動之行為，而足以影響服務供需之市場功能者，將構成公平交易法之何種行為？", "options": ["不公平競爭", "聯合行為", "欺罔或顯失公平", "違法結合"], "answer": "B", "explains": {"A": "不公平競爭是另一類行為態樣（如不當贈品贈獎、損害營業信譽等），非本題核心情形。", "B": "正確。此為聯合行為之完整法定定義：有競爭關係之事業以契約協議共同決定價格交易對象交易地區等，相互約束事業活動，足以影響市場供需功能者，構成聯合行為。", "C": "欺罔或顯失公平是第25條兜底條款，非本題平行合意約束行為之核心定性。", "D": "結合是取得控制從屬關係，非本題平行合意約束行為。"}, "ref": "公平交易法第14條", "id": 37, "chapter": "G1"}, {"year": 110, "qnum": 24, "stem": "有關公平交易法第 22 條對於事業仿冒行為要件之規定，下列敘述何者錯誤？", "options": ["所使用之名稱或表徵必須達到著名之程度", "相同或近似之名稱或表徵必須使用於同一或類似的服務", "公司名稱或營業服務表徵限於依法取得註冊商標權者", "必須產生與他人提供之服務設施或活動混淆的結果"], "answer": "C", "explains": {"A": "名稱或表徵須達著名程度，為仿冒行為之構成要件，敘述正確，非本題答案。", "B": "相同或近似之使用須於同一或類似服務，為構成要件，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。第22條仿冒行為之保護對象「不限於」依法取得註冊商標權者（即使未註冊，僅要求該姓名商號名稱標章等已達「著名」之實質認知程度即受保護），本選項限縮保護範圍過嚴，與法定要件不符，此為商標權登記與公平法著名性保護之混淆陷阱。", "D": "須產生與他人服務設施活動混淆之結果，為構成要件，敘述正確，非本題答案。"}, "ref": "公平交易法第22條", "id": 38, "chapter": "G1"}, {"year": 111, "qnum": 6, "stem": "依公平交易法之規定，下列定義何者錯誤？", "options": ["競爭指一以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為", "相關市場指事業就一定之商品或服務，從事競爭之區域或範圍", "交易相對人指與事業進行或成立交易之供給者或需求者", "事業所組成之同業公會視為本法所稱事業"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。「競爭」之法定定義應為「二以上」事業（而非「一以上」）在市場上爭取交易機會之行為，因競爭本質上須有多數行為主體相互爭取，單一事業無從構成「競爭」關係，數字錯誤，此為★陷阱。", "B": "相關市場定義正確，非本題答案。", "C": "交易相對人定義正確，非本題答案。", "D": "同業公會視為本法所稱事業，敘述正確，非本題答案。"}, "ref": "公平交易法第4條", "id": 39, "chapter": "G1"}, {"year": 111, "qnum": 7, "stem": "公平交易法關於結合之規定，下列敘述何者錯誤？", "options": ["直接或間接控制他事業之業務經營或人事任免屬於結合之一種", "事業因結合而使其市場占有率達四分之一應先向主管機關提出申報", "對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合", "主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見"], "answer": "B", "explains": {"A": "直接或間接控制他事業業務經營人事任免屬結合定義，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。「因結合而使其市場占有率達1/3（三分之一）」始須申報，而非「四分之一」（四分之一是「參與結合之單一事業」市占率之申報門檻，非「結合後」市占率門檻），此為結合申報三大門檻混淆之★高頻陷阱。", "C": "整體經濟利益大於限制競爭不利益者不得禁止結合，敘述正確，非本題答案。", "D": "得徵詢外界意見及委請學術機構分析，敘述正確，非本題答案。"}, "ref": "公平交易法第11條、第13條", "id": 40, "chapter": "G1"}, {"year": 111, "qnum": 9, "stem": "主管機關收到對於涉有違反公平交易法規定之檢舉，而發動調查得進行之程序敘述，何者錯誤？", "options": ["通知當事人及關係人到場陳述意見", "通知當事人及關係人提出帳冊、文件及其他必要之資料或證物", "派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償"], "answer": "D", "explains": {"A": "通知當事人及關係人到場陳述意見，屬法定調查程序之一，非本題答案。", "B": "通知提出帳冊文件證物，屬法定調查程序之一，非本題答案。", "C": "派員前往事務所營業所調查，屬法定調查程序之一，非本題答案。", "D": "正確答案（性質不符之敘述）。「法院因被害人請求酌定損害額以上之賠償」係「損害賠償訴訟」層面之司法救濟機制，並非公平會「行政調查」之程序事項，兩者性質不同（前者為法院民事審判權限，後者為行政機關調查權限），本選項混淆行政調查與司法救濟之性質，屬★陷阱。"}, "ref": "公平交易法第27條、第31條", "id": 41, "chapter": "G1"}, {"year": 111, "qnum": 10, "stem": "當事人對主管機關依公平交易法所為之處分或決定不服者，應如何處理？", "options": ["直接適用行政訴訟程序", "依訴願法提起訴願", "對主管機關提出民事訴訟", "直接適用國家賠償程序"], "answer": "A", "explains": {"A": "正確。當事人對公平會依本法所為之處分或決定不服者，「直接適用行政訴訟程序」（不須先經訴願程序，此為特殊救濟途徑之規定，全科高頻）。", "B": "依法不須先經訴願程序，直接進入行政訴訟，本選項多加了訴願前置程序，與法定特殊規定不符。", "C": "對行政機關之處分不服，應循行政救濟途徑（行政訴訟），非提起民事訴訟。", "D": "國家賠償程序適用於公務員執行職務不法侵害人民權利之情形，與本題對行政處分不服之救濟無關。"}, "ref": "公平交易法第48條", "id": 42, "chapter": "G1"}, {"year": 111, "qnum": 23, "stem": "如果有一交易違反公平交易法，下列有關於行使損害賠償之敘述何者正確？", "options": ["自此一交易日起二年不行使請求權，請求權時效消滅", "被害人不論何時得知損害，自得知之日起逾二年不行使請求權，請求權時效消滅", "自此一交易日起逾十年，請求權時效消滅", "被害人自此一交易日起，其請求權之行使沒有時效限制"], "answer": "C", "explains": {"A": "「2年」時效之起算點應為「知有行為及賠償義務人時」，而非「交易日」，起算點錯誤。", "B": "「2年」主觀時效敘述方向正確，但本題選項未完整涵蓋另一項「10年」客觀時效之限制（僅有主觀時效並非全部答案，需併同考量10年客觀時效上限），本題官方標準答案為C，聚焦於客觀時效之描述。", "C": "正確。自為行為時（交易日）起，逾「10年」者，請求權時效消滅，此為客觀時效之法定上限（不論被害人是否知悉，滿10年即消滅）。", "D": "請求權之行使有法定時效限制（主觀2年、客觀10年），並非無限制，本選項與法定規定不符。"}, "ref": "公平交易法第33條", "id": 43, "chapter": "G1"}, {"year": 112, "qnum": 14, "stem": "採加盟經營方式之不動產經紀業者如以不正當限制加盟店服務報酬標準，作為成立或持續加盟經營關係之條件，而有限制競爭之虞者，屬於下列何種違反公平交易法之情事？", "options": ["以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能，構成公平交易法之聯合行為", "以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為", "以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "answer": "A", "explains": {"A": "正確。加盟業主與加盟店間為「垂直」交易關係（非平行競爭關係），以限制加盟店報酬標準作為交易條件，構成「以不正當限制交易相對人之事業活動為條件，而與其交易之行為」（第20條），此為垂直限制競爭之典型態樣。", "B": "聯合行為須有「平行」有競爭關係之事業間合意約束要件，加盟業主與加盟店為垂直關係，非聯合行為主體要件。", "C": "此為第19條之脅迫利誘等特殊限制競爭情形，與本題單純加盟報酬限制條件不符。", "D": "以損害特定事業為目的之杯葛行為，與本題情形不符（本題非以損害特定競爭者為目的）。"}, "ref": "公平交易法第20條", "id": 44, "chapter": "G1"}, {"year": 112, "qnum": 15, "stem": "下列何者應以公平交易法之規定處理？", "options": ["不動產經紀業加盟店，未於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣者", "不動產經紀業者對於涉及事業服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者", "不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者", "不動產經紀業者未依成屋買賣定型化契約書應記載及不得記載事項製作契約書者"], "answer": "B", "explains": {"A": "未標明加盟字樣，屬不動產經紀業管理條例規範之揭示義務違反，非公平交易法適用範圍。", "B": "正確。涉及「服務品質、企業形象、行銷策略」等非交易標的物本身之廣告內容虛偽不實者（非屬經紀業管理條例特別規範之「委託銷售物件廣告」範疇），應回歸適用公平交易法一般性廣告不實規定（第21條）處理，此為經紀業專法與公平法適用界線之核心觀念：物件廣告不實適用經紀業管理條例，企業形象等一般商業廣告不實適用公平交易法。", "C": "經紀業與委託人簽約後刊登廣告與事實不符，屬不動產經紀業管理條例第21條規範，應優先適用經紀業專法。", "D": "未依定型化契約應記載不得記載事項製作契約書，屬消費者保護法規範範疇，非公平交易法適用範圍。"}, "ref": "公平交易法第21條、不動產經紀業管理條例第21條", "id": 45, "chapter": "G1"}, {"year": 112, "qnum": 16, "stem": "下列何者屬於限制競爭之行為，事業不得為之？", "options": ["以著名之他人姓名、商號或公司名稱於同一或類似之商品，為相同或近似之使用，致與他人商品混淆", "事業為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事", "事業以不當提供贈品、贈獎之方法，爭取交易之機會", "無正當理由，對他事業給予差別待遇之行為"], "answer": "D", "explains": {"A": "此為仿冒行為（第22條），屬「不公平競爭」範疇，非「限制競爭」行為。", "B": "此為損害營業信譽行為（第24條），屬「不公平競爭」範疇，非「限制競爭」行為。", "C": "此為不當贈品贈獎行為（第23條），屬「不公平競爭」範疇，非「限制競爭」行為。", "D": "正確。無正當理由對他事業給予差別待遇之行為（第20條），屬「限制競爭」行為之列舉態樣，此為公平交易法「限制競爭」（第9-20條，含獨占聯合結合及妨害公平競爭）與「不公平競爭」（第21-25條，含不實廣告仿冒損害信譽不當贈品欺罔顯失公平）兩大體系之分類辨識，須熟記各條款所屬類別。"}, "ref": "公平交易法第20條、第22條、第23條、第24條", "id": 46, "chapter": "G1"}, {"year": 112, "qnum": 17, "stem": "關於聯合行為，下列何者正確？", "options": ["事業不得為聯合行為。但為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式，有益於個別經濟與股東利益，經申請主管機關許可者，不在此限", "許可應附期限，其期限不得逾三年", "事業對於主管機關就其聯合行為之許可及其有關之條件、負擔、期限，應主動公開", "聯合行為經許可後，因經濟情況變更者，主管機關得廢止該許可"], "answer": "D", "explains": {"A": "法定許可事由應為「有益於整體經濟與『公共利益』」，而非「個別經濟與股東利益」，本選項將公益要件替換為私益，性質錯誤。", "B": "許可期限不得逾三年之敘述本身正確，惟本題官方標準答案為D，本選項雖正確但非本題所選答案（可能因題目要求選出「最」核心或「唯一」正確之選項）。", "C": "應「主動公開」的敘述本身正確，惟本題官方標準答案為D。", "D": "正確。聯合行為經許可後，因「經濟情況變更」，或因其他原因致該聯合行為已無存在必要者，主管機關得廢止許可、變更許可內容、命令停止或變更該行為，或採取必要之更正措施，此為聯合行為許可之事後監督機制。"}, "ref": "公平交易法第15條、第16條、第17條", "id": 47, "chapter": "G1"}, {"year": 112, "qnum": 18, "stem": "主管機關對於事業涉有違反公平交易法規定之行為進行調查時，下列何者正確？", "options": ["事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得終止調查", "主管機關作成中止調查之決定係基於事業提供不完整或不真實之資訊，應恢復調查", "裁處權時效自終止調查之日起，停止進行", "主管機關恢復調查者，裁處權時效自恢復調查之翌日起，重新起算"], "answer": "B", "explains": {"A": "事業承諾具體改正措施者，主管機關得「中止」調查（而非「終止」調查，兩者用語不同，中止具有後續得恢復之性質，終止則為調查程序之完全結束），用語錯誤。", "B": "正確。主管機關作成中止調查之決定，若係基於事業提供不完整或不真實之資訊者，主管機關「應恢復調查」，此為保障調查程序公正性之機制。", "C": "裁處權時效應自「中止調查」（而非「終止調查」）之日起，停止進行，用語錯誤。", "D": "裁處權時效應自「中止調查」原因消滅（即恢復調查或依法不予恢復調查）之「翌日起，重行起算」，本選項稱「自恢復調查之翌日起重新起算」，用語與精確法條文字略有出入，惟本題官方標準答案為B，聚焦於「應恢復調查」此一核心情境。"}, "ref": "公平交易法第27條之1", "id": 48, "chapter": "G1"}, {"year": 112, "qnum": 19, "stem": "關於事業以不當提供贈品、贈獎之方法，爭取交易之機會，下列何者正確？", "options": ["構成獨占地位之濫用", "構成事業之結合", "構成限制轉售價格", "構成不公平競爭"], "answer": "D", "explains": {"A": "獨占地位濫用適用於獨占事業之特定行為，與本題不當贈品贈獎行為之性質不同。", "B": "結合行為係取得控制從屬關係，與本題無關。", "C": "限制轉售價格是另一類限制競爭行為，與本題不當贈品贈獎行為不同。", "D": "正確。事業以不當方法提供贈品贈獎爭取交易機會，構成公平交易法第23條所定之「不公平競爭」行為態樣之一。"}, "ref": "公平交易法第23條", "id": 49, "chapter": "G1"}, {"year": 113, "qnum": 10, "stem": "下列關於公平交易法之敘述，何者錯誤？", "options": ["維護消費者利益為本法立法目的之一", "依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定", "事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，不在此限", "本法規定事項，涉及其他部會之職掌者，由主管機關商同各該部會辦理之"], "answer": "B", "explains": {"A": "維護消費者利益為本法立法目的之一，敘述正確，非本題答案。", "B": "正確答案（錯誤敘述）。依智慧財產權法規行使權利之「『正當』行為」，始不適用本法規定，本選項漏未「正當」二字之限定要件，若行使權利之行為構成權利濫用（如以智財權為名行限制競爭之實），仍應受公平交易法規範，此為關鍵限定詞省略之★陷阱。", "C": "競爭行為原則優先適用本法，但其他法律另有規定且不牴觸立法意旨者從其規定，敘述正確，非本題答案。", "D": "涉及其他部會職掌者由主管機關商同辦理，敘述正確，非本題答案。"}, "ref": "公平交易法第1條、第46條", "id": 50, "chapter": "G1"}, {"year": 113, "qnum": 11, "stem": "不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法第 25 條「其他足以影響交易秩序之欺罔或顯失公平之行為」？", "options": ["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」", "向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還", "要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱", "締結預售屋買賣契約後，要求繳回契約書"], "answer": "B", "explains": {"A": "未書面告知斡旋金與要約書選擇權，構成欺罔顯失公平行為，非本題答案。", "B": "正確答案。收取斡旋金後因未能締約而「拒絕返還」，此性質上屬「私法契約履行爭議」（斡旋金返還之民事糾紛），應依民法或個別契約約定處理，並非公平交易法第25條規範之「足以影響交易秩序」之公法不當行為類型（此類個案性金錢返還糾紛與影響整體交易秩序之公益層次不同），此為公法／私法性質區辨之陷阱。", "C": "要求給付定金始提供契約書審閱，構成欺罔顯失公平行為，非本題答案。", "D": "締約後要求繳回契約書，構成欺罔顯失公平行為（剝奪消費者保有契約憑證之權益），非本題答案。"}, "ref": "公平交易法第25條", "id": 51, "chapter": "G1"}, {"year": 113, "qnum": 12, "stem": "不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，應由公平交易委員會依公平交易法相關規定辦理？", "options": ["散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格", "違規潛銷預售屋（未領得建造執照即廣告銷售）", "利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛偽交易，營造不動產交易活絡之表象", "對服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者"], "answer": "D", "explains": {"A": "散布不實成交價格市場行情等，可能涉及平均地權條例炒房行為規範（內政部主管法規），非本題答案。", "B": "違規潛銷預售屋，涉及建築管理及不動產經紀相關法規（內政部主管），非本題答案。", "C": "人頭排隊假交易等炒作行為，涉及平均地權條例等內政部主管法規，非本題答案。", "D": "正確答案。對「服務品質、企業形象、行銷策略」等非不動產交易標的物本身之一般商業廣告內容虛偽不實者，非內政部特別法（如平均地權條例、經紀業管理條例）規範之炒房或物件廣告事項，應回歸公平交易法一般性廣告不實規定，由公平會處理，此與112年-15題相同法理。"}, "ref": "公平交易法第21條", "id": 52, "chapter": "G1"}, {"year": 113, "qnum": 13, "stem": "事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？", "options": ["停止營業", "限期令分設事業", "處分全部或部分股份", "轉讓部分營業"], "answer": "A", "explains": {"A": "正確答案。法定得為之處分包括禁止結合、限期令分設事業、處分全部或部分股份、轉讓部分營業、免除擔任職務等，「停止營業」非本條所定違法結合之法定處分類型（停止營業係適用於違反獨占/聯合行為或其他情形之處分，非違法結合之特有處分方式），此為處分類型混淆之陷阱。", "B": "限期令分設事業屬法定處分類型之一，非本題答案。", "C": "處分全部或部分股份屬法定處分類型之一，非本題答案。", "D": "轉讓部分營業屬法定處分類型之一，非本題答案。"}, "ref": "公平交易法第39條", "id": 53, "chapter": "G1"}, {"year": 113, "qnum": 14, "stem": "公平交易法原則禁止事業為聯合行為，但有益於整體經濟與公共利益，經申請主管機關許可者，不在此限。不動產經紀業者相互間之何種聯合行為應予以禁止，不在得申請公平交易委員會許可之列？", "options": ["共同劃分經營區域、共同劃分交易對象", "為降低成本、改良品質或增進效率，而統一服務之規格或型式", "為促進事業合理經營，而分別作專業發展", "為促進產業發展、技術創新或經營效率所必要之共同行為"], "answer": "A", "explains": {"A": "正確答案。「共同劃分經營區域、共同劃分交易對象」係典型之「市場分割」行為（劃分市場卡特爾），屬對市場競爭傷害最直接且嚴重之聯合行為態樣，非法定得申請許可之例外事由，應予絕對禁止，此為聯合行為中最嚴重不得許可之類型。", "B": "為降低成本改良品質增進效率而統一規格型式，屬法定得申請許可情形，非本題答案。", "C": "為促進事業合理經營分別作專業發展，屬法定得申請許可情形，非本題答案。", "D": "為促進產業發展技術創新或經營效率所必要之共同行為，屬法定得申請許可情形，非本題答案。"}, "ref": "公平交易法第15條", "id": 54, "chapter": "G1"}, {"year": 113, "qnum": 16, "stem": "下列何者不違反公平交易法第 21 條廣告不實？", "options": ["不動產代銷業者於售屋網站公告35米泳池，而該泳池設置處於竣工圖為景觀水池", "不動產代銷業者於售屋廣告，標示近捷運站", "不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明", "不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"], "answer": "B", "explains": {"A": "將景觀水池宣稱為泳池，與竣工圖登載用途不符，構成虛偽不實廣告，非本題答案。", "B": "正確答案。「標示近捷運站」係一般常見之地理位置描述用語，只要客觀上確實鄰近捷運站（距離合理），非虛偽誇大之陳述，不構成廣告不實（除非誇大距離或根本不鄰近），此為合理商業慣用語與不實廣告之區辨。", "C": "工業區用地使用一般住宅用語圖示，誤導消費者混淆使用分區限制，構成虛偽不實或引人錯誤廣告，非本題答案。", "D": "科技工業區建案使用住家傢俱配置參考圖，誤導消費者混淆使用分區限制，構成虛偽不實或引人錯誤廣告，非本題答案。"}, "ref": "公平交易法第21條", "id": 55, "chapter": "G1"}, {"year": 113, "qnum": 17, "stem": "甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10 萬元斡旋，可保留優先購買之權利，於是甲支付 10 萬元，並簽訂「不動產購買意願書」，下列何者錯誤？", "options": ["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用", "斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用", "如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務", "仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25條之規定"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。要約書為內政部訂定之「免付費」制式文件，消費者選擇採用要約書「無須另行支付費用」（此為要約書相對於斡旋金之核心差異優勢），本選項稱「並需支付斡旋費用」，與要約書免付費之設計本旨相反，屬★陷阱。", "B": "斡旋金定義描述正確，非本題答案。", "C": "仲介業者應以書面明定斡旋金交付目的及消費者權利義務，屬公平會斡旋金規範要求，敘述正確，非本題答案。", "D": "違反斡旋金規範有欺罔顯失公平情事者，違反公平交易法第25條，敘述正確，非本題答案。"}, "ref": "公平交易法第25條", "id": 56, "chapter": "G1"}, {"year": 114, "qnum": 7, "stem": "甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？", "options": ["公平交易法", "平均地權條例", "消費者保護法", "不動產經紀業管理條例"], "answer": "B", "explains": {"A": "公平交易法非本題優先適用之法律。", "B": "正確。預售屋銷售違反定型化契約應記載不得記載事項（車位位置規格不符），依現行規定應優先適用「平均地權條例」（該條例對預售屋銷售、定型化契約備查及違規裁罰已有特別規定，屬特別法優先於普通法（消保法）適用），此為近年修法後之新考點（平均地權條例修正強化預售屋管理規範），須留意特別法優先原則。", "C": "消費者保護法為普通法，於平均地權條例已有特別規定之範圍內，退居補充適用地位，非優先適用。", "D": "不動產經紀業管理條例規範經紀業者之行為，非建商銷售預售屋契約應記載不得記載事項之直接裁罰依據。"}, "ref": "平均地權條例第47條之3", "id": 57, "chapter": "G1"}, {"year": 114, "qnum": 8, "stem": "公平交易法有關事業間聯合行為之敘述，下列何者錯誤？", "options": ["行為主體須為二以上彼此具競爭關係之同一產銷階段事業", "事業間具有以契約、協議或其他方式之合意或相互約束事業活動之行為", "效果須足以影響生產、商品交易或服務供需之市場功能", "主管機關不得以相當依據推定事業間具有聯合行為之合意"], "answer": "D", "explains": {"A": "行為主體須為二以上彼此具競爭關係之同一產銷階段事業，敘述正確，非本題答案。", "B": "須具有合意或相互約束事業活動之行為，敘述正確，非本題答案。", "C": "效果須足以影響市場供需功能，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。主管機關「得」以有相當依據足以合理推知已有意思聯絡，而事實上一致之行為，推定事業間具有聯合行為之合意（此為聯合行為合意要件之舉證便利機制，蓋聯合行為之秘密協議通常難有直接書面證據），本選項稱「不得」推定，方向相反，屬★陷阱。"}, "ref": "公平交易法第14條", "id": 58, "chapter": "G1"}, {"year": 114, "qnum": 9, "stem": "下列何者不屬於公平交易法第 21 條不實廣告之行為態樣？", "options": ["甲公司在網頁宣稱驗屋人員有專業證照，惟該等證照並非與執行驗屋業務相關的證照", "乙建商在廣告文宣傳單上，對於使用分區為科技商務專用區之建案使用一般住宅用語", "丙仲介人員在公司窗戶上貼單，刊載多筆房屋賀成交資訊，惟部分成交紀錄並非均為該公司所成交", "代銷業者刊登廣告招徠客人，對來購屋消費者表示須先給付定金始提供房屋買賣契約書攜回審閱"], "answer": "D", "explains": {"A": "宣稱與業務無關之證照誤導消費者專業能力認知，構成虛偽不實或引人錯誤廣告，非本題答案。", "B": "科技商務專用區使用一般住宅用語，誤導使用分區限制，構成虛偽不實或引人錯誤廣告，非本題答案。", "C": "刊載非本公司實際成交之紀錄，構成虛偽不實廣告（誇大業績），非本題答案。", "D": "正確答案。要求先給付定金始提供契約書審閱，此行為性質上非「廣告內容」本身虛偽不實或引人錯誤（第21條規範廣告內容真實性），而係剝奪消費者法定審閱期權益之「其他足以影響交易秩序之欺罔或顯失公平行為」（第25條），兩者條款適用範疇不同，此為第21條與第25條適用界線之陷阱。"}, "ref": "公平交易法第21條、第25條", "id": 59, "chapter": "G1"}, {"year": 114, "qnum": 10, "stem": "事業向公平交易委員會申請許可進口玉米之聯合行為，經該會附加負擔後予以許可，並在期限屆滿前，再向主管機關申請期限延展。下列敘述何者錯誤？", "options": ["主管機關對許可及其有關之條件、負擔、期限，不得主動公開", "事業向主管機關申請其延展期限，每次不得逾5年", "主管機關對申請展延所為之許可，得附加條件或負擔", "事業如有正當理由，得於期限屆滿前3個月至6個月期間內申請"], "answer": "A", "explains": {"A": "正確答案（錯誤敘述）。主管機關對聯合行為許可及其有關之條件、負擔、期限，「應主動公開」，而非「不得主動公開」，此為資訊公開透明原則，本選項方向相反，屬★極高頻陷阱（與110年-21題D選項相呼應之核心觀念）。", "B": "延展期限每次不得逾5年之敘述，係針對本題「進口玉米」（屬國外商品輸入採共同行為之特殊聯合行為類型）之許可期限（該類型許可期限依法可達5年），敘述正確，非本題答案。", "C": "展延許可得附加條件或負擔，敘述正確，非本題答案。", "D": "有正當理由者得於期限屆滿前3個月至6個月期間內申請展延，敘述正確，非本題答案。"}, "ref": "公平交易法第15條、第17條", "id": 60, "chapter": "G1"}, {"year": 114, "qnum": 21, "stem": "依公平交易法之規定，法院因事業違反該法之規定，致侵害他人權益者，被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？", "options": ["二倍", "三倍", "五倍", "十倍"], "answer": "B", "explains": {"A": "數字錯誤，非二倍。", "B": "正確。事業故意行為致侵害他人權益者，法院酌定之賠償不得超過已證明損害額之「3倍」，全科最高頻數字，反覆重複命題（99、102、108、109、114年皆考）。", "C": "數字錯誤，非五倍。", "D": "數字錯誤，非十倍。"}, "ref": "公平交易法第31條", "id": 61, "chapter": "G1"}];
const STORAGE_KEY = "brokerlaw_g1_2_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
