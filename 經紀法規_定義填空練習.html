<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>(function(){var s=null;try{s=localStorage.getItem("bx-theme")}catch(e){}document.documentElement.setAttribute("data-theme",s||"light")})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經紀法規定義填空練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root[data-theme="light"]{
  --bg:#F8F3E9; --ink:#2A2722; --red:#A8402B; --gold:#BC8A2E;
  --green:#5C7A4A; --card:#FFFDF8; --line:#E4DAC4; --muted:#7A6E5E;
  --blue:#1E3E6E; --surface2:#F0EBE0;
  color-scheme:light;
}
:root{
  --bg:#F8F3E9; --ink:#2A2722; --red:#A8402B; --gold:#BC8A2E;
  --green:#5C7A4A; --card:#FFFDF8; --line:#E4DAC4; --muted:#7A6E5E;
  --blue:#1E3E6E; --surface2:#F0EBE0;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1612; --ink:#F0E8D8; --red:#E05040; --gold:#D4A030;
  --green:#5AAA48; --card:#26201A; --line:#3C3028; --muted:#9A8C7C;
  --blue:#6090D8; --surface2:#302820;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1612; --ink:#F0E8D8; --red:#E05040; --gold:#D4A030;
  --green:#5AAA48; --card:#26201A; --line:#3C3028; --muted:#9A8C7C;
  --blue:#6090D8; --surface2:#302820;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:80px}
header{background:linear-gradient(135deg,var(--red),#8c3322);color:#fff;padding:24px 20px 20px;text-align:center}
header h1{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}

/* nav */
nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav-btn{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn.on{background:var(--red);color:#fff;border-color:var(--red)}

/* main */
main{max-width:720px;margin:0 auto;padding:20px 16px}
.chapter{display:none}
.chapter.active{display:block}
.ch-title{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;color:var(--red);border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:18px}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;margin-bottom:14px}
.term{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:10px}
.blank-line{font-size:14px;line-height:2.2;color:var(--ink);margin-bottom:12px}

/* 每個空格獨立可點擊 */
.blank{
  display:inline-block;
  border-bottom:2px solid var(--red);
  min-width:60px;
  padding:0 4px;
  color:transparent;
  background:rgba(168,64,43,.08);
  border-radius:3px;
  vertical-align:bottom;
  cursor:pointer;
  user-select:none;
  transition:color .18s, background .18s;
  font-weight:700;
  font-size:13.5px;
}
.blank:hover{background:rgba(168,64,43,.15)}
.blank.revealed{
  color:var(--red);
  background:rgba(168,64,43,.12);
  border-bottom-color:var(--green);
}
.blank .blank-mask{display:inline}
.blank.revealed .blank-mask{display:none}
.blank .blank-val{display:none;color:var(--red)}
.blank.revealed .blank-val{display:inline}

/* 整張卡按鈕 */
.reveal-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer;transition:all .15s;margin-right:8px}
.reveal-btn:hover{background:var(--red);color:#fff}
.reveal-all-btn{font:inherit;font-size:13px;font-weight:700;padding:5px 14px;border-radius:6px;border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;transition:all .15s}
.reveal-all-btn:hover{background:var(--green);color:#fff}
.reveal-all-btn.done{background:var(--green);color:#fff;border-color:var(--green)}

.card-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.section-hint{font-size:11px;color:#AAA09A;margin-bottom:14px;letter-spacing:.3px}

.answer-note{display:none;margin-top:10px;padding:10px 12px;background:#F0F6EC;border-left:3px solid var(--green);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.answer-note.show{display:block}
.answer-note .key{color:var(--red);font-weight:700}
.answer-note .src{margin-top:6px;font-size:12px;color:var(--muted)}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prog-bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* hub */
#hub{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:24px;text-align:center;line-height:52px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:20}

/* 模式切換 tab */
.mode-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.mode-tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:10px 0;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .15s}
.mode-tab.on{color:var(--red);border-bottom-color:var(--red);background:transparent}

/* 測驗模式 */
#quiz-mode{display:none;max-width:720px;margin:0 auto;padding:20px 16px 80px}
#quiz-mode.active{display:block}

/* 章節過濾 */
.quiz-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qf-btn{font:inherit;font-size:12px;font-weight:700;padding:4px 12px;
  border-radius:99px;border:1.5px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.qf-btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.qf-all.on{background:var(--ink);border-color:var(--ink)}

/* 題卡 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 18px 16px;margin-bottom:16px}
.qc-meta{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px}
.qc-chapter{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qc-counter{font-size:11px;color:var(--muted)}
.qc-term{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;
  color:var(--red);margin-bottom:14px;text-wrap:balance}
.qc-blank{font-size:14px;line-height:2.4;color:var(--ink);margin-bottom:14px;
  word-break:break-all}
.qc-blank .blank{
  display:inline-block;border-bottom:2px solid var(--red);
  padding:0 3px;color:transparent;background:rgba(168,64,43,.08);
  border-radius:3px;vertical-align:bottom;cursor:pointer;user-select:none;
  transition:color .18s,background .18s;font-weight:700;font-size:13.5px}
.qc-blank .blank:hover{background:rgba(168,64,43,.15)}
.qc-blank .blank.revealed{color:var(--red);background:rgba(168,64,43,.12);
  border-bottom-color:var(--green)}
.qc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qc-btn{font:inherit;font-size:13px;font-weight:700;padding:7px 18px;
  border-radius:8px;border:1.5px solid;cursor:pointer;transition:all .15s}
.qc-btn-reveal{border-color:var(--red);color:var(--red);background:transparent}
.qc-btn-reveal:hover{background:var(--red);color:#fff}
.qc-btn-all{border-color:var(--green);color:var(--green);background:transparent}
.qc-btn-all:hover{background:var(--green);color:#fff}
.qc-btn-next{border-color:var(--blue);color:var(--blue);background:transparent}
.qc-btn-next:hover{background:var(--blue);color:#fff}
.qc-btn-prev{border-color:var(--muted);color:var(--muted);background:transparent}
.qc-btn-prev:hover{background:var(--muted);color:#fff}
.qc-btn-prev:disabled{opacity:.3;cursor:default}
.qc-btn-prev:disabled:hover{background:transparent;color:var(--muted)}
.qc-answer{display:none;margin-top:10px;padding:10px 14px;
  background:rgba(92,122,74,.12);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.85}
.qc-answer.show{display:block}
.qc-answer .key{color:var(--red);font-weight:700}
.qc-answer .src{margin-top:6px;font-size:12px;color:var(--muted)}
.qc-exam-stat{display:none;margin-top:10px;padding:6px 12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px}
.qc-exam-stat.show{display:block}
.qc-exam-stat strong{color:var(--ink)}
/* 主題切換按鈕 */
#theme-btn{position:fixed;top:10px;right:10px;z-index:50;
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.quiz-progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.quiz-done-banner{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.quiz-done-banner .big{font-size:48px;margin-bottom:8px}
/*bx-s4*/
:root,:root[data-theme="light"]{--bg:#F5F1E6;--ink:#25302C;--red:#2F5D50;--gold:#B8782E;--green:#35693F;--card:#FFFEFA;--line:#DAD6C3;--muted:#5F6B63;--blue:#2F5D50;--surface2:#EDE8D8;--bxpri:#2F5D50;--bxon:#fff;--sf:#FFFEFA;--s2:#EDE8D8;--bad:#A8402B;--badsoft:#F8E1DC;--asoft:#F7E6CC;--acc-ink:#8A5517;--oksoft:#E0EFE0;--psoft:#DDEBE5}
:root[data-theme="dark"]{--bg:#161C19;--ink:#E7ECE6;--red:#84C2AE;--gold:#E0B070;--green:#8FCB93;--card:#1F2723;--line:#33403A;--muted:#A5B1A8;--blue:#84C2AE;--surface2:#24302A;--bxpri:#84C2AE;--bxon:#161C19;--sf:#1F2723;--s2:#24302A;--bad:#F08A7E;--badsoft:#42261F;--asoft:#3A3220;--acc-ink:#E6C06E;--oksoft:#22351F;--psoft:#24362F;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161C19;--ink:#E7ECE6;--red:#84C2AE;--gold:#E0B070;--green:#8FCB93;--card:#1F2723;--line:#33403A;--muted:#A5B1A8;--blue:#84C2AE;--surface2:#24302A;--bxpri:#84C2AE;--bxon:#161C19;--sf:#1F2723;--s2:#24302A;--bad:#F08A7E;--badsoft:#42261F;--asoft:#3A3220;--acc-ink:#E6C06E;--oksoft:#22351F;--psoft:#24362F;color-scheme:dark}}
header{background:var(--bxpri)!important;color:var(--bxon)!important}
header h1,header .sub,header .lead,header .case-tag{color:var(--bxon)!important}
header .case-tag{border-color:var(--bxon)!important}
#theme-btn{position:fixed!important;top:10px!important;right:10px!important;z-index:70!important;width:auto!important;height:auto!important;border-radius:99px!important;padding:6px 14px!important;border:1px solid var(--line)!important;background:var(--surface,var(--sf,var(--card,#FFFEFA)))!important;color:var(--ink)!important;font-size:13px!important;line-height:1.2!important;cursor:pointer;box-shadow:none!important;display:block!important}
body{padding-bottom:84px!important}
.nav-btn.on,.qf-btn.on,.reveal-btn:hover,.qc-btn-reveal:hover{color:var(--bxon)!important}
.blank{background:color-mix(in srgb,var(--red) 12%,transparent)!important}.blank:hover{background:color-mix(in srgb,var(--red) 20%,transparent)!important}
.qc-blank .blank,.qc-blank .blank.revealed{background:color-mix(in srgb,var(--red) 12%,transparent)!important}
.answer-note{background:color-mix(in srgb,var(--green) 14%,var(--card))!important}.qc-answer{background:color-mix(in srgb,var(--green) 14%,var(--card))!important}
.section-hint{color:var(--muted)!important}</style>
<script src="bxj-use.js"></script>
</head>
<body>

<button id="theme-btn" onclick="toggleTheme()" title="切換深淺色">深色</button>
<header>
  <h1>經紀法規概要｜定義填空練習</h1>
  <div class="sub">章節練習 + 隨機測驗模式｜全科 106 題</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab on" id="tab-browse" onclick="setMode('browse')">章節瀏覽</button>
  <button class="mode-tab" id="tab-quiz" onclick="setMode('quiz')">隨機測驗</button>
</div>

<nav id="nav"></nav>

<main id="main"></main>

<div id="quiz-mode">
  <div class="quiz-filter" id="quiz-filter"></div>
  <div class="quiz-progress" id="quiz-progress"></div>
  <div id="quiz-card-area"></div>
</div>

<script>
const DATA = [{"id":"A","label":"A 經紀業管理條例","stat":"A篇歷屆 138 題（26.5%）","cards":[{"term":"差價（§4）","blank":"差價：實際___與___之差額（★不是與行情價之差額）。","answer":"差價：實際<span class=\"key\">買賣交易價格</span>與<span class=\"key\">委託銷售價格</span>之差額（★不是與行情價之差額）。","src":"條例§4⑨","essay":1,"hot":1,"p":"客戶委託你賣 1200 萬，你實際用 1350 萬成交，中間吞掉的 150 萬就是差價。條文比的是「成交價 vs 委託銷售價」，跟市場行情、公告現值都沒有關係。","m":"成交減委託，不是減行情。","t":"最常見的錯誤選項是「實際成交價與<b>市價（行情價）</b>之差額」，§4⑨明文寫的是<b>委託銷售價格</b>。另外禁止收差價規定在§19Ⅰ，違反的效果是「加計利息後<b>加倍返還</b>支付人」，不是沒收、也不是三倍，別和§29的罰鍰混成一題。"},{"term":"成屋／預售屋（§4）","blank":"成屋指領有___，或於實施___前建造完成之建築物；預售屋指領有___尚未建造完成，以___之建築物為交易標的。","answer":"成屋指領有<span class=\"key\">使用執照</span>，或於實施<span class=\"key\">建築管理</span>前建造完成之建築物；預售屋指領有<span class=\"key\">建造執照</span>尚未建造完成，以<span class=\"key\">將來完成</span>之建築物為交易標的。","src":"條例§4②③","essay":0,"hot":0,"p":"房子蓋好、拿到使用執照、可以搬進去住的叫成屋；還在工地、只領了建造執照就先賣圖面的叫預售屋。古早建築管理制度上路前就蓋好的老屋，也歸成屋。","m":"成屋領使照，預售領建照。","t":"兩張執照一字之差：成屋是<b>使用執照</b>、預售屋是<b>建造執照</b>，選項最愛對調。預售屋還要加上「<b>尚未建造完成</b>、以將來完成之建築物為交易標的」，蓋完領到使照就變成屋了。成屋的第二種情形「實施建築管理前建造完成」常被整句挖掉。"},{"term":"仲介業務／代銷業務（§4）","blank":"仲介業務：從事買賣、互易、租賃之___或___業務；代銷業務：受___或___委託，負責企劃並___銷售。","answer":"仲介業務：從事買賣、互易、租賃之<span class=\"key\">居間</span>或<span class=\"key\">代理</span>業務；代銷業務：受<span class=\"key\">起造人</span>或<span class=\"key\">建築業</span>委託，負責企劃並<span class=\"key\">代理</span>銷售。","src":"條例§4⑤⑥","essay":0,"hot":0,"p":"幫買賣雙方牽線、或代理他們成交的是仲介；受建商（起造人）委託，從企劃到賣房一手包辦的是代銷。白話說，仲介主要做中古屋，代銷做新建案包銷。","m":"買賣互易租賃是仲介，起造建商委託是代銷。","t":"仲介業務的標的是「買賣、<b>互易</b>、租賃」三種，選項漏掉互易就是錯的，而且限於「<b>居間或代理</b>」。代銷的委託人限<b>起造人或建築業</b>，寫成「所有權人」「賣方」就錯。延伸記§22Ⅱ：委託契約書、要約書這兩款對代銷業不適用。"},{"term":"經紀業開業程序（§7）","blank":"經紀業經許可後，辦理___登記、加入___，並於___內開始營業；有正當理由得展延一次，以___為限。","answer":"經紀業經許可後，辦理<span class=\"key\">公司或商業</span>登記、加入<span class=\"key\">同業公會</span>，並於<span class=\"key\">6個月</span>內開始營業；有正當理由得展延一次，以<span class=\"key\">3個月</span>為限。","src":"條例§7Ⅰ、細則§4（申論103年一）","essay":1,"hot":0,"p":"拿到許可還不能開門營業：要先辦好公司（商號）登記、繳存營業保證金、加入登記所在地的同業公會，然後在 6 個月內真的開始營業，逾期許可就被廢止；有正當理由可再延一次 3 個月。","m":"六個月開業，展延一次三個月。","t":"兩個「6 個月」要分清楚：細則§4 是<b>許可後 6 個月內辦妥登記、繳保證金、入公會</b>；條例§7Ⅰ是<b>6 個月內開始營業</b>。展延只能「<b>一次、以 3 個月為限</b>」，選二次或 6 個月都錯。另外開始營業後還要 15 日內申請備查（細則§5），別跟 30 日混用。"},{"term":"不得申請經營經紀業（§6）","blank":"限犯___等特定之罪，受有期徒刑___以上刑之宣告確定，尚未執行完畢或執行完畢、赦免後未滿___者（受緩刑宣告者除外）；曾經營經紀業經撤銷或廢止許可未滿___者，不得申請經營經紀業（但逾期未開始營業或自行停止業務者，不在此限）。","answer":"限犯<span class=\"key\">詐欺、背信、侵占</span>等特定之罪，受有期徒刑<span class=\"key\">1年</span>以上刑之宣告確定，尚未執行完畢或執行完畢、赦免後未滿<span class=\"key\">3年</span>者（受緩刑宣告者除外）；曾經營經紀業經撤銷或廢止許可未滿<span class=\"key\">5年</span>者，不得申請經營經紀業（但逾期未開始營業或自行停止業務者，不在此限）。","src":"條例§6Ⅰ③⑤","essay":0,"hot":0,"p":"有詐欺、背信、侵占等前科被判過刑，或以前開仲介被撤照的人，一段時間內不准再申請經營經紀業。立法目的就是把信用有瑕疵的人先擋在門外。","m":"徒刑一年、未滿三年；撤照未滿五年。","t":"三個數字別混：有期徒刑「<b>1 年以上</b>」宣告確定、執行完畢或赦免後「<b>未滿 3 年</b>」、撤銷或廢止許可起「<b>未滿 5 年</b>」。兩個但書最常被挖空：受<b>緩刑</b>宣告者不在此限；因逾期未開始營業（§7Ⅰ）或自行停止業務（§30）而被廢止者，不受 5 年限制。"},{"term":"營業處所人員配置（§11）","blank":"營業處所至少置經紀人___人；經紀營業員每逾___名，應增設經紀人1人。但非常態營業處所銷售總金額達新臺幣___以上者，該處所至少應置___1人（§11Ⅰ但書，為本文之例外，非在一般經紀人之外另行加設）。","answer":"營業處所至少置經紀人<span class=\"key\">1</span>人；經紀營業員每逾<span class=\"key\">20</span>名，應增設經紀人1人。但非常態營業處所銷售總金額達新臺幣<span class=\"key\">6億元</span>以上者，該處所至少應置<span class=\"key\">專業經紀人</span>1人（§11Ⅰ但書，為本文之例外，非在一般經紀人之外另行加設）。","src":"條例§11（罰鍰6萬～30萬）","essay":0,"hot":0,"p":"每個營業處所至少要有 1 位經紀人坐鎮；營業員每多 20 名就要再加 1 位經紀人。賣大案子的接待中心（非常態處所）如果銷售總金額達 6 億以上，也至少要有 1 位專業經紀人。","m":"一處所一經紀人，每逾二十加一人。","t":"§11Ⅰ但書是<b>本文的例外</b>，不是在原本 1 人之外「另加」；問「6 億以上的接待中心至少幾人」答案是<b>1 人</b>，不是 2 人。「每<b>逾</b> 20 名」是超過才加，剛好 20 名不必增設。違反§11依§29Ⅰ①直接處 6 萬以上 30 萬以下罰鍰，不必先限期改正。"},{"term":"營業保證金（§8-9）","blank":"營業保證金由___統一設置___專戶管理；基金管理委員會中由經紀業擔任之委員，不得超過總數___。","answer":"營業保證金由<span class=\"key\">全國聯合會</span>統一設置<span class=\"key\">營業保證基金</span>專戶管理；基金管理委員會中由經紀業擔任之委員，不得超過總數<span class=\"key\">五分之二</span>。","src":"條例§8、§9","essay":0,"hot":0,"p":"仲介繳的營業保證金不是放在自己公司帳上，而是由全國聯合會統一在指定金融機構開一個「營業保證基金專戶」存著，再組管理委員會保管，將來客戶受害才有錢代賠。","m":"聯合會專戶保管，業者委員不過五分之二。","t":"「<b>五分之二</b>」是上限，寫二分之一、三分之一都錯，而且限制的對象是「<b>由經紀業擔任之委員</b>」占委員總數的比例。延伸記§8Ⅳ：保證金低於規定額度時，全國聯合會通知後要在「<b>1 個月內</b>」補足，再串§29Ⅰ⑦停業至補足、停業達 1 年廢止許可。"},{"term":"訓練時數與效期（§13-14）","blank":"經紀營業員初次訓練不得少於___小時，證明效期___年，重新登錄需完成___小時；經紀人證書效期___年，換證需___小時。","answer":"經紀營業員初次訓練不得少於<span class=\"key\">30</span>小時，證明效期<span class=\"key\">4</span>年，重新登錄需完成<span class=\"key\">20</span>小時；經紀人證書效期<span class=\"key\">4</span>年，換證需<span class=\"key\">30</span>小時。","src":"條例§13Ⅲ、§15Ⅰ","essay":0,"hot":1,"p":"營業員和經紀人都是 4 年一期，但時數不同：營業員初訓 30 小時，4 年期滿要補 20 小時重新登錄；經紀人則是 4 年內完成 30 小時專業訓練才能換證。考試最愛把這幾個數字互換。","m":"營業員三十初訓、二十重登；經紀人三十換證，效期都四年。","t":"全場<b>唯一的 20 小時</b>是「營業員重新登錄」，其他一律 30 小時；效期一律 4 年。動作用詞也不同：營業員叫<b>重新登錄</b>（向中央主管機關指定之機構、團體辦理），經紀人叫<b>換發證書</b>（向直轄市或縣市政府辦理）。另外經紀人證書效期與換證在<b>§15</b>，不是§14，舊講義常標錯。"},{"term":"經紀人請領證書（§14）","blank":"經紀人考試及格者，須具備___以上經紀營業員經驗，方得請領證書；換證應於效期屆滿前___內申請（細則）。","answer":"經紀人考試及格者，須具備<span class=\"key\">1年</span>以上經紀營業員經驗，方得請領證書；換證應於效期屆滿前<span class=\"key\">6個月</span>內申請（細則）。","src":"條例§14Ⅰ、細則§17Ⅰ","essay":0,"hot":1,"p":"考試及格不等於馬上能當經紀人，還要先累積 1 年以上經紀營業員的實務經驗，才能拿及格證書去縣市政府請領經紀人證書，等於先當學徒再升師傅。","m":"及格再加一年營業員；屆滿前六個月換證。","t":"1 年經驗是「<b>請領證書</b>」的要件，不是應考資格，題目寫「考試及格即得充任經紀人」就錯。經驗認定限條文列的兩種（有仲介或代銷所得<b>扣繳資料證明</b>）。換證時點是「有效期限<b>屆滿前</b> 6 個月內」（細則§17），不是屆滿後 6 個月內，也不是 3 個月。"},{"term":"專任義務（§16）","blank":"經紀人員應___一經紀業，並不得為___或他經紀業執行仲介或代銷業務；但經___同意為他經紀業執行業務者除外（為自己執行業務無例外）；違反者懲戒為___。","answer":"經紀人員應<span class=\"key\">專任</span>一經紀業，並不得為<span class=\"key\">自己</span>或他經紀業執行仲介或代銷業務；但經<span class=\"key\">所屬經紀業</span>同意為他經紀業執行業務者除外（為自己執行業務無例外）；違反者懲戒為<span class=\"key\">申誡</span>。","src":"條例§16、§31Ⅰ①（申論101年一）","essay":1,"hot":0,"p":"經紀人員只能掛一家經紀業，不能同時在好幾家兼差，也不能自己私下接案賺外快。唯一的鬆綁是原公司點頭同意，才可以去幫別家經紀業執行業務。","m":"專任一業；他業可同意，自己無例外。","t":"但書只救「為<b>他經紀業</b>執行業務」，「為<b>自己</b>執行業務」永遠沒有例外，這是最常被偷換的地方。效果面：違反§16依§31Ⅰ①只是<b>申誡</b>，不是停止執行業務；會被處 6 個月以上 3 年以下停業的，只有違反§19Ⅰ收差價那一款。"},{"term":"委託契約與廣告（§21）","blank":"經紀業須先與委託人簽訂___，方得刊登___及銷售；廣告內容應與___相符，並註明___。","answer":"經紀業須先與委託人簽訂<span class=\"key\">委託契約書</span>，方得刊登<span class=\"key\">廣告</span>及銷售；廣告內容應與<span class=\"key\">事實</span>相符，並註明<span class=\"key\">經紀業名稱</span>。","src":"條例§21（罰鍰6萬～30萬）","essay":1,"hot":0,"p":"先跟委託人簽好委託契約書，才可以刊登廣告、才可以開始賣，順序顛倒就違法。而且廣告內容要跟事實相符，還要把經紀業名稱寫上去，不能匿名亂丟廣告。","m":"先簽委託、後登廣告、並要具名。","t":"順序題：「<b>簽訂委託契約書 → 刊登廣告及銷售</b>」，選項把順序倒過來就是錯的。廣告不實有<b>兩層</b>效果且併存：§21Ⅲ要負損害賠償責任，§29Ⅰ①另處 6 萬以上 30 萬以下罰鍰。另注意§21Ⅰ的義務主體是「經紀業」，不是經紀人員。"},{"term":"應簽章六類文件（§22）","blank":"應由經紀人簽章：①出租出售___；②承租承購___；③___收據；④廣告稿；⑤___；⑥租賃買賣契約書。代銷業務不適用第___款及第___款。","answer":"應由經紀人簽章：①出租出售<span class=\"key\">委託契約書</span>；②承租承購<span class=\"key\">要約書</span>；③<span class=\"key\">定金</span>收據；④廣告稿；⑤<span class=\"key\">不動產說明書</span>；⑥租賃買賣契約書。代銷業務不適用第<span class=\"key\">一</span>款及第<span class=\"key\">二</span>款。","src":"條例§22、細則§24（申論105年一、113年一）","essay":2,"hot":1,"p":"這六種文件一定要由經紀業「指派經紀人」簽章，營業員簽不算數。背的時候照一整筆交易的流程走一遍：委託 → 要約 → 收定金 → 打廣告 → 說明書 → 正式契約。","m":"委託、要約、定金、廣告、說明、契約，六件經紀人簽。","t":"代銷業不適用的是<b>第①②款</b>（出租出售委託契約書、承租承購要約書），不是後四款，常被改成「③④款不適用」。另外細則§24：不是透過經紀業仲介或代銷的交易，根本不適用§22Ⅰ。效果雙軌：經紀業依§29Ⅰ①罰 6 萬～30 萬，經紀人員依§31Ⅰ①申誡。"},{"term":"不動產說明書流程（§23-24）","blank":"說明書提供解說前須經___簽章 → 由___（§23）向交易相對人解說 → 締約時由___（§24）交付相對人並由其簽章 → 視為___之一部分。","answer":"說明書提供解說前須經<span class=\"key\">委託人</span>簽章 → 由<span class=\"key\">經紀人員</span>（§23）向交易相對人解說 → 締約時由<span class=\"key\">經紀人</span>（§24）交付相對人並由其簽章 → 視為<span class=\"key\">租賃或買賣契約書</span>之一部分。","src":"條例§23、§24（申論105年一、108年二）","essay":2,"hot":1,"p":"不動產說明書要走完四關：先給委託人簽章 → 帶看時向買方（交易相對人）解說 → 簽約時交付買方並請他簽章 → 之後它就成為契約的一部分，內容講錯要負責。","m":"委託人先簽、再解說、相對人簽，成契約一部分。","t":"兩個身分別記反：負責<b>解說</b>的是「經紀人<b>員</b>」（§23，營業員也可以），簽約時<b>交付</b>的是「經紀<b>人</b>」（§24）。簽章時點也常被對調：委託人是在「<b>提供解說前</b>」簽，相對人是在「<b>簽訂租賃或買賣契約書時</b>」簽。"},{"term":"雙方代理（§24-2）","blank":"經買賣或租賃___書面同意，得同時接受雙方委託，並應公平提供雙方類似不動產___、契約內容規範說明、必要資訊，及告知應查知之___。","answer":"經買賣或租賃<span class=\"key\">雙方當事人</span>書面同意，得同時接受雙方委託，並應公平提供雙方類似不動產<span class=\"key\">交易價格</span>、契約內容規範說明、必要資訊，及告知應查知之<span class=\"key\">瑕疵</span>。","src":"條例§24-2（申論109年二、114年二）","essay":2,"hot":1,"p":"同一家仲介同時幫買方和賣方做，法律沒有全面禁止，但前提是買賣（租賃）雙方都「書面同意」，而且要公平地把價格、契約內容、瑕疵資訊都攤給兩邊，不能偏袒出價高的那一方。","m":"雙方書面同意，資訊公平給雙方。","t":"同意必須是「<b>書面</b>」，口頭或默示不算。§24-2 總共<b>六款</b>義務，除了價格、契約說明、必要資訊、告知瑕疵外，還有「<b>協助買受人或承租人對不動產進行必要之檢查</b>」及中央主管機關其他規定，只背四款會被扣分。違反§24-2依§29Ⅰ③處 3 萬以上 15 萬以下罰鍰。"},{"term":"申報登錄（§24-1）","blank":"仲介業務成交租賃案件，簽訂租賃契約書之日起___內申報登錄；代銷預售屋，簽訂買賣契約書之日起___內申報登錄成交資訊；委託代銷契約簽訂、變更、終止之日起___內報請備查。","answer":"仲介業務成交租賃案件，簽訂租賃契約書之日起<span class=\"key\">30日</span>內申報登錄；代銷預售屋，簽訂買賣契約書之日起<span class=\"key\">30日</span>內申報登錄成交資訊；委託代銷契約簽訂、變更、終止之日起<span class=\"key\">30日</span>內報請備查。","src":"條例§24-1（申論110年一）","essay":1,"hot":0,"p":"成交後要把實際資訊報給政府。仲介居間成交的租賃案、代銷賣掉的預售屋，都是簽約之日起 30 日內申報登錄；代銷的委託代銷契約本身，簽訂、變更、終止也都是 30 日內報請備查。","m":"租賃、預售買賣、委託代銷，通通三十日。","t":"期限都是 30 日，但<b>罰則級距完全不同</b>：租賃案件未依限申報登錄依§29Ⅰ⑤罰 1 萬～5 萬；預售屋買賣未依限申報或價格、面積不實依§29Ⅰ②<b>按戶（棟）</b>罰 3 萬～15 萬，處罰二次仍未改正按次罰 30 萬～100 萬；委託代銷契約未報備查依§29Ⅰ③罰 3 萬～15 萬。考題常把罰鍰配錯行為。"},{"term":"損害賠償（§26）","blank":"經紀業因經紀人員執行業務之___致交易當事人受損害，經紀業與經紀人員負___賠償責任；受害人須先取得___、經仲裁成立或基金管理委員會決議支付後，始得於該經紀業繳存營業保證金及提供擔保總額內，請求___代為賠償。","answer":"經紀業因經紀人員執行業務之<span class=\"key\">故意或過失</span>致交易當事人受損害，經紀業與經紀人員負<span class=\"key\">連帶</span>賠償責任；受害人須先取得<span class=\"key\">執行名義</span>、經仲裁成立或基金管理委員會決議支付後，始得於該經紀業繳存營業保證金及提供擔保總額內，請求<span class=\"key\">全國聯合會</span>代為賠償。","src":"條例§26Ⅱ、Ⅳ","essay":0,"hot":0,"p":"營業員帶看時出包害了客戶，受害人可以同時向營業員和經紀業求償（連帶責任）。但要從營業保證金裡拿到「代為賠償」，不是喊一聲就給，得先走完前置程序。","m":"執行名義、仲裁成立、決議支付，三擇一才代賠。","t":"三個前置要件是<b>三擇一</b>（取得執行名義、經仲裁成立、或基金管理委員會決議支付），不是全部都要具備。代賠有上限：以「<b>該經紀業</b>繳存營業保證金<b>及提供擔保</b>總額」為限，不是整個保證基金。代賠後依§8Ⅳ要通知該經紀業限期補繳，1 個月內補足。"},{"term":"報酬限制（§19）","blank":"經紀業___不得收取___或其他報酬；其___，並應依實際成交價金或租金按中央主管機關報酬標準計收。違反者已收取之差價或其他報酬，應加計___後___返還支付人。","answer":"經紀業<span class=\"key\">或經紀人員</span>不得收取<span class=\"key\">差價</span>或其他報酬；其<span class=\"key\">經營仲介業務者</span>，並應依實際成交價金或租金按中央主管機關報酬標準計收。違反者已收取之差價或其他報酬，應加計<span class=\"key\">利息</span>後<span class=\"key\">加倍</span>返還支付人。","src":"條例§19（申論107年二）","essay":1,"hot":1,"p":"仲介只能收報酬（服務費），不能賺中間價差。而且報酬要按「實際成交價金或租金」依中央主管機關公告的報酬標準計收，不能自己隨便訂一個比例來收。","m":"差價不准收，收了加計利息加倍還。","t":"返還的方式是「<b>加計利息後加倍返還</b>」給支付人，不是單純返還、也不是三倍。另外「依報酬標準計收」只限<b>經營仲介業務者</b>，代銷不在此列（細則§21Ⅲ也規定報酬標準揭示於代銷經紀業不適用）。效果雙軌：經紀業依§29Ⅰ①罰 6 萬～30 萬，經紀人員依§31Ⅰ②處 6 個月以上 3 年以下停止執行業務。"},{"term":"經紀業罰鍰級距（§29）","blank":"違反第11條（經紀人配置）、17條（僱用）、19Ⅰ（收差價）、21條（廣告）、22Ⅰ（簽章）等，處___；第12（經紀人到職備查）、18（揭示證照）、20（揭示報酬標準）、27（接受檢查）條，先限期改正而未改正，處___；租賃案件未依限申報登錄，處___。","answer":"違反第11條（經紀人配置）、17條（僱用）、19Ⅰ（收差價）、21條（廣告）、22Ⅰ（簽章）等，處<span class=\"key\">6萬以上30萬以下</span>；第12（經紀人到職備查）、18（揭示證照）、20（揭示報酬標準）、27（接受檢查）條，先限期改正而未改正，處<span class=\"key\">3萬以上15萬以下</span>；租賃案件未依限申報登錄，處<span class=\"key\">1萬以上5萬以下</span>。","src":"條例§29","essay":0,"hot":1,"p":"罰錢分成三種處理模式：有些直接開罰，有些要先叫你限期改正、不改才罰，還有租賃實價登錄遲報自成一格。答題先判斷「要不要先限期改正」，再去挑金額。","m":"六萬三十直接罰、三萬十五先改正、租賃一萬到五萬。","t":"分水嶺在§29Ⅰ④：違反§12、§18、§20、§27 要<b>先令限期改正、屆期未改正</b>才罰 3 萬～15 萬；§29Ⅰ①（§7Ⅵ、§11、§17、§19Ⅰ、§21、§22Ⅰ）則是<b>直接</b>罰 6 萬～30 萬。租賃遲報只有 1 萬～5 萬，別拿預售屋的 3 萬～15 萬去套。"},{"term":"經紀人員懲戒（§31）","blank":"違反兼業、簽章、解說、保密義務者，處___；違反收取差價者，處___停止執行業務；申誡累計___次另予停止執行業務；停止執行業務累計達___以上廢止證書。","answer":"違反兼業、簽章、解說、保密義務者，處<span class=\"key\">申誡</span>；違反收取差價者，處<span class=\"key\">6個月以上3年以下</span>停止執行業務；申誡累計<span class=\"key\">3</span>次另予停止執行業務；停止執行業務累計達<span class=\"key\">5年</span>以上廢止證書。","src":"條例§31","essay":0,"hot":1,"p":"這條是罰「人」不是罰「公司」。輕的叫申誡，重的叫停止執行業務，最重是廢止證書。踩到收差價會直接跳到停業處分，中間沒有申誡那一層。","m":"申誡三次換停業，停業累計五年廢證書。","t":"§31Ⅰ①申誡的四種情形是違反§16（專任）、§22Ⅰ（簽章）、§23（解說）、§25（保密）；§31Ⅰ②收差價是「<b>6 個月以上 3 年以下</b>」停止執行業務。申誡滿 3 次是「<b>另予</b>」6 個月以上 3 年以下停止執行業務；停止執行業務「<b>累計達 5 年以上</b>」才廢止證書，不是 3 年。"},{"term":"非經紀業違法經營（§32）","blank":"非經紀業而經營仲介或代銷業務者，主管機關先___並處___罰鍰；禁止後仍繼續營業，才處___有期徒刑、拘役，得科或併科罰金。","answer":"非經紀業而經營仲介或代銷業務者，主管機關先<span class=\"key\">禁止其營業</span>並處<span class=\"key\">10萬以上30萬以下</span>罰鍰；禁止後仍繼續營業，才處<span class=\"key\">1年以下</span>有期徒刑、拘役，得科或併科罰金。","src":"條例§32","essay":0,"hot":0,"p":"沒有牌照卻在做仲介或代銷，第一步不是抓去關，而是主管機關先禁止營業並開罰鍰；被禁了還照常開門做生意，才會動到刑責這一層。","m":"先禁止、再罰錢、還不停才判刑。","t":"順序必考：先「<b>禁止營業＋處 10 萬以上 30 萬以下罰鍰</b>」，禁止後<b>仍繼續營業</b>才處 1 年以下有期徒刑、拘役，或科或併科罰金，所以「非經紀業經營仲介業務即處有期徒刑」是錯的。處罰對象是公司負責人、商號負責人<b>或行為人</b>，不是只罰公司。"},{"term":"保證金不足（§29）","blank":"保證金不足未補足者，處___至補足為止；停業達___應廢止許可。","answer":"保證金不足未補足者，處<span class=\"key\">停止營業</span>至補足為止；停業達<span class=\"key\">1年</span>應廢止許可。","src":"條例§29Ⅰ⑦","essay":0,"hot":0,"p":"營業保證金被動支或繳得不夠，全國聯合會會通知你補。不補的話不是罰錢，而是直接停止營業，停到補足為止；停滿整整 1 年還沒補，許可就被廢止。","m":"不補就停業，停滿一年廢許可。","t":"這一款的法律效果是「<b>停止營業處分</b>」，不是罰鍰，和§29其他各款的金錢罰完全不同類型，考題常硬塞一個金額進選項。「1 年」是指<b>停止營業期間達一年</b>才廢止許可；「1 個月」是§8Ⅳ全國聯合會通知補足的期限，兩個數字不要互換。"}]},{"id":"B","label":"B 施行細則","stat":"併入A篇統計（138題）","cards":[{"term":"申請許可補正","blank":"受理經紀業許可申請，不合規定者通知___內補正，屆期未補正___。","answer":"受理經紀業許可申請，不合規定者通知<span class=\"key\">15日</span>內補正，屆期未補正<span class=\"key\">駁回</span>。","src":"施行細則§3","essay":0,"hot":0,"p":"送件申請經營許可，如果文件不齊或不合規定，主管機關不會直接退件，會先通知你 15 天內補正；15 天過了還沒補，才駁回申請。","m":"不合規定補正十五日，屆期駁回。","t":"15 日是細則裡的<b>通用補正期間</b>：許可申請（§3）、請領經紀人證書（§15Ⅱ）、換發證書（§17Ⅱ）都是 15 日補正、屆期未補正駁回。別跟「開始營業後 15 日內申請備查」（§5）搞混——那是<b>主動申報</b>的期限；也別跟各種「30 日內備查」互換。"},{"term":"變更與分設備查","blank":"經紀業名稱、所在地、組織型態等變更，應於變更之日起___內申請備查；遷出管轄區域應於遷出後___內申請遷入備查；分設營業處所設立後___內申請備查。","answer":"經紀業名稱、所在地、組織型態等變更，應於變更之日起<span class=\"key\">30日</span>內申請備查；遷出管轄區域應於遷出後<span class=\"key\">30日</span>內申請遷入備查；分設營業處所設立後<span class=\"key\">30日</span>內申請備查。","src":"施行細則§6、§7、§8","essay":0,"hot":0,"p":"公司改名、搬家、改組織型態、換負責人或董監事，或是新開一家門市，都要在 30 天內向主管機關報備。整家搬到別的縣市去，是向「要搬進去的那個縣市」辦遷入備查。","m":"變更、遷入、分設，一律三十日。","t":"跨縣市遷移時，受理機關是「<b>遷入地</b>」主管機關，不是原來的遷出地，這點最常被改錯。三者起算點不同但天數都是 30 日：「<b>變更之日</b>起」「<b>遷出後</b>」「<b>設立後</b>」。分設處所<b>裁撤</b>也是 30 日內備查（細則§10）；全章唯一的 15 日是細則§5 開始營業後備查。"},{"term":"簿冊保存","blank":"經紀業管理登記簿、經紀人名簿、經紀營業員名簿、經紀業專冊等簿冊，應___保存。","answer":"經紀業管理登記簿、經紀人名簿、經紀營業員名簿、經紀業專冊等簿冊，應<span class=\"key\">永久</span>保存。","src":"施行細則§14","essay":0,"hot":0,"p":"縣市政府手上管仲介業的那幾本帳——經紀業管理登記簿、經紀人名簿、營業員名簿等——要永久保存，不能放幾年就銷毀，這樣才查得到歷史紀錄。","m":"主管機關五簿冊，永久保存不銷毀。","t":"設置並永久保存的主體是「<b>直轄市或縣（市）主管機關</b>」，不是經紀業，題目寫「經紀業應永久保存」就錯。共<b>五種</b>，最常被漏掉的是「<b>外縣市</b>經紀業在其所轄區域內設立之<b>營業處所</b>管理登記簿」。別拿公寓大廈管理服務人訓練資料「至少保存 5 年」來套。"},{"term":"經紀人換證時程","blank":"經紀人辦理換發證書，應於證書有效期限屆滿前___內申請；換發後有效期限自原證書屆滿___起算___年。","answer":"經紀人辦理換發證書，應於證書有效期限屆滿前<span class=\"key\">6個月</span>內申請；換發後有效期限自原證書屆滿<span class=\"key\">次日</span>起算<span class=\"key\">4</span>年。","src":"施行細則§17","essay":0,"hot":0,"p":"經紀人證書 4 年到期，要在到期前 6 個月這段期間內去換；新證的 4 年不是從換發當天起算，而是接著舊證到期的隔天往後算，所以早換不會吃虧。","m":"屆滿前六個月換，次日起算四年。","t":"「<b>屆滿前</b> 6 個月內」是倒數期間，不是屆滿「後」6 個月內補辦。新效期自「原證書有效期限屆滿之<b>次日</b>」起算 4 年，不是自換發之日起算。換證要附完成專業訓練 30 小時以上證明；若沒換而被註銷、事後重新申請，要附「<b>最近 4 年內</b>」完訓 30 小時的證明（細則§19）。"},{"term":"營業保證金退還","blank":"公司解散、商號歇業等，得自核准註銷滿___後___內請求退還營業保證金，孳息___退還。","answer":"公司解散、商號歇業等，得自核准註銷滿<span class=\"key\">1年</span>後<span class=\"key\">2年</span>內請求退還營業保證金，孳息<span class=\"key\">不</span>退還。","src":"條例§9Ⅱ、細則§13之1（申論100年一）","essay":1,"hot":0,"p":"公司解散、商號歇業，或營業項目變更後已經不做仲介代銷了，繳的營業保證金可以要回來。但不能馬上領，要等核准註銷營業滿 1 年之後、2 年內提出請求，而且利息不退給你。","m":"註銷滿一年、兩年內請求，孳息不退。","t":"這是「<b>滿 1 年後、2 年內</b>」的一段區間，兩個數字缺一不可，起算點是「<b>核准註銷營業之日</b>」，不是解散之日。可退還的只有細則§13-1 列的<b>三種</b>情形（解散、歇業、營業項目變更後已無仲介代銷而組織仍存續），單純停業不在內。孳息依條例§9Ⅱ但書<b>不退還</b>。"},{"term":"業務紀錄查閱","blank":"經紀業執行業務應記錄辦理情形，主管機關得___或___業務紀錄及文件，經紀業不得規避、妨礙或拒絕。","answer":"經紀業執行業務應記錄辦理情形，主管機關得<span class=\"key\">查詢</span>或<span class=\"key\">取閱</span>業務紀錄及文件，經紀業不得規避、妨礙或拒絕。","src":"施行細則§25","essay":0,"hot":0,"p":"仲介每承辦一案都要留下辦理情形的紀錄；主管機關要查詢、取閱這些紀錄和文件，或要求提出說明時，業者得配合，不能擋門、不能拖、不能說不給看。","m":"留紀錄、准查閱，不得規避妨礙拒絕。","t":"「<b>規避、妨礙或拒絕</b>」三個動詞是固定一組，少一個就不完整。要分清兩條不同的拒絕查核：違反<b>條例</b>§27（主管機關檢查業務）依條例§29Ⅰ④要<b>先限期改正、屆期未改正</b>才罰 3 萬～15 萬；違反<b>條例</b>§24-1Ⅵ（拒絕查核申報登錄資訊）依條例§29Ⅰ③是<b>直接</b>罰 3 萬～15 萬。"}]},{"id":"C","label":"C 不動產說明書","stat":"C篇歷屆 12 題（2.3%）｜115年新修正必讀","cards":[{"term":"不得記載事項","blank":"不動產說明書不得記載：本說明書內容___；___說明書；「___面積」「___面積」「___面積」等名詞；房價有___空間。","answer":"不動產說明書不得記載：本說明書內容<span class=\"key\">僅供參考</span>；<span class=\"key\">繳回</span>說明書；「<span class=\"key\">受益</span>面積」「<span class=\"key\">銷售</span>面積」「<span class=\"key\">使用</span>面積」等名詞；房價有<span class=\"key\">上漲</span>空間。","src":"說明書不得記載事項","essay":0,"hot":0,"p":"說明書上「不能寫」的四句話。建商或仲介想用這些話替自己留退路、或用模糊的面積名詞灌水，公告就直接禁止。考題最愛把這四句丟進選項裡問你哪一句不能寫。","m":"僅供參考、要你繳回、三種假面積、房價會漲","t":"最常見的陷阱是把<b>預售屋契約</b>的不得記載事項（例如「附屬建物除陽臺外其餘不得計價」「不得拋棄審閱期」）搬過來問，說它是說明書的——<b>真條文放錯公告</b>就是這類題的標準誘答。另外「受益面積、銷售面積、使用面積」三個名詞要一起背，少一個就會被挑掉。"},{"term":"現況確認書≠說明書","blank":"建物現況確認書是成屋買賣契約附件___，由___自行填寫；不得用來___不動產說明書之內容（115年版不得記載事項第5點）。","answer":"建物現況確認書是成屋買賣契約附件<span class=\"key\">一</span>，由<span class=\"key\">賣方</span>自行填寫；不得用來<span class=\"key\">替代</span>不動產說明書之內容（115年版不得記載事項第5點）。","src":"成屋買賣契約附件一；說明書不得記載事項第5點（115年版）","essay":0,"hot":1,"p":"成屋買賣時賣方要自己填一張「建物現況確認書」（漏水、輻射、凶宅、違建那些），它是買賣契約的附件一，不是不動產說明書。兩張表常被考題混在一起。","m":"現況確認書賣方填、說明書經紀業做","t":"陷阱有兩層：①<b>誰填</b>——現況確認書是<b>賣方</b>自行填寫，說明書是經紀業製作、經紀人員解說、經紀人簽章；②<b>能不能互相取代</b>——115 年版不得記載事項第 5 點明文禁止以現況確認書替代說明書內容。選項寫「已填現況確認書即可免附說明書」一定錯。"},{"term":"115年修正三處","blank":"115.1.13令（115.4.1生效）修正說明書：成屋增列建築___情形，成屋與預售屋增列___發電設備設置情形，預售屋「建物瑕疵擔保」報告___調整。","answer":"115.1.13令（115.4.1生效）修正說明書：成屋增列建築<span class=\"key\">能效</span>情形，成屋與預售屋增列<span class=\"key\">太陽光電</span>發電設備設置情形，預售屋「建物瑕疵擔保」報告<span class=\"key\">用字</span>調整。","src":"說明書應記載事項（115.4.1生效）","essay":0,"hot":1,"p":"說明書公告在 115.1.13 發布、115.4.1 生效，動了三個地方：成屋多了建築能效、成屋與預售屋都多了太陽光電設備、預售屋的瑕疵擔保用字調整。當年度新修正是出題熱點。","m":"成屋加能效、兩者加光電、預售改用字","t":"①<b>建築能效只加在成屋</b>，不要寫成預售屋也有；②太陽光電是<b>成屋與預售屋都有</b>；③生效日是 <b>115.4.1</b>，不是發布日 115.1.13——考「自何時施行」會拿發布日當誘答。土地（素地）說明書這次沒動。"},{"term":"水災紀錄適用範圍","blank":"最近___年內基地周邊半徑___公尺有無申請水災淹水救助紀錄，是___屋說明書「其他重要事項」的項目（104年版即有，不是115年新增；成屋、土地沒有）。","answer":"最近<span class=\"key\">5</span>年內基地周邊半徑<span class=\"key\">300</span>公尺有無申請水災淹水救助紀錄，是<span class=\"key\">預售</span>屋說明書「其他重要事項」的項目（104年版即有，不是115年新增；成屋、土地沒有）。","src":"說明書應記載事項預售屋（四）3；考古題104-40、105-8","essay":0,"hot":1,"p":"「最近 5 年內基地周邊半徑 300 公尺有沒有申請過水災淹水救助」這一項，只有預售屋說明書要寫，成屋和土地都沒有。","m":"五年、三百公尺、只有預售屋","t":"兩個常見錯法：①以為是 115 年新增——<b>104 年版就有了</b>；②以為成屋也要寫——只有預售屋的「其他重要事項」有這一項。數字也容易被換掉：是 <b>5 年／300 公尺</b>，不是 3 年或 500 公尺。"},{"term":"氯離子用語修正","blank":"預售屋交屋時有無檢附混凝土___含量檢測報告，及施工中建築物出具無___性污染證明（預售屋第3點(一)10，115年用字調整；舊為「新拌混凝土…報告單」＋「無輻射污染證明」）。","answer":"預售屋交屋時有無檢附混凝土<span class=\"key\">氯離子</span>含量檢測報告，及施工中建築物出具無<span class=\"key\">放射</span>性污染證明（預售屋第3點(一)10，115年用字調整；舊為「新拌混凝土…報告單」＋「無輻射污染證明」）。","src":"說明書應記載事項預售屋（一）10（115.1.13令）","essay":0,"hot":0,"p":"預售屋交屋時要附兩份證明：混凝土氯離子含量檢測報告（防海砂屋）、無放射性污染證明（防輻射屋）。115 年只把用字改精確，項目本身沒變。","m":"氯離子防海砂、無放射性防輻射","t":"舊講義寫的是「新拌混凝土…氯離子含量檢測報告單」與「<b>無輻射</b>污染證明」，115 年改為「混凝土氯離子含量檢測報告」與「<b>無放射性</b>污染證明」。考用字就看有沒有「放射性」三個字。另外這是<b>預售屋</b>的項目，成屋是走現況確認書。"},{"term":"土地使用管制內容","blank":"土地（素地）說明書「使用管制內容」須載明使用___／編定、___率、___率、開發方式限制，及山坡地、水保區等特殊管制。","answer":"土地（素地）說明書「使用管制內容」須載明使用<span class=\"key\">分區</span>／編定、<span class=\"key\">建蔽</span>率、<span class=\"key\">容積</span>率、開發方式限制，及山坡地、水保區等特殊管制。","src":"說明書（申論105年二）","essay":1,"hot":0,"p":"賣素地（沒有房子的土地）時，說明書要講清楚這塊地能蓋什麼、能蓋多大。使用分區／編定決定用途，建蔽率容積率決定量體，山坡地、水保區另有限制。","m":"分區編定管用途、建蔽容積管量體","t":"<b>建蔽率</b>是建築面積（水平投影）占基地面積的比率，<b>容積率</b>是總樓地板面積占基地面積的比率，兩個定義互換是最常見的錯。另外這是<b>土地（素地）</b>說明書的項目，成屋、預售屋說明書另有自己的項目表。申論 105 年第二題考過。"},{"term":"建物型態分類","blank":"建物型態分：___建物（獨棟、連棟、雙併，無共有部分）、___建物（公寓、華廈、大樓等）、其他特殊建物（工廠、農舍、倉庫）。","answer":"建物型態分：<span class=\"key\">一般</span>建物（獨棟、連棟、雙併，無共有部分）、<span class=\"key\">區分所有</span>建物（公寓、華廈、大樓等）、其他特殊建物（工廠、農舍、倉庫）。","src":"說明書應記載事項","essay":0,"hot":0,"p":"說明書要勾建物屬於哪一種型態。分三大類：沒有共有部分的一般建物（獨棟、連棟、雙併）、有共有部分的區分所有建物（公寓、華廈、大樓）、以及工廠農舍倉庫這些其他特殊建物。","m":"一般無共有、區分有共有、其他特殊","t":"分類的判準是<b>有沒有共有部分</b>，不是樓層高低。華廈與大樓的差別在樓層，但<b>兩者都屬區分所有建物</b>——考題若說「公寓與大樓分屬不同類」就是錯的。"}]},{"id":"D","label":"D 三大定型化契約","stat":"D篇歷屆 15 題（2.9%）｜數字比較必背","cards":[{"term":"預售屋契約違規：優先適用哪一法（114-7）","blank":"銷售預售屋者使用之契約不符合中央主管機關公告之預售屋買賣定型化契約應記載及不得記載事項，直轄市、縣（市）主管機關應依___規定處罰，___；其已簽約者，按每份契約所載___處罰。（消保法§56-1 本身即寫「除___外」，故特別法優先）","answer":"銷售預售屋者使用之契約不符合中央主管機關公告之預售屋買賣定型化契約應記載及不得記載事項，直轄市、縣（市）主管機關應依<span class=\"key\">平均地權條例第81條之2第5項</span>規定處罰，<span class=\"key\">按戶（棟）處新臺幣6萬元以上30萬元以下罰鍰</span>；其已簽約者，按每份契約所載<span class=\"key\">戶（棟）數</span>處罰。（消保法§56-1 本身即寫「除<span class=\"key\">法律另有處罰規定</span>外」，故特別法優先）","src":"平均地權條例§81-2Ⅴ（罰則）、§47-3；申報登錄備查辦法§7Ⅵ（考古題114-7）","essay":0,"hot":1,"p":"建商用的預售屋契約如果不照公告格式寫，要罰。這題真正在考的是「消保法和平均地權條例都有罰則，先用哪一個」——答案是平均地權條例，因為消保法 §56-1 自己就寫了「除法律另有處罰規定外」。","m":"消保法讓位，按戶六萬到三十萬","t":"①金額是<b>按戶（棟）</b>6 萬～30 萬，不是整案罰一次；已簽約者按<b>每份契約所載戶（棟）數</b>處罰。②罰的機關是<b>直轄市、縣（市）</b>主管機關。③不要選消保法 §56-1——那一條自己讓位給特別法，這就是 114-7 的考點。"},{"term":"預售屋銷售前備查與申報登錄（平均§47-3）","blank":"銷售預售屋者，應於___將坐落基地、建案名稱、銷售地點、期間、戶（棟）數及預售屋買賣定型化契約，書面報請基地所在之直轄市、縣（市）主管機關___；並應於簽訂或解除買賣契約書之日起___內申報登錄資訊。備查內容於變更時，應於變更之日起___內報請變更備查。","answer":"銷售預售屋者，應於<span class=\"key\">銷售前</span>將坐落基地、建案名稱、銷售地點、期間、戶（棟）數及預售屋買賣定型化契約，書面報請基地所在之直轄市、縣（市）主管機關<span class=\"key\">備查</span>；並應於簽訂或解除買賣契約書之日起<span class=\"key\">30日</span>內申報登錄資訊。備查內容於變更時，應於變更之日起<span class=\"key\">15日</span>內報請變更備查。","src":"平均地權條例§47-3Ⅰ、Ⅱ；申報登錄備查辦法§7Ⅴ","essay":0,"hot":1,"p":"建商賣預售屋前，要先把建案資料和契約書送地方政府備查；成交或解約後 30 天內要申報登錄實價。備查內容有變更，15 天內報變更備查。","m":"銷售前備查、三十日申報、十五日報變更","t":"三個時間最容易互換：<b>備查是「銷售前」</b>（沒有日數）、<b>申報登錄 30 日</b>（自簽訂或解除契約書之日起）、<b>變更備查 15 日</b>（自變更之日起）。另外備查要送<b>基地所在</b>的直轄市、縣（市）主管機關，不是公司登記所在地。"},{"term":"紅單管制（平均§47-3Ⅴ、Ⅵ）","blank":"銷售預售屋或新建成屋者向買受人收受定金或類似名目之金額，應以___確立買賣標的物及價金等事項，並不得約定保留出售、保留簽訂買賣契約之權利或其他不利於買受人之事項；該書面契據，買受人___轉售與第三人。","answer":"銷售預售屋或新建成屋者向買受人收受定金或類似名目之金額，應以<span class=\"key\">書面契據</span>確立買賣標的物及價金等事項，並不得約定保留出售、保留簽訂買賣契約之權利或其他不利於買受人之事項；該書面契據，買受人<span class=\"key\">不得</span>轉售與第三人。","src":"平均地權條例§47-3Ⅴ、Ⅵ","essay":0,"hot":0,"p":"就是俗稱的「紅單」。建商收定金時要給一張書面契據，上面要寫清楚買什麼、多少錢；不能寫「本公司保留出售權」這類對買方不利的條款；而且這張紅單買方不能轉賣給別人，這是打炒房修法的核心。","m":"紅單要載明、不得保留權、不得轉售","t":"①禁止的是<b>買受人轉售</b>，不是禁止建商收定金。②「保留出售、保留簽訂買賣契約之權利」是明文禁止的約定，選項寫「賣方得保留是否出售之權利」就是錯。③適用範圍包含<b>新建成屋</b>，不是只有預售屋。"},{"term":"契約審閱期","blank":"成屋、預售屋買賣契約審閱期至少___日；委託銷售契約及要約書審閱期不得少於___日。","answer":"成屋、預售屋買賣契約審閱期至少<span class=\"key\">5</span>日；委託銷售契約及要約書審閱期不得少於<span class=\"key\">3</span>日。","src":"三契約應記載事項","essay":0,"hot":1,"p":"定型化契約要讓消費者帶回去看幾天再簽。買賣（成屋、預售屋）至少 5 天，委託銷售契約與要約書不得少於 3 天。","m":"買賣五天、委售三天","t":"①5 天與 3 天互換是最常見的錯。②<b>說明書沒有審閱期</b>（它不是定型化契約）。③消保法 §11-1 母法寫的是「<b>30 日以內</b>之合理期間」，實際天數由各公告定——不要把 30 日當成審閱期本身。④「不得約定拋棄審閱期間」屬於<b>契約</b>的不得記載事項，不是說明書的。"},{"term":"利息上限","blank":"成屋、預售屋買賣契約不得記載超過民法第___條週年利率___之利息。","answer":"成屋、預售屋買賣契約不得記載超過民法第<span class=\"key\">205</span>條週年利率<span class=\"key\">16%</span>之利息。","src":"買賣契約不得記載事項；民法§205","essay":0,"hot":0,"p":"契約裡約定的利息不能超過年息 16%，這是民法 §205 的上限。","m":"民法二零五、年息一成六","t":"民法 §205 在 110 年修正後，超過部分的效果是<b>約定無效</b>（舊法是債權人「無請求權」）——寫「無請求權」是舊法，會被扣分。另外 §205 是<b>約定利率上限</b>，不要跟 §203 的<b>法定利率 5%</b> 搞混。"},{"term":"成屋買賣違約金","blank":"成屋：賣方違約，退還已付價款加每日萬分之___單利，並支付同額違約金，但以不超過房地總價款___為限；買方違約沒收亦以不超過___為限。","answer":"成屋：賣方違約，退還已付價款加每日萬分之<span class=\"key\">二</span>單利，並支付同額違約金，但以不超過房地總價款<span class=\"key\">15%</span>為限；買方違約沒收亦以不超過<span class=\"key\">15%</span>為限。","src":"成屋買賣契約","essay":0,"hot":1,"p":"成屋買賣誰違約都以房地總價 15% 為上限。賣方違約要退還已付價款、加每日萬分之二的單利，再賠同額違約金，但合計不超過 15%；買方違約被沒收也是最多 15%。","m":"成屋兩邊都是「不超過」一成五","t":"成屋是<b>上限</b>（不超過 15%），預售屋賣方違約是<b>下限</b>（不得低於 15%），<b>方向相反</b>——這就是下一張卡存在的唯一理由，兩張一定要一起背。另外「每日萬分之二」是<b>單利</b>，不要寫成複利。"},{"term":"預售屋違約金（方向相反）","blank":"預售屋：賣方違約賠償比例不得___房地總價款15%；買方違約沒收最高不得___房地總價款15%（★與成屋方向相反）。","answer":"預售屋：賣方違約賠償比例不得<span class=\"key\">低於</span>房地總價款15%；買方違約沒收最高不得<span class=\"key\">超過</span>房地總價款15%（★與成屋方向相反）。","src":"預售屋買賣契約","essay":0,"hot":1,"p":"預售屋反過來：賣方違約賠的<b>不能少於</b> 15%（怕建商賠太少），買方違約被沒收的<b>不能超過</b> 15%（怕建商沒收太多）。兩邊都是往對買方有利的方向設限。","m":"賣方不得低於、買方不得超過，都是一成五","t":"把預售屋賣方違約寫成「<b>不得超過</b> 15%」是最常見的錯——那是成屋的寫法。記法：公告是消費者保護取向，<b>賣方賠償給下限、買方沒收給上限</b>，兩個方向都站在買方那邊。"},{"term":"履約擔保五選一","blank":"預售屋履約擔保：不動產開發___、價金返還之___、價金___、同業___擔保、公會辦理___保證協定。","answer":"預售屋履約擔保：不動產開發<span class=\"key\">信託</span>、價金返還之<span class=\"key\">保證</span>、價金<span class=\"key\">信託</span>、同業<span class=\"key\">連帶</span>擔保、公會辦理<span class=\"key\">連帶</span>保證協定。","src":"預售屋買賣契約","essay":0,"hot":0,"p":"建商蓋到一半倒了，買方付的錢要有著落。預售屋契約規定建商必須從五種履約擔保方式裡挑一種，並在契約中載明是哪一種。","m":"開發信託、價金返還保證、價金信託、同業連帶、公會協定","t":"五種要能完整背出來，考題常改一個字做誘答：把「價金<b>返還</b>之保證」寫成「價金保管之保證」、把「<b>同業</b>連帶擔保」寫成「金融機構連帶擔保」。另外是<b>五選一</b>，不是五種都要做。"},{"term":"面積誤差找補","blank":"預售屋面積誤差：不足部分賣方___找補；超過部分買方最多找補___；誤差超過___者，買方得解除契約。","answer":"預售屋面積誤差：不足部分賣方<span class=\"key\">全部</span>找補；超過部分買方最多找補<span class=\"key\">2%</span>；誤差超過<span class=\"key\">3%</span>者，買方得解除契約。","src":"預售屋買賣契約","essay":0,"hot":1,"p":"交屋時量出來的坪數跟契約寫的不一樣怎麼辦。少給的建商全額找補，多給的買方最多只補 2%，差距超過 3% 買方可以直接解約。","m":"不足全補、超過補二、超過三可解約","t":"2% 與 3% 互換是最常見的錯。記法：<b>買方要掏錢的上限小（2%）、能走人的門檻大（3%）</b>。另外「不足部分賣方全部找補」<b>沒有上限</b>，不要寫成也是 2%。"},{"term":"預售屋保固","blank":"預售屋保固：結構部分（基礎、樑柱、承重牆等）___年；固定建材及設備（門窗、粉刷、地磚）___年。","answer":"預售屋保固：結構部分（基礎、樑柱、承重牆等）<span class=\"key\">15</span>年；固定建材及設備（門窗、粉刷、地磚）<span class=\"key\">1</span>年。","src":"預售屋買賣契約","essay":0,"hot":1,"p":"交屋後房子出問題，建商要負責修多久。結構體 15 年，門窗、粉刷、地磚這些固定建材及設備 1 年。","m":"結構十五年、設備一年","t":"只有兩個數字，但常被改成「結構 10 年」或「設備 2 年」。結構部分指基礎、樑柱、承重牆、樓梯、屋頂、外牆；固定建材及設備指門窗、粉刷、地磚等。保固期自<b>交屋日</b>起算。"},{"term":"預售屋期限","blank":"預售屋：使用執照核發後___個月內備妥文件申辦移轉登記；領得使用執照___個月內通知交屋；每次付款間隔應在___日以上。","answer":"預售屋：使用執照核發後<span class=\"key\">4</span>個月內備妥文件申辦移轉登記；領得使用執照<span class=\"key\">6</span>個月內通知交屋；每次付款間隔應在<span class=\"key\">20</span>日以上。","src":"預售屋買賣契約","essay":0,"hot":0,"p":"交屋前後三個時間：使用執照核發後 4 個月內辦移轉登記、領得使用執照 6 個月內通知交屋，另外每期付款間隔要 20 天以上（避免建商催款太急）。","m":"使照四月辦登記、六月通知交屋、付款隔二十日","t":"4 個月與 6 個月常被互換，記法：<b>先登記後交屋，所以 4 在前、6 在後</b>。兩個都從「使用執照核發／領得」起算，不是從完工起算。「每次付款間隔 20 日以上」是保護買方的條款，不要讀成「20 日內應付款」。"},{"term":"委託銷售：受託人義務","blank":"受託人簽約前應據實提供近___個月成交行情；買方簽立要約書，應於___小時內轉交委託人；收受定金後___小時內送交委託人。","answer":"受託人簽約前應據實提供近<span class=\"key\">3</span>個月成交行情；買方簽立要約書，應於<span class=\"key\">24</span>小時內轉交委託人；收受定金後<span class=\"key\">24</span>小時內送交委託人。","src":"委託銷售契約","essay":0,"hot":0,"p":"屋主委託仲介賣房，仲介有三件事要照時間做：簽約前要據實提供近三個月成交行情；買方寫了要約書，24 小時內轉交屋主；收了定金也是 24 小時內送交屋主。","m":"行情三個月、要約二十四、定金二十四","t":"兩個 <b>24 小時</b>都容易被改成 48 小時或 3 日。成交行情是「近 <b>3 個月</b>」，不是 6 個月。這三項都是<b>受託人（仲介）</b>的義務，不要寫成委託人的義務。"},{"term":"禁止事先收費","blank":"委託銷售契約之附件「要約書」不得約定於契約成立前，受託人得向消費者收取___、___或其他任何名目之費用。","answer":"委託銷售契約不得約定於契約成立前，受託人得向消費者收取<span class=\"key\">斡旋金</span>、<span class=\"key\">訂金</span>或其他任何名目之費用。","src":"委託銷售契約附件「要約書」不得記載事項（內政部92.6.26公告）","essay":0,"hot":1,"p":"仲介不能在契約成立前先向消費者收錢——斡旋金、訂金，什麼名目都不行。這是要約書制度的核心：讓消費者可以不付錢就出價。","m":"契約成立前，任何名目都不能收","t":"常見誘答是「可以收斡旋金，只要立據並載明用途」——不行，公告寫的是<b>不得收取斡旋金、訂金或其他任何名目之費用</b>，「其他任何名目」這五個字就是為了堵這種改寫。注意這條是在<b>委託銷售契約附件「要約書」</b>的不得記載事項裡（內政部 92.6.26 公告）。"},{"term":"沒收定金分配","blank":"買方違約致定金被沒收，受託人分得之比例不得逾沒收定金之___，且不得逾約定___，並不得再收取服務報酬。","answer":"買方違約致定金被沒收，受託人分得之比例不得逾沒收定金之<span class=\"key\">50%</span>，且不得逾約定<span class=\"key\">服務報酬</span>，並不得再收取服務報酬。","src":"委託銷售契約","essay":0,"hot":0,"p":"買方違約、定金被沒收，仲介可以分多少。最多分一半，而且不能超過原本講好的服務報酬，分了之後也不能再另外收服務費。","m":"最多一半、不逾報酬、不得再收","t":"三個限制要一起記，只寫「50%」會漏分。50% 是<b>上限</b>，同時還要受「<b>不得逾約定服務報酬</b>」這第二道限制，<b>兩個取低者</b>。第三句「並不得再收取服務報酬」最常被漏掉。"},{"term":"要約書規範","blank":"要約書：買方於要約期限內有撤回權，但賣方已___並送達買方者除外；賣方變更要約內容而承諾，視為___原要約而為___。","answer":"要約書：買方於要約期限內有撤回權，但賣方已<span class=\"key\">承諾</span>並送達買方者除外；賣方變更要約內容而承諾，視為<span class=\"key\">拒絕</span>原要約而為<span class=\"key\">新要約</span>。","src":"要約書定型化契約","essay":0,"hot":0,"p":"買方用要約書出價後反悔，可不可以撤回？可以，但如果賣方已經承諾、而且通知送達買方了就不行——契約已經成立。另外賣方如果改了價格或條件才答應，那不算承諾，法律上視為拒絕原要約、另提新要約。","m":"送達前可撤回、變更內容即新要約","t":"①撤回權的界線是「賣方承諾<b>並送達買方</b>」，不是賣方口頭答應就算。②賣方變更內容而承諾＝民法 §160Ⅱ 的<b>新要約</b>，主客易位，換成買方有要不要承諾的選擇權。③要約書的審閱期是 <b>3 日</b>（與委託銷售契約同），不是 5 日。"},{"term":"成屋稅費負擔","blank":"成屋買賣：土地增值稅由___負擔；契稅、印花稅、登記規費、保險費由___負擔。","answer":"成屋買賣：土地增值稅由<span class=\"key\">賣方</span>負擔；契稅、印花稅、登記規費、保險費由<span class=\"key\">買方</span>負擔。","src":"成屋買賣契約","essay":0,"hot":0,"p":"成屋買賣的稅費誰付：土地增值稅由賣方負擔（他賺到土地漲價），契稅、印花稅、登記規費、保險費由買方負擔。","m":"土增賣方出、契印登保買方出","t":"最常被調包的就是<b>土地增值稅與契稅</b>。記法：「<b>土</b>」增值稅跟著賣方的漲價走，「<b>契</b>」稅跟著買方取得所有權走。另外地價稅、房屋稅是以<b>交屋日</b>為界按日計算分擔，不是全歸任何一方。"}]},{"id":"E","label":"E 公寓大廈管理條例","stat":"E篇歷屆 124 題（23.8%）","cards":[{"term":"住戶定義（§3）","blank":"住戶指___、承租人，或經區分所有權人同意而為專有部分使用者，或業經取得___所有權者。","answer":"住戶指<span class=\"key\">區分所有權人</span>、承租人，或經區分所有權人同意而為專有部分使用者，或業經取得<span class=\"key\">停車空間建築物</span>所有權者。","src":"條例§3","essay":0,"hot":0,"p":"社區裡誰要守規約、誰會被管委會管？不是只有屋主。租客、屋主同意而使用專有部分的人，甚至只取得停車空間建築物所有權的人，法律上都叫「住戶」。","m":"「屋主、房客、經同意使用、車位所有權」四種都是住戶","t":"最常被混用的是<b>住戶</b>與<b>區分所有權人</b>：住戶範圍較大，含承租人與經同意使用人；但訴請強制出讓、拍賣只能對具區分所有權人身分者，單純房客只能訴請遷離。另外是「業經取得停車空間<b>建築物所有權</b>」才算，租車位不算。"},{"term":"管理負責人（§3）","blank":"未成立管理委員會時，由___推選___一人擔任___（或依§28Ⅲ、§29Ⅵ規定產生）。","answer":"未成立管理委員會時，由<span class=\"key\">區分所有權人</span>推選<span class=\"key\">住戶</span>一人擔任<span class=\"key\">管理負責人</span>（或依§28Ⅲ、§29Ⅵ規定產生）。","src":"條例§3","essay":0,"hot":0,"p":"社區還沒成立管委會時，總要有一個人對外代表、對內負責管理事務，這個人就是管理負責人，原則由區分所有權人推選住戶一人擔任。","m":"「沒管委會推一人；起造人先當，主管機關可指定」","t":"管理負責人只存在於<b>未成立管委會</b>時；成立管委會後對外代表是主任委員。產生方式有三：區權人推選住戶一人、§28Ⅲ起造人於成立前先為管理負責人、§29Ⅵ主管機關指定住戶一人。被推選者是「住戶」即可，<b>不以區分所有權人為限</b>。"},{"term":"專有部分不得分離移轉（§4）","blank":"專有部分不得與其所屬建築物___之應有部分，及其基地___或___之應有部分，分離而為___或___。","answer":"專有部分不得與其所屬建築物<span class=\"key\">共用部分</span>之應有部分，及其基地<span class=\"key\">所有權</span>或<span class=\"key\">地上權</span>之應有部分，分離而為<span class=\"key\">移轉</span>或<span class=\"key\">設定負擔</span>。","src":"條例§4","essay":0,"hot":0,"p":"你買的房子，主建物不能單獨賣掉，一定要連同公設持分和基地持分一起移轉；想把土地持分留著、只賣房子是辦不到的。","m":"「專有、共有、基地，三者綁一起」","t":"條文是「不得分離而為<b>移轉或設定負擔</b>」，少了「設定負擔」就不完整——單獨拿專有部分去抵押同樣不行。又基地權利包含「所有權<b>或地上權</b>」之應有部分，選項若限縮成只有所有權即為錯。"},{"term":"不得約定專用部分（§7）","blank":"不得約定專用（§7 五款）：①本身所占之___；②連通數個專有部分之走廊或樓梯，及其通往室外之通路或___；社區內各巷道、___；③基礎、主要樑柱、承重牆壁、樓地板及___之構造；④約定專用有違___使用限制者；⑤其他有固定使用方法，並屬區分所有權人生活利用上___之共用部分。","answer":"不得約定專用（§7 五款）：①本身所占之<span class=\"key\">地面</span>；②連通數個專有部分之走廊或樓梯，及其通往室外之通路或<span class=\"key\">門廳</span>；社區內各巷道、<span class=\"key\">防火巷弄</span>；③基礎、主要樑柱、承重牆壁、樓地板及<span class=\"key\">屋頂</span>之構造；④約定專用有違<span class=\"key\">法令</span>使用限制者；⑤其他有固定使用方法，並屬區分所有權人生活利用上<span class=\"key\">不可或缺</span>之共用部分。","src":"條例§7（申論102年一、106年一）","essay":2,"hot":1,"p":"社區可以把某些共用部分「約定」給特定住戶專用（例如一樓庭院給一樓用），但有些地方涉及全體通行與結構安全，再怎麼開會決議也不能給人專用。","m":"「地面、走廊樓梯、基礎樑柱承重牆、樓地板屋頂，不得專用」","t":"§7 共<b>五款</b>，卡片只列三款。另有「通往室外之通路、門廳、社區巷道、<b>防火巷弄</b>」（第二款後段）、「約定專用違反法令使用限制者」、「有固定使用方法且為生活利用上不可或缺者」。選擇題最愛拿防火巷弄、門廳當選項。又§55Ⅱ但書：本條例施行前已取得建照者得不受§7限制。"},{"term":"外牆變更（§8）","blank":"外牆面、樓頂平臺變更構造或設置廣告物等違規，___應予制止；經制止而不遵從者，應___依§49Ⅰ處理，該住戶並應於___內回復原狀；屆期未回復原狀者，得由管理負責人或管理委員會回復原狀，費用由該住戶負擔。","answer":"外牆面、樓頂平臺變更構造或設置廣告物等違規，<span class=\"key\">管理負責人或管理委員會</span>應予制止；經制止而不遵從者，應<span class=\"key\">報請主管機關</span>依§49Ⅰ處理，該住戶並應於<span class=\"key\">1個月</span>內回復原狀；屆期未回復原狀者，得由管理負責人或管理委員會回復原狀，費用由該住戶負擔。","src":"條例§8","essay":0,"hot":0,"p":"住戶在外牆、樓頂平臺擅自改構造、裝鐵窗或掛廣告，管委會先制止；不聽就報主管機關開罰，並限期自行回復原狀，拖著不處理管委會可代為回復並向他收費。","m":"「先制止、再報罰、一個月回復、逾期代回復」","t":"期限是<b>1個月內</b>回復原狀，別和§57Ⅱ起造人「1個月內再移交」、§22「3個月促請改善」混。罰則走<b>§49Ⅰ（4萬～20萬）</b>，不是§47的3千～1萬5千。另§8Ⅱ是例外：有<b>12歲以下兒童或65歲以上老人</b>之住戶，得設不妨礙逃生且不突出外牆面之防墜設施。"},{"term":"強制遷離與拍賣（§22）","blank":"住戶積欠應分擔之費用，___達區分所有權總價___，促請改善___內未改善者，管委會得依___訴請法院強制遷離；該住戶如為區分所有權人，並得依區權會決議訴請法院命其出讓，判決確定後___內未自行出讓並完成移轉登記者，管委會得聲請法院___。","answer":"住戶積欠應分擔之費用，<span class=\"key\">經強制執行後再度積欠</span>達區分所有權總價<span class=\"key\">1%</span>，促請改善<span class=\"key\">3個月</span>內未改善者，管委會得依<span class=\"key\">區分所有權人會議之決議</span>訴請法院強制遷離；該住戶如為區分所有權人，並得依區權會決議訴請法院命其出讓，判決確定後<span class=\"key\">3個月</span>內未自行出讓並完成移轉登記者，管委會得聲請法院<span class=\"key\">拍賣</span>。","src":"條例§22（申論107年一、112年二）","essay":2,"hot":1,"p":"欠管理費欠很兇的住戶不是馬上能趕走：要先告他付錢、強制執行後又再積欠到一定金額，促請改善三個月仍不改，才能依區權會決議訴請遷離；若他是屋主，還能再訴請出讓、最後聲請拍賣。","m":"「欠達百分之一、促改三個月；判決確定三個月，才聲請拍賣」","t":"兩個「3個月」意思不同：一是促請改善後的3個月，二是判決確定後未自行出讓並完成移轉登記的3個月，常被對調。門檻金額是<b>區分所有權總價1%</b>。又訴請<b>遷離</b>（§22Ⅰ）對全體住戶都可以，<b>出讓、拍賣</b>（§22Ⅱ）只能對區分所有權人；更前階段單純訴請給付是§21（逾二期或達相當金額）。"},{"term":"拍賣受償順序","blank":"強制出讓拍賣所得，除其他法律另有規定外，___，其受償順序與___同（非整筆拍賣所得均優先）；區分所有權總價指建築物評定___加當期土地___之和。","answer":"強制出讓拍賣所得，除其他法律另有規定外，<span class=\"key\">於積欠本條例應分擔之費用</span>，其受償順序與<span class=\"key\">第一順位抵押權</span>同（非整筆拍賣所得均優先）；區分所有權總價指建築物評定<span class=\"key\">標準價格</span>加當期土地<span class=\"key\">公告現值</span>之和。","src":"條例§22Ⅲ、施行細則§6","essay":0,"hot":1,"p":"房子被法院拍掉後，社區欠繳的管理費拿不拿得到錢？就「積欠的應分擔費用」這一部分，受償順序跟第一順位抵押權相同，不是整筆拍賣所得都先給社區。","m":"「只有欠費那筆，比照第一順位抵押權」","t":"常見錯誤選項寫成「拍賣所得全部優先受償」或「<b>優先於</b>第一順位抵押權」——條文是「<b>與</b>第一順位抵押權同」，且有「除其他法律另有規定外」的前提。另「區分所有權總價」依細則§6為<b>促請改善時</b>建築物評定標準價格＋當期土地公告現值之和，不是市價或成交價。"},{"term":"區權會召開（§25、30）","blank":"區權會每年至少召開定期會議___次；開會前___日以書面通知，急迫情事得公告，但不得少於___日。","answer":"區權會每年至少召開定期會議<span class=\"key\">1</span>次；開會前<span class=\"key\">10</span>日以書面通知，急迫情事得公告，但不得少於<span class=\"key\">2</span>日。","src":"條例§25、§30","essay":0,"hot":0,"p":"社區大會每年至少要開一次定期會議；開會前十天要用書面通知每位區分所有權人，除非真的急迫才能改用公告，但公告期間也要有兩天。","m":"「一年一次、十日書面；急迫公告，不得少於二日」","t":"<b>開會前10日</b>是書面通知期間，<b>不得少於2日</b>是急迫時的公告期間，兩個數字最常被對調。也別跟§34會議紀錄「會後15日內送達」、§32Ⅲ主席「決議成立後10日內送達」搞混。另外管理委員之選任事項必須載明於開會通知並公告，<b>不得以臨時動議提出</b>。"},{"term":"臨時會議（§25）","blank":"經區分所有權人___以上及其區分所有權比例合計___以上，___請求召集者，___召開臨時會議。","answer":"經區分所有權人<span class=\"key\">五分之一</span>以上及其區分所有權比例合計<span class=\"key\">五分之一</span>以上，<span class=\"key\">以書面載明召集之目的及理由</span>請求召集者，<span class=\"key\">應</span>召開臨時會議。","src":"條例§25（申論111年二）","essay":1,"hot":0,"p":"不想等年度大會，住戶自己也能要求開臨時會：只要人數和區分所有權比例都達到五分之一，用書面寫清楚召集目的與理由，就必須召開。","m":"「人五分之一、比例五分之一，書面寫明目的理由」","t":"兩個條件是「<b>及</b>」不是「或」——人數與區分所有權比例都要達1/5，少一邊不成立。又§25Ⅱ還有第一款：發生重大事故有及時處理之必要，經管理負責人或管委會請求者亦應召開臨時會。別把這個1/5和§32重新召集的「<b>三人並</b>1/5」混為一談。"},{"term":"一般決議門檻（§31）","blank":"一般決議（___）：區分所有權人___及區分所有權比例___以上出席，以出席人數___及其區分所有權比例占出席___以上之同意行之。","answer":"一般決議（<span class=\"key\">除規約另有規定外</span>）：區分所有權人<span class=\"key\">2/3</span>及區分所有權比例<span class=\"key\">2/3</span>以上出席，以出席人數<span class=\"key\">3/4</span>及其區分所有權比例占出席<span class=\"key\">3/4</span>以上之同意行之。","src":"條例§31（申論113年二）","essay":1,"hot":1,"p":"社區大會要做成決議，先看來了多少人、再看多少人贊成：出席要三分之二，同意要出席的四分之三，而且人數與區分所有權比例兩邊都要同時達標。","m":"「出席三分之二、同意四分之三」","t":"開頭但書「<b>除規約另有規定外</b>」很重要，規約可另定門檻（但依§23Ⅱ⑥須載明於規約才生效）。最容易錯的是把3/4算成「全體的3/4」——它是<b>出席人數</b>的3/4。且人數與區分所有權比例雙軌並行，只過一邊不算決議成立。"},{"term":"重新召集門檻（§32）","blank":"重新召集（除規約另有規定出席人數外）：出席須區分所有權人___人並___以上、比例___以上；同意須出席人數及比例___；會議紀錄送達後___內，書面反對意見未超過___者，該決議視為成立。","answer":"重新召集（除規約另有規定出席人數外）：出席須區分所有權人<span class=\"key\">3</span>人並<span class=\"key\">1/5</span>以上、比例<span class=\"key\">1/5</span>以上；同意須出席人數及比例<span class=\"key\">過半數</span>；會議紀錄送達後<span class=\"key\">7日</span>內，書面反對意見未超過<span class=\"key\">全體區分所有權人及其區分所有權比例合計半數</span>者，該決議視為成立。","src":"條例§32（申論113年二）","essay":1,"hot":1,"p":"第一次開會人太少、決議不成，可以就同一議案再召集一次，這次門檻大幅降低：三人以上且達五分之一出席、過半數同意即可，但事後還要給沒到的人七天提反對意見。","m":"「三人並五分之一、過半數；七日反對未過半，視為成立」","t":"出席要同時滿足「<b>三人</b>」與「1/5」，漏寫三人就錯。同意門檻從§31的3/4降為<b>過半數</b>。反對期是會議紀錄送達後<b>7日</b>，而且反對意見要「<b>超過</b>」全體人數及比例合計半數才能推翻；另主席應於決議成立後<b>10日</b>內書面送達全體並公告，7日與10日常被對調。"},{"term":"單一人表決權限制（§27）","blank":"任一區分所有權人之區分所有權占全部___以上者，或其所有___超過全部專有部分個數總合___以上者，其超過部分___。","answer":"任一區分所有權人之區分所有權占全部<span class=\"key\">1/5</span>以上者，或其所有<span class=\"key\">專有部分之個數</span>超過全部專有部分個數總合<span class=\"key\">1/5</span>以上者，其超過部分<span class=\"key\">不予計算</span>。","src":"條例§27","essay":0,"hot":0,"p":"防止大戶一人說了算：某個屋主自己就占全社區五分之一以上的區分所有權，或持有的專有部分個數超過五分之一，超過的部分在計算出席與表決時不列入。","m":"「超過五分之一，超過部分不予計算」","t":"限制有<b>兩種算法</b>（區分所有權比例、專有部分個數），不是只看坪數。§27Ⅲ對<b>受託代理出席</b>也有同樣的1/5上限，且得受託者限於配偶、有行為能力之直系血親、其他區分所有權人或承租人。注意效果是「超過部分不予計算」，不是整個表決權都不算。"},{"term":"任期與連任（§25、29）","blank":"召集人任期___年，未規定者___年，連選得連任___次；主委、管理負責人、財務監察委員連選得連任___次，其餘管理委員連選___。","answer":"召集人任期<span class=\"key\">1至2</span>年，未規定者<span class=\"key\">1</span>年，連選得連任<span class=\"key\">1</span>次；主委、管理負責人、財務監察委員連選得連任<span class=\"key\">1</span>次，其餘管理委員連選<span class=\"key\">得連任</span>。","src":"條例§25、§29","essay":0,"hot":0,"p":"召集人、管理委員、主委的任期都是一到兩年，社區可在規約或區權會自訂；沒訂就一律算一年。能不能連任則看職務，管錢管事的只能連一次。","m":"「任期一到二、沒訂算一年；主委財務連一次，其餘委員連到飽」","t":"「一至二年」是可選<b>範圍</b>，未規定時為「<b>一年</b>」而非二年。連選得連任<b>一次</b>者：主任委員、管理負責人、負責財務管理及監察業務之管理委員；召集人（§25Ⅲ）同樣是連任一次，<b>其餘管理委員則無次數限制</b>。任期屆滿未再選任，或有§20Ⅱ拒絕移交情形者，自任期屆滿日起視同解任。"},{"term":"管委會當事人能力","blank":"管理委員會有___能力，可為原告或被告。","answer":"管理委員會有<span class=\"key\">當事人</span>能力，可為原告或被告。","src":"條例§38","essay":0,"hot":0,"p":"管委會不是法人，但法律特別賦予它「當事人能力」，所以社區可以用管委會的名義去告人或被告，不必全體屋主一起列名當原告。","t":"有<b>當事人能力</b>不等於有<b>法人資格</b>或權利能力，選項寫成「管理委員會為法人」就是錯。§38Ⅱ另規定管委會為原告或被告時，應將訴訟事件要旨<b>速告區分所有權人</b>。又§40明定§36、§38於<b>管理負責人準用之</b>，所以管理負責人同樣有當事人能力。"},{"term":"規約七事項（§23）","blank":"非經載明於規約不生效力：約定專用共用部分範圍及主體、共用部分使用收益特別約定、禁止___特別約定、違反義務處理方式、___監督規定、決議出席同意人數特別約定、___協調程序。","answer":"非經載明於規約不生效力：約定專用共用部分範圍及主體、共用部分使用收益特別約定、禁止<span class=\"key\">飼養動物</span>特別約定、違反義務處理方式、<span class=\"key\">財務</span>監督規定、決議出席同意人數特別約定、<span class=\"key\">糾紛</span>協調程序。","src":"條例§23","essay":0,"hot":1,"p":"有些事情光開會決議還不夠，一定要白紙黑字寫進規約才有效力，例如把公設約定給誰專用、能不能養寵物、違規怎麼處理等七件事。","m":"「專用範圍、使用收益、禁養、違義、財務、決議人數、糾紛協調」","t":"關鍵句是「<b>非經載明於規約者，不生效力</b>」——只有區權會決議而未寫入規約者無效。第三款是「<b>禁止</b>飼養動物之特別約定」，條例本身（§16Ⅳ）並不禁養，只要求不妨礙公共衛生、安寧、安全。另「專有部分及共用部分範圍」是規約<b>應載明</b>事項，與這七款分開記。"},{"term":"公共基金來源（§18）","blank":"公共基金來源：起造人就領得使用執照___內之管理維護事項，按工程造價一定比例或金額提列（於___提出繳交公庫代收之證明）、區權人依區權會決議___、基金___、其他收入。","answer":"公共基金來源：起造人就領得使用執照<span class=\"key\">一年</span>內之管理維護事項，按工程造價一定比例或金額提列（於<span class=\"key\">使用執照申請時</span>提出繳交公庫代收之證明）、區權人依區權會決議<span class=\"key\">繳納</span>、基金<span class=\"key\">孳息</span>、其他收入。","src":"條例§18、施行細則§5（提列比例）","essay":0,"hot":0,"p":"社區的錢從哪裡來：建商在領使用執照一年內的管理維護事項要按工程造價提列一筆、住戶依區權會決議繳納、這筆基金的孳息，以及其他收入。","m":"「起造人提列、區權人繳納、基金孳息、其他收入」","t":"起造人那筆的「<b>證明</b>」時點是申請<b>使用執照</b>時提出公庫代收證明；「<b>撥付</b>」時點是成立管委會或推選管理負責人並完成§57點交、報備後由公庫代為撥付，兩個時點常被對調。提列比例依細則§5分四級（千分之20／15／5／3）。又本條例公布施行前起造人已取得建造執照者不適用。"},{"term":"行政罰鍰級距","blank":"第47條罰___；第48條罰___；第49、49-1、50條罰___。","answer":"第47條罰<span class=\"key\">3千以上1萬5千以下</span>；第48條罰<span class=\"key\">1千以上5千以下</span>；第49、49-1、50條罰<span class=\"key\">4萬以上20萬以下</span>。","src":"條例§47-50","essay":0,"hot":1,"p":"公寓大廈條例的罰鍰分成三個等級，背熟哪一條配哪個金額、罰的是住戶還是管委會幹部，選擇題就是直接送分題。","m":"「四七三千到一萬五、四八一千到五千、四九五十四萬到二十萬」","t":"對象要分清：<b>§48（1千～5千）</b>罰管理負責人、主委、管委不盡職；<b>§47（3千～1萬5千）</b>罰召集義務、違反§16Ⅰ及Ⅳ、違反§6；<b>§49（4萬～20萬）</b>罰擅自變更使用、未投保、未繳公共基金、拒絕公告移交、起造人違反§57§58。三者都得令限期改善、屆期不改連續處罰；§49-1另按<b>每一專有部分</b>計罰。"},{"term":"刑事責任（§49Ⅱ）","blank":"供營業使用之住戶違反擅自變更使用／§16Ⅱ、Ⅲ，致人於死者處___有期徒刑，得併科___罰金；致重傷者處___有期徒刑，得併科___罰金。","answer":"供營業使用之住戶違反擅自變更使用／§16Ⅱ、Ⅲ，致人於死者處<span class=\"key\">1年以上7年以下</span>有期徒刑，得併科<span class=\"key\">100萬以上500萬以下</span>罰金；致重傷者處<span class=\"key\">6個月以上5年以下</span>有期徒刑，得併科<span class=\"key\">50萬以上250萬以下</span>罰金。","src":"條例§49Ⅱ","essay":0,"hot":0,"p":"有營業事實的住戶擅自變更使用，或在防火間隔、樓梯間堆雜物等違規，若因此害人死亡或重傷，就不只是罰錢，而是要負刑事責任坐牢。","m":"「致死：一年到七年；重傷：六月到五年」","t":"前提是「<b>有供營業使用事實</b>之住戶」，且限於§49Ⅰ第三款（擅自變更使用）或第四款（違反§16Ⅱ、Ⅲ）之行為，一般住宅住戶不適用。除徒刑外還<b>得併科罰金</b>：致死100萬以上500萬以下、致重傷50萬以上250萬以下，選項只寫徒刑漏罰金時要看清題目問哪一段。"},{"term":"起造人義務（§57-58）","blank":"起造人應於管委會成立或負責人推選後___內，會同檢測水電機械消防管線後移交；未領得___不得辦理銷售。","answer":"起造人應於管委會成立或負責人推選後<span class=\"key\">7日</span>內，會同檢測水電機械消防管線後移交；未領得<span class=\"key\">建造執照</span>不得辦理銷售。","src":"條例§57、§58","essay":0,"hot":0,"p":"建商蓋完房子不能一走了之：管委會一成立或管理負責人一推選，七天內要會同現場檢測水電、機械、消防及各類管線，確認功能正常才移交；而且沒拿到建照就不准開始銷售。","m":"「成立七日內會同檢測移交；沒建照不得銷售」","t":"§57是<b>7日內</b>會同檢測移交；若檢測不過且可歸責起造人，命其修復改善後<b>1個月內</b>再辦移交，兩個期間別混。§58是「非經領得<b>建造執照</b>，不得辦理銷售」——是建造執照不是使用執照；§58Ⅱ另禁止將法定空地、法定停車空間、法定防空避難設備讓售特定人。違反§57、§58依§49Ⅰ⑧罰4萬～20萬。"},{"term":"重建（§13-14）","blank":"重建原則應經___區分所有權人及基地所有權人等同意；配合___計畫、嚴重毀損有公安之虞、災變肇致公安危害者，不在此限。","answer":"重建原則應經<span class=\"key\">全體</span>區分所有權人及基地所有權人等同意；配合<span class=\"key\">都更</span>計畫、嚴重毀損有公安之虞、災變肇致公安危害者，不在此限。","src":"條例§13、§14（申論99年二）","essay":1,"hot":0,"p":"老房子要打掉重蓋，原則上全部屋主與土地權利人都要點頭；但碰上配合都更、建物嚴重毀損有公安之虞、或地震火災等重大事變危害公安這三種情形，就不必全體同意。","m":"「原則全體同意；都更、毀損、災變三例外」","t":"同意的人不只區分所有權人，還含<b>基地所有權人、地上權人或典權人</b>。三款例外中，只有<b>第二款（嚴重毀損傾頹朽壞）、第三款（災變）</b>才能依§14訴請法院命不同意者出讓，<b>配合都更的第一款不能用§14</b>。另§14Ⅱ受讓人視為同意重建，§14Ⅲ重建建照之申請以區權會決議名義為之。"}]},{"id":"F","label":"F 細則與規約範本","stat":"併入E篇統計（124題）","cards":[{"term":"公共基金提列比例","blank":"工程造價___以下提列千分之___；逾1,000萬至1億元部分千分之___；逾1億至10億元部分千分之___；逾10億元部分千分之___。","answer":"工程造價<span class=\"key\">1,000萬元</span>以下提列千分之<span class=\"key\">20</span>；逾1,000萬至1億元部分千分之<span class=\"key\">15</span>；逾1億至10億元部分千分之<span class=\"key\">5</span>；逾10億元部分千分之<span class=\"key\">3</span>。","src":"公寓大廈施行細則§5（計算題）","essay":0,"hot":1,"p":"新建大樓的起造人要按工程造價提一筆錢當公共基金，造價越高提列比例越低。重點是它像所得稅級距一樣要<b>分段</b>乘，不是整筆套一個比例，所以這張一定出計算題。","m":"一千萬二十、一億十五、十億五、超過三（皆千分之）。","t":"計算題一定是<b>分段累進</b>，整筆套最高比例就錯；而且第二段起條文都寫「<b>超過……部分</b>」。工程造價以主管建築機關<b>核發建造執照所載</b>的造價為準，不是實際發包價或決算價。另外這是<b>公寓大廈</b>施行細則§5，不要和不動產經紀業施行細則§5（開始營業後 15 日內備查）搞混。"},{"term":"召集人互推","blank":"召集人互推：應有區分所有權人___以上書面推選，經公告___後生效。","answer":"召集人互推：應有區分所有權人<span class=\"key\">2人</span>以上書面推選，經公告<span class=\"key\">10日</span>後生效。","src":"公寓大廈施行細則§7","essay":0,"hot":0,"p":"大樓還沒成立管委會、也推不出召集人時，住戶可以自己連署推一個人出來召開第一次區權會。只要有 2 位以上區分所有權人書面推選，公告 10 天後就生效。","m":"二人以上書面推選，公告十日生效。","t":"是「<b>區分所有權人</b> 2 人以上」<b>書面</b>推選，不是 2 分之 1、也不是 2 名「住戶」，且前提為「除規約另有規定者外」。生效要件是「<b>公告 10 日後</b>」，不是推選當天。多人被推選時先比推選人<b>人數</b>，相同才比區分所有權比例。"},{"term":"規約效力四分類","blank":"①非經載明於規約，___效力（§23）；②載明於規約亦___效力（§7）；③決議額數（§31、32）僅得於規約___；④外牆變更、飼養動物等可於規約___。","answer":"①非經載明於規約，<span class=\"key\">不生</span>效力（§23）；②載明於規約亦<span class=\"key\">不生</span>效力（§7）；③決議額數（§31、32）僅得於規約<span class=\"key\">變更</span>；④外牆變更、飼養動物等可於規約<span class=\"key\">變更</span>。","src":"規約範本注意事項","essay":0,"hot":1,"p":"規約不是什麼都能寫。有些事情「沒寫進規約就不生效力」，有些事情「就算寫進規約還是不生效力」，中間還有一類是可以用規約去調整法定門檻。考點就是分辨某個約定落在哪一格。","m":"不寫無效、寫了也無效、額數只能靠規約改。","t":"最容易錯在第②類：法定共用部分（如樓梯間、昇降機間）不得約定為專用部分，<b>就算載明於規約也不生效力</b>，不是「全體同意就可以」。第①類正好相反，是「<b>非經載明於規約不生效力</b>」，沒寫等於沒有。第③類的<b>決議額數</b>只能用規約調整，不能靠一次區權會臨時決議放寬。"},{"term":"規約範本地位","blank":"規約範本由___定之，供規約草約制作___；條例施行前已取得建照者，區權會訂定規約前，以規約範本___規約。","answer":"規約範本由<span class=\"key\">中央主管機關</span>定之，供規約草約制作<span class=\"key\">參考</span>；條例施行前已取得建照者，區權會訂定規約前，以規約範本<span class=\"key\">視為</span>規約。","src":"規約範本注意事項","essay":0,"hot":0,"p":"內政部提供的規約範本只是「參考樣本」，社區訂規約時照抄或改寫都可以，本身沒有強制力。但對條例施行前就領建照、又還沒開區權會訂規約的舊大樓，過渡期間直接拿範本當規約用。","m":"範本供參考；舊案未訂規約前視為規約。","t":"平時範本「<b>不是法規、沒有強制拘束力</b>」，只有過渡情形才<b>視為</b>規約，而且要同時具備：條例施行前已取得<b>建造執照</b>、且區分所有權人會議<b>尚未</b>訂定規約；少一個就不能視為規約。另外範本是「<b>中央</b>主管機關定之」，不是直轄市或縣市政府，這點常被偷換。"},{"term":"會計用語定義","blank":"會計憑證指___憑證；會計帳簿指___帳及___帳；財務報表指公共基金之現金收支表、管理維護費之現金收支表、___目錄，及費用及___明細。","answer":"會計憑證指<span class=\"key\">原始</span>憑證；會計帳簿指<span class=\"key\">日記</span>帳及<span class=\"key\">總分類</span>帳；財務報表指公共基金之現金收支表、管理維護費之現金收支表、<span class=\"key\">財產</span>目錄，及費用及<span class=\"key\">應收未收款</span>明細。","src":"公寓大廈施行細則§10","essay":0,"hot":0,"p":"管委會每年要向住戶公告財務狀況，這條在定義三個名詞各指什麼：憑證是最原始的那張單據，帳簿是日記帳和總分類帳，財務報表則是收支表加財產目錄那一整套。","m":"憑證原始、帳簿日記加總分類、報表收支加目錄。","t":"三層不要互換：會計<b>憑證</b>僅指原始憑證；會計<b>帳簿</b>只有日記帳＋總分類帳；<b>財務報表</b>最廣，是<b>兩張</b>現金收支表（公共基金、管理維護費各一張）＋財產目錄＋費用及應收未收款明細。另注意這是<b>公寓大廈</b>施行細則§10，不是經紀業細則§10（裁撤營業處所 30 日內備查）。"}]},{"id":"G","label":"G 公平交易法與廣告","stat":"G篇歷屆 114 題（21.9%）","cards":[{"term":"不實廣告構成（§21）","blank":"事業不得在商品或廣告上，或以其他使___之方法，對於與商品相關而足以影響___之事項，為___或___之表示或表徵。","answer":"事業不得在商品或廣告上，或以其他使<span class=\"key\">公眾得知</span>之方法，對於與商品相關而足以影響<span class=\"key\">交易決定</span>之事項，為<span class=\"key\">虛偽不實</span>或<span class=\"key\">引人錯誤</span>之表示或表徵。","src":"公平法§21（申論112年一）","essay":1,"hot":1,"p":"廣告不能騙人。只要是跟商品有關、會影響消費者決定買不買的事項，不管寫在商品上、廣告上，或用其他讓大家知道的方法，都不可以講得不實在或讓人誤會。","t":"條文除了「商品或廣告上」，還包含「<b>或以其他使公眾得知之方法</b>」，選項把範圍限縮成只有廣告就是錯。主觀上<b>不以故意為必要</b>，「引人錯誤」即足。另§21Ⅲ禁止販賣、運送、輸出入載有不實表示之商品，§21Ⅳ明定於<b>服務準用</b>。"},{"term":"連帶責任與10倍","blank":"廣告代理業、媒體業明知或可得而知仍製作／傳播，與廣告主負___責任；非屬知名公眾人物、___或___之薦證者，僅於受廣告主報酬___範圍內負連帶責任。","answer":"廣告代理業、媒體業明知或可得而知仍製作／傳播，與廣告主負<span class=\"key\">連帶損害賠償</span>責任；非屬知名公眾人物、<span class=\"key\">專業人士</span>或<span class=\"key\">機構</span>之薦證者，僅於受廣告主報酬<span class=\"key\">10倍</span>範圍內負連帶責任。","src":"公平法§21（申論104年二）","essay":1,"hot":1,"p":"廣告不實時不是只有廣告主要賠。幫忙製作設計的廣告代理業、傳播刊載的媒體業，只要「明知或可得而知」還照做，就要與廣告主負連帶賠償；代言人也一樣。","m":"「代理、媒體、薦證者，明知或可得而知就連帶」","t":"<b>10倍上限只給「非屬知名公眾人物、專業人士或機構」的薦證者</b>；知名人士或專業機構代言是全額連帶，沒有10倍上限。而且10倍算的是「<b>受廣告主報酬</b>」的十倍，不是損害額的十倍，別跟§31懲罰性賠償「已證明損害額3倍」混。"},{"term":"不實廣告罰鍰","blank":"違反第21條，公平會得限期令停止改正，並處___罰鍰；屆期不停止改正者，按次處___。","answer":"違反第21條，公平會得限期令停止改正，並處<span class=\"key\">5萬以上2,500萬以下</span>罰鍰；屆期不停止改正者，按次處<span class=\"key\">10萬以上5,000萬以下</span>。","src":"公平法§42","essay":0,"hot":0,"p":"違反不實廣告規定，公平會會先限期令你停止、改正或採取必要更正措施，同時直接開罰；期限到了還不停止改正的，就按次再罰，而且金額翻倍。","m":"「五萬到二千五百萬；不改按次十萬到五千萬」","t":"這個級距適用<b>§21、§23至§25</b>（不實廣告、不當贈品贈獎、損害營業信譽、欺罔或顯失公平）。千萬別套到§40：違反§9獨占、§15聯合、§19、§20的罰鍰是10萬～5千萬、按次20萬～1億；而「上一會計年度銷售金額<b>10%</b>」的上限<b>只用於§9、§15且經認定情節重大</b>者。"},{"term":"損害賠償（§31、33）","blank":"故意行為法院得酌定不超過已證明損害額___之賠償；請求權自知悉起___、行為時起___不行使而消滅。","answer":"故意行為法院得酌定不超過已證明損害額<span class=\"key\">3倍</span>之賠償；請求權自知悉起<span class=\"key\">2年</span>、行為時起<span class=\"key\">10年</span>不行使而消滅。","src":"公平法§31（三倍上限）、§32（時效）","essay":0,"hot":0,"p":"被不公平競爭行為害到可以請求損害賠償；如果對方是故意的，法院還能依侵害情節加判超過實際損害的金額。但要注意時效，拖太久就請求不到了。","m":"「故意最多三倍；知悉二年、行為十年」","t":"「<b>不得超過已證明損害額之三倍</b>」是上限不是固定三倍，而且限「<b>事業之故意行為</b>」，過失不適用。時效是「自知有行為及賠償義務人時起<b>2年</b>」「自為行為時起逾<b>10年</b>」。注意§33講的是請求由侵害人負擔費用<b>登載新聞紙</b>，不是賠償計算，舊題引§33要留意。"},{"term":"廣告查核分工","blank":"經紀業所為廣告→___（管理條例）；涉及企業形象等不屬管理條例範疇→___；建商委託經紀業銷售俱為廣告主→___；無法劃分→內政部與公平會___。","answer":"經紀業所為廣告→<span class=\"key\">主管機關</span>（管理條例）；涉及企業形象等不屬管理條例範疇→<span class=\"key\">公平交易委員會</span>；建商委託經紀業銷售俱為廣告主→<span class=\"key\">公平交易委員會</span>；無法劃分→內政部與公平會<span class=\"key\">協調處理</span>。","src":"廣告處理原則第三點（申論103年二）","essay":1,"hot":1,"p":"同一則房屋廣告出事，到底歸地政主管機關管還是公平會管？看內容性質分工：純屬經紀業務的歸主管機關依管理條例處理，涉及企業形象、行銷策略或嚴重影響市場秩序的歸公平會。","m":"「經紀業務找主管機關、形象行銷找公平會、分不清就協調」","t":"第三點（四）是「建商與經紀業者<b>俱為廣告主</b>時」才由公平會處理，少了這個條件就不對。第三點（三）加盟<b>未標明</b>者是由<b>主管機關依管理條例</b>處理，不是公平會。最後一款是「<b>內政部與公平會協調處理</b>」，不是由行政院或上級機關指定管轄。"},{"term":"加盟店標示","blank":"加盟店廣告應標明___或加盟經營字樣，不得逕以條例第21條經紀業名稱替代；未標明者由___處理。","answer":"加盟店廣告應標明<span class=\"key\">加盟店</span>或加盟經營字樣，不得逕以條例第21條經紀業名稱替代；未標明者由<span class=\"key\">主管機關</span>處理。","src":"廣告處理原則第五點（申論111年一）","essay":1,"hot":0,"p":"加盟店不能讓消費者誤以為是直營總部。廣告、市招、名片等明顯處都要標出「加盟店」或「加盟經營」字樣，不能只寫總部的經紀業名稱帶過。","m":"「廣告、市招、名片，三處都要標加盟」","t":"標示地點不是只有廣告，還包括<b>市招與名片等明顯處</b>。未標明加盟字樣者，依廣告處理原則第三點（三）是由<b>主管機關依不動產經紀業管理條例</b>處理，<b>不是公平會依公平法</b>——這是最常被設計的管轄陷阱，容易和不實廣告的分工混在一起。"},{"term":"廣告查核罰則","blank":"經紀業拒絕查核限期改正未改正處___；違規經紀業處___並限期改正；違規經紀人員處___，累計3次另予停止執行業務。","answer":"經紀業拒絕查核限期改正未改正處<span class=\"key\">3萬以上15萬以下</span>；違規經紀業處<span class=\"key\">6萬以上30萬以下</span>並限期改正；違規經紀人員處<span class=\"key\">申誡</span>，累計3次另予停止執行業務。","src":"廣告處理原則第十點","essay":0,"hot":0,"p":"主管機關要查核經紀業廣告時，經紀業不配合、或查出廣告違規，公司和個人都要負責：公司罰錢並限期改正，經紀人員則是先申誡，累積到一定次數再停止執業。","m":"「拒查三到十五萬；違規六到三十萬；人員申誡三次停業」","t":"兩個罰鍰級距對象不同：<b>拒絕查核且限期未改正</b>是較低級距，<b>廣告違規</b>是較高級距，最常被對調。對「<b>經紀人員</b>」的處分是<b>申誡</b>（不是罰鍰），而且要<b>累計達三次</b>才另予停止執行業務，不是一次違規就停業；公司與人員是分開處分，可以並罰。"},{"term":"獨占認定基準（§8）","blank":"§8採排除方式規定——事業「無」下列情形者，___前條獨占事業認定範圍：一事業市占率達___；二事業合計達___；三事業合計達___。達門檻者仍須依§7判斷是否處於___或具壓倒性地位；且個別事業市占率未達1/10或上一會計年度總銷售金額未達公告金額者，仍不列入。","answer":"§8採排除方式規定——事業「無」下列情形者，<span class=\"key\">不列入</span>前條獨占事業認定範圍：一事業市占率達<span class=\"key\">1/2</span>；二事業合計達<span class=\"key\">2/3</span>；三事業合計達<span class=\"key\">3/4</span>。達門檻者仍須依§7判斷是否處於<span class=\"key\">無競爭狀態</span>或具壓倒性地位；且個別事業市占率未達1/10或上一會計年度總銷售金額未達公告金額者，仍不列入。","src":"公平法§8","essay":0,"hot":0,"p":"什麼叫獨占？公平法用「排除法」來寫：市占率沒達到門檻的就不列入獨占認定範圍。但達到門檻也不等於就是獨占，還要回頭用§7看有沒有真的無競爭狀態或具壓倒性地位。","m":"「一家二分之一、兩家三分之二、三家四分之三」","t":"§8是「<b>無下列情形者，不列入</b>認定範圍」的排除寫法，不是「達到就是獨占」，獨占的實質定義在<b>§7</b>。即使達門檻，個別事業市占率<b>未達1/10</b>或上一會計年度總銷售金額未達公告金額者仍不列入。但§8Ⅲ又反過來：受法令、技術限制等足以排除競爭能力者，雖不列入認定範圍，<b>主管機關仍得認定其為獨占</b>。"},{"term":"結合申報（§11）","blank":"結合申報門檻：因結合使市占率達___、參與結合之一事業市占率達___，或上一會計年度___超過主管機關公告金額。自主管機關受理___起算___工作日內不得為結合；主管機關得縮短或延長，延長之期間不得逾___工作日。","answer":"結合申報門檻：因結合使市占率達<span class=\"key\">1/3</span>、參與結合之一事業市占率達<span class=\"key\">1/4</span>，或上一會計年度<span class=\"key\">銷售金額</span>超過主管機關公告金額。自主管機關受理<span class=\"key\">完整申報資料之日</span>起算<span class=\"key\">30</span>工作日內不得為結合；主管機關得縮短或延長，延長之期間不得逾<span class=\"key\">60</span>工作日。","src":"公平法§11","essay":0,"hot":0,"p":"兩家公司要合併、取得股份或受讓營業時，如果規模大到可能影響市場競爭，必須先向公平會申報、等待審查期間過了才能結合，不能先做再說。","m":"「結合三分之一、單一四分之一；三十工作日，延長不逾六十」","t":"<b>1/3是「因結合而使其市場占有率達」</b>，<b>1/4是「參與結合之一事業」的市占率</b>，主詞不同最常被對調。期間單位是「<b>工作日</b>」不是日曆日：自受理完整申報資料之日起算30工作日內不得結合，主管機關得縮短或延長，<b>延長不得逾60工作日</b>。"},{"term":"聯合行為（§14-16）","blank":"聯合行為：指___，以契約、協議或其他方式之___，共同決定價格或限制數量等相互約束事業活動，足以影響生產、商品交易或服務供需之___者；許可期限不得逾___，得申請延展，每次不得逾5年。","answer":"聯合行為：指<span class=\"key\">具競爭關係之同一產銷階段事業</span>，以契約、協議或其他方式之<span class=\"key\">合意</span>，共同決定價格或限制數量等相互約束事業活動，足以影響生產、商品交易或服務供需之<span class=\"key\">市場功能</span>者；許可期限不得逾<span class=\"key\">5年</span>，得申請延展，每次不得逾5年。","src":"公平法§14、§16（申論101年二）","essay":1,"hot":0,"p":"同一產銷階段、彼此有競爭關係的業者，講好一起決定價格或限制數量，就是聯合行為，原則上禁止；只有符合八款有益整體經濟與公共利益的情形並經申請許可，才可以做。","m":"「同階段、有競爭、有合意、影響市場；許可與延展各不逾五年」","t":"定義四要素缺一不可：<b>具競爭關係、同一產銷階段、合意、足以影響市場供需功能</b>；上下游之間的約定不是聯合行為（可能落入§19轉售價格或§20垂直限制）。「其他方式之合意」<b>不問有無法律拘束力</b>。許可期限不得逾5年，延展須於<b>期限屆滿前3個月至6個月</b>期間內書面申請，每次不得逾5年。"},{"term":"違法刑罰是§34，不是§37 ★條號陷阱","blank":"違反§9獨占或§15聯合，須先經主管機關依___限期令停止、改正，而___，或___，才處行為人___以下有期徒刑，得併科___以下罰金。（§37 是損害營業信譽§24的刑責：2年／5千萬，且須___）","answer":"違反§9獨占或§15聯合，須先經主管機關依<span class=\"key\">§40第1項</span>限期令停止、改正，而<span class=\"key\">屆期未停止改正</span>，或<span class=\"key\">停止後再為相同違反行為</span>，才處行為人<span class=\"key\">3年</span>以下有期徒刑，得併科<span class=\"key\">1億元</span>以下罰金。（§37 是損害營業信譽§24的刑責：2年／5千萬，且須<span class=\"key\">告訴乃論</span>）","src":"公平法§34（原頁誤標§37，2026-10-25 更正）","essay":0,"hot":0,"p":"違反獨占或聯合行為的規定，不是一被抓到就判刑。要先經公平會限期令停止、改正，屆期不改或停止後又再犯，才會進到刑事責任，這就是「先行政後司法」。","m":"「先限期改正，屆期不改或再犯，才三年、一億」","t":"三個刑責條文最易混：<b>§34</b>（§9獨占、§15聯合）3年以下、1億元以下罰金；<b>§36</b>（§19、§20）2年以下、5千萬以下；<b>§37</b>（§24損害營業信譽）同樣2年、5千萬，但<b>須告訴乃論</b>且有兩罰。§34、§36須先經§40Ⅰ限期令停止改正，<b>§37不需前置行政處分即可成罪</b>。"}]},{"id":"H","label":"H 消費者保護法","stat":"H篇歷屆 117 題（22.5%）","cards":[{"term":"消費者・企業經營者（§2①②）","blank":"消費者：指以___為目的而為交易、使用商品或接受服務者；企業經營者：指以___、___、___、___、___商品或提供服務為營業者。","answer":"消費者：指以<span class=\"key\">消費</span>為目的而為交易、使用商品或接受服務者；企業經營者：指以<span class=\"key\">設計</span>、<span class=\"key\">生產</span>、<span class=\"key\">製造</span>、<span class=\"key\">輸入</span>、<span class=\"key\">經銷</span>商品或提供服務為營業者。","src":"消保法§2①②","essay":0,"hot":1,"p":"消保法只保護「以消費為目的」的人。買來自己用、接受服務的是消費者；把設計、生產、製造、輸入、經銷或提供服務當成營業在做的，是企業經營者。","m":"「設計、生產、製造、輸入、經銷、提供服務」六態樣","t":"「<b>以消費為目的</b>」是門檻：買來轉售、進貨做生意的不是消費者，不能主張消保法。企業經營者依細則§2「所稱營業，<b>不以營利為目的者為限</b>」，所以非營利組織也可能是企業經營者。另§8經銷者負連帶賠償（已盡注意可免責）、§9輸入者<b>視為</b>設計生產製造者負§7責任。"},{"term":"消費者保護團體（§2⑥）","blank":"消費者保護團體：指以保護消費者為目的而___設立登記之___。","answer":"消費者保護團體：指以保護消費者為目的而<span class=\"key\">依法</span>設立登記之<span class=\"key\">法人</span>。","src":"消保法§2⑥","essay":0,"hot":0,"p":"消保團體不是隨便一個社團就算，必須是為了保護消費者的目的、而且依法設立登記的法人，才具備這個身分。","t":"關鍵字是「<b>依法設立登記之法人</b>」——未登記的團體或個人都不算。§27進一步限定<b>以社團法人或財團法人為限</b>。要提團體訴訟門檻更嚴（§49：許可設立2年以上、置有消費者保護專門人員、經行政院評定優良），別把「成為消保團體」和「能提訴訟」兩層門檻混在一起。"},{"term":"定型化契約條款（§2⑦）★用字陷阱","blank":"定型化契約條款：指企業經營者為與___消費者（★法條用「多數」，不是「不特定多數」）訂立同類契約之用，___之契約條款。定型化契約條款___書面，以放映字幕、張貼、牌示、網際網路或其他方法表示者亦屬之。","answer":"定型化契約條款：指企業經營者為與<span class=\"key\">多數</span>消費者（★法條用「多數」，不是「不特定多數」）訂立同類契約之用，<span class=\"key\">所提出預先擬定</span>之契約條款。定型化契約條款<span class=\"key\">不限於</span>書面，以放映字幕、張貼、牌示、網際網路或其他方法表示者亦屬之。","src":"消保法§2⑦（考古題101-11）","essay":1,"hot":1,"p":"業者事先印好、準備拿來跟一大堆客人簽同一種契約的條款，就是定型化契約條款。不是只有紙本才算，螢幕字幕、張貼公告、牌示、網頁上的也都算。","m":"「多數消費者、同類契約、預先擬定」","t":"法條用「<b>多數</b>消費者」，不是「<b>不特定多數人</b>」——後者是不動產廣告處理原則第二點對「廣告」的用語（使不特定多數人知悉），兩者差一個詞就選錯。又條款<b>不限於書面</b>，放映字幕、張貼、牌示、網際網路皆屬之；細則§12另補充：因字體、印刷致難以注意或辨識者不構成契約內容，但消費者得主張仍構成內容。"},{"term":"個別磋商條款（§2⑧）","blank":"個別磋商條款：指契約當事人___而___之契約條款。（牴觸時依§15，定型化契約條款牴觸部分___）","answer":"個別磋商條款：指契約當事人<span class=\"key\">個別磋商</span>而<span class=\"key\">合意</span>之契約條款。（牴觸時依§15，定型化契約條款牴觸部分<span class=\"key\">無效</span>）","src":"消保法§2⑧、§15（考古題99-19、106-32、108-14）","essay":0,"hot":1,"p":"契約裡雙方真的坐下來一條一條談出來、達成合意的，就是個別磋商條款。它和業者事先印好的定型化條款打架時，談出來的那條勝出。","m":"「個別磋商贏定型化，牴觸部分無效」","t":"§15無效的是<b>定型化契約條款</b>那一方，不是個別磋商條款，方向寫反就錯；而且只有<b>牴觸的「部分」</b>無效，不是整份契約無效。整份契約的命運看§16：除去該部分後契約仍可成立者，其他部分仍有效；但對當事人一方<b>顯失公平者，該契約全部無效</b>。"},{"term":"定型化契約（§2⑨）","blank":"定型化契約：指以企業經營者提出之定型化契約條款作為契約內容之___而訂立之契約。","answer":"定型化契約：指以企業經營者提出之定型化契約條款作為契約內容之<span class=\"key\">全部或一部</span>而訂立之契約。","src":"消保法§2⑨","essay":0,"hot":0,"p":"整份契約只要有一部分是用業者提出的定型化條款組成的，這份契約就叫定型化契約，不必全部條款都是制式的才算。","t":"定義寫「<b>全部或一部</b>」，所以契約中夾雜幾條手寫磋商條款，整份仍是定型化契約，審閱期與公平性審查照樣適用。要分清三個名詞：定型化契約<b>條款</b>（§2⑦）、<b>個別磋商</b>條款（§2⑧）、定型化<b>契約</b>（§2⑨），考試最愛把三者的定義敘述互換。"},{"term":"通訊交易（§2⑩）","blank":"通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於___下而與企業經營者所訂立之契約。","answer":"通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於<span class=\"key\">未能檢視商品或服務</span>下而與企業經營者所訂立之契約。","src":"消保法§2⑩（考古題110-16）","essay":0,"hot":1,"p":"沒看到實物就下單的交易。透過電視購物、電話、型錄、報紙、網路等方式，消費者在「未能檢視商品或服務」的情況下訂約，就是通訊交易。","m":"「未能檢視商品或服務，才是通訊交易」","t":"關鍵不在用什麼工具，而在「消費者於<b>未能檢視商品或服務下</b>」訂約；先到店裡看過實物再用網路下單，就不符定義。這一點直接決定§19的7日解除權能不能用——不動產買賣通常已實地看屋、面對面簽約，原則不適用。"},{"term":"訪問交易（§2⑪）★關鍵字","blank":"訪問交易：指企業經營者___而與消費者在其___、___、___或其他場所所訂立之契約。","answer":"訪問交易：指企業經營者<span class=\"key\">未經邀約</span>而與消費者在其<span class=\"key\">住居所</span>、<span class=\"key\">工作場所</span>、<span class=\"key\">公共場所</span>或其他場所所訂立之契約。","src":"消保法§2⑪（考古題104-31、111-11）","essay":0,"hot":1,"p":"業者沒被邀請就主動找上門推銷並簽約。地點不限於家裡，辦公室、路邊、任何場所都算，重點是「未經邀約」這四個字。","m":"「未經邀約就上門；住居所、工作場所、公共場所都算」","t":"核心關鍵字是「<b>未經邀約</b>」——若是消費者自己打電話請業者來估價、說明後簽約，就不是訪問交易，也沒有7日解除權。地點<b>不限住居所</b>，選項寫成「限於消費者住居所」即為錯誤。另舊法稱「訪問買賣」，現行法已改為「<b>訪問交易</b>」並涵蓋服務。"},{"term":"分期付款（§2⑫）","blank":"分期付款：指買賣契約約定消費者支付___，餘款分期支付，而企業經營者於___時，交付標的物與消費者之交易型態。（§21 未載利率者按現金交易價格週年利率___計算）","answer":"分期付款：指買賣契約約定消費者支付<span class=\"key\">頭期款</span>，餘款分期支付，而企業經營者於<span class=\"key\">收受頭期款</span>時，交付標的物與消費者之交易型態。（§21 未載利率者按現金交易價格週年利率<span class=\"key\">百分之五</span>計算）","src":"消保法§2⑫、§21","essay":0,"hot":0,"p":"先付頭期款、尾款分期慢慢還，而且業者在收到頭期款的當下就把東西交給你，這種才叫消保法上的分期付款。","m":"「收頭期款即交付標的物；沒寫利率，週年利率百分之五」","t":"定義要素是「<b>收受頭期款時交付標的物</b>」——先付清才交貨的不算。§21要求契約<b>應以書面為之</b>並載明三項：頭期款、各期價款與其他附加費用合計之總價款與現金交易價格之差額、<b>利率</b>。未記載利率者按<b>現金交易價格週年利率百分之五</b>計算；違反第一、二款者，消費者不負現金交易價格以外價款之給付義務。"},{"term":"審閱期（§11-1）","blank":"訂立定型化契約前，應有___以內之合理期間供消費者審閱；以定型化契約條款使消費者拋棄審閱權者___；違反者該條款不構成___，但___。","answer":"訂立定型化契約前，應有<span class=\"key\">30日</span>以內之合理期間供消費者審閱；以定型化契約條款使消費者拋棄審閱權者<span class=\"key\">無效</span>；違反者該條款不構成<span class=\"key\">契約之內容</span>，但<span class=\"key\">消費者得主張該條款仍構成契約之內容</span>。","src":"消保法§11-1","essay":0,"hot":1,"p":"簽制式契約前，業者要給你一段時間把契約帶回去看清楚。這段時間是三十日以內的合理期間，而且不能用契約條款叫你拋棄這個權利。","m":"「三十日以內合理期間，拋棄無效」","t":"條文是「<b>三十日以內</b>之合理期間」——是上限不是一律三十日，寫成「至少三十日」或「應有三十日」就錯。違反的效果很特別：該條款「<b>不構成契約之內容</b>」，但<b>消費者得主張該條款仍構成契約之內容</b>（單向有利於消費者）。別和§19的7日解除權、§43的15日申訴處理期混。"},{"term":"應記載／不得記載事項（§17）","blank":"中央主管機關得選擇特定行業，擬訂定型化契約___或___事項，報請___核定後公告。","answer":"中央主管機關得選擇特定行業，擬訂定型化契約<span class=\"key\">應記載</span>或<span class=\"key\">不得記載</span>事項，報請<span class=\"key\">行政院</span>核定後公告。","src":"消保法§17（申論106年二）","essay":1,"hot":0,"p":"針對特定行業（例如預售屋買賣），中央主管機關可以事先訂好契約裡一定要寫什麼、絕對不能寫什麼，報請行政院核定後公告，業者就得照著用。","m":"「中央擬訂、行政院核定、公告實施」","t":"流程三步驟缺一不可：中央主管機關「<b>擬訂</b>」→報請「<b>行政院核定</b>」→「<b>公告</b>」，選項若寫由行政院擬訂、或由直轄市縣市政府公告就是錯。中央主管機關依§6是「<b>目的事業主管機關</b>」，不動產類即內政部，不是消保處。又§17Ⅵ：企業經營者使用定型化契約者，主管機關得<b>隨時派員查核</b>。"},{"term":"公告事項效力（§17）","blank":"違反公告不得記載事項之條款___；公告應記載事項雖未記載於契約，仍___契約內容。","answer":"違反公告不得記載事項之條款<span class=\"key\">無效</span>；公告應記載事項雖未記載於契約，仍<span class=\"key\">構成</span>契約內容。","src":"消保法§17Ⅳ、Ⅴ","essay":0,"hot":1,"p":"公告的「不得記載事項」業者偏要寫進契約，那一條無效；公告的「應記載事項」業者故意不寫，法律直接當作已經寫進去了，照樣要履行。","m":"「不得記載者無效、應記載者視同已載」","t":"兩個方向的效果常被對調：違反公告者「<b>條款無效</b>」，應記載而未記載者「<b>仍構成契約之內容</b>」。又條款無效後整份契約的效力依<b>§16</b>判斷（除去後仍可成立者其他部分有效，顯失公平者全部無效），不是整份契約當然無效。民事無效與§56-1的行政罰是<b>並行</b>的，不是二擇一。"},{"term":"顯失公平（§12）","blank":"條款違反___原則對消費者顯失公平者無效；推定顯失公平：違反___原則、與任意規定立法意旨顯相矛盾、契約主要權利義務受限制致___難以達成。","answer":"條款違反<span class=\"key\">誠信</span>原則對消費者顯失公平者無效；推定顯失公平：違反<span class=\"key\">平等互惠</span>原則、與任意規定立法意旨顯相矛盾、契約主要權利義務受限制致<span class=\"key\">契約目的</span>難以達成。","src":"消保法§12","essay":0,"hot":0,"p":"制式條款寫得太偏袒業者、違反誠信原則而對消費者顯失公平的，無效。法律還列了三種情形，只要符合就先「推定」顯失公平，由業者去舉反證。","m":"「平等互惠、立法意旨、目的難達成，三推定」","t":"是「<b>推定</b>」顯失公平，不是「視為」——推定可舉證推翻，視為不行，這一字之差最常被考。三款要背熟：違反<b>平等互惠</b>原則、與所排除不予適用之<b>任意規定立法意旨顯相矛盾</b>、契約<b>主要權利義務</b>受限制致契約目的難以達成。細則§13、§14另補充判斷標準與四種違反平等互惠的情形。"},{"term":"解釋與個別磋商（§11、15）","blank":"定型化契約條款如有疑義，應為有利於___之解釋；個別磋商條款牴觸定型化條款者，___部分無效。","answer":"定型化契約條款如有疑義，應為有利於<span class=\"key\">消費者</span>之解釋；個別磋商條款牴觸定型化條款者，<span class=\"key\">定型化條款</span>部分無效。","src":"消保法§11、§15","essay":0,"hot":0,"p":"制式條款看不懂、有兩種解釋空間時，要往對消費者有利的方向解釋；而雙方另外談好的個別磋商條款，效力高於制式條款。","m":"「有疑義利消費者；個別磋商贏定型化」","t":"§11Ⅱ的前提是「<b>如有疑義時</b>」——條款文義清楚明確時，不能硬要做有利消費者的解釋。§11Ⅰ另規定定型化契約條款應本「<b>平等互惠原則</b>」，這個原則同時是§12Ⅱ①推定顯失公平的判準。§15無效的是<b>定型化條款的牴觸部分</b>，不是個別磋商條款，也不是全部無效。"},{"term":"七日解除權（§19）","blank":"通訊交易、訪問交易消費者得於收受商品或接受服務後___內，以___方式解除契約，無須說明理由及負擔任何費用或對價；但通訊交易有___者，不在此限。一般不動產買賣因面對面、實地看屋，原則___適用。","answer":"通訊交易、訪問交易消費者得於收受商品或接受服務後<span class=\"key\">7日</span>內，以<span class=\"key\">退回商品或書面通知</span>方式解除契約，無須說明理由及負擔任何費用或對價；但通訊交易有<span class=\"key\">合理例外情事</span>者，不在此限。一般不動產買賣因面對面、實地看屋，原則<span class=\"key\">不</span>適用。","src":"消保法§19","essay":0,"hot":0,"p":"網購或被推銷上門簽的約，可以在收到商品或接受服務後七天內反悔，直接退回商品或寄書面通知就好，不用說明理由，也不必負擔任何費用或對價。","m":"「收受後七日，退貨或書面，無須理由無須費用」","t":"七日是<b>解除權</b>的行使期間，不是「鑑賞期」「猶豫期」這種俗稱。通訊交易有<b>行政院所定合理例外情事</b>者不適用。§19Ⅲ特別規定：業者未依§18Ⅰ③告知解除權資訊者，七日自<b>提供之次日</b>起算，但自原七日期間起算<b>已逾四個月者解除權消滅</b>。§19Ⅳ消費者已交運商品或發出書面即視為解除（發信主義）。"},{"term":"廣告真實義務（§22-23）","blank":"企業經營者對消費者所負義務不得___廣告內容；媒體經營者明知或可得而知與事實不符，與企業經營者負___責任。","answer":"企業經營者對消費者所負義務不得<span class=\"key\">低於</span>廣告內容；媒體經營者明知或可得而知與事實不符，與企業經營者負<span class=\"key\">連帶</span>責任。","src":"消保法§22、§23（申論109年一）","essay":1,"hot":0,"p":"廣告說了什麼，業者就得做到——廣告內容直接變成契約義務的最低標準；而刊登或報導廣告的媒體如果明知或可得而知廣告與事實不符還照登，要和業者一起賠。","m":"「義務不得低於廣告；媒體明知可得而知就連帶」","t":"§22是「所負義務<b>不得低於</b>廣告之內容」，不是一律以契約文字為準。§23媒體連帶責任的主觀要件是「<b>明知或可得而知</b>」，且該責任<b>不得預先約定限制或拋棄</b>。注意消保法細則§23的廣告定義用「可使<b>多數人</b>知悉」，廣告處理原則第二點用「<b>不特定多數人</b>」。"},{"term":"懲罰性賠償金（§51）","blank":"懲罰性賠償金：故意___倍以下、重大過失___倍以下、過失___倍以下。","answer":"懲罰性賠償金：故意<span class=\"key\">5</span>倍以下、重大過失<span class=\"key\">3</span>倍以下、過失<span class=\"key\">1</span>倍以下。","src":"消保法§51（申論108年一）","essay":1,"hot":1,"p":"業者害你受損，除了實際損害之外還可以依它的過錯程度再多要一筆懲罰性賠償金：故意最多五倍、重大過失三倍、一般過失一倍。","m":"「故意五、重過三、過失一」","t":"三個倍數最容易被打亂，也最容易和公平法§31「故意行為不超過已證明損害額<b>三倍</b>」混。倍數算的是<b>損害額</b>，而且都是「<b>以下</b>」，法院可判更低。另注意必須是「<b>依本法所提之訴訟</b>」才能請求；§10-1規定企業經營者對消費者或第三人的損害賠償責任<b>不得預先約定限制或免除</b>。"},{"term":"違反公告罰則（§56-1）","blank":"違反應記載／不得記載事項公告，限期改正屆期不改正，處___；再次令限期改正仍不改正，處___並得按次處罰。","answer":"違反應記載／不得記載事項公告，限期改正屆期不改正，處<span class=\"key\">3萬以上30萬以下</span>；再次令限期改正仍不改正，處<span class=\"key\">5萬以上50萬以下</span>並得按次處罰。","src":"消保法§56-1","essay":0,"hot":0,"p":"業者使用的定型化契約違反公告的應記載或不得記載事項，不會馬上開罰：要先令其限期改正，逾期不改才罰；再給一次機會仍不改，金額加重並得按次處罰。","m":"「先改正；不改三到三十萬，再不改五到五十萬」","t":"兩階段金額常被對調，而且<b>兩段都以「經令限期改正而屆期不改正」為前提</b>——不是一違反就罰。別跟§56（違反§24標示、§25保證書、§26包裝）的2萬～20萬、§57（規避調查）的3萬～30萬混。違反公告在民事上另依§17Ⅳ使條款無效，行政罰與民事無效<b>並行</b>。"},{"term":"調解委員會與異議","blank":"消費爭議調解委員會委員人數為___名；調解方案異議期限為___日。","answer":"消費爭議調解委員會委員人數為<span class=\"key\">7至21</span>名；調解方案異議期限為<span class=\"key\">10</span>日。","src":"消保法§45（委員7至21名）、§45-3及§45-5（異議10日）","essay":2,"hot":1,"p":"跟業者談不攏可以向直轄市、縣市政府的消費爭議調解委員會聲請調解；委員會置委員七到二十一名，對調解委員提出的解決方案不服，要在十天內提出異議。","m":"「委員七到二十一，異議十日不變期間」","t":"10日是「<b>不變期間</b>」，逾期未異議即「<b>視為已依該方案成立調解</b>」。一般爭議（§45-3）提異議者<b>視為調解不成立</b>；小額爭議（§45-5）異議後另定期日仍無正當理由不到場，<b>反而視為成立調解</b>，效果相反。職權方案門檻也不同：一般須「<b>參與</b>調解委員」過半數，小額須「<b>全體</b>調解委員」過半數。"},{"term":"消保團體訴訟","blank":"消保團體須許可設立___年以上、置有___，且申請行政院___者，始得以自己名義提起訴訟，並應___代理訴訟；受讓損害賠償請求權之消費者人數須___人以上。","answer":"消保團體須許可設立<span class=\"key\">2</span>年以上、置有<span class=\"key\">消費者保護專門人員</span>，且申請行政院<span class=\"key\">評定優良</span>者，始得以自己名義提起訴訟，並應<span class=\"key\">委任律師</span>代理訴訟；受讓損害賠償請求權之消費者人數須<span class=\"key\">20</span>人以上。","src":"消保法§49、§50","essay":0,"hot":0,"p":"受害的消費者人多但每人金額小時，可以把損害賠償請求權讓給消保團體，由團體出面打官司。但不是每個團體都能告，資格、律師、受讓人數都有門檻。","m":"「設立二年、評定優良、律師代理、受讓二十人」","t":"三個資格要件缺一不可：<b>許可設立2年以上</b>、置有消費者保護專門人員、<b>經行政院評定優良</b>，且「<b>應</b>委任律師代理訴訟」為強制。20人是受讓請求權的消費者人數；事後有人終止讓與致<b>不足20人，不影響其訴訟權能</b>。另§52標的價額逾60萬元者，超過部分免繳裁判費。"},{"term":"申訴與返還期限","blank":"企業經營者對申訴應於申訴之日起___內妥適處理；通訊交易書面解除契約，應於收到通知次日起15日內___，並於取回商品、收到退回商品或解除服務契約通知之次日起___內___對價；未經要約寄送之商品，經定相當期限通知取回而逾期未取回者視為拋棄，未通知者亦須寄送後逾___未經消費者___而仍不取回，始視為拋棄。","answer":"企業經營者對申訴應於申訴之日起<span class=\"key\">15日</span>內妥適處理；通訊交易書面解除契約，應於收到通知次日起15日內<span class=\"key\">取回商品</span>，並於取回商品、收到退回商品或解除服務契約通知之次日起<span class=\"key\">15日</span>內<span class=\"key\">返還</span>對價；未經要約寄送之商品，經定相當期限通知取回而逾期未取回者視為拋棄，未通知者亦須寄送後逾<span class=\"key\">1個月</span>未經消費者<span class=\"key\">表示承諾</span>而仍不取回，始視為拋棄。","src":"消保法§43Ⅱ、§19-2、§20Ⅱ","essay":0,"hot":0,"p":"消保法裡有好幾個十五天：業者收到消費者申訴要在十五天內妥適處理；通訊交易以書面解約後，業者十五天內去取回商品，再十五天內把錢還給消費者。","m":"「申訴十五、取貨十五、退錢十五；未訂購寄送逾一個月視為拋棄」","t":"三個15日<b>起算點不同</b>：申訴自「<b>接獲申訴之日</b>」起算（細則§36）；取回商品自收到解除通知之「<b>次日</b>」起算；返還對價自取回商品、收到退回商品或解除服務契約通知之「<b>次日</b>」起算。§20未通知者，須寄送後逾<b>1個月</b>未經消費者表示承諾且仍不取回，才視為拋棄。"}]}];

// ── 白話／口訣／考試陷阱（兩種模式共用） ──
function pmtHtml(c){
  var h='';
  if(c.p) h+='<div class="an-sec an-plain"><b class="l">白話</b>'+c.p+'</div>';
  if(c.m) h+='<div class="an-sec an-mn"><b class="l">口訣</b><span class="mtx">'+c.m+'</span></div>';
  if(c.t) h+='<div class="an-sec an-trap"><b class="l">考試陷阱</b>'+c.t+'</div>';
  return h;
}

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val">${ans}</span></span>`;
  });
  return html;
}


function statOf(c, chStat){
  const p=[];
  if(c.hot) p.push('<strong>16年鐵律考點</strong>');
  if((c.essay||0)>0) p.push('申論 <strong>'+c.essay+'</strong> 次');
  p.push(chStat);
  return p.join('　｜　');
}

// build nav
const nav = document.getElementById('nav');
const main = document.getElementById('main');
let cardDone = {}; // cardKey -> bool

// 全部隨機按鈕
const randAllBtn = document.createElement('button');
randAllBtn.className = 'nav-btn';
randAllBtn.textContent = '全部隨機';
randAllBtn.style.borderColor = 'var(--blue)';
randAllBtn.style.color = 'var(--blue)';
randAllBtn.onclick = () => setMode('quiz');
nav.appendChild(randAllBtn);

DATA.forEach((ch,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (ci===0?' on':'');
  btn.textContent = ch.label;
  btn.onclick = ()=> switchCh(ch.id);
  nav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'chapter' + (ci===0?' active':'');
  div.id = 'ch-'+ch.id;

  const total = ch.cards.length;
  div.innerHTML = `<div class="ch-title">${ch.label}</div>
    <div class="prog">
      <div class="prog-bar"><div class="prog-fill" id="pf-${ch.id}" style="width:0%"></div></div>
      <div class="prog-txt" id="pt-${ch.id}">0 / ${total}</div>
    </div>
    <div class="section-hint">點空格顯示答案，再點收起</div>
    ${ch.top||''}`;

  ch.cards.forEach((c,i)=>{
    const key = ch.id+'-'+i;
    cardDone[key] = false;
    const blankCount = (c.blank.match(/___/g)||[]).length;
    const builtBlank = buildBlankLine(c.blank, c.answer, key);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+key;
    const statHtml = statOf(c, ch.stat);
    card.innerHTML = `
      <div class="term">${c.term}</div>
      <div class="blank-line" id="bl-${key}">${builtBlank}</div>
      <div class="card-btns">
        <button class="reveal-btn" onclick="revealAllBlanks('${key}','${ch.id}',${total})">全部顯示</button>
        <button class="reveal-all-btn" id="rb-${key}" onclick="markDone('${key}','${ch.id}',${total})">已確認 ✓</button>
      </div>
      <div class="qc-exam-stat" id="bstat-${key}">${statHtml}</div>
      <div class="answer-note" id="ans-${key}">
        <div class="key-note">${c.answer}</div>
        ${pmtHtml(c)}
        <div class="src" style="margin-top:6px;font-size:12px;color:var(--muted)">📌 ${c.src}</div>
      </div>`;
    div.appendChild(card);
  });

  main.appendChild(div);
});

function toggleBlank(el) {
  el.classList.toggle('revealed');
}

function revealAllBlanks(key, chId, total) {
  document.querySelectorAll(`.blank[data-key="${key}"]`).forEach(el => {
    el.classList.add('revealed');
  });
  // 同時顯示完整答案注記
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 顯示考試出題紀錄
  const bstat = document.getElementById('bstat-'+key);
  if(bstat) bstat.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  try{window.BXREP&&BXREP.fillMark(key)}catch(e){}
  const btn = document.getElementById('rb-'+key);
  if(btn){ btn.textContent='✓ 完成'; btn.classList.add('done'); }
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 更新進度
  const done = Object.keys(cardDone).filter(k=>k.startsWith(chId+'-')&&cardDone[k]).length;
  const pct = Math.round(done/total*100);
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = pct+'%';
  if(pt) pt.textContent = done+' / '+total;
}

function switchCh(id){
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ch-'+id).classList.add('active');
  [...document.querySelectorAll('.nav-btn')].find(b=>b.textContent.startsWith(id)).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===測驗模式===
let quizPool = [];        // 所有題目扁平化
let quizQueue = [];       // 本輪隨機排列
let quizIdx = 0;
let quizFilter = 'ALL';   // 'ALL' 或 chapter id

function setMode(mode) {
  const browse = document.getElementById('main');
  const nav = document.getElementById('nav');
  const quizEl = document.getElementById('quiz-mode');
  const tabB = document.getElementById('tab-browse');
  const tabQ = document.getElementById('tab-quiz');
  if (mode === 'browse') {
    browse.style.display = ''; nav.style.display = '';
    quizEl.classList.remove('active');
    tabB.classList.add('on'); tabQ.classList.remove('on');
  } else {
    browse.style.display = 'none'; nav.style.display = 'none';
    quizEl.classList.add('active');
    tabB.classList.remove('on'); tabQ.classList.add('on');
    initQuiz();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach((c, ci) => {
        quizPool.push({ key: ch.id+'-'+ci, chId: ch.id, chLabel: ch.label, term: c.term, blank: c.blank, answer: c.answer, src: c.src, essay: c.essay||0, hot: c.hot||0, chStat: ch.stat, p: c.p||'', m: c.m||'', t: c.t||'' });
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const allBtn = document.createElement('button');
    allBtn.className = 'qf-btn qf-all on';
    allBtn.textContent = '全部章節';
    allBtn.onclick = () => setQuizFilter('ALL', allBtn);
    filterEl.appendChild(allBtn);
    DATA.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'qf-btn';
      btn.textContent = ch.label;
      btn.onclick = () => setQuizFilter(ch.id, btn);
      filterEl.appendChild(btn);
    });
  }
  startQuizRound();
}

function setQuizFilter(id, btn) {
  quizFilter = id;
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  startQuizRound();
}

function startQuizRound() {
  const pool = quizFilter === 'ALL' ? quizPool : quizPool.filter(c => c.chId === quizFilter);
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    area.innerHTML = `<div class="quiz-done-banner">本輪 ${quizQueue.length} 題全部完成！<br><br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
