\">禁止</span>，例外經<span class=\"key\">許可</span>（§15）。","src":"公平法§9、§11、§15（要旨）","essay":0,"hot":0,"qk":["99-8","99-9","99-10"],"esl":[],"qkind":"","m":"獨占看濫用，結合看申報，聯合看許可〔自編〕"},{"term":"反托拉斯基金★陷阱","blank":"主管機關為強化___查處，得設立反托拉斯基金（§47-1）；來源含提撥違反本法罰鍰之___；用途如檢舉違法聯合行為___、國際合作、資料庫、研究、教育宣導等。","answer":"主管機關為強化<span class=\"key\">聯合行為</span>查處，得設立反托拉斯基金（§47-1）；來源含提撥違反本法罰鍰之<span class=\"key\">百分之三十</span>；用途如檢舉違法聯合行為<span class=\"key\">獎金</span>、國際合作、資料庫、研究、教育宣導等。","src":"公平法§47-1（逐字要旨）","essay":0,"hot":0,"qk":["104-38","105-14","106-21"],"esl":[],"qkind":"","t":"不是直接補助受害人的<b>損害賠償</b>，也不是公寓大廈的「管理維護基金」。","mcx":["104-38","105-14","106-21"]},{"term":"限制轉售價格、垂直限制 vs 聯合行為★陷阱","blank":"§19 事業不得限制其___就供給之商品轉售之價格（有正當理由者不在此限）；§20⑤ 以不正當限制交易相對人之事業活動為條件而與其交易，有限制競爭之虞者不得為之；加盟總部以限制加盟店服務報酬為條件→屬§20，不是___。","answer":"§19 事業不得限制其<span class=\"key\">交易相對人</span>就供給之商品轉售之價格（有正當理由者不在此限）；§20⑤ 以不正當限制交易相對人之事業活動為條件而與其交易，有限制競爭之虞者不得為之；加盟總部以限制加盟店服務報酬為條件→屬§20，不是<span class=\"key\">聯合行為</span>。","src":"公平法§19、§20（逐字要旨）；112-14、103-40官方答案","essay":0,"hot":0,"qk":["112-14","103-40","109-5","109-18","mk-11"],"esl":[],"qkind":"","t":"聯合行為須「有競爭關係之事業」合意；上下游之間的限制是<b>垂直限制</b>。§15 的許可事由（如共同輸入）不是§20 的禁止行為；§19 規範的是對「交易相對人」，不是對消費者。","mcx":["112-14","103-40","109-5","109-18","mk-11"]},{"term":"不服公平會處分之救濟★陷阱","blank":"對主管機關依本法所為之處分或決定不服者，___適用___程序（§48）。","answer":"對主管機關依本法所為之處分或決定不服者，<span class=\"key\">直接</span>適用<span class=\"key\">行政訴訟</span>程序（§48）。","src":"公平法§48（逐字）","essay":0,"hot":0,"qk":["104-39"],"esl":[],"qkind":"","t":"不經訴願，也沒有「申請調處」這條路。","mcx":["104-39"]}]},{"id":"H","label":"H 消費者保護法","stat":"H篇歷屆 117 題（22.5%）","cards":[{"term":"消費者・企業經營者（§2①②）","blank":"消費者：指以___為目的而為交易、使用商品或接受服務者；企業經營者：指以___、___、___、___、___商品或提供服務為營業者。","answer":"消費者：指以<span class=\"key\">消費</span>為目的而為交易、使用商品或接受服務者；企業經營者：指以<span class=\"key\">設計</span>、<span class=\"key\">生產</span>、<span class=\"key\">製造</span>、<span class=\"key\">輸入</span>、<span class=\"key\">經銷</span>商品或提供服務為營業者。","src":"消保法§2①②","essay":0,"hot":1,"p":"消保法只保護「以消費為目的」的人。買來自己用、接受服務的是消費者；把設計、生產、製造、輸入、經銷或提供服務當成營業在做的，是企業經營者。","m":"「設計、生產、製造、輸入、經銷、提供服務」六態樣","t":"「<b>以消費為目的</b>」是門檻：買來轉售、進貨做生意的不是消費者，不能主張消保法。企業經營者依細則§2「所稱營業，<b>不以營利為目的者為限</b>」，所以非營利組織也可能是企業經營者。另§8經銷者負連帶賠償（已盡注意可免責）、§9輸入者<b>視為</b>設計生產製造者負§7責任。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"消費者保護團體（§2⑥）","blank":"消費者保護團體：指以保護消費者為目的而___設立登記之___。","answer":"消費者保護團體：指以保護消費者為目的而<span class=\"key\">依法</span>設立登記之<span class=\"key\">法人</span>。","src":"消保法§2⑥","essay":0,"hot":0,"p":"消保團體不是隨便一個社團就算，必須是為了保護消費者的目的、而且依法設立登記的法人，才具備這個身分。","t":"關鍵字是「<b>依法設立登記之法人</b>」——未登記的團體或個人都不算。§27進一步限定<b>以社團法人或財團法人為限</b>。要提團體訴訟門檻更嚴（§49：許可設立2年以上、置有消費者保護專門人員、經行政院評定優良），別把「成為消保團體」和「能提訴訟」兩層門檻混在一起。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"定型化契約條款（§2⑦）★用字陷阱","blank":"定型化契約條款：指企業經營者為與___消費者（★法條用「多數」，不是「不特定多數」）訂立同類契約之用，___之契約條款。定型化契約條款___書面，以放映字幕、張貼、牌示、網際網路或其他方法表示者亦屬之。","answer":"定型化契約條款：指企業經營者為與<span class=\"key\">多數</span>消費者（★法條用「多數」，不是「不特定多數」）訂立同類契約之用，<span class=\"key\">所提出預先擬定</span>之契約條款。定型化契約條款<span class=\"key\">不限於</span>書面，以放映字幕、張貼、牌示、網際網路或其他方法表示者亦屬之。","src":"消保法§2⑦（考古題101-11）","essay":1,"hot":1,"p":"業者事先印好、準備拿來跟一大堆客人簽同一種契約的條款，就是定型化契約條款。不是只有紙本才算，螢幕字幕、張貼公告、牌示、網頁上的也都算。","m":"「多數消費者、同類契約、預先擬定」","t":"法條用「<b>多數</b>消費者」，不是「<b>不特定多數人</b>」——後者是不動產廣告處理原則第二點對「廣告」的用語（使不特定多數人知悉），兩者差一個詞就選錯。又條款<b>不限於書面</b>，放映字幕、張貼、牌示、網際網路皆屬之；細則§12另補充：因字體、印刷致難以注意或辨識者不構成契約內容，但消費者得主張仍構成內容。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"個別磋商條款（§2⑧）","blank":"個別磋商條款：指契約當事人___而___之契約條款。（牴觸時依§15，定型化契約條款牴觸部分___）","answer":"個別磋商條款：指契約當事人<span class=\"key\">個別磋商</span>而<span class=\"key\">合意</span>之契約條款。（牴觸時依§15，定型化契約條款牴觸部分<span class=\"key\">無效</span>）","src":"消保法§2⑧、§15（考古題99-19、106-32、108-14）","essay":0,"hot":1,"p":"契約裡雙方真的坐下來一條一條談出來、達成合意的，就是個別磋商條款。它和業者事先印好的定型化條款打架時，談出來的那條勝出。","m":"「個別磋商贏定型化，牴觸部分無效」","t":"§15無效的是<b>定型化契約條款</b>那一方，不是個別磋商條款，方向寫反就錯；而且只有<b>牴觸的「部分」</b>無效，不是整份契約無效。整份契約的命運看§16：除去該部分後契約仍可成立者，其他部分仍有效；但對當事人一方<b>顯失公平者，該契約全部無效</b>。","qk":["114-25","113-21","111-11","111-16","109-21","108-14","108-15","106-32","104-31","103-28","101-11","101-15","101-22","99-19"],"esl":[],"qkind":"art"},{"term":"定型化契約（§2⑨）","blank":"定型化契約：指以企業經營者提出之定型化契約條款作為契約內容之___而訂立之契約。","answer":"定型化契約：指以企業經營者提出之定型化契約條款作為契約內容之<span class=\"key\">全部或一部</span>而訂立之契約。","src":"消保法§2⑨","essay":0,"hot":0,"p":"整份契約只要有一部分是用業者提出的定型化條款組成的，這份契約就叫定型化契約，不必全部條款都是制式的才算。","t":"定義寫「<b>全部或一部</b>」，所以契約中夾雜幾條手寫磋商條款，整份仍是定型化契約，審閱期與公平性審查照樣適用。要分清三個名詞：定型化契約<b>條款</b>（§2⑦）、<b>個別磋商</b>條款（§2⑧）、定型化<b>契約</b>（§2⑨），考試最愛把三者的定義敘述互換。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"通訊交易（§2⑩）","blank":"通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於___下而與企業經營者所訂立之契約。","answer":"通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於<span class=\"key\">未能檢視商品或服務</span>下而與企業經營者所訂立之契約。","src":"消保法§2⑩（考古題110-16）","essay":0,"hot":1,"p":"沒看到實物就下單的交易。透過電視購物、電話、型錄、報紙、網路等方式，消費者在「未能檢視商品或服務」的情況下訂約，就是通訊交易。","m":"「未能檢視商品或服務，才是通訊交易」","t":"關鍵不在用什麼工具，而在「消費者於<b>未能檢視商品或服務下</b>」訂約；先到店裡看過實物再用網路下單，就不符定義。這一點直接決定§19的7日解除權能不能用——不動產買賣通常已實地看屋、面對面簽約，原則不適用。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"訪問交易（§2⑪）★關鍵字","blank":"訪問交易：指企業經營者___而與消費者在其___、___、___或其他場所所訂立之契約。","answer":"訪問交易：指企業經營者<span class=\"key\">未經邀約</span>而與消費者在其<span class=\"key\">住居所</span>、<span class=\"key\">工作場所</span>、<span class=\"key\">公共場所</span>或其他場所所訂立之契約。","src":"消保法§2⑪（考古題104-31、111-11）","essay":0,"hot":1,"p":"業者沒被邀請就主動找上門推銷並簽約。地點不限於家裡，辦公室、路邊、任何場所都算，重點是「未經邀約」這四個字。","m":"「未經邀約就上門；住居所、工作場所、公共場所都算」","t":"核心關鍵字是「<b>未經邀約</b>」——若是消費者自己打電話請業者來估價、說明後簽約，就不是訪問交易，也沒有7日解除權。地點<b>不限住居所</b>，選項寫成「限於消費者住居所」即為錯誤。另舊法稱「訪問買賣」，現行法已改為「<b>訪問交易</b>」並涵蓋服務。","qk":["114-25","111-11","111-16","109-21","108-15","104-31","103-28","101-11","101-15"],"esl":[],"qkind":"art"},{"term":"分期付款（§2⑫）","blank":"分期付款：指買賣契約約定消費者支付___，餘款分期支付，而企業經營者於___時，交付標的物與消費者之交易型態。（§21 未載利率者按現金交易價格週年利率___計算）","answer":"分期付款：指買賣契約約定消費者支付<span class=\"key\">頭期款</span>，餘款分期支付，而企業經營者於<span class=\"key\">收受頭期款</span>時，交付標的物與消費者之交易型態。（§21 未載利率者按現金交易價格週年利率<span class=\"key\">百分之五</span>計算）","src":"消保法§2⑫、§21","essay":0,"hot":0,"p":"先付頭期款、尾款分期慢慢還，而且業者在收到頭期款的當下就把東西交給你，這種才叫消保法上的分期付款。","m":"「收頭期款即交付標的物；沒寫利率，週年利率百分之五」","t":"定義要素是「<b>收受頭期款時交付標的物</b>」——先付清才交貨的不算。§21要求契約<b>應以書面為之</b>並載明三項：頭期款、各期價款與其他附加費用合計之總價款與現金交易價格之差額、<b>利率</b>。未記載利率者按<b>現金交易價格週年利率百分之五</b>計算；違反第一、二款者，消費者不負現金交易價格以外價款之給付義務。","qk":["114-5","114-25","111-11","111-14","111-16","109-10","109-21","108-15","105-23","104-31","103-28","103-31","101-9","101-11"],"esl":[],"qkind":"art"},{"term":"審閱期（§11-1）","blank":"訂立定型化契約前，應有___以內之合理期間供消費者審閱；以定型化契約條款使消費者拋棄審閱權者___；違反者該條款不構成___，但___。","answer":"訂立定型化契約前，應有<span class=\"key\">30日</span>以內之合理期間供消費者審閱；以定型化契約條款使消費者拋棄審閱權者<span class=\"key\">無效</span>；違反者該條款不構成<span class=\"key\">契約之內容</span>，但<span class=\"key\">消費者得主張該條款仍構成契約之內容</span>。","src":"消保法§11-1","essay":0,"hot":1,"p":"簽制式契約前，業者要給你一段時間把契約帶回去看清楚。這段時間是三十日以內的合理期間，而且不能用契約條款叫你拋棄這個權利。","m":"「三十日以內合理期間，拋棄無效」","t":"條文是「<b>三十日以內</b>之合理期間」——是上限不是一律三十日，寫成「至少三十日」或「應有三十日」就錯。違反的效果很特別：該條款「<b>不構成契約之內容</b>」，但<b>消費者得主張該條款仍構成契約之內容</b>（單向有利於消費者）。別和§19的7日解除權、§43的15日申訴處理期混。","qk":["111-21","109-19","104-33","101-10","99-15"],"esl":[],"qkind":"art"},{"term":"應記載／不得記載事項（§17）","blank":"中央主管機關得選擇特定行業，擬訂定型化契約___或___事項，報請___核定後公告。","answer":"中央主管機關得選擇特定行業，擬訂定型化契約<span class=\"key\">應記載</span>或<span class=\"key\">不得記載</span>事項，報請<span class=\"key\">行政院</span>核定後公告。","src":"消保法§17（申論106年二）","essay":1,"hot":0,"p":"針對特定行業（例如預售屋買賣），中央主管機關可以事先訂好契約裡一定要寫什麼、絕對不能寫什麼，報請行政院核定後公告，業者就得照著用。","m":"「中央擬訂、行政院核定、公告實施」","t":"流程三步驟缺一不可：中央主管機關「<b>擬訂</b>」→報請「<b>行政院核定</b>」→「<b>公告</b>」，選項若寫由行政院擬訂、或由直轄市縣市政府公告就是錯。中央主管機關依§6是「<b>目的事業主管機關</b>」，不動產類即內政部，不是消保處。又§17Ⅵ：企業經營者使用定型化契約者，主管機關得<b>隨時派員查核</b>。","qk":["114-11","112-21","111-13","111-22","106-27","101-22","100-31"],"esl":[["106-二","es-fw21"]],"qkind":"art"},{"term":"公告事項效力（§17）","blank":"違反公告不得記載事項之條款___；公告應記載事項雖未記載於契約，仍___契約內容。","answer":"違反公告不得記載事項之條款<span class=\"key\">無效</span>；公告應記載事項雖未記載於契約，仍<span class=\"key\">構成</span>契約內容。","src":"消保法§17Ⅳ、Ⅴ","essay":0,"hot":1,"p":"公告的「不得記載事項」業者偏要寫進契約，那一條無效；公告的「應記載事項」業者故意不寫，法律直接當作已經寫進去了，照樣要履行。","m":"「不得記載者無效、應記載者視同已載」","t":"兩個方向的效果常被對調：違反公告者「<b>條款無效</b>」，應記載而未記載者「<b>仍構成契約之內容</b>」。又條款無效後整份契約的效力依<b>§16</b>判斷（除去後仍可成立者其他部分有效，顯失公平者全部無效），不是整份契約當然無效。民事無效與§56-1的行政罰是<b>並行</b>的，不是二擇一。","qk":["114-11","112-21","111-13","111-22","106-27","101-22","100-31"],"esl":[],"qkind":"art"},{"term":"顯失公平（§12）","blank":"條款違反___原則對消費者顯失公平者無效；推定顯失公平：違反___原則、與任意規定立法意旨顯相矛盾、契約主要權利義務受限制致___難以達成。","answer":"條款違反<span class=\"key\">誠信</span>原則對消費者顯失公平者無效；推定顯失公平：違反<span class=\"key\">平等互惠</span>原則、與任意規定立法意旨顯相矛盾、契約主要權利義務受限制致<span class=\"key\">契約目的</span>難以達成。","src":"消保法§12","essay":0,"hot":0,"p":"制式條款寫得太偏袒業者、違反誠信原則而對消費者顯失公平的，無效。法律還列了三種情形，只要符合就先「推定」顯失公平，由業者去舉反證。","m":"「平等互惠、立法意旨、目的難達成，三推定」","t":"是「<b>推定</b>」顯失公平，不是「視為」——推定可舉證推翻，視為不行，這一字之差最常被考。三款要背熟：違反<b>平等互惠</b>原則、與所排除不予適用之<b>任意規定立法意旨顯相矛盾</b>、契約<b>主要權利義務</b>受限制致契約目的難以達成。細則§13、§14另補充判斷標準與四種違反平等互惠的情形。","qk":["113-21","111-14","111-21","106-26","104-33","101-22","99-18"],"esl":[],"qkind":"art"},{"term":"解釋與個別磋商（§11、15）","blank":"定型化契約條款如有疑義，應為有利於___之解釋；個別磋商條款牴觸定型化條款者，___部分無效。","answer":"定型化契約條款如有疑義，應為有利於<span class=\"key\">消費者</span>之解釋；個別磋商條款牴觸定型化條款者，<span class=\"key\">定型化條款</span>部分無效。","src":"消保法§11、§15","essay":0,"hot":0,"p":"制式條款看不懂、有兩種解釋空間時，要往對消費者有利的方向解釋；而雙方另外談好的個別磋商條款，效力高於制式條款。","m":"「有疑義利消費者；個別磋商贏定型化」","t":"§11Ⅱ的前提是「<b>如有疑義時</b>」——條款文義清楚明確時，不能硬要做有利消費者的解釋。§11Ⅰ另規定定型化契約條款應本「<b>平等互惠原則</b>」，這個原則同時是§12Ⅱ①推定顯失公平的判準。§15無效的是<b>定型化條款的牴觸部分</b>，不是個別磋商條款，也不是全部無效。","qk":["113-21","111-21","109-19","108-14","106-32","104-33","101-10","101-22","99-15","99-19"],"esl":[],"qkind":"art"},{"term":"七日解除權（§19）","blank":"通訊交易、訪問交易消費者得於收受商品或接受服務後___內，以___方式解除契約，無須說明理由及負擔任何費用或對價；但通訊交易有___者，不在此限。一般不動產買賣因面對面、實地看屋，原則___適用。","answer":"通訊交易、訪問交易消費者得於收受商品或接受服務後<span class=\"key\">7日</span>內，以<span class=\"key\">退回商品或書面通知</span>方式解除契約，無須說明理由及負擔任何費用或對價；但通訊交易有<span class=\"key\">合理例外情事</span>者，不在此限。一般不動產買賣因面對面、實地看屋，原則<span class=\"key\">不</span>適用。","src":"消保法§19","essay":0,"hot":0,"p":"網購或被推銷上門簽的約，可以在收到商品或接受服務後七天內反悔，直接退回商品或寄書面通知就好，不用說明理由，也不必負擔任何費用或對價。","m":"「收受後七日，退貨或書面，無須理由無須費用」","t":"七日是<b>解除權</b>的行使期間，不是「鑑賞期」「猶豫期」這種俗稱。通訊交易有<b>行政院所定合理例外情事</b>者不適用。§19Ⅲ特別規定：業者未依§18Ⅰ③告知解除權資訊者，七日自<b>提供之次日</b>起算，但自原七日期間起算<b>已逾四個月者解除權消滅</b>。§19Ⅳ消費者已交運商品或發出書面即視為解除（發信主義）。","qk":["114-6","110-16","109-9","106-31","103-5","102-31"],"esl":[],"qkind":"art"},{"term":"廣告真實義務（§22-23）","blank":"企業經營者對消費者所負義務不得___廣告內容；媒體經營者明知或可得而知與事實不符，與企業經營者負___責任。","answer":"企業經營者對消費者所負義務不得<span class=\"key\">低於</span>廣告內容；媒體經營者明知或可得而知與事實不符，與企業經營者負<span class=\"key\">連帶</span>責任。","src":"消保法§22、§23（申論109年一）","essay":1,"hot":0,"p":"廣告說了什麼，業者就得做到——廣告內容直接變成契約義務的最低標準；而刊登或報導廣告的媒體如果明知或可得而知廣告與事實不符還照登，要和業者一起賠。","m":"「義務不得低於廣告；媒體明知可得而知就連帶」","t":"§22是「所負義務<b>不得低於</b>廣告之內容」，不是一律以契約文字為準。§23媒體連帶責任的主觀要件是「<b>明知或可得而知</b>」，且該責任<b>不得預先約定限制或拋棄</b>。注意消保法細則§23的廣告定義用「可使<b>多數人</b>知悉」，廣告處理原則第二點用「<b>不特定多數人</b>」。","qk":["113-9","112-20","109-20","108-3","107-12","106-27","105-21","103-30"],"esl":[["109-一","es-fw24"]],"qkind":"art"},{"term":"懲罰性賠償金（§51）","blank":"懲罰性賠償金：故意___倍以下、重大過失___倍以下、過失___倍以下。","answer":"懲罰性賠償金：故意<span class=\"key\">5</span>倍以下、重大過失<span class=\"key\">3</span>倍以下、過失<span class=\"key\">1</span>倍以下。","src":"消保法§51（申論108年一）","essay":1,"hot":1,"p":"業者害你受損，除了實際損害之外還可以依它的過錯程度再多要一筆懲罰性賠償金：故意最多五倍、重大過失三倍、一般過失一倍。","m":"「故意五、重過三、過失一」","t":"三個倍數最容易被打亂，也最容易和公平法§31「故意行為不超過已證明損害額<b>三倍</b>」混。倍數算的是<b>損害額</b>，而且都是「<b>以下</b>」，法院可判更低。另注意必須是「<b>依本法所提之訴訟</b>」才能請求；§10-1規定企業經營者對消費者或第三人的損害賠償責任<b>不得預先約定限制或免除</b>。","qk":["109-8","104-15","101-7"],"esl":[["108-一","es-fw02"]],"qkind":"art"},{"term":"違反公告罰則（§56-1）","blank":"違反應記載／不得記載事項公告，限期改正屆期不改正，處___；再次令限期改正仍不改正，處___並得按次處罰。","answer":"違反應記載／不得記載事項公告，限期改正屆期不改正，處<span class=\"key\">3萬以上30萬以下</span>；再次令限期改正仍不改正，處<span class=\"key\">5萬以上50萬以下</span>並得按次處罰。","src":"消保法§56-1","essay":0,"hot":0,"p":"業者使用的定型化契約違反公告的應記載或不得記載事項，不會馬上開罰：要先令其限期改正，逾期不改才罰；再給一次機會仍不改，金額加重並得按次處罰。","m":"「先改正；不改三到三十萬，再不改五到五十萬」","t":"兩階段金額常被對調，而且<b>兩段都以「經令限期改正而屆期不改正」為前提</b>——不是一違反就罰。別跟§56（違反§24標示、§25保證書、§26包裝）的2萬～20萬、§57（規避調查）的3萬～30萬混。違反公告在民事上另依§17Ⅳ使條款無效，行政罰與民事無效<b>並行</b>。","qk":[],"esl":[],"qkind":""},{"term":"調解委員會與異議","blank":"消費爭議調解委員會委員人數為___名；調解方案異議期限為___日。","answer":"消費爭議調解委員會委員人數為<span class=\"key\">7至21</span>名；調解方案異議期限為<span class=\"key\">10</span>日。","src":"消保法§45（委員7至21名）、§45-3及§45-5（異議10日）","essay":2,"hot":1,"p":"跟業者談不攏可以向直轄市、縣市政府的消費爭議調解委員會聲請調解；委員會置委員七到二十一名，對調解委員提出的解決方案不服，要在十天內提出異議。","m":"「委員七到二十一，異議十日不變期間」","t":"10日是「<b>不變期間</b>」，逾期未異議即「<b>視為已依該方案成立調解</b>」。一般爭議（§45-3）提異議者<b>視為調解不成立</b>；小額爭議（§45-5）異議後另定期日仍無正當理由不到場，<b>反而視為成立調解</b>，效果相反。職權方案門檻也不同：一般須「<b>參與</b>調解委員」過半數，小額須「<b>全體</b>調解委員」過半數。","qk":["108-18","105-22","99-22"],"esl":[],"qkind":"art"},{"term":"消保團體訴訟","blank":"消保團體須許可設立___年以上、置有___，且申請行政院___者，始得以自己名義提起訴訟，並應___代理訴訟；受讓損害賠償請求權之消費者人數須___人以上。","answer":"消保團體須許可設立<span class=\"key\">2</span>年以上、置有<span class=\"key\">消費者保護專門人員</span>，且申請行政院<span class=\"key\">評定優良</span>者，始得以自己名義提起訴訟，並應<span class=\"key\">委任律師</span>代理訴訟；受讓損害賠償請求權之消費者人數須<span class=\"key\">20</span>人以上。","src":"消保法§49、§50","essay":0,"hot":0,"p":"受害的消費者人多但每人金額小時，可以把損害賠償請求權讓給消保團體，由團體出面打官司。但不是每個團體都能告，資格、律師、受讓人數都有門檻。","m":"「設立二年、評定優良、律師代理、受讓二十人」","t":"三個資格要件缺一不可：<b>許可設立2年以上</b>、置有消費者保護專門人員、<b>經行政院評定優良</b>，且「<b>應</b>委任律師代理訴訟」為強制。20人是受讓請求權的消費者人數；事後有人終止讓與致<b>不足20人，不影響其訴訟權能</b>。另§52標的價額逾60萬元者，超過部分免繳裁判費。","qk":["112-22","110-15","108-19","107-13","105-27","104-13","103-25","103-26","103-29","102-29","100-39","99-25","99-38"],"esl":[],"qkind":"art"},{"term":"申訴與返還期限","blank":"企業經營者對申訴應於申訴之日起___內妥適處理；通訊交易書面解除契約，應於收到通知次日起15日內___，並於取回商品、收到退回商品或解除服務契約通知之次日起___內___對價；未經要約寄送之商品，經定相當期限通知取回而逾期未取回者視為拋棄，未通知者亦須寄送後逾___未經消費者___而仍不取回，始視為拋棄。","answer":"企業經營者對申訴應於申訴之日起<span class=\"key\">15日</span>內妥適處理；通訊交易書面解除契約，應於收到通知次日起15日內<span class=\"key\">取回商品</span>，並於取回商品、收到退回商品或解除服務契約通知之次日起<span class=\"key\">15日</span>內<span class=\"key\">返還</span>對價；未經要約寄送之商品，經定相當期限通知取回而逾期未取回者視為拋棄，未通知者亦須寄送後逾<span class=\"key\">1個月</span>未經消費者<span class=\"key\">表示承諾</span>而仍不取回，始視為拋棄。","src":"消保法§43Ⅱ、§19-2、§20Ⅱ","essay":0,"hot":0,"p":"消保法裡有好幾個十五天：業者收到消費者申訴要在十五天內妥適處理；通訊交易以書面解約後，業者十五天內去取回商品，再十五天內把錢還給消費者。","m":"「申訴十五、取貨十五、退錢十五；未訂購寄送逾一個月視為拋棄」","t":"三個15日<b>起算點不同</b>：申訴自「<b>接獲申訴之日</b>」起算（細則§36）；取回商品自收到解除通知之「<b>次日</b>」起算；返還對價自取回商品、收到退回商品或解除服務契約通知之「<b>次日</b>」起算。§20未通知者，須寄送後逾<b>1個月</b>未經消費者表示承諾且仍不取回，才視為拋棄。","qk":["114-6","111-15","110-16","109-9","109-20","108-16","106-28","106-31","105-24","104-12","103-5","102-27","102-31","101-19"],"esl":[],"qkind":"art"},{"term":"企業經營者責任：無過失「得減輕」★陷阱","blank":"設計、生產、製造者違反安全性義務→應負___賠償責任；能證明其無過失者，法院___其賠償責任（§7Ⅲ）；經銷者對於損害之防免已盡___者，不負連帶責任（§8Ⅰ但書）；輸入者___設計、生產、製造者，負§7製造者責任（§9）。","answer":"設計、生產、製造者違反安全性義務→應負<span class=\"key\">連帶</span>賠償責任；能證明其無過失者，法院<span class=\"key\">得減輕</span>其賠償責任（§7Ⅲ）；經銷者對於損害之防免已盡<span class=\"key\">相當之注意</span>者，不負連帶責任（§8Ⅰ但書）；輸入者<span class=\"key\">視為</span>設計、生產、製造者，負§7製造者責任（§9）。","src":"消保法§7、§8、§9（逐字要旨）","essay":0,"hot":0,"qk":["103-24","105-26","105-30","106-24","108-17","110-18","109-22","mk-14"],"esl":[],"qkind":"","m":"製造無過失只減輕，經銷盡注意可免責，輸入視同製造〔自編〕","t":"極高頻偷換：「得減輕」被改成「得免除」「無須負責」「得減輕或免除」；把§8 經銷商的免責事由套到製造者或輸入者身上。","mcx":["103-24","105-26","105-30","106-24","108-17","110-18","109-22","mk-14"]},{"term":"品質保證書應載明事項★陷阱","blank":"企業經營者保證品質時應主動出具書面保證書，載明：①名稱、種類、數量（有製造號碼或批號者載明）②保證之___③保證期間及其___④製造商之名稱、地址⑤由經銷商售出者，經銷商之名稱、地址⑥___（§25）。","answer":"企業經營者保證品質時應主動出具書面保證書，載明：①名稱、種類、數量（有製造號碼或批號者載明）②保證之<span class=\"key\">內容</span>③保證期間及其<span class=\"key\">起算方法</span>④製造商之名稱、地址⑤由經銷商售出者，經銷商之名稱、地址⑥<span class=\"key\">交易日期</span>（§25）。","src":"消保法§25（逐字要旨）","essay":0,"hot":0,"qk":["100-30","102-26","106-29"],"esl":[],"qkind":"","t":"是「<b>交易日期</b>」不是「製造日期」；沒有「產品責任險金額」「服務之對象」。","mcx":["100-30","102-26","106-29"]},{"term":"消保團體：組織型態與任務★陷阱","blank":"消費者保護團體以___為限（§27）；任務為調查、比較、研究、發表、接受___調解、提起消費訴訟、___政府與企業採取保護措施等（§28）。","answer":"消費者保護團體以<span class=\"key\">社團法人或財團法人</span>為限（§27）；任務為調查、比較、研究、發表、接受<span class=\"key\">申訴</span>調解、提起消費訴訟、<span class=\"key\">建議</span>政府與企業採取保護措施等（§28）。","src":"消保法§27、§28（逐字要旨）","essay":0,"hot":0,"qk":["104-34","112-25"],"esl":[],"qkind":"","t":"不含行政法人；消保團體只能建議、申訴調解、提起訴訟，沒有命企業經營者<b>回收商品</b>的公權力，也不能指揮消保官。","mcx":["104-34","112-25"]},{"term":"調解方案門檻：一般 vs 小額★陷阱","blank":"一般調解方案：經___調解委員過半數之同意（§45-2）；小額消費爭議一造無正當理由不到場：經___調解委員過半數之同意（§45-4），其送達不適用___。","answer":"一般調解方案：經<span class=\"key\">參與</span>調解委員過半數之同意（§45-2）；小額消費爭議一造無正當理由不到場：經<span class=\"key\">全體</span>調解委員過半數之同意（§45-4），其送達不適用<span class=\"key\">公示送達</span>。","src":"消保法§45-2、§45-4（逐字要旨）","essay":0,"hot":0,"qk":["110-19"],"esl":[],"qkind":"","t":"一般看「參與」、小額看「全體」，兩個「過半數」互換是常見陷阱。","mcx":["110-19"]}]},{"id":"S1","label":"S1 申論・經紀業設立、人員與保證金","stat":"","cards":[{"term":"經紀業定義、開業要件與非法經營","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">經紀業＝依本條例經營仲介或代銷業務之___（不是「人」）；<br>仲介業務成立不以___為要件，也不以設立公司為前提。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§5Ⅰ 經營經紀業應先經主管機關___；<br>§7 辦妥公司或商業登記、加入___、繳存___後，___內開始營業（有正當理由得展延一次，以___為限）；<br>§32Ⅰ 非經紀業而經營→禁止營業＋___罰鍰。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">開業四要件：許可、登記、入會、保證金，缺一不可；<br>逾期未開業由主管機關___許可；<br>僱用無資格者→§29 罰___；<br>禁止營業處分後仍繼續營業，才有___（§32Ⅱ）。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">四要件依序寫、6個月開業；<br>無照經營看§32，有照經紀業違規看___。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">許可與入會兩道門把關，市場上的經紀業才___。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">經紀業＝依本條例經營仲介或代銷業務之<span class=\"key\">公司或商號</span>（不是「人」）；<br>仲介業務成立不以<span class=\"key\">收取報酬</span>為要件，也不以設立公司為前提。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§5Ⅰ 經營經紀業應先經主管機關<span class=\"key\">許可</span>；<br>§7 辦妥公司或商業登記、加入<span class=\"key\">同業公會</span>、繳存<span class=\"key\">營業保證金</span>後，<span class=\"key\">6個月</span>內開始營業（有正當理由得展延一次，以<span class=\"key\">3個月</span>為限）；<br>§32Ⅰ 非經紀業而經營→禁止營業＋<span class=\"key\">10–30萬</span>罰鍰。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">開業四要件：許可、登記、入會、保證金，缺一不可；<br>逾期未開業由主管機關<span class=\"key\">廢止</span>許可；<br>僱用無資格者→§29 罰<span class=\"key\">6–30萬</span>；<br>禁止營業處分後仍繼續營業，才有<span class=\"key\">刑責</span>（§32Ⅱ）。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">四要件依序寫、6個月開業；<br>無照經營看§32，有照經紀業違規看<span class=\"key\">§29</span>。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">許可與入會兩道門把關，市場上的經紀業才<span class=\"key\">值得信賴</span>。</div></div>","src":"經紀業條例§4、§5、§7、§17、§29、§32","essay":2,"esl":[["102-二","es-fw14"],["103-一","es-fw15"]],"qk":[],"es5":[["102-二","es-fw14","es-fw14"],["103-一","es-fw15","es-fw15"],["模一","es-mk1","es-mk1"]],"m":"許・登・會・營〔自編〕"},{"term":"不得申請經營經紀業之事由","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">消極資格擋掉有___疑慮或曾嚴重違規者。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§6Ⅰ③：犯詐欺、背信、侵占等罪，經受有期徒刑___刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿___；<br>④受感訓處分尚未執行完畢或執行完畢後未滿3年；<br>⑤經撤銷或廢止許可，自撤銷或廢止之日起未滿___；<br>⑦廢止經紀人員證書或證明處分未滿___。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">撤銷或廢止許可的5年，逾期___或自行停止業務者不在此限；<br>緩刑者除外。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">刑與感訓看3年，撤廢許可與證書看5年；<br>撤銷、廢止不可___。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">把關負責人的過去，就是替消費者守住___。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">消極資格擋掉有<span class=\"key\">誠信</span>疑慮或曾嚴重違規者。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§6Ⅰ③：犯詐欺、背信、侵占等罪，經受有期徒刑<span class=\"key\">1年以上</span>刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿<span class ass=\"esc\">§22Ⅰ 三情形：①積欠費用經強制執行後再度積欠達區分所有權總價<span class=\"key\">1%</span>②違反條例經罰鍰後仍不改善或<span class=\"key\">續犯</span>③違反法令或規約情節重大；<br>§21 積欠逾<span class=\"key\">二期</span>或達相當金額，定期催告仍不給付→訴請給付。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">管委會<span class=\"key\">促請改善</span>，<span class=\"key\">3個月</span>內未改善→依<span class=\"key\">區權會決議</span>訴請法院強制遷離；<br>區權人→訴請命其出讓區分所有權及其基地所有權應有部分，判決確定後<span class=\"key\">3個月</span>內不出讓→聲請法院拍賣。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">拍賣所得就積欠應分擔費用部分，受償順序與<span class=\"key\">第一順位抵押權</span>同；<br>承租人只能遷離、不能命出讓。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">層層升級、法院把關，兼顧<span class=\"key\">財產權</span>與社區安寧。</div></div>","src":"公寓§21、§22","essay":2,"esl":[["107-一","es-fw22"],["112-二","es-fw05"]],"qk":[],"es5":[["107-一","es-fw22","es-fw22"],["112-二","es-fw05","es-fw05"],["模四","es-mk4","es-mk4"],["E4","es-e4","es-e4"]],"m":"百分之一、三個月、三個月〔自編〕"},{"term":"公寓大廈重建","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">重建涉及重大財產處分，原則須___同意。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§13 原則：全體區權人及基地所有權人、___或典權人同意；<br>但書三款不在此限：①配合___計畫②嚴重毀損、傾頹或朽壞，有危害公共安全___③地震、水災、風災、火災或其他重大事變，肇致___（第3款無「之虞」）。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">§14 限§13第2、3款情形，經區權會決議重建，不同意又不出讓或同意後不履行→管委會得訴請法院命其___；<br>受讓人___同意重建。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">原則全體同意；<br>§14 強制出讓只適用第___款，不含都更；<br>不是___原則。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">少數不能卡住公共安全，但以___代替剝奪，權益仍有保障。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">重建涉及重大財產處分，原則須<span class=\"key\">全體</span>同意。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§13 原則：全體區權人及基地所有權人、<span class=\"key\">地上權人</span>或典權人同意；<br>但書三款不在此限：①配合<span class=\"key\">都市更新</span>計畫②嚴重毀損、傾頹或朽壞，有危害公共安全<span class=\"key\">之虞</span>③地震、水災、風災、火災或其他重大事變，肇致<span class=\"key\">危害公共安全</span>（第3款無「之虞」）。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">§14 限§13第2、3款情形，經區權會決議重建，不同意又不出讓或同意後不履行→管委會得訴請法院命其<span class=\"key\">出讓</span>；<br>受讓人<span class=\"key\">視為</span>同意重建。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">原則全體同意；<br>§14 強制出讓只適用第<span class=\"key\">2、3</span>款，不含都更；<br>不是<span class=\"key\">多數決</span>原則。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">少數不能卡住公共安全，但以<span class=\"key\">出讓</span>代替剝奪，權益仍有保障。</div></div>","src":"公寓§13、§14","essay":1,"esl":[["99-二","es-fw08"]],"qk":[],"es5":[["99-二","es-fw08","es-fw08"]]},{"term":"約定共用、約定專用與規約","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">約定共用＝___經約定供共同使用；<br>約定專用＝___經約定供特定區權人使用；<br>規約＝經___決議之共同遵守事項。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§23Ⅱ 約定專用、約定共用之範圍及使用主體，非經載明於規約者，___；<br>§24 繼受人繼受前可___規約，繼受後須遵守；<br>§33③ 已成立之約定專用部分變更須經___同意。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">區權會___逕行決議變更約定專用；<br>例外：顯違___並經法院判決確定；<br>§56 規約草約經承受人簽署同意，於區權會訂定規約前___規約。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">成敗繫於是否合法___於規約；<br>共用←專有、專用←共用，來源不可寫反。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">規約白紙黑字，社區自治才___。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">約定共用＝<span class=\"key\">專有部分</span>經約定供共同使用；<br>約定專用＝<span class=\"key\">共用部分</span>經約定供特定區權人使用；<br>規約＝經<span class=\"key\">區權會</span>決議之共同遵守事項。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§23Ⅱ 約定專用、約定共用之範圍及使用主體，非經載明於規約者，<span class=\"key\">不生效力</span>；<br>§24 繼受人繼受前可<spa  class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">公共空間不是私人倉庫，守住___就是守住生命。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">約定專用給的是專用<span class=\"key\">使用權</span>，不是所有權，也不改變空間的<span class=\"key\">法定用途</span>。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§15Ⅰ 依使用執照所載<span class=\"key\">用途</span>及規約使用，不得擅自變更；<br>§16Ⅱ 走廊、樓梯、<span class=\"key\">防空避難設備</span>等不得堆置雜物；<br>§17 危險營業應投保<span class=\"key\">公共意外責任險</span>，經催告7日仍未投保→管委會代為投保；<br>§58Ⅱ 起造人不得將法定停車空間讓售特定人。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">程序：管委會<span class=\"key\">制止</span>或按規約處理→不遵從者報請主管機關→§49Ⅰ 罰<span class=\"key\">4萬–20萬</span>並得連續處罰→仍不改善可依§22走強制遷離、出讓、拍賣。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">專用只是「專停」不是「專放」；<br>罰鍰是4–20萬，不是經紀業條例的<span class=\"key\">6–30萬</span>。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">公共空間不是私人倉庫，守住<span class=\"key\">逃生動線</span>就是守住生命。</div></div>","src":"公寓§3④⑤、§9Ⅱ、§15、§16、§17、§49Ⅰ、§58Ⅱ","essay":0,"esl":[],"qk":[],"es5":[["E10","es-e10","es-e10"],["E11","es-e11","es-e11"]],"m":"專用只是「專停」，不是「專放」〔自編〕"}]},{"id":"S5","label":"S5 申論・公平交易法","stat":"","cards":[{"term":"聯合行為：公會決議與許可","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">聯合行為＝事業共同決定價格等、___事業活動；<br>同業公會藉___約束會員亦屬之。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§15 原則___，例外有益整體經濟與公共利益並經___（法定八款）；<br>主管機關___內決定，可延長一次；<br>§16 許可期限不逾___，屆滿前3至6個月申請延展，每次不逾5年。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">公會決議收費不得低於下限＝共同決定___；<br>無法定事由也未申請許可→___聯合行為，可令停止、改正或處罰鍰。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">原則禁、許可例外；<br>期限5年不是___（舊制）。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">價格由市場競爭決定，消費者才有___。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">聯合行為＝事業共同決定價格等、<span class=\"key\">相互約束</span>事業活動；<br>同業公會藉<span class=\"key\">決議</span>約束會員亦屬之。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§15 原則<span class=\"key\">禁止</span>，例外有益整體經濟與公共利益並經<span class=\"key\">許可</span>（法定八款）；<br>主管機關<span class=\"key\">3個月</span>內決定，可延長一次；<br>§16 許可期限不逾<span class=\"key\">5年</span>，屆滿前3至6個月申請延展，每次不逾5年。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">公會決議收費不得低於下限＝共同決定<span class=\"key\">價格</span>；<br>無法定事由也未申請許可→<span class=\"key\">違法</span>聯合行為，可令停止、改正或處罰鍰。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">原則禁、許可例外；<br>期限5年不是<span class=\"key\">3年</span>（舊制）。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">價格由市場競爭決定，消費者才有<span class=\"key\">選擇</span>。</div></div>","src":"公平法§14、§15、§16","essay":1,"esl":[["101-二","es-fw12"]],"qk":[],"es5":[["101-二","es-fw12","es-fw12"],["G1","es-g1","es-g1"]],"m":"聯合行為：原則禁、許可例外；三個月決定、五年許可〔自編〕"},{"term":"結合申報與獨占認定","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">獨占＝無競爭狀態或具___；<br>結合管制採___，避免過度集中。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§8 獨占基準：一事業___、二事業2/3、三事業___，個別未達___不列入；<br>§11 結合申報門檻任一：結合後市占達___、參與事業之一達___、或銷售額超過公告金額。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">申報後___內不得結合，延長不逾___；<br>違反仍結合罰___。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">門檻是「或」不是「且」；<br>工作日不是___。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">事先管控集中度，市場才保有___活力。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">獨占＝無競爭狀態或具<span class=\"key\">壓倒性地位</span>；<br>結合管制採<span class=\"key\">事先申報</span>，避免過度集中。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">§8 獨占基準：一事業<span class=\"key\">1/2</span>、二事業2/3、三事業<span class=\"key\">3/4</span>，個別未達<span class=\"key\">1/10</span>不列入；<br>§11 結合申報門檻任一：結合後市占達<span class=\"key\">1/3</span>、參與事業之一達<span class=\"key\">1/4</span>、或銷售額超過公告金額。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">申報後<span class=\"key\">30工作日</span>內不得結合，延長不逾<span class=\"key\">60工作日</span>；<br>違反仍結合罰<span class=\"key\">20萬–5000萬</span>。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">門檻是「或」不是「且」；<br>工作日不是<span class=\"key\">日曆日</span>。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">事先管控集中度，市場才保有<span class=\"key\">競爭</span>活力。</div></div>","src":"公平法§7、§8、§11","essay":0,"esl":[],"qk":[],"es5":[["G2","es-g2","es-g2"],["G3","es-g3","es-g3"]],"m":"一二、二三、三四〔自編〕"},{"term":"虛偽不實廣告與連帶責任","blank":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">§21 禁止對商品___等為虛偽不實或___之表示。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">廣告主：限期停止、改正，罰___，並負損害賠償；<br>廣告代理業、媒體業、___：___→與廣告主連帶賠償。</div></div><div class=\"esb e3\"><span class=\"esl\">問題核心</span><div class=\"esc\">非知名薦證者→以報酬___為限；<br>受害人得請求排除（§29）、損害賠償（§30）；<br>故意→不逾___（§31）。</div></div><div class=\"esb e4\"><span class=\"esl\">結論</span><div class=\"esc\">代理業不能以「依客戶指示製作」___；<br>本型適用公平法，不是經紀業條例6–30萬。</div></div><div class=\"esb e5\"><span class=\"esl\" title=\"卓見為自編收尾句，非法條\">結尾卓見</span><div class=\"esc\">廣告鏈上每一環都把關，___才無所遁形。</div></div>","answer":"<div class=\"esb e1\"><span class=\"esl\">問題定義</span><div class=\"esc\">§21 禁止對商品<span class=\"key\">內容</span>等為虛偽不實或<span class=\"key\">引人錯誤</span>之表示。</div></div><div class=\"esb e2\"><span class=\"esl\">法條定義</span><div class=\"esc\">廣告主：限期停止、改正，罰<span class=\"key\">5萬–2500萬</span>，並負損害賠償；<br>廣告代理業、媒體業、<span class=\"key\">薦證者</span>：<span class=\"key\">明知或可得而知</span>→與廣告主連帶賠償。</div></ /* 重點標示：條號／數字量詞／分數 → 半高黃底粗體；決定性法律效果詞 → 深黃。
   與《法條解析練習》同一套規則。文字已含 <b> 標籤，故只在標籤外的片段標。 */
var HL_N=/(?:§\s*\d+(?:\s*(?:之|-)\s*\d+)?(?:[ⅠⅡⅢⅣⅤⅥ]|第[一二三四五六七八九十]+項)?)|(?:第\s*[0-9一二三四五六七八九十百零]+\s*[條點](?:之[0-9一二三四五六七八九十]+)?(?:第[0-9一二三四五六七八九十]+項)?(?:第[0-9一二三四五六七八九十]+款)?)|(?:[一二三四五六七八九十]+分之[一二三四五六七八九十]+)|(?:\d+\s*\/\s*\d+)|(?:過半數|半數以上)|(?:[0-9一二三四五六七八九十]+\s*[至–-]\s*[0-9一二三四五六七八九十]+\s*(?:個月|小時|年|月|日|天|次|人|名|倍))|(?:(?:\d[\d,]*(?:\.\d+)?|[一二三四五六七八九十百千兩]+)\s*(?:個月|小時|年|月|日|天|次|人|名|倍|％|%|‰|萬元|億元|萬|億|元))/g;
var HL_K=/無效|不生效力|不構成契約之內容|視為|推定|連帶|撤銷|廢止|準用|不得|應/g;
/* v664：條號不上底色、不加框，改灰色一般字（使用者：法條條號不用框）；數字、期間、比例仍標黃 */
var ART_ONLY=/^(?:§|第\s*[0-9一二三四五六七八九十百零]+\s*[條點])/;
function hlSeg(t){
  return t.replace(HL_N,function(m){return ART_ONLY.test(m)?'<span class="art">'+m+'</span>':'<mark class="hi">'+m+'</mark>'});
}
function hlRich(html){
  // 只處理標籤之外的文字，避免把屬性值也標到
  return html.replace(/(<[^>]+>)|([^<]+)/g,function(_,tag,txt){
    return tag ? tag : hlSeg(txt);
  });
}
function pmtHtml(c){
  var h='';
  if(c.p) h+='<div class="an-sec an-plain"><b class="l">白話</b>'+hlRich(c.p)+'</div>';
  if(c.m) h+='<div class="an-sec an-mn"><b class="l">口訣</b><span class="mtx">'+hlRich(c.m)+'</span></div>';
  if(c.t) h+='<div class="an-sec an-trap"><b class="l">考試陷阱</b>'+hlRich(c.t)+'</div>';
  return h;
}

// ── 工具函式：把 blank 文字 與 answer HTML 配對，產生可點擊空格 ──
// blank 中的 ___ 為空格佔位，answer 中的 <span class="key">…</span> 為對應答案
// 兩者順序一致；額外 HTML（<br>、文字段落）原樣保留
function buildBlankLine(blankText, answerHtml, cardKey) {
  // 從 answer 中萃取 key 文字（按順序）
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(answerHtml)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  // 把 ___ 換成可點擊 span
  const html = blankText.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const idx = ki;
    ki++;
    // 按答案字數生成底線（每字一個＿，最少2個）
    const plainAns = ans.replace(/<[^>]+>/g,'');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-key="${cardKey}" data-idx="${idx}" onclick="toggleBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val">${ans}</span></span>`;
  });
  return html;
}

/* 條號連到全國法規資料庫；「條例／細則」依章節判斷是經紀業還是公寓大廈 */
const LAWPC={'不動產經紀業管理條例':'D0060066','經紀業條例':'D0060066','管理條例':'D0060066','施行細則':'D0060068','細則':'D0060068','條例':'D0060066','公寓大廈管理條例':'D0070118','公寓大廈施行細則':'D0070119','公寓大廈':'D0070118','公寓':'D0070118','公平交易法':'J0150002','公平法':'J0150002','消費者保護法':'J0170001','消保法':'J0170001','平均地權條例':'D0060009','民法':'B0000001'};
const LAWKEYS=Object.keys(LAWPC).sort(function(a,b){return b.length-a.length});
function srcHtml(t,chId){var ef=/^[EF]/.test(chId||'');var cur=null;return String(t).replace(/([一-龥]*)§(\d+)(?:(-|之)(\d+))?/g,function(m,nm,no,sp,sub){if(nm){cur=null;for(var i=0;i<LAWKEYS.length;i++){var k=LAWKEYS[i];if(nm.slice(-k.length)===k){cur=LAWPC[k];if(ef&&(k==='條例'||k==='管理條例'))cur='D0070118';if(ef&&(k==='施行細則'||k==='細則'))cur='D0070119';break}}}
if(!cur)return m;var fl=no,tail='';if(sub){if(sp==='-'&&+sub>+no){tail='-'+sub}else fl=no+'-'+sub}return nm+'<a class="lawlk" target="_blank" rel="noopener" href="https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode='+cur+'&flno='+fl+'">§'+no+(sub&&!tail?sp+sub:'')+'</a>'+tail})}
const QZ='%E7%B6%93%E7%B4%80%E6%B3%95%E8%A6%8F_%E6%B3%95%E6%A2%9D%E8%A7%A3%E6%9E%90%E7%B7%B4%E7%BF%92.html';
const HUBP='%E7%B6%93%E7%B4%80%E6%B3%95%E8%A6%8F_%E5%82%99%E8%80%83%E6%8C%87%E6%8F%AE%E4%B8%AD%E5%BF%83.html';
function statOf(c, chStat){
  // 第一行：這張卡自己的數字（考古題幾題、申論哪幾年），不是整章的
  const a=[];
  const qk=c.qk||[];
  /* 標籤依實際考古題算：99～114 共 16 個年度，≥5 個年度考過才標高頻；115 年新修正的卡不可能有歷屆紀錄 */
  const yrs=new Set(qk.map(function(x){return x.split('-')[0]})).size;
  if(/115/.test(c.term)) a.push('<strong class="st-new">115 年新修正（歷屆還沒考過）</strong>');
  else if(yrs>=5) a.push('<strong class="st-hot">高頻：16 年中 '+yrs+' 個年度考過</strong>');
  if(qk.length){
    const lab = c.qkind==='art' ? '本條考過' : '相關考古題';
    a.push('<span class="st-q">'+lab+' <strong>'+qk.length+'</strong> 題'+
      '<a class="st-go" href="'+QZ+'#q='+qk.join(',')+'" target="_blank" rel="noopener">去練 ▸</a></span>');
  }
  const es=c.esl||[];
  if(es.length){
    a.push('<span class="st-e">申論 '+es.map(function(x){
      return '<a class="st-es" href="'+HUBP+'#'+x[1]+'" target="_blank" rel="noopener">'+x[0].replace('-','年申論')+'</a>';
    }).join('、')+'</span>');
  }else if((c.essay||0)>0){
    a.push('<span class="st-e">申論 <strong>'+c.essay+'</strong> 次</span>');
  }
  if(!a.length) a.push((c.es5&&c.es5.length)?'<span class="st-pred">本型為預測／模擬題（下方可開五分鐘練習）</span>':'<span class="st-none">歷屆選擇題未直接考過</span>');
  // 第二行：章別統計（參考用，字小且灰）
  return '<div class="st1">'+a.join('　｜　')+'</div><div class="st2">'+chStat+'</div>';
}

  div.innerHTML = `<div class="ch-title">${ch.label}</div>
    <div class="prog">
      <div class="prog-bar"><div class="prog-fill" id="pf-${ch.id}" style="width:0%"></div></div>
      <div class="prog-txt" id="pt-${ch.id}">0 / ${total}</div>
    </div>
    <div class="section-hint">點空格顯示答案，再點收起</div>
    ${ch.top||''}`;

  ch.cards.forEach((c,i)=>{
    const key = ch.id+'-'+i;
    cardDone[key] = false;
    const blankCount = (c.blank.match(/___/g)||[]).length;
    const builtBlank = buildBlankLine(c.blank, c.answer, key);

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+key;
    const statHtml = statOf(c, ch.stat);
    card.innerHTML = `
      <div class="term">${c.term}</div>
      <div class="blank-line" id="bl-${key}">${builtBlank}</div>
      <div class="card-btns">
        <button class="reveal-btn" onclick="revealAllBlanks('${key}','${ch.id}',${total})">全部顯示</button>
        <button class="reveal-all-btn" id="rb-${key}" onclick="markDone('${key}','${ch.id}',${total})">已確認 ✓</button>
      </div>
      <div class="qc-exam-stat" id="bstat-${key}">${statHtml}</div>
      <div class="answer-note" id="ans-${key}">
        ${isEs(c)?'':`<div class="key-note">${c.answer}</div>`}
        ${pmtHtml(c)}
        <div class="src" style="margin-top:6px;font-size:12px;color:var(--muted)">📌 ${srcHtml(c.src,ch.id)}</div>
        ${es5Html(c)}
      </div>`;
    div.appendChild(card);
  });

  main.appendChild(div);
});
(function(){
  let f = {};
  try{ f = JSON.parse(localStorage.getItem('bxj-fill')||'{}')||{}; }catch(e){}
  const tt = document.createElement('div');
  tt.id = 'fillTotal'; tt.className = 'prog-txt';
  tt.style.cssText = 'margin:0 0 10px;font-weight:700';

  DATA.forEach(ch=>{
    ch.cards.forEach((c,i)=>{

    });
    updProg(ch.id);
  });
})();

function toggleBlank(el) {
  el.classList.toggle('revealed');
}

function revealAllBlanks(key, chId, total) {
  document.querySelectorAll(`.blank[data-key="${key}"]`).forEach(el => {
    el.classList.add('revealed');
  });
  // 同時顯示完整答案注記
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  // 顯示考試出題紀錄
  const bstat = document.getElementById('bstat-'+key);
  if(bstat) bstat.classList.add('show');
  markDone(key, chId, total);
}

function markDone(key, chId, total) {
  if(cardDone[key]) return;
  cardDone[key] = true;
  try{window.BXREP&&BXREP.fillMark(key)}catch(e){}
  const btn = document.getElementById('rb-'+key);
  if(btn){ btn.textContent='✓ 完成'; btn.classList.add('done'); }
  const note = document.getElementById('ans-'+key);
  if(note) note.classList.add('show');
  updProg(chId);
}
/* 進度：各章與全部都由 cardDone 算；cardDone 開頁時從 bxj-fill 讀回（與指揮中心同一份紀錄） */
function updProg(chId){
  const ch = DATA.find(x=>x.id===chId); if(!ch) return;
  const total = ch.cards.length;
  const done = ch.cards.filter((_,i)=>cardDone[chId+'-'+i]).length;
  const pf = document.getElementById('pf-'+chId);
  const pt = document.getElementById('pt-'+chId);
  if(pf) pf.style.width = Math.round(done/total*100)+'%';
  if(pt) pt.textContent = done+' / '+total+'（'+Math.round(done/total*100)+'%）';
  const DF = DATA.filter(c=>c.id[0]!=='S'), DS = DATA.filter(c=>c.id[0]==='S');
  const cntA = a=>a.reduce((n,c)=>n+c.cards.length,0), cntD = a=>a.reduce((n,c)=>n+c.cards.filter((_,i)=>cardDone[c.id+'-'+i]).length,0);
  const all = cntA(DF), allDone = cntD(DF), es = cntA(DS), esDone = cntD(DS);
  const tt = document.getElementById('fillTotal');
  if(tt) tt.textContent = '定義填空已完成 '+allDone+' / '+all+' 張（'+Math.round(allDone/all*100)+'%）｜申論四段 '+esDone+' / '+es+' 張';
}

function switchCh(id){
  document.querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ch-'+id).classList.add('active');
  const nb=document.querySelector('.nav-btn[data-id="'+id+'"]'); if(nb) nb.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===測驗模式===
let quizPool = [];        // 所有題目扁平化
let quizQueue = [];       // 本輪隨機排列
let quizIdx = 0;
let quizFilter = 'ALL';   // 'ALL' 或 chapter id

function setMode(mode) {
  const browse = document.getElementById('main');
  const nav = document.getElementById('nav');
  const quizEl = document.getElementById('quiz-mode');
  const tabB = document.getElementById('tab-browse');
  const tabQ = document.getElementById('tab-quiz');
  if (mode === 'browse') {
    browse.style.display = ''; nav.style.display = ''; {const nb=document.getElementById('navbar'); if(nb) nb.style.display='';}
    quizEl.classList.remove('active');
    tabB.classList.add('on'); tabQ.classList.remove('on'); document.getElementById('tab-essay').classList.remove('on');
  } else {
    browse.style.display = 'none'; nav.style.display = 'none'; {const nb=document.getElementById('navbar'); if(nb) nb.style.display='none';}
    quizEl.classList.add('active');
    tabB.classList.remove('on'); tabQ.classList.add('on'); document.getElementById('tab-essay').classList.remove('on');
    initQuiz();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function initQuiz() {
  // 建 pool（只跑一次）
  if (quizPool.length === 0) {
    DATA.forEach(ch => {
      ch.cards.forEach((c, ci) => {
        quizPool.push({ key: ch.id+'-'+ci, chId: ch.id, chLabel: ch.label, term: c.term, blank: c.blank, answer: c.answer, src: c.src, essay: c.essay||0, hot: c.hot||0, chStat: ch.stat, p: c.p||'', m: c.m||'', t: c.t||'', qk: c.qk||[], qkind: c.qkind||'', esl: c.esl||[], es5: c.es5||[] });
      });
    });
  }
  // 章節過濾 buttons
  const filterEl = document.getElementById('quiz-filter');
  if (!filterEl.hasChildNodes()) {
    const allBtn = document.createElement('button');
    allBtn.className = 'qf-btn qf-all on';
    allBtn.textContent = '全部章節（不含申論四段）';
    allBtn.onclick = () => setQuizFilter('ALL', allBtn);
    filterEl.appendChild(allBtn);
    DATA.forEach(ch => {
      if(ch.id==='S1'){const sp=document.createElement('div');sp.className='cp-sep';sp.textContent='📝 申論四段填空（「全部章節」不含，需另選或按「申論隨機」）';filterEl.appendChild(sp);
        const eb=document.createElement('button');eb.className='qf-btn qf-es';eb.dataset.id='ES';eb.textContent='申論四段全部';eb.onclick=()=>setQuizFilter('ES',eb);filterEl.appendChild(eb)}
      const btn = document.createElement('button');
      btn.className = 'qf-btn'; btn.dataset.id = ch.id;
      btn.textContent = ch.label;
      btn.onclick = () => setQuizFilter(ch.id, btn);
      filterEl.appendChild(btn);
    });
  }
  startQuizRound();
}

function setQuizFilter(id, btn) {
  quizFilter = id;
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const sm=document.getElementById('qf-sum'); if(sm) sm.innerHTML='📑 章節：<b>'+btn.textContent+'</b> ▾';
  const fw=document.getElementById('qf-wrap'); if(fw) fw.open=false;
  startQuizRound();
}

function goEssay(){setMode('quiz');const eb=document.querySelector('.qf-btn[data-id="ES"]');if(eb)setQuizFilter('ES',eb);document.getElementById('tab-quiz').classList.remove('on');document.getElementById('tab-essay').classList.add('on')}
function goDefQuiz(){const wasEs=document.getElementById('tab-essay').classList.contains('on');setMode('quiz');if(wasEs||quizFilter==='ES'||(quizFilter[0]==='S'&&quizFilter!=='ALL')){const ab=document.querySelector('.qf-btn.qf-all');if(ab)setQuizFilter('ALL',ab)}}
try{if(location.hash==='#essay')setTimeout(goEssay,0);addEventListener('hashchange',()=>{if(location.hash==='#essay')goEssay()})}catch(e){}
let kbHint = true; try { kbHint = localStorage.getItem('bxj-fill-kb') !== '1'; } catch (e) {}
function hideKb() { kbHint = false; try { localStorage.setItem('bxj-fill-kb', '1'); } catch (e) {} document.querySelectorAll('.qc-kb').forEach(e => e.remove()); }
function startQuizRound() {
  const pool = quizFilter === 'ALL' ? quizPool.filter(c => c.chId[0] !== 'S') : quizFilter === 'ES' ? quizPool.filter(c => c.chId[0] === 'S') : quizPool.filter(c => c.chId === quizFilter);
  // Fisher-Yates shuffle
  quizQueue = [...pool];
  for (let i = quizQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQueue[i], quizQueue[j]] = [quizQueue[j], quizQueue[i]];
  }
  quizIdx = 0;
  renderQuizCard();
}

function renderQuizCard() {
  const area = document.getElementById('quiz-card-area');
  const prog = document.getElementById('quiz-progress');
  if (quizIdx >= quizQueue.length) {
    prog.textContent = '';
    area.innerHTML = `<div class="quiz-done-banner">本輪 ${quizQueue.length} 題全部完成！<br><br><button class="qc-btn qc-btn-next" onclick="startQuizRound()" style="font-size:14px">再來一輪</button></div>`;
    return;
  }
  const c = quizQueue[quizIdx];
  prog.textContent = `第 ${quizIdx + 1} / ${quizQueue.length} 題｜${c.chLabel}`;

  // 取 key 列表
  const keyMatches = [];
  const keyRe = /<span class="key">([\s\S]*?)<\/span>/g;
  let m;
  while ((m = keyRe.exec(c.answer)) !== null) keyMatches.push(m[1]);

  let ki = 0;
  const qid = 'q' + quizIdx;
  const builtBlank = c.blank.replace(/___/g, () => {
    const ans = keyMatches[ki] || '？';
    const plainAns = ans.replace(/<[^>]+>/g, '');
    const underlines = '＿'.repeat(Math.max(plainAns.length, 2));
    const idx = ki++;
    return `<span class="blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-qid="${qid}" onclick="toggleQBlank(this)"><span class="blank-mask">${underlines}</span><span class="blank-val" style="display:none">${ans}</span></span>`;
  });

  const statHtml = statOf(c, c.chStat);
  area.innerHTML = `
    <div class="quiz-card">
      <div class="qc-meta">
        <span class="qc-chapter">${c.chLabel}</span>
        <span class="qc-counter">${quizIdx + 1} / ${quizQueue.length}</span>
      </div>
      <div class="qc-term">${c.term}</div>
      <div class="qc-blank" id="qblank-${qid}">${builtBlank}</div>
      ${kbHint ? '<div class="qc-kb">⌨ 空白／Enter 顯示｜← → 換題<a href="#" onclick="hideKb();return false">知道了</a></div>' : ''}
      <div class="qc-btns">
        <button class="qc-btn qc-btn-prev" id="qbtn-prev-${qid}" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled' : ''}>← 上一題</button>
        <button class="qc-btn qc-btn-reveal" id="qbtn-reveal-${qid}" onclick="revealOneQuizBlank('${qid}')">顯示一個 ▶</button>
        <button class="qc-btn qc-btn-all" onclick="revealAllQuizBlanks('${qid}')">全部顯示</button>
        <button class="qc-btn qc-btn-next" onclick="nextQuiz()">下一題 →</button>
      </div>
      <div class="qc-answer" id="qans-${qid}">
        ${isEs(c)?'':`<div>${c.answer}</div>`}
        ${pmtHtml(c)}
        <div class="src">📌 ${srcHtml(c.src,c.chId)}</div>
        ${es5Html(c)}
      </div>
      <div class="qc-exam-stat" id="qstat-${qid}">${statHtml}</div>
    </div>`;
}

function toggleQBlank(el) {
  const mask = el.querySelector('.blank-mask');
  const val = el.querySelector('.blank-val');
  if (val.style.display !== 'none') {
    val.style.display = 'none'; mask.style.display = '';
    el.classList.remove('revealed');
  } else {
    val.style.display = ''; mask.style.display = 'none';
    el.classList.add('revealed');
    if (!document.querySelector('#quiz-card-area .blank:not(.revealed)')) revealAllQuizBlanks('q' + quizIdx);
  }
}

function revealOneQuizBlank(qid) {
  const blanks = document.querySelectorAll(`#qblank-${qid} .blank`);
  for (const b of blanks) {
    if (!b.classList.contains('revealed')) {
      b.querySelector('.blank-mask').style.display = 'none';
      b.querySelector('.blank-val').style.display = '';
      b.classList.add('revealed');
      break;
    }
  }
  // 如果顯示完最後一個，自動全顯示並改按鈕
  const remaining = document.querySelectorAll(`#qblank-${qid} .blank:not(.revealed)`);
  if (remaining.length === 0) {
    revealAllQuizBlanks(qid);
  }
}

function revealAllQuizBlanks(qid) {
  const _rv = document.getElementById('qbtn-reveal-' + qid); if (_rv) _rv.hidden = true;
  document.querySelectorAll(`#qblank-${qid} .blank`).forEach(b => {
    b.querySelector('.blank-mask').style.display = 'none';
    b.querySelector('.blank-val').style.display = '';
    b.classList.add('revealed');
  });
  const ans = document.getElementById('qans-' + qid);
  if (ans) ans.classList.add('show');
  const stat = document.getElementById('qstat-' + qid);
  if (stat) stat.classList.add('show');
  quizMarkDone();
}
/* 隨機測驗：這題空格全部顯示＝記為「已確認」（key＝章節id-序號，與章節瀏覽共用 bxj-fill） */
function quizMarkDone() {
  const c = quizQueue[quizIdx];
  if (!c || !c.key) return;
  try { window.BXREP && BXREP.fillMark(c.key); } catch (e) {}
  if (!cardDone[c.key]) {
    cardDone[c.key] = true;
    const b = document.getElementById('rb-' + c.key);
    if (b) { b.textContent = '✓ 完成'; b.classList.add('done'); }
    updProg(c.chId);
  }
}

function quizScrollTop(){const el=document.getElementById('quiz-progress');if(!el)return;const y=el.getBoundingClientRect().top+window.scrollY-8;window.scrollTo({top:Math.max(0,y),behavior:'auto'})}
function nextQuiz() {
  quizIdx++;
  renderQuizCard();
  quizScrollTop();
}

function prevQuiz() {
  if (quizIdx > 0) {
    quizIdx--;
    renderQuizCard();
    quizScrollTop();
  }
}

// ===隨機測驗鍵盤：空白鍵／Enter＝顯示一個（全部顯示後＝下一題；整輪做完＝再來一輪）、← 上一題、→ 下一題===
(function(){
  function active(){var q=document.getElementById('quiz-mode');return q&&q.classList.contains('active')}
  function onKey(e,up){
    if(!active()||e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key,t=e.target,tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    if(k!==' '&&k!=='Enter'&&k!=='ArrowLeft'&&k!=='ArrowRight')return;
    e.preventDefault();
    if(up||e.repeat)return;
    if(document.activeElement&&document.activeElement!==document.body&&document.activeElement.blur)document.activeElement.blur();
    if(k==='ArrowLeft'){prevQuiz();return}
    if(k==='ArrowRight'){if(quizIdx<quizQueue.length)nextQuiz();return}
    if(quizIdx>=quizQueue.length){startQuizRound();return}
    var qid='q'+quizIdx;
    if(document.querySelectorAll('#qblank-'+qid+' .blank:not(.revealed)').length===0)nextQuiz();
    else revealOneQuizBlank(qid);
  }
  document.addEventListener('keydown',function(e){onKey(e,false)});
  document.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')onKey(e,true)});
})();

// ===主題切換===
function updateThemeBtn(theme) {
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '淺色' : '深色';
}
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || ((window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  updateThemeBtn(next);
  try { localStorage.setItem('bx-theme', next); } catch(e) {}
}
(function(){
  try {
    const saved = localStorage.getItem('bx-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    updateThemeBtn(saved || ((window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light'));
  } catch(e) {}
})();
