const QUESTIONS = [{"year": 99, "qnum": 12, "stem": "有關公平交易法第 21 條之規定，下列何者錯誤？", "options": ["事業不得在商品上對於商品之製造方法為虛偽不實表示", "事業對在商品廣告上對於商品之用途為引人錯誤之表示時，此商品不得運送", "事業不得以其他使公眾得知之方法，對於商品之使用方法為虛偽不實之表示", "廣告媒體業知曉其刊載之廣告有引人錯誤之虞，仍予刊載，損害賠償責任在廣告主，其無須負連帶損害賠償責任"], "answer": "D", "explains": {"A": "不得在商品上對製造方法虛偽不實表示，敘述正確，非本題答案。", "B": "商品廣告用途引人錯誤表示時該商品不得運送，敘述正確，非本題答案（此為防止不實商品流入市場之配套規定）。", "C": "不得以其他方法對使用方法虛偽不實表示，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。廣告媒體業明知（知曉）其刊載之廣告有引人錯誤之虞，仍予刊載者，「應與廣告主負連帶損害賠償責任」，並非「無須負連帶責任」，本選項方向相反，此為廣告查核分工責任體系之核心觀念，全科最高頻陷阱之一。"}, "ref": "公平交易法第21條、第21條之1", "id": 1, "chapter": "G2"}, {"year": 102, "qnum": 33, "stem": "廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，應負何種責任？", "options": ["由廣告主負損害賠償責任", "與廣告主負連帶損害賠償責任", "與廣告媒體業負連帶損害賠償責任", "與廣告薦證者負連帶損害賠償責任"], "answer": "B", "explains": {"A": "廣告代理業明知或可得而知仍製作設計不實廣告者，「亦」須負連帶責任，非僅由廣告主單獨負責。", "B": "正確。廣告代理業明知或可得而知情形下，仍製作或設計有引人錯誤之廣告者，應與「廣告主」負連帶損害賠償責任，此為廣告查核分工原則之核心規定：各廣告參與角色（代理業、媒體業、薦證者）明知或可得而知仍為不當行為者，皆係與「廣告主」本身負連帶責任，而非彼此之間互負連帶責任。", "C": "廣告代理業之連帶責任對象為「廣告主」，非「廣告媒體業」，此為主體混淆之陷阱。", "D": "廣告代理業之連帶責任對象為「廣告主」，非「廣告薦證者」，此為主體混淆之陷阱。"}, "ref": "公平交易法第21條之1", "id": 2, "chapter": "G2"}, {"year": 104, "qnum": 9, "stem": "依公平交易法第 21 條之規定，下列敘述何者錯誤？", "options": ["事業不得在商品上對於商品之製造方法為虛偽不實表示", "事業對在商品廣告上對於商品之用途為引人錯誤之表示時，此商品不得運送", "事業不得以其他使公眾得知之方法，對於商品之使用方法為虛偽不實之表示", "廣告媒體業知曉其刊載之廣告有引人錯誤之虞，仍予刊載，損害賠償責任在廣告主，其無須負連帶損害賠償責任"], "answer": "D", "explains": {"A": "不得在商品上對製造方法虛偽不實表示，敘述正確，非本題答案。", "B": "商品廣告用途引人錯誤表示時該商品不得運送，敘述正確，非本題答案。", "C": "不得以其他方法對使用方法虛偽不實表示，敘述正確，非本題答案。", "D": "正確答案（錯誤敘述）。廣告媒體業明知其刊載廣告有引人錯誤之虞仍予刊載者，「應與廣告主負連帶損害賠償責任」，並非「無須負連帶責任」，此為與99年-12題完全相同之重複命題陷阱，須牢記廣告媒體業之連帶責任要件。"}, "ref": "公平交易法第21條、第21條之1", "id": 3, "chapter": "G2"}, {"year": 104, "qnum": 36, "stem": "依公平交易法之規定，非屬知名公眾人物之廣告薦證者，在明知或可得而知其薦證有引人錯誤之虞時，於受廣告主報酬最高幾倍之範圍內與廣告主負連帶損害賠償責任？", "options": ["5倍", "10倍", "15倍", "20倍"], "answer": "B", "explains": {"A": "數字錯誤，非5倍。", "B": "正確答案。⚠️需特別留意：法條就非知名公眾人物薦證者之責任區分「明知」與「不知情」兩種情形——「不知情」（不知或不可得而知）者，僅於受廣告主報酬「10倍」之範圍內負連帶責任；本題題幹敘述為「明知或可得而知」情形，理論上明知者應「不受」倍數上限限制（負完全連帶責任），惟本題官方標準答案為 誤）。", "B": "正確答案（本題設計為找出「錯誤」之選項，經核對本選項數字「十倍」及情境「不知情」之描述，符合法定「非知名公眾人物不知情時受報酬10倍範圍內負連帶責任」之規定，惟依考選部公告本題標準答案認定此選項為錯誤，可能涉及「不知情」與「明知或可得而知」情境設定之細節差異，建議對照官方詳解確認出題原意）。", "C": "廣告媒體業明知或可得而知仍傳播刊載，與廣告主負連帶責任，敘述正確，非本題答案。", "D": "廣告代理業明知或可得而知仍製作設計，與廣告主負連帶責任，敘述正確，非本題答案。"}, "ref": "公平交易法第21條之1；⚠️本題選項B之數字「十倍」與情境描述本身大致符合法條規定，惟官方標準答案認定其為錯誤選項，建議對照官方詳解確認出題細節", "id": 7, "chapter": "G2"}, {"year": 111, "qnum": 8, "stem": "甲建商為廣告主，委託乙廣告代理業製作廣告，請來丙明星擔任廣告薦證者，在丁廣告媒體業之電子媒體刊登引人錯誤之廣告，下列敘述何者錯誤？", "options": ["乙廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與甲建商負連帶損害賠償責任", "甲建商不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵", "丙明星明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與乙廣告代理業負連帶損害賠償責任", "丁廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，與甲建商負連帶損害賠償責任"], "answer": "C", "explains": {"A": "廣告代理業乙明知或可得而知仍製作設計不實廣告，與廣告主甲負連帶責任，敘述正確，非本題答案。", "B": "甲建商不得在商品或廣告上為虛偽不實或引人錯誤表示，敘述正確，非本題答案。", "C": "正確答案（錯誤敘述）。薦證者丙明知或可得而知仍為薦證者，應與「廣告主甲」（而非「廣告代理業乙」）負連帶損害賠償責任，連帶對象主體錯誤，此為★核心陷阱：各廣告角色（代理業、媒體業、薦證者）之連帶責任對象皆為「廣告主」本身，彼此之間並不互相連帶。", "D": "廣告媒體業丁明知或可得而知仍傳播刊載，與廣告主甲負連帶責任，敘述正確，非本題答案。"}, "ref": "公平交易法第21條之1", "id": 8, "chapter": "G2"}, {"year": 114, "qnum": 24, "stem": "依公平交易法之規定，下列那一個定義之內容錯誤？", "options": ["廣告薦證者，指廣告主於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果", "獨占，指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者", "競爭，指二以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為", "控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者"], "answer": "A", "explains": {"A": "正確答案（錯誤定義）。廣告薦證者之法定定義應為「廣告主『以外』之人或機構」於廣告中反映其對商品或服務之意見信賴發現或親身體驗結果，本選項漏未「以外」之關鍵限定詞，誤將薦證者主體等同於廣告主本身，兩者本應為不同主體（廣告主是委託製作廣告者，薦證者是廣告主以外受邀為商品背書之人或機構），此為定義主體混淆之★陷阱。", "B": "獨占之法定定義正確，非本題答案。", "C": "競爭之法定定義正確，非本題答案。", "D": "控制性持股之法定定義正確，非本題答案。"}, "ref": "公平交易法第4條、第21條之1", "id": 9, "chapter": "G2"}];
const STORAGE_KEY = "brokerlaw_g2_mastery_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
let currentFilter = "all";
let currentChapter = "ALL";

function getChapters(){
  const set = new Set(QUESTIONS.map(q=>q.chapter));
  return Array.from(set);
}

function renderChips(){
  const chips = getChapters();
  const wrap = document.getElementById('chapterChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentChapter==='ALL' ? ' active':'');
  allChip.textContent = '全部章節';
  allChip.onclick = ()=>{ currentChapter='ALL'; renderChips(); renderList(); };
  wrap.appendChild(allChip);
  chips.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (currentChapter===c ? ' active':'');
    el.textContent = c;
    el.onclick = ()=>{ currentChapter=c; renderChips(); renderList(); };
    wrap.appendChild(el);
  });
}

function matchesFilter(q){
  const s = state[q.id];
  if(currentChapter !== 'ALL' && q.chapter !== currentChapter) return false;
  if(currentFilter === 'unanswered') return !s;
  if(currentFilter === 'wrong') return s && s.correct === false;
  return true;
}

function updateStats(){
  const total = QUESTIONS.length;
  let done=0, correct=0, wrong=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.id];
    if(s){ done++; if(s.correct) correct++; else wrong++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statRate').textContent = done ? Math.round(correct/done*100)+'%' : '--';
}

function renderList(){
  const list = document.getElementById('quizList');
  list.innerHTML = '';
  const items = QUESTIONS.filter(matchesFilter);
  if(items.length === 0){
    list.innerHTML = '<div class="empty">目前篩選條件下沒有題目。</div>';
    updateStats();
    return;
  }
  items.forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q'+q.id;

    const meta = document.createElement('div');
    meta.className = 'qmeta';
    const s = state[q.id];
    meta.innerHTML = `<span class="badge">${q.year}年第${q.qnum}題</span><span class="badge">${q.chapter}</span>` +
      (s ? (s.correct ? '<span class="badge" style="border-color:#3F6B4C;color:#3F6B4C;">✓已答對</span>' : '<span class="badge wrong">✗已答錯</span>') : '');
    card.appendChild(meta);

    const stem = document.createElement('div');
    stem.className = 'stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    const labels = ['A','B','C','D'];
    labels.forEach((L,idx)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = L + '. ' + q.options[idx];
      const st = state[q.id];
      if(st){
        btn.classList.add('disabled');
        if(L === q.answer) btn.classList.add('correct');
        else if(L === st.chosen && st.chosen !== q.answer) btn.classList.add('chosen-wrong');
      }
      btn.onclick = ()=>{
        if(state[q.id]) return;
        const correct = (L === q.answer);
        state[q.id] = { chosen:L, correct: correct, tag: null };
        saveState(state);
        renderList();
        setTimeout(()=>{
          const el = document.getElementById('q'+q.id);
          if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
        }, 30);
      };
      card.appendChild(btn);
    });

    if(state[q.id]){
      const exp = document.createElement('div');
      exp.className = 'explain-box show';
      labels.forEach(L=>{
        const line = document.createElement('div');
        line.className = 'explain-line' + (L===q.answer ? ' ok':'');
        line.innerHTML = `<b>${L===q.answer?'✓':'✗'}${L}.</b> ${q.explains[L]}`;
        exp.appendChild(line);
      });
      const ref = document.createElement('div');
      ref.className = 'ref';
      ref.textContent = '📖 法規依據：' + q.ref;
      exp.appendChild(ref);
      card.appendChild(exp);

      const tagRow = document.createElement('div');
      tagRow.className = 'errtag-row show';
      if(!state[q.id].correct){
        ['A','B','C'].forEach(t=>{
          const tagBtn = document.createElement('div');
          const label = t==='A' ? 'A 法條混淆' : (t==='B' ? 'B 粗心' : 'C 真的不熟');
          tagBtn.className = 'etag' + (state[q.id].tag===t ? ' on-'+t : '');
          tagBtn.textContent = label;
          tagBtn.onclick = ()=>{
            state[q.id].tag = (state[q.id].tag===t) ? null : t;
            saveState(state);
            renderList();
          };
          tagRow.appendChild(tagBtn);
        });
      }
      card.appendChild(tagRow);
    }

    list.appendChild(card);
  });
  updateStats();
}

document.querySelectorAll('.fbtn[data-filter]').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.fbtn[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('確定要清除所有作答紀錄嗎？此動作無法復原。')){
    state = {};
    saveState(state);
    renderList();
  }
};

renderChips();
renderList();
</script>
</body>
</html>
