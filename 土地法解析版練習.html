農業發展條例第3條第11款所稱之耕地", "依區域計畫法劃定為各種使用分區內所編定之林業用地、養殖用地、水利用地、生態保護用地、國土保安用地及供農路使用之土地，或上開分區內暫未依法編定用地別之土地", "依區域計畫法劃定為農業區、山坡地保育區、森林區以外之分區內所編定之農牧用地", "依都市計畫法劃定為農業區、保護區內之土地"], "answer": 2}, {"id": 301, "year": "106", "num": 22, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "被徵收之土地，有下列何種情形時，原土地所有權人得於徵收公告之日起20年內，向該管直轄市或縣（市）主管機關申請照原徵收補償價額收回其土地？", "options": ["徵收補償費發給完竣屆滿 2 年，未依徵收計畫開始使用者", "徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者", "未依核准徵收原定興辦事業使用者", "依原徵收計畫開始使用後未滿 6 年，不繼續依原徵收計畫使用者"], "answer": 2}, {"id": 302, "year": "106", "num": 23, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "下列何者為撤銷徵收之原因？", "options": ["因工程變更設計，致原徵收之土地不在工程用地範圍內", "公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發。但以聯合開發方式開發之土地，土地所有權人不願參與聯合開發者，不在此限", "依徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式改變", "已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部或一部已無徵收之必要"], "answer": 1}, {"id": 303, "year": "106", "num": 24, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "下列有關違反區域計畫管制使用土地者之處罰規定，何者錯誤？", "options": ["由該管直轄市、縣（市）政府處新臺幣 6 萬元以上 30 萬元以下罰鍰", "經限期變更使用、停止使用或拆除地上物恢復原狀而不遵從者，得按次處罰", "經限期變更使用而不遵從者，並得停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施", "不依限變更土地使用者，除依強制執行法辦理外，並得處 6 個月以下有期徒刑或拘役"], "answer": 3}, {"id": 304, "year": "106", "num": 25, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "下列何者非區域計畫法規定區域計畫得隨時檢討變更之原因？", "options": ["發生或避免重大災害", "興辦重大開發或建設事業", "為適應國防或經濟發展之需要", "區域建設推行委員會之建議"], "answer": 2}, {"id": 305, "year": "106", "num": 26, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "下列有關都市計畫法中公共設施用地之設置規定，何者錯誤？", "options": ["公共設施用地，應就人口、土地使用、交通等現狀及未來發展趨勢，決定其項目、位置與面積", "公共設施用地應儘先利用適當之私有土地", "公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積10%", "道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公路通過實施都市計畫之區域者，應避免穿越市區中心"], "answer": 1}, {"id": 306, "year": "106", "num": 27, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法第22條規定，下列何者非細部計畫應以細部計畫書及細部計畫圖應表明之事項？", "options": ["名勝、古蹟及具有紀念性或藝術價值應予保存之建築", "居住密度及容納人口", "土地使用分區管制", "道路系統"], "answer": 0}, {"id": 307, "year": "106", "num": 28, "chapter": "A2", "chapterName": "A2 土地登記", "text": "重新實施地籍測量時，已依法設立界標之土地所有權人，於重測結果公告後認為測量結果有錯誤者，應如何辦理？", "options": ["土地所有權人得於公告期間內，向該管地政機關繳納複丈費，聲請複丈", "土地所有權人得於公告期滿後，向該管地政機關申請重新實施地籍測量", "應由該管地政機關予以調處，不服調處者，應於接到調處通知後 15 日內，向司法機關訴請處理", "應由該管地政機關予以調處，不服調處者，應於接到調處通知後 15 日內，循行政救濟程序辦理"], "answer": 0}, {"id": 308, "year": "106", "num": 29, "chapter": "A2", "chapterName": "A2 土地登記", "text": "下列有關逾期未辦繼承登記土地之處理程序，何者正確？", "options": ["自繼承開始之日起逾1年未辦理繼承登記者，直轄市或縣市地政機關查明後，應公告繼承人於6個月內聲請登記", "逾期未辦理繼承登記，經限期聲請登記仍未聲請者，地政機關予以列冊管理期間為10年", "經地政機關列冊管理，期滿仍未聲請登記者，由地政機關將該土地或建築改良物清冊移請行政執行署公開標售", "經公開標售之土地，自登記完畢之日起10年內，原權利人得檢附證明文件按其法定應繼分，申請發給價金"], "answer": 3}, {"id": 309, "year": "106", "num": 30, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法第103條規定，租用建築房屋之基地，非因下列何種情形，出租人不得收回？", "options": ["出租人收回自住或重新建築時", "承租人違反租賃契約時", "承租人積欠租金額，除擔保金抵償外，達 2 個月以上時", "承租人損壞出租人之房屋或附著財物，而不為相當之賠償時"], "answer": 1}, {"id": 310, "year": "106", "num": 31, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "關於房地交易課徵所得稅之稅率規定，下列敘述何者錯誤？", "options": ["個人持有房屋、土地之期間在 1 年以內者，稅率為 45%", "個人持有房屋、土地之期間超過 1 年，未逾 2 年者，稅率為 35%", "個人持有房屋、土地之期間超過 2 年，未逾 10 年者，稅率為 25%", "個人持有房屋、土地之期間超過 10 年者，稅率為 15%"], "answer": 2}, {"id": 311, "year": "106", "num": 32, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例之規定，契稅之課稅基礎是？", "options": ["實價", "市價", "房價", "契價"], "answer": 3}, {"id": 312, "year": "106", "num": 33, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "土地所有權人曾使用自用住宅用地優惠稅率後，再出售其自用住宅用地，符合下列何項規定，為不受一次優惠稅率限制條件之一：", "options": ["出售都市土地面積未超過 3 公畝部分或非都市土地面積未超過 7 公畝部分", "出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋", "出售前持有該土地 5 年以上", "土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿 5 年"], "answer": 1}, {"id": 313, "year": "106", "num": 34, "chapter": "E1", "chapterName": "E1 地價稅", "text": "下列敘述之地價稅稅率，何者錯誤？", "options": ["自用住宅用地之地價稅稅率是 2‰", "依都市計畫法規定設置供公眾使用之停車場用地之地價稅稅率是 10‰", "公有非公用土地之地價稅稅率是 10‰", "都市計畫公共設施保留地，在保留期間仍為建築使用者，地價稅稅率是 10‰"], "answer": 3}, {"id": 314, "year": "106", "num": 35, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地類別之前，適用那項用地之管制？", "options": ["林業用地", "遊憩用地", "生態保護用地", "國土保安用地"], "answer": 0}, {"id": 315, "year": "106", "num": 36, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例之規定，土地買賣未辦竣權利移轉登記，承買人再行出售該土地時，處應納登記費多少倍以下之罰鍰？", "options": ["5倍", "10 倍", "15 倍", "20 倍"], "answer": 3}, {"id": 316, "year": "106", "num": 37, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "都市計畫發布實施後，應依何法之規定，實施建築管理？", "options": ["建築法", "建築技術規則", "建築師法", "建築管理規則"], "answer": 0}, {"id": 317, "year": "106", "num": 38, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法之規定，聲請為土地權利變更登記，應檢附什麼文件？", "options": ["原發土地所有權狀及地段圖", "原發土地所有權狀及地段圖或土地他項權利證明書", "原發土地所有權狀及地段圖及土地他項權利證明書", "原發土地所有權狀或地段圖及土地他項權利證明書"], "answer": 1}, {"id": 318, "year": "106", "num": 39, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "依土地法及平均地權條例對於空地及荒地之規定，下列敘述何者錯誤？", "options": ["土地法規定，土地建築改良物價值不及所占地基申報地價20%者，視為空地", "平均地權條例規定，空地係指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價10%，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地", "土地法規定，凡編為農業或其他直接生產用地，未依法使用者為荒地", "平均地權條例規定，農業用地閒置不用，經直轄市或縣（市）政府報經行政院農業委員會核准通知限期使用或命其委託經營，逾期仍未使用或委託經營者，按應納田賦加徵1倍至3倍之荒地稅"], "answer": 3}, {"id": 319, "year": "106", "num": 40, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "甲105年6月買入A房地，購入成本1,300萬元，於106年2月以2,000萬元出售A房地時，繳納土地增值稅10萬元（土地漲價總數額為100萬元），因取得、改良及移轉而支付的費用50萬元，其應納交易所得稅若干？", "options": ["1,925,000 元", "2,240,000 元", "2,475,000 元", "2,880,000 元"], "answer": 2}, {"id": 320, "year": "107", "num": 1, "chapter": "A2", "chapterName": "A2 土地登記", "text": "關於土地權利變更登記，下列何者正確？", "options": ["其係繼承登記者，應由全體繼承人聲請之", "其係繼承登記者，依法應自繼承開始之日起二個月內為之", "聲請逾期者，每逾一個月得處應納登記費額二倍之罰鍰", "罰鍰最高不得超過應納登記費額二十倍"], "answer": 3}, {"id": 321, "year": "107", "num": 2, "chapter": "A1", "chapterName": "A1 總則", "text": "下列土地，何者非屬土地法規定不得為私有之土地？", "options": ["礦泉地", "瀑布地", "國家公園土地", "名勝古蹟"], "answer": 2}, {"id": 322, "year": "107", "num": 3, "chapter": "A2", "chapterName": "A2 土地登記", "text": "下列何種登記，應繳納登記費？", "options": ["土地權利信託登記", "土地權利塗銷登記", "土地標示變更登記", "因土地重劃之變更登記"], "answer": 0}, {"id": 323, "year": "107", "num": 4, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "土地法第34條之1第1項有關以多數決處分共有土地之規定，下列處分方式，何者不適用該規定？", "options": ["設定農育權", "設定不動產役權", "設定典權", "辦理共有物分割"], "answer": 3}, {"id": 324, "year": "107", "num": 5, "chapter": "A2", "chapterName": "A2 土地登記", "text": "重新實施地籍測量，遇有土地所有權人因設立界標或到場指界發生界址爭議時，地政機關應如何處理？", "options": ["逕行參照舊地籍圖施測", "請當事人逕行向法院提起確認界址之訴，俟判決確定後再行辦理", "逕行依地方習慣施測", "準用土地法第 59 條第 2 項規定之調處程序處理之"], "answer": 3}, {"id": 325, "year": "107", "num": 6, "chapter": "A2", "chapterName": "A2 土地登記", "text": "逾期未辦繼承登記之土地，經依土地法第73條之1規定程序列冊管理期滿，移請國有財產署標售五次不成，而登記為國有者，自登記完畢之日起多少年內，原權利人得檢附證明文件按其法定應繼分請求國有財產署發給價金？", "options": ["10 年", "12 年", "15 年", "20 年"], "answer": 0}, {"id": 326, "year": "107", "num": 7, "chapter": "A2", "chapterName": "A2 土地登記", "text": "預告登記，對於因下列何種事由而為之新登記，具有排除之效力？", "options": ["土地交換", "徵收", "強制執行", "法院判決"], "answer": 0}, {"id": 327, "year": "107", "num": 8, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "為保護基地承租人，依土地法規定，租用基地建築房屋，應由出租人與承租人會同聲請該管直轄市或縣（市）地政機關為何種權利之登記？", "options": ["租賃權", "地上權", "典權", "不動產役權"], "answer": 1}, {"id": 328, "year": "107", "num": 9, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，關於租用建築房屋之基地，下列何者，非屬出租人得收回之情形？", "options": ["出租人收回自行建築時", "契約年限屆滿時", "承租人以基地供違反法令之使用時", "承租人轉租基地於他人時"], "answer": 0}, {"id": 329, "year": "107", "num": 10, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "依平均地權條例規定，直轄市或縣（市）政府對於尚未建築之超額私有建築用地之處理，下列敘述，何者正確？", "options": ["應通知土地所有權人於三年內出售", "應通知土地所有權人於三年內建築使用", "逾期未出售或未建築使用者，得予強制拍賣", "逾期未出售或未建築使用者，得予照價收買"], "answer": 3}, {"id": 330, "year": "107", "num": 11, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "耕地以外之出租土地，因市地重劃而不能達到原租賃之目的者，承租人得終止租約，並得向出租人請求如何之補償？", "options": ["按重劃計畫書公告當期公告土地現值扣除預計土地增值稅後餘額之三分之一", "按重劃計畫書公告當期公告土地現值之三分之一", "相當六個月租金", "相當一年租金"], "answer": 3}, {"id": 331, "year": "107", "num": 12, "chapter": "D1", "chapterName": "D1 徵收程序要件", "text": "依土地徵收條例規定，關於特定農業區農牧用地之徵收，下列何者錯誤？", "options": ["除零星夾雜難以避免者外，不得徵收。但國防所必須或經行政院核定之重大建設所需者，不在 此限", "除零星夾雜難以避免者外，不得徵收。但交通所必須或經行政院核定之重大建設所需者，不在 此限", "特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行聽證", "特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行公聽會"], "answer": 3}, {"id": 332, "year": "107", "num": 13, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "依土地徵收條例有關徵用之規定，下列敘述，何者正確？", "options": ["國家因興辦繼續性之公共建設工程，得徵用私有土地或土地改良物", "徵用期間逾六年，或二次以上徵用，期間合計逾六年者，需用土地人應於申請徵用前，以書面 通知", "土地或土地改良物所有權人於收到徵用通知書之日起三十日內，得請求需用土地人徵收所有權", "因徵用而請求徵收土地或土地改良物所有權者，必要時所有權人得申請收回其土地或土地改良物"], "answer": 2}, {"id": 333, "year": "107", "num": 14, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例規定，徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者，所有權人得向何機關申請一併徵收？", "options": ["需用土地人", "該管直轄市或縣（市）主管機關", "內政部", "行政院"], "answer": 1}, {"id": 334, "year": "107", "num": 15, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "實施區段徵收時，申請發給抵價地者，對其被徵收土地之權利義務，於何時終止？", "options": ["向直轄市或縣（市）主管機關申請發給抵價地時", "接到直轄市或縣（市）主管機關核定發給抵價地通知時", "直轄市或縣（市）主管機關將抵價地登記為申請人所有時", "直轄市或縣（市）主管機關將抵價地點交申請人接管時"], "answer": 1}, {"id": 335, "year": "107", "num": 16, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "區域計畫法有關非都市土地許可開發之規定，下列敘述，何者錯誤？", "options": ["開發許可前，應先將申請開發案提報各該區域計畫委員會審議之", "申請開發許可，申請人應先取得開發地區內全部土地及建築物之所有權", "開發許可後，辦理分區或用地變更前，應將開發區內公共設施用地完成分割移轉登記為各該直 轄市、縣（市）有或鄉、鎮（市）有，並繳交開發影響費", "直轄市、縣（市）政府受理開發申請案後，除情形特殊者外，應於六十日內報請各該區域計畫 擬定機關審議"], "answer": 1}, {"id": 336, "year": "107", "num": 17, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "依非都市土地使用管制規則規定，山坡地範圍內之土地，在未編定使用地類別前，適用林業用地之管制，下列何者不包含在內？", "options": ["森林區", "風景區", "國家公園區", "山坡地保育區"], "answer": 2}, {"id": 337, "year": "107", "num": 18, "chapter": "A1", "chapterName": "A1 總則", "text": "下列土地他項權利，何者為土地法所創設？", "options": ["地上權", "農育權", "耕作權", "不動產役權"], "answer": 2}, {"id": 338, "year": "107", "num": 19, "chapter": "E1", "chapterName": "E1 地價稅", "text": "下列土地關係人，何者非屬土地稅法第3條所定之地價稅納稅義務人？", "options": ["承領土地，為承領人", "承墾土地，為耕作權人", "權屬不明土地，為主管稅捐稽徵機關指定之土地使用人", "設有典權土地，為典權人"], "answer": 2}, {"id": 339, "year": "107", "num": 20, "chapter": "E1", "chapterName": "E1 地價稅", "text": "土地為信託財產者，於信託關係存續中，以何人為地價稅或田賦之納稅義務人？", "options": ["委託人", "受託人", "受益人", "信託監察人"], "answer": 1}, {"id": 340, "year": "107", "num": 21, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "配偶相互贈與之土地，得申請不課徵土地增值稅。但於再移轉第三人時，以該土地第一次贈與前之原規定地價或前次移轉現值為原地價，計算下列何種數值或數額，課徵土地增值稅？", "options": ["公告現值", "申報移轉現值", "現值數額", "漲價總數額"], "answer": 3}, {"id": 341, "year": "107", "num": 22, "chapter": "E1", "chapterName": "E1 地價稅", "text": "自用住宅用地得適用優惠稅率課徵地價稅，下列有關自用住宅用地要件之敘述，何者錯誤？", "options": ["須土地所有權人或其配偶、直系親屬於該地有居住事實並辦竣戶籍登記", "須為無出租或供營業使用之住宅用地", "土地面積，都市土地未超過三公畝部分，非都市土地未超過七公畝部分", "土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限"], "answer": 0}, {"id": 342, "year": "107", "num": 23, "chapter": "G1", "chapterName": "G1 契稅", "text": "買賣契稅之稅率，為其契價百分之六。所稱契價，以何者為準？", "options": ["以實際買賣價格為準", "以當地不動產評價委員會評定之標準價格為準", "以當地地價及標準地價評議委員會評定之標準價格為準", "以當地建築主管機關公告之房屋造價為準"], "answer": 1}, {"id": 343, "year": "107", "num": 24, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，私有房屋受重大災害時，有關房屋稅之減免，下列敘述何者正確？", "options": ["毀損面積佔整棟面積三成以上，不及五成之房屋，免徵房屋稅", "毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，免徵房屋稅", "毀損面積佔整棟面積五成以上，其房屋稅減半徵收", "毀損面積佔整棟面積五成以上，必須修復始能使用之房屋，其房屋稅減半徵收"], "answer": 1}, {"id": 344, "year": "107", "num": 25, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "依所得稅法規定，有關出售自住房屋，其房地交易所得稅之優惠，下列敘述，何者錯誤？", "options": ["免稅所得額，以按該法第 14 條之 4 第 3 項規定計算之餘額不超過四百萬元為限", "個人或其配偶、直系親屬辦竣戶籍登記、持有並居住於該房屋連續滿六年", "交易前六年內，無出租、供營業或執行業務使用", "個人與其配偶及未成年子女於交易前六年內未曾適用該法第 4 條之 5 第 1 項第 1 款規定"], "answer": 1}, {"id": 345, "year": "108", "num": 1, "chapter": "A1", "chapterName": "A1 總則", "text": "私有土地所有權之移轉、設定負擔或租賃，如有妨害基本國策者，中央地政機關得報請下列何機關制止之？", "options": ["立法院", "司法院", "行政院", "監察院"], "answer": 2}, {"id": 346, "year": "108", "num": 2, "chapter": "A2", "chapterName": "A2 土地登記", "text": "因登記錯誤遺漏或虛偽致受有損害者，由該地政機關負損害賠償責任，此項損害賠償之請求，如經該地政機關拒絕，受損害人得採取下列何種處理方式？", "options": ["向行政院申訴", "向立法院告發", "向司法機關起訴", "向監察院告發"], "answer": 2}, {"id": 347, "year": "108", "num": 3, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "平均地權條例規定照價收買後之土地，其權屬應為？", "options": ["國有", "直轄市、縣（市）有", "鄉鎮有", "公營事業有"], "answer": 1}, {"id": 348, "year": "108", "num": 4, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "下列有關土地徵收條例的優先購買權敘述，何者正確？", "options": ["行使主體係被徵收之原土地所有權人或其繼承人", "行使原因須被徵收土地經依徵收計畫使用後，依法變更原使用目的而讓售", "行使條件須與讓售條件相同，且應公告三個月", "行使期間須於讓售決定後十日內表示優先購買"], "answer": 0}, {"id": 349, "year": "108", "num": 5, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "下列有關基地房屋之優先購買權敘述，何者正確？", "options": ["基地出賣時，抵押權人有依同樣條件優先購買之權", "房屋出賣時，抵押權人有依同樣條件優先購買之權", "優先購買權人，於接到出賣通知後一個月內不表示者，其優先權視為放棄", "出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人"], "answer": 3}, {"id": 350, "year": "108", "num": 6, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "下列有關土地所有權移轉或設定典權，申報移轉現值之審核標準，係以何時之當期公告土地現值為準？", "options": ["申報人逾訂定契約之日起三十日始申報者，以訂約日", "遺贈之土地，以遺贈人死亡後六個月", "依法院判決移轉登記者，以申報人向法院起訴日", "經法院拍賣之土地，以強制執行日"], "answer": 2}, {"id": 351, "year": "108", "num": 7, "chapter": "E1", "chapterName": "E1 地價稅", "text": "下列有關平均地權條例及土地稅法中有關累進課地價稅之敘述，何者正確？", "options": ["超過累進起點地價未達五倍者，就其超過部分課徵千分之三十", "超過累進起點地價五倍至十倍者，就其超過部分課徵千分之三十五", "超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之四十", "超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"], "answer": 3}, {"id": 352, "year": "108", "num": 8, "chapter": "A2", "chapterName": "A2 土地登記", "text": "預告登記，對於因下列何種法律行為或事實而為之新登記，無排除之效力？", "options": ["重劃", "繼承", "徵收", "都市更新"], "answer": 2}, {"id": 353, "year": "108", "num": 9, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，適用何種管制？", "options": ["林業用地", "農牧用地", "國土保安用地", "原住民保留地"], "answer": 0}, {"id": 354, "year": "108", "num": 10, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "下列敘述何者正確？", "options": ["個人房屋、土地交易損失，得自交易日以後五年內之房屋、土地交易所得減除之", "個人房屋、土地交易損失，得自交易日以後七年內之房屋、土地交易所得減除之", "重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額", "重購之自住房屋、土地，於重購後七年內改作其他用途或再行移轉時，應追繳原扣抵或退還稅額"], "answer": 2}, {"id": 355, "year": "108", "num": 11, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法規定，關於地價稅之納稅義務人，下列何項敘述錯誤？", "options": ["信託土地，於信託關係存續中，為受託人", "設有典權土地，為出典人", "承領土地，為承領人", "承墾土地，為耕作權人"], "answer": 1}, {"id": 356, "year": "108", "num": 12, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，都市計畫區內之公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之幾？", "options": ["百分之十", "百分之十二", "百分之十五", "百分之十七"], "answer": 0}, {"id": 357, "year": "108", "num": 13, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "依平均地權條例之規定，直轄市或縣（市）政府對於尚未建築之私有建築用地之處理方式，下列何項敘述錯誤？", "options": ["除有特殊情形外，應限制尚未建築用地面積最高額以十公畝為限", "對於超額私有建築用地，應通知土地所有權人於二年內出售或建築使用", "逾期未出售或未建築使用者，得予照價收買", "照價收買價格，按收買當時查估之正常市價"], "answer": 3}, {"id": 358, "year": "108", "num": 14, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "出租之公、私有耕地因實施市地重劃致不能達到原租賃之目的者，可由直轄市或縣（市）政府逕為註銷其租約並通知當事人，如重劃後分配土地者，承租人得請求之補償，下列何項為正確？", "options": ["按重劃計畫書公告當期該土地公告土地現值減除預計土地增值稅後餘額之三分之一", "按重劃計畫書公告當期該土地查估之市價減除預計土地增值稅後餘額之三分之一", "按重劃計畫書公告當期該土地之公告土地現值之三分之一", "按重劃計畫書公告當期該土地查估之市價之三分之一"], "answer": 2}, {"id": 359, "year": "108", "num": 15, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "都市計畫應依據現在及既往情況，並預計未來幾年內之發展情形訂定之？", "options": ["十五年", "二十年", "二十五年", "三十年"], "answer": 2}, {"id": 360, "year": "108", "num": 16, "chapter": "A2", "chapterName": "A2 土地登記", "text": "甲將其所有X地號土地出售予乙後，由甲會同乙申辦土地買賣移轉登記時，請問本案應按何標準計收千分之一的登記費？", "options": ["該筆土地的公告現值", "該筆土地的公告地價", "該筆土地的買賣實價", "該筆土地的申報地價"], "answer": 3}, {"id": 361, "year": "108", "num": 17, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列那種情形，應辦理撤銷徵收？", "options": ["因工程變更設計，致原徵收之土地不在工程用地範圍內", "土地徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式 改變", "公告徵收時，都市計畫已規定以市地重劃或其他方式開發", "已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部 或一部已無徵收之必要"], "answer": 2}, {"id": 362, "year": "108", "num": 18, "chapter": "A5", "chapterName": "A5 公有土地", "text": "下列土地何者屬於土地法第四條所稱的公有土地？", "options": ["所有權人登記為台灣糖業股份有限公司", "所有權人登記為臺灣石門農田水利會", "所有權人登記為國家中山科學研究院", "所有權人登記為埔里鎮"], "answer": 3}, {"id": 363, "year": "108", "num": 19, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理？", "options": ["十五日", "二十日", "二十五日", "三十日"], "answer": 0}, {"id": 364, "year": "108", "num": 20, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "非都市土地申請開發達一定規模者，應辦理土地使用分區變更，下列何項敘述錯誤？", "options": ["申請開發社區之計畫達五十戶或土地面積在一公頃以上，應變更為鄉村區", "申請開發為工業使用之土地面積達十公頃以上，應變更為工業區", "申請開發遊憩設施之土地面積達五公頃以上，應變更為特定專用區", "申請開發高爾夫球場之土地面積達五公頃以上，應變更為特定專用區"], "answer": 3}, {"id": 365, "year": "108", "num": 21, "chapter": "A2", "chapterName": "A2 土地登記", "text": "關於繼承登記，下列何項敘述錯誤？", "options": ["繼承登記，得自繼承開始之日起，六個月內為之。申請逾期者，每逾一個月得處應納登記費額 一倍之罰鍰", "自繼承開始之日起逾六個月未辦繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告 繼承人於三個月內申請登記；逾期仍未申請者，得由地政機關予以列冊管理", "前項列冊管理期間為十五年，逾期仍未申請登記者，由地政機關將該土地或建築改良物清冊移 請財政部國有財產署公開標售", "標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取，逾十年無繼承人申請 提領該價款者，歸屬國庫"], "answer": 1}, {"id": 366, "year": "108", "num": 22, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "土地所有權辦理買賣移轉登記時，申報土地移轉現值之審核標準，下列何項敘述錯誤？", "options": ["申報人於訂定契約之日起三十日內申報者，以訂約日當期之公告土地現值為準", "申報人逾訂定契約之日起三十日始申報者，以受理申報機關收件日當期之公告土地現值為準", "遺贈之土地，以遺贈人死亡日當期之公告土地現值為準", "依法院判決移轉登記者，以判決確定日當期之公告土地現值為準"], "answer": 3}, {"id": 367, "year": "108", "num": 23, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "區段徵收土地時，地價補償得經土地所有權人申請，以徵收後可供建築之抵價地折算抵付，而抵價地總面積，以徵收總面積百分之五十為原則，如因情況特殊，經上級主管機關核准者，不在此限，但不得少於百分之四十；惟曾經農地重劃者，該重劃地區部分之抵價地不得少於多少？", "options": ["百分之四十三", "百分之四十五", "百分之四十七", "百分之四十九"], "answer": 1}, {"id": 368, "year": "108", "num": 24, "chapter": "C1", "chapterName": "C1 規定地價", "text": "依規定民國109年需辦理重新規定地價，下列對規定地價或重新規定地價之敘述，何項錯誤？", "options": ["規定地價或重新規定地價後，每二年重新規定地價一次，但必要時得延長之", "須分區調查最近一年之土地買賣價格或收益價格", "公告及申報地價，其期限為三十日", "申報地價未滿公告地價百分之八十時，得照價收買或以公告地價為其申報地價"], "answer": 3}, {"id": 369, "year": "108", "num": 25, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "非都市土地依區域計畫法施行細則之規定，得劃定幾種使用區？編定幾種使用地？", "options": ["十種使用區；十八種使用地", "十種使用區；十九種使用地", "十一種使用區；十八種使用地", "十一種使用區；十九種使用地"], "answer": 3}, {"id": 370, "year": "109", "num": 1, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，下列敘述何者錯誤？", "options": ["合法登記之工廠供直接生產使用之自有房屋，免徵房屋稅", "受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之私有房屋，免徵房屋稅", "房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格", "各級政府機關及地方自治機關之公有辦公房屋及其員工宿舍，免徵房屋稅"], "answer": 0}, {"id": 371, "year": "109", "num": 2, "chapter": "G1", "chapterName": "G1 契稅", "text": "關於契稅稅率依契稅條例之規定，下列敘述何者錯誤？", "options": ["買賣契稅為其契價百分之六", "贈與契稅為其契價百分之六", "占有契稅為其契價百分之六", "典權契稅為其契價百分之六"], "answer": 3}, {"id": 372, "year": "109", "num": 3, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "土地所有權人於出售土地後，依土地稅法規定，下列何種情形得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額？", "options": ["土地所有權人於先購買土地後，自完成移轉登記之日起二年後，始行出售土地者", "其新購土地地價超過原出售土地地價，扣除繳納房地交易所得稅後之餘額者", "自耕之農業用地出售後，於二年內另行購買仍供自耕之農業用地者", "土地出售前一年內，曾供營業使用或出租者"], "answer": 2}, {"id": 373, "year": "109", "num": 4, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法規定，有關地價稅優惠稅率與減免，下列敘述何者錯誤？", "options": ["依都市計畫法劃設並經目的事業主管機關核准供公眾停車使用之停車場用地，按千分之十計徵 地價稅", "經目的事業主管機關核准設立之私立公園、體育場所使用範圍內之土地，免徵地價稅", "公有土地按基本稅率徵收地價稅。但公有土地供公共使用者，免徵地價稅", "都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第 17 條之規定外， 統按千分之六計徵地價稅"], "answer": 1}, {"id": 374, "year": "109", "num": 5, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "依平均地權條例規定，為促進土地利用，擴大辦理市地重劃，得獎勵土地所有權人自行組織重劃會辦理市地重劃，下列對獎勵土地所有權人辦理市地重劃之敘述，何者錯誤？", "options": ["減半收取土地權利變更登記及換發權利書狀費用", "土地所有權人參加自辦市地重劃所需費用，得向政府指定之銀行或實施平均地權基金申請低利貸款", "自辦市地重劃區抵費地出售時，不計徵土地增值稅", "免徵或減徵地價稅與田賦"], "answer": 0}, {"id": 375, "year": "109", "num": 6, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法之規定，關於都市計畫之變更，下列敘述何者正確？", "options": ["都市計畫之變更，如直接限制一定區域人民之權利者，則其性質即屬公法上之觀念通知", "都市計畫之變更屬法規性質，並非行政處分，都市計畫個別變更範圍外之人民，如因都市計畫 個別變更致其權利或法律上利益受侵害時，無法提起行政訴訟以資救濟", "為適應國防或經濟發展之需要而變更都市計畫時，應以通盤檢討變更之方式辦理", "為避免重大災害之發生而變更都市計畫時，應以個案迅行變更之方式辦理"], "answer": 3}, {"id": 376, "year": "109", "num": 7, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "依非都市土地使用管制規則規定，關於區域計畫擬定機關核發開發許可後，直轄市或縣（市）政府應報經區域計畫擬定機關廢止原開發許可之情形，下列敘述何者錯誤？", "options": ["興辦事業計畫經目的事業主管機關廢止或依法失其效力、整地排水計畫之核准經直轄市或縣 （市）政府廢止或水土保持計畫之核准經水土保持主管機關廢止或依法失其效力", "申請人自行申請廢止", "與水源供應、鄰近之交通設施、排水系統、電力、電信及垃圾處理等公共設施及公用設備服務 未能相互配合者", "違反核定之土地使用計畫、目的事業或環境影響評估等相關法規，經該管主管機關提出要求處 分並經限期改善而未改善"], "answer": 2}, {"id": 377, "year": "109", "num": 8, "chapter": "C1", "chapterName": "C1 規定地價", "text": "關於規定地價，依平均地權條例之規定，下列敘述何者正確？", "options": ["規定地價後，每三年重新規定地價一次。但必要時得延長之", "直轄市或縣（市）主管機關辦理規定地價或重新規定地價時，須分區調查最近一年之土地買賣 價格或收益價格", "土地所有權人申報之地價未滿公告地價百分之八十時，得徵收之", "土地所有權人未於公告期間申報地價者，以公告地價為其申報地價"], "answer": 1}, {"id": 378, "year": "109", "num": 9, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "都市計畫法有關公共設施保留地之規定，下列敘述何者正確？", "options": ["公共設施保留地劃設逾二十五年未經政府取得者，得優先辦理徵收", "公共設施保留地，其地價補償以徵收當期毗鄰公共設施保留地之平均公告土地現值為準，必要 時得加成補償之", "都市計畫公共設施保留地臨時建築使用辦法，由直轄市、縣（市）政府定之", "依法指定之公共設施保留地，得繼續為原來之使用或改為妨礙目的較輕之使用"], "answer": 3}, {"id": 379, "year": "109", "num": 10, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依平均地權條例之規定，土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起幾日內，檢同契約及有關文件，共同申請土地所有權移轉或設定典權登記，並共同申報其土地移轉現值？", "options": ["10 日", "20 日", "30 日", "40 日"], "answer": 2}, {"id": 380, "year": "109", "num": 11, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "關於原土地所有權人申請已徵收土地之收回權，依土地徵收條例規定，下列敘述何者錯誤？", "options": ["被徵收之土地，依原徵收計畫開始使用後未滿五年，不繼續依原徵收計畫使用者", "原土地所有權人應於該管直轄市或縣（市）主管機關通知後三個月內繳還原受領之補償地價及 地價加成補償，逾期視為放棄收回權", "申請收回土地案件，應由該管直轄市或縣（市）主管機關受理", "被徵收之土地，徵收補償費發給完竣屆滿三年，未依徵收計畫開始使用者"], "answer": 1}, {"id": 381, "year": "109", "num": 12, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "有關徵收補償，依土地徵收條例相關規定，下列敘述何者正確？", "options": ["農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在 1 年以內者，按成熟時 之孳息估定之", "徵收當期市價指徵收公告期滿次日起算第十日經地價評議委員會評定之當期市價", "建築改良物之補償費，按起造當時該建築改良物之重建價格估定之", "被徵收土地在都市計畫區內之公共設施保留地，應按毗鄰公共設施保留地之平均市價補償其地價"], "answer": 0}, {"id": 382, "year": "109", "num": 13, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "關於耕地終止租約與補償，依平均地權條例規定，下列敘述何者正確？", "options": ["耕地出租人依規定終止租約收回耕地時，應補償承租人為改良土地所支付之費用及已收穫之農 作改良物", "耕地出租人依規定終止租約，實際收回耕地屆滿二年後，不依照使用計畫建築使用者，直轄市 或縣（市）政府得照價收買之", "耕地出租人依規定終止租約收回耕地時，承租人得向出租人請求按公告當期該土地之公告土地 現值三分之一之補償", "出租耕地經依法編為建築用地者，出租人為收回自行建築或出售作為建築使用時，得終止租約"], "answer": 3}, {"id": 383, "year": "109", "num": 14, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "甲有A屋一棟，出租給乙居住使用。依土地法第100條之規定，出租人因下列何項情形，得收回房屋？", "options": ["承租人乙因疾病、意外產生有長期住院療養之需要時", "承租人乙積欠租金額，以擔保金抵償之後，尚有 1 個月租金未繳時", "承租人乙違反民法第 443 條第 1 項規定，將該屋轉租給他高中同學時", "承租人乙因為工作調動，無法繼續居住時"], "answer": 2}, {"id": 384, "year": "109", "num": 15, "chapter": "A2", "chapterName": "A2 土地登記", "text": "土地或建築改良物，自繼承開始之日起逾1年未辦理繼承登記者，依土地法之規定，其處理程序何者正確？", "options": ["經縣市地政機關查明後，應即公告繼承人於 6 個月內聲請登記；逾期仍未聲請者，得由地政機 關予以列冊管理", "繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租 賃期間超過 5 年者，於標售後以 5 年為限", "標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾 15 年無繼承人申 請提領該價款者，歸屬國庫", "標售土地或建築改良物前應公告 10 日，繼承人、合法使用人或其他共有人就其使用範圍依序 有優先購買權"], "answer": 1}, {"id": 385, "year": "109", "num": 16, "chapter": "A2", "chapterName": "A2 土地登記", "text": "甲有A屋，與乙簽訂買賣契約但尚未為移轉登記，乙對甲的A屋移轉請求權申請預告登記。下列敘述何者最正確？", "options": ["該預告登記為保全登記、暫時登記，其登記免納登記費", "該預告登記，對於因繼承、強制執行、徵收、法院判決而為之新登記，無排除之效力", "預告登記完畢後，如甲將 A 屋移轉於丙，該處分絕對無效", "嗣後甲欲就 A 屋申辦抵押權次序變更登記時，應檢附乙的同意書，始得為之"], "answer": 0}, {"id": 386, "year": "109", "num": 17, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法規定，下列何種土地不得移轉、設定負擔或租賃於外國人？", "options": ["農地", "墳場用地", "礦地", "學校用地"], "answer": 2}, {"id": 387, "year": "109", "num": 18, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例規定，買賣契稅，應由下列何者申報納稅？", "options": ["銀行", "出賣人", "買受人", "不動產仲介公司"], "answer": 2}, {"id": 388, "year": "109", "num": 19, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，下列何者為房屋稅之納稅義務人？", "options": ["委託人", "受託人", "受益人", "監察人"], "answer": 1}, {"id": 389, "year": "109", "num": 20, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例第25條規定，被徵收之土地，所有權人死亡未辦竣繼承登記，其徵收補償費如何處理？", "options": ["歸屬國庫", "納入平均地權基金", "歸目的事業主管機關所有", "得由部分繼承人按其應繼分領取之"], "answer": 3}, {"id": 390, "year": "109", "num": 21, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，下列何種公共設施應按閭鄰單位或居民分布情形適當配置之？", "options": ["社會福利設施", "垃圾處理場", "污水處理廠", "屠宰場"], "answer": 0}, {"id": 391, "year": "109", "num": 22, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法規定，土地登記損害賠償之請求，如經該地政機關拒絕，受損害人得向下列何者起訴？", "options": ["監察院", "行政院", "立法院", "司法機關"], "answer": 3}, {"id": 392, "year": "109", "num": 23, "chapter": "A5", "chapterName": "A5 公有土地", "text": "依土地法第53條規定，因地籍整理而發現之公有土地，下列敘述何者正確？", "options": ["視為無主土地", "應辦理囑託登記", "地政機關逕為登記", "登記時所有權人欄註明為縣（市）有"], "answer": 2}, {"id": 393, "year": "109", "num": 24, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "關於不動產共有關係，依土地法第34條之1規定，下列敘述何者正確？", "options": ["甲、乙、丙共有一筆土地，其應有部分各三分之一，該地之應有部分出賣時，地上權人、典權 人或房屋承租人有依同樣條件優先購買之權", "土地共有人欲出租共有土地於他人時，得以共有人過半數及其應有部分合計過半數之同意行之", "區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人所有者，應適用土地 法第 34 條之 1 第 4 項規定", "依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直 轄市、縣（市）地政機關調處。不服調處者，應於接到調處通知後十五日內，向司法機關訴請 處理，屆期不起訴者，依原調處結果辦理之"], "answer": 3}, {"id": 394, "year": "109", "num": 25, "chapter": "B3", "chapterName": "B3 國土計畫法", "text": "依國土計畫法規定，縣（市）主管機關應於縣（市）國土計畫公告實施後幾年內，依中央主管機關指定之日期，公告國土功能分區圖？", "options": ["一", "二", "三", "四"], "answer": 3}, {"id": 395, "year": "110", "num": 1, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法規定，外國人投資有助於國內重大建設、整體經濟或農牧經營而需要取得土地時，應先經下列何者程序？", "options": ["中央地政機關備查", "中央目的事業主管機關同意", "該直轄市或縣（市）民意機關同意", "該直轄市或縣（市）政府層請行政院同意"], "answer": 1}, {"id": 396, "year": "110", "num": 2, "chapter": "A2", "chapterName": "A2 土地登記", "text": "有關重新實施地籍測量時，依土地法規定，下列敘述何者正確？", "options": ["土地所有權人發生界址爭議時，應由該管直轄市或縣（市）地政機關予以調處", "土地所有權人不服界址爭議調處者，應於接到調處通知後三十日內，向司法機關訴請處理", "土地所有權人認為測量結果有錯誤時，得於重測結果公告期滿三十日內聲請複丈", "重測結果未經聲請複丈者，地政機關應即據以辦理土地更正登記"], "answer": 0}, {"id": 397, "year": "110", "num": 3, "chapter": "A5", "chapterName": "A5 公有土地", "text": "依土地法之規定，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，應如何處理？", "options": ["由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為國有", "由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有", "由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為直轄市或縣（市）有", "由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為直轄市或縣（市）有"], "answer": 1}, {"id": 398, "year": "110", "num": 4, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法規定，聲請為土地權利變更登記，應繳納登記費，下列敘述何者正確？", "options": ["由權利人與義務人雙方共同按公告地價或權利價值千分之一繳納登記費", "由權利人按公告現值或權利價值千分之二繳納登記費", "由權利人按申報地價或權利價值千分之一繳納登記費", "由義務人按公告現值或權利價值千分之二繳納登記費"], "answer": 2}, {"id": 399, "year": "110", "num": 5, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，房屋租用相關規定，下列何者錯誤？", "options": ["城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限", "約定房屋租金，超過土地法規定者，該管直轄市或縣（市）政府得依土地法所定標準強制減定之", "房屋租金擔保之金額，不得超過二個月房屋租金之總額", "以現金為租賃之擔保者，其現金視為租金之一部"], "answer": 3}, {"id": 400, "year": "110", "num": 6, "chapter": "I1", "chapterName": "I1 耕地三七五減租", "text": "依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經何機關同意？", "options": ["行政院", "財政部", "民意機關", "農業發展委員會"], "answer": 2}, {"id": 401, "year": "110", "num": 7, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？", "options": ["3 個月", "6 個月", "1年", "3年"], "answer": 1}, {"id": 402, "year": "110", "num": 8, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "平均地權條例第35條之1規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰鍰。下列何者不是規範中的情形？", "options": ["未辦理用地變更者", "未按捐贈目的使用土地者", "違反各該事業設立宗旨者", "土地收益未全部用於各該事業者"], "answer": 0}, {"id": 403, "year": "110", "num": 9, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "有關平均地權條例對違反申報登錄之規定中，直轄市、縣（市）主管機關應先令其限期改正，屆期未改正者，處新臺幣六千元以上三萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰的情形係指下列何種狀況？", "options": ["申報登錄價格資訊不實", "申報登錄價格以外資訊不實", "未依限申報登錄資訊、申報登錄價格或交易面積資訊不實", "金融機構、權利人、義務人、地政士或不動產經紀業規避、妨礙或拒絕查核"], "answer": 1}, {"id": 404, "year": "110", "num": 10, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例規定，預售屋買受人將已付定金，確立買賣標的物及價金等事項之書面契據，轉售予第三人時，由直轄市、縣（市）主管機關按戶（棟）處罰新臺幣多少元？", "options": ["三萬元以上十五萬元以下罰鍰", "六萬元以上三十萬元以下罰鍰", "十五萬元以上一百萬元以下罰鍰", "三十萬元以上一百萬元以下罰鍰"], "answer": 2}, {"id": 405, "year": "110", "num": 11, "chapter": "A1", "chapterName": "A1 總則", "text": "下列有關平均地權條例對以經營土地買賣，違背土地法律，從事土地壟斷、投機者處罰規定之敘述，何者正確？", "options": ["處一年以下有期徒刑，並得併科五千元以下罰金", "處三年以下有期徒刑，並得併科七千元以下罰金", "處一年以下有期徒刑，並得併科八千元以下罰金", "處三年以下有期徒刑，並得併科一萬元以下罰金"], "answer": 1}, {"id": 406, "year": "110", "num": 12, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "拒絕受領之徵收補償費，依土地徵收條例規定存入專戶保管，並通知應受補償人。自通知送達發生效力之日起，最長逾幾年未領取之補償費，歸屬國庫？", "options": ["5年", "10 年", "15 年", "20 年"], "answer": 2}, {"id": 407, "year": "110", "num": 13, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例規定，建築改良物之補償費，按徵收當時該建築改良物之下列何種價格估定之？", "options": ["市價", "重置價格", "重建價格", "房屋評定現值"], "answer": 2}, {"id": 408, "year": "110", "num": 14, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法規定，未辦理繼承登記之土地經列冊管理達多久後，逾期仍未聲請登記者，該土地應如何處理？", "options": ["列冊管理期間為 15 年，由財務部國有財產署公開標售", "列冊管理期間為 15 年，由地政機關公開標售", "列冊管理期間為 20 年，由法院公開拍賣", "列冊管理期間為 20 年，逕登記為國有土地"], "answer": 0}, {"id": 409, "year": "110", "num": 15, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "土地權利關係人依都市計畫法第24條規定自行擬定或變更細部計畫時，主管機關得要求土地權利關係人提供或捐贈都市計畫變更範圍內之那些回饋項目予當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所？①公共設施用地②可建築土地③樓地板面積④一定金額", "options": ["僅①④", "僅①②③", "僅②③④", "①②③④"], "answer": 3}, {"id": 410, "year": "110", "num": 16, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "私有公共設施保留地得申請與公有非公用土地辦理交換，依都市計畫法之規定，不受下列那些法規相關規定之限制？①土地法②所得稅法③國有財產法④各級政府財產管理法令", "options": ["②④", "②③④", "①③④", "①②③④"], "answer": 2}, {"id": 411, "year": "110", "num": 17, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "非都市土地經劃定使用分區並編定使用地類別，應依其容許使用之項目及許可使用細目使用。但中央目的事業主管機關認定為重大建設計畫所需之臨時性設施，經徵得使用地之中央主管機關及有關機關同意後，得核准為臨時使用。中央目的事業主管機關於核准時，應函請直轄市或縣（市）政府將臨時使用用途及期限等資料，依相關規定程序登錄於何處？", "options": ["土地登記謄本", "土地參考資訊檔", "土地使用分區證明", "非都市土地許可使用書"], "answer": 1}, {"id": 412, "year": "110", "num": 18, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "依非都市土地使用管制規則規定，土地使用編定後，其原有使用或原有建築物不合土地使用分區規定者，其使用限制，下列敘述何者錯誤？", "options": ["在政府令其變更使用或拆除建築物前，得為從來之使用", "原有建築物除准修繕和增建外，不得改建", "若該土地或建築物，對公眾安全、衛生及福利有重大妨礙者，該管直轄市或縣（市）政府應限 期令其變更或停止使用、遷移、拆除或改建", "政府令其變更或停止使用，所受損害應予適當補償"], "answer": 1}, {"id": 413, "year": "110", "num": 19, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依土地稅法規定，土地所有權人第一次出售其自用住宅用地，其適用自用住宅用地特別稅率之要件，下列敘述何者正確？①都市土地面積未超過三公畝部分和非都市土地面積未超過七公畝部分②其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之③需土地於出售前5年內，不曾供營業使用或出租者④土地所有權人與其配偶及未成年直系親屬需於該地辦竣戶籍登記", "options": ["②", "①②", "①②④", "③④"], "answer": 0}, {"id": 414, "year": "110", "num": 20, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依土地稅法免徵土地增值稅之土地，主管稽徵機關依相關規定核定其移轉現值並發給免稅證明，以憑辦理土地所有權移轉登記，下列有關移轉現值核定之敘述何者正確？", "options": ["各級政府出售之公有土地，以實際出售價額為準", "各級政府贈與或受贈之土地，以土地點交日之公告土地現值為準", "區段徵收抵價地，以區段徵收時實際測量及登記完竣之地價為準", "私人捐贈供興辦社會福利事業之土地，以社會福利事業核准日之公告土地現值為準"], "answer": 0}, {"id": 415, "year": "110", "num": 21, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "平均地權條例第74條規定，依第26條規定限期建築之土地，有下列三種情形之一者，土地所有權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成時，得終止租約、借貸或撤銷地上權。下列何者是規範中的情形？", "options": ["土地所有權人將其土地出租、貸與或設有地上權者", "土地所有權人將其土地設定典權或設定不動產役權者", "土地所有權人將其所有之農作改良物出租或貸與他人使用者", "土地承典人或地役權人將其所有建築改良物出租或貸與他人使用者"], "answer": 0}, {"id": 416, "year": "110", "num": 22, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例規定，以不動產為信託財產，受託人乙依信託本旨移轉信託財產與委託人甲以外之歸屬權利人丙時，應由何人估價立契，在規定之期限申報契稅？又其契稅稅率為何？", "options": ["由乙申報契稅，稅率為 6%", "由乙申報契稅，稅率為 2%", "由丙申報契稅，稅率為 6%", "由甲申報契稅，稅率為 2%"], "answer": 2}, {"id": 417, "year": "110", "num": 23, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，其稅率計算下列何者正確？", "options": ["持有房屋、土地之期間在三年以內者，稅率為百分之四十五", "持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五", "持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十", "持有房屋、土地之期間超過十年者，稅率為百分之十五"], "answer": 3}, {"id": 418, "year": "110", "num": 24, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "依所得稅法規定，個人出售自住房屋、土地，依規定繳納之稅額，申請房地合一所得稅重購退稅之敘述，下列何者錯誤？", "options": ["需自完成移轉登記之日起算二年內，重購自住房屋、土地者", "得於重購自住房屋、土地完成移轉登記次日起算二年內，申請退稅", "申請按重購價額占出售價額之比率，自所繳納稅額計算退還", "重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原退還稅額"], "answer": 1}, {"id": 419, "year": "110", "num": 25, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "依所得稅法規定，陳先生在110年10月以900萬元出售其於107年以700萬元購入之房地產，110年當期土地之公告現值為800萬元，陳先生個人未提示因取得、改良及移轉而支付之費用時，稽徵機關得以多少元計算其費用？", "options": ["24 萬元", "27 萬元", "30 萬元", "45 萬元"], "answer": 1}, {"id": 420, "year": "111", "num": 1, "chapter": "A2", "chapterName": "A2 土地登記", "text": "下列有關未辦繼承登記不動產處理方式之敘述，何者正確？", "options": ["未辦繼承登記不動產，於繼承開始之日起逾六個月未辦理繼承登記者，該管直轄市或縣市地政 機關於查明後，應即公告繼承人於一個月內聲請登記", "未辦繼承登記不動產，由該管直轄市或縣市地政機關列冊管理期間為十年", "未辦繼承登記不動產，逾期仍未辦繼承而由該管直轄市或縣市地政機關公開標售時，土地或建 築改良物租賃期間未超過五年者，於標售後以五年為限", "逾期未辦繼承登記不動產於經公開標售之價款儲存設立在國庫專戶時，繼承人得依其法定應繼 分申請領取"], "answer": 3}, {"id": 421, "year": "111", "num": 2, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "下列有關共有不動產處分等之敘述，何者錯誤？", "options": ["共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，應有共有人 過半數及其應有部分合計過半數之同意", "共有土地或建築改良物的處分、變更或設定負擔，共有人應事先以書面通知他共有人；如不能 以書面通知時，應依法公示催告之", "共有人對共有土地或建築改良物的處分、變更及設定地上權、農育權、不動產役權或典權，對 於他共有人應得之對價或補償，負連帶清償責任", "甲乙丙公同共有一筆土地，甲依法得出賣該共有土地時，乙丙得以同一價格單獨優先承購"], "answer": 1}, {"id": 422, "year": "111", "num": 3, "chapter": "C1", "chapterName": "C1 規定地價", "text": "依土地稅法規定，土地所有權人辦理土地移轉繳納土地增值稅時，在其持有土地期間內，因重新規定地價增繳之地價稅，准予抵繳其應納之土地增值稅之總額，以不超過土地移轉時應繳增值稅總額多少為限？", "options": ["百分之一", "百分之二", "百分之三", "百分之五"], "answer": 3}, {"id": 423, "year": "111", "num": 4, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例之規定，下列有關房屋稅納稅義務人之敘述，何者錯誤？", "options": ["原則上向房屋所有人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，向使用執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照者，向建造執照所載起造人徵收之", "未辦建物所有權第一次登記且所有人不明之房屋，無使用執照、亦無建造執照者，暫不徵收之"], "answer": 3}, {"id": 424, "year": "111", "num": 5, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例之規定，下列敘述何者錯誤？", "options": ["買賣契稅，應由出賣人申報納稅", "典權契稅，應由典權人申報納稅", "買賣契稅之稅率為其契價百分之六", "分割契稅之稅率為其契價百分之二"], "answer": 0}, {"id": 425, "year": "111", "num": 6, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例之規定，以不動產為信託財產時，在信託關係人間移轉所有權時，何種情形須課徵契稅？", "options": ["因信託行為成立，委託人與受託人間", "信託契約明定信託財產之歸屬人為第三人者，信託關係消滅時，委託人與歸屬人間", "因信託行為不成立，委託人與受託人間", "信託關係存續中受託人變更時，原受託人與新受託人間"], "answer": 1}, {"id": 426, "year": "111", "num": 7, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例之規定，下列何種契約的契稅稅率最低？", "options": ["買賣契約", "典權契約", "分割契約", "贈與契約"], "answer": 2}, {"id": 427, "year": "111", "num": 8, "chapter": "B1", "chapterName": "B1 區域計畫法", "text": "依規定，非都市土地甲種建築用地之建蔽率為百分之六十，容積率為百分之二百四十。倘甲有1筆100坪的甲種建築用地想規劃蓋1棟豪宅自住，請問甲的房屋每層樓最大建坪有幾坪？可蓋幾層樓高？", "options": ["最大建坪 60 坪，4 層樓高", "最大建坪 60 坪，5 層樓高", "最大建坪 100 坪，2 層樓高", "最大建坪 100 坪，3 層樓高"], "answer": 0}, {"id": 428, "year": "111", "num": 9, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "依都市計畫法指定供公用事業設施使用之公共設施保留地，應由各該事業機構依法徵收或購買；其餘由公用事業設施所屬政府或鄉、鎮、縣轄市公所依何種方式取得？", "options": ["徵收、區段徵收、市地重劃", "協議價購、公私土地交換、都市更新", "都市更新、市地重劃、區段徵收", "徵收、協議價購、公私土地交換"], "answer": 0}, {"id": 429, "year": "111", "num": 10, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "下列何類徵收事業之需用土地人在補償費未發給完竣前，或未核定發給抵價地前，因公共安全急需，得先進入被徵收土地內工作？", "options": ["國防事業、平價住宅事業、水利事業", "交通事業、水利事業、社會福利事業", "高齡化事業、少子化事業、防疫事業", "國防事業、交通事業、水利事業"], "answer": 3}, {"id": 430, "year": "111", "num": 11, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "依土地徵收條例之規定，下列敘述何者正確？", "options": ["撤銷或廢止徵收者，徵收前原設定之他項權利及耕地租約得予回復", "撤銷或廢止徵收者，如原土地所有權人及他項權利人申請於發給之抵價地上設定抵押權或典權 時，其原抵押權或典權不予回復", "撤銷或廢止徵收，由需用土地人向中央主管機關申請之", "撤銷或廢止徵收，由該管直轄市或縣（市）主管機關單獨向中央主管機關申請之"], "answer": 2}, {"id": 431, "year": "111", "num": 12, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "都市計畫地區於訂定分區發展優先次序後，第一期發展地區應於主要計畫發布實施後，多久期限完成細部計畫？並於細部計畫發布後，多久期限完成公共設施建設？", "options": ["五年內完成細部計畫，細部計畫發布後二年內完成公共設施建設", "四年內完成細部計畫，細部計畫發布後三年內完成公共設施建設", "三年內完成細部計畫，細部計畫發布後四年內完成公共設施建設", "二年內完成細部計畫，細部計畫發布後五年內完成公共設施建設"], "answer": 3}, {"id": 432, "year": "111", "num": 13, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法第34條之1規定，共有土地之處分、變更，下列何比例之同意，方得行之？", "options": ["共有人三分之一及其應有部分合計過二分之一之同意", "共有人二分之一及其應有部分合計過三分之一之同意", "共有人合計逾三分之二之同意", "應有部分合計逾三分之二之同意"], "answer": 3}, {"id": 433, "year": "111", "num": 14, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法第17條規定，下列何項土地得租賃於外國人？", "options": ["林地", "牧地", "漁地", "鹽地"], "answer": 1}, {"id": 434, "year": "111", "num": 15, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法規定，私有土地所有權之移轉或租賃，妨害基本國策者，下列何者得報請行政院制止之？", "options": ["監察院", "國有財產署", "中央地政機關", "不動產經紀人員獎懲委員會"], "answer": 2}, {"id": 435, "year": "111", "num": 16, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，租用建築房屋之基地，發生下列何種情形時，出租人不得收回？", "options": ["承租人以基地供違反法令之使用時", "承租人轉租基地於他人時", "承租人積欠租金額，除以擔保現金抵償外，達二個月以上時", "承租人違反租賃契約時"], "answer": 2}, {"id": 436, "year": "111", "num": 17, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "依土地徵收條例規定，區段徵收範圍內土地，經規劃整理後，有關其處理方式，下列敘述何者錯誤？", "options": ["抵價地發交被徵收土地所有權人領回", "國民住宅用地得以讓售", "安置原住戶所需土地得以讓售", "可供建築土地依規定標租時，其期限不得逾二十五年"], "answer": 3}, {"id": 437, "year": "111", "num": 19, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "依土地徵收條例規定，已公告徵收之土地，因作業錯誤，致原徵收之土地不在工程用地範圍內者，應如何處理？", "options": ["應辦理廢止徵收", "應辦理撤銷徵收", "應辦理徵收收回", "應辦理徵收失效"], "answer": 1}, {"id": 438, "year": "111", "num": 20, "chapter": "A2", "chapterName": "A2 土地登記", "text": "聲請為土地權利變更登記之案件，在登記尚未完畢前，登記機關接獲法院為何種囑託登記時，應即改辦之？", "options": ["查封登記、預告登記", "假處分登記、滅失登記", "假扣押登記、破產登記", "輔助宣告登記、監護宣告登記"], "answer": 2}, {"id": 439, "year": "111", "num": 21, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "徵收土地或土地改良物應發給之補償費，需用土地人應於公告期滿後十五日內將補償費繳交該管直轄市或縣（市）主管機關發給完竣，逾期者該部分土地或土地改良物之法律效力為何？", "options": ["仍具徵收效力", "徵收從此失其效力", "被徵收之所有權人得申請撤銷徵收", "需用土地人得申請保留徵收"], "answer": 1}, {"id": 440, "year": "111", "num": 22, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依平均地權條例規定，土地所有權移轉或設定典權時，有關申報移轉現值之審核標準，下列敘述何者正確？", "options": ["遺贈之土地，以遺贈人簽立遺囑當期之公告土地現值為準", "申報人逾訂定契約之日起三十日始申報者，以訂約日當期之公告土地現值為準", "依法院判決移轉登記者，以法院終局判決日當期之公告土地現值為準", "經法院拍賣之土地，以拍定日當期之公告土地現值為準"], "answer": 3}, {"id": 441, "year": "111", "num": 23, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "依平均地權條例規定，實施市地重劃時，重劃區內供公共使用之道路等十項用地，應優先以下列何種土地抵充？", "options": ["原廣場、綠地、停車場、零售市場地", "原公有道路、溝渠、河川及未登記地", "原兒童遊樂場、鄰里公園、國民小學、國民中學地", "原國有地、學產地、直轄市縣（市）有地、鄉鎮（市）有地"], "answer": 1}, {"id": 442, "year": "111", "num": 24, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "下列何者不屬於平均地權條例獎勵土地所有權人自行辦理市地重劃事業之獎勵事項？", "options": ["優先興建重劃區之公共設施", "免收或減收換發權利書狀費用", "免徵或減徵地價稅與田賦", "給予免息之重劃貸款"], "answer": 3}, {"id": 443, "year": "111", "num": 25, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例規定，下列銷售預售屋者相關規定之敘述，何者錯誤？", "options": ["應於銷售前將預售屋買賣定型化契約，報請預售屋坐落基地所在之直轄市、縣（市）主管機關 備查", "原則上應於簽訂買賣契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄資訊", "向買受人收受定金，應以書面契據確立買賣價金等事項，並不得約定不利於買受人之事項", "向買受人收受定金所訂立之書面契據，得轉售予第三人"], "answer": 3}, {"id": 444, "year": "112", "num": 1, "chapter": "E1", "chapterName": "E1 地價稅", "text": "都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，其地價稅之計徵，下列何者正確？", "options": ["免徵", "按千分之六稅率計徵", "按千分之十稅率計徵", "按千分之二稅率計徵"], "answer": 0}, {"id": 445, "year": "112", "num": 2, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "關於土地所有權人出售自用住宅用地時，土地增值稅適用「一生一次」之優惠稅率，下列何者正確？", "options": ["土地增值稅之優惠稅率為千分之二", "僅限於都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分", "土地於出售前一年內，曾供營業使用或出租", "出售前應持有該土地三年以上"], "answer": 1}, {"id": 446, "year": "112", "num": 3, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依土地稅法規定，已規定地價之土地設定典權時之預繳土地增值稅，下列何者正確？", "options": ["典權人回贖時，原繳之土地增值稅，應加計利息退還", "典權人回贖時，原繳之土地增值稅，應無息退還", "出典人回贖時，原繳之土地增值稅，應加計利息退還", "出典人回贖時，原繳之土地增值稅，應無息退還"], "answer": 3}, {"id": 447, "year": "112", "num": 4, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "土地所有權經法院判決移轉登記者，土地增值稅申報移轉現值之審核標準，下列何者正確？", "options": ["以法院判決日當期之公告土地現值為準", "以申報人向法院起訴日當期之公告土地現值為準", "以法院判決送達日當期之公告土地現值為準", "以申報人向主管稽徵機關申報日當期之公告土地現值為準"], "answer": 1}, {"id": 448, "year": "112", "num": 5, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法規定，地價稅之稅率，下列何者錯誤？", "options": ["地價稅之基本稅率為千分之十", "土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按千 分之十稅率徵收", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價五倍者，就其超過部 分課徵千分之十五", "土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價十五倍至二十倍者， 就其超過部分課徵千分之四十五"], "answer": 2}, {"id": 449, "year": "112", "num": 6, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法規定，關於共有土地之處分，下列何者正確？", "options": ["應以共有人半數及其應有部分半數之同意行之", "應有部分合計三分之二者，其人數不予計算", "共有人不能以書面通知他共有人者，應公告之", "共有人不得單獨處分其應有部分"], "answer": 2}, {"id": 450, "year": "112", "num": 7, "chapter": "A2", "chapterName": "A2 土地登記", "text": "有關土地總登記，經聲請而逾限未補繳證明文件者之情形，下列何者錯誤？", "options": ["其土地視為無主土地", "由該管直轄市或縣（市）地政機關公告之", "公告期間不得少於十五日", "公告期滿，無人提出異議，即為國有土地之登記"], "answer": 2}, {"id": 451, "year": "112", "num": 8, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法規定，有關繼承登記，下列何者正確？", "options": ["繼承登記應於繼承開始之日起一個月內為之，否則視為逾期登記", "繼承開始之日起逾三個月未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告 繼承人於一年內聲請登記", "逾期未聲請繼承登記之土地，經地政機關列冊管理十五年，逾期仍未聲請繼承登記者，由地政 機關將該土地清冊移請財政部國有財產署公開標售", "標售逾期未辦繼承登記土地所得之價款，逾十五年無繼承人申請提領該價款者始得歸屬國庫"], "answer": 2}, {"id": 452, "year": "112", "num": 9, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例之規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託刊登讓與或轉售廣告，但於下列何種情形不在此限？", "options": ["配偶、直系血親或二親等內旁系血親間之讓與或轉售", "配偶、直系姻親或二親等內旁系姻親間之讓與或轉售", "配偶、直系姻親或二親等內旁系血親間之讓與或轉售", "配偶、直系血親或二親等內旁系姻親間之讓與或轉售"], "answer": 0}, {"id": 453, "year": "112", "num": 10, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例之規定，委託不動產經紀業代銷預售屋者，應於何時向直轄市、縣（市）主管機關申報登錄資訊？", "options": ["應於簽訂買賣契約之日起至少十日內申報", "應於簽訂買賣契約之日起至少十五日內申報", "應於簽訂買賣契約之日起三十日內申報", "應於簽訂買賣契約之日起四十五日內申報"], "answer": 2}, {"id": 454, "year": "112", "num": 11, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "依市地重劃實施辦法之規定，土地所有權人重劃後應分配土地面積已達重劃區最小分配面積標準二分之一，經主管機關按最小分配面積標準分配後，如申請放棄分配土地而改領現金補償，下列何者正確？", "options": ["以其重劃前原有面積按原位置評定重劃後地價發給現金補償", "以其重劃前原有面積按原位置評定重劃前地價發給現金補償", "以其應分配權利面積，按重劃後分配位置之評定重劃後地價予以計算補償", "以其應分配權利面積，按重劃後分配位置之評定重劃前地價予以計算補償"], "answer": 2}, {"id": 455, "year": "112", "num": 12, "chapter": "G1", "chapterName": "G1 契稅", "text": "以下關於契稅之敘述，何者正確？", "options": ["買賣契稅應由出賣人申報納稅", "贈與契稅應由贈與人估價立契，申報納稅", "典權契稅，應由典權人申報納稅", "占有契稅稅率為其契價百分之二"], "answer": 2}, {"id": 456, "year": "112", "num": 13, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例規定，因受領遲延、拒絕受領或不能受領之補償費，下列何者正確？", "options": ["依提存法提存於直轄市或縣（市）主管機關於國庫設立之土地徵收補償費保管專戶", "直轄市或縣（市）主管機關應於補償費發給期限屆滿之日起三個月內存入專戶保管", "保管專戶儲存之補償費應給付利息", "已依規定繳存專戶保管之徵收補償費，自徵收公告期滿之日起，逾十五年未領取者，歸屬國庫"], "answer": 2}, {"id": 457, "year": "112", "num": 14, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "已公告徵收之土地，依徵收計畫開始使用前，興辦之事業改變時，依土地徵收條例之規定，下列何者正確？", "options": ["應撤銷徵收", "應廢止徵收", "土地所有權人得行使收回權", "應舉行聽證"], "answer": 1}, {"id": 458, "year": "112", "num": 15, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地登記規則之規定，於何種情形下登記機關應以書面敘明理由或法令依據，通知申請人於接到通知書之日起十五日內補正，下列何者錯誤？", "options": ["申請人之資格不符或其代理人之代理權有欠缺", "登記申請書不合程式，或應提出之文件不符或欠缺", "未依規定繳納登記規費", "登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執"], "answer": 3}, {"id": 459, "year": "112", "num": 16, "chapter": "A1", "chapterName": "A1 總則", "text": "我國物權係採法定主義，於土地所有權以外之其他不動產物權，謂之他項權利，依民法及土地法之規定，下列何者非屬物權？", "options": ["抵押權", "農育權", "耕作權", "租賃權"], "answer": 3}, {"id": 460, "year": "112", "num": 17, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法之規定，外國人為供自用、投資或公益之目的使用，得取得所需之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制，下列何種用途不屬之？", "options": ["長照機構", "住宅", "醫院", "營業處所、辦公場所、商店及工廠"], "answer": 0}, {"id": 461, "year": "112", "num": 18, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法第三十四條之一執行要點規定，有關共有人權利之行使，下列何者錯誤？", "options": ["部分共有人就共有土地或建築改良物為處分、變更及設定地上權、農育權、不動產役權或典權， 應就共有物之全部為之", "部分共有人依本法條規定為處分、變更或設定負擔前，應先行通知他共有人", "出賣共有土地或建築改良物時，他共有人得以出賣之同一條件共同或單獨優先購買", "他共有人於接到出賣通知後二十日內不表示者，其優先購買權視為放棄"], "answer": 3}, {"id": 462, "year": "112", "num": 19, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法規定，有關地籍測量之相關規定，下列何者錯誤？", "options": ["地籍測量時，土地所有權人應設立界標，並永久保存之", "地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經該地方之地政機關核定", "重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界", "重新實施地籍測量之結果，應予公告，其期間為三十日"], "answer": 1}, {"id": 463, "year": "112", "num": 20, "chapter": "A2", "chapterName": "A2 土地登記", "text": "依土地法之規定，有關土地登記之損害賠償，下列何者錯誤？", "options": ["因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任", "登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關 查明核准後，不得更正", "地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員及地政機關負連帶損害 賠償責任，撥歸登記儲金", "損害賠償之請求，如經該地政機關拒絕，受損害人得向司法機關起訴"], "answer": 2}, {"id": 464, "year": "112", "num": 21, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "依平均地權條例規定，對私有空地之處置，下列何者錯誤？", "options": ["規定照價收買者，以收買當期之平均市價為準", "逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅 或照價收買", "依規定限期建築、增建、改建或重建之土地，其新建之改良物價值不及所占基地申報地價百分 之五十者，直轄市或縣（市）政府不予核發建築執照", "直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、 改建或重建"], "answer": 0}, {"id": 465, "year": "112", "num": 22, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於多少？", "options": ["五百分之一", "一千分之一", "一萬分之一", "一萬五千分之一"], "answer": 2}, {"id": 466, "year": "112", "num": 23, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "依所得稅法之規定，個人依第14條之4前2項規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30條第1項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？", "options": ["持有房屋、土地之期間在二年以內者，稅率為百分之三十五", "持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五", "因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土 地者，稅率為百分之二十", "個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土 地者，稅率為百分之二十五"], "answer": 2}, {"id": 467, "year": "112", "num": 24, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列何項非屬所規範者？", "options": ["土地進行訴訟者", "權屬不明者", "納稅義務人行蹤不明者", "土地所有權人申請由占有人代繳者"], "answer": 0}, {"id": 468, "year": "112", "num": 25, "chapter": "B3", "chapterName": "B3 國土計畫法", "text": "有關土地利用計畫之通盤檢討相關規定，下列何者正確？", "options": ["全國國土計畫每五年通盤檢討一次", "直轄市、縣（市）國土計畫每十年通盤檢討一次", "都市計畫每三年內或五年內至少應通盤檢討一次", "區域計畫每十年通盤檢討一次"], "answer": 2}, {"id": 469, "year": "113", "num": 1, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？", "options": ["全國每一年以一戶（棟）為限", "全國每一年以二戶（棟）為限", "全國每二年以一戶（棟）為限", "全國每二年以三戶（棟）為限"], "answer": 2}, {"id": 470, "year": "113", "num": 2, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？", "options": ["新臺幣三萬元以上十五萬元以下罰鍰", "新臺幣六萬元以上三十萬元以下罰鍰", "新臺幣十五萬元以上五十萬元以下罰鍰", "新臺幣三十萬元以上一百萬元以下罰鍰"], "answer": 0}, {"id": 471, "year": "113", "num": 3, "chapter": "C4", "chapterName": "C4 申報登錄預售屋", "text": "依平均地權條例規定，有關私法人買受供住宅使用之房屋，下列何者正確？", "options": ["應檢具切結書，經中央主管機關許可", "中央主管機關審核其使用計畫，以合議制方式辦理", "私法人取得之房屋，於登記完畢後十年內不得辦理預告登記", "許可之文件有效期限為二年"], "answer": 1}, {"id": 472, "year": "113", "num": 4, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，有關主要計畫之核定，下列何者正確？", "options": ["鎮及鄉街之主要計畫由內政部核定", "直轄市之主要計畫由行政院核定", "特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案", "特定區計畫由內政部訂定者，由行政院核定"], "answer": 0}, {"id": 473, "year": "113", "num": 5, "chapter": "D4", "chapterName": "D4 撤銷廢止徵收", "text": "依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？", "options": ["撤銷或廢止徵收，由需用土地人向中央主管機關申請之", "在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣 （市）政府列管", "依徵收計畫開始使用前，開發方式改變，應廢止徵收", "因作業錯誤，致原徵收之土地不在工程用地範圍內，應撤銷徵收"], "answer": 1}, {"id": 474, "year": "113", "num": 6, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例規定，有關徵收補償費，下列何者正確？", "options": ["在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價", "徵收補償之地價，由不動產估價師評定之", "建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之", "農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時 之孳息估定之"], "answer": 3}, {"id": 475, "year": "113", "num": 7, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部分，下列何者錯誤？", "options": ["自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫", "應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管", "保管未受領之徵收補償費，不適用提存法之規定", "未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"], "answer": 0}, {"id": 476, "year": "113", "num": 8, "chapter": "D1", "chapterName": "D1 徵收程序要件", "text": "依土地徵收條例規定，有關徵收之程序，下列何者正確？", "options": ["特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證", "需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會", "協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用", "需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"], "answer": 2}, {"id": 477, "year": "113", "num": 9, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正者，後續如何辦理？", "options": ["免再公開展覽及舉行說明會", "再公開展覽", "再舉行說明會", "再公開展覽及舉行說明會"], "answer": 0}, {"id": 478, "year": "113", "num": 10, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？", "options": ["繼承人、合法使用人、其他共有人", "其他共有人、合法使用人、繼承人", "合法使用人、繼承人、其他共有人", "繼承人、其他共有人、合法使用人"], "answer": 0}, {"id": 479, "year": "113", "num": 11, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之？", "options": ["七日", "十日", "十五日", "三十日"], "answer": 2}, {"id": 480, "year": "113", "num": 12, "chapter": "A5", "chapterName": "A5 公有土地", "text": "依土地法規定，關於地權及地權限制，下列何者正確？", "options": ["台灣糖業股份有限公司所有土地為公有土地", "私有土地，因天然變遷成為湖澤或可通運之水道時，其所有權絕對消滅", "湖澤及可通運之水道及岸地，如因水流變遷而自然增加時，其接連地之使用權人，有優先依法 取得其所有權或使用受益之權", "私有土地所有權之移轉、設定負擔或租賃，妨害基本國策者，中央地政機關得報請行政院制止之"], "answer": 3}, {"id": 481, "year": "113", "num": 13, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "都市計畫地區範圍內，應視實際情況，分別設置公共設施用地，其設置標準之規定，下列何者正確？", "options": ["應就人口分布、所得及納稅能力、地價高低、產業進駐情形等現狀，決定其項目、位置與面積， 以增進市民活動之便利，及確保良好之都市生活環境", "中小學校、社教場所、社會福利設施、市場、郵政、電信、變電所、衛生、警所、消防、防空 等公共設施，應按閭鄰單位或居民分布情形適當配置之", "公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口密度及自然環境，作有系統之布置， 除具有特殊情形外，其占用土地總面積不得少於全部計畫面積百分之二十", "道路系統、停車場所及加油站，應按土地使用分區及交通情形與預期之發展配置之。鐵路、公 路通過實施都市計畫之區域者，應以市區中心為規劃重點，以增進市民活動之便利"], "answer": 1}, {"id": 482, "year": "113", "num": 14, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？", "options": ["公共設施保留地在未取得前，得申請為臨時建築使用", "不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用", "私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府 財產管理法令相關規定之限制", "地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不 得請求補償"], "answer": 3}, {"id": 483, "year": "113", "num": 15, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，下列有關建築基地出賣時行使優先購買權之敘述，何者錯誤？", "options": ["地上權人、典權人或承租人有依同樣條件優先購買之權", "優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄", "出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人", "基地承租人與基地共有人行使優先購買權發生競合時，其順序以登記之先後定之"], "answer": 3}, {"id": 484, "year": "113", "num": 16, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法規定，下列有關逾期未辦繼承登記案件應由地政機關書面通知繼承人之情形，何者正確？", "options": ["自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告 繼承人於六個月內聲請登記，並以書面通知繼承人", "列冊管理期間為十五年，列冊管理期間該管直轄市或縣市地政機關應每年清查並書面通知繼承 人辦理繼承登記", "列冊管理期間屆滿，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良 物清冊移請財政部國有財產署公開標售", "標售土地或建築改良物前應公告三個月，並書面通知繼承人、共有人或合法使用人依序行使優 先購買權"], "answer": 2}, {"id": 485, "year": "113", "num": 17, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "甲乙丙丁戊共有A地，持分各五分之一。甲乙丙三人擬依土地法第34條之1規定，將A地出售予戊，下列敘述何者正確？", "options": ["不適法，出售為有償讓與行為，應依民法規定，經共有人全體同意始得為之", "不適法，共有人不得為受讓人", "適法，甲乙丙三人已符合共有人過半數及其應有部分合計過半數之同意的行使要件", "適法，買賣契約業經甲乙丙戊同意，縱使戊未經計算在同意人數及應有部分內，仍得依土地法 第 34 條之 1 辦理"], "answer": 1}, {"id": 486, "year": "113", "num": 18, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？", "options": ["抵費地發交被徵收土地所有權人領回", "零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有", "標租時，其期限不得逾九十九年", "安置原住戶土地得以標售"], "answer": 2}, {"id": 487, "year": "113", "num": 19, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？", "options": ["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四", "最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "answer": 1}, {"id": 488, "year": "113", "num": 20, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例規定，有關申報契稅之起算日期，下列何者正確？", "options": ["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日", "不動產移轉發生糾紛時，以法院判決確定之日為申報起算日", "向法院標購拍賣之不動產，以承買人拍定之日為申報起算日", "建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執 照之日為申報起算日"], "answer": 1}, {"id": 489, "year": "113", "num": 21, "chapter": "C1", "chapterName": "C1 規定地價", "text": "依土地稅法規定，有關累進起點地價，下列何者正確？", "options": ["累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。只有工業用地、礦業用 地及農業用地不包括在內", "土地所有權人之地價總額未超過戶籍所在地直轄市或縣（市）累進起點地價者，其地價稅按基 本稅率徵收", "累進起點地價以百元為單位，以下四捨五入", "累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報請財政 部及內政部備查"], "answer": 3}, {"id": 490, "year": "113", "num": 22, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？", "options": ["經需用土地人開闢完成或依計畫核定供公共設施使用", "依法完成使用地編定", "依法完成徵收公告", "經需用土地人證明"], "answer": 2}, {"id": 491, "year": "113", "num": 23, "chapter": "G1", "chapterName": "G1 契稅", "text": "下列有關契稅納稅義務人之敘述，何者正確？", "options": ["受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅", "買賣契稅，應由出賣人申報納稅", "典權契稅，應由出典人申報納稅", "交換有給付差額價款者，其差額價款，應由出賣人申報納稅"], "answer": 0}, {"id": 492, "year": "113", "num": 24, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，下列有關自住使用之住家用房屋適用1.2%計徵房屋稅之要件，何者錯誤？", "options": ["無出租或供營業情形", "房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記", "房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下", "房屋所有人本人、配偶或直系親屬實際居住使用"], "answer": 2}, {"id": 493, "year": "113", "num": 25, "chapter": "H1", "chapterName": "H1 房地合一稅", "text": "依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，其所得稅稅率為何？", "options": ["百分之十", "百分之十五", "百分之二十", "百分之二十五"], "answer": 2}, {"id": 494, "year": "114", "num": 1, "chapter": "A2", "chapterName": "A2 土地登記", "text": "因土地登記有錯誤致人民受有損害，地政機關負損害賠償後，於登記人員未盡下列那一種注意義務時，得對登記人員行使求償權？", "options": ["抽象輕過失責任", "重大過失責任", "具體輕過失責任", "通常事變責任"], "answer": 1}, {"id": 495, "year": "114", "num": 2, "chapter": "A2", "chapterName": "A2 土地登記", "text": "甲為A地之登記名義人，與乙成立附條件的A地贈與契約，則甲與乙可以對A地申請做下列那一種土地登記？", "options": ["假處分登記", "第一次登記", "註記登記", "預告登記"], "answer": 3}, {"id": 496, "year": "114", "num": 3, "chapter": "D1", "chapterName": "D1 徵收程序要件", "text": "辦理土地徵收時，徵收事業經行政院核定為重大建設，徵收範圍內之特定農業區農牧用地，如土地所有權人對於土地列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應辦理那一項民眾參與方式？", "options": ["聽證", "說明會", "公聽會", "陳述意見"], "answer": 0}, {"id": 497, "year": "114", "num": 4, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法之規定，一般地價稅的基本稅率為多少？", "options": ["百分之十", "百分之五", "千分之十", "千分之十五"], "answer": 2}, {"id": 498, "year": "114", "num": 5, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "下列關於房屋稅納稅義務人的認定，何者錯誤？", "options": ["以土地設定地上權之使用權房屋，為該使用權人", "共有房屋向共有人徵收，並由共有人推定一人繳納", "未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收", "房屋為信託財產，在信託關係存續中，為受託人"], "answer": 2}, {"id": 499, "year": "114", "num": 6, "chapter": "E2", "chapterName": "E2 土地增值稅", "text": "土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？", "options": ["15 日", "30 日", "45 日", "60 日"], "answer": 1}, {"id": 500, "year": "114", "num": 7, "chapter": "A3", "chapterName": "A3 共有優先購買權", "text": "依土地法規定，所有權人欲以共有土地設定地上權，在不計共有人人數比例的情況下，至少應得到該共有土地應有部分多少比例之同意？", "options": ["超過四分之三", "超過二分之一", "超過三分之二", "全體"], "answer": 2}, {"id": 501, "year": "114", "num": 8, "chapter": "A5", "chapterName": "A5 公有土地", "text": "下列有關公有土地撥用之敘述，何者錯誤？", "options": ["無論國有或地方有之土地均有撥用的可能", "公有土地撥用需經財政部國有財產署核准", "各級政府機關有使用公有土地之需求均得申請撥用公有土地", "公有土地之撥用以無償為原則"], "answer": 1}, {"id": 502, "year": "114", "num": 9, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "區段徵收地區如為經實施農地重劃者，此一地區抵價地總面積比例不得少於徵收總面積多少？", "options": ["百分之四十", "百分之四十五", "百分之五十", "百分之五十五"], "answer": 1}, {"id": 503, "year": "114", "num": 10, "chapter": "A2", "chapterName": "A2 土地登記", "text": "土地法第78條第8款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記，下列何者非屬之？", "options": ["更正登記", "假處分", "破產登記", "預告登記"], "answer": 0}, {"id": 504, "year": "114", "num": 11, "chapter": "C3", "chapterName": "C3 照價收買空地稅", "text": "依土地法規定，有關私有土地所有權取得之限制，土地若已成為私有者，政府得依法以何種方式處置？", "options": ["公開標售", "照價收買", "徵收", "沒收"], "answer": 2}, {"id": 505, "year": "114", "num": 12, "chapter": "A1", "chapterName": "A1 總則", "text": "對於土地權利之規定，我國係採「物權法定主義」，土地所有權以外之其他不動產物權，謂之他項權利，下列何者屬之？", "options": ["耕作權", "通行權", "日照權", "畜牧權"], "answer": 0}, {"id": 506, "year": "114", "num": 13, "chapter": "A4", "chapterName": "A4 基地耕地優先購買權", "text": "依土地法規定，有關優先購買權之敘述，下列何者正確？", "options": ["基地出賣或房屋出賣時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視 為放棄", "耕地租用出租人出賣或出典耕地時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優 先購買權視為放棄", "共有土地共有人出賣其應有部分時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優 先購買權視為放棄", "區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人有優先 購買權之適用"], "answer": 2}, {"id": 507, "year": "114", "num": 14, "chapter": "G1", "chapterName": "G1 契稅", "text": "在不動產贈與的情形下，有關契稅稅率，下列何者為是？", "options": ["百分之四", "百分之六", "百分之二", "百分之五"], "answer": 1}, {"id": 508, "year": "114", "num": 15, "chapter": "F1", "chapterName": "F1 房屋稅", "text": "依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？", "options": ["無償供政府機關公用或供軍用之房屋", "政府平價配售之平民住宅", "合法登記之工廠供直接生產使用之自有房屋", "受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"], "answer": 0}, {"id": 509, "year": "114", "num": 16, "chapter": "G1", "chapterName": "G1 契稅", "text": "依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？", "options": ["納稅義務人應於稽徵機關核定繳款書送達後 30 日內繳納", "納稅義務人不依規定期限申報者，每逾 2 日，加徵應納稅額百分之二之怠報金", "納稅義務人不依規定期限繳納稅款者，每逾 3 日，加徵應納稅額百分之二之滯納金", "納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳 稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"], "answer": 0}, {"id": 510, "year": "114", "num": 17, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？", "options": ["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰", "土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰", "逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰", "應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起 2 個月內繳納之"], "answer": 2}, {"id": 511, "year": "114", "num": 18, "chapter": "B2", "chapterName": "B2 都市計畫法", "text": "依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？", "options": ["主要計畫其實施進度以 5 年為一期，最長不得超過 25 年", "細部計畫圖，其比例尺不得小於一千五百分之一", "主要計畫圖，其比例尺不得小於一萬五千分之一", "主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起 20 日 內，將主要計畫書及主要計畫圖發布實施"], "answer": 0}, {"id": 512, "year": "114", "num": 19, "chapter": "B3", "chapterName": "B3 國土計畫法", "text": "依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？", "options": ["國土功能分區之劃設", "國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定", "農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定", "直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"], "answer": 1}, {"id": 513, "year": "114", "num": 20, "chapter": "C2", "chapterName": "C2 市地重劃", "text": "有關自辦土地重劃，依相關法規之規定，下列敘述何者正確？", "options": ["重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由地方主管機關定之", "重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重 劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之", "自辦農地重劃，應經重劃區內私有土地所有權人半數以上，而其所有面積亦達私有土地面積半 數以上者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准", "重劃會辦理農村社區土地重劃時，應經重劃區內私有土地所有權人合計超過三分之二，且其所 有面積合計超過私有土地面積三分之二者之同意，就重劃區全部土地辦理重劃，並經該管直轄 市或縣（市）主管機關核准後實施"], "answer": 1}, {"id": 514, "year": "114", "num": 21, "chapter": "A1", "chapterName": "A1 總則", "text": "依土地法規定，下列何種土地非屬於不得移轉、設定負擔或租賃於外國人之土地？", "options": ["林地", "鹽地", "農地", "水源地"], "answer": 2}, {"id": 515, "year": "114", "num": 22, "chapter": "D2", "chapterName": "D2 徵收補償標準", "text": "下列何者並非土地法中的農作改良物？", "options": ["置於農地上的盆栽", "附著於農地上的芒果樹", "農田的灌溉設施", "農地上所施加的肥料"], "answer": 0}, {"id": 516, "year": "114", "num": 23, "chapter": "D3", "chapterName": "D3 區段徵收", "text": "依土地徵收條例規定，有關得為區段徵收之情形，下列何項非屬之？", "options": ["舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者", "非都市土地實施開發建設者", "興辦國營事業或公安事業者", "農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者"], "answer": 2}, {"id": 517, "year": "114", "num": 24, "chapter": "E1", "chapterName": "E1 地價稅", "text": "依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？", "options": ["都市土地面積未超過五公畝部分", "非都市土地面積未超過十公畝部分", "國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之 地價稅", "土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次 為限"], "answer": 2}, {"id": 518, "year": "114", "num": 25, "chapter": "E1", "chapterName": "E1 地價稅", "text": "政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？", "options": ["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第 20 條 之規定外，統按千分之十計徵地價稅", "公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅", "依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅", "公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"], "answer": 1}];
const EXPS = {"99-1":["民法第832條：普通地上權是以在他人土地之上下「有建築物或其他工作物」為目的（現行法已無「竹木」，種植竹木改列農育權），與本題所列農作、森林、養殖、畜牧、種植竹木或保育之目的不同，本題所列正是農育權（民§850-1）的定義。","耕作權是土地法所創設、供農業上使用的他項權利，但耕作權是公有荒地承墾人墾竣後取得之權利（土地法§133），並非本題所列「為農作、森林、養殖、畜牧、種植竹木或保育為目的」所設定之權利；耕作權與農育權是兩種不同的他項權利，並非新舊名稱關係。","農役權為虛構名稱，民法及土地法均無此物權類型。","民法第850條之1：農育權指在他人土地為農作、森林、養殖、畜牧、種植竹木或保育為目的而使用其土地之權，為正確答案。"],"99-2":["典權規定於民法第911條以下，非土地法創設，而是民法固有物權。","農育權規定於民法第850條之1以下，同樣是民法物權編的內容，非土地法創設。","土地法第133條規定耕作權，是土地法所特別創設、供農業上使用的他項權利，為土地法所獨有，民法物權編並無此規定。","不動產役權（舊稱地役權）規定於民法第851條以下，非土地法創設。"],"99-5":["土地法第10條：私有土地所有權消滅者，為國有土地，故最終歸屬國有。","所有權消滅後的歸屬是國有（§10），不是直轄市有。","所有權消滅後的歸屬是國有（§10），不是縣（市）有。","所有權消滅後的歸屬是國有（§10），不是鄉（鎮、市）有。"],"99-7":["一般用途向土地所在地直轄市或縣（市）政府申請；僅重大建設投資須經中央目的事業主管機關同意。","國防部不是外國人取得土地的核准機關。","經建會已改制為國發會，且不是外國人取得土地的核准機關。","土地法第20條：外國人取得土地應向土地所在地直轄市或縣（市）政府申請核准，故向臺南市政府。"],"99-9":["城市區域之公共道路等公共使用土地屬§14不得私有之土地。","礦泉地列於§14，不得私有。","瀑布地列於§14，不得私有。","§14未列林地，林地可為私有（但外國人不得取得，見§17）。"],"99-11":["醫院屬土地法第19條所列外國人得取得之用途。","教堂屬土地法第19條所列外國人得取得之用途。","墳場屬土地法第19條所列外國人得取得之用途。","林地列於§17禁止清單，不得移轉、設定負擔或租賃於外國人，故非得取得之用途。"],"100-30":["林地在§17禁止清單內，不得移轉、設定負擔或租賃於外國人。","漁地在§17禁止清單內，不得移轉、設定負擔或租賃於外國人。","§17禁止清單為林、漁、狩獵、鹽、礦、水源地及要塞軍備區域、邊境土地，牧地不在其內，故可。","鹽地在§17禁止清單內，不得移轉、設定負擔或租賃於外國人。"],"100-35":["溝渠屬交通水利用地（土地法第2條第3款）。","池塘屬直接生產用地（土地法第2條第二類），不在交通水利用地（道路、溝渠、水道、湖泊、港灣、堤堰等）列舉內。","湖泊屬交通水利用地。","堤堰屬交通水利用地。"],"101-1":["土地法第14條：不得私有之土地（如海岸、天然湖澤、可通運水道、公共交通道路、礦泉地、瀑布地、公共需用之水源地、名勝古蹟等），若已成為私有者，得依法徵收之。","照價收買是對「超過限額的私有土地」或「申報地價過低」等情形的手段，不是§14的處理方式。","法條是「依法徵收」，不是逕登記為國有；逕為國有須有補償程序，不能直接改登記。","所有權不會因「已私有」而當然視為消滅，必須經徵收程序。"],"102-29":["直接生產用地指農地、林地、漁地、牧地、鹽地、礦地、水源地等，不含碼頭、墳場。","官方答案將碼頭、墳場同歸建築用地，不是交通水利用地。","土地法第2條第一類建築用地明列「船埠、碼頭」「墳場」，故碼頭、墳場屬建築用地（官方答案亦同）。","其他土地指沙漠、雪山等無法歸入前三類者，碼頭、墳場已有歸類。"],"103-30":["土地法第2條第2款列出直接生產用地，包括：農地、林地、漁地、牧地、狩獵地、礦地、鹽地、水源地、池塘等。水源地屬直接生產用地。","溝渠屬交通水利用地（第3款），不是直接生產用地。","湖泊屬交通水利用地（第3款）。","水道屬交通水利用地（第3款）。"],"103-31":["土地法第12條第1項：私有土地因天然變遷成為湖澤或可通運之水道時，其所有權視為消滅，故不得保有所有權。","法律效果是「所有權視為消滅」，並無補償規定，非收歸國有程序。","土地法第12條第1項原文即如此規定，所有權視為消滅，非絕對消滅（保留將來復原可取回的可能性）。","土地法第13條：自然增加時，其接連地之所有權人「有優先依法取得其所有權或使用受益之權」，是優先「依法」取得，並非「自然取得」。"],"105-10":["逾期未辦總登記屬「絕對消滅」（土地法§57：視為無主土地，經公告期滿無人異議即為國有土地之登記）。","土地流失（滅失）屬「絕對消滅」，土地本身不存在，任何人都不能再有所有權。","買賣是原所有人喪失、受讓人取得，所有權本身仍存在，只是主體變動，屬「相對消滅」。","拋棄使所有權歸於消滅，土地改為國有，屬「絕對消滅」。陷阱：相對＝換人；絕對＝沒人有。"],"105-23":["農業用地不限於都市土地農業區、保護區，非都市土地亦包括在內。","農業用地指非都市土地或都市土地農業區、保護區內，依法供農作、森林、養殖、畜牧及保育使用者（平均地權條例§3）。","風景區不在農業用地範圍，且使用也不限於農作。","農業用地也含都市農業區、保護區，且使用不限農作。"],"106-14":["一般情形應向土地所在地之直轄市或縣（市）政府申請核准，非向內政部申請。","禁止清單為林、漁、狩獵、鹽、礦、水源地及要塞軍備區域、邊境土地，不含農地、牧地。","土地法第19條：外國人取得土地的面積及所在地點，受直轄市或縣（市）政府依法所定之限制。","此種情形應先經「中央目的事業主管機關」同意，非行政院核准。"],"107-2":["礦泉地列於§14，不得私有。","瀑布地列於§14，不得私有。","土地法第14條不得私有土地的清單中，並未包含「國家公園土地」，故國家公園土地「非屬」不得私有的土地。本題問的是「非屬」不得私有，選不在清單內的選項。","名勝古蹟列於§14，不得私有。"],"107-18":["地上權規定於民法第832條以下，為民法物權編內容，非土地法創設。","農育權規定於民法第850條之1以下，為民法物權編內容，非土地法創設。","土地法第133條規定耕作權，為土地法所特別創設之他項權利。（注意：同樣的考點在99-2也考過，耕作權是土地法創設，農育權是民法物權編）","不動產役權（舊稱地役權）規定於民法第851條以下，非土地法創設。"],"108-1":["立法院是立法機關，非行政上制止土地移轉的機關。","司法院不是行政制止的機關。","土地法第16條：私有土地移轉、設定負擔或租賃妨害基本國策者，中央地政機關得報請行政院制止。","監察院是監察機關，負責彈劾糾正，非行政制止的機關。"],"109-17":["土地法第17條第1項不包含農地（農地另有農業發展條例規範）。","墳場屬土地法第19條所列外國人得取得之用途，不在禁止之列。","礦地列於§17，不得移轉、設定負擔或租賃於外國人（口訣：林漁狩鹽礦要水（要＝要塞邊境））。","學校用地屬土地法第19條所列外國人得取得之用途，非禁止類型。"],"110-1":["備查是事後程序，本條要求的是事前「同意」，且機關也不是中央地政機關。","土地法第19條：投資有助於國內重大建設、整體經濟或農牧經營所需土地，應先經中央目的事業主管機關同意。","民意機關（議會）同意是公有土地處分的程序，非外國人投資取得土地的程序。","一般外國人取得土地向地方政府申請；重大建設投資須中央目的事業主管機關同意，不是行政院。"],"110-11":["刑期和罰金金額均錯誤。","平均地權條例：以經營土地買賣為業而壟斷、投機者，處三年以下有期徒刑，得併科七千元以下罰金。","刑期和罰金金額均錯誤。","刑期正確但罰金金額錯誤（應為七千元以下非一萬元以下）。"],"111-14":["土地法第17條第1項明列林地不得移轉、設定負擔或租賃於外國人。","§17禁止清單不含牧地（清單為林、漁、狩獵、鹽、礦、水源地等），故牧地得租賃於外國人。","土地法第17條第1項明列漁地不得移轉於外國人。","土地法第17條第1項明列鹽地不得移轉於外國人。"],"111-15":["監察院是監察彈劾機關，無此報請權限。","國有財產署（財政部下設）管理國有財產，非土地法第16條規定的報請機關。","土地法第16條：妨害基本國策者，由中央地政機關報請行政院制止。","此機關的職掌是不動產經紀人的獎懲，與土地移轉制止無關。"],"112-16":["抵押權規定於民法第860條以下，是法定物權之一。","農育權規定於民法第850條之1以下，是法定物權之一。","耕作權規定於土地法第133條，是土地法創設的物權。","租賃權是債權，非物權。雖然不動產租賃依民法§425有「買賣不破租賃」之對抗效力，但其性質仍屬債權而非物權，不在他項權利登記的範疇內（土地登記規則§136等並無租賃權登記）。這是常見陷阱：有對抗效力不代表變成物權。"],"112-17":["長照機構不在土地法第19條所列外國人得取得之用途內（官方答案）。","住宅屬第19條所列外國人得取得之用途。","醫院屬外國人得取得土地之用途，在清單內。","此類用途屬外國人得取得土地之用途，在清單內。"],"114-12":["耕作權規定於土地法第133條，是法定的他項權利之一，屬物權。","通行權（鄰地通行權）是相鄰關係所生的法定請求權，性質上為物權的限制，但並非獨立的物權類型，不屬他項權利。","日照權是基於建築法規或相鄰關係主張的利益，並非民法或土地法明文規定的物權類型，不屬他項權利。","畜牧權為虛構名稱，民法及土地法均無此物權類型。"],"114-21":["土地法第17條第1項明列林地不得移轉於外國人。","土地法第17條第1項明列鹽地不得移轉於外國人。","§17禁止清單不含農地（農地另受農業發展條例等管制），故農地非禁止類型。","土地法第17條第1項明列水源地不得移轉於外國人。"],"99-6":["地政士雖是土地登記專業代理人，若因其疏失造成損害，可能有民事責任，但登記錯誤損害賠償的法定責任主體是地政機關，非地政士。","土地法第68條：登記錯誤、遺漏或虛偽致損害，由地政機關負賠償責任；登記人員重大過失時才須償還（§70）。","不動產經紀人的業務是仲介交易，與土地登記作業無關，不是登記錯誤的賠償責任人。","受害人請求對象是地政機關；登記人員僅於重大過失時，由其償還給登記儲金（§70）。"],"99-10":["土地法第73條第2項：土地權利變更登記，應於土地權利變更後一個月內為之，聲請逾期者，每逾一個月，得處應納登記費額一倍之罰鍰，但最高不得超過20倍。一個月是一般土地權利變更登記的申請期限，與繼承登記的六個月要區分清楚。","一般變更登記期限是1個月，不是3個月。","六個月是繼承登記的申請期限（土地法第73條），不是一般土地權利變更登記的期限。這是最常見的混淆陷阱。","1年不是變更登記期限；1年是繼承逾期後地政機關可公告的門檻（§73-1）。"],"99-12":["一個月是一般土地權利變更登記的申請期限，不是繼承登記。","繼承登記期限是6個月，不是3個月（3個月是§73-1公告後的聲請期間）。","土地法第73條：繼承登記得自繼承開始之日起6個月內為之，逾期每逾1個月得處應納登記費1倍罰鍰，最高20倍。","繼承登記期限是6個月；逾1年未辦，地政機關才依§73-1公告。"],"99-13":["§46-1重測原因列有地籍原圖破損、滅失、比例尺變更或其他重大原因，未單列界址糾紛。（舊筆記A2曾把界址糾紛列為重測原因，係筆記錯誤；§46-1並無此原因，以官方答案為準。）","比例尺變更為§46-1所列重測原因。","地籍原圖滅失為§46-1所列重測原因。","地籍原圖破損為§46-1所列重測原因。"],"99-36":["法院囑託查封登記後，登記機關無從通知法院改辦移轉，更不能繼續辦理移轉登記予李四，因為查封效力發生後不得移轉。","查封登記是限制登記，一旦法院囑託，登記機關必須即時改辦，不得繼續原來的移轉登記程序。","不是要求申請人辦理塗銷，而是登記機關主動改辦查封登記。申請人並無義務自行塗銷申請。","土地登記規則第138條第2項：登記標的物如已由登記名義人申請移轉或設定登記而尚未登記完畢者，應即改辦查封、假扣押、假處分、暫時處分、破產或清算登記，並通知登記申請人。在案件尚未登記完畢前，法院若囑託查封，登記機關應立即停止辦理移轉登記，改辦查封登記，以保障債權人的執行利益。"],"99-38":["土地法第79條之1第3項：預告登記對因徵收、法院判決或強制執行而為之新登記，無排除之效力。徵收是公法行為，預告登記無法對抗。","贈與屬一般處分，預告登記對其新登記有排除效力；僅徵收、法院判決、強制執行除外（§79-1）。","法院判決屬於預告登記無法對抗的情形之一，對其新登記無排除效力。","強制執行屬於預告登記無法對抗的情形之一，對其新登記無排除效力。"],"99-40":["更名登記是登記名義人因姓名、名稱變更而辦理的登記，與登記錯誤遺漏的更正無關。","土地法第69條：登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關查明核准後，不得更正。更正登記是針對已完成的登記內容有錯誤或遺漏時的補救程序，需經上級機關核准。","塗銷登記是消滅已登記的權利，與更正錯誤的性質不同，通常用在登記原因消滅（如抵押權清償後）的情形。","標示變更登記是針對土地標示（如面積、地目、地號）的變更，與登記錯誤遺漏的更正無關。"],"100-32":["限制登記（預告、查封、假扣押等）依§78免納登記費。","塗銷（消滅）登記依§78免納登記費。","土地重劃變更登記依§78免納登記費。","繼承登記不在§78免納範圍，仍應按申報地價或權利價值千分之一繳登記費。"],"100-33":["列冊管理期間是15年，不是5年。","十年不是列冊管理的期間。注意與「標售完成後價金儲存國庫專戶，10年無人領取歸國庫」的10年要區分。","土地法第73條之1第2項：自繼承開始之日起逾一年，未辦繼承登記，經地政機關依本條第一項公告後仍未辦者，地政機關得予以列冊管理，期間為十五年。這個「15年」是高頻考點，務必牢記。","列冊管理期間是15年，不是20年。"],"100-37":["土地法第76條：申請為土地權利變更登記，應由權利人按申報地價或權利價值，繳納登記費千分之一。正確答案是千分之一（而非千分之二或其他比例），計費基礎是申報地價（而非公告現值或市價）。","千分之二是土地總登記的登記費率；權利變更登記為千分之一（§76）。","變更登記費率是千分之一，沒有千分之三。","變更登記費率是千分之一，沒有千分之五。"],"101-4":["本選項把「現使用人指界」排在「鄰地界址」之前，但正確順序鄰地界址優先於現使用人指界。","土地法第46條之2：地籍圖重測，界址認定順序為：②土地所有權人親自指界 → ④鄰地界址 → ①現使用人之指界 → ③參照舊地籍圖 → ⑤地方習慣。記憶口訣：所有人→鄰地→使用人→舊圖→習慣。","此順序完全錯誤，將現使用人置於最優先，實際上土地所有權人才是第一優先。","此選項將鄰地界址置於最優先，但土地所有權人親自指界才是最優先順序。"],"102-13":["不予受理是針對申請不符合程式或欠缺文件等情形，本案當事人自行辦理登記不涉及資格問題，不應不予受理。","駁回是申請不合規定的處理方式，但本案情形下老王是以當事人身分自行辦理，而非以專業代理人身分執業，不構成駁回事由。","補正是針對申請文件不齊全或格式有誤的情形，本案並無此問題。","老王是自己土地的出賣人，並非受託執業的代理人，不受專業代理人資格限制，登記機關應予受理。"],"102-30":["15年期滿後是移請財政部國有財產署公開標售，不是地方政府。","土地法第73條之1第2項：列冊管理期間（15年）屆滿後仍未辦理繼承登記，由地政機關將清冊移請財政部國有財產署公開標售。財政部國有財產署是國有財產的主管機關，標售程序由其執行。","15年期滿後須先公開標售，不是直接登記為國有。","15年期滿後須先公開標售，不是登記為直轄市或縣市政府所有。"],"102-31":["贈與是處分行為，預告登記後其新登記受排除（無效）。","信託是私法上處分，受預告登記排除效力限制。","土地法§79-1：預告登記未塗銷前，登記名義人所為對請求權有妨礙之處分無效；但因徵收、法院判決或強制執行而為之新登記不受限制，故徵收登記有效。","條文例外只列「徵收、法院判決、強制執行」，市地重劃未列入，仍受排除；標準答案為徵收。"],"103-25":["登記儲金提存比例是登記費的10%，不是1%。","登記儲金提存比例是登記費的10%，不是5%。","土地法第70條：地政機關應於登記費內提存10%作為登記儲金，專備賠償之用。","登記儲金提存比例是登記費的10%，不是20%。"],"103-36":["登記費依「申報地價」計算，不是公告地價。","登記費不依公告現值計算；公告現值是課土增稅用。","土地法第76條：權利變更登記由權利人按申報地價或權利價值千分之一繳納登記費。","移轉現值是土增稅申報用語，登記費不以此為計算基礎。"],"104-1":["土地法第34條之2：直轄市或縣（市）地政機關為處理本法不動產之糾紛，應設置不動產糾紛調處委員會。名稱是「調處委員會」，不是「調解委員會」，不是「爭議處理委員會」，不是「仲裁委員會」，務必記清楚。","「調解」委員會是法院或鄉鎮市調解委員會的性質，土地法設的是「調處」委員會，兩者不同。","此名稱為虛構，土地法無此設置。","仲裁是私法紛爭解決機制，土地法無此設置。"],"104-3":["登記費的計費基礎不是市場實際成交價格（避免低報逃費），而是有公信力的申報地價。","公告土地現值是土地增值稅的計費基礎，不是登記費的計費基礎。","公告地價是地價稅累進起點地價的計算基礎，不是登記費的計費基礎。","土地法第76條：土地權利變更登記，應由權利人按申報地價或權利價值千分之一繳納登記費。申報地價是地主向主管機關申報的地價，通常為公告地價的80%（未申報時視為公告地價的80%），以申報地價為基礎計收登記費，是本條明文規定。"],"104-4":["土地法第79條之1第1項：聲請保全左列請求權之登記，由請求權人檢附登記名義人之同意書辦理預告登記：一、關於土地權利移轉或使其消滅之請求權。預告登記是保全將來土地權利移轉等請求權的保全登記，需有登記名義人同意書，免納登記費，且具有排除後續處分的效力。","假扣押登記是法院依債權人聲請，禁止債務人處分財產的保全程序，由法院囑託辦理，性質不同於保全土地移轉請求權的預告登記。","假處分登記是禁止被告改變現狀的法院保全處分，由法院囑託辦理，非本條所定的申請程序。","查封登記是強制執行程序中限制債務人處分財產的登記，由法院囑託辦理，非本條所定的保全申請程序。"],"105-4":["界址取直的約定未辦理移轉登記，土地所有權仍依原登記界址，本題無從就該約定逕為登記。","最高法院75年度第5次民事庭會議決議（一）：甲乙既有界址取直、互相同意建屋的約定，不是越界建築，不適用民法§796。<br>（§796 是「非因故意或重大過失」越界、鄰地所有人知情不即異議的情形）","同一決議：雙方交互使用土地，彼此都以自己的土地供對方使用，並非無償，所以「不能認為使用借貸」；<br>又沒有移轉所有權，也不是互易，<br>而應認為「互為租賃」。","同一決議（75.3.11）：<br>甲乙間為互為租賃關係，甲將A地所有權移轉給丙後，乙占用部分適用民法§425（買賣不破租賃），丙不能主張乙無權占有而請求拆屋還地。<br>記法：約定取直→互為租賃→§425→不能拆。<br>⚠️ 決議作成於75年；88年修法增訂§425Ⅱ（未經公證、期限逾五年或未定期限之不動產租約不適用買賣不破租賃），本題只考決議結論。"],"105-17":["共有物分割登記原則上應繳納登記費（按分割後各人取得部分計費），非免費。","土地法第78條：限制登記（預告、查封、假扣押、假處分、破產登記等）免納登記費。","移轉登記（如買賣、贈與）應按申報地價或權利價值千分之一繳納登記費。","繼承登記不在§78免納範圍，仍須繳登記費。"],"105-19":["本選項描述正確：預告登記得由請求權人（乙）單獨申請，但須檢附登記名義人（甲）的同意書。這是正確的描述，不是錯誤。","此項有誤：土地登記規則第137條規定，申請預告登記應提出登記名義人同意書，且登記名義人「原則上」應親自到場（符合§41所列情形者始例外免到場），本選項寫成「例外時應親自到場」，原則例外顛倒。","本選項描述正確：預告登記確實是保全登記、暫時登記的性質，且依法免納登記費。這是正確的描述。","本選項描述正確：預告登記後，登記名義人再為的處分行為，學理上稱為「中間處分」，對預告登記請求權人不生效力。這是正確的描述。"],"105-21":["土地法第46條之1：地籍原圖破損、滅失、比例尺變更或其他重大原因，得重新實施地籍測量。","「比例尺變更」是重測的原因（比例尺過小需重測），而非複丈的原因。複丈的原因包括分割、合併、界址確定等，不包括比例尺變更。","「訂正地籍原圖」是複丈的目的之一，不是重測的目的。重測的目的是重新測製新的地籍圖，訂正是在原有基礎上修改。","重新測製新的地籍原圖是「重測」的目的，不是複丈的目的。"],"105-27":["「公眾通行地役」不是土地法規定的物權登記事項（它是不特定人的通行，難以辦理地役權登記），故不屬土地法規定應登記事項。","前半段錯誤（非應登記事項），後半段也錯誤（可以登錄於土地參考資訊檔）。","「同意無償供公眾通行」不是物權變動，不屬土地法規定應登記事項；這類非應登記事項的資訊，可登錄於地政機關的「土地參考資訊檔」供查詢，不具登記效力（內政部96.08.01台內地字第0960116350號函曾說明參考檔用途，該函已廢止）。","前半段正確，但後半段錯誤：此類資訊可以（且依規定應）登錄於土地參考資訊檔。"],"105-29":["依最高行政法院99年度3月份庭長法官聯席會議決議，標示部「本土地涉及違法地目變更…」之註記，「既未對外直接發生法律效果，自非行政處分」，甲不得提撤銷訴訟。","前提（認定為行政處分）錯誤，故救濟方式的判斷也無從成立。","依同一決議，該註記非行政處分，甲應提起一般給付訴訟請求除去註記。","前半段正確（非行政處分），但後半段錯誤：即使不是行政處分，甲仍可以提起一般給付訴訟（行政訴訟的一種），並非完全不得循行政訴訟途徑救濟。"],"106-3":["土地總登記須繳登記費（千分之二），不在免納之列。","土地法第78條：限制登記免納登記費。","繼承登記不在§78免納範圍，仍須繳登記費。","共有物分割登記原則上應繳納登記費（按分割後各人取得部分計費）。"],"106-28":["土地法第46條之3：重測結果之公告期間為30日，土地所有權人認為測量結果有錯誤者，得於公告期間內向該管地政機關繳納複丈費，聲請複丈。注意是在「公告期間內」聲請，非公告期滿後。","正確的申請時點是在公告期間「內」，而非公告期「滿後」；且申請的是「複丈」，而非重新實施整個地籍測量。","調處程序是針對「界址爭議」的情形（土地法第59條）。「測量結果有錯誤」的救濟途徑是聲請複丈，不是調處。","同上，錯在救濟途徑（應是聲請複丈，非調處），且即使是界址爭議調處，不服調處也是向司法機關訴請（非行政救濟）。"],"106-29":["公告後聲請期間是3個月，不是6個月（§73-1）。","列冊管理期間是「15年」，不是10年。","應移請「財政部國有財產署」標售，非「行政執行署」。","土地法第73條之1第5項：經五次標售未標出而登記為國有者，自登記完畢之日起10年內，原權利人得檢附證明文件按其法定應繼分，申請就第4項專戶提撥發給價金。（第4項則是標售價款存國庫專戶，逾10年無人提領歸國庫。）本選項為官方正確答案。"],"106-38":["少了「或土地他項權利證明書」，與§75用語不符。","土地法第75條：應檢附原發土地所有權狀及地段圖或土地他項權利證明書，本項與條文用語相符。","條文是「地段圖『或』他項權利證明書」，此項改成「及」，與§75不符。","所有權狀與地段圖之間應為「及」，此項寫成「或」，與§75不符。"],"107-1":["土地法第73條第1項：繼承登記，得由任何繼承人為全體繼承人聲請之。非必須由「全體」繼承人聲請，任何一位繼承人均可單獨申請（但效力及於全體繼承人）。","繼承登記的申請期限是「六個月」，不是二個月。","逾期罰鍰是每逾一個月處應納登記費額「一倍」之罰鍰，不是二倍。","土地法第73條第2項但書：罰鍰最高不得超過應納登記費額二十倍。無論逾期多久，罰鍰上限是20倍，這個上限數字是高頻考點。"],"107-3":["信託登記是土地所有權人將土地信託移轉予受託人時辦理的登記，屬土地權利變更登記（所有權移轉），應繳納登記費（按申報地價千分之一）。","塗銷登記（如抵押權清償後辦理的塗銷）免納登記費。","土地標示變更登記（如地目變更、面積更正等）免納登記費，因為標示變更不涉及金錢權利移轉。","因土地重劃而辦理的變更登記（如地號、面積、地目等調整）免納登記費，這是為了鼓勵土地重劃推行。"],"107-5":["參照舊地籍圖施測是界址認定順序中的第四順位，不能在發生爭議時直接跳到此步驟，應先透過調處程序解決爭議。","直接向法院起訴是調處不成後的最後救濟，不是地政機關遇到界址爭議時的第一步處理方式。","地方習慣是界址認定的最後順位（第五順位），不能在發生爭議時直接依地方習慣處理。","土地法第46條之2第2項：重新實施地籍測量時，遇有土地所有權人因設立界標或到場指界發生界址爭議時，準用土地法第59條第2項規定之調處程序處理之。界址爭議先調處，調處不成再由當事人15日內訴請司法機關。"],"107-6":["土地法§73-1：標售不成而登記為國有者，原權利人自登記完畢之日起10年內，得按法定應繼分請求發給價金。","領取期限是10年，沒有12年。","15年是「列冊管理期間」，非標售不成登記國有後的申請期限。","領取期限是10年，沒有20年。"],"107-7":["土地交換屬意定處分行為（雙方私法約定），預告登記對此種新登記有排除效力，交換所為之登記對預告登記請求權人不生效力。","預告登記對因徵收而為之新登記無排除效力，徵收是公法行為，國家公益性取得土地不因預告登記而受阻。","強制執行是預告登記無排除效力的情形之一（與徵收、法院判決並列，§79-1）。","法院判決（確定判決）屬於預告登記無排除效力的情形之一。"],"108-2":["行政院不受理賠償請求；地政機關拒絕後，應向司法機關起訴。","立法院是立法機關，不處理登記損害賠償爭議。","登記損害賠償之請求如被地政機關拒絕，受損害人得向司法機關起訴。","監察院行使彈劾糾舉權，不受理損害賠償訴訟。"],"108-8":["重劃不在§79-1Ⅲ明列的例外範圍內（考題以徵收為答案）。","繼承不在§79-1明列的例外內（條文只列徵收、法院判決、強制執行），所以繼承登記仍受預告登記排除。","徵收為§79-1明文例外：預告登記後因徵收而為新登記，無排除效力。","都市更新不在條文明列的例外範圍內。"],"108-16":["公告現值是土地增值稅的計費基礎，不是登記費的計費基礎。","公告地價是地價稅累進起點地價的計算基礎，不是登記費的計費基礎。","買賣實價（成交價）是實價登錄申報的內容，不是登記費的計費基礎。若以實價計費，可能因高價土地而登記費暴增，故改以申報地價為準。","土地法第76條：土地權利變更登記，應由權利人按申報地價或權利價值千分之一繳納登記費。買賣移轉登記按「申報地價」（非公告現值、非公告地價、非實際成交價）千分之一計費，這是反覆出現的必考考點。"],"108-21":["本選項描述正確，符合土地法第73條第2項規定。","此項有誤：未辦繼承登記是「逾1年」才公告，不是逾6個月；公告後3個月內聲請（§73-1）。","本選項描述正確：15年列冊管理→移請財政部國有財產署標售。","本選項描述正確：標售價款國庫專戶，10年內可申請領取，逾10年歸國庫。"],"109-15":["公告後聲請期間是3個月，不是6個月（§73-1）。","土地法第73條之1第2項後段規定：土地標售後，原占有人若無合法使用權，於標售後喪失占有權利；租賃期間超過5年者，於標售後以5年為限。本選項正確描述了標售後的法律效果，為官方公告正確答案。","領款期限是「逾10年」歸國庫，不是15年。15年是列冊管理期間，10年是標售後繼承人的領款期限，這兩個數字常被混淆。","標售前須公告3個月，不是10日；優先購買依序為繼承人、合法使用人、其他共有人。"],"109-16":["預告登記的性質：保全登記（保全債權人對土地的移轉請求權）、暫時登記（非永久性，俟移轉登記完成即消滅）、免納登記費（土地法第78條第8款：限制登記免納登記費；預告登記屬限制登記）。本選項完整正確地描述了預告登記的三個特性，為正確答案。","預告登記對徵收、法院判決、強制執行無排除效力；繼承不在內（§79-1）。","預告登記後的處分並非絕對無效，而是妨害請求權部分無效（對乙不生效力）。","預告登記後，登記名義人（甲）的處分行為（包括設定抵押）雖對乙不生效力，但辦理抵押權次序變更登記並不須要附乙的同意書。設定抵押本身才可能受預告登記限制，次序變更則是既有抵押權間的順位調整。"],"109-22":["監察院是彈劾糾舉機關，不是損害賠償訴訟的受理機關。","行政院是最高行政機關，不是受理損害賠償起訴的機關。","立法院是立法機關，不是受理損害賠償訴訟的機關。","登記損害賠償之請求如被地政機關拒絕，受損害人得向司法機關起訴。"],"110-2":["土地法第46條之2第2項：重測時因設立界標或到場指界發生界址爭議，準用第59條第2項由地政機關調處；不服者於接到調處通知後15日內訴請司法機關。","不服調處後訴請司法機關的期限是「十五日」，不是三十日，這是常見的數字混淆陷阱。","複丈聲請應在「公告期間內」提出（公告期間是30日），而非「公告期滿後三十日內」。公告期滿後就喪失聲請複丈的機會，應在公告期間內提出。","重測成果是依新測成果辦理標示變更，並非因登記錯誤而作的更正登記。"],"110-4":["登記費由「權利人」單獨繳納，非雙方共同繳納；且計費基礎是「申報地價」，非「公告地價」。","計費基礎是「申報地價」（非公告現值），費率是「千分之一」（非千分之二）。","土地法第76條：由權利人按申報地價或權利價值千分之一繳納登記費，三項要素缺一不可。","繳費義務人是「權利人」（非義務人），計費基礎是「申報地價」，費率是「千分之一」。三個要素全錯。"],"110-14":["土地法第73條之1：列冊管理期間為15年，期滿由財政部（注意：是財政部，本選項寫「財務部」有筆誤，但答案仍為A）國有財產署公開標售。以官方答案A為準，實際法條是財政部國有財產署。","標售機關是財政部國有財產署，非地政機關。","期間是15年（非20年），機關是財政部國有財產署（非法院），且程序是「標售」（非「拍賣」，兩者性質不同）。","期間錯誤（應為15年），且並非直接登記為國有（需先經標售程序，標售5次不成才登記國有）。"],"111-1":["是逾「1年」未辦才公告（非6個月），公告後聲請期間為3個月（非1個月）。","列冊管理期間是「十五年」，不是十年。","是租賃期間「超過」5年者，標售後以5年為限，此項寫成「未超過」。","土地法第73條之1第4項：標售所得價款於國庫設立專戶，繼承人得依其法定應繼分申請領取。本選項正確描述了繼承人的領款權利。"],"111-20":["預告登記是申請人申請的保全登記，並非法院囑託的限制登記，若登記未完畢前接獲法院囑託預告登記，這種情形幾乎不存在（預告登記由請求權人申請，非法院囑託）。查封登記雖是正確的，但預告登記不是。","滅失登記是土地因天然災害滅失後辦理的登記，非法院囑託的限制登記，不在應改辦的範圍內。","土地登記規則第138條第2項：登記標的物如已由登記名義人申請移轉或設定登記而尚未登記完畢者，應即改辦查封、假扣押、假處分、暫時處分、破產或清算登記。本選項的假扣押登記和破產登記都是法院囑託的限制登記，符合應改辦的情形。","輔助宣告與監護宣告登記是針對當事人行為能力的限制，性質上與土地權利限制登記不同，且不在土地登記規則第138條應即改辦的範圍內。"],"112-7":["本選項描述正確：土地總登記逾限未補繳證明文件，土地依法視為無主土地（土地法第57條），非錯誤。","本選項描述正確：視為無主土地後，由地政機關公告，非錯誤。","本選項為錯誤敘述：土地法第58條規定，依第57條所為公告不得少於「三十日」（非十五日；15日是§55審查公告）。公告30日是法定最低期間，本選項說15日，數字錯誤，故為答案。","本選項描述正確：公告期滿無異議，即辦理國有土地登記，非錯誤。"],"112-8":["繼承登記期限是「六個月」，不是一個月。一個月是一般土地權利變更登記的期限，不是繼承登記。","是逾1年未辦才公告（非3個月），公告後聲請期間為3個月（非1年）。","土地法第73條之1完整程序：列冊管理15年→移請財政部國有財產署標售。本選項正確描述列冊管理期間（15年）和標售機關（財政部國有財產署）。","標售價款歸國庫的期限是「逾十年」，不是十五年。15年是列冊管理期間，10年是標售後繼承人的領款期限，這兩個數字常被混淆。"],"112-15":["資格不符或代理權欠缺，屬土地登記規則§56應通知補正之事項。","申請書不合程式、文件不符或欠缺，屬§56應通知補正之事項。","未依規定繳納登記規費，屬§56應通知補正之事項。","當事人間有爭執屬§57應駁回事由，須另循司法程序，不是通知補正。"],"112-19":["本選項描述正確：土地法第44條之1規定土地所有權人應設立界標並永久保存。","本選項為錯誤敘述：依土地法第45條，地籍測量由直轄市或縣（市）政府辦理時，實施計畫應報請中央地政機關核定（非由「地方地政機關核定」，中央地政機關即內政部才有核定權），本選項錯在核定機關層級。","本選項描述正確：重測時所有權人應自行設立界標並到場指界，這是重測配合義務。","本選項描述正確：重測結果公告期間為三十日（土地法第46條之3）。"],"112-20":["本選項描述正確，符合土地法第68條第1項，非錯誤。","本選項描述正確，符合土地法第69條，非錯誤。","此項有誤：重大過失者由「該人員償還」撥歸登記儲金（§70），並非與地政機關連帶賠償。","此項正確：地政機關拒絕賠償時，受損害人得向司法機關起訴。"],"114-1":["抽象輕過失是一般人應注意的標準，未達此標準即有輕過失。地政機關對登記人員行使求償權的門檻比輕過失高，需要達到重大過失，才能求償。","土地法§70：登記人員重大過失所致者，地政機關賠償後由該人員償還。","具體輕過失是低於一般注意義務的標準，更低於重大過失。地政機關求償的門檻是重大過失，非具體輕過失。","通常事變是不可抗力以外的一般意外，與過失責任是不同的法律概念，不是本條的責任標準。"],"114-2":["假處分登記是法院依債權人聲請禁止被告改變現狀的保全處分，由法院囑託辦理，非申請人自行申請；且假處分不是保全將來土地移轉請求權的工具。","第一次登記（土地總登記）是地籍建立時的初次登記，不是保全移轉請求權的手段。","註記登記是在登記簿上加註特定事項（如限制性法令）的登記，不具有保全移轉請求權的效力。","土地法第79條之1：聲請保全關於土地權利移轉或使其消滅之請求權，由請求權人檢附登記名義人之同意書辦理預告登記。附條件的贈與契約，受贈人（乙）對贈與人（甲）有土地移轉的請求權（條件成就後），甲可同意乙辦理預告登記，以保全這個將來的請求權。"],"114-10":["本題問的是「非屬」限制登記的選項。更正登記是針對登記錯誤遺漏的更正手段，目的是「糾正已登記的錯誤」，不是「限制登記名義人處分土地」，故非限制登記的範疇。","假處分登記屬限制登記（限制登記名義人不得處分土地），為土地法第78條第8款的限制登記類型之一。","破產登記屬限制登記（破產人不得自由處分財產），為土地法第78條第8款的限制登記類型之一。","預告登記屬限制登記（限制登記名義人的處分對預告登記請求人不生效力），為土地法第78條第8款的限制登記類型之一。"],"99-4":["質權是動產擔保物權（以動產或有價證券設定），不能在不動產上設定質權，且質權不在土地法第34條之1適用的他項權利類型內。","土地法第34條之1第1項規定，共有土地之「處分、變更及設定地上權、農育權、不動產役權或典權」，可以以多數決（共有人過半數及應有部分過半數，或應有部分逾2/3）為之。典權是本條明文列舉的適用類型之一。","土地法第34條之1第1項只列舉地上權、農育權、不動產役權、典權，「抵押權」不在列舉內，故不適用多數決，抵押權涉及擔保，影響全體共有人利益較大，故須全體同意，不適用多數決。這是最常見的陷阱考點。","耕作權是土地法創設的他項權利，但不在土地法第34條之1第1項明文列舉的適用類型內（該條文列舉的是地上權、農育權、不動產役權、典權），故不適用多數決。"],"99-8":["善意第三人是物權法上的概念，指不知情的交易相對人，並非土地法中共有土地分割調處的申請主體。","土地法第34條之1第6項：依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管地政機關調處。強調「任何」共有人均有申請調處的資格，不限特定人或多數人。","地政士是土地登記的專業代理人，不是土地分割調處的申請主體，除非其本身也是共有人。","不動產經紀人的職能是仲介交易，無法以經紀人身分申請共有土地分割調處。"],"100-40":["土地法第34條之1第6項：不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理，這個「15日」是高頻考點，100年、108年、109年（選項）、113年都考過，務必牢記是15日而非30日或20日。","調處後訴請期限是15日，不是20日。","調處後訴請期限是15日，不是25日。","30日是一些行政救濟的期限，但調處不服後的訴請期限是15日，不是30日。"],"101-2":["設定典權是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，故此選項錯誤（不是不得援用多數決的情形）。","設定地上權也是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，故此選項錯誤。","土地法第34條之1第1項未列舉抵押權，故抵押權的設定不適用多數決。因為設定抵押權涉及所有共有人的財產擔保，風險較高，故須全體共有人同意，不能以多數決代替。","設定不動產役權是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，故此選項錯誤。"],"102-39":["甲持分1/3、乙持分4/9，合計1/3+4/9=3/9+4/9=7/9，超過2/3（≈0.667）。土地法第34條之1規定，應有部分合計逾2/3時，其人數不予計算，即不論人數多寡，只要應有部分超過2/3即可以多數決處分。甲乙合計7/9>2/3，故甲乙同意即足夠，丙丁不同意也無妨。","甲持分1/3、丙持分1/9，合計4/9，未超過2/3；共有人人數2/4=1/2，未超過半數；兩個條件都未達到，不能以多數決處分。","甲持分1/3、丁持分1/9，合計4/9<2/3，且人數2人/4人=1/2，未超過半數，兩條件均未達。","乙丙合計4/9+1/9=5/9<2/3；乙丁合計4/9+1/9=5/9<2/3。雖然乙的持分大，但乙丙或乙丁合計仍未超過2/3，且人數也只有2/4=1/2，未超過半數，均不成立。"],"103-20":["提升效率是土地法第34條之1「多數決」規定的立法目的，但共有人優先購買權（第34條之1第4項）的立法目的不是提升效率，而是為了簡化共有關係。","土地法第34條之1第4項規定他共有人優先購買權，其立法意旨在於：當部分共有人出賣其應有部分時，讓其他共有人有機會優先買入，以達到「合併共有關係、最終消滅共有狀態」的目的，而非僅為照顧個別共有人利益。","照顧他共有人是方法，但更深層的立法目的是消滅共有關係，使土地所有權歸於單一或較少人，提升土地利用效率。","土地法第34條之1的他共有人優先購買權，依通說和實務見解，性質上屬於「債權效力」的優先購買權，不是物權效力。使優先購買權具有物權效力不是本條的立法目的。"],"104-2":["不動產役權（地役權）是土地法第34條之1第1項明文列舉的適用類型，可以多數決設定，此選項錯誤。","農育權是土地法第34條之1第1項明文列舉的適用類型，可以多數決設定，此選項錯誤。","抵押權不在土地法第34條之1第1項的列舉範圍內，故設定抵押權不適用多數決，需全體共有人同意。這是本科最常考的考點之一。","典權是土地法第34條之1第1項明文列舉的適用類型，可以多數決設定，此選項錯誤。"],"105-18":["此項正確：乙行使先買權後，庚依實務見解不得訴請甲移轉應有部分。","本選項描述正確。","此項有誤：先買權的客體是出賣的「應有部分」（§34-1），並非A屋全部。","本選項描述正確，共有人故意低價出售侵害他共有人權益，可構成侵權行為。"],"105-34":["官方答案（105年）：甲乙丙丁得將A地有償處分給戊。現行法：土地法第34條之1執行要點112.8.22修正（113.1.1生效）第3點第2項明定「有償讓與之處分行為，共有人除依本法條規定優先購買外，不得為受讓人」，故依現行規定本題應改採「共有人不得為受讓人」（同113-17官方答案）。","105年官方答案不採此說。但現行執行要點第3點第2項（112.8.22修正、113.1.1生效）已明定共有人除依法優先購買外不得為受讓人，113-17官方答案即採此說；兩題答案不同是因規定修正，以現行規定為準。","105年官方答案不採此項。（現行執行要點已直接以「共有人不得為受讓人」處理，見選項(2)說明。）","非官方答案；官方以甲乙丙丁得有償處分給戊為正解。"],"107-4":["設定農育權是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，此選項錯誤。","設定不動產役權是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，此選項錯誤。","設定典權是土地法第34條之1第1項明文列舉的適用類型，可以多數決為之，此選項錯誤。","土地法第34條之1第1項明文規定適用多數決的行為是「處分、變更及設定地上權、農育權、不動產役權或典權」，並不包含「共有物分割」。共有物分割有其專屬的法律規定（土地法第34條之1第6項、民法第823條以下；執行要點第3點亦明定處分不包括共有物分割），不適用第34條之1的多數決。"],"108-19":["同100-40，土地法第34條之1第6項明文規定不服調處者，應於接到調處通知後「十五日」內，向司法機關訴請處理。此題型在100年、108年、113年皆考過（109-24選項亦含），「15日」是固定答案。","調處後訴請期限是15日，不是20日。","調處後訴請期限是15日，不是25日。","30日常出現在其他期限規定中，但共有土地調處不服後的訴請期限是15日，不是30日。"],"109-24":["土地法第34條之1第4項規定的優先購買權是「他共有人」的優先購買權，不是地上權人、典權人或承租人的優先購買權（後者是土地法第104條的規範）。兩者混淆是常見錯誤。","出租不在§34-1列舉的處分行為內，屬共有物管理，依民法第820條辦理。","土地法第34條之1執行要點第13點(三)：區分所有建物之專有部分連同其基地應有部分之所有權「一併移轉與同一人」者，他共有人無優先購買權（§34-1第4項本文並無此但書）。","土地法第34條之1第6項完整描述，調處申請資格（任何共有人）和不服後的訴請期限（15日），本選項完整正確。"],"111-2":["本選項描述正確，符合土地法第34條之1第1項，非錯誤。","此項有誤：應事先以書面通知他共有人，不能書面通知者應「公告」，而非公示催告（§34-1）。","此項正確：處分人對他共有人應得之對價或補償負連帶清償責任（§34-1）。","本選項描述正確，他共有人得以同一價格共同或「單獨」優先承購，非錯誤。"],"111-13":["法定門檻是人數與應有部分均過半數，或應有部分逾2/3，無此組合。","法定門檻是人數與應有部分均過半數，或應有部分逾2/3，無此組合。","本選項只說「共有人人數」逾三分之二，未提及應有部分，不完整。土地法第34條之1的多數決要件有雙重門檻（人數+應有部分），或單一高門檻（應有部分逾2/3則不計人數）。","土地法第34條之1第1項但書：其應有部分合計逾三分之二者，其人數不予計算。此即「應有部分逾2/3時，不論人數是否過半，均可多數決處分」。本選項正確描述了此高門檻規定。"],"112-6":["「半數」不是法條用語，土地法第34條之1的門檻是「過半數」（超過半數），不是「半數」（等於半數），且本選項缺少「應有部分逾三分之二者不計人數」的但書規定。","本選項的門檻是「三分之二」，但法條規定是「逾三分之二」（超過三分之二），「等於三分之二」不符合條件，故有誤。","土地法第34條之1第2項：前項共有人依第一項之規定為處分、變更或設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。本選項正確描述通知義務的替代方式（公告）。","土地法第34條之1第1項並未禁止共有人單獨處分其應有部分（只是他共有人有優先購買權）。共有人本可自由出賣其應有部分，只是須依法通知他共有人以行使先買權。"],"112-18":["本選項描述正確，符合土地法第34條之1第1項一般規定，非錯誤。","本選項描述正確，符合土地法第34條之1第2項通知義務規定，非錯誤。","本選項描述正確，符合土地法第34條之1第4項他共有人優先購買權規定，非錯誤。","本選項為錯誤敘述：土地法第34條之1執行要點第13點(一)規定，他共有人於接到出賣通知後「十五日」內不表示者，其優先購買權視為放棄。本選項說「二十日」，數字錯誤，為本題答案。"],"113-11":["調處後訴請期限是15日，不是7日。","調處後訴請期限是15日，不是10日。","土地法第34條之1第6項：不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理。15日是本考點的固定答案，在99、100、108、113年皆考過，務必記住。","30日是行政訴訟訴願等救濟的常見期限，但共有土地調處不服後的訴請司法機關期限是15日，不是30日。"],"113-16":["公告後聲請期間是3個月，不是6個月（§73-1）。","列冊管理期間（15年）的描述正確，但法條未規定「每年清查並書面通知」的義務，此部分為虛構敘述。","土地法第73條之1第2項：列冊管理期間屆滿，地政機關應書面通知繼承
