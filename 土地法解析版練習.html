認為承租人得進而請求塗銷登記），非不真正義務。","依辦理強制執行事件應行注意事項第44點第1款，不動產經拍定後，如依法有優先承買權利人，執行法院應通知其表示願否優先承買；本題可認為，承租人乙放棄後，執行法院始續行通知拍定人丙繳價金。"],"110-6":["荒歉減租免租由縣市政府決定，不須行政院同意。","不需財政部同意；該事項屬地方政府職權。","縣市政府依當地當年收穫實況決定減租或免租，但應經民意機關同意（土地法荒歉減租規定）。","法條規定的同意機關是民意機關，不是農業發展委員會。"]};

 var segs=hint.split(/(?=【)/).map(function(x){return x.trim()}).filter(Boolean),out=[];
 segs.forEach(function(sg){var m=sg.match(/^【([^】]*)】/);if(!m)return;

/* 智慧配題：依各章歷屆題數比例分配 → 章內優先序：錯題（C>A>D>B>未標）→ 未練 → 已答對（最久沒練優先） */
function smartQueue(pool){
 var N=Math.min(30,pool.length),D=q2(),c=wClr(),KO={C:0,A:1,D:2,B:3,'':4};
 function sc(q){var r=D[qk(q)];if(r&&r.ok===0&&(r.t||0)>c)return [0,KO[r.k||'']!=null?KO[r.k||'']:4,Math.random()];if(!r)return [1,0,Math.random()];if(r.sh===1||r.sh===2||r.g===1||r.k==='D')return [2,r.t||0,Math.random()];return [3,r.t||0,Math.random()]}
 function cmp(a,b){for(var i=0;i<3;i++){if(a.s[i]!==b.s[i])return a.s[i]-b.s[i]}return 0}
 var by={};pool.forEach(function(q){(by[q.chapter]=by[q.chapter]||[]).push({q:q,s:sc(q)})});
 var chs=Object.keys(by),quota={},rem=[],used=0;
 chs.forEach(function(ch){by[ch].sort(cmp);var e=N*by[ch].length/pool.length,f=Math.min(Math.floor(e),by[ch].length);quota[ch]=f;used+=f;rem.push([e-f,ch])});
 rem.sort(function(a,b){return b[0]-a[0]});for(var i=0;used<N&&i<rem.length*3;i++){var ch=rem[i%rem.length][1];if(quota[ch]<by[ch].length){quota[ch]++;used++}}
 var out=[];chs.forEach(function(ch){out=out.concat(by[ch].slice(0,quota[ch]))});
 out.sort(cmp);var res=out.filter(function(x){return x.s[0]===0});[1,2,3].forEach(function(t){res=res.concat(shuffle(out.filter(function(x){return x.s[0]===t})))});
 return res.map(function(x){return x.q})}
function bxQueue(pool){
  if(BXO==='smart')return smartQueue(pool);
  if(BXO==='rand')return shuffle(pool).slice(0,Math.min(30,pool.length));
  var seen=bxSeenGet();
  var sorted=pool.slice().sort(function(a,b){return (+b.year)-(+a.year)||(+a.num)-(+b.num)});
  var fresh=sorted.filter(function(q){return !seen[q.id]});
  if(!fresh.length)fresh=sorted;
  return fresh.slice(0,Math.min(30,fresh.length));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  document.getElementById('progressText').textContent = `${quizIndex+1} / ${quizQueue.length}`;
  document.getElementById('chapterTag').textContent = q.chapterName;document.getElementById('chapterTag').className='tag cc'+q.chapter[0];
  document.getElementById('progressFill').style.width = `${(quizIndex/quizQueue.length)*100}%`;
  document.getElementById('qtext').textContent = `【${q.year}年第${q.num}題】${q.text}`;

  const opts = document.getElementById('optionsContainer');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';

function selectAnswer(idx) {
  if (currentAnswered) return;
  currentAnswered = true;
  const q = quizQueue[quizIndex];
  const optBtns = document.querySelectorAll('.opt');
  optBtns.forEach((el, i) => {
    el.disabled = true;
    if (i === q.answer) el.classList.add('correct');
    else if (i === idx && idx !== q.answer) el.classList.add('wrong');
  });
  const isCorrect = idx === q.answer;
  quizResults.push({ chapter: q.chapter, correct: isCorrect, id: q.id });
  var _w=wGet();if(!isCorrect)_w[q.id]=1;else if(MODE==='wrong')delete _w[q.id];wSet(_w);
  try{BXREP.rec(q,idx,isCorrect)}catch(e){}

  // 顯示法條解析
  const hint = LAW_HINTS[q.chapter] || '請參照重點筆記中對應章節的法條說明';
  const lawBlock = document.getElementById('lawBlock');
  const lawText = document.getElementById('lawText');

  const resultNote = document.createElement('div');
  resultNote.style.marginBottom = '10px';
  if (isCorrect) {
    resultNote.innerHTML = '<span class="correct-note">答對了</span> <span class="answer-correct-label">正確答案已標示 ✓</span>';
  } else {
    const letters = ['A','B','C','D'];
    resultNote.innerHTML = `<span class="wrong-note">答錯了</span> <span style="font-size:0.85rem;">正確答案：<strong>${letters[q.answer]}. ${q.options[q.answer]}</strong></span>`;
  }
  if(isCorrect){var sr=document.createElement('div');sr.className='wtag-row';var SL=[[0,'👍 很確定'],[1,'🤔 對了但不熟'],[2,'🎲 用猜的']];sr.innerHTML='<span style="font-size:.8rem;color:#6b6354">答對自評：</span>'+SL.map(function(x){return '<button type="button" class="wtag" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');resultNote.appendChild(sr);
   sr.querySelectorAll('.wtag').forEach(function(bt){bt.onclick=function(){sr.querySelectorAll('.wtag').forEach(function(x){x.classList.toggle('sel',x===bt)});try{BXREP.selfr(q,+bt.dataset.v)}catch(e){}}})}
 if(!isCorrect){var tr=document.createElement('div');tr.className='wtag-row';tr.innerHTML='<span style="font-size:.8rem;color:#6b6354">錯誤類型：</span>'+['A','B','C','D'].map(function(k){return '<button type="button" class="wtag" data-k="'+k+'">'+WTL[k]+'</button>'}).join('');resultNote.appendChild(tr);
   tr.querySelectorAll('.wtag').forEach(function(bt){bt.onclick=function(){tr.querySelectorAll('.wtag').forEach(function(x){x.classList.toggle('sel',x===bt)});try{BXREP.tag(q,bt.dataset.k)}catch(e){}}})}
 resultNote.className='rnote';lawBlock.querySelectorAll('.rnote').forEach(function(x){x.remove()});
 lawBlock.insertBefore(resultNote, lawBlock.querySelector('.law-block-title').nextSibling);

  var _e=EXPS[q.year+'-'+q.num]||[],_L=['A','B','C','D'],_h='';
  q.options.forEach(function(o,i){var ok=i===q.answer,pk=i===idx;_h+='<div class="xr'+(ok?' ok':'')+(pk&&!ok?' pick':'')+'"><span class="xl">'+_L[i]+'</span><div class="xt"><span class="xm">'+(ok?'✓':'✗')+'</span>'+(pk&&!ok?'<span class="xp">你選的</span>':'')+(_e[i]||'（本選項解析待補）')+'</div></div>'});
  var _segs=bxRel(hint,q.text+q.options.join('')+_e.join(''));if(_segs.length)_h+='<details class="lawsum" open><summary>本題相關法條</summary><div></div></details>';
  lawText.innerHTML=_h;var _ld=lawText.querySelector('details.lawsum div');if(_ld)_ld.innerHTML=_segs.map(bxBrk).join('<div style="height:6px"></div>');
  var _o=lawBlock.querySelector('.bxtl');if(_o)_o.remove();var _t=bxTax(q.chapter,q.text+q.options.join(''),q.text+q.options.join(''));if(_t)lawBlock.insertAdjacentHTML('beforeend',_t);
  lawBlock.classList.add('show');
  document.getElementById('nextBtn').classList.remove('hidden');
}

function showResults() {
  var _sec=tStop(),_cor=quizResults.filter(function(r){return r.correct}).length;
  if(_sec!=null&&quizResults.length)tSave({d:Date.now(),m:MODE==='wrong'?'wrong':BXO,n:quizResults.length,c:_cor,s:Math.round(_sec)});
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  const correct = quizResults.filter(r => r.correct).length;
  const total = quizResults.length;
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resTotal').textContent = total;
  document.getElementById('resRate').textContent = total ? Math.round(correct/total*100)+'%' : '0%';

  const byChapter = {};
  quizResults.forEach(r => {
    if (!byChapter[r.chapter]) byChapter[r.chapter] = {correct:0, total:0};
    byChapter[r.chapter].total++;
    if (r.correct) byChapter[r.chapter].correct++;
  });
  const breakdown = document.getElementById('chapterBreakdown');
  breakdown.innerHTML = '<div style="font-weight:700; margin:10px 0 6px; font-size:0.85rem;">本輪章節表現</div>';
  Object.keys(byChapter).forEach(ch => {
    const d = byChapter[ch];
    const pct = Math.round(d.correct/d.total*100);
    const row = document.createElement('div');
    row.className = 'chapter-stat-row cc'+ch[0];
    row.innerHTML = `<span>${CHAPTER_LABELS[ch]}</span><span style="display:flex;align-items:center;gap:8px;"><span class="mini-bar"><span class="mini-bar-fill" style="width:${pct}%"></span></span><span>${d.correct}/${d.total}</span></span>`;
    breakdown.appendChild(row);
  });
  var rw=quizResults.filter(function(r){return !r.correct}).map(function(r){return r.id});
  var wb=document.createElement('div');wb.className='controls-row';wb.style.marginTop='14px';
  if(rw.length){var D=q2(),tc={A:0,B:0,C:0,D:0,'':0};QUIZ_DATA.forEach(function(q){if(rw.indexOf(q.id)>=0){var r=D[qk(q)]||{};tc[r.k in tc?r.k:'']++}});var ts=document.createElement('div');ts.style.cssText='font-size:.82rem;margin-top:10px';ts.innerHTML='<b>本輪錯題類型：</b>'+['A','B','C','D'].map(function(k){return WTL[k]+' '+tc[k]}).join('、')+(tc['']?'、未標 '+tc['']:'');breakdown.appendChild(ts)}
  wb.innerHTML=rw.length?'<button class="primary" id="wrongRoundBtn">🔁 練本輪錯題（'+rw.length+' 題）</button>':'<span style="font-size:.85rem;color:var(--green);font-weight:700">本輪全對 👍</span>';
  breakdown.appendChild(wb);
  var tb=document.createElement('div');tb.style.marginTop='12px';tb.innerHTML='<div style="font-size:.85rem"><b>本輪用時：</b>'+(_sec==null?'超過 40 分鐘，本次不計時、不列入紀錄':tFmt(_sec)+'（每題約 '+Math.round(_sec/Math.max(1,quizResults.length))+' 秒）')+'</div>'+tHtml();breakdown.appendChild(tb);
  var wr=document.getElementById('wrongRoundBtn');if(wr)wr.onclick=function(){startList(QUIZ_DATA.filter(function(q){return rw.indexOf(q.id)>=0}),'wrong')};
}
