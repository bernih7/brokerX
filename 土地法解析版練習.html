人，並將清冊移請財政部國有財產署公開標售。本選項正確描述了列冊管理期滿後的標售通知程序。","官方答案不採：優先購買依序為繼承人、合法使用人、其他共有人，此項順序不符。（舊筆記所載「繼承人、其他共有人、合法使用人」為筆記錯誤；§73-1第3項順序為繼承人、合法使用人、其他共有人，與官方答案一致。）"],"113-17":["土地法第34條之1就是要突破民法上共有物處分須全體同意的規定，以多數決代替全體同意，故不能以「民法須全體同意」為由認定不適法。","土地法第34條之1執行要點第3點第2項（112.8.22修正）：有償讓與之處分行為，共有人除依本法條規定優先購買外，不得為受讓人。本案戊已是共有人，甲乙丙欲將A地出售給戊，受讓人（戊）為共有人，違反執行要點規定，故不適法。","形式上人數過半（3/5）、應有部分過半（3/5），行使要件看似符合，但因受讓人戊是共有人，違反執行要點，故仍不適法。","戊雖同意，但其身分為共有人，依執行要點規定，共有人不得為受讓人，故即使戊同意也不適法。"],"114-7":["超過3/4的要件不符合土地法第34條之1的任何規定，為過高門檻的干擾選項。","超過1/2是「人數及應有部分同時過半」這個一般多數決的門檻，但本題特別說明「不計共有人人數比例」，此情形對應的是「應有部分逾2/3者，其人數不予計算」的特殊規定，故單純過1/2不是此情形的正確答案。","土地法第34條之1第1項但書：其應有部分合計逾三分之二者，其人數不予計算。本題說「不計共有人人數比例的情況下」，對應的正是此但書規定，即當應有部分超過三分之二時，不需要考慮人數是否過半，直接可以多數決處分，包括設定地上權。","全體同意是民法上共有物處分的原則，但土地法第34條之1就是要突破此限制，不是以「全體同意」為要件。"],"99-15":["調解委員會（如鄉鎮市調解委員會）是民事糾紛的前置調解機構，不是土地法規定不服調處後的訴請機關。","監察機關（監察院）是監察彈劾機關，不是處理房屋租用糾紛的訴請機關。","租賃糾紛先由地政機關調處，不服調處者，應向司法機關訴請處理。","地政機關是進行調處的機關，不服調處後應向司法機關訴請，而非繼續找地政機關。"],"99-26":["擔保金額上限是2個月租金總額（§99），1個月不是上限。","土地法第98條：以現金為租賃之擔保者，其現金利息視為租金之一部；第99條第1項：擔保之金額不得超過2個月房屋租金之總額。","3個月超過§99的2個月上限。","4個月超過§99的2個月上限。"],"99-37":["土地法第104條第1項：基地出賣時，地上權人、典權人或承租人有依同樣條件優先購買之權。地上權人購買其設定之基地，有優先購買權，故此選項有優先購買權，不是「沒有優先購買權」的情況。","土地法第104條第1項明文，基地承租人有優先購買基地之權，故此選項有優先購買權。","土地法第104條第1項規定的是「基地」出賣時承租人的優先購買權，不是「房屋」出賣時承租人的優先購買權。房屋承租人對其承租的房屋本身，並無土地法第104條的優先購買權（房屋買賣不在第104條規範範圍內）。","土地法第107條規定耕地出租人出賣耕地時，承租人有優先購買之權，故此選項有優先購買權。"],"100-34":["政府建築之準備房屋，租金以不超過土地及建築物價額年息8%為限；一般房屋則為§97的申報總價年息10%。","10%是一般城市房屋租金的上限，不是政府準備房屋的租金上限。","政府準備房屋租金上限是年息8%，不是12%。","政府準備房屋租金上限是年息8%，不是15%。"],"100-36":["契約年限屆滿是§103所列出租人得收回基地之事由。","承租人轉租基地是§103所列出租人得收回基地之事由。","以基地供違反法令使用是§103所列出租人得收回基地之事由。","基地租賃須積欠租金除擔保現金抵償外達2年以上（土地法§103④）才得收回，積欠2個月不足；2個月是房屋租賃（§100）的門檻。"],"100-39":["依官方答案，此項（§104房屋出賣時基地所有權人之權）並非僅具債權效力。本項應為物權效力：§104第2項規定出賣人未通知而與第三人訂約者，其契約不得對抗優先購買權人（舊筆記載§104為債權效力係錯誤）。","依官方答案，耕地承租人先買權（三七五減租條例§15）具物權效力。土地法§107耕地承租人優先購買權準用§104第2項，同屬物權效力（舊筆記載為債權效力係錯誤）。","§104基地地上權人、典權人、承租人之先買權屬物權效力（§104第2項：未通知所訂契約不得對抗優先購買權人），並非僅具債權效力（舊筆記載為債權效力係錯誤）。","土地法第34條之1第4項的他共有人優先購買權，依通說和實務見解，屬於「債權效力」的優先購買權（非物權效力），未履行通知義務時，他共有人不得請求塗銷，亦不得依給付不能請求出賣人賠償（構成侵權行為者得依侵權行為請求），不能直接塗銷已完成的登記。"],"103-28":["承租人收回自耕是「出租人」（地主）可以終止耕地租約的情形，不是承租人可以終止不定期限耕地租約的情形。本題問的是不定期限租約「得終止」的情形，主語應是出租人或法律允許終止的事由。","「出租人放棄耕作權利」不是土地法規定不定期限耕地租約得終止之事由（土地法第114條有不定期限租約終止的規定，但此選項不在其中）。","土地法第114條：不定期限耕地租約，出租人非有積欠地租達2年總額等法定事由，不得終止。","承租人死亡後，其繼承人得繼續承租，即使繼承人年邁，也不是法定的終止事由。"],"103-38":["土地法第104條第1項：基地出賣時，地上權人、典權人或承租人有依同樣條件優先購買之權。典權人在條文明文列舉內，有優先購買權。","地上權人在第104條明文列舉內，有優先購買權。","土地法第104條明文列舉地上權人、典權人、承租人有優先購買權，並未包含抵押權人。抵押權的性質是擔保物權（不是使用收益權），與基地所有權的分離問題無關，故抵押權人對基地出賣無優先購買權。","承租人在第104條明文列舉內，有優先購買權。"],"104-28":["土地法§102是租用契約訂立後2個月內，不是20年。","§102的起算點是「租用契約」訂立，不是設定地上權契約。","§102是租用契約訂立後2個月內聲請，與請求權時效無關。","土地法第102條：租用基地建築房屋，應由出租人與承租人於契約訂立後二個月內，聲請該管直轄市或縣（市）地政機關為地上權之登記。從租用契約訂立起算2個月內，是申請地上權登記的法定期限。"],"105-12":["依土地法第102條，租用基地建築房屋，應由出租人與承租人聲請地上權登記，乙可以請求甲協同申請，此選項描述錯誤。","設定地上權（非出賣應有部分）時，土地法第34條之1第4項的他共有人優先購買權是針對「出賣應有部分」的情形，設定地上權適用的是「設定他項權利多數決」，並非第4項的優先購買權規定。","公同共有不同於分別共有，公同共有人無法出賣「其應有部分」（公同共有下各人的分額不可單獨處分），故此情形根本不發生。","最高法院民庭決議：§97年息10%的租金限制僅適用於住宅用房屋，營業用房屋租金不受限。"],"105-16":["地上權依民法第838條，得讓與他人，除非契約有限制，否則得讓與。甲乙間若無禁止讓與約定，乙可以將地上權（連同地上建築物B屋）讓與丁，故此選項錯誤。","土地法第104條：承租人出賣房屋時，基地所有權人有依同樣條件優先購買之權。本題乙（地上權人）出賣B屋（地上建築物）連同地上權，丙（A地所有權人）有優先購買權，故丙得主張優先承購，此選項錯誤。","依實務見解，地上權人出賣地上建築物時，基地所有權人的優先購買權客體包括「B屋及地上權」（因地上建築物與地上權是一體的），而非僅限於B屋，故此選項不完整。","丙（基地所有權人）行使優先購買權後，取得B屋及地上權，此時基地所有權（丙原有）與地上權（丙新取得）同屬一人，依民法混同原則，地上權因所有人與地上權人同一而原則上消滅。本選項完整正確地描述了優先購買的客體及法律效果。"],"105-20":["本題的乙是普通耕地承租人（非三七五減租承租人），其優先購買權是否具物權效力有爭議，且更根本的問題是：徵收是否構成「出賣」而觸發優先購買權，實務採否定見解。","最高法院實務認為，類推適用前提是類似情形，但徵收是公法行為（非私法買賣），性質差異過大，不宜類推適用先買權規定。","A地是耕地（農地），雖不是基地（建築用地），但土地法第107條有耕地承租人的優先購買權，問題不在「類型」而在徵收性質。","最高法院實務見解：土地徵收是依公法進行的強制取得程序，具有公益目的，與私法上的「出賣」性質不同，故承租人的優先購買權不能對抗徵收，乙不得主張在徵收執行後行使優先購買。"],"105-25":["甲（土地所有權人）將B屋贈與乙後，A地仍屬甲、B屋屬乙，涉及的是「土地與房屋分離」問題，法律推定的是租賃關係（而非地上權），故本選項法律關係判斷錯誤。","民法第425條之1：土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋分別讓與他人時，土地受讓人與房屋所有人間或房屋受讓人與土地所有人間，推定在房屋得使用期限內有租賃關係存在。本案甲僅贈與B屋給乙，A地仍屬甲，法律推定甲（土地所有人）與乙（房屋所有人）間有租賃關係，甲為「出租人」，日後法院拍賣B屋時，甲依土地法第104條有優先購買權。","實務上（最高法院）認為強制拍賣雖係公法程序，但仍屬有償讓與性質，不排除優先購買權的適用，故甲仍得主張先買權。","本案甲的先買權是依土地法第104條（法定優先購買權），並非「任意創設」，故此理由不成立。"],"105-28":["土地法第34條之1第4項他共有人的優先購買權，依實務見解可以預先拋棄（只是拋棄之意思表示效力問題，通說認為可以預先拋棄，且拋棄後不得反悔）。本選項正確。","官方答案不採此項，最正確者為A（他共有人先買權得預先拋棄）。","耕地三七五減租條例第15條的承租人優先購買權，具有物權效力，依通說不得預先拋棄，本選項說「得預先拋棄」，錯誤。","官方答案不採此項，最正確者為A。"],"105-32":["此項符合實務見解（官方答案視為正確敘述）。","專供機械設備用之鐵塔可認非房屋稅課徵對象（官方答案視為正確敘述）。","原住民保留地農育權自行經營滿5年得無償取得所有權（官方答案視為正確敘述）。","此項有誤：B屋滅失並非§103所列出租人得收回基地之事由。"],"105-33":["土地與建築物可以分別出售，民法並未強制「一體處分」，甲可以單獨出售A地，不違法。","民法§425-1是「推定」有租賃關係，不是「視為」；且出租人是乙（地主）。","法定地上權是基於法律規定（如抵押物拍賣後）直接發生的地上權，本題是單純土地出賣後的情形，非法定地上權的發生情形，應適用民法第425條之1的租賃推定，而非法定地上權。","依民法第425條之1，法律推定乙（A地所有人）與甲（B屋所有人）間有租賃關係（乙為出租人），故日後甲出賣B屋時，乙依土地法第104條（基地所有權人對房屋出賣有優先購買權）得主張先買權。"],"105-35":["土地法第104條第1項列舉有優先購買權者為：地上權人、典權人或承租人，未包含「長期占有人」，占有本身不產生優先購買權。","若地上權人、典權人、承租人均主張優先購買時，其順序「依地籍登記先後定之」，而非以抽籤決定。","優先購買權人接到通知後10日內不表示視為放棄（§104），不是30日。","官方答案：§104基地承租人等之優先購買權，效力優於§34-1他共有人之優先購買權。"],"106-6":["土地法第100條房屋租賃（非基地租賃）的收回事由中，積欠租金的標準是「達二個月以上」，1個月尚未達到法定門檻，不得收回。","承租人損壞房屋或附著財物「不為相當賠償」才得收回，已賠償則不得。","土地法第100條：出租人收回自住或重新建築時，得收回房屋。","承租人依法令正常使用房屋，不構成任何收回事由（出租人不得無故干涉承租人合法使用房屋）。"],"106-30":["收回自住或重新建築是§100房屋租賃的收回事由，非§103基地事由。","官方答案：§103 共五款，含「承租人違反租賃契約」（現行條文核對），故出租人得收回基地。","基地租賃須積欠租金除擔保現金抵償外達2年以上才得收回，積欠2個月不足；2個月是房屋租賃門檻。","損壞房屋或附著財物不賠是§100房屋租賃的收回事由，非§103基地事由。"],"107-8":["租賃權是債權，不是物權，不能辦理物權登記。土地法第102條設計的目的正是將租賃的使用關係轉化為有物權效力的地上權，保護承租人。","土地法第102條：租用基地建築房屋，應由出租人與承租人於契約訂立後二個月內，聲請該管地政機關為「地上權之登記」。透過設定地上權登記，承租人取得物權，日後基地所有人更換時，地上權仍有對抗效力，保護租地建屋者的使用利益。","典權是以出典為目的的他項權利（典權人支付典價、使用收益典物，期滿回贖），不是租地建屋的適當物權類型。","不動產役權（地役權）是為需役地的便宜而在供役地上設定的限制，是相鄰不動產之間的關係，不是租地建屋的適當物權類型。"],"107-9":["出租人收回自行建築不在§103列舉事由內（自住或重建是§100房屋收回事由）。","契約年限屆滿是§103所列出租人得收回基地之事由。","以基地供違反法令使用是§103所列得收回事由。","承租人轉租基地於他人是§103所列得收回事由。"],"108-4":["土地徵收條例§59：徵收後依法變更使用目的標售時，原所有權人或其繼承人有同樣條件優先購買權。","條文情形是變更目的後「標售」，此項寫成「讓售」，用語不符。","優先購買是依同樣條件，公告期間是1個月，不是3個月。","土地徵收條例§59：標售前公告1個月，原所有權人或其繼承人於「決標後」10日內未表示優先購買者視為放棄；本項寫成「讓售決定後」，且§59是標售而非讓售，故錯誤。"],"108-5":["抵押權人不在土地法第104條第1項的列舉範圍內，故抵押權人對基地出賣無優先購買權。","房屋抵押權人同樣不在土地法第104條優先購買權的列舉範圍內，無優先購買權。","優先購買權人接到出賣通知後10日內不表示即視為放棄（§104），不是1個月。","土地法第104條：出賣人未通知優先購買權人而與第三人訂約，其契約不得對抗優先購買權人。"],"109-14":["承租人個人的住院需求不是土地法第100條規定的房屋收回事由，出租人不得以此為由收回房屋。","積欠租金除以擔保金抵償外，須達2個月以上才得收回（§100），僅1個月不足。","土地法第100條：承租人違反民法§443Ⅰ擅自轉租者，出租人得收回房屋。","承租人個人工作調動不是出租人可以收回房屋的事由（此為承租人方面的終止租約事由，非出租人收回事由）。"],"110-5":["本選項描述正確，符合土地法第97條第1項規定，非錯誤。","本選項描述正確，符合土地法第97條第2項規定，非錯誤。","本選項描述正確，符合土地法第99條第1項規定（不超過2個月），非錯誤。","此項有誤：§98規定是「現金利息」視為租金之一部，不是現金本身。"],"111-16":["以基地供違反法令使用是§103所列出租人得收回基地之事由。","承租人轉租基地是§103所列得收回事由。","基地租賃須積欠租金除擔保現金抵償外達2年以上（土地法§103④）才得收回，積欠2個月不得收回；2個月是房屋租賃（§100）門檻。","承租人違反租賃契約是§103第5款所列得收回事由（現行條文核對）。"],"113-10":["土地法第73條之1第3項：繼承人、合法使用人、其他共有人依序有優先購買權（舊筆記A2順序有誤，條文與官方答案一致）。","順序顛倒；繼承人應最優先。","繼承人應最優先，合法使用人排在繼承人之後。","§73-1第3項順序是合法使用人先於其他共有人，此項順序相反（舊筆記A2即誤記為此順序）。"],"113-15":["此項正確：基地出賣時，地上權人、典權人或承租人有依同樣條件優先購買之權（§104）。","此項正確：接到出賣通知後10日內不表示視為放棄（§104）。","此項正確：未通知優先購買權人而訂約，契約不得對抗優先購買權人（§104）。","此項有誤：基地承租人與他共有人競合時，§104優先於§34-1，並非以登記先後定之。"],"114-13":["基地、房屋優先購買權，接到通知後10日內不表示視為放棄（§104），不是15日。","耕地承租人優先購買權，接到通知後10日內不表示視為放棄（§107），不是15日。","土地法第34條之1執行要點第13點(一)：他共有人接到出賣通知後15日內不表示，優先購買權視為放棄。","土地法第34條之1執行要點第13點(三)：區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人所有者，他共有人無優先購買權（因此種移轉是整套不動產的一體移轉，強制優先購買反而破壞區分所有關係）。"],"100-38":["國有只是公有土地的一種（國家所有），公有土地還包含地方政府所有，範圍更大，故公有≥國有，A選項的大小關係顛倒。","若公有等於國有，則地方政府（直轄市、縣市、鄉鎮市）所有的土地就不算公有，這顯然不正確。","土地法第4條：本法所稱公有土地，為國有、直轄市有、縣（市）有及鄉（鎮、市）有之土地。公有土地包含所有政府層級的土地（國有+地方政府所有），範圍大於僅限中央政府所有的國有土地。","國有土地是公有土地的一部分（子集合），兩者有包含關係，非無關係。"],"102-5":["公有土地的「處分」屬於重大行為，依土地法第25條需經民意機關同意及行政院核准，非免除同意程序。","公有土地「設定負擔」（如設定抵押、地上權等）同樣屬重大行為，依土地法第25條需民意機關同意，非免除。","土地法第25條規定，直轄市或縣市政府對其管公有土地的處分、設定負擔或超過10年的租賃，非經民意機關同意及行政院核准，不得為之；但「撥用」是政府機關內部移撥使用，不屬於本條的限制範圍，無須民意機關同意，也無須行政院核准（另依各機關撥用程序辦理）。","超過10年的租賃屬土地法第25條的限制事項，需民意機關同意，非免除。"],"102-28":["照價收買取得之土地，可隨時公開出售，不受土地法§25限制。","官方答案：市地重劃取得之土地亦屬可隨時公開出售者。平均地權條例§7 列的是照價收買、區段徵收、土地重劃（沒有一般徵收）。","區段徵收取得之土地，可隨時公開出售，不受土地法§25限制。","（本題問不屬者）權利變換屬都市更新制度，不在該條例列舉可隨時公開出售不受§25限制之取得方式。"],"102-32":["墾竣先取得耕作權，繼續耕作滿10年才無償取得所有權（§133）。","法條用語是「耕作權」，不是泛稱的使用權（§133）。","承墾人取得的是耕作權，不是地上權（§133）。","公有荒地承墾人自墾竣之日起，無償取得所領墾地之耕作權（土地法§133）。"],"103-32":["同意機關是「民意機關」（議會），不是行政機關（政府），且還需行政院核准，本選項機關類型錯誤。","機關類型錯誤（應為民意機關），且超過的年限是「十年」，不是二十年。","土地法第25條：直轄市或縣（市）政府對於其所管公有土地，非經該管區內民意機關同意，並經行政院核准，不得處分或設定負擔或為超過十年期間之租賃。三個要素：①民意機關同意②行政院核准③超過10年租賃為限制事項，均正確。","民意機關同意及行政院核准的部分正確，但年限是「十年」，不是二十年，一字之差為陷阱。"],"103-35":["公有土地是政府（國家、地方政府）所有的土地。台灣糖業股份有限公司雖是國營事業，但其法律性質是「公司」，土地登記名義人是公司法人，不是政府機關，故非公有土地。","同上，台糖是公司（法人），即使政府持有其股份，土地登記名義人是「台灣糖業股份有限公司」，不是「國有」，故非國有土地。","台糖土地登記名義人不是直轄市政府，故非直轄市有土地。","台灣糖業股份有限公司是依公司法設立的法人（即使100%政府股份），其所有的土地在法律上屬於公司法人財產，而非政府財產，故屬「私有土地」（私法人所有的土地）。這是一個常見的陷阱題：國營事業≠政府機關，國營事業的土地≠公有土地。"],"105-15":["5年租約未超過10年，不需民意機關同意及行政院核准，無須上述程序。","撥用是政府機關內部移撥，不在土地法第25條的限制範圍內（撥用不需要民意機關同意）。","土地法第25條：直轄市或縣（市）政府對其所管公有土地，「設定負擔」須經民意機關同意並行政院核准。設定負擔包括設定地上權、抵押等，影響公有土地上的負擔，屬重大行為，故需上述程序。","臨時使用通常是短期借用，不屬土地法第25條的限制事項，無須民意機關同意。"],"106-9":["撥用是機關間協調事項，應商同「政府（行政機關）」，不是「民意機關」，且撥用核准機關是行政院，但協商對象錯誤。","土地法第26條：各級政府機關需用公有土地時，應商同「該管直轄市或縣（市）政府」層請行政院核准後撥用之。協商對象是地方政府（行政機關），核准機關是行政院，符合法條規定。","協商對象錯誤（應是政府非民意機關），核准機關也錯誤（應是行政院不是內政部）。","協商對象正確（政府），但核准機關錯誤（應是行政院，不是內政部）。"],"108-18":["台糖是法人（公司），其土地屬私有土地，非公有土地（理由同103-35）。","官方答案不認臺灣石門農田水利會登記之土地屬§4所稱公有土地。","官方答案不採；§4公有土地限國有、直轄市有、縣（市）有、鄉（鎮、市）有，埔里鎮最明確。","埔里鎮（鄉鎮市）是地方自治機關，其所有的土地依土地法第4條屬於「鄉（鎮、市）有土地」，進而屬於「公有土地」的範疇。鄉鎮市政府所有的土地是最典型的公有土地（非國有、非私有）。"],"109-23":["逾限未補繳資料的土地才視為無主土地（土地法第57條），因地籍整理發現的公有土地不是無主土地，而是已知屬公有的土地。","囑託登記是由法院或其他政府機關「請求」地政機關辦理的登記，通常用於法院裁定、強制執行等情形。因地籍整理發現之公有土地，是由地政機關主動處理，用「逕為登記」而非囑託登記。","土地法§53：無保管機關之公有土地及因地籍整理發現之公有土地，由地政機關逕為登記，所有權人欄註明為國有。","所有權人欄應註明為國有，不是縣（市）有。"],"110-3":["應由地政機關「逕為登記」而非囑託登記，所有權人欄註明為國有。","土地法§53：無保管或使用機關之公有土地，由地政機關逕為登記，所有權人欄註明為國有。","應「逕為登記」而非囑託登記，且欄位註明國有而非直轄市或縣（市）有。","逕為登記正確，但所有權人欄應註明為國有，不是直轄市或縣（市）有。"],"113-12":["台糖是法人（公司），其土地屬私有土地，理由同103-35，為常考的觀念誤區。","土地法第12條第1項規定，所有權「視為消滅」（非絕對消滅）。視為消滅是擬制性的消滅，若日後水道恢復，原所有人得申請回復所有權（土地法第12條第2項），故非永久絕對消滅。","土地法第13條規定享有優先依法取得所有權或使用受益之權者是「接連地之所有權人」，本項寫成「使用權人」，故有誤。","土地法第16條：妨害基本國策者，中央地政機關得報請行政院制止之。"],"114-8":["本選項描述正確，各層級政府機關有需要時均可申請撥用公有土地（國有或地方有），非錯誤。","本選項為錯誤敘述：土地法第26條規定，公有土地撥用須層請「行政院」核准，而非「財政部國有財產署」（財政部國有財產署是管理國有財產的機關，但撥用核准權在行政院）。本選項將核准機關說錯。","本選項描述正確，各級政府機關均得申請撥用（不限特定層級），非錯誤。","本選項描述正確，公有土地撥用原則上無償移撥政府機關使用，非錯誤。"],"99-17":["觀光用地不是山坡地未編定土地的預設管制類別。","山坡地範圍內森林區、山坡地保育區、風景區土地，未編定使用地類別前，適用林業用地管制（非都市土地使用管制規則）。","遊憩用地是編定類別之一，不是未編定時的預設管制。","特定目的事業用地同樣不是預設管制類別。"],"100-21":["3萬至15萬不是區域計畫法第21條的罰鍰區間。","5萬至25萬不是法定區間。","區域計畫法第21條：違反非都市土地使用管制者，處6萬元以上30萬元以下罰鍰，並得限期變更、停止使用或拆除。","7萬至35萬不是法定區間。"],"100-22":["區域計畫核定後，擬定機關應於接到核定公文之日起40日內公告實施（區域計畫法第10條）。","50日不是法定期限。","60日不是法定期限；區域計畫是40日。","70日不是法定期限。"],"100-26":["5%低於保育綠地的規定比例。","10%低於保育綠地的規定比例。","20%低於保育綠地的規定比例。","申請變更編定為遊憩用地者，保育綠地依官方答案為30%（非都市土地使用管制規則）。"],"100-27":["1公頃未達遊憩設施變更為特定專用區的門檻。","2公頃是其他開發的門檻，不是遊憩設施。","3公頃不是法定門檻。","開發遊憩設施達5公頃以上，應變更為特定專用區（非都市土地使用管制規則）。"],"100-28":["甲種建築用地是供山坡地範圍外之農業區內建築使用（區域計畫法施行細則§13），不是鄉村區。","官方答案為乙種建築用地：鄉村區土地可編定為供建築使用的建築用地。","丙種建築用地供森林區、山坡地保育區、風景區及山坡地農業區建築使用。","丁種建築用地供工廠及有關工業設施建築使用（施行細則§13），不屬鄉村區之建築用地。"],"100-29":["甲種建築用地容積率240%，敘述正確，故非「有誤」。","乙種建築用地容積率240%，敘述正確，故非「有誤」。","丁種建築用地容積率300%，敘述正確，故非「有誤」。","特定目的事業用地容積率應為180%，不是120%，故此項有誤（筆記：60%／180%）。"],"101-11":["土地及天然資源之保育利用，是區域計畫法第1條所列目的。","人口及產業活動之合理分布，是區域計畫法第1條所列目的。","促進市、鎮、鄉街有計畫之均衡發展，是都市計畫法的立法目的，不是區域計畫法。","加速並健全經濟發展、改善生活環境、增進公共福利，是區域計畫法第1條所列目的。"],"101-16":["鹽業、礦業、水利用地之建蔽率與容積率，由經濟部會同建築管理、地政機關訂定。","內政部是區域計畫的中央主管機關，但這三類用地由經濟部訂定。","農業主管機關管農業用地，不管鹽業、礦業、水利用地的強度。","交通部不是這三類用地強度的訂定機關。"],"101-18":["10公尺不是題目所指的建築管制範圍。","車籠埔斷層線二側各15公尺為建築管制範圍，範圍內震後全倒者可申請變更為國土保安用地。","20公尺不是該管制範圍。","25公尺不是該管制範圍。"],"101-19":["開發影響費得以開發區內可建築土地抵充（區域計畫法第15-3條）。","區域計畫法§15-3第2項：開發影響費之收費範圍、標準由「中央主管機關」定之，本項寫成直轄市、縣（市），故錯誤（舊筆記有誤，官方答案正確）。","區域計畫法§15-3第3項：開發影響費得成立基金，其收支保管及運用辦法由「直轄市、縣（市）主管機關」定之，本項寫成中央，故錯誤（舊筆記有誤）。","區域計畫法§15-3第4項：開發影響費之徵收「於都市土地準用之」，並未排除都市土地，此項說法錯誤。"],"101-38":["甲種建築用地建蔽率60%、容積率240%，與規則一致。","乙種建築用地容積率是240%，不是120%。","丙種建築用地建蔽率是40%，不是60%。","丁種建築用地建蔽率是70%，不是60%。"],"102-1":["甲種建築用地建蔽率60%、容積率240%。","容積率120%是丙種建築用地的數字。","建蔽率40%不屬於甲種建築用地。","40%／120%是丙種建築用地的標準。"],"102-3":["區域計畫法第21條罰鍰是6萬至30萬，不是6萬至50萬，故此項錯誤。","得限期變更使用、停止使用，是第21條明定的處分，敘述正確。","得拆除地上物恢復原狀，是第21條明定的處分，敘述正確。","逾期不繳納罰鍰者移送法院強制執行，敘述正確。"],"102-4":["各級政府得就區域計畫所列重要風景及名勝地區，研擬風景區計畫。","特定專用區是使用分區，不是此處的計畫名稱。","生態保育區計畫不是法定用語。","觀光遊憩區計畫不是法定用語。"],"102-15":["特定目的事業用地不是山坡地未編定土地的預設管制類別。","山坡地範圍內森林區、山坡地保育區、風景區土地，未編定使用地類別前，適用林業用地管制。","生態保護用地不是預設管制類別。","國土保安用地不是預設管制類別。"],"102-36":["區域計畫法施行細則§13：甲種建築用地＝供山坡地範圍外之農業區內建築使用者，與官方答案一致（舊筆記記為乙種係錯誤；乙種是鄉村區）。","乙種建築用地是供鄉村區內建築使用（施行細則§13），不是山坡地範圍外之農業區。","丙種建築用地供森林區、山坡地保育區、風景區及山坡地農業區建築使用。","丁種建築用地供工廠及有關工業設施建築使用，不是農業區建築使用。"],"102-37":["商業區是都市計畫的使用分區，非都市土地不劃定。","住宅區是都市計畫的使用分區，非都市土地不劃定。","住商混合區不是非都市土地的使用分區。","一般農業區是非都市土地11種使用分區之一，可依規定劃定。"],"103-1":["設立學校不是5公頃變更為特定專用區的類型。","開發遊憩設施達5公頃以上，應變更為特定專用區。","高爾夫球場的門檻是10公頃，不是5公頃。","開發社區的門檻是50戶或1公頃，變更為鄉村區，不是100戶或5公頃。"],"103-17":["甲種建築用地是供山坡地範圍外之農業區內建築使用（施行細則§13）；供鄉村區的是乙種，故此項錯誤。","乙種建築用地是供鄉村區內建築使用（施行細則§13）；供山坡地範圍外農業區的是甲種，故此項錯誤。","丙種建築用地供森林區、山坡地保育區、風景區及山坡地範圍農業區內建築使用。","生態保護用地供生態保護使用，不是供國土保安使用。"],"103-21":["由土地登記謄本標示部的登載資料，可知該筆土地是都市或非都市土地。","都市土地依都市計畫管制；以分區使用計畫及編定使用地管制的是非都市土地。","非都市土地管制重點是使用分區加使用地編定，本項敘述不被官方答案採認。","標示部不是用來查都市土地使用分區的，本項不正確。"],"104-19":["開發社區達50戶或面積1公頃以上，應變更為鄉村區。","50戶搭配2公頃的組合不是法定門檻。","100戶搭配2公頃的組合不是法定門檻。","100戶搭配3公頃的組合不是法定門檻。"],"104-21":["開發計畫是個案申請文件，不是分區圖與使用地編定的依據。","使用分區圖及使用地編定，依據是非都市土地分區使用計畫（區域計畫法第15條）。","產業發展計畫不是分區編定的法定依據。","管制計畫不是法定用語。"],"104-22":["行政院不是區域計畫法所定的中央主管機關。","區域計畫法第4條：中央主管機關為內政部。","國家發展委員會不是區域計畫法的中央主管機關。","營建署是內政部所屬機關（現已改制為內政部國土管理署），法定主管機關為內政部（區域計畫法§4）。"],"104-24":["為加強資源保育須檢討變更使用分區，是縣（市）政府得報經上級核定逕為分區變更的法定理由之一。","促進區域土地權利調整不是法定的逕為變更理由。","實施中央重大建設的列舉文字與法定理由不符，官方答案未採。","區域建設推行委員會之建議，不是此處法定的逕為變更理由。"],"104-25":["5公頃是遊憩設施變更為特定專用區的門檻，不是山坡地最低開發面積。","山坡地範圍內開發案，最低開發面積為10公頃。","15公頃不是法定最低開發面積。","20公頃不是法定最低開發面積。"],"106-24":["處6萬至30萬罰鍰，敘述正確。","限期不遵從得按次處罰，敘述正確。","限期不遵從得停止供水供電、封閉、強制拆除，敘述正確。","不依限變更使用者，是依行政執行法辦理並得處6個月以下徒刑或拘役，不是強制執行法，故此項錯誤。"],"106-25":["發生或避免重大災害，是得隨時檢討變更的原因，故非本題答案。","興辦重大開發或建設事業，是得隨時檢討變更的原因。","為適應國防或經濟發展之需要，不是區域計畫法所列隨時檢討變更的原因（那是都市計畫迅行變更事由）。","區域建設推行委員會之建議，是得隨時檢討變更的原因。"],"106-35":["山坡地範圍內森林區、山坡地保育區、風景區未編定使用地類別前，適用林業用地管制。","遊憩用地不是預設管制類別。","生態保護用地不是預設管制類別。","國土保安用地不是預設管制類別。"],"107-17":["森林區包含在適用林業用地管制的範圍內，不是答案。","風景區包含在適用林業用地管制的範圍內，不是答案。","國家公園區不在森林區、山坡地保育區、風景區三者之內，故不適用此規定。","山坡地保育區包含在適用林業用地管制的範圍內，不是答案。"],"108-9":["山坡地範圍內森林區、山坡地保育區、風景區未編定使用地類別前，適用林業用地管制。","農牧用地不是預設管制類別。","國土保安用地不是預設管制類別。","原住民保留地不是使用地編定類別。"],"108-20":["社區開發50戶或1公頃以上變更為鄉村區，敘述正確。","工業使用10公頃以上變更為工業區，敘述正確。","遊憩設施5公頃以上變更為特定專用區，敘述正確。","高爾夫球場的門檻是10公頃，不是5公頃，故此項錯誤。"],"108-25":["使用區是11種，不是10種。","使用區是11種，不是10種；使用地19種。","使用地是19種，不是18種。","非都市土地劃定11種使用區、編定19種使用地。"],"109-7":["興辦事業計畫被廢止或失效，是廢止開發許可的事由。","申請人自行申請廢止，是廢止開發許可的事由。","此項有誤：「與水源供應、交通、排水、電力電信及垃圾處理等公共設施及公用設備服務能相互配合」是區域計畫法§15-2核發開發許可的審議要件，不是開發許可後的廢止情形（舊筆記誤列）。","違反核定計畫經限期改善而未改善，是廢止開發許可的事由。"],"110-17":["謄本不是臨時使用資料登錄的處所。","臨時使用用途及期限等資料，依規定登錄於土地參考資訊檔。","使用分區證明不是登錄處所。","許可使用書不是登錄處所。"],"110-18":["政府令其變更或拆除前，得為從來之使用，敘述正確。","原有建築物除准修繕外，不得增建或改建；本項說准增建，故錯誤。","對公眾安全衛生有重大妨礙者，政府「應」限期令其變更或停止使用、遷移、拆除或改建，敘述正確。","令其變更或停止使用所受損害應予適當補償，敘述正確。"],"111-8":["100坪×60%＝每層60坪；總樓地板100坪×240%＝240坪，240÷60＝4層。","建坪60坪正確，但5層會超過容積率，樓地板上限是240坪。","建坪100坪超過建蔽率60%的上限。","建坪100坪超過建蔽率60%的上限。"],"99-14":["公共設施保留地之取得，是都計法第83-1條容積移轉的適用情形。","公共開放空間之提供，是容積移轉的適用情形。","歷史建築之保存，是容積移轉的適用情形。","農業用地之保護不在都計法第83-1條容積移轉適用情形內，故為「非屬」。"],"99-23":["5%低於法定最低比例。","公園、體育場所、綠地、廣場、兒童遊樂場，占用土地總面積不得少於全部計畫面積10%（都計法第45條）。","20%高於法定最低比例，不是法定數字。","30%高於法定最低比例，不是法定數字。"],"99-34":["戰爭、地震、水災等重大事變遭受損壞，是迅行變更事由。","為避免重大災害之發生，是迅行變更事由。","為適應國防或經濟發展之需要，是迅行變更事由。","保育生態環境及歷史遺跡不是迅行變更事由；法定四款還有配合中央或地方重大設施。"],"100-23":["居住密度及容納人口是細部計畫應表明事項（都計法第22條）。","主要道路及公眾運輸系統屬主要計畫事項。","住宅、商業、工業等土地使用配置屬主要計畫事項。","學校、大型公園、批發市場等公共設施用地屬主要計畫事項。"],"100-25":["人口成長、分布、組成是主要計畫應表明事項。","土地使用分區管制屬細部計畫事項，不是主要計畫書應表明事項，故為「不包括」。","住宅及其他土地使用之配置是主要計畫應表明事項。","主要道路及公眾運輸系統是主要計畫應表明事項。"],"101-10":["5年不是優先發展區的預計年限。","優先發展區指預計在10年內必須優先規劃、建設發展的地區（都計法第7條第4款）。","15年不是法定年限。","25年是主要計畫的最長實施年限，不是優先發展區。"],"101-12":["公共設施實質建設，屬都市計畫事業。","新市區實質建設，屬都市計畫事業。","舊市區更新實質建設，屬都市計畫事業。","開發許可是非都市土地的制度，不屬於都市計畫事業。"],"101-13":["主要計畫只定大方向，更新範圍依官方答案不是據此劃定。","市地重劃計畫是重劃制度，不是劃定更新地區範圍所依的計畫。","官方答案為細部計畫：更新地區範圍落實在細部計畫層次劃定。","區段徵收計畫是取得土地的方式，不是劃定更新範圍所依的計畫。"],"101-14":["市地重劃不是都計法更新地區取得土地及地上物的法定方法。","聯合開發不是此處列舉的法定方法。","開發許可屬區域計畫法，與都市計畫更新無關。","更新地區範圍內的土地及地上物，得依法實施徵收或區段徵收。"],"101-15":["這是重建的定義：全地區徵收、拆除、重新建築並安置住戶。","這是維護的定義：加強土地使用及建築管理，保持良好狀況。（舊筆記表格把整建與維護對調，係筆記錯誤，以都計法§64為準。）","整建：強制建築物改建、修建、維護或充實設備，必要時對部分土地及建築物徵收、拆除重建。（都計法§64整建定義即此；舊筆記對照表有誤。）","此項把徵收寫成重劃，與法條文字不符。"],"101-17":["申請興建農舍須具農民身分，本項說不須具備，錯誤。","本項的高度、面積、距離等數字與農舍規定不符。","已申請建農舍的農業用地須在套繪圖著色標示，其90%農業用地分割後仍不得再申請農舍。","農舍不得自行變更使用，本項錯誤。"],"101-20":["10年不是主要計畫實施的最長年限。","15年不是最長年限。","主要計畫實施進度以5年為一期，最長不得超過25年（都計法第15條第2項）。","30年超過法定上限。"],"101-21":["因水災等重大事變遭受損壞，是迅行變更事由。","因土地權利人權利遭受重大損失，不是迅行變更事由，故為「非屬」。","為適應經濟發展之需要，是迅行變更事由。","配合中央、直轄市或縣（市）興建重大設施，是迅行變更事由。"],"102-14":["交換不是私人辦理都市計畫事業取得私有公設用地的方式。","私人或團體沒有徵收權，不能請政府替其徵收。","照價收買是平均地權手段，不適用此處。","私人辦理都市計畫事業，無法協議購買者，應備妥價款申請政府代為收買（都計法第53條）。"],"102-38":["1年不是完成公共設施的期限。","3年不是完成公共設施的期限。","第一期發展地區於細部計畫發布後，最多5年內完成公共設施建設。","7年不是法定期限。"],"103-2":["主要計畫不是區域計畫公告後此處所列應擬定的計畫種類。","綱要計畫不是都市計畫種類。","細部計畫不是此處官方答案所列的種類。","官方答案為特定區計畫：區域計畫公告後，依其應擬定或變更的都市計畫，地方須依限辦理。"],"103-39":["主要道路及公眾運輸系統屬主要計畫事項，不是細部計畫書表明事項。","居住密度及容納人口是細部計畫表明事項。","事業及財務計畫是細部計畫表明事項。","土地使用分區管制是細部計畫表明事項。"],"103-40":["徵收是公共設施保留地的取得方式之一。","都市更新不是公設保留地列舉的取得方式，故為「為非」。","市地重劃是公設保留地的取得方式之一。","區段徵收是公設保留地的取得方式之一。"],"104-23":["市計畫另有較大規模與層級的設置條件，不是3,000人這個條件。","鎮計畫另有鎮的規模條件，不是本題所問。","都市計畫法§11：人口集居達三千，而其中工商業人口占就業總人口50%以上之地區，應擬定鄉街計畫（舊筆記寫在市鎮計畫係錯誤）。","特定區計畫依特殊目的劃設，不以人口與工商業比例為條件。"],"104-26":["1年不是門檻。","未發布細部計畫地區，主要計畫發布已逾2年且能確定建築線者，得指定建築線核發建照。","3年不是門檻。","5年是第一期發展地區完成公共設施的期限，不是這裡的門檻。"],"104-27":["10年不是優先辦理交換的劃設年限。","15年不是劃設年限。","20年不是官方答案；筆記為25年。","公設保留地劃設逾25年未經政府取得者，得優先辦理與公有非公用土地交換。"],"105-30":["公共設施建設是都市計畫事業。","新市鎮建設不在都市計畫事業範圍；事業為公共設施建設、新市區建設、舊市區更新。","新市區建設是都市計畫事業。","舊市區更新建設是都市計畫事業。"],"106-8":["本項依官方答案不是錯誤選項。","縣政府所在地及縣轄市的主要計畫由內政部核定，敘述正確。","接到核定公文30日內發布實施，敘述正確。","此項有誤：都市計畫法§19第1項規定主要計畫應於「送都市計畫委員會審議前」公開展覽30天及舉行說明會，不是審議後（舊筆記有誤）。"],"106-26":["公共設施用地依人口、土地使用、交通現狀及未來發展趨勢決定項目、位置與面積（都計§43），敘述正確。","本項錯誤（官方答案B）：都市計畫法§42Ⅱ「前項各款公共設施用地應儘先利用適當之<b>公有</b>土地」，不是私有土地。","都計§45：公園等五項占用土地總面積不得少於全部計畫面積10%，敘述正確。","都計§44：道路系統、停車場所及加油站依分區及交通配置；鐵路、公路應避免穿越市區中心，敘述正確。"],"106-27":["名勝、古蹟及具有紀念性或藝術價值應予保存之建築，是都市計畫法§15第1項第5款「主要計畫」應表明事項，§22細部計畫並未列入，與官方答案一致（原註記有誤）。","居住密度及容納人口是細部計畫事項。","土地使用分區管制是細部計畫事項。","道路系統是細部計畫事項。"],"106-37":["都市計畫發布實施後，依建築法實施建築管理（都計法第40條）。","建築技術規則是建築法的施行規範，不是法定依據。","建築師法規範建築師業務，不管建築管理。","建築管理規則不是法條所指的法律。"],"107-16":["開發前先提報區域計畫委員會審議，敘述正確。","此項有誤：區域計畫法§15-2只要求申請人「已取得開發地區土地及建築物權利證明文件」，並非須取得全部土地及建築物之所有權（舊筆記有誤）。","公共設施用地完成分割移轉登記並繳開發影響費，敘述正確。","受理後除特殊情形外60日內報請審議，敘述正確。"],"108-12":["公園、體育場所、綠地、廣場、兒童遊樂場占地不得少於全部計畫面積10%。","12%不是法定數字。","15%不是法定數字。","17%不是法定數字。"],"108-15":["15年不是法定預計年限。","20年不是法定預計年限。","都市計畫應依現況與既往情況，預計25年內的發展情形訂定。","30年超過法定年限。"],"109-6":["都市計畫變更若限制人民權利，屬行政處分，不是觀念通知。","個別變更範圍外人民權利受侵害時，仍可救濟，本項說法錯誤。","國防或經濟發展需要屬迅行變更事由，不須通盤檢討。","為避免重大災害而變更，屬迅行變更（都計法第27條），以個案變更辦理。"],"109-21":["社會福利設施依都計法第46條，按閭鄰單位或居民分布情形配置。","垃圾處理場不在第46條列舉的設施內。","污水處理廠不在第46條列舉的設施內。","屠宰場不在第46條列舉的設施內。"],"110-15":["僅列①④不完整，漏了可建築土地與樓地板面積。","僅列①②③不完整，漏了一定金額。","僅列②③④不完整，漏了公共設施用地。","主管機關得要求提供公共設施用地、可建築土地、樓地板面積或一定金額四項（第27條之1第1項）。"],"110-16":["②所得稅法不在排除範圍，且漏了土地法。","②所得稅法不在排除範圍。","公設保留地交換不受土地法、國有財產法、各級政府財產管理法令限制（第50條之2）。","所得稅法不在排除範圍，四項全選錯誤。"],"111-12":["細部計畫期限不是5年，公共設施也不是2年。","細部計畫期限不是4年。","細部計畫期限不是3年。","第一期發展地區於主要計畫發布後2年內完成細部計畫，細部計畫發布後5年內完成公共設施。"],"112-22":["1/500不是主要計畫圖的最小比例尺。","1/1,000不是主要計畫圖的最小比例尺。","主要計畫圖比例尺不得小於1/10,000（第15條）。","1/15,000比例過小，不符規定。"],"113-4":["都市計畫法§20第1項第4款：鎮及鄉街之主要計畫由內政部核定，與官方答案一致（舊筆記「縣政府核定」係錯誤）。","直轄市之主要計畫由「內政部」核定（§20第1項第2款），不是行政院，故錯誤。","§20第1項第5款：特定區計畫由縣（市）政府擬定者，由內政部核定（無「轉報行政院備案」；轉報備案的是直轄市政府擬定者），故錯誤。","§20第1項第5款：特定區計畫由內政部訂定者，報行政院「備案」，不是由行政院核定，故錯誤。"],"113-9":["主要計畫經都委會審議修正或內政部指示修正者，免再公開展覽及舉行說明會。","再公開展覽並非必要。","再舉行說明會並非必要。","再公開展覽及說明會並非必要。"],"113-13":["項目位置面積應依人口、土地使用、交通等現狀決定，不是所得、納稅能力、地價。","中小學校、社教場所、市場、郵電、衛生、警消等，按閭鄰單位或居民分布情形配置（第46條）。","公園、體育場所等占地不得少於10%，不是20%。","鐵路公路通過都市計畫區應避免穿越市區中心，不是以市區中心為重點。"],"113-14":["保留地未取得前得申請臨時建築使用，敘述正確。","不得妨礙指定目的，但得繼續原來使用或改為妨礙較輕使用，敘述正確。","私有保留地得與公有非公用土地交換，不受土地法、國有財產法限制，敘述正確。","地上物清除或遷移，政府應予補償；本項說「不得請求補償」，故錯誤。"],"114-18":["主要計畫實施進度以5年為一期，最長不得超過25年。","細部計畫圖比例尺不得小於1/1,200，不是1/1,500。","主要計畫圖比例尺不得小於1/10,000，不是1/15,000。","主要計畫核定後應於30日內發布實施，不是20日。"],"109-25":["1年不是法定期限（舊筆記寫1年係錯誤）。","2年不是官方答案。","3年不是官方答案。","官方答案為4年（109年出題時條文）。現行法：國土計畫法§45已修正（114.01.20）為直轄市、縣（市）國土計畫公告實施後「10年內」公告國土功能分區圖。"],"112-25":["國土計畫法§15：全國國土計畫每「十年」通盤檢討一次，不是五年。","國土計畫法§15：直轄市、縣（市）國土計畫每「五年」通盤檢討一次，不是十年。","都市計畫每3年或5年內至少應通盤檢討一次（都計法第26條）。","區域計畫法§13：區域計畫每「五年」通盤檢討一次，不是十年，故錯誤。"],"114-19":["國土計畫法§4：國土功能分區之劃設屬直轄市、縣（市）主管機關事項（中央只規劃劃設順序及原則），故錯誤。","國土保育地區、海洋資源地區的使用許可、變更及廢止之核定，由中央主管機關辦理。","農業發展地區、城鄉發展地區的使用許可核定，屬直轄市、縣（市）主管機關。","縣市國土計畫之擬訂、公告、變更及執行，屬直轄市、縣（市）主管機關。"],"100-1":["1%不是抵繳上限。","3%不是抵繳上限。","因重新規定地價增繳的地價稅，移轉時准抵繳土增稅，以不超過應繳土增稅總額5%為限（土稅法第31條）。","10%超過法定上限。"],"104-6":["若以公告地價100%作為申報地價，則未申報等於主動申報最高值，不合理，法律設計是以公告地價80%作為推定值。","平均地權條例第16條：土地所有權人未於公告期間申報地價者，以公告地價百分之八十為其申報地價。80%是C1最高頻的固定數字，與地價稅計算密切相關，務必牢記。","超過100%不合邏輯，為干擾選項。","90%不是法定推定比例，為干擾選項。"],"105-9":["公告地價是課徵地價稅的依據，公告土地現值是課徵土地增值稅的依據。","公告土地現值也是每年公告，並非每3年；公告地價則配合重新規定地價（每2年）。","相反：公告土地現值才較接近市價，公告地價通常較低。","本項把兩者的評定機關截然切開，不是本題的正確說法。"],"106-13":["本選項描述正確，符合平均地權條例第14條規定，非錯誤。","本選項描述正確，符合平均地權條例第16條規定，非錯誤。","本選項描述正確，符合土地稅法規定，非錯誤。","本選項為錯誤敘述：平均地權條例規定應分區調查最近「一年」之土地買賣價格或收益價格，不是2年。109-8也考過這個陷阱，「一年」是固定答案。"],"108-24":["本選項描述正確，符合平均地權條例規定，非錯誤。","本選項描述正確（一年），非錯誤。","本選項描述正確（公告期限30日），非錯誤。","本選項為錯誤敘述：申報地價低於公告地價80%時，主管機關得「照價收買」，但「以公告地價（100%）為其申報地價」的說法有誤——平均地權條例§16但書：申報地價未滿公告地價80%時，得照價收買或「以公告地價80%」為其申報地價，而非以公告地價全額作為申報地價。"],"109-8":["重新規定地價的週期是「每二年」一次，不是每三年，此為陷阱選項，常與房屋標準價格「每三年重新評定」混淆。","平均地權條例第15條第1款規定，辦理規定地價或重新規定地價時，應分區調查最近「一年」之土地買賣價格或收益價格，作為評定地價的依據。「一年」是本考點的固定正確答案（106-13選D也考同一概念）。","法條規定：申報地價低於公告地價80%時，得照價收買（非徵收）。照價收買和徵收是不同的法律概念，混淆是常見陷阱。","未申報地價者，以公告地價「百分之八十」為其申報地價，不是公告地價全額，此為C1最常考的數字陷阱。"],"111-3":["1%不是法定上限，為干擾選項。","2%不是法定上限，為干擾選項。","3%不是法定上限。注意本題答案與100-1相同，都是5%。","同100-1，土地稅法第31條規定，重新規定地價增繳地價稅准予抵繳土增稅，上限為應納土增稅額的5%。「5%」是C1的固定數字，這道題在100年和111年都考過，要記住不是1%也不是3%。"],"112-3":["設典是「出典人」移轉土地使用收益給典權人，預繳土增稅的義務人是出典人，回贖的也是出典人，非典權人。且退還時不加計利息。","同上，出典人才是預繳人，且回贖的主體是出典人，不是典權人。","出典人方向正確（出典人預繳、出典人回贖），但退還時「無息退還」（不加計利息），此選項的「加計利息」部分錯誤。","土地稅法第29條：已規定地價之土地，設定典權時，出典人應依規定預繳土地增值稅；出典人回贖時，原預繳之土地增值稅，應「無息退還」出典人。兩個關鍵：①主體是出典人（非典權人）②無息退還（非加計利息）。"],"113-21":["扣除項目含工業、礦業、農業用地及免稅土地，本項漏列免稅土地。","基本稅率適用於同一直轄市或縣（市）地價總額，不是依戶籍所在地。","累進起點地價以千元為單位，不是百元。","累進起點地價應於重新規定地價後、當年地價稅開徵前計算完竣，報財政部及內政部備查。"],"99-27":["平均地權條例第57條：私有土地所有權人申請優先辦理市地重劃，需要「土地所有權人半數以上，且其所有土地面積超過私有土地總面積半數」的同意。「半數人數＋半數面積」是C2自辦重劃的同意門檻，與34-1多數決（人數過半+面積過半）類似，務必記住。","人數門檻說三分之二，過高，不符合法條規定。","面積門檻說三分之二，過高，不符合法條規定。","人數和面積都說三分之二，均過高，不符合法條規定。"],"100-17":["六個月不是市地重劃禁止移轉的最長期間。","平均地權條例第59條：重劃地區選定公告後，政府得公告禁止區內土地移轉、分割、設定負擔及新建、增建、改建房屋，其禁止期間，不得超過「一年六個月」。「1.5年」是C2最重要的固定數字考點。","2.5年過長，不是法定最長期間。","3.5年過長，不是法定期間。"],"100-19":["給予低利重劃貸款，是自辦市地重劃的獎勵事項。","平均地權條例§58Ⅰ獎勵事項為：低利重劃貸款；免收或減收地籍整理規費及換發權利書狀費用；優先興建重劃區及其相關地區之公共設施；免徵或減徵地價稅與田賦；其他有助於市地重劃之推行事項。「優先辦理公有土地之撥用」不在其中，官方答案正確（舊筆記列入此項有誤）。","免收或減收地籍整理規費，是獎勵事項。","免徵或減徵地價稅與田賦，是獎勵事項。"],"100-20":["重劃核定只是計畫確定，尚未分配完成，土地不能從此時起視為原有土地。","平均地權條例第62條：重劃後分配與原土地所有權人之土地，自「分配結果確定之日」起視為其原有之土地。從此日起，新分配土地在法律上等同原有土地，先前設定的抵押等他項權利依法移設到重劃後分配的土地上。","地籍整理完成是行政程序，不是視為原有土地的起算時點。","登記是公示行為，但視為原有土地的起算點早於登記完成日。"],"102-9":["出租耕地因市地重劃致不能達到租賃目的，不是直接將土地分配給承租人（承租人不是所有權人）。","直接改變租賃性質（從耕地改為基地）需要雙方同意，不是政府逕為處理的方式。","市地重劃的目的是整理土地供建築使用，不會重新調整為耕地。","平均地權條例第63條：出租之公私有耕地，因實施市地重劃致不能達到原租賃之目的者，由直轄市或縣（市）政府「逕為註銷其租約」並通知當事人，承租人並得依規定請求補償（§63：分配土地者為重劃計畫書公告當期公告土地現值之1/3，不扣預計土增稅；未分配者補償地價出租人2/3、承租人1/3）。「逕為註銷」是政府主動行為，不需雙方同意。"],"102-10":["國民中學是市地重劃法定十項共同負擔公共設施用地之一，屬於負擔範圍內。","平均地權條例第60條規定的十項共同負擔公共設施為：道路、溝渠、兒童遊樂場、鄰里公園、廣場、綠地、國民小學、國民中學、停車場、零售市場，「體育場」不在法定十項清單內，故為「不屬之」的答案。","綠地是法定十項共同負擔之一。","廣場是法定十項共同負擔之一。"],"102-11":["埋設基地管道屬於「基地改良」（供建築基地使用的改良），不是農地改良。","鋪築基地道路屬於基地改良，不是農地改良。","平均地權條例施行細則所稱改良土地中，農地改良包括：耕地整理、水土保持、土壤改良及修築農路、灌溉、排水、防風、防砂、堤防等設施（施行細則§11②）。土壤改良和防風設施是針對農業生產條件的改善，屬農地改良事項。","整平或填挖基地屬於基地改良（為供建築使用而整地），不是農地改良。"],"102-33":["抵費地出售不需要內政部同意，不是中央機關核准事項。","抵費地出售不需要行政院同意，層級過高。","抵費地出售不需要議會同意，抵費地本質上是重劃費用扣除後的剩餘土地，政府可自行處理。","平均地權條例第60條：重劃費用由參加重劃土地所有權人按比例共同負擔，由主管機關以重劃區內適當之土地抵充（即抵費地）。依平均地權條例§7，政府因土地重劃而取得之土地得隨時公開出售，不受土地法§25（須經民意機關同意並經行政院核准）之限制，故主管機關得自行公開標售。"],"103-34":["土地測量局不是重劃核准機關，為干擾選項（且土地測量局已裁併）。","此機關（已改制）不是重劃申請核准機關。","土地法第141條：土地重劃得因重劃區內土地所有權人過半數，而其所有土地面積除公有土地外超過重劃區內土地總面積一半者之共同請求，由直轄市或縣（市）地政機關核准為之。地政機關是核准機關，不是中央機關（內政部）。","建設機關負責的是建設工程，不是土地重劃的核准機關。"],"104-8":["國民中學（含國小）用地是市地重劃法定十項共同負擔之一，屬應負擔的範圍。","廣場用地是法定十項共同負擔之一。","兒童遊樂場用地是法定十項共同負擔之一。","平均地權條例第60條規定的十項共同負擔公共設施用地不包含「機關用地」（辦公廳舍）。機關辦公用地的取得應由政府自行負擔，不能要求參加重劃的土地所有人共同負擔，故機關用地「非屬之」。"],"104-10":["重劃前後地價可用來計算公共用地負擔，屬其作用。","重劃前後地價可用來計算費用負擔，屬其作用。","官方答案以計算標售抵費地底價為「不屬之」；其餘三項才是評定地價的作用。","重劃前後地價可用於土地交換分配及變通補償，屬其作用。"],"104-11":["平均地權條例第60條之2：市地重劃分配結果公告期間，土地所有權人對分配結果提出異議，調處不成，應由主管機關「報請上級主管機關裁決」，不是循司法途徑（這是行政裁決，非司法訴訟），也不是民事調處，而是向上級行政機關申請裁決。","不動產糾紛調處委員會是處理一般不動產糾紛的機關，不是市地重劃分配異議的處理機關。","市地重劃是行政程序，分配異議不循民事訴訟，而是行政裁決途徑。","正確救濟程序是先由主管機關報請上級機關裁決，而非直接提行政訴訟，行政訴訟是對行政裁決不服後的後續救濟。"],"107-11":["公告現值扣除預計土增稅後餘額1/3，是§77（出租耕地編為建築用地終止租約）的補償標準；本題為非耕地，適用§63-1相當一年租金。","公告現值1/3是§63出租耕地因市地重劃註銷租約的補償，不適用非耕地。","六個月租金不是法定補償標準。","平均地權條例§63-1：耕地以外出租土地因重劃不能達租賃目的，承租人得終止租約並請求相當一年租金的補償。"],"108-14":["§63（市地重劃）的補償是公告土地現值1/3，條文無扣除預計土增稅；扣稅後1/3是§77（編為建築用地收回）的公式，本項混用。","補償基準是公告土地現值，不是查估市價。","平均地權條例§63：按重劃計畫書公告當期該土地之公告土地現值1/3補償，不扣預計土增稅；官方答案正確。","補償基準是公告土地現值，不是查估市價。"],"109-5":["本項錯誤：§58Ⅰ②為「免收或減收」地籍整理規費及換發權利書狀費用，並非「減半收取」，官方答案正確。","向指定銀行或平均地權基金申請低利貸款，是獎勵事項。","抵費地出售不計徵土地增值稅，是獎勵事項。","免徵或減徵地價稅與田賦，是獎勵事項。"],"111-23":["此類土地不是優先抵充的第一順序。","平均地權條例§60Ⅰ規定，重劃區內道路等十項用地，應先以下列土地抵充：原有公有道路、溝渠、河川及未登記地。這些本已屬公共使用性質的土地優先轉為重劃後的公共用地，減少私有土地被扣除的比例。","此類公共設施用地不是第一順序抵充項目。","各類公有土地在抵充順序上排列在公有道路、溝渠、河川之後。"],"111-24":["優先興建公共設施是自辦重劃的獎勵事項之一，屬包含範圍。","免收或減收換發書狀費用是法定獎勵事項之一。","此為法定獎勵事項之一。","自辦重劃的獎勵是「低利貸款」，不是「免息貸款」。免息比低利更優惠，法條並未提供免息貸款，「免息」說法過度，故本選項「給予免息之重劃貸款」不在獎勵清單內，為「不屬之」的正確答案。注意：低利≠免息。"],"112-11":["計算基準應是「應分配權利面積」（重劃後按比例應分得的面積），不是「重劃前原有面積」；且位置應按「重劃後分配位置」，不是原位置。","同上，面積基準和位置基準均有誤，且應按「重劃後」地價（非重劃前地價）計算補償。","市地重劃實施辦法：土地所有權人應分配面積達最小分配面積標準1/2但未達標準者，改以現金補償，補償金額以「應分配權利面積 × 重劃後分配位置之評定地價」計算。兩個關鍵：①應分配權利面積（非原有面積）②重劃後地價（非重劃前地價）。","面積基準正確（應分配權利面積），但地價基準錯誤（應按重劃「後」地價，非重劃前）。"],"114-20":["以《農村社區土地重劃條例》§9Ⅰ為例：重劃會組織、重劃業務、獎勵等事項之辦法「由中央主管機關定之」，不是地方主管機關。","平均地權條例§58Ⅲ：重劃會辦理市地重劃，須私有土地所有權人「半數以上」，且其所有土地面積超過私有土地總面積半數以上者同意，並經主管機關核准。","官方答案不採本項。自辦農地重劃的同意門檻規定在《農地重劃條例》，站上尚未收該條全文，具體錯在哪一處待對全文。","《農村社區土地重劃條例》§9Ⅲ：應經私有土地所有權人合計「超過二分之一」，且其所有面積合計「超過私有土地面積二分之一」者之同意。本項寫成「三分之二」，數字錯。陷阱：同條例§6Ⅰ公辦重劃的同意門檻也是「過半數＋面積超過半數」，農村社區重劃沒有三分之二的門檻。"],"99-3":["十甲是較大的面積單位（1甲=9699.17平方公尺），不是法定上限。","十畝是中國傳統面積單位，在台灣法規中採公制，非法定上限。","平均地權條例第71條：直轄市或縣（市）政府對尚未建築之私有建築用地，應限制土地所有權人所有面積之最高額，以「十公畝」為限（1公畝=100平方公尺，10公畝=1000平方公尺≈302坪）。「10公畝」是C3最重要的固定數字考點，在105-38、107-10、108-13等題也都考過。","十公頃（100,000平方公尺）遠大於法定上限，為干擾選項。"],"100-8":["1至3倍不是空地稅的加徵倍數，為干擾選項。","土地稅法第21條：地方政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵「二倍至五倍」之空地稅。「2至5倍」是C3的固定數字考點，注意是加徵基本稅額的2至5倍，不是加徵1至3倍或5至10倍。","3至5倍不是法定加徵範圍。","5至10倍遠超法定範圍。"],"100-15":["平均地權條例第76條：耕地出租人依規定終止租約，實際收回耕地屆滿「一年」後，不依照使用計畫建築使用者，政府得照價收買。一年是照價收買的等待期限，是C3的固定數字考點。","六個月不是法定期限。","三個月不是法定期限。","一個月不是法定期限，過短。"],"103-29":["「以上」錯誤，法條是「以下」罰金。","平均地權條例第84條：以經營土地買賣為業，違背土地法律，從事土地壟斷、投機者，處「三年以下有期徒刑，並得併科七千元以下罰金」。三年「以下」、七千元「以下」是固定組合，不可搞錯「以上/以下」。","「以上」兩處均錯誤，法條是「以下」。","有期徒刑「以上」錯誤。"],"104-7":["公告地價是申報地價和地價稅的基準，不是照價收買的地價標準。","申報地價是地主自行申報的地價，不是照價收買的標準。","平均地權條例第26條之1：農業用地閒置不用，加徵荒地稅滿三年仍不使用，得照價收買；依第31條，收買地價按「收買當期之公告土地現值」為準。公告土地現值是最接近市價的官方地價，用於徵收補償和照價收買的基準。","市價（實際市場價格）不是法定照價收買的計算基準，使用公告土地現值是為了有統一的客觀標準。"],"105-1":["申報地價低於公告地價（不是公告現值）80%時才涉及照價收買，且本選項基準用「公告現值」有誤（應是「公告地價」），且低於80%時是得照價收買，不是一定得照價收買。","加徵荒地稅滿三年（不是兩年）後仍不使用，才得照價收買，2年的數字錯誤。","土地法第157條：土地所有權人認為標準地價過高，不能依第156條（標準地價20%以內增減）為申報時，得聲請該管直轄市或縣（市）政府照標準地價收買其土地。","超額土地限期應是2年（不是1年）才涉及照價收買，1年的時間數字有誤。"],"105-38":["同99-3，平均地權條例第71條：尚未建築之私有建築用地面積最高以10公畝為限。本選項正確。","§71限制對象是「尚未建築之私有建築用地」，不是「宅地」，對象錯誤。","超額私有建築用地，主管機關通知後應於「2年」內出售或建築使用，不是1年。","逾期未出售，政府得「照價收買」（非徵收），照價收買和徵收是不同的法律概念和程序。"],"106-39":["土地法第87條：改良物價值不及基地申報地價20%者視為空地，敘述正確。","空地定義（改良物不及申報地價10%等）與條例相符，敘述正確。","土地法：編為農業或直接生產用地未依法使用者為荒地，敘述正確。","本項錯在核准機關：平均地權條例§26-1為「報經內政部核准」通知限期使用或命其委託經營，不是農業主管機關。"],"107-10":["通知期間是「二年」（不是三年）內出售或建築使用。","同上，應是「二年」，不是三年。","逾期處理方式是「照價收買」，不是強制拍賣，兩者性質不同。","平均地權條例第72條：超額私有建築用地，主管機關通知後二年內仍未出售或建築使用者，「得予照價收買」。照價收買是政府依法強制收購（§31：按收買當期公告土地現值），不是市場拍賣，也不是徵收。"],"108-3":["照價收買後不歸屬中央政府（國有），而是歸屬地方政府所有。","平均地權條例規定，照價收買後之土地，歸屬執行照價收買之直轄市或縣（市）所有，成為直轄市有或縣市有土地（地方政府有），不是國有，也不是鄉鎮有。","照價收買的執行機關是直轄市或縣市政府，收買後土地歸屬直轄市或縣市，而非鄉鎮市。","照價收買後土地歸政府所有，不是公營事業。"],"108-13":["本選項描述正確，10公畝是法定上限，非錯誤。","本選項描述正確，二年是法定通知期限，非錯誤。","本選項描述正確，照價收買是逾期的處理方式，非錯誤。","本選項為錯誤敘述：照價收買的價格標準是按「公告土地現值」（不是查估之正常市價）。公告土地現值是官方公告的客觀標準，不是個案查估的市價，本選項混淆了兩種不同的地價基準。"],"109-13":["應補償的是改良土地費用及尚未收穫的農作改良物，不是已收穫者。","收回屆滿1年後不依計畫建築使用，政府得照價收買，不是2年。","補償是公告土地現值扣除預計土增稅後餘額的三分之一，本項漏了扣稅。","出租耕地依法編為建築用地，出租人為自行建築或出售作建築使用而收回時，得終止租約。"],"110-21":["土地所有權人將其土地出租、貸與或設有地上權者，須與承租人、借用人或地上權人協議建築（平均地權條例§74）。","典權與不動產役權（地役權）不在§74所列情形。","§74針對土地出租、貸與或地上權，而非農作改良物之出租貸與。","主體應為土地所有權人，承典人或地役權人出租建築改良物不在規範內。"],"112-21":["本選項為錯誤敘述：照價收買的價格標準是「公告土地現值」，不是「平均市價」，此為本題的錯誤選項。","本選項描述正確，2至5倍是法定加徵範圍，非錯誤。","本選項描述正確（§26Ⅱ：新建改良物價值不及所占基地申報地價50%者，不予核發建築執照），非錯誤。","本選項描述正確，政府得劃定區域限期建築，非錯誤。"],"114-11":["公開標售是公有土地處分的方式，不是私有土地已違反不得私有規定時的法定處置方式。","照價收買（平均地權條例）是針對超額土地、閒置土地等的處置手段，不是土地法第14條不得私有土地已成私有時的處置方式。","土地法第14條第2項：第一項各款土地，已成私有者，得依法徵收之。「依法徵收」是法定的處置方式，不是照價收買，也不是逕登記國有，更不是沒收，這是A1/C3的高頻陷阱考點。","沒收是刑事程序的手段，私有不得私有土地不適用沒收，法定程序是徵收。"],"101-6":["15日不是官方答案。","20日不是官方答案。","官方答案為30日。⚠️現行法：已改為申請所有權移轉登記時共同申報（預售屋代銷為簽約後30日）。","60日不是官方答案。"],"102-27":["本選項描述正確，政府機關可利用登錄資訊，非錯誤。","依當年（102年）規定本選項描述正確，非錯誤。注意現行§47Ⅲ（109.12.30修正）已改為「除涉及個人資料外，得提供查詢」，門牌、地號完整揭露，不再區段化；§47Ⅸ並規定舊的區段化資料應重新提供查詢。","本選項描述正確，主管機關得委任辦理，非錯誤。","本選項為錯誤敘述：平均地權條例§47Ⅳ明定，登錄之不動產交易價格資訊，在相關配套措施完全建立並完成立法後，始得為課稅依據；不是「應即」作為課稅依據。"],"103-16":["本選項描述正確，30日是法定期限，共同申報是正確程序，非錯誤。","本選項描述正確（特定情形下可單獨申報），非錯誤。","本選項描述正確（地政士代辦時應申報登錄），非錯誤。","本選項為錯誤敘述：依當時（101年施行）§47Ⅲ，委由不動產經紀業「居間或代理成交」者，應由經紀業申報登錄，但「已委託地政士申請登記者」由地政士申報；本選項說「均應」由經紀業申報，漏了委託地政士的例外。⚠️現行法：已改為權利人及義務人於申請所有權移轉登記時共同申報（§47Ⅱ）。"],"106-36":["5倍不是法定罰鍰倍數，為干擾選項。","10倍不是法定罰鍰倍數。","15倍不是法定罰鍰倍數。","平均地權條例第81條：土地買賣未辦竣權利移轉登記，承買人再行出售土地時，處應納登記費「二十倍以下」之罰鍰。20倍是法定上限，是C4的固定數字考點，這也與土地法第73條逾期登記罰鍰最高20倍相同，可一併記憶。"],"110-9":["申報登錄價格資訊不實是較嚴重的違規，處罰較重（不只是先令改正），不是本題問的「先令限期改正，屆期未改正才處罰」的情形。","平均地權條例規定，違反申報登錄義務中，若是「價格以外的資訊不實」（價格以外資訊；預售屋則為價格、交易面積及解約以外資訊，§81-2Ⅳ），主管機關應「先令其限期改正」，屆期未改正才處罰鍰（新台幣6千元以上3萬元以下）。與「價格不實」（直接處罰較重）的處理程序不同。","未依限申報或價格資訊不實，均是較嚴重違規，直接處罰，不是先令改正。","規避查核是最嚴重的違規，直接處罰，不是先令改正的情形。"],"110-10":["金額過低，不符合預售屋轉售罰鍰的法定標準。","6萬至30萬是§81-2Ⅴ預售屋契約不符應記載／不得記載事項的罰鍰，不是紅單轉售的罰鍰。","平均地權條例第81條之2第6項：預售屋買受人將已付定金之書面契據轉售予第三人者，處「十五萬元以上一百萬元以下」罰鍰。15萬至100萬是預售屋非法轉售的法定罰鍰範圍，是C4的重要數字考點。","下限30萬不是法定標準（應為15萬）。"],"111-25":["本選項描述正確，銷售前備查符合法規規定，非錯誤。","本選項描述正確，30日申報期限符合法規，非錯誤。","本選項描述正確，書面契據要求及不得不利買受人均符合法規，非錯誤。","本選項為錯誤敘述：平均地權條例§47-3Ⅵ明定，預售屋買受人不得將收受定金之書面契據（紅單）轉售予第三人，銷售者亦不得同意或協助；紅單轉售沒有親屬例外（配偶、直系血親、二親等內旁系血親的例外是§47-4對「買賣契約」讓與轉售的規定）。"],"112-9":["平均地權條例規定，預售屋或新建成屋買賣契約原則上不得轉售，但例外允許的情形是：「配偶、直系血親或二親等內旁系血親」間的讓與或轉售。注意「旁系血親」，不是「旁系姻親」，這是關鍵字差異，四個選項的差別就在「血親/姻親」與「親等範圍」的組合。","應是「血親」，不是「姻親」，且姻親關係遠比血親疏遠，法律上的例外通常以血親為準。","直系應是「血親」不是「姻親」，混用了血親和姻親。","旁系應是「血親」不是「姻親」，本選項的旁系部分錯誤。"],"112-10":["10日不是法定期限。","15日不是法定期限。","委託不動產經紀業代銷預售屋者，應於簽訂買賣契約「三十日內」向主管機關申報登錄資訊。注意：一般買賣現行法已改為申請所有權移轉登記時共同申報（§47Ⅱ），30日是預售屋（§47-3Ⅱ）的期限。","45日不是法定期限。"],"113-1":["每1年1戶不是法定限制。","每1年2戶不是法定限制。","經公告得讓與或轉售並經地方核准者，全國每2年以1戶（棟）為限（第47-4條）。","每2年3戶，戶數錯誤。"],"113-2":["已辦竣所有權移轉登記仍未申報登錄者，處3萬至15萬元罰鍰（第81-2條）。","6萬至30萬不是本情形的罰鍰。","15萬至50萬不是本情形的罰鍰。","30萬至100萬不是本情形的罰鍰。"],"113-3":["應檢具的是使用計畫，不是切結書。","私法人買受供住宅使用之房屋，由中央主管機關審核其使用計畫，以合議制方式辦理。","登記完畢後5年內不得預告登記或移轉，不是10年。","許可文件有效期限是1年（§79-1），不是2年。"],"100-12":["協議價購（土地徵收條例第11條）是徵收前的法定必要程序，需用土地人應先與所有權人協議，屬必要程序。","公聽會（土地徵收條例第10條）是需用土地人申請徵收前必須舉辦的法定程序，屬必要程序。","聽證（非公聽會）只有在特定農業區農牧用地遭徵收且所有權人有爭議時才需舉辦，一般徵收程序不需要舉行聽證會。公聽會是一般必要程序，聽證是特殊情形才需要，兩者不同，這是本題的核心陷阱。","說明會也是徵收程序的一環（對居民說明徵收計畫），屬必要程序。"],"100-14":["安置計畫妥善性屬事業計畫內容，並非同一土地多人申請時的核定原則。","申請單位屬中央或地方層級，不是核定先後的標準。","土地徵收條例第16條：同一土地有二以上需用土地人申請徵收時，以「興辦事業之性質輕重」為核定原則；國防、交通等重要性較高的事業優先。","事業規模大小不是標準，法定看的是興辦事業性質之輕重。"],"101-7":["土地徵收條例第15條：中央主管機關審議徵收案件，應遴聘（派）專家學者、民間團體及相關機關代表，以合議制方式辦理，其中「專家學者及民間團體代表不得少於二分之一」。1/2是法定最低比例，確保外部獨立性。","過高，非法定比例。","過高，非法定比例。","低於1/2，不符法定要求。"],"101-9":["公告現值加四成是舊制徵收補償標準，現行土地徵收條例協議價購不是以此為基準。","收益價格是估價方法之一，不是協議價購的法定價格基準。","土地徵收條例第11條：需用土地人申請徵收土地前，應與所有權人協議，協議之價格以「市場正常交易價格」為準。強調「正常交易價格」（非公告現值、非收益價格），確保補償合理。","毗鄰地的平均現值是公設保留地補償的方式，不是協議價購的法定基準。"],"102-2":["土地徵收條例第3條之2：需用土地人興辦事業徵收土地時，應依社會、經濟、文化及生態、永續發展及其他因素，評估有無公益性及必要性。注意：「地價因素」④不在法定評估因素之列，這是本題的核心陷阱——地價是徵收後補償的問題，不是判斷是否徵收的公益必要性評估因素。","含地價因素，但地價不在法定評估因素內。","含地價因素，不符法定規定。","含地價因素，且漏掉社會因素①。"],"103-15":["本選項為本題「何者為非」的答案。土地徵收條例規定，徵收應「優先使用公有土地」，再考慮私有土地；「避免使用公有土地」正好相反，是錯誤描述。「應優先使用公有土地→再使用私有土地」才是正確順序。","本選項描述正確，符合土地徵收條例規定，非錯誤。","本選項描述正確，徵收應避免歷史建築，非錯誤。","本選項描述正確，徵收應儘量避免耕地，非錯誤。"],"107-12":["特農農牧用地以國防所必須或經行政院核定之重大建設為例外，本項敘述正確。","本項敘述正確：土徵§3-1Ⅳ例外包括國防、交通、水利事業、公用事業供輸電線路使用所必須，或經行政院核定之重大建設所需者，「交通所必須」在例外內；本題唯一錯誤為D（應為聽證），官方答案無疑義。","特農有爭議時須依行政程序法舉行聽證，本項敘述正確。","本選項為錯誤敘述：特定農業區有爭議時，應舉行的是「聽證」（不是公聽會）。聽證與公聽會是不同的程序，聽證的正式程度更高、當事人參與權更完整。公聽會是一般徵收的程序，聽證是特農有爭議時的特別程序，本選項混淆兩者。"],"113-8":["特農須「有爭議」才依行政程序法舉行聽證，本項未提爭議要件，敘述不完整。","公聽會須在事業計畫報請目的事業主管機關許可「前」舉行，不是許可後。","土地徵收條例第11條第2項：依其他法律規定有優先購買權者，於協議價購時，「無優先購買權之適用」。例如，耕地承租人依耕地三七五減租條例有優先購買權，但在協議價購情形下不適用此優先購買權。","本項不完整：§11Ⅰ須所有權人拒絕參與協議或經開會未能達成協議「且無法以其他方式取得」者，始得申請徵收；本項漏此要件，故非正確答案。"],"114-3":["同107-12的考點：特定農業區農牧用地因行政院核定重大建設須辦理徵收，若土地所有權人對列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應依行政程序法舉行「聽證」（不是公聽會）。此考點在107和114年都考了，是D1的固定陷阱。","說明會是一般程序，不是有爭議時的救濟程序。","公聽會是一般徵收的法定程序（申請徵收前舉辦），不是特農有爭議時的特別程序。","陳述意見是行政處分前給予當事人的程序保障，不是本情形的特別程序。"],"99-18":["核准通知只是行政程序，所有權人的權利義務此時尚未終止。","補償發給完竣屆滿1年不是權利義務終止時點；收回權另依屆滿3年未使用等事由。","土地徵收條例第21條：被徵收土地所有權人之權利義務，於「應受補償費發給完竣時」終止。「應受」是關鍵字——即使當事人拒絕受領，存入保管專戶時也視同發給完竣，此時權利義務即告終止。","公告期滿代表徵收程序完成，但所有權人的權利義務要等到補償發給完竣才終止，兩個時點不同。"],"99-19":["市價是一般徵收補償的基準，不是徵用補償的計算方式。","公告土地現值是土增稅的計算基準（地價稅以申報地價為準），不是徵用使用補償費的計算方式。","公告現值加四成是舊制補償算法，並非徵用使用補償費的計算標準。","土地徵收條例第58條：因興辦臨時性公共建設工程而徵用土地，每年使用補償費按「公告土地現值的10%」計算。10%是徵用（臨時使用）的固定比例，與永久徵收的補償標準完全不同，是D2的數字考點。"],"99-21":["3年是收回權事由（補償完竣屆滿3年未開始使用），與專戶補償費歸國庫無關。","專戶補償費歸屬國庫的期限為15年，沒有9年的規定。","現行土地徵收條例§26規定為15年，不是10年。","土地徵收條例§26：自通知送達發生效力之日起逾15年未領取者，補償費歸屬國庫。存入專戶視同補償完竣，且不適用提存法。"],"100-11":["重置價格是將資產恢復到相同功能的現代成本，與重建價格略有不同；建築改良物徵收補償用「重建價格」，非「重置價格」。","土地徵收條例§31：建築改良物按徵收當時的「重建價格」估定。重建價格指重新建造同樣建物所需價格，不是重置價格或市價。","「重定價格」為虛構名詞，非法定用語。","「重購價格」為虛構名詞，非法定用語。"],"100-13":["本選項描述正確（重建價格），非錯誤。","本選項為錯誤敘述：農作改良物的補償費，依孳息成熟時期分兩種標準——距成熟不超過1年者按「成熟時之孳息」估定，超過1年者按「種植及培育費用並參酌現值」估定。並非一律「按成本」，本選項描述不完整且有誤。","依100年當時法規敘述正確（官方答案）。⚠️現行法：土徵§30已改按徵收當期「市價」補償，無公告現值加成。","依100年當時法規敘述正確。⚠️現行法：§30Ⅰ後段改為毗鄰非公共設施保留地之平均「市價」。"],"102-6":["農作物（農田種植的作物）是農作改良物的一種，屬之。","土地法§5Ⅱ：附著於土地之農作物及其他植物與水利土壤之改良，為農作改良物；「維護保育」是一種行為或目的，不是具體的農作改良物項目，故本選項「不屬之」。","水利土壤改良（如灌溉設施、土壤改良）屬農地改良的一種，屬農作改良物範疇，故屬之。","農作物以外的其他植物（如樹木、花草）也是農作改良物，屬之。"],"102-8":["公設保留地不是按一般「當期市價」，而是按毗鄰非公共設施保留地之平均市價。","公設保留地的基準是毗鄰非公共設施保留地之平均市價，不是公告現值加成。","基準是毗鄰「非」公共設施保留地，不是鄰近的公共設施用地。","公設保留地按毗鄰非公共設施保留地之平均市價補償（土地徵收條例§30Ⅰ後段：「在都市計畫區內之公共設施保留地，應按毗鄰非公共設施保留地之平均市價補償其地價」），與本題官方答案一致。注意：舊制為「平均公告土地現值＋加成（最高40%）」（見99-25），重點筆記若寫「平均公告土地現值」是舊制。"],"103-6":["頻率過高，不是法定要求。","每季（3個月）不是法定頻率。","土地徵收條例第30條第3項：各直轄市縣市主管機關應「每六個月」調查轄區地價動態，提交地價評議委員會評定被徵收土地市價變動幅度，作為調整補償地價依據。6個月（半年）是固定數字，不是每月也不是每年。","每年一次，頻率低於法定要求。"],"103-18":["現行土地徵收條例§30以徵收當期「市價」補償地價，並非「公告現值加成」。","同102-8，公設保留地按毗鄰非公設地平均市價補償，本選項正確。","建築改良物補償費應按「徵收當時」的重建價格，不是「起造當時」（起造時可能很久以前，已不符現值），此為重要陷阱。","本選項與正確規定相反：距孳息成熟不超過1年者，應按「成熟時之孳息」估定（非種植培育費用）；超過1年者才按「種植及培育費用」估定。本選項把兩種標準搞反了。"],"103-23":["墳墓及其他紀念物必須遷移者，屬土地徵收條例§5所列不一併徵收之例外，為官方答案。","依法令得建造的合法建物應一併徵收，例外限於依法令不得建造者。","土徵§5Ⅰ①的例外是自公告期滿之日起「15日」內自行遷移，本項寫30日故錯誤；官方答案A正確。","農作改良物的例外僅限種類或數量與正常種植情形不相當的「不相當部分」，不是全部。"],"104-9":["平均地權條例施行細則：市地重劃區內之土地改良物及墳墓拆遷補償費，係屬「重劃費用」的計算範圍（由全體參加重劃之土地所有人共同負擔），不是工程費用或整地費用。","工程費用是指公共設施興建的直接工程支出，補償費不屬此類。","整地費用是地形整理費，補償費不屬此類。","公共用地施工費用是公共設施建設費，補償費不屬此類。"],"104-12":["產業創新條例有其土地取得規定，但補償標準的優先適用法律是土地徵收條例。","平均地權條例涉及地價、地稅，不是土地徵收補償的優先適用法律。","土地法是土地制度的基本法，但徵收補償有專法（土地徵收條例）優先適用。","產業創新條例規定產業園區徵收私有土地，徵收補償依土地徵收條例規定辦理。土徵條例是徵收補償的一般性規範，故優先適用。"],"104-14":["1年不是地上權被徵收後土地所有人請求一併徵收所有權的期限。","5年不是正確期限。","此期限描述不符合法條規定，且起算點有誤。","土地徵收條例第57條：地上權因事業興辦致土地不能為相當使用時，土地所有人得「自施工之日起至完工後一年內」請求需用土地人徵收其土地所有權。「施工到完工後一年內」是法定請求期限。"],"104-15":["公告日只是徵收程序啟動，所有權尚未終止。","公告期滿是徵收確定，但所有權終止要等補償發給完竣。","同99-18，土地徵收條例第21條明文：權利義務於「應受補償費發給完竣時」終止。「應受」而非「實際受領」——拒絕受領而存入保管專戶亦視同發給完竣。","登記是所有權轉移的公示行為，但權利義務終止早於登記完成（補償發給完竣時即終止）。"],"105-13":["本選項描述正確：A地登記為甲，徵收補償發給給甲，乙（實際買受人）得依債權關係向甲請求讓與補償請求權（民法上的代位請求），非錯誤。","本選項描述正確：公同共有土地被徵收，補償金仍為公同共有，非錯誤。","本選項描述正確：補償金是土地的代位物，抵押權效力及於代位物，非錯誤。","本選項為錯誤敘述：依土地徵收條例第21條，所有權人的權利義務於「補償費發給完竣時」終止（即甲喪失所有權），而非等到登記完成時才喪失。甲喪失所有權的時點是補償完竣，不是登記完成。"],"105-36":["土地徵收的補償不只是地價，還包括地上物（建築改良物）補償、農作改良物補償、農業損失補償、遷移費等多項。","一般犧牲是指社會上人人均可能承受的負擔，徵收屬特別犧牲（針對特定人的財產）。","損害賠償是因違法行為造成損害的補償；徵收是合法行為（依法徵收），其補償性質是「損失補償」而非「損害賠償」。","土地徵收補償的性質是「損失補償」：國家合法（依法令）地侵害人民財產，對受到特別犧牲的人民予以補償，以填補其損失。這是行政法上的重要概念區分（損失補償≠損害賠償）。"],"105-40":["官方答案非本項，本項錯在「經甲同意即可轉租」。90年（89.1.4以後）訂立之農業用地租約，依農業發展條例§20Ⅰ不適用耕地三七五減租條例，本條例未規定者適用土地法、民法；而土地法§108：「承租人縱經出租人承諾，仍不得將耕地全部或一部轉租於他人。」故乙縱經甲同意亦不得轉租。","補償費存入保管專戶時視同補償完竣，所有權人權利義務即告終止。拒絕受領者亦同，不須等實際領取。","重劃致租約不能達目的時，由政府逕為註銷租約，承租人僅得請求補償，並無物權效力的先買權。","官方答案為B，本項判錯。已核平均地權§63Ⅰ：「出租之公、私有耕地因實施市地重劃致不能達到原租賃之目的者，由直轄市或縣（市）政府逕為註銷其租約並通知當事人」，條文未區分租約訂立時間，與本項文字相符。⚠️查不到本項被判錯的理由：考選部 105 年標準答案為 B，備註無更正，也未公布釋疑。作答以官方答案B為準。"],"107-14":["需用土地人是徵收的申請人，不是「一併徵收」的申請受理機關。","土地徵收條例第8條第1項：徵收土地之殘餘部分，若面積過小或形勢不整，所有權人得向「該管直轄市或縣（市）主管機關」申請一併徵收。地方主管機關（非中央機關）是申請一併徵收的受理機關。","內政部是中央主管機關，負責審議徵收案，但一併徵收的申請是向地方主管機關提出。","行政院是最高行政機關，不是一併徵收的申請受理機關。"],"109-9":["公設保留地劃設逾25年未取得者，是得優先辦理「交換」，不是辦理徵收。","補償基準是毗鄰「非」公共設施保留地，本項漏掉「非」字。","公共設施保留地臨時建築使用辦法由內政部訂定，不是縣市政府。","都市計畫法§51：公設保留地得繼續為原來之使用，或改為妨礙目的較輕之使用。不得為妨礙其指定目的之使用，是基本限制。"],"109-12":["土地徵收條例第31條：農作改良物補償費，與孳息成熟相距1年以內者，按「成熟時之孳息」估定；超過1年者按「種植及培育費用並參酌現值」估定。本選項正確描述了1年以內的計算方式。","當期市價的法定評定基準日不是公告期滿次日起第10日，本項日期有誤。","建築改良物補償費應按「徵收當時」的重建價格，不是「起造當時」，同103-18的常見陷阱。","應按「毗鄰非公共設施保留地」之市價，而非「毗鄰公共設施保留地」，同109-9的陷阱。"],"109-20":["非直接歸屬國庫，仍應依繼承法律關係處理。","補償費不歸入平均地權基金，而是依繼承關係由繼承人領取。","補償費不歸目的事業主管機關，目的事業主管機關只是興辦事業的主管，不是補償費的受益人。","土地徵收條例第25條第2項：被徵收土地之所有權人死亡未辦竣繼承登記，其徵收補償費得由部分繼承人按其「法定應繼分」領取，不需等全體繼承人辦完繼承登記才能領取，以保障繼承人的補償利益。"],"110-12":["5年過短，法定期限是自通知送達發生效力之日起15年。","10年不符，現行土地徵收條例§26規定為15年。","土地徵收條例§26：自通知送達發生效力之日起逾15年未領取，補償費歸屬國庫。","20年是原所有權人收回權的申請期限（自公告徵收之日起），與本題無關。"],"110-13":["市價是一般土地徵收的補償基準，不是建築改良物的估價方式。","重置價格與重建價格相近但有別；法條明文規定是「重建價格」。","同100-11，土地徵收條例第31條：建築改良物補償費按「重建價格」估定，不是重置、市價或房屋評定現值。","房屋評定現值是房屋稅的計稅基礎，不是徵收補償的估價標準。"],"112-13":["本選項描述有誤：保管補償費「不適用提存法」（土地徵收條例明文排除提存法之適用），而是依主管機關規定存入保管專戶，兩種程序不同。","應於補償費發給期限屆滿之「次日起」3個月內存入專戶，本項寫成「屆滿之日起」。","土地徵收條例第26條：補償費保管專戶應給付利息，利息歸應受領補償費之人所有，確保受補償人的財產價值不因存放而受損。本選項正確。","逾15年未領取才歸屬國庫，且起算點是通知送達發生效力之日，不是徵收公告期滿之日。"],"113-6":["公設保留地按「毗鄰非公共設施保留地之平均市價」補償，不是直接按徵收當期市價（計算基準不同）。","徵收補償地價由「地價評議委員會評定」，不是由不動產估價師個別評定。","應是「重建價格」，不是「重置價格」，同樣是本科的固定陷阱。","同109-12，距孳息成熟1年以內者按「成熟時之孳息」估定，本選項正確描述了農作改良物補償的規則。"],"113-7":["本項為錯誤敘述：專戶補償費逾期未領取歸屬國庫為「15年」（土徵條例§26），不是10年。其餘三項（3個月內存入、不適用提存法、視同補償完竣）皆正確。","本選項描述正確，3個月存入期限符合法條，非錯誤。","本選項描述正確，明文排除提存法之適用，非錯誤。","本選項描述正確，視同補償完竣是法條明文規定，非錯誤。"],"114-22":["土地法所稱農作改良物指「附著於土地之農作物及其他植物與水利土壤之改良」（土地法§5Ⅱ），重點是「附著於土地」。「置於農地上的盆栽」放在花盆裡，並未附著於土地本身，故不屬農作改良物。芒果樹、灌溉設施、施加的肥料都是附著或融入土地的，屬農作改良物；盆栽是可移動的，不屬之。","芒果樹附著於農地，屬農林作物類的農作改良物，屬之。","灌溉設施屬「水利土壤改良」類，屬農作改良物，屬之。","肥料施於土壤後融入土地成為改良物，屬農作改良物，屬之。"],"99-16":["新設都市地區開發建設，屬土地徵收條例§4所列得為區段徵收之情形。","舊都市地區為公共安全、衛生、交通或合理使用而更新，屬§4得為區段徵收之情形。","都市土地農業區、保護區變更為建築用地，或工業區變更為住宅區、商業區，屬§4情形。","都市土地閒置未開發利用，不在§4所列區段徵收事由內，故為本題答案。"],"99-25":["加成最高可達40%，10%不是法定上限。","加成最高可達40%，20%不是法定上限。","加成最高可達40%，30%不是法定上限。","公設保留地按毗鄰非公共設施保留地之平均公告土地現值補償，必要時加成，最高不超過40%。⚠️現行法：土徵條例§30已改按平均市價（見102-8），本題為舊制題目。"],"99-39":["新設都市地區開發建設，屬得為區段徵收之情形。","工業區變更為住宅區，屬§4所列得為區段徵收之情形。","住宅區變更為商業區，不在§4所列區段徵收事由內。§4僅列農業區、保護區變建築用地，或工業區變住宅、商業區。","農業區變更為建築用地，屬得為區段徵收之情形。"],"100-16":["平均地權條例§7只列照價收買、區段徵收、土地重劃取得之土地得隨時公開出售、不受土地法§25限制；一般徵收不在內，故仍受§25限制，官方答案正確（舊筆記A5有誤）。","區段徵收取得之土地得公開出售，不受土地法§25限制。","土地重劃取得之土地依平均地權條例§7得隨時公開出售，不受§25限制。","照價收買取得之土地得隨時公開出售，不受土地法§25限制。"],"100-18":["一般徵收是為興辦事業取得土地，不是平均地權條例所指得發行土地債券的情形。","市地重劃是重新分配土地而非取得土地。平均地權條例§5只列照價收買、區段徵收所需資金得發行土地債券，市地重劃不在內，官方答案正確（舊筆記C2有誤）。","權利變換是都市更新的資金籌措方式，不是平均地權條例規定的土地債券發行情形。","區段徵收所需資金，中央或直轄市主管機關得發行土地債券（平均地權條例）。區段徵收需先支付大量補償與開發費用，故設此籌資管道。"],"101-8":["公共衛生事業不在法定因公共安全急需得先行使用的例外範圍，仍須等補償發給完竣後才能進入。","環境保護事業不在例外範圍。","社會福利事業不在例外範圍（111-10也考過這個陷阱，社福不算）。","因公共安全急需先行使用者，限國防、交通、水利事業（土徵條例§27）。本項「交通及水利事業」屬其中兩種，其他選項皆不在例外內。"],"102-7":["原所有權人不願領現金補償者，應於徵收公告期間內，檢具證明文件以書面申請發給抵價地。公告期間為30日，逾期未申請即領現金補償。","補償發放時已過申請抵價地的截止期間，此時才申請已太晚。","分配公告是抵價地分配結果的公告，非申請發給抵價地的時機。","公聽會在徵收申請前舉行，此時尚未公告徵收，不是申請抵價地的時機。"],"102-17":["申報移轉現值是一般土地移轉的申報基礎，不是抵價地的特殊原地價基準。","被徵收土地的公告現值是現金補償的基礎，不是領回抵價地的原地價基準。","補償地價總額是現金補償金額，不是抵價地的原地價認定基準。","同104-34、106-4，抵價地第一次移轉的原地價以「實際領回抵價地之地價」為準，這是D3/E2最重要的固定答案。"],"102-24":["本選項描述正確，標售前應公告1個月，非錯誤。","本項錯誤：土徵§59只規定標售應公告1個月、原土地所有權人或其繼承人依同樣條件優先購買、區段徵收不適用，沒有原他項權利人申請恢復權利之規定；官方答案正確（舊筆記D4有誤）。","本選項描述正確，符合土地徵收條例第59條規定，非錯誤。","本選項描述正確，第59條優先購買權明文排除區段徵收之土地，非錯誤。"],"103-19":["本選項描述正確，50%是法定原則，非錯誤。","本選項描述正確，曾經農地重劃地區的抵價地比例不得低於45%，非錯誤。","本選項為錯誤敘述：正確規定是以「原土地所有權人實際領回抵價地之地價」為原地價，不是「徵收時原有土地之地價」（被徵收土地的地價）。這個考點在104-34、106-4、102-17都出現，答案固定是「實際領回抵價地之地價」。","本選項描述正確，抵價地第一次移轉減徵40%土地增值稅，非錯誤。"],"103-37":["區段徵收以現金補償者是「免徵」土增稅，不是「不課徵」。","土地稅法第28條之2：配偶相互贈與之土地，得申請「不課徵」土地增值稅（注意：是「不課徵」而非「免徵」，兩者性質不同——不課徵是暫緩、將來再課；免徵是永久不課）。本選項是本題「得申請不課徵」的正確答案。","領回抵價地不足最小建築單位面積而領取現金補償者，依平均地權條例§42-1是「免徵」土增稅，不是「不課徵」；官方答案B正確。","繼承移轉屬「免徵」土地增值稅（土地稅法第28條），不是「不課徵」。「不課徵」和「免徵」是不同概念，本題問的是「不課徵」。"],"104-13":["設定地上權或出租是法定的民間投資開發方式之一，屬之。","聯合開發或委託開發是法定的民間投資開發方式之一，屬之。","信託或合作經營是法定的民間投資開發方式之一，屬之。","土地徵收條例第56條規定的提供民間投資建設方式包括：設定地上權或出租、聯合開發或委託開發、信託或合作經營；「調整地形或整體開發」不在法定列舉的提供民間投資方式內（這是政府自行開發的規劃手段，不是提供民間的投資方式）。"],"104-16":["「配合區域整體發展」雖是開發目的，但不是土地徵收條例第4條列舉的法定區段徵收事由，屬太籠統的描述。","農地再生產不是區段徵收的法定事由，區段徵收是整體開發手段，不是農業促進工具。","非都市土地實施開發建設，屬土地徵收條例§4所列得為區段徵收之情形。注意非都市土地也可區段徵收，不限於都市土地。","原住民聚落更新不是土地徵收條例第4條列舉的法定區段徵收事由（農村社區更新才是法定事由，且需「加強公共設施、改善公共衛生或配合農業發展」）。"],"104-17":["安置原住戶所需土地得以讓售，屬法定可讓售的情形。","抵價地是發交給原土地所有人的回饋地，不在「得以讓售」的清單內（抵價地是義務返還給原所有人，不由政府讓售）。本題問「不屬得以讓售者」，答案是抵價地（B）。","國民住宅用地得以讓售，屬法定可讓售的情形。","經行政院專案核准之用地得以讓售，屬法定可讓售的情形。"],"104-18":["抵價地總面積以徵收總面積50%為原則（土地徵收條例）。特殊情形經上級核准不得少於40%，曾農地重劃者不得少於45%。","上級核准是「例外調整」的條件，不是「原則」，原則是50%。","40%是「下限」（情況特殊時的最低底線），不是「原則」。","農地重劃地區的規定是「不得少於45%」（下限），不是「以45%為原則」，且這只是農地重劃地區的特殊規定，不是一般原則。"],"104-34":["開發成本不是法定的抵價地原地價認定基準。","移轉時的申報現值是一般土地移轉的申報基礎，不是抵價地的特殊原地價認定方式。","原規定地價是規定地價時的地價，不是抵價地的原地價。","領回抵價地後第一次移轉，計算漲價總數額之原地價，以「實際領回抵價地之地價」為準。此為區段徵收與土增稅交叉的固定考點。"],"105-8":["本選項描述正確，以現金補償者免徵土增稅（土地稅法第39條），非錯誤。","本選項為錯誤敘述：領回抵價地後第一次移轉，土地增值稅「減徵40%」（不是免徵）。「以現金補償者免徵」vs「以抵價地補償者第一次移轉減徵40%」是D3/E2最重要的稅務對比，務必區分。","本選項描述正確：領取抵價地時（尚未移轉）免徵土地增值稅，第一次移轉時才減徵40%。本選項說的是「補償時」免徵，是正確的（移轉前不課稅）。","本選項描述正確，區段徵收完成後地價稅減半2年，非錯誤。"],"106-2":["同104-18，抵價地總面積以徵收總面積50%為原則，是D3最基本也最常考的數字。","45%是農地重劃地區的下限，不是一般原則比例。","40%是情況特殊時的最低下限，不是一般原則比例。","30%低於法定最低下限，不符規定。"],"106-4":["移轉登記日的公告現值是計算漲價總數額的「移轉現值」（分子），不是「原地價」（分母）。","此選項混淆了一般土地的原地價（前次移轉申報現值）和抵價地的特殊原地價認定方式。","同104-34，領回抵價地的地價是計算漲價總數額的「原地價」基準。","補償地價總額是被徵收土地的現金補償金額，與抵價地的地價認定無關。"],"107-15":["申請發給抵價地只是程序開始，權利義務尚未終止。","土徵§40Ⅲ：申請發給抵價地者，對其被徵收土地之權利義務，於接到該管主管機關核定發給抵價地通知時終止；官方答案正確（舊筆記D3「點交接管時」有誤）。","登記為申請人所有是之後的程序，權利義務終止早於登記。","點交接管晚於核定通知；依§40Ⅲ，終止點在核定通知時，非點交時。"],"108-23":["43%不是任何法定的抵價地比例。","抵價地以徵收總面積50%為原則，特殊情形經核准不得少於40%。曾經農地重劃者，該重劃地區部分不得少於45%。","47%不是法定比例。","49%不是法定比例。"],"110-20":["各級政府出售之公有土地，核定移轉現值以實際出售價額為準。此為免徵土增稅土地之移轉現值核定規定。","政府贈與或受贈之土地，移轉現值不是以「土地點交日」公告現值核定。","區段徵收抵價地的移轉現值，不是以「測量登記完竣之地價」核定。","私人捐贈供社福事業之土地，移轉現值不是以「事業核准日」公告現值核定。"],"111-9":["都市計畫法第48條：供公用事業設施使用的公設保留地，除各該事業機構依法徵收或購買外，其餘由政府或公所依「徵收、區段徵收或市地重劃」方式取得。三種方式為一組，本選項正確。","協議價購是徵收前的程序，公私土地交換（第50條之1）是私有公設保留地的另一種取得方式，但都市更新不在法定的政府取得方式清單內。","都市更新不是都市計畫法第48條規定的政府取得公設保留地方式。","協議價購不是政府主動取得的方式之一（協議價購是徵收前的準備程序），公私土地交換是私人申請的程序。"],"111-10":["平價住宅事業不在法定三種例外事業中，此選項混入了不在清單的事業。","社會福利事業不在法定三種例外事業中（這是本考點最常見的干擾選項）。","此三種均不在法定例外事業清單中，為完全干擾選項。","同101-8，法定可因公共安全急需先行使用的例外三種事業為「國防、交通、水利」，缺一不可，其他事業（社福、環保、衛生等）均不在此例外範圍內。"],"111-17":["本選項描述正確，抵價地發還給原所有人，非錯誤。","本選項描述正確，國民住宅用地可讓售，非錯誤。","本選項描述正確，安置原住戶用地可讓售，非錯誤。","本項為錯誤敘述：區段徵收後可供建築土地標租，期限不得逾99年，不是25年。113-18也以99年為正確答案。"],"113-18":["本選項有誤：「抵費地」（抵充費用的土地，政府保留部分）是標售給外人的，不是「發交被徵收土地所有權人領回」；「抵價地」才是發還給原所有人的。兩者名稱相似但完全不同。","本項錯誤：土徵§44無償登記清單為道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所及國民學校用地，不含零售市場（零售市場屬其他公共設施用地，得有償或無償撥供需地機關或讓售公營事業）。","同111-17，標租期限是99年，本選項正確。","安置原住戶土地是以「讓售」（不是標售）方式處理，讓售是政府同意讓特定對象買入，標售是公開競標，兩者不同。"],"114-9":["40%是一般情形（情況特殊時）的下限，不是農地重劃地區的規定。","同108-23，農地重劃地區的抵價地下限是45%（高於一般下限40%）。45%是本考點的固定答案，在108年和114年都考過。","50%是一般原則（非下限），農地重劃地區適用特殊的45%下限。","55%高於原則比例（50%），不是任何情況的法定比例。"],"114-23":["舊都市地區更新是法定區段徵收事由之一，屬之。","非都市土地開發建設是法定區段徵收事由，屬之（同104-16）。","「興辦國營事業或公安事業」不在土徵條例§4所列區段徵收事由內。區段徵收限於新設都市、都市更新、非都市開發、農村社區更新等整體開發情形。","農村社區更新是法定區段徵收事由之一，屬之。"],"99-28":["本選項描述正確，補償完竣3年未開始使用是收回權的法定事由之一，非錯誤。","本選項描述正確，未依原定事業使用也是收回權的法定事由，非錯誤。","本選項為錯誤敘述：監察院糾正是監察權的行使，不是土地徵收條例規定的收回權法定事由。收回權的三種法定事由：①補償完竣3年未開始使用②未依核准事業使用③開始使用後未滿5年不繼續使用。「監察院糾正」不在這三種之列。","本選項描述正確，使用後未滿5年中斷是收回權的法定事由，非錯誤。"],"102-35":["起算點說法有誤：應從「徵收公告之日」起算，不是從「補償費發給完竣之日」起算。","土地徵收條例第9條第1項：原土地所有權人得於徵收「公告之日起20年內」申請收回。注意起算點是「公告之日」（不是補償完竣日），且20年是最長期限（在此期限內，只要觸發收回事由就可申請）。","起算點說法有誤，應從徵收公告之日起算，不是從「未使用屆滿三年之日」起算。","領取補償費日不是收回權的起算點，起算點是徵收公告之日。"],"103-7":["土地徵收條例第49條（撤銷徵收）：已公告徵收之土地，有下列情形應辦理「撤銷徵收」：①因「作業錯誤」致原徵收土地不在工程用地範圍內②公告徵收時都市計畫已規定以聯合開發等方式開發（但所有權人不願參與者除外）。注意：作業錯誤→撤銷徵收；工程變更→廢止徵收。兩者常被混淆。","工程變更設計不是撤銷徵收的法定事由；撤銷事由限作業錯誤與都市計畫已定開發方式。","本選項描述的是「廢止徵收」（在開始使用前的情事變更），不是撤銷徵收。","本選項描述的是「廢止徵收」（已開始使用後的情事變更），不是撤銷徵收。"],"103-8":["法定標準是「屆滿3年」未開始使用，不是1年，數字錯誤。","法定標準是「屆滿3年」，2年也不符合。","土地徵收條例第9條第1項第3款：依原徵收計畫開始使用後「未滿5年」，不繼續依原徵收計畫使用者，原所有人得申請收回。5年是法定期間，不是3年也不是10年。","法定標準是「未滿5年」，10年錯誤。"],"106-22":["法定標準是「3年」，2年未達門檻，不構成收回事由。","此為一併徵收的申請事由（第8條），不是收回權的事由。","土地徵收條例第9條第1項第2款：「未依核准徵收原定興辦事業使用」是收回權的法定事由之一，與第3款（使用後未滿5年中斷）和第1款（3年未開始使用）並列。本選項正確描述了其中一種收回事由。","法定標準是「未滿5年」，6年超過5年（已超過保護期），不構成收回事由。"],"106-23":["工程變更設計不是撤銷徵收的法定事由；撤銷事由限作業錯誤與都市計畫已定開發方式。","土地徵收條例第49條（撤銷徵收）：公告徵收時，都市計畫已規定以聯合開發或市地重劃方式開發者，應辦理撤銷徵收（因有更好的方式可達成目的，不需徵收）。但以聯合開發方式，若所有權人不願參與者，仍可維持徵收（不撤銷）。","使用前事業改變是「廢止徵收」，不是撤銷徵收。","已開始使用後的情事變更是「廢止徵收」，不是撤銷徵收。"],"107-13":["土徵§58Ⅰ為興辦「臨時性」公共建設工程得徵用，不是「繼續性」，本項錯誤。","現行土徵§58Ⅱ為徵用期間逾「3年」或二次以上合計逾3年者，需用土地人應於申請徵用前書面通知；本項寫6年，錯誤。","徵用期間逾3年（§58Ⅱ），需用土地人書面通知後，所有權人於收到通知30日內得請求徵收所有權。","土徵§58：因徵用而請求徵收所有權者，不得再依第9條申請收回其土地或土地改良物，本項錯誤。"],"108-17":["工程變更設計不是撤銷徵收的法定事由；撤銷事由限作業錯誤與都市計畫已定開發方式。","開始使用前的情事變更（事業改變等）是「廢止徵收」，不是撤銷徵收。","同106-23，公告徵收時都市計畫已規定以市地重劃（或聯合開發等）方式開發者，應辦理「撤銷徵收」。本選項正確，為本題「應辦理撤銷徵收」的情形。","已開始使用後情事變更是「廢止徵收」，不是撤銷徵收。"],"109-11":["本選項描述正確，「開始使用後未滿5年中斷」是收回權的法定事由之一，非錯誤。","本項錯誤：土徵§9Ⅱ為通知後「6個月」內繳還原受領之補償地價及地價加成補償，不是3個月；官方答案正確（舊筆記D4有誤）。","本選項描述正確，地方主管機關受理收回申請，非錯誤。","本選項描述正確，補償完竣3年未開始使用是收回事由，非錯誤。"],"111-11":["本項錯誤：土徵§52本文，撤銷或廢止徵收後，徵收前原設定之他項權利及耕地租約「不予回復」。","本項錯誤：§52但書，依第42條申請於發給之抵價地設定抵押權或典權者，其原抵押權或典權「准予回復」，不是不予回復。","土地徵收條例第49條、第50條：撤銷或廢止徵收，均由「需用土地人」向「中央主管機關（內政部）」申請。本選項正確描述了申請主體（需用土地人，不是地方政府）和受理機關（中央，不是地方）。","申請主體是「需用土地人」，不是「直轄市或縣（市）主管機關」，本選項的申請主體說法錯誤。"],"111-19":["廢止徵收（第50條）是針對使用前/後的情事變更（事業改變、無必要等），不是作業錯誤。","同103-7，因「作業錯誤」致徵收土地不在工程用地範圍內者，應辦理「撤銷徵收」（第49條）。作業錯誤→撤銷是D4的固定規則。","徵收收回（收回權）是已完成徵收後，因未依計畫使用所觸發的救濟，不是針對作業錯誤的處理。","徵收失效是補償費逾期未發給的效果（第20條），不是作業錯誤的處理方式。"],"111-21":["逾期未發給補償費，法律效果是徵收失效，不是繼續有效。","土地徵收條例第20條：需用土地人應於公告期滿後15日內將補償費繳交地方主管機關發給完竣，逾期未繳者，「該部分土地之徵收從此失其效力」（即徵收失效）。這是為保障被徵收人在合理期間內獲得補償的制度設計。","補償逾期是「法律上自動失效」（徵收失效），不是所有權人申請撤銷徵收的程序（撤銷徵收是需用土地人申請的程序）。","不存在「保留徵收」的法律制度，為虛構選項。"],"112-14":["撤銷徵收（第49條）是針對公告徵收前就有問題（作業錯誤、都市計畫已規定其他方式開發），不是使用前事業改變的情形。","土地徵收條例第50條（廢止徵收）：依徵收計畫「開始使用前」，有下列情形之一，需用土地人應辦理廢止徵收：①興辦之事業改變②計畫經註銷③開發方式改變④取得方式改變。「興辦之事業改變」正是廢止徵收的法定事由。","收回權（第9條）是在補償完竣後一定期間內未依計畫使用時才能行使，不是使用前事業改變的救濟手段。","聽證是特農有爭議時的特別程序，不是處理廢止徵收事由的方式。"],"113-5":["本選項描述正確（需用土地人申請，向中央申請），非錯誤。","本選項為本題「錯誤」的答案：土地徵收條例規定，未依計畫完成使用前，需用土地人每年應檢討計畫，並由其「上級事業主管機關」（不是「直轄市或縣市政府」）列管。地方政府不是列管機關，上級事業主管機關才是，本選項的列管機關說法錯誤。","本選項描述正確（開始使用前開發方式改變→廢止徵收），非錯誤。","本選項描述正確（作業錯誤→撤銷徵收），非錯誤。"],"99-29":["本題問「何者錯誤」。土地稅法第3條：設有典權土地，地價稅納稅義務人為「典權人」（非出典人）。典權人取得使用收益權，故由其負擔地價稅，本選項說出典人是錯誤的，為本題答案。","本選項描述正確，承領土地的納稅義務人是承領人，非錯誤。","本選項描述正確，承墾土地的納稅義務人是耕作權人，非錯誤。","本選項描述正確，一般土地以所有權人為納稅義務人，這是最基本原則，非錯誤。"],"100-2":["私立動物園用地屬供事業直接使用之土地，可適用千分之十的優惠稅率。","農會辦公廳是農會的行政辦公場所，不屬於土地稅法規定可申請優惠稅率（如自用住宅、勞工宿舍、工業用地、私立動物園等）的法定類型，故不得申請優惠稅率課徵地價稅。","國民住宅用地可適用千分之二的優惠稅率，屬於得申請優惠稅率的類型。","企業或公營事業興建之勞工宿舍用地可適用千分之二優惠稅率，屬於得申請優惠稅率的類型。"],"100-3":["土地所有權人是地價稅最基本的納稅義務人，屬於法定納稅義務人。","抵押權人不在土地稅法第3條規定的納稅義務人清單內。抵押權是擔保物權，抵押權人不使用收益土地，故不負擔地價稅；地價稅仍由土地所有權人（設定抵押權的債務人）繳納。本選項「抵押權人」是虛構的納稅義務人類型，為本題正確答案。","設有典權土地，典權人是法定納稅義務人（因典權人使用收益土地），屬之。","承領土地的納稅義務人是承領人，屬法定納稅義務人。"],"100-24":["本選項描述正確，公設保留地不得為妨礙指定目的之使用，符合都市計畫法規定，非有誤。","本選項描述正確，公設保留地未取得前得申請臨時建築使用，非有誤。","本項有誤：公設保留地保留期間仍為建築使用者，除自用住宅用地外統按6‰計徵（土稅法§19），不是基本稅率；官方答案正確（舊筆記B2/E1有誤）。","本選項描述正確，與使用中土地隔離且未作使用的公設保留地免徵地價稅，非有誤。"],"101-23":["此敘述正確：都市土地指依法發布都市計畫範圍內之土地，其餘為非都市土地。","此敘述正確：自用住宅用地指所有權人或其配偶、直系親屬辦竣戶籍，且無出租或營業（土稅法§9）。","此敘述正確：工業用地指依法核定之工業區土地及政府核准工業或工廠使用之土地。","（本題問錯誤者）公告現值是依平均地權條例公告之「土地現值」，不是公告地價；公告地價係課地價稅依據。"],"101-24":["信託利益之受益人為委託人者，該土地應與委託人在同一直轄市或縣（市）之土地合併計算地價總額（土稅法§3-1）。此舉防止藉信託分散土地規避累進稅率。","信託存續中受託人雖為納稅義務人，但合併計算的對象是委託人，不是受託人。","法條明定與「委託人」之土地合併，不是與受益人合併。","法條沒有「由受託人與受益人推派一人」的合併計算規定。"],"101-26":["本項有誤：公有土地供公共使用者是免徵地價稅（土稅法§20），不是課10‰。","基本稅率為千分之十，等於1%，本項敘述正確。","本選項描述正確，自用住宅用地優惠稅率為2‰，非錯誤。","本選項描述正確，符合地價稅累進稅率第二級規定，非錯誤。"],"102-16":["土地稅法第17條第2項：國民住宅、企業或公營事業興建之勞工宿舍用地，自動工興建或取得土地所有權之日起，按「千分之二」優惠稅率計徵地價稅。2‰與自用住宅用地稅率相同，是對勞工居住權益的保障性規定。","10‰是基本稅率，不是勞工宿舍用地的優惠稅率。","6‰不是法定的勞工宿舍優惠稅率。","15‰是累進稅率第二級，不是優惠稅率。"],"102-18":["2‰是自用住宅等的優惠稅率，不適用於未作使用且隔離的公設保留地。","6‰是公設保留地「仍為建築使用」的稅率，本題未作使用且隔離，應免徵。","公設保留地未作任何使用並與使用中土地隔離者，免徵地價稅（土稅法§19）。仍為建築使用者（自用住宅除外）才統按6‰計徵。","減半徵收不是公設保留地未作使用情形的處理方式，正確是免徵（全免，不是減半）。"],"102-23":["35‰是超過10倍至15倍的稅率，不是5倍至10倍的稅率。","45‰是超過15倍至20倍的稅率。","地價稅累進稅率第三級：超過累進起點地價5倍至10倍者，就超過部分課徵「25‰」。這是最常見的數字陷阱——很多人誤以為應該是20‰（按等差5‰遞增），但實際上第一級到第二級是+5‰（10→15），第二級到第三級卻是+10‰（15→25），之後每級距固定+10‰（25→35→45→55）。","15‰是超過起點未達5倍的稅率（第二級），不是5至10倍的稅率。"],"102-26":["自用住宅用地指所有權人或其配偶、直系親屬辦竣戶籍，且無出租或供營業用之住宅用地（土稅法§9）。","兄弟為旁系血親，不是直系親屬，不符§9規定。","旁系親屬不在§9範圍；限於所有權人、配偶及直系親屬。","配偶之姊妹是姻親兼旁系，不是直系親屬，不符§9規定。"],"102-40":["電信不在法定四項公共設施清單內，正確是電力，非電信。","焚化設施不在法定四項清單內，且缺少道路。","電信和焚化設施都不在法定清單內，且缺少道路和自來水。","土地稅法施行細則所稱「公共設施尚未完竣前」的公共設施，係指「道路、自來水、排水系統、電力」四項基礎建設。這四項是判斷田賦或地價稅課徵與否的重要基準（公共設施未完竣前仍課徵田賦）。"],"103-12":["B地信託後，信託存續中以受託人乙為地價稅納稅義務人（土稅法§3-1）。受益人為委託人故合併計算90萬，仍未達100萬起點，甲只繳A地50萬×10‰＝5,000元。","9,000元是把A、B兩地稅額都算給甲；B地稅額應由受託人乙繳納。","4,000元是B地（40萬×10‰）的稅額，應由受託人乙繳納，不是甲。","3,000元與A、B兩地任何一筆的稅額計算都不相符。"],"103-13":["土地稅法第18條：工業用地、礦業用地、私立公園動物園體育場等供事業直接使用之用地，按「千分之十（10‰）」計徵地價稅，且「不適用累進稅率」（固定稅率，不論面積大小都是10‰）。本選項正確描述了工業用地稅制的兩個關鍵：稅率10‰、不累進。","官方答案為A，本項判錯：私有古蹟所定著之土地免徵地價稅，但歷史建築依文化資產保存法屬「得減徵」而非免徵（103年當時規定），故「古蹟及歷史建築」一併寫免徵有誤。⚠️現行法已改：文資法§99（112.11.29 修正）Ⅰ「古蹟、考古遺址、歷史建築、紀念建築及其所定著之土地，免徵房屋稅及地價稅。」Ⅱ 聚落建築群、史蹟、文化景觀及其所定著之土地，得在50%範圍內減徵。依現行法，歷史建築用地也免徵，本項今日為正確敘述；103 年官方答案依舊法。","勞工宿舍用地是按「千分之二（2‰）優惠稅率」計徵，不是「免徵」，本選項描述錯誤。","公設保留地保留期間仍為建築使用者，除自用住宅外統按6‰計徵，不是10‰。"],"103-14":["1,600元是80萬×2‰，須符合自用住宅要件才能適用，本題土地上無建物不符。","土地上沒有建物，不符自用住宅用地要件，不能適用2‰優惠稅率。80萬元未超過累進起點100萬元，按基本稅率10‰計算為8,000元。","3,200元不對應基本稅率10‰或優惠稅率2‰的任何計算結果。","4,000元也不對應任何法定稅率的計算結果。"],"103-22":["A地有自用住宅使用，不屬免徵情形，仍須課稅，不可能全部免繳。","A地為公設保留地供自用住宅，適用2‰優惠稅率。未申報地價以公告地價80%計：400萬×80%＝320萬，×2‰＝6,400元；B地未使用且隔離，免徵。","8,000元是以公告地價400萬直接×2‰，漏算未申報時的80%。","3,200元與A、B兩地任何正確計算都不相符。"],"103-24":["公共設施已完竣的都市土地，即使仍作農業使用，原則上應改課地價稅（非田賦），因為公共設施完竣代表該地已具備建築發展條件。","土地稅法第22條：都市土地合於下列規定者徵收田賦：依法限制建築，仍作農業用地使用者；依法不能建築使用，仍作農業用地使用者；公共設施尚未完竣前，仍作農業用地使用者；依都市計畫編為公共設施保留地，仍作農業用地使用者。本選項「依法限制建築或不能建築」是徵收田賦（而非地價稅）的法定情形之一。","都市計畫農業區、保護區「使用」不是徵收田賦的完整要件，需「仍作農業用地使用」且符合其他條件（限制建築等），單純劃定為農業區保護區不等於課田賦。","公設保留地若仍作農業使用才課田賦，「所有土地使用者」的描述過於籠統，不夠精確（且公設保留地若有其他使用如臨時建築，則不適用田賦）。"],"103-27":["工業用地是按10‰計徵的供事業直接使用土地之一，屬之。","土地稅法第18條「供事業直接使用，按10‰計徵」的清單包括：工業用地、礦業用地、私立公園、動物園、體育場等，但「不包括農業用地」。農業用地另有專屬的田賦或農地地價稅優惠規定，不適用10‰供事業使用的條款。","礦業用地是按10‰計徵的供事業直接使用土地之一，屬之。","私立動物園是按10‰計徵的供事業直接使用土地之一，屬之。"],"103-33":["地價稅累進稅率第二級：超過起點未達5倍，課徵15‰。本選項正確描述了第二級稅率。","5至10倍的稅率是25‰（不是20‰），這是最常見的混淆陷阱，因為直覺上會以為每級遞增5‰，但實際上第二到第三級是遞增10‰。","25‰是5至10倍的稅率，10至15倍應為35‰，本選項數字錯位。","30‰不是任何級距的法定稅率，且「十五倍以上」應再分15-20倍（45‰）和20倍以上（55‰）兩級，本選項描述籠統且數字錯誤。"],"104-31":["法定申請期限是開徵40日前，8月31日不是。","法定申請期限是開徵40日前，9月30日不是。","工業用地申請按10‰計徵地價稅，應於「每年（期）地價稅開徵四十日前」提出申請，逾期申請者自次年期才開始適用。40日是本題的固定數字考點。","法定申請期限是開徵40日前，不是60日前。"],"105-3":["公有土地供公共使用者免徵地價稅（土稅法§20），不是按2‰課徵。故不適用2‰特別稅率，為本題答案。","國民住宅用地適用2‰特別稅率，屬於適用範圍。","自用住宅用地是2‰特別稅率最典型的適用對象，屬於適用範圍。","公設保留地若同時符合自用住宅要件，仍可適用2‰特別稅率（除外規定），屬於適用範圍。"],"105-7":["5公畝不是法定數字，正確是7公畝。","公頃（100倍於公畝）的單位錯誤，正確單位是公畝，不是公頃。","累進起點地價以扣除工業、礦業、農業用地及免稅土地後「7公畝」之平均地價為準（土稅法§16）。注意單位是公畝，不是公頃。","5公頃既數字錯誤又單位錯誤，雙重不符。"],"106-18":["地價稅以每年8月31日的土地所有權人為納稅義務人。10月1日才移轉登記給乙，106年期仍由甲繳納，乙自107年期起負擔。","乙是10月1日後才取得所有權，已過該年度地價稅的納稅義務基準日，故106年期地價稅不由乙負擔。","地價稅的納稅義務人是依法定基準日認定，不是由雙方協議決定。","地價稅不是按持有月數比例分擔，地價稅是以基準日認定整年度的納稅義務人，非比例分擔。"],"106-34":["本選項描述正確，2‰是自用住宅用地的法定優惠稅率，非錯誤。","本選項描述正確，停車場用地按10‰計徵，符合法定規定，非錯誤。","本選項描述正確，公有非公用土地按基本稅率10‰課徵（區別於公有「供公共使用」土地是免徵），非錯誤。","本項有誤：公設保留地保留期間仍為建築使用者，統按6‰計徵（土稅法§19），不是10‰。"],"107-19":["本選項描述正確，承領人是法定納稅義務人，非錯誤。","本選項描述正確，耕作權人是法定納稅義務人，非錯誤。","本選項為錯誤敘述：土地稅法第3條規定的「納稅義務人」是所有權人、典權人、承領人、耕作權人、受託人這幾種固定身分；「土地使用人」是在權屬不明等特殊情形下被「指定代繳」的人，屬於土地稅法第4條的「代繳義務人」，不是第3條規定的「納稅義務人」。本選項混淆了「納稅義務人」與「代繳義務人」兩個不同概念，為本題答案。","本選項描述正確，典權人是法定納稅義務人，非錯誤。"],"107-20":["一般情形委託人不是地價稅納稅義務人（除非是「受益人為委託人」的特殊情形，此時是合併計算地價總額的對象，但納稅義務人本身仍是受託人）。","土地稅法第3條之1：土地為信託財產者，於信託關係存續中，以「受託人」為地價稅或田賦之納稅義務人。受託人是信託財產的名義持有人，負責土地的管理使用，故由其負擔地價稅。","受益人享有信託利益，但不是地價稅的法定納稅義務人，除非受益人同時為委託人時才有合併計算地價總額的特殊處理（但仍非「納稅義務人」本身）。","信託監察人是監督信託執行的角色，不是地價稅納稅義務人。"],"107-22":["本選項為錯誤敘述：自用住宅用地的要件是「辦竣戶籍登記」，法條並未要求「有居住事實」；本選項多加了法條沒有的要件，為本題錯誤答案。","本選項描述正確，無出租無營業是法定要件之一，非錯誤。","本選項描述正確，3公畝/7公畝是法定面積上限，非錯誤。","本選項描述正確，建物所有權須屬本人配偶或直系親屬，符合法定要件，非錯誤。"],"108-7":["未達5倍應課徵15‰，不是30‰，數字錯誤。","5至10倍應課徵25‰，不是35‰，數字錯位。","10至15倍應課徵35‰，不是40‰，數字錯誤。","地價稅累進稅率第五級：超過15倍至20倍，課徵45‰。本選項正確對應到此級距的稅率，這六級稅率分別是：10‰（基本）、15‰、25‰、35‰、45‰、55‰，依序遞增5‰、10‰、10‰、10‰、10‰。"],"108-11":["本選項描述正確，受託人是信託土地的法定納稅義務人，非錯誤。","本選項為錯誤敘述：設有典權土地的納稅義務人是「典權人」（非出典人），這是E1最常考的固定陷阱，與99-29考點相同。","本選項描述正確，承領人是法定納稅義務人，非錯誤。","本選項描述正確，耕作權人是法定納稅義務人，非錯誤。"],"109-4":["本選項描述正確，停車場用地按10‰計徵，非錯誤。","本選項為錯誤敘述：私立公園、體育場所等供事業直接使用之土地，是按「千分之十（10‰）」計徵（屬土地稅法第18條清單），不是「免徵」。本選項把10‰課徵誤植為免徵，為本題答案。","本選項描述正確：公有非公用土地按基本稅率課徵，公有供公共使用土地免徵，這是正確的對比描述，非錯誤。","公設保留地保留期間仍為建築使用者，除自用住宅外統按6‰計徵，本項正確。"],"110-7":["延期繳納最長可至6個月，3個月短於法定上限。","平均地權條例規定：應納地價稅額因公告地價調整致納稅義務人繳納困難者，得申請延期繳納，延期繳納期間最長不得逾「6個月」。半年是法定上限，是E1的固定數字考點。","延期上限為6個月，1年超過法定期間。","3年遠超過6個月的法定上限。"],"112-1":["同102-18，都市計畫公共設施保留地，未作任何使用並與使用中之土地隔離者，免徵地價稅，這是土地稅法第19條的明文規定，是E1高頻考點之一。","6‰是保留期間「仍為建築使用」者的稅率，未作使用且隔離者免徵。","10‰是一般基本稅率；仍為建築使用者是6‰，未作使用且隔離者免徵。","2‰是自用住宅用地的優惠稅率，不適用於未作任何使用的公設保留地。"],"112-5":["本選項描述正確，10‰是基本稅率，非錯誤。","本選項描述正確，未超過起點按基本稅率10‰課徵，非錯誤。","本選項為錯誤敘述：超過起點「五倍者」課徵的稅率是「千分之二十五（25‰，第三級）」，不是「千分之十五（15‰）」——15‰是「未達5倍」的稅率，恰好滿5倍時應適用更高一級的25‰。注意臨界點的歸屬：「未達5倍」屬第二級（15‰），「滿5倍至10倍」屬第三級（25‰）。本選項把「超過5倍者」錯誤地歸入第二級稅率，為本題答案。","本選項描述正確，15至20倍課徵45‰，非錯誤。"],"112-24":["土稅法§4：指定土地使用人代繳的事由為權屬不明、納稅義務人行蹤不明、無人管理，或所有權人申請由占有人代繳。「土地在訴訟中」不在其內，故為答案。","本選項是土地稅法第4條規定的指定代繳事由之一，屬之。","本選項是法定指定代繳事由之一，屬之。","本選項是法定指定代繳事由之一，屬之。"],"114-4":["百分之十（10%）並非地價稅基本稅率的正確表示方式，地價稅率慣用「千分之」表示，百分之十相當於100‰，數值錯誤。","百分之五（5%＝50‰）數值過高，不是基本稅率。","土地稅法第16條：地價稅基本稅率為「千分之十（10‰）」，這是最基礎的數字，也是E1反覆出現的核心考點，未超過累進起點地價者，均按此基本稅率課徵。","千分之十五是累進稅率第二級（超過起點未達5倍），不是基本稅率。"],"114-24":["自用住宅都市土地優惠面積為3公畝，不是5公畝（土稅法§17）。","非都市土地優惠面積為7公畝，不是10公畝。","國民住宅及企業、公營事業興建之勞工宿舍，自動工或取得土地之日起其用地地價稅按2‰（土稅法§17Ⅱ）。","自用住宅稅率之適用是「以一處為限」，不是「一次為限」。"],"114-25":["保留期間仍建築使用者，除自用住宅2‰外統按6‰，不是10‰（土稅法§19）。","公設保留地未作任何使用並與使用中土地隔離者，免徵地價稅（土稅法§19）。","公設保留地未徵收前之移轉是「免徵」土增稅，不是減半。","因繼承或配偶、直系血親間贈與而移轉，是「免徵」遺產稅或贈與稅，不是減半。"],"99-20":["信託土地在受託人有償移轉時，不是免徵，而是要正常課徵土地增值稅，只是納稅義務人特定為受託人。","土地稅法第5條之2：受託人就受託土地，於信託關係存續中有償移轉所有權時，以受託人為納稅義務人，課徵土地增值稅。信託財產名義上屬受託人所有，受託人是法律上的處分主體，故由其負擔納稅義務（但實質上稅款來源仍由信託財產支付）。","委託人雖是信託財產的實質規劃者，但有償移轉時的法定納稅義務人是受託人，不是委託人。","信託監察人是監督信託執行的角色，不是納稅義務人。"],"99-22":["平均地權條例第46條：直轄市或縣市政府應於每年「1月1日」公告土地現值，作為該年度土地移轉或設定典權時申報土地移轉現值的依據。1月1日是固定的公告日期，是E2最基本的數字考點。","公告土地現值於每年1月1日公告，2月1日不是公告日。","公告土地現值於每年1月1日公告，7月1日不是公告日。","公告土地現值於每年1月1日公告；8月31日是地價稅基準日，勿混淆。"],"99-24":["兄弟間贈與是無償移轉，由受贈人納土增稅。無不課徵或免徵規定，故「定」需課。","區段徵收以現金補償地價者，免徵土地增值稅（土稅法§39）。","農地作農業使用移轉與自然人，經申請可不課徵土增稅（土稅法§39-2）。","公設保留地在未被徵收前之移轉，免徵土增稅（土稅法§39）。"],"99-30":["追繳期間為5年，2年過短。","追繳期間為5年，3年過短。","追繳期間為5年，4年過短。","土地稅法第37條：因重購退稅取得的土地，自完成移轉登記之日起「5年內」再行移轉或改作其他用途者，除課徵該次移轉的土地增值稅外，並應追繳原退還稅款。5年是防止短期套利規避稅負的監管期間。"],"99-32":["繳納期限為30日，10日過短。","繳納期限為30日，15日過短。","20日是核定應納稅額的延長期限（自用住宅案件），不是繳納期限。","土地稅法第50條：納稅義務人接到土地增值稅繳納通知書後，應於「30日」內向公庫繳納。30日是E2標準的繳納期限，與許多其他稅法的繳納期限一致。"],"99-35":["此行為有罰鍰，不是免罰。","罰鍰比率為再行出售移轉現值的2%，不是1%。","土地買賣未辦竣權利移轉登記再行出售者，處再行出售移轉現值2%罰鍰（土稅§54Ⅱ 114.1.24 修正為「2%以下」，修正前為2%）。此針對連續轉售（轉約）規避稅負而設。","罰鍰比率為再行出售移轉現值的2%，不是5%。"],"100-4":["法定年限為連續滿6年，1年過短。","法定為設籍並持有連續滿6年，不是5年。","一生一屋：出售時須設有戶籍並持有該自用住宅連續滿6年（土稅法§34）。另須無該自用住宅以外之房屋，且出售前5年內無營業或出租。","法定年限為6年，10年過長。"],"100-5":["設定典權時的土地增值稅納稅義務人是「出典人」（預繳），不是典權人。","此情形的納稅義務人是「受託人」本人，不是委託人，同99-20考點。","贈與（無償移轉）的納稅義務人是「取得所有權人（受贈人）」，不是贈與人，這是常見的反直覺考點。","土地稅法第5條：土地交換時，以原所有權人為納稅義務人（交換雙方互為原所有權人各自負擔自己交出土地部分的稅額）。本選項是唯一正確描述納稅義務人的選項。"],"100-6":["罰鍰為應納土地增值稅額的2倍，不是1倍。","私人捐贈財團法人供社福事業之土地，免徵土增稅（土稅法§28-1）；未按捐贈目的使用者，追補稅額並處應納稅額2倍罰鍰。","罰鍰為應納土地增值稅額的2倍，不是3倍。","罰鍰為應納土地增值稅額的2倍，不是5倍。"],"100-7":["土地稅法第39條之2：農業用地移轉與自然人申請不課徵土地增值稅，主管稽徵機關核准後，應於核准後「1個月內」將有關資料送直轄市縣市農業主管機關。1個月是固定的行政作業期限。","法定期限為核准後1個月內，2個月過長。","法定期限為核准後1個月內，3個月過長。","法定期限為核准後1個月內，6個月過長。"],"101-25":["父親（贈與人）不負擔土地增值稅（贈與時納稅義務人是受贈人），父親更不會繳契稅（契稅與土地增值稅是不同稅目，契稅針對房屋部分）。","土地增值稅納稅義務人應是兒子（受贈人），不是父親，此選項把納稅義務人說反了。","契稅納稅義務人在贈與情形是「受贈人」（兒子），不是贈與人（父親），此選項把契稅納稅義務人也說反了。","贈與一幢透天建築物（含土地與房屋）：土地部分課土地增值稅，無償移轉（贈與）的納稅義務人是「取得所有權人」（兒子）；房屋部分課契稅，贈與契稅的納稅義務人是「受贈人」（兒子）。兩稅目的納稅義務人都是兒子，本選項完全正確。"],"101-27":["此規定在土地稅法和平均地權條例都有提及，不是「只規定在平均地權條例」。","此項漸進調整機制（公告現值逐年接近市價的比例規定），是平均地權條例（而非土地稅法）的特有規定，土地稅法本身沒有這個「逐年調整比例」的條文，故本選項「只規定在平均地權條例中」是正確的。","此為土地稅法本身的稅率檢討條款，不是只在平均地權條例。","此為修正稅率後的財政補償配套，並非本題所問「只規定在平均地權條例」者；答案為B。"],"101-28":["設有典權土地的地價稅納稅義務人是「典權人」，不是出典人，本選項描述錯誤。","設定典權時的土地增值稅納稅義務人是「出典人」（預繳），不是典權人，本選項把地價稅和土增稅的典權相關規定混淆顛倒了。","配偶相互贈與之土地是「不課徵」（得申請），不是「免徵」，兩個用語在土地稅法上是不同的法律效果（不課徵將來再移轉仍要回溯課稅；免徵則永久不課），此選項用語錯誤。","土地稅法第39條之1（平均地權條例§42Ⅳ同）：經市地重劃之土地，於重劃後第一次移轉時，土地增值稅減徵40%。40%是固定的減徵比例，與區段徵收抵價地第一次移轉減徵40%的規定相同。"],"101-29":["10日不是延長後的期限。","土地稅法第49條：主管稽徵機關應於收件之日起7日內核定應納土地增值稅額；但申請按自用住宅用地稅率課徵之案件，因須審查戶籍、面積等較複雜的要件，期間得延長為「20日」。從7日延長到20日，差距是13天，這個20日是固定考點。","21日不是法定延長期限。","30日是繳納稅款的期限，不是核定延長的期限，兩者容易混淆。"],"101-39":["契約訂約日是一般買賣（30日內申報）的審核標準，不是法院判決移轉的標準。","收件日是逾30日才申報情形的審核標準，不是法院判決移轉的標準。","法院判決移轉登記以申報人向法院「起訴日」為準，不是判決確定日。","法院判決移轉登記者，申報移轉現值以申報人向法院起訴日當期之公告土地現值為準。"],"101-40":["平均地權條例第40條（與土地稅法第33條第5項相呼應）：長期持有減徵規定，超過20年、30年、40年，就其土地增值稅「超過最低稅率（20%）部分」分別減徵20%、30%、40%（土稅§33Ⅵ～Ⅷ）。本選項正確對應20年減徵20%的級距。","超過30年應減徵30%，不是40%，數字錯位。","超過40年應減徵40%，不是60%，數字過高。","法律沒有「超過50年」這個級距，最高級距是「超過40年減徵40%」，沒有更高的級距，本選項為虛構規定。"],"102-12":["土地法有登記、地價等規定，但公告土地現值並非依該法公告。","土稅法所稱公告土地現值，指直轄市、縣（市）政府依平均地權條例公告之土地現值，為課土增稅之依據。","不動產估價技術規則是估價作業準則，不是公告土地現值的法源。","土稅法是引用該公告現值課稅，公告依據是平均地權條例，非土稅法本身。"],"102-19":["本選項描述正確：信託行為成立時，委託人移轉給受託人不課徵土增稅，非錯誤。","本選項為錯誤敘述：受託人依信託本旨移轉財產給「委託人以外之歸屬權利人」（本題的丙），是應該「課徵」土地增值稅的情形，不是「不課徵」。信託土地增值稅的不課徵情形限於土稅法§28-3五款：成立時委託人→受託人、存續中受託人變更、受益人為委託人之信託消滅時受託人→受益人、遺囑信託消滅時受託人→受益人、信託不成立無效解除撤銷時委託人與受託人間；移轉給「委託人以外的歸屬人」則應正常課稅，本選項描述錯誤。","本選項描述正確：信託關係消滅，受託人歸還委託人，不課徵土增稅，非錯誤。","本選項描述正確：信託存續中受託人變更（原受託人→新受託人），不課徵土增稅，非錯誤。"],"102-25":["區段徵收以現金補償地價者，免徵土增稅（土稅法§39），屬免徵。","被徵收之土地免徵土增稅（土稅法§39），屬免徵。","因繼承而移轉之土地免徵土增稅（土稅法§28），屬免徵。","（本題問不屬免徵者）已規定地價之土地設定典權時，出典人應預繳土增稅（土稅法§29），回贖時無息退還。"],"102-34":["甲乙間（夫妻贈與）是「不課徵」（非「免徵」），乙丙間（出售給友人）應正常課徵土地增值稅，本選項兩處都錯。","甲乙間是不課徵沒錯，但乙丙間（賣給第三人丙）應正常課稅，不是不課徵，本選項後半段錯誤。","配偶相互贈與（甲乙間）得申請不課徵土地增值稅；但乙再移轉給第三人丙（乙丙間）時，已經不是配偶間移轉，應正常課徵土地增值稅，計算漲價總數額時以「第一次贈與前之原地價」為原地價（追溯計算，不因配偶贈與而重新設定原地價）。","乙丙間移轉計算漲價總數額時，「原地價」應以「甲乙贈與前的原地價」為準（追溯原始基期），不是用「移轉時的移轉現值」作為原地價（這會讓配偶贈與成為規避漲價總數額的工具，違反立法目的）。"],"103-9":["地價稅的典權土地納稅義務人是「典權人」，不是出典人，此為E1的固定陷阱。","贈與（無償移轉）的納稅義務人是「取得所有權人（受贈人）」，不是贈與人。","分別共有土地的地價稅納稅義務人是「各共有人」（按應有部分）；「管理人」是公有或公同共有土地的納稅義務人，推舉代表人只適用田賦。","即使雙方私下約定由買方（取得人）負擔土地增值稅，這只是私法上的契約約定（債權效力），法定的納稅義務人「仍是原所有權人」（賣方）。稅捐機關向法定納稅義務人（賣方）課稅，賣方再依約定向買方求償（民事問題）。"],"103-10":["「一生一屋」的面積限制是「都市土地未超過1.5公畝（即150平方公尺）」，不是300平方公尺，數字錯誤（300平方公尺接近一般用地的3公畝＝300平方公尺，與一生一屋的1.5公畝混淆）。","「一生一屋」優惠的核心要件之一：出售時申請人與配偶及未成年子女名下「無該自用住宅以外之房屋」（即僅有這一戶自住房屋）。這是「一生一屋」與「一生一次」最大的差異——一生一屋強調「僅此一屋」的身分狀態。","「一生一屋」要求的是出售前「5年內」無供營業使用或出租（比一生一次的1年更長），本選項說1年是錯誤的（這是一生一次的要件，非一生一屋）。","「一生一屋」要求持有並設籍滿「6年」（不是5年），本選項數字錯誤。"],"103-26":["信託成立時，委託人移轉信託財產給受託人，雖然名義上有所有權移轉，但實質上是信託財產的形式性轉移（受託人僅是名義持有人，不享有實質利益），故此移轉「不課徵」土地增值稅。本選項是同類四個信託土增稅不課徵情形中最基本的一項。","不課徵者是「受託人變更」時原受託人與新受託人間，委託人變更不在此列。","遺囑信託於信託關係消滅時，不課徵者為受託人與「受益人」間，本項寫成委託人。","受益人為委託人者，信託消滅時不課徵者為受託人與委託人間，本項對象有誤。"],"104-20":["都更地區內不願參加權利變換而領取現金補償者，減徵土地增值稅40%（現行都更條例§67；104年當時為§46）。","減徵幅度不是30%，且本題所指稅目以土增稅為主，不是土增稅及契稅各30%。","領現金補償者是「減徵」，並非免徵土增稅。","地價稅、房屋稅的減免是針對更新期間無法使用等情形，與領現金補償無關。"],"104-32":["40%減徵是重劃後第一次移轉或區段徵收抵價地第一次移轉的優惠，不是公設保留地尚未被徵收前移轉的優惠方式。","土地稅法第39條第2項：依都市計畫法指定之公共設施保留地，尚未被徵收前之移轉，準用「被徵收之土地」免徵土地增值稅的規定，予以免徵。公設保留地雖然還沒被徵收，但既然遲早會被徵收，法律提前給予免稅優惠，鼓勵土地流通並減輕地主負擔。","減半徵收不是公設保留地尚未被徵收前移轉的處理方式，正確是「免徵」（全免，比減半更優惠）。","既然是免徵，就不需要計算漲價總數額課稅，本選項與「免徵」的法律效果矛盾。"],"104-33":["本選項缺少「得申請」這個程序要件——農業用地移轉與自然人不是自動不課徵，而是「得申請」不課徵，須經主管稽徵機關核准。","土地稅法第39條之2：作農業使用之農業用地，移轉與自然人時，「得申請」不課徵土地增值稅（需要主動申請，經核准後才不課徵，不是自動發生）。「得申請」是這類優惠規定共通的關鍵字。","農業用地移轉是「不課徵」，不是「免徵」，兩者法律效果不同（不課徵在將來移轉時要追溯計算）。","應是「得申請不課徵」，不是「得申請免徵」，用語上的細微差異是重要陷阱。"],"104-35":["若雙方申報移轉現值超過當期公告現值，不是按公告現值課稅（這樣會少課），而是按更高的申報現值課稅。","前次移轉現值是計算原地價用的，不是本次申報審核的依據。","土地稅法第30條第2項：申報移轉現值經審核「超過」當期公告土地現值者，以雙方自行申報的移轉現值為準徵稅（從高課稅原則，避免雙方故意低報規避稅負，但若高報則依其高報金額課稅，不會幫納稅人打折）。","稅捐機關沒有另外「查證」一個移轉現值的程序，是直接以雙方自行申報的數字為準。"],"105-11":["自用住宅優惠稅率是「10%」，不是5%，數字錯誤。","重劃後第一次移轉是「減徵40%」，不是「減半徵收（50%）」，兩者比例不同。","土地稅法第28條：因繼承而移轉之土地，免徵土地增值稅。繼承是法定財產移轉（非自願性質），免徵是對繼承人的基本保障，這是E2最基礎的免徵情形之一。","政府出售公有土地是「免徵」（依官方答案以「各級政府出售或依法贈與之公有土地」免徵土增稅），不是「減半」。"],"105-39":["私法上約定由買方負擔稅捐是有效的契約安排，不會因此被認定無效，本選項描述錯誤。","此約定純屬私法契約自由範疇，不涉及違憲問題，本選項描述錯誤。","依最高法院91年度第6次民事庭會議決議（民法§231Ⅰ 給付遲延），雙方約定由買方（乙）負擔土地增值稅者，其數額以雙方「依約應辦理移轉登記之時」為計算之基準點，若因賣方（甲）遲延辦理移轉登記，導致登記日延後而公告現值上漲，使乙多繳了稅額，乙得依民法給付遲延的規定，向甲請求賠償因遲延所生的損害（多繳的稅額差距）。這是契約法上常考的「遲延損害賠償」概念與土地稅法案例結合的考題。","與官方答案C相反，乙是可以請求賠償的，本選項描述錯誤。"],"106-10":["本選項描述正確，1年內無出租無營業使用是法定要件之一，非「不符合」。","本選項描述正確，3公畝/7公畝是法定面積上限，非「不符合」。","本項不符規定：土增稅自用住宅優惠是「一生一次」，「以一處為限」是地價稅自用住宅用地的要件。","本選項描述正確，戶籍登記是法定要件之一，非「不符合」。"],"106-12":["累進起點地價是地價稅的概念，不是土地增值稅的課稅基礎。","公告土地現值是計算土地增值稅的「參考依據之一」（用於申報核定），但「課稅基礎」本身是漲價總數額，不是公告現值本身。","土地稅法明文規定，土地增值稅的課稅基礎（稅基）是「土地漲價總數額」，即土地移轉時申報現值減去原地價（經物價指數調整）及相關可扣除費用後的餘額，這是E2最核心的基本概念。","申報地價是地價稅的概念，不是土地增值稅的課稅基礎。"],"106-20":["新購地價大於900萬僅表示「有餘額」可退部分稅款，要退全部100萬須更高。","退稅須新購地價超過「原售地價扣除土增稅後餘額」（900萬）；要全額退100萬須不少於1,000萬（土稅法§35）。","比較的是土地地價（公告現值），不是房屋現值，也不看市價。","市價不是判斷標準；土稅法§35比較的是新舊土地地價。"],"106-21":["此為法定農業用地範圍之一，屬之。","此為法定農業用地範圍之一，屬之。","本選項為錯誤敘述：依土地稅法施行細則對「農業用地」的定義，農牧用地必須是位於「農業區、山坡地保育區、森林區」等特定使用分區內所編定，本選項說的是「以外之分區」所編定的農牧用地，這與法定範圍相反，故本選項描述錯誤，為本題答案。","此為法定農業用地範圍之一，屬之。"],"106-33":["3公畝／7公畝是「一生一次」10%的面積；一生一屋是1.5公畝／3.5公畝。","一生一屋要件之一：出售時所有權人與配偶及未成年子女無該自用住宅以外之房屋（土稅法§34）。","「持有5年」不是要件；一生一屋須設戶籍且持有連續滿6年。","戶籍及持有須連續滿6年，不是5年。"],"107-21":["公告現值不是計算漲價總數額的最終結果，而是計算過程中的參考價格之一，本題問的是計算「何種數值」課稅，答案應是整個課稅基礎的名稱。","申報移轉現值是計算漲價總數額的其中一個輸入值（被減數），不是課稅的最終標的。","「現值數額」不是法定用語，為虛構選項。","同106-12，土地增值稅的課稅基礎是「漲價總數額」。本題情境是配偶贈與不課徵後再移轉第三人，計算漲價總數額時要以「第一次贈與前」的原地價為原地價（不能用配偶贈與時的現值重設基期），最終仍是計算並課徵「漲價總數額」對應的稅額。"],"108-6":["逾30日才申報者，以受理申報機關收件日為準；以訂約日為準僅限30日內申報。","遺贈之土地審核標準是以「遺贈人死亡日」為準，不是「死亡後六個月」，本選項時點描述錯誤。","依法院判決移轉登記者，以申報人向法院起訴日當期公告土地現值為準（土稅法§30）。","經法院拍賣之土地審核標準是以「拍定日」為準，不是「強制執行日」，這是常見的混淆陷阱。"],"108-22":["本選項描述正確，30日內申報以訂約日為準，符合規定，非錯誤。","本選項描述正確，逾期申報以收件日為準，符合規定，非錯誤。","本選項描述正確，遺贈以死亡日為準，符合規定，非錯誤。","本項為錯誤敘述：法院判決移轉登記，應以申報人向法院「起訴日」為準，不是判決確定日。"],"109-10":["申報期限為30日，10日過短。","申報期限為30日，20日是自用住宅案件核定的延長期限。","平均地權條例第47條：土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起「30日」內，共同申請所有權移轉或設定典權登記，並共同申報土地移轉現值。30日是申報移轉現值的基本期限；實價登錄現行法改為申請所有權移轉登記時共同申報（§47Ⅱ），不是30日。","申報期限為30日，40日是工業用地申請優惠稅率的期限。"],"110-8":["本選項依官方答案，「未辦理用地變更」不在平均地權條例第35條之1規定的三種應追補稅額並處2倍罰鍰的情形內。法定三種情形是：未按捐贈目的使用、違反設立宗旨、土地收益未全部用於該事業，這三項都與「使用情形」有關，而「用地變更」屬於都市計畫或地政程序的範疇，不在此罰則規範內。","此為法定三種情形之一，屬之。","此為法定三種情形之一，屬之。","此為法定三種情形之一，屬之。"],"110-19":["只有②正確：一生一次的土增稅優惠，就該部分漲價總數額統按10%徵收。①寫「和」，法條為都市3公畝「或」非都市7公畝；③應為1年內；④法條為配偶、直系親屬，不限未成年。","①以「和」連接都市與非都市面積，與法條「或」不符，故①②組合不正確。","①表述不符法條，且④「未成年直系親屬」與法條「配偶、直系親屬」不同。","③「5年」是一生一屋的期間，一生一次為出售前1年內；④亦不符法條。"],"111-22":["遺贈之土地審核標準是以「遺贈人死亡日」為準，不是「簽立遺囑當期」（簽立遺囑後到死亡可能間隔很久，地價會變動，故應以死亡日這個確定法律效果發生的時點為準）。","逾30日才申報者，應以「收件日」當期公告現值為準，不是「訂約日」（訂約日是30日內申報才適用的標準）。","法院判決移轉登記以申報人向法院「起訴日」為準，沒有「終局判決日」的標準。","平均地權條例及土地稅法明文：經法院拍賣之土地，申報移轉現值之審核標準，以「拍定日」當期之公告土地現值為準。拍定日是法院拍賣程序中得標確定的時點，這是E2關於審核標準系列考點中最沒有爭議、各年度題目答案一致的選項。"],"112-2":["「一生一次」的優惠稅率是「百分之十（10%）」，不是「千分之二（2‰）」，2‰是地價稅自用住宅優惠稅率，本選項混淆了地價稅與土地增值稅兩種不同稅目的優惠稅率。","土地稅法第34條：自用住宅用地優惠稅率「一生一次」適用範圍，限於都市土地面積未超過3公畝部分，或非都市土地面積未超過7公畝部分（超過部分仍按一般累進稅率課稅）。3公畝/7公畝是固定面積上限，與地價稅自用住宅優惠的面積限制相同。","「一生一次」的要件是出售前1年內「無」供營業使用或出租，本選項說「曾」供營業使用或出租，恰好與要件相反。","「一生一次」並無持有年限的要求（這是「一生一屋」才有的6年持有要件），本選項對「一生一次」增加了不存在的持有期限要求，描述錯誤。"],"112-4":["法院判決移轉登記以起訴日為準，不是判決日。","法院判決移轉登記者，以申報人向法院起訴日當期之公告土地現值為準（土稅法§30）。101、108、112年皆以此為答案。","「判決送達日」不是法定的審核標準時點。","申報日是逾30日才申報的一般情形之審核標準（受理申報機關收件日），不是法院判決移轉登記的特殊標準。"],"113-22":["本選項描述正確，這是非都市土地供公共設施使用免徵土增稅的要件之一，非錯誤。","本選項描述正確，這是法定要件之一，非錯誤。","本選項為錯誤敘述：本題問的是「尚未被徵收前之移轉」要適用免稅的要件，若已「依法完成徵收公告」，土地已進入徵收程序甚至已徵收，就不再是「尚未被徵收前」的情形（甚至直接適用被徵收土地免稅的規定，不需此特別要件）。本選項把「徵收公告」這個與本題前提矛盾的條件放入要件清單，邏輯上不通，為本題錯誤答案。","本選項描述正確，需用土地人出具證明是法定程序要件之一，非錯誤。"],"114-6":["申報期限為30日，15日過短。","同109-10，平均地權條例第47條規定，雙方應於訂定契約之日起「30日」內申報土地移轉現值。30日是E2最基本的固定期限數字，反覆出現於多個年度的考題。","申報期限為30日，45日過長。","申報期限為30日，60日過長。"],"114-17":["土地稅法§54Ⅰ②：規避繳納實物者，處應繳田賦實物額「一倍」之罰鍰，不是二倍。","此情形的罰鍰是「百分之二」（同99-35），不是百分之三，數字錯誤。","土地稅法第54條：納稅義務人藉變更、隱匿地目等則或於適用特別稅率減免原因事實消滅時未申報，因而逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額「三倍以下」之罰鍰。3倍以下是本題的固定罰鍰倍數，與99-35的「轉售移轉現值2%罰鍰」屬不同情形的不同罰則，不可混淆。","土地稅法§54Ⅲ：應於通知繳納之日起「一個月」內繳納，不是2個月。"],"99-31":["本題（99年舊條文）自住為1.2%，1%不是自住稅率。現行法（113.7.1施行）：1%是本人、配偶、未成年子女全國僅持有一戶、供自住且房屋現值在一定金額以下者之稅率；公益出租人出租使用與自住同為1.2%。","房屋稅條例§5：供自住的住家用房屋，稅率為1.2%（本題題幹為舊條文）。⚠️現行法：自住1.2%（本人、配偶、未成年子女全國3戶以內）；全國僅一戶且現值在一定金額以下1%；其他住家用2%～4.8%。","1.5%不是自住稅率；1.5%～2.5%是人民團體等非營業用的區間（現行法私人醫院、診所、自由職業事務所列入營業用3%～5%）。","3%不是自住稅率；3%～5%是非住家營業用的區間。"],"99-33":["1年週期過短，不是法定重行評定頻率。","2年不是法定重行評定頻率。","房屋稅條例第11條：房屋標準價格由不動產評價委員會評定，直轄市縣市政府公告，每「3年」重行評定一次。3年是F1最基本的固定數字考點。","4年不是法定重行評定頻率。"],"100-10":["平民住宅是「減半徵收」（非免徵），本選項與正確法律效果不符。","本題官方答案：司法保護事業所有之房屋為法定「免徵」房屋稅之情形之一。注意這個與101-34、101-32題不同年度的考法常互相對照，務必記住司法保護事業房屋屬於免徵清單。","工廠供直接生產使用之自有房屋是「減半徵收」（非免徵），依104-40題確認答案，與本選項描述的法律效果不符。","毀損30%以上未達50%是「減半徵收」（非免徵），免徵的門檻是毀損達50%以上且須修復始能使用。"],"100-31":["5日過短，不是法定異議申請期限。","10日不是法定期限。","15日不是法定期限。","房屋稅條例第10條：納稅義務人對主管稽徵機關核計之房屋現值如有異議，得於接到通知書之日起「30日」內，檢附證件申請重行核計。30日是F1標準的異議申請期限。"],"101-22":["財政部是中央主管機關，但不是房屋稅徵收率的擬定機關。","立法院是中央立法機關，不是房屋稅徵收率的擬定機關。","房屋稅條例第6條：房屋稅徵收率由直轄市及縣市政府於第5條法定稅率範圍內擬定，提經當地民意機關通過後實施。是「地方政府擬定＋地方議會通過」的二階段程序，本題只問「由何者規定」，答案是直轄市縣市政府（擬定主體）。","民意機關是「通過」徵收率的審議機關，不是「擬定」徵收率的提案機關，兩者角色不同，本題問的是擬定主體。"],"101-32":["平民住宅是「減半徵收」，不是免徵，本選項法律效果不符。","此為「減半徵收」（非免徵），不符題目所問的免徵情形。","房屋稅條例第15條：受重大災害，毀損面積占整棟面積「50%以上」，必須修復始能使用之房屋，「免徵」房屋稅。50%是免徵的門檻（區別於30%~未達50%的減半徵收門檻）。","毀損30%以上未達50%是「減半徵收」，不是免徵，未達免徵的50%門檻。"],"101-33":["30平方公尺不足全部面積300的六分之一（50），不是最低面積。","房屋同時供住家及非住家使用，非住家用稅率的面積最低不得少於全部面積六分之一。300÷6＝50平方公尺。","60平方公尺不是300平方公尺的六分之一，不符法定比例。","150平方公尺是全部面積的二分之一，並非法定最低比例。"],"101-34":["完成財團法人登記且立案之私立學校辦公自有房屋，是免徵（§15 Ⅰ），不是減半。","無償供政府機關公用或軍用之房屋，是免徵房屋稅（§15 Ⅰ），不是減半。","房屋稅條例§15 Ⅱ：受重大災害，毀損面積占整棟30%以上未達50%，減半徵收。毀損50%以上且須修復始能使用才免徵。","農會專供糧政機關儲存公糧之倉庫（經主管機關證明）是免徵（§15 Ⅰ）；農會自用倉庫及檢驗場才減半。"],"101-35":["營業用稅率區間錯誤（應為3%~5%，不是1%~3%）。","兩個區間都錯誤，營業用應為3%~5%，非營業用應為1.5%~2.5%。","營業用區間正確（3%~5%），但非營業用區間錯誤（應為1.5%~2.5%，不是2.5%~3.5%）。","房屋稅條例第5條：營業用稅率區間3%~5%；私人醫院診所自由職業事務所人民團體等非營業用稅率區間1.5%~2.5%。兩個區間都正確對應，本選項完全正確。⚠️現行法（2026-10-08核對）：私人醫院、診所、自由職業事務所已併入營業用3%～5%，僅人民團體等非營業用為1.5%～2.5%；本題以考試當年條文為準。"],"101-36":["7日不是法定申報期限。","10日不是法定申報期限。","20日不是法定申報期限。","房屋稅條例規定，房屋稅籍變更（含房屋移轉完成）應於變更之日起「30日」內向主管稽徵機關申報。30日是房屋稅各項申報期限的統一標準，與房屋現值異議申請期限（同樣30日）一致。"],"102-20":["房屋稅條例§15 Ⅱ：政府平價配售之平民住宅，房屋稅減半徵收，不是免徵。","司法保護事業所有之房屋是免徵（§15 Ⅰ），不是減半徵收。","無償供政府機關公用之房屋是免徵（§15 Ⅰ），不是減半徵收。","減半徵收的是政府平價配售之平民住宅；本項「配供貧民居住之房屋」不是減半情形。"],"102-21":["新建增建改建房屋當期建造完成，不是免予計課，而是按比例計課。","不是「一律減半」，而是按實際使用月數比例計課。","房屋稅條例第6條之1：新建、增建或改建之房屋，於當期建造完成者，「按月比例計課」，未滿1個月者不計。這是按實際使用時間合理課稅的設計，避免年度中途完工的房屋被全年課稅或完全免課。","法定單位是「月」，不是「週」，計算單位錯誤。"],"103-4":["罰鍰倍數應為「2倍以下」（非3倍），本選項數字過高且未加「以下」的限定詞。","5倍遠超法定罰鍰倍數，數字錯誤。","依本題當年條文（房屋稅條例§18舊法）：逾期繳納稅款，每逾2日加徵滯納數額1%滯納金。⚠️現行法：房屋稅條例§18已改為「應加徵滯納金」，依稅捐稽徵法§20（110.12.17修正、111.1.1施行）每逾3日按滯納數額加徵1%；契稅同依稅捐稽徵法§20（契稅條例§25條文雖仍寫每逾2日1%）。","滯納金比率是1%（非3%），數字錯誤。"],"103-5":["本題當年條文：自住或公益出租人出租使用均為1.2%，不是1%。現行法：1%僅適用本人、配偶、未成年子女全國僅一戶、自住且房屋現值在一定金額以下者。","其他供住家用（非自住）的稅率區間是2%～4.8%，不是1%～3%。","人民團體等非營業用的稅率區間是1.5%～2.5%，不是1%～3%。","房屋稅條例§5：供營業及私人醫院、診所、自由職業事務所使用者，稅率3%～5%（依本題條文）。⚠️現行法：1.5%～2.5%現僅適用人民團體等非營業用。"],"103-11":["持有未滿2年，且本人、配偶、未成年子女均未設籍，不符自住排除，仍須課特銷稅。","土地稅法§17：自用住宅用地要件為所有權人或其配偶、直系親屬辦竣戶籍。父親是直系親屬且已設籍，符合地價稅自用住宅稅率。","特銷稅持有期間自登記日（102.4.1）算到出售日（103.3.5），約11個月，稅率15%而非10%。","房屋稅自住也是本人、配偶或直系親屬居住，父親是直系親屬，所以符合自住稅率。"],"104-38":["此為法定評定房屋標準價格的因素之一，屬之。","此為法定評定因素之一，屬之。","房屋標準價格的法定評定因素為：房屋建造材料、房屋耐用年數及折舊標準、房屋所處街道村里之地段調整率三項（現行§11第3款原文為「街道村里之商業交通情形及房屋之供求概況，並比較各該不動產之實價登錄之價格增減」，實務以地段調整率表現）。本選項說的是「地段之地價水準」，這是地價的概念（屬於地價稅、土地增值稅的範疇），房屋稅課的是房屋本身的價值（建材、年限、地段調整率），不直接以土地地價水準作為評定因素，這是F1的重要陷阱。","此為法定評定因素之一（注意與C選項的「地價水準」不同，「地段調整率」是法定因素，「地價水準」不是），屬之。"],"104-39":["本選項描述正確，典權房屋的房屋稅納稅義務人是典權人，非錯誤。","本選項為錯誤敘述：無建造執照的房屋（違章建築）並非「免徵房屋稅」，房屋稅的課徵與建物是否合法（有無建照）無關，違章建築一樣要課房屋稅（這是稅法上「實質課稅」的精神，不因建物違法就免除稅捐義務）。","本選項描述正確（依當時法制設計，省市政府訂定開徵日期），非錯誤。","本選項描述正確，符合減半徵收規定（同102-20題），非錯誤。"],"104-40":["房屋稅條例§15 Ⅱ：合法登記工廠供直接生產使用之自有房屋，減半徵收。同屬減半的還有平價配售之平民住宅、農會自用倉庫及檢驗場。","工廠供直接生產使用之自有房屋是減半徵收，不是免徵，這是常見混淆點。","3%不是工廠房屋的課徵方式；優惠是按原稅額減半。","1.2%是自住住家用的稅率，與工廠房屋的減半規定無關。"],"105-5":["地價評議委員會負責評議地價區段、區段地價（作為公告地價、公告土地現值基礎）及徵收市價，不是房屋標準價格；累進起點地價是依土地稅法§16以7公畝平均地價計算，不是委員會評定。","此委員會為虛構名稱，房屋稅條例無此機構。","名稱接近但不正確，正確名稱是「不動產評價委員會」（評議vs評價，一字之差是常見陷阱）。","房屋稅條例第9條：房屋標準價格由「不動產評價委員會」評定，並由直轄市縣市政府公告。「評價」（非評議、非仲裁）委員會是F1的固定機關名稱考點。"],"105-6":["所有權人是房屋稅最基本的納稅義務人，屬之。","房屋稅的納稅義務人清單包括：所有權人、典權人、共有人推定一人、信託受託人、使用執照所載起造人（未辦保存登記情形）等，但「債權人」不在此清單內。一般債權人（例如借款給屋主的人）對房屋沒有使用收益的物權關係，不負擔房屋稅義務。","典權人是法定納稅義務人之一，屬之。","信託房屋於信託關係存續中，受託人是法定納稅義務人，屬之。"],"106-17":["本選項為本題「非屬」自住房屋稅要件的答案：本選項用詞是「土地所有權人」，但本題自住房屋稅率的要件對象應是「房屋所有人」（本人）或其配偶、直系親屬辦竣戶籍登記，「土地所有權人」的措辭混淆了房屋稅（針對房屋）與地價稅（針對土地）的權利主體，故本選項的描述不精確，非自住房屋稅要件的正確表述。","房屋無出租是自住房屋稅率的要件之一，屬之。","實際居住使用是自住房屋稅率的要件之一，屬之。","全國合計3戶以內是自住房屋稅率的要件之一，屬之。"],"107-24":["30%以上未達50%是「減半徵收」，不是「免徵」，本選項法律效果錯誤。","同101-32，毀損50%以上且必須修復始能使用，房屋稅「免徵」。50%是免徵與減半的分界門檻。","50%以上應是「免徵」（非減半），且本選項漏掉「必須修復始能使用」這個重要前提要件。","描述了正確的要件（50%以上且須修復），但法律效果應是「免徵」，不是「減半徵收」，本選項把效果說錯了。"],"109-1":["本選項為錯誤敘述：合法登記工廠供直接生產使用之自有房屋是「減半徵收」（同104-40），不是「免徵」，本選項法律效果錯誤，為本題答案。","本選項描述正確，符合法定免徵情形（同101-32），非錯誤。","本選項描述正確，3年重行評定週期及按年折舊符合法條規定，非錯誤。","本選項描述正確，公有機關辦公房屋免徵房屋稅，非錯誤。"],"109-19":["一般情形委託人不是房屋稅的法定納稅義務人。","房屋稅條例：房屋為信託財產者，於信託關係存續中，以「受託人」為房屋稅之納稅義務人。與地價稅的信託土地規定一致（受託人是名義持有人，負責管理使用，故由其負擔稅捐）。","受益人享有信託利益，但不是法定納稅義務人。","信託監察人是監督角色，不是納稅義務人。"],"111-4":["本選項描述正確，房屋所有人是房屋稅基本的納稅義務人，非錯誤。","本選項描述正確，符合法定順位規定（有使用執照者向起造人徵收），非錯誤。","本選項描述正確，無使用執照但有建造執照者，向建造執照起造人徵收，符合法定順位，非錯誤。","本選項為錯誤敘述：無使用執照、亦無建造執照的房屋（完全無證照的違建），房屋稅應「向現住人或管理人徵收」，不是「暫不徵收」。「暫不徵收」違反房屋稅的實質課稅原則，本選項描述錯誤。"],"113-19":["此區間不符合待銷售住家用房屋的特殊稅率規定。","房屋稅條例：起造人持有使用執照所載用途為住家用之「待銷售」房屋，於起課房屋稅「2年內」，按「2%~3.6%」之特殊稅率課徵（比一般自住的1.2%高，但比非自住住家用的最高4.8%低，反映建商待售房屋的特殊性質）。2年內、2%~3.6%是固定組合考點。","上限應為3.6%，不是4.8%（4.8%是非自住住家用一般房屋的最高稅率）。","此區間是營業用房屋的稅率，不是待銷售住家用房屋的稅率。"],"113-24":["本選項描述正確，無出租無營業是自住稅率的要件之一，非錯誤。","本選項描述正確，戶籍登記是要件之一，非錯誤。","本選項為錯誤敘述：1.2%自住稅率的要件是「本人配偶未成年子女全國合計3戶以內」（認定標準§2）。「全國僅持有一戶且房屋現值在一定金額以下」是適用較低之1%稅率的要件（§5Ⅰ①(一)後段），不是1.2%的要件；本選項把1%的要件套到1.2%，為本題答案。","本選項描述正確，實際居住使用是要件之一，非錯誤。"],"114-5":["本選項描述正確，使用權房屋的納稅義務人是使用權人，非錯誤。","本選項描述正確，共有房屋的納稅安排符合法條規定，非錯誤。","本選項為錯誤敘述：法定優先順位是「先向使用執照所載起造人徵收，無使用執照者才向建造執照所載起造人徵收」，本選項說「優先向建造執照所載起造人徵收」，跳過了使用執照優先的順位，順序錯誤，為本題答案。","本選項描述正確，受託人是法定納稅義務人，非錯誤。"],"114-15":["房屋稅條例§15 Ⅰ：無償供政府機關公用或供軍用之私有房屋，免徵房屋稅。","政府平價配售之平民住宅是減半徵收（§15 Ⅱ），不是免徵。","合法登記工廠供直接生產使用之自有房屋是減半徵收，不是免徵。","毀損30%以上未達50%是減半徵收；免徵門檻是毀損50%以上且須修復始能使用。"],"100-9":["2%是交換或分割契稅的稅率，不是占有契稅的稅率。","4%是典權契稅的稅率，不是占有契稅的稅率。","契稅條例第3條：占有契稅稅率為契價的「6%」，與買賣、贈與契稅相同。占有是指以時效取得等方式取得不動產所有權，因取得方式特殊，稅率與買賣等同視之，採較高稅率6%。","8%不是任何契稅類型的法定稅率。"],"101-30":["受託人依信託本旨移轉財產給歸屬權利人，不是買賣行為，不適用買賣契稅。","此非交換行為，不適用交換契稅。","契稅條例規定，受託人依信託本旨將信託財產移轉與「委託人以外之歸屬權利人」時，性質上視同贈與（無償移轉），應申報繳納「贈與契稅」（稅率6%）。歸屬權利人丙是無償取得財產，故依贈與契稅課徵。","此非占有行為（非時效取得），不適用占有契稅。"],"101-31":["契稅條例第3條：買賣契稅稅率為契價的6%。本選項正確對應買賣的稅率。","典權契稅的稅率是「4%」，不是6%，這是契稅條例六種類型中唯一稅率不是6%（除交換、分割2%外）的特殊類型。","交換契稅稅率是「2%」，不是6%。","分割契稅稅率是「2%」，不是6%。"],"101-37":["稽徵機關收到申報案件後，應於15日內查定應納稅額，本項正確。","逾期申報加徵的是怠報金，每逾3日加徵應納稅額1%（最高不超過應納稅額及1.5萬元，§24）。「每逾2日1%」是逾期繳納的滯納金（契稅條例§25；⚠️現行依稅捐稽徵法§20為每逾3日1%），故本項錯誤。","匿報或短報經查獲，除補稅外處應納稅額1倍以上3倍以下罰鍰，本項正確。","檢舉逃漏契稅之獎金為罰鍰的20%，本項正確。"],"102-22":["抵押借貸代替設典不是買賣行為。","契稅條例：凡以「抵押、借貸等變相方式」代替設典，取得不動產使用權者，應以「典權」契稅申報納稅。法律不允許以變相方式規避典權契稅的稅捐義務，採取實質課稅原則認定此類安排視同設典。","此非交換行為。","「設定」契稅非法定類型（契稅條例的六種類型為買賣、贈與、交換、分割、典權、占有）。"],"103-3":["國光獎章是國家榮譽勳獎，不是契稅條例的檢舉獎勵內容。","地政貢獻獎不是契稅條例規定的獎勵內容。","契稅條例規定，檢舉逃漏契稅者，得以罰鍰的20%獎給舉發人，並為其保守秘密。","30%不是法定比例，檢舉獎金為罰鍰的20%。"],"104-36":["本選項描述正確，符合契稅條例規定（已開徵土增稅的土地免徵契稅），非錯誤。","本選項描述正確，占有契稅稅率6%，非錯誤。","本選項為錯誤敘述：典權契稅的納稅義務人是「典權人」（不是出典人），與101年第31題稅率一樣，這是契稅條例「納稅義務人」表中最容易與直覺相反的考點——出典人是把不動產出典出去的人，典權人是付出典價取得使用收益權的人，課稅對象是「取得權利的人」（典權人）。","本選項描述正確，符合契稅徵收機關規定，非錯誤。"],"104-37":["雙方會同申報日不是起算日；糾紛時雙方通常無法會同申報。","「主管建築機關核發使用執照之日起滿30日」才是建造完成前因買賣、交換、贈與（不含分割）以承受人為原始起造人或中途變更起造人名義之申報起算日（契稅§16Ⅴ），與糾紛情形無關。","契稅條例：不動產移轉發生糾紛時，申報契稅的起算日是法院判決確定之日。⚠️土地增值稅依法院判決移轉者，則以向法院起訴日的公告現值為準，兩者不同。","法院發給權利移轉證明書之日，是向法院標購拍賣不動產的起算日，不是糾紛情形。"],"105-2":["向法院標購拍賣之不動產不免徵契稅，仍須申報（§11）；起算日是法院發給權利移轉證明書之日。","契稅條例§14：政府機關因公務需要，以公有不動產交換取得不動產所有權者，免徵契稅。","依法領買或標購公產不免徵契稅，仍須申報（§11）；起算日是核發產權移轉證明書之日。","先典後賣是兩次移轉，典權及買賣各依規定課契稅，不在免徵之列。"],"105-14":["（本題問錯誤者）處分權說下出賣人僅甲、乙，丙不是契約當事人，不負債務不履行賠償責任。","此敘述正確：代理權說認為甲乙係代表全體共有人出賣，丙亦為出賣人，須負出賣人義務。","此敘述正確：買賣契稅由買受人丁申報納稅，出賣人甲、乙、丙無庸申報。","依官方答案此敘述視為正確：題幹未載取得時點，無法認定須課特銷稅，且買受人丁非納稅義務人。"],"105-24":["奢侈稅（特種貨物及勞務稅）的納稅義務人是銷售者（賣方），買方乙無此義務。","B地已開徵土地增值稅，土地部分免徵契稅，乙無須就B地繳契稅。","土地增值稅的納稅義務人是原所有權人甲，不是買受人乙。","本題官方答案：乙就買賣契約書應繳納印花稅（印花稅法，由立約人貼用印花）。"],"105-37":["普通法院負責民刑事訴訟，不是稅捐強制執行的機關。","行政法院負責行政訴訟，不是強制執行機關。","未依法繳納契稅（欠稅）的強制執行，依法移送「法務部行政執行署所屬行政執行分署」辦理。這是所有稅捐（含契稅、地價稅、房屋稅等）欠稅強制執行的共通機關，是稅法體系常見的固定考點。","國有財產署管理國有財產，不是稅捐強制執行的機關。"],"106-5":["建造完成前因繼承變更起造人名義，免徵契稅，不屬應申報情形。","契稅條例：建築物建造完成前，因贈與變更起造人名義並取得使用執照者，應申報納稅（贈與契稅6%）。繼承則免徵。","設典是另一種契稅類型，與建造完成前變更起造人名義無關，非本題情形。","契稅條例§12Ⅱ只列買賣、交換、贈與三種原因，不含分割；官方答案只取贈與正確，舊筆記「分割亦應申報、與官方有出入」有誤。"],"106-11":["以遷移、補償等變相方式支付產價取得不動產，視同買賣，仍應課徵契稅。","依法領買或標購公產、向法院標購拍賣不動產，不免徵契稅，仍須申報（§11）。","契稅條例：開徵土地增值稅區域之土地免徵契稅，避免重複課稅；房屋部分仍須課契稅。","受託人移轉信託財產與委託人以外的歸屬權利人，應課契稅，由歸屬權利人申報。"],"106-16":["本選項描述正確，符合契稅條例規定（同104-37），非錯誤。","本選項描述正確，符合規定，非錯誤。","本選項描述正確，符合規定，非錯誤。","本選項為錯誤敘述：不動產分割的契稅申報起算日，應以「訂立分割契約之日」（與一般買賣相同，採訂約日原則）為準，不是「完成移轉登記之日」。本選項把分割申報起算日的時點說錯了。"],"106-19":["本選項為本題「錯誤」的答案：106年7月1日設定典權並完成移轉登記予乙後，地價稅的納稅義務人應改為「典權人乙」（典權人是地價稅法定納稅義務人，不是出典人甲），故說「當年度地價稅之納稅義務人為甲」是錯誤的，本題答案以「典權設定後是典權人負擔地價稅」的原則為核心考點。","本選項描述正確：典權人乙是房屋稅的法定納稅義務人（同地價稅原則，典權人取得使用收益權），107年期（次年度）房屋稅自應由乙負擔，非錯誤。","本選項描述正確：典權契稅的納稅義務人是典權人（乙），符合契稅條例規定（同104-36題），非錯誤。","本選項描述正確：設定典權時的土地增值稅納稅義務人是「出典人」（甲，預繳），非錯誤。"],"106-32":["契稅的課稅基礎不是實際買賣價格，而是評定的契價。","契稅課稅基礎不是市場價格，避免市價波動造成課稅爭議。","「房價」非法定用語。","契稅條例：契稅之課稅基礎是「契價」，即以當地不動產評價委員會評定之標準價格為準（非市價、非實際買賣價格）。契價是G1最核心的基本概念，須與土地增值稅的「漲價總數額」、地價稅的「申報地價」區分清楚。"],"107-23":["契價不是以實際買賣價格為準，避免市場交易價格波動造成課稅困難，且容易誤導以為與不動產買賣中實際成交價有關。","同106-32，契稅課稅基礎「契價」是以「當地不動產評價委員會評定之標準價格」為準。不動產評價委員會（與房屋稅的房屋標準價格評定機關相同）是契稅契價評定的法定機關。","地價及標準地價評議委員會是評議地價區段及區段地價（作為公告地價、公告土地現值基礎）的機關，不是契稅契價的評定機關，兩者機關不同，這是常見的混淆陷阱。","建築主管機關公告的房屋造價不是契稅契價的評定依據，契價評定機關是不動產評價委員會。"],"109-2":["本選項描述正確，6%是買賣契稅稅率，非錯誤。","本選項描述正確，6%是贈與契稅稅率，非錯誤。","本選項描述正確，6%是占有契稅稅率，非錯誤。","本選項為錯誤敘述：典權契稅稅率是「4%」，不是6%，這是契稅六種類型中與買賣贈與占有（同為6%）不同的特殊稅率（交換分割是2%，典權是4%，買賣贈與占有是6%）。"],"109-18":["銀行不是契稅的法定納稅義務人，除非銀行本身為不動產買受人。","買賣契稅的納稅義務人是「買受人」（取得所有權人），不是出賣人，這是契稅最重要的反直覺考點。","契稅條例第4條：買賣契稅應由「買受人」（取得不動產所有權之人）申報納稅，與一般人直覺「賣方收錢，賣方繳稅」的想法相反，是G1最核心的固定考點。","不動產仲介公司是居間或代理服務的提供者，不是契稅的法定納稅義務人。"],"110-22":["申報主體應是丙（歸屬權利人），不是乙（受託人），主體錯誤。","申報主體錯誤（應為丙），稅率也錯誤（信託歸屬視同贈與，稅率應為6%，不是2%）。","同101-30的考點：受託人乙依信託本旨將信託財產移轉與「委託人以外的歸屬權利人丙」時，視同贈與，由「歸屬權利人丙」申報契稅，稅率為「贈與契稅6%」。本選項正確描述了申報主體（丙）和稅率（6%）。","申報主體和稅率都錯誤，甲是委託人，不是本次移轉的申報義務人。"],"111-5":["本選項為錯誤敘述：買賣契稅應由「買受人」申報納稅，不是出賣人，本題以此核心考點作為「何者錯誤」的答案。","本選項描述正確，典權人是典權契稅的法定納稅義務人（同104-36題），非錯誤。","本選項描述正確，6%是買賣契稅稅率，非錯誤。","本選項描述正確，2%是分割契稅稅率，非錯誤。"],"111-6":["信託成立時委託人與受託人間的移轉，依契稅條例§14-1①「不課徵」契稅（同土地稅法§28-3信託不課徵土增稅），不是須課徵的情形。","本選項依官方答案，是須課徵契稅的情形——當信託契約明定信託財產的歸屬人是「第三人」（非委託人本人），信託關係消滅時，財產從受託人移轉給該第三人歸屬人，這個移轉涉及「委託人」對「第三人」的實質贈與性質移轉，依規定須課徵契稅（贈與性質）。本題情境略不同於101-30、110-22（受託人移轉給歸屬人），本題是描述信託架構下「委託人與歸屬人」之間關係消滅時的課稅情形，依官方答案此情形應課契稅。","信託行為「不成立」，財產根本沒有發生信託移轉，自然不涉及課稅問題，此選項描述邏輯矛盾。","受託人變更（原受託人到新受託人）是信託財產的形式性轉移，不課徵契稅（性質與不課徵土地增值稅的情形相同）。"],"111-7":["買賣契稅稅率6%，不是最低。","典權契稅稅率4%，不是最低。","契稅條例六種契稅類型中，稅率最低的是「交換」和「分割」，均為2%，本選項列出分割（2%），是六種類型中最低稅率，符合本題「何者稅率最低」的提問。","贈與契稅稅率6%，不是最低。"],"112-12":["買賣契稅應由「買受人」申報納稅，不是出賣人，描述錯誤。","贈與契稅應由「受贈人」申報納稅，不是贈與人，描述錯誤。","同104-36、111-5，典權契稅的納稅義務人是典權人，本選項正確描述。","占有契稅稅率是6%（同100-9題），不是2%，數字錯誤。"],"113-20":["標購公產的起算日是核發產權移轉證明書之日，不是核准產權移轉之日。","契稅條例：不動產移轉發生糾紛時，申報契稅的起算日是法院判決確定之日。","向法院標購拍賣不動產，起算日是法院發給權利移轉證明書之日，不是拍定日。","契稅條例§16Ⅴ：建造完成前因買賣、交換、贈與，以承受人為建造執照原始起造人或中途變更起造人名義並取得使用執照者，以核發使用執照之日起「滿30日」為申報起算日；本項寫成「核發使用執照之日」故錯誤（原始起造人本是條文明列情形）。"],"113-23":["同101-30、110-22，受託人移轉給委託人以外的歸屬權利人，由歸屬權利人申報納稅（贈與契稅），本選項正確描述了申報義務人。","應由買受人申報納稅，不是出賣人，描述錯誤。","應由典權人申報納稅，不是出典人，描述錯誤（同104-36題）。","契稅條例§6：交換契稅由交換人估價立契，各就承受部分申報納稅；有給付差額價款者，差額價款依買賣契稅稅率課徵，仍由交換人申報，不是「出賣人」。"],"114-14":["4%是典權契稅稅率，不是贈與契稅稅率。","同契稅基本稅率規定，贈與契稅稅率為契價的「6%」，與買賣、占有相同。","2%是交換或分割契稅稅率，不是贈與。","5%不是任何契稅類型的法定稅率。"],"114-16":["契稅條例：納稅義務人應於稽徵機關核定繳款書送達後30日內繳納契稅。","逾期申報的怠報金是每逾3日加徵應納稅額1%（§24），最高不超過應納稅額及1.5萬元；「每逾2日2%」錯誤。","逾期繳納滯納金：契稅條例§25條文為每逾2日1%，現行依稅捐稽徵法§20（111.1.1施行）為每逾3日按滯納數額加徵1%；無論何者都不是2%。","匿報或短報的罰鍰是應納稅額1倍以上3倍以下，不是1倍以上2倍以下。"],"105-26":["所得稅法§4-4：103年1月1日之次日以後取得、交易時持有期間2年以內的房屋、土地，也屬房地合一課稅範圍。105年1月1日以後取得者則一律適用。","依農業發展條例申請興建的農舍，不適用房地合一，僅就房屋部分課所得稅。","無出租、營業或執行業務使用只是自住優惠要件之一，且優惠是400萬元以下免稅，並非全免。","被徵收或徵收前先行協議價購之房地，免納所得稅，並非應予課徵。"],"106-7":["45%是一般稅率（舊制1年內、現行2年內），非自願因素另適用優惠稅率。","35%是一般稅率（舊制逾1年未逾2年、現行逾2年未逾5年），不是優惠稅率。","所得稅法§14-4Ⅲ：因財政部公告之調職、非自願離職等非自願因素，稅率20%。⚠️現行法：持有期間放寬為5年以下。","15%是持有逾10年的稅率，不是非自願因素的優惠稅率。"],"106-15":["舊制下農舍的計算方式不是僅就「土地部分」，而是僅就「房屋部分」計算（土地部分依土地稅法課土地增值稅，不再併入財產交易所得計算所得稅），本選項弄反了。","依農業發展條例申請興建的農舍（屬於舊制下的特殊房屋類型），出售時依104年12月31日前的舊制規定，「僅就房屋部分」計算財產交易所得，課徵綜合所得稅（土地部分依土地稅法課徵土地增值稅，不再計入此處的財產交易所得）。這是農舍課稅的特殊延續規定，不適用105年後的房地合一新制。","農舍依規定不適用105年新制（房地合一稅），而是延續舊制（僅房屋部分課稅），本選項描述錯誤。","農舍出售並非完全免稅，房屋部分仍應課徵財產交易所得稅（舊制），本選項描述錯誤。"],"106-31":["舊制持有1年以內為45%，本項敘述正確。⚠️現行2.0：2年以內皆為45%。","舊制逾1年未逾2年為35%，本項敘述正確。⚠️現行2.0：此級距已改為45%。","舊制逾2年未逾10年為20%，沒有25%這一級，本項錯誤。⚠️現行2.0：逾2年未逾5年35%，逾5年未逾10年20%。","持有逾10年為15%，本項敘述正確（舊制與現行2.0皆同）。"],"106-40":["1,925,000＝550萬×35%，是稅率誤用35%；本題持有未滿1年，應為45%。","2,240,000＝640萬×35%，同時誤扣土增稅10萬且誤用35%稅率。","所得額＝2,000萬－1,300萬－50萬－土地漲價總數額100萬＝550萬。持有8個月，稅率45%，稅額247.5萬元。","2,880,000＝640萬×45%，誤扣已繳土增稅10萬；應扣除土地漲價總數額100萬。"],"107-25":["自住優惠的免稅額，以公式餘額不超過400萬元為限，本項正確。","所得稅法§4-5Ⅰ①：自住優惠要件是個人、配偶或未成年子女辦竣戶籍登記，不含直系親屬，故本項錯誤。","交易前6年內無出租、供營業或執行業務使用，是法定要件，本項正確。","個人與配偶及未成年子女交易前6年內未曾適用本優惠，是法定要件，本項正確。"],"108-10":["法定扣除期限是「3年內」（不是5年），數字錯誤。","7年遠超法定的3年期限，數字錯誤。","所得稅法：重購自住房屋土地享有重購退稅優惠後，於重購後「5年內」改作其他用途或再行移轉者，應追繳原扣抵或退還稅額。5年是房地合一稅重購退稅後的監管期間，與土地增值稅重購退稅後的5年監管期間（土地稅法第37條）邏輯一致。","法定期限是5年（不是7年），數字錯誤。"],"109-3":["土地稅法§35：先購買後出售者亦準用重購退稅，但須自新購土地完成移轉登記之日起「2年內」出售；本選項寫「2年後」才出售，不符期限。","此選項涉及的扣除項目是「房地交易所得稅」，但土地增值稅重購退稅的比較基準應是「原出售土地地價」（扣除土地增值稅後的餘額），與房地交易所得稅無關，混淆了兩種不同稅目的退稅規則。","土地稅法規定，自耕之農業用地出售後，於「2年內」另行購買仍供自耕之農業用地者，得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額。這是農地重購退稅的特殊規定，2年是法定的重購期限。","重購退稅的要件之一是出售前「無」供營業使用或出租（符合自用住宅或自耕農地的要件），本選項說「曾供營業使用或出租」恰好與要件相反，不符合退稅條件。"],"110-23":["現行2.0：45%的級距是持有2年以內，不是3年以內。","現行2.0：35%的級距是逾2年未逾5年，不是逾3年未逾5年。","逾5年未逾10年稅率為20%，沒有30%這一級。","所得稅法§14-4Ⅲ：持有逾10年稅率15%。其餘為2年內45%、逾2年未逾5年35%、逾5年未逾10年20%。"],"110-24":["出售後2年內重購自住房屋、土地，是退稅基本要件，本項正確。","所得稅法§14-8：退稅申請期限是重購移轉登記次日起5年內，不是2年；2年是重購期限。","按重購價額占出售價額的比率，自所繳稅額計算退還，本項正確。","重購後5年內改作其他用途或再行移轉，應追繳原退還稅額，本項正確。"],"110-25":["24萬是以公告現值800萬×3%誤算；應以成交價額計算。","房地合一申報作業要點第15點：未提示費用證明者，得按成交價額3%計算。900萬×3%＝27萬元。","30萬是費用認定上限；本題900萬×3%＝27萬，未達上限。","45萬是900萬×5%，法定比率是3%。"],"112-23":["現行2.0：持有2年以內稅率一律為45%，不是35%。","逾2年未逾5年稅率為35%，不是25%。","所得稅法§14-4Ⅲ：因調職、非自願離職等非自願因素，持有5年以下者，稅率20%。","個人以自有土地與營利事業合作興建房屋，5年內完成並銷售者稅率為20%，不是25%。"],"113-25":["10%不是合作興建房屋的優惠稅率。","15%是持有逾10年的稅率，不是合作興建房屋的優惠稅率。","所得稅法§14-4Ⅲ：個人以自有土地與營利事業合作興建房屋，自土地取得日起5年內完成並銷售者，稅率20%。","25%不是法定稅率，正確為20%。"],"101-3":["此為土地法第34條之1規定的優先購買權，確實有適用，不是「無優先購買權」的情形。","此為耕地三七五減租條例第15條規定（或土地法第107條）的優先承買權，確實有適用，不是「無優先購買權」的情形。","此為土地法第104條規定的優先購買權，確實有適用，不是「無優先購買權」的情形。","土地法§104Ⅰ：基地出賣時，地上權人、典權人或承租人有優先購買權；「房屋出賣時」享有優先購買權的是「基地所有權人」，不是房屋承租人。房屋承租人對承租房屋本身被出賣，土地法並無優先購買權規定，故本項為答案（同診斷卷第7題）。"],"101-5":["此為土地法（或耕地三七五減租條例）規定不定期限耕地租約得終止之事由之一，屬之。","承租人擅自轉租耕地，是法定終止租約的事由之一，屬之。","官方答案未取本項。注意：「非因不可抗力繼續一年不為耕作」是三七五§17Ⅰ④的終止事由；土地法§114七款並無此款，嚴格依題幹「依土地法」本項亦不包含，屬題目瑕疵，作答以官方答案D為準。","本題問「不包含」的情形。土地法§114⑦（三七五§17Ⅰ③同）：地租積欠達「兩年」之總額時，出租人才得終止租約（不是一年）。本選項說「達一年之總額」，與正確的「兩年」門檻不符，故「不包含」在法定終止事由內（門檻未達）。注意：此處的「兩年」與一般土地法第103條基地租約收回（積欠租金達2年總額）的標準一致，但與房屋租賃（積欠2個月以上）不同，務必區分清楚。"],"104-5":["土地法§34-1他共有人優先購買權屬債權效力：未通知而出賣，不得請求塗銷登記，亦不得依給付不能請求出賣人賠償（最高法院109年度台上大字第2169號裁定；構成侵權行為者得依侵權行為請求）。","官方答案正確：§104Ⅱ明定違反通知義務之契約「不得對抗優先購買權人」，屬物權效力（相對物權效力），不是債權效力。舊筆記「亦屬債權效力、題目可疑」有誤。","官方答案正確：§107準用§104，耕地承租人優先承買權同屬物權效力（相對物權效力），不是債權效力。舊筆記「題目可疑」有誤。","耕地三七五減租條例§15的優先承買權具物權效力（§15Ⅲ契約不得對抗承租人；本題可認為承租人得進而請求塗銷登記），與本題債權效力相反。"],"104-29":["出租機關只是出租行為的執行單位，不是補償耕地承租人費用的負擔主體。","原管理機關在撥用後已不再管理該土地，不是補償費用的負擔主體。","平均地權條例規定，公有出租耕地經依法辦理無償撥用時，其應補償耕地承租人之費用，應由「需地機關」（取得並使用該土地的機關）負擔。誰使用土地、誰受益，誰就負擔補償承租人權益受損的費用，符合「使用者付費」的精神。","原主管機關（地政機關等）不是補償費用的負擔主體，負擔主體是實際取得使用權的需地機關。"],"104-30":["本選項為錯誤敘述：正確的程序順序應是「先由鄉鎮市區公所耕地租佃委員會『調解』，調解不成才由直轄市或縣市政府耕地租佃委員會『調處』」（即基層先「調解」、上級才「調處」），本選項把「調解」和「調處」的順序及機關層級互換了，描述錯誤。","本選項描述正確，租佃爭議須先經調解調處程序才能起訴（訴訟先行程序），非錯誤。","本選項描述正確，租佃訴訟免收裁判費以減輕承租人訴訟負擔，非錯誤。","本選項描述正確，調解調處成立有強制執行力，非錯誤。"],"105-22":["耕地承租人先買權依三七五減租條例§15，不是土地法；且甲已知悉條件並拒買，主張無理由。","民法沒有耕地承租人書面通知先買權之規定；甲已知悉並拒買，主張無理由。","縱乙未書面通知（§15），甲已實際知悉條件仍拒買，漲價後才主張，違反誠信，仍無理由。","乙雖未書面通知，但已口頭通知且甲明知條件，並明示不購買。甲事後漲價才主張先買權，違反誠信，屬權利失效，無理由。"],"105-31":["耕地租期不得少於6年（三七五§5），約定7年合於規定；本題可認為，租約未以書面訂立，不當然使約定期限失效而變成不定期租約。","「租期屆滿仍為使用收益、出租人不即表示反對→視為不定期限繼續契約」是民法§451的規定；三七五§20是：租約屆滿時，除出租人依法收回自耕外，承租人願繼續承租者「應續訂租約」，不是以出租人是否反對判斷。","375減租§15優先承買權有物權效力，出租人有通知義務，違反者契約不得對抗承租人（§15Ⅲ；本題可
